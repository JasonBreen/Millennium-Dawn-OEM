 EMPLOYMENT_CHANGE_HEALTH_TT: "§YHealthcare§!"
 EMPLOYMENT_CHANGE_HEALTH_TT_DELAYED: "Priority: §Y[?ROOT.healthcare_priority|0]§! of 10\nStaffing: §Y[?ROOT.healthcare_manpower_fulfillment|%0]§!\nWorkers: §Y[?ROOT.workers_in_healthcare|2]m§! / §Y[?ROOT.max_workers_in_healthcare|2]m§!\nShare of workforce: §Y[?ROOT.healthcare_workforce_share|%1]§! / §Y[?ROOT.healthcare_workforce_max_share|%1]§!\nGDP: $§Y[?ROOT.healthcare_gdp_current|1]§!b / $§Y[?ROOT.healthcare_gdp_max|1]§!b\nStaffing also scales the corporate tax income from healthcare. It never falls below 10%."
 EMPLOYMENT_CHANGE_BUREAU_TT: "§YGovernment Administration§!"
 EMPLOYMENT_CHANGE_BUREAU_TT_DELAYED: "Priority: §Y[?ROOT.bureaucracy_priority|0]§! of 10\nStaffing: §Y[?ROOT.bureaucracy_manpower_fulfillment|%0]§!\nWorkers: §Y[?ROOT.workers_in_bureaucracy|2]m§! / §Y[?ROOT.max_workers_in_bureaucracy|2]m§!\nShare of workforce: §Y[?ROOT.bureaucracy_workforce_share|%1]§! / §Y[?ROOT.bureaucracy_workforce_max_share|%1]§!\nWage bill: $§Y[?ROOT.bureaucracy_wages_current|3]§!b / $§Y[?ROOT.bureaucracy_wages_max|3]§!b\nStaffing sets the civil service wage bill and counts toward Workforce Fulfillment. It never falls below 10%."

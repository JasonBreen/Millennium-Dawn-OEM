l_korean:
 venezuela_focus: "베네수엘라 중점 계통도"
 VEN_reap_the_fruits: "결실을 거두다"
 VEN_reap_the_fruits_desc: "남아메리카의 심장부에서 베네수엘라는 새로운 시대의 문턱에 서 있습니다. 석유가 풍부한 이 나라는 오랫동안 불꽃에 이끌리는 나방처럼 방대한 에너지 매장량에 이끌린 강대국들의 탐나는 먹잇감이었습니다. 그러나 이제 베네수엘라가 스스로의 운명을 개척하고, 천연 자원이 주는 결실을 거두어 지역 강국으로 부상할 때입니다."
 VEN_our_president: "차베즈 대통령"
 VEN_our_president_desc: "Hugo Chávez gained power after his release from prison in 1994, for his attempted coup. The economic situation was deteriorating, and his proposed reforms won him many supporters in the lower and middle classes. With this support, this would-be usurper legally gained the Presidency, beating the established AD and COPEI parties. This black horse now has the chance to reshape Venezuela forever..."
 VEN_Education_and_scientific_reforms: "교육 및 과학 개혁"
 VEN_Education_and_scientific_reforms_desc: "우리는 이 나라의 교육 체계를 개혁할 것입니다!"
 VEN_technology_advancements: "기술 발전"
 VEN_technology_advancements_desc: "We have been behind on technology compared to the other countries on our continent! Its the time that we catch up to them!"
 VEN_modern_education: "현대 교육"
 VEN_modern_education_desc: "Our education system has remained in the past for a while and thats a huge issue! We shall modernize our education!"
 VEN_increase_school_funding: "학교 재정 확대"
 VEN_increase_school_funding_desc: "학부모들이 교육비를 부담해서는 안 됩니다!"
 VEN_balance_teachers_wages: "교사 임금 조정"
 VEN_securing_the_workforce: "노동력 확보"
 VEN_securing_the_workforce_desc: "우리나라는 고용률을 개선해야 합니다! 어떻게 개선할까요? 공장에 사람을 투입하는 것입니다!"
 VEN_technology_exchange: "기술 교류"
 VEN_technology_exchange_desc: "우리는 대륙의 다른 나라들에 비해 기술이 뒤처져 왔습니다! 이제 그들을 따라잡을 때입니다!"
 VEN_undo_the_brain_drain: "두뇌 유출 해소"
 VEN_undo_the_brain_drain_desc: "국민에게 충분한 기회를 제공함으로써 이민을 억제하고 우리 투자의 수익을 온전히 실현할 수 있습니다."
 VEN_state_companies_economy: "국영 기업 중시"
 VEN_state_companies_economy_desc: "PDVSA, our state-ran oil company, proves that state companies can be successful. We shall nationalize what industries we can, and from there we will manage them ourselves. This way we can ensure the wealth of our country stays on it."
 VEN_let_external_investors_run_freely: "외국인 투자자 장려"
 VEN_let_external_investors_run_freely_desc: "막대한 석유 매장량에도 불구하고 베네수엘라는 여전히 가난합니다. 부유한 외국인들이 우리나라에 투자하도록 장려해야 하며, 그래야만 그 혜택을 온전히 누릴 수 있습니다."
 VEN_collective_industries: "집단 산업"
 VEN_collective_industries_desc: "자본주의가 노동자를 억압하려 하는 반면, 우리나라는 산업의 집단화에 집중하여 노동자들이 마땅한 권력을 얻도록 할 것입니다."
 VEN_efficient_industries: "효율적 산업"
 VEN_efficient_industries_desc: "우리는 이념적으로 자본주의에 반대할지 모르지만, 마르크스조차 자본주의의 효율성은 인정했습니다. 경제 성장을 위해 우리는 당분간 이를 용인하고 경제를 확장하는 데 활용할 것입니다. 이윤 동기와 강력한 기업 권력이 지배하는 시대입니다. 지금은 그렇습니다."
 VEN_promote_propaganda_press: "새로운 선전 언론"
 VEN_promote_propaganda_press_desc: "베네수엘라 정부는 오랫동안 국영 TV 채널인 VTV, 곧 국민이 \\"8번 채널\\"이라 부르는 방송을 운영해 왔습니다. 우리는 이를 이용해 정부 선전을 퍼뜨리고 사람들을 우리 편으로 끌어들이며, 경쟁을 제한하여 모든 베네수엘라인의 주된 뉴스 출처가 되도록 할 것입니다."
 VEN_promote_free_press: "새로운 자유 언론"
 VEN_promote_free_press_desc: "사회주의든 아니든 자유 공화국에는 언론의 자유가 있어야 합니다. 이러한 이유로 우리는 적을 포함한 모든 이가 자유롭게 말할 수 있도록 허용할 것입니다. 이는 자본주의 세계가 우리나라에서 자신들의 사상을 선보이기 쉽게 만들겠지만, 옳은 일입니다."
 VEN_indoctrinated_army: "사상 교육된 군대 채택"
 VEN_indoctrinated_army_desc: "우리 군대는 무엇보다 정부를 섬기고 보호하기 위해 존재합니다. 군 복무에서 모든 반동분자를 제거하고, 오직 정부에 충성하는 병사들만 군에 복무하도록 할 것입니다. 기량이 부족한 병사를 상대해야 한다면 그렇게 하겠습니다."
 VEN_professional_army: "전문 직업군 채택"
 VEN_professional_army_desc: "우리 군대는 공화국과 그 국민을 지키기 위해 존재합니다. 최고 중의 최고만이 베네수엘라를 위해 무기를 들도록, 이념은 조국의 수호자들과 분리되어야 합니다."
 VEN_rise_of_the_fifth_republic_movement: "제5공화국 운동의 부상"
 VEN_rise_of_the_fifth_republic_movement_desc: "제5공화국 운동은 베네수엘라의 미래입니다. 나라를 위해 이들은 권력을 중앙집권화하고 영향력을 확대할 수 있어야 합니다."
 VEN_increase_presidential_powers: "대통령 권한 강화"
 VEN_increase_presidential_powers_desc: "Venezuela's politics is full of disfunction. We need a better approach to bypass the factionalism and gridlock in our democratic process. We will empower the President of the Republic to make decrees for the good of the nation."
 VEN_agrarian_reform: "미시온 사모라"
 VEN_agrarian_reform_desc: "Venezuela's oil boom caused its agricultural section to be all but abandoned. To fix this, we shall create the \"Misión Zamora\", which will empower the government to redistribute land to the poor across the country. This will stimulate the agricultural sector, redistribute wealth to the less fortunate, and even weaken the power of the wealthy in the opposition. What is there not to like?"
 VEN_pdvsa: "PDVSA 강화"
 VEN_pdvsa_desc: "PDVSA는 베네수엘라 경제의 근간입니다. 이들이 반볼리바르 진영에 서지 않도록 우리는 충성파로 인력을 채울 것입니다. 붉은 베네수엘라를 위한 붉은 PDVSA!"
 VEN_bolivarianism: "볼리바르주의"
 VEN_bolivarianism_desc: "현대 볼리바르주의는 베네수엘라에서 만들어졌으며, 많은 차베스 지지자, 곧 \\"차비스타\\"가 옹호합니다. 이는 보편적 공교육 제도, 반제국주의, 기술 발전, 그리고 공산주의 아래 라틴아메리카 국가들의 통일을 옹호합니다."
 VEN_friendly_cabinet: "내각에 측근 배치"
 VEN_friendly_cabinet_desc: "기성 정당들은 볼리바르 혁명을 막기 위해 할 수 있는 모든 것을 할 것입니다. 우리의 정치적 지속성을 보장하기 위해, 내각과 모든 임명직을 우리가 찾을 수 있는 가장 충성스러운 차비스타로 채울 것입니다. 혁명을 위해 우리가 침투당하거나 전복되어서는 안 됩니다!"
 VEN_oil_industry_development_1: "석유 산업 개발 I"
 VEN_oil_industry_development_1_desc: "우리의 석유 매장량은 세계 최대입니다. 이를 활용하지 않는 것은 어리석은 일입니다. 우리는 가능한 모든 자원을 투입하여 국내 석유 사업을 확장할 것입니다. 카라카스가 언젠가 서반구의 두바이가 되기를!"
 VEN_deals_with_china: "중국과의 거래"
 VEN_deals_with_china_desc: "중화인민공화국은 미국의 강력한 대안이며 명목상 사회주의 국가입니다. 그들과의 유대를 확대하고 상호 이익이 되는 무역을 장려합시다!"
 VEN_oil_industry_development_2: "석유 산업 개발 II"
 VEN_oil_industry_development_2_desc: "석유는 흘러야 합니다. 더 깊이 파고 최신 기술로 석유 생산을 늘릴 수 있으며, 단 한 방울도 낭비되지 않도록 해야 합니다."
 VEN_enlist_oil_plant_workers: "석유 시설 노동자 징집"
 VEN_enlist_oil_plant_workers_desc: "우리는 모든 석유 노동자가 최소한 예비대로라도 군대에 입대하도록 요구할 것입니다. 이는 그들의 경력에 대해 상당한 영향력을 확보하게 해 주며 새로운 신병을 충분히 공급해 줄 것입니다. 물론 그들이 최고의 군인이 되지는 못할 수 있으며, 국민들이 이 발상을 달가워하지 않을 수도 있습니다."
 VEN_oil_industry_development_3: "석유 산업 개발 III"
 VEN_oil_industry_development_3_desc: "더, 언제나 더. 우리는 더 팔 수 있고, 더 팔 것입니다. 더 많이 팔수록 우리 국민은 더 부유해질 것이며, 사회주의자로서 우리는 국민을 위해 존재합니다. 혁명의 이름으로 우리는 파고 또 팔 것입니다!"
 VEN_deals_with_russia: "러시아와의 거래"
 VEN_deals_with_russia_desc: "소련은 사라졌을지 모르나, 러시아 정부는 현 세계 질서에 맞서 당당히 버티고 있습니다. 우리는 함께 새로운 세계를 만들 수 있습니다. 비록 그들이 더 이상 사회주의 국가가 아닐지라도, 우리가 그리는 사회주의 남아메리카가 워싱턴의 경쟁자들에게 눈엣가시가 되리라는 점은 부인하지 못할 것입니다."
 VEN_alo_presidente: "알로 프레시덴테 제작"
 VEN_alo_presidente_desc: "우리는 언론의 간섭 없이 베네수엘라 국민과 소통할 방법이 필요합니다. 이를 위해 국영 방송 채널 8을 이용하여 대통령이 계획을 설명하고 정부 장관들과 공개적으로 대화하는 대통령 TV 쇼 알로 프레시덴테를 제작할 것입니다. 물론 이것은 공식 선전 매체이기도 합니다."
 VEN_construct_the_communes: "코뮌 건설"
 VEN_construct_the_communes_desc: "To encourage socialism, we will create communes across the country, and empower them to have control over local development. This will let Bolivarians to control local government, and will also help our country grow."
 VEN_press_censorship: "언론 검열"
 VEN_press_censorship_desc: "이제 정부를 장악했으니, 우리를 그토록 괴롭혀 온 부르주아 언론을 제거할 수 있습니다. 통신 위원회인 CONATEL을 통해 그들의 면허를 박탈함으로써 합법적으로 전파에서 몰아낼 수 있습니다."
 VEN_telesur: "텔레수르 설립"
 VEN_telesur_desc: "우리의 영향력을 확대하고 해외에서 볼리바르 혁명을 강화하기 위해, 쿠바 및 니카라과와 함께 텔레수르를 설립할 것입니다. 이것은 CNN에 대한 라틴 사회주의의 해답이 될 것입니다. \\"양키\\"와 그들의 부르주아적 가치관은 더 이상 우리 국민에게 거짓을 주입하지 못할 것입니다."
 VEN_work_on_gran_colombia_unification: "그란 콜롬비아 통합 추진"
 VEN_work_on_gran_colombia_unification_desc: "우리는 시몬 볼리바르의 후계자이며, 그에게는 한 가지 꿈이 있었습니다. 베네수엘라, 오늘날의 콜롬비아, 에콰도르, 파나마로 이루어진 통일된 콜롬비아입니다. 그가 꿈꾸었듯이 우리도 꿈꿉니다."
 VEN_military_union: "무력을 통한 통합"
 VEN_military_union_desc: "볼리바르는 외교적 수완이 아니라 군사적 역량으로 유명했습니다. 우리는 볼리바르의 땅에 서 있는 부패한 정부들을 전복하고 그들에게 혁명을 가져다줄 것입니다. 볼리바르가 바랐을 그대로 말입니다."
 VEN_diplomatic_union: "외교를 통한 통합"
 VEN_diplomatic_union_desc: "정복자로서 참여한다면 볼리바르 연합이 오래 지속되리라 기대할 수 없습니다. 우리는 콜롬비아, 에콰도르, 파나마와 대화의 문을 열고 합의에 이르기를 바라야 합니다."
 VEN_bolivarian_revolutions: "볼리바르 혁명"
 VEN_bolivarian_revolutions_desc: "볼리바르 혁명이 베네수엘라에만 국한되어서는 안 됩니다. 우리는 이웃 국가들과 남아메리카의 다른 주요 국가들의 사회주의 운동을 지원할 것입니다. 우리가 함께 사슬을 끊고 하나가 되어 새로운 볼리바르 세계로 나아가기를."
 VEN_gran_colombia_alliance: "그란 콜롬비아 동맹"
 VEN_gran_colombia_alliance_desc: "Our long divergent history will never allow us to become one country so easily, but we can start somewhere. Let us create the Gran Colombian Alliance, wherein all member states shall support each other. It may not be a full Union, but its the beginning of something beautiful."
 VEN_expand_the_alliance: "동맹 확대"
 VEN_expand_the_alliance_desc: "콜롬비아가 우리 동맹에 동의했으니, 이를 다자 동맹으로 바꿔야 합니다. 에콰도르와 파나마도 가입하도록 초청합시다. 이 연합이 우리를 새로운 볼리바르의 미래로 이끌기를!"
 VEN_go_after_colombia: "콜롬비아 공략"
 VEN_go_after_colombia_desc: "콜롬비아의 존재는 아메리카의 해방자에 대한 기억을 모욕하는 것입니다. 베네수엘라와 콜롬비아는 하나여야 하며, 볼리바르의 조국은 그가 구상한 볼리바르 그란 콜롬비아의 모든 영토를 포함하도록 확장될 것입니다."
 VEN_go_after_ecuador_and_panama: "에콰도르와 파나마 공략"
 VEN_go_after_ecuador_and_panama_desc: "콜롬비아를 확보했으니 이제 마무리 작업을 해야 합니다. 우리는 이제 총구를 에콰도르와 파나마로 돌려 통합을 완성하고 시몬 볼리바르의 꿈을 매듭지을 것입니다."
 VEN_welfare_state: "복지 국가"
 VEN_welfare_state_desc: "자본주의는 우리 중 가장 취약한 노동 계급을 착취합니다. 우리는 그들을 도와야 하며, 이를 위해 현대적인 복지 국가를 건설할 것입니다. 교육, 의료, 경제적 지원 등 우리가 제공할 수 있는 모든 것을 제공할 것입니다."
 VEN_mission_robinson: "로빈슨 미션"
 VEN_mission_robinson_desc: "An educated people is a prosperous people. We must fight the scourge of illiteracy in our country, and the \"Misión Robinson\" will do just that. Volunteers, and our armed forces, will reach those whose our education system has failed, and will teach them to read and write."
 VEN_mission_ribas: "리바스 미션"
 VEN_mission_ribas_desc: "교육 사업을 더욱 확대하기 위해, 새로운 \\"리바스 미션\\" 아래 수많은 고등학교 중퇴자들이 보충 수업을 받도록 허용할 것입니다. 이는 국민의 지성을 넓혀 줄 것입니다. 그리고 재교육을 받은 이들이 우리를 더욱 지지하게 될지도 모릅니다."
 VEN_expand_diplomacy_in_the_americas: "아메리카 대륙 외교 확대"
 VEN_expand_diplomacy_in_the_americas_desc: "시몬 볼리바르와 그란 콜롬비아는 한때 아메리카 대륙 모든 사건의 중심이었습니다. 새로운 베네수엘라도 달라서는 안 됩니다. 우리는 이웃 국가들과의 유대를 확대하고 그들의 나라에서도 우리의 혁명 이념을 전파할 것입니다."
 VEN_cuban_friendship: "쿠바와의 우정"
 VEN_cuban_friendship_desc: "쿠바는 우리와 가장 가까운 이념적 동맹입니다. 카스트로는 언제나 미 제국주의에 맞섰고, 그의 정권은 강대한 소련보다도 오래 살아남았습니다. 우리는 그들과 보조를 맞추고 두 나라 사이의 우정을 증진해야 합니다."
 VEN_brazilian_and_argentine_friendship: "브라질 및 아르헨티나와의 우정"
 VEN_brazilian_and_argentine_friendship_desc: "브라질과 아르헨티나는 지리적으로 우리 대륙의 거인들입니다. 아르헨티나에서는 페론주의가 이미 널리 퍼져 있고 브라질의 사회주의자들도 계속 늘고 있습니다. 우정을 통해 그들에게 볼리바르주의의 빛을 보여 줍시다."
 VEN_american_socialist_alliance: "볼리바르 인터내셔널"
 VEN_american_socialist_alliance_desc: "쿠바. 아르헨티나. 브라질. 베네수엘라. 모두 사회주의의 빛이 인도하는 나라들입니다. 혁명이 우리를 새로운 높이로 이끌기를. 그러나 빛으로 가든 어둠으로 가든 우리는 모두 함께 갈 것입니다."
 VEN_american_deals: "미국과의 거래"
 VEN_american_deals_desc: "미국은 오랫동안 사회주의의 적이었습니다. 그러나 그들은 지구상에서 가장 부유한 사회를 갖추고 있습니다. 우리가 성장하려면 그들의 자금이 필요할지도 모릅니다. 다행히 우리에게는 그들이 필요로 하는 석유가 있습니다. 아마 타협점을 찾을 수 있을 것입니다."
 VEN_american_investments: "석유를 위한 투자"
 VEN_american_investments_desc: "미국은 우리의 발전을 도와줄 의향이 충분합니다. 우리가 석유를 계속 공급하는 한, 그들은 기꺼이 우리의 추가 성장을 도울 것입니다."
 VEN_european_investments: "유럽의 투자"
 VEN_european_investments_desc: "유럽 국가들은 우리 경제에 투자하기를 원하며, 이는 우리를 새로운 높이로 이끌고 석유 수출을 위한 새로운 시장을 열어 줄 것입니다."
 VEN_asian_allies_investments: "아시아의 투자"
 VEN_asian_allies_investments_desc: "While the Middle Eastern, and the Chinese part of Asia has vast oil fields - we must propose deals with some of them to expand our markets one way or another."
 VEN_economic_cooperation_council: "경제 협력 위원회"
 VEN_economic_cooperation_council_desc: "유럽 연합과의 경제 위원회는 무역 협정을 통해 우리나라의 부를 늘리는 데 큰 도약이 될 것입니다."
 VEN_oil_independency_for_nato: "나토를 위한 석유 독립"
 VEN_oil_independency_for_nato_desc: "나토는 전 세계에서 가장 큰 군대를 보유하고 있으며, 그 거대한 군대를 유지하려면 막대한 석유가 필요합니다. 그들은 귀중한 검은 황금의 대가를 지불할 것이며, 그 대가로 우리 경제를 뒷받침해 줄 것입니다."
 VEN_follow_guevara_example: "게바라의 본보기를 따르다"
 VEN_follow_guevara_example_desc: "게바라는 제국주의가 언제나 혁명에 대한 가장 큰 위협임을 이해했습니다. 세계 혁명을 통해 제국주의 열강을 근절할 수 있다면, 우리는 진정으로 자유로운 사회를 확보하게 될 것입니다."
 VEN_communist_militias: "공산주의 민병대"
 VEN_communist_militias_desc: "One of the many necessities of our government its a system of Communist Militias to help maintain control over our lands without stretching our Armed Forces personnel too thin."
 VEN_arm_the_proletariat: "프롤레타리아 무장"
 VEN_arm_the_proletariat_desc: "노동자들은 무장하고 조직되어야 합니다. 모든 프롤레타리아는 무기로 쓸 수 있는 것이면 무엇으로든 즉시 무장해야 합니다. 어떠한 구실로도 무기와 탄약을 내놓아서는 안 되며, 노동자를 무장 해제하려는 모든 시도는 필요하다면 무력으로라도 저지해야 합니다."
 VEN_the_military_communes: "군사 코뮌"
 VEN_the_military_communes_desc: "군사 코뮌은 나라의 안정을 보장하기 위해 제자리를 잡아야 합니다. 또한 이를 군사 단지를 개선하고 무기 생산을 늘리는 수단으로도 활용할 수 있습니다."
 VEN_the_motto_of_self_sacrifice: "자기희생의 좌우명"
 VEN_the_motto_of_self_sacrifice_desc: "충성과 헌신은 용기로 이어집니다. 가치 있는 모든 것에는 대가를 치러야 하며, 그 대가는 언제나 노동, 인내, 사랑, 그리고 자기희생입니다. "
 VEN_equality_in_the_eyes_of_state: "국가 앞의 평등"
 VEN_equality_in_the_eyes_of_state_desc: "우리는 모든 이가 우리 눈에 평등함을 보장해야 하며, 국민 사이의 불평등은 용납되지 않습니다."
 VEN_proletarian_internationalism: "프롤레타리아 국제주의"
 VEN_proletarian_internationalism_desc: "프롤레타리아 국제주의는 국제 사회주의라고도 불리며, 모든 프롤레타리아 혁명을 개별적인 지역 사건이 아니라 하나의 세계적인 계급 투쟁의 일부로 인식하는 것입니다."
 VEN_the_propaganda: "정치 전쟁 기계"
 VEN_the_propaganda_desc: "The political war machine can affect our country in many ways. By making sure our people all thinks alike in the case of a war, we may perhaps be able to persuade them to appeal to them."
 VEN_red_rising: "붉은 부상"
 VEN_red_rising_desc: "The communists has been rising in our country for a long time, we must ensure they get appropriate support for their revolution, and perhaps expand these ideals to other countries with a similar situation."
 VEN_setting_the_stage: "무대 마련"
 VEN_setting_the_stage_desc: "The Modern Day is a complicated one, however we must ensure that we hold a position in the global stage, the best way to accomplish that, its by being involved one way or another in international conflicts."
 VEN_assist_our_brothers: "형제들을 돕다"
 VEN_assist_our_brothers_desc: "The Revolutionary Cubans are our brother in arms, and we must ensure that we provide them with the required help for the greater good of both our countries."
 VEN_the_quito_revolution: "키토 혁명"
 VEN_the_quito_revolution_desc: "에콰도르는 늘 우리나라와 우리의 이념에 정치적으로 부정적이었습니다. 이제 그들을 굴복시킬 때입니다. 우리에게 반대하는 것은 곧 혁명에 반대하는 것이기 때문입니다."
 VEN_the_eastern_revolutions: "동부 혁명"
 VEN_the_eastern_revolutions_desc: "가이아나와 수리남은 유럽인들에게 무시당하던 식민지였습니다. 이제 그렇게 두지 않을 것입니다. 그들의 이익을 위해서, 그리고 우리의 이익을 위해서 우리의 영향력이 그 나라들에 미치도록 할 것입니다."
 VEN_the_world_revolution: "세계가 붉게 물들 것이다"
 VEN_the_world_revolution_desc: "공산주의는 우리나라가 몇 번이고 잿더미에서 일어서게 한 원동력이었습니다. 전 세계 사람들도 이 메시지에 호응해야 합니다. 그들도 우리와 다를 바 없으며, 우리는 모두 어떤 식으로든 붉은 사람들이기 때문입니다."
 VEN_the_lima_insurrection: "리마 봉기"
 VEN_the_lima_insurrection_desc: "Our brothers in arm on the other side of the border have been contradicting their government and their ideals, its time we provide them the support to rise over their overlords."
 VEN_our_cult: "우리의 신조"
 VEN_our_cult_desc: "우리는 우리의 정치와 내부 운영을 하나의 신념 체계로 보아야 하며, 국민이 우리의 공산주의 이념을 의심하도록 허용해서는 안 됩니다. 의심이 있다면 대의에 대한 헌신도 없기 때문입니다."
 VEN_reclaim_the_home_of_bolivar: "볼리바르의 고향을 되찾다"
 VEN_reclaim_the_home_of_bolivar_desc: "우리의 해방자가 조국의 미래를 보았을 때, 그는 콜롬비아와 베네수엘라가 함께하는 모습을 보았습니다. 두 나라 사이의 개인주의가 우리를 갈라놓았지만 정신적으로 우리는 여전히 하나입니다. 전쟁을 의미하더라도, 우리는 즉시 공격하여 형제들과 재결합해야 합니다."
 VEN_venezuelan_dawn: "베네수엘라의 새벽"
 VEN_venezuelan_dawn_desc: "우리는 강력하고 통일된 그란 콜롬비아로서, 그리고 그 너머로 세계에서의 입지를 확보했습니다. 이제 자부심을 가지고 수평선 너머 미래를 바라보아야 합니다. 우리는 앞선 이들의 노고가 헛되지 않도록 해야 하며, 통일된 나라의 모든 국민이 함께 깃발을 흔드는 것을 자랑스러워하게 만들 것입니다."
 VEN_the_santiago_assault: "산티아고 공세"
 VEN_the_santiago_assault_desc: "Securing the continent means waging war against our actual neighbours, one of them is Chile, a country which stretches along the Pacific, we cannot allow to let ourselves be exposed in such way, we must capture Santiago to secure our coastlines."
 VEN_brasilia_will_burn: "브라질리아는 불타리라"
 VEN_brasilia_will_burn_desc: "브라질은 우리를 제외하면 남아메리카에서 가장 큰 나라입니다. 우리가 가장 큰 나라가 되려면 그들은 무너져야 합니다. 분쟁만이 유일한 선택이며, 이를 위해 브라질리아까지 진군할 것입니다. 우리가 도착하는 순간 그들은 무너질 것입니다."
 VEN_strike_the_heart: "심장을 타격하라"
 VEN_strike_the_heart_desc: "우리는 많은 나라와 도시를 정복했지만, 볼리비아는 여전히 대륙 한가운데에 버티고 있습니다. 대륙의 심장을 타격해야 그곳에서 자유롭게 작전할 수 있습니다."
 VEN_follow_lenin_example: "레닌의 본보기를 따르다"
 VEN_follow_lenin_example_desc: "최초의 성공적인 러시아 혁명의 영웅 블라디미르 레닌이 우리의 길잡이가 되어야 합니다. 진정으로 자유롭고 민주적인 미래가 우리의 목표이며, 마르크스주의가 그곳에 이르는 길입니다."
 VEN_settle_the_republic: "공화국 안정화"
 VEN_settle_the_republic_desc: "공산주의를 온전히 받아들이는 유일한 방법은 정부가 안정되고 단결하는 것입니다. 우리의 이념과 정부를 안착시키는 것은 결국 남아메리카 전체를 통일하는 데 큰 걸음이 될 것입니다."
 VEN_separation_of_church_and_state: "정교 분리"
 VEN_separation_of_church_and_state_desc: "교회는 우리의 이념이나 나라의 미래에 대한 비전에 결코 동의한 적이 없습니다. 그들이 우리를 도울 의사가 없다면, 우리나라에서 아무런 권력도 갖지 못하도록 해야 합니다."
 VEN_the_new_economic_model: "새로운 경제 모델"
 VEN_the_new_economic_model_desc: "If we want to ensure the prosperity of our country we must introduce a new economical system, one that can finally bring us economical stability after all this years."
 VEN_socialism_with_venezuelan_characteristics: "베네수엘라식 사회주의"
 VEN_socialism_with_venezuelan_characteristics_desc: "바퀴를 두 번 발명할 필요는 없습니다. 우리의 필요에 맞게 바퀴를 개조하면 됩니다. 사회주의에도 같은 논리가 적용되어야 하며, 우리나라에 맞는 완벽한 사회주의를 만들어야 합니다."
 VEN_denounce_south_american_capitalism: "남아메리카 자본주의 규탄"
 VEN_denounce_south_american_capitalism_desc: "남아메리카의 자본주의를 규탄하는 것은 자본주의가 우리 나라들의 진정한 길이 아님을 남아메리카 동포들에게 납득시키는 첫걸음입니다."
 VEN_the_good_of_the_americas: "아메리카의 이익"
 VEN_the_good_of_the_americas_desc: "아메리카 대륙은 군수 산업에서 유럽을 따라잡아야 합니다! 총은 많을수록 좋습니다!"
 VEN_secure_the_basics: "기본 확보"
 VEN_secure_the_basics_desc: "우리 국민은 더 나은 의료를 누릴 자격이 있습니다. 그래서 지출을 늘려 전국적으로 크게 개선된 의료 서비스를 확보하는 계획을 마련했습니다."
 VEN_the_agrarian_communes: "농업 코뮌"
 VEN_the_agrarian_communes_desc: "농민은 우리나라의 근간이며 우리에게 필요한 식량과 직물을 공급합니다. 농장을 장려하고 지원하기 위해 정부 내 농민의 대표성을 높이는 동시에, 우리 체제에서 과두 세력의 권력을 제거할 것입니다."
 VEN_economic_restructuring: "경제 구조 조정"
 VEN_economic_restructuring_desc: "Our new economic model its working, however further improvements and adaptations must be done, if we can restructure our economy we can make sure the funds go where they are needed, and we can also detect anomalies in those movements, reducing corruption at the same time."
 VEN_secure_our_place: "우리의 입지 확보"
 VEN_secure_our_place_desc: "우리는 정부에 대한 지지를 유지하는 한편, 대륙과 세계 무대에서의 우리 입지가 확고한 토대를 갖추도록 해야 합니다."
 VEN_the_world_stage: "세계 무대"
 VEN_the_world_stage_desc: "무역 관계와 무역 경제를 바꾸는 것은 우리가 세계 무대에 자리 잡는 데 도움이 되며, 우리는 이를 활용해야 합니다."
 VEN_venezuelan_communism: "베네수엘라식 공산주의"
 VEN_venezuelan_communism_desc: "우리가 사회주의를 우리나라에 맞게 조정했듯이, 다음 논리적 단계는 공산주의를 우리의 필요에 맞게 조정하는 것입니다. 민간 부문을 확대하고 수출입을 위한 더 큰 항만을 건설할 것이며, 이는 해군에도 도움이 될 것입니다."
 VEN_support_our_people: "국민 지원"
 VEN_support_our_people_desc: "Our regime is built on the belief that people deserves the best our country can provide, this includes their wellbeing. If we do not care for our people, our people will not care for us."
 VEN_bolivarian_missions: "볼리바르 미션"
 VEN_bolivarian_missions_desc: "볼리바르 미션은 우고 차베스 행정부 아래 시행되고 니콜라스 마두로가 이어받은 서른 가지가 넘는 사회 프로그램입니다. 이 프로그램은 가장 불리한 처지의 사회 계층을 돕고 보건, 교육, 식량과 같은 필수 권리를 보장하는 데 중점을 둡니다."
 VEN_mission_mercal: "메르칼 미션"
 VEN_mission_mercal_desc: "메르칼 미션은 볼리바르 미션 중 하나입니다. 이 미션에는 국영 기업 메르카도스 데 알리멘토스(MERCAL)가 관여하며, 전국적인 매장망을 통해 보조금이 지급된 식품과 기본 생필품을 제공합니다."
 VEN_mission_habitat: "아비타트 미션"
 VEN_mission_habitat_desc: "Misión Hábitat (\"Mission Habitat\") is a Bolivarian Mission that aims to construct of thousands of new housing units for the poor. The program also seeks to develop agreeable and integrated housing zones that make available a full range of social services, from education to healthcare, which likens its vision to that of New Urbanism."
 VEN_mission_sucre: "수크레 미션"
 VEN_mission_sucre_desc: "수크레 미션은 볼리바르 미션 중 하나입니다. 이 프로그램은 200만 명의 베네수엘라 성인에게 고등(대학 및 대학원 수준) 교육을 무상으로 지속 제공합니다."
 VEN_mission_florentino: "플로렌티노 미션"
 VEN_mission_florentino_desc: "Mission Florentino is a policy organized to coordinate the populace to vote No in the Venezuelan recall referendum of 2004 to keep him in office. The organizational centers of the Mission were named Comando Maisanta, as the ideological central headquarters (election brigades) for those who wished to keep Chávez as the President of Venezuela for the remainder of his presidential term."
 VEN_mission_miranda: "미란다 미션"
 VEN_mission_miranda_desc: "Mission Miranda is a policy establishes a military reserve composed of ordinary citizens given light arms to defend the homeland in the case of an invasion. Arms purchases intended to supply the program included the acquisition of Russian rifles, this in return caused criticism from the United States and inner parties which opposed the over-stocking of weaponry."
 VEN_mission_ciencia: "과학 미션"
 VEN_mission_ciencia_desc: "과학 미션(\\"Mission Science\\")에는 40만 명에게 오픈 소스 소프트웨어를 교육하는 프로젝트와 기술 분야 대학원 연구를 위한 장학금, 그리고 여러 대학의 연구실 설립이 포함됩니다."
 VEN_mission_corazon_adentro: "코라손 아덴트로 미션"
 VEN_mission_corazon_adentro_desc: "Misión Corazón Adentro (\"Mission Heart Within\") is a cultural mission focused arround expanding and incentivizing the cultural side of our country, this was a cooperative project with Cuba to expand the awareness of both countries cultural importance."
 VEN_mission_guaicaipuro: "과이카이푸로 미션"
 VEN_mission_guaicaipuro_desc: "Misión Guaicaipuro a project initiated by the Ministry of Enviorment and Natural Resources to restore communal land titles and human rights to the indigenous people of our country, it is named after a native chief which defended the homeland with pride and honour against the invading spaniards."
 VEN_mission_zamora: "사모라 미션"
 VEN_mission_zamora_desc: "사모라 미션은 베네수엘라의 통합 토지 개혁 및 토지 재분배 프로그램으로, 우고 차베스가 제정한 49개 법령 패키지의 일부인 토지법에 의해 만들어졌습니다. 이 계획은 19세기 베네수엘라 농민 지도자 에세키엘 사모라를 기리며 명명되었습니다."
 VEN_mission_vuelta_al_campo: "농촌 복귀 미션"
 VEN_mission_vuelta_al_campo_desc: "농촌 복귀 미션(\\"Mission Back to the Farmlands\\")은 전 베네수엘라 대통령 우고 차베스가 시행한 정책 중 하나입니다. 이 미션은 빈곤하고 실업 상태인 도시 거주 베네수엘라인이 자발적으로 농촌으로 돌아가도록 장려하여 해당 지방의 발전도 함께 이루려는 것입니다."
 VEN_mission_arbol: "나무 미션"
 VEN_mission_arbol_desc: "\"Mision Arbol\" (\"Tree Mission\") from Guaraira Repano or Mount Avila looming over Venezuela's capital, Caracas. While planting dozens of trees with members of Venezuela's newly formed Conservation Committees, Chavez explained, \"If you are going to utilize a tree, you have to do it with consciousness and respect for the environment.  If you cut down a tree you need to plant 10 more.\""
 VEN_mission_vuelvan_caras: "부엘반 카라스 미션"
 VEN_mission_vuelvan_caras_desc: "부엘반 카라스는 정부가 승인한 다른 미완의 미션들을 마무리하는 것을 목표로 하는 미션이며, 나라에 진정한 변화를 가져오려면 이것이 필요합니다."
 VEN_plan_bolivar: "볼리바르 계획 2000"
 VEN_plan_bolivar_desc: "볼리바르 2000 계획은 우고 차베스 대통령이 시행한 \\"볼리바르 미션\\" 중 최초의 것이었습니다. 이 계획은 약 4만 명의 병력을 투입하여 포괄적인 빈곤 퇴치 사업을 수행하는 것을 포함합니다. 또한 이 프로그램은 군 수송 수단을 통해 수천 명의 취약 계층 시민을 저렴하게 수송할 수 있게 합니다."
 VEN_Vaccinate_The_Poor: "빈곤층 예방접종"
 VEN_Vaccinate_The_Poor_desc: "One of the Anti-Poverty inititatives implemented during the Plan Bolívar was the vaccination of the people, the initiative was aided by the Military, with the vaccines being free and distributed across the poor population equally."
 VEN_Food_For_All: "모두를 위한 식량"
 VEN_Food_For_All_desc: "Food in our country has slowly became a privilege due to the high tax rates and the unstable nature of our economy, by allocating funds from the state into providing food for those who cant afford it, we can ensure that every house can have the most basic of needs fullfilled."
 VEN_Education_For_The_Poor: "빈곤층을 위한 교육"
 VEN_Education_For_The_Poor_desc: "Our education system has suffered the consequences of neglection and abandonment, this has caused a massive Brain Rot in our population. While the solution to the issue is not simple, taking the appropriate first steps is crucial, we must ensure education for people that doesnt have the wealth or means to access it by themselves."
 VEN_land_development: "토지 개발"
 VEN_powerful_infrastructure: "강력한 인프라"
 VEN_powerful_infrastructure_desc: "베네수엘라의 인프라는 대부분 1950년대 독재자 페레스 히메네스 시대 사업의 잔재입니다. 이는 용납할 수 없습니다. 사회주의 국민이 하나가 되려면 그들을 더 가깝게 연결해야 하며, 이를 위해서는 도로, 고속도로, 철도가 필요합니다."
 VEN_democratic_socialism: "민주 사회주의의 모색"
 VEN_democratic_socialism_desc: "민주 사회주의는 언제나 하나의 꿈이었습니다. 국민 모두가 진정으로 속박에서 벗어나는 꿈입니다. 우리는 이러한 가치를 국민에게 심어 주고 우리의 목표를 이해시켜 그들의 지지를 얻을 것입니다."
 VEN_neighbour_revolutions: "이웃 나라의 혁명"
 VEN_neighbour_revolutions_desc: "우리는 혁명을 수출해야 합니다. 그렇지 않으면 결국 반동 세력에게 전복되어 파괴될 것입니다. 우리는 그들 안에 혁명의 씨앗을 뿌리고, 그것이 아름다운 정원으로 자라나는 것을 지켜볼 것입니다."
 VEN_revolutions_to_overthrow_capitalism: "자본주의를 타도할 혁명"
 VEN_revolutions_to_overthrow_capitalism_desc: "베네수엘라는 혁명의 보루가 되어야 합니다. 우리가 세계를 자본주의에서 해방시킬 주체가 될 것이므로, 볼리바르 혁명은 역사상 가장 중요한 혁명으로 기록될 것입니다! 우리 군대는 이 새로운 세계의 혁명군으로서 곧 죽음을 불사하고 싸울 준비를 갖출 것입니다!"
 VEN_central_american_revolutions: "중앙아메리카 혁명"
 VEN_central_american_revolutions_desc: "미국인들은 오랫동안 중앙아메리카의 가난한 형제들을 억압해 왔습니다. 니카라과는 옳은 길에 있을지 모르나, 우리는 그들 모두가 사슬을 벗어던지도록 도와야 합니다. 자유로운 그들의 국민이 미국인들의 바나나를 위해 다시는 죽지 않기를!"
 VEN_south_african_revolution: "남아프리카 혁명"
 VEN_south_african_revolution_desc: "남아프리카 사람들은 오랫동안 반동적이고 인종차별적인 아파르트헤이트 체제 아래서 고통받았습니다. 그들의 정당한 분노는 쉽게 혁명으로 빚어질 수 있습니다. 우리는 볼리바르의 본보기라는 빛을 그들에게 퍼뜨리고, 아프리카 전역을 휩쓰는 붉은 물결이 되기를 바라는 일을 시작할 것입니다."
 VEN_strike_at_america: "미국을 공격하라"
 VEN_strike_at_america_desc: "자본주의의 보루이자 아메리카의 억압자인 미합중국은 마침내 심판을 받게 될 것입니다. 그 심판자는 인민입니다. 우리는 볼리바르 혁명의 불길을 그들의 본토로 퍼뜨릴 것이며, 곧 워싱턴도 카라카스처럼 붉게 물들 것입니다!"
 VEN_caribbean_revolution: "카리브해 혁명"
 VEN_caribbean_revolution_desc: "쿠바인들이 보여 주었듯이 카리브해는 사회주의 혁명의 유력한 후보지입니다. 육지로 접한 이웃이 없어 방어가 더 쉽고, 섬이라서 완전히 봉쇄하기도 어렵습니다. 카리브해는 곧 붉게 물들 것입니다!"
 VEN_andes_revolution: "안데스 혁명"
 VEN_andes_revolution_desc: "혁명의 불길이 안데스 산맥 전역을 불태울 것입니다. 콜롬비아는 붉게 물들 것입니다! 마침내 게릴라들의 투쟁이 끝날 것입니다. 볼리바르는 자신의 꿈이 이루어지는 것을 보며 천국에서 우리를 위해 눈물을 흘릴 것입니다."
 VEN_influence_brazil: "브라질에 영향력 행사"
 VEN_influence_brazil_desc: "Brazilians and Venezuelans are different. Our histories are tied to different empires. We were always a Republic, while they were an Monarchy. But they are the southern behemoth. We must bring them into our fold, no matter the cost."
 VEN_quick_industrialization: "신속한 산업화"
 VEN_quick_industrialization_desc: "소련은 국민을 동원하여 지구상의 모든 반동 국가를 능가할 수 있는 경제와 전쟁 기계를 만들어 냈습니다. 우리는 그들의 본보기를 따라 국민을 동원하고 자본주의를 무릎 꿇릴 산업을 일으킬 것입니다."
 VEN_leader_cult: "지도자 숭배"
 VEN_leader_cult_desc: "우고 차베스는 베네수엘라 제5공화국이자 최초의 볼리바르 공화국을 세웠습니다. 이제 우리는 국민에게 그의 모든 업적을 보여 주어야 합니다. 그의 초상화는 모든 가정에 걸릴 것이며, 그는 사랑하는 지도자로 기억될 것입니다. 모든 사회주의 영웅이 그래야 하듯, 그가 영원히 기억되기를."
 VEN_powerful_military: "강력한 군대"
 VEN_powerful_military_desc: "소련과 사회주의는 제2차 세계 대전에서 사라질 수도 있었습니다. 그러나 붉은 군대는 전선을 지켜냈고 파시스트의 위협을 몰아냈습니다. 이제 볼리바르의 실험을 파괴하려는 반동 세력은 새로운 붉은 군대와 마주하게 될 것입니다. 바로 베네수엘라 볼리바르 국군입니다."
 VEN_focus_on_expansion: "팽창에 집중"
 VEN_focus_on_expansion_desc: "러시아 혁명에는 여러 사회주의 공화국이 포함되었습니다. 우리의 혁명을 우리 공화국에만 국한할 수는 없습니다. 우리는 무력으로 닿을 수 있는 모든 곳에 붉은 깃발을 퍼뜨려야 합니다!"
 VEN_focus_on_diplomacy: "외교에 집중"
 VEN_focus_on_diplomacy_desc: "제국주의는 사회주의 정신과 상반됩니다. 무력으로 혁명을 퍼뜨리면 그저 새로운 제국주의가 될 뿐이며 세상을 바꿀 기회를 망쳐 우리 자신이 새로운 반동 세력이 될 것입니다. 혁명적 외교야말로 진정한 길입니다. 존중이 제국을 무너뜨리기 때문입니다!"
 VEN_topple_near_capitalist_regimes: "인접 자본주의 정권 타도"
 VEN_topple_near_capitalist_regimes_desc: "자본주의는 우리 이웃들 주위에 어두운 발톱을 뻗쳤습니다. 그들은 해방되어야 합니다. 우리 혁명군이 그들을 해방할 것입니다. 이웃 나라의 자본가들은 숨을 것입니다. 우리 인민이 그들에게 정의를 가져올 것이기 때문입니다."
 VEN_communist_revolution_in_brazil: "브라질 공산주의 혁명"
 VEN_communist_revolution_in_brazil_desc: "브라질의 반동 세력은 무너뜨려야 합니다. 언어가 다르므로 무력 침공은 불가능하며, 우리는 외국 점령자가 될 것입니다. 그들의 정부가 자국민의 손에 무너지도록 해야 합니다. 혁명 만세! Viva a Revolução!"
 VEN_diplomacy_around_the_globe: "전 세계에 걸친 외교"
 VEN_diplomacy_around_the_globe_desc: "혁명의 확산을 시작하려면 이웃 나라에 집중해야 할 수도 있지만, 우리는 큰 꿈을 꿔야 합니다. 아메리카 대륙에서 아시아까지, 우리는 최선을 다해 우리의 가치를 퍼뜨릴 것입니다!"
 VEN_invest_in_brazil: "브라질에 투자"
 VEN_invest_in_brazil_desc: "BRICS의 일원인 브라질은 오랫동안 미래의 강대국으로 여겨져 왔습니다. 이는 그들을 훌륭한 동맹으로 만들 뿐 아니라 훌륭한 경제적 기회로도 만듭니다. 그들의 나라에 투자하여 사회주의의 상호 성장을 이룹시다!"
 VEN_invest_in_central_america: "중앙아메리카에 투자"
 VEN_invest_in_central_america_desc: "중앙아메리카의 국민은 가난이라는 저주에 시달려 왔습니다. 자본가들은 자신들의 농장에만 투자했고 바나나에만 관심을 가졌습니다. 우리는 마침내 그들이 성장하는 데 필요한 자금을 제공할 것입니다. 영원한 연대를!"
 VEN_invest_in_mexico: "멕시코에 투자"
 VEN_invest_in_mexico_desc: "The Mexican Revolution ushered an age of social democracy in Mexico. But the PRI's governments have been extremely corrupt, and kept their people poor. As true socialists, we will extend our hand in friendship, and help the Mexican People grow successful. May they surpass the U.S. as the colossus of the north!"
 VEN_invest_in_south_africa: "남아프리카에 투자"
 VEN_invest_in_south_africa_desc: "남아프리카는 식민지화의 피해자이며, 그 국민은 반동의 군화 아래서 충분히 고통받았습니다. 그들이 성공하는 데 필요한 모든 도움을 제공합시다! 우리 국민이 번영하기를!"
 VEN_brazilian_alliance: "브라질과 동맹"
 VEN_brazilian_alliance_desc: "브라질의 새로운 혁명 정부는 강력한 동맹이 될 것입니다. 우리는 군사 동맹으로 상호 연대를 공고히 해야 합니다. 반동 세력이 우리의 공동된 힘을 두려워하기를!"
 VEN_venezuelian_unity: "베네수엘라의 단결"
 VEN_venezuelian_unity_desc: "기로에 선 나라 베네수엘라는 격동의 시대 한가운데에 서 있습니다. 대대적인 변화의 여파로 군사 정권이 권력을 잡았으며, 나라를 깊은 변혁의 시기로 이끌고 있습니다. \\"베네수엘라의 단결\\"은 내부 분열로 만신창이가 된 나라에 결속과 안정을 가져오겠다는 군사 정권의 비전을 담고 있습니다."
 VEN_purge_the_opponents: "반대 세력 숙청"
 VEN_purge_the_opponents_desc: "베네수엘라는 내부 분열, 정치적 반대, 상충하는 이념과 씨름하고 있습니다. 권력을 공고히 하고 단결로 나아가는 길을 개척하기 위해 베네수엘라 지도부는 정치적 반대 세력을 숙청하는 대담한 시도에 착수했습니다."
 VEN_spread_right_wing_propaganda: "우익 선전 확산"
 VEN_spread_right_wing_propaganda_desc: "우익의 가치와 이념을 홍보하기 위한 집중적인 선전 운동이 개시됩니다."
 VEN_protect_our_lands: "우리 영토 수호"
 VEN_protect_our_lands_desc: "새로운 시대의 문턱에 선 지금, 정부는 국가의 주권과 자원을 지켜야 할 절박한 필요성을 인식하고 있습니다. 이는 국가 방어를 강화하고 영토와 국민의 안전을 보장하겠다는 약속을 담게 될 것입니다."
 VEN_desperate_defense: "필사적 방어"
 VEN_desperate_defense_desc: "We find ourself at a pivotal juncture, facing imminent external threats that could jeopardize our sovereignty and security. We must unite the nation and prepare for the arduous task of safeguarding its homeland."
 VEN_furious_attack: "맹렬한 공격"
 VEN_furious_attack_desc: "우리는 주권과 안보를 위협하는 임박한 외부 위협과 함께 분쟁의 벼랑 끝에 서 있습니다. 이러한 도전에 정면으로 맞서기 위해 국가의 굴하지 않는 결의에 의지해야 하며, 조국을 지키겠다는 의지를 다져야 합니다."
 VEN_empower_military_control: "군의 통제권 강화"
 VEN_empower_military_control_desc: "군에 더 많은 통제권을 부여하는 것은 군의 커지는 영향력을 인정하고 그 역량을 국가의 이익을 위해 활용하려는 전략적 조치입니다."
 VEN_ease_out_corruption: "부패 점진적 완화"
 VEN_ease_out_corruption_desc: "We are facing the pervasive influence of corruption that has hindered our nations progress. We embark on the strategic initiative to easing out corruption. This will represent a comprehensive effort to combat graft and foster a more transparent and accountable government."
 VEN_purge_out_corruption: "부패 일소"
 VEN_purge_out_corruption_desc: "우리는 부패가 국가의 조직 깊숙이 스며들어 안정과 성장 잠재력을 훼손하고 있음을 인정해야 합니다. 부패한 관리들을 숙청하는 것은 훨씬 이전부터 기관들을 괴롭혀 온 부정과 실정으로부터 나라를 정화하려는 단호한 노력입니다."
 VEN_nationalize_foreign_industries: "외국 산업 국유화"
 VEN_nationalize_foreign_industries_desc: "권위주의 정부 아래의 베네수엘라는 국경 내에서 운영되는 외국 소유 산업을 국유화하는 일련의 조치를 개시합니다. 이 산업들은 국가 통제 아래 놓이게 되며, 정부는 경제에 더 강한 영향력을 행사할 수 있게 됩니다."
 VEN_establish_autarky: "자급자족 체제 구축"
 VEN_establish_autarky_desc: "Acknowledging the need for economic self-reliance and independence, embarks on the ambitious journey of achieving self-sufficiency. This reflects the strategic shift in the nation's economic policies, aiming to reduce its reliance on external resources."
 VEN_domestic_arms_industry: "국내 무기 산업"
 VEN_domestic_arms_industry_desc: "국영 방위 산업체들이 군사 장비 개발을 맡아 외국산 무기 수입에 대한 의존을 줄입니다."
 VEN_look_outwards: "외부로 눈을 돌리다"
 VEN_look_outwards_desc: "지역 강국으로서의 잠재력을 인식한 베네수엘라는 대베네수엘라라는 전략 구상에 착수합니다. 이는 남아메리카 지역에서 베네수엘라의 영향력을 확대하는 데 중점을 둡니다!"
 VEN_western_brothers: "서쪽의 형제들"
 VEN_western_brothers_desc: "Encapsulates the nation's unwavering determination to unite its people under a shared identity, territory, and destiny, and if necessary, achieve this through force of force against Colombia and Ecuador."
 VEN_curacao_question: "퀴라소 문제"
 VEN_curacao_question_desc: "베네수엘라는 퀴라소 확보를 전략 자산에 대한 통제권을 얻을 기회로 봅니다. 이 섬을 장악하면 베네수엘라는 석유 인프라에 접근하여 석유를 더 효율적으로 정제하고 수출할 수 있게 됩니다. 이 조치는 국가의 경제적 전망을 강화하여 국민이 겪는 경제적 어려움 일부를 완화하는 데 도움이 될 수 있습니다."
 VEN_guyana_question: "가이아나 문제"
 VEN_guyana_question_desc: "가이아나 지역을 둘러싼 오랜 영토 분쟁에 직면한 베네수엘라는 역사적 영유권을 되찾기 위한 군사 작전을 개시합니다. 이는 분쟁 지역에 대한 역사적 권리와 영유권을 주장하겠다는 국가의 의지를 확고히 할 것입니다."
 VEN_northern_expansion: "북부 팽창"
 VEN_northern_expansion_desc: "지역적 팽창과 영향력에 대한 비전에 이끌린 베네수엘라는 \\"북부 팽창\\"이라는 대담한 시도에 착수합니다. 이는 군사력을 포함해 카리브해에서 영토적, 정치적 이익을 주장하겠다는 국가의 의지를 반영합니다."
 VEN_nearby_islands_control: "인근 섬 통제"
 VEN_nearby_islands_control_desc: "베네수엘라는 현재 트리니다드 토바고가 관리하는 섬들에 대한 역사적, 영토적 영유권을 주장합니다. 이 지역들을 베네수엘라의 정체성과 연결하는 역사적 유대와 문화적 연관성을 강조합니다."
 VEN_question_the_future: "미래에 대한 물음"
 VEN_question_the_future_desc: "Rising nationalism in Venezuela, we can expect significant political and economic changes, potential shifts in international relations, and increased emphasis on Venezuelan culture and identity. This could impact the government, economic policies, and international diplomacy, all while fostering greater unity or division among the population."
 VEN_conservative_authoritarism: "Conservative Authoritarism"
 VEN_conservative_authoritarism_desc: "With the Conseratives coming into power. This will ensure that Venezuela centralizes authority in the government, concentrating power in the hands of a conservative leadership. This aims to streamline decision-making and ensure a strong, cohesive direction for the nation."
 VEN_compromise_with_the_major_powers: "Compormise with the Major Powers"
 VEN_compromise_with_the_major_powers_desc: "복잡한 국제 관계를 헤쳐 나가며 외교의 중요성을 인식한 베네수엘라는 자국의 이익을 지키고 평화적 공존을 증진하기 위해 외교적 해법과 타협을 모색하겠다는 전략적 약속을 강대국들에게 제시합니다."
 VEN_ally_the_us: "미국과 동맹"
 VEN_ally_the_us_desc: "세계적인 초강대국과 보조를 맞추는 것의 중요성을 인식하여, 우리는 영토 보전을 확보하고 경제 성장을 촉진하며 국제적 위상을 높이기 위해 미국과 강력한 동맹을 구축하겠다고 약속했습니다."
 VEN_adopt_nato_standards: "나토 표준 채택"
 VEN_adopt_nato_standards_desc: "군을 현대화하고 방위 전략을 세계 최고의 관행에 맞추는 것의 중요성을 인식합니다. 우리 군을 나토가 정한 표준에 맞출 것입니다."
 VEN_invite_american_companies: "미국 기업 유치"
 VEN_invite_american_companies_desc: "경제적 전망을 높이고 국제적 유대를 강화하고자 합니다. 우리는 미국 기업들이 투자하여 우리의 경제 발전에 기여하도록 유치하는 계획에 착수합니다."
 VEN_abandon_aggresive_foreign_police: "공세적 외교 정책 포기"
 VEN_abandon_aggresive_foreign_police_desc: "이전의 공세적 외교 정책 기조에서 의도적으로 벗어나, 우리는 이제 다른 나라들과 평화롭고 협력적인 관계를 추구하며 공세적 외교 정책의 추구를 포기합니다."
 VEN_nato_vanguard_in_south_america: "NATO Vangaurd in South America"
 VEN_nato_vanguard_in_south_america_desc: "나토 회원국들이 베네수엘라 땅에 군사 기지를 설치할 전략적 발판을 제공함으로써 우리의 안보를 강화하고 서방 민주주의 국가들과의 협력 관계를 확대하며 지역 안정을 공고히 하고자 합니다."
 VEN_the_condor_and_the_eagle: "콘도르와 독수리"
 VEN_the_condor_and_the_eagle_desc: "We must show the world that by deepening diplomatic, economic, and strategic ties with a powerful eagle-themed nation, fostering collaboration for mutual interests and regional stability. Is the only way to ensure a peaceful coexistence between nations."
 VEN_iron_regime: "철의 정권"
 VEN_iron_regime_desc: "단호한 권위주의 정권의 깃발 아래 변혁의 시도가 시작됩니다. 권력을 중앙집권화하고 민족주의적 가치를 증진하며 국가에 대한 통제를 강화하려는 파시스트 정부가 부상합니다."
 VEN_aggresive_ambitions: "공세적 야망"
 VEN_aggresive_ambitions_desc: "Under the sway of a resurgent fascist agenda. Comes an unwavering commitment to expansionism, territorial conquest, and the pursuit of power and influence in the international arena not see since the 1940's."
 VEN_demand_the_canal: "운하 요구"
 VEN_demand_the_canal_desc: "정부는 [PAN.GetName]에 파나마 운하의 통제권을 즉시 베네수엘라로 이양하라고 요구하는 중대한 외교적 최후통첩을 발송했습니다. 역사적 유대와 지역 패권을 근거로 내세우고 있으며, 이 요구는 전략적 수로를 확보하겠다는 굽힘 없는 결의에 뒷받침됩니다."
 VEN_peruan_submission: "페루의 복종"
 VEN_peruan_submission_desc: "정부는 페루에 베네수엘라의 통치에 복종하라고 요구하는 외교적 최후통첩을 발송했습니다. 이념적, 역사적 우월성을 근거로 정당화하며 페루에 대한 우리의 영토적, 정치적 권리를 주장합니다."
 VEN_army_expansion: "육군 확장"
 VEN_army_expansion_desc: "정부는 모집, 훈련, 장비 개선에 자원을 투입하여 군대를 대폭 확장합니다. 군은 강화되고 현대화되어 파시스트 국가의 기둥으로 자리매김합니다."
 VEN_push_on_north: "북진"
 VEN_push_on_north_desc: "북진은 영토 확장과 지역 패권에 대한 비전에 이끌린 군국주의적 팽창주의와 민족주의적 열정이라는 이념을 의미합니다. 이는 남아메리카, 중앙아메리카, 멕시코의 지정학적 판도를 재편하겠다는 베네수엘라의 의지를 반영합니다."
 VEN_tackle_the_us: "미국에 맞서다"
 VEN_tackle_the_us_desc: "정부는 격렬한 반미 수사를 동원하여 적대감의 불씨를 부채질하고 미국을 침략 국가로 묘사합니다. 이는 대결과 군국주의의 분위기를 조성합니다."
 VEN_empire_of_the_evil: "악의 제국"
 VEN_empire_of_the_evil_desc: "이는 이웃 국가들을 지배하고 공격적인 군사 행동으로 세계 지정학 지형을 재편하려는 베네수엘라의 의도를 반영합니다. 군사적 침략과 영토 정복을 통해 역사적 독일을 연상시키는 파시즘 원칙을 적용하여 강력한 제국을 세우겠다는 국가의 결의를 구현합니다."
 VEN_kind_dictatorship: "온정적 독재"
 VEN_kind_dictatorship_desc: "베네수엘라는 권위주의적 이상을 신봉하는 카리스마 있는 강력한 지도자 뒤로 결집합니다. 지도자는 질서와 방향을 유지하기 위한 강력하고 중앙집권적인 권위를 강조합니다."
 VEN_concentrate_on_our_problems: "우리의 문제에 집중"
 VEN_concentrate_on_our_problems_desc: "정부는 부패 방지 전담반, 내부 조사, 부패 행위 유죄 판결자에 대한 엄중한 처벌과 같은 조치로 부패를 억제하기 위해 강압적인 접근법을 취할 것입니다. 그 목표는 정부 모든 계층에서 부패를 뿌리 뽑는 것입니다."
 VEN_open_borders_for_foreigners: "외국인에게 국경 개방"
 VEN_open_borders_for_foreigners_desc: "우리는 외국 투자자들에게 문호를 개방하고 그들이 국가 경제에 기여하도록 초청한다고 천명합니다. 외국 자본과 전문 지식의 유입을 촉진하기 위해 비자 및 입국 규정을 완화할 것을 약속합니다."
 VEN_grand_populism: "대포퓰리즘"
 VEN_grand_populism_desc: "우리는 포퓰리즘 운동을 상징하는 카리스마 있는 지도자를 추대합니다. 그는 대중과 소통하며 그들의 지지와 열정을 이끌어내는 지도자입니다."
 VEN_invite_foreign_companies: "외국 기업 유치"
 VEN_invite_foreign_companies_desc: "우리는 외국 기업들에 문호를 개방하고 독점적인 경제 협정을 통해 국가 경제에 투자하도록 장려합니다. 이러한 협정은 정권에 그들의 운영에 대한 상당한 통제권을 부여합니다."
 VEN_diversify_oil_economy: "석유 경제 다각화"
 VEN_develop_tourist_infrastruscture: "관광 인프라 개발"
 VEN_develop_tourist_infrastruscture_desc: "정부는 관광 인프라 개발의 모든 측면에 엄격한 중앙 계획과 통제를 행사합니다. 신규 리조트에서 교통망에 이르기까지 모든 사업은 정부 당국이 면밀히 관리합니다."
 VEN_give_a_little_freedom: "약간의 자유 부여"
 VEN_give_a_little_freedom_desc: "정부는 신중하게 정해진 경계 안에서 시민적 자유와 경제적 자유를 통제된 방식으로 확대합니다. 시민들은 일부 개인의 자유를 부여받지만 여전히 권위주의 정권의 감시 아래 놓입니다."
 VEN_diversify_oil_economy_desc: "We acknowledge the vulnerability of an oil-dependent economy and, under authoritarian rule, enacts policies to diversify our economic base. It encourages the development of industries beyond oil production, such as manufacturing, agriculture, and minerals."
 VEN_cartel_question: "카르텔 문제"
 VEN_cartel_question_desc: "카르텔은 라틴아메리카 전역의 문제이지만, 우리나라를 포함한 콜롬비아 지역만큼 카르텔을 상징하는 곳은 없습니다. 우리는 이 살인적인 범죄 조직과 싸울 것입니까, 아니면 오히려 우리에게 유리하게 이용하려 시도해야 합니까?"
 VEN_alliance_with_the_farc: "FARC와 동맹"
 VEN_alliance_with_the_farc_desc: "The Revolutionary Colombian Armed Forces(FARC) is a socialist guerilla group trying to overthrow the Colombian government, and they have engaged with many cartels for funding. By allying them, not only do we further our goals ideologically, but we also will be able to have an in with the cartel networks across the Americas."
 VEN_bribe_schemes: "뇌물 공작"
 VEN_bribe_schemes_desc: "뇌물은 세계 대부분의 사람들에게 역겨운 관행으로 여겨집니다. 그러나 권력을 쥔 우리에게는 성과를 가져다줍니다. 우리 카르텔 동맹의 앞길을 막을 수 있는 외국 관리들을 매수하는 데 자금을 사용합시다."
 VEN_pro_government_cartels: "친정부 카르텔"
 VEN_pro_government_cartels_desc: "카르텔은 보통 돈만 아는 단순한 범죄자들로 여겨집니다. 그러나 이곳에서 우리는 그것을 바꿀 기회를 얻었습니다. 카르텔은 거리에서 우리의 새로운 집행자가 될 것입니다. 국민이 그들에게 느끼는 공포가 우리가 마주할 수 있는 모든 반대 세력을 잠재울 것입니다."
 VEN_cartel_of_the_suns: "태양 카르텔"
 VEN_cartel_of_the_suns_desc: "The Cartel of The Suns is an alleged Cartel consisting of Venezuela's top miliary officials, existing since the 1990's. If we solidify their position in the criminal underworld, it will expand our government's reach across the world."
 VEN_integrate_the_military_and_the_cartel: "군과 카르텔의 통합"
 VEN_integrate_the_military_and_the_cartel_desc: "Our Armed Forces have never been able to control the Cartels before. Fighting them gained us nothing. But now that we are working on them, we can work together. Cartel enforcers will train our soldiers, and our soldiers will protect them from attacks. May our partnership bring us mutual prosperity!"
 VEN_increase_the_size_of_the_cartel: "카르텔 규모 확대"
 VEN_increase_the_size_of_the_cartel_desc: "우리나라는 이제 마약 국가입니다. 하지만 우리는 이를 우리의 이익을 위해 만들었습니다. 카르텔 지도부를 달래고 우리의 영향력과 힘을 키우기 위해 그들의 세력을 확대합시다. 폭력 범죄자들을 그들에게 보내 훈련시키고 해외 카르텔들도 우리의 협력자가 될 것입니다."
 VEN_expand_the_cartel_to_other_countries: "카르텔의 타국 진출"
 VEN_expand_the_cartel_to_other_countries_desc: "우리는 다른 나라 카르텔들과 연줄을 만들었고, 이제 그 안에 거점을 구축할 기회를 얻었습니다. 우리의 카르텔이 성장할 것이며, 그와 함께 우리의 힘도 커질 것입니다."
 VEN_fight_the_cartels: "카르텔과 싸우다"
 VEN_fight_the_cartels_desc: "태양의 카르텔(Cartel of the Suns)은 베네수엘라 무장 세력 고위 인사들이 국제 마약 밀매에 연루되어 있다는 의혹을 받는 베네수엘라 조직입니다. 저널리스트이자 차비스모, 마약 밀매와 군대(Chavismo, Narco-trafficking and the Military)의 저자인 헥토르 란다에타(Héctor Landaeta)에 따르면, 이 현상은 콜롬비아 마약이 부패한 국경 부대를 통해 베네수엘라로 유입되면서 시작되었으며, \"부패가 계급 상층부로 이동\"했다고 합니다."
 VEN_war_on_drugs: "마약과의 전쟁"
 VEN_war_on_drugs_desc: "베네수엘라의 불법 마약 거래는 베네수엘라에서 이루어지는 불법 마약 거래 관행입니다. 베네수엘라는 콜롬비아에서 생산된 코카인이 중앙아메리카와 멕시코, 아이티, 도미니카 공화국, 푸에르토리코 같은 카리브해 국가들을 거쳐 미국으로 향하는 경로였습니다. 2010년대에는 베네수엘라가 점차 코카인의 주요 생산국이 되기도 했습니다."
 VEN_fight_the_farc: "FARC와 싸우다"
 VEN_fight_the_farc_desc: "콜롬비아 무장 혁명군 - 인민군(스페인어: Fuerzas Armadas Revolucionarias de Colombia - Ejército del Pueblo, FARC-EP 또는 FARC)은 1964년부터 계속되고 있는 콜롬비아 분쟁에 관여한 마르크스-레닌주의 게릴라 단체입니다. FARC-EP는 \\"라 비올렌시아\\" 시기에 결성된 농민 자위대에서 출발하여 농본주의와 반제국주의 정치 노선을 내세운 농민 세력으로 등장했습니다. 이들은 테러를 포함한 비정규 방식뿐 아니라 다양한 군사 전술을 사용하는 것으로 알려져 있습니다."
 VEN_destroy_farc: "FARC 격멸"
 VEN_destroy_farc_desc: "FARC는 너무 오랫동안 우리의 눈엣가시였습니다. 이제 그들을 분쇄하고 이 지역에 대한 통제를 공고히 할 때입니다."
 VEN_prepare_army: "군 준비"
 VEN_prepare_army_desc: "FARC의 위협에 효과적으로 맞서기 전에, 우리는 군사력을 동원하고 다가올 작전에 대비시켜야 합니다. 이 초기 준비 단계는 국경 강화, 내부 침투, 콜롬비아 경찰 훈련이라는 세 갈래 반FARC 전략의 틀을 마련할 것입니다."
 VEN_fortify_border: "국경 요새화"
 VEN_fortify_border_desc: "FARC의 침투를 막고 영토를 확보하기 위해, 콜롬비아와 접한 주요 국경 지점을 따라 방어 벙커를 건설해야 합니다. 이 요새화 작업은 전략적 지역에 집중하여 FARC의 이동을 저지하고 국민을 보호하는 방어선을 구축할 것입니다."
 VEN_infiltrate_farc_ranks: "FARC 내부 침투"
 VEN_infiltrate_farc_ranks_desc: "정보는 반군 단체와 싸우는 데 결정적입니다. FARC의 조직 구조에 우리 요원을 침투시킴으로써 그들의 작전, 지도부, 계획된 활동에 관한 핵심 정보를 수집할 수 있습니다. 이 정보 작전은 콜롬비아 보안 기관과 긴밀히 협력하는 과정에서 콜롬비아 내 우리의 영향력도 강화할 것입니다."
 VEN_train_colombian_police: "콜롬비아 경찰 훈련"
 VEN_train_colombian_police_desc: "효과적인 경찰력은 질서를 유지하고 콜롬비아 영토 내 FARC의 영향력에 맞서는 데 필수적입니다. 우리는 콜롬비아 경찰의 역량을 강화하도록 훈련과 자원을 제공하고, 경찰 예산을 늘려 반군 작전에서의 효율성을 높일 것입니다."
 VEN_attack_farc: "FARC 공격"
 VEN_attack_farc_desc: "준비가 완료되었으므로(국경 요새화, 정보망 구축, 콜롬비아 경찰 훈련), 우리는 FARC 거점에 대한 합동 군사 공세를 개시할 준비가 되었습니다. 이 지속적인 작전은 그들의 작전 능력을 크게 약화시키고 지역 안정에 대한 위협을 줄일 것입니다."
 VEN_campaign_against_farc: "FARC 소탕전"
 VEN_campaign_against_farc_desc: "FARC의 군사 역량이 약화되었으므로, 이제 그들의 세력을 더욱 줄이기 위해 포괄적인 작전으로 노력을 강화해야 합니다. 이러한 지속적인 압박은 그들을 붕괴에 더 가까이 몰아넣고 지역을 위협할 능력을 더욱 감소시킬 것입니다."
 VEN_destroy_farc_influence: "FARC 영향력 파괴"
 VEN_destroy_farc_influence_desc: "FARC가 심각하게 약화되었으므로, 이제 최후의 일격을 가할 위치에 섰습니다. 이 작전은 그들의 남은 조직 구조를 완전히 해체하고 이 지역에서의 영향력을 영구히 제거하여 수십 년간의 반군 활동을 끝낼 것입니다."
 VEN_FARC_weak: "약화된 FARC"
 VEN_FARC_weak_desc: "FARC에 대한 초기 공세는 성공적이었으며 그들의 역량을 크게 약화시켰습니다. 그러나 그들의 지속적인 존재는 여전히 우리 경제에 영향을 미쳐 세수를 10% 감소시키고 소비재 수요를 2% 증가시키며 사회 비용을 10% 상승시키고 있습니다."
 VEN_FARC_weakened: "크게 약화된 FARC"
 VEN_FARC_weakened_desc: "우리의 지속적인 작전으로 FARC는 심각하게 약화되어 붕괴 직전에 놓였습니다. 아직 어느 정도 위협은 남아 있으나 우리나라에 미치는 영향은 크게 줄어들었습니다. 세수 감소 효과는 5%로, 소비재 요인은 1%로, 사회 비용은 5%로 낮아졌습니다."
 VEN_arresting_high_profile_individuals: "주요 인물 체포"
 VEN_arresting_high_profile_individuals_desc: "베네수엘라 정보 기관은 FARC의 주요 인물들을 식별하고 소재를 파악하기 위해 부지런히 움직입니다. 비밀 작전과 감시는 그들의 이동을 추적하는 필수 수단이 됩니다."
 VEN_support_the_colombians: "콜롬비아 지원"
 VEN_support_the_colombians_desc: "전 세계에는 600만 명이 넘는 베네수엘라 이주민과 난민이 있으며, 이 중 180만 명 이상이 이웃 나라 콜롬비아에 거주하고 있습니다. 이들은 수년간의 경제적 어려움과 정치적 분쟁에 시달린 나라를 떠났습니다. 오늘날에도 베네수엘라의 상황은 계속 악화되고 있어 이민이 계속될 것이라는 전망이 나오며, 콜롬비아는 불균형적으로 많은 이주민을 받아들이고 있습니다. 올해에만 75만 3천 명이 넘는 베네수엘라인이 고향을 떠났습니다."
 VEN_dismantle_the_farc: "FARC 해체"
 VEN_dismantle_the_farc_desc: "For years, the FARC has been a destabilizing force, engaging in activities that pose security risks and undermine regional peace. The dismantling of their forces outlines a multifaceted strategy for addressing this issue and finally bringing down the FARC orginzation as a whole."
 VEN_alliance_with_colombia: "콜롬비아와 동맹"
 VEN_alliance_with_colombia_desc: "콜롬비아-베네수엘라 관계는 국경을 접한 두 나라 사이의 외교 관계를 가리킵니다. 이 관계는 스페인 식민지 개척자들이 산타마르타 주(현재의 콜롬비아)와 누에바안달루시아 주(현재의 베네수엘라)를 세운 16세기 초부터 발전해 왔습니다. 두 나라는 시몬 볼리바르 아래 독립을 이루고 하나의 나라인 그란 콜롬비아가 되었다가 19세기에 해체된 역사를 공유합니다. 그 이후 두 나라의 전반적인 관계는 협력과 양국 간 갈등 사이를 오갔습니다."
 VEN_coup_in_colombia: "콜롬비아 쿠데타"
 VEN_coup_in_colombia_desc: "1953년 콜롬비아 쿠데타는 1953년 6월 13일 콜롬비아 총사령관 구스타보 로하스 피니야가 권력을 장악하며 이어진 쿠데타였습니다. 그는 1957년까지 독재자로서 통치했습니다."
 VEN_national_army: "베네수엘라 국군"
 VEN_national_army_desc: "Founded arround 1810 during The Independence War of Venezuela under the name of FANB (Fuerza Armada Nacional Bolivariana), the National Venezuelan Army is the main body of the Venezuelan Armed Forces, as such, the five other branches are directly below it. Structurally, theres a Commander-in-Chief at the helm with the help from a elected Minister of Defense, followed by the Commanders of every branch under it."
 VEN_the_airforce: "베네수엘라 공군"
 VEN_the_airforce_desc: "The Venezuelan Air Force traces its roots all the way back to 1935 - but it was only officially founded as a independent branch in 1946 after the first official commander for the independent branch was selected. The Air Force went through a period of heavy modernization during the 1950s, and then a further modernization programme during the 1970s."
 VEN_modern_airforce: "현대화된 공군"
 VEN_modern_airforce_desc: "Our air force technology is once again in dire needs of a modernization programme - relocating funds into the issue will allow us to improve outdated airframes and also think of future aircraft development."
 VEN_combat_aircraft: "전투기"
 VEN_combat_aircraft_desc: "거의 20년 전 도입한 우리의 F-16은 점차 노후화되고 있습니다. 적절한 자원을 투입한다면 이 문제를 해결하고, 다시금 우리 국가의 위상에 걸맞은 기체를 보유할 수 있을 것입니다."
 VEN_bombers: "폭격기"
 VEN_bombers_desc: "우리는 현재 용도를 변경한 구형 훈련기와 심각하게 노후화된 미라주 5 다목적 기체를 임시 폭격기로 의존하고 있습니다. 이는 전쟁이 발생할 경우 우리의 역량을 심각하게 저하시키므로 이 문제를 해결하기 위한 노력이 필요합니다."
 VEN_transport_planes: "수송기"
 VEN_transport_planes_desc: "By studying our current transport planes airframes, and by looking at our maintenance manuals and obtaining new ones, we have found new ways to assemble and maintain our own airframes at a much faster rate,"
 VEN_new_helicopters: "현대식 헬리콥터"
 VEN_new_helicopters_desc: "현대 군대는 전장에서 다양한 임무로 지상군을 지원하기 위해 헬리콥터를 운용합니다. 우리도 이로부터 배워 뒤처지지 않도록 자체 헬리콥터를 확보해야 합니다."
 VEN_the_navy: "베네수엘라 해군"
 VEN_the_navy_desc: "Our Navy was founded in 1811, but it wasnt untill the 1920s and 1930s that we started to invest on it appropriately, buying older ships from bigger powers. In the modern era, we have undergone several purchases of various types of smaller vessels. In the 70s and 80s we obtained our current warships through different deals, now we must ensure to continue the improvement of them."
 VEN_diesel_submarines: "디젤 잠수함 계획"
 VEN_diesel_submarines_desc: "Our current Type 209 Submarines obtained from Germany have went through several modifications through the service with our Navy, but it seems like it is once again time to fund upgrades to our severely outdated submarines as the new millenia has arrived and technologies have advanced."
 VEN_armed_corvettes: "현대식 초계함"
 VEN_armed_corvettes_desc: "Our current navy doesnt field any Modern Corvettes, if we want to keep up-to-date with the navies of the world, we must introduce them to our naval doctrine."
 VEN_death_from_underneath: "수면 아래로부터의 죽음"
 VEN_death_from_underneath_desc: "By approaching a policy of obtaining naval supremacy via submarines either by directly engaging bigger ships with them, or by straining the economy of the country we plan to fight with, we can void the need of bigger, more expensive warships to secure our naval ambitions."
 VEN_the_wolves: "현대판 늑대 떼 전술"
 VEN_the_wolves_desc: "제2차 세계 대전 중 독일은 영국을 오가는 대형 호송 선단과 효과적으로 교전하기 위해 늑대 떼 전술을 고안했습니다. 이러한 전술을 연구하여 현대에 맞게 적용함으로써 잠수함 함대를 최대한 활용할 수 있습니다."
 VEN_refitting_our_frigates: "호위함 개수"
 VEN_refitting_our_frigates_desc: "1975년 이탈리아에서 도입한 우리 해군의 구형 루포급 호위함은 더 오래 복무시키려면 심각하게 현대화가 필요합니다."
 VEN_armed_merchant_marines: "무장 상선단"
 VEN_armed_merchant_marines_desc: "자국 해상 항로를 보호할 함대를 건설할 자원과 산업 역량이 부족하여, 우리는 상선에 임시 무장을 갖추는 구식 전략에 의존할 수밖에 없습니다. 다만 이번에는 승선 인원에게 훈련과 무기도 제공하려 노력할 것입니다."
 VEN_the_doctrine: "해군 학교"
 VEN_the_doctrine_desc: "우리가 세계 최고의 함선을 보유하더라도 제대로 된 훈련이 없다면 그 함선들은 적의 사격 연습 표적일 뿐입니다. 승조원들이 가능한 최고의 훈련을 받도록 해야 합니다."
 VEN_military_reforms: "군 개혁"
 VEN_military_reforms_desc: "베네수엘라 육군은 다른 선진국에 비해 심각하게 낙후되어 있으며, 불안정한 상태에서 회복시키려면 여러 개혁이 이루어져야 합니다."
 VEN_increase_of_arms_production: "무기 생산 증대"
 VEN_increase_of_arms_production_desc: "국내에서 군용 무기 생산을 늘리면 자국 병사들을 무장시킬 수 있게 되며, 이러한 투자는 우리 군이 스스로를 지킬 능력을 크게 향상시킬 것입니다."
 VEN_upgrading_equipment: "장비 개선"
 VEN_upgrading_equipment_desc: "우리의 군사 기술은 현대에 발맞춰야 합니다. 연구 개발 팀이 열심히 노력하여 무기를 개선하는 방법에 관한 훌륭한 보고서를 제출했습니다."
 VEN_venezuela_national_militia: "국가 민병대 창설"
 VEN_venezuela_national_militia_desc: "국가 민병대의 창설은 경찰력의 역량과 강도를 높이고 나라의 평화와 안정을 유지하기 위해 우리나라에 필요합니다."
 VEN_improved_officer_training: "장교 훈련 개선"
 VEN_improved_officer_training_desc: "우리는 군 지휘관 양성 과정을 개선하여, 질을 희생하지 않으면서도 군에서 경력을 쌓을 더 나은 간소화된 방법을 제공해야 합니다."
 VEN_the_special_forces: "베네수엘라 특수 부대"
 VEN_the_special_forces_desc: "특수 행동군은 국방부가 창설한 베네수엘라 국가 경찰의 정예 보병 부대입니다."
 VEN_guard_of_revolution: "혁명 수비대"
 VEN_guard_of_revolution_desc: "The Guardians of the Venezulean Revolution Ground Forces was officially established on 5 May 1979. It was conceived as a popular militia force to monitor the region . However, the official establishment followed several months of activity of the Revolutionary Guards."
 VEN_glory_to_us: "우리에게 영광을"
 VEN_glory_to_us_desc: "우리는 미국의 위협에 대비하기 위해 군사 훈련을 실시해야 합니다. 군대를 동원하고 전략 지역에 대한 모의 공격을 준비하여 우리 병사들이 가상의 적과 교전하도록 하는 것입니다."
 VEN_spirit_of_bolivar: "볼리바르의 정신"
 VEN_spirit_of_bolivar_desc: "'폭풍이 실어 나른 깃털' 2005년 여름, 베네수엘라는 시몬 볼리바르가 위대한 스승 시몬 로드리게스 앞에서 한 서약 200주년을 기념했습니다. 로드리게스는 훗날 파리에서 마르크스보다 훨씬 앞서 사회주의 비밀 결사에 드나들었고 1823년에야 남아메리카로 돌아온 인물입니다."
 VEN_modernize_the_armored_corps: "기갑 군단 현대화"
 VEN_modernize_the_armored_corps_desc: "Our AMX-30s are severely outdated for modern standards. by studying foreign main battle tanks designs we can obtain our own up-to-date tank design."
 VEN_the_grand_army_of_the_republic: "공화국 대군"
 VEN_the_grand_army_of_the_republic_desc: "베네수엘라 볼리바르 해병대는 볼리바르 해병 보병 또는 공식적으로 시몬 볼리바르 장군 해병 사단으로 알려져 있으며 베네수엘라 볼리바르 해군에 속합니다. 그 좌우명은 'Valor y Lealtad(용기와 충성)'입니다."
 VEN_a_new_army: "개혁된 군대"
 VEN_a_new_army_desc: "With the x reforms needed being completed, we can finally look at the future of our armed forces in a positive way, as we know we are prepared for anything there is to come."
 VEN_reorganize_the_colectivos: "콜렉티보 재편"
 VEN_reorganize_the_colectivos_desc: "When rolling blackouts once again left millions without water and electricity recently in Venezuela,the President called not on his military but loyal armed groups to defend the peace of every neighborhood and every block."
 VEN_maintain_mandatory_service: "의무 복무 유지"
 VEN_maintain_mandatory_service_desc: "지역과 그 너머에서 우리의 전력 투사 능력을 유지하려면 의무 군 복무를 유지해야 합니다. 방심하면 세계 다른 나라들에 뒤처지게 될 것입니다."
 VEN_end_of_mandatory_service: "의무 복무 폐지"
 VEN_end_of_mandatory_service_desc: "The Venezulean people should have its own choice if they want to join our Armed Forces or not, however they must still be reminded of their duty as a Venezuelan Citizen to serve its country as far as they can."
 VEN_boliviarian_national_guard: "볼리바르 국가방위대"
 VEN_boliviarian_national_guard_desc: "베네수엘라 볼리바르 국가방위대는 민방위 임무를 담당하는 군의 헌병 조직이며, 예비 경보병의 역할도 수행할 수 있습니다."
 VEN_strengthen_the_opposition: "야당 강화"
 VEN_strengthen_the_opposition_desc: "전국 도시의 거리는 반대의 무대가 되었고, 젊은이와 노인을 가리지 않고 수천 명의 베네수엘라인이 변화를 요구하는 단호한 목소리로 뭉쳤습니다. 그들은 현수막을 들고 구호를 부르며 굳은 결의로 행진하여 정권 교체와 민주주의의 복원을 요구합니다. 그 이유는 수년간의 권위주의 통치와 경제적 어려움에 지쳤기 때문입니다."
 VEN_revolution: "§R야당의 정권 장악!§!"
 VEN_revolution_desc: "The streets of Venezuelan cities, once filled with peaceful demonstrators holding signs and singing anthems, now witness a change in tone. The people's frustration and desperation drive them to more aggressive forms of protest. The peaceful chants morph into fiery demands for political transformation. As the protests turn into violent clashes between civillans, local authorities. The authorities, alarmed by the growing unrest, begin to take drastic measures. Riot police and military units are deployed to maintain order, leading to clashes between protesters and security forces."
 VEN_we_are_in_power: "우리가 집권했다"
 VEN_we_are_in_power_desc: "국민의 결의에 힘입은 야당 지도자들은 평화적 정권 이양을 위한 청사진을 마련하기 위해 모였습니다. 그들은 국제 사회에 지지를 호소하며 외교와 협상을 나아갈 길로 주창했습니다. 회담이 진전되자 정부는 압도적인 여론과 국제적 압력을 인식했습니다. 변화가 불가피함을 이해한 정부는 야당으로의 평화적 정권 이양을 개시했습니다."
 VEN_pdvsa_takeover: "PDVSA 인수"
 VEN_pdvsa_takeover_desc: "중대한 조치로서 베네수엘라 정부는 페트롤레오스 데 베네수엘라(PDVSA) 인수에 착수했습니다. 이 조치는 석유·가스 부문에 대한 국가 통제를 강화하고 투명성과 효율성을 높이는 한편, 책임 있는 환경 관행과 인프라 개발을 우선시하는 것을 목표로 합니다. 정부는 국제 협력과 기존 협정 이행에 계속 전념합니다. 이 진전은 베네수엘라의 더 안정적이고 번영하는 미래를 향한 중요한 걸음입니다."
 VEN_empower_monopolies: "독점 기업 육성"
 VEN_empower_monopolies_desc: "베네수엘라 정부는 국가 성장과 발전에서 핵심적인 역할을 맡도록 주요 기업들에 상당한 권한을 부여했습니다. 여기에는 에너지 부문의 PDVSA, 통신 부문의 CANTV, 전력 부문의 CORPOELEC, 그리고 여러 산업을 감독하는 CVG가 포함됩니다. 권한을 부여받은 이 기업들은 정부와 긴밀히 협력하여 자사의 전략과 활동을 국가 목표에 맞춥니다. 이들의 역할에 대한 세부 사항은 시간이 지남에 따라 달라질 수 있습니다. 베네수엘라의 이들 기업에 관한 최신 정보는 현행 자료를 참고하십시오."
 VEN_establish_free_market: "자유 시장 확립"
 VEN_establish_free_market_desc: "베네수엘라에서 민영화가 시작됩니다. 베네수엘라 정부는 경제 성장과 효율성을 촉진하기 위해 핵심 부문의 민영화 절차에 착수했습니다. 이러한 변화는 국가 경제 구도의 중대한 전환점입니다. 이러한 민영화 노력의 세부 사항은 시간이 지남에 따라 달라질 것이므로, 베네수엘라 민영화 구상에 관한 최신 정보는 현행 자료를 참고하십시오."
 VEN_begin_our_recovery: "회복 시작"
 VEN_begin_our_recovery_desc: "혁명은 베네수엘라 경제에 큰 타격을 주어 GDP의 급감, 만연한 실업, 붕괴된 인프라를 초래했습니다. 베네수엘라는 경제를 안정시키고 초인플레이션을 억제하며 국가 통화에 대한 신뢰를 회복하는 조치를 우선시합니다."
 VEN_diplomatic_efforts: "외교적 노력"
 VEN_diplomatic_efforts_desc: "베네수엘라는 비동맹 원칙에 부합하기 위해 적극적으로 외교적 노력을 기울이고 있습니다. 급변하는 세계 정세 속에서 국제 문제에 대해 중립적이고 초당파적인 입장을 유지하려 노력하고 있습니다. 베네수엘라의 비동맹 접근 방식의 세부 사항은 시간이 지남에 따라 구체화될 것입니다. 이와 관련한 베네수엘라의 외교적 노력에 대한 최신 정보는 현행 자료를 참고하십시오."
 VEN_all_belongs_to_pdvsa: "모든 것은 PDVSA의 것"
 VEN_all_belongs_to_pdvsa_desc: "베네수엘라에서 새로운 석유 매장량이 발견되었습니다. 중대한 진전으로, 베네수엘라에서 새 석유 매장량이 발견되어 나라의 방대한 에너지 자원에 더해졌습니다. 그 결과 페트롤레오스 데 베네수엘라(PDVSA)가 이 매장량의 관리와 운영을 맡게 되었습니다. 이 조치는 에너지 자산을 활용하고 극대화하여 국가의 이익에 기여하겠다는 정부의 의지에 부합합니다. 이 인수의 세부 사항은 시간이 지남에 따라 달라질 것이므로, 이번 석유 발견과 PDVSA의 역할에 관한 최신 정보는 현행 자료를 참고하십시오."
 VEN_purge_antimonopolists: "반독점주의자 숙청"
 VEN_purge_antimonopolists_desc: "베네수엘라는 국내 부패를 근절하기 위해 적극적으로 외교적 조치를 취하고 있습니다. 이러한 합동 노력은 투명성을 높이고 책임성을 강화하며 정부와 사회 모든 계층에서 부패 관행을 뿌리 뽑는 데 중점을 둡니다. 부패와의 이 지속적인 싸움에서 베네수엘라의 외교적 구상의 세부 사항은 시간이 지남에 따라 계속 달라질 것입니다. 부패 척결을 위한 베네수엘라의 외교적 노력의 최신 동향을 알려면 현행 자료를 참고하십시오."
 VEN_iron_control_of_pdvsa: "PDVSA에 대한 철권 통제"
 VEN_iron_control_of_pdvsa_desc: "베네수엘라의 PDVSA에 대한 정부 통제가 강화되었습니다. 베네수엘라 정부는 최근 페트롤레오스 데 베네수엘라(PDVSA)에 대한 통제를 강화했습니다. 이러한 통제 강화는 권한을 중앙집권화하고 국영 석유·가스 기업의 운영에 더 직접적인 영향력을 행사하려는 전략적 조치를 반영합니다. 이처럼 강화된 통제의 세부 사항과 PDVSA의 향후 방향에 미치는 영향은 시간이 지남에 따라 계속 달라질 것입니다. 이 진전에 관한 최신 소식을 알려면 현행 뉴스 자료를 참고하십시오."
 VEN_corporativist_1984: "Corporactivists 1984"
 VEN_corporativist_1984_desc: "1984년 베네수엘라는 조합주의 정치 또는 경제 체제를 보이지 않았습니다. 대신 이 시기에 중대한 정치적, 경제적 변화를 겪었습니다."
 VEN_oil_and_gas_financial_system: "석유·가스 금융 체제"
 VEN_oil_and_gas_financial_system_desc: "베네수엘라의 금융 체제는 역사적으로 석유·가스 산업과 밀접하게 연결되어 있습니다. 세계 최대 규모의 석유 매장량을 보유한 이 나라는 정부 수입을 석유 수출에 크게 의존합니다. 국가가 통제하는 페트롤레오스 데 베네수엘라(PDVSA)가 석유 생산과 수출을 관리합니다. 그러나 이러한 재정적 의존은 초인플레이션과 부채 문제를 비롯한 경제적 난관을 초래했습니다. 석유 자원의 관리는 정부 정책이 지도부 교체와 함께 자주 바뀌어 온 만큼 중대한 정치적 함의도 지닙니다."
 VEN_oligarchic_republic: "과두 공화국"
 VEN_oligarchic_republic_desc: "베네수엘라는 '과두 공화국'으로 규정된다는 비판을 받아 왔습니다. 이 용어는 소수 엘리트에게 권력과 부가 집중되어 심각한 부의 불평등과 정치적 격차가 초래되었음을 강조합니다. 이 나라는 특정 정치·경제 엘리트가 지배한 시기를 역사적으로 겪었습니다."
 VEN_privatize_small_buissnesses: "Privatize Small Buissnesses"
 VEN_privatize_small_buissnesses_desc: "최근 몇 년간 베네수엘라는 소기업 민영화로의 전환을 목격했습니다. 이러한 변화는 이전의 국가 통제 중시에서 벗어났음을 의미합니다. 정부의 전략은 소규모 기업의 소유권과 경영을 공공 부문에서 민간 부문으로 이전하는 것입니다. 이 전환은 경제 성장을 촉진하고 기업가 정신을 육성하는 것을 목표로 합니다."
 VEN_pacify_the_plebs: "평민 달래기"
 VEN_pacify_the_plebs_desc: "베네수엘라에서 국민의 우려를 해소하고 사회적 결속을 증진하는 일은 평화적 수단, 포용적 정책, 열린 대화를 통해 접근해야 합니다. 민주주의 원칙과 인권을 지키면서 국민의 필요를 이해하고 대응하는 데 중점을 두어야 합니다."
 VEN_digital_grip: "디지털 장악"
 VEN_digital_grip_desc: "베네수엘라의 금융 서비스 디지털화는 사람들이 돈을 다루는 방식을 혁신하고 있습니다. 디지털 지갑, 모바일 뱅킹, 온라인 결제는 금융 거래를 더 쉽고 효율적으로 만들고 있습니다. \\"디지털 장악\\"으로의 이러한 전환은 금융 포용과 경제 성장을 촉진할 잠재력이 있지만 사이버 보안과 인프라 측면의 과제도 안고 있습니다. 본질적으로 이는 베네수엘라를 더 현대적이고 편리한 금융 환경으로 이끄는 변혁적 걸음입니다."
 VEN_a_council_of_corporations: "기업 협의회"
 VEN_a_council_of_corporations_desc: "베네수엘라에 진화 협의회를 설립하는 것은 다양한 분야에서 진보와 적응력을 증진하는 중대한 걸음이 될 것입니다. 이러한 협의회는 역동적인 도전 속에서 국가를 이끌고 혁신을 촉진하며, 국가 발전이 변화하는 세계 정세에 부합하도록 정책 조정을 안내하는 데 전념할 수 있습니다. 전문 지식과 데이터에 기반한 의사 결정을 활용함으로써 진화 협의회는 경제적, 기술적, 사회적 변화에 더 효율적으로 대응하도록 도울 수 있으며, 궁극적으로 더 회복력 있고 미래 지향적인 베네수엘라에 기여할 것입니다."
 VEN_invite_foreign_companies_libert: "Invite Foreign Companies Libert"
 VEN_invite_foreign_companies_libert_desc: "외국 기업을 유치하겠다는 베네수엘라의 결정은 경제 성장과 국제 협력을 향한 유망한 조치입니다. 외국의 투자와 전문 지식을 환영함으로써 베네수엘라는 경제를 활성화하고 일자리를 창출하며 세계 시장에 진출할 수 있습니다. 이러한 접근은 혁신과 기술 이전을 촉진하여 궁극적으로 국가와 참여 외국 기업 모두에 이익을 줄 수 있습니다. 그러나 베네수엘라는 외국인 투자자를 끌어들이고 붙잡기 위해 안정적이고 투명한 사업 환경과 공정한 규제를 보장해야 합니다. 이러한 협력적 노력은 베네수엘라의 더 밝은 경제적 미래의 길을 열 수 있습니다."
 VEN_council_of_international_corporations: "국제 기업 협의회"
 VEN_council_of_international_corporations_desc: "베네수엘라에 국내 기업 협의회를 설립하는 것은 국내 기업들 간의 협력과 시너지를 증진하는 데 중요한 역할을 할 수 있습니다. 이 협의회는 협력을 도모하고 모범 사례를 공유하며 공통된 산업 과제를 다루는 플랫폼 역할을 할 수 있습니다. 지역 기업들 사이의 소통과 조율을 촉진함으로써 국내의 경제 성장, 경쟁력, 혁신을 높일 수 있습니다. 잘 구성된 국내 기업 협의회는 베네수엘라의 국내 산업을 강화하고 국가의 전반적인 경제 발전에 기여할 잠재력이 있습니다."
 VEN_total_deregulation: "전면적 규제 철폐"
 VEN_total_deregulation_desc: "베네수엘라의 전면적 규제 철폐는 여러 경제 부문에서 정부 규제를 없애 더 큰 시장 자율성의 시대를 여는 것을 수반합니다. 이 조치는 경제 성장, 경쟁력 강화, 혁신의 잠재력을 지니고 있습니다. 그러나 시장 변동성, 소비자 보호 약화, 소득 불평등 악화 가능성과 같은 위험도 초래합니다. 이러한 경제 정책 접근을 탐색할 때는 규제 철폐와 필수 규제 사이의 적절한 균형을 찾는 것이 중요한 고려 사항입니다."
 VEN_privatization_of_everything: "Privatiazion Of Everything"
 VEN_privatization_of_everything_desc: "베네수엘라의 모든 부문을 완전히 민영화하면 국가 경제 구도가 크게 바뀔 것입니다. 이 조치는 효율성 증대와 투자 유치와 같은 잠재적 이점을 제공하지만 일자리 상실, 소득 불평등, 정부 통제력 상실 등의 위험도 수반합니다. 지속 가능한 경제 발전을 위해서는 공공 소유와 민간 소유 사이의 균형을 찾는 것이 중요합니다."
 VEN_maintain_free_market: "자유 시장 유지"
 VEN_maintain_free_market_desc: "베네수엘라에서 자유 시장을 유지하는 것은 수요와 공급, 경쟁, 경제 활동에 대한 제한적인 정부 개입이라는 원칙을 지키는 것을 수반합니다. 이 접근은 민간 기업을 지원하고 기업가 정신을 장려하며 시장의 힘이 가격과 자원 배분을 결정하도록 합니다. 경제 성장과 효율성으로 이어질 수 있지만 시장 남용을 방지하고 사회 복지를 보장하기 위한 효과적인 규제도 필요합니다. 베네수엘라가 자유 시장에 전념하는 것은 경제 자유화에 대한 헌신과 개방적이고 경쟁적인 시장의 이점에 대한 믿음을 반영할 것입니다."
 VEN_pmc_army: "베네수엘라 민간 군사 회사"
 VEN_pmc_army_desc: "베네수엘라 민간 군사 회사(PMC) 설립은 국가의 안보 환경에 새로운 변화를 가져옵니다. PMC는 특수한 보안 및 군사 서비스를 제공하여 보안 문제를 해결하고 경제적 기회를 창출할 수 있는 잠재력을 지니고 있습니다. 그러나 책임 문제, 이해 충돌 가능성, 국가의 안보 문제에 대한 통제력 약화 등 우려 사항도 존재합니다. 이러한 민간 안보 및 방위 분야의 기업들이 일으킬 수 있는 위험을 관리하기 위해서는 효과적인 규제와 감독이 필수적입니다."
 VEN_minimize_government: "정부 최소화"
 VEN_minimize_government_desc: "베네수엘라 정부를 최소화하는 것은 사회와 경제의 여러 측면에서 정부의 규모, 범위, 영향력을 축소하는 것을 수반합니다. 이 접근은 흔히 제한적인 정부 개입과 시장의 힘 및 개인의 자유에 대한 더 큰 의존에 대한 의지와 결부됩니다. 관료제와 정부 지출을 줄일 수 있지만, 필수 공공 서비스 보장, 사회 안전망 유지, 법치 수호 등 잠재적 과제가 있습니다. 의도치 않은 결과를 피하고 경제적, 정치적 안정을 증진하려면 정부 개입을 균형 있게 줄이는 것이 필수적입니다."
 VEN_money_motivated_military: "돈에 움직이는 군대"
 VEN_money_motivated_military_desc: "베네수엘라 군대가 돈에 움직인다는 인식은 금전적 유인과 경제적 고려가 군인의 모집과 충성에 중요한 역할을 한다는 것을 시사합니다. 이러한 관점은 개인이 경쟁력 있는 급여, 상여금 또는 기타 경제적 혜택을 받는 등 주로 자신의 경제적 안녕을 확보하기 위해 입대하거나 군에 남을 수 있음을 암시합니다. 돈에 움직이는 군대는 인력의 경제적 필요와 국방 및 의무에 대한 헌신 사이의 균형을 얼마나 잘 맞추느냐에 따라 긍정적, 부정적 함의를 모두 가질 수 있습니다."
 VEN_build_a_unique_judgement_system: "독자적 사법 체계 구축"
 VEN_build_a_unique_judgement_system_desc: "독특하고 독자적인 사법 체계를 확립하겠다는 베네수엘라의 목표는 전통적인 법적 틀에서 크게 벗어나는 것을 의미합니다. 이러한 구상은 혁신적인 법적 구조, 대안적 분쟁 해결 방식, 또는 법적 사안을 다루는 독특한 접근법의 개발을 수반할 수 있습니다. 독자적인 사법 체계를 만들겠다는 열망은 나라의 특수한 필요에 맞는 해결책으로 이어질 수 있지만, 신중한 계획과 법률 전문 지식, 그리고 정의와 공정이라는 근본 원칙을 지키겠다는 보장이 필요합니다. 독자성과 국제 법적 기준 준수 사이의 적절한 균형을 찾는 것은 이러한 체계의 성공과 신뢰성에 매우 중요합니다."
 VEN_attract_foreign_investors: "외국 투자자 유치"
 VEN_attract_foreign_investors_desc: "외국인 투자자들이 베네수엘라에 투자하도록 장려하는 것은 경제 성장에 필수적입니다. 이는 안정적인 정책, 법적 보호, 경제 개혁, 개선된 인프라, 투명성, 인센티브, 협력 관계, 시장 조사, 교육, 숙련된 노동력을 통해 달성할 수 있습니다. 매력적인 투자 환경을 조성하려면 잠재적 투자자들에게 확신을 심어 주기 위해 경제적, 정치적, 법적 요인을 다루는 다각적인 접근이 필요합니다."
 VEN_the_based_land: "굳건한 땅"
 VEN_the_based_land_desc: "베네수엘라의 삶의 질을 개선하는 것은 경제 안정, 사회 서비스 접근성, 인프라 개발, 치안, 고용 기회, 의료 접근성, 환경 보전, 사회적 포용, 정치적 안정 등 다양한 측면을 아우르는 포괄적인 목표입니다. 이 목표를 달성하려면 국민의 복지를 높이기 위해 당면 문제와 구조적 문제를 모두 해결해야 합니다."
 VEN_venezuelian_libertarianism: "베네수엘라 자유지상주의"
 VEN_venezuelian_libertarianism_desc: "베네수엘라 자유지상주의는 권위주의와 경제 불안정 같은 문제를 해결하는 것을 목표로, 베네수엘라라는 맥락 안에서 제한적인 정부 개입, 개인의 자유, 자유 시장 원칙을 증진합니다."
 VEN_eliminate_oil_competitors: "석유 경쟁자 제거"
 VEN_eliminate_oil_competitors_desc: "베네수엘라가 국내 석유 경쟁자를 모두 제거하면 독점이 형성되어 통제와 이윤이 집중될 수 있으나 혁신과 경쟁이 위축될 가능성이 있습니다. 규제된 경쟁을 갖춘 균형 잡힌 접근이 흔히 더 유익합니다."
 VEN_privatize_all_oil: "석유 전면 민영화"
 VEN_privatize_all_oil_desc: "베네수엘라가 석유 산업 전체를 민영화한다면 석유 자원과 사업의 소유권 및 통제권을 정부에서 민간 주체로 이전하는 것을 수반할 것입니다. 민영화는 투자를 유치하고 효율성을 높이며 생산을 늘릴 수 있지만, 수입 창출과 환경 보호를 포함한 국가의 이익이 훼손되지 않도록 신중하게 이루어져야 합니다. 또한 부작용을 피하려면 노동력과 지역 사회에 미치는 사회적 영향도 고려해야 합니다. 이러한 조치의 성공은 규제, 투명성, 전환 관리에 대한 정부의 접근 방식에 달려 있습니다."
 VEN_diversify_the_economy: "경제 다각화"
 VEN_diversify_the_economy_desc: "베네수엘라 경제를 다각화하는 것은 보통 석유인 단일 부문에 대한 과도한 의존을 줄이고 다른 산업을 발전시켜 더 균형 잡히고 회복력 있는 경제를 만드는 것을 수반합니다. 이 접근은 유가 변동과 기타 외부 요인에 대한 취약성을 줄이는 것을 목표로 합니다. 다각화에는 농업, 제조업, 기술, 서비스 같은 부문에 대한 투자와 기업가 정신 및 혁신 촉진이 포함될 수 있습니다. 다각화된 경제는 더 안정적인 수입원과 일자리 기회를 제공하여 궁극적으로 국가의 경제적 지속 가능성과 회복력을 개선할 수 있습니다."
 VEN_empower_banks: "은행 육성"
 VEN_empower_banks_desc: "베네수엘라에서 은행이 권력을 쥐는 것은 통치 방식의 중대한 변화가 될 것입니다. 이는 금융 전문 지식을 가져올 수 있으나 이해 충돌, 사회적 영향, 책임성에 대한 우려를 낳을 수 있습니다. 경제적 이익과 국민의 복지 사이의 균형을 유지하는 것이 필수적일 것입니다."
 VEN_develop_fintech: "핀테크 발전"
 VEN_develop_fintech_desc: "베네수엘라의 핀테크는 초인플레이션과 통화 가치 하락을 포함한 국가의 경제 불안정에 대응하여 발전해 왔습니다. 핀테크 기업들은 주로 디지털 결제 솔루션과 어느 정도는 비트코인 같은 암호화폐에 집중해 왔습니다. 그러나 규제상의 어려움과 명확한 체계의 부재로 운영이 불확실했습니다. 이러한 장애에도 불구하고 현지 핀테크 스타트업들이 특히 국경 간 송금과 기존 은행과의 제휴를 통해 금융 포용을 개선하기 위해 등장했습니다. "
 VEN_empower_industrialists: "산업가 육성"
 VEN_empower_industrialists_desc: "베네수엘라의 산업가들은 정부 개입, 핵심 산업 국유화, 경제 불안정, 자원 부족, 민간 부문에 대한 제약이 특징인 어려운 환경에 직면해 왔습니다. 이러한 요인들의 결합은 산업가들이 효과적으로 운영하고 생산성을 유지하는 것을 어렵게 만들었습니다. 정치적 불안정과 비공식 경제에 대한 의존은 사업 환경을 더욱 복잡하게 만들었습니다."
 VEN_macroeconomic_management: "거시 경제 관리"
 VEN_macroeconomic_management_desc: "베네수엘라의 경제 관리는 중대한 어려움으로 특징지어져 왔습니다. 이 나라는 초인플레이션, 엄격한 외환 통제, 석유 수출에 대한 과도한 의존에 직면했습니다. 핵심 산업 국유화를 포함한 정부의 개입주의 정책은 종종 비효율을 낳았습니다. 기본 물자의 부족, 심각한 인도주의 위기, 상당한 규모의 비공식 경제가 있었습니다."
 VEN_develop_industry: "산업 발전"
 VEN_develop_industry_desc: "베네수엘라의 산업 부문 발전은 중대한 어려움으로 점철되어 왔습니다. 핵심 산업 국유화와 가격 통제를 포함한 정부 개입은 비효율로 이어졌습니다. 석유 수출에 대한 나라의 높은 의존도는 국제 유가 변동에 취약하게 만들었습니다. 초인플레이션은 구매력을 잠식했고 기본 물자와 자원의 부족은 생산을 저해했습니다. 정치적 불안정과 시위는 산업 활동을 방해했으며 일부 노동자는 생존을 위해 비공식 경제로 돌아섰습니다. 숙련된 전문 인력의 \\"두뇌 유출\\"도 이 부문에 추가로 타격을 주었습니다. "
 VEN_ally_south_american_rightists: "남아메리카 우익과 동맹"
 VEN_ally_south_american_rightists_desc: "베네수엘라는 좌파 성향과 우파 성향 정부를 모두 포함한 여러 남아메리카 국가와 외교 관계를 유지했습니다. 이념적 차이가 존재했지만, 특히 지역적으로 중요한 문제에서 베네수엘라와 남아메리카 우익 지도자 및 정부 간에 협력과 외교의 사례가 있었습니다. 이러한 관계의 구체적인 성격과 역학은 당시의 정치적 맥락, 집권 지도자, 논의되는 특정 사안에 따라 달라질 것입니다. 정치적 동맹과 역학은 시간이 지남에 따라 변할 수 있으며 국가 간 관계는 다양한 요인의 영향을 받는다는 점을 기억하는 것이 중요합니다."
 VEN_follow_the_us_example: "미국의 선례를 따르다"
 VEN_follow_the_us_example_desc: "베네수엘라의 외교 정책은 미국과 긴밀하게 일치하지 않았습니다. 협력 분야도 있었지만 특히 정치적, 이념적 사안에서 중대한 차이도 있었습니다. 우고 차베스 대통령 치하의 베네수엘라는 국익과 국내 정치의 영향을 받은 독자적 외교 정책을 추구했습니다. 미국과의 관계는 협력과 긴장을 모두 겪었습니다."
 VEN_ally_the_northern_power: "북방 강국과 동맹"
 VEN_ally_the_northern_power_desc: "베네수엘라의 외교 정책과 동맹은 미국이나 캐나다 같은 북아메리카 국가들에 크게 기울지 않았습니다. 대신 베네수엘라의 외교 정책은 남아메리카 내 및 다른 지역과의 관계에 더 중점을 두었습니다. 베네수엘라는 북아메리카 국가들과 외교 관계를 맺었지만, 대외 관계의 주된 초점은 흔히 이웃 국가들과 세계의 다른 지역에 맞춰져 있었습니다."
 VEN_invite_american_banks: "미국 은행 유치"
 VEN_invite_american_banks_desc: "베네수엘라는 정치적, 경제적 맥락에 따라 시기별로 다양한 금융 및 경제 사안에서 미국 은행들과 교류해 왔습니다. 이러한 교류의 구체적인 내용은 국익과 정책에 따라 달라졌습니다."
 VEN_expand_and_diversify_the_market: "시장 확대 및 다각화"
 VEN_expand_and_diversify_the_market_desc: "베네수엘라의 새로운 목표는 시장을 확대하고 다각화하는 것입니다. 이 목표는 특정 부문이나 시장에 대한 의존도를 줄이기 위해 무역 관계를 넓히고 새로운 경제적 기회를 모색하는 것을 수반할 가능성이 높습니다. 구체적인 전략과 중점 분야는 시기별 국가의 경제적, 정치적 우선순위에 따라 달라질 것입니다."
 VEN_increase_population_growth: "인구 증가 촉진"
 VEN_increase_population_growth_desc: "베네수엘라의 인구 증가를 촉진하려면 경제 안정, 사회 복지 프로그램, 이민 문제 해결 정책을 포함한 다각적인 접근이 필요합니다. 가족 친화적인 환경을 조성하고 교육과 의료를 개선하며 경제적 기회를 제공하는 것이 핵심 요소입니다. 대가족을 지지하는 문화적 가치를 장려하고 가족계획과 생식 보건에 대한 인식을 높이는 것도 중요할 것입니다."
 VEN_economic_expansion: "경제 팽창"
 VEN_economic_expansion_desc: "베네수엘라의 경제 팽창을 이루려면 경제 안정화, 산업 다각화, 외국인 투자 유치, 인프라와 교육 개선을 포함한 다각적인 접근이 필요합니다. 또한 투명하고 책임성 있는 사업 환경을 조성하고 재산권을 보호하며 재정 책임을 보장하는 것이 필수 요소입니다. 국제 협력과 무역 협정도 경제 성장을 지원하는 데 역할을 할 수 있습니다. 구체적인 전략과 우선순위는 시간이 지남에 따라 달라질 수 있으며 국가의 변화하는 여건에 좌우됩니다."
 VEN_closer_ties_with_northern_neighbours: "북쪽 이웃과의 긴밀한 관계"
 VEN_closer_ties_with_northern_neighbours_desc: "Relationship with the northern american powers would benefit our initiative to switch our government to a more western-alligned one, especially the relations with the United States and Canada."
 VEN_call_washington: "워싱턴에 연락"
 VEN_call_washington_desc: "Calling Washington is our opportunity to meet directly with the key staff of the United States in order to get us closer to their sphere of influence and make sure that we stand on common terms in term of how we can potentially help each other."
 VEN_economic_cooperation_with_america: "미국과의 경제 협력"
 VEN_economic_cooperation_with_america_desc: "미국이 우리 국민의 기본적인 필요를 충족하도록 돕는 거래가 성사될 것이며, 이는 우리 정부에 대한 경제적 압박을 완화하는 동시에 정부와 국민 사이에 강한 유대를 형성할 것입니다. 협력하는 것은 현명한 발상입니다."
 VEN_americans_help_with_economic_damage: "경제적 피해 복구를 돕는 미국"
 VEN_americans_help_with_economic_damage_desc: "The United States has decided to support the protection of human rights, the promotion of civil society, the strengthening of democratic institutions, and transparency and accountability in our country. This is a unprecedented chance for our government to do the right things and strongly recover the economy."
 VEN_our_war_on_drugs: "우리의 마약과의 전쟁"
 VEN_our_war_on_drugs_desc: "미국 마약단속국(DEA)이 우리가 원한다면 우리나라에서 활동하며 심각한 마약 문제를 해결하는 데 도움을 주겠다고 제안했습니다. 이 협력에는 상당한 외국의 개입이 따르지만, 우리의 거리를 깨끗하게 유지하려면 감수해야 할 희생입니다."
 VEN_introduce_western_industries: "서방 산업 도입"
 VEN_introduce_western_industries_desc: "유럽 연합 회원국들은 세계 최대 규모의 선도적 다국적 기업 다수의 발상지이자 글로벌 본사의 소재지입니다. 그중에는 해당 산업 또는 부문에서 세계 1위를 차지한 저명한 기업들도 있으며, 이들 기업이 우리 시장에 참여하도록 설득할 수 있다면 막대한 이익을 얻게 될 것입니다."
 VEN_ford: "포드 도입"
 VEN_ford_desc: "포드 모터 컴퍼니는 미국 미시간주 디어본에 본사를 둔 미국의 다국적 자동차 제조사입니다. 이들의 자동차 및 군수 산업은 성장하는 우리 경제의 큰 동력이 될 수 있으며, 우리나라를 더 많은 미국 투자자들에게 소개하는 부수적 이익도 있습니다."
 VEN_volkswagen: "Introduce Wolkswagen"
 VEN_volkswagen_desc: "The German Automotive giant Volkswagen has constantly expanded itself and has consistently tried to exploit new markets, by letting them open car manufacturing in our country, we can makee sure that we are part of this ever-developing company and , if we play our cards right, also become a core section of their business in South America."
 VEN_automobile_industries: "자동차 산업"
 VEN_automobile_industries_desc: "자동차 산업은 자동차의 설계, 개발, 제조, 마케팅, 판매, 수리, 개조에 관여하는 광범위한 기업과 조직으로 구성됩니다. 매출 기준으로 세계 최대 산업 중 하나입니다(프랑스처럼 16%인 나라부터 슬로바키아처럼 40%에 이르는 나라까지)."
 VEN_port_of_puerto_cabello: "푸에르토카베요 항"
 VEN_port_of_puerto_cabello_desc: "Puerto Cabello is situated on the NW coast of Venezuela, approx 120km W of Caracas. The port situated here is the most important one for our economy, as it lays on one of the best waters in the region and has the necessary equipment for unloading the biggest cargo ships. Investing on this port is vital for the economical growth of our country, be it to build military or civilian ships."
 VEN_attract_american_tourists: "미국인 관광객 유치"
 VEN_attract_american_tourists_desc: "When it comes to South America, American tourists preffer to visit the countries of Brazil,Argentina and Chile, and while this may not seem like a big issue to us, the money from American visitors could certainly help us get extra funds. A good way to increase our tourism is to spend on civilian businesses focused towards providing entertainment for those foreigners."
 VEN_infrastructure_investments: "인프라 투자"
 VEN_infrastructure_investments_desc: "The Venezuelan infrastructure is really good compared to other south american countries, however it is not the best it could be by any chance. With the help from the western economies giving us extra funds one way or another, we must ensure these funds go to the right places and help us achieve an even greater infraestructure."
 VEN_purging_corrupt_officials: "부패 관리 숙청"
 VEN_purging_corrupt_officials_desc: "베네수엘라는 높은 윤리 기준을 지키고 투명성을 증진하며 전국에 청렴 문화를 조성하는 것을 목표로 합니다. 이는 우리 위대한 국가의 장기적인 성공과 발전에 기여할 것입니다."
 VEN_joint_weapon_system_lab: "합동 무기 체계 연구소"
 VEN_joint_weapon_system_lab_desc: "World-class scientists and engineers have been creating cutting-edge technologies for warfighters at military laboratories for nearly 100 years, and a Sept. 28 hearing on Capitol Hill focused on technologies being developed today for future wars.Laboratory directors from all three services addressed innovation through science and engineering in support of military operations during a hearing of the House Armed Services Committees emerging threats and capabilities subcommittee."
 VEN_venezuelian_fifth_gen: "베네수엘라 5세대"
 VEN_venezuelian_fifth_gen_desc: "Modernization The AMV purchased 50 f 16planes from USA as a result Venezuelan engineers started to look where it could be improved and with that they created the prototype of the Venezuelian fifth Gen fighter jets."
 VEN_army_westernization: "군의 서구화"
 VEN_army_westernization_desc: "베네수엘라 군은 역사를 거치며 많은 개혁과 변화를 겪었으며, 오늘날 우리는 또 한 번 완만한 속도의 변화를 원합니다. 이번에는 서방과 더 긴밀한 관계를 맺고자 하며, 서방과 전체적으로 협력할 수 있도록 함으로써 분쟁에서 서로를 도울 수 있게 하려는 것입니다."
 VEN_us_import_policy: "미국 수입 정책"
 VEN_us_import_policy_desc: "우리는 물품이 여러 규제 절차의 승인을 받아야 하고 그 절차에서 수입자와 수출자 모두가 각자의 서류를 갖추어 참여해야 하는 미국의 군수품 수입 모델을 따르고자 합니다. 우리는 미국 무기를 우리나라로 수입하는 것을 더 쉽게 또는 더 어렵게 만들 수 있으며, 이에는 대가가 따를 수도 있습니다."
 VEN_navy_import_convoys: "수입 호송 선단"
 VEN_navy_import_convoys_desc: "Our weaponry imports, and our good exports require us to expand our merchant navy by a considerable amount, while we may be able to build new convoys, maybe directly buying american convoys its a good option, we can kill two birds with a single stone when doing this."
 VEN_navy_dockyards: "조선소 증설"
 VEN_navy_dockyards_desc: "The increasing needs for a bigger convoy production - together with the need to bolster our navy if we ever were to need it to defend our country from agressors has led us to invest in building new dockyards."
 VEN_navy_import_corvette: "초계함 수입"
 VEN_navy_import_corvette_desc: "영국 해군으로부터 초계함 제조 설계도를 수입하는 것은 연구 개발 면에서 세계 다른 해군들을 따라잡는 동안의 좋은 임시 방편입니다. 이렇게 하면 자금을 다른 곳에 배정하면서 매우 존경받는 나토 회원국과 관계도 쌓을 수 있습니다."
 VEN_licenses_for_american_humvees: "미국 험비 면허 생산"
 VEN_licenses_for_american_humvees_desc: "험비는 우리 같은 나라에 완벽한 플랫폼입니다. 다양한 임무를 수행할 수 있고 전군에서 사용할 수 있으며, 미국으로부터 생산 면허를 직접 받으면 그들과의 무역 항로에 의존하지 않고 우리 영토에서 생산할 수 있습니다."
 VEN_licenses_for_american_small_arms: "미국 소화기 면허 생산"
 VEN_licenses_for_american_small_arms_desc: "미국이 우리에게 험비를 제공했으니, 이제 우리 병사들을 위한 무기의 면허도 제공받도록 해야 합니다. 이는 탄약과 부품을 공유하며 우리 군이 나토와 EU의 군대와 더욱 긴밀하게 결속됨을 의미하기 때문입니다."
 VEN_licenses_for_american_artillery: "미국 야포 면허 생산"
 VEN_licenses_for_american_artillery_desc: "The multiple agreements we have done with the Americans for their weaponry has opened us the option to obtain access to their artillery - which is inherently british. Making a licensed version of an already proven system its benefitiary to us, since we cant spare equipment for mass-testing."
 VEN_import_american_humvees: "미국 험비 수입"
 VEN_import_american_humvees_desc: "군을 재무장하는 데는 막대한 노력이 필요하지만, 장비를 미국에서 주문한다면 그 노력을 크게 줄일 수 있습니다. 험비를 인도받으면 구형 차량 일부를 현대화하는 데 큰 도움이 될 것입니다."
 VEN_import_american_small_arms: "미국 소화기 수입"
 VEN_import_american_small_arms_desc: "The most important factor in our rearming its the firearm we give to those who serve under our flag, we must ensure the best equipment is used, and right now, the best avaliable option is to buy rifles from the US, that should satisfy our needs."
 VEN_import_american_artillery: "미국 야포 수입"
 VEN_import_american_artillery_desc: "우리 부대에 적절한 야포가 심각하게 부족한 상황은 바라지 않는 일입니다. 미국제 야포 플랫폼을 구매함으로써 포병 여단에서 원하는 수준을 유지할 수 있습니다."
 VEN_form_us_brigade: "미군 여단 편성"
 VEN_form_us_brigade_desc: "미군이 우리나라의 새 기지에 도착함으로써 어느 정도는 우리 병사와 미군 병사로 이루어진 연합 여단을 편성할 수 있게 되었습니다."
 VEN_import_american_jets: "미국 전투기 수입"
 VEN_import_american_jets_desc: "우리는 수년 전 미국산 F-16을 도입하여 운용한 경험이 있으며, 조종사들 또한 훌륭한 피드백을 보내왔습니다. 따라서 항공 전력을 증강하는 가장 확실한 방법은 이미 검증된 기종인 F-16C를 도입하여 리스크를 줄이는 것입니다."
 VEN_airbase_investments: "공군 기지 투자"
 VEN_airbase_investments_desc: "If we wish to have flexibility when stationing our aircrafts, we must improve our air bases in the country, this way, we can field either our own aircraft or our allied aircrafts directly from our homeland, making it much easier to handle a strategical air warfare against any possible enemy or threat."
 VEN_own_military_production: "자체 군수 생산"
 VEN_own_military_production_desc: "To keep up with other armed forces in the world we need to increase our military production! Its the only way to keep stabilty in the Caribbeans. "
 VEN_establish_us_military_base: "미군 기지 설치"
 VEN_establish_us_military_base_desc: "In order for us to become a full ally of the United States, a good suggestion would be for us to seek the US to implement military bases on our country, this would reinforce the idea that we allign with their ideals, and at the same time, with the ones of NATO."
 VEN_major_non_nato_partner: "주요 비나토 동맹국"
 VEN_major_non_nato_partner_desc: "최근 주요 비나토 동맹국 지위로 격상된 것은 우리 국제 관계의 중대한 진전입니다. 이 조치는 세계 평화와 협력에 대한 우리의 의지를 보여 줍니다. 새로운 지위는 남아메리카에 위치한 우리의 전략적 입지를 활용하여 나토 회원국들과 더 긴밀히 협력할 기회를 제공합니다. 이 파트너십은 외교사의 이정표이며 다자주의와 세계 안보에 대한 헌신을 알리는 신호입니다."
 VEN_communists_up_north: "북쪽의 공산주의자들"
 VEN_communists_up_north_desc: "We now officially label Cuba as a Communist State, therefore positioning ourselves on the same side as many of our newly-found allies, it is a statement that ensures that there can be no doubt about our allignment in the world stage."
 VEN_meet_the_cubans: "쿠바인들과의 만남"
 VEN_meet_the_cubans_desc: "Even through we label them as a communist state, we have decided to agree to a meeting between our leaders, perhaps we can find common ground, or we can hear what decides our minds about what actions to take in regards to them in the future."
 VEN_cooperation_with_cuba: "쿠바와의 협력"
 VEN_cooperation_with_cuba_desc: "Through our meeting we have found certain common grounds - they might not be as huge as we wish they could be, but it gives us some pilars to build into when regarding our political paradigma with the other caribbean nations, if they can help us help them, then we may have found new allies in the region."
 VEN_anti_cuban_stance: "반쿠바 입장"
 VEN_anti_cuban_stance_desc: "The meeting has resulted in the worst of our fears - the Cubans do not agree with our vision, or our politics, or in fact, anything at all. While the issue is limited to our countries, it is still a very important theme for the countries arround us, and our new allies in the west. A conflict might be brewing between our countries."
 VEN_infiltrate_our_spies: "첩보원 침투"
 VEN_infiltrate_our_spies_desc: "If we wish to gain the upper hand in the political game between us and the cubans, intelligence is of the utmost importance, we must ensure to build a intelligence network to predict every single one of their moves, as the conflict between our nations seems to only grow and has caused a rupture between our relations."
 VEN_soft_cuban_influence: "쿠바에 대한 연성 영향력"
 VEN_soft_cuban_influence_desc: "While we may not agree on everything with the Cubans, we can start slowly promoting our views and ideals on their country while not looking aggresive towards them, reasoning with people is a much better way to approach things than direct violence. However, if it comes down to it, we might have to resort to more direct approaches."
 VEN_coup_in_cuba: "쿠바 쿠데타"
 VEN_coup_in_cuba_desc: "The development of the situation in Cuba has ended in the worst possible outcome ; a coup has been executed, and the country has once again fallen into despair, we tried the best way to re-shape the Cuban government without this abrupt measure, but sometimes, our hands are forced and extreme actions must be taken."
 VEN_cuban_trade_relations: "쿠바와의 무역 관계"
 VEN_cuban_trade_relations_desc: "쿠바와의 무역 관계는 최근 몇 년간 꾸준히 개선되어 왔습니다. 두 나라는 여러 무역 협정과 협력을 통해 경제적 유대를 강화하여 더 큰 협력과 경제 성장을 촉진했습니다. 이 진전은 양국 관계의 긍정적인 걸음이며 양국 경제에 이익을 줄 잠재력이 있습니다."
 VEN_caribbean_trade_market: "카리브해 무역 시장"
 VEN_caribbean_trade_market_desc: "우리의 영향력은 여러 카리브해 국가에서 높아지고 있습니다. 이러한 지역 역학의 변화는 카리브해의 정치·경제 지형을 형성하는 우리의 끊임없이 확대되는 역할을 부각합니다. "
 VEN_venezuelan_industry: "베네수엘라 산업"
 VEN_venezuelan_industry_desc: "Our industry is based mainly arround the extraction of resources, with a few metalurgic industries arround the main industrial areas, by making sure to always be evolving the extraction and construction methods we can continue to flourish."
 VEN_economic_reforms: "경제 개혁"
 VEN_economic_reforms_desc: "우리의 자원과 풍부한 지하 토양을 최대한 활용하려면 경제를 개혁해야 합니다."
 VEN_regional_infrastructural_development: "지역 인프라 개발"
 VEN_regional_infrastructural_development_desc: "Some of the Regional Infraestructure in our country is severely under-developed in comparison to our main capital, by reallocating funds and also focusing on the forgotten areas, we can atleast try to match the development of the main areas of the country."
 VEN_development_in_the_north: "북부 개발"
 VEN_development_in_the_north_desc: "The North of our country is where most of our wealth resides - mainly because of their rich oil reserves and the big cities located on the region, however there is still plenty to be improved in terms of infraestructure."
 VEN_central_development: "중부 개발"
 VEN_central_development_desc: "Llanos is a relatively rural area, mostly developed in areas where the oil reserves reside. Expanding infraestructure, mainly the development of smaller cities and the towns which are home to those working in our oil fields will go a long way in improving our country."
 VEN_eastern_development: "동부 개발"
 VEN_eastern_development_desc: "In the East, Anzoátegui is the 3rd biggest region in terms of population, while the region of Bolívar isnt as big in terms of population it makes up for it for being the only place in our country where Steel and precious lighter metals are found, this regions must not be abandoned and must be developed in order to keep up with the need for constant internal expansion of our country."
 VEN_southern_development: "남부 개발"
 VEN_southern_development_desc: "The South of our country is our rightful piece of the Amazonas. While not much development has been done in this area, there is still smaller towns and logging industries residing there, by providing them with an easier access to other regions, we can help the region develop at a similar pace to our bigger, richer sector of the north."
 VEN_connecting_carcas_and_riohacha: "카라카스와 리오아차 연결"
 VEN_connecting_carcas_and_riohacha_desc: "Caracas being our capital is the starting point of most of our highways and the end point of most goods and resources, those resources then get exported from their ports. Riohacha is home to off-shore and on-shore oil deposits, therfore connecting the region to Caracas is of utmost importance for our economy."
 VEN_orinoquia_bridge: "오리노키아 다리"
 VEN_orinoquia_bridge_desc: "The Orinoquia Bridge is a project with the goal of further enhancing in-country connection across the Orinoco River, this bridge is built near Ciudad Guayana, and its a crucial inter-connectional project."
 VEN_guayana_port: "과야나 항"
 VEN_guayana_port_desc: "As it stands, Caracas posseses the only significant port in the whole country, this is not inherently a problem, but it can become one really quick if anything were to stop the port service for a prolonged period of time. By building a smaller port near the second biggest city of our country, we can have a port that can reinforce the sea lanes on our country."
 VEN_improving_internet_access: "인터넷 접근성 개선"
 VEN_improving_internet_access_desc: "With the ever-growing need of internet access in the modern age, improving network infraestructure in the biggest cities of our country is primordial if we wish to streamline many communications between our people and our regional governments."
 VEN_diversifying_the_economy: "경제 다각화"
 VEN_diversifying_the_economy_desc: "Oil is the main driving factor of our economy, but completely relying on it is not efficient or the recommended approach to our economy, by improving the conditions of other industries arround the country we will try and incentivize different types of industries to be settled in our country."
 VEN_expanding_Venezuelan_airlines: "베네수엘라 항공사 확장"
 VEN_expanding_Venezuelan_airlines_desc: "우리나라가 내륙 깊은 곳의 자원을 수송하고 수출하려면 항공사가 필요합니다. 항공사에 자금을 투입함으로써 국내 시설을 확장할 수 있게 하고, 이는 다시 전국의 비행장 확장에 자금을 투자하도록 도울 것입니다."
 VEN_domestic_manufacturing_desc: "Depending on external imports completely its a big issue on the long term, as if our ties to the exterior are ever to be broken, our economy can quickly fall on itself. By preparing beforehand for having, atleast, our basic needs covered by our own country, we can make sure that we both expand the wealth of our own people but we also regain some level of independence from external countries."
 VEN_car_manufacturing_hub: "자동차 제조 거점"
 VEN_car_manufacturing_hub_desc: "남아메리카의 자동차 제조업은 과거에 훨씬 큰 규모였으나 점차 쇠퇴했으며, 대륙에 남은 유일한 대형 자동차 제조국은 브라질입니다. 우리는 우리나라에 자동차 제조 산업을 세우려 노력해야 합니다. 이는 국민에게 이익이 되며 다른 나라들에 도미노 효과를 일으킬 수도 있습니다."
 VEN_agriculture_expansion: "농업 확장"
 VEN_agriculture_expansion_desc: "나라의 남부, 그리고 북부와 동부의 상당 부분도 여전히 농업에 크게 의존하고 있습니다. 우리나라의 농민들에게 보조금을 지급함으로써 전반적인 생활 수준을 개선할 수 있습니다."
 VEN_fundacion_villa_del_cine: "빌라 델 시네 재단"
 VEN_fundacion_villa_del_cine_desc: "통신망을 확충하는 것은 나라를 발전시키는 중요한 부분입니다. 다양한 유형의 시청각 예술을 창작할 수 있는 전용 공간을 나라에 세우는 것은 큰 도움이 될 것이므로, 빌라 델 시네 재단의 설립은 대체로 좋은 생각입니다."
 VEN_build_up_of_tourist_businesses: "관광 산업 육성"
 VEN_build_up_of_tourist_businesses_desc: "Other countries in South America have a big number of tourists, while we have a lot of them, we dont have nearly as many as we could have if we invested more resources into that sector of our economy. Lets make sure we allocate more funds for it."
 VEN_finance_sectors: "금융 부문"
 VEN_finance_sectors_desc: "경제를 앞으로 나아가게 하는 좋고 안전한 방법은 새로운 금융 부문을 만드는 것이며, 이는 비교적 낮은 비용으로 추가 수입을 가져다줄 것입니다. "
 VEN_fishing_sectors: "어업 산업 부문"
 VEN_fishing_sectors_desc: "우리 해안선에는 다양한 어업 부문이 자리하고 있습니다. 가능한 한 생태계를 근본적으로 훼손하지 않으면서 이를 적절히 활용하고 확장해야 합니다."
 VEN_foresty_industry: "임업"
 VEN_foresty_industry_desc: "Since we own part of the Amazonas, our forestry industry is mostly located in the southern part of the country, investing into that region will provide us with extra income from forestation, and with proper care, it wont damage the amazonas too much."
 VEN_canvim_build_up: "카빔 증강"
 VEN_canvim_build_up_desc: "Building up our only military goods producer, CAVIM, is a important part of our economy, it also helps us produce our own equipment so our reliance on purchasing equipment from outside is reduced."
 VEN_ending_the_rentier_state: "지대 국가 청산"
 VEN_ending_the_rentier_state_desc: "우리나라는 영토 내에서 방대한 유전을 발견한 이래 줄곧 지대 국가로 살아왔습니다. 그러나 이제는 이러한 관념을 반드시 끝내야 합니다."
 VEN_cater_to_the_labour_unions: "노동조합 수용"
 VEN_cater_to_the_labour_unions_desc: "국내 노동조합은 더 많은 대표성을 요구하고 있으며, 우리가 협력한다면 남부 지역에 투자하겠다고 약속하고 있습니다. 이는 장기적으로 더 나은 경제 상황으로 이어질 수 있습니다."
 VEN_becoming_an_investment_hub: "투자 중심지로의 도약"
 VEN_becoming_an_investment_hub_desc: "더 이상 지대 국가가 되지 않기로 결정한 만큼, 이를 보완하기 위해 다른 나라들의 투자를 유치해야 합니다. 과거에 부과된 과도한 규제를 줄이고 외국 기업을 위한 사무소를 확충한다면 변화를 더 순조롭게 만들 수 있습니다."
 VEN_joining_globalized_trade: "세계화된 무역 참여"
 VEN_joining_globalized_trade_desc: "국가는 무역 절차의 간소화와 국제 상거래 장벽의 제거를 최우선으로 삼습니다. 베네수엘라는 무역을 촉진하는 데 더욱 능숙해져 국경을 넘나드는 상품과 서비스의 효율적인 흐름을 보장합니다."
 VEN_ending_oil_dependency: "석유 의존 탈피"
 VEN_ending_oil_dependency_desc: "While we are very rich in Oil, and most of our economy is driven by it, we must not let it completely take over our economy, we must diversify and expand the already existant industries in our country not affilliated to it."
 VEN_privitazing_job_sectors: "Privitazing Job Sectors"
 VEN_privitazing_job_sectors_desc: "정부는 민영화로 이익을 얻을 수 있는 특정 일자리 부문을 신중하게 선별합니다. 이러한 부문에는 제조업, 기반시설 개발, 서비스업 등이 포함될 수 있으며, 민간 투자와 경쟁이 효율성을 높일 수 있습니다."
 VEN_investing_into_construction: "건설 투자"
 VEN_investing_into_construction_desc: "건설에 투자하면 건설 부문에서 고용 기회가 창출되어 실업률 감소와 경제 성장에 기여할 것입니다."
 VEN_renewable_energy_investments: "재생 에너지 투자"
 VEN_renewable_energy_investments_desc: " Venezuela's investments into renewable energy reflects a resolute commitment to transitioning toward green energy solutions. The government aims to reduce the nation's reliance on fossil fuels and embrace renewable resources like wind, solar, and hydroelectric power."
 VEN_encouraging_hydropower: "수력 발전 장려"
 VEN_encouraging_hydropower_desc: "베네수엘라는 수력 발전 기반시설의 개발과 확장에 전념합니다. 여기에는 수자원의 에너지 잠재력을 활용하기 위한 댐, 저수지, 발전소의 건설이 포함됩니다."
 VEN_extracting_metals: "귀금속 채굴"
 VEN_extracting_metals_desc: "정부는 귀중한 천연자원, 특히 금과 다이아몬드 같은 귀금속을 활용하려는 국가의 노력을 강조합니다. 이러한 중점은 경제 성장과 국가 발전을 위해 광물 자원을 개발하려는 베네수엘라의 의지를 구현합니다."
 VEN_acheiving_nuclear_power: "원자력 확보"
 VEN_acheiving_nuclear_power_desc: "베네수엘라는 현대 세계에서 원자력의 잠재력을 인식하고 평화적인 원자력 프로그램 개발을 목표로 삼습니다. 정부는 에너지 생산과 의료 응용 같은 민간 목적으로 원자력 기술을 사용하는 것을 강조합니다."
 VEN_the_oil_issue: "석유 문제"
 VEN_the_oil_issue_desc: "국가는 경제적 번영이 세계 석유 시장과 복잡하게 얽혀 있음을 인식합니다. 생산, 가격, 무역 협정에 관한 결정은 베네수엘라의 재정 안정과 경제 성장에 매우 중요합니다."
 VEN_foreign_oil_ventures: "해외 석유 사업"
 VEN_foreign_oil_ventures_desc: "정부는 석유 산업을 개발하고 현대화하기 위해 적극적으로 외국인 투자를 모색합니다. 이는 생산량과 수입을 늘릴 뿐 아니라 기술 교류와 전문 지식도 촉진합니다."
 VEN_chevron: "셰브런"
 VEN_chevron_desc: "세계 최대 석유 기업 중 하나인 셰브런은 베네수엘라에서 상당한 입지를 갖고 있습니다. 베네수엘라의 풍부한 석유 매장량은 이 나라를 셰브런의 사업을 위한 매력적인 장소로 만들었습니다."
 VEN_shell: "셸"
 VEN_shell_desc: "Shell is an Ango-Dutch firm and the third-largest company in the world. Its resources and expertise accumulated over more than a century could be a great asset for Venezuela"
 VEN_cnpc: "CNPC"
 VEN_cnpc_desc: "중국석유천연가스집단공사(CNPC)는 베네수엘라 에너지 부문의 주요 참여자로 부상했습니다. 상호 호혜적인 경제 협력 관계 속에서 CNPC는 베네수엘라 석유 산업에 막대한 투자를 했으며, 이 나라의 방대한 석유 자산에 대한 접근권을 확보했습니다."
 VEN_rosneft: "로스네프트"
 VEN_rosneft_desc: "이 협력은 베네수엘라 석유 자원의 탐사, 채굴, 수출에 초점을 맞춥니다. 로스네프트의 전문 지식과 투자는 베네수엘라 석유 산업의 개발과 확장에 기여합니다."
 VEN_russian_development: "러시아 개발"
 VEN_russian_development_desc: "양국은 석유와 가스 분야의 전문 지식 교류를 포함하여 에너지 부문에서 협력할 기회를 모색합니다. 이러한 동반자 관계는 베네수엘라 경제를 향상시킬 잠재력을 지니고 있습니다."
 VEN_american_business_ventures: "미국 기업 사업"
 VEN_american_business_ventures_desc: "베네수엘라는 미국 기업들의 제휴와 투자를 적극적으로 모색합니다. 정부는 주요 산업을 되살리고 경제 성장을 촉진할 잠재력을 인식하여 외국 자본과 전문 지식을 위한 매력적인 환경을 조성하는 데 전념하고 있습니다."
 VEN_british_investments: "영국 투자"
 VEN_british_investments_desc: "베네수엘라 정부는 경제를 강화하기 위해 영국의 투자를 유치하고자 적극적으로 노력합니다. 영국 기업과 기업가들이 베네수엘라를 자본 투입처로 고려하도록 장려하기 위해 각종 혜택과 우호적인 사업 환경을 제공합니다."
 VEN_american_oil_deal: "미국 석유 협정"
 VEN_american_oil_deal_desc: "이 협정에는 베네수엘라 내 미국의 투자와 이익을 보호하는 조항이 포함되어 있습니다. 이러한 보호 장치는 외국 투자자들을 안심시키고 석유 부문의 장기적인 안정을 보장하는 것을 목표로 합니다."
 VEN_adopting_global_technologies: "세계 기술 도입"
 VEN_adopting_global_technologies_desc: "베네수엘라는 기술적으로 앞선 국가들과의 협력과 제휴를 적극적으로 모색합니다. 이러한 협력은 전문 지식의 교류, 연구의 공유, 첨단 기술에 대한 접근을 촉진합니다."
 VEN_securing_the_oil: "석유 확보"
 VEN_securing_the_oil_desc: "The government centers on safeguarding and maximizing the nation's valuable oil resources. It is the nations commitment to ensuring the security of its primary economic asset and exploiting it to the fullest extent."
 VEN_supports_belt_road: "일대일로 지지"
 VEN_supports_belt_road_desc: "베네수엘라는 현 정부 아래 중국과 전략적 동반자 관계를 맺고, 경제적 유대를 강화하고 상호 발전을 촉진하는 수단으로 일대일로 구상을 받아들입니다. 양국은 기반시설 사업과 무역 협정에서 협력하기로 서약합니다."
 VEN_joining_brics: "BRICS 가입"
 VEN_joining_brics_desc: "BRICS 가입은 베네수엘라에 세계에서 가장 역동적인 경제국들과 같은 테이블에 앉을 자리를 제공합니다. 이는 잠재적인 무역 협정, 투자 기회, 다양한 시장에 대한 접근의 문을 열어 국가의 경제 전망을 높여줍니다."
 VEN_pdvsa_drilling_expansion: "PDVSA 시추 확대"
 VEN_pdvsa_drilling_expansion_desc: "베네수엘라는 방대한 석유 자원을 더욱 활용하고 세계적인 석유 생산국으로서의 위상을 높이기 위해 야심 찬 여정에 나섭니다."
 VEN_venezuelan_steel_works: "베네수엘라 제강소"
 VEN_venezuelan_steel_works_desc: "Venezuela is commitmented to developing a domestic steel industry, providing the nation with a self-sustaining source of steel production."
 VEN_venezuelan_aluminium_industry: "베네수엘라 알루미늄 산업"
 VEN_venezuelan_aluminium_industry_desc: "베네수엘라는 알루미늄 생산 역량을 확대하는 여정에 나섭니다. 국영 산업과 민간 산업이 협력하여 생산량을 늘리며, 국내 수요 충족에 초점을 맞추는 한편 수출 기회도 모색할 수 있습니다."
 VEN_fight_poverty: "빈곤과의 싸움"
 VEN_fight_poverty_desc: "정부는 국민의 복지와 국가의 안정을 보장하기 위해 빈곤 문제를 해결하는 것이 시급하다고 인식합니다."
 venezuela.1.t: "소환 선거"
 venezuela.1.d: "소환 선거가 곧 치러질 예정입니다. 이 선거로 위대한 지도자께서 자리에서 쫓겨날 위험이 있습니다. 어떻게 대처해야 하겠습니까? 민주적 절차를 전복하여 선거를 시작부터 중단시킬 수도 있고, 민주주의의 등불로서 선거를 진행하도록 허용할 수도 있습니다. "
 venezuela.1.a: "선거를 예정대로 실시한다."
 venezuela.1.b: "사소한 선거일 뿐이다..."
 venezuela.2.t: "소환 국민투표 결과"
 venezuela.2.a: "국민이 말했다."
 venezuela.2.b: "새로운 선거를 실시해야 한다."
 venezuela.5.t: "야당 시위 격화"
 venezuela.5.d: "News from Caracas report that our protestors managed to attack and even takeover government buildings. More and more police and military officers are changing sides and supporting our revolution. It looks like government officials are rushing out of the country and we will soon have a total control over Venezuela. What should we do with the previous regime supporters?"
 venezuela.5.o1: "남은 빨갱이들을 숙청하라!"
 venezuela.5.o2: "돈으로 문제를 해결하라!"
 venezuela.14.t: "미래에 대한 의문"
 venezuela.14.d: "As the junta consolidateds its grip on power, the people of Venezuela can't help but question the direction their nation is heading. Dissent growing, not only in the streets but also within the ranks of the military itself. The junta, sensing the growing unrest, is faced with a dilemma. They can double down on their authoritarian rule, further alienating their citizens and risking international condemnation, or they can choose a different path. Some voices within the junta argued for a negotiated transition to democracy, recognizing that a peaceful resolution might be the only way to salvage Venezuela's future."
 venezuela.14.a: "미래는 우리에게 무엇을 준비하고 있을까?"
 venezuela.15.t: "결단"
 venezuela.15.d: "국가가 불확실성의 벼랑 끝에서 흔들리는 가운데, 군사 정권이 내리는 선택이 베네수엘라가 어두운 길을 계속 걸을지, 아니면 민주주의적 열망을 되찾고 분열된 사회를 재건할 길을 찾을지를 결정할 것입니다. 전 세계의 눈이 베네수엘라에 쏠려 있으며, 우리의 고난에 찬 조국에 평화와 번영을 되찾아줄 해결책을 바라고 있습니다."
 venezuela.15.a: "서방 성향 독재자들이 이끌 것이다."
 venezuela.15.b: "우익 포퓰리스트가 이끌 것이다."
 venezuela.15.c: "The Facist will lead."
 venezuela.8.t: "퀴라소 문제"
 venezuela.8.d: "베네수엘라 국민과 이들이 세계에 제시하는 이야기에 따르면, 전략적 위치와 번성하는 항구를 가진 퀴라소는 식민지 시대에 네덜란드에 부당하게 빼앗기기 전까지 베네수엘라의 역사적 유산의 일부였습니다. 섬에 네덜란드가 존재하는 것은 지속적인 식민지 착취이며, 이제 퀴라소가 정당한 주인에게 돌아갈 때가 되었다고 이들은 주장합니다."
 venezuela.8.a: "불필요한 유혈 사태를 피할 것이다!"
 venezuela.8.b: "We will defend the kingdoms rightful sovereignty!"
 venezuela.9.t: "퀴라소 할양"
 venezuela.9.d: "[HOL.GetNameWithFlag] 본국에서는 이 제안이 격렬한 논쟁을 불러일으켰습니다. 일부 정치인들은 이를 네덜란드의 이익에 대한 배신으로 보았고, 다른 이들은 비용이 많이 드는 해외 영토를 처분하는 실용적인 해법으로 보았습니다. 결국 네덜란드 정부는 베네수엘라와 협상을 진행하기로 결정했고, 해당 영토를 베네수엘라에 할양하는 데 동의했습니다."
 venezuela.9.a: "퀴라소 섬이 마침내 네덜란드 식민 압제자들로부터 해방되었다."
 venezuela.10.t: "네덜란드가 우리의 제안을 거부함"
 venezuela.10.d: "해외 영토를 보호하고 자결 원칙을 수호하겠다는 네덜란드 정부는 베네수엘라의 요구를 단호히 거부했습니다. 네덜란드는 퀴라소 주민들이 스스로의 운명을 선택했으며 그들의 뜻이 존중되어야 한다고 강조했습니다. 섬의 네덜란드 군 병력은 의지를 분명히 보여주는 메시지로서 증강되었습니다."
 venezuela.10.a: "외교가 끝나면 전쟁이 시작된다!"
 venezuela.11.t: "베네수엘라가 우리의 복종을 요구함"
 venezuela.11.d: "The Venezuelan government issued an ultimatum to Peru, demanding that they accept becoming a puppet nation under Venezuelan control. Promisisng economic and technological support, joint development projects, and a shared vision of protecting the Amazon's unique ecosystem. They emphasized the importance of unity among Amazonian nations to fend off potential external threats from foreign powers eyeing the region's wealth. The ultimatum was delivered with a stern warning: refusal would result in military action!"
 venezuela.11.o1: "그들의 지배에 복종할 것이다."
 venezuela.11.o2: "우리의 주권을 수호할 것이다"
 venezuela.12.t: "페루가 압력에 굴복함"
 venezuela.12.d: "궁지에 몰려 베네수엘라의 힘에 저항할 수 없다고 느낀 페루는 마지못해 조건에 동의하고 괴뢰국이 되었습니다. 베네수엘라 군대는 페루 전역의 주요 지점에 주둔했고, 베네수엘라 고문들이 페루 정부를 장악했습니다. 공식적인 설명은 이를 지역을 안정시키기 위한 자애로운 조치로 포장했지만, 실제로는 베네수엘라가 자국의 이익을 확보하고 남아메리카에서 영향력을 넓히기 위한 전략적 권력 행사였습니다."
 venezuela.12.o1: "베네수엘라의 우위가 커진다!"
 venezuela.13.t: "페루가 압력에 굴하지 않음"
 venezuela.13.d: "페루는 베네수엘라의 요구에 단호하면서도 절제된 거부로 응답했습니다. 페루는 자결에 대한 의지와 외부의 간섭 없이 자국의 사안을 스스로 통치할 권리를 강조했습니다."
 venezuela.13.o1: "그들은 우리의 군사력을 마주하게 될 것이다!"
 venezuela.16.t: "운하 요구"
 venezuela.16.d: "역사적 권리 의식을 지닌 베네수엘라 지도부는 이러한 역사적 부당함으로 인식되는 것을 바로잡는 것이 자신들의 책임이라고 주장합니다. 이들은 파나마가 이탈한 지방이므로 마땅히 베네수엘라의 통제 아래 있어야 한다고 주장했습니다. 또한 이 조치가 역사적 연속성을 회복하고, 지역 안정을 높이며, 분열된 국가로 보는 것을 재결합시키려는 오랜 염원을 이루는 일이라고 주장합니다."
 venezuela.16.o1: "We will sumbit to their rule"
 venezuela.16.o2: "우리의 주권을 위해 싸울 것이다"
 venezuela.17.t: "압력에 굴복함"
 venezuela.17.d: "잠재적인 군사 침략의 그림자 아래, 국가 주권이 위태로운 상황에서 파나마는 마지못해 우리의 제안을 받아들였습니다. 가슴이 찢어지는 결정을 강요받은 파나마 지도부는 당장의 피해로부터 국가를 지킬 수 있다고 믿는 길을 택했습니다. 이들은 소중한 독립을 대가로 치르는 결정임을 알면서도 우리와 협력하기로 동의했습니다."
 venezuela.17.o1: "돌아온 것을 환영한다!"
 venezuela.18.t: "물러서지 않음"
 venezuela.18.d: "그러나 파나마는 주권을 유지하겠다는 의지가 확고했습니다. 파나마 정부는 한 세기 이상 전에 파나마의 독립을 인정한 국제 조약과 협정을 인용하며 우리의 역사적 주장에 맞섰습니다. 파나마는 자국의 주권은 이미 확정된 사안이며 협상의 대상이 아니라고 주장했습니다."
 venezuela.18.o1: "멍청이들!"
 venezuela.19.t: "[VEN.GetName](이)가 우리에게 조약 체결을 원함!"
 venezuela.19.d: "The [VEN.GetAdjective]'s have asked us to sign a treaty that would hold us accountable for ensuring their safety. In exchange, we will receive some influence in their nation."
 venezuela.19.a: "좋은 생각이다, 서명하자"
 venezuela.19.b: "안된다"
 venezuela.20.t: "[USA.GetName](이)가 우리의 조약을 수락함!"
 venezuela.20.d: "[USA.GetName](이)가 우리의 안전을 보장하는 조약에 서명하기로 동의했습니다. 감사를 표하기 위해 우리도 같은 조치를 취하는 것이 현명합니다."
 venezuela.20.a: "물론이지"
 venezuela.21.t: "[USA.GetName](이)가 조약 서명을 거부함!"
 venezuela.21.d: "[USA.GetName](이)가 우리의 조약에 서명하기를 거부했으며, 이는 그들이 우리를 보호하지 않겠다는 뜻입니다!"
 venezuela.21.a: "슬프군"
 venezuela.22.t: "[VEN.GetName](이)가 기지를 요청함"
 venezuela.22.d: "[VEN.GetName](이)가 우호의 표시로 공동 군사 기지를 설치해 달라고 요청했습니다. 우리가 잃을 것은 아무것도 없습니다."
 venezuela.22.a: "알겠다"
 venezuela.22.b: "안된다"
 venezuela.23.t: "[USA.GetName](이)가 기지를 거부함"
 venezuela.23.d: "[USA.GetName](이)가 공동 군사 기지 제안을 거부했습니다."
 venezuela.23.a: "안타깝군"
 venezuela.200.t: "[VEN.GetName](이)가 무역 협정을 제안함"
 venezuela.200.d: "Diplomats from [VEN.GetNameWithFlag] have come to use today to discuss the proposal of trade deals with them. It is possible that forming this trade with our two nations will improve relations and economic growth in both of our nations. How should we proceed?"
 venezuela.200.a: "협정을 수락한다"
 venezuela.200.b: "협정을 거절한다"
 venezuela.201.t1: "[FROM.GetName](이)가 협정을 수락함"
 venezuela.201.t2: "[FROM.GetName](이)가 협정을 거절함"
 venezuela.201.d1: "In an historic turn of events, we now have an trade agreement with [FROM.GetName]. It will be the foundation of a new relationship between our great nations preparing us for the future and beyond. It's time for a new found celebration as we have forged new and lasting ties with another major nation."
 venezuela.201.d2: "안타깝게도 [FROM.GetName](이)가 무역 협정을 거절했습니다. 외교에는 슬픈 날입니다. 우리 외교관들은 빈손으로 돌아왔습니다."
 venezuela.201.a: "마침내"
 venezuela.201.b: "유감이다"
 gca.1.t: "동맹 초청"
 gca.1.d: "그란콜롬비아 동맹이 출범하여 그란콜롬비아의 깃발 아래 단일 전선을 형성하자는 초청장을 보내왔습니다. 시몬 볼리바르가 이끌었던 19세기 남아메리카 통합의 꿈을 역사적으로 재결합시키는 이 세력은 콜롬비아, 베네수엘라, 에콰도르, 파나마, 페루를 결속시켜 정치적, 군사적 힘을 통한 지역의 번영, 안정, 주권을 추구합니다."
 gca.1.a: "그란콜롬비아 만세!"
 gca.1.b: "초청을 거절한다."
 gca.2.t: "초청 수락"
 gca.2.d: "이 수락으로 귀국은 19세기에 시몬 볼리바르가 구상한 남아메리카 통합의 선구적 꿈을 되살리고자 하는 단일 전선의 핵심 구성원이 됩니다."
 gca.2.a: "우리 품에 온 것을 환영한다!"
 venezuela.6.t: "가장 영향력 있는 정당을 둘러싸고 시작되는 논쟁..."
 venezuela.6.d: "... 사건을 통해!"
 venezuela.6.o1: "친서방 독재 세력"
 venezuela.6.o2: "보수주의자"
 venezuela.6.o3: "민중의 의지"
 venezuela.6.o4: "새로운 시대"
 venezuela.50.t: "미국산 군사 장비 수입 전략"
 venezuela.50.d: "미국과의 우호적인 관계를 고려할 때, 우리 부처의 일부 인사들은 미국에서 수입할 경우 할인을 받을 수 있다고 믿고 있습니다. 어떤 전략을 선택해야 하겠습니까?"
 venezuela.50.o1: "관계를 더욱 개선하기 위해 정가를 지불할 것이다."
 venezuela.50.o2: "소폭의 할인은 그들에게는 별것 아니지만 우리에게는 큰 도움이 된다."
 venezuela.50.o3: "납세자의 돈을 아끼기 위해 약간의 양보를 얻어내자."
 venezuela.50.o4: "다른 곳에도 돈이 필요하다. 관계에 다소 손해를 보더라도 최대한 절약하자."
 venezuela.100.t: "헌법 제정 선거"
 venezuela.100.d: "The new constitution of our country was signed and adopted into law late last year in December of 1999. It made substantial changes to our current state of affairs, and it is required by law for us to hold new elections to validate our new constitution. It will also be the first election [VEN.GetLeader] can run for the first of his new six-year presidential terms. It's a new dawn for Venezuela... Can a contender take [VEN.GetLeader] place?"
 venezuela.100.a: "그렇게 시작되는군..."
 venezuela.101.t: "소환 서명을 수집하는 수마테"
 venezuela.101.d: "수마테는 유권자 참여 부족을 문제 삼는 우리나라의 시민운동 단체입니다. 이들의 목표는 베네수엘라 선거와 국민투표에서 높은 투표율을 달성하는 것입니다. 지난 8년간 모든 선거에서 기권이 대규모로 발생했기 때문에 [VEN.GetLeader]이(가) 부당하게 당선되었다는 비난에서 비롯된 운동입니다. 수마테에 따르면 이들은 누가 권력을 잡든 상관하지 않으며, 선출된 공직자들이 법치를 존중하기를 바랄 뿐입니다. 모든 선거에서 기권율이 높았으므로, 이들은 가장 최근 선거를 뒤집고 반쯤은 부정이었다고 주장되는 선거로 당선된 [VEN.GetLeader]을(를) 소환하고자 합니다."
 venezuela.101.a: "그렇다면, 그래야겠군..."
 VEN_suns_seize_power: "§H태양 카르텔§!이(가) 권력을 §R장악§!합니다"
 VEN_cartel_strength_required: "§H카르텔 세력§!이 최소 §H50§! 이상이어야 합니다"
 VEN_farc_decisions: "§HFARC 격멸§! 결정을 잠금 해제합니다"
 VEN_farc_war_begins: "§HFARC§!에 대한 §R전쟁§!을 시작합니다"
 VEN_us_import_policy_loc1: "중점을 통한 구매 가격은 무기 시장과 §R동일§!합니다. 중점을 통해 장비를 구매할 때마다 미국의 대외 영향력이 §G1%§! 감소하고, 미국의 우리에 대한 관계가 §G5§! 증가합니다."
 VEN_us_import_policy_loc2: "중점을 통한 구매 가격이 무기 시장 가격보다 약 §G10%§! 감소합니다."
 VEN_us_import_policy_loc3: "중점을 통한 구매 가격이 무기 시장 가격보다 약 §G20%§! 감소합니다. 중점을 통해 장비를 구매할 때마다 미국의 대외 영향력이 §R0.5%§! 증가합니다."
 VEN_us_import_policy_loc4: "미국의 우리에 대한 관계가 충분한 동안, 중점을 통한 구매 가격이 무기 시장 가격보다 약 §G30%§! 감소합니다. 중점을 통해 장비를 구매할 때마다 미국의 대외 영향력이 §R1%§! 증가하고, 미국의 우리에 대한 관계가 §R5§! 악화됩니다."
 VEN_encouraging_hydropower_TT: "생산되는 수력 발전량이 §G25%§! 증가합니다"
 VEN_removal_of_plan_bolivar_TT: "§Y제5공화국§!이 집권 §R중이 아니라면§! §G차베스의 정신§!이 제거됩니다"
 VEN_trade_deals_tt: "[THIS.GetNameWithFlag](이)가 우리의 무역 협정을 수락할 경우:\n"
 VEN_more_is_better: "우리와의 관계가 §G높을수록§! §C수락할 가능성이 더 높아집니다§!!"
 VEN_iron_control_vdp: "PDVSA에 대한 철권 통제"
 VEN_relation_TT: "§R관계가 좋을수록 우리에게 주를 넘겨줄 가능성이 높아집니다!§!"
 VEN_nationalize_foreign_industry_TT: "외국 기업의 §Y공장 3개§!를 국유화합니다!\n"
 bolivarian_economy: "차베스식 경제 구상"
 bolivarian_economy_desc: "Chávez ideas of a Venezuelan economy were based around oil, the country's biggest resource deposit. Chávez also created many welfare programs and state companies, essentialy promoting a state-run economy with populist ideals."
 foreign_focused_investment: "개정된 경제 모델"
 foreign_focused_investment_desc: "라인식 자본주의 경제 모델은 다가오는 투쟁에서 우리에게 도움이 되지 않을 것입니다. 이제 우리의 혁명에 맞게 사회주의적 특성이 혼합된 새로운 자본주의 모델을 채택하도록 구상을 조정할 때입니다."
 collective_industries: "집단 산업"
 collective_industries_desc: "우리의 산업 중심지는 생산 능력과 속도에 집중하지 않고, 노동자들에게 좋은 임금과 사회적 지원을 제공하는 데 집중합니다."
 efficient_industries: "효율적인 산업"
 efficient_industries_desc: "우리 경제는 이제 효율성 제고에 집중하고 있으며, 이는 생산을 늘리지만 대중의 지지는 감소시킵니다."
 press_filled_with_propaganda: "선전으로 가득 찬 언론"
 press_filled_with_propaganda_desc: "우리 언론은 국가가 소유하고 있으며 선전으로 가득 차 있어 정권에 대한 대중의 지지를 높입니다."
 press_free: "자유 언론"
 press_free_desc: "우리 언론은 독립 기업이 소유하고 있으며, 우리와 우리 정책에 대해 원하는 대로 이야기합니다."
 indoctrinated_army: "사상 교육을 받은 군대"
 indoctrinated_army_desc: "우리 국군은 사회주의적, 혁명적 이념을 철저히 주입받아 우리의 사회주의 정부를 훨씬 더 강하게 지지합니다."
 professional_army: "전문 군대"
 professional_army_desc: "Our army is focus on professional forces and strong high command."
 recent_agrarian_reform: "최근의 농업 개혁"
 recent_agrarian_reform_desc: "이제 국가의 농업 부문에 관한 정책을 앞장서서 개혁할 때입니다."
 pdvsa: "PDVSA"
 pdvsa_desc: "Petróleos de Venezuela, S.A. is the Venezuelan state-owned oil and natural gas company. It was founded in 1976 pairing with the nationalization of the Venezuelean oil industry. PDVSA has dominated the oil industry of Venezuela, the world's fifth largest oil exporter."
 enlisted_oil_plant_workers: "징집된 석유 시설 노동자"
 enlisted_oil_plant_workers_desc: "석유 산업 노동자를 군에 편입시켜 이 두 핵심 부문 사이에 독특한 국가적 시너지를 창출합니다. 국가의 방어와 자원 관리를 강화하는 것을 목표로 합니다."
 international_work: "국제 운동"
 international_work_desc: "베네수엘라는 외교적 관여에 더욱 중점을 둡니다. 국가는 다른 국가들과의 동맹, 무역 협정, 외교적 동반자 관계를 적극적으로 모색합니다."
 VEN_anti_opposition_movement: "반야당 운동"
 VEN_anti_opposition_movement_desc: "대립하는 이념이나 정치적 반대 의견에 적극적으로 맞서 이를 억압합니다."
 VEN_opposition_strengthened: "강화된 야당"
 VEN_opposition_strengthened_desc: "몇 가지 신중한 변화와 여기저기 약간의 자금으로 야당이 우리 정부에서 더 적극적으로 활동하도록 장려할 수 있습니다."
 VEN_improved_spies: "쿠바 친민주주의 첩보 작전"
 VEN_improved_spies_desc: "쿠바 내 민주주의적 이상에 공감하는 베네수엘라 요원들이 수행하는 비밀 활동입니다. 이러한 은밀한 지원은 민주주의적 가치를 육성하고 쿠바의 내부 역학에 영향을 미치는 것을 목표로 합니다."
 VEN_CUB_venezuelan_democratic_influence: "베네수엘라의 민주주의적 영향력"
 VEN_CUB_venezuelan_democratic_influence_desc: "지역 강국인 베네수엘라는 이웃 나라 쿠바에 상당한 영향력을 행사해 왔으며, 특히 민주주의 원칙을 옹호하고 더욱 개방적인 정치 분위기를 조성하는 데 힘써 왔습니다."
 faction_gran_colombia_alliance_member: "그란콜롬비아 동맹 회원국"
 faction_gran_colombia_alliance_member_desc: "그란콜롬비아라는 더 넓은 동맹 내에서의 국가 회원 자격입니다. 이 지역 연합의 일원이 됨으로써 얻는 공동의 목표, 협력, 잠재적 이점을 공유합니다."
 VEN_expanded_diplomacy: "확대된 외교"
 VEN_expanded_diplomacy_desc: "베네수엘라는 세계적 관여와 협력의 정신에 이끌려, 외교적 영향력을 확대하고 전 세계 국가들과 더 강한 유대를 형성하기로 결심했습니다."
 VEN_idea_eradicating_socialism: "부패 척결"
 VEN_idea_eradicating_socialism_desc: "부패는 우리 위대한 국가를 좀먹는 역병이며, 이제 국내의 부패를 끝낼 때입니다."
 VEN_idea_greater_venezuela: "대베네수엘라"
 VEN_idea_greater_venezuela_desc: "베네수엘라의 역사적, 영토적 또는 이념적 야망과 결부된 열렬한 염원과 민족 정체성을 나타내며, 국가에 독특한 특성과 목표를 부여합니다."
 VEN_venezuela_militarism_idea: "베네수엘라 군국주의"
 VEN_venezuela_militarism_idea_desc: "군사력과 방어에 대한 뿌리 깊은 강조로, 베네수엘라 내 군의 상당한 문화적, 정치적 영향력을 반영합니다. "
 VEN_idea_defense_of_lands: "필사적 방어"
 VEN_idea_defense_of_lands_desc: "절박한 상황 속에서도 외부 위협으로부터 주권과 영토를 맹렬히 지키려는 국가의 결의입니다. "
 VEN_idea_forious_attack: "맹렬한 공격"
 VEN_idea_forious_attack_desc: "베네수엘라의 고조된 군사 대비 태세와 전투에서의 공세적 자세입니다."
 VEN_idea_autarky: "베네수엘라 자급자족"
 VEN_idea_autarky_desc: "자급자족을 확립하고 해외 무역과 자원에 대한 의존을 줄이겠다는 결의입니다."
 VEN_aggresive_foriegn_policy_idea: "Aggresive Foreign Policy"
 VEN_aggresive_foriegn_policy_idea_desc: "Our diplomatic stance must change to a much more aggresive stance. It is time we move forward and campaign against our enemies and strong arm our way into strength."
 VEN_reestablish_the_military_industrial_complex_idea: "군사력 증강"
 VEN_reestablish_the_military_industrial_complex_idea_desc: "군사 역량을 계속 확대한다면 남아메리카에서 더욱 강력한 입지를 확립할 수 있습니다."
 VEN_attack_on_america_spirit: "아메리카 공격"
 VEN_attack_on_america_spirit_desc: "America has done nothing but destroy our country and destroy the America's with their so called Monroe Doctrine. It is time we show them who is the boss."
 VEN_Empire_of_Evil_idea: "악의 제국"
 VEN_Empire_of_Evil_idea_desc: "주로 권위주의적이거나 공격적인 정책과 행동 때문에 다른 나라들이 바라보는 국가의 모습입니다. 이는 국제 관계에 영향을 미치며 외교, 관계, 다른 국가들의 인식에 영향을 줄 수 있습니다."
 VEN_brain_drain: "두뇌 유출"
 VEN_brain_drain_desc: "베네수엘라가 겪는 어려움 속에서, 숙련된 전문가, 지식인, 고학력자들이 더 나은 기회를 찾아 해외로 떠나며 막대한 손실이 발생하고 있습니다. 이러한 지적 자본의 유출은 국가의 성장과 발전에 심대한 영향을 미칩니다."
 VEN_brain_drain_reversal: "두뇌 유출 역전"
 VEN_brain_drain_reversal_desc: "고도로 숙련된 전문가들의 이민을 막고 귀국을 장려하며, 해외의 인재를 유치하기 위한 베네수엘라의 선제적 조치입니다."
 VEN_FARC_active: "콜롬비아 무장혁명군 (FARC)의 활동"
 VEN_FARC_active_desc: "콜롬비아 무장혁명군 (FARC)는 콜롬비아와 서 베네수엘라에서 활동 중인 마르크스-레닌주의 게릴라 집단입니다. 그들은 서쪽 국경의 산맥을 근거지로 삼고 있습니다."
 VEN_outdated_army_idea: "시대에 뒤떨어진 군대"
 VEN_outdated_army_idea_desc: "베네수엘라 군은 낡았고, 예산이 부족하며, 개혁이 절실합니다. 국경 밖으로 힘을 투사하고자 한다면 낡은 군대를 개혁해야 합니다."
 VEN_rejuvinated_army: "개혁된 군대"
 VEN_rejuvinated_army_desc: "훈련, 조직, 교리의 개혁을 통합한 군대의 포괄적인 변혁입니다."
 VEN_better_generals: "더 나은 장군들"
 VEN_better_generals_desc: "군 내 장군들의 자질과 효율성을 높이기 위한 전담 프로그램입니다. "
 VEN_cost_effectiveness: "비용 효율성"
 VEN_cost_effectiveness_desc: "군사 활동에서의 효율적인 자원 활용입니다."
 VEN_loyal_military: "충성스러운 군대"
 VEN_loyal_military_desc: "국가 지도부에 대한 군의 헌신과 충성으로, 정부와 군대 사이의 안정적이고 협조적인 관계를 보장합니다."
 VEN_tourist_destination: "새로운 관광 명소"
 VEN_tourist_destination_desc: "관광을 장려하기 위해 국가의 자연 경관, 문화유산, 다양한 명소를 홍보하고 개발하려는 집중적인 노력입니다."
 VEN_nato_standards: "Venezuelean-NATO Standards"
 VEN_nato_standards_desc: "NATO의 관행을 채택하거나 이에 맞추려는 베네수엘라의 노력으로, 군사, 외교, 전략 분야에 영향을 미칠 수 있습니다."
 VEN_us_import_policy_fair: "미국 수입 정책"
 VEN_us_import_policy_fair_desc: "미국과의 무역 및 경제적 교류에 대한 국가의 접근 방식입니다. 미국과의 수입 규제 및 무역 관계에 관련된 정책과 협정의 영향입니다."
 VEN_reached_out_to_cuba: "쿠바에 손을 내밈"
 VEN_reached_out_to_cuba_desc: "쿠바 내에서 유대를 강화하고 영향력을 높이려는 베네수엘라의 의도적인 노력입니다."
 VEN_against_cuba: "쿠바에 맞서라!"
 VEN_against_cuba_desc: "쿠바에 대한 베네수엘라의 적대감이 심화되었으며, 쿠바의 위협으로 인식되는 상황에 맞서 국가의 군사 대비 태세와 단호한 자세가 고조되었습니다."
 VEN_idea_monopolist_economy: "독점 경제"
 VEN_idea_monopolist_economy_desc: "베네수엘라의 경제 부문은 소수의 기업 또는 단체의 통제 아래 있습니다."
 VEN_population_effort: "인구 동원 노력"
 VEN_population_effort_desc: "베네수엘라는 가용 인력이 눈에 띄게 증가하며, 이는 다양한 국가적 사업에 대한 국민의 참여와 관여가 높아졌음을 반영합니다."
 VEN_based_land: "탄탄한 국토"
 VEN_based_land_desc: "베네수엘라의 민족 정체성의 초석으로서 국가의 경제력, 전략적 중요성, 성장 잠재력을 형성합니다."
 VEN_idea_libertarian_economy: "자유지상주의 경제"
 VEN_idea_libertarian_economy_desc: "이 정책은 경제 성장을 촉진하기 위해 자유 시장 원칙과 규제 완화에 중점을 둡니다."
 VEN_rainforest_protectors: "열대우림 수호자"
 VEN_rainforest_protectors_desc: "우리나라와 세계를 기후 변화로부터 지키기 위해서는 열대우림을 반드시 보호해야 합니다."
 VEN_armed_proletariat: "무장한 프롤레타리아트"
 VEN_armed_proletariat_desc: "노동력이 경제의 원동력일 뿐 아니라 사회 구조의 방어와 유지에도 적극적으로 참여하는 사회입니다."
 VEN_self_sacrifice: "자기희생"
 VEN_self_sacrifice_desc: "베네수엘라 국민이 개인의 이익보다 국가의 안녕을 우선시하려는 의지를 강조합니다."
 VEN_state_equality: "국가 평등"
 VEN_state_equality_desc: "사회적 격차를 해소하고 더욱 평등한 사회를 증진하려는 노력입니다. "
 ven_leader_cult: "지도자 숭배"
 ven_leader_cult_desc: "대개 국가 원수나 저명한 정치인인 단 한 명의 카리스마 있는 지도자에 대한 극단적인 집중과 우상화를 상징합니다. "
 VEN_china_trade_deal: "중국-베네수엘라 무역 협정"
 VEN_china_trade_deal_desc: "Sino-Venezuelean trade deals have been signed establishing deeper ties with the countries."
 VEN_russia_trade_deal: "러시아-베네수엘라 무역 협정"
 VEN_russia_trade_deal_desc: "Russo-Venezulean trade deals have been signed establishing deeper ties with the countries."
 VEN_political_war: "정치 전쟁"
 VEN_political_war_desc: "국내외에서 경쟁하는 이념, 정당, 세력 간의 지속적인 투쟁을 구현하며, 이는 내부 분쟁과 불화를 초래합니다."
 VEN_plan_bolivar_idea: "볼리바르 계획"
 VEN_plan_bolivar_idea_desc: "볼리바르 계획 2000은 베네수엘라 대통령 우고 차베스 정부 아래 시행된 볼리바르 미션 가운데 첫 번째였습니다. 이 계획은 약 4만 명의 베네수엘라 군인을 투입하여 대규모 예방접종 운동, 빈곤 지역 식량 배급, 교육 활동을 포함한 포괄적인 빈곤 퇴치 사업을 벌이는 것입니다. 또한 군용 수송기와 헬리콥터를 통해 수천 명의 빈곤층 및 환자 베네수엘라인을 저렴한 비용으로 수송하여 일자리 기회와 의료 서비스에 접근할 수 있도록 합니다."
 ven_improved_transport_plane_production: "개선된 수송기 생산"
 ven_improved_transport_plane_production_desc: "제조 공정을 간소화하여 생산성을 높이고 항공기 조립의 소요 시간을 단축합니다."
 agriculture_sectors_idea: "농업 부문"
 agriculture_sectors_idea_desc: "국가 경제 안정의 초석으로서 다양한 농업 부문을 육성하고 발전시키겠다는 의지를 나타냅니다."
 VEN_american_oil_deals: "미국 석유 협정"
 VEN_american_oil_deals_desc: "베네수엘라는 미국 기업들과의 유리한 석유 협정으로 수입 증가와 경제 안정을 누립니다. 이러한 협정은 경제 성장을 이끌고, 정부 프로그램의 재원을 마련하며, 국가 전반의 번영에 기여합니다."
 VEN_innovative_techniques: "혁신적인 기법"
 VEN_innovative_techniques_desc: "베네수엘라는 연구 개발을 중시하며 여러 분야에서 신흥 기술의 최전선에 서고자 합니다."
 budding_petrostate: "신생 산유국"
 budding_petrostate_desc: "베네수엘라는 급속도로 성장하는 석유 강국으로 향하는 길목에서 세계 무대에 설 준비가 되었습니다. 우리는 최강 수출품으로 우리 스스로를 미래로 인도할 것입니다. 바로 석유를 통해서 말이죠."
 VEN_Education_and_scientific_reforms_idea: "교육 및 과학 개혁"
 VEN_Education_and_scientific_reforms_idea_desc: "인적 자본, 혁신, 기술 발전의 개발과 육성에 대한 전념을 구현합니다."
 VEN_civilian_defense: "민방위"
 VEN_civilian_defense_desc: "대비 문화와 시민 참여를 촉진하여 민간인들이 국가의 방어 조치에 적극 참여하도록 장려합니다."
 VEN_the_people: "국민"
 VEN_the_people_desc: "사회 전반에 스며든 통일된 정체성과 공동의 목적 의식을 나타냅니다."
 VEN_reinforced_mandatory_services: "강화된 의무 복무"
 VEN_reinforced_mandatory_services_desc: "모든 시민은 복무해야 합니다."
 VEN_end_of_mandatory_services: "징병제 폐지"
 VEN_end_of_mandatory_services_desc: "군이 앞으로 나아가려면 징병제는 끝나야 합니다. 이제 군을 지원병 중심으로 재편할 때입니다."
 VEN_attract_foreign_investors_idea: "외국 자본 유치"
 VEN_attract_foreign_investors_idea_desc: "Attracting foreign capital into our nation can help boon our nation to help move forward."
 VEN_joint_oil_extraction: "공동 석유 채굴"
 VEN_joint_oil_extraction_desc: "전략적 접근 방식으로, 국내 석유 자원의 채굴, 생산, 유통을 극대화하기 위해 외국 단체와의 제휴를 강조합니다."
 bolivarian_revolutions: "볼리바르 혁명"
 bolivarian_revolutions_desc: "남아메리카의 존경받는 해방자 시몬 볼리바르의 이름을 딴 볼리바르 운동의 지속적인 유산을 집약합니다. "
 populist_president: "포퓰리즘 대통령"
 populist_president2: "국민의 대통령"
 economic_managers: "경제 관리자"
 VEN_mission_vuelta_al_campo_modifier: "농촌으로 돌아가기"
 VEN_mission_vuelta_al_campo_modifier_desc: "Mission Vuelta Al Campo (Return to the Countryside) sought to assist willing impoverished and unemployed Venezuelans in the cities to move to the countryside. It would help spurn economic growth in areas while also providing a new life for these destitute Venezueleans and expand the economic base of the country."
 VEN_oil_deal: "무기를 위한 거래"
 VEN_rejected_deal: "거절된 제안"
 VEN_friendship: "베네수엘라 우호"
 VEN_friendship_cuba: "쿠바 우호"
 VEN_friendship_brazil: "브라질 우호"
 VEN_friendship_argentina: "아르헨티나 우호"
 VEN_reached_to_usa: "미국에 손을 내밈"
 VEN_reached_out_to_cuba_modifier: "쿠바에 손을 내밈"
 venezuela_allies_Tech_Share_name: "베네수엘라 기술 공유"
 VEN_balance_teachers_wages_desc: "교사들은 오랫동안 저임금에 시달려 왔습니다! 교사가 없으면 교육이 없고, 교육이 없으면 우리나라에는 미래가 없습니다!"
 VEN_domestic_manufacturing: "국내 제조업"
 VEN_begin_adaptation_to_nato_standards: "나토 표준 적용 개시"
 VEN_begin_adaptation_to_nato_standards_desc: "Venezuela's decision to adapt NATO standards marks a significant departure from its previous policies. This shift underscores the country's willingness to align with international norms and enhance its compatibility with NATO member states. The adoption of NATO standards has the potential to impact various aspects of Venezuela's military and security practices, reflecting a changing dynamic in the nation's international relations and security strategy."
 VEN_caribbean_peacekeeper: "카리브해 평화 유지군"
 VEN_caribbean_peacekeeper_desc: "지역의 화합과 안정에 대한 우리의 의지에 따라, 우리는 평화 유지 임무에 착수했습니다. 이는 분쟁을 해결하고 상호 이해를 증진하며 카리브해에서 평화와 협력의 기둥이 되겠다는 국가의 헌신을 반영합니다."
 VEN_peace_in_the_caribbean: "카리브해의 평화"
 VEN_peace_in_the_caribbean_desc: "The Caribbean finally after decades have been stabilized; theres no wars or civil wars and the US is keeping the region safe. We shall thank the US for providing us the opportunity to live in a peaceful region."
 VEN_untether_the_oil: "석유의 속박 해제"
 VEN_untether_the_oil_desc: "베네수엘라의 석유 부문은 국가가 엄격히 통제하는 국가 경제의 초석이었습니다. 그러나 경제적 어려움과 비효율이 산업을 압박하여 접근 방식의 중대한 변화가 불가피해졌습니다."
 venezuela.24.t: "우고 차베스의 죽음"
 venezuela.24.d: "니콜라스 마두로 부통령은 오늘 우고 차베스 대통령이 사망했다고 발표했습니다. 마두로에 따르면 차베스는 수년간 '힘겨운 병'과 싸워 왔으며, 대통령 경호실장은 그가 심각한 심장마비를 일으켰다고 밝혔습니다. 원인이 무엇이든 우고 차베스는 세상을 떠났고, 부통령이 새 선거가 치러질 때까지 대통령 권한대행을 맡게 됩니다. 마두로는 차베스가 직접 고른 후계자로 널리 인식되고 있으며 대통령직을 노리고 있습니다. 그가 다음 대통령이 되어 스승의 길을 따를지는 시간이 말해줄 것입니다."
 venezuela.24.a: "볼리바르 혁명의 영웅"
 hand_chosen_successor: "직접 선택한 후계자"
 VEN_exploit_our_oil_reserves: "석유 매장량 개발"
 VEN_exploit_our_oil_reserves_desc: "베네수엘라는 특히 서반구에서 세계 최대 규모의 확인 석유 매장량을 보유하고 있으며, 따라서 우리는 매장량을 계속 개발해야 합니다. 국내 여러 지역의 확인된 자원을 개발하는 데 자원을 투입하기 시작한다면 석유 생산 능력을 크게 늘릴 수 있습니다."
 VEN_exploit_eastern_anzoategui_venezuelan_oil_reserves: "[916.GetName] 석유 매장량 개발"
 VEN_exploit_eastern_anzoategui_venezuelan_oil_reserves_desc: "[916.GetName]의 굴착 기술과 인프라에 투자함으로써 이 지역의 막대한 석유 매장지를 활용할 수 있습니다. 이 사업에는 상당한 초기 투자가 필요하지만 국가 생산량에 석유 8단위를 추가할 것입니다."
 VEN_exploit_eastern_bolivar_venezuelan_oil_reserves: "[876.GetName] 석유 매장량 개발"
 VEN_exploit_eastern_bolivar_venezuelan_oil_reserves_desc: "[876.GetName] 지역에는 상당한 미개발 석유 매장량이 있습니다. 현대적 굴착 기술을 활용하면 이 자원을 채굴하여 생산 능력에 석유 8단위를 추가할 수 있으며, 주요 산유국으로서의 입지를 강화할 수 있습니다."
 VEN_hydroelectric_decision_category: "수력 발전 확대 장려"
 VEN_hydroelectric_decision_category_desc: "석유가 풍부한 나라임에도 불구하고, 우리는 모든 베네수엘라인이 저렴한 전기를 이용할 수 있도록 보장하기 위해 국민을 위한 추가 전력원이 필요합니다. 수력 발전은 지속 가능하고 비용 효율적인 해결책을 제공합니다."
 VEN_construct_the_tocoma_hydro_power_plant: "§Y토코마 댐§! 건설"
 VEN_construct_the_tocoma_hydro_power_plant_desc: "토코마 댐은 [876.GetName]에 건설될 대규모 수력 발전 시설로, 이 지역에 상당한 청정 에너지를 공급할 것입니다. 건설에는 약 2년이 걸리고 15억 달러가 들지만, 1.415 GW의 발전 용량과 3.6 TWh의 저장 용량을 추가할 것입니다."
 VEN_construct_caruachi_hydro_power_plant: "§Y카루아치 댐§! 건설"
 VEN_construct_caruachi_hydro_power_plant_desc: "카루아치 댐은 [876.GetName]의 수력 발전 인프라에 대한 더 큰 규모의 투자입니다. 비용은 25억 달러이고 건설 기간은 2년이며, 이 시설은 1.415 GW의 발전 용량과 3.6 TWh의 에너지 저장 용량을 제공할 것입니다."
 venezuela_allies_Tech_Share_desc: "베네수엘라 동맹의 회원국들은 기술을 함께 공유합니다."
 VEN_land_development_desc: ""
 gca.3.t: "초청 거절"
 gca.3.d: "그란콜롬비아 동맹 가입 초청이 거절되었습니다. 통합된 남아메리카라는 볼리바르의 꿈은 기다려야 할 것입니다."
 gca.3.a: "그들의 손해다."
 venezuela.2.d1: "국가선거관리위원회가 소환 국민투표의 최종 결과를 발표했습니다. 유권자 다수가 [VEN.GetLeader]의 해임안을 부결시켜, 대통령은 현재 임기의 잔여 기간 동안 직무를 수행할 수 있게 되었습니다. 정부 지지자들은 거리로 나와 환호하고 있으며, 야당은 투표에서 자신들의 운동이 실패했음을 받아들일 수밖에 없게 되었습니다."
 venezuela.2.d2: "국가선거관리위원회가 소환 국민투표의 최종 결과를 발표했습니다. 유권자 다수가 [VEN.GetLeader]의 해임안을 지지했습니다. 대통령직은 공석이 되며, 잔여 임기 동안 누가 베네수엘라를 이끌 것인지 결정하기 위한 새로운 선거가 조직되어야 합니다."

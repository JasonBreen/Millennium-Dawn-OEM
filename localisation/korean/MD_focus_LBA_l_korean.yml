 gaddafi_family_killed_in_firefight_tt: "§R이어진 총격전에서 사망합니다!§!"
 libya_gaddafi_family_exile_muhammad_muammar: "§Y[ROOT.LBA_muhammad_muammar_gaddafi_dummy.GetName]§! 추방"
 libya_gaddafi_family_exile_saif_al_islam: "§Y[ROOT.LBA_saif_al_islam_gaddafi_dummy.GetName]§! 추방"
 libya_gaddafi_family_exile_al_saadi: "§Y[ROOT.LBA_al_saadi_gaddafi_dummy.GetName]§! 추방"
 libya_gaddafi_family_exile_mutassim: "§Y[ROOT.LBA_mutassim_gaddafi_dummy.GetName]§! 추방"
 libya_gaddafi_family_exile_hannibal: "§Y[ROOT.LBA_hannibal_gaddafi_dummy.GetName]§! 추방"
 libya_gaddafi_family_exile_ayesha: "§Y[ROOT.LBA_ayesha_gaddafi_dummy.GetName]§! 추방"
 libya_gaddafi_family_exile_saif_al_arab: "§Y[ROOT.LBA_saif_al_arab_gaddafi_dummy.GetName]§! 추방"
 libya_gaddafi_family_exile_khamis: "§Y[ROOT.LBA_khamis_gaddafi_dummy.GetName]§! 추방"
 libya_gaddafi_family_exile_desc: "때로는 자식이 리비아의 국정에 간섭하는 것이 지나칠 수 있습니다. 그런 자식은 추방하여 멀리 보내야 합니다. 어쩌면 집을 떠나 시간을 보내며 스스로를 바로잡는 법을 배울 수도 있습니다.\n\n§W§Y추방§! 중인 캐릭터의 지도자 특성은 더 이상 우리나라에 영향을 주지 않습니다. 그러나 그들이 앙심을 품고 아버지와 형제자매에 맞서 적극적으로 활동할 가능성이 있습니다. 캐릭터는 §Y불안정§!을 대가로 언제든 다시 불러들일 수 있습니다.§!"
 libya_gaddafi_family_recall_muhammad_muammar: "§Y[ROOT.LBA_muhammad_muammar_gaddafi_dummy.GetName]§! 소환"
 libya_gaddafi_family_recall_saif_al_islam: "§Y[ROOT.LBA_saif_al_islam_gaddafi_dummy.GetName]§! 소환"
 libya_gaddafi_family_recall_al_saadi: "§Y[ROOT.LBA_al_saadi_gaddafi_dummy.GetName]§! 소환"
 libya_gaddafi_family_recall_mutassim: "§Y[ROOT.LBA_mutassim_gaddafi_dummy.GetName]§! 소환"
 libya_gaddafi_family_recall_hannibal: "§Y[ROOT.LBA_hannibal_gaddafi_dummy.GetName]§! 소환"
 libya_gaddafi_family_recall_ayesha: "§Y[ROOT.LBA_ayesha_gaddafi_dummy.GetName]§! 소환"
 libya_gaddafi_family_recall_saif_al_arab: "§Y[ROOT.LBA_saif_al_arab_gaddafi_dummy.GetName]§! 소환"
 libya_gaddafi_family_recall_khamis: "§Y[ROOT.LBA_khamis_gaddafi_dummy.GetName]§! 소환"
 libya_gaddafi_family_recall_desc: "어쩌면 이 자식은 교훈을 얻었고 리비아를 위한 임무를 다시 이어 갈 준비가 되었을지도 모릅니다.\n\n§W캐릭터가 §Y추방§!에서 돌아오면 모든 지도자 특성이 다시 활성화됩니다!§!"
 libya_gaddafi_family_father_to_son_talk_muhammad_muammar: "§Y무함마드§!와의 부자 대화"
 libya_gaddafi_family_father_to_son_talk_muhammad_muammar_desc: "무함마드는 언젠가 아버지의 확실한 후계자가 될 몸이면서도 정치에 별로 관심을 가진 적이 없습니다. 아버지와 진솔한 대화를 나누면 무함마드가 다시 올바른 길로 돌아올지도 모릅니다."
 libya_gaddafi_family_sensor_internet_muhammad_muammar: "인터넷을 검열한다"
 libya_gaddafi_family_sensor_internet_muhammad_muammar_desc: "일반 우편·통신 회사(GPTC)의 회장으로서 무함마드는 리비아의 인터넷을 통제할 권한이 있습니다. 우리는 유해한 사이트를 차단하고 정권에 유리하도록 뉴스 콘텐츠를 검열할 수 있습니다."
 libya_gaddafi_family_showcase_art_saif_al_islam: "§Y사이프§!의 미술 작품을 전시한다"
 libya_gaddafi_family_showcase_art_saif_al_islam_desc: "사이프 알이슬람은 재능 있는 예술가입니다(적어도 예술가이기는 합니다). 해외 기업 후원자를 찾아 서방 어딘가에서 미술 전시회를 열어야 합니다. 전시회 이름은 §Y'사막은 침묵하지 않는다'§!로 하며, 리비아와 이슬람, 아랍 문화의 전통적인 이미지를 담을 것입니다."
 saif_al_islam_artshow_great_success_tt: "§G후원자들이 우리에게 기술 혁신을 제공합니다§!"
 saif_al_islam_artshow_success_tt: "§Y우리 문화의 전시가 세계 정치에서 우리의 입지를 굳힙니다§!"
 saif_al_islam_artshow_failure_tt: "§R우리는 망신을 당합니다§!"
 libya_gaddafi_family_discuss_succession_saif_al_islam: "§Y사이프§!와 후계를 논의한다"
 libya_gaddafi_family_discuss_succession_saif_al_islam_desc: "사이프와 후계 순서를 논의할 필요가 있을지도 모릅니다. 무함마드는 정치에 별로 관심이 없으므로, 카다피가 사망했을 때 사이프가 나라를 다스리는 편이 나을 수 있습니다. 어쨌든 그는 정치에 훨씬 더 관심이 많고 실제로도 능숙합니다."
 saif_al_islam_succession_talk_great_success_tt: "§G사이프가 §Y지정학 사상가§!를 얻습니다§!"
 saif_al_islam_succession_talk_failure_tt: "§R사이프가 §Y기동의 달인§!을 잃습니다§!"
 libya_gaddafi_family_sue_sunday_telegraph_saif_al_islam: "선데이 텔레그래프를 고소한다"
 libya_gaddafi_family_sue_sunday_telegraph_saif_al_islam_desc: "In 1995, a British newspaper The Sunday Telegraph published two article claiming that Saif al-Islam was involved in a money-laundering scheme in Cairo, with the intention of flooding Iran with fake Iranian dinars. The 2nd article claimed that after the publication of the 1st article, the author was invited to Tripoli to 'meet a sinister faith'. Both of these allegations are untrue, and we must sue the paper for libel."
 libya_gaddafi_family_improve_football_career_al_saadi: "§Y알-사디의§! 축구 경력을 상승시켜라"
 libya_gaddafi_family_improve_football_career_al_saadi_desc: "알-사디는 리비아 축구 연맹의 회장이자 국가 대표팀의 주장입니다. 그러나 이러한 직책들은 실제 실력보다는 그의 아버지로부터의 특혜로 얻은 것입니다. 그는 또한 모든 경기에 특별한 대우를 받습니다. 아마 그를 이탈리아와 같은 더 명망 있는 축구 리그로 이동시키면, 진정한 축구선수가 될 가능성이 있을까요?"
 al_saadi_football_career_great_success_tt: "§G알-사디는 §Y허영심 강한 축구 스타§!을 잃었습니다!§!"
 al_saadi_football_career_talk_failure_tt: "§R알-사디는 §Y플레이보이 라이프스타일§!을 얻었습니다!§!"
 libya_gaddafi_family_create_new_city_al_saadi: "비즈니스 도시를 건설한다"
 libya_gaddafi_family_create_new_city_al_saadi_desc: "알-사디는 리비아 서부에 비즈니스 중심의 도시를 만들자는 제안을 했습니다. 이 도시는 중국의 홍콩처럼 기능하며, 트리폴리와 튀니지 국경 사이에 위치할 예정입니다. 이 도시는 모든 외국인 투자자들에게 열려 있으며, 주요 초점은 기술 산업에 맞춰질 것입니다. 또한 이 도시는 자체 공항과 항구를 갖추어 세계와의 접근성을 용이하게 할 것입니다. 독립적인 행정 체계를 가지고, 이 도시는 전 세계에서 사람들을 환영하며, 심지어 시나고그와 교회의 건설도 허용할 것입니다. 우리는 이 프로젝트에 참여할 투자자들과 개발 회사들을 유치하기 위해 노력해야 합니다. 실질적인 변화는 수년이 걸릴 수 있지만, 이는 우리 나라에 큰 도움이 될 수 있습니다."
 libya_gaddafi_family_send_to_rehab_al_saadi: "§Y알-사디§! 재활에 보내야 한다."
 libya_gaddafi_family_send_to_rehab_al_saadi_desc: "알-사디의 약물 중독은 너무 깊어졌습니다. 그의 건강과 미래를 위해 재활 치료가 반드시 필요합니다. 현재 상태로는 회복이 어려워 보이지만, 전문가의 도움과 적절한 치료를 받으면 상황을 개선할 수 있을 것입니다."
 al_saadi_rehab_great_success_tt: "§G알-사디는 §Y약물 중독자가 아니다§!§!"
 al_saadi_rehab_failure_tt: "§R알 사디가 리비아에서 도망치다§!"
 libya_gaddafi_family_national_security_advisor_mutassim: "§Y무타심§!을 국가안보보좌관에 임명한다"
 libya_gaddafi_family_national_security_advisor_mutassim_desc: "무타심은 이제 국가에 대한 충성심을 입증했습니다. 이전의 추방에 대한 보상으로 그에게 국가안보보좌관 직책을 맡겨야 합니다."
 mutassim_gaddafi_not_revolutionary_tt: "§Y[ROOT.LBA_mutassim_gaddafi_dummy.GetName]§!은(는) 특성 §Y혁명 혐의자§!을(를) 가지고 있지 않습니다"
 libya_gaddafi_family_additional_equipment_mutassim: "§Y무타심§!에게 신규 무기 구매를 승인한다"
 libya_gaddafi_family_additional_equipment_mutassim_desc: "국가안보보좌관으로서 군이 충분한 장비를 갖추도록 하는 것은 무타심의 책임입니다. 그에게 육군을 위한 추가 장비를 구매하도록 해야 합니다."
 mutassim_gaddafi_national_security_advisor_tt: "§Y[ROOT.LBA_mutassim_gaddafi_dummy.GetName]§!은(는) 특성 §Y국가안보보좌관§!을(를) 가지고 있습니다"
 libya_gaddafi_family_civilian_education_hannibal: "§Y하니발§!에게 학위를 마칠 것을 말하라."
 libya_gaddafi_family_civilian_education_hannibal_desc: "하니발은 리비아의 해양학 아카데미에서 항해학 학사 학위를 취득했습니다. 우리는 그가 교육을 마치고 석사 학위를 취득하도록 보내야 합니다. 코펜하겐 경영대학교는 해운 경제학과 물류학 과정을 제공하며, 이는 하니발의 능력을 더욱 향상시킬 수 있는 좋은 장소로 보입니다."
 hannibal_gaddafi_is_bachelor: "§Y[ROOT.LBA_hannibal_gaddafi_dummy.GetName]§!은(는) 특성 §Y항해학 학사§!을(를) 가지고 있습니다"
 libya_gaddafi_family_military_education_hannibal: "§Y하니발§!을 쿠즈네초프 해군 아카데미로 보내세요."
 libya_gaddafi_family_military_education_hannibal_desc: "하니발은 리비아의 해양학 아카데미에서 항해학 학사 학위를 취득했습니다. 민간 교육을 이어가는 대신, 하니발은 [SOV.GetNameDef]의 쿠즈네초프 해군 아카데미에서 해양 교육을 마쳐야 합니다. 이것이 그에게 해군 관련 분야에서 더 많은 전문성을 제공할 것입니다."
 libya_gaddafi_family_send_legal_aid_ayesha: "§Y아이샤§! 법적 지원 제공"
 libya_gaddafi_family_send_legal_aid_ayesha_desc: "아이샤 카다피는 파리 1대학 판테옹-소르본 대학교에서 법학을 공부했으며, 훌륭한 변호사입니다. 세계에는 '인도에 대한 범죄'와 '전쟁 범죄'로 의심받으며 국제 사회로부터 잘못된 압박과 괴롭힘을 받는 훌륭한 국가 지도자들이 많습니다. 우리는 아이샤와 그녀의 팀을 보내어 이들의 민중을 위한 고귀한 봉사자들에게 법적 지원을 제공해야 합니다."
 libya_gaddafi_family_military_training_aid_ayesha: "§Y아이샤§!의 군사 훈련"
 libya_gaddafi_family_military_training_aid_ayesha_desc: "아이샤 카다피는 리비아 군에서 복무하며 중령 직급에 도달했습니다. 우리는 그녀를 추가적인 장교 훈련을 위해 보내고, 그녀를 대장으로 임명해야 합니다. 아마 이렇게 하면 그녀의 숨겨진 잠재력을 발휘할 수 있을 것입니다."
 ayesha_gaddafi_military_education_great_success_tt: "§G아이샤 카다피가 §Y리비아의 아마존§!을 얻습니다§!"
 ayesha_gaddafi_military_education_failure_tt: "§R아이샤 카다피가 §Y경험 부족한 장군§!을 얻습니다§!"
 libya_gaddafi_family_business_trip_saif_al_arab: "§Y사이프 알 아랍§!을 출장을 보내라!"
 libya_gaddafi_family_business_trip_saif_al_arab_desc: "사이프는 독일을 자주 방문합니다. 그래서 유럽 기업들과 사업 거래를 하기에 안성맞춤입니다. 우리는 경제와 효율을 개선하는 방법을 배울 수 있습니다."
 libya_gaddafi_family_tech_seminar_saif_al_arab: "§Y사이프 알 아랍§!을 기술 세미나에 보내라!"
 libya_gaddafi_family_tech_seminar_saif_al_arab_desc: "사이프는 독일을 자주 방문합니다. 독일에는 기술의 최전선에 있는 산업 기업이 많고, 해마다 세미나와 박람회가 열립니다. 사이프를 이런 세미나 중 하나에 보내 최신 기술 혁신을 수집해야 합니다."
 libya_gaddafi_family_military_expo_saif_al_arab: "§Y사이프 알 아랍§!을 군사 전시회에 보내라!"
 libya_gaddafi_family_military_expo_saif_al_arab_desc: "사이프는 독일을 자주 방문합니다. 독일에는 라인메탈과 헤클러 운트 코흐 같은 유명한 무기 제조사가 많습니다. 사이프를 군사 박람회에 보내 이 군수업계 거물들이 무엇을 제공하는지 살펴보아야 합니다."
 libya_gaddafi_family_give_military_command_khamis: "§Y카미스§!에게 군 지휘권을 부여한다"
 libya_gaddafi_family_give_military_command_khamis_desc: "카미스는 리비아와 러시아 프룬제 군사 아카데미에서 군사 훈련을 받았습니다. 이제 성인이 되었으므로, 그를 우리의 군 지휘관 중 한 명으로 임명하는 것이 적합할 것입니다."
 khamis_military_command_great_success_tt: "§G카미스가 위대한 §Y장군§!이 됩니다§!"
 khamis_military_command_success_tt: "§Y카미스는 평범한 §Y장군§!이 되었습니다!§!"
 khamis_military_command_failure_tt: "§R카미스는 형편없는 §Y장군§!이 되었습니다!§!"
 libya_gaddafi_family_khamis_brigade_khamis: "카미스 여단 창설"
 libya_gaddafi_family_khamis_brigade_khamis_desc: "우리는 카미스가 지휘할 특별 부대를 창설해야 합니다. 그는 카다피의 아들들 중 가장 충성도가 높은 인물이며, 그의 특별 부대는 국가 방어에 매우 중요한 역할을 할 것입니다."
 khamis_mutassim_rivalry_tt: "§R이유는 §Y무타심 가다피§!가 §Y77대 전차여대§!의 특성을 가지고 있기 때문에 형제들 간의 경쟁이 증가하여 추가적으로 §R+15§! 불안정성을 초래할 것입니다§!\n"
 libya_gaddafi_family_khamis_brigade_khamis_tt: "§Y무장 인민 증강 여단§! 부대가 창설됩니다"
 libya_gaddafi_family_aecom_khamis: "§YKhamis§!을 경영대학에 보내라!"
 libya_gaddafi_family_aecom_khamis_desc: "카미스는 주로 군사 문제에 관심이 있지만, 민간 교육도 중요한 만큼 IE 비즈니스 스쿨에서 공부할 수 있도록 보내는 것이 좋습니다. 또한, AECOM 기술 회사에서 인턴십 기회도 열려 있습니다. AECOM은 군사 기지 포함한 인프라 분야에 특화된 회사로, 카미스가 이곳에서 경험을 쌓을 수 있습니다."
 libya_gaddafi_family_hold_un_speech_gaddafi: "UN에서 연설하기"
 libya_gaddafi_family_hold_un_speech_gaddafi_desc: "이제 우리가 다시 국제 사회의 일원이 되었으므로, 우리는 유엔 총회에서 발언해야 합니다. 우리는 미국과 그들이 중동에 한 일에 대해 비판하는 연설을 해야 합니다. 이스라엘의 시온주의에 대한 우리의 반대를 선언해야 합니다. 우리는 서방이 어떻게 우리를 조롱했는지에 대해 비웃어야 합니다. 오늘은 리비아가 전 세계의 주목을 받는 날입니다!"
 libya_gaddafi_family_throw_money_gaddafi: "거리에 돈 뿌리기"
 libya_gaddafi_family_throw_money_gaddafi_desc: "많은 구호 단체와 자선 단체들이 리비아에서 활동하고 있습니다. 그러나 그들은 사실 리비아를 통제하려는 스파이에 불과합니다. 게다가 그들이 나눠주는 모든 돈은 그저 가치 없는 것입니다. 자선은 사람들에게 일을 하도록 동기를 부여하지 않습니다. 우리는 트리폴리를 지나며 돈을 거리로 던지는 행렬을 통해 우리의 주장을 증명해야 합니다. 그곳에서 그 돈은 자선 단체들이 나누어주는 것과 마찬가지로 쓸모없습니다."
 libya_gaddafi_family_design_car_gaddafi: "자동차 디자인"
 libya_gaddafi_family_design_car_gaddafi_desc: "무아마르 카다피는 훌륭한 아이디어로 가득 차 있습니다. 리비아는 현재 높은 교통 사망률에 시달리고 있습니다. 우리는 새로운 자동차 디자인을 구상해야 합니다. 이 차는 세계에서 가장 안전한 차가 될 것입니다."
 libya_gaddafi_family_design_car_gaddafi_tt: "우리가 선택한 §Y국가 정신§!을 얻어 §Y360§!일 동안 §Y다목적 차량§!을 보정합니다"
 libya_gaddafi_family_state_visit_gaddafi: "국가 방문을 조직"
 libya_gaddafi_family_state_visit_gaddafi_desc: "리비아의 국제적 위상을 높이기 위해, 우리는 주요 국가에 공식적인 국가 방문을 해야 합니다. 이를 제대로 된 쇼로 만들어 리비아가 강국임을 국민들에게 보여줄 것입니다."
 libya_gaddafi_family_do_black_magic_gaddafi: "흑마법에 관여하기"
 libya_gaddafi_family_do_black_magic_gaddafi_desc: "리비아는 공격을 받고 있으며, 우리의 정권이 위험에 처해 있습니다. 고대 아프리카의 위대한 왕들과 족장들은 적에게 저주를 내리고, 군대에 싸울 힘을 주기 위해 흑마법을 사용했습니다. 우리는 생존을 위해 같은 방법을 사용해야 합니다."
 libya_gaddafi_family_meet_women_gaddafi: "여성과의 만남"
 libya_gaddafi_family_meet_women_gaddafi_desc: "유럽의 여성들은 기독교에 의해 억압받고 있습니다. 서양에서 여성은 남성을 위한 가구일 뿐이며, 원할 때마다 바뀔 수 있습니다. 우리는 여성들에게 이슬람에 대해 교육하고 카다피를 여성의 위대한 해방자로 여기게 하는 강연을 개최해야 합니다."
 libya_gaddafi_family_hold_tv_speech_gaddafi: "TV에서 연설하기"
 libya_gaddafi_family_hold_tv_speech_gaddafi_desc: "카다피는 정기적으로 TV 연설을 하며, 리비아 시민의 질문에 직접 답하고 최신 정치 현안을 알려 주며 간섭하는 초강대국들을 맹렬히 비난합니다. 연설은 국민을 카다피 편으로 끌어들이는 훌륭한 방법입니다."
 libya_gaddafi_family_abolish_switzerland_gaddafi: "스위스 해체를 촉구한다"
 libya_gaddafi_family_abolish_switzerland_gaddafi_desc: "스위스는 왜 존재하는가? 나폴레옹, 혹은 다른 유럽 식민주의자가 만든 인위적인 국가일 뿐이다. 스위스인은 진짜 민족이 아니라 이탈리아인, 독일인, 또는 프랑스인이다. 나라 전체를 해체해야 한다."
 libya_gaddafi_family_abolish_switzerland_gaddafi_tt: "수락하면 스위스 주 하나에 대한 §Y영유권§!을 얻고 우리는 그들에 대한 영향력을 얻습니다. 그들이 §Y민족주의§!라면 수락할 가능성이 더 높습니다.\n\n"
 libya_gaddafi_family_anti_government_protests: "반카다피 시위"
 libya_gaddafi_family_anti_government_protests_desc: "The people have had enough of the ruling Gaddafi family. Poor living conditions, bad economy and limited political liberties have driven people out onto the street. If the situation doesn't improve quickly, or the Gaddafi's relinquish power, there will be an open revolt against the regime."
 libya_gaddafi_family_anti_government_protests_join_rebels_tt: "§R최대 야당이 권력을 잡습니다. 카다피 지지자들은 우리에 맞서 내전을 일으킵니다!§!"
 libya_gaddafi_family_deploy_military: "혁명수비대를 투입한다"
 libya_gaddafi_family_deploy_military_desc: "시위대를 처리하기 위해 혁명수비대를 투입해야 합니다. 혁명의 불길은 초기에 꺼야 합니다."
 libya_gaddafi_family_deploy_military_tt: "§R시위가 내전으로 번지면 반군이 더 강해집니다! 시위대에 무력을 사용하면 외국의 개입을 부를 수 있습니다!§!"
 muhammad_muammar_gaddafi_not_exiled: "§Y[ROOT.LBA_muhammad_muammar_gaddafi_dummy.GetName]§!은(는) §Y추방§!되지 않았습니다"
 saif_al_islam_gaddafi_not_exiled: "§Y[ROOT.LBA_saif_al_islam_gaddafi_dummy.GetName]§!은(는) §Y추방§!되지 않았습니다"
 al_saadi_gaddafi_not_exiled: "§Y[ROOT.LBA_al_saadi_gaddafi_dummy.GetName]§!은(는) §Y추방§!되지 않았습니다"
 mutassim_gaddafi_not_exiled: "§Y[ROOT.LBA_mutassim_gaddafi_dummy.GetName]§!은(는) §Y추방§!되지 않았습니다"
 hannibal_gaddafi_not_exiled: "§Y[ROOT.LBA_hannibal_gaddafi_dummy.GetName]§!은(는) §Y추방§!되지 않았습니다"
 ayesha_gaddafi_not_exiled: "§Y[ROOT.LBA_ayesha_gaddafi_dummy.GetName]§!은(는) §Y추방§!되지 않았습니다"
 saif_al_arab_gaddafi_not_exiled: "§Y[ROOT.LBA_saif_al_arab_gaddafi_dummy.GetName]§!은(는) §Y추방§!되지 않았습니다"
 khamis_gaddafi_not_exiled: "§Y[ROOT.LBA_khamis_gaddafi_dummy.GetName]§!은(는) §Y추방§!되지 않았습니다"
 khamis_gaddafi_not_underage: "§Y[ROOT.LBA_khamis_gaddafi_dummy.GetName]§!은(는) 특성 §Y미성년§!을(를) 가지고 있지 않습니다"
 libya_libyan_tribalism: "리비아 부족주의"
 libya_libyan_tribalism_desc: "리비아는 전통적으로 세 가지 지역으로 나누어집니다. 수도 주변의 북서부인 트리폴리타니아, 동부의 시레나이카, 그리고 남부의 페잔입니다. 역사적으로 이 지역들은 각자 스스로 통치해왔으며, 이 지역들이 하나로 통합된 것은 이탈리아의 식민지화로 인해 이루어진 일이었습니다. 리비아 왕국과 무아마르 카다피 정권이 부족 간의 구분을 대부분 없앴지만, 여전히 많은 리비아 사람들이 국가보다 자신의 부족을 먼저 인식합니다.\n\n각 지역의 충성도 수준은 해당 지역이 얻는 국가 수정자에 영향을 미칩니다. 충성도가 너무 낮아지면, 해당 지역은 반란을 일으킬 수 있습니다. 만약 한 지역이 반란을 일으키고 리비아로 다시 병합되면, 그 지역이 완전히 진압되지 않는 한 다시 반란을 조직할 수 없습니다. 그러나 국가 수정자는 여전히 영향을 미칩니다."
 LBA_tribalism_disabled_tt: "§Y$libya_libyan_tribalism$§! 메커니즘이 비활성화되었습니다"
 libya_tribalism_decentralise_state: "권력을 분산한다"
 libya_tribalism_decentralise_state_desc: "The most effective way of pleasing all Libyan tribes is to simply reduce the power of the central government. Increased autonomy, even if it is only for a limited time, will make the tribal leaders they have some power."
 libya_tribalism_placate_tripolitanians: "[TRP.GetNameWithFlag]을(를) 달랜다"
 libya_tribalism_placate_tripolitanians_desc: "Land grants, monetary benefits, military postings and government positions are key ways to keep local separatist aligned with the central state. As long as they understand that staying part of Libya has more benefits than downsides, everything is good."
 libya_tribalism_placate_cyrenaicans: "[CYR.GetNameWithFlag]을(를) 달랜다"
 libya_tribalism_placate_cyrenaicans_desc: "토지 하사, 금전적 혜택, 군 보직, 정부 직책은 지역 분리주의자들을 중앙 국가와 한 편으로 묶어 두는 핵심 수단입니다. 리비아의 일부로 남는 편이 단점보다 이점이 크다는 것을 이해하는 한, 모든 것이 순조롭습니다."
 libya_tribalism_placate_fezzans: "[FEZ.GetNameWithFlag]을(를) 달랜다"
 libya_tribalism_placate_fezzans_desc: "토지 하사, 금전적 혜택, 군 보직, 정부 직책은 지역 분리주의자들을 중앙 국가와 한 편으로 묶어 두는 핵심 수단입니다. 리비아의 일부로 남는 편이 단점보다 이점이 크다는 것을 이해하는 한, 모든 것이 순조롭습니다."
 libya_tribalism_tripolitanian_revolt: "[TRP.GetFlag] [TRP.GetAdjective] 반란"
 libya_tribalism_tripolitanian_revolt_desc: "트리폴리타니아의 부족들 사이에서 움직임이 일고 있습니다. 중앙 국가의 학대가 계속된다면 그들은 리비아로부터 분리하겠다고 맹세했습니다."
 TT_tripolitania_loyalty_more_than_10: "[TRP.GetNameWithFlag]의 충성도 > 10%"
 TT_tripolitania_loyalty_more_than_30: "[TRP.GetNameWithFlag]의 충성도 > 30%"
 libya_tribalism_cyrenaica_revolt: "[CYR.GetFlag] [CYR.GetAdjective] 반란"
 libya_tribalism_cyrenaica_revolt_desc: "키레나이카의 부족들 사이에서 움직임이 일고 있습니다. 중앙 국가의 학대가 계속된다면 그들은 리비아로부터 분리하겠다고 맹세했습니다."
 TT_cyrenaica_loyalty_more_than_10: "[CYR.GetNameWithFlag]의 충성도 > 10%"
 TT_cyrenaica_loyalty_more_than_30: "[CYR.GetNameWithFlag]의 충성도 > 30%"
 libya_tribalism_fezzan_revolt: "[FEZ.GetFlag] [FEZ.GetAdjective] 반란"
 libya_tribalism_fezzan_revolt_desc: "페잔의 부족들 사이에서 움직임이 일고 있습니다. 중앙 국가의 학대가 계속된다면 그들은 리비아로부터 분리하겠다고 맹세했습니다."
 TT_fezzan_loyalty_more_than_10: "[FEZ.GetNameWithFlag]의 충성도 > 10%"
 TT_fezzan_loyalty_more_than_30: "[FEZ.GetNameWithFlag]의 충성도 > 30%"
 libya_tribalism_dismantle_libya: "리비아를 해체한다"
 libya_tribalism_dismantle_libya_desc: "리비아는 무너졌습니다. 우리는 세 개의 주요 지역 중 두 곳을 잃었습니다. 과거의 그림자에 지나지 않는 지금, 계속 리비아라고 불러야 할 이유가 있겠습니까?"
 libya_libyan_foreign_policy: "리비아 외교 정책"
 libya_core_northern_chad: "북부 차드를 통합한다"
 libya_core_northern_chad_desc: "북부 차드는 인구가 매우 희박하고 자원이 부족합니다. 게다가 주민 대부분이 리비아 남부에도 거주하는 투부족입니다. 그래서 이 지역을 안정시키기가 비교적 쉽습니다."
 libya_core_northern_niger: "북부 니제르를 통합한다"
 libya_core_northern_niger_desc: "북부 니제르는 매우 가난한 지역이지만 리비아 전체보다 인구가 많습니다. 종교가 같다는 점이 도움이 되겠지만, 그래도 이 지역을 완전히 통제하려면 상당한 노력이 필요할 것입니다."
 libya_core_algerian_sahara: "알제리령 사하라를 통합한다"
 libya_core_algerian_sahara_desc: "사하라의 알제리 지역은 인구가 희박하고 주로 유목민으로 이루어져 있습니다. 이들 중 다수는 이미 내전 당시의 이슬람 무장 세력에 동조하고 있습니다. 이 지역을 안정시키는 데는 오래 걸리지 않을 것입니다."
 libya_core_northern_mali: "아자와드를 통합한다"
 libya_core_northern_mali_desc: "While Azawad had an existing Islamist insurgency in our favour, the region has a long history separatism and a strong Tuareg identity. The region will be very difficult to integrate."
 libya_core_mauritanian_sahara: "모리타니 사헬을 통합한다"
 libya_core_mauritanian_sahara_desc: "모리타니 주민들은 우리의 통합 노력에 매우 강하게 저항합니다. 그들은 우리 이념에 공감하지 않으며, 종교적·문화적 유대도 거의 공유하지 않습니다. 그러나 다른 모든 이들처럼 복종하게 될 것입니다."
 libya_core_palestine: "팔레스타인을 통합한다"
 libya_core_palestine_desc: "팔레스타인은 리비아에 비해 인구가 매우 많고, 팔레스타인계 무슬림과 이스라엘계 유대인이 섞여 살고 있습니다. 이 지역을 통합하기는 매우 어렵고 비용도 많이 들 것입니다."
 libya_pacify_cyrenaica: "[CYR.GetNameWithFlag]을(를) 진정시킨다"
 libya_pacify_cyrenaica_desc: "리비아 동부가 반란을 일으켰으나 우리는 그들의 보잘것없는 반란을 진압했습니다. 일부 저항이 계속될 것으로 예상되지만, 곧 이 지역을 다시 완전히 통제하게 될 것입니다."
 libya_pacify_tripolitania: "[TRP.GetNameWithFlag]을(를) 진정시킨다"
 libya_pacify_tripolitania_desc: "리비아 서부가 반란을 일으켰으나 우리는 그들의 보잘것없는 반란을 진압했습니다. 일부 저항이 계속될 것으로 예상되지만, 곧 이 지역을 다시 완전히 통제하게 될 것입니다."
 libya_pacify_fezzan: "[FEZ.GetNameWithFlag]을(를) 진정시킨다"
 libya_pacify_fezzan_desc: "리비아 남부가 반란을 일으켰으나 우리는 그들의 보잘것없는 반란을 진압했습니다. 일부 저항이 계속될 것으로 예상되지만, 곧 이 지역을 다시 완전히 통제하게 될 것입니다."
 libya_pacify_tuaregs: "[918.GetName]을(를) 진정시킨다"
 libya_pacify_tuaregs_desc: "[918.GetName]의 투아레그족에게 우리의 통치를 다시 존중하는 법을 가르쳐야 합니다."
 libya_pacify_toubou: "투부족을 진정시킨다"
 libya_pacify_toubou_desc: "투부족을 다시 리비아의 통제 아래로 되돌려야 합니다."
 libya_liberate_minorities: "[FROM.GetNameDef]의 소수민족을 해방한다"
 libya_liberate_minorities_desc: "[FROM.GetNameDef]의 소수민족이 처한 현재 상황은 견딜 수 없는 수준입니다. 우리는 이 억압받는 사람들을 위해 더 많은 자치를 요구해야 합니다."
 libya_liberate_minorities_tt: "[FROM.GetName]이(가) 우리의 요구를 받아들이면:\n"
 libya_launch_oef: "[FROM.GetAdjective] 방패 작전을 개시한다"
 libya_launch_oef_desc: "[FROM.GetNameDef]에서 극단주의가 뿌리내리고 있으며, [FROM.GetAdjective] 정부는 이를 막을 힘이 전혀 없거나 막을 의지가 없습니다. 이 병폐가 리비아로도 퍼지기 전에 신속히 행동해야 합니다."
 libya_build_rail_to_tunisia: "[TUN.GetNameWithFlag]까지 철도를 연결한다"
 libya_build_rail_to_tunisia_desc: "Tunisia to our West is a very stable country and a hotspot of European tourism. If we connect by rail there, maybe some of tourists are more likely to visit us as well."
 libya_build_rail_to_tunisia_tt: "이 사업의 비용은 $§Y4.00§!입니다.\n"
 libya_build_rail_to_tunisia_tt_2: "§R국가 정신 §Y$LBA_libyan_gauge_railroads$§!을(를) 보유하고 있으므로 비용이 두 배가 됩니다§!\n"
 libya_build_rail_to_egypt: "[EGY.GetNameWithFlag]까지 철도를 연결한다"
 libya_build_rail_to_egypt_desc: "제2차 세계 대전 중 연합군은 이집트의 솔룸에서 토브룩까지 임시 철도를 건설했습니다. 그러나 리비아 구간의 철도는 리비아 독립 이후 철거되었습니다. 수에즈 운하 해운에 더 쉽게 접근하기 위해 토브룩과 솔룸을 다시 연결해야 합니다."
 libya_build_rail_to_egypt_tt: "이 사업의 비용은 $§Y2.00§!입니다.\n"
 libya_build_rail_to_niger: "[NGR.GetNameWithFlag]까지 철도를 연결한다"
 libya_build_rail_to_niger_desc: "Niger has no existing railroads. This makes them very isolated from the world. If we build a railway there, we can bring the closer to our sphere of influence."
 libya_build_rail_to_niger_tt: "이 사업의 비용은 $§Y7.00§!입니다.\n"
 libya_build_rail_to_chad: "[CHA.GetNameWithFlag]까지 철도를 연결한다"
 libya_build_rail_to_chad_desc: "차드에는 철도가 없습니다. 우리에 대한 의존도를 높이기 위해 그들의 수도까지 철도를 건설해야 합니다. 다만 차드와 우리의 과거를 고려하면 그들이 이 거래에 동의할 가능성은 낮습니다."
 libya_build_rail_to_chad_tt: "이 사업의 비용은 $§Y6.00§!입니다.\n"
 libya_negotiations_with_un: "UN과의 진행 중인 협상"
 libya_negotiations_with_un_desc: "우리의 적대적 활동 때문에 국제 사회는 우리에게 제재를 가했습니다. 제재를 벗어나려면 무엇을 해야 하는지 결론을 내기 위해 UN과 협상해야 합니다. 국제 무대에서 처신을 잘할수록 과정은 더 빨리 진행될 것입니다."
 libya_negotiations_with_un_tt: "We will able to start the focus §Y$LBA_remove_sanctions$§!"
 libya_casablanca_accords: "카사블랑카 협정"
 libya_casablanca_accords_desc: "We are in the process of negotiation a lasting peace in Western Sahara. We need to convince all the partaking countries that our solution will work. Even if we fail to convince all countries, the majority of countries can try to enforce the solution to the opposing side. This however, can lead to an escalation of the conflict."
 libya_casablanca_accords_success_tt: "모든 대표단이 평화안에 서명했습니다 (현재 [?libya_casablanca_accords_no_of_signatories]/[?libya_casablanca_accords_no_of_participants])"
 libya_casablanca_accords_fail_tt: "대표단의 수가 2개 미만입니다 (현재 [?libya_casablanca_accords_no_of_participants])"
 libya_casablanca_accords_SHA_resistance_tt: "§R[SHA.GetNameWithFlag]이(가) 이 결정에 저항할 것입니다!§!"
 libya_casablanca_accords_MOR_resistance_tt: "§R[MOR.GetNameWithFlag]이(가) 이 결정에 저항할 것입니다!§!"
 libya_casablanca_accords_draft_solution: "서사하라 평화 해법을 초안한다"
 casablanca_accords_convince_x_tt: "§Y$libya_casablanca_accords_draft_solution$§!을(를) 완료했습니다"
 libya_casablanca_accords_hold_negotiations: "협상을 진행한다"
 libya_casablanca_accords_hold_negotiations_tt: "다른 참여국이 우리의 해법을 수락할 가능성이 갱신됩니다."
 libya_casablanca_accords_at_least_one_neg_tt: "§Y$libya_casablanca_accords_hold_negotiations$§!을(를) 최소 한 번 완료했습니다"
 libya_casablanca_accords_convince_accept_tt: "그들이 해법을 §G수락§!함"
 libya_casablanca_accords_convince_reject_tt: "그들이 해법을 §R거절§!함"
 libya_casablanca_accords_convince_target_tt: "그들이 수락할 §Y가능성§!은 최초 입장에 따라 결정됩니다. 여기에 그들에 대한 우리의 §Y영향력§!이 합산되며, 이 값에 다시 그들의 §Y관계 및 이념 성향§!이 곱해집니다.\n\n그들이 해법을 거절하면 이 결정은 §Y30일§! 후에 다시 사용할 수 있게 됩니다. 해법을 거절할 때마다 그들이 회의에서 이탈할 가능성이 있습니다.\n"
 libya_casablanca_accords_convince_morocco: "[MOR.GetNameWithFlag]을(를) 설득한다"
 libya_casablanca_accords_convince_morocco_desc: "[MOR.GetAdjective] 대표단과 논의하여 현재의 합의안을 수락할지 확인합니다."
 libya_casablanca_accords_convince_sahrawi: "[SHA.GetNameWithFlag]을(를) 설득한다"
 libya_casablanca_accords_convince_sahrawi_desc: "[SHA.GetAdjective] 대표단과 논의하여 현재의 합의안을 수락할지 확인합니다."
 libya_casablanca_accords_convince_algeria: "[ALG.GetNameWithFlag]을(를) 설득한다"
 libya_casablanca_accords_convince_algeria_desc: "[ALG.GetAdjective] 대표단과 논의하여 현재의 합의안을 수락할지 확인합니다."
 libya_casablanca_accords_convince_mauritania: "[MAU.GetNameWithFlag]을(를) 설득한다"
 libya_casablanca_accords_convince_mauritania_desc: "[MAU.GetAdjective] 대표단과 논의하여 현재의 합의안을 수락할지 확인합니다."
 libya_anti_colonial_start_revolution: "[FROM.GetNameWithFlag]에서 혁명을 준비한다"
 libya_anti_colonial_start_revolution_desc: "[FROM.GetNameDef]의 타락한 정부는 자국민을 억압합니다. 그들은 서방의 앞잡이에 지나지 않으며, 자유와 해방의 이름으로 전복되어야 합니다."
 libya_anti_colonial_start_revolution_tt_1: "§R[FROM.GetNameWithFlag]이(가) 선제적으로 우리에게 선전포고할 수 있습니다!§!\n"
 libya_anti_colonial_start_revolution_tt_2: "§G반란 측이 우리 세력에 가입합니다!§!"
 libya_oil_nationalisation_dynamic_modifier: "석유 국유화"
 TT_libya_oil_nationalisation_dynamic_modifier: "국유화 수준: §Y[?lba_oil_nationalisation|%0]§!\n추가 수입: §Y채굴된 석유§!당 $$[?oil_nationalisation_income|+3] 10억\n"
 libya_oil_nationalisation_dynamic_modifier_desc: "Much of the oil production in Libya is controlled by the National Oil Corporation. While beneficial for the state, international investments from foreign companies is limited. A higher level of nationalisation will hurt our productivity growth and make it more expensive to develop new oil fields."
 libya_gaddafi_instability_dynamic_modifier: "가문의 불안정"
 libya_gaddafi_instability_dynamic_modifier_desc: "Gaddafi's eccentricism and his insistence on favouring his children in politics causes more and more resistance from the Libyan population"

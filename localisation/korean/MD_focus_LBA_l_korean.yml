 LBA_unit_leader_trait_tripolitania: "부족 연고: 트리폴리타니아"
 LBA_unit_leader_trait_tripolitania_desc: "이 지휘관은 트리폴리타니아의 한 부족 출신입니다. 중앙 정부와 소속 부족이 충돌할 경우, 이 인물이 국가보다 부족을 택할 가능성이 있습니다."
 LBA_unit_leader_trait_cyrenaica: "부족 연고: 키레나이카"
 LBA_unit_leader_trait_cyrenaica_desc: "이 지휘관은 키레나이카의 한 부족 출신입니다. 중앙 정부와 소속 부족이 충돌할 경우, 이 인물이 국가보다 부족을 택할 가능성이 있습니다."
 LBA_unit_leader_trait_fezzan: "부족 연고: 페잔"
 LBA_unit_leader_trait_fezzan_desc: "이 지휘관은 페잔의 한 부족 출신입니다. 중앙 정부와 소속 부족이 충돌할 경우, 이 인물이 국가보다 부족을 택할 가능성이 있습니다."
 LBA_unit_leader_trait_tuareg: "부족 연고: 투아레그"
 LBA_unit_leader_trait_tuareg_desc: "이 지휘관은 리비아의 투아레그 부족 중 한 곳 출신입니다. 중앙 정부와 소속 부족이 충돌할 경우, 이 인물이 국가보다 부족을 택할 가능성이 있습니다."
 LBA_unit_leader_trait_toubou: "부족 연고: 투부"
 LBA_unit_leader_trait_toubou_desc: "이 지휘관은 리비아의 투부 부족 중 한 곳 출신입니다. 중앙 정부와 소속 부족이 충돌할 경우, 이 인물이 국가보다 부족을 택할 가능성이 있습니다."
 LBA_muammar_gaddafi_desc: "Muammar Gaddafi took power in Libya after overthrowing the Libyan monarchy in 1969. He quickly took control of the entire ruling apparatus, and implemented a mix of policies between anti-Western ideals, Islamic socialism and sharia, and Arab nationalism. He eventually concentrated his ideas into the Green Book, which outlined his Third International Theory. While initially a popular leader at home and abroad, Gaddafi became increasing sidelined from international politics. Constant funding of terrorists, revolutionaries and insurgents has left Gaddafi with very few friends on the international stage. Gaddafi's actions have left the once oil rich nation of Libya suffering under international pressure and sanctions, and is at the risk of becoming an international pariah."
 LBA_abdulrahman_sewehli_desc: "Abdulrahman Sewehli is the grandson Ramadan Asswehly, the founder of the Tripolitanian Republic. The Tripolitanian Republic was a short-lived country that declared independence from Italian Libya at the end of World War I. It was the first republican form of government in the Arab world."
 LBA_ali_zeidan_desc: "알리 제이단은 리비아의 외교관으로, 1970년대에 인도 주재 대사 무함마드 마가리아프 밑에서 일했습니다. 두 사람은 1980년에 망명하여 리비아 구국 민족 전선을 결성했습니다. 알리 제이단은 리비아로 돌아올 때까지 제네바에서 인권 변호사로 망명 생활을 했습니다. 일각에서는 제이단을 강한 신념을 지닌 자유주의자로 평가합니다."
 LBA_ali_tarhouni_desc: "Ali Tarhouni fled Libya in 1973 while studying economics. He was stripped of citizenship, sentenced to death and was put on a government hit-list. Tarhouni fled to the United States and finished his studies there. After graduating and getting his PhD, Tarhouni was teaching economics in the University of Washington Michael G. Foster School of Business until he political situation in Libya allowed him to return to the country."
 LBA_fathi_al_baaja_desc: "파티 알바자는 정치학자로, 정계에 입문하기 전에는 벵가지의 가리유니스 대학교에서 강의했습니다."
 LBA_khweldi_hameidi_desc: "크웰디 하메이디는 무아마르 카다피의 가장 가까운 동맹 중 한 명입니다. 그는 1969년 쿠데타에 참여했으며, 카다피의 숙청 이후 카다피의 내부 서클에 합류하게 되었습니다. 하메이디는 그의 경력 동안 내무부 장관, 군 정보 책임자, 군 법원장을 역임했습니다. 하메이디의 딸 중 한 명은 알-사디 카다피와 결혼했습니다. 카다피가 권좌에서 쫓겨난 후, 하메이디는 다른 카다피 충성파들과 함께 리비아 인민 운동을 결성했습니다."
 LBA_muhammad_muammar_gaddafi_desc: "무함마드 카다피는 무아마르 카다피의 장남입니다. 가족 내에서의 지위에도 불구하고, 무함마드는 나라를 통치하는 데 관심을 가진 적이 없습니다."
 LBA_saif_al_islam_gaddafi_desc: "사이프 알-이슬람은 무암마르 카다피의 둘째 아들입니다. 그는 공학(또는 건축학, 출처에 따라 다름) 학위를 가지고 있습니다. 사이프 알-이슬람은 리비아 정치에 적극적으로 참여했으며, 심지어 자신의 아버지와 리비아가 개혁이 필요하다는 주장을 공개적으로 했습니다. 보도에 따르면, 그는 총리직과 무암마르 카다피의 후계자 자리를 제안받았으나 이를 거부하며 리비아는 '상속할 농장이 아니다'라고 말했습니다."
 LBA_al_saadi_gaddafi_desc: "알-사디 카다피는 무아마르 카다피의 세 번째 아들입니다. 그는 리비아 축구에서의 경력으로 가장 잘 알려져 있지만, 그의 업적은 특별할 것이 없습니다. 많은 경기에서 그의 유리한 결과가 고정되었으며, 경기 중 해설자는 알-사디 외에는 다른 선수의 이름을 언급할 수 없었고, 다른 선수들은 유니폼 번호로만 소개되었습니다. 일반적으로 알-사디는 가족 내에서 블랙쉽으로 여겨지며, 그의 양성애 가능성에 대한 이야기를 잠재우기 위해 군 지휘관의 딸과 결혼을 강요당했다는 소문도 있습니다."
 LBA_mutassim_gaddafi_desc: "무타심 카다피는 무암마르 카다피의 네 번째 아들입니다. 그의 경험은 리비아 군에서만 있었지만, 그는 여전히 무암마르 카다피의 핵심 인물 중 한 명으로 활동할 수 있었습니다."
 LBA_hannibal_gaddafi_desc: "하니발 가다피는 무아마르 가다피의 5번째 아들입니다. 그는 항해학 학사 학위를 보유하고 있으며 여러 GMNTC 선박에서 근무한 경력이 있습니다. 하니발과 그의 아내는 모두 폭력적인 역사로 유명하며, 특히 하인들에 대한 폭력적인 행동이 잘 알려져 있습니다."
 LBA_ayesha_gaddafi_desc: "아이샤 카다피는 무아마르 카다피의 유일한 딸입니다. 그녀는 파리 디드로 대학교에서 법학을 공부했으며, 리비아 군에서도 복무하여 중령 직급에 도달했습니다. 또한, 그녀는 리비아의 다른 국가들과의 외교적 지위를 개선하려는 노력에 적극적으로 참여했습니다."
 LBA_saif_al_arab_gaddafi_desc: "사이프 알-아랍 카다피는 무아마르 카다피의 여섯 번째 아들입니다. 그에 대해 알려진 것은 많지 않으며, 1986년 4살 때 미국 공습으로 부상을 입은 사실이 있습니다. 그 이후로 그는 눈에 띄지않게 살아왔습니다"
 LBA_khamis_gaddafi_desc: "카미스 카다피는 무아마르 카다피의 7번째이자 막내 아들입니다. 카다피는 트리폴리의 군사 아카데미와 러시아의 프룬제 군사 아카데미에서 군사 교육을 받았습니다. 카미스는 정치보다는 군사 문제에 더 많은 관심을 가지고 있으며, 아버지와 형제들과 매우 따뜻한 관계를 유지하고 있습니다."
 LBA_ali_al_sallabi_desc: "알리 알살라비는 역사가이자 종교 학자입니다. 카다피 통치 시기에 아부살림 교도소에서 8년간 수감되었으며, 이후 사우디아라비아와 수단에서 신학을 공부했습니다. 무슬림 형제단 일원이자 카타르와 긴밀한 관계를 맺고 있는 알살라비는 카다피와 리비아 이슬람 전투 그룹 사이의 협상에서 주요 중재자 중 한 명이었습니다. 그의 정치적 추종자 중 다수가 알카에다와 리비아 이슬람 전투 그룹의 일원이었기 때문에, 그의 진정한 충성 대상이 형제단인지 더 극단적인 형태의 이슬람인지는 불분명합니다."
 LBA_abdelhakim_belhaj_desc: "압델하킴 벨하지는 1980년대에 무아마르 카다피 제거를 목표로 리비아 이슬람 전투 그룹을 창설했습니다. 그러나 무언가를 해보기도 전에 이 그룹은 이미 국외로 쫓겨났습니다. 벨하지와 동료들은 아프가니스탄으로 건너가 무자헤딘과 함께 소련에 맞서 싸웠습니다. 전쟁이 끝나자 벨하지는 1992년 반카다피 저항을 이어가기 위해 리비아로 돌아왔습니다."
 LBA_emad_al_banani_desc: "에마드 알바나니는 벵가지 무슬림 형제단 지부의 공동 창립자입니다. 그는 1995년 취리히로 이주하기 전까지 항공 기술자로 일했습니다. 망명 중에 알바나니는 형제단의 더 활동적인 일원 중 한 명이었으며, 오랫동안 형제단의 리비아 복귀를 계획해 왔습니다. 알바나니는 리비아군을 국가 방위대로 대체하기를 원하며, 튀르키예와 말레이시아를 무슬림 국가들의 영감을 주는 모델로 보고 있습니다."
 LBA_mahmoud_jibril_desc: "Mahmoud Jibril graduated from Economics and Political Science from Cairo University in 1975. He has written multiple books on strategic planning and decision making. In the 80s a team led by him publised the Unified Arab Training Manual, and he has organised multiple administration and management trainings all across the Middle East. Before the fall of Gaddafi, Jibril worked under him as the head of theNational Planning Council of Libya and of the National Economic Development Board of Libya. He is a close friend of Saif al-Islam Gaddafi and he promotes privatization and liberalization policies."
 LBA_mohammed_magariaf_desc: "무함마드 마가리아프의 리비아 내 경력은 리비아 세입 법원 감사위원회 위원장으로 시작되었습니다. 그러나 강한 반부패 입장 때문에 곧 다른 직책으로 전보되었습니다. 그는 정부에 의해 숙청될 것을 우려해 1980년 모로코로 망명할 때까지 리비아의 주인도 외교관으로 계속 근무했습니다. 망명 중에 마가리아프는 반카다피 저항 단체인 구국 민족 전선을 창설했습니다. 그는 카다피 암살을 시도하기 위해 리비아에 특공대원 한 무리를 이끌고 들어가기까지 했습니다. 마가리아프는 망명 생활 대부분을 미국에서 보냈으며, 그곳에서 세 차례의 암살 시도에서 살아남았습니다. 카다피가 몰락하고서야 그는 조국으로 돌아올 수 있었습니다. 그는 국내 민주주의 원칙의 강력한 옹호자입니다."
 LBA_mustafa_a_g_abushagur_desc: "무스타파 아부샤구르는 1970년대에 전기 공학을 공부하기 위해 리비아를 떠나 미국으로 건너갔습니다. 그는 1984년에 박사 학위를 받았으며, 이후 앨라배마 대학교 헌츠빌 캠퍼스에서 교수로 재직했습니다. 미국에 머무는 동안 아부샤구르는 NASA, NSF, 국방부, FAA로부터 여러 연구상을 받았습니다. 아부샤구르의 주된 연구 분야는 광전자공학이며, 이 주제로 여러 권의 책을 출간했습니다. 미국에서 망명 생활을 하는 동안 그는 다른 망명자들과 함께 반카다피 운동을 조직하는 데도 적극적으로 활동했습니다."
 LBA_ahmed_shebani_desc: "Ahmed Shebani is the founder of the Democratic Party of Libya. He believes the US (and other Western powers) should adopt a Marshall Plan -style aid program to Libya to stabilise it. He also wants to repair relations with Israel and bring back Jews that were expeleld from the country."
 LBA_ignore_lifg: "리비아 이슬람 전투 그룹 무시"
 LBA_ignore_lifg_desc: "불과 몇 년 전 리비아 이슬람 전투 그룹이 카다피를 암살하려 했습니다. 우리 군은 그들의 병력 대부분을 신속히 추적하여 소탕했으며, 그들은 더 이상 위협이 되지 않습니다. 우리는 병력을 불러들이고 국가 재건에 집중해야 합니다."
 LBA_crush_lifg: "리비아 이슬람 전투 그룹 분쇄"
 LBA_crush_lifg_desc: "불과 몇 년 전 리비아 이슬람 전투 그룹이 카다피를 암살하려 했습니다. 우리 군은 그들의 병력 대부분을 신속히 추적하여 소탕했으며, 그들은 더 이상 위협이 되지 않습니다. 우리는 남아 있는 은신처를 수색하여 파괴하고 동조자들을 체포해야 합니다. 이 혐오스러운 이념이 리비아에 모습을 드러내도록 내버려 둘 수 없습니다."
 LBA_islam_over_nation: "국가보다 이슬람"
 LBA_islam_over_nation_desc: "When Gaddafi took power, he wanted to model Libya's judicial landscape after Sharia. He quickly backtracked however, bringing more nationalist elements into his ruling. There has been a balance between the two ever since. However, it is clear that for any Muslim and Arab nation, Islam should be guiding principle."
 LBA_nation_over_islam: "이슬람보다 국가"
 LBA_nation_over_islam_desc: "카다피는 집권 당시 리비아의 사법 체계를 샤리아에 따라 구축하려 했습니다. 그러나 그는 곧 입장을 번복하고 통치에 더 많은 민족주의적 요소를 끌어들였습니다. 그 이후로 둘 사이에는 균형이 유지되어 왔습니다. 이슬람을 따르는 것은 시대에 뒤떨어지고 부족적인 일입니다. 우리는 리비아 국가와 리비아인의 정체성을 구축하는 데 더 집중해야 합니다."
 LBA_family_is_a_central_unit: "무엇보다 가족"
 LBA_family_is_a_central_unit_desc: "사회의 핵심은 가족입니다. 남자와 여자, 그리고 그들의 자녀들입니다. 이것이 모든 리비아인의 목표입니다. 행복하게 성장하는 가족이 앞으로 수년간 번영과 성공을 보장할 것입니다."
 LBA_nation_is_a_central_unit: "Nation Above Else"
 LBA_nation_is_a_central_unit_desc: "사회의 핵심은 조국을 사랑하는 사람입니다. 우리는 국민이 더욱 애국적이 되고 부족적인 과거를 버리도록 장려해야 합니다."
 LBA_follow_religious_law: "종교법 준수"
 LBA_follow_religious_law_desc: "이슬람법은 나라를 다스리는 최선의 토대입니다. 이것이 리비아를 모두에게 공정한 나라로 만들 것입니다."
 LBA_draft_real_constitution: "진정한 헌법 기초"
 LBA_draft_real_constitution_desc: "리비아에는 공식 헌법이 없습니다. 근대 국가가 헌법을 갖고 있지 않다는 것은 분노할 일입니다. 우리가 어떤 입장에 서 있는지 세계와 국민에게 분명히 보여 주는 제대로 된 헌법을 만들어야 합니다."
 LBA_traditional_role_for_women: "여성의 전통적 역할"
 LBA_traditional_role_for_women_desc: "여성은 가정을 돌보는 사람이어야 합니다. 남자들이 일터에서 고되게 일하는 동안 여성은 자녀를 키우고 가족을 섬기는 가장 높은 영예를 누립니다."
 LBA_liberate_women: "여성 해방"
 LBA_liberate_women_desc: "여성은 남성과 동일한 권리와 의무를 누릴 자격이 있습니다. 여성도 남성과 마찬가지로 일하고 국가를 위해 봉사합니다."
 LBA_religious_education: "종교 교육"
 LBA_religious_education_desc: "우리 학교는 종교 학습을 교과 과정에 긴밀하게 편입해야 합니다. 국민은 어린 시절부터 꾸란과 이슬람의 관습을 배워야 합니다."
 LBA_national_education: "민족주의 교육"
 LBA_national_education_desc: "Our schools should incorporate nationalism and civic studies closely into their curriculum. Patriotism and great deeds of Libyans must be thought to all citizens."
 LBA_appoint_grand_mufti: "대무프티 임명"
 LBA_appoint_grand_mufti_desc: "리비아에는 이슬람법을 해석할 대무프티가 없습니다. 우리처럼 독실한 이슬람 국가로서는 부끄러운 일입니다. 사디크 알가리아니를 대무프티로 지명해야 합니다."
 LBA_appoint_baathist_advisor: "바트주의 고문 임명"
 LBA_appoint_baathist_advisor_desc: "카다피의 집권당은 바트주의와 유사하지만 몇 가지 차이가 있습니다. 우리 정부가 민족주의적 이상에 도달하도록 도울 바트주의 전문가인 고문을 고용해야 합니다."
 LBA_peace_with_lifg: "리비아 이슬람 전투 그룹과의 평화"
 LBA_peace_with_lifg_desc: "리비아 이슬람 전투 그룹과의 분쟁은 온 나라의 안정을 해쳤습니다. 우리는 그들이 우리와 평화롭게 공존하도록 허용해야 합니다."
 LBA_assassinate_gaddafi: "[ROOT.GetLeader] 암살"
 LBA_assassinate_gaddafi_desc: "국민은 [ROOT.GetLeader]에게 신물이 났습니다. 리비아의 이슬람 전사들은 너무 늦기 전에 일어나 전통적인 리비아의 가치를 수호해야 합니다."
 LBA_mujahideen_of_libya: "리비아의 무자헤딘"
 LBA_mujahideen_of_libya_desc: "LIFG의 많은 구성원들은 소련이 아프가니스탄을 침공했던 당시의 무자헤딘 참전 용사들입니다. 그들의 전문 지식은 큰 도움이 될 것입니다."
 LBA_old_taliban_friends: "탈레반 옛 친구들"
 LBA_old_taliban_friends_desc: "우리는 탈레반 내에 많은 연줄을 갖고 있습니다. 이 인맥을 활용해야 합니다."
 LBA_mujahideen_legion: "무자헤딘 군단"
 LBA_mujahideen_legion_desc: "아프가니스탄 참전 용사로서 우리는 이교도와 싸우는 법을 알고 있습니다. 어디에서든 무슬림이 보호받도록 하는 것이 우리의 의무입니다."
 LBA_call_back_veterans: "참전 용사 소환"
 LBA_call_back_veterans_desc: "Many veterans and senior leaders of LIFG are living in exile. Now that we are in power and established,they can start returning home"
 LBA_unity_in_islam: "이슬람 안의 단결"
 LBA_unity_in_islam_desc: "이슬람은 부족의 경계를 넘어서는 강력한 수단입니다. 이슬람을 통해 모든 리비아인이 하나라고 느끼게 될 것입니다."
 LBA_work_together_with_brotherhood: "무슬림 형제단과 협력"
 LBA_work_together_with_brotherhood_desc: "무슬림 형제단은 카다피 통치 하에서 금지되었으나, 많은 사람이 여전히 이 조직의 일원이었습니다. 국내 최대의 이슬람 정치 세력 중 하나인 만큼 그들과 동맹을 맺는 것이 합리적입니다."
 LBA_work_together_with_brotherhood_tt: "[Neutral_Muslim_Brotherhood_L](은)는 §Y£LBA_Neutral_Muslim_Brotherhood 정의건설당§!(으)로 불리게 됩니다"
 LBA_hardline_sharia_law: "강경 샤리아법"
 LBA_hardline_sharia_law_desc: "샤리아법이 우리 국가의 지도 원리가 되어야 합니다. 모든 법은 이에 기반해야 하며, 모든 사회가 샤리아가 규정한 대로 작동해야 합니다."
 LBA_hardline_sharia_law_tt_alcohol: "주류를 금지합니다\n"
 LBA_hardline_sharia_law_tt_dress_code: "복장 규정을 다시 시행합니다\n"
 LBA_hardline_sharia_law_tt_banned_head_scarf: "히잡 금지를 해제합니다\n"
 LBA_hardline_sharia_law_tt_same_sex_decriminalized: "동성 관계를 범죄로 규정합니다\n"
 LBA_de_westernisation: "탈서구화"
 LBA_de_westernisation_desc: "타락한 서방이 우리나라에 너무 큰 영향력을 미치고 있습니다. 국내의 서구 전통을 약화시켜야 합니다."
 LBA_grand_mufti_rule: "대무프티 통치"
 LBA_grand_mufti_rule_desc: "대무프티는 우리 국민에게 중요한 상징이 되었습니다. 그가 리비아를 깨달음으로 이끌 수 있도록 더 많은 정치적 권력을 부여하는 편이 낫습니다."
 LBA_denounce_green_book: "『녹서』 규탄"
 LBA_denounce_green_book_desc: "카다피의 『녹서』는 민족주의와 이슬람을 뒤섞었으며 그의 통치의 근거로 쓰였습니다. 국민이 따라야 할 책은 오직 꾸란뿐이며 그 외에는 아무것도 없습니다."
 LBA_tanasoh_tv: "타나수 TV"
 LBA_tanasoh_tv_desc: "대무프티의 메시지를 모든 리비아인에게 전하기 위해 국영 TV 방송망을 설립해야 합니다."
 LBA_supreme_revolutionaries_council: "최고 혁명 평의회"
 LBA_supreme_revolutionaries_council_desc: "새로운 국가를 보호하기 위해 최고 혁명 평의회를 설치해야 합니다. 대무프티가 나라를 다스리는 것을 돕는 자문 기구입니다."
 LBA_anti_saudi_coalition: "반사우디 연합"
 LBA_anti_saudi_coalition_desc: "The Saudis and other Gulf monarchies accuse the Grand Mufti of participating in Qatari supported terrorism. This a ridiculous claim and we must work together with Qatar to fight this slander."
 LBA_join_sahel_war: "마그레브 반군 지원"
 LBA_join_sahel_war_desc: "사하라에는 무슬림의 해방을 위해 싸우는 여러 이슬람주의 반군 단체가 있습니다. 우리는 이들 단체와 보조를 맞춰야 합니다."
 LBA_join_sahel_war_threat: "[LBA.GetAdjective] 마그레브 반군 지원"
 LBA_islamic_state_of_sahel: "마그레브 이슬람 국가"
 LBA_islamic_state_of_sahel_desc: "우리는 사하라의 유일한 통치자임을 선포해야 합니다. 지금부터 리비아는 마그레브 이슬람 국가로 불릴 것입니다."
 LBA_islamic_state_of_sahel_tt: "사하라의 §Y영유권§! 주를 §Y핵심§!으로 전환할 수 있게 됩니다"
 LBA_our_brothers_in_chad: "차드의 우리 형제들"
 LBA_our_brothers_in_chad_desc: "차드 북부의 반군은 장차 차드를 장악하는 데 완벽한 동맹이 될 것입니다."
 LBA_our_brothers_in_chad_tt: "무자헤딘 부대 하나가 §Y$VICTORY_POINTS_1057$, $STATE_1100$§!에 기지를 세웁니다"
 LBA_topple_chad: "차드 전복"
 LBA_topple_chad_desc: "차드는 우리의 약한 이웃 중 하나입니다. 현지 반군의 도움을 받으면 차드를 쓰러뜨리는 것은 쉬울 것입니다."
 LBA_our_brothers_in_niger: "니제르의 우리 형제들"
 LBA_our_brothers_in_niger_desc: "니제르 북부는 무장 활동의 중심지입니다. 이들 반군이 국경을 넘어 우리 쪽에 안전한 캠프를 세울 수 있도록 허용해야 합니다."
 LBA_our_brothers_in_niger_tt: "무자헤딘 부대 하나가 §Y$VICTORY_POINTS_3257$, $STATE_920$§!에 기지를 세웁니다"
 LBA_topple_niger: "니제르 전복"
 LBA_topple_niger_desc: "니제르를 장악하면 남쪽 국경이 안전해질 것입니다. 사하라 남단은 나이지리아를 공격하기 위한 완벽한 발판 역할도 할 것입니다."
 LBA_ally_with_boko_haram: "보코 하람과 동맹"
 LBA_ally_with_boko_haram_desc: "나이지리아의 이슬람주의 단체 보코 하람은 수년간 나이지리아 정부에 맞서 싸워 왔습니다. 나이지리아를 파괴하는 데 그들의 지지를 얻기 위해 그들과 동맹을 맺어야 합니다. 다만 그들이 장기적으로 우리에게 우호적일 것이라는 보장은 없습니다."
 LBA_ally_with_boko_haram_tt: "§Y$LBA_invade_nigeria$§!을(를) 완료하면 보코 하람이 [NIG.GetNameDef]에서 반란을 일으켜 우리 편에 가담합니다"
 LBA_invade_nigeria: "나이지리아 침공"
 LBA_invade_nigeria_desc: "나이지리아 북부는 주로 무슬림이 거주합니다. 우리는 기독교도인 남부의 억압에서 우리 형제들을 해방시켜야 합니다."
 LBA_our_brothers_in_algeria: "알제리의 우리 형제들"
 LBA_our_brothers_in_algeria_desc: "알제리는 마그레브 반군의 발상지입니다. 알제리 내전에서 이슬람주의자들이 실패한 이래, 알제리의 사하라 지역은 계속 반군 활동의 중심지로 남아 있습니다. 대부분의 전투원은 이제 알제리군에 의해 축출되었으나 아직 남아 있는 이들도 있습니다. 그들과 접촉해야 합니다."
 LBA_our_brothers_in_algeria_tt: "무자헤딘 부대 하나가 §Y$VICTORY_POINTS_4051$, $STATE_393$§!에 기지를 세웁니다"
 LBA_topple_algeria: "알제리 전복"
 LBA_topple_algeria_desc: "이슬람주의자들은 내전 중에 타락한 알제리 정부를 전복하는 데 실패했습니다. 그러나 우리는 실패하지 않을 것입니다."
 LBA_infiltrate_mali: "말리 침투"
 LBA_infiltrate_mali_desc: "말리 북부 지역인 아자와드는 반군 활동의 온상입니다. 말리는 약하며 이미 혼란에 빠져 있으니, 지금이 공격할 때입니다."
 LBA_our_brothers_in_mali_east_tt: "무자헤딘 부대 하나가 §Y$VICTORY_POINTS_7939$, $STATE_330$§!에 기지를 세웁니다"
 LBA_our_brothers_in_mali_north_tt: "무자헤딘 부대 하나가 §Y$VICTORY_POINTS_5095$, $STATE_381$§!에 기지를 세웁니다"
 LBA_expand_to_mauritania: "모리타니로 확장"
 LBA_expand_to_mauritania_desc: "모리타니에서는 반군의 활동이 제한적이었을 뿐입니다. 이제 이러한 작전을 강화하여 사헬 통합을 마무리할 때입니다."
 LBA_destroy_last_crusaders: "마지막 십자군 섬멸"
 LBA_destroy_last_crusaders_desc: "몰타는 구호 기사단의 근거지입니다. 무슬림을 학살한 십자군의 후예들이 우리 문턱 바로 옆에서 살도록 허용되고 있다는 것은 분노할 일입니다. 이교도들의 마지막 보루는 파괴되어야 합니다."
 LBA_malta_repopulation_campaign: "몰타 인구 이주 캠페인"
 LBA_malta_repopulation_campaign_desc: "국민이 몰타로 이민하도록 장려하여 인구 구성을 우리에게 유리하게 바꾸는 캠페인을 시작해야 합니다."
 LBA_malta_province: "몰타 지방"
 LBA_malta_province_desc: "몰타에는 이제 상당한 무슬림 인구가 있습니다. 몰타를 [LBA.GetNameDef]의 불가분한 일부로 공식 편입해야 합니다."
 LBA_baathism_tunisia: "튀니지의 바트주의"
 LBA_baathism_tunisia_desc: "Tunisia has had an active Ba'athist movement since the 1950s. However, it has been banned under the rule of Zine El Abidine Bel Adi. We should create contacts with the undeground movement, as they have ties to Ba'athist groups."
 LBA_baathism_algeria: "알제리의 바트주의"
 LBA_baathism_algeria_desc: "알제리 바트당은 금지되어 활동이 탄압받아 왔습니다. 이 때문에 당의 현 지도자는 이라크에서 망명 생활을 하고 있습니다. 알제리 바트주의자들과 함께라면 알제리와 이라크 양쪽에 연줄을 갖게 될 것입니다."
 LBA_baathism_mauritania: "모리타니의 바트주의"
 LBA_baathism_mauritania_desc: "모리타니에서 바트당은 국내 최대의 아랍 민족주의 세력입니다. 당은 모리타니 군부에 여러 차례 침투했으며 지도자들은 장관직을 맡기까지 했습니다. 그러나 1999년 모리타니가 이스라엘과 관계를 정상화하자 당은 금지되었습니다."
 LBA_baathism_egypt: "이집트의 바트주의"
 LBA_baathism_egypt_desc: "이집트 바트당은 1990년에 금지되었으며, 불과 1년 뒤 이라크 정보부 관리 두 명이 이집트를 불안정하게 만들려는 목적의 거액의 현금을 소지한 채 이집트에서 체포되었습니다. 이집트의 바트주의 형제들과 접촉하면 그들의 국제 자금망에 접근할 수 있을 것입니다."
 LBA_baathism_levant: "레반트의 바트주의"
 LBA_baathism_levant_desc: "Out of all the non-Ba'athist Arab countries, the movement is doing the best in Jordan. The party is not outlawed, a third of Jordanians are aware the Ba'athist Party's existence and they have even had members in the parliament. The Jordanian Ba'ath Party has an extensive program of sending Jordanians to study in Iraqi universities, and this network will benefit us too. In Palestine, our Ba'athist brothers help the PLO in their fight against the Zionist invaders."
 LBA_baathism_iraq_kuwait: "이라크의 바트주의"
 LBA_baathism_iraq_kuwait_desc: "아마도 모든 나라 중에서 이라크에서 바트주의가 가장 번성했을 것입니다. 하지만 최근 사담 후세인은 스스로를 새로운 함무라비로 여기며 신메소포타미아 정체성에 기반한 이라크 정체성을 구축하려 하고 있습니다. 너무 늦기 전에 그들을 다시 아랍 민족주의로 이끌어야 합니다."
 LBA_baathism_bahrain: "바레인의 바트주의"
 LBA_baathism_bahrain_desc: "바레인에서 바트주의 이상은 반군주제 성향의 민족민주연합이 이끌고 있습니다. 이들의 주요 목표 중 하나는 바레인인이 값싼 외국인 노동력과 경쟁해야 하는 불공정을 낳는 정부의 이민 정책을 중단시키는 것입니다. 바레인은 우리가 외국인보다 아랍 인구를 우선해야 하는 이유를 보여 주는 훌륭한 사례입니다."
 LBA_baathism_lebanon: "레바논의 바트주의"
 LBA_baathism_lebanon_desc: "바트주의는 레바논에서 오랜 역사를 갖고 있습니다. 현재 바트주의 지지자들 사이에서는 이라크 계파와 시리아 계파 간에 많은 경쟁이 벌어지고 있습니다. 이러한 차이를 봉합하려 노력해야 합니다."
 LBA_baathism_sudan: "수단의 바트주의"
 LBA_baathism_sudan_desc: "수단에서 바트주의는 비교적 소규모이지만, 이라크의 막대한 자금 덕분에 운동의 기존 구성원들은 여전히 상당한 영향력을 갖고 있습니다. 수단이 우리와 더 가까워지면 이라크의 이 자금을 통제하기가 더 쉬워질 것입니다."
 LBA_baathism_yemen: "예멘의 바트주의"
 LBA_baathism_yemen_desc: "예멘에서는 이라크가 주도하는 바트당이 집권 국민회의와 긴밀하게 동맹을 맺고 있습니다. 예멘의 바트주의자들과 좋은 관계를 유지하면 예멘 정부에 대한 훌륭한 접근권을 얻게 될 것입니다."
 LBA_revise_green_book: "『녹서』 개정"
 LBA_revise_green_book_desc: "In 1975 Muammar Gaddafi released his Green Book that detailed his political ideology. It rejects representative democracy in favour of direct democracy, and rejects both capitalism and communism. Essentially, it lays down the foundation for the Third International Theory. However, many elements of the Libyan society today don't follow the Green Book. Maybe it is time to bring the book to the current millenia and chart the future path for Libyans."
 LBA_revise_green_book_tt: "\n[LBA.GetLeader](이)가 『녹서』를 개정할 것입니다. 각 장이 다시 쓰일 때마다 우리나라는 §Y개혁§!에 가까워지거나 멀어집니다. §Y개혁§!의 정도가 리비아의 미래를 결정할 것입니다.\n\n§Y개혁§! > 3이면 §Y$LBA_empower_peoples_congresses$§!\n\n§Y개혁§! < -3이면 §Y$LBA_empower_revolutionary_committees$§!\n\n그 밖의 경우 §Y$LBA_retain_political_balance$§!\n\n"
 LBA_green_book_part_1_1: "1:1 - 통치 도구"
 LBA_green_book_part_1_1_desc: "가장 중요한 정치적 질문은 '어떤 형태의 정부를 수립해야 하는가?'입니다. 그러한 정부는 직접 민주주의여야 하지만, 대개는 대의 민주주의가 수립되고, 이는 단순 다수제 선거 제도를 이용해 기존 정부에 투표하지 않은 다수 인구의 의지를 찬탈합니다."
 LBA_green_book_part_1_3: "1:3 - 정당"
 LBA_green_book_part_1_3_desc: "정당 또한 인민의 권위를 찬탈하며, 정부의 본래 목적인 모두를 위한 사회 개선보다 권력 유지에 집중합니다. 더 나쁜 것은 정당이 부패에 취약하다는 점입니다."
 LBA_green_book_part_1_8: "1:8 - 누가 사회의 행동을 감독하는가?"
 LBA_green_book_part_1_8_desc: "정치권력이 대표자들에게 위임되어서는 안 되는 것처럼, 치안 권력 역시 사회 전체로부터 위임되어서는 안 됩니다. 다시 말하지만, 회의와 위원회의 구조가 해법입니다. 전체가 전체를 위한 입법부이며, 전체가 전체를 위한 법 집행자입니다."
 LBA_green_book_part_1_10: "1:10 - 언론"
 LBA_green_book_part_1_10_desc: "개인과 기업은 사적 차원에서 스스로를 표현할 권리가 있지만, 사회의 표현 수단으로서의 '언론'은 회의와 위원회가 발행해야 합니다. 그렇지 않으면 개인들이 사상의 영역에서 다시 타인으로부터 권력을 찬탈하게 될 것입니다."
 LBA_green_book_part_2_13: "2:13 - 주거"
 LBA_green_book_part_2_13_desc: "예를 들어 주택 임대는 착취이며 임차인의 자유를 침해합니다. 이상적으로는 누구나 집을 한 채만 가져야 합니다. 어떤 당사자가 부동산을 하나 이상 가지면 이를 임대하려 하게 되고, 그렇게 임차인을 착취하게 되기 때문입니다."
 LBA_green_book_part_2_14: "2:14 - 소득"
 LBA_green_book_part_2_14_desc: "개인 소득은 경제에 필수적입니다. 다시 말하지만, 그러한 소득은 소유주가 지급하는 임금으로 실현되어서는 안 되며 산업에서의 동업의 결과여야 합니다."
 LBA_green_book_part_2_16: "2:16 - 토지"
 LBA_green_book_part_2_16_desc: "토지는 앞서 언급한 모든 범주와 마찬가지로 모두에게 평등하게 주어져야 합니다. 일반적으로 경제는 제로섬 게임이며, 따라서 경제의 구성 요소는 결과의 평등을 이루기 위해 모두에게 평등하게 분배되어야 합니다. 누구도 전체 인구 가운데 특정 재화에 대한 자신의 산술적 몫을 넘어, 자기 필요 이상을 스스로를 위해 비축할 권리가 없습니다."
 LBA_green_book_part_3_21: "3:21 - 부족의 장점"
 LBA_green_book_part_3_21_desc: "Tribes are rooted in blood, provide social cohesion, able to internally monitor themselves due to their numbers. They also ensure the socialization of their individuals, an education more useful than a school education."
 LBA_green_book_part_3_24: "3:24 - 소수 집단"
 LBA_green_book_part_3_24_desc: "소수 집단에는 두 유형이 있습니다. 이미 국가를 가진 집단과 국가가 없어 스스로 국가를 세우는 집단입니다. 어느 쪽이든 그들의 권리는 보호되어야 합니다."
 LBA_green_book_part_3_25: "3:25 - 흑인이 세계에서 승리할 것이다"
 LBA_green_book_part_3_25_desc: "흑인은 그들의 문화가 일부다처제를 포함하고 산아 제한을 기피하며, '지속적으로 더운' 기후에서 살기 때문에 인류 인구를 지배할 태세를 갖추고 있으며, 그 결과 다른 문화에 비해 노동이 그들에게 덜 중요합니다."
 LBA_green_book_part_3_28: "3:28 - 스포츠, 승마와 무대"
 LBA_green_book_part_3_28_desc: "스포츠, 연극 및 기타 오락의 관람은 어리석은 일입니다. 사람들은 남이 하는 것을 가만히 지켜보는 대신 스스로 직접 스포츠에 참여하여 운동의 이점을 누려야 합니다."
 LBA_release_new_green_book: "새 『녹서』 발표"
 LBA_release_new_green_book_desc: "끝났습니다! 몇 달간의 노고 끝에 『녹서』의 새 판본이 나왔습니다. 전국의 학생들은 이제 배워야 할 책이 한 권 더 늘었다며 환호합니다!"
 LBA_empower_peoples_congresses: "인민회의에 힘 실어주기"
 LBA_empower_peoples_congresses_desc: "What started out as a way to bring direct democracy to people has developed in a farce of neighbours spying on each other to guard the state against revolutionary activity. The Revolutionary Committees that spy on the people need to be abolished and the power needs to be returned to the people"
 LBA_retain_political_balance: "정치적 균형 유지"
 LBA_retain_political_balance_desc: "리비아의 정치 체제는 수십 년간 작동해 왔습니다. 인민회의와 혁명위원회는 서로를 견제합니다. 모든 것이 잘 돌아가는데 굳이 평지풍파를 일으킬 이유가 있겠습니까?"
 LBA_empower_revolutionary_committees: "혁명위원회에 힘 실어주기"
 LBA_empower_revolutionary_committees_desc: "혁명위원회는 이미 사실상 국가를 통제하고 있습니다. 인민회의의 권력을 명목상으로만 남기고 혁명위원회를 국가의 진정한 주인으로 만드는 일은 그리 어렵지 않을 것입니다."
 LBA_allow_political_parties: "정당 허용"
 LBA_allow_political_parties_desc: "Political parties have been banned in Libya ever since Gaddafi took power. However, in order for the people to properly present themselves, they need platforms for that. We should open the political landscape to more actors."
 LBA_allow_political_parties_tt: "모든 정당이 합법화됩니다\n[conservatism_L](은)는 §Y£generic_conservatism_small 조국 연합§!(으)로 불리게 됩니다\n[liberalism_L](은)는 §Y£LBA_liberalism 발전복지 국민당§!(으)로 불리게 됩니다\n[Autocracy_L](은)는 §Y£LBA_Autocracy_democracy 아랍 사회주의 연합§!(으)로 불리게 됩니다\n[Kingdom_L](은)는 §Y£LBA_Kingdom 조국당§!(으)로 불리게 됩니다\n[Neutral_Muslim_Brotherhood_L](은)는 §Y£LBA_Neutral_Muslim_Brotherhood 정의건설당§!(으)로 불리게 됩니다\n[Neutral_Autocracy_L](은)는 §Y£LBA_Neutral_Autocracy 국민세력연합§!(으)로 불리게 됩니다\n[Neutral_conservatism_L](은)는 §Y£LBA_Neutral_conservatism_democracy 민족전선당§!(으)로 불리게 됩니다\n[Neutral_Libertarian_L](은)는 §Y£LBA_Neutral_Libertarian 민주당§!(으)로 불리게 됩니다\n[neutral_Social_L](은)는 §Y£LBA_neutral_Social 엔사프 운동§!(으)로 불리게 됩니다\n"
 LBA_grassroots_democracy: "풀뿌리 민주주의"
 LBA_grassroots_democracy_desc: "민주주의와 국가는 국민에 의한, 국민을 위한 것이어야 합니다. 가장 낮은 수준에서도 국민이 일에 영향을 미칠 기회를 가질 수 있도록 민주주의가 모든 통치 단계에 존재해야 합니다."
 LBA_allow_royal_family_return: "왕족 귀환 허용"
 LBA_allow_royal_family_return_desc: "1969년 카다피의 쿠데타 이후 이드리스 국왕은 망명 생활을 하게 되었습니다. 그러나 그의 나머지 가족은 그만큼 운이 좋지 못했습니다. 그의 조카이자 후계자인 하산 알세누시는 가족과 함께 가택 연금되었습니다. 1984년 가택이 불타 없어졌고 가족은 공공 해변의 오두막으로 옮겨져 살았습니다. 4년 뒤 가족은 하산의 치료를 위해 영국으로 이주하도록 허용되었으나, 그는 불과 4년 후인 1992년 뇌졸중으로 사망했습니다. 그의 아들이자 현 왕세자인 무함마드 엘세누시는 지금도 런던에 살고 있습니다. 이제 그들의 귀환을 허용해야 할 때일지도 모릅니다."
 LBA_compensation_to_royals: "왕족 보상"
 LBA_compensation_to_royals_desc: "그들이 겪은 일을 생각하면 국가 예산에서 왕실에 금전적 보상을 해야 합니다. 그들이 재기할 수 있도록 소액의 연간 지원금만 지급하면 됩니다. 지위를 되찾으면 그들은 언젠가 영국 왕실만큼 유명해질 것입니다."
 LBA_hunt_down_royals: "왕족 추적"
 LBA_hunt_down_royals_desc: "세누시 가문 일원 몇 명이 여전히 해외에서 망명 생활을 하고 있습니다. 그들이 살아 있는 한 우리 정권은 안전하지 않습니다. 세누시 가문의 남은 혈통을 암살해야 합니다."
 LBA_hunt_down_royals_tt: "\n§Y무함마드 왕세자§!, 그의 사촌 §Y아흐메드§!, 그리고 왕위 참칭자 §Y이드리스와 그의 아들 할레드§!를 암살하려 시도합니다. 우리의 §G성공§! 및 §R발각§! 확률은 §Y국내 보안§! 지출에 따라 달라집니다\n"
 LBA_royal_wealth: "왕족 재산 몰수"
 LBA_royal_wealth_desc: "The Royals have lot of money currently. We need to seize, confiscate and steal their assets in the name of Libyan welfare."
 LBA_peoples_intelligence_agency: "인민정보국"
 LBA_peoples_intelligence_agency_desc: "혁명위원회가 이제 나라를 통제하고 있으니, 국내에 적대적 사상이 뿌리내리지 못하게 막음으로써 진정으로 국민에게 봉사할 수 있습니다."
 LBA_trust_revolutionary_guard: "혁명 수비대 신뢰"
 LBA_trust_revolutionary_guard_desc: "혁명 수비대는 수십 년간 정권을 수호해 왔습니다. 그들에게 더 많은 책임을 넘겨야 합니다. 정규군은 믿을 수 없습니다."
 LBA_trust_army: "군 신뢰"
 LBA_trust_army_desc: "우리는 국가 보안의 너무 많은 부분을 혁명 수비대에 위임했습니다. 중점을 다시 군으로 되돌려야 합니다."
 LBA_presidential_republic: "대통령제 공화국"
 LBA_presidential_republic_desc: "Libya has had a strong leader throughout most of its existence. Even when we transition to democracy, we need a strong leader with authority. As Libya transitions, we should follow the French and Americans models of being ruled by a strong president."
 LBA_federation: "리비아 연방"
 LBA_federation_desc: "리비아는 트리폴리타니아, 키레나이카, 페잔으로 구성되어 있습니다. 이들 지역은 다시 여러 부족으로 구성되어 있습니다. 국가의 안정을 위해서는 권력 일부를 지방 정부에 위임하는 것이 최선입니다."
 LBA_federation_tt: "§Y리비아 부족주의§! 메커니즘이 비활성화됩니다"
 LBA_minority_rights: "소수 민족 권리"
 LBA_minority_rights_desc: "투부족, 투아레그족, 그리고 현지 부족들은 모두 어느 정도의 자치를 누려야 합니다. 이것이 중앙 국가의 억압을 막는 최선의 방법입니다."
 LBA_unitary_state: "단일 국가"
 LBA_unitary_state_desc: "리비아는 부족과 민족으로 나뉘어 있습니다. 이러한 분열에 맞서는 최선의 방법은 국가가 붕괴하지 않도록 보장할 수 있는 강력한 중앙 정부를 두는 것입니다."
 LBA_unitary_state_tt: "이전의 선택에 따라 다음 중 하나가 일어납니다:\n\n"
 LBA_minority_protection: "소수 민족 보호"
 LBA_minority_protection_desc: "중앙 국가는 부족을 억압하기 위해서가 아니라 그들의 권리를 보호하기 위해 존재한다는 것을 부족들에게 납득시켜야 합니다."
 LBA_constitutional_monarch: "입헌 군주제"
 LBA_constitutional_monarch_desc: "Libya was relatively stable under the monarchy. However, after decades of autocracy, we can't subject the Libyan people to it anymore. We should return the monarchy as a powerful symbol of Libya unity, but true political power should still rest with the Libyan people."
 LBA_the_real_monarch: "진정한 군주"
 LBA_the_real_monarch_desc: "The time has come to return monarchy to Libya. The we need to crown a true ruler for Libya."
 LBA_the_real_monarch_tt_1: "국가 중점 §Y$LBA_compensation_to_royals$§!을(를) 완료했다면:\n"
 LBA_the_real_monarch_tt_2: "국가 중점 §Y$LBA_royal_wealth$§! 및 §Y$LBA_strive_for_african_union$§!을(를) 완료했다면:\n"
 LBA_protect_toubou_and_tuaregs: "투부족과 투아레그족 보호"
 LBA_protect_toubou_and_tuaregs_desc: "사하라와 리비아는 투아레그족과 투부족의 고향입니다. 그러나 이들을 품고 있는 많은 나라는 불안정하거나 권위주의적이거나 둘 다입니다. 이 소수 민족들을 억압자로부터 보호하는 것은 우리의 의무입니다."
 LBA_protect_toubou_and_tuaregs_tt: "안정도가 낮거나 권위주의 정부를 가진 §Y이웃 국가§!에 §Y투아레그§! 또는 §Y티베스티§! 핵심의 양도를 요구할 수 있습니다"
 LBA_protect_toubou_and_tuaregs_threat: "[LBA.GetAdjective] 투아레그족과 투부족 해방 추진"
 LBA_royal_unity: "왕실의 단결"
 LBA_royal_unity_desc: "왕의 목적은 사람들을 하나로 만드는 것입니다. 리비아 군주 아래에서 부족들은 함께 우러러볼 공통의 인물을 갖게 될 것입니다."
 LBA_revive_senussi_order: "세누시 교단 부활"
 LBA_revive_senussi_order_desc: "세누시 교단은 수피 이슬람에 도입된 더 '부족적인' 신앙 일부를 없애는 한편 꾸란의 더 근본주의적인 해석을 줄이려 했던 종교 조직으로 출발했습니다. 이 교단은 리비아에서 큰 힘을 얻었으나 결국 무아마르 카다피에 의해 사실상 소멸되었습니다. 카다피는 이제 사라졌고, 세누시 교단이 다시 일어설 때입니다."
 LBA_approach_nato: "나토 접근"
 LBA_approach_nato_desc: "리비아 왕국은 본래 영국과 기타 서방 강국의 도움으로 건국되었습니다. 건국 초기에 우리는 유럽 친구들과 긴밀히 협력했으나, 아랍 민족주의 어리석은 자들이 우리를 밀어냈습니다. 이러한 관계를 복원하고 본래의 친구들에게 돌아가야 합니다."
 LBA_call_back_exiles: "망명자 소환"
 LBA_call_back_exiles_desc: "카다피 통치 기간 동안 많은 사람이 리비아에서 추방되거나 스스로 탈출했습니다. 이제 상황이 달라졌으니, 이 망명자들을 불러들일 수 있습니다."
 LBA_approach_arab_league: "아랍 연맹 접근"
 LBA_approach_arab_league_desc: "카다피 때문에 우리는 동료 아랍 국가들과 최상의 관계를 유지하고 있지 못합니다. 그의 정치적 돌출 행동으로 많은 동료 아랍인과 냉랭한 관계가 되었습니다. 이 문제를 바로잡아야 합니다."
 LBA_join_war_on_terror: "테러와의 전쟁 참여"
 LBA_join_war_on_terror_desc: "이슬람이 공격받고 있습니다. 지하드주의자와 극단주의자들이 우리 종교를 장악하려 하고 있으며, 수십 개국을 불안정하게 만들고 많은 무슬림의 삶을 망가뜨리고 있습니다. 이 광신자들로부터 무슬림 형제들을 보호하는 것은 우리의 의무입니다."
 LBA_join_war_on_terror_tt: "'테러와의 전쟁' 연설이 진행됐다"
 LBA_oef_trans_sahara: "주니퍼 실드 작전"
 LBA_oef_trans_sahara_desc: "사하라는 극단주의자들이 숨기에 완벽한 장소입니다. 동맹국인 미국이 이 지역의 대무장세력 작전에 참여할 기회를 제안해 왔습니다."
 LBA_oef_trans_sahara_tt: "§Y살라피주의§! 지지도가 높은 §Y사헬§! 또는 §Y사하라§!의 국가들에 개입할 수 있게 됩니다"
 LBA_oef_trans_sahara_threat: "주니퍼 실드 작전"
 LBA_fatherly_leader: "자애로운 지도자"
 LBA_fatherly_leader_desc: "The current title for Gaddafi is the 'Brotherly Leader and Guide of the Revolution of the Great Socialist People's Libyan Arab Jamahiriya'. But the truth is, Gaddafi is more closer to a father to the nation, rather than a brother."
 LBA_libyan_military: "리비아군"
 LBA_libyan_military_desc: "The Libyan military, officially the Armed Forces of the Libyan Arab Jamahiriya, is divided into the army, navy and air force. Out of these, the army clearly the strongest. The army itself is split into the regular army and the revolutionary guard corps. The reason for this split is that Gaddafi wanted to make sure there was an organisation to keep the regular army loyal."
 LBA_lessons_from_the_past: "과거의 교훈"
 LBA_lessons_from_the_past_desc: "우리 역사에서 우리는 그리 많은 전쟁에 참여하지 않았으며, 승리한 편에 서 본 적은 확실히 없습니다. 우리는 미 공군에 여러 차례 공격받았고, 이집트와 짧고 참담한 분쟁을 벌였으며, 차드와의 전쟁에서는 초기의 승리에도 불구하고 군대의 상당 부분을 잃었습니다. 앞으로 성공하려면 우리가 무엇을 잘못했는지 돌아봐야 합니다."
 LBA_el_dorado_canyon: "엘도라도 캐니언 작전"
 LBA_el_dorado_canyon_desc: "In 1986 the United States bombed Libya in response to Libya bombing the West German discotheque 'La Belle' which was popular among American troops. The Americans targeted several military installation, including Gaddafi's command center. The attack destroyed dozens of our aircraft. Our defenses failed completely, as no fighters were launched as counter-action and our anti-air defences didn't start firing until after the American planes were returning. Only 1 F-111 was shot down, and the rest escaped unharmed."
 LBA_better_aa: "더 나은 대공 방어"
 LBA_better_aa_desc: "엘도라도 캐니언에서 벌어진 일로 분명해진 것은 우리의 대공 능력이 웃음거리 수준이라는 점입니다. 앞으로는 적 항공기에 훨씬 더 잘 대비해야 합니다."
 LBA_better_fighter_response: "더 나은 전투기 대응"
 LBA_better_fighter_response_desc: "분명 엘도라도 캐니언에서의 우리 실패는 가망 없이 느린 전투기 대응이었습니다. 우리 조종사들은 적을 요격하기 위해 훨씬 빨리 이륙해야 합니다."
 LBA_gulf_of_sidra: "시드라만"
 LBA_gulf_of_sidra_desc: "In 1974, Gaddafi claimed all of Gulf of Sidra as the territorial waters against international maritime law. This was challenged by the United States and eventually led to increased tensions in the Gulf. This ultimately led to several incidents in the region; in 1981 two Libyan SU-22s were shot down, in 1986 one Libyan corvette was sunk and one critically damaged and in 1989 two Libyan MiG-23s were destroyed. In all of these engagements, the Americans suffered no losses. These incidents only showed how hopeless our air force and navy are."
 LBA_toyota_war_guerrilla: "토요타 전쟁의 교훈 - 게릴라전"
 LBA_toyota_war_guerrilla_desc: "80년대 차드-리비아 분쟁은 이른바 토요타 전쟁으로 끝났습니다. 리비아군은 수년간 차드 북부에 주둔해 있었습니다. 차드군은 반격을 개시하면서 기동성이 뛰어난 테크니컬(무장 픽업트럭)을 이용했습니다(전쟁의 이름도 여기서 유래했습니다). 이를 통해 그들은 리비아 수비대를 우회하여 보급선과 고립된 부대를 초토화할 수 있었습니다. 우리도 이러한 경량 전투에 집중해야 합니다."
 LBA_toyota_war_mobility: "토요타 전쟁의 교훈 - 기동성"
 LBA_toyota_war_mobility_desc: "80년대 차드-리비아 분쟁은 이른바 토요타 전쟁으로 끝났습니다. 리비아군은 수년간 차드 북부에 주둔해 있었습니다. 차드군은 반격을 개시하면서 기동성이 뛰어난 테크니컬(무장 픽업트럭)을 이용했습니다(전쟁의 이름도 여기서 유래했습니다). 이를 통해 그들은 리비아 부대를 기동으로 압도했으며, 더 느리게 움직이는 전차와 정면으로 맞서고 지뢰밭을 무사히 건너기까지 했습니다. 이것이야말로 우리에게 필요한 전투 방식입니다."
 LBA_desert_warfare: "사막의 달인"
 LBA_desert_warfare_desc: "리비아의 대부분은 사막입니다. 어느 방향에서 공격받든 우리는 열기와 모래 속에서 싸우게 될 가능성이 높습니다. 이는 우리 국민이 이미 익숙한 일이며, 우리의 적들은 우리를 두려워해야 합니다."
 LBA_desert_warfare_tt: "보유한 §Y토요타 전쟁§! 국가 정신을 보정합니다\n"
 LBA_egypt_war_behind_the_lines: "이집트-리비아 전쟁 - 특공대"
 LBA_egypt_war_behind_the_lines_desc: "1977년 우리는 이집트와 나흘간의 짧은 전쟁을 치렀으며, 이는 주로 이집트가 이스라엘과 평화 협정을 체결하면서 악화된 관계 때문이었습니다. 전쟁 중 리비아 전차 대대가 이집트로 넘어갔으나 기계화 반격에 의해 신속하게 격파되었습니다. 이후 며칠간 이집트 특공대는 리비아 군사 시설에 대해 여러 차례 습격을 감행했습니다. 이러한 후방 공격으로 많은 핵심 군사 시설이 파괴되었으며, 이 전술을 적에게 사용하는 것은 도움이 될 것입니다."
 LBA_egypt_war_behind_the_lines_tt: "§Y$LBA_desert_warfare_idea$§! 국가 정신을 보정합니다"
 LBA_egypt_war_tank_formations: "이집트-리비아 전쟁 - 장갑"
 LBA_egypt_war_tank_formations_desc: "In 1977 we fought a short four-day-war against Egypt, mainly due to soured relations over Egypt signing a peace deal with Israel. During the war, Egyptian commandos raided Libyan military installation. At the same time, a Libyan armoured battalion advanced into Egypt but was quickly destroyed by a Egyptian mechanised counter-attacked, which then advanced 25 km into Libya before returning to their original positions. The awe inspiring Egyptian mechanized assault is something we should aim to achieve."
 LBA_activate_arsenal_of_islam: "이슬람의 무기고 가동"
 LBA_activate_arsenal_of_islam_desc: "1970년대에 카다피는 대대적인 쇼핑에 나서, 미국 및 이스라엘과의 세계 전쟁이 시작될 때 사용할 거대한 '이슬람의 무기고'를 구축했습니다. 전쟁은 오지 않았지만 우리는 여전히 그 장비가 필요합니다. 무기고의 모든 것이 수십 년 된 것이라 전부 가동하려면 시간과 돈이 들겠지만, 적어도 우리 병사들은 싸울 무언가를 갖게 될 것입니다."
 LBA_activate_arsenal_of_islam_gaddafi: "카다피 일가가 집권 중이며 국가 정신 §Y$LBA_revolutionary_guard_corps$§!을(를) 보유하고 있습니다"
 LBA_activate_arsenal_of_islam_no_gaddafi: "카다피 일가가 집권 중이 아니며 국가 정신 §Y$LBA_armed_forces_of_arab_jamahiriya$§!을(를) 보유하고 있습니다"
 LBA_foreign_procurement_lines: "해외 조달 라인"
 LBA_foreign_procurement_lines_desc: "이제 유엔의 무기 제재를 받지 않게 되었으니, 이 기회에 무기 비축량을 다시 늘려야 합니다."
 LBA_foreign_procurement_lines_tt: "§Y$LBA_foreign_procurement_boosted$§! 국가 정신이 활성화된 동안 국가 중점을 통한 무기 획득 시 장비를 25% 더 받습니다!\n"
 LBA_weapons_from_balkans: "발칸 반도산 무기"
 LBA_weapons_from_balkans_desc: "발칸 반도의 많은 국가가 나토와의 호환성을 높이기 위해 군을 현대화하고 있습니다. 이는 그들의 낡은 비축 무기가 어딘가로 가야 한다는 뜻입니다. 우리가 많은 총기를 싸게 구할 절호의 기회입니다!"
 LBA_foreign_procurement_lines_cheap_tt: "§Y$LBA_foreign_procurement_boosted$§!로 인해:\n"
 LBA_new_tanks: "현대식 전차"
 LBA_new_tanks_desc: "The majority of the tanks we use are ancient T-55 and T-62 tanks. While decent considering the regional level. If we ever have to go against any more developed countries, we'll be hopelessly outmatched. We need to get something more modern to our stockpiles."
 LBA_new_trucks: "기계화 추진"
 LBA_new_trucks_desc: "우리 차량화 부대는 트럭이나 토요타 테크니컬을 타고 돌아다니기 때문에 군대가 게릴라 집단처럼 보입니다. 현대 군대에는 전차와 유사한 병력 수송 차량이 있으며, 우리도 그것을 갖춰야 합니다."
 LBA_new_artillery: "개선된 화력 지원"
 LBA_new_artillery_desc: "어떤 군대든 전장에서 성공하려면 화력 지원 요소가 필요합니다. 우리 포병 부대를 현대화해야 합니다."
 LBA_local_supply_system: "현지 보급 체계"
 LBA_local_supply_system_desc: "Years of weapon sanctions showed us how easy it is to get cut out off supply lines for new equipment. To remedy this, we should expand our local production so spare parts and replacements are more easily available."
 LBA_expand_airbases: "공군 기지 확장"
 LBA_expand_airbases_desc: "리비아 공군 기지 다수가 열악한 상태입니다. 공군을 확장하려면 먼저 항공기를 보관할 시설을 확장해야 합니다."
 LBA_new_fighters: "제공권"
 LBA_new_fighters_desc: "Our previous experiences fighting against the American Air Force shows the clear lack of proper fighters. With our current planes, we might as well be flying kites against them. We need something much better."
 LBA_new_helicopters: "근접 전투 지원"
 LBA_new_helicopters_desc: "Observing the African conflicts, we have seen the effectiveness of attack helicopters. Flying low against a hidden enemy with no AA capabilities is their primary strenght. Flying jets is pointless, when a more effective way of supporting our troops are helicopters."
 LBA_sabha_launch_site: "세브하 발사장"
 LBA_sabha_launch_site_desc: "1980년대에 서독 기업 OTRAG는 세브하 오아시스를 실험용 우주 로켓의 시험장으로 사용했습니다. 원래 콩고 민주공화국(당시 자이르)의 샤바에서 시험하던 것을 1987년까지 리비아로 옮겨 시험했습니다. 세브하 발사장은 1991년까지 소련 우주 계획의 원격 시험장이기도 했습니다. 이 발사장을 개수하여 우리 자체의 시험 목적에 사용할 수 있습니다."
 LBA_review_the_navy: "해군 점검"
 LBA_review_the_navy_desc: "우리 해군은 주로 1950~60년대의 작동 불능 소련제 잠수함과 초계함으로 이루어져 있으며, '비교적 신형'인 코니급 대형 초계함이 몇 척 있습니다. 이 함정 대부분은 상태가 매우 나빠 연안 방어에나 쓸 수 있을 뿐입니다. 해군은 시급히 현대화되어야 합니다."
 LBA_expand_tripoli_docks: "트리폴리 부두 확장"
 LBA_expand_tripoli_docks_desc: "트리폴리에는 현재 우리 최대 규모의 부두가 있습니다. 그곳 시설은 재화중량 6,000톤까지의 함선을 수리할 수 있습니다. 앞으로 더 큰 함선으로 확장하려면 이 용량을 더욱 늘려야 합니다."
 LBA_expand_benghazi_docks: "벵가지 부두 확장"
 LBA_expand_benghazi_docks_desc: "벵가지 부두는 트리폴리만큼 인상적이지는 않지만 여전히 우리 해군의 필수적인 기지입니다. 현재 항구에는 몇 개의 부유식 독이 있습니다. 부두를 트리폴리와 유사한 기능을 하도록 확장해야 합니다."
 LBA_refurbish_submarines: "잠수함 개수"
 LBA_refurbish_submarines_desc: "우리는 폭스트롯급 잠수함 두 척을 보유하고 있습니다. 1982년 소련으로부터 총 여섯 척을 구입했으나 불행히도 그중 네 척은 이미 완전히 수리가 불가능한 상태에 이르렀습니다. 두 척은 아직 벵가지 해군 기지에 방치되어 있습니다. 소규모 투자로 이를 다시 항해 가능하게 만들 수 있을 것입니다."
 LBA_new_corvettes: "신형 초계함"
 LBA_new_corvettes_desc: "해군을 강화하려면 새 초계함이 필요합니다. 냉전 시절의 것은 도저히 쓸 수 없습니다."
 LBA_tripoli_drydocks: "트리폴리 조선소"
 LBA_tripoli_drydocks_desc: "트리폴리는 우리 최대의 해군 기지이므로, 그곳 조선소를 확장하여 실제로 함선을 건조하고 수리할 수 있도록 하는 것이 합리적입니다."
 LBA_shuffle_officers: "장교 순환 배치"
 LBA_shuffle_officers_desc: "One of Gaddafi's tactics to keep the military in check is by rotating officers frequently. Officers are often be changed from one unit to another, and new ones are promoted to take their place. This means there is always plenty of young officers grateful for their promotion, and the dissident officers can be sent to far-away unimportant postings."
 LBA_expand_rgc: "혁명 수비대 확장"
 LBA_expand_rgc_desc: "혁명 수비대는 정권의 정예 경비대입니다. 정규군의 충성을 신뢰할 수 없습니다. 혁명 수비대를 더욱 큰 병력으로 확장해야 합니다."
 LBA_shift_to_military: "정규군으로 전환"
 LBA_shift_to_military_desc: "우리가 혁명 수비대에 너무 많은 권력을 주었는지도 모릅니다. 소수 엘리트가 결국 우리 정권을 전복할 가능성이 높으므로 권력의 균형을 정규군 쪽으로 옮겨야 합니다."
 LBA_lock_supplies: "보급 통제"
 LBA_lock_supplies_desc: "군수 물자 일부는 혁명 수비대가 통제하고 있습니다. 이를 통해 혁명 수비대는 정규군의 비축 물자를 통제할 수 있습니다. 군이 무기와 탄약에 접근하는 것이 제한되어 반란을 일으킬 여지가 없도록 모든 병참을 혁명 수비대 아래 두어야 합니다. 또한 모든 장비가 사용되지 않고 혁명 수비대 창고에 가지런히 보관되면 마모도 줄어들 것입니다."
 LBA_disarm_rgc: "혁명 수비대 무장 해제"
 LBA_disarm_rgc_desc: "혁명 수비대는 육군 몫으로 의도된 무기를 쥐고 있었습니다. 이 무기를 정당한 주인에게 되찾아 주어야 합니다."
 LBA_new_officer_corps: "신규 장교단"
 LBA_new_officer_corps_desc: "혁명 수비대와 육군 모두에 떠오르는 유망주가 많습니다. 이들을 신속히 중요한 직위에 배치해야 합니다."
 LBA_army_fit_for_libya: "리비아에 걸맞은 군대"
 LBA_army_fit_for_libya_desc: "무타심 카다피, 무암마르 카다피의 아들에 의하면, '서쪽에는 6천만 명의 알제리인이 있고, 동쪽에는 8천만 명의 이집트인이 있으며, 우리 앞에는 유럽이 있고, 남쪽에는 문제를 안고 있는 사하라 이남 아프리카가 있습니다. 우리는 숫자에서 경쟁할 수 없습니다. 따라서 우리는 양보다는 질에 집중해야 합니다.'"
 LBA_army_fit_for_libya_tt: "§Y$LBA_revolutionary_guard_corps$§! 또는 §Y$LBA_armed_forces_of_arab_jamahiriya$§! 중 하나를 보정합니다"
 LBA_economy_of_libya: "리비아 경제"
 LBA_economy_of_libya_desc: "Libyan economy is based on its oil production. 95% of our exports and 60% of our GDP comes from the petroleum industry. While our oil makes us a lot of money (and has given us the highest Human Development Index in Africa), it is risky making our country so dependent on a single resource and the people who own it. In order to secury Libyan economy, diversification is needed."
 LBA_train_depot: "열차 기지"
 LBA_train_depot_desc: "When it comes to rail transport, Libya is an oddity in North Africa.There are no active railways in the whole country. The Italian colonisers built a few smaller lines near Tripoli and Benghazi, but both of these were closed in the 60s. Now, nothing exists. We need to bring Libya to a modern transport system, and for starters we need locomotives for our future railways."
 LBA_tripoli_to_misrata: "트리폴리-미스라타"
 LBA_tripoli_to_misrata_desc: "수도권이 새 철도의 최우선 대상이 되어야 합니다. 주요 도시인 트리폴리와 미스라타를 연결하면 우리도 철도를 건설할 수 있음을 세계에 보여 줄 것입니다."
 LBA_misrata_to_sirte: "미스라타-시르테"
 LBA_misrata_to_sirte_desc: "After connecting Misrata with Tripoli, we should continue line to connect to Sirte, and important hub for our petroleum industry."
 LBA_tobruk_to_benghazi: "벵가지-토브룩"
 LBA_tobruk_to_benghazi_desc: "Benghazi is our most important port in Cyrenaica. We need to create a connection from there near to our border with Egypt to improve our military respoinse time in the event of a conflict. The distance is very long but with enough time and money we can do it."
 LBA_benghazi_to_brega: "벵가지-브레가"
 LBA_benghazi_to_brega_desc: "브레가는 우리 석유 산업의 중요한 정유 중심지입니다. 이를 철도로 벵가지 항구와 연결해야 합니다."
 LBA_connect_east_west_rails: "동서 연결"
 LBA_connect_east_west_rails_desc: "Now that we have rail networks built in the East and in the West, it is time to connect these two networks. Now Libyan will be able to travel across the country in just a few moments."
 LBA_connect_sabha: "세브하 연결"
 LBA_connect_sabha_desc: "세브하는 페잔 지역의 수도이자 리비아 공군의 중요한 항공 기지이며 서독의 우주 운반 로켓 시험장으로까지 쓰였습니다. 이 지역에는 철광석 채굴도 일부 이루어지고 있으며, 철도로 연결하면 채굴 사업을 더 확대할 수 있습니다."
 LBA_connect_jawf: "알자우프 연결"
 LBA_connect_jawf_desc: "알자우프는 리비아 남부 쿠프라 구에서 사실상 유일한 큰 도시입니다. 경제적으로는 보잘것없지만 남쪽 측면을 방어하는 기지 역할을 할 수 있습니다."
 LBA_libyan_rail: "리비아 철도"
 LBA_libyan_rail_desc: "We have finally reached a situation where the government doesn't have to cover every dinar that the railways needs. Because of this, we should organise the railroads into a state owned Libyan Rail company. The amount of people or companies using the railroad isn't enough to cover all of its costs but at least there is now room for growth."
 LBA_kufra_solar_plant: "쿠프라 태양광 발전소"
 LBA_kufra_solar_plant_desc: "리비아는 뜨거운 아프리카의 태양 아래 달구어집니다. 현재 조사에 따르면 리비아는 태양광 패널에 최적인 장소입니다. 태양광 패널은 유지 보수가 많이 필요하며, 이제 알자우프를 철도망에 연결했으므로 그곳은 태양광 발전소를 짓기에 좋은 장소가 될 것입니다."
 LBA_expand_tripoli_airport: "트리폴리 공항 확장"
 LBA_expand_tripoli_airport_desc: "트리폴리 공항은 우리의 주요 국제공항입니다. 이를 확장하면 세계 나머지 지역과의 연결성이 높아질 것입니다."
 LBA_expand_benina_airport: "베니나 공항 확장"
 LBA_expand_benina_airport_desc: "베니나 공항은 리비아에서 두 번째로 큰 공항입니다. 벵가지 바로 옆 베니나 마을에 위치해 있습니다. 유전에서 일할 이주 노동자를 들여오는 데 필수적인 공항입니다."
 LBA_expand_tripoli_port: "트리폴리 항구 확장"
 LBA_expand_tripoli_port_desc: "트리폴리 항구는 로마 시대부터 존재해 온 지중해에서 가장 오래된 항구 중 하나입니다. 리비아로 들어오는 가장 중요한 수입 경로이며, 이를 확장하면 경제를 확대할 여지가 더 생길 것입니다."
 LBA_expand_benghazi_port: "벵가지 항구 확장"
 LBA_expand_benghazi_port_desc: "Benghazi port was founded by the Greeks in 6th century BC. it currently serves as a major hub for exporting our petroleum products. It is important we continue expanding to encourage further growth."
 LBA_organize_desert_trips: "사막 여행 기획"
 LBA_organize_desert_trips_desc: "리비아에는 관광객이 볼거리가 많습니다. 사하라의 사구와 오아시스, 그리스·로마 유적, 오스만 요새, 제2차 세계 대전 전장이 그것입니다. 우리가 가진 이러한 강점을 활용하여 더 많은 관광객을 유치해야 합니다."
 LBA_derna_windpark: "데르나 풍력 발전 단지"
 LBA_derna_windpark_desc: "리비아는 평균 풍속이 매우 높습니다. 예를 들어 데르나 해안 부근은 평균 풍속이 7.5m/s입니다. 이 때문에 데르나는 풍력 발전 단지를 짓기에 완벽한 장소입니다. 풍차는 1940년대부터 오아시스에서 물을 끌어올리는 데 사용되어 왔으므로 우리에게 분명 경험이 있습니다."
 LBA_expand_tourism: "관광 확대"
 LBA_expand_tourism_desc: "시리아의 라타키아, 이집트의 시나이, 튀니지의 튀니스처럼 리비아를 관광객에게 더 매력적인 목적지로 만들기 위해 관광을 더욱 확대해야 합니다."
 LBA_stock_exchange: "증권 거래소 설립"
 LBA_stock_exchange_desc: "리비아에는 증권 거래소가 없습니다. 국제 시장에 더 통합되려면 트리폴리에 증권 거래소를 설립해야 합니다. 국민은 여러 국영 기업에 참여할 선택권을 갖게 될 것입니다."
 LBA_gmmr_kufra: "대인공강 쿠프라"
 LBA_gmmr_kufra_desc: "The desert city of Al-Jawf in the South of Libya in the Al-Kufrah district is one of the few towns in the area. It is sitting right on top of the Nubian Sand Aquifer. It is a good target for expanding the Great Man-Made River. We should allocate additional funds to make the project go quicker."
 LBA_gmmr_ghadames: "대인공강 가다메스"
 LBA_gmmr_ghadames_desc: "나라의 서부 가다메스 인근에는 활용할 수 있는 또 다른 대수층이 있습니다. 이 지역을 대인공강 네트워크에 추가하면 용량이 늘어날 것입니다."
 LBA_western_mountain_power_plant: "서부 산악 발전소"
 LBA_western_mountain_power_plant_desc: "리비아는 현재 가동 중인 낡은 발전소가 하나뿐입니다. 전력 공급을 확보하고 수도 인근에 발전소를 더 지어야 합니다. 알가르비 인근에 복합 사이클 가스 터빈 발전소를 건설할 계획이 있으며, 이를 지원 자금으로 도와야 합니다."
 LBA_gmmr_connect_east_west: "대인공강 완성"
 LBA_gmmr_connect_east_west_desc: "대인공강의 마지막 단계는 시르테에서 미스라타까지 송수관을 건설하여 서부와 동부의 관로망을 연결하는 것입니다. 이후 우리는 진정한 세계 8번째 불가사의를 완성하게 됩니다."
 LBA_zawia_power_plant: "자위야 발전소"
 LBA_zawia_power_plant_desc: "자위야 시에는 천연가스와 석유를 모두 연료로 쓸 수 있는 발전소를 짓기에 좋은 장소가 있습니다. 어쨌든 우리에게는 둘 다 풍부합니다."
 LBA_convert_pipe_factories: "관 공장 전환"
 LBA_convert_pipe_factories_desc: "대인공강을 완성했으니 이를 위해 지어진 관 공장들로 무엇을 할지 결정해야 합니다. 일부는 향후 보수를 위해 필요하지만, 나머지 공장은 수출용으로 다양한 파이프와 배관 설비를 생산하도록 전환해야 합니다."
 LBA_create_ministry_of_agriculture: "농업부 신설"
 LBA_create_ministry_of_agriculture_desc: "리비아에는 농업부가 없으며 모든 농업 사업은 감찰총장실이 처리합니다. 농업 부문을 개혁하려면 농업만을 전담하는 인력이 필요합니다. 이렇게 하면 현재의 농업 부문을 더 효율적으로 활용할 수 있을 것입니다."
 LBA_desalination_plants: "해수 담수화 시설"
 LBA_desalination_plants_desc: "담수를 얻는 방법 중 하나는 바닷물을 이용하는 것입니다. 산업 공정을 통해 염분 농도를 낮추어 식수로 만들 수 있습니다. 해안 지역 사회의 물 접근성을 높이기 위해 담수화 시설을 건설해야 합니다."
 LBA_expand_agriculture: "농업 확대"
 LBA_expand_agriculture_desc: "이제 용수 공급을 확대했으니 우리가 가진 경작지를 더 많이 활용할 수 있을 것입니다."
 LBA_land_reform: "토지 개혁"
 LBA_land_reform_desc: "리비아 농업의 가장 큰 어려움은 담수 부족과 이슬람 상속법이었습니다. 물 문제는 해결되었으나 법은 그대로 남아 있습니다. 상속 시 농장은 모든 아들에게 분할됩니다. 이 때문에 농장이 점점 더 잘게 쪼개졌습니다. 농장이 규모를 유지하고 필요하면 확장까지 할 수 있도록 이 법을 개혁해야 합니다. 물론 이것이 우리가 농사에 직면한 자연적 장애물을 없애지는 못하지만, 우리 상황에서 낼 수 있는 최선입니다."
 LBA_foreign_food_imports: "식량 수입"
 LBA_foreign_food_imports_desc: "힘겨운 싸움을 계속하는 것은 무의미합니다. 리비아는 단순히 자체 식량을 재배하도록 만들어진 땅이 아닙니다. 다른 나라로부터 식량 공급을 확보할 튼튼한 무역망을 구축해야 합니다. 타국에 더 의존하게 되겠지만 농업의 문제는 해소될 것입니다."
 LBA_continue_nationalised_economy: "국유화 경제 유지"
 LBA_continue_nationalised_economy_desc: "리비아의 대기업 대부분은 국가가 통제합니다. 전략적인 이유로 이는 필요한 일입니다. 이익이 그만큼 커지지 않는다 하더라도 외국 기업이 들어와 우리 국민을 식민 지배하도록 놔둘 수 없습니다."
 LBA_liberalise_economy: "경제 민영화"
 LBA_liberalise_economy_desc: "수십 년간 리비아 정부는 가장 큰 기업들을 다수 소유함으로써 국가 경제를 적극적으로 통제해 왔습니다. 더 빠른 경제 성장을 촉진하기 위해 경제 각 부문을 민영화하기 시작해야 합니다."
 LBA_expand_agricultural_bank: "농업 은행 확대"
 LBA_expand_agricultural_bank_desc: "The Agricultural Bank of Libya is responsible for providing guidance and advice to agricultural problems, advancing loands to agricultural cooperatives and developing Libya's agricultural community. Now that we have expanded our agricultural sector, we need to expand the bank's resources to further efficient usage of agricultural land."
 LBA_expand_lisco: "리스코 확장"
 LBA_expand_lisco_desc: "리스코, 즉 리비아 철강 회사는 북아프리카에서 가장 큰 제강 회사 중 하나입니다. 리스코 제품의 가장 큰 국내 사용처는 종합배관회사와 국영석유공사입니다. 이들에 투자함으로써 리비아의 철강 생산을 확대하고 석유 부문에 더 나은 확장 기회를 제공할 수 있습니다."
 LBA_float_national_commercial_bank: "국영 상업은행 상장"
 LBA_float_national_commercial_bank_desc: "We should make the shares of the National Commercial Bank available to the public sector. This will allow us to gather funds for the bank's operation, and bring some much needed capital to the country."
 LBA_join_wto: "WTO 가입"
 LBA_join_wto_desc: "We are not yet a member of the World Trade Organisation. We should apply to join to ensure the world that we want to follow international standards when it comes to commerce. This should encourage foreign investment in the country."
 LBA_nationalise_arabian_cement_company: "아라비아 시멘트 회사 국유화"
 LBA_nationalise_arabian_cement_company_desc: "아라비아 시멘트 회사는 국내 최대의 시멘트, 석회, 석고 생산업체입니다. 건설 자재에 대한 우리의 전략적 수요를 충족하기 위해 국유화해야 합니다."
 LBA_handle_national_oil_corporation: "국영석유공사 관리"
 LBA_handle_national_oil_corporation_desc: "국영석유공사는 우리나라 유전의 상당 부분을 통제합니다. 이들의 정책을 우리 국가 정책에 더 부합하도록 이끌어야 합니다."
 LBA_handle_national_oil_corporation_tt1: "국가 중점 §Y$LBA_continue_nationalised_economy$§!을(를) 완료했다면"
 LBA_handle_national_oil_corporation_tt2: "국가 중점 §Y$LBA_liberalise_economy$§!을(를) 완료했다면"
 LBA_return_arabian_gulf_company_shares: "아라비안 걸프 석유 회사 지분 반환"
 LBA_return_arabian_gulf_company_shares_desc: "The Arabian Gulf Oil Company was formed in 1971, when Libya nationalised oil shares held by British Petroleum. Currently, the oil company is a subsidiary of the National Oil Corporation. We should make the company's shares public again, and return a fair share to BP. This sould guarantee a more efficient exploration of Libyan oil."
 LBA_military_commission_to_truck_and_bus_company: "트럭·버스 회사 군수화"
 LBA_military_commission_to_truck_and_bus_company_desc: "트럭·버스 회사는 1970년대에 이탈리아 IVECO사와의 합작 투자로 설립된 리비아의 버스·트럭 제조업체입니다. 이 회사는 수십 년간 중장비 차량을 제조해 왔으며, 우리 군이 사용할 차량을 생산하는 데 그들의 노하우를 활용해야 합니다."
 LBA_privatise_maritime_transport_company: "국영 해운 회사 민영화"
 LBA_privatise_maritime_transport_company_desc: "GNMTC, 즉 종합국영해운회사는 전 세계에서 다양한 크기의 선박 선단을 운영하는 국영 해운 회사입니다. 크루즈선 운영을 시작하려는 계획까지 있었습니다. 이 회사를 민영화하고 리비아 현지 조선업이 시작될 기회를 만들어야 합니다."
 LBA_state_driven_economy: "국가 주도 경제"
 LBA_state_driven_economy_desc: "리비아 경제 대부분이 이제 중앙 국가의 통제 아래 있습니다. 이것이 국민을 돈에 파묻히게 하지는 않을지 모르지만, 적어도 국민은 자신들을 위한 일자리가 있다는 것을 알며, 국가의 관심사는 남을 위한 이윤 창출이 아니라 국민을 위한 복지 제공에 있습니다."
 LBA_further_resource_expansion: "추가 자원 채굴"
 LBA_further_resource_expansion_desc: "우리 땅에서 자원을 계속 채굴해야 하며 새로운 생산 형태로까지 확장해야 합니다. 미래의 경제를 지탱하려면 더 많은 자원이 필요할 것입니다."
 LBA_modern_economy: "현대 경제"
 LBA_modern_economy_desc: "우리는 냉전기의 침체에서 리비아 경제를 개혁하는 데 성공했습니다. 이제 우리는 더 효율적이며, 앞으로의 성장(과 이윤)은 상승 추세에 있는 것으로 보입니다."
 LBA_negotiations_with_un: "UN과의 협상"
 LBA_negotiations_with_un_desc: "As Libyan oil revenue began to increase in the 1970s, Gaddafi greatly increased his support for various rebel groups across the world. Libya was accused of several international terrorist attacks, including the La Belle bombing 1986, the Lockerbie bombing in 1988 and the downing if UTA Flight 772 in 1989. Eventually, Libya was put under extensive sanctions by the UN, which led to Libya handing over two of the Lockerbie suspects to Scottish authorities in 1999. The sanctions are still in place and we need to open a negotiation line to the UN to remove them."
 LBA_meeting_with_taliban: "탈레반과 회담"
 LBA_meeting_with_taliban_desc: "The Taliban are bravely fighting against the Western colonial powers. We need to close ties with them and help them in their struggle against the New World Order."
 LBA_assassinate_dissidents: "반체제 인사 암살"
 LBA_assassinate_dissidents_desc: "망명 중인 많은 리비아인이 공개적으로 우리 정권에 반대하는 운동을 벌이고 있습니다. 이러한 중상모략은 중단되어야 하며 이들은 제거되어야 합니다."
 LBA_meet_hezbollah: "헤즈볼라와 회담"
 LBA_meet_hezbollah_desc: "헤즈볼라는 이란의 도움을 받아 시온주의에 맞서 싸우고 있습니다. 헤즈볼라 내에서 영향력을 얻으면 이스라엘에 맞선 투쟁에서 강력한 발판을 얻게 됩니다."
 LBA_house_terrorists: "테러리스트 은닉"
 LBA_house_terrorists_desc: "중동과 사하라 전역에서 식민주의에 맞서 싸우는 자유의 투사들, 즉 나머지 세계가 테러리스트라 부르는 이들이 많이 있습니다. 이들이 재집결하고 회복할 수 있도록 은신처를 제공해야 합니다. 어쩌면 그중 일부를 우리 대열에 영입할 수도 있을 것입니다."
 LBA_celebrate_lockerbie_bombers: "로커비 폭파범 기념"
 LBA_celebrate_lockerbie_bombers_desc: "When we dropped a plane right on top of the town of Lockerbie, the world knew what we were capable of. We should not be ashamed of this act, for the world should tremble in terror what we can do when angered."
 LBA_wmds: "원심분리기 확보"
 LBA_wmds_desc: "1970년대 리비아 핵 프로그램이 시작된 이래 대부분의 지식과 물자 조달은 스위스 핵 기술자 프리드리히 티너가 맡아 왔습니다. 그는 여전히 우리 핵 프로그램을 이끌고 있으며, 그의 연줄을 활용해 핵 농축용 원심분리기 제작을 시작해야 합니다."
 LBA_start_building_reactor_desc: "1979년 소련은 IAEA의 감독 아래 타주라에 연구용 원자로를 건설했습니다. 그러나 이는 우리의 원심분리기와 핵무기 생산에는 적합하지 않습니다. 우라늄 생산을 위한 제대로 된 원자로를 건설해야 합니다."
 LBA_start_building_reactor_tt: "§R대량살상무기를 보유했을 가능성이 있는 국가를 공격하기 시작할 만큼 미친 국가가 있다면, 우리가 표적이 될 수도 있습니다!§!"
 LBA_start_building_reactor: "원자로 건설 착수"
 LBA_arms_smuggling: "무기 밀수"
 LBA_arms_smuggling_desc: "국제 제재 때문에 우리는 합법적으로 무기를 구입할 수 없습니다. 그러나 우리 병력을 위해 더 많은 무기를 들여올 수 있는 몇 가지 경로가 여전히 있습니다."
 LBA_buy_nukes: "핵무기 구매"
 LBA_buy_nukes_desc: "Muammar Gaddafi tried to acquire nuclear weapons from other countries multiple times; In 1970, when Gaddafi visited China, he asked premier Zhou Enlai to provide Libya with a nuclear weapon to protect against the Israeli nuclear program. In 1974 Libya joined Pakistan's Project-706 nuclear program but was kicked out in 1978 when general Zia-ul-Haq took power. In 1984 a nuclear pact was signed with India, but no real actions were taken. As the Soviet Union collapsed in 1991, Gaddafi tried to use the chaos to unsuccessfuly acquire nuclear materials. Maybe it has come time to try to acquire nuclear weapons from a 3rd party once again?"
 LBA_buy_nukes_tt: "§R핵무기를 보유하다 적발되면 서방 강국들이 분명 개입할 것입니다!§!"
 LBA_compensation_to_lockerbie_victims: "로커비 피해자 보상"
 LBA_compensation_to_lockerbie_victims_desc: "서방, 특히 영국과의 관계를 바로잡기 위해 로커비 피해자 가족들에게 일부 배상금을 지급하기로 합의해야 합니다. 이는 우리가 국제적 위상 개선에 진지하게 임하고 있음을 보여 줄 것입니다."
 LBA_disarmament_program: "군축 프로그램"
 LBA_disarmament_program_desc: "We have plans for several enriching reactors. We also posses centrifuges and uranium. We have stockpiles of mustard gas, sarin gas and the chemicals to make them. All of this needs to go and be destroyed under Western supervision. These are the conditions given to us by the West. If we get on with their program, they have promised to start easing some of the sanctions."
 LBA_disarmament_program_tt: "§Y[LBA.LBA_friedrich_tinner.GetName]§!을(를) 스위스 당국에 넘겨 그에 대한 처분을 맡깁니다."
 LBA_remove_sanctions: "제재 해제"
 LBA_remove_sanctions_desc: "서방이 마침내 우리에 대한 제재를 해제하기로 합의했습니다. 우리가 더 이상 그들에게 위협이 아니라고 설득했으므로, 우리는 국제 사회로의 복귀를 환영받습니다."
 LBA_invite_foreign_investors: "외국인 투자자 유치"
 LBA_invite_foreign_investors_desc: "Now that we are a free from sanctions, we should invite foreign investors into the country in order to improve the economy."
 LBA_arms_deals_with_italy: "이탈리아와의 무기 거래"
 LBA_arms_deals_with_italy_desc: "과거의 식민 지배자였지만 우리는 이탈리아와 여전히 어느 정도 우호적인 관계를 유지하고 있습니다. 이탈리아는 매우 발전한 군대도 가지고 있습니다. 우리 군을 이탈리아 군과 맞추는 것이 합리적입니다."
 LBA_arms_deals_with_italy_tt: "상대가 수락하면\n"
 LBA_approach_western_leaders: "서방 지도자들에게 접근"
 LBA_approach_western_leaders_desc: "서방은 우리에 대한 제재의 주된 선동자입니다. 그들과의 관계를 개선하기 위해 여러 서방 지도자들에게 접근해야 합니다."
 LBA_taxation_deal_with_uk: "영국과의 과세 협정"
 LBA_taxation_deal_with_uk_desc: "The United Kingdom has one of the largest double tax treaty networks in the world. A double tax treaty allows a company to operate in multiple countries, without having to pay taxes on the same profit multiple times. This encourage companies to branch out and set up permanent offices in other countries. We should sign a similar deal with the United Kingdom to increase our economic attractiveness."
 LBA_compensation_from_italy: "이탈리아의 보상"
 LBA_compensation_from_italy_desc: "For years, Italy exploited our country as a colony. We have heard information that Italy might react positively to paying as reparations from the colonial period in order to improve its public image. We should contact them, and try to negotiate some kind of a deal."
 LBA_request_usaid: "USAID 요청"
 LBA_request_usaid_desc: "USAID는 미국 정부가 운영하는 국제 원조 프로그램으로, 재난 및 빈곤 구호에 중점을 둡니다. 개발도상국의 많은 나라가 이 원조를 받습니다. 우리도 이 프로그램에 참여해야 합니다. 국내에서 미국의 영향력이 커지겠지만 예산의 구멍 몇 군데는 메울 수 있습니다."
 LBA_neighbourly_politics: "이웃 정치"
 LBA_neighbourly_politics_desc: "리비아는 많은 나라에 둘러싸여 있지만, 우리와 좋은 관계를 맺고 있는 나라는 몇 되지 않습니다. 이집트와 차드와의 관계는 과거 전쟁으로 악화되었고, 수단, 니제르, 알제리는 광대한 사막으로 우리와 떨어져 있으며, 유럽은 우리 정권에 매우 적대적입니다. 튀니지만이 우리와 우호적이지만, 그들마저도 두 나라 사이에 방어 요새와 국경 울타리를 지었습니다. 세계에 문을 여는 일은 어려울 것입니다."
 LBA_close_ties_sahrawi: "사흐라위와 긴밀한 관계"
 LBA_close_ties_sahrawi_desc: "We have been a close supporter of the POLISARIO Front in Sahrawi since the 1980s. Many of the weapons for their Liberation Army comes from us or Algeria, and it is not uncommon for Sahrawi students to travel to Libya for their education. Our support for Sahrawi is the greatest success story against colonialism, and we need to increase our support for them."
 LBA_switch_to_morocco: "사흐라위 포기"
 LBA_switch_to_morocco_desc: "사흐라위를 지원한 것은 모로코와의 관계를 악화시켰습니다. 모로코는 떠오르는 경제 강국이며 우리 바로 옆의 강국인 알제리와 대립하고 있습니다. 사흐라위에 대한 무의미한 지원을 접고 대신 모로코와 우호적인 관계를 구축하는 것이 가장 합리적입니다."
 LBA_support_algeria: "알제리 지지"
 LBA_support_algeria_desc: "우리와 마찬가지로 알제리는 오랜 사흐라위 지지국입니다. 알제리는 오래전부터 모로코의 경쟁자였으므로 우리가 알제리와 더 긴밀한 관계를 구축하는 것이 합리적입니다."
 LBA_condemn_spanish_colonialism: "스페인 식민주의 규탄"
 LBA_condemn_spanish_colonialism_desc: "서사하라는 스페인이 모로코에 넘기기 전까지 스페인 소유였으며, 이는 서사하라 분쟁의 토대를 놓았습니다. 그러나 스페인은 세우타와 멜리야가 스페인의 불가분한 일부라고 주장하며 두 도시를 모로코에 반환하기를 거부했습니다. 이는 핑계에 불과합니다. 그 지역들은 정당하게 모로코의 땅입니다."
 LBA_influence_mauritania: "모리타니에 영향력 행사"
 LBA_influence_mauritania_desc: "모리타니는 스페인이 이 지역에서 철수한 뒤 서사하라를 두고 모로코와 짧은 전쟁을 벌였습니다. 이들은 더 이상 이 영토를 주장하지 않지만 서사하라 분쟁을 면밀히 지켜봐 왔으며 폴리사리오 전선의 지지자 중 하나입니다. 서사하라 분쟁을 해결하려면 모리타니에 대한 우리의 통제를 강화하는 것이 중요합니다."
 LBA_casablanca_accords: "카사블랑카 협정"
 LBA_casablanca_accords_desc: "서사하라 분쟁은 수십 년간 동결 상태였으며 누구도 해결하지 못했습니다. 이 지역에서의 우리 영향력을 활용해 분쟁을 해결해야 합니다."
 LBA_casablanca_accords_tt: "임무는 §Y365일§! 동안 활성화됩니다. 임무가 활성화된 동안 우리는 다른 참가국(§Y[ALG.GetNameWithFlag], [MOR.GetNameWithFlag], [SHA.GetNameWithFlag], [MAU.GetNameWithFlag]§!)이 우리가 택한 해법에 동의하도록 설득해야 합니다. 국가들이 우리의 해법에 동의하게 만드는 주된 방법은 §Y영향력§!입니다\n\n"
 LBA_influence_malta: "몰타에 영향력 행사"
 LBA_influence_malta_desc: "몰타는 이탈리아와 리비아 사이의 중요한 디딤돌입니다. 적대 세력이 그곳에 자리 잡는다면 우리 서부 해안을 손쉽게 장악할 것입니다. 몰타와 우호적인 관계를 유지해야 합니다."
 LBA_italian_trade: "이탈리아와의 무역"
 LBA_italian_trade_desc: "과거의 식민 지배자였지만 이탈리아는 우리에게 중요한 파트너입니다. 가까운 거리 덕분에 유럽으로 향하는 좋은 관문이 됩니다."
 LBA_crete_safety: "크레타 확보"
 LBA_crete_safety_desc: "크레타는 나토 회원국이 보유하고 있으며 리비아 동부를 장악하는 데 쉽게 이용될 수 있습니다. 동부 해안선을 방어하기 위한 조치를 취해야 합니다."
 LBA_protect_malta: "몰타 보호"
 LBA_protect_malta_desc: "몰타에 대한 우리의 영향력이 커지고 있습니다. 트리폴리를 해상 공격으로부터 지키기 위해 몰타를 완전히 우리 세력권 안으로 끌어들여야 합니다."
 LBA_protect_crete: "크레타 보호"
 LBA_protect_crete_desc: "크레타는 우리에게 매우 중요한 전략적 의미를 지닙니다. 너무 늦기 전에 지금 이 섬의 통제권을 확보하도록 밀어붙여야 합니다."
 LBA_libyan_sea_dominance: "리비아해 장악"
 LBA_libyan_sea_dominance_desc: "몰타와 크레타를 통제함으로써 우리는 취약한 해안선을 위한 방벽을 만들었습니다. 우리 함선은 리비아해에서 훨씬 쉽게 작전할 수 있을 것입니다."
 LBA_approach_hamas: "하마스 접근"
 LBA_approach_hamas_desc: "하마스는 시온주의를 막으려는 유일한 진정한 세력입니다. 이스라엘을 무너뜨릴 준비를 하기 위해 그들과 더 나은 관계를 구축해야 합니다."
 LBA_send_fighters_to_hamas: "하마스에 전투원 파견"
 LBA_send_fighters_to_hamas_desc: "While the Palestinians are bravely resisting the Zionist invaders, the simple truth is that they are outnumbered. We need arrange a group of volunteers to travel to Palestine and joins Hamas' ranks."
 LBA_new_intifada: "새로운 인티파다"
 LBA_new_intifada_desc: "하마스가 시온주의자들에 맞서 새로운 인티파다를 시작할 때가 왔습니다. 우리의 지원이 있다면 치명적일 것입니다."
 LBA_all_are_idiots: "모두 바보"
 LBA_all_are_idiots_desc: "Like the great leader Gaddafi said, both the Israelis and Palestinians are idiots who can't stop fighting. If we want to solve the problems in the Levant, the solutions needs to come from the outside."
 LBA_claim_jerusalem_for_arabs: "예루살렘을 아랍인에게"
 LBA_claim_jerusalem_for_arabs_desc: "이스라엘인도 팔레스타인인도 이 지역을 가질 자격이 없습니다. 그들은 이 지역을 엉망으로 만들기만 한다는 것을 보여 주었습니다. 진정한 아랍인이 이 지역을 통치하며 평화와 안정을 가져와야 합니다."
 LBA_claim_jerusalem_for_arabs_tt: "레반트의 §Y영유권§! 주를 §Y핵심§!으로 전환할 수 있게 됩니다"
 LBA_reconcile_with_israel: "이스라엘과 화해"
 LBA_reconcile_with_israel_desc: "우리가 이스라엘에 그토록 적대적이었던 것은 어리석은 일이었습니다. 이스라엘은 이 지역의 강력한 군사 및 핵 강국이며 그들이 계속 존재한다는 사실에는 의미가 있을 것입니다. 그들과의 적대적 관계를 복원해야 합니다."
 LBA_recall_libyan_jews: "리비아 유대인 소환"
 LBA_recall_libyan_jews_desc: "In the late 1940s, almost 40 000 Jews lived in Libya. Most of them migrated to Israel after their independence due to horrors suffered under the fascist Italian regime. As Libya gained independence, an anti-Jewish atmosphere continued. By the time Gaddafi took power in 1969, only around a 100 Jews remained in the country. He continued a hard anti-Jewish policy and by 2000 onlya few (known) Jews lived in the country. Expelling these people was a mistake and we should offer them the option of returning to Libya."
 LBA_arms_deal_with_israel: "이스라엘과의 무기 거래"
 LBA_arms_deal_with_israel_desc: "이스라엘은 중동의 군사 강국입니다. 그들의 환심을 사서 현대식 무기에 접근해야 합니다."
 LBA_champion_of_al_aqsa: "알아크사의 수호자"
 LBA_champion_of_al_aqsa_desc: "우리의 행동으로 우리는 모든 무슬림의 수호자가 되었습니다. 알아크사가 마침내 우리 통제 아래 들어왔습니다."
 LBA_southern_focus: "남부 중점"
 LBA_southern_focus_desc: "우리의 남쪽에는 불안정성과 경쟁이 존재하는 지역이 있습니다. 니제르는 이슬람주의 반란에 시달리고 있고, 차드는 우리의 오랜 라이벌이며, 수단은 다르푸르에서 적극적인 충돌을 벌이고 있습니다. 이로 인해 우리의 남부 국경을 따라 불안정과 난민이 넘쳐나고 있으며, 어떤 형태로든 완충 지대를 만드는 것이 합리적일 것입니다."
 LBA_rivalry_with_chad: "차드와의 경쟁"
 LBA_rivalry_with_chad_desc: "토요타 전쟁에서 패배한 이래 차드와의 관계는 껄끄러웠습니다. 언젠가 우리는 복수하고 아오주 지대를 되찾을 것입니다."
 LBA_reconcile_with_chad: "차드와 화해"
 LBA_reconcile_with_chad_desc: "수십 년 전의 원한을 붙들고 있는 것은 유치한 일입니다. 차드와 화해하고 함께 지역의 안정을 위해 노력할 수 있습니다."
 LBA_reclaim_aouzou_strip: "아오주 지대 탈환"
 LBA_reclaim_aouzou_strip_desc: "The Aouzou Strip is a piece of land the Italians ceded from their Libyan colony to the French. We tried to take back the area in the 80s but were defeated by Chad. While the region is poor and sparsely populated, it is still a matter of pride. Also, there might be uranium in the region."
 LBA_reclaim_aouzou_strip_threat: "[LBA.GetNameDef], 아오주 지대 영유권 주장"
 LBA_strip_toubou_of_citizenship: "투부족 시민권 박탈"
 LBA_strip_toubou_of_citizenship_desc: "The Tobou aren't native to Libya. They are simply herders who have crossed the border from Chad onto our side. They have no place in Libya."
 LBA_strip_toubou_of_citizenship_tt: "§R우리가 이전에 소수 민족을 보호하겠다고 약속했기 때문에 리비아 부족들이 크게 분노할 것입니다!§!\n"
 LBA_utilise_toubou: "투부족 활용"
 LBA_utilise_toubou_desc: "지난번 차드를 침공했을 때 우리는 차드 정권에 맞서 싸우는 투부 반군에 자금을 댔습니다. 결국 투부족의 데르데(지도자)의 아들인 구쿠니 웨데이가 차드 대통령이 되었습니다. 차드와의 또 다른 분쟁을 준비하면서 우리는 이 공식을 되풀이하여 투부족을 지원해야 합니다."
 LBA_utilise_toubou_tt: "§Y[CHA.GetNameWithFlag]§!에 선전포고하면 §Y[TIE.GetNameWithFlag]§!의 투부족이 §Y독립을 선언§!하고 우리의 §Y$autonomy_puppet_state$§!이(가) 됩니다"
 LBA_suggest_joint_mining: "공동 채굴 제안"
 LBA_suggest_joint_mining_desc: "차드와 노력을 합치면 아오주 지대에서 막대한 양의 우라늄을 채굴하여 양국이 모두 이익을 볼 수 있을 것입니다."
 LBA_demand_aouzou: "아오주 지대 요구"
 LBA_demand_aouzou_desc: "차드가 아오주 지대의 통제권을 우리에게 넘길 때가 왔습니다. 그들이 거부한다면 우리는 토요타 전쟁 때와 같은 실수를 반복하지 않을 것입니다."
 LBA_demand_aouzou_threat: "[LBA.GetNameDef], 아오주 지대 요구"
 LBA_demand_chads_submission: "차드의 복종 요구"
 LBA_demand_chads_submission_desc: "우리는 차드로부터 아오주 지대를 빼앗는 데 성공했지만, 그들이 무엇을 계획하고 있는지는 알 수 없습니다. 지금 이 순간에도 동맹을 모아 우리를 공격하고 자기 땅을 되찾으려 할 수 있습니다. 적대적인 [CHA.GetLeader] 정부가 물러나고 [ROOT.GetName]에 어느 정도의 안보를 약속할 수 있는 정부가 나라를 장악하도록 요구해야 합니다."
 LBA_demand_chads_submission_tt: "[LBA.GetNameDef], [CHA.GetAdjective] 복종 요구"
 LBA_invest_in_chadian_cotton: "차드산 면화 투자"
 LBA_invest_in_chadian_cotton_desc: "차드의 주요 수출품 중 하나는 면화입니다. 차드의 면화 산업에 투자하고 양질의 면화를 [ROOT.GetName]으로 직접 수입하는 무역 협정을 맺어야 합니다."
 LBA_invest_in_chadian_cotton_tt: "[CHA.GetNameWithFlag]이(가) 동의하면\n"
 libya_chad_uranium_deal_tt: "[CHA.GetNameWithFlag]이(가) 공동 채굴에 동의했습니다"
 LBA_humanitarian_aid_to_chad: "차드에 인도적 지원"
 LBA_humanitarian_aid_to_chad_desc: "차드는 전 세계에서 인간 개발 지수가 가장 낮은 나라 중 하나입니다. 또한 1980년대의 내전에서 제대로 회복한 적이 없으며, 국내에는 아직 반군 단체들이 존재합니다. 차드의 발전을 돕기 위해 대규모 인도적 지원 캠페인을 벌여야 합니다."
 LBA_exploit_chadian_oil: "차드 석유 개발"
 LBA_exploit_chadian_oil_desc: "차드는 최근에야 석유 매장량을 발견했으며 발견될 매장량이 훨씬 더 많습니다. 안타깝게도 차드에는 직접 시추할 자원이 없습니다. 이 나라에서의 영향력을 활용해 그 귀중한 석유를 땅에서 캐내야 합니다."
 LBA_support_darfur: "[DAR.GetName] 지원"
 LBA_support_darfur_desc: "다르푸르는 수단이 국가로 창설된 이후로 계속해서 수단의 지배를 받아왔습니다. 다르푸르는 주로 비아랍 흑인들이 거주하는 지역인 반면, 수단 자체는 주로 아랍인들로 구성되어 있습니다. 다르푸르의 많은 사람들은 아랍 정부가 아랍 인종 차별 캠페인의 대상이 되었다고 느끼고 있습니다. 우리는 다르푸르 사람들이 겪고 있는 억압 상태에서 그들을 지원해야 합니다. 또한, 독립적인 다르푸르는 우리의 남부 국경 근처에 좋은 완충 국가가 될 수 있습니다."
 LBA_support_sudan: "[SUD.GetName] 지원"
 LBA_support_sudan_desc: "오마르 알바시르가 수단에서 집권한 이래 우리와 수단의 관계는 상당히 좋았습니다. 90년대 초에는 두 나라를 통합하자는 제안까지 있었습니다. 수단은 강력한 동맹이자 훌륭한 범아랍·범아프리카 파트너가 될 것입니다."
 LBA_send_mercenaries: "용병 파견"
 LBA_send_mercenaries_desc: "동쪽의 동맹국에 용병을 파견하여 그 정권을 안정시켜야 합니다."
 LBA_send_mercenaries_tt_1: "국가 중점 §Y$LBA_support_darfur$§!을(를) 완료했다면:\n"
 LBA_send_mercenaries_tt_2: "국가 중점 §Y$LBA_support_sudan$§!을(를) 완료했다면:\n"
 LBA_gaddafis_dream: "카다피의 꿈"
 LBA_gaddafis_dream_desc: "Once he came to power, Muammar Gaddafi wanted to create the United Arab States, and even did some progress with temporary unions with Tunisia and Egypt. However, after some bad blood with Arab leaders and the death of Arab nationalism, this dream seems to have crumbled. However, there are other paths Gaddafi could take..."
 LBA_approach_algeria: "알제리 접근"
 LBA_approach_algeria_desc: "Algeria is a long-time partner in the region. Neither of us are really fond of the West, we have struggled together against Islamists and both of us strong supporters of Sahrawi independence from Morocco. It is important we stay on good terms with Algeria."
 LBA_approach_egypt: "이집트 접근"
 LBA_approach_egypt_desc: "우리는 이집트와 그리 강한 유대를 갖고 있지 않습니다. 그러나 이집트는 이 지역의 군사·경제 강국이며 전략적 요충지인 수에즈 운하를 통제하고 있습니다. 그들이 우리 편에 서도록 하는 것이 필수적입니다."
 LBA_approach_eritrea: "에리트레아 접근"
 LBA_approach_eritrea_desc: "에리트레아는 뜻을 같이하는 독재자가 통치하고 있습니다. 또한 밥엘만데브 해협 근처의 핵심 병목 지점을 차지하고 있습니다. 그들과의 전략적 동반자 관계는 우리가 홍해에서 더 많은 힘을 투사할 수 있게 해 줄 것입니다."
 LBA_weapons_to_taylor: "테일러에게 무기 지원"
 LBA_weapons_to_taylor_desc: "우리는 찰스 테일러를 게릴라 전사로 훈련시켰습니다. 1989년 우리는 친미 정부를 전복하기 위해 그를 라이베리아로 보냈고, 이는 제1차 라이베리아 내전으로 이어졌습니다. 테일러는 국내외 반군이 그의 통치를 위협하면서 이제 곤경에 처해 있습니다. 그가 권력을 유지하도록 추가 지원을 보내야 합니다."
 LBA_central_african_mercs: "중앙아프리카 용병"
 LBA_central_african_mercs_desc: "중앙아프리카 공화국 대통령 경호대의 대부분은 리비아 용병으로 구성되어 있습니다. [CAR.GetLeader]에게 아무 일도 생기지 않도록 이 파견대를 증강해야 합니다."
 LBA_red_sea_trade_deal: "홍해 무역 협정"
 LBA_red_sea_trade_deal_desc: "이집트와 에리트레아가 모두 우리에게 우호적이므로 성장을 촉진하기 위해 무역 협정을 맺어야 합니다."
 LBA_meet_mengistu: "멩기스투와 회담"
 LBA_meet_mengistu_desc: "멩기스투 하일레 마리암은 1977년부터 1991년까지 에티오피아를 통치한 좌익 군사 정권 데르그의 수반이었습니다. 그는 1991년 에티오피아를 탈출했고 이로써 오래 이어진 에티오피아 내전이 끝났습니다. 현재 그는 짐바브웨에 살면서 대량 학살 혐의로 궐석 재판을 받고 있습니다. 멩기스투는 중요한 반서방 투사였습니다. 그와 회담을 열어 지지를 표명해야 합니다."
 LBA_meet_mengistu_tt_1: "\n§Y멩기스투§!가 여전히 망명 중이라면:\n"
 LBA_meet_mengistu_tt_2: "\n§Y멩기스투§!가 §Y[ETH.GetNameWithFlag]§!을(를) 통치 중이라면:\n"
 LBA_anti_colonialist: "반식민 연합"
 LBA_anti_colonialist_desc: "통치 기간 내내 카다피는 수많은 독립 및 저항 운동을 지원했습니다. 그의 격렬한 반서방 태도는 많은 사람을 억압에서 해방시켰습니다. 세계에는 아직 억압받는 사람이 많으며 우리의 목표는 모두에게 자유를 주는 것이어야 합니다."
 LBA_anti_colonialist_tt: "영향력이 있는 §Y비신흥국§!에서 §Y내전§!을 일으킬 수 있게 됩니다. 봉기 세력은 전쟁이 시작되면 우리 §Y세력§!에 가입합니다."
 LBA_strive_for_uar: "아랍 연합 공화국 추구"
 LBA_strive_for_uar_desc: "카다피의 첫 번째 목표는 아랍 세계를 통일하는 것이었습니다. 그러나 아랍 민족주의가 쇠퇴하고 카다피가 다른 아랍 지도자들과 충돌하면서 통일의 가능성은 사라졌습니다. 이제 이 문제를 다시 추진하려면 중동의 강력한 세력이 필요할 것입니다. 그러나 충분한 외교력이 있다면 그 구상을 되살릴 수 있을지도 모릅니다."
 LBA_strive_for_african_union: "아프리카 합중국"
 LBA_strive_for_african_union_desc: "아랍 민족주의가 쇠퇴하자 카다피는 관심을 아랍 통일에서 아프리카 대륙 통일로 옮겼습니다. 아프리카가 식민주의로 크게 고통받았으므로 이것이 우리의 중점이 되어야 합니다. 통일해야만 이런 일이 다시 일어나는 것을 막을 수 있습니다."
 LBA_strive_for_african_union_trigger_tt: "§Y신바트주의 아랍 연합 공화국§!을 수립하지 않았습니다"
 LBA_strive_for_african_union_tt: "우리가 §Y$regional_power$§!이 아니더라도 §Y아프리카 연합§!의 정책을 통제할 수 있게 됩니다\n\n또한 카다피가 국가 중점 §Y$LBA_the_real_monarch$§!을(를) 선택할 수 있게 됩니다."
 LBA_strive_for_african_union_unlock_shared_tree_tt: "모든 아프리카 국가에 공유되는 §Y아프리카 연합§! 중점 계통도 갈래와 결정 범주를 활성화합니다. 이는 아프리카 연합을 점점 더 통일에 가깝게 만드는 데 사용됩니다\n\n"
 LBA_islamic_legion: "이슬람 군단"
 LBA_islamic_legion_desc: "1970년대에 카다피는 분쟁에 개입하기 위해 파견되는 정예 전투 부대를 의도한 범아랍·범이슬람주의 준군사 조직을 만들었습니다. 이 군단은 주로 사헬 출신의 가난한 이민자들과 민간 일자리를 얻을 수 있다는 거짓 약속을 받은 파키스탄 및 방글라데시 시민들로 구성되었습니다. 군단은 차드와의 전쟁에서 부진한 성과를 낸 후 해체되었습니다. 이번에는 더 나은 군단을 다시 만들어야 합니다. 의욕이 높은 지원자들로 구성될 것입니다."
 LBA_regional_politics: "지역 정치"
 LBA_regional_politics_desc: "우리의 힘과 영향력이 커짐에 따라 우리의 힘을 아프리카와 중동 전체로 확장해야 합니다."
 LBA_contact_taylor: "테일러와 접촉"
 LBA_contact_taylor_desc: "찰스 테일러는 카다피의 문하생입니다. 그는 서아프리카에서 우리 영향력을 확대하는 열쇠입니다."
 LBA_contact_koroma: "RUF와 접촉"
 LBA_contact_koroma_desc: "The Revolutionary United Front is fighting as part of the Armed Forces Revolutionary Front against Sierra Leone and West African forces. RUF has ties to Charles Taylor and Liberia and keeping them running is important."
 LBA_new_liberian_revolution: "새로운 라이베리아 혁명"
 LBA_new_liberian_revolution_desc: "라이베리아에서 찰스 테일러를 지원한 것은 카다피의 해외 작전 중 비교적 성공적인 사례였습니다. 이 지역에 모든 중점을 두어야 합니다."
 LBA_new_liberian_revolution_tt: "§G혁명이 성공하면 [THIS.GetNameDef](은)는 우리의 괴뢰국이 됩니다. 실패하면 내전이 시작되고 반란 측이 우리의 괴뢰국이 됩니다§!"
 LBA_spread_fire_to_guinea: "기니로 불길 확산"
 LBA_spread_fire_to_guinea_desc: "기니는 테일러를 막으려 했습니다. 그들에게 누가 주인인지 보여 주어야 합니다."
 LBA_spread_fire_to_ivory_coast: "코트디부아르로 불길 확산"
 LBA_spread_fire_to_ivory_coast_desc: "코트디부아르는 반테일러 민병대의 기지 역할을 해 왔습니다. 라이베리아의 동쪽 측면을 확보해야 합니다."
 LBA_reinforce_central_african_mercs: "중앙아프리카 용병 증강"
 LBA_reinforce_central_african_mercs_desc: "Our detachment of mercenaries is working wonders in the Central African republic. We need extend our 'protection' of the Central African leadership with additional mercenaries."
 LBA_mercenary_coup: "중앙아프리카 공화국 전복"
 LBA_mercenary_coup_desc: "중앙아프리카 대통령 경호대가 우리 손아귀에 있으므로, 집권 대통령을 더 선호하는 후보로 교체하는 것은 어렵지 않을 것입니다. 물론 안보상의 이유입니다."
 LBA_incursion_to_rep_congo: "콩고 침투"
 LBA_incursion_to_rep_congo_desc: "콩고를 장악함으로써 중앙아프리카로부터의 해상 경로를 확보할 것입니다. 이는 대륙 내륙에 대한 접근성을 높여 줄 것입니다."
 LBA_incursion_to_drc: "콩고 민주 공화국 침투"
 LBA_incursion_to_drc_desc: "콩고 민주공화국은 천연자원이 풍부합니다. 그 자원을 손에 넣어야 합니다."
 LBA_djibouti_base: "지부티 해군 기지"
 LBA_djibouti_base_desc: "지부티는 홍해의 전략적 병목 지점인 밥엘만데브 해협에 자리하고 있습니다. 지부티에 대한 영향력을 늘리면 이집트에 발을 들이지 않고도 수에즈 해협을 통제할 수 있습니다."
 LBA_destability_somalia: "Fund Destability Of Somalia"
 LBA_destability_somalia_desc: "소말리아는 90년대 시아드 바레의 몰락 이후 엉망이 되었습니다. 나라는 내전 중이고 분리주의 지역들이 떨어져 나갔으며, 소말리아 해안은 해적이 들끓고 지하디스트들이 국내에서 자유롭게 활동합니다. 나라를 불안정하게 유지함으로써 우리는 이 지역에 계속 주둔할 구실을 얻습니다."
 LBA_destability_somalia_tt: "[SML.GetNameWithFlag] 및 [PUN.GetNameWithFlag]은(는) 두 선택지 중 하나를 고릅니다:\n"
 LBA_arm_ethiopian_tribes: "에티오피아 부족 무장"
 LBA_arm_ethiopian_tribes_desc: "에티오피아 동부에는 오가덴 지역이 있습니다. 이 지역에는 여러 소말리 부족이 거주합니다. 두 나라는 1970년대에 이 지역을 놓고 짧은 전쟁을 벌였습니다. 여러 부족에 무기를 보내면 에티오피아 국가에 대한 저항이 틀림없이 일어날 것입니다."
 LBA_organise_eth_som_conflict: "대리 분쟁 조직"
 LBA_organise_eth_som_conflict_desc: "전략적으로 배치된 요원 몇 명이 있으면 아프리카의 뿔 전체를 분쟁에 휩싸이게 할 수 있습니다. 이 지역이 완전한 혼란에 빠지면 우리는 개입할 완벽한 구실을 얻게 됩니다."
 LBA_intervene_for_stability: "안정을 위한 개입"
 LBA_intervene_for_stability_desc: "아프리카의 뿔은 혼란에 빠져 있습니다. 억압적 정권 아래서 고통받는 불쌍한 사람들을 구하기 위해 개입해야 합니다. 이는 아프리카를 위한 일입니다."
 LBA_influence_yemen: "예멘에 영향력 행사"
 LBA_influence_yemen_desc: "Yemen controls the Northern side of the Mandeb strait. Just like Djibouti, their friendliness towards us is detrimental."
 LBA_infiltrate_kuwait: "쿠웨이트 침투"
 LBA_infiltrate_kuwait_desc: "The Royals in the Arabian Gulf are nothing but Western puppets that use their dirty oil money to oppress the faithful Arabs. The Kuwaitis are one of the worst offenders. Luckily, there is an Islamic preacher, Hakem Al-Mutairi, who is shares our view of the Kuwaiti regime."
 LBA_occupy_socotra_desc: "아프리카의 뿔 끝에 자리한 소코트라 섬은 홍해 입구를 지키는 망루처럼 서 있습니다. 이 섬을 장악하면 인도양을 통제하기 좋은 위치를 얻게 됩니다."
 LBA_occupy_socotra: "소코트라 점령"
 LBA_fortify_socotra: "소코트라 요새화"
 LBA_fortify_socotra_desc: "이제 소코트라가 우리 통제 아래 있으니 우리의 입지를 강화하기 위해 섬을 요새화해야 합니다."
 LBA_contact_qatar: "카타르와 접촉"
 LBA_contact_qatar_desc: "카타르는 다른 걸프 국가들과 다릅니다. CIA의 자금을 받는 와하비의 개가 아니라 무슬림 형제단 쪽으로 지향하고 있습니다. 이는 그들을 약간 덜 나쁘게 만듭니다. 그러나 우리와 마찬가지로 그들도 사우디를 그다지 좋아하지 않습니다. 그들이 우리와 더 긴밀히 보조를 맞추도록 설득할 수 있을지도 모릅니다."
 LBA_overthrow_saudis: "사우디 전복"
 LBA_overthrow_saudis_desc: "사우디는 우리가 [SAU.GetLeader] 암살을 시도했다고 비난했습니다. 이는 물론 완전히 터무니없는 소리입니다. 그들은 자신들의 잔혹하고 어두운 정권을 감추려고 우리에 대한 비방 캠페인을 벌이고 있습니다. 그들을 무너뜨려야 합니다."
 LBA_overthrow_kuwaitis: "쿠웨이트 정권 전복"
 LBA_overthrow_kuwaitis_desc: "The time has come to end the Al-Sabah over our Kuwaiti brothers."
 LibyaFocus.1.t: "보코 하람과 동맹을 맺은 [FROM.GetNameDef]"
 LibyaFocus.1.desc: "보코 하람 전투원들이 북쪽 국경을 넘어 [FROM.GetNameDef](으)로 이동하고 있다는 우려스러운 보고가 여러 건 들어왔습니다. 보코 하람 수뇌부가 [FROM.GetAdjective] 측과 협의를 가졌으며, [FROM.GetAdjective] 훈련소에서도 보코 하람 전투원이 목격되었습니다. 이제 보코 하람의 반란 뒤에 강력한 세력이 있는 것으로 보이며, 이는 우리에게 문제가 될 수 있습니다."
 LibyaFocus.1.a: "우려스럽군"
 LibyaFocus.2.t: "보코 하람의 봉기"
 LibyaFocus.2.desc: "Several cities in Northern Nigeria have become under attack by Boko Haram militants. There are reports of Boko Haram fighters being accompanied by soldiers speaking in Arabic and dressed in [LBA.GetAdjective] Army uniforms. It seems that the Islamists have launched a combined attack against us."
 LibyaFocus.2.a: "신이 원하신다!"
 LibyaFocus.2.b: "알라후 아크바르!"
 LibyaFocus.3.t: "보코 하람의 봉기"
 LibyaFocus.3.desc: "Several cities in Northern Nigeria have become under attack by Boko Haram militants due to our agitation. Now is the time to push across the border and help our Islamic brothers."
 LibyaFocus.3.a: "라고스를 향해 진격하라!"
 LibyaFocus.4.t: "1:1 - 통치 기구"
 LibyaFocus.4.desc: "원래의 '녹색 책'은 국민이 나라를 통제할 수 있도록 인민 의회를 통한 직접 민주주의의 수립을 요구합니다. 그러나 실제로는 정책이 위에서 하달되고, 의회는 허울에 불과합니다. 일반 인민 회의와 혁명 위원회 사이의 현재 경쟁을 곰곰이 생각하던 [LBA.GetLeader]은(는) 펜을 들어 적기 시작합니다..."
 LibyaFocus.4.a: "'국민이 자신의 통치를 직접 통제해야 한다. 그렇지 않다면...'"
 LibyaFocus.4.b: "'복잡한 사안에 대한 정치적 토론을 보장하려면 다원적 파벌이 존재해야 한다...'"
 LibyaFocus.4.c: "'국민은 각 분야의 전문가가 아니므로, 선택된 핵심 인물들이 나서야 한다...'"
 LibyaFocus.5.t: "1:3 - 정당"
 LibyaFocus.5.desc: "현재의 정치 환경에서 리비아의 정당은 금지되어 있습니다(몇몇은 지하에서 활동합니다). 대신 사람들은 지역 인민 의회를 중심으로 지역 차원에서 활동하도록 권장됩니다. 어쩌면 미래에는..."
 LibyaFocus.5.a: "'집단의 힘을 위해 사람들은 인민 연합, 즉 정당으로 뭉쳐야 한다...'"
 LibyaFocus.5.b: "'인민 의회가 국민 속에서 더 강한 역할을 맡아 주된 통로가 되어야 한다...'"
 LibyaFocus.5.c: "'지하의 제3열은 국민의 ...을 훼손하지 못하도록 제거되어야 한다...'"
 LibyaFocus.6.t: "1:8 - 사회의 행실은 누가 감독하는가?"
 LibyaFocus.6.desc: "Libyan policing is two-fold; there is the normal police, but there are also the Revolutionary Committees that hire regular citizens as informant. There is much political control over the country, but is this the right way for Libya? Well, according to [LBA.GetLeader]..."
 LibyaFocus.6.a: "'국민은 스스로를 감시해야 한다. 어떻게 대우받고 싶은지는 오직 그들만이 알기 때문이다...'"
 LibyaFocus.6.b: "'감시견이 주인을 지켜보듯, 주인도 감시견을 지켜보아야 한다...'"
 LibyaFocus.6.c: "'혁명 위원회는 국민으로 이루어져 있고 국민을 위한 것이다. 그러므로 그들은...'"
 LibyaFocus.7.t: "1:10 - 언론"
 LibyaFocus.7.desc: "리비아의 언론은 정부의 엄격한 통제를 받고 있습니다. 핵심 이념은 인민 위원회가 언론의 내용을 조정한다는 것이지만, 현실에서는 그렇지 않습니다. 언론에 관해서라면 분명히..."
 LibyaFocus.7.a: "'국민은 자신의 의견을 밝히고 사회를 논평할 권리를 가져야 한다...'"
 LibyaFocus.7.b: "'개인은 위원회에 의견을 제출할 수 있으며, 위원회는 해가 되지 않도록 보장한다...'"
 LibyaFocus.7.c: "'위원회는 국민으로 구성되어 있으므로, 이미 국민의 의견을 알고 있다...'"
 LibyaFocus.8.t: "2:13 - 주택"
 LibyaFocus.8.desc: "카다피의 혁명 이후, 주택 소유는 1인당 1채로 제한되었고 모든 임대 주택은 정부가 소유하게 되었습니다. 이는 사람들이 집을 임대하여 주택을 상품으로 만드는 것을 막기 위한 조치였습니다. [LBA.GetLeader]은(는) 트리폴리의 대통령궁 창가에서 도시를 바라보다가 한 가지 생각이 떠오릅니다..."
 LibyaFocus.8.a: "'사람은 동료들에게 저렴한 주거를 제공하기 위해 두 번째 집을 살 수 있어야 한다...'"
 LibyaFocus.8.b: "'정부가 저렴한 주거를 제공할 수 있다는 것은 좋은 일이다. 어떤 집주인도...'"
 LibyaFocus.8.c: "'사람들 사이의 부를 평등하게 하려면, 국가가 모든 ...을 소유하는 것이 타당하다...'"
 LibyaFocus.9.t: "2:14 - 소득"
 LibyaFocus.9.desc: "'녹색 책'은 기업의 공동 소유를 통해 모든 노동자에게 돈이 돌아가도록 요구하지만, 실제로는 여전히 민간 소유와 임금 노동자가 나라에 넘쳐납니다. 최근 제조 공장을 시찰한 뒤 [LBA.GetLeader]의 머릿속에는 하나의 질문이 떠나지 않았습니다. 사람에게는 자기 이마의 땀방울에 대한 권리가 없는가?"
 LibyaFocus.9.a: "워싱턴의 남자는 말한다. '아니다, 그것은 가난한 이들의 것이다'"
 LibyaFocus.9.b: "바티칸의 남자는 말한다. '아니다, 그것은 신의 것이다'"
 LibyaFocus.9.c: "모스크바의 남자는 말한다. '아니다, 그것은 모두의 것이다'"
 LibyaFocus.10.t: "2:16 - 토지"
 LibyaFocus.10.desc: "여러 채의 주택에 대한 민간 소유가 금지된 직후인 1986년, 토지 소유가 전면 금지되었습니다(공교롭게도 토지 등기소와 모든 기록이 불타 없어진 시기와 같았습니다). 이는 리비아의 모든 토지가 명목상 국가의 소유이며, 재산이 여기저기로 재분배되었음을 뜻합니다. 부족 지도자들과의 최근 회담 뒤, [LBA.GetLeader]은(는) 잠자리에 들며 온갖 생각이 머릿속을 스칩니다..."
 LibyaFocus.10.a: "'Surely a hard working man should be allowed own the land he spends his days working...'"
 LibyaFocus.10.b: "'부족 간 반목을 막으려면 국가가 땅을 나누어 주는 편이 낫다...'"
 LibyaFocus.10.c: "'어쩌면 처음부터 다시 시작해야 할지도 모른다. 내일 새로운 토지 몰수법을 기초해야겠다...'"
 LibyaFocus.11.t: "3:21 - 부족의 가치"
 LibyaFocus.11.desc: "카다피는 사회 형성에 있어 리비아 부족의 중요성을 언급하며 그들을 달래 왔습니다. 그러나 이는 리비아 민족에 대한 그의 사상, 곧 공통의 정체성을 구축하고 국가가 국민을 통제해야 한다는 필요와 충돌합니다. 부족과 민족 사이의 경쟁이 계속되면 리비아는 앞으로 나아갈 수 없으므로, 결국 한쪽을 선택해야 합니다. 이를 해결하기 위해 [LBA.GetLeader]은(는) 다음과 같이 생각했습니다..."
 LibyaFocus.11.a: "'부족은 모든 사람의 가족이다. 오직 부족만이 필요한 자질을 줄 수 있다...'"
 LibyaFocus.11.b: "'어른의 말에 귀를 기울이는 것도 중요하지만, 국가에 봉사할 준비도 되어 있어야 한다...'"
 LibyaFocus.11.c: "'국가는 사람들을 해방하기 위해 봉건적 과거에서 벗어나도록 이끌어야 한다. 농노는...'"
 LibyaFocus.12.t: "3:24 - 소수 민족"
 LibyaFocus.12.desc: "Libya is predominantly Arab, with a small minority of Tuaregs and Toubou in the South of the country. At such, the Green Book's declaration of protecting minorities is an easy one to make, as in Libya they can almost be ignored. The minorities in Libya are doing considerably worse than the majority population, and it seems that the Green Book has failed. As he is touring the country side in the back seat of his limousine, [LBA.GetLeader] scribbles on a piece of paper..."
 LibyaFocus.12.a: "'나라가 없는 소수 민족은 환영받아야 하며, 우리가 그들에게 나라를 줄 수 있다...'"
 LibyaFocus.12.b: "'소수 민족은 스스로의 길을 개척해야 한다. 그것이 그들의 운명이라면 나라는 세워질 것이다...'"
 LibyaFocus.12.c: "'한 나라가 설 자리밖에 없다. 나라가 없는 소수 민족은 우리 나라를 위태롭게 한다...'"
 LibyaFocus.13.t: "3:25 - 세계에서 승리할 흑인"
 LibyaFocus.13.desc: "[LBA.GetLeader]은(는) 낡은 '녹색 책'의 한 장을 고문에게 읽어 주었습니다. 그 내용은 흑인이 문화적 이유와 피임을 하지 않는 탓에 빠르게 번식하여 지구를 지배하게 될 것이며, 무더운 아프리카 기후 때문에 노동의 가치를 낮게 여긴다는 것이었습니다. 읽기를 마치자 돌아온 것은 어리둥절한 표정이었습니다. 고문과 그 사이에 어색한 침묵이 흐르고, 고문이 막 입을 열려는 순간 [LBA.GetLeader]이(가) 말을 가로막으며 이렇게 말합니다..."
 LibyaFocus.13.a: "'나만 그렇게 느끼는 건지 모르겠지만, 이건 조금 인종차별적으로 들리는군...'"
 LibyaFocus.13.b: "'자, 나는 인종차별주의자가 아니네. 하지만...'"
 LibyaFocus.13.c: "'자, 나는 인종차별주의자일세. 하지만...'"
 LibyaFocus.14.t: "3:28 - 스포츠, 승마, 무대"
 LibyaFocus.14.desc: "The Green Book encourages citizens to actively take part in sports and entertainment, rather than just simply consuming them. Especially football is a popular past time in the country. While people taking part in sports is definitely good for the national health, not having a monetised and profitable sports sector does hurt our bottom line. After watching the Al-Ittihad Football Club win yet another Premier League, [LBA.GetLeader] enjoyed a wild night of partying to celebrate. As he lays in bed contemplating his hangover, watching the morning news and enjoying pizza, something the news anchor says starts to click..."
 LibyaFocus.14.a: "'우리 리비아인은 축구에 열정적이다. 어쩌면 더 많은 돈을 낼 만큼 열정적일지도 모른다...'"
 LibyaFocus.14.b: "'오늘 날씨는 어떨까...'"
 LibyaFocus.14.c: "'남이 뛰는 걸 앉아서 구경만 할 이유가 있나, 내가 직접 뛰면 되지 않나? 내 신발이 어디 있더라...'"
 LibyaFocus.15.t: "리비아 왕실 암살"
 LibyaFocus.15.da: "Libyan Royal Family has been assassinated!\n\nAs the family was having a yearly reunion party in London, an explosive device was set off under one of the dinner tables. Destroying most of the floor of the building, Crown Prince Muhammad and his cousing Ahmed were caught in the direct blast. A pretender to the throne, Idris, died of his wound later in the hospital, while his son Khaled was already dead when the emergency services arrived on scene. Several civilians were also killed and injured in the explosion.\n\nScotland Yard is already investigating the case, and our security services have announced that they had identified the perpetrator, but had no time to warn the British authorities of the threat."
 LibyaFocus.15.db: "리비아 왕실이 암살되었습니다!\n\n왕실 가족이 런던에서 연례 모임 파티를 마치고 나서던 중, 검은색 SUV 여러 대가 건물 앞에 멈춰 서더니 복면을 쓴 무장 괴한들이 뛰어내렸습니다. 이들은 왕실 가족에게 총격을 가했으며, 목격자들에 따르면 수류탄 두 발을 던지기까지 했습니다. 왕실 경호원들은 공격자들에게 몇 발 응사하는 데 그쳤고, 가족 전원이 총격에 쓰러졌습니다. 이 공격으로 여러 민간인도 사망하거나 부상을 입었습니다.\n\n스코틀랜드 야드는 이미 사건을 수사 중이며, 우리 보안 기관은 범인을 파악했으나 영국 당국에 위협을 경고할 시간이 없었다고 밝혔습니다."
 LibyaFocus.15.dc: "리비아 왕실이 암살되었습니다!\n\n우리 요원이 왕실 가족이 휴가를 갈 때 이용하던 전용기에 폭탄을 설치했습니다. 비행기가 영국 해협에 도달했을 때 폭탄이 터졌습니다. 폭발로 인한 잔해는 해협에 떨어졌으며, 생존자에 대한 보고는 없습니다.\n\n영국 당국은 이미 사건을 수사 중이며, 우리 보안 기관은 범인을 파악했으나 영국 당국에 위협을 경고할 시간이 없었다고 밝혔습니다."
 LibyaFocus.15.dd: "리비아 왕실이 암살되었습니다!\n\n왕실 가족이 전용기로 휴가를 떠나던 중, 우리 요원이 조종사를 기절시키고 조종사의 옷으로 변장했습니다. 그가 기내로 들어갈 때 가족은 눈길 한 번 주지 않았습니다. 그는 조종석 문을 잠갔고, 비행기가 영국 해협 상공에 이르자 용감한 순교자는 비행기를 바다로 처박았습니다. 지금까지 생존자에 대한 보고는 없습니다.\n\n영국 당국은 이미 사건을 수사 중이며, 우리 보안 기관은 범인을 파악했으나 영국 당국에 위협을 경고할 시간이 없었다고 밝혔습니다."
 LibyaFocus.15.a: "그들이 믿어 주기를 바랄 뿐이다"
 LibyaFocus.16.t: "리비아 왕실 암살"
 LibyaFocus.16.da: "Libyan Royal Family has been assassinated!\n\nAs the family was having a yearly reunion party in London, an explosive device was set off under one of the dinner tables. Destroying most of the floor of the building, Crown Prince Muhammad and his cousing Ahmed were caught in the direct blast. A pretender to the throne, Idris, died of his wound later in the hospital, while his son Khaled was already dead when the emergency services arrived on scene. Several civilians were also killed and injured in the explosion.\n\nScotland Yard is already investigating the case, and the Libyan security services have announced that they had identified the perpetrator, but had no time to warn the British authorities of the threat."
 LibyaFocus.16.db: "리비아 왕실이 암살되었습니다!\n\n왕실 가족이 런던에서 연례 모임 파티를 마치고 나서던 중, 검은색 SUV 여러 대가 건물 앞에 멈춰 서더니 복면을 쓴 무장 괴한들이 뛰어내렸습니다. 이들은 왕실 가족에게 총격을 가했으며, 목격자들에 따르면 수류탄 두 발을 던지기까지 했습니다. 왕실 경호원들은 공격자들에게 몇 발 응사하는 데 그쳤고, 가족 전원이 총격에 쓰러졌습니다. 이 공격으로 여러 민간인도 사망하거나 부상을 입었습니다.\n\n스코틀랜드 야드는 이미 사건을 수사 중이며, 리비아 보안 기관은 범인을 파악했으나 영국 당국에 위협을 경고할 시간이 없었다고 밝혔습니다."
 LibyaFocus.16.dc: "리비아 왕실이 암살되었습니다!\n\n왕실 가족의 전용기가 휴가지로 가기 위해 영국 해협 상공을 날던 중, 폭발이 일어나 비행기가 산산조각 났습니다. 폭발은 기내에 설치된 폭탄 때문일 가능성이 높습니다. 폭발로 인한 잔해는 해협에 떨어졌으며, 지금까지 생존자는 발견되지 않았습니다.\n\n영국 당국은 이미 사건을 수사 중이며, 리비아 보안 기관은 범인을 파악했으나 영국 당국에 위협을 경고할 시간이 없었다고 밝혔습니다."
 LibyaFocus.16.dd: "Libyan Royal Family has been assassinated!\n\nAs their private jet was flying over the English Channel on its way to a holiday destination, the plane stopped responding to radio calls and turned off its transponder. A few minutes later, the plane plummeted into the ocean. So far we have seen no reports of survivors. The reason for the crash is still unclear, but the pilot of the plane was found knocked out at the airpot, meaning whoever was flying the plane wasn't supposed to be doing so.\n\nThe British authorities are already investigating the case, and the Libyan security services have announced that they had identified the perpetrator, but had no time to warn the British authorities of the threat."
 LibyaFocus.16.a: "또 하나의 로커비 사건인가?"
 LibyaFocus.17.t: "리비아 왕실 암살 실패"
 LibyaFocus.17.da: "암살이 실패했습니다!\n\n왕실 가족이 런던에서 연례 모임 파티를 열고 있던 중, 우리 요원은 하인으로 변장하여 만찬에 폭탄을 반입하기로 되어 있었습니다. 그러나 문에 설치된 금속 탐지기를 계산에 넣지 못했고, 그가 숨긴 총기 때문에 경보가 울렸습니다. 요원은 권총을 꺼내 상황을 수습하려 했으나 경호원들에게 곧바로 사살되었습니다.\n\n스코틀랜드 야드는 이미 사건을 수사 중이며, 우리 보안 기관은 범인을 파악했으나 영국 당국에 위협을 경고할 시간이 없었다고 밝혔습니다."
 LibyaFocus.17.db: "암살이 실패했습니다!\n\n왕실 가족이 런던에서 연례 모임 파티를 마치고 나서던 중, 검은색 SUV 여러 대가 건물 앞에 멈춰 서더니 복면을 쓴 무장 괴한들이 뛰어내렸습니다. 이들은 왕실 가족에게 총격을 가했으며, 목격자들에 따르면 수류탄 두 발을 던지기까지 했습니다. 어찌 된 영문인지 가족 중 누구도 맞지 않았고, 공격자들과 경호원들 사이에 짧은 교전이 오간 뒤 공격자들은 경찰의 추격을 받으며 달아났습니다.\n\n스코틀랜드 야드는 이미 사건을 수사 중이며, 우리 보안 기관은 범인을 파악했으나 영국 당국에 위협을 경고할 시간이 없었다고 밝혔습니다."
 LibyaFocus.17.dc: "암살이 실패했습니다!\n\n우리 요원은 왕실 가족이 휴가를 가기 위해 타는 전용기에 폭탄을 설치하기로 되어 있었습니다. 그러나 이륙 전 정기 점검 중 한 기술자가 폭탄을 발견했고 폭발물 처리반이 출동했습니다. 다행히 우리 요원은 탈출에 성공했으나, 경찰이 바짝 추격하고 있습니다.\n\n영국 당국은 이미 사건을 수사 중이며, 우리 보안 기관은 범인을 파악했으나 영국 당국에 위협을 경고할 시간이 없었다고 밝혔습니다."
 LibyaFocus.17.dd: "암살이 실패했습니다!\n\n왕실 가족이 전용기로 휴가를 떠나던 중, 우리 요원이 조종사를 기절시키고 조종사의 옷으로 변장했습니다. 그러나 왕세자가 여러 번 함께 비행한 조종사에게 인사를 건네다가 우리 요원을 알아차렸습니다. 우리 요원은 왕세자의 경호원들에게 곧바로 제압되었습니다.\n\n영국 당국은 이미 사건을 수사 중이며, 우리 보안 기관은 범인을 파악했으나 영국 당국에 위협을 경고할 시간이 없었다고 밝혔습니다."
 LibyaFocus.17.a: "다음번에는 IRA를 고용하자"
 LibyaFocus.18.t: "리비아 왕실 암살 시도"
 LibyaFocus.18.da: "리비아 왕실에 대한 암살 시도가 저지되었습니다.\n\n왕실 가족이 런던에서 연례 모임 파티를 열고 있던 중, 무장한 범인이 금속 탐지기에 적발되었습니다. 상황은 곧 총격전으로 번졌고, 이후 범인이 폭발물도 소지하고 있었음이 밝혀졌습니다.\n\n스코틀랜드 야드는 이미 사건을 수사 중이며, 리비아 보안 기관은 범인을 파악했으나 영국 당국에 위협을 경고할 시간이 없었다고 밝혔습니다."
 LibyaFocus.18.db: "리비아 왕실에 대한 암살 시도가 저지되었습니다.\n\n왕실 가족이 런던에서 연례 모임 파티를 마치고 나서던 중, 검은색 SUV 여러 대가 건물 앞에 멈춰 서더니 복면을 쓴 무장 괴한들이 뛰어내렸습니다. 이들은 왕실 가족에게 총격을 가했으며, 목격자들에 따르면 수류탄 두 발을 던지기까지 했습니다. 어찌 된 영문인지 가족 중 누구도 맞지 않았고, 공격자들과 경호원들 사이에 짧은 교전이 오간 뒤 공격자들은 경찰의 추격을 받으며 달아났습니다.\n\n스코틀랜드 야드는 이미 사건을 수사 중이며, 리비아 보안 기관은 범인을 파악했으나 영국 당국에 위협을 경고할 시간이 없었다고 밝혔습니다."
 LibyaFocus.18.dc: "리비아 왕실에 대한 암살 시도가 저지되었습니다.\n\n왕실 가족이 휴가지로 가기 위해 전용기에 탑승할 준비를 하던 중, 이륙 전 점검에서 한 기술자가 기체에 부착된 폭탄을 발견했습니다. 폭탄은 폭발물 처리반이 해체했습니다. 그러나 현재로서는 누가 폭탄을 설치했는지에 대한 정보가 없습니다.\n\n영국 당국은 이미 사건을 수사 중이며, 리비아 보안 기관은 범인을 파악했으나 영국 당국에 위협을 경고할 시간이 없었다고 밝혔습니다."
 LibyaFocus.18.dd: "리비아 왕실에 대한 암살 시도가 저지되었습니다.\n\n왕실 가족이 전용기로 휴가를 떠나던 중, 왕세자는 평소의 조종사가 아무런 통보도 없이 전혀 다른 사람으로 바뀌었음을 알아차렸습니다. 짧은 심문 끝에 그 남자는 왕세자의 경호원들에게 제압되어 경찰에 넘겨졌습니다. 진짜 조종사는 이후 공항에서 기절한 채 발견되었습니다.\n\n영국 당국은 이미 사건을 수사 중이며, 리비아 보안 기관은 범인을 파악했으나 영국 당국에 위협을 경고할 시간이 없었다고 밝혔습니다."
 LibyaFocus.18.a: "배후에 누가 있을까?"
 LibyaFocus.19.t: "리비아와 테러의 연관성 발견"
 LibyaFocus.19.d: "우리 보안 기관은 리비아 왕실을 노린 최근의 테러 공격을 조사했습니다. 심문과 데이터 흐름, 자금과 무기의 추적을 통해 리비아 정부와 테러범 사이의 연관성을 찾아냈습니다. 리비아 정권이 왕실에 대한 공격을 기획했거나 최소한 자금을 댔다는 것은 거의 확실합니다."
 LibyaFocus.19.a: "공개 사과를 요구한다!"
 LibyaFocus.19.b: "더 이상 확대해서는 안 된다"
 LibyaFocus.20.t: "공개 사과를 요구하는 [ROOT.GetNameDef]"
 LibyaFocus.20.d: "[ROOT.GetNameDef]은(는) 우리가 리비아 왕실에 대한 테러 공격을 꾸몄다고 비난하고 있습니다. 그들은 우리가 이번 사건에 대해 공개 사과를 하고 공격 피해자들에게 보상하기를 원합니다."
 LibyaFocus.20.a: "사과해야 한다"
 LibyaFocus.20.b: "우리는 잘못한 것이 없다!"
 LBA_terror_attack_no_apology_tt: "§R심각한 결과가 따를 수 있습니다! [FROM.GetNameDef]이(가) 이를 자국 영토에 대한 공격으로 간주할 수 있습니다!§!"
 LibyaFocus.21.t: "사과하는 리비아"
 LibyaFocus.21.d: "리비아는 테러 공격에 대해 공개 사과하기로 합의했습니다. 또한 공격 피해자들에게 금전적 보상을 제공할 것입니다."
 LibyaFocus.21.a: "정의가 실현되었다!"
 LibyaFocus.22.t: "사과를 거부하는 리비아"
 LibyaFocus.22.d: "리비아는 테러 공격에 대한 사과도 보상도 거부했습니다. 리비아가 국제 테러 지원이라는 과거의 길로 되돌아가고 있는 것으로 보입니다. 영국의 많은 사람들은 여전히 로커비 폭파 사건을 기억하고 있으며, 다수가 리비아에 따끔한 교훈을 주어야 한다고 요구하고 있습니다."
 LibyaFocus.22.a: "공습을 조직하라!"
 LibyaFocus.22.b: "이는 우리에 대한 공격이다! 그들을 무너뜨려라!"
 LibyaFocus.22.c: "더 이상 확대하지 말자!"
 ENG_bomb_libya_tt: "§Y리비아의 산업 시설 한 곳을 폭격합니다!§!"
 ENG_attack_libya_tt: "§Y테러를 지원하는 리비아 정부를 무너뜨리기 위해 리비아를 침공합니다! 그들이 우리 영토를 공격했으므로, 이는 우리와 동맹국에 대한 공격으로 간주됩니다§!"
 LibyaFocus.23.t: "[FROM.GetAdjective] 공습"
 LibyaFocus.23.d: "After we refused to apologise to the British, we received no further communication from them. This was until one ouf radars on the coast detected multiple incoming fighters. [FROM.GetNameDef] sent us a communique stating that in order to prevent us from supporting terrorism, they must take action. While our army personnel bravely tried swaying off the fighters with anti-air fire, no hits were scored. The fighters managed to hit and destroy their target."
 LibyaFocus.23.a: "빌어먹을 제국주의자들!"
 LibyaFocus.24.t: "[FROM.GetAdjective] 개입"
 LibyaFocus.24.d: "After we refused to apologise to the British, we received no further communication from them. This was until one ouf radars on the coast detected multiple incoming fighters. [FROM.GetNameDef] sent us a communique stating that in order to prevent us from supporting terrorism, they must take action. [FROM.GetNameDef] considers our actions an attack against their nation, and in order to prevent further terrorist attacks, our government must be removed from power."
 LibyaFocus.24.a: "빌어먹을 제국주의자들!"
 LibyaFocus.25.t: "국왕 선택"
 LibyaFocus.25.d: "The time has come to choose a king for Libya. The current generally accepted successor to the throne is Mohammed el-Senussi, the grandson of King Idris I's brother. Mohammed's father was nominated by Idris as his heir, as he himself had no children.\n\nMohammed's claim however is disputed by his cousin Idris el-Senussi. Idris has used his vast wealth to lobby several organizations, including several British MPs, to recognise him as the rightful heir.\n\nThere is a third option as well; Ahmed el-Senussi, another cousin of Mohammed. He has made no claims to the throne but he tried organise a counter coup as soon as Gaddafi took power, which ended with him spending 30 years as a political prisoner, suffering from frequent torture. He has personally fought and persevered against the old regime, and thus would be the perfect symbol for Libya.\n\nWho should we choose?"
 LibyaFocus.25.a: "무함마드 엘세누시가 정통 후계자다!"
 LibyaFocus.25.b: "이드리스 엘세누시가 우리를 설득했다!"
 LibyaFocus.25.c: "아흐메드 엘세누시야말로 리비아의 진정한 영웅이다!"
 LibyaFocus.26.t: "자치를 요구하는 [FROM.GetNameDef]"
 LibyaFocus.26.d: "[FROM.GetNameDef] 정부는 우리가 소수 민족을 학대하고 있다고 주장하고 있습니다. 그들은 해당 소수 민족에게 자국의 보호 아래 완전한 자치를 부여할 것을 요구하고 있습니다. 어떻게 대응해야 할까요?"
 LibyaFocus.26.a: "그들의 요구를 승인한다"
 LibyaFocus.26.b: "그런 일은 결코 없을 것이다"
 LibyaFocus.27.t: "요구를 받아들인 [FROM.GetNameDef]"
 LibyaFocus.27.d: "[FROM.GetNameDef] 정부가 우리의 요구에 동의했습니다. 이는 인류의 위대한 승리입니다!"
 LibyaFocus.27.a: "놀랍군"
 LibyaFocus.28.t: "우리의 요구를 거부한 [FROM.GetNameDef]"
 LibyaFocus.28.d: "[FROM.GetNameDef] 정부가 자치 확대에 대한 우리의 요구를 거부했습니다. 그들은 우리 민족을 계속 억압하려는 것으로 보입니다."
 LibyaFocus.28.a: "그들은 응당한 대가를 치르게 될 것이다"
 LibyaFocus.29.t: "철도 궤간 선택"
 LibyaFocus.29.d: "리비아에는 기존 철도가 없으므로 따를 철도 궤간을 정해야 합니다. 가장 논리적인 선택은 북아프리카 이웃 국가들도 사용하는 표준궤를 쓰는 것입니다. 한편으로는 완전히 새로운 리비아 궤간을 만들 수도 있습니다. 그래도 철도의 이점은 누릴 수 있으며, 이웃 나라들이 리비아를 정복하려 들 경우 그 일을 더 어렵게 만들 수 있을 것입니다."
 LibyaFocus.29.a: "표준궤가 가장 합리적이다"
 LibyaFocus.29.b: "리비아 궤간이라니, 훌륭하다!"
 LibyaFocus.30.t: "소규모 광석 매장지 발견"
 LibyaFocus.30.d: "와디 아시샤트 계곡을 탐사한 우리 탐사대는 철광석을 채굴할 수 있는 지점을 몇 군데밖에 찾지 못했습니다."
 LibyaFocus.30.a: "우리가 찾던 것과는 거리가 있군."
 LibyaFocus.31.t: "중규모 광석 매장지 발견"
 LibyaFocus.31.d: "After exploring the Wadi Ash-Shat' valley, our prospectors have found a decent sized site for a new iron mine This should increase our iron ore production considerably."
 LibyaFocus.31.a: "원하던 것과는 다르지만, 그래도 좋다."
 LibyaFocus.32.t: "대규모 광맥 발견"
 LibyaFocus.32.d: "소문은 사실이었습니다! 와디 아시샤트 계곡 아래에 막대한 철광석 매장지가 있습니다! 이야기로 전해지는 만큼 어마어마하지는 않지만, 그래도 방대한 규모입니다. 이는 리비아에 위대한 진전입니다!"
 LibyaFocus.32.a: ":poggies:"
 LibyaFocus.33.t: "협상 준비"
 LibyaFocus.33.d: "[?LBA_target_of_rail_project.GetNameDef]에 제안을 보내기에 앞서, 먼저 무엇을 제안할지 정해야 합니다. 사업 비용을 반반씩 분담하자고 제안할 수도 있고, 아니면 비용 전액을 우리가 부담하겠다고 제안할 수도 있습니다. 우리에게는 더 큰 부담이지만, [?LBA_target_of_rail_project.GetNameDef]이(가) 동의할 가능성은 훨씬 높아집니다."
 LibyaFocus.33.a: "50대 50으로 나눈다."
 LibyaFocus.33.b: "전액을 우리가 부담한다."
 LBA_railroad_deal_tt: "그들이 수락하면,\n"
 LibyaFocus.34.t: "철도 협정을 제안하는 [FROM.GetNameDef]"
 LibyaFocus.34.d: "[FROM.GetAdjective] 정부가 우리 철도망과 그들의 철도망을 연결하자는 협정을 제안해 왔습니다. 이는 양국 모두에 수익성 있는 기회가 될 수 있습니다."
 LibyaFocus.34.a: "협정에 동의한다."
 LibyaFocus.34.b: "We wan't nothing to do with them."
 LibyaFocus.35.t: "협정을 수락한 [FROM.GetNameDef]"
 LibyaFocus.35.d: "The [FROM.GetAdjective] government has accepted the railroad deal with offered."
 LibyaFocus.35.a: "훌륭하다!"
 LibyaFocus.36.t: "협정을 거부한 [FROM.GetNameDef]"
 LibyaFocus.36.d: "The [FROM.GetAdjective] government has rejected the railroad deal with offered."
 LibyaFocus.36.a: "젠장"
 LibyaFocus.37.t: "공급처 선택"
 LibyaFocus.37.d: "우리는 제3자를 통해 핵무기를 확보하려고 여러 번 시도했으나 한 번도 성공하지 못했습니다. 주권을 지키려면 핵무기가 필요합니다. 어디에서 구입을 시도해야 할까요? 막대한 자원을 가진 중국은 비밀리에 무기를 인도할 수 있겠지만, 그 위험을 감수할 가능성은 낮습니다. 파키스탄은 우리와도, 서방과도 사이가 좋지 않으며 가까운 거리 덕분에 빠른 인도가 가능합니다. 북한은 서방에 맞서 분명 우리를 도울 테지만, 이미 국제 사회의 면밀한 감시를 받고 있습니다."
 LibyaFocus.37.a: "중국"
 LibyaFocus.37.b: "파키스탄"
 LibyaFocus.37.c: "북한"
 Libya_buy_nukes_china_tt: "§G수락 확률:§! §Y25%§!\n§R발각 확률:§! §Y25%§!"
 Libya_buy_nukes_pakistan_tt: "§G수락 확률:§! §Y50%§!\n§R발각 확률:§! §Y50%§!"
 Libya_buy_nukes_north_korea_tt: "§G수락 확률:§! §Y75%§!\n§R발각 확률:§! §Y75%§!"
 LibyaFocus.38.t: "비밀 거래를 제안하는 [FROM.GetNameDef]"
 LibyaFocus.38.d: "The government of [FROM.GetNameDef] has approached with a deal; they want to purchases one of our nuclear weapons for themselves. Selling nuclear weapons is strictly prohibited by international law. If we are caught selling our nuclear weapons, we might be subject to international sanctions."
 LibyaFocus.38.a: "위험을 감수할 수 있다"
 LibyaFocus.38.b: "절대 안 된다"
 LibyaFocus.39.t: "우리 거래를 수락한 [FROM.GetNameDef]"
 LibyaFocus.39.d: "[FROM.GetName]이(가) 우리의 거래에 동의했습니다. 그들은 핵무기의 운송 준비를 마쳤으며, 문제가 없다면 몇 주 안에 받게 될 것입니다."
 LibyaFocus.39.a: "좋아"
 LibyaFocus.40.t: "우리 거래를 거부한 [FROM.GetNameDef]"
 LibyaFocus.40.d: "[FROM.GetName] has rejected our deal, stating that is poses too much risk and might even be immoral. Lucky for us, they didn't rat us out to the international community."
 LibyaFocus.40.a: "아쉽군"
 LibyaFocus.41.t: "핵무기 무사 도착"
 LibyaFocus.41.d: "우리가 주문한 핵무기가 리비아에 무사히 도착했습니다. 해수 담수화 장비로 위장된 핵무기는 일반 화물선에 실려 운송되었습니다. 마침내 우리도 핵 보유국이 되었습니다."
 LibyaFocus.41.a: "놀랍군"
 Libya_nuclear_deterrent_tt: "§Y우리의 핵 억지력 덕분에 다른 나라들이 우리에게 적대적으로 나올 가능성이 낮아집니다!§!"
 LibyaFocus.42.t: "해상에서 핵무기 발견"
 LibyaFocus.42.d: "Last night we received reports of a possible nuclear device being transported aboard a freighter in the Red Sea. A team of Navy Seals boarded and took control of the vessels. It was confirmed that a nuclear device was on-board. After interrogating the [FROM.GetAdjective] crew, they stated they were heading for Libya. We are not sure of the origin of the weapon, though it had [FROM.GetAdjective] markings on it and the ship had left port from [FROM.GetNameDef] a week prior, making them highly suspect. The weapon is now being transported to the US ready to be decommissioned. How should we respond to this incident?"
 LibyaFocus.42.a: "무기는 확보했으니 이쯤에서 마무리한다"
 LibyaFocus.42.b: "리비아가 도를 넘었다. 대가를 치르게 하자!"
 LibyaFocus.42.c: "리비아가 도를 넘었다. 그들과 동맹국 모두 대가를 치르게 하자!"
 LibyaFocus.43.t: "핵무기를 압수한 미국"
 LibyaFocus.43.d: "미국이 운송 도중 우리의 핵무기를 발견했습니다. 그들은 무기를 확보하고 폐기를 위해 미국으로 이송하기 시작했습니다. 우리에게 경고를 보내기는 했으나 그것으로 마무리했습니다. 그들의 관대함이 우리를 구한 듯합니다."
 LibyaFocus.43.a: "휴"
 LibyaFocus.44.t: "개입하는 미국"
 LibyaFocus.44.d: "미국이 운송 도중 우리의 핵무기를 발견했습니다. 그들은 무기를 확보하고 폐기를 위해 미국으로 이송하기 시작했습니다. 그들은 우리의 행동 때문에 우리가 세계 평화에 대한 위협이 되었다는 공식 성명을 보내왔습니다. 이제 그들이 우리 정부를 무너뜨리려 할 가능성이 높습니다."
 LibyaFocus.44.a: "젠장"
 LibyaFocus.45.t: "우리에게 제재를 가하는 미국"
 LibyaFocus.45.d: "미국이 리비아로 향하던 우리의 핵무기를 운송 도중 발견했습니다. 그들은 무기를 확보하고 폐기를 위해 미국으로 이송하기 시작했습니다. 다른 나라가 핵무기를 입수하도록 도운 우리의 행동 때문에, 미국과 그 동맹국들은 우리에게 제재를 가했습니다."
 LibyaFocus.45.a: "젠장"
 LibyaFocus.46.t: "무기 구입을 원하는 [FROM.GetNameDef]"
 LibyaFocus.46.d: "[FROM.GetAdjective] 정부가 거래를 제안해 왔습니다. 그들은 [ROOT.GetAdjective] 무기를 구입하여 우리와의 군사 협력을 강화하고자 합니다. 이는 우리가 리비아에서 영향력을 키울 수 있게 해 줄 것입니다."
 LibyaFocus.46.a: "물론이지"
 LibyaFocus.46.b: "할 수 없다"
 LibyaFocus.47.t: "우리 거래를 수락한 [FROM.GetNameDef]"
 LibyaFocus.47.d: "[FROM.GetNameDef]이(가) 그들로부터 무기를 구입하겠다는 우리의 요청을 수락했습니다."
 LibyaFocus.47.a: "좋아"
 LibyaFocus.48.t: "우리 거래를 거부한 [FROM.GetNameDef]"
 LibyaFocus.48.d: "[FROM.GetNameDef]이(가) 그들로부터 무기를 구입하겠다는 우리의 요청을 거절했습니다."
 LibyaFocus.48.a: "젠장"
 LibyaFocus.49.t: "USAID에 가입하는 [FROM.GetNameDef]"
 LibyaFocus.49.d: "[FROM.GetNameDef]이(가) USAID 프로그램에 가입했습니다."
 LibyaFocus.49.a: "알겠다"
 LibyaFocus.50.t: "배상을 요구하는 [FROM.GetNameDef]"
 LibyaFocus.50.d: "[FROM.GetAdjective] government has contacted us and are demanding reparations for the damages done by colonial rule. There have been discussions in Italy (and in other Western countries) of reparations, but nothing has been paid so far. Compensating Libya for colonial damages would make us the first country in the world to do so, which could boost our image. Some government official are advising that we should instead have some kind of mutual agreement with Libya in exchange for these reparations."
 LibyaFocus.50.a: "배상금을 지급한다"
 LibyaFocus.50.b: "대가를 받아야 한다"
 LibyaFocus.50.c: "단 한 푼도 줄 수 없다"
 LibyaFocus.50_tt: "§G[FROM.GetNameDef]이(가) 지중해의 불법 이민을 막기 위해 우리와 협력하는 데 동의하면 그들에게 배상을 제안합니다§!\n[FROM.GetNameWithFlag]이(가) 수락하면,\n"
 LibyaFocus.51.t: "배상금을 지급하는 [FROM.GetNameDef]"
 LibyaFocus.51.d: "[FROM.GetAdjective] 정부가 식민 통치에 대한 배상금을 지급하기로 합의했습니다. 직접 보상금으로 $50억이 지급되며, 식민주의의 잔재로 피해를 입은 이들의 의료비도 부담될 것입니다. 이로써 이탈리아는 식민 통치에 대한 보상금을 지급한 최초의 옛 식민 강국이 되었습니다."
 LibyaFocus.51.a: "서방 강대국들의 본보기다"
 LibyaFocus.52.t: "지급을 거부하는 [FROM.GetNameDef]"
 LibyaFocus.52.d: "[FROM.GetAdjective] 정부가 식민주의로 인한 피해에 대한 지급을 거부했습니다. 그들에 따르면, 오늘의 이탈리아는 어제의 이탈리아에 책임이 없다는 것입니다."
 LibyaFocus.52.a: "뻔뻔한 자들"
 LibyaFocus.53.t: "협력을 제안하는 [FROM.GetNameDef]"
 LibyaFocus.53.d: "[FROM.GetNameDef]에 배상을 요구한 뒤, 그들의 정부가 역제안을 해 왔습니다. 우리가 유럽으로의 불법 이민을 줄이는 데 협력하기로 한다면 배상금을 지급하겠다는 것입니다. 여기에는 리비아 해안에서 이탈리아 해군과의 공동 순찰과, 유럽 위성을 이용한 육상 국경 감시가 포함됩니다."
 LibyaFocus.53.a: "공정한 거래로 보인다"
 LibyaFocus.53.b: "그들은 또다시 우리를 착취하려는 것일 뿐이다"
 LibyaFocus.54.t: "우리 역제안을 수락한 [FROM.GetNameDef]"
 LibyaFocus.54.d: "[FROM.GetNameDef]이(가) 지중해의 불법 이민을 줄이자는 우리의 거래에 동의했습니다."
 LibyaFocus.54.a: "좋아"
 LibyaFocus.55.t: "우리 역제안을 거부한 [FROM.GetNameDef]"
 LibyaFocus.55.d: "[FROM.GetNameDef]이(가) 지중해의 불법 이민을 줄이자는 우리의 거래를 거부했습니다."
 LibyaFocus.55.a: "젠장"
 LibyaFocus.56.t: "우리의 독립을 지지하는 [FROM.GetNameDef]"
 LibyaFocus.56.d: "[FROM.GetNameDef]이(가) 모로코로부터의 우리 독립에 대한 지지를 재확인했으며, 앞으로 우리와 더욱 긴밀히 협력하고 싶다는 의사를 내비쳤습니다."
 LibyaFocus.56.a: "좋아"
 LibyaFocus.57.t: "우리를 저버리는 [FROM.GetNameDef]"
 LibyaFocus.57.d: "[FROM.GetNameDef]이(가) 우리 독립에 대한 지지를 철회했습니다. 수십 년간 우리를 지지해 왔지만, 모로코와 더 나은 관계를 맺기 위해 이제 우리를 저버린 것으로 보입니다."
 LibyaFocus.57.a: "배신자들!"
 LibyaFocus.58.t: "평화 회의를 개최하는 [FROM.GetNameDef]"
 LibyaFocus.58.d: "[FROM.GetAdjective] has organised a peace conference, calling it the Casablanca Accords. Their goal is to create a lasting peace solution to the existing conflict in Western Sahara. We have been asked to send a delegation to their conference."
 LibyaFocus.58.a: "대표단을 파견한다"
 LibyaFocus.59.t: "평화 계획 선택"
 LibyaFocus.59.d: "서사하라 분쟁에 대한 해결안을 마련해야 합니다. 본질적으로 타당한 선택지는 네 가지입니다.\n\n1. 모로코의 서사하라 합병\n2. 서사하라의 제한적 자치\n3. 사흐라위의 완전한 독립\n4. 해당 지역을 모리타니와 통합"
 LibyaFocus.59.a: "서사하라는 모로코의 일부여야 한다"
 libya_western_sahara_peace_plan_annexation_tt: "§Y이 선택지는 [MOR.GetNameWithFlag]이(가) 선호하지만, 다른 당사자들은 대부분 반대할 것입니다§!"
 LibyaFocus.59.b: "서사하라는 제한적 자치를 가져야 한다"
 libya_western_sahara_peace_plan_autonomy_tt: "§Y이는 모든 당사자가 수락하도록 설득될 수 있는 타협안입니다§!"
 LibyaFocus.59.c: "서사하라는 독립해야 한다"
 libya_western_sahara_peace_plan_independence_tt: "§Y이 선택지는 [SHA.GetNameWithFlag]와(과) [ALG.GetNameWithFlag]이(가) 선호하지만, [MOR.GetNameWithFlag]이(가) 반대할 가능성이 높습니다§!"
 LibyaFocus.59.de: "서사하라를 모리타니와 통합한다"
 libya_western_sahara_peace_plan_mauritania_tt: "§Y민족주의 성향의 [MAU.GetNameWithFlag]을(를) 제외한 모든 당사자가 이 선택지에 반대할 가능성이 높습니다§!"
 LibyaFocus.60.t: "자국 평화 계획에 대한 지지를 요청하는 [FROM.GetNameDef]"
 LibyaFocus.60.da: "[FROM.GetName]이(가) 서사하라에 대한 자국 평화 계획에 우리의 지지를 요청하고 있습니다. 그들의 계획은 지역 전체를 모로코에 병합하는 것입니다. 이를 지지할 수 있겠습니까?"
 LibyaFocus.60.db: "[FROM.GetName]이(가) 서사하라에 대한 자국 평화 계획에 우리의 지지를 요청하고 있습니다. 그들의 계획은 서사하라를 모로코의 자치 지역으로 두는 것입니다. 이를 지지할 수 있겠습니까?"
 LibyaFocus.60.dc: "[FROM.GetName]이(가) 서사하라에 대한 자국 평화 계획에 우리의 지지를 요청하고 있습니다. 그들의 계획은 서사하라가 모로코로부터 독립하는 것입니다. 이를 지지할 수 있겠습니까?"
 LibyaFocus.60.dd: "[FROM.GetName]이(가) 서사하라에 대한 자국 평화 계획에 우리의 지지를 요청하고 있습니다. 그들의 계획은 서사하라를 모리타니에 병합하는 것입니다. 이를 지지할 수 있겠습니까?"
 LibyaFocus.60.a: "이 계획을 받아들일 수 있다"
 LibyaFocus.60.b: "이는 우리가 받아들일 수 없다"
 LibyaFocus.60.c: "이 회의는 무의미하니 대표단을 철수시킨다"
 LibyaFocus.61.t: "평화 계획을 수락한 [FROM.GetNameDef]"
 LibyaFocus.61.d: "[FROM.GetNameDef]이(가) 서사하라 분쟁에 대한 우리의 해결안을 수락했습니다."
 LibyaFocus.61.a: "좋아"
 LibyaFocus.62.t: "평화 계획을 거부한 [FROM.GetNameDef]"
 LibyaFocus.62.d: "[FROM.GetNameDef]이(가) 서사하라 분쟁에 대한 우리의 해결안을 거부했습니다."
 LibyaFocus.62.a: "젠장"
 LibyaFocus.63.t: "평화 회의에서 이탈하는 [FROM.GetNameDef]"
 LibyaFocus.63.d: "[FROM.GetAdjective] 대표단이 카사블랑카 협정에서 탈퇴하겠다고 밝혔습니다. 그들은 우리의 평화 요구가 터무니없으며 더 이상 참여할 이유가 없다고 말했습니다."
 LibyaFocus.63.a: "젠장"
 LibyaFocus.64.t: "크레타의 자치를 요구하는 [FROM.GetNameDef]"
 LibyaFocus.64.d: "[FROM.GetAdjective] 정부는 크레타 섬에서의 우리 입장이 우려스럽다고 밝혔습니다. 그들에 따르면 우리가 이 섬을 단단히 틀어쥐고 있는 것이 자국의 안보를 위협한다는 것입니다. 그들은 이 지역에서 우리의 군사적·정치적 존재를 줄이도록 크레타에 제한적 자치를 부여할 것을 요구하고 있습니다."
 LibyaFocus.64.a: "그럴 수도 있겠지"
 LibyaFocus.64.b: "터무니없다"
 LibyaFocus.65.t: "[FROM.GetNameDef]의 수락"
 LibyaFocus.65.d: "[FROM.GetAdjective] 정부가 크레타 주민의 자치를 확대하라는 우리의 요구를 수락했습니다."
 LibyaFocus.65.a: "성공이다"
 LibyaFocus.66.t: "[FROM.GetNameDef]의 거부"
 LibyaFocus.66.d: "[FROM.GetAdjective] 정부가 크레타 주민의 자치를 확대하라는 우리의 요구를 거부했습니다."
 LibyaFocus.66.a: "그들은 이를 후회하게 될 것이다"
 LibyaFocus.66.b: "때를 기다리자"
 LibyaFocus.67.t: "새로운 인티파다를 시작한 하마스"
 LibyaFocus.67.d: "하마스는 우리를 대상으로 새로운 인티파다를 선언했습니다. 하마스 전투원들의 활동이 증가하고 있으며, 이미 팔레스타인 지배에 반대하는 여러 시위가 발생했습니다. 리비아가 이번 새로운 캠페인을 위해 하마스에 무기를 제공하고 동기를 부여하고 있다는 보고도 들어오고 있습니다."
 LibyaFocus.67.a: "그들은 이를 후회하게 될 것이다"
 LibyaFocus.68.t: "새로운 인티파다를 후원하는 [FROM.GetNameDef]"
 LibyaFocus.68.d: "[FROM.GetAdjective] 측이 이스라엘에 맞선 새로운 인티파다를 시작하도록 무기와 자금을 보내왔습니다. 우리 사무실 근처에는 이미 신입 지원자들이 줄을 서 있으며, 사람들은 이스라엘 점령자들에 맞선 시위를 위해 결집하고 있습니다."
 LibyaFocus.68.a: "리비아에 감사한다"
 LibyaFocus.69.t: "봉기하는 하마스"
 LibyaFocus.69.d: "하마스 전투원들이 가자 지구의 주요 기관과 건물을 장악하고 있다는 보고가 들어오고 있습니다. 그들은 이스라엘이 새로운 인티파다로 고통받게 될 것이라고 맹세했습니다."
 LibyaFocus.69.a: "젠장"
 LibyaFocus.69.b: "그들을 쳐부수라!"
 LibyaFocus.70.t: "투부족에 접촉하는 [FROM.GetNameDef]"
 LibyaFocus.70.d: "리비아가 우리나라 북부의 투부족 반군에게 무기를 공급하기 시작했다는 보고를 받았습니다. 리비아가 침공하면 이 반군은 틀림없이 그들의 대의에 합류할 것입니다."
 LibyaFocus.70.a: "우려스럽군"
 LibyaFocus.71.t: "공동 채굴을 제안하는 [FROM.GetNameDef]"
 LibyaFocus.71.d: "[FROM.GetAdjective] 정부가 아우주 지대에서의 공동 우라늄 채굴 사업을 제안했습니다. 이는 앞으로 양국에 자원을 제공할 것입니다. 어떻게 대응해야 할까요?"
 LibyaFocus.71.a: "훌륭한 생각이다!"
 LibyaFocus.71.b: "관심 없다"
 LibyaFocus.72.t: "우리 거래를 수락한 [FROM.GetNameDef]"
 LibyaFocus.72.d: "[FROM.GetAdjective] 정부가 공동 채굴에 관한 우리의 거래를 수락했습니다."
 LibyaFocus.72.a: "좋아"
 LibyaFocus.73.t: "우리 거래를 거부한 [FROM.GetNameDef]"
 LibyaFocus.73.d: "[FROM.GetAdjective] 정부가 공동 채굴에 관한 우리의 거래를 거부했습니다."
 LibyaFocus.73.a: "젠장"
 LibyaFocus.74.t: "우라늄 채굴을 시작한 [FROM.GetNameDef]"
 LibyaFocus.74.d: "[FROM.GetNameDef]이(가) 아우주 지대에서 우라늄 채굴을 시작했습니다. 자원 대부분은 그들에게 돌아가지만, 우리도 소량의 몫을 받으며 [FROM.GetAdjective] 측이 굴착 비용 전액을 부담하기로 했습니다."
 LibyaFocus.74.a: "알겠다"
 LibyaFocus.75.t: "봉기하는 투부족"
 LibyaFocus.75.d: "[FROM.GetAdjective] 군대가 국경을 넘어 이동하기 시작하자, 투부족 부족민 여러 집단이 [FROM.GetAdjective]을(를) 해방자로 맞이하기를 바라며 차드 북부의 일부 대도시에서 주요 건물을 장악했습니다. 부족민들은 무장이 빈약하고 수도 적지만, 우리 전선 후방에서 혼란을 일으킬 것입니다."
 LibyaFocus.75.a: "젠장"
 LibyaFocus.76.t: "[FROM.GetNameDef]는 다르푸르에서 무장 세력을 후원한다"
 LibyaFocus.76.d: "우리는 [FROM.GetAdjective] 용병들이 다르푸르로 넘어갔다는 보고를 받았습니다. 그들은 트럭에 무기를 실어 가지고 와서 현지 다르푸르 민병대를 무장시켰습니다. 그들의 지원을 받은 다르푸르 사람들이 우리에게 반란을 일으켰습니다."
 LibyaFocus.76.a: "젠장"
 LibyaFocus.77.t: "용병을 보내는 [FROM.GetNameDef]"
 LibyaFocus.77.d: "리비아가 선의의 표시로 정예 용병 분견대를 보내 우리 대열에 합류시켰습니다. 이 조치를 통해 그들은 우리 정권의 안정을 보장하고자 합니다."
 LibyaFocus.77.a: "깊이 감사한다"
 LibyaFocus.78.t: "[FROM.GetNameDef]이(가) 보낸 무기 수송"
 LibyaFocus.78.d: "오랜 후원자인 [FROM.GetLeader]이(가) 우리의 분쟁을 돕기 위해 무기를 실어 보냈습니다."
 LibyaFocus.78.a: "고맙네, 오랜 친구여"
 LibyaFocus.79.t: "멩기스투를 위한 캠페인을 벌이는 [FROM.GetNameDef]"
 LibyaFocus.79.d: "[FROM.GetNameDef]이(가) 망명한 독재자 멩기스투를 위한 대중 지지 캠페인을 시작했습니다. 그들은 멩기스투가 실제와 달리 집단 학살을 저지른 독재자가 아니라고 세계를 설득하려 하고 있습니다."
 LibyaFocus.79.a: "젠장"
 LibyaFocus.79.b: "맞불 캠페인을 개시한다!"
 LibyaFocus.80.t: "[FROM.GetNameDef]과(와)의 산업 협력"
 LibyaFocus.80.d: "[FROM.GetNameDef]이(가) 양국이 산업 분야에서 협력하자고 제안했습니다. 함께라면 서방 제국주의에 맞설 수 있습니다."
 LibyaFocus.80.a: "우리는 형제다"
 LibyaFocus.81.t: "혁명을 준비하는 [FROM.GetNameDef]"
 LibyaFocus.81.d: "We have reports of soldiers and weapons moving from [FROM.GetNameDef] moving into our country. They have been contacting opposition members and current projections show they will launch an uprising in three months."
 LibyaFocus.81.a: "대비해야 한다"
 LibyaFocus.81.b: "선제공격을 개시해야 한다!"
 LibyaFocus.82.t: "쿠데타를 조직하는 [FROM.GetNameDef]"
 LibyaFocus.82.d: "예기치 않게 수송기 여러 대가 수도에 착륙했습니다. 수송기에서는 차량과 [ROOT.GetAdjective] 및 [FROM.GetAdjective] 병사 대규모 부대가 신속히 하역되었습니다. 병사들은 즉시 동원되어 대통령궁으로 향하기 시작했습니다. 또한 민간인 복장을 한 무장 폭도들이 전국에서 혼란을 일으키고 지방 청사를 장악하고 있다는 보고도 받았습니다. [FROM.GetNameDef]에서 비롯된 쿠데타가 나라 안에서 벌어지고 있는 것으로 보입니다."
 LibyaFocus.82.a: "항복한다!"
 LibyaFocus.82.b: "마지막 한 사람까지 싸울 것이다!"
 LibyaFocus.83.t: "누갈 계곡의 교전"
 LibyaFocus.83.d: "We have received reports of a exchange of fire on the Puntland-Somaliland border. The area is contentious as both sides claim large areas from each other. Based on the information we have now, soldiers of our neighbour crossed the border, and after a brief exchange of fire, retreated back. Our neighbour is refuting these claims, stating that it was our soldiers who crossed the border. It seems tension in the region are growing."
 LibyaFocus.83.a: "병력을 준비시켜라!"
 LibyaFocus.83.b: "국민을 안심시켜라"
 LibyaFocus.84.t: "정체불명의 무기 수송품 도착"
 LibyaFocus.84.d: "탄약과 무기가 가득 담긴 상자 여러 개가 우리 창고 한 곳으로 흘러들어 왔습니다. 우리가 주문한 적이 없으니 이 무기가 어디에서 왔는지 알 수 없습니다. 상자의 표식은 아랍어로 적혀 있으며, 화물 목록에 따르면 적어도 지부티 항구를 거쳐 온 것으로 보입니다. 대체 어디서 온 것일까요?"
 LibyaFocus.84.a: "그게 무슨 상관인가?"
 LibyaFocus.85.t: "오가덴의 교전"
 LibyaFocus.85.d: "We have received reports of a exchange of fire on the Somalia-Ethiopia border. The Ogaden region has been contested by both sides due to a mixture of Ethiopian and Somali clans living in the area, and a lack of demarcation of the official state border.. Based on the information we have now, soldiers of our neighbour crossed the border, and after a brief exchange of fire, retreated back. Our neighbour is refuting these claims, stating that it was our soldiers who crossed the border. It seems tension in the region are growing."
 LibyaFocus.85.a: "병력을 준비시켜라!"
 LibyaFocus.85.b: "국민을 안심시켜라"
 LibyaFocus.86.t: "오가덴의 반란"
 LibyaFocus.86.d: "오가덴 지역에서 소말리아 반군의 활동이 늘어났습니다. 이 지역으로 유입되는 무기가 늘어난 것이 어디에서 비롯되었는지는 확실하지 않지만, 현지 반군이 이 상황을 이용하고 있습니다. 저항은 적어도 지금까지는 비교적 국지적이고 소규모입니다."
 LibyaFocus.86.a: "그들은 위협이 아니다"
 LibyaFocus.87.t: "국경을 넘는 적"
 LibyaFocus.87.d: "올 것이 왔습니다. 적이 국경을 넘어 누갈 계곡 전체를 장악하려 하고 있습니다."
 LibyaFocus.87.a: "병력을 동원하라!"
 LibyaFocus.88.t: "봉기하는 오가덴의 소말리인들"
 LibyaFocus.88.d: "The Somali insurgents in Ogaden have intensified their operations and attacked several government buildings and military checkpoints. We have definite evidence that the men and suppliers are crossing the border from Somalia, and are being supported by the local governments. It seems that Somali hunger to unite with Ogaden has once again flared. We must extinguish these dreams as soon as possible."
 LibyaFocus.88.a: "병사들에게 이 반란을 끝내라고 전하라!"
 LibyaFocus.89.t: "소코트라를 점령한 [FROM.GetNameDef]"
 LibyaFocus.89.d: "At early hours today, a transport plance of the Libyan military landed on the island of socotra. The plane unloaded soldiers, who quickly disarmed and detained our confused local military units. As the air and seaports had been secured, ships with heavier equipment started coming in. There has been no explanation or answer from [FROM.GetAdjective] officials."
 LibyaFocus.89.a: "그들을 몰아내라!"
 LibyaFocus.89.b: "우리가 할 수 있는 일은 없다"
 LibyaFocus.90.t: "서사하라 합병"
 LibyaFocus.90.d: "The [FROM.GetAdjective] hosted Casablanca accords have resulted in a very favourable resolution from our perspective. The countries partaking the accords have decided that Western Sahara should be part of Morocco."
 LibyaFocus.90.a: "좋아"
 LibyaFocus.91.t: "서사하라의 자치"
 LibyaFocus.91.d: "[FROM.GetAdjective]이(가) 주최한 카사블랑카 협정은 우리 입장에서 매우 유리한 결의로 이어졌습니다. 모든 당사자는 서사하라인, 즉 사흐라위에게 모로코 내에서 제한적 자치를 부여하여 분쟁을 해결하기로 합의했습니다."
 LibyaFocus.91.a: "좋아"
 LibyaFocus.91.b: "좋아"
 LibyaFocus.92.t: "서사하라의 독립"
 LibyaFocus.92.d: "The [FROM.GetAdjective] hosted Casablanca accords have resulted in Western Sahara gaining full independence from Morocco. In the future, the country will be called the Sahrawi Democratic Arab Republic."
 LibyaFocus.92.a: "알겠다"
 LibyaFocus.92.b: "좋아"
 LibyaFocus.93.t: "모리타니에 통합된 서사하라"
 LibyaFocus.93.d: "[FROM.GetAdjective]이(가) 주최한 카사블랑카 협정의 결과로 서사하라가 모리타니에 병합되었습니다."
 LibyaFocus.93.a: "알겠다"
 LibyaFocus.93.b: "좋아"
 LibyaFocus.94.t: "테러 조직 명단에 오른 LIFG"
 LibyaFocus.94.d: "미국의 세계무역센터 테러 공격과 미국의 '테러와의 전쟁' 이후, 리비아 이슬람 전투단(LIFG)은 알카에다와의 연관성으로 인해 미국과 영국 양국에 의해 테러리스트 조직으로 지정되었습니다. 그러나 LIFG는 알카에다와의 연관을 부인하며, 1998년 오사마 빈 라덴이 서방에 선언한 지하드에 참여하지 않기로 거부했다고 밝혔습니다."
 LibyaFocus.94.a: "당연한 결과다"
 LibyaFocus.94.b: "그들을 격파하기 위해 협력해야 한다"
 LibyaFocus.94.c: "이는 좋지 않다"
 LibyaFocus.95.t: "독립을 선언한 트리폴리타니아"
 LibyaFocus.95.d: "트리폴리타니아 부족 지도자 회의는 더 이상 자신들의 땅에 대한 국가의 권위를 받아들이지 않겠다고 선언했습니다. 그들에 따르면 정부는 트리폴리타니아의 이익을 우선시하지 않는다는 것을 분명히 보여주었습니다. 우리 군대의 대다수가 트리폴리타니아 출신임을 고려하면 상당수가 편을 바꿀 가능성이 높습니다. 그와 함께 주요 인구 중심지와 유전 중 하나도 떨어져 나갑니다. 이를 그냥 두고 볼 수 있겠습니까?"
 LibyaFocus.95.a: "그들을 무너뜨려야 한다"
 LibyaFocus.95.b: "지금으로서는 할 수 있는 일이 없다"
 LibyaFocus.96.t: "독립을 선언한 키레나이카"
 LibyaFocus.96.d: "키레나이카 부족 지도자 회의는 더 이상 자신들의 땅에 대한 국가의 권위를 받아들이지 않겠다고 선언했습니다. 그들에 따르면 정부는 키레나이카의 이익을 우선시하지 않는다는 것을 분명히 보여주었습니다. 다행히 우리 군대 인원의 대부분은 트리폴리타니아 출신이므로 키레나이카 편으로 넘어갈 이들은 많지 않을 것입니다. 그러나 키레나이카는 우리 석유 매장량의 거의 절반을 차지하고 있습니다. 이를 그냥 두고 볼 수 있겠습니까?"
 LibyaFocus.96.a: "그들을 무너뜨려야 한다"
 LibyaFocus.96.b: "지금으로서는 할 수 있는 일이 없다"
 LibyaFocus.97.t: "독립을 선언한 페잔"
 LibyaFocus.97.d: "페잔 부족 지도자 회의는 더 이상 자신들의 땅에 대한 국가의 권위를 받아들이지 않겠다고 선언했습니다. 그들에 따르면 정부는 페잔의 이익을 우선시하지 않는다는 것을 분명히 보여주었습니다. 다행히 페잔은 인구가 매우 희박한 지역이어서 이들을 진압하는 것은 큰 어려움이 아닐 가능성이 높습니다. 이를 그냥 두고 볼 수 있겠습니까?"
 LibyaFocus.97.a: "그들을 무너뜨려야 한다"
 LibyaFocus.97.b: "지금으로서는 할 수 있는 일이 없다"
 LibyaFocus.98.t: "아우주 지대를 요구하는 [FROM.GetNameDef]"
 LibyaFocus.98.d: "[FROM.GetAdjective] 정부가 아우주 지대의 통제권을 되돌려 달라고 요구하고 있습니다. 사실 그 지역은 애초에 그들의 땅이었던 적이 없으며, 우리는 이미 도요타 전쟁에서 그들에게 교훈을 주었습니다. 다시 한번 그들을 물리칠 수 있겠습니까?"
 LibyaFocus.98.a: "싸울 수 있는 상태가 아니니 땅을 넘겨준다"
 LibyaFocus.98.b: "차드는 누구에게도 굴복하지 않는다!"
 LibyaFocus.99.t: "[FROM.GetNameDef] Send Humanitarian Aid"
 LibyaFocus.99.d: "[FROM.GetAdjective] 정부가 나라를 괴롭히는 여러 사회 문제를 개선하는 데 도움이 되도록 대규모 지원 물자를 보내왔습니다."
 LibyaFocus.99.a: "[FROM.GetAdjective] 친구들에게 감사한다"
 LibyaFocus.100.t: "면화 무역 협정을 제안하는 [FROM.GetNameDef]"
 LibyaFocus.100.d: "The [FROM.GetAdjective] government has shown willingness to invest into our cotton industry. In return they want us to sign a trade agreement where a large number of Chadian cotton would be exported into Libya. This deal has a chance of greatly improving our economic outlook."
 LibyaFocus.100.a: "물론이지"
 LibyaFocus.100.b: "그들 없이도 해낼 수 있다"
 LibyaFocus.101.t: "우리 무역 협정에 동의한 [FROM.GetNameDef]"
 LibyaFocus.101.d: "[FROM.GetAdjective] 정부가 우리와 면화 무역 협정에 서명하기로 동의했습니다."
 LibyaFocus.101.a: "좋아"
 LibyaFocus.102.t: "[FROM.GetNameDef] Rejects To Our Trade Deal"
 LibyaFocus.102.d: "The [FROM.GetAdjective] government has rejected to sign the cotton trade deal with us."
 LibyaFocus.102.a: "그렇다면 그 돈을 [ROOT.GetName]에 투자하자"
 LibyaFocus.102.b: "저주를 받아라"
 LibyaFocus.103.t: "석유를 장악한 [FROM.GetNameDef]"
 LibyaFocus.103.d: "Using their influence over our country, the [FROM.GetAdjective] has somehow managed to convince our Energy Minister to give resource drilling rights to the Libyan National Oil Corporation. Despite heavy objections by other politicians, the minister and Chadian owners of the oil fields were more than happy to give control of the fields. Armed men bearing Libyan uniforms quickly replaced the local Chadian guard units at the oil fields, and it seems they are here to stay."
 LibyaFocus.103.a: "그들이 이런 짓을 하다니 믿을 수 없다"
 LibyaRandomEvents.1.t: "내각 개편"
 LibyaRandomEvents.1.d: "2000년, 리비아는 내각 구조에 중대한 변화를 단행했습니다. 총리(일반 인민 위원회 사무총장 겸임)와 외무장관을 포함해 총 12명의 장관이 교체되었습니다. 총리직은 무함마드 아흐마드 알만구시에서 이전에 주택 및 공공시설 장관을 지낸 임바렉 샤메크에게 넘어갔습니다."
 LibyaRandomEvents.1.a: "안정된 국가를 위한 안정된 정부"
 LibyaRandomEvents.1.b: "샤메크는 훌륭한 총리가 될 것이다"
 LibyaRandomEvents.1.c: "외무장관 교체는 중요한 일이었다"
 LibyaRandomEvents.2.t: "반흑인 폭동"
 LibyaRandomEvents.2.d: "Libya is a common place for African migrants to end up in. Most these migrants live in the country illegally without any paperwork. These migrants are often targeted by youth gangs. There has been a flare-up of violence recently, with hundreds of migrant homes burned and dozens killed. Many African countries are blaming the state's security forces for negligence, as no arrests have been made."
 LibyaRandomEvents.2.a: "철저한 조사를 약속한다"
 LibyaRandomEvents.2.b: "보여주기식으로 몇 명을 체포한다"
 LibyaRandomEvents.2.c: "불법으로 들어오면 이런 일을 당하는 법이다"
 LibyaRandomEvents.3.t: "마르사 알브레가 인근 비행기 추락"
 LibyaRandomEvents.3.d: "오늘 한낮, 시르테 석유 회사가 운항하던 쇼트 360 항공기가 트리폴리에서 노동자와 그 가족을 태우고 가던 중 마르사 알브레가 마을 인근 바다에 추락했습니다. 대안이 될 만한 교통수단이 없어 석유 회사가 작업장과 도시 사이에서 노동자들을 항공으로 수송하는 일은 흔합니다. 비행기에는 38명이 타고 있었으며, 대부분 리비아인과 영국인이었습니다. 이 중 19명이 추락에서 살아남아 바다에서 구조되었습니다. 항공기는 양쪽 엔진이 모두 고장 나 추락했으나 정확한 원인은 아직 알려지지 않았습니다."
 LibyaRandomEvents.3.a: "사고를 조사해야 한다"
 LibyaRandomEvents.3.b: "이런 일은 일어나기 마련이다"
 LibyaRandomEvents.4.t: "비행기 추락 조사 완료"
 LibyaRandomEvents.4.d: "마르사 알브레가 비행기 추락 사고에 대한 조사가 완료되었습니다. 비행기는 엔진 침수로 추락했습니다. 비행기가 구름 지대를 통과하면서 엔진에 습기와 얼음이 쌓였고, 고도를 낮추자 얼음이 녹아 엔진이 침수되었습니다. 기장은 리비아의 날씨는 '대체로 온화하다'며 기상 보고를 무시했습니다. 승무원들은 포커 F28 운용 체계에 관한 대화에 정신이 팔려 방빙 장치를 켜는 것도 잊었습니다. 게다가 객실 승무원은 승객들에게 좌석이 부양 장치로 쓰일 수 있음을 알리지 않았습니다. 단거리 비행에는 구명조끼가 필수가 아니어서 비행기에 구명조끼도 갖춰져 있지 않았기에, 이로 인해 익사로 인한 사망자가 더 늘었을 가능성이 높습니다."
 LibyaRandomEvents.4.a: "승무원들의 과실이 원인이다"
 LibyaRandomEvents.4.b: "구명조끼가 없었다고? 더 나은 규제가 필요하다"
 LibyaRandomEvents.4.c: "더 나은 비행기가 필요할 뿐이다"
 LibyaRandomEvents.5.t: "올롬비, 프리미어 컵 우승"
 LibyaRandomEvents.5.d: "History has been made in this years Premiur Cup, the top football cup in Libya; Club Olomby from the city of Zawia has won the league with 57 points, with Al Ittihad from Tripoli in 2nd place with 52 points. What makes this event special is that for the first time in Libya's history, a club that is neither from Tripoli or Benghazi has managed to win the cup. This is truly a historic day for Libyan football."
 LibyaRandomEvents.5.a: "축하한다, 올롬비!"
 LibyaRandomEvents.5.b: "I wish Al Hittihad had won"
 LibyaRandomEvents.5.c: "올해는 알아흘리가 우승했어야 했다"
 LibyaRandomEvents.5.dd: "The suprise should've come from Ascharara"
 LibyaRandomEvents.6.t: "경제를 구할 인물"
 LibyaRandomEvents.6.d: "리비아 경제가 국제 제재로 신음하는 가운데, 나라의 지도부에 변화가 필요한지에 대한 논의가 이어지고 있습니다. 현 총리를 교체해야 한다는 의견도 있습니다. 추천되는 후임자는 국영 석유 공사의 마케팅 이사인 슈크리 가넴입니다. 가넴은 OPEC의 연구 책임자를 지냈고 석유부와 경제부에서 여러 직책을 맡았습니다. 현 총리를 그로 교체해야 할까요?"
 LibyaRandomEvents.6.a: "가넴을 총리로 임명한다"
 LibyaRandomEvents.6.b: "그의 연구 전문성을 활용해야 한다"
 LibyaRandomEvents.6.c: "그를 지렛대 삼아 현 총리를 분발하게 한다"
 LibyaRandomEvents.7.t: "원심분리기 공급처 유출"
 LibyaRandomEvents.7.d: "우리 핵 프로그램을 위한 원심분리기 일부가 파키스탄의 도움으로 입수되었다는 사실이 세계 언론에 유출되었습니다. 부품은 말레이시아에서 제조되어 파키스탄의 도움으로 두바이를 거쳐 리비아로 운송되었습니다. 소식통에 따르면 파키스탄은 북한과 이란에도 유사한 활동을 벌였습니다. 파키스탄 관리들은 이러한 거래를 전혀 알지 못했으며 물자는 암시장의 범죄자들이 취급한 것이라고 밝혔습니다. 어쨌든 이는 우리의 대외 이미지에 타격을 주고 있습니다."
 LibyaRandomEvents.7.a: "원하는 것은 사들일 수 있다"
 LibyaRandomEvents.7.b: "우리는 불법적으로 입수한 것이 아무것도 없다!"
 LibyaRandomEvents.7.c: "세계는 우리가 과거의 잘못을 바로잡고 있음을 안다"
 LBA_disarmament_public_tt: "§Y$LBA_disarmament_program$§!을(를) 완료했기 때문에 이 선택지를 사용할 수 있습니다"
 LibyaRandomEvents.8.t: "총리의 성명"
 LibyaRandomEvents.8.d: "BBC와의 인터뷰에서 우리 총리는 로커비 폭파 사건 피해자들에게 보상금을 제안함으로써 리비아가 '평화를 샀지만' 잘못을 인정한 것은 아니라고 말했습니다. 이는 우리가 그 공격에 대한 책임을 졌다는 이전의 성명과 모순됩니다."
 LibyaRandomEvents.8.a: "총리의 말에도 일리가 있다"
 LibyaRandomEvents.8.b: "입장을 재확인하는 성명을 발표한다"
 LibyaRandomEvents.8.c: "이 멍청이를 해임하라!"
 LibyaRandomEvents.9.t: "핵 장비 인도"
 LibyaRandomEvents.9.d: "오늘 보도 자료를 통해 백악관은 리비아의 마지막 핵 관련 장비가 미국에 인도되었음을 확인했습니다. 마지막 수송품에는 모든 원심분리기 부품, 우라늄 변환 장비, 모든 장거리 미사일과 발사 장비가 포함되었습니다. [LBA.GetLeader]은(는) 워싱턴 포스트에 '대화가 가능해진' 지금, 미국과의 앞으로의 관계에 낙관적이라고 밝혔습니다."
 LibyaRandomEvents.9.a: "군축을 향한 위대한 한 걸음이다!"
 LibyaRandomEvents.9.b: "이제 우리는 사업 준비를 마쳤다"
 LibyaRandomEvents.10.t: "간호사들에게 사형 선고"
 LibyaRandomEvents.10.d: "불가리아 간호사 5명과 팔레스타인 의사 1명이 리비아 어린이들을 고의로 HIV에 감염시킨 혐의로 사형을 선고받았습니다. 몇 년 전 벵가지의 한 어린이 병원에서 HIV가 집단 발병했습니다. 법원에 따르면 간호사들과 의사는 치료법을 연구하기 위해 어린이 426명을 바이러스에 감염시켰으며, 이 중 47명이 이미 사망했습니다. 피고인들은 자신들이 이 나라에 도착했을 때 이미 발병이 한창이었으며 병원의 열악한 위생이 원인이라며 계속 무죄를 주장하고 있습니다. 또한 리비아 경찰에게 고문을 당한 뒤에야 자백했다고 주장합니다.\n\n미국과 EU는 리비아에 판결을 뒤집으라고 압박하고 있으며, [LBA.GetLeader]에게 개입해 달라고까지 요청했습니다. 그러나 어린이들의 부모는 사형 집행을 요구하고 있습니다."
 LibyaRandomEvents.10.a: "어린이를 해친 살인자들을 어떻게 풀어줄 수 있는가?"
 LibyaRandomEvents.10.b: "열악한 위생의 희생양으로 삼아서는 안 된다"
 LibyaRandomEvents.11.t: "간호사들 처형"
 LibyaRandomEvents.11.d: "오늘 이른 아침, 불가리아 간호사 5명과 팔레스타인 의사가 총살형으로 처형되었습니다. 사망한 어린이와 감염된 어린이의 가족들이 법원 주위에 모여 있었습니다. 벵가지 거리에 총성이 울려 퍼지자 환호성이 들렸습니다."
 LibyaRandomEvents.11.a: "정의다"
 LibyaRandomEvents.12.t: "선고를 뒤집은 대법원"
 LibyaRandomEvents.12.d: "The Libyan Supreme Court has overturned the death sentence of the five Bulgarian nurses and the Palestinian doctor. This ruling came just a few days before the execution was supposed to happen. Parents and relatives of the infected children stood outside the supreme court, protesting against the decision and calling for the death penalty to take effect. They are quite dissatisfied with the [LBA.GetLeader] inability to bring justice."
 LibyaRandomEvents.12.a: "판사들은 왜 내가 시키는 대로 하지 못하는가"
 LibyaRandomEvents.13.t: "새로운 총리?"
 LibyaRandomEvents.13.d: "국제 제재가 해제되었으니, 지금이 또 한 번의 총리 교체를 단행할 때일지도 모릅니다. 훌륭한 후보는 현 부총리인 바그다디 마흐무디입니다. 마흐무디는 의학 학위를 가지고 있으며 이전에 보건 및 사회보장부 장관을 지냈습니다. 다른 부처에서도 경험이 있습니다. 그는 총리가 된다면 석유 수익의 일부를 가져다 미래 세대를 위해 투자하는 리비아 투자청을 설립하겠다고 말했습니다."
 LibyaRandomEvents.13.a: "리비아 투자청은 훌륭한 아이디어로 보인다"
 LibyaRandomEvents.13.b: "그의 연구 전문성을 활용해야 한다"
 LibyaRandomEvents.13.c: "현 총리도 잘하고 있다"
 LibyaRandomEvents.14.t: "리비아, 테러 지원국 명단에서 삭제"
 LibyaRandomEvents.14.d: "오늘 미국 국무부는 리비아를 테러 지원국 명단에서 삭제한다고 발표했습니다. 이는 리비아와 서방의 관계 개선을 향한 위대한 한 걸음입니다."
 LibyaRandomEvents.14.a: "이제 미국은 우리의 친구다"
 LibyaRandomEvents.14.b: "애초에 그 명단에 오를 이유가 없었다!"
 LibyaRandomEvents.15.t: "우리를 테러리스트 지원 혐의로 비난하는 소말리아"
 LibyaRandomEvents.15.d: "이슬람주의자들과 싸우고 있는 소말리아 정부는 이집트, 이란과 함께 우리가 소말리아의 이슬람주의자들을 지원하고 있다고 비난했습니다. 그들은 우리가 무기를 전달하여 분쟁을 부채질하고 있다고 주장합니다."
 LibyaRandomEvents.15.a: "그 무기는 너희를 위한 것이었다"
 LibyaRandomEvents.15.b: "우리는 누구에게든 원하는 대로 무기를 보낼 수 있다"
 LibyaRandomEvents.15.c: "우리는 누구에게도 무기를 보낸 적이 없다"
 LibyaRandomEvents.16.t: "아프리카 연합 회의"
 LibyaRandomEvents.16.d: "최근 아프리카 연합 회원국 회의에서 [LBA.GetLeader]은(는) 아프리카 통합 계획을 다른 지도자들과 두루 논의했습니다. 이 구상에 대한 저항은 여전합니다. 많은 아프리카 지도자들이 연합에 집중하면 대륙의 여러 분쟁을 해결하기 위한 자원이 줄어들 것을 우려하기 때문입니다. 게다가 많은 외부 보고서는 아프리카 연합이 현재의 상태에서도 여러 재정 비리를 안고 있음을 보여주며 이는 연합에 대한 신뢰를 약화시킵니다."
 LibyaRandomEvents.16.a: "적어도 공감대를 가진 이들이 몇 명은 있었다"
 LibyaRandomEvents.16.b: "아프리카는 스스로의 문제를 해결할 만큼 강하다"
 LibyaRandomEvents.16.c: "부패에 대한 우려는 타당하다"
 LibyaRandomEvents.17.t: "[FRA.GetLeader]의 리비아 방문"
 LibyaRandomEvents.17.d: "프랑스 대통령 [FRA.GetLeader]이(가) 양국 관계 개선을 위해 리비아를 방문했습니다. 트리폴리의 천막에서 [LBA.GetLeader]을(를) 만난 두 사람은 군수 산업 협력 협정의 체결과 프랑스 석유 기업의 리비아 유전 참여에 대해 논의했습니다."
 LibyaRandomEvents.17.a: "프랑스 산업을 환영한다"
 LibyaRandomEvents.17.b: "석유가 어쨌다고?"
 LibyaRandomEvents.17.c: "오히려 우리가 프랑스에 투자하면 어떨까?"
 LibyaRandomEvents.18.t: "프랑스 무기 구입"
 LibyaRandomEvents.18.d: "프랑스가 대전차 미사일과 통신 장비를 구입할 기회를 제안했습니다. 이 제안을 받아들여야 할까요?"
 LibyaRandomEvents.18.a: "물론이다"
 LibyaRandomEvents.18.b: "혹시 대공 미사일은 없나?"
 LibyaRandomEvents.18.c: "아니, 사양한다"
 LibyaRandomEvents.19.t: "리비아, UN 안전보장이사회 이사국 선출"
 LibyaRandomEvents.19.d: "We have been elected to be a non-permanent member of the UN Security Council for the next two years. This is a great opportunity for us to improve the security of the world. However, this does come with some downsides. Non-permanent members usually see a 60% increase in foreign aid, and the economic growth of non-permanent members tends to half of non-members. Some might call this an attempt by the permanent members to influence our decision making."
 LibyaRandomEvents.19.a: "약간의 추가 자금도 나쁘지 않다"
 LibyaRandomEvents.19.b: "강대국을 위해 우리의 신념을 버리지 않겠다"
 LibyaRandomEvents.20.t: "LIFG 기지 급습"
 LibyaRandomEvents.20.d: "Our army has successfuly raided a hideout of the Libyan Islamic Fighting Group. Roughly a dozen fighters were killed and none were left as prisoners. We also found a small stockpile of weapons and other military equipment the group was planning to use in a raid against our military outpost."
 LibyaRandomEvents.20.a: "시신을 트리폴리에서 조리돌린다"
 LibyaRandomEvents.20.b: "시신은 태우고 총기는 챙긴다"
 LibyaRandomEvents.21.t: "군 검문소를 습격한 LIFG"
 LibyaRandomEvents.21.d: "One of our military checkpoints has been raided by the LIFG. They charged the checkpoint with a handful of technicals, killing most of the guards there. Some of ours soldiers managed to flee before being killed. Once the Islamists were happy with their results, they quickly sped away. Reinforcements from a nearby barracks weren't fast enough to catch them."
 LibyaRandomEvents.21.a: "적에게서 도망치는 겁쟁이가 어디 있나!?"
 LibyaRandomEvents.22.t: "경찰서를 공격한 LIFG"
 LibyaRandomEvents.22.d: "주요 도시의 경찰서가 LIFG의 공격을 받았습니다. 그들은 대낮에 정문을 뚫고 들어가 경찰관들과 총격전을 벌였으며, 경찰은 곧 제압되었습니다. LIFG 전투원들은 우리 군의 반격에 맞서 진지를 지켜냈고, 동시에 유치장에 갇혀 있던 LIFG 조직원들을 풀어주었습니다. 결국 LIFG는 밤의 어둠을 틈타 경찰서에서 철수했습니다. 우리 군이 이슬람주의자 일부를 사살하기는 했으나 우리도 큰 피해를 입었습니다. 투옥되었던 LIFG 전투원들이 풀려났으므로, 이는 LIFG에게 순이득이 된 공격이었습니다."
 LibyaRandomEvents.22.a: "대낮에!?"
 LibyaRandomEvents.23.t: "군사 기지를 점령한 LIFG"
 LibyaRandomEvents.23.d: "우리 군사 기지 한 곳이 LIFG에게 일시적으로 점령되었습니다. 그들은 폭발물을 가득 실은 트럭을 정문으로 몰고 가 폭파시키는 것으로 공격을 시작해 우리 병사들을 혼란에 빠뜨렸습니다. 곧이어 LIFG 전투원들이 사방에서 기지로 쏟아져 들어왔습니다. 혼란과 공포로 병사 대부분이 진지를 버리고 기지를 이슬람주의자들에게 내주었습니다. 다른 군사 기지에서 특수 부대가 출동했고, 몇 시간의 포위 끝에 이슬람주의자 대부분이 사살되었으나 일부는 달아났습니다. 이후 LIFG는 이것이 시작일 뿐이며, 정부가 자신들에게 권력을 넘기지 않으면 [ROOT.GetLeader]을(를) 직접 노리겠다는 성명을 발표했습니다."
 LibyaRandomEvents.23.a: "어떻게 군사 기지를 통째로 점령당할 수 있단 말인가?!"
 LibyaRandomEvents.24.t: "[ROOT.GetLeader] 암살"
 LibyaRandomEvents.24.d: "상상할 수 있는 최악의 일이 벌어졌습니다. [LBA.GetLeader]의 차량 행렬이 LIFG의 테크니컬 부대에게 갑작스러운 공격을 받았습니다. 소화기와 중화기로 무장한 이들의 총탄이 [ROOT.GetLeader]의 차량에 쏟아졌고, 결국 RPG를 직격으로 맞았습니다. 공격은 끝내 격퇴되었으나 [ROOT.GetLeader]은(는) 이후 병원에서 부상으로 숨졌습니다."
 LibyaRandomEvents.24.a: "끔찍한 일이다"
 LibyaRandomEvents.25.t: "망명에서 돌아온 LIFG 전투원들"
 LibyaRandomEvents.25.d: "국가와 LIFG 사이에 공식적으로 평화가 찾아오면서, 망명 생활을 하던 많은 LIFG 조직원들이 리비아로 돌아왔습니다."
 LibyaRandomEvents.25.a: "잘된 일이겠지?"
 LibyaRandomEvents.26.t: "아프가니스탄 참전용사에게 배우기"
 LibyaRandomEvents.26.d: "Many of LIFG members fought against the Soviet Union together with the Afghanistan Mujahideen. It would make sense we utilise their expertise whenever possible."
 LibyaRandomEvents.26.a: "군 편성에 대해 무엇을 배웠는가?"
 LibyaRandomEvents.26.b: "전술에 대해 무엇을 배웠는가?"
 LibyaRandomEvents.27.t: "형편없는 신병들"
 LibyaRandomEvents.27.d: "Many of LIFG members fought against the Soviet Union together with the Afghanistan Mujahideen. However, their fighting style and experience isn't exactly up-to bar on what is required from a modern military. Fanatic loyalty is good, but it can't always replace professionalism."
 LibyaRandomEvents.27.a: "좋은 점이 있으면 나쁜 점도 있는 법이다"
 LibyaRandomEvents.28.t: "신학 논쟁"
 LibyaRandomEvents.28.d: "집권 살라피 집단의 일원들이 무슬림 형제단 일원들과 이슬람 신학을 두고 열띤 논쟁을 벌였습니다. 형제단과 협력하기로 합의했지만 이념적으로 큰 차이가 몇 가지 있습니다. 논쟁은 매우 과열되기 시작했으나, 다행히 [ROOT.GetLeader]이(가) 신발이 날아다니기 전에 논쟁을 멈추게 했습니다."
 LibyaRandomEvents.28.a: "당연히 살라피의 견해가 옳다"
 LibyaRandomEvents.28.b: "형제단의 주장에도 일리가 있다"
 LibyaRandomEvents.28.c: "그만! 이 협력은 끝이다"
 LibyaRandomEvents.29.t: "여성에 반하는 파트와를 발표한 대무프티"
 LibyaRandomEvents.29.d: "The Grand Mufti has issued a fatwa against Libyan women marrying foreign men. He also organised a protest with a group of women at the UN headquartes, issuing a 2nd fatwa against the UN Commission on the Status of Women's report because it urges the government to protect women and girls against violence."
 LibyaRandomEvents.29.a: "하, 여자들이란"
 LibyaRandomEvents.30.t: "국가의 적에 반하는 파트와를 발표한 대무프티"
 LibyaRandomEvents.30.d: "대무프티가 우리 집권당의 모든 적에 반하는 파트와를 발표했습니다. 그는 어떠한 야당도 결성되어서는 안 된다고 금지하고, 국가의 모든 적이 제거되어야 한다고 밝혔습니다."
 LibyaRandomEvents.30.a: "그가 우리 편이라니 기쁘다"
 LibyaRandomEvents.31.t: "사우디아라비아에 항의하는 대무프티"
 LibyaRandomEvents.31.d: "대무프티는 사우디아라비아의 정책이 무슬림 형제와 아이들을 죽이고 있다며, 사우디아라비아로의 하지와 우므라 순례를 보이콧하라고 선언했습니다."
 LibyaRandomEvents.31.a: "어차피 그들과 친구가 되고 싶지도 않았다"
 LibyaRandomEvents.32.t: "자살 폭탄 테러를 허용한 대무프티"
 LibyaRandomEvents.32.d: "In a TV interview today, the Grand Mufti stated that suicide bombings are fully permitted by the Sharia Law. This has upset some of our citizens, as they are getting worried if they will be forced to martyr themselves to defend the states interests."
 LibyaRandomEvents.32.a: "누구에게도 자폭을 강요하지는 않을 것이다"
 LibyaRandomEvents.33.t: "지원병 지하디스트"
 LibyaRandomEvents.33.d: "마그레브에 대한 지하드 선포라는 우리의 결정이 유리하게 작용하고 있습니다. 수십 명의 지원자가 우리 군에 합류해 성전을 돕기 위해 몰려들고 있습니다."
 LibyaRandomEvents.33.a: "We welcome this brothers!"
 LibyaRandomEvents.34.t: "[ROOT.GetNameDef] 탈출을 시도하는 사람들"
 LibyaRandomEvents.34.d: "마그레브에 대한 지하드 선포라는 우리의 결정이 국경 안에 사는 일부 사람들을 두렵게 했습니다. 다가올 성전이 무엇을 가져올지 걱정한 사람들은 분쟁을 피해 주로 유럽으로 탈출하고 있습니다."
 LibyaRandomEvents.34.a: "그들은 천국에 갈 자격이 없다"
 LibyaRandomEvents.35.t: "편향된 교육에 항의하는 교사들"
 LibyaRandomEvents.35.d: "교원 노조가 국가의 가치를 장려하는 교육 과정을 정부가 최근 채택한 데 항의하는 시위를 조직했습니다. 교사들은 이것이 리비아가 세계에서 경쟁할 능력과 젊은 학생들이 세상을 이해하는 능력을 저해한다고 말합니다. 일부 교사들은 새 교육 과정을 가르치기를 거부하고 기존 과정을 고수하고 있습니다."
 LibyaRandomEvents.35.a: "해고당한 뒤에도 무엇을 가르치는지 보자"
 LibyaRandomEvents.35.b: "항의하게 두자"
 LibyaRandomEvents.35.c: "교육의 자유를 더 보장하겠다고 약속한다"
 LibyaRandomEvents.36.t: "정부에 항의하는 여성들"
 LibyaRandomEvents.36.d: "한 여성 단체가 정부에 항의하는 시위를 조직했습니다. 그들은 정부의 정책이 리비아 여성들이 지향하는 바에 반한다고 주장합니다. 이 시위에 대한 지지는 제한적이지만, 나라의 모든 여성이 우리의 정책에 동의하는 것은 아니며 이를 드러내기를 두려워하지 않는다는 점을 보여줍니다."
 LibyaRandomEvents.36.a: "그냥 무시하라"
 LibyaRandomEvents.37.t: "정부를 지지하는 여성들"
 LibyaRandomEvents.37.d: "한 여성 단체가 정부를 지지하는 집회를 조직했습니다. 그들은 여성에 대한 최근의 정책 변화가 리비아 여성의 지위를 향상시킬 뿐 아니라 여성이 어떻게 대우받아야 하는지를 전 세계에 보여줄 것이라고 밝혔습니다."
 LibyaRandomEvents.37.a: "참으로 용감한 여성들이다"
 LibyaRandomEvents.38.t: "해외의 바트주의 지지"
 LibyaRandomEvents.38.d: "Our Ba'athist policies are being welcomed with open arms abroad. A group of Ba'athist politicians from a foreign country hosted Libyan Ba'athist in a political meeting. This kind of networking is vital for Ba'athism to rise again."
 LibyaRandomEvents.38.a: "훌륭하다!"
 LibyaRandomEvents.38.b: "링크드인에서도 인맥을 쌓는 것을 잊지 않았겠지?"
 LibyaRandomEvents.39.t: "바트주의 반대 시위"
 LibyaRandomEvents.39.d: "외국에 있는 우리 대사관 중 한 곳 근처에서 시위가 조직되었습니다. 시위대는 반바트주의 구호를 외치며, 최근 우리의 바트주의 지지가 다른 나라를 지배하려는 시도에 불과하다고 주장했습니다. 이러한 시위는 모든 아랍인을 통합하려는 우리의 노력에 타격을 주고 있습니다."
 LibyaRandomEvents.39.a: "젠장"
 LibyaRandomEvents.39.b: "피해를 줄이도록 노력한다"
 LibyaRandomEvents.40.t: "녹색 책 - 독서 모임"
 LibyaRandomEvents.40.d: "The new Green Book written by Gaddafi is gaining traction. Since its release, it has become a number one seller. It can be commonly found in the backbags of students and it has even become popular outside of Libya."
 LibyaRandomEvents.40.a: "사람들이 책을 읽으니 좋은 일이다"
 LibyaRandomEvents.41.t: "꾸란 모임"
 LibyaRandomEvents.41.d: "The release of the new Green Book hasn't gone without resistance. In several cities, imams have setup book clubs where people can read and rehearse the Quran. It seems that people want to read something more traditional rather than guidelines from the state."
 LibyaRandomEvents.41.a: "'녹색 책'이 꾸란보다 낫다"
 LibyaRandomEvents.42.t: "녹색 책 - 독서 모임"
 LibyaRandomEvents.42.d: "카다피의 '녹색 책'을 없애려는 우리의 시도에도 불구하고 이 책은 여전히 사람들의 손에 들어가고 있습니다. 어젯밤 경찰은 이 책의 애독자를 위한 비밀 독서 모임을 해산시켰습니다. 사람들이 '녹색 책' 대신 꾸란을 읽게 만드는 일은 계획보다 어려울 것입니다."
 LibyaRandomEvents.42.a: "그 어리석은 책을 그냥 치워버릴 수 없을까"
 LibyaRandomEvents.43.t: "꾸란 모임"
 LibyaRandomEvents.43.d: "우리가 '녹색 책'을 금지하자, 여러 이맘들이 젊은이들이 함께 꾸란을 읽을 수 있는 독서 모임을 만들었습니다. 이로 인해 종교 문제에 대한 관심이 높아졌고, 우리가 개입하지 않아도 사람들은 이슬람에 대해 교육받고 있습니다."
 LibyaRandomEvents.43.a: "리비아인은 결국 신의 자녀들이다"
 LibyaRandomEvents.44.t: "반체제 인사 발각"
 LibyaRandomEvents.44.d: "인민 혁명 위원회의 정보원이 일반 인민 회의 내에 반체제 인사가 있을 가능성을 경찰에 알렸습니다. 이 의원은 민주주의와 언론의 자유라는 사상을 제기하려 했습니다. 다행히 이 사람은 자신의 생각을 퍼뜨리기 전에 저지되었습니다."
 LibyaRandomEvents.44.a: "국가는 다시 한번 안전해졌다"
 LibyaRandomEvents.44.b: "이는 혁명 위원회 덕분이다"
 LibyaRandomEvents.45.t: "개혁을 논하는 GPC 의원"
 LibyaRandomEvents.45.d: "In a meeting of a General People's Congress today, a member made notion of possibly increasing citizen participation and opinion in the political process. How this dissident managed to hide his opinions from the People's Revolutionary Committee is not known, but ideas like these are dangereous to be spread around."
 LibyaRandomEvents.45.a: "어떻게 그의 입을 막을까?"
 LibyaRandomEvents.45.b: "혁명 위원회의 머리를 한데 부딪쳐 정신 차리게 한다"
 LibyaRandomEvents.46.t: "혁명가 발각"
 LibyaRandomEvents.46.d: "Today the General People's Congress exposed a vocal revolutionary from the Revolutionary People's Committee. The member was ranting about how the GPC makes the state vulnerable to outside influences and a stronger hand is needed in ruling the country. Luckily, we managed to silence and deplatform him before any damage was done."
 LibyaRandomEvents.46.a: "자유가 보장되었다"
 LibyaRandomEvents.46.b: "이는 일반 인민 회의 덕분이다"
 LibyaRandomEvents.47.t: "불타는 혁명가"
 LibyaRandomEvents.47.d: "A member of the People's Revolutionary Committee has been making rounds in several conventions across the country stating how the General People's Congress are nothing but puppets of cabal powers. Preaching for the return of a security apparatus that protects the state and its people, the fiery revolutionary has been well reserved by many audiences."
 LibyaRandomEvents.47.a: "어떻게 그의 입을 막을까?"
 LibyaRandomEvents.47.b: "일반 인민 회의의 머리를 한데 부딪쳐 정신 차리게 한다"
 LibyaRandomEvents.48.t: "과거에 갇힌 고위 관료"
 LibyaRandomEvents.48.d: "Even though we have reformed our form of government, many officials, politicians and bureaucrats are still people who worked under the Gaddafi regime. One of these people has been recently complaining that the new regime is unyieldy, complicated and less efficient than the old one, and they are not very motivated to do their work efficiently anymore. Kicking them out would solve the problem but finding experience people like them is difficult. Alternatively, we could just 'promote' them to a more comfortable work assignment with better perks."
 LibyaRandomEvents.48.a: "내쫓고 후임을 찾는다"
 LibyaRandomEvents.48.b: "급여 인상과 차량 수당은 어떨까?"
 LibyaRandomEvents.49.t: "정부를 칭찬하는 원로 정치인"
 LibyaRandomEvents.49.d: "Even though we have reformed our form of government, many officials, politicians and bureaucrats are still people who worked under the Gaddafi regime. One of the more senior politicans recently stated in a press conference that they are happy to see change in Libya. They said that they will do their utmost best to fix all the mistakes and bad legacy of the old regime."
 LibyaRandomEvents.49.a: "애국적인 정치인의 진정한 본보기다"
 LibyaRandomEvents.49.b: "털어놓을 옛 비밀이라도 있지 않을까?"
 LibyaRandomEvents.50.t: "왕실의 흥청망청 소비"
 LibyaRandomEvents.50.d: "국가는 리비아 왕족에게 재산을 관리하고 가족을 부양할 수 있도록 소액의 '급여'를 지급합니다. 그런데 왕실 일원 한 명이 지난 주말 파티, 보트, 자동차, 부동산에 돈을 펑펑 쓰며 흥청망청 소비하여 국가의 여러 사업에 타격을 준 것으로 보입니다."
 LibyaRandomEvents.50.a: "어쩌면 군주제는 그리 좋은 생각이 아니었을지도 모른다"
 LibyaRandomEvents.51.t: "왕실의 투자"
 LibyaRandomEvents.51.d: "국가는 리비아 왕족에게 재산을 관리하고 가족을 부양할 수 있도록 소액의 '급여'를 지급합니다. 그런데 왕실 일원 한 명이 그 돈의 일부를 외국에 투자한 것으로 보입니다. 이는 해당 국가 내에서 우리의 입지를 크게 향상시켰습니다."
 LibyaRandomEvents.51.a: "돈 관리에 책임감 있는 왕족이라니?"
 LibyaRandomEvents.52.t: "사라진 몰수 자금"
 LibyaRandomEvents.52.d: "We have been steadily siphoning funds from the old royal family into the state's coffers. However, we recently noticed an abnormality in the books and it seems that a very large sum of confiscated money has ended in some official's pockets."
 LibyaRandomEvents.52.a: "이제는 아무도 믿을 수 없단 말인가?"
 LibyaRandomEvents.53.t: "추가 자금 발견"
 LibyaRandomEvents.53.d: "우리는 옛 왕실에서 국고로 자금을 꾸준히 옮겨 왔습니다. 최근 귀중품, 고가의 미술품, 채권이 든 은닉처를 발견했으며, 이는 예상보다 더 많은 자금을 국고에 보탤 것입니다."
 LibyaRandomEvents.53.a: "쇼 미 더 머니!"
 LibyaRandomEvents.54.t: "지하디스트를 사살한 외국 특수 부대"
 LibyaRandomEvents.54.d: "Last night there was an armed incident in a small village in the Libyan desert. The village was government known hideout for a foreign terrorist who was temporarily in hiding in our country. Armed soldiers stormed the hideout, killing the terrorist and their guards. Based on the equipment and tactics used, it is clear this attack was conducted by a special forces unit of some kind. We have no idea which country these attackers originated from, how they got into the country or how they escaped. No country has taken responsibility of the attack so far. This is a clear violation of our sovereignty, and we could do nothing about it. It is only a matter of time until this news becomes known to the public and world."
 LibyaRandomEvents.54.a: "어떻게 이런 일이 가능한가? 유령이라도 되는가?"
 LibyaRandomEvents.55.t: "외국 특수 부대 격퇴"
 LibyaRandomEvents.55.d: "Last night there was an armed incident in a small village in the Libyan desert. The village was government known hideout for a foreign terrorist who was temporarily in hiding in our country. Armed soldiers stormed the hideout with the intention of killing the terrorists. However, the local seucrity forces managed to hold their ground against the attackers despite taking heavy casualties. The attackers vanished without trace or casualties. Based on the equipment and tactics used, it is clear this attack was conducted by a special forces unit of some kind. We have no idea which country these attackers originated from, how they got into the country or how they escaped. No country has taken responsibility of the attack so far. This is a clear violation of our sovereignty but at least we held our own, which hopefully will prevent further attacks. It is only a matter of time until this news becomes known to the public and world."
 LibyaRandomEvents.55.a: "적어도 그들을 물리쳤다"
 LibyaRandomEvents.56.t: "성장을 촉진하는 경제적 유대"
 LibyaRandomEvents.56.d: "유럽과 경제를 더욱 긴밀히 묶겠다는 우리의 결정이 결실을 맺고 있는 듯합니다. 유럽의 투자 확대와 성장이 우리도 끌어올리고 있는 것으로 보입니다. 경제에 좋은 날입니다."
 LibyaRandomEvents.56.a: "돈이다!"
 LibyaRandomEvents.57.t: "Economic Ties Decreases Growth"
 LibyaRandomEvents.57.d: "Our decision to tie our economy closer with Europe seems to have been not such a good idea. As the economies of Western countries slows down, it seems that our economy is suffering from ripple effects."
 LibyaRandomEvents.57.a: "젠장"
 LibyaRandomEvents.58.t: "전쟁 범죄로 고발된 용병"
 LibyaRandomEvents.58.d: "One of the mercenary groups we have sent abroad have been accused of war crimes. Locals report that they entered a village, looting it of its valuables and executing and raping several people. This story was quickly picked up by the global media and we are now under pressure."
 LibyaRandomEvents.58.a: "무슨 용병 말인가?"
 LibyaRandomEvents.59.t: "경험을 가져온 용병"
 LibyaRandomEvents.59.d: "해외에 파견한 용병 집단 중 하나가 임무를 마치고 돌아왔습니다. 그들은 쌓은 경험을 모을 수 있도록 우리 군 장교들과 워크숍을 열라는 권고를 즉시 받았습니다."
 LibyaRandomEvents.59.a: "무슨 용병 말인가?"
 LibyaRandomEvents.60.t: "장비를 원하는 육군"
 LibyaRandomEvents.60.d: "리비아에는 혁명 수비대와 정규군이라는 두 개의 군대가 있습니다. 수비대가 나라의 보급 창고 대부분을 통제하고 있습니다. 최근 여러 고위 육군 장교들이 대부분의 물자를 수비대에 요청해야 하는 탓에 군을 운영하기가 불가능하다고 불평했습니다. 그들은 더 많은 보급품을 배정해 줄 것을 요구하고 있습니다."
 LibyaRandomEvents.60.a: "그들에게 무기를 내준다"
 LibyaRandomEvents.60.b: "그 무기들이 잠겨 있는 데는 이유가 있다"
 LibyaRandomEvents.61.t: "더 많은 신병을 원하는 혁명수비대"
 LibyaRandomEvents.61.d: "In Libya, there are two armies; the Revolutionary Guard Corps and the regular armed forces. The balance of power has recently been shifted towards the regular armed forces. The Revolutionary Guards Corps has been complaining that ever since their importance was reduced, there has been a lack of recruits as most are being allocated to the army. They are finding it difficult to function by just trying to keep their existing manpower available."
 LibyaRandomEvents.61.a: "신병 일부를 그들에게 배정한다"
 LibyaRandomEvents.61.b: "실력 문제로 들리는군"
 LibyaRandomEvents.62.t: "유전을 매각한 정부 관리"
 LibyaRandomEvents.62.d: "흥미로운 문서 한 장이 [LBA.GetLeader]의 책상에 올라왔습니다. 한 정부 관리가 정부나 국영 석유 공사의 승인 없이 국가 소유의 유전 하나를 국제 운영사에 매각했다는 내용입니다. 매각 대금 대부분은 이 관리의 주머니로 들어간 것으로 보입니다."
 LibyaRandomEvents.62.a: "매각을 무효화하라!"
 LibyaRandomEvents.62.b: "우리가 할 수 있는 일은 없다"
 LibyaRandomEvents.63.t: "경쟁자를 몰아낸 NOC"
 LibyaRandomEvents.63.d: "흥미로운 문서 한 장이 [LBA.GetLeader]의 책상에 올라왔습니다. 국영 석유 공사가 정치적 수작을 부려 리비아 유전 중 한 곳에서 외국 기업을 내쫓았다는 내용입니다. NOC의 누군가가 국가의 입지를 이용해 회사와 자신을 위해 더 많은 돈을 긁어모으려 하는 것으로 보입니다."
 LibyaRandomEvents.63.a: "매각을 무효화하라!"
 LibyaRandomEvents.63.b: "우리가 할 수 있는 일은 없다"
 LibyaRandomEvents.64.t: "식량 부족"
 LibyaRandomEvents.64.d: "Due to our poor climate, we must import most of our food. This makes us very dependent on foreign countries, and disruptions without a steady supply line are common. Recently, there has been some problems with shipping grain to the country. With clogged ports not being able hold capacity and difficulty transporting grain accross the country, shortages have been created. This especially impacts the more rural areas, while the big cities of Tripoli and Benghazi are less affected. What should we do?"
 LibyaRandomEvents.64.a: "신속히 식량 공급원을 확보해 본다"
 LibyaRandomEvents.64.b: "빵이 없으면 케이크를 먹으라고 하라!"
 LibyaRandomEvents.65.t: "유세 열차 순회"
 LibyaRandomEvents.65.d: "Now that we have a railroad in the country, it might sense to make the best of it and travel across the country on a political tour. We would be able to promote both the political establishment and the new railway at the same time."
 LibyaRandomEvents.65.a: "칙칙폭폭 칙칙폭폭!"
 LibyaRandomEvents.65.b: "내게는 좀 빅토리아 시대 같은 느낌이다"
 LibyaRandomEvents.66.t: "열차 탈선"
 LibyaRandomEvents.66.d: "열차의 도입이 순탄치만은 않은 듯합니다. 열차 한 대가 탈선했습니다. 수십 명의 승객이 다쳤고 여러 명이 숨졌습니다. 사람들은 우리의 새 열차를 죽음의 덫이라고 부르며, 새 철도 사업은 [LBA.GetLeader]을(를) 위한 허영 사업에 불과하다고 주장하고 있습니다."
 LibyaRandomEvents.66.a: "철도 안전을 개선하겠다고 약속한다"
 LibyaRandomEvents.66.b: "이런 일은 일어나기 마련이다!"
 LibyaRandomEvents.67.t: "투부족의 반란"
 LibyaRandomEvents.67.d: "Due to our weak internal political situation, the Toubou people living in Southern Libya have taken up arms in rebellion. Feeling disenfranchised by the govenment for years, they have finally had enough. Numerically, they are hopelessly outnumbered even with the few turncoats that have already left our military to join them. It should not be a large effort to crush this revolts, though it will detrack us from our main opponent."
 LibyaRandomEvents.67.a: "그렇다면 반역이다"
 LibyaRandomEvents.67.b: "내버려 두자"
 LibyaRandomEvents.68.t: "투아레그족의 반란"
 LibyaRandomEvents.68.d: "Due to our weak internal political situation, the Tuareg people living in Southwestern Libya have taken up arms in rebellion. Feeling disenfranchised by the govenment for years, they have finally had enough. Our military forces with Tuareg allegiances have already flipped to the Tuareg side, and hundreds of Tuareg tribesmen are moving over the border from Niger and Algeria to join the fight. This little rebellion might turn into something bigger if they are not stopped."
 LibyaRandomEvents.68.a: "그렇다면 반역이다"
 LibyaRandomEvents.68.b: "내버려 두자"
 LibyaTribes.1.t: "육군의 떠오르는 별"
 LibyaTribes.1.d: "우리 육군의 [tribal_offender] 출신 장교가 큰 가능성을 보이고 있습니다. 그는 빠르게 계급을 올렸으나 이제 더 이상의 진급에서는 벽에 부딪힌 듯합니다. 군 수뇌부가 이 [tribal_offender] 출신이 더 이상의 권력을 쥐지 못하도록 막는 데 개인적 이해관계가 있는 것으로 보입니다. 우리가 개입하여 군이 그를 한 번 더 진급시키도록 강제할 수 있습니다. 이 조치는 [tribal_offender] 부족들로부터 우리에게 지지를 모아 줄 것입니다. 아니면 이 젊은 장교에 대한 군의 처우를 묵묵히 받아들일 수도 있습니다."
 LibyaTribes.1.a: "그는 진급할 자격이 있다"
 LibyaTribes.1.b: "우리가 개입할 일이 아니다"
 LibyaTribes.2.t: "해군의 떠오르는 별"
 LibyaTribes.2.d: "우리 해군의 [tribal_offender] 출신 장교가 큰 가능성을 보이고 있습니다. 그는 빠르게 계급을 올렸으나 이제 더 이상의 진급에서는 벽에 부딪힌 듯합니다. 군 수뇌부가 이 [tribal_offender] 출신이 더 이상의 권력을 쥐지 못하도록 막는 데 개인적 이해관계가 있는 것으로 보입니다. 우리가 개입하여 군이 그를 한 번 더 진급시키도록 강제할 수 있습니다. 이 조치는 [tribal_offender] 부족들로부터 우리에게 지지를 모아 줄 것입니다. 아니면 이 젊은 장교에 대한 군의 처우를 묵묵히 받아들일 수도 있습니다."
 LibyaTribes.2.a: "그는 진급할 자격이 있다"
 LibyaTribes.2.b: "우리가 개입할 일이 아니다"
 LibyaTribes.3.t: "공군의 떠오르는 별"
 LibyaTribes.3.d: "우리 공군의 [tribal_offender] 출신 장교가 큰 가능성을 보이고 있습니다. 그는 빠르게 계급을 올렸으나 이제 더 이상의 진급에서는 벽에 부딪힌 듯합니다. 군 수뇌부가 이 [tribal_offender] 출신이 더 이상의 권력을 쥐지 못하도록 막는 데 개인적 이해관계가 있는 것으로 보입니다. 우리가 개입하여 군이 그를 한 번 더 진급시키도록 강제할 수 있습니다. 이 조치는 [tribal_offender] 부족들로부터 우리에게 지지를 모아 줄 것입니다. 아니면 이 젊은 장교에 대한 군의 처우를 묵묵히 받아들일 수도 있습니다."
 LibyaTribes.3.a: "그는 진급할 자격이 있다"
 LibyaTribes.3.b: "우리가 개입할 일이 아니다"
 LibyaTribes.4.t: "논문을 발표한 대학생"
 LibyaTribes.4.d: "리비아 대학의 [tribal_offender] 출신 학생이 새로운 기술에 관한 논문을 발표했습니다. 이 논문은 우리 산업 부문의 발전에 도움이 될 수 있습니다. 그러나 여기에는 집권 정부와 다른 부족들이 리비아의 발목을 잡고 있다는 비판도 담겨 있습니다. 이 논문을 억눌러야 할까요, 그냥 두어야 할까요?"
 LibyaTribes.4.a: "이 논문은 좋은 소식이다"
 LibyaTribes.4.b: "출판을 막는다"
 LibyaTribes.5.t: "해법을 제시한 경제학자"
 LibyaTribes.5.d: "[tribal_offender] 부족 출신의 한 경제학자가 최근 간행물에서 일부 세금을 낮추면 리비아의 경제 생산성을 높일 수 있다고 밝혔습니다. 공교롭게도 이 감세는 주로 [tribal_offender] 부족에게 중요한 경제 부문에 영향을 미칠 것입니다. 이 경제학자의 말에는 일리가 있지만, 감세를 시행하면 우리가 다른 부족보다 [tribal_offender] 부족을 편애하는 것처럼 보일 것이 분명합니다."
 LibyaTribes.5.a: "국가 경제가 최우선이다"
 LibyaTribes.5.b: "다른 부족들도 만족시키도록 노력하자"
 LibyaTribes.6.t: "개혁을 제안한 지역 정치인"
 LibyaTribes.6.d: "'When I was a little boy growing up in a [tribal_offender] village, things ran smoothly. Our elders knew how to run a community, something our government struggles doing', a local level [tribal_offender] politician stated on a TV interview recently when asked how he would improve the Libyan nation. In his interview, he made some good points how to modernise the nation. Adapting these changes would be beneficial but it would cause a slight loss of face."
 LibyaTribes.6.a: "그의 생각이 마음에 든다"
 LibyaTribes.6.b: "그는 자기 분수를 지켜야 한다"
 LibyaTribes.7.t: "반역 혐의를 받는 부족 원로들"
 LibyaTribes.7.d: "[tribal_offender] 부족 출신의 혁명 위원회 정보원이 부족 원로 두 명이 서로 반혁명적인 생각을 논의해 왔다는 정보를 전했습니다. 이들은 적대 세력과도 접촉하며 민감한 정보를 공유한 것으로 보입니다. 모든 세부 사항을 완전히 확인할 수는 없으나, 사실이라면 이 혐의는 중대합니다. 물론 이 정보원이 단지 자기 부족의 입지를 높이려는 것일 수도 있습니다."
 LibyaTribes.7.a: "이 두 원로를 제거한다"
 LibyaTribes.7.b: "정보원이 거짓말을 하는 것이 분명하다"
 LibyaTribes.8.t: "거액의 기부"
 LibyaTribes.8.d: "A group of [tribal_offender] businessmen have approached the government. In exchange for the government considering some business friendly legislation, they are willing to donate a large sum of money to help the government run it's daily business. Looking at their suggestions on how to make Libya more 'business friendly', many items on their list include projects that would clearly only benefit [tribal_offender]s."
 LibyaTribes.8.a: "좋은 거래처럼 들린다"
 LibyaTribes.8.b: "이는 부패다!"
 LibyaTribes.9.t: "부족 땅을 점유한 석유 회사"
 LibyaTribes.9.d: "A group of [tribal_offender] elders have approached the government with a conundrum. An oil field run by a foreign corporation is operating on land belonging to their tribe. We can find any paperwork regarding the original ownership of the land, or if the land has been legally transferred to the oil company. However, we could probably use this as an excuse to get the oil fields back under government control if we wanted to, although a lot of the oil profits would then go to [tribal_offender]s."
 LibyaTribes.9.a: "유전을 되찾는다"
 LibyaTribes.9.b: "회사가 이 유전을 합법적으로 소유하고 있다"
 LibyaTribes.10.t: "불타는 설교자"
 LibyaTribes.10.d: "[tribal_offender] 모스크의 이맘이 최근 쿠트바에서 '리비아의 모든 민족 중에서 [tribal_offender]이(가) 알라께 가장 충실하다'라고 말하며 [tribal_offender] 전통의 우월함을 주장했습니다. 그의 연설은 리비아의 다른 곳에서 반발을 샀으며 여러 부족 사이의 긴장도를 높였습니다."
 LibyaTribes.10.a: "그의 말이 옳다"
 LibyaTribes.10.b: "이 설교자는 오래 설교하지 못할 것이다"
 LibyaTribes.11.t: "군대 내 가혹 행위"
 LibyaTribes.11.d: "There has been a bit of a scandal in the military recently; a video of a [tribal_offender] officer abusing a group of [tribal_defender] recruits has been circulating online. The video shows the recruits being made to run around a track for hours in full gear, beaten with sticks and held underwater long periods of time. When asked about the incident, the [tribal_offender] officer stated that 'these gawad do not know how to act like soldiers. Ancient [tribal_offender] warriors with sticks and stones would make for a more effective modern military than these dogs'. Several [tribal_defender] elders have called for this officer to be kicked out of the military for tarnishing the name of Libya's armed forces."
 LibyaTribes.11.a: "신병들이 아무것도 아닌 일로 징징대고 있다"
 LibyaTribes.11.b: "장교가 분명히 선을 넘었다"
 LibyaTribes.12.t: "양을 둘러싼 헛소동"
 LibyaTribes.12.d: "Many of the Libyan tribes still engage in pastoral agriculture, herding their goats, sheep and cattle from one piece of land to another. A conflict arose between two tribes recently when [tribal_offender] pastorals crossed into [tribal_defender] territory. The [tribal_defender] tribe is demanding that the [tribal_offender] tribe pays compensation for damages, which apparently mostly includes all the grass that was eaten."
 LibyaTribes.12.a: "고작 풀이라고?"
 LibyaTribes.12.b: "부족의 영역은 신성하니 존중되어야 한다"
 LibyaTribes.13.t: "부족의 습격"
 LibyaTribes.13.d: "어젯밤 [tribal_offender] 부족 일원들이 [tribal_defender] 부족의 농장이 자신들의 땅 위에 세워졌다고 주장하며 농장을 습격했습니다. 이들은 밤사이 농장에 불을 질렀고, 이른 아침에 다시 돌아와 주민들을 몰아냈습니다. [tribal_defender] 부족의 장로들은 정부가 개입하여 [tribal_offender] 부족 습격자들을 처벌해 줄 것을 간청하고 있습니다."
 LibyaTribes.13.a: "그곳은 분명 [tribal_offender] 부족의 땅이었다"
 LibyaTribes.13.b: "습격이라니? 우리는 문명 사회에 살고 있다"
 LibyaTribes.14.t: "물 분쟁"
 LibyaTribes.14.d: "The Great Man Made River provides free water to many Libyans. However, a [tribal_defender] tribe claims that members of a [tribal_offender] tribe are blocking [tribal_defender]s from accessing one of the water sources in of our bigger cities."
 LibyaTribes.14.a: "[tribal_defender]s have right to access that water"
 LibyaTribes.14.b: "[tribal_defender] 부족은 자기 땅에서 물을 마셔야 한다"
 LibyaTribes.15.t: "대표성 없는 정치인"
 LibyaTribes.15.d: "A bit of a scandal has happened in the local government of one of our small towns. A [tribal_offender] politican has been elected to lead the town, despite the town being majority [tribal_defender]. This has caused the people in the town to accuse the government of rigging the election to further [tribal_offender] agenda and are demanding that a [tribal_defender] politican be elected instead. We don't remember rigging any elections recently, but maybe it was the local branch?"
 LibyaTribes.15.a: "선거는 공정했다"
 LibyaTribes.15.b: "주민들의 요구를 받아들인다"
 LibyaTribes.16.t: "석유 수익 분배"
 LibyaTribes.16.d: "두 부족이 정부의 석유 수익 분배 방식을 두고 다투고 있습니다. [tribal_offender] 부족 일원들은 정부가 [tribal_defender] 부족의 삶을 개선하는 데 지나치게 많은 돈을 쓰고 있다고 주장합니다. 마찬가지로 [tribal_defender] 부족 일원들은 정반대의 주장을 하고 있습니다."
 LibyaTribes.16.a: "[tribal_offender] 부족에게 더 많은 돈을 준다"
 LibyaTribes.16.b: "[tribal_defender] 부족은 추가 자금을 받을 자격이 있다"
 LibyaFamily.1.t: "가족의 희생"
 LibyaFamily.1.d: "While military engineers were clearing up the damage from the recent British airstrike, they discovered something shocking. A badly burnt and mutilated body of one of Muammar Gaddafi's children was found among the rubble. It seems they had been inspecting the site without no one knowing, and they got caught in the attack."
 LibyaFamily.1.a: "어떻게 이런 일이!?"
 LibyaFamily.2.t: "인터넷 차단"
 LibyaFamily.2.d: "지난 주말, 한 인터넷 블로그가 카다피 정권, 특히 무함마드 무아마르 카다피를 비판했습니다. 이에 대응하여 무함마드 카다피는 GPTC의 수장으로서 리비아 전역의 인터넷을 거의 일주일 동안 차단했습니다. 그는 정권을 보호하려는 의도였지만, 그의 행동은 많은 리비아 국민들을 불쾌하게 만들었습니다. 아마도 이렇게 쉽게 화를 내는 사람이 GPTC의 수장이 되어서는 안 될까요?"
 LibyaFamily.2.a: "인터넷 따위는 필요 없다"
 LibyaFamily.2.b: "더 유능한 후임이 필요할지도 모른다"
 LibyaFamily.3.t: "콜라를 둘러싼 다툼"
 LibyaFamily.3.d: "한 고문이 충격적인 소식을 전했습니다; 콜라와 관련된 긴장이 고조되고 있다는 것입니다. 여러분이 생각하는 종류의 콜라가 아닙니다. 최근 코카콜라는 리비아에 병입 공장을 개설했습니다. 무함마드와 무타심 카다피는 모두 자신의 사업 관계를 통해 이 공장의 소유권을 주장하고 있으며, 이 갈등은 이제 통제 불능 상태로 커졌습니다. 무함마드와 무타심은 모두 개인 경호원들과 함께 공장에 있으며, 무장하고 있습니다. 양측이 진정될 기미는 보이지 않습니다."
 LibyaFamily.3.a: "무함마드의 편을 든다"
 LibyaFamily.3.b: "무타심의 편을 든다"
 LibyaFamily.3.c: "펩시도 괜찮지 않나?"
 LibyaFamily.4.t: "아버지를 비판하는 무함마드 카다피"
 LibyaFamily.4.d: "무함마르 무아마르 카다피는 현재 오랜 시간 동안 망명 생활을 하고 있습니다. 망명이 그에게 부담이 되고 있는 듯 보이며, 최근 인터뷰에서 아버지에 대해 실망감을 드러냈습니다. 그는 아버지가 자신을 대했던 방식처럼 리비아 국민들을 무시하고 불합리한 요구를 한다고 언급했습니다. 현재 무함마드는 리비아 내에서 거의 영향력이 없지만, 일부 리비아 사람들은 여전히 그에게 동정을 표하고 있습니다."
 LibyaFamily.4.a: "정치에는 관심이 없다고 생각했는데?!"
 LibyaFamily.5.t: "정치에 대한 열정을 되찾은 무함마드"
 LibyaFamily.5.d: "아버지와 짧은 대화를 나눈 끝에 무함마드는 가문 내 자신의 위치를 이해하게 된 것으로 보입니다. 처음에는 가문의 유산을 잇는 것을 꺼렸으나, 언젠가 자신이 리비아의 지도자가 될 것임을 받아들이게 되었습니다. 카다피의 후계 구도가 한결 안정되었습니다."
 LibyaFamily.5.a: "좋은 대화였다, 아들아"
 LibyaFamily.6.t: "아버지를 무시하는 무함마드"
 LibyaFamily.6.d: "It seems that Muhammad is not willing to listen to his father. He does not want to follow in his father's footsteps in ruling the country, nor does he want to be like his father. After much shouting and many slammed doors, there seem to be no getting through to Muhammad. It seems for now Muammar has to be satisfied with the fact that his son is interested in at least some aspects of running the country, even if not as its leader."
 LibyaFamily.6.a: "어떻게 하면 그를 설득할 수 있을까?"
 LibyaFamily.7.t: "리비아를 떠나는 무함마드"
 LibyaFamily.7.d: "After a heated argument about his responsibilites in ruling the country one day, Muhammad seems to have had enough of his father. Saying that he no longer feels like Libya is his home, he has decided to leave the country, at least for a little while. Hopping onto his private jet, he set course to Algeria with nobody knowing when he would be willing to return."
 LibyaFamily.7.a: "곧 집으로 돌아오너라"
 LibyaFamily.8.t: "경이로운 미술 전시회"
 LibyaFamily.8.d: "사이프의 미술 전시회가 성공을 거두었습니다. 캐나다 몬트리올 미술관에서 열린 이 전시회는 여러 다국적 기업과 캐나다 시민들의 관심을 끌었습니다. 아울러 사이프는 전시회에 참석하는 동안 지멘스, 페트로캐나다, SNC-라발린 등 여러 기업의 대표들과 다수의 사업 회담을 마련할 수 있었습니다. 이들은 리비아 내 여러 투자 기회에 대해 논의할 수 있었습니다. 사이프 개인에게도 성공이지만, 리비아 전체에는 더 큰 성공이 될 수도 있습니다. 우리는 이 대기업 가운데 한 곳과 협력을 심화할 기회를 얻었습니다."
 LibyaFamily.8.a: "지멘스는 전자 분야로 유명하다!"
 LibyaFamily.8.b: "산유국으로서 페트로캐나다가 자연스러운 파트너다"
 LibyaFamily.8.c: "리비아를 발전시키려면 SNC-라발린 같은 건설 회사가 최고다"
 LibyaFamily.9.t: "괜찮은 미술 전시회"
 LibyaFamily.9.d: "사이프의 미술 전시회는 몬트리올 미술관에서 열렸습니다. 전시회는 어느 정도 관심을 끄는 데는 성공했지만, 우리가 목표로 한 만큼의 주목을 받지는 못했습니다. 여론의 반발로 많은 기업이 후원에서 손을 뗐습니다. 그래도 전시회는 국제 사회의 관심을 모으는 데는 성공했습니다. 적어도 세계의 이목을 리비아 문화, 나아가 리비아 전반으로 돌리는 데는 성공한 셈입니다."
 LibyaFamily.9.a: "우리도 예술을 할 수 있다"
 LibyaFamily.10.t: "예술적 참사"
 LibyaFamily.10.d: "The artshow held in Montreal's Museum of Fine Arts has been a total disaster. Many of the corporations pulled out of the sponsorhip after public backlash, and critics have described Saif's artwork as 'lurid' and 'a triumph of banality'. Eventually, the exhibition was torn down early as the Museum faced criticism of supporting the works of an artist who was so closely tied with the political regime of Libya. This has been a total humiliation for us."
 LibyaFamily.10.a: "선정적이라고? 예술이 주관적이라는 것도 모르나?"
 LibyaFamily.11.t: "후계자 자리를 수락한 사이프"
 LibyaFamily.11.d: "사이프는 처음에는 형의 장자 상속권을 가로채는 것을 주저했으나, 결국 공식적으로 후계자가 되라는 아버지의 제안을 받아들였습니다. 이 역할에 대한 준비로 사이프는 정권 내에서 더 큰 권력을 부여받았습니다."
 LibyaFamily.11.a: "네가 자랑스럽다, 아들아"
 LibyaFamily.12.t: "후계자 자리를 거부한 사이프"
 LibyaFamily.12.d: "아버지와 오랜 대화를 나눴음에도 사이프는 아버지의 후계자 자리를 일체 거부했습니다. 그는 만약 후계가 이루어진다면 그것은 형 무함마드의 장자 상속권이라고 말했습니다."
 LibyaFamily.12.a: "나중에 다시 이야기해 볼 수 있을 것이다"
 LibyaFamily.13.t: "아버지의 측근 집단에서 물러난 사이프"
 LibyaFamily.13.d: "Saif didn't take his father suggestions of him being his father's successor very well. Accusing his father of nepotism, Saif said that Libya 'was not a farm to inherit'. He said he had only taken a larger role in the country's administration due to the absence of institutions, not for personaly glory. He now said that he is no longer interested in helping his father run the country."
 LibyaFamily.13.a: "너는 선택받은 아이였어야 했다!"
 LibyaFamily.14.t: "소송에서 패소한 선데이 텔레그래프"
 LibyaFamily.14.d: "런던 법정에서 이틀간 명예훼손 소송이 진행된 끝에 영국 판사들은 선데이 텔레그래프에 명예훼손 유죄 판결을 내렸습니다. 해당 신문이 게재한 기사는 정보의 출처를 전혀 제시하지 않았고, 작성자 또한 법정에서 주장을 뒷받침할 증거를 내놓지 못했습니다. 법원은 해당 기사들이 사이프 알이슬람 카다피의 명예를 훼손하려는 의도였음이 분명하다고 판결했습니다. 신문사는 사이프 알이슬람의 명성에 입힌 손해를 배상하라는 선고를 받았으며, 사이프 알이슬람에게 사과하는 추가 기사를 게재하라는 명령도 받았습니다. 사이프 알이슬람은 법원 밖에서 승리의 브이 사인을 하는 모습이 포착되었습니다. 그는 떠나면서 기자들에게 가장 먼저 아버지에게 전화할 것이며, 아버지도 분명 이 결과에 기뻐할 것이라고 말했습니다."
 LibyaFamily.14.a: "정의다!"
 LibyaFamily.15.t: "합의를 받아들인 선데이 텔레그래프"
 LibyaFamily.15.d: "런던 법정에서 이틀간 명예훼손 소송이 진행된 끝에 선데이 텔레그래프와 사이프 알이슬람 카다피는 분쟁을 합의로 마무리하기로 했습니다. 사우디 외교관의 중재 지원을 받아 선데이 텔레그래프는 사이프 알이슬람의 소송 비용 일부를 부담하고 공개 사과문을 게재하기로 했으며, 사이프 알이슬람의 명성에 입힌 손해에 대한 배상은 하지 않아도 되었습니다. 사이프 알이슬람은 법원 밖에서 승리의 브이 사인을 하는 모습이 포착되었습니다. 그는 떠나면서 기자들에게 가장 먼저 아버지에게 전화할 것이며, 아버지도 분명 이 결과에 기뻐할 것이라고 말했습니다."
 LibyaFamily.15.a: "공정한 타협이다"
 LibyaFamily.16.t: "소송에서 승소한 선데이 텔레그래프"
 LibyaFamily.16.d: "런던 법정에서 이틀간 명예훼손 소송이 진행된 끝에 영국 판사들은 선데이 텔레그래프에 무죄를 선고했습니다. 신문은 기사 자체에서는 주장의 증거를 제시하지 않았으나, 법원의 요청이 있자 작성자가 별도로 증거를 제출했습니다. 이 증거만으로는 사이프 알이슬람과 자금 세탁 사이의 확고한 연관성을 입증하기에 충분하지 않지만, 기사 작성을 정당화하기에 충분한 연결 고리는 존재합니다. 이 결과는 사이프 알이슬람의 평판에 큰 타격이 되었으며, 그는 재판이 끝난 바로 그날 저녁 서둘러 출국했습니다."
 LibyaFamily.16.a: "말도 안 된다. 그들은 유죄다!"
 LibyaFamily.17.t: "상을 받은 사이프 알이슬람 카다피"
 LibyaFamily.17.d: "세계경제포럼(WEF)이 사이프 알이슬람 카다피에게 '영 글로벌 리더' 상을 수여했습니다. 이 상은 전략적이고 영감을 주는 지도자로서 자국 사회와 전 세계에 지속적인 긍정적 변화를 만들겠다는 깊은 헌신을 가진 이들을 위한 것입니다. 이 상은 정부 내 사이프 알이슬람의 입지를 확실히 강화할 것입니다."
 LibyaFamily.17.a: "아주 좋다!"
 LibyaFamily.18.t: "박사 학위를 받은 사이프 알이슬람 카다피"
 LibyaFamily.18.d: "Gaddafi's sone Saif al-Islam has been awarded a PhD from the London School of Economics. His thesis 'The role of civil society in the democratisation of global governance institutions: from soft power to collective decision making?' was examined by multiple well respected academics. However, the thesis has collected accusation of plagiarism, as well as allegations that the thesis was ghost-written by consultants from Monitor Group, a consulting firm which has earned more than $3 million in consulting fees from Saif's father."
 LibyaFamily.18.a: "표절이 아니다!"
 LibyaFamily.19.t: "개혁을 촉구하는 사이프 알이슬람"
 LibyaFamily.19.d: "Saif al-Islam has always been the most prodigous of Gaddafi's sons. Being educated in Europe with connections to multiple politicians, he is well versed in politics and diplomacy. However, he has always been an avid reformer. It seems he has now taken his steps of reform a bit further; in a recent interview, when asked what Libya needed most, he stated 'Democracy'. When asked to clarify if he meant that Libya needed more democracy, he was recorded saying 'No. 'More democracy' would imply that we had some'. He has also criticised Libya's human rights record, and has called for more reform in context of the current Jamahiriya system."
 LibyaFamily.19.a: "민주주의? 인권? 제정신인가?"
 LibyaFamily.20.t: "사이프 알이슬람의 자선 활동"
 LibyaFamily.20.d: "In 1998, Saif al-Islam founded a non-governmental organization called the Gaddafi International Charity and Development Foundation (GICDF). The organization is known for dealing with hostage situation with Islamic militants as well as doing charity work in Sub-Saharan Africa. A recent charity drive has greatly increased our standing with one of our African brothers."
 LibyaFamily.20.a: "좋아"
 LibyaFamily.21.t: "사냥 사고"
 LibyaFamily.21.d: "Saif al-Islam is a frequent visitor of the United Kingdom, including the royal family there. In a recent hunting trip on the estates of Princess Anne, Saif fell off his horse and accidentally discharged his weapon into his abdomen. He was hurried to the nearest hospital but died later of his wounds. The British government has already expressed their deepest condolences to Muammar Gaddafi and the Libyan nation, and have started to make preparations to get Saif's body back to Libya. This is a terrible blow to the Gaddafi family, as Saif al-Islam was on of the more prodigious children of Gaddafi."
 LibyaFamily.21.a: "내 아들에게 무슨 짓을 한 것이냐!"
 LibyaFamily.22.t: "알 사디가 영입되다"
 LibyaFamily.22.d: "카다피 가족의 대규모 재정 기여로 인해 이탈리아 세리에 A 팀인 페루자는 알-사디를 팀에 받아들였습니다. 이 계약은 페루자가 예상했던 것보다 훨씬 더 나은 결과를 낳았습니다. 디에고 마라도나를 기술 자문으로, 벤 존슨을 개인 트레이너로 두고 알-사디는 다음 경기를 위해 잘 준비되었습니다. 첫 경기에선 20분만 뛰었지만, 알-사디는 모두에게 긍정적인 놀라움을 안겨주었습니다. 페루지아의 감독은 [ROOT.GetLeader]에게 알-사디가 팀에 합류한 것에 매우 기쁘다고 전했습니다. 알-사디는 진정한 축구선수가 될 길에 있는 것 같습니다."
 LibyaFamily.22.a: "그에게 그럴 능력이 있다는 걸 알고 있었다!"
 LibyaFamily.23.t: "알 사디는 영입이 안되다"
 LibyaFamily.23.d: "알-사디를 영입하려는 팀을 찾지 못했습니다. 우리는 몰타 챔피언스 리그 수준의 팀인 비르키르카라 F.C.와 협상 중이었지만, 알-사디가 약물 테스트에서 난드롤론 양성 반응을 보이자 협상에서 철회했습니다. 알-사디의 축구 실력도 누구에게도 인상을 주지 못했고, 이탈리아 신문인 *라 레푸블리카*는 \"현재 속도의 두 배로 뛰어도 여전히 느림의 두 배일 것\"이라고 평가했습니다. 알-사디는 아마 당분간 리비아에서 계속 뛰어야 할 것 같습니다."
 LibyaFamily.23.a: "다음 시즌이 있지 않은가..."
 LibyaFamily.24.t: "알 사디가 흥분하다"
 LibyaFamily.24.d: "우리는 알-사디가 뛰기 위한 적합한 유럽 팀을 찾았지만, 모든 일이 계획대로 진행되지는 않았습니다. 유럽에 진출한 후, 알-사디는 약물 중독이 더욱 심해졌습니다. 그는 거의 경기를 뛰지 않으며, 파티와 약물로 시간을 낭비하며 자신이 거대한 축구 스타라고 생각하고 있습니다. 지금은 아마도 희망이 없는 상태인 것 같습니다."
 LibyaFamily.24.a: "축구는 그렇게 하는 게 아니다"
 LibyaFamily.25.t: "축구 폭동"
 LibyaFamily.25.d: "리비아 축구계에서는 알-사디 카다피가 고정된 경기에 출전한다는 것이 잘 알려져 있습니다. 최근 알-사디가 소속된 클럽 알 아흘리와의 경기에서, 상대 팀 팬들이 그와 그의 팀을 향해 야유를 보내며 알 아흘리의 색깔로 옷을 입힌 당나귀를 경기장에 들여와 알-사디의 경기 조작에 대한 항의를 표했습니다. 알-사디는 이를 불쾌하게 생각했고, \"너희 클럽을 망칠 것이다! 그것을 올빼미 둥지로 만들겠다!\"고 소리쳤습니다. 심판이 개입해 상황을 진정시키려 했지만, 알 아흘리의 감독이 심판을 밀어냈습니다. 이에 폭력적인 팬들이 경기를 침범하며 상황은 급속히 악화되었고, 결국 이는 대규모 폭동으로 번져 보안군이 강경하게 진압하게 되었습니다. 그로 인해 시즌은 추가적인 폭동 우려로 취소되었습니다."
 LibyaFamily.25.a: "그 허영심 많은 멍청이!"
 LibyaFamily.26.t: "과다복용 중인 알사디"
 LibyaFamily.26.d: "무아마르 카다피의 아들 알-사디가 어제 이탈리아 밀라노의 한 호텔 객실에서 사망한 채 발견되었습니다. 사인은 약물 과다 복용으로 보입니다. 약물 남용과 호화로운 생활로 알려졌던 그에게 이 소식은 전혀 놀랍지 않습니다. 카다피 가족의 '블랙쉽'으로 여겨지긴 했지만, 그는 여전히 아버지와 형제들에게 매우 소중한 존재였습니다."
 LibyaFamily.26.a: "재활원에 보냈어야 했는데"
 LibyaFamily.27.t: "알 사디가 중독을 끊다"
 LibyaFamily.27.d: "알-사디에게는 힘든 한 주였습니다. 고립된 시간을 보내는 것이 효과가 있었고, 그는 결국 약물 중독을 끊는 데 성공했습니다. 그러나 그 과정에서 꽤 강한 흡연 습관을 들이게 되었습니다. 다행히도, 담배는 코카인만큼 치명적이지 않다는 점에서 조금은 덜 위험합니다. 알-사디는 아버지에게 과거의 행동에 대해 사과했으며, 리비아와 가족을 위해 앞으로 더 나은 삶을 살겠다고 약속했습니다."
 LibyaFamily.27.a: "포기하는 사람이 마음에 드는 건 이번이 처음이다"
 LibyaFamily.28.t: "알 사디는 다시 중독되다"
 LibyaFamily.28.d: "재활 첫 주는 잘 진행되었고, 알-사디는 약물 중독에서 벗어나는 데 성공했습니다. 그러나 두 번째 주에 그는 심하게 재발했고, 결국 재활 센터를 완전히 떠났습니다. 센터 직원들은 그를 막으려 했지만, 알-사디는 개인 경호원을 불러 그를 데려가라고 했고, 만약 떠나지 않으면 센터 사람들을 모두 죽이겠다고 위협했습니다. 그의 약물 중독은 매우 깊이 박혀 있는 것 같습니다."
 LibyaFamily.28.a: "이것도 일종의 진전인가?"
 LibyaFamily.29.t: "리비아가 알사디를 석방하다"
 LibyaFamily.29.d: "재활 첫 주는 순조롭게 진행되었고, 알-사디는 약물 중독에서 벗어나는 데 성공했습니다. 그러나 두 번째 주에 그는 심하게 재발하였고, 결국 센터를 완전히 떠나려고 시도했습니다. 센터 직원들이 이를 막으려 했지만, 알-사디는 자신의 개인 경호원들을 직원들에게 풀었습니다. 이후 상황은 현지 경찰이 출동하면서 급격히 악화되었습니다. 알-사디는 약물에 의한 공황 상태에서 당황하며, 경호원들과 함께 트리폴리 공항으로 도망쳤고, 개인 전세기를 타고 스위스에 도피했습니다. 그 이후로 그는 우리와 연락을 끊었으며, 그가 다시 돌아올지 여부는 알 수 없습니다."
 LibyaFamily.29.a: "이거 순식간에 커졌군"
 LibyaFamily.30.t: "알 사디가 자신 가문에 치욕을 주다"
 LibyaFamily.30.d: "알-사디는 현재 스위스에서 망명 생활을 하며 연예인들과 친구들을 위한 호화로운 파티를 열고 있습니다. 최근 열린 파티는 계획대로 진행되지 않았고, 알-사디는 해변에서 다른 남자와 함께 누워 있는 채로 의식 없이 발견되었습니다. 두 사람 모두 나체 상태였고, 이 사건은 빠르게 타블로이드 신문에 퍼지며 알-사디의 노출된 몸이 유럽 전역의 잡지 표지에 실리게 되었습니다. 이 사건은 분명 카다피 가문의 명성에 큰 타격을 주었습니다."
 LibyaFamily.30.a: "해변에서?"
 LibyaFamily.31.t: "무타심 카다피는 자신의 경계를 넘었다"
 LibyaFamily.31.d: "무타심 카다피는 여전히 자신의 군사적 과거에 대한 갈망을 떨치지 못하는 것으로 보입니다. 최근 밝혀진 바에 따르면, 무타심은 국가안보고문으로서 리비아 국영석유공사에 12억 달러를 요청하여 자신의 특수부대 여단을 만들고자 했다고 합니다. 이 요청은 정부에 의해 신속하게 거부되었지만, 무타심의 정치적 직위를 악용한 사실은 간과되지 않았습니다."
 LibyaFamily.31.a: "그는 과거를 놓지 못하는 것인가?"
 LibyaFamily.32.t: "좋은 거래를 성사시킨 무타심"
 LibyaFamily.32.d: "무기 공급국을 물색하던 중 [SOV.GetNameDef]이(가) 확실한 해답이었습니다. 오랜 협상 끝에 무타심은 우리 군에 최첨단 장비를 대량으로 인도받는 데 성공했습니다. 이는 우리 육군의 역량을 크게 향상시킬 것입니다."
 LibyaFamily.32.a: "정말 훌륭한 사업가로다!"
 LibyaFamily.33.t: "무난한 거래를 성사시킨 무타심"
 LibyaFamily.33.d: "무기 공급국을 물색하던 중 [SOV.GetNameDef]이(가) 확실한 해답이었습니다. 오랜 협상 끝에 무타심은 우리 군에 무기를 대량으로 들여오는 데 성공했습니다. 그러나 안타깝게도 전부 냉전 시대의 구형 재고품으로, [SOV.GetAdjective] 측이 어차피 처분할 계획이던 물건들입니다. 우리의 전투력이 향상되지는 않겠지만, 적어도 이제 여분의 비축분은 생겼습니다."
 LibyaFamily.33.a: "없는 것보다는 낫겠지"
 LibyaFamily.34.t: "무산된 무타심의 거래"
 LibyaFamily.34.d: "When searching for a weapons supplier, [SOV.GetNameDef] was the clear answer. After long negotiations, nothing of notable was gained. The [SOV.GetAdjective]s weren't willing to hand out large amount of weapons to us. The visit to [SOV.GetName] has been a waste of time, and Mutassim's role as a National Security Advisor has now been tarnished."
 LibyaFamily.34.a: "언젠가 다시 시도해 보는 것이 좋겠다"
 LibyaFamily.35.t: "무타심 카다피, 이집트 영향력 확대"
 LibyaFamily.35.d: "비록 무타심 가다피가 이집트에서 망명 생활을 하고 있지만, 그는 여전히 리비아 정권, 특히 인민총회 위원회(General People's Committee) 멤버들과의 연결고리를 가지고 있습니다. 최근 그는 리비아의 많은 친구들과 연락을 취했으며, 이집트 대통령 [EGY.GetLeader]에 대해 높이 평가하는 말을 했습니다."
 LibyaFamily.35.a: "쿠데타를 계획하고 있는 것인가?"
 LibyaFamily.36.t: "리비아를 영원히 떠난 무함마드 카다피"
 LibyaFamily.36.d: "아버지와 또 한 번 언쟁을 벌인 끝에 무함마드 카다피는 리비아를 영원히 떠나겠다고 밝혔습니다. 그는 더 이상 집에서 환영받는다고 느끼지 못하며 정치 밖에서 삶을 살고 싶을 뿐이라고 말했습니다. 그는 이미 알제리행 여정을 준비했으나, 그곳을 새 보금자리로 삼을지는 밝히지 않았습니다. 카다피의 장남은 이제 판에서 물러난 것으로 보입니다."
 LibyaFamily.36.a: "제발 가지 말아다오"
 LBA_muhammad_muammar_gaddafi_leaves_for_good_tt: "§Y무함마드 카다피§!가 영구 추방됩니다"
 LibyaFamily.37.t: "무타심 카다피가 살해되다"
 LibyaFamily.37.d: "무타심 가다피가 암스테르담의 한 호텔 방에서 살해된 채 발견되었습니다. 이 사건의 주요 용의자는 리비아의 무기 밀매상 타레크 카이투니입니다. 암스테르담을 '비즈니스 여행'이라며 자주 방문했던 무타심은 실제로 네덜란드 모델이자 카이투니의 아내인 리사 반 고잉가와 불륜을 저질렀던 것으로 보입니다. 네덜란드 경찰은 아직 타레크 카이투니를 체포하지 못했으며, 그의 현재 위치는 알려지지 않았습니다."
 LibyaFamily.37.a: "뭐라고?!"
 LibyaFamily.38.t: "하니발 카다피가 체포되다"
 LibyaFamily.38.d: "하니발 가다피와 그의 아내는 스위스에서 체포되었습니다. 두 명의 하인들이 경찰에 전화를 걸어, 이 부부가 제네바의 호텔에서 그들을 공격했다고 주장했습니다. 가다피의 경호원 두 명도 경찰이 가다피 부부의 호텔 방에 들어가는 것을 막으려다 체포되었습니다. 하니발은 유럽에서 경찰과의 여러 가지 사건을 겪은 이력이 있습니다. 몇 년 전에는 프랑스 법원이 그의 여자친구를 폭행한 이유로 벌금을 부과했으며, 1년 전에는 프랑스 경찰이 그가 과속하는 것을 막으려다 그의 경호원 두 명이 체포된 사건이 있었습니다. 하니발은 124,000유로의 보석금으로 석방되었고, 그의 아내는 186,000유로의 보석금으로 석방되었습니다. 이 사건은 스위스와 리비아 사이의 외교적 논란을 일으켰습니다."
 LibyaFamily.38.a: "스위스는 진짜 나라도 아니다!"
 LibyaFamily.39.t: "하니발 카다비가 익사되다"
 LibyaFamily.39.d: "하니발 가다피는 그의 교육과 직업 덕분에 자주 리비아의 국영 무역 회사인 GMNTC(General National Maritime Transport Company)의 다양한 해양 선박에 탑승해 작업을 했습니다. 오늘, 폭풍우 속에서 하니발이 선박에서 떨어지는 사고가 발생했습니다. 선박의 승무원들은 그를 구하기 위해 최선을 다했지만, 그를 다시 선박으로 끌어올리지는 못했습니다. 결국 하니발은 파도 속으로 사라졌고, 다시는 모습을 볼 수 없게 되었습니다."
 LibyaFamily.39.a: "더 열심히 했어야 했다!"
 LibyaFamily.40.t: "UN 친선대사로 임명된 아이샤 카다피"
 LibyaFamily.40.d: "At a a ceremony at Watassemo Charity Association headquarters in Tripoli, Aisha Gaddafi, was appointed as United Nations Development Program National Goodwill Ambassador for Libya due to her past charity work. In her new role as UN Goodwill Ambassador, she will work together with the UNDP to raise awareness on issues related to Millennium Development Goals, advocate for women's rights, work on combating the spread of HIV/AIDs and promote UNDP's work in Libya. This is a tremendous occasion as as we repair our relations with the world."
 LibyaFamily.40.a: "그녀에게 잘된 일이다!"
 LibyaFamily.41.t: "숨겨진 힘을 발견한 아이샤 카다피"
 LibyaFamily.41.d: "We are not quite sure what happened with Ayesha's military training, but it has been miraculous. She just startted commanding troops and in our latest war games she even beat our top military generals. Some of our soldiers have started calling her the 'Amazon of Libya', named after the ancient warriors on Muammar Gaddafi's all-female personal bodyguard. Her military prowess has encouraged many more women to flock to recruiting centers in the hopes of becoming like her."
 LibyaFamily.41.a: "걸 파워!"
 LibyaFamily.42.t: "장군으로 진급한 아이샤 카다피"
 LibyaFamily.42.d: "아이샤는 장군이 되기 위한 훈련을 마쳤습니다. 훈련에서 특별한 재능을 보이지는 않았지만, 훗날 활용할 수 있을 만한 독창적인 아이디어를 몇 가지 내놓았습니다. 그녀는 군에서 적극적인 역할을 맡지 않고 장군 계급을 명예직으로 유지하겠다고 밝혔습니다."
 LibyaFamily.42.a: "그래도 성과는 성과다"
 LibyaFamily.43.t: "군사 훈련에서 실수를 연발하는 아이샤 카다피"
 LibyaFamily.43.d: "Ayesha's military training hasn't gone exactly to plan. First she managed to get an entire brigade lost, then in a wargame she had them attacking in the wrong direction. Her stubborn personality has also caused several clashes with many senior military officials, even causing one of them to resign from the military. She eventually did make it to the rank of general. However, she won't be actively serving in the military. Despite this, the total failure of her training has caused our entire military education and army become subject to ridicule and suspicion."
 LibyaFamily.43.a: "어떻게 그렇게까지 실패할 수 있단 말인가?"
 LibyaFamily.44.t: "여성의 권리를 옹호하는 아이샤 카다피"
 LibyaFamily.44.d: "In a recent interview, Ayesha Gaddafi publically criticised the status of women in Libya. She stated that they are oppressed in the country and not given the same opportunities as men. She especially called out [ROOT.GetLeader], pointing out to their all-female group of bodyguards. While on the surface this seems like it empowers women, in reality it simply objectifies women as the bodyguards are usually chosen by their looks and not by their military skill. This interview has caused quite a stir in Libya, and there have already been several demonstrations for women's rights."
 LibyaFamily.44.a: "리비아의 여성은 남성과 똑같이 잘 지내고 있다!"
 LibyaFamily.45.t: "출산 중 사망한 아이샤 카다피"
 LibyaFamily.45.d: "There are tragic news about the only daughter of Muammar Gaddafi. Last night, after her fourth child had been born, Ayesha died of postpartum bleeding. The doctors tried their best to stop the bleeding but nothing could be done. Luckily, the child was born healthy but this is still a tragic loss for the Gaddafi family."
 LibyaFamily.45.a: "의사들이 더 잘했어야 했다!"
 LibyaFamily.46.t: "사이프 알-아랍 카다피는 산성 공격에 연루된 혐의를 받고 있습니다."
 LibyaFamily.46.d: "사이프 알 아랍은 독일을 자주 방문하는 인물입니다. 최근 뮌헨의 한 나이트클럽에서 문제가 발생했습니다. 그의 여자친구들이 춤을 추며 옷을 벗기 시작하자, 클럽의 경비원이 사이프와 그의 여자친구를 클럽에서 내쫓았습니다. 이로 인해 사이프와 경비원 사이에 난투극이 벌어졌습니다. 이후, 사이프는 경비원에 대한 보복으로 산성 공격을 계획했다는 혐의로 독일 경찰의 조사를 받게 되었습니다. 사이프는 이 주장들을 명백히 부인했습니다."
 LibyaFamily.46.a: "혐의는 당연히 취하될 것이다"
 LibyaFamily.46.b: "법률 지원을 보내라!"
 LibyaFamily.47.t: "사이프 알 아랍 카다피는 무기 밀매 혐의를 받고 있습니다."
 LibyaFamily.47.d: "독일 검찰청은 사이프 알 아랍 카다피를 무기 밀매 혐의로 기소하고 있습니다. 보도에 따르면, 사이프는 뮌헨에서 파리로 돌격 소총 한 가방, 권총, 탄약을 밀반입하는 데 도움을 준 것으로 밝혀졌습니다. 이는 매우 심각한 주장입니다."
 LibyaFamily.47.a: "혐의는 당연히 취하될 것이다"
 LibyaFamily.47.b: "독일에 외교적 압력을 가하라!"
 LibyaFamily.48.t: "사이프 알아랍의 페라리 압수"
 LibyaFamily.48.d: "독일 경찰은 사이프 알 아랍 카다피의 페라리를 압수했습니다. 인근 주민들이 차량 배기소음에 대해 불만을 제기한 결과입니다. 사이프 알 아랍은 이제 공공질서 위반 혐의로 기소될 위기에 처했습니다."
 LibyaFamily.48.a: "혐의는 당연히 취하될 것이다"
 LibyaFamily.48.b: "법률 지원을 보내라!"
 LibyaFamily.49.t: "사이프 알 아랍, 감옥에서 사망"
 LibyaFamily.49.d: "사이프 알 아랍 카다피는 독일에서 범죄로 유죄 판결을 받았지만, 리비아로 돌아가면서 형벌을 피할 수 있었습니다. 그러나 이유는 알 수 없지만 다시 독일을 방문하게 되었고, 독일 경찰은 그를 체포하여 뮌헨의 현지 교도소로 이송했습니다. 다음 날, 그는 자신의 셀에서 자살한 채 발견되었습니다. 독일 경찰의 공식 발표에 따르면 자살로 보이며, 가장 가능한 이유는 사이프가 가족에게 준 수치 때문이라고 합니다. 그러나 다른 이론들도 존재하는데, 동료 수감자들의 복수 또는 독일 정보 기관에 의한 자살 조작 가능성도 제기되고 있습니다."
 LibyaFamily.49.a: "사이프 알 아랍은 자살하지 않았다!"
 LibyaFamily.50.t: "카미스 카다피, 18세가 되다"
 LibyaFamily.50.d: "오늘은 카미스 카다피, 무아마르 카다피의 막내 아들의 생일입니다. 그는 드디어 18세가 되었고, 이제 리비아 정부에서 더 큰 역할을 맡을 준비가 되었습니다."
 LibyaFamily.50.a: "생일 축하한다!"
 khamis_gaddafi_unlock_decisions_tt: "§G새로운 §Y결정§!이 카미스 카다피를 위해 해제되었습니다!§!"
 LibyaFamily.51.t: "카미스 카다피의 헬리콥터 추락"
 LibyaFamily.51.d: "카미스 카다피는 인근 군사 기지를 방문하던 중, 탑승한 헬리콥터가 고장을 일으켰습니다. 헬리콥터는 주요 고속도로 근처에 추락하여 불꽃 속에서 폭발하며 탑승자 전원이 사망했습니다. 카미스가 될 수 있었던 유망한 군 지도자는 이제 더 이상 존재하지 않게 되었습니다."
 LibyaFamily.51.a: "안돼!"
 LibyaFamily.53.t: "UN을 모욕한 무아마르 카다피"
 LibyaFamily.53.d: "무아마르 카다피가 UN 총회 연단에 오르자 무엇을 기대해야 할지 아는 사람은 거의 없었습니다. 그가 안전보장이사회에 아프리카 의석을 요구하는 본론에 이르기까지 17분이 걸렸습니다. UN 헌장 사본을 흔들며 그는 안전보장이사회의 상임 체제를 비난했는데, 이 체제가 다른 나라들을 '2등 시민'으로 취급하도록 부추긴다고 말했습니다.\n\n'상임 의석을 가진 이들에게는 정치적 봉건제입니다... 이것은 안전보장이사회가 아니라 공포이사회라 불러야 합니다. 우리에게 안보가 아니라 공포와 제재를 안겨 주었습니다.'라고 그는 말하며 반항의 표시로 헌장의 한 페이지를 찢었습니다.\n\n'영구적인 것은 오직 신만이 가질 수 있습니다. 우리는 강대국들이 우리를 이용하고 2등 시민으로 취급하도록 거부권이라는 힘을 쥐여 줄 만큼 어리석지 않습니다... 거부권은 폐지되어야 합니다.'라고 덧붙인 뒤 그는 UN 헌장을 어깨 너머로 던졌습니다. 그는 또한 UN 본부를 리비아로 이전할 것, 존 F. 케네디와 마틴 루서 킹의 죽음에 대한 철저한 조사를 요구했으며, 이스라엘과 팔레스타인을 합쳐 '이스라틴'으로 만들 것을 제안하고, 탈레반을 찬양하고, 신종플루에 관한 음모론을 퍼뜨렸으며, 식민 통치에 대한 배상으로 아프리카에 7조 7천억 달러를 요구했습니다. 연설은 통상 15분 정도인데 그는 무려 90분이 지나서야 연설을 마쳤습니다.\n\n우리의 위대한 지도자께서 리비아가 세계의 진정한 주인임을 보여 주셨습니다!"
 LibyaFamily.53.a: "제대로 본때를 보여 주었다!"
 LibyaFamily.54.t: "연설을 끝마친 무아마르 카다피"
 LibyaFamily.54.d: "무아마르 카다피가 UN 총회 연단에 오르자 무엇을 기대해야 할지 아는 사람은 거의 없었습니다. 그는 안전보장이사회에 아프리카 몫의 의석이 있어야 한다는 이야기를 짧게 늘어놓으면서도, 동시에 식민주의, 신종플루, 이스라엘 등으로 이야기가 곁길로 샜습니다. 그는 주제에서 벗어나지 않으려 애쓰며 대사를 이어 가는 동안 땀을 비 오듯 흘리는 듯 보였습니다. 20분 뒤 연설을 중단하라는 요청을 받았고 그는 이에 따랐습니다. 마지못해 연단에서 내려온 무아마르 카다피는 이것이 '서방이 아프리카의 부상을 침묵시키려는 또 하나의 사례'라고 중얼거리는 듯했습니다. 분명 연설이긴 했으나 카다피가 바랐던 효과는 거두지 못했을 것입니다."
 LibyaFamily.54.a: "카다피는 카리스마를 더 길러야 한다"
 LibyaFamily.55.t: "연단에서 쫓겨난 무아마르 카다피"
 LibyaFamily.55.d: "As Muammar Gaddafi climbed up to the speaker's podium in the General Assembly of the UN, few knew what to expect. He startled rambling about Zionism, calling the Security Council a terrorist organisation funded by Israel. He also mocked his fellow Arab leaders, calling them toys of the British. It wasn't long until a wave of booing began at the Assembly, with delegates calling for Gaddafi to stop his speech. Gaddafi, in response, called all the delegates idiots, and even threw a bottle of water towards the Israeli delegation. Shortly after this, the security dragged him off the podium, followed by cheers from the Assembly. As he was being dragged off, he was heard yelling 'Why are you booing me? I'm right!'. This has been a total disaster for Libya's image."
 LibyaFamily.55.a: "계획대로 되지 않았다"
 LibyaFamily.56.t: "카다피의 메시지를 이해한 국민"
 LibyaFamily.56.d: "정오에 카다피는 긴 차량 행렬을 이끌고 트리폴리 순회에 나섰습니다. 그는 동네를 지나며 거리에 막대한 양의 돈을 뿌렸습니다. 동시에 확성기에서는 국제 자선단체가 돈을 낭비한다는 이야기가 흘러나왔는데, 이는 그가 거리에 돈을 던져 낭비하는 것과 같다는 의미였습니다.\n\n사람들은 떼를 지어 나와 거리에서 돈을 주웠지만, 이상하게도 상당수가 이를 거부했습니다. 구호에 의존해서는 안 된다는 카다피의 메시지를 이해한 듯합니다. 이 행사 이후 사람들이 직장에서 초과 근무를 하는 시간이 늘었고, 푸드 뱅크에서는 이용자가 줄었다고 보고하고 있습니다. 사람들에게 필요했던 것은 등 뒤에서 살짝 걷어차 주는 일뿐이었던 것 같습니다."
 LibyaFamily.56.a: "리비아인은 근면한 민족이다"
 LibyaFamily.57.t: "카다피의 요점을 놓친 국민"
 LibyaFamily.57.d: "정오에 카다피는 긴 차량 행렬을 이끌고 트리폴리 순회에 나섰습니다. 그는 동네를 지나며 거리에 막대한 양의 돈을 뿌렸습니다. 동시에 확성기에서는 국제 자선단체가 돈을 낭비한다는 이야기가 흘러나왔는데, 이는 그가 거리에 돈을 던져 낭비하는 것과 같다는 의미였습니다.\n\n사람들은 떼를 지어 나와 거리에서 돈을 줍고 그것을 쌓아 두기 시작했습니다. 거리가 깨끗이 치워지자마자 사람들은 일상으로 돌아갔습니다. 확성기의 메시지는 귀 기울여지지 않았고, 사람들은 그저 손쉽게 돈을 벌고 싶어 했을 뿐입니다. 적어도 국민들은 정권에 조금 더 만족하게 될 것입니다."
 LibyaFamily.57.a: "이것이 좋은 일이라고 해야 하나?"
 LibyaFamily.58.t: "카다피의 메시지를 오해한 국민"
 LibyaFamily.58.d: "At noon, Gaddafi embarked on a tour of Tripoli in a long motorcade of vehicles. As he was going through neighbourhoods, he threw large quantities of money on to the streets. At the same time, loudspeakers were talking about how international charities waste money, just like he wastes money by throwing it on the street.\n\nPeople came out in droves to collect money off the streets, and started hoarding the money. As soon as one part of the street was cleaned out, people continued following the motorcade in the hopes of more money. Ultimately thousands of people were walking behind the line of vehicles, collecting every coin they could find. Even more surprisingly, people came out even the following day, waiting for the non-existing motorcade to arrive again. A similar trend was noticed in some other Libyan cities as well. People know seem to expect that the government just hands them out money, and they have become considerably less motivated to work."
 LibyaFamily.58.a: "이것이 우화라는 걸 이해하지 못했나? 아니면 은유였던가?"
 LibyaFamily.59.t: "훌륭하게 설계된 자동차"
 LibyaFamily.59.d: "After Muammar Gaddafi shared his ideas with Libyan engineers and consultants from European car manufacturers, the listeners congratulated the leader on his keen design sense. They were sure that Gaddafi's ideas could be implemented in practice successfuly. However, not all of the ideas could be used in a single vehicles. What should be the main focus? Should we make a car that is sturdy and safe, a car that is made cheaply and meant for mass production for the people or a truck that can be used for military applications when needed. And of course, we need to pick a suitable name for the vehicle."
 LibyaFamily.59.a: "바위처럼 튼튼한 자동차! 로켓!"
 LibyaFamily.59.b: "이 차로 한몫 단단히 챙기자! 버킷!"
 LibyaFamily.59.c: "한 방 제대로 먹이는 자동차! 패킷!"
 LibyaFamily.60.t: "흥행에 실패한 자동차"
 LibyaFamily.60.d: "After Muammar Gaddafi shared his ideas with Libyan engineers and consultants from European car manufacturers, the listeners were very skeptical of his idea. However, the production of the car went forward anyway. Shortly after at a car show in Libya, the Saroukh el-Jamahiriya (Libyan Rocket) was unveiled. Packed with a bunch of safety features, Gaddafi has dubbed the car the safest in the world. However, all of the safety features on the car are standard elements of any modern car. What is non-standard however, is the car's shape; both the front and rear bumpers are shaped like a wedge. The idea is that on collision, the car will simply be deflected away from anything it hits. While turning a car into a pinball might not be safest road element, this might have some military uses."
 LibyaFamily.60.a: "대체 저게 뭐란 말인가!?"
 LibyaFamily.61.t: "대참사가 된 자동차"
 LibyaFamily.61.d: "After Muammar Gaddafi shared his ideas with Libyan engineers and consultants from European car manufacturers, the listeners were very skeptical of his idea. However, the production of the car went forward anyway. Shortly after at a car show in Libya, the Saroukh el-Jamahiriya (Libyan Rocket) was unveiled. Dubbed by Gaddafi as the safest car in the world, the show continued with a live presentation of the car's unique wedge shape which would simply deflect anything the car collides with. As the car sped of on the test track, it ricocheted off the impact straight into the watching audience. As the car hit the safety barrier, it exploded in a ball of fire. Several people died due to the collision, and dozens were injured. Immediately after, there was a sudden drop in all new car sales the following week. People are refusing to buy new cars as they fear for their safety. If the safest new car is this unsafe, how bad are the others? People are even importing older cars from Cental Africa to get their hands on something old and reliable. This increase in old cars on the roads has actually worsened Libya's traffic accidents and fatalities."
 LibyaFamily.61.a: "왜 차를 뾰족하게 만들었단 말인가!?"
 LibyaFamily.62.t: "성공적인 국빈 방문"
 LibyaFamily.62.d: "When Muammar Gaddafi landed in [?libya_state_visit_target.GetNameDef], he brought along with with him his massive Bedouin tent, which he setup in a park in the country's capital. With him were his bodyguard, an entourage of ministers, luxury cars and a small herd of camels so he could drink their milk every morning. While originally, it was planned for Gaddafi to meet [?libya_state_visit_target.GetName]'s leader in a more official setting, eventually [?ibya_state_visit_target.GetLeader] caved in to Gaddafi's demands to have the meeting in his tent. While various business and Libya's future was discussed, nothing fruitful was achieved. However, this humiliation of a foreign head of state has increased Gaddafi's standing in the world and at home."
 LibyaFamily.62.a: "마침내 카다피가 마땅한 존경을 받는다"
 LibyaFamily.63.t: "평범한 국빈 방문"
 LibyaFamily.63.d: "When Muammar Gaddafi landed in [?libya_state_visit_target.GetNameDef], he brought along with with him his massive Bedouin tent, which he setup in a park in the country's capital. With him were his bodyguard, an entourage of ministers, luxury cars and a small herd of camels so he could drink their milk every morning. While Gaddafi wanted to have all meetings inside his tent, his host [?libya_state_visit_target.GetLeader] wasn't as eager to do so. Eventually Gaddafi caved in an had all the meetings in a nearby luxury hotel. While various business and Libya's future was discussed, nothing fruitful was achieved. However, this show of luxury has given Gaddafi a small boost at home."
 LibyaFamily.63.a: "로마에 가면 로마법을 따라야 하는 법이다"
 LibyaFamily.64.t: "끔찍한 국빈 방문"
 LibyaFamily.64.d: "When Muammar Gaddafi landed in [?libya_state_visit_target.GetNameDef], he brought along with with him his massive Bedouin tent with the intention of setting it up in a local park. The local authorities however disallowed the tent from being raised however, and Gaddafi was guided to a local hotel. Gaddafi refused to do so, demanding that it is customary to his people to hold meeting in a tent. The person he was suppose to be meeting, [?libya_state_visit_target.GetLeader], eventually cancelled all meetings as Gaddafi refused to budge his stance. This trip has been worthless and the world has seen that the 'Mad Dog' of Libya seems to be completely toothless."
 LibyaFamily.64.a: "얼마나 창피한 일인가"
 LibyaFamily.65.t: "강력한 의식"
 LibyaFamily.65.d: "As Muammar Gaddafi had gathered some of his elite troops in a courtyard in Tripoli, a Senegalese Marabou took position in front of the troops. Writing incantations and strange symbols on a piece of paper, the paper was covered with dried lion's skin, plants that grow in cemeteries and bark from a tree where a man had died. Wrapping everything together in a neat package, the offering was put on hot red coals to slowly burn and smoke. The Libyan soldiers were ordered to walk one by one over the smoke, allowing the smoke to penetrate their vitality. Shortly after, the Marabou started invoking the spirits to give strength to the soldier. In a trance like state, the soldiers started repeating 'God...Libya...Gaddafi'. As the ritual was over, the soldiers were bloodthirsty, vigorous and ready to fight until their last breath. Libya is saved!"
 LibyaFamily.65.a: "이게 대체 무슨 짓이냐?"
 LibyaFamily.66.t: "활력을 주는 의식"
 LibyaFamily.66.d: "As Muammar Gaddafi had gathered some of his elite troops in a courtyard in Tripoli, a Senegalese Marabou took position in front of the troops. Writing incantations and strange symbols on a piece of paper, the paper was covered with dried lion's skin, plants that grow in cemeteries and bark from a tree where a man had died. Wrapping everything together in a neat package, the offering was put on hot red coals to slowly burn and smoke. The Libyan soldiers were ordered to walk one by one over the smoke, allowing the smoke to penetrate their vitality. The soldiers did as they were ordered, though most of them looked very confused. After the Marabou had invoked spirits to give strength to the soldiers, the ceremony was over. The soldiers weren't sure what to think, but at least they were happy knowing that their leader is willing to do anything to make them win."
 LibyaFamily.66.a: "없는 것보다는 낫다"
 LibyaFamily.67.t: "실패한 의식"
 LibyaFamily.67.d: "As Muammar Gaddafi had gathered some of his elite troops in a courtyard in Tripoli, a Senegalese Marabou took position in front of the troops. Writing incantations and strange symbols on a piece of paper, the paper was covered with dried lion's skin, plants that grow in cemeteries and bark from a tree where a man had died. Wrapping everything together in a neat package, the offering was put on hot red coals to slowly burn and smoke. The Libyan soldiers were ordered to walk one by one over the smoke. However, nobody stepped forward. The soldiers started calling the Marabou a heathen, saying that such calling upon of the Jinn was heretical and against Islam. The whole situation quickly got out of hand, with Gaddafi and the Marabou both having to escape the courtyard in panic from the wrath of the angry soldiers. Many of the soldiers dropped their uniforms and deserted right there. Word of the ritual quickly spread across the military, and our soldiers have begun losing faith in our leader left and right."
 LibyaFamily.67.a: "그냥 마술 쇼였을 뿐인데!"
 LibyaFamily.68.t: "강연에 열광하는 여성들"
 LibyaFamily.68.d: "카다피는 이탈리아를 방문하는 동안 로마에서 강연을 조직하기로 결심했습니다. 그는 이탈리아의 한 환대 기관에 요청을 보내어 18세에서 35세 사이의 매력적인 여성들(키가 최소 1.7미터 이상)을 그의 신비한 강연에 초대하도록 했습니다. 여성들에게는 행사에 맞지 않게 미니스커트나 깊게 파인 옷을 입지 말라고 권고되었습니다. 여성들이 강연장에 모인 후, 가다피는 전부 검은색 옷을 입고 도착했고 강연을 시작했습니다. 카다피의 전담 여성 직원들이 여성들에게 코란을 나누어주었고, 카다피 자신은 이슬람, 기독교의 실패, 서구에서의 여성의 역할에 대해 강의했습니다. 카다피의 말은 많은 여성들에게 공감을 얻은 듯 보였고, 강연이 끝난 직후 몇몇 여성들은 이슬람으로 개종하고 싶다고 그에게 말했습니다. 이 행사는 빠르게 세계 언론의 주목을 받았고, 많은 여성들이 이슬람으로 개종하고 자유로운 여성들이 살 수 있는 땅, 리비아로 여행을 떠나는 물결을 일으켰습니다."
 LibyaFamily.68.a: "이슬람이야말로 진정 여성을 위한 종교다"
 LibyaFamily.69.t: "평범한 강연"
 LibyaFamily.69.d: "카다피는 이탈리아를 방문하는 동안 로마에서 강연을 조직하기로 결심했습니다. 그는 이탈리아의 한 환대 기관에 요청을 보내어 18세에서 35세 사이의 매력적인 여성들(키가 최소 1.7미터 이상)을 그의 신비한 강연에 초대하도록 했습니다. 여성들에게는 행사에 맞지 않게 미니스커트나 깊게 파인 옷을 입지 말라고 권고되었습니다. 여성들이 강연장에 모인 후, 카다피는 전부 검은색 옷을 입고 도착했고 강연을 시작했습니다. 카다피의 전담 여성 직원들이 여성들에게 코란을 나누어주었고, 카다피 자신은 이슬람, 기독교의 실패, 서구에서의 여성의 역할에 대해 강의했습니다. 강연은 여성들 사이에서 엇갈린 반응을 얻었고, 한 참석자는 '매우 흥미로운 경험이었다'고 말한 반면, 다른 참석자는 '내 종교에 대해 매우 불쾌감을 느낀다'고 언급했습니다. 그러나 이 강연은 리비아로의 이민을 소폭 증가시키는 결과를 낳았습니다."
 LibyaFamily.69.a: "적어도 귀 기울여 들었다"
 LibyaFamily.70.t: "분노를 불러일으킨 강연"
 LibyaFamily.70.d: "카다피는 이탈리아를 방문하는 동안 로마에서 강연을 조직하기로 결심했습니다. 그는 이탈리아의 한 환대 기관에 요청을 보내어 18세에서 35세 사이의 매력적인 여성들(키가 최소 1.7미터 이상)을 그의 신비한 강연에 초대하도록 했습니다. 여성들에게는 행사에 맞지 않게 미니스커트나 깊게 파인 옷을 입지 말라고 권고되었습니다. 여성들이 강연장에 모인 후, 카다피는 전부 검은색 옷을 입고 도착했고 강연을 시작했습니다. 카다피의 전담 여성 직원들이 여성들에게 코란을 나누어주었고, 카다피 자신은 이슬람, 기독교의 실패, 서구에서의 여성의 역할에 대해 강의했습니다. 강연이 끝날 무렵, 많은 여성들이 카다피에게 야유를 보냈습니다. 한 참석자는 '지금까지 이렇게 모욕을 당한 적이 없다'고 말했습니다. 많은 사람들은 카다피의 여성에 대한 견해를 억압적이라고 비판하며, 그의 강연은 아름다운 젊은 여성들과 만나기 위한 얇은 속임수에 불과하다고 주장했습니다. 이 사건의 소식은 리비아에도 전해졌고, 많은 여성들이 카다피처럼 여성혐오적인 사람이 지배하는 나라에서 살고 싶지 않다고 하며 나라를 떠날 계획을 세우고 있습니다."
 LibyaFamily.70.a: "여성이 이렇게 예민한 줄 누가 알았겠나?"
 LibyaFamily.71.t: "[SWI.GetNameDef] 해체를 촉구하는 [FROM.GetNameDef]"
 LibyaFamily.71.d: "The Libyan leader, Muammar Gaddafi, has called for the Swiss state to be dismantled. He is saying that Switzerland is just an artifical state made up of Italians, Germans and French people. Gaddafi has contacted all three surrounding countries has asked us to join him in this statement of Swiss artificiality."
 LibyaFamily.71.a: "스위스는 존재해서는 안 된다"
 LibyaFamily.71.b: "스위스는 주권 국가다!"
 LibyaFamily.72.t: "우리의 성명을 지지한 [FROM.GetNameDef]"
 LibyaFamily.72.d: "[FROM.GetAdjective] 정부는 스위스 해체에 관한 우리의 성명을 지지하기로 결정했습니다."
 LibyaFamily.72.a: "좋아"
 LibyaFamily.73.t: "우리의 성명을 규탄한 [FROM.GetNameDef]"
 LibyaFamily.73.d: "[FROM.GetAdjective] 정부는 스위스가 주권 국가이며 그 주권은 존중되어야 한다며, 스위스 해체에 관한 우리의 성명을 규탄하기로 결정했습니다."
 LibyaFamily.73.a: "겁쟁이들"
 LibyaFamily.74.t: "[FROM.GetNameDef] Call For Our Destruction"
 LibyaFamily.74.d: "The [FROM.GetAdjective] leader Muammar Gaddafi has released a statement saying that Switzerland should not exist. They have also asked our neighbouring countries to join in on this statement. This statement is most likely the result of one of Gaddafi's childrein being arrested by Swiss police."
 LibyaFamily.74.a: "우리에게는 존재할 권리가 있다!"
 LibyaCivilWar.1.t: "리비아에서 세력을 넓히는 LNDF"
 LibyaCivilWar.1.d: "LNDF([socialism_L])는 미국에 기반을 둔 반정부 단체입니다. 지금까지는 주로 미국 내에서 활동해 왔습니다. 그러나 카다피 정부에 대한 시위가 시작된 이후 리비아 국내에서도 훨씬 더 많은 지지자를 확보했습니다. 점점 더 많은 리비아인이 그들의 대의에 공감하고 있으며, 미국이 카다피에 맞서 리비아에 개입하기를 바라고 있습니다."
 LibyaCivilWar.1.a: "미국은 이곳과 아무 상관이 없다"
 LibyaCivilWar.2.t: "공산주의자의 침투"
 LibyaCivilWar.2.d: "The [Communist-State_L] has been non-existent ever since both the Kingdom of Libya and Gaddafi's Libya cracked down on the party. Marxism is Libya has its root in Italy, where many of the communists moved to exile during the crackdowns, organising the party as secret societies. With Gaddafi losing grasp of the country, some of these societies have started operating more openly, campaigning for the implementation of Marxism in Libya."
 LibyaCivilWar.2.a: "공산주의와 무신론을 입에 올리는 병든 자들을 모두 숙청해야 한다"
 LibyaCivilWar.3.t: "극단주의자 편으로 넘어간 병사들"
 LibyaCivilWar.3.d: "정부의 힘이 쇠퇴하는 것을 느낀 우리 병사 다수가 극단주의 조직 [Caliphate_L] 편으로 넘어가기로 결정했습니다. 이 조직은 카다피에 대한 시위가 시작되자마자 반란 활동을 늘려 왔습니다."
 LibyaCivilWar.3.a: "배신자들!"
 LibyaCivilWar.4.t: "반군의 단결을 촉구하는 NFSL"
 LibyaCivilWar.4.d: "[Neutral_conservatism_L]은(는) 카다피에 맞선 시위대와 반군의 단결을 촉구했습니다. 이들은 카다피와 싸우는 잠재력을 극대화하기 위해 모든 야당이 자신들이 이끄는 리비아 반대 세력 전국회의에 참여해야 한다고 밝혔습니다. 여러 소규모 정당과 단체가 이미 NFSL과 협력하겠다고 발표했습니다."
 LibyaCivilWar.4.a: "모래알을 모은다고 바위가 되지는 않는다!"
 LibyaCivilWar.5.t: "민주주의를 요구하는 바트당원들"
 LibyaCivilWar.5.d: "In a surprising move, the [Nat_Fascism_L] has publically demanded free and fair elections in Libya. We are not sure if this is just a publicity stunt, or if they have actually abandoned their way of extreme Ba'athism. Regardless, this has given them quite a bit of support."
 LibyaCivilWar.5.a: "그들은 거짓말을 하고 있다!"
 LibyaCivilWar.6.t: "시위대를 묵인하는 군대"
 LibyaCivilWar.6.d: "리비아의 한 주요 도시에서 리비아군은 시위대를 해산하라는 명령을 받았습니다. 현지 부대 지휘관은 이를 거부하고 시위가 계속되도록 허용했으며, 혁명수비대로부터 시위대를 보호하기까지 했습니다. 우리가 정규군과 혁명수비대 사이에 만들어 놓은 분열이 드러나기 시작한 것으로 보입니다."
 LibyaCivilWar.6.a: "그들은 명령대로 해야 한다!"
 LibyaCivilWar.7.t: "시위대를 묵인하는 혁명수비대"
 LibyaCivilWar.7.d: "리비아의 한 주요 도시에서 혁명수비대는 시위대를 해산하라는 명령을 받았습니다. 현지 부대 지휘관은 이를 거부하고 시위가 계속되도록 허용했으며, 리비아 정규군 부대로부터 시위대를 보호하기까지 했습니다. 우리가 정규군과 혁명수비대 사이에 만들어 놓은 분열이 드러나기 시작한 것으로 보입니다."
 LibyaCivilWar.7.a: "그들은 명령대로 해야 한다!"
 LibyaCivilWar.8.t: "카다피에 맞서 운동을 벌이는 왕가"
 LibyaCivilWar.8.d: "망명 중인 리비아 왕가가 카다피에 맞서 운동을 시작하고 자금을 모으고 있습니다. 이들은 유럽 곳곳을 순회하며 정치인들을 만나고, 시위대의 안전을 보장하기 위해 나토가 리비아에 개입해 달라고 요청하고 있습니다. 많은 시위대가 옛 리비아 왕국의 깃발을 흔들고 이드리스 1세 국왕의 초상화를 들고 있는 모습이 목격되었습니다."
 LibyaCivilWar.8.a: "그들은 서방의 꼭두각시에 불과하다!"
 LibyaCivilWar.9.t: "정부 장관 사임"
 LibyaCivilWar.9.d: "정부가 시위에 대처하는 방식에 항의하여 우리 정부 장관 가운데 한 명이 사임하고 반군에 합류하기로 했습니다."
 LibyaCivilWar.9.a: "뭐라고?"
 LibyaCivilWar.10.t: "망명한 외국 주재 대사"
 LibyaCivilWar.10.d: "외국 주재 우리 대사 가운데 한 명이 사임하고 주재국으로 망명했습니다. 그는 핵심 정부 문서와 기밀 일부를 가지고 갔습니다."
 LibyaCivilWar.10.a: "신성한 문서들이!"
 LibyaCivilWar.11.t: "이탈한 군 부대"
 LibyaCivilWar.11.d: "One of our military units has defected and joined the side of the protestors. They unit commander said that he will not hurt his fellow Libyans."
 LibyaCivilWar.11.a: "겁쟁이들!"
 LibyaCivilWar.12.t: "군 비축 물자 약탈"
 LibyaCivilWar.12.d: "시위대가 동조하는 군 부대의 도움을 받아 군 무기 비축고에 침입하여 대량의 무기를 훔쳤습니다."
 LibyaCivilWar.12.a: "그것들은 내 병사들을 위한 것이었다!"
 LibyaCivilWar.13.t: "몰타로 망명한 조종사들"
 LibyaCivilWar.13.d: "리비아 조종사 여럿이 전투기를 몰고 이륙하여 몰타로 날아가 망명을 신청했습니다. 그들은 정부의 명령에 따라 민간인 표적을 폭격하는 것을 거부하고 조국을 떠나기로 결심했습니다."
 LibyaCivilWar.13.a: "전투기를 돌려받을 수 있겠나?"
 LibyaCivilWar.14.t: "함선을 자침시킨 선원들"
 LibyaCivilWar.14.d: "우리 군함 가운데 한 척의 승조원들이 자신들이 근무하던 함선을 자침시키기로 결정했습니다. 시위대를 향해 무기를 사용하기를 거부한 그들은 함선을 인근 해안으로 몰고 가 폭약을 실었습니다. 함선이 불타는 잔해가 된 뒤 그들은 시위대에 대한 지지를 선언했습니다."
 LibyaCivilWar.14.a: "그것들은 값비싼 물건이다!"
 LibyaFocusNews.1.t: "암살당한 리비아 국가원수"
 LibyaFocusNews.1.coup.d: "오늘 리비아에서 극적인 소식이 전해졌습니다. 이 나라의 지도자가 급진 [LBA.Caliphate_L]에 의해 암살당했습니다. 지도자의 차량 행렬은 리비아 사막에서 이슬람주의자들의 습격을 받았습니다. 암살이 성공한 뒤 이 단체의 전투원들은 트리폴리와 벵가지의 주요 정부 건물을 신속히 점거했습니다. 뚜렷한 지도자가 없던 기존 정권은 어떠한 저항도 조직하지 못했습니다. [LBA.Caliphate_L]의 에미르 [LBA.GetLeader]은(는) 스스로를 나라의 통치자로 선언했습니다. 이는 의심할 여지 없이 이 지역에 더 큰 불안정을 가져올 것입니다."
 LibyaFocusNews.1.civilwar.d: "오늘 리비아에서 극적인 소식이 전해졌습니다. 이 나라의 지도자가 급진 [LBA.Caliphate_L]에 의해 암살당했습니다. 지도자의 차량 행렬은 리비아 사막에서 이슬람주의자들의 습격을 받았습니다. 암살이 성공한 뒤 이 단체의 전투원들은 트리폴리와 벵가지의 주요 정부 건물을 신속히 점거했습니다. 그러나 구 정권 지지 세력은 쿠데타에 맞서 신속히 반격 병력을 꾸렸습니다. [LBA.Caliphate_L]의 에미르 [LBA.GetLeader]은(는) 스스로를 나라의 통치자로 선언하며 신의 도움으로 리비아의 신자들이 승리할 것이라고 밝혔습니다. 이슬람주의자들이 승리한다면 이 지역에는 의심할 여지 없이 더 큰 불안정이 닥칠 것입니다."
 LibyaFocusNews.1.a: "흥미롭군"
 LibyaFocusNews.2.t: "[FROM.GetNameDef]의 실권을 장악한 성직자들"
 LibyaFocusNews.2.d: "[FROM.GetAdjective] 정부는 오늘 기존 국가 권력 구조의 급진적 변화를 발표했습니다. 보다 안정적이고 통합적인 구심점이 필요하다는 이유로 [FROM.GetAdjective] 대무프티직이 나라의 '최고 도덕·사회 권위'로 격상되었습니다. 사실상 이는 대무프티가 이란의 아야톨라와 유사하게 국정에 매우 큰 영향력을 갖게 됨을 의미합니다. 현 무프티 [LBA.GetLeader]이(가) 이슬람의 보다 급진적인 요소에 어느 정도 동조하고 있다고 의심받고 있어 일부는 이러한 변화를 우려하고 있습니다."
 LibyaFocusNews.2.a: "흥미롭군"
 LibyaFocusNews.3.t: "[FROM.GetNameDef] 발표"
 LibyaFocusNews.3.d: "리비아 지도자 [FROM.GetLeader]이(가) 오늘 [FROM.GetNameDef]의 창설을 발표했습니다. 사헬과 사하라에서 벌어지고 있는 이슬람주의 반란에 자극받은 [FROM.GetLeader]은(는) 그곳의 여러 세력을 통합하여 '서방과 미국인들이 소외시킨 무슬림들에게 평화를 가져다주겠다'는 계획입니다. 이는 [FROM.GetNameDef]이(가) 이 지역 국가들의 편이 아니라는 분명한 신호입니다."
 LibyaFocusNews.3.a: "흥미롭군"
 LibyaFocusNews.4.t: "개혁을 받아들인 [FROM.GetNameDef]"
 LibyaFocusNews.4.d: "The [FROM.GetAdjective] head of state [FROM.GetLeader] has announced plans to reduce the power of the Revolutionary Committees in the country. The Revolutionary Committees were created as an authority to prevent the spread of revolutionary ideals after Muammar Gaddafi took power in the country. In practice, the Committees have controlled the pseudo-democratic People's Congresses that in theory are supposed to run the country. The Committees have now been sidelined from the political process, allowing the People's Congresses to operate more freely. This change will move [FROM.GetNameDef] towards a more democratic society."
 LibyaFocusNews.4.a: "흥미롭군"
 LibyaFocusNews.5.t: "[FROM.GetNameDef]에 대한 통제를 강화하는 [FROM.GetLeader]"
 LibyaFocusNews.5.d: "The [FROM.GetAdjective] head of state [FROM.GetLeader] has announced plans to reform the country's political system. Stating that the existing People's Congresses have been infiltrated by foreign agents, a decision has been made to shut them down. The Revolutionary Committees responsible for preventing the spread of revolutionary ideas in the country will be responsible of 'screening and verifying' all current and future members of the Congresses until the '[FROM.GetAdjective] political space has been made safe for the citizens'. It is predicted that this change is in fact permanent, and any remaining traces of democracy are being stamped out of [FROM.GetNameDef]."
 LibyaFocusNews.5.a: "흥미롭군"
 LibyaFocusNews.6.t: "[FROM.GetNameDef] Vows To Protecth Sahelian Minorities"
 LibyaFocusNews.6.d: "어제 기자회견에서 [FROM.GetAdjective] 지도자 [FROM.GetLeader]은(는) [FROM.GetNameDef]이(가) 사하라와 사헬 지역 소수민족을 보호하는 데 자기 몫을 다하겠다고 맹세했습니다. 주로 투아레그족과 투부족을 언급하며 [FROM.GetLeader]은(는) 이 지역 국가들의 지속적인 불안정과 분리 정책이 [FROM.GetNameDef]이(가) 해당 국가들을 상대로 행동에 나서도록 압박할 것이라고 강조했습니다."
 LibyaFocusNews.6.a: "흥미롭군"
 LibyaFocusNews.7.t: "테러와의 전쟁에 합류한 [FROM.GetNameDef]"
 LibyaFocusNews.7.d: "[FROM.GetAdjective] 정부는 오늘 [USA.GetNameDef]의 세계적인 대테러 전쟁에 합류하겠다고 발표했습니다. [FROM.GetNameDef]은(는) 유럽 파트너들과 함께 사하라와 사헬에서 이슬람주의에 맞서는 싸움을 조직할 것입니다."
 LibyaFocusNews.7.a: "흥미롭군"
 LibyaFocusNews.8.t: "카사블랑카 협정 발표"
 LibyaFocusNews.8.d: "[FROM.GetAdjective] 정부는 서사하라의 지위에 관한 평화 회의를 개최한다고 발표했습니다. 모로코, 알제리, 모리타니, 그리고 폴리사리오 전선 대표단이 모두 회의에 초청되었습니다. [FROM.GetLeader]은(는) 동결된 분쟁에 대한 해법을 찾겠다는 야심 찬 목표를 세웠습니다."
 LibyaFocusNews.8.a: "흥미롭군"
 LibyaFocusNews.9.t: "ICJ 판결을 뒤집은 [FROM.GetNameDef]"
 LibyaFocusNews.9.d: "1987년 리비아와 차드 간의 토요타 전쟁이 끝난 뒤 국제사법재판소는 두 나라가 분쟁 중이던 아우주 지대가 법적으로 차드 영토라고 판결했습니다. 판결 이후 리비아는 이 지역에서 신속히 철수했습니다. 그러나 이제 [FROM.GetAdjective] 지도자 [FROM.GetLeader]이(가) 이 결정을 뒤집었으며, [FROM.GetNameDef]은(는) 국제적 위협과 압력에 못 이겨 판결을 따랐을 뿐이라고 밝혔습니다. 이들은 다시 한번 이 영토에 대한 영유권을 주장하고 있습니다."
 LibyaFocusNews.9.a: "흥미롭군"
 LibyaFocusNews.10.t: "아우주 지대를 할양한 [CHA.GetNameDef]"
 LibyaFocusNews.10.d: "어제 [LBA.GetAdjective] 정부는 [CHA.GetNameDef]에 최후통첩을 보냈습니다. 아우주 지대에서 모든 병력을 철수시키고 해당 영토를 공식적으로 [LBA.GetNameDef]에 이양하지 않으면 군사 개입에 직면하게 될 것이라는 내용입니다. 사실상 희망이 없는 상황에서 [CHA.GetAdjective] 정부는 해당 영토를 [LBA.GetNameDef]에 넘기는 데 동의했습니다."
 LibyaFocusNews.10.a: "흥미롭군"
 LibyaFocusNews.11.t: "[LBA.GetAdjective] 요구를 거부한 [CHA.GetNameDef]"
 LibyaFocusNews.11.d: "Yesterday, the [LBA.GetAdjective] government sent an ultimatum to [CHA.GetNameDef]; Withdraw all forces from the Aouzou Strip and officially transfer the territory to [LBA.GetNameDef], or face a military intervention. The [CHA.GetAdjective] government refused any the demands, stating that they follow international boundaries as recognised by the international community. It is likely that this will lead to a conflict between the two nations. However, [CHA.GetName] has defeated the [LBA.GetAdjective]s before, maybe they can do so again."
 LibyaFocusNews.11.a: "흥미롭군"
 LibyaFocusNews.12.t: "식민주의 파괴를 맹세한 [FROM.GetLeader]"
 LibyaFocusNews.12.d: "어제 UN 총회에서 [FROM.GetAdjective] 지도자 [FROM.GetLeader]은(는) 미국과 시온주의 식민주의에 맞서 싸우기 위한 국제 '선의 축'을 창설하겠다고 발표했습니다. [FROM.GetLeader]은(는) 동료 반식민주의자들을 모두 이 새로운 동맹에 초청했으며, 서방이 식민주의의 역사에 대한 대가를 치르게 하겠다고 약속했습니다."
 LibyaFocusNews.12.a: "흥미롭군"
 LibyaFocusNews.13.t: "소코트라를 점령한 [FROM.GetNameDef]"
 LibyaFocusNews.13.d: "적대적인 기습 행동으로 [FROM.GetAdjective] 특수부대가 은밀히 상륙하여 소코트라 섬의 주요 시설을 점령했으며, [YEM.GetAdjective] 측의 통제 아래에 있던 섬을 빼앗았습니다. [YEM.GetNameDef]은(는) 이미 이러한 주권 침해 행위를 규탄했으나, 어떤 대응을 할지는 지켜봐야 합니다."
 LibyaFocusNews.13.a: "흥미롭군"
 LibyaFocusNews.14.t: "리비아 내전"
 LibyaFocusNews.14.d: "What started out as protest against [LBA.GetLeader]'s rule, has developed into a full armed conflict. The protests started in the Eastern part of the country, with people demanding more political freedom and improved living conditions. While Libya has the highest GDP per capita in Africa and one of the best HDI's in the world, one third of Libyan's still live under the poverty line and oil profits from the country's vast oil reserves mainly fall into the regime's pockets. The protests turned violent as [LBA.GetLeader] ordered the military to intervene, and soon people were up in arms. The rebels have formed [LRB.GetNameDef], which will serve as a transitional authority until [LBA.GetLeader] lays down his arms and surrenders."
 LibyaFocusNews.14.a: "흥미롭군"
 LibyaFocusNews.15.t: "리비아 내전 종결"
 LibyaFocusNews.15.LBA.d: "The civil war in Libya has come to a close. Despite strong resistance from the rebels, [FROM.GetLeader] has managed to wrestle back control of the country. It is likely that this will lead into further crackdowns in the [LBA.GetAdjective] society."
 LibyaFocusNews.15.LRB.d: "리비아 내전이 막을 내렸습니다. 반군이 정권군을 물리치는 데 성공했으며, [FROM.GetLeader]은(는) 이미 나라가 나아가야 할 방향에 대한 계획을 밝혔습니다. 이로써 [FROM.GetNameDef]은(는) 새로운 장을 열게 되었습니다."
 LibyaFocusNews.15.a: "흥미롭군"
 LibyaFocusNews.16.t: "결론에 도달한 카사블랑카 협정"
 LibyaFocusNews.16.annex.d: "When [LBA.GetLeader] announced they would be holding a international meeting for solving the status of Western Sahara, many were skeptical. However, it seems that the accords have reach a some kind of conclusion. In their declaration, dubbed the [GetYear] Casablanca Agreement, they outline the plan of officially integrating Western Sahara into Morocco. After studying historical documents, the accords came to a conclusion that legally Western Sahara is Moroccan territory. Whether or not [SHA.GetNameDef] will accept this decision, is uncertain at this point."
 LibyaFocusNews.16.autonomy.d: "When [LBA.GetLeader] announced they would be holding an international meeting for solving the status of Western Sahara, many were skeptical. However, it seems that the accords have reach a some kind of conclusion. In their declaration, dubbed the [GetYear] Casablanca Agreement, they outline the plan to annex Western Sahara to Morocco while allowing the Sahrawis to still hold significant autonomy. There is a clear agreement that Western Sahara will be allowed to have their military and direct control of their internal politics, while Morocco will be responsible for the region's international relations, including defence against external threats."
 LibyaFocusNews.16.independence.d: "When [LBA.GetLeader] announced they would be holding a international meeting for solving the status of Western Sahara, many were skeptical. However, it seems that the accords have reach a some kind of conclusion. In their declaration, dubbed the [GetYear] Casablanca Agreement, the signatories outline a clear support for the full independence of Western Sahara. The Accords clearly saw that the Western Saharan desire for independence overrules any possible historical records that would legally make the area Moroccan. Whether or not [MOR.GetNameDef] will accept this decision, is uncertain at this point."
 LibyaFocusNews.16.mauritania.d: "When [LBA.GetLeader] announced they would be holding a international meeting for solving the status of Western Sahara, many were skeptical. However, it seems that the accords have reach a some kind of conclusion. In their declaration, dubbed the [GetYear] Casablanca Agreement, they declare that Western Sahara is legally Mauritanian. After studying historical documents and past diplomatic agreements, from their point of view it is clear that Mauritania should hold the territory. Whether or not [MOR.GetNameDef] and [SHA.GetNameDef] will accept this decision, is uncertain at this point."
 LibyaFocusNews.16.a: "흥미롭군"
 LibyaFocusNews.17.t: "결론을 내지 못한 카사블랑카 협정"
 LibyaFocusNews.17.d: "When [LBA.GetLeader] announced they would be holding a international meeting for solving the status of Western Sahara, many were skeptical. That skepticity was well placed, after a year of negotiations, no tangible results have been achieved. Frustrated with the process, [LBA.GetLeader] has called the accords to be ended. It seems that Western Sahara will remain a contested area even in the future."
 LibyaFocusNews.17.a: "흥미롭군"
 LibyaFocusNews.18.t: "결렬된 카사블랑카 협정"
 LibyaFocusNews.18.d: "When [LBA.GetLeader] announced they would be holding a international meeting for solving the status of Western Sahara, many were skeptical. That skepticity was well placed, as serious disagreements between the partaking countries has forced the accords to be ended early. Several delegations already abandoned the accords in content as they felt that their needs weren't being heard. This has certainly been an embarrasment to [LBA.GetLeader]."
 LibyaFocusNews.18.a: "흥미롭군"
 LibyaFocusNews.19.t: "[ENG.GetAdjective] 리비아 개입"
 LibyaFocusNews.19.d: "After the assassination attempt of the Libyan royal family in [ENG.GetNameDef], the [ENG.GetAdjective] government demanded immediate compensation and apology from the [LBA.GetAdjective] government. [ENG.GetNameDef] had discovered that [LBA.GetNameDef] had strong links to the terror attack. As no apology or compensation arrive, [ENG.GetNameDef] considered this an attack against the nation. Still bearing the scars of the Lockerbie bombing, [ENG.GetNameDef] has had no choice but to topple the [LBA.GetAdjective] government in order to stop further attacks."
 LibyaFocusNews.19.a: "흥미롭군"
 LBA_mining_in_aouzou: "아오주 채굴"
 LBA_mining_in_aouzou_desc: "아오주 지대를 확보했으니 이제 그 귀중한 우라늄을 땅에서 캐내기 시작할 수 있습니다."
 LBA_mining_in_aouzou_tt_1: "§Y$STATE_580$§!을(를) 소유하고 있다면:\n"
 LBA_mining_in_aouzou_tt_2: "[CHA.GetNameWithFlag]이(가) 공동 채굴에 동의했다면:\n"
 LBA_gmmr_jaghbub: "대인공강 자그부브"
 LBA_gmmr_jaghbub_desc: "나라의 동부, 이집트와의 국경 바로 위이자 토브룩 바로 남쪽에는 자그부브라는 작은 마을이 있습니다. 이 지역은 대수층 위에 자리한 천연 오아시스입니다. 이곳에 우물을 건설하면 토브룩에 깨끗한 물을 공급할 수 있습니다."
 aozou_strip_occupation_decisions: "아오주 지대 점령"
 aozou_strip_occupation_decisions_desc: "아오주 지대는 우리와 이웃 나라 사이의 분쟁 지역입니다. 그들이 겪고 있는 혼란을 이용해 이 지역을 장악할 수 있을지도 모릅니다."
 generic_occupy_aouzou_strip: "아오주 지대를 점령한다"
 generic_occupy_aouzou_strip_desc: "[580.owner.GetNameDef]의 현재 상황으로는 [580.GetName]에 대한 통제력을 효과적으로 확장할 수 없습니다. 이 지역을 확보하기 위해 소규모 병력을 파견해야 합니다. [580.owner.GetName]이(가) 저항할 가능성은 낮습니다."
 generic_occupy_aouzou_strip_tt: "§R[580.owner.GetNameDef]이(가) 우리에게 선전포고할 수 있습니다!§!"
 LibyaFocus.104.t: "[FROM.GetNameDef]의 [580.GetName] 점령"
 LibyaFocus.104.d: "With our security forces occupied elsewhere, the deserts of the [580.GetName] are basically unpatrolled. Taking advantage of this power vacuum, [FROM.GetNameDef] has sent a small contingent of troops to set up a small base in the town of Aozou. With the [FROM.GetAdjective] flying in the center of Aouzou town, [FROM.GetNameDef] has claimed the entire area for themselves."
 LibyaFocus.104.a: "우리가 할 수 있는 일은 없다"
 LibyaFocus.104.b: "그들은 대가를 치르게 될 것이다!"
 LBA_start_building_reactor_threat: "[LBA.GetAdjective] 핵 프로그램"
 LBA_support_south_sudan: "[SSU.GetName] 지원"
 LBA_support_south_sudan_desc: "Before Omar al-Bashir took power in Sudan, we supported the SPLA in the south. Al-Bashir is, while quite friendly with us, is not the best bedfellow. His international reputation is abysmal, and it is only a matter of time before he loses power. Maybe we should instead switch back to supporting [SSU.GetNameDef]?"
 LBA_send_mercenaries_tt_3: "국가 중점 §Y$LBA_support_south_sudan$§!을(를) 완료했다면:\n"
 LibyaFocus.105.t: "[FROM.GetAdjective] 핵과학자 체포"
 LibyaFocus.105.d: "[FROM.GetAdjective] 당국은 핵 군축 프로그램의 일환으로, [ROOT.GetAdjective] 국적자인 프리드리히 틴너가 자국의 핵 프로그램에 연루되었음을 보여주는 문서를 공개했습니다. 틴너는 파키스탄의 핵과학 책임자 압둘 카디르 칸 밑에서 공부하고 일했으며, 1980년대에 무아마르 카다피의 초청을 받아 리비아 핵 프로그램을 이끌었습니다. 그러나 틴너는 칸의 도움이 있었음에도 리비아의 학술적·기술적 전문성 부족으로 큰 성과를 내지 못했습니다.\n\n틴너는 현재 우리에게 체포되어 구금된 채 처분을 기다리고 있습니다. 그를 어떻게 해야 할까요?"
 LibyaFocus.105.a: "그를 가둬라"
 LibyaFocus.105.b: "핵과학자라고 했나?"
 LibyaFocus.105.c: "그는 무고하니 풀어 주라"
 LibyaFocus.106.t: "틴너를 투옥한 [FROM.GetNameDef]"
 LibyaFocus.106.d: "[FROM.GetAdjective] 당국은 리비아에 핵무기 물자를 밀반입하고 국제 제재를 받는 나라를 도운 혐의로 프리드리히 틴너를 투옥하기로 결정했습니다. 그를 다시 볼 일은 없을 것입니다."
 LibyaFocus.106.a: "지금 당장 대체 인물이 필요하다"
 LibyaFocus.107.t: "[FROM.GetNameDef] Employes Tinner"
 LibyaFocus.107.d: "To our surprise, it seems that [FROM.GetNameDef] has decided to employ Friedrich Tinner instead of imprisoning him. It seems that they valued his expertise in nuclear research too much not to put them to use."
 LibyaFocus.107.a: "뱀 같은 자들!"
 LibyaFocus.108.t: "프리드리히 틴너의 귀환"
 LibyaFocus.108.d: "프리드리히 틴너가 트리폴리 공항에 모습을 드러냈을 때 우리는 놀랐습니다. [FROM.GetAdjective] 당국은 그를 더 이상 투옥할 관심이 없었던 듯하며, 그는 자유롭게 출국을 허가받았습니다. 무엇이 그들을 이렇게 만들었는지는 추측만 할 수 있을 뿐입니다."
 LibyaFocus.108.a: "이건 속임수일 것이다, 그렇지 않은가?"
 sp_libya_gmmr_phase3_project: "대인공하천 - 알자우프 송수관"
 sp_libya_gmmr_phase3_project_desc: "리비아 전역에 물을 공급하려는 대인공하천 사업은 끝내 완공되지 못했습니다. 이 송수관은 쿠프라의 알자우프까지도 연결될 예정이었으며, 이제 우리에게는 해당 구간을 완성할 기회가 생겼습니다."
 sp_libya_gmmr_phase3_project_reward_al_jawf_agriculture: "농업 증진"
 sp_libya_gmmr_phase3_project_reward_al_jawf_agriculture_desc: "알자우프는 사하라 전체에서 관개 시설이 가장 잘 갖춰진 오아시스 중 하나입니다. 3단계 공사가 이루어지면 그곳의 관개를 개선하여 다른 사업을 위한 여유를 더 확보하거나 생산 효율을 높일 수 있습니다."
 sp_libya_gmmr_phase3_project_reward_al_jawf_agriculture_option_slot: "토지 이용 확대"
 sp_libya_gmmr_phase3_project_reward_al_jawf_agriculture_option_productivity: "생산성 향상"
 sp_libya_gmmr_phase4_west_project: "대인공하천 - 가다메스 송수관"
 sp_libya_gmmr_phase4_west_project_desc: "리비아 전역에 물을 공급하려는 대인공하천 사업은 끝내 완공되지 못했습니다. 가다메스는 튀니지 국경 근처 서부 사막의 가장 큰 도시 중 하나이며 리비아에서 가장 오래된 도시 중 하나입니다."
 sp_libya_gmmr_phase4_west_project_reward_tourism: "가다메스에서 건설 사업이 한창 진행되면서 늘어난 노동력 덕분에 가다메스 구시가지 일대에 소규모 관광 붐이 일었습니다. 구시가지는 한동안 방치되어 있었으며, 늘어난 수입을 복원에 쓸 수 있습니다. 또는 그 돈을 이 지역의 사업에 추가로 투자할 수도 있습니다."
 sp_libya_gmmr_phase4_west_project_reward_tourism_option_infra: "구시가지 복원"
 sp_libya_gmmr_phase4_west_project_reward_tourism_option_productivity: "자금 투자"
 sp_libya_gmmr_phase4_east_project: "대인공하천 - 자그부브 송수관"
 sp_libya_gmmr_phase4_east_project_desc: "리비아 전역에 물을 공급하려는 대인공하천 사업은 끝내 완공되지 못했습니다. 자그부브는 이집트 국경 근처의 작은 오아시스 마을로, 사실 다른 어떤 리비아 정착지보다 이집트 마을 시와에 더 가깝습니다. 이 지역을 리비아 본토에 더 잘 통합하려면 송수관을 그곳까지 연장해야 합니다."
 sp_libya_gmmr_phase4_east_project_reward_treasures: "The town of Jaghbub is mostly known for being a home to the Senussi movement. However, with time the town has been sacked of its many historical artefacts and graves of historical figures. A recent excavation discovered a rare Senussi artefact, and officials are now wondering what to do with them. To put them in a museum or sell them for quick profit?"
 sp_libya_gmmr_phase4_east_project_reward_treasures_option_bonus: "박물관에 있어야 마땅하다!"
 sp_libya_gmmr_phase4_east_project_reward_treasures_option_productivity: "이 낡은 잡동사니를 팔아 치운다"
 sp_libya_gmmr_phase5_project: "대인공하천 - 동서 연결"
 sp_libya_gmmr_phase5_project_desc: "리비아 전역에 물을 공급하려는 대인공하천 사업은 끝내 완공되지 못했습니다. 송수관의 서부와 동부 구간은 현재 서로 연결되어 있지 않습니다. 시르테 마을 인근에서 두 관로망을 연결하여 하나의 통합 송수관을 만들 수 있습니다."
 sp_libya_gmmr_phase5_project_reward_investment: "카다피는 집권한 뒤 시르테 지역에 막대한 투자를 시작했는데, 그가 이 마을에서 불과 20km 남쪽에서 태어났기 때문입니다. 이 마을은 트리폴리에서 대규모 공공 사업과 정부 부처가 이전해 오면서 빠르게 도시로 성장했습니다. 우리가 이 지역에서 공사를 하는 김에 다른 공공 사업도 함께 진행하는 것이 합리적일 수 있습니다. 예산에는 공항 또는 항구 하나를 건설할 만한 자금이 있습니다."
 sp_libya_gmmr_phase5_project_reward_investment_option_airport: "공항!"
 sp_libya_gmmr_phase5_project_reward_investment_option_naval_base: "항구!"
 sp_libya_reward_improve_tripolitania_opinion: "트리폴리타니아인, 사업을 지지하다"
 sp_libya_reward_improve_tripolitania_opinion_desc: "The tribes in Cyrenaica have been impressed by our project being implemented on their land. They are surprised that the government is willing to invest so much into them."
 sp_libya_reward_reduce_tripolitania_opinion: "트리폴리타니아인, 사업에 불만을 품다"
 sp_libya_reward_reduce_tripolitania_opinion_desc: "트리폴리타니아의 부족들은 자신들의 땅에서 진행되는 현 사업에 반대하는 시위를 조직했습니다. 그들은 정부가 허영뿐인 건설 사업에 자신들의 땅을 쓸 권리가 없다고 주장합니다."
 sp_libya_reward_improve_cyrenaica_opinion: "키레나이카인, 사업을 지지하다"
 sp_libya_reward_improve_cyrenaica_opinion_desc: "The tribes in Cyrenaican have been impressed by our project being implemented on their land. They are surprised that the government is willing to invest so much into them."
 sp_libya_reward_reduce_cyrenaica_opinion: "키레나이카인, 사업에 불만을 품다"
 sp_libya_reward_reduce_cyrenaica_opinion_desc: "The tribes of Cyrenaican have organised a protest against our current project in their land. They state that the government has no right to use their land for vanity construction projects."
 sp_libya_reward_improve_fezzan_opinion: "페잔인, 사업을 지지하다"
 sp_libya_reward_improve_fezzan_opinion_desc: "페잔의 부족들은 자신들의 땅에서 진행되는 우리 사업에 깊은 인상을 받았습니다. 그들은 정부가 자신들에게 이렇게까지 많은 투자를 할 의사가 있다는 사실에 놀라워하고 있습니다."
 sp_libya_reward_reduce_fezzan_opinion: "페잔인, 사업에 불만을 품다"
 sp_libya_reward_reduce_fezzan_opinion_desc: "페잔의 부족들은 자신들의 땅에서 진행되는 현 사업에 반대하는 시위를 조직했습니다. 그들은 정부가 허영뿐인 건설 사업에 자신들의 땅을 쓸 권리가 없다고 주장합니다."
 Libya_focus: "리비아 중점 계통도"
 LBA_humbled_by_the_un_desc: "Muammar Gaddafi's fiery speech at the UN was met with ridicule as he was booed of the podium. Seems Gaddafi is not as charismatic as he thinks."
 libya_develop_oil_fields_with_foreign_aid: "해외 원조로 유전을 개발한다"
 libya_develop_oil_fields_with_foreign_aid_desc: "There are several multinational oil companies that operate globally. They have the knowhow and technology on how to extract oil from pretty much anywhere. We need to use them to expand Libya's oil industry.\n\n§YThis decisions can be done once a year§!"
 libya_gaddafi_family_anti_government_protests_tt: "§R시위가 내전으로 확대되며 우리는 어느 편에 설지 선택해야 합니다!§!"
 LBA_first_libyan_civil_war_tension: "제1차 리비아 내전"
 libya_tribalism_decentralise_state_tt: "§Y6개월마다 분권화를 실행합니다!§!"
 libya_tribalism_military_crackdown: "지역에 군사 단속을 명령한다"
 libya_tribalism_military_crackdown_desc: "반란을 막기 위해 우리는 군에 [FROM.GetName]의 모든 반대 활동을 강력히 단속하도록 명령해야 합니다."
 libya_tribalism_use_military_as_workforce: "지역에서 군을 노동력으로 활용한다"
 libya_tribalism_use_military_as_workforce_desc: "[FROM.GetName]의 건설 사업에 군을 투입하면 지역을 더 빠르게 개발할 수 있습니다."
 libya_tribalism_use_military_as_security: "지역 유전에 추가 경비를 제공한다"
 libya_tribalism_use_military_as_security_desc: "리비아의 대부분의 유전에는 어떤 형태로든 민간 경비 병력이 있습니다. 우리는 군을 활용하여 [FROM.GetName]에 추가 경비를 제공할 수 있습니다. 그러면 실제 채굴에 더 많은 자원을 돌릴 수 있습니다."
 libya_tribalism_demobilise_soldiers: "지역의 병사를 제대시킨다"
 libya_tribalism_demobilise_soldiers_desc: "우리 군의 병사 중 상당수는 [FROM.GetName] 출신입니다. 일부를 군 복무에서 풀어 주고 귀향시킬 때가 되었는지도 모릅니다. 이는 해당 지역과 신뢰를 쌓는 데 도움이 될 것입니다."
 libya_tribalism_end_tribalism: "부족주의를 끝낸다"
 libya_tribalism_end_tribalism_desc: "부족들의 충성을 확보했으므로, 이제 반란과 리비아의 붕괴 가능성을 더는 걱정하지 않아도 됩니다."
 libya_tribalism_end_tribalism_trp_tt: "[TRP.GetNameWithFlag]의 충성도 > 99% (현재: [?tripolitania_loyalty|%0])\n"
 libya_tribalism_end_tribalism_cyr_tt: "[CYR.GetNameWithFlag]의 충성도 > 99% (현재: [?cyrenaica_loyalty|%0])\n"
 libya_tribalism_end_tribalism_fez_tt: "[FEZ.GetNameWithFlag]의 충성도 > 99% (현재: [?fezzan_loyalty|%0])\n"
 libya_demand_tuareg_territory: "[FROM.GetNameDef]에 투아레그 영토를 요구한다"
 libya_demand_tuareg_territory_desc: "[FROM.GetNameDef]은(는) 현재 투아레그족이 거주하는 땅을 점유하고 있습니다. 투아레그족은 리비아 민족의 일부이므로 우리는 그들을 해방해야 합니다."
 libya_aftermath_of_civil_war: "내전의 여파"
 libya_aftermath_of_civil_war_desc: "\n£LBA_desctext_aftermath_of_civil_war \n\n\n\nWith the civil war over, it is time to build a new Libya. However, the power vacuum left by Gaddafi has created a fickle balance of power in the country. Jihadists and Islamists of the Muslim Brotherhood want to impose Sharia on the country, the newly formed Libyan National Army has many ambitious military commanders and there are still plenty of Gaddafi supporters in the country. If we don't approach the faction with balance or manage to snuff them out completely, it is likely that Libya will be splintered yet again."
 libya_integrate_militias_mission: "민병대 통합"
 libya_integrate_militias_mission_desc: "다양한 민병대를 통합하는 일은 상충하는 이념과 충성, 지휘 계통 때문에 시간이 걸릴 것입니다. 그러나 민병대가 하나씩 통합될 때마다 우리 정부의 통제력은 커집니다."
 libya_integrate_militias_mission_create_LNA_tt: "§Y$LBA.Nat_Autocracy_rebels$§!은(는) §Y$LBA.Nat_Autocracy_LNA$§!(으)로 불리게 됩니다\n"
 libya_attack_ansar_al_sharia_in_benghazi: "§Y$STATE_395$§!의 뱀 대가리를 제거한다"
 libya_attack_ansar_al_sharia_in_benghazi_desc: "[ASL.GetNameDef]은(는) $STATE_395$에 방어 거점을 구축했습니다. 이 도시는 리비아 제2의 도시이며 그들의 주요 근거지입니다. 그들을 도시에서 몰아내기는 어렵겠지만, 이 위협을 제거해야 합니다."
 libya_attack_ansar_al_sharia_in_derna: "§Y$STATE_396$§!을(를) 소탕한다"
 libya_attack_ansar_al_sharia_in_derna_desc: "§Y$STATE_396$§!은(는) [ASL.GetNameDef]의 주요 인력 공급원입니다. 미국에 따르면 해외에서 활동하는 리비아 이슬람 전투원 대다수가 이 도시 출신입니다. $STATE_395$을(를) 공략하기 위한 좋은 발판을 마련하려면 이곳을 소탕해야 합니다."
 libya_attack_ansar_al_sharia_in_derna_tt: "성공 확률은 §Y[CYR.GetNameWithFlag]의 충성도§!에 달려 있습니다. 현지인과의 관계를 개선할수록 $VICTORY_POINTS_1204$을(를) 소탕할 가능성이 높아집니다\n"
 libya_attack_ansar_al_sharia_in_ajdabiya: "와핫 유전을 장악한다"
 libya_attack_ansar_al_sharia_in_ajdabiya_desc: "[ASL.GetNameDef]이(가) $VICTORY_POINTS_1127$을(를) 통제하는 한, 와핫 유전의 석유는 어디로도 나갈 수 없습니다. 항구 도시를 되찾기 위한 군사 작전을 수행해야 합니다. 이는 $STATE_395$으로 향하는 길도 열어 줄 것입니다."
 libya_attack_ansar_al_sharia_in_ajdabiya_tt: "성공 확률은 §Y[CYR.GetNameWithFlag]의 충성도§!에 달려 있습니다. 현지인과의 관계를 개선할수록 $VICTORY_POINTS_1127$을(를) 소탕할 가능성이 높아집니다\n"
 libya_attack_ansar_al_sharia_in_kufra: "§Y$VICTORY_POINTS_1057$§!을(를) 보호한다"
 libya_attack_ansar_al_sharia_in_kufra_desc: "§Y$VICTORY_POINTS_1057$§! 마을은 $STATE_1100$의 유일한 주요 정착지입니다. 마을의 안전을 지키기 위해 그곳에 병력을 추가로 배치해야 합니다. 이슬람주의자들이 숨을 곳이 사막밖에 남지 않는다면 결국 해산할지도 모릅니다."
 libya_attack_ansar_al_sharia_in_sirte: "§Y$STATE_919$§!을(를) 돌파한다"
 libya_attack_ansar_al_sharia_in_sirte_desc: "$STATE_919$이(가) [ASL.GetName]의 통제 아래 있어서 리비아 서부와 동부 사이를 이동하는 능력이 심각하게 제한됩니다. 병력을 다시 연결하려면 이 지역에서 이슬람주의자들을 몰아내야 합니다."
 libya_attack_ansar_al_sharia_in_sirte_tooltip: "§Y[ASL.GetNameDef]§!이(가) 여전히 §Y$VICTORY_POINTS_6295$§!을(를) 통제하고 있으므로, §Y$STATE_919$§!에 대한 모든 공격에 §R-50% 불이익§!을 받습니다!!"
 libya_attack_ansar_al_sharia_in_sabha: "§Y$VICTORY_POINTS_6295$§!을(를) 되찾는다"
 libya_attack_ansar_al_sharia_in_sabha_desc: "$VICTORY_POINTS_6295$에 대한 지상 공격은 이슬람주의자들이 멀리서도 알아챌 것이므로 기습 공격을 수행해야 합니다. 우리 특수 부대와 공군이 함께 비행장에 직접 착륙하여 통제권을 되찾을 것입니다."
 libya_attack_ansar_al_sharia_in_sabha_tt: "성공 확률은 §Y[FEZ.GetNameWithFlag]의 충성도§!에 달려 있습니다. 현지인과의 관계를 개선할수록 $VICTORY_POINTS_6295$을(를) 소탕할 가능성이 높아집니다. §R공격이 실패하면 우리 공군이 비행장을 폭격하여 사용할 수 없게 만들 것이며, 최소한 이슬람주의자들을 후퇴시킬 수는 있습니다§!.\n"
 libya_operation_dignity_mission: "하프타르, 존엄 작전을 개시하다"
 libya_operation_dignity_mission_desc: "칼리파 하프타르를 비롯한 리비아 국민군의 유력 인사들은 우리 정부가 국내 이슬람주의자들에 맞서 아무 조치도 취하지 않는 데 불만을 품고 있습니다. 우리가 안사르 알샤리아를 리비아에서 몰아내지 못하면 하프타르가 직접 나설 것입니다..."
 libya_operation_dignity_mission_tooltip: "§Y[LBA_khalifa_haftar.GetName]§!이(가) 자신에게 충성하는 §Y$LBA.Nat_Autocracy_LNA$§!의 병사들을 동원하고, 이슬람주의자들을 스스로 격멸하기 위해 우리 정부를 규탄합니다."
 LBA_green_resistance_1: "녹색 저항"
 LBA_green_resistance_1_desc: "녹색 저항, 즉 카다피 충성파는 여전히 리비아에서 강력합니다. 현 독재자가 이용하는 녹색 저항은 계속 그들의 병력을 보강하는 데 도움이 됩니다.\n\n§R우리가 [Western_Autocracy_L], [Conservative_L], [Autocracy_L], [Nat_Populism_L], [Nat_Fascism_L] 중 어느 것에도 통치받지 않으면 이 국가 정신은 제거됩니다§!"
 LBA_green_resistance_2: "카다피 충성파"
 LBA_green_resistance_2_desc: "정부는 카다피 충성파를 숙청하는 대신 행정부와 군에 고용했으며, 그들의 충성이 값진 보수가 되기를 바라고 있습니다.\n\n§R우리가 [Western_Autocracy_L], [Conservative_L], [Autocracy_L], [Nat_Populism_L], [Nat_Fascism_L] 중 어느 것에도 통치받지 않으면 이 국가 정신은 제거됩니다§!"
 LBA_green_resistance_3: "구 체제의 잔재"
 LBA_green_resistance_3_desc: "The Libyan government is taking full advantage of the Green Resistance, or Gaddafi loyalism as it start building Libya in their own image.\n\n§RThis national spirit will be removed if we are not ruled by [Western_Autocracy_L], [Conservative_L], [Autocracy_L], [Nat_Populism_L] or [Nat_Fascism_L]§!"
 LBA_moderated_quran_and_sunnah: "완화된 꾸란과 순나"
 LBA_moderated_quran_and_sunnah_desc: "The ruling establishment has decided to sensor and moderate some of the more extreme views that people spread of the Quran and Sunnah, hoping to reduce the presence of more radical views.\n\n§RThis national spirit will be removed if we are not ruled by [Western_Autocracy_L], [Conservative_L], [Autocracy_L], [Nat_Populism_L] or [Nat_Fascism_L]§!"
 LBA_loyalist_purges: "충성파 숙청"
 LBA_loyalist_purges_desc: "카다피 충성파와 전 지지자들이 리비아 행정부에서 숙청되었습니다. 국민은 변화를 약속받았고 이를 환영합니다."
 LBA_ramadan_asswehly_remembrance: "라마단 아스웨흘리의 기억"
 LBA_ramadan_asswehly_remembrance_desc: "라마단 아스웨흘리는 트리폴리타니아 공화국의 창립 구성원 중 한 명이었습니다. 리비아가 민주주의로 향하면서 영웅들을 기립니다.\n\n§R선거가 없으면 이 국가 정신은 제거됩니다!§!"
 LBA_tribal_assembly_created: "부족 평의회"
 LBA_tribal_assembly_created_desc: "리비아는 부족 간 분쟁 해결과 정부의 남용 및 학대 가능성을 감시하는 임무를 맡은 부족 평의회를 설치했습니다.\n\n§R선거가 없으면 이 국가 정신은 제거됩니다!§!"
 LBA_tripolitania_elite_soldiers: "트리폴리타니아 정예군"
 LBA_tripolitania_elite_soldiers_desc: "트리폴리타니아 사람들이 신생 리비아군에 대거 모집되고 있습니다.\n\n§R[TRP.GetNameWithFlag]이(가) 존재하면 이 국가 정신은 제거됩니다§!"
 LBA_cyrenaican_oil_expertise: "키레나이카의 석유 전문 지식"
 LBA_cyrenaican_oil_expertise_desc: "리비아 정부는 키레나이카 사람들이 가진 석유 시추에 관한 모든 지식을 활용하고 있습니다.\n\n§R[CYR.GetNameWithFlag]이(가) 존재하면 이 국가 정신은 제거됩니다§!"
 LBA_fezzani_desert_expertise: "페잔 보급 카라반"
 LBA_fezzani_desert_expertise_desc: "리비아군은 페잔 사람들의 사막 이동 지식을 활용하여 병사들이 적은 식량과 물로 생존하도록 훈련시키고 있습니다.\n\n§R[FEZ.GetNameWithFlag]이(가) 존재하면 이 국가 정신은 제거됩니다§!"
 LBA_tribal_union: "부족 연합"
 LBA_tribal_union_desc: "리비아 정부는 부족 간의 차이를 자신들에게 유리하게 활용하여 국내의 분리주의 사상을 억제하는 데 성공했습니다.\n\n§R[TRP.GetNameWithFlag], [CYR.GetNameWithFlag] 또는 [FEZ.GetNameWithFlag]이(가) 존재하면 이 국가 정신은 제거됩니다§!"
 LBA_multiple_parties_in_cabinet: "다당 내각"
 LBA_multiple_parties_in_cabinet_desc: "긴장을 완화하기 위해 리비아 집권당은 여러 소규모 정당을 내각에 초대했습니다. 이로써 나라의 정치적 분열이 줄어들기를 기대합니다.\n\n선거가 없거나 우리가 다른 정당과 연립하지 않으면 이 국가 정신은 제거됩니다."
 LBA_guaranteed_freedom: "보장된 자유"
 LBA_guaranteed_freedom_desc: "새 리비아 정부는 민족, 인종, 성별에 관계없이 모든 국민에게 자유를 약속했습니다."
 LBA_private_agriculture_encouraged: "민간 농업 장려"
 LBA_private_agriculture_encouraged_desc: "정부는 소농과 지주들에게 소유지를 확대하고 더 많은 토지를 취득하도록 장려하고 있습니다."
 LBA_indian_workers: "인도인 노동자"
 LBA_indian_workers_desc: "나라의 낮은 인구를 보충하기 위해 인도인 이주 노동자들이 리비아 공장에서 일하도록 고용되었습니다.\n\n§R[RAJ.GetNameDef]이(가) 존재하지 않거나 우리가 그들과 전쟁 중이면 이 국가 정신은 제거됩니다.§!"
 LBA_swiss_financial_advisors: "스위스 금융 고문"
 LBA_swiss_financial_advisors_desc: "경제 성장을 최적화하도록 정부에 조언하기 위해 스위스 금융 고문들이 고용되었습니다.\n\n§R[SWI.GetNameDef]이(가) 존재하지 않거나 우리가 그들과 전쟁 중이면 이 국가 정신은 제거됩니다.§!"
 LBA_french_nuclear_support: "프랑스의 원자력 지원"
 LBA_french_nuclear_support_desc: "프랑스 에너지 기업들이 리비아가 독자적인 원자력 산업을 구축하는 길을 돕고 있습니다.\n\n§R[FRA.GetNameDef]이(가) 존재하지 않거나 우리가 그들과 전쟁 중이면 이 국가 정신은 제거됩니다.§!"
 LBA_gaddafist_military: "카다피주의 군대"
 LBA_gaddafist_military_desc: "리비아군은 과거 카다피 휘하의 군에서 복무했던 사람들로 가득합니다. 군은 그들의 경험을 활용할 수 있습니다.\n\n§R우리에게 $no_military$이(가) 있으면 이 국가 정신은 제거됩니다§!"
 LBA_free_officers_movement: "자유 장교단 운동"
 LBA_free_officers_movement_desc: "1969년과 마찬가지로, 리비아군 장교들이 부패한 통치자들을 전복했습니다.\n\n§R우리가 민족주의가 아니면 이 국가 정신은 제거됩니다§!"
 LBA_islamist_crackdown: "이슬람주의 단속"
 LBA_islamist_crackdown_desc: "정부는 샤리아나 이슬람 우월주의를 말하는 모든 정당이나 단체에 강경한 입장을 취했습니다.\n\n§R우리가 살라피주의를 따르거나 [Neutral_Muslim_Brotherhood_L]에게 통치받으면 이 국가 정신은 제거됩니다§!"
 LBA_islamist_cooperation: "이슬람주의 협력"
 LBA_islamist_cooperation_desc: "정부는 이슬람주의 민병대에 관대한 접근 방식을 취했으며, 일부 수준에서는 그들과 협력하기까지 합니다."
 LBA_turkish_drone_support: "튀르키예 드론 지원"
 LBA_turkish_drone_support_desc: "리비아 정부는 드론 비축분을 현대화하기 위해 튀르키예와 협력하고 있습니다.\n\n§R[TUR.GetNameDef]이(가) 존재하지 않거나 우리가 그들과 전쟁 중이면 이 국가 정신은 제거됩니다.§!"
 LBA_military_crackdown_modifier: "군사 단속"
 LBA_military_as_workforce_modifier: "군 노동력"
 LBA_military_as_security_modifier: "유전 추가 경비"
 LBA_special_economic_zone: "경제특구"
 LBA_minimum_wage_centralised: "최저임금 강제"
 LBA_minimum_wage_centralised_desc: "국내 소비를 촉진하고 사회 서비스에 대한 부담을 줄이기를 기대하며 정부가 최저임금 수준을 강제하고 있습니다."
 LBA_private_insurance_centralised: "민간 건강보험 제공"
 LBA_private_insurance_centralised_desc: "The healthcare system has been boosted with the introduction of privatised health insurance. This means the customer has to spend less on providing healthcare services but the people have to spend their money on private insurance.\n\n§RThis national spirit will be removed if we have $health_05$ or $health_06$§!"
 LBA_dinar_tied_to_dollar: "달러 연동 디나르"
 LBA_dinar_tied_to_dollar_desc: "The Libyan Dinar has been pegged to the US dollar in the hopes of making Libyan goods more favourable in foreign markets.\n\n§RThis national spirit will be removed if [USA.GetNameDef]doesn't exist§!"
 LBA_chinese_construction: "중국 건설 회사"
 LBA_chinese_construction_desc: "리비아 정부는 사회 기반 시설을 건설하기 위해 중국 건설 회사들을 고용했습니다.\n\n§R[CHI.GetNameDef]이(가) 존재하지 않거나 우리가 [CHI.GetNameDef]과(와) 전쟁 중이면 이 국가 정신은 제거됩니다§!"
 LBA_protected_middle_class: "보호받는 중산층"
 LBA_protected_middle_class_desc: "The Libyan government has decided to further the cause of the middle class, the people who comfortable amounts of money."
 LBA_protected_lower_class: "보호받는 하층민"
 LBA_protected_lower_class_desc: "리비아 정부는 나라의 육체 노동 대부분을 담당하는 사람들인 하층민의 이익을 증진하기로 결정했습니다."
 LBA_marxism_leninism_adopted: "마르크스-레닌주의 이념"
 LBA_marxism_leninism_adopted_desc: "The government has started adopting Marxist-Leninist policies in its day-to-day governance.\n\n§RThis national spirit will be removed if we are not ruled by [socialism_L], [Communist-State_L], [anarchist_communism_L], [Neutral_green_L], [neutral_Social_L] or [Neutral_Communism_L]§!"
 LBA_afrosocialism_adopted: "아프리카 사회주의 이념"
 LBA_afrosocialism_adopted_desc: "The government has started adopting Afrosocialist policies in its day-to-day governance.\n\n§RThis national spirit will be removed if we are not ruled by [socialism_L], [Communist-State_L], [anarchist_communism_L], [Neutral_green_L], [neutral_Social_L] or [Neutral_Communism_L]§!"
 LBA_eurocommunism_adopted: "유로코뮤니즘 이념"
 LBA_eurocommunism_adopted_desc: "The government has started adopting Eurocommunist policies in its day-to-day governance.\n\n§RThis national spirit will be removed if we are not ruled by [socialism_L], [Communist-State_L], [anarchist_communism_L], [Neutral_green_L], [neutral_Social_L] or [Neutral_Communism_L]§!"
 LBA_women_enfrachised: "여성 권한 강화"
 LBA_women_enfrachised_desc: "리비아 정부는 자국 여성의 권한 강화에 대한 입장을 취했습니다.\n\n§R우리가 살라피주의를 따르거나 [Neutral_Muslim_Brotherhood_L]에게 통치받으면 이 국가 정신은 제거됩니다§!"
 LBA_nordic_model_followed: "노르드 사회민주주의"
 LBA_nordic_model_followed_desc: "The Libyan government is trying to recreate the Nordic model of a welfare state in Libya.\n\n§RThis national spirit will be removed if we are not ruled by [socialism_L], [Communist-State_L], [anarchist_communism_L], [Neutral_green_L], [neutral_Social_L] or [Neutral_Communism_L]§!"
 LBA_workers_republic_created: "노동자 공화국"
 LBA_european_tech_companies: "유럽 기술 기업과의 협력"
 LBA_european_tech_companies_desc: "리비아는 기술 발전을 돕기 위해 유럽 기술 기업들과 협력하고 있습니다.\n\n§R우리가 EU 회원국과 전쟁 중이면 이 국가 정신은 제거됩니다§!"
 LBA_polygamy_allowed: "일부다처제 허용"
 LBA_polygamy_allowed_desc: "리비아는 인구 증가율을 높이기를 기대하며 자국에서 일부다처제를 허용했습니다.\n\n§R우리의 사회적 보수주의 - 정부 값이 50% 미만이면 이 국가 정신은 제거됩니다§!"
 LBA_ali_al_sallabi_sponsored: "알리 알살라비의 저서 후원"
 LBA_ali_al_sallabi_sponsored_desc: "리비아 정부는 이슬람에 관한 알리 알살라비의 저서를 공식적으로 지지했으며, 전 세계에 배포하는 것을 후원하고 있습니다."
 LBA_tuareg_militias_in_country: "투아레그 민병대"
 LBA_tuareg_militias_in_country_desc: "투아레그 민병대가 나라의 남서쪽 구석에서 활동하고 있습니다. 말리, 알제리, 니제르의 투아레그족이 전투에 합류하기 위해 국경을 넘고 있습니다. 표면적으로는 우리가 적을 물리치도록 돕고 있지만, 그들의 충성은 다른 곳에 있을 수도 있습니다."
 LBA_toubou_militias_in_country: "투부 민병대"
 LBA_toubou_militias_in_country_desc: "Tobuou militias are operating in the Southern parts of the country. While not that numerous, their military operations have reduced the stem of migrants from Central Africa."
 LBA_tribal_militias: "부족 민병대"
 LBA_tribal_militias_desc: "내전이 격화되고 나라의 치안이 악화되면서 점점 더 많은 부족이 부족원을 보호하거나 반군의 전쟁 수행을 지원하기 위해 동원되어 자체 민병대를 만들고 있습니다. 이들의 민병대는 우리 병력을 보강하지만, 반군이 나라를 통제하는 정도를 점점 줄이기 때문에 불확실성도 안겨 줍니다."
 LBA_jihadist_militias: "지하디스트 민병대"
 LBA_jihadist_militias_desc: "내전이 시작되면서 리비아 이슬람 투쟁 그룹은 국가 과도 위원회 아래 더 합법적인 조직으로 재편되었습니다. 그들은 더 온건하다고 주장하지만 지도자들조차 병사 다수가 알카에다와 연계되어 있음을 인정했습니다. 그들이 힘을 얻을수록 우리나라는 극단주의로 미끄러져 갑니다."
 LBA_islamist_militias: "이슬람주의 민병대"
 LBA_islamist_militias_desc: "카다피는 통치 기간 내내 많은 이슬람 세력을 억압했습니다. 이로 인해 반혁명 운동이 일어났으며, 많은 리비아인이 더욱 이슬람 중심의 통치 형태를 바라고 있습니다. 특히 카타르의 후원을 받는 무슬림 형제단이 이슬람주의 민병대 내에서 점점 더 큰 역할을 맡고 있습니다."
 LBA_secularist_militias: "세속주의 민병대"
 LBA_secularist_militias_desc: "Many of the militias under the National Transitional Council have their origin in the Libyan Armed Forces. Many of them fear that giving too much power to the Islamist will bring the destruction of Libya. As their power increases, the Armed Forces will be able to control the country more and more tightly."
 LBA_reformist_militias: "개혁주의 민병대"
 LBA_reformist_militias_desc: "리비아 내 일부 사람들은 나라가 서구식 민주주의로 바뀌기를 바랍니다. 그러나 이들은 소수입니다. 그들이 필요한 지지를 얻을 가능성은 낮지만, 그들의 존재는 우리 지지자들이 자신의 대의를 의심하게 만듭니다."
 LBA_military_desertion_government: "군 이탈"
 LBA_military_desertion_government_desc: "하루가 멀다 하고 병사들과 군 부대 전체가 리비아군에서 반군 측으로 넘어갔다는 보고를 받습니다. 병사들이 진지를 버리고 적에게 합류함으로써 진지를 그냥 잃을 수 있는 상황에서는 카다피 정부가 방어선을 유지하기가 어렵습니다."
 LBA_aftermath_of_the_civil_war: "내전의 여파"
 LBA_aftermath_of_the_civil_war_desc: "내전은 비교적 단기간에 끝났지만, 그래도 나라에 상당한 피해를 입혔습니다. 사회에 가장 큰 영향을 미친 것은 카다피 정권과 민병대의 해체입니다. 정권의 조직은 나라의 군 단위까지 촉수를 뻗고 있었기에 카다피 충성파를 새 공무원으로 교체하는 데는 시간이 걸릴 것입니다. 게다가 나라에는 여전히 여러 독립 민병대가 활동하고 있으며, 이들은 제거되거나 리비아 국민군에 통합되어야 합니다."
 LBA_shura_council_of_derna: "데르나 무자히딘 슈라 평의회"
 LBA_shura_council_of_derna_desc: "데르나의 현지 이슬람주의자들은 정부가 남긴 권력 공백을 메우기 위해 힘을 합쳐 도시를 통치하는 슈라 평의회를 구성했습니다. 데르나는 리비아에서 인구가 많은 도시 중 하나이며, 전 세계 리비아 지하디스트의 주요 인력 공급원 중 하나입니다."
 LBA_shura_council_of_ajdabiya: "아즈다비야 혁명가 슈라 평의회"
 LBA_shura_council_of_ajdabiya_desc: "아즈다비야의 현지 이슬람주의자들은 정부가 남긴 권력 공백을 메우기 위해 힘을 합쳐 도시를 통치하는 슈라 평의회를 구성했습니다. 아즈다비야의 통제권을 잃으면서 와핫 유전에서 석유를 수출하는 우리의 능력이 크게 줄었습니다."
 LBA_southern_insurgency: "쿠프라의 반란"
 LBA_southern_insurgency_desc: "Insurgents loyal to the Islamists in Benghazi, the Rafallah al-Sahati Brigade, is operating in Kufra and disrupting the local population there. They are not a serious threat, but their existence might provoke the local Toubou people to act."
 LBA_society_of_muslim_brothers: "무슬림 형제단"
 muslim_brotherhood_faction_member: "무슬림 형제단 회원국"
 muslim_brotherhood_faction_member_desc: "일반적으로 무슬림 형제단으로 알려진 무슬림 형제 협회는 범이슬람주의와 샤리아의 공동 법 적용을 신봉하는 정치·종교 단체입니다. 형제단을 지지하는 여러 국가가 자국의 이익을 더 잘 증진하기 위해 군사 동맹을 결성하기로 결정했습니다."
 muslim_brotherhood_faction_member_tt: "§Y$sunni$§! 국가에 영향력을 행사할 때:\n$foreign_influence_modifier$: §G+10.00%§!"
 muslim_brotherhood_faction_member_tt2: "§R세력 특수 규칙§!:\n-무슬림 형제단이 통치하는 국가만 이 세력에 가입할 수 있습니다"
 shadow_of_gaddafi: "카다피의 그늘 아래"
 marshall_of_libya: "Marshall Of Libya"
 defence_minister_of_libya: "국방부 장관"
 LBA_unit_leader_trait_tribal_commander: "부족 지휘관"
 LBA_unit_leader_trait_tribal_commander_desc: "이 지휘관은 국내 부족 민병대 중 한 곳을 지휘하며 경력을 시작해 국가 차원의 지휘관 자리에 올랐습니다. 점점 무법 상태가 되어 가는 나라에서 공동체를 지키기 위해 여러 부족이 자체 민병대를 조직하고 자금을 댔습니다."
 LBA_unit_leader_trait_jihadist_commander: "지하드주의 지휘관"
 LBA_unit_leader_trait_jihadist_commander_desc: "This commander started by leading Jihadists in and outside of Libya. With links to Al-Qaeda and the Libyan Islamic Fighting Group, this cmmander has seen their fair share of fighting around the globe."
 LBA_unit_leader_trait_islamist_commander: "이슬람주의 지휘관"
 LBA_unit_leader_trait_islamist_commander_desc: "This commander leads one the local militias with Islamist tendencies. Many communities have setup councils to handle local defence in the form of militias. As many in Libya are still conservative Muslims, many of these militias and councils drive for the implementation of Sharia law at least in some extent."
 LBA_unit_leader_trait_secularist_commander: "세속주의 지휘관"
 LBA_unit_leader_trait_secularist_commander_desc: "이 지휘관은 리비아 국민군과 깊이 연계되어 있습니다. 리비아 국민군의 많은 인사는 이슬람주의 세력이 설 자리가 없는 더 세속적인 리비아를 원합니다. 이 지휘관은 리비아 국민군의 자칭 지도자인 칼리파 하프타르와도 매우 가까울 가능성이 높습니다."
 LBA_unit_leader_trait_reformist_commander: "개혁주의 지휘관"
 LBA_unit_leader_trait_reformist_commander_desc: "This commander is a Libyan exilee who has returned home. Having an Western style education, the commander and the militias they lead would like Libya to be reformed in a Western style liberal democracy."
 LBA_khalifa_haftar_desc: "Khalifa Haftar started his career in the Libyan military, receiving training in Libya, the Soviet Union and Egypt. Haftar helped Muammar Gaddafi overthrow King Idris, after which he became the Chief of Staff for the Libyan military. Haftar commanded troops in the disastrous war against Chad, during which he was captured by Chadian forces and disawoved by Gaddafi. The United States flew Haftar and his captured soldiers into Zaire, where he founded an armed resistance group against Gaddafi. Eventually with the help of the CIA they found their way into the United States. In 1996, Haftar launched an uprising against Gaddafi in eastern Libya, but returned back to the US after it failed. After the fall of Gaddafi, he took control of the new Libyan armed forces, eventually climbing the ranks to an influential political position and de-facto leader of the country."
 LBA_organize_desert_trips_tt: "\n§R전쟁에 휘말리면§!"
 LBA_organize_desert_trips_tt_2: "§R국가 정신이 만료되고 더 이상 전쟁 중이 아니게 되면 이전의 보너스를 되돌려 받습니다. 여전히 전쟁 중이라면 부정적 변동치는 1년 더 지속됩니다.§!"
 LBA_end_of_gaddafi: "카다피의 종말"
 LBA_end_of_gaddafi_desc: "카다피가 전복되었으며 리비아 국민은 이제 자유롭게 자신의 길을 선택할 수 있습니다!"
 LBA_just_another_gaddafi: "또 다른 카다피"
 LBA_just_another_gaddafi_desc: "우리는 독재자 하나를 몰아내고 또 다른 독재자를 맞이하게 되었습니다. 리비아는 단순히 민주주의가 되도록 만들어진 나라가 아니며, 이는 우리 역사에서 분명히 알 수 있습니다. [ROOT.GetLeader]은(는) 카다피보다 더 나은 통치자가 될 것입니다!"
 LBA_just_another_gaddafi_tt: "친카다피 세력과 전쟁 중이 아닙니다"
 LBA_green_resistance: "녹색 저항"
 LBA_green_resistance_desc: "카다피는 사라졌지만 그의 추종자들은 사라지지 않았습니다. 그의 제3 국제 이론을 중심으로 새로운 운동이 형성되고 있습니다. 이 충성파들은 우리가 카다피를 위해 싸운다고 생각하는 한 기꺼이 우리의 지도를 따를 것입니다."
 LBA_employ_gaddafi_loyalists: "카다피 충성파 고용"
 LBA_employ_gaddafi_loyalists_desc: "행정부와 군대에는 여전히 카다피 정권 밑에서 일한 사람들이 가득합니다. 이 사람들은 여전히 우리에게 유용할 수 있으며, 순수한 충성심에서 기꺼이 낮은 급여를 받아들일 것입니다."
 LBA_moderate_islamism: "꾸란과 순나 온건화"
 LBA_moderate_islamism_desc: "이슬람의 가장 큰 문제는 가르침에 대한 사람들의 해석입니다. 이슬람은 리비아를 이루는 기본 요소 중 하나이므로 완전히 버릴 수는 없습니다. 그러나 사람들에게 꾸란과 순나의 더 온건한 버전을 묘사하고 가르칠 수는 있습니다."
 LBA_expand_tribes: "부족 확대"
 LBA_expand_tribes_desc: "리비아는 키레나이카, 트리폴리타니아, 페잔의 세 주요 부족으로 이루어져 있습니다. 그러나 우리 영토 안에는 많은 투부족과 투아레그족도 살고 있습니다. 이들 역시 세 주요 부족만큼 리비아인입니다. 이들에게는 자신들의 국가가 없으니 리비아를 그들의 나라로도 만들어 줍시다."
 LBA_expand_tribes_threat: "사하라에서의 리비아 팽창주의"
 LBA_maintain_territorial_integrity: "영토 보전 유지"
 LBA_maintain_territorial_integrity_desc: "리비아의 땅은 나눌 수 없습니다. 모든 분리주의 사상은 근절되어야 하며 잃어버린 모든 영토는 되찾아야 합니다."
 LBA_liberate_tuareg: "투아레그족 해방"
 LBA_liberate_tuareg_desc: "투아레그족은 사하라 서부의 자신들의 국가가 없는 유목 부족입니다. 이들을 리비아 국가로 통합해야 합니다."
 LBA_liberate_tuareg_tt: "§Y이웃 국가§!에 정당한 §Y투아레그§! 땅의 양도를 요구할 수 있습니다"
 LBA_liberate_toubou: "투부족 해방"
 LBA_liberate_toubou_desc: "투부족은 사하라 동부의 자신들의 국가가 없는 유목 부족입니다. 이들을 리비아 국가로 통합해야 합니다."
 LBA_liberate_toubou_tt: "§Y이웃 국가§!에 정당한 §Y투부§! 땅의 양도를 요구할 수 있습니다"
 LBA_ties_with_nato: "나토와의 유대"
 LBA_ties_with_nato_desc: "우리가 그다지 민주적이지는 않지만, 서방 국가들은 강권 통치자들과 협력해 온 역사가 있습니다. 그들은 자국을 극단주의자들로부터 안전하게 지키기 위해 우리의 힘과 군대가 필요합니다."
 LBA_ties_with_csto: "CSTO와의 유대"
 LBA_ties_with_csto_desc: "서방은 신뢰할 수 없습니다. 애초에 카다피를 제거한 것은 그들이며, 그들이 우리를 노리고 오는 것은 시간문제입니다. 우리는 동쪽의 러시아가 우리의 친구가 되도록 눈을 돌려야 합니다."
 LBA_new_libyan_nation: "새로운 리비아 국가"
 LBA_new_libyan_nation_desc: "새로운 리비아 국가가 탄생했습니다! 투아레그족, 투부족과 함께 리비아의 정체성은 이제 완성되었습니다."
 LBA_control_the_media: "언론 통제"
 LBA_control_the_media_desc: "사람들은 카다피가 사라졌다는 이유만으로 이제 정부를 자유롭게 비판할 수 있다고 생각합니다. 이는 터무니없습니다. 사람들에게 무엇을 생각해야 하는지 말해 주는 것은 우리여야 합니다!"
 LBA_arms_deals: "국제 무기 거래"
 LBA_arms_deals_desc: "국가를 보호하려면 보급이 잘 갖춰진 군대가 필요합니다. 우리의 동맹국이 첨단 장비를 제공해 줄 수 있으며 우리가 직접 개발하느라 시간을 낭비할 필요가 없습니다."
 LBA_echoes_of_the_past: "과거의 메아리"
 LBA_echoes_of_the_past_desc: "제1차 세계 대전 이후 트리폴리타니아 공화국은 이탈리아로부터 분리하려 했으나 결국 실패했습니다. 이들은 중동 최초의 민주 국가였습니다. 우리는 이제 다시 한번 리비아에 진정한 평등한 민주주의를 가져올 기회를 얻었습니다."
 LBA_purge_gaddafi_loyalists: "카다피 충성파 숙청"
 LBA_purge_gaddafi_loyalists_desc: "행정부는 카다피 밑에서 기꺼이 일했던 사람들로 가득합니다. 그들을 쫓아내고 우리 국민에게 잘못을 저지른 자들을 체포해야 합니다. 이는 새 출발을 하고 민주주의를 확보하기 위한 필수적인 조치입니다."
 LBA_memory_of_ramadan_asswehly: "라마단 아스웨흘리를 기억하며"
 LBA_memory_of_ramadan_asswehly_desc: "라마단 아스웨흘리는 트리폴리타니아 공화국의 창건자이자 왈리(총독) 중 한 명이었습니다. 그는 공화국을 지키기 위해 이탈리아인들과 싸웠습니다. 공화국 자체는 네 명의 왈리가 통치하는 4두 체제로 운영되어 파벌 간 세력 균형을 보장했습니다."
 LBA_soothe_tribal_tension: "부족 간 긴장 완화"
 LBA_soothe_tribal_tension_desc: "모든 사람은 평등하게 태어났습니다. 부족들을 서로 이간시키는 것은 어리석은 일입니다. 대신 각 부족의 강점을 우리에게 유리하게 활용해야 합니다."
 LBA_tribal_assembly: "부족 평의회 구성"
 LBA_tribal_assembly_desc: "부족 간 분쟁을 해결하고 모두가 평등하게 대우받도록 보장하는 정부 기관을 만들어야 합니다."
 LBA_invest_in_tripolitania: "트리폴리타니아 투자"
 LBA_invest_in_tripolitania_desc: "트리폴리타니아는 국가의 경제 중심지입니다. 우리의 첨단 기술 센터 대부분이 이곳에 있습니다. 이곳에 투자하면 트리폴리타니아인들에게 부를 가져다줄 것입니다."
 LBA_invest_in_cyrenaica: "키레나이카 투자"
 LBA_invest_in_cyrenaica_desc: "키레나이카는 우리 석유의 주요 공급원이며 가장 중요한 교통 거점 중 하나입니다. 이 지역의 해양 노하우를 활용하여 조선 기업에 투자해야 합니다."
 LBA_invest_in_fezzan: "페잔 투자"
 LBA_invest_in_fezzan_desc: "페잔은 매우 외진 곳이지만 광물 매장지가 많은 지역입니다. 더 많은 매장지를 찾기 위해 일부 발굴 작업에 투자할 수 있습니다."
 LBA_tripolitanian_soldiers: "트리폴리타니아 전사들"
 LBA_tripolitanian_soldiers_desc: "트리폴리타니아는 우리 지역 중 가장 인구가 많습니다. 그 인구에서 가장 유능한 병사들을 가려내는 것이 합리적입니다."
 LBA_cyrenaican_oil: "키레나이카 석유"
 LBA_cyrenaican_oil_desc: "키레나이카인들은 석유 생산에 전문성을 갖고 있습니다. 그들의 전문성을 활용해 더 나은 석유 시추 방법을 찾아야 합니다."
 LBA_fezzani_caravans: "페잔 대상"
 LBA_fezzani_caravans_desc: "페잔인은 오랫동안 사하라 횡단 무역에 참여해 왔습니다. 그들은 사막에서 생존하는 방법에 대한 전문성이 풍부합니다. 그들의 기술을 활용해 병사들이 가혹한 환경에서 생존하도록 훈련시켜야 합니다."
 LBA_tribal_unification: "부족 통합"
 LBA_tribal_unification_desc: "우리는 모든 부족이 안전하다고 느낄 수 있는 균형 잡힌 체계를 만들었습니다. 이제 리비아의 분리주의를 걱정할 필요가 없습니다."
 LBA_free_libya: "자유 리비아"
 LBA_free_libya_desc: "카다피 정권의 잔재를 최대한 빨리 제거하기 위해 리비아에서 사회적, 정치적, 경제적 자유를 창출하는 급속한 과정을 시작해야 합니다."
 LBA_emergency_privatisation: "긴급 민영화"
 LBA_emergency_privatisation_desc: "우리는 자금이 필요합니다. 국영석유공사가 통제하는 유전의 상당 부분을 민간 기업에 매각해야 합니다."
 LBA_emergency_privatisation_tt: "국유화 수준: §Y-20%§!"
 LBA_multi_party_cabinet: "다당제 내각"
 LBA_multi_party_cabinet_desc: "The end of Gaddafi has caused numerous political parties and organisation to rise up, all vying for power. If we are to keep stability, we must include a multitude of voices in our cabinet."
 LBA_guarantee_freedoms: "헌법적 자유 보장"
 LBA_guarantee_freedoms_desc: "리비아 국민은 자유를 제대로 느껴 본 적이 없습니다. 우리 아래에서는 누구도 감당하지 못할 만큼의 자유가 있을 것입니다."
 LBA_attract_private_oil_companies: "민간 석유 회사 유치"
 LBA_attract_private_oil_companies_desc: "리비아는 석유 매장량이 풍부하지만 이를 채굴할 기술이나 사업 환경이 없습니다. 리비아에 투자할 민간 석유 회사를 유치해야 합니다."
 LBA_allow_private_farming: "민간 영농 허용"
 LBA_allow_private_farming_desc: "이슬람 상속법은 식량을 효과적으로 공급할 수 없는 소규모 농장의 조각보를 만들어 냈습니다. 개인이 서로 농장을 매입할 수 있도록 허용하여 더 크고 효율적인 농장이 운영될 수 있게 해야 합니다."
 LBA_freedom_of_conscience: "양심의 자유"
 LBA_freedom_of_conscience_desc: "누구도 종교 때문에 박해받아서는 안 됩니다. 이슬람이 우리 유산의 일부이므로 많은 법을 이슬람에 기반하는 것이 중요하지만, 다른 종교 집단을 차별해서는 안 됩니다."
 LBA_free_prisoners: "억울한 죄수 석방"
 LBA_free_prisoners_desc: "이전 정부는 단지 의견 때문에 너무 많은 사람을 투옥했습니다. 이들은 석방되어 다시 사회에 참여할 수 있어야 합니다."
 LBA_dismantle_noc: "국영석유공사 해체"
 LBA_dismantle_noc_desc: "The National Oil Corporation is an iffecient lumbering machine that only acted as a money-generator for the old regime. We must dismantle the whole system and break apart the company to smaller pieces."
 LBA_dismantle_noc_tt: "§Y석유 국유화§! 메커니즘이 비활성화됩니다"
 libya_noc_dismantled: "§Y국영석유공사§!가 해체되었습니다"
 LBA_approach_india: "[RAJ.GetName] 접근"
 LBA_approach_india_desc: "[RAJ.GetName]은(는) 냉전 시기 우리의 핵심 파트너였지만 관계가 악화되었습니다. 관계를 재건하기 위해 다시 한번 접근해야 합니다."
 LBA_approach_switzerland: "[SWI.GetName] 접근"
 LBA_approach_switzerland_desc: "더 자유주의적인 정치인과 인권 운동가 상당수가 망명 생활을 [SWI.GetName]에서 보냈습니다. 이 위대한 민주주의의 모범과 더 긴밀한 관계를 구축하는 것은 당연한 일입니다."
 LBA_approach_france: "[FRA.GetName] 접근"
 LBA_approach_france_desc: "[FRA.GetName]은(는) 우리와 식민지 과거를 공유하지 않음에도 항상 리비아에 큰 관심을 가져 왔습니다. 프랑스인들은 카다피에 대한 반대를 매우 분명히 해 왔으므로 우리를 도울 것이라고 믿을 수 있습니다."
 LBA_hire_indian_workers: "[RAJ.GetAdjective] 노동자 고용"
 LBA_hire_indian_workers_desc: "많은 걸프 국가들은 자국 노동력이 충분하지 않아 인도 출신의 외국인 노동자를 대거 고용합니다. 경제적 잠재력을 더 빠르게 높이기 위해 우리도 그렇게 해야 합니다."
 LBA_hire_swiss_advisors: "[SWI.GetAdjective] 금융 고문 고용"
 LBA_hire_swiss_advisors_desc: "[SWI.GetAdjective] 은행은 전 세계에 알려져 있습니다. 우리 경제를 운영하는 데 도움을 요청해야 합니다."
 LBA_hire_french_energy_advisors: "[FRA.GetAdjective] 에너지 기업 활용"
 LBA_hire_french_energy_advisors_desc: "[FRA.GetName]은(는) 원자력 에너지 분야의 선도국입니다. 자체 원자력 발전소를 건설하는 데 프랑스 기업의 지원을 받아야 합니다."
 LBA_libyan_national_army: "리비아 국민군"
 LBA_libyan_national_army_desc: "정치인들은 리비아 국민을 보호하는 데 실패했습니다. 이제 그들의 일을 대신하는 것은 군의 몫입니다."
 LBA_rely_on_gaddafists: "카다피주의 군부에 의존"
 LBA_rely_on_gaddafists_desc: "군 대부분은 카다피에게 충성했던 사람들로 가득합니다. 수십 년의 경험을 가진 그들을 제거하는 것은 합리적이지 않습니다."
 LBA_call_back_haftar: "하프타르의 부상"
 LBA_call_back_haftar_desc: "칼리파 하프타르는 리비아-차드 전쟁 당시 대령으로, 차드군에 포로로 잡혔습니다. 카다피에게 외면당한 그와 동료 병사들은 미국에 의해 자이르로 공수되었고 CIA의 도움으로 결국 미국으로 건너갔습니다. 하프타르는 수십 년간 카다피에 반대해 왔으며, 이제 카다피가 사라진 지금 군을 장악하기 위해 돌아올 수 있습니다."
 LBA_legacy_of_the_free_officers: "자유 장교단의 유산"
 LBA_legacy_of_the_free_officers_desc: "자유 장교단 운동은 카다피가 리비아 왕정을 전복하기 위해 이끈 운동입니다. 국민은 외세의 꼭두각시이자 나라의 석유 부를 남용하는 정권에 지쳐 있었습니다. 우리는 이제 같은 일을 해냈으며, 리비아가 다시는 외세의 영향 아래 놓이지 않도록 해야 합니다."
 LBA_no_room_for_islamists: "이슬람주의자를 위한 자리는 없다"
 LBA_no_room_for_islamists_desc: "이슬람은 리비아의 근간이지만 이슬람주의자들은 그렇지 않습니다. 그들은 종교를 자신들의 필요에 맞게 왜곡하려 합니다. 그들에게 어떤 관용도 베풀어서는 안 됩니다."
 LBA_limited_cooperation: "제한적 협력"
 LBA_limited_cooperation_desc: "현재로서는 우리가 동맹을 가려서 고를 수 없다는 것이 현실입니다. 우리 병력을 강화하기 위해 여러 이슬람주의 민병대와 어느 정도 협력할 수 있습니다. 나중에 그들을 정리하면 됩니다."
 LBA_improved_training: "개선된 훈련"
 LBA_improved_training_desc: "리비아군의 상태는 끔찍합니다. 카다피 정권은 일반 병사를 훈련시키거나 최신 전략 발전을 따라가는 데 시간을 많이 쓰지 않았습니다. 병사들을 위한 훈련을 실시해야 합니다."
 LBA_expand_al_saiqa: "알사이카 확대"
 LBA_expand_al_saiqa_desc: "The Al-Saiqa is a Libyan special forces unit made up of paratroopers, paramilitary unis and commandos. We should expand the unit to be larger."
 LBA_expand_al_saiqa_tt: "§Y$VICTORY_POINTS_11954$§!에 §Y특수 부대§! 한 개가 창설됩니다"
 LBA_establish_military_zones: "군사 구역 설정"
 LBA_establish_military_zones_desc: "리비아의 각 지역을 통제하려면 각자의 총독이 있는 군사 구역을 설정해야 합니다."
 LBA_approach_turkey: "[TUR.GetName] 접근"
 LBA_approach_turkey_desc: "최근 몇 년간 [TUR.GetName]은(는) 중동에서 더 적극적인 역할을 맡고 있습니다. 그들은 이 지역에서 우호적인 정부를 찾고 있으며, 우리는 분명 그런 정부입니다."
 LBA_approach_russia: "[SOV.GetName] 접근"
 LBA_approach_russia_desc: "[SOV.GetName]은(는) 오랫동안 서방에 반대해 왔습니다. 리비아가 이런 처지에 놓인 것은 서방의 잘못입니다. 더 나은 리비아를 건설하기 위해 [SOV.GetName]와(과) 협력해야 합니다."
 LBA_acquire_turkish_drones: "[TUR.GetAdjective] 드론"
 LBA_acquire_turkish_drones_desc: "튀르키예인들은 뛰어난 드론 기술을 보유하고 있습니다. 드론 생산에 그들의 도움을 요청해야 합니다."
 LBA_acquire_russian_weapons: "[SOV.GetName]에 무기 요청"
 LBA_acquire_russian_weapons_desc: "우리가 사용하는 무기 대부분은 [SOV.GetName]에서 옵니다. 군대가 더 잘 싸울 수 있도록 무장시키기 위해 추가 장비를 요청해야 합니다."
 LBA_military_exercises: "군사 훈련"
 LBA_military_exercises_desc: "참모진이 전장에서 더 잘 작전할 수 있도록 적성을 향상시키기 위해 모의 전쟁 훈련을 실시해야 합니다"
 LBA_factory_mobilisation: "긴급 동원"
 LBA_factory_mobilisation_desc: "제조 기반 일부를 신속히 군사용으로 전환해야 합니다. 재정적으로 타격이 될 수 있지만 필요한 일입니다."
 LBA_mobilise_the_tribes: "부족 민병대에 의존"
 LBA_mobilise_the_tribes_desc: "여러 부족을 동원해 우리를 위해 싸우게 해야 합니다. 이들은 훈련이 잘 되어 있지 않겠지만 우리의 모든 공백을 메울 만큼 충분히 모을 수 있습니다."
 LBA_mobilise_the_tribes_tripolitania_tt: "§Y민병대 3개 여단§!이 §Y트리폴리타니아§!에서 동원됩니다"
 LBA_mobilise_the_tribes_cyrenaica_tt: "§Y민병 2개 여단§!이 §Y키레나이카§!에서 동원됩니다"
 LBA_mobilise_the_tribes_fezzan_tt: "§Y차량화 민병 1개 대대§!가 §Y페잔§!에서 동원됩니다"
 LBA_employ_mercenaries: "용병 고용"
 LBA_employ_mercenaries_desc: "싸움을 우리 국민에게만 맡길 수는 없습니다. 외국의 정예 용병을 고용해야 합니다."
 LBA_employ_mercenaries_tt: "§Y고정된 특수 부대 1개 여단§!이 §Y[ROOT.Capital.GetName]§!에서 고용됩니다"
 LBA_the_libyan_elite: "리비아의 엘리트"
 LBA_the_libyan_elite_desc: "Libya should be ruled by its higher up. The people who know how to run a business, and a country. What's good for us is bound to be good for Libya as well."
 LBA_begin_centralisation: "중앙집권 강화"
 LBA_begin_centralisation_desc: "효과적인 국가를 만들려면 수도 지역이 가진 통제력을 높여야 합니다."
 LBA_begin_centralisation_tt: "§Y중앙집권을 강화하면 이 갈래의 모든 중점이 더 강력해지지만 비용도 더 늘어납니다!§!"
 LBA_begin_decentralisation: "중앙집권 완화"
 LBA_begin_decentralisation_desc: "정부 운영 업무의 일부를 지방 위원회에 위임하는 것이 최선입니다."
 LBA_begin_decentralisation_tt: "§Y중앙집권을 완화하면 이 갈래의 모든 중점이 덜 강력해지지만 비용도 줄어듭니다!§!"
 LBA_increased_centralization_tooltip: "국가 중점 §Y$LBA_begin_centralisation$§!을(를) 완료한 경우:\n"
 LBA_decreased_centralization_tooltip: "국가 중점 §Y$LBA_begin_decentralisation$§!을(를) 완료한 경우:\n"
 LBA_build_infrastructure: "인프라 투자"
 LBA_build_infrastructure_desc: "카다피 정권 아래에서 도로는 처참한 상태로 방치되었습니다. 우리나라의 인프라 수준을 끌어올려야 합니다. 좋은 도로는 건실한 경제의 기반입니다."
 LBA_create_special_economic_zones: "경제특구 조성"
 LBA_create_special_economic_zones_desc: "We should create special economic zones in some areas of Libya. These zones would have relaxed regulation, which would give incentives to for foreign companies to come to Libya."
 LBA_introduce_minimum_wage: "최저임금 도입"
 LBA_introduce_minimum_wage_desc: "리비아에는 최저임금이 정해져 있지 않아 노동자들이 아주 낮은 임금을 받을 수 있습니다. 어떤 형태로든 최저임금을 시행해야 합니다. 이는 사람들이 빈곤에서 벗어나도록 돕고 사회 서비스의 부담을 덜어 줄 것입니다. 기업 부문에는 다소 영향을 주겠지만, 큰 틀에서 보면 그만한 가치가 있을 것입니다."
 LBA_attract_foreign_investment: "외국인 투자 유치"
 LBA_attract_foreign_investment_desc: "기업 환경이 적절히 갖추어졌으니, 외국 기업을 초청하여 우리나라에 투자하도록 해야 합니다."
 LBA_friends_in_high_places: "고위층의 친구들"
 LBA_friends_in_high_places_desc: "우리의 사업 인맥을 활용하면 리비아를 기업 친화적인 나라로 바꿔 나갈 수 있습니다. 대기업에 조금 더 힘을 실어 주면 우리에게 더 큰 이윤으로 돌아올 것입니다."
 LBA_private_insurance: "민간 건강보험 도입"
 LBA_private_insurance_desc: "국가가 제공하는 서비스와 함께 운영될 민간 건강보험 제도를 도입해야 합니다. 이렇게 하면 재정 부담의 일부를 민간 계약업체와 국민에게 넘길 수 있습니다. 물론 국민의 가처분 소득(과세 대상 소득)은 줄어들 것입니다."
 LBA_approach_usa: "[USA.GetName]에 접근"
 LBA_approach_usa_desc: "[USA.GetNameDef]은(는) 자유 시장 국가가 무엇을 이룰 수 있는지 보여주는 대표적인 사례입니다. 그들과 더 가까운 관계를 맺으면 우리도 그와 같은 낙원을 건설할 수 있을 것입니다."
 LBA_tie_dinar_to_dollar: "디나르를 달러에 고정"
 LBA_tie_dinar_to_dollar_desc: "Pegging our own money to the dollar would allow our economy to become more stable and follow the US. With a fixed exchange rate, good produced in Libya are a better investment on the global market. However, because our economy is relatively weak compared to the US, imports will be more expensive to our consumers and companies."
 LBA_approach_china: "[CHI.GetName]에 접근"
 LBA_approach_china_desc: "중국은 부상하는 강국이며 최근 아프리카에 더욱 적극적인 관심을 보이고 있습니다. 그들과 좋은 관계를 쌓고 그들의 산업 기반을 활용해야 합니다."
 LBA_employ_chinese_construction_companies: "중국 건설사 고용"
 LBA_employ_chinese_construction_companies_desc: "[CHI.GetName]은(는) 아프리카 전역에서 인프라 사업을 활발히 추진하고 있습니다. [CHI.GetAdjective] 건설사를 고용하여 우리의 인프라에 투자하도록 해야 합니다."
 LBA_national_democracy: "민족 민주주의"
 LBA_national_democracy_desc: "민족 민주주의는 가난한 이들을 돌보고, 국가가 외세의 간섭에서 자유로우며, 지도자가 국민의 동의를 얻어 통치하는 이념입니다."
 LBA_protect_the_lower_class: "하층 계급 보호"
 LBA_protect_the_lower_class_desc: "하층 계급, 즉 공장 노동자와 농민은 모든 산업 국가의 근간입니다. 이들이 자본주의 체제 아래에서 바닥으로 내몰리지 않도록 모든 노력을 다해야 합니다."
 LBA_protect_the_middle_class: "중산층 보호"
 LBA_protect_the_middle_class_desc: "리비아에는 진정한 산업 역량이 없으며, 우리 경제는 석유 수송과 상업 위에 세워져 있습니다. 그러므로 우리나라에 돈을 가져다주는 사무직 노동자와 항만 노동자, 곧 중산층을 보호해야 합니다."
 LBA_absolute_national_independence: "절대적 민족 독립"
 LBA_absolute_national_independence_desc: "We should not be subject to any foreign power. Libyan need to have the autonomy to make up their own minds."
 LBA_give_power_to_central_committee: "중앙위원회에 권력 부여"
 LBA_give_power_to_central_committee_desc: "당 중앙위원회가 국가 권력의 대부분을 쥐어야 하며, 적어도 국정에 매우 강한 영향력을 행사해야 합니다."
 LBA_empower_the_noc: "NOC 강화"
 LBA_empower_the_noc_desc: "카다피는 리비아의 석유 문제에서 충분히 나아가지 못했습니다. 국영 석유 공사가 우리 석유 매장량을 다른 나라의 손에서 되찾아 장악하는 힘을 키워야 합니다."
 LBA_empower_the_noc_tt: "국유화 수준: §Y+15%§!"
 LBA_improve_infrastructure: "도로 개선"
 LBA_improve_infrastructure_desc: "국가에 좋은 도로가 있는 것은 중요합니다. 그렇지 않으면 국민이 경제 활동에 참여할 수 없습니다."
 LBA_adopt_marxism_leninism: "마르크스-레닌주의 채택"
 LBA_adopt_marxism_leninism_desc: "마르크스-레닌주의는 오늘날 세계에 남아 있는 공산주의의 주류 형태입니다. 프롤레타리아가 이끄는 국가를 건설함으로써 노동자를 해방하고 자본주의에 맞서 싸울 수 있습니다."
 LBA_return_to_afrosocialism: "아프리카 사회주의로의 회귀"
 LBA_return_to_afrosocialism_desc: "공산주의자들이 말하는 계급 투쟁은 아프리카에 존재하지 않습니다. 아프리카에서는 부족의 유산 덕분에 사회주의가 우리가 하는 모든 일에 내재되어 있습니다. 아프리카의 유산과 정체성을 장려하고, 아프리카인을 위한 아프리카를 건설해야 합니다."
 LBA_shift_to_eurocommunism: "유로코뮤니즘으로의 전환"
 LBA_shift_to_eurocommunism_desc: "리비아의 역사적인 공산주의자 중 다수는 이탈리아계였으며, 이탈리아에서 유로코뮤니즘은 크게 성공했습니다. 유로코뮤니즘은 사회주의에 대해 더 온건하고 반동구적인 접근을 취하며, 전통적인 공산주의보다 중산층과 다양한 신사회운동을 더 적극적으로 포용합니다."
 LBA_ties_to_italy: "이탈리아와의 유대"
 LBA_ties_to_italy_desc: "The [Communist-State_L] was founded by Italian immigrants, and many leftist organisations have spent their exile in Italy. This gives us a strong connection to the Italian lefist circles."
 LBA_approach_the_eu: "EU에 접근"
 LBA_approach_the_eu_desc: "유럽 연합은 우리에게 중요한 사업 파트너입니다. 우리 석유 수출의 대부분이 그곳으로 향하며, 통합이 더 진전되면 경제를 크게 확장할 수 있습니다."
 LBA_secularise_the_state: "국가의 세속화"
 LBA_secularise_the_state_desc: "이슬람은 리비아의 통치에 지나치게 강한 영향을 미쳐 왔습니다. 종교적 요소를 우리 제도에서 분리해야 합니다."
 LBA_womens_rights: "여성 권리 강화"
 LBA_womens_rights_desc: "리비아의 이슬람 전통은 우리나라에서 벌어지는 여성 억압의 토대입니다. 여성들이 국가를 위해 열성적으로 일하는 노동자가 되도록 장려해야 합니다."
 LBA_establish_workers_republic: "노동자 공화국 수립"
 LBA_establish_workers_republic_desc: "리비아의 노동자들은 모두 힘을 합쳐 자본가 부르주아로부터 자유로운 국가를 세워야 합니다."
 LBA_follow_the_nordic_model: "북유럽 모델 도입"
 LBA_follow_the_nordic_model_desc: "북유럽 국가들은 포괄적인 복지와 의료를 대가로 사람들이 기꺼이 세금을 내는 제도를 만들어 냈습니다. 시민들의 삶을 향상시키기 위해 이 방식을 따라야 합니다."
 LBA_european_high_tech: "유럽 기술 확보"
 LBA_european_high_tech_desc: "유럽은 첨단 기술 산업으로 유명합니다. 일부 유럽 기업과 협력하여 우리 자체의 기술 산업을 키워야 합니다."
 LBA_the_brotherhood: "형제단"
 LBA_the_brotherhood_desc: "The Muslim Brothehood is a pan-Islamic religious and political organisation, wich members in every Islamic country. Now that they are in power in Libya, the country can be returned back to its Islamic roots."
 LBA_establish_sharia_law: "샤리아 법 수립"
 LBA_establish_sharia_law_desc: "Sharia law should be basis of our constitution and laws. Islam gives us the best tools for moral guidance of the nation."
 LBA_rehabilitate_lifg_fighters: "LIFG 전투원 사회 복귀"
 LBA_rehabilitate_lifg_fighters_desc: "리비아 이슬람 전투 그룹의 조직원들은 수감되어 있거나 망명 중입니다. 그들에게 손을 내밀어 사회로 복귀하도록 해야 합니다."
 LBA_scholars_of_brotherhood: "형제단 학자들"
 LBA_scholars_of_brotherhood_desc: "형제단은 지역 사회에 적극적으로 관여합니다. 그들은 자선 활동을 하고 사람들을 교육합니다. 형제단의 힘을 빌려 글을 읽지 못하는 국민이 읽는 법을 배우도록 도와야 합니다."
 LBA_allow_polygamy: "일부다처제 허용"
 LBA_allow_polygamy_desc: "이슬람의 일부로서, 남성은 여러 명의 아내를 둘 수 있어야 합니다. 이는 대가족과 행복한 가정을 보장합니다."
 LBA_works_of_al_sallabi: "알살라비의 저작 보급"
 LBA_works_of_al_sallabi_desc: "Ali al-Sallabi is a brilliant Libyan scholar and writer. While Gaddafi was in power, he spent his years in exile studying in Saudi Arabia, Sudan and Qatar. He is a strong beliver in Islam and he has written multiple books on it and its history. We should sponsor his works to reach an even wider audience."
 LBA_ties_to_saudi_arabia: "사우디아라비아와의 유대"
 LBA_ties_to_saudi_arabia_desc: "우리 형제단의 학자와 지도자 중 많은 수가 한때 사우디아라비아에서 공부했습니다. 사우디가 형제단의 열렬한 지지자는 아니지만, 이슬람에 대한 우리의 헌신만큼은 높이 평가합니다."
 LBA_request_religious_funding: "종교 자금 요청"
 LBA_request_religious_funding_desc: "사우디는 다른 무슬림 국가의 모스크와 마드라사에 기꺼이 자금을 지원합니다. 우리도 그들의 지원을 요청해야 합니다."
 LBA_military_pact_with_qatar: "[QAT.GetName]과(와) 군사 협정"
 LBA_military_pact_with_qatar_desc: "[QAT.GetNameDef] is one of the main supporters of the Muslim Brotherhood. They support the struggle of Muslim all across the Middle East, and it would make sense if we joined our forces."
 LBA_military_pact_with_qatar_tt: "[QAT.GetNameWithFlag] is more likely to accept if:\n§G-They have a high opinion of us\n-The Saudis have been taken over by Al-Qaeda\n-They are our or our subject's neighbour§!\n\n[QAT.GetNameWithFlag] is less likely to accept if:\n§R-They a have low opinion of us\n-We are Salafist\n-We are at war§!"
 LBA_expand_the_alliance: "동맹 확대"
 LBA_expand_the_alliance_desc: "형제단에 호의를 가진 다른 나라들이 있습니다. 이 나라들도 포함하도록 우리 동맹을 확대해야 합니다."
 LBA_expand_the_alliance_trigger_tt: "초청할 수 있는 국가가 하나 이상 있습니다"
 LBA_expand_the_alliance_tt: "They are more likely to accept if:\n§G-They have a high opinion of us\n-They are our or our subject's neighbour§!\n\nThey are less likely to accept if:\n§R-They a have low opinion of us\n-We are Salafist\n-We are at war§!"
 LBA_use_brotherhood_influence: "형제단의 영향력 활용"
 LBA_use_brotherhood_influence_desc: "형제단은 여러 무슬림 국가에 회원을 두고 있습니다. 그들을 활용하여 현지 정치에 대한 영향력을 더 키워야 합니다."
 LibyaFocus.109.t: "영토를 요구하는 [FROM.GetNameDef]"
 LibyaFocus.109.d: "[FROM.GetNameDef] 정부는 우리 영토에 거주하는 투아레그족이 리비아 민족의 일부여야 한다고 주장했습니다. 그들은 이제 우리 정부에 해당 영토의 통제권을 넘기라고 요구하고 있습니다."
 LibyaFocus.109.a: "그들의 요구를 승인한다"
 LibyaFocus.109.b: "그런 일은 결코 없을 것이다"
 LibyaFocus.110.t: "요구를 받아들인 [FROM.GetNameDef]"
 LibyaFocus.110.d: "[FROM.GetNameDef] 정부가 우리의 요구에 동의했습니다. 이는 리비아 민족의 위대한 승리입니다!"
 LibyaFocus.110.a: "놀랍군"
 LibyaFocus.111.t: "우리의 요구를 거부한 [FROM.GetNameDef]"
 LibyaFocus.111.d: "[FROM.GetNameDef] 정부가 영토에 대한 우리의 요구를 거부했습니다. 그들은 우리 민족을 계속 억압하려는 것으로 보입니다."
 LibyaFocus.111.a: "그들은 응당한 대가를 치르게 될 것이다"
 LibyaFocus.112.t: "영토를 요구하는 [FROM.GetNameDef]"
 LibyaFocus.112.d: "[FROM.GetNameDef] 정부는 우리 영토에 거주하는 투부족이 리비아 민족의 일부여야 한다고 주장했습니다. 그들은 이제 우리 정부에 해당 영토의 통제권을 넘기라고 요구하고 있습니다."
 LibyaFocus.112.a: "그들의 요구를 승인한다"
 LibyaFocus.112.b: "그런 일은 결코 없을 것이다"
 LibyaFocus.113.t: "요구를 받아들인 [FROM.GetNameDef]"
 LibyaFocus.113.d: "[FROM.GetNameDef] 정부가 우리의 요구에 동의했습니다. 이는 리비아 민족의 위대한 승리입니다!"
 LibyaFocus.113.a: "놀랍군"
 LibyaFocus.114.t: "우리의 요구를 거부한 [FROM.GetNameDef]"
 LibyaFocus.114.d: "[FROM.GetNameDef] 정부가 영토에 대한 우리의 요구를 거부했습니다. 그들은 우리 민족을 계속 억압하려는 것으로 보입니다."
 LibyaFocus.114.a: "그들은 응당한 대가를 치르게 될 것이다"
 LibyaFocus.115.t: "동맹을 요청하는 [FROM.GetNameDef]"
 LibyaFocus.115.d: "[FROM.GetNameDef]이(가) 무슬림 형제단을 규합하기 위한 새로운 동맹을 만들었습니다. 형제단과의 관계 때문에 그들은 우리에게 가입을 요청했습니다. 수락해야 할까요?"
 LibyaFocus.115.a: "물론이지"
 LibyaFocus.116.t: "형제단에 가입한 [FROM.GetNameDef]"
 LibyaFocus.116.d: "[FROM.GetNameDef]이(가) 무슬림 형제단에 가입하라는 우리의 초청을 수락했습니다."
 LibyaFocus.116.a: "함께하면 더 강하다!"
 LibyaFocus.117.t: "초청을 거부한 [FROM.GetNameDef]"
 LibyaFocus.117.d: "[FROM.GetNameDef]이(가) 무슬림 형제단에 가입하라는 우리의 초청을 거부했습니다."
 LibyaFocus.117.a: "그들은 진정한 신자가 아니다"
 LibyaFamily.75.t: "무아마르 카다피의 죽음"
 LibyaFamily.75.d: "반군이 점점 더 많은 지역을 장악하면서 위대한 지도자 무아마르 카다피가 더 안전한 장소로 이동하는 것이 필수적이었습니다. 그러나 그의 차량 행렬은 (알지 못하는 사이에) 반군의 매복 공격을 받았습니다. 카다피는 공격 후 숨으려 했으나 반군에게 붙잡혔습니다. 그는 반군에게 구타와 고문을 당한 끝에 부상으로 숨졌습니다. 살해 장면의 영상과 사진이 인터넷 전역에 퍼졌습니다. 이것이 끝인가?"
 LibyaFamily.75.d.airstrike: "반군이 점점 더 많은 지역을 장악하면서 위대한 지도자 무아마르 카다피가 더 안전한 장소로 이동하는 것이 필수적이었습니다. 그러나 새로운 장소로 이동하던 중 차량 행렬이 나토의 공습을 받았고 곧바로 반군 병력의 공격을 받았습니다. 카다피는 공격 후 숨으려 했으나 반군에게 붙잡혔습니다. 그는 반군에게 구타와 고문을 당한 끝에 부상으로 숨졌습니다. 살해 장면의 영상과 사진이 인터넷 전역에 퍼졌습니다. 이것이 끝인가?"
 LibyaFamily.75.a: "우리는 결코 항복하지 않을 것이다!"
 LibyaFamily.76.t: "반군에게 붙잡힌 무함마드"
 LibyaFamily.76.d: "As part of his duty towards his father, Muhammad was helping organise the defenses of the Libyan Army in a small town. During a rebel attack, his HQ was overrun. Reporterdly Muhammad tried to surrender to the rebels, who didn't want to give him any favours. After torture and beatings, he was executed by the rebel commander. [LRB.GetNameDef] has stated that their goal was to capture Muhammad, not to kill him, and that the local commander was acting on his own accord."
 LibyaFamily.76.a: "살인자들!"
 LibyaFamily.77.t: "투석형으로 숨진 사이프 알이슬람"
 LibyaFamily.77.d: "In a small town, Saif al-Islam was doing rounds inspecting his father's troops, promising them better weapons and equipment. Unbeknownst to him however, the local unit had already defected to the rebel side. He was quickly captured and detained by the rebels. Saif managed to escape but quickly found himself cornered with no where to go. In a last ditch attempt to save his skin, he held a speech, appealing to the ex-Gaddafi soldiers. He stated that the war was created by the West, and caused by tribal factions and islamists acting on their own agendas, drunken and drugged. It seems that one of the soldiers found this insulting and hurled a stone towards Saif. Others quickly joined, and before long Saif was in a pool of blood, dead."
 LibyaFamily.77.a: "살인자들!"
 LibyaFamily.78.t: "자살 공격으로 사망한 알사아디 카다피"
 LibyaFamily.78.d: "Al-Saadi was spending time in one of Gaddafi's strongholds, meant to be the final stands for the regime. While there, he was targeted by a suicide attack. A rebel pilot with the name of Muhammad Mokhtar Osman crashed his jet right into the building. While Al-Saadi apparently survived the initial crash, he later died somewhere in the building due to the fires caused by the attack. It is unclear how the jet managed to get so close without being shot down."
 LibyaFamily.78.a: "왜 아무도 격추하지 않았단 말인가?!"
 LibyaFamily.79.t: "처형된 무타심 카다피"
 LibyaFamily.79.d: "무타심은 반군이 최근 점령한 도시 가운데 한 곳에서 후퇴하고 있었으나, 다음 군 전초 기지로 가는 도중 차량 행렬이 반군에게 가로막혔습니다. 무타심은 권총으로 맞서 싸우려 했지만 목에 부상을 입고 반군에게 항복했습니다. 그와 포로를 붙잡은 자들 사이에 언쟁이 시작되었고, 이들은 신께 용서를 구하기 위해 샤하다를 외우라고 요구했습니다. 그러나 무타심은 대신 아프리카의 주술 부적인 목걸이를 어루만졌습니다. 포로를 붙잡은 자들은 '이것이 쿠란이다, 마지막이자 처음의 것이다'라고 말하며 거듭 요구했지만 무타심은 계속 부적을 쥐고 기도했습니다. 분노한 그들은 그를 총으로 쏘고 목걸이를 불태웠습니다."
 LibyaFamily.79.a: "이런 자들이 '자유로운' 리비아를 위해 싸운다니..."
 LibyaFamily.80.t: "굶어 죽은 한니발 카다피"
 LibyaFamily.80.d: "한니발 카다피는 몇 주 전 어느 날 밤 호텔에서 납치되었습니다. 납치는 레바논에서 리비아까지 먼 길을 온 시아파 무장 세력이 계획한 것이었습니다. 무장 세력 대변인은 1978년 리비아에서 실종된 시아파 성직자이자 아말 운동의 지도자 무사 알사드르를 살해한 자들을 찾고 있다고 말했습니다. 한니발은 실종 당시 겨우 두 살이었으므로 관여했을 수가 없지만, 납치범들에게는 별로 중요하지 않은 듯했습니다. 한니발에게서 어떤 정보도 얻어 내지 못하자 그들은 결국 그를 사막에 버려 헤매게 했습니다. 그는 인근에서 어떤 마을도 찾지 못했고 끝내 갈증과 굶주림으로 숨졌습니다. 이후 그 지역을 정찰하던 군 헬리콥터가 그를 발견했습니다."
 LibyaFamily.80.a: "뭐라고?!"
 LibyaFamily.81.t: "스스로 목숨을 끊은 아이샤 카다피"
 LibyaFamily.81.d: "As the rebels approached the government held compound where Ayesha was currently in, her mind was full of panic. She had been told by her bodyguards that the area around the compound had been surrounded. The bodyguards advised her that perhaps the best course of action would be to simply surrender to the rebels. However, Ayesha was terrified of what would be done to her if she was captured. In an act of desperation, she ordered her bodyguards to lock her and her children in one of the compounds buildings and set it on fire. The bodyguards reluctantly did as they were told, and set the building on fire. They then surrendered to the rebels, explaining what had happened."
 LibyaFamily.81.a: "뭐라고?!"
 LibyaFamily.82.t: "공습으로 사망한 사이프 알아랍"
 LibyaFamily.82.d: "사이프 알아랍이 무아마르 카다피의 손주 세 명과 함께 나토의 공습으로 사망했습니다. 나토는 폭격한 건물이 지휘통제소로 쓰이고 있었고 지하 벙커가 있었다고 주장합니다. 하지만 누가 아이들을 군사 벙커에 두겠습니까? 이는 나토의 개들이 리비아 민간인을 겨냥한 또 하나의 공격이며, 그들은 리비아의 가장 위대한 영웅 중 한 명을 순교하게 했습니다."
 LibyaFamily.82.a: "어떻게 이럴 수가 있는가?"
 LibyaFamily.83.t: "교전 중 전사한 하미스 카다피"
 LibyaFamily.83.d: "While organising defences on the frontline, Khamis has been killed in a firefight with the rebels. His position were aggressively assaulted by the rebels, trying to push him and his men out of a key position. When trying to relocate to a better position, Khamis was hit and wounded. He was capable of continuing the fighting for several minutes before bein shot again, this time in the head."
 LibyaFamily.83.a: "그는 전사였다"
 LibyaCivilWar.15.t: "리비아 혁명"
 LibyaCivilWar.15.d: "Attempts by Gaddafi to stifle the protests have failed. Violence has escalated to high levels, military units have defected and a new coalition of opposition figthters have taken control of Benghazi. The situation can now only be solved on the battlefield."
 LibyaCivilWar.15.a: "이 '반군'은 CIA 요원에 불과하다. 그들을 파괴하라!"
 LibyaCivilWar.15.b: "카다피 타도! 독재자 타도!"
 LibyaCivilWarContent.1.t: "와르팔라 부족 민병대"
 LibyaCivilWarContent.1.d: "와르팔라 부족은 트리폴리타니아에 거주하며, 트리폴리와 리비아에서 단일 부족이 거주하는 유일한 도시인 바니 왈리드를 중심으로 모여 있습니다. 내전으로 인한 폭력의 위협 때문에 이 부족은 우리 군을 강화하기 위해 일부 구성원을 동원했습니다."
 LibyaCivilWarContent.1.a: "그들의 지지에 감사한다"
 LibyaCivilWarContent.2.t: "[ROOT.GetLeader]에게 지지를 표명한 카다파 부족"
 LibyaCivilWarContent.2.d: "카다파는 카다피 가문의 부족입니다. 이들은 주로 시르테 시 인근에 거주하며, 이 도시가 트리폴리나 벵가지에 필적하는 수준으로 성장할 수 있었던 것은 정권과의 연결 덕분입니다. 카다파는 언제나 카다피에 충성하는 지지자였으며, 우리 군에 추가 전투원을 후원했습니다."
 LibyaCivilWarContent.2.a: "그들의 충성에 감사한다"
 LibyaCivilWarContent.3.t: "정권에 맞서 봉기하는 베르베르인"
 LibyaCivilWarContent.3.d: "The Libyan border with Tunisia is home a small community of Berbers. While under Gaddafi's regime, their rights were heavily supressed, and Gaddafi himself denied the existence of a Berber ethnicity and called it a 'product of colonialism'. They have now decided to rise up against Gaddafi in the hopes of seeing a better future for themselves."
 LibyaCivilWarContent.3.a: "그들을 더 나은 방식으로 대우할 것이다"
 LibyaCivilWarContent.4.t: "서부의 베르베르 반군"
 LibyaCivilWarContent.4.d: "The Libyan border with Tunisia is home a small community of Berbers. While under Gaddafi's regime, their rights were heavily supressed, and Gaddafi himself denied the existence of a Berber ethnicity and called it a 'product of colonialism'. They have now decided to rise up against Gaddafi and pledge loyalty to the rebels in the hopes of seeing a better future for themselves."
 LibyaCivilWarContent.4.a: "그들은 실존하지도 않는다!"
 LibyaCivilWarContent.5.t: "알무자브라 부족 민병대"
 LibyaCivilWarContent.5.d: "알무자브라 부족은 서부 리비아의 자발 알가르비 지구 인근에 거주합니다. 이 부족의 저명한 구성원인 [LBA_abu_bakr_yunis_jabr.GetName] 장군이 부족 일부를 동원하여 우리 편에 합류하도록 독려했습니다."
 LibyaCivilWarContent.5.a: "그들의 지지에 감사한다"
 LibyaCivilWarContent.6.t: "마가르하 부족 민병대"
 LibyaCivilWarContent.6.d: "마가르하 부족은 와르팔라 부족 다음으로 리비아에서 두 번째로 큰 부족입니다. 이 부족은 본래 페잔 출신이지만 많은 구성원이 시르테 시와 기타 해안 지역으로 이주해 정착했습니다. 와르팔라 부족과 더불어 마가르하 대부분은 카다피에게 크게 충성해 왔습니다. 이제 구성원 일부가 우리를 지원하기 위해 전투원을 동원했습니다."
 LibyaCivilWarContent.6.a: "그들의 지지에 감사한다"
 LibyaCivilWarContent.7.t: "핫사우나 부족 민병대"
 LibyaCivilWarContent.7.d: "The Hassawna tribe lives in Fezzan. The area that they inhabit provide 60 percent of Libya's water. Worried about the possible vandalism and take over wells in the area, the tribe has provided us with some of their fighters to keep their lands secure."
 LibyaCivilWarContent.7.a: "그들의 지지에 감사한다"
 LibyaCivilWarContent.8.t: "전투에 합류한 [TUA.TUA_ali_kanna.GetName]"
 LibyaCivilWarContent.8.d: "[TUA.TUA_ali_kanna.GetName]은(는) 카다피 치하에서 특수 마가위르 여단을 지휘했습니다. 이 여단은 니제르와 말리 출신 투아레그 지원병으로 구성되었습니다. [TUA.TUA_ali_kanna.GetName]은(는) 다수의 투아레그 병사를 이끌고 리비아에 들어왔으며, 우리 편에서 싸우겠다고 밝혔습니다."
 LibyaCivilWarContent.8.a: "도움에 감사한다!"
 LibyaCivilWarContent.9.t: "우리와 동맹을 맺은 TFSL"
 LibyaCivilWarContent.9.d: "리비아 구국 투부 전선, 즉 TFSL이 카다피에 맞서 무기를 들었습니다. 이들은 몇 년 전부터 카다피 정권에 맞서 저강도 분쟁을 조직해 왔으며, 마침내 보다 공개적으로 싸울 수 있게 되었습니다."
 LibyaCivilWarContent.9.a: "일단 받아들이도록 하자"
 LibyaCivilWarContent.10.t: "파르잔 부족 민병대"
 LibyaCivilWarContent.10.d: "The Farjan tribe mainly lives west of Adjabiya, though members of the tribe can be found everywhere on the Libyan coast. The bad security situation has motivated the tribe to organise a local militia to help us fight our enemies."
 LibyaCivilWarContent.10.a: "그들의 지지에 감사한다"
 LibyaCivilWarContent.11.t: "미수라타 부족 민병대"
 LibyaCivilWarContent.11.d: "동부 리비아에서 가장 규모가 크고 영향력 있는 부족인 미수라타(미스라타 시의 이름이 유래한 부족)가 우리를 돕기 위해 병사 일부를 동원했습니다. 이 부족은 벵가지와 데르나 시에서 매우 강한 영향력을 가지고 있으며, 내전으로 그 영향력을 잃을까 우려하고 있습니다."
 LibyaCivilWarContent.11.a: "그들의 지지에 감사한다"
 LibyaCivilWarContent.12.t: "아바이다트 부족 민병대"
 LibyaCivilWarContent.12.d: "토브룩의 주요 부족 가운데 하나인 아바이다트 부족은 약 15개 하위 부족의 집합체입니다. 부족 결속을 도모하기 위해 이 부족은 우리의 전투를 돕고자 여러 하위 부족의 병사들로 이루어진 연합 부대를 창설했습니다."
 LibyaCivilWarContent.12.a: "그들의 지지에 감사한다"
 LibyaCivilWarContent.13.t: "시작된 혁명!"
 LibyaCivilWarContent.13.d: "카다피 타도! 독재자 타도! 우리 국민이 폭군에 맞서 봉기했으며 리비아 혁명이 시작될 수 있습니다! 우리는 적의 수도로 진군하여 자유로운 나라를 세워야 합니다!"
 LibyaCivilWarContent.13.a: "리비아를 위하여!"
 LibyaCivilWarContent.13.tooltip: "§Y전쟁이 길어질수록 더 많은 민병대, 사설 군대, 반군 집단이 전투에 합류할 것입니다. 나라에 대한 통제권을 유지하고 앞으로의 추가 분쟁을 막으려면 적을 신속히 물리쳐야 합니다!§!"
 LibyaCivilWarContent.14.t: "봉기하는 리비아 국민"
 LibyaCivilWarContent.14.d: "The Zionists and the CIA have done it, they have hired foreign mercenaries to rouse up the people to fight against our regime. Oh how the misguided and innocent will suffer for this. We must strike quickly and cut of the head of the snake before more people fall to the devil's temptation."
 LibyaCivilWarContent.14.a: "리비아를 위하여!"
 LibyaCivilWarContent.14.tooltip: "§Y전쟁이 길어질수록 반군은 더 많은 병력을 동원할 수 있습니다. 시간이 지나면 우리는 수적으로 열세에 놓일 가능성이 높습니다§!"
 LibyaCivilWarContent.15.t: "아부 살림 순교자 여단 결성"
 LibyaCivilWarContent.15.d: "리비아 이슬람 투쟁단은 수십 년간 카다피에 반대해 왔습니다. 이제 그에 대한 민중 봉기가 일어나자 이 단체는 리비아 이슬람 운동으로 이름을 바꾸고, 압델하킴 알하시디 휘하에 아부 살림 순교자 여단이라는 전투 여단을 창설했습니다. 단체는 보다 민주적인 접근을 추구한다고 말하지만, 지도부는 소속 전투원들이 알카에다와 연계되어 있음을 공공연히 인정했습니다. 이들이 정말로 개혁을 추구하는지는 시간이 말해 줄 것입니다."
 LibyaCivilWarContent.15.a: "불길한 예감이 든다..."
 LibyaCivilWarContent.15.tooltip: "§Y[Caliphate_L]§!은(는) §Y$LBA.Caliphate_reform$§!(으)로 불리게 됩니다\n"
 LibyaCivilWarContent.16.t: "트리폴리 여단 창설"
 LibyaCivilWarContent.16.d: "A Libyan exilee from Ireland, Mahdi al-Harati, together with other exilees from English speaking countries have formed what is being called the Tripoli Revolutionaries Brigade. Most of their recruits come from the Tripoli area, hence the name of the unit. The brigade has received extensive training from Qatari special forces. Since the outbreak of the war, Qatar has taken a more active interest in the country, most likely in the hopes of spreading the influence of the Muslim Brotherhood in the region."
 LibyaCivilWarContent.16.a: "마침내 우리 군에도 정예 부대가 생겼다"
 LibyaCivilWarContent.17.t: "진탄 여단 창설"
 LibyaCivilWarContent.17.d: "In the town of Zintan near Tripoli, revolutionaries have banded together as the Zintan Revolutionaries' Military Council and formed a unit to fight against Gaddafi. They are led by Osama al-Juwaili, an ex-captain of the Libyan army. Based on our intelligence reports, people flocking under their banners in droves."
 LibyaCivilWarContent.17.a: "마침내 우리 군에도 정예 부대가 생겼다"
 LibyaCivilWarContent.18.t: "국가해방군 내부의 파벌주의"
 LibyaCivilWarContent.18.d: "When we started the revolution, many militias and volunteer brigades had to be brought under a single chain of command, and thus we created the National Liberation Army. We had nominated an ex-Gaddafi general as its chief-of-staff due to their expertise. However, Khalifa Haftar, an exilee and a military commander from the United States has returned and self-claimed command over the army. Our official position is still in support of the ex-Gaddafi general, but Haftar is showing more and more promise on the battlefield. But a man who comes from nowhere and claims command of an army is an ambitious man, and he might be eager to claim command of the whole country if he gets the chance."
 LibyaCivilWarContent.18.a: "경쟁 관계를 용납할 여유가 없다!"
 LibyaCivilWarContent.19.t: "암살당한 [ROOT.GetName]!"
 LibyaCivilWarContent.19.d: "우리가 국가해방군 참모총장으로 지명했던 [ROOT.GetName]이(가) 암살당했습니다! 어떻게 된 일인지는 분명하지 않지만, 그의 시신은 다른 장교 두 명과 함께 [FROM.capital.GetCapitalVictoryPointName] 외곽에서 총에 맞고 불태워진 채 발견되었습니다. 카다피에 대한 배신 때문에 친카다피 공격자들이 그를 쏘았다는 이들도 있습니다. 그러나 카다피 치하에서 한 행위 때문에 지하디스트 민병대원들이 그를 처형하는 모습을 보았다는 이들도 있습니다. 어느 쪽이든 새 참모총장을 선출해야 합니다. 하프타르 장군이 적임일 수 있으나, 그렇게 하면 그의 힘만 더 키워 줄 뿐입니다."
 LibyaCivilWarContent.19.a: "하프타르가 최선의 선택이다!"
 LibyaCivilWarContent.19.b: "다른 사람이 나을지도 모른다"
 LibyaCivilWarContent.19.tooltip: "§Y이로써 하프타르가 훗날 우리 정부를 약화시킬 능력이 줄어듭니다!§!"
 LibyaCivilWarContent.20.t: "새로운 순교자 여단"
 LibyaCivilWarContent.20.d: "A new group of Jihadists has come together form a military unit. These 'Martyrs' Brigades' fight for an Islamic Libya, and many of the fighters have strong links to Al-Qaeda or other extremist organisations. We must defeat the government quickly before our country is overrun with potential terrorists."
 LibyaCivilWarContent.20.a: "이들은 도대체 어디서 계속 나오는 것인가?"
 LibyaCivilWarContent.20.tooltip: "§Y[ROOT.capital.GetName]§!에 §Y지하디스트 부대§!를 창설합니다\n"
 LibyaCivilWarContent.21.t: "진탄 여단의 새로운 동맹"
 LibyaCivilWarContent.21.d: "새로운 민병대 집단이 진탄 여단의 깃발 아래 합류했습니다. 진탄 여단은 서서히 이 나라에서 가장 강력한 민병대가 되어 가고 있으며, 우리가 조심하지 않으면 그들이 통제권을 장악하려 들지도 모릅니다."
 LibyaCivilWarContent.21.a: "왜 아무도 우리 편이 아닌가?"
 LibyaCivilWarContent.21.tooltip: "§Y[ROOT.capital.GetName]§!에 §Y이슬람주의 부대§!를 창설합니다\n"
 LibyaCivilWarContent.22.t: "국가해방군 신병 모집"
 LibyaCivilWarContent.22.d: "국가해방군이 필요에 따라 민병대 여단 하나를 추가로 창설했습니다. 군 지휘부는 주로 장래에 보다 세속적인 리비아를 바라는 전직 카다피 휘하 장교들로 구성되어 있습니다."
 LibyaCivilWarContent.22.a: "군대의 힘이 갈수록 강해진다"
 LibyaCivilWarContent.22.tooltip: "§Y[ROOT.capital.GetName]§!에 §Y세속주의 부대§!를 창설합니다\n"
 LibyaCivilWarContent.23.t: "친서방 민병대 훈련"
 LibyaCivilWarContent.23.d: "리비아인 다수는 보다 이슬람 중심적인 국가를 바라지만, 일부는 보다 서방 지향적인 정부를 원합니다. 서방의 특수부대와 교관의 도움으로 소규모 전문 민병대가 훈련을 마쳤습니다. 이들은 이제 카다피와 싸울 준비가 되었습니다."
 LibyaCivilWarContent.23.a: "서방이 우리를 굴복시키려는 것인가?"
 LibyaCivilWarContent.23.tooltip: "§Y[ROOT.capital.GetName]§!에 §Y개혁주의 부대§!를 창설합니다\n"
 LibyaCivilWarContent.24.t: "내전 승리!"
 LibyaCivilWarContent.24.d: "카다피가 패배했고 우리는 마침내 폭군에게서 자유로워졌습니다! 이제 국가과도위원회는 합법적인 정부로의 이행을 시작해야 합니다. 수많은 민병대와 무장 단체를 통합해야 합니다. 또한 장래에 누가 리비아를 통치할지 결정할 선거를 조직해야 합니다."
 LibyaCivilWarContent.24.a: "리비아의 미래를 위하여!"
 LibyaCivilWarContent.24.b: "선거? 그럴 생각은 없다"
 LibyaCivilWarContent.24.tooltip: "§Y1년 후에 선거를 실시합니다§!"
 LibyaCivilWarContent.25.t: "벵가지를 장악한 안사르 알샤리아"
 LibyaCivilWarContent.25.d: "Ansar al-Sharia is a global jihadist organisation. During the civil war, a local branch was created in Libya and slowly the group has been gaining power. Yesterday, a massive column of Ansar al-Sharia appeared in Benghazi. With almost two hundred pickup trucks and other heavy equipment, the group gathered around the Tahrir Square demanding Sharia law to be established and the plans for elections to be cancelled as 'un-Islamic'. The group has setup checkpoints in the city, and sent soldiers to guard major administrative buildings and service providers such as hospitals. They have already announced plans to establish Sharia courts and engage in Da'wah, or charity, for the local population in order to gain support."
 LibyaCivilWarContent.25.a: "대체 어디서 튀어나온 것인가?"
 LibyaCivilWarContent.25.tooltip: "§Y안사르 알샤리아§!가 §Y$STATE_395$§!을(를) 장악합니다\n"
 LibyaCivilWarContent.26.t: "데르나 무자헤딘 슈라 위원회 결성"
 LibyaCivilWarContent.26.d: "[ROOT.LBA_abdel_hakim_al_hasidi.GetName] created the Abu Salim Martyrs Brigade from ex-LIFG members to fight against Gaddafi. Shortly after the civil war, [ROOT.LBA_abdel_hakim_al_hasidi.GetName] started focusing more on politics, rather than leading the militia. This allowed one of the senior commanders of the militia, Salim Derby, to wrestle effective control of it. Derby has now defected along with his unit, and taken control of the city of Derna in Eastern Libya together with the Jaysh al-Islam militia group. They have dubbed themselves the Shura Council of Mujahideen in Derna. Similar to Ansar al-Sharia in Benghazi, the group has started implementing Sharia law in the city. They have also allied themselves with the group in Benghazi. Eastern Libya has been the main source of Islamists fighters in the country, and it seems like there is no end to them."
 LibyaCivilWarContent.26.a: "그들을 믿지 말았어야 했다"
 LibyaCivilWarContent.26.tooltip1: "To better represent the various group of Islamists under their wing, §YAnsar al-Sharia§! has created the §YShura Council of Benghazi Revolutionaries§!. Their goal is now to create similar councils in other parts of the country\n"
 LibyaCivilWarContent.26.tooltip2: "§Y아부 살림 순교자 여단§!이 §Y[ASL.GetNameDef]§!(으)로 이탈합니다\n"
 LibyaCivilWarContent.27.t: "이슬람주의자들의 손에 넘어간 $VICTORY_POINTS_1127$"
 LibyaCivilWarContent.27.d: "[ASL.GetNameDef]이(가) 해안 도시 $VICTORY_POINTS_1127$(으)로 영향력을 확대했습니다. 이 도시는 와핫 유전의 석유를 수출하고 정제하는 핵심 거점 가운데 하나입니다. 벵가지에서와 마찬가지로 이슬람주의자들은 엄격하고 열렬하게 샤리아 법을 시행하고 있습니다."
 LibyaCivilWarContent.27.a: "이 병폐를 막을 방법은 없는가?"
 LibyaCivilWarContent.28.t: "라팔라 알사하티 여단 결성"
 LibyaCivilWarContent.28.d: "A new Islamist militia has been formed in Southern Libya. Made up of members of the 17 February Martyrs' Brigade, the Rafallah al-Sahati Brigade has started operting in $STATE_1100$. While they number less than a thousand, they are causing great concern to the local Toubou population."
 LibyaCivilWarContent.28.a: "우리가 정말로 그들을 신경 써야 하는가?"
 LibyaCivilWarContent.29.t: "[ASL.GetNameDef]에 동조한 $STATE_919$"
 LibyaCivilWarContent.29.d: "$STATE_919$ 지역은 카다피 정권의 주요 지지 기반이었습니다. 카다피 정권이 무너지면서 많은 병사, 관료, 행정가들이 입은 옷 한 벌만 가진 채 고향으로 돌아가야 했습니다. 이러한 소외감으로 인해 이들은 새 정부에 점점 더 적대적이 되었습니다. 상황은 이제 악화되어, $VICTORY_POINTS_4047$ 마을에 큰 영향력을 가진 친카다피 민병대가 [ASL.GetNameDef]에 충성을 선언했습니다."
 LibyaCivilWarContent.29.a: "카다피를 제거한 것만으로는 부족했단 말인가?"
 LibyaCivilWarContent.30.t: "[ASL.GetNameDef]의 $VICTORY_POINTS_6295$ 점령"
 LibyaCivilWarContent.30.d: "A contingent of [ASL.GetNameDef] yesterday moved a large convoy of troops from $STATE_919$ to $VICTORY_POINTS_6295$. On their arrival, they took control of town and its airfield, and reportedly some of the local militias defected to them. $VICTORY_POIINTS_6295$ is an important military outpost, and while [ASL.GetNameDef] don't have an air force of their own, controlling the airfield allows them to use smaller planes for recoinnaissance. This makes counter-attacking the town a difficult, and our military high command is recommending an aerial assault on the town."
 LibyaCivilWarContent.30.a: "그 비행장이 정말로 필요한가?"
 LibyaCivilWarContent.30.tooltip: "§Y[ASL.GetNameDef]이(가) 비행장을 장악하고 있는§! 한 §Y$STATE_919$§!에 대한 공격은 훨씬 더 어려워집니다!"
 LibyaCivilWarContent.31.t: "공직에 선출된 [ROOT.LBA_abdel_hakim_al_hasidi.GetName]"
 LibyaCivilWarContent.31.d: "Since opening our country for democracy, the [Caliphate_L] has ran several candidates in local elections. Now the leader of the Abu Salim Martyrs Brigade, [ROOT.LBA_abdel_hakim_al_hasidi.GetName], has been elected for a local office in Derna. As he takes office, he will leave most of the management of the brigade to their second-in-command, Salim Derby."
 LibyaCivilWarContent.31.a: "민주주의의 작동"
 LibyaCivilWarContent.31.b: "그는 여전히 전장에서 필요하다"
 LibyaCivilWarContent.32.t: "국방장관 지명"
 LibyaCivilWarContent.32.d: "리비아 국군을 재건하고 있으므로 국방장관을 지명해야 합니다. 최상의 효과를 얻으려면 직무 수행에 필요한 야전 경험을 갖춘 우리 장군 가운데 한 명을 선택해야 합니다."
 LibyaCivilWarContent.32.a: "아마도..."
 LibyaCivilWarContent.32.b: "혹은 어쩌면..."
 LibyaCivilWarContent.33.t: "지휘관 납치"
 LibyaCivilWarContent.33.d: "One of our military commanders has been abducted by a militia operating in our country. They are now demanding ransom for their release. We could pay the random, but this would only validate the militia. We could also just ignore the demands and the commander will most likely be released by their supporters. We could also simply send our special forces to rescue the commander, but this has some risks."
 LibyaCivilWarContent.33.a: "그냥 몸값을 지불한다"
 LibyaCivilWarContent.33.b: "그들의 지지자들이 알아서 처리할 것이다"
 LibyaCivilWarContent.33.c: "특수부대를 투입하라!"
 LibyaCivilWarContent.34.t: "전쟁 범죄 혐의로 수배된 지휘관"
 LibyaCivilWarContent.34.d: "One of our commanders has been indicted of commiting warcrimes by the International Criminal Court. Based on several videos published online, the commander has personally executed, or ordered the execution of at least 33 people while commanding their troops in Libya. Both the US and the EU have put the commander under sanctions and an Interpol red notice has been issued for them. If we do not turn over the commander to the ICC, we will be targeted by these sanctions too."
 LibyaCivilWarContent.34.a: "그를 체포해야 한다"
 LibyaCivilWarContent.34.b: "그들은 잘못한 것이 없다"
 LibyaCivilWarContent.35.t: "은퇴를 계획하는 지휘관"
 LibyaCivilWarContent.35.d: "One of our commanders has announced that they are planning to retire from military service. They feel now that Libya is free of Gaddafi, their work is done. They are planning to spend rest of their days helping their community as a local politician and not on the battlefield."
 LibyaCivilWarContent.35.a: "은퇴하게 하라"
 LibyaCivilWarContent.35.b: "그는 아직 우리에게 필요하다"
 LibyaFocusNews.20.t: "무아마르 카다피의 죽음"
 LibyaFocusNews.20.d.airstrike: "The dictator of Libya, Muammar Gaddafi, has been killed. While trying to escape from the rebels, his convoy was attacked by a NATO airstrike. After the convoy came to a halt, it also came under attack from rebel forces. Gaddafi's guards were killed, and he was found hiding in a drainage pipe by the rebels. The gruesome footage from the event shows a bloodied and bruised Gaddafi being dragged around by the rebels, being sodomised by a bayonet and apparently suffering from a gunshot wound. Gaddafi can be heard telling his captors 'God forbids this' and 'What did I do to you?', before the final footage shows him dead. NATO representatives denied they had knowledge of Gaddafi being part of the convoy, and the rebel spokesperson stated that no order had been given to kill Gaddafi. Gaddafi's heir Saif al-Islam has vowed to avenge their father and continue the fight for Libya."
 LibyaFocusNews.20.d: "The dictator of Libya, Muammar Gaddafi, has been killed. While trying to escape from the rebels, his convoy was attacked by rebel forces. Gaddafi's guards were killed, and he was found hiding in a drainage pipe by the rebels. The gruesome footage from the event shows a bloodied and bruised Gaddafi being dragged around by the rebels, being sodomised by a bayonet and apparently suffering from a gunshot wound. Gaddafi can be heard telling his captors 'God forbids this' and 'What did I do to you?', before the final footage shows him dead. The rebel spokesperson stated that no order had been given to kill Gaddafi. Gaddafi's heir Saif al-Islam has vowed to avenge their father and continue the fight for Libya."
 LibyaFocusNews.20.a: "이것이 끝인가?"

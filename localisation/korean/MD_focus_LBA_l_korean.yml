l_korean:
 libya_oil_nationalisation: "석유 국유화"
 libya_oil_nationalisation_desc: "\n£LBA_desctext_oil_nationalisation \n\n\n\n리비아는 아프리카에서 가장 큰, 세계에서 10번째로 큰 석유 매장량을 보유하고 있습니다. 리비아의 석유 산업은 국가 산업의 95%를 차지할 정도로 매우 중요합니다. 리비아의 석유 매장지는 생산 비용이 낮고, 유황 함량이 적으며, 유럽 시장과의 근접성 덕분에 매력적인 투자 대상으로 여겨집니다. 그러나 제재, 외국 석유 회사들과의 문제, 그리고 국가의 석유 자원에 대한 강한 통제로 인해 리비아는 기존 생산을 유지할 수 있는 자원을 겨우 확보하고 있는 상태입니다. 추가적인 생산 증가는 국내외의 상당한 투자가 필요할 것입니다.\n\n현재 국유화 수준: §Y[?lba_oil_nationalisation|%0]§!"
 libya_nationalise_oil_fields: "유전 국유화"
 libya_nationalise_oil_fields_desc: "리비아의 일부 민간 석유 기지를 국유화할 수 있습니다. 이는 상당한 비용이 들겠지만, 우리의 석유 생산을 더 독립적으로 만들 수 있을 것입니다."
 libya_sell_oil_fields: "국내 유전지 매각"
 libya_sell_oil_fields_desc: "우리는 국영 석유회사(National Oil Corporation)가 운영하는 일부 석유 기지를 외국 회사에 매각할 수 있습니다. 이를 통해 빠르게 수익을 올릴 수 있지만, 에너지 부문은 다른 국가들에 더 의존하게 될 것입니다."
 libya_develop_oil_field_cost_bad_tt: "엘-사하라에서 석유 기지를 개발하는 기본 비용은 §Y$30억§!입니다. 이 비용은 우리의 §Y국유화 수준§!에 따라 [?lba_oil_nationalisation|%0R]만큼 증가합니다."
 libya_develop_oil_field_cost_tt: "와하에서 석유 기지를 개발하는 기본 비용은 §Y$80억§!입니다. 이 비용은 우리의 §Y국유화 수준§!에 따라 [?lba_oil_nationalisation|%0R]만큼 증가합니다."
 libya_develop_el_sahara_fields: "엘-샤하라 유전 개발"
 libya_develop_el_sahara_fields_desc: "The el-Sharara oil fields are located in the Wadi al Hayaa district in Southern Libya. It is a minor oil field on the scale of Libya but still an important one. The oil refined here is processed and stored in §YMellitah and az-Zawiyah near Tripoli§!. With increased effort, we can expand the production in el-Sahara.\n\nIn order to expand our existing oil fields, we need to prepare facilities to store the oil and find efficient methods for extracting the oil.\n\n§YResource output updates daily. Wait one day after construction finishes for the new oil yield to appear.§!"
 libya_develop_west_waha_fields: "서부 와하 석유 기지 개발"
 libya_develop_west_waha_fields_desc: "시르테 분지의 와하 유전은 리비아 원유의 90%를 생산하여 국가에서 가장 중요한 지역입니다. 서부 와하 유전에서 추출된 원유는 §Y시르텔와 라누푸§!로 보내져 정제 및 저장됩니다. 생산 증가를 위해서는 서부 와하에서 생산을 확장할 수 있는 노력이 필요합니다.\n\n기존 유전의 생산을 확장하기 위해서는 원유를 저장할 시설을 준비하고, 효율적인 추출 방법을 찾아야 합니다."
 libya_develop_east_waha_fields: "동부 와하 유전 개발"
 libya_develop_east_waha_fields_desc: "시르테 분지의 와하 유전은 리비아 원유의 90%를 생산하여 국가에서 가장 중요한 지역입니다. 동부 와하 유전에서 추출된 원유는 §Y브레가와 아즈다비야§!로 보내져 정제 및 저장됩니다. 생산 증가를 위해서는 동부 와하에서 생산을 확장할 수 있는 노력이 필요합니다.\n\n기존 유전의 생산을 확장하기 위해서는 원유를 저장할 시설을 준비하고, 효율적인 추출 방법을 찾아야 합니다."
 libya_dig_wadi_ash_shati: "와디 아쉬-샤티에서 철광석을 파다"
 libya_dig_wadi_ash_shati_desc: "세브하 근처의 와디 아쉬-샤티' 계곡에는 세계 최대의 철광석 매장지가 있다고 소문이 돌고 있습니다. 우리는 지금까지 조금만 발견했지만, 누가 알겠습니까, 사막 모래 속에 무엇이 숨어 있을지? 이 철을 찾기 위해 해당 지역을 탐사해야 합니다."
 libya_dig_wadi_ash_shati_capacity: "새로운 철광석 광산에 대한 잠재력이 존재합니다 (현재: [?wadi_ash_shati_current] 중 60개)."
 libya_dig_wadi_ash_shati_tt: "§Y모체 광맥§!을 발견할 가능성은 우리의 §Y굴착§! 기술에 달려 있습니다. 확률은 레벨당 §G2.5%§!씩 증가합니다."
 libya_gaddafi_family: "카타피의 가족"
 libya_gaddafi_family_desc: "Muammar Gaddafi, along with his children, hold considerable power in Libya. They all have their own interests and goals. Gaddafi himself is a very eccentric man. Known for his publicity stunts and direct language, many of his behaviours are strange and odd on the international forum. While Gaddafi's methods can be advantageous, it is possible that the Libyan people grow tired of his antics. It is important to keep the instability of the Gaddafi family at a manageable level to secure the stability of the state.\n\nCurrent §YInstability§!: [?gaddafi_family_instability] ([?gaddafi_family_instability_decay|-]/month), Effect: [?gaddafi_family_stability_effect|+%] §YStability§!. If the §YStability§! of [ROOT.GetName] is below §Y15%§!, the people will start protesting against Gaddafi!\n\nEach of Gaddafi's children will affect §YInstability§! by §G-0.25§!/month and their traits will be active unless they are §YExiled§! or §YDead§!.\n\nYou can access §Ydecisions§! related to a character by clicking their portrait."
 libya_gaddafi_family_modify_instability_tt: "불안정: [?family_instability_change|=-0]"

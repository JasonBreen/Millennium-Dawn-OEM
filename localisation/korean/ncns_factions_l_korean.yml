l_korean:
 faction_manifest_containment_of_decadence_name: "서방 퇴폐 봉쇄"
 faction_manifest_containment_of_decadence_desc: "'In the name of God, the compassionate, the merciful'\n--------------\nWhat do we have but our own flesh and blood to protect this land? The imperialist thirst for soil which is not theirs could never be clenched with simple diplomacy. At last, an Axis of Resistance is the only way forward in preventing further imperialist agendas from gaining ground in the world, even if it means fighting to the very last man."
 faction_manifest_peace_in_our_time_name: "세계 평화"
 faction_manifest_peace_in_our_time_desc: "'Animus in consulendo liber'\n--------------\n바르샤바 조약의 붕괴와 국제법과 질서의 재부상은 모두 NATO 회원국들의 공동 노력 덕분이었습니다. 그러나 오늘날 세계 일부 국가들은 이 안정기를 자국의 이익을 위해 이용하기로 결정했으며, NATO의 노력에 적극적으로 맞서고 있는 것으로 보입니다. 우리 시대의 안보를 확보하려면 동맹을 새로운 경계로 확장하고 전 세계 모든 사람의 안전을 보장하기 위해 노력해야 합니다."
 faction_manifest_unite_islamic_countries_name: "이슬람 세계 통합"
 faction_manifest_unite_islamic_countries_desc: "수 세기 동안 이슬람 세계는 분열되어 있었습니다. 이제 협력과 이해를 통해 우리는 다시 한번 하나로 통합될 수 있습니다."
 faction_manifest_the_second_red_wave_goal_name: "두 번째 붉은 물결"
 faction_manifest_the_second_red_wave_goal_desc: "볼셰비키가 처음 권력을 잡았을 때, 그들은 수십 년 동안 지속될 불길을 일으켰습니다. 그러나 그들은 새로운 체제의 가장 큰 결점, 즉 무능한 지도력을 해결하지 못했습니다. 서방이 강대해지는 동안 소련은 정체되어 있었습니다. 우리는 너무 오랫동안 공산주의 독재 정권 아래에서 살아왔습니다. 이제는 우리만의 공산주의 비전으로 세계를 지배할 때입니다."
 faction_manifest_comeback_of_the_monarchy_name: "군주제의 귀환"
 faction_manifest_comeback_of_the_monarchy_desc: "수 세기 동안 군주제는 지혜와 힘으로 세계를 다스려 왔습니다. 그러나 최근 수십 년 동안 공화정과 민주주의가 등장하여 일시적인 평화와 안정만을 가져왔습니다. 그 번영이 무너지기 시작했으니, 이제 군주제가 다시 일어서서 우리 나라에 질서와 전통을 회복해야 할 때입니다. 단결과 협력을 통해 우리는 군주제의 영광을 되찾고 우리 국민을 더 밝은 미래로 이끌 수 있습니다."
 faction_manifest_preserving_our_place_name: "세계에서 우리의 입지 보존"
 faction_manifest_preserving_our_place_desc: "'Collective security in a multipolar world'\n--------------\nThe collapse of the Soviet Union brought about the creation of several states. Such an event posed itself as an opportunity to the Western bloc, where the United States and the rest of NATO sought out to bring former Soviet states under their influence. Though many are saying that a newly hegemonic United States is the worlds sole super power, it is our factions intent to derail any hope of that becoming a permanent reality. Through strength in unity we will ensure that the post-Soviet sphere is protected, armed, and prepared."
 faction_cento_motto_name: "자유, 연합, 경계"
 faction_cento_motto_desc: "'동양과 서양을 잇는 다리'\n--------------\n무에서 유가 생겨났고, 정체성과 동맹이 재건되었습니다. 이처럼 혼란스러운 지역에서 나약한 자들이 무엇을 이룰 수 있겠습니까? 안타깝게도 이 동쪽 국경 안에 갇힌 모든 생명의 지속적인 안정을 지켜보고 보장하는 책임이 부여된 것은 바로 CENTO입니다."

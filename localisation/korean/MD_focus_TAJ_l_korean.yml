 TAJ_disinformation_campaign_desc: "By launching a disinformation campaign against the UTO we will surely weaken the peoples trust in them."
 TAJ_sarikol_range_seceded: "[CHI.GetFlag] 중국의 사리콜 산맥 통제"
 TAJ_sarikol_range_seceded_desc: "사리콜 산맥은 타지키스탄 최동단, 중국 및 아프가니스탄과의 국경 근처에 위치한 파미르의 산악 지역입니다. 이 산맥은 보다 넓은 파미르-알라이 산계의 일부를 이루며, 험준한 봉우리와 고지대 계곡이 특징입니다. 타지크 고르노바다흐샨 자치주와 중국 신장 성을 가르는 자연 경계 역할을 합니다. 사리콜 산맥은 인구가 희박하며 주변 지역의 주요 거주민은 와칸인과 키르기스인입니다. 또한 숨 막히는 풍경과 실크로드의 교차로로서의 전략적 역사적 중요성으로 유명한 \\"세계의 지붕\\" 지역의 일부이기도 합니다."

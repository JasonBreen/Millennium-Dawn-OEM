 TAJ_local_militias_desc: "지역 민병대가 무기를 들고 조국에 대한 침공에 대비하기로 결심했습니다!"
 TAJ_emomali_rahom_desc: "에모말리 라흐모노프는 1992년부터 집권해 온 장기 집권 타지키스탄 대통령입니다. 그는 소련 붕괴와 타지키스탄 내전(1992-1997) 발발 이후 두각을 나타냈으며, 내전 중 이슬람주의 세력과 친민주주의 세력을 포함한 여러 야권 파벌을 격파하며 자신의 통치를 공고히 했습니다. 라흐모노프는 고도로 중앙집권적이고 권위주의적인 정부를 유지했으며, 정치적 반대 의견과 언론의 자유를 억누르기 위해 종종 탄압을 사용했습니다. 라흐모노프 치하에서 타지키스탄은 러시아의 긴밀한 동맹으로 남았으나 경제적 어려움에 시달렸고, 해외, 특히 러시아에 있는 타지크 이주 노동자들의 송금에 크게 의존해 왔습니다. 그의 정부는 또한 타지크 정체성과 언어를 장려하여 민족 통합을 도모하고 러시아 문화의 영향에서 벗어나려는 노력을 기울였으며, 동시에 국내의 급진 이슬람 운동에 맞서 싸웠습니다."
 TAJ_emomali_rahom_desc2: "에모말리 라흐몬은 1992년부터 집권해 온 장기 집권 타지키스탄 대통령입니다. 그는 소련 붕괴와 타지키스탄 내전(1992-1997) 발발 이후 두각을 나타냈으며, 내전 중 이슬람주의 세력과 친민주주의 세력을 포함한 여러 야권 파벌을 격파하며 자신의 통치를 공고히 했습니다. 라흐몬은 고도로 중앙집권적이고 권위주의적인 정부를 유지했으며, 정치적 반대 의견과 언론의 자유를 억누르기 위해 종종 탄압을 사용했습니다. 라흐몬 치하에서 타지키스탄은 러시아의 긴밀한 동맹으로 남았으나 경제적 어려움에 시달렸고, 해외, 특히 러시아에 있는 타지크 이주 노동자들의 송금에 크게 의존해 왔습니다. 그의 정부는 또한 타지크 정체성과 언어를 장려하여 민족 통합을 도모하고 러시아 문화의 영향에서 벗어나려는 노력을 기울였으며, 동시에 국내의 급진 이슬람 운동에 맞서 싸웠습니다."
 TAJ_badakhshan_resistance_dynamic_modifier_desc: "타지키스탄 내전(1992-1997) 동안 고르노바다흐샨은 타지키스탄으로부터의 더 큰 자치 또는 완전한 독립을 주장하는 반대 세력의 근거지가 되었습니다. 전쟁이 끝난 뒤에도 바다흐샨의 많은 사람들은 중앙 정부에 계속 맞서며 더 많은 정치적 자유와 경제적 권리를 요구했습니다. 지역 주민들의 불만은 정치적 배제감과 정부의 방치에서 비롯되었으며, 정부는 타지크 다수파의 이익을 우선시하고 이 지역의 자치를 훼손한다고 인식되고 있습니다."
 TAJ_social_amenities: "사회 편의시설"
 TAJ_social_amenities_desc: "평균적인 타지크 가정에는 많은 사회 편의시설이 갖춰져 있지 않습니다. 우리는 이를 바꿀 수 있고, 바꿀 것입니다."

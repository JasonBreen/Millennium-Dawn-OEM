 TAJ_The_Undeclared_Cold_War: "선포되지 않은 냉전"
 TAJ_The_Undeclared_Cold_War_desc: "\n£TAJ_desctext_cold_war_banner\n\n\n\n[TAJ.GetFlag] Tajikistan presides in a precarious stance, caught between the looming shadow of [UZB.GetFlag] Uzbekistan's Central Asian aspirations and the upswing of the Islamic Movement of [UZB.GetFlag] Uzbekistan (IMU). The IMU a radical Salafist group, has entrenched itself within remote regions and the mountains of central \n[TAJ.GetFlag] Tajikistan, exploiting [TAJ.GetFlag] Tajikistan's fragile security to pursue its militant desires. Their operations not only destabilise our state but also risk provoking [UZB.GetFlag] Uzbekistan into military action.\n\nThe situation is dire. Many generals fear the IMU's Rogue behaviour could spark conflict. At the same time, [UZB.GetFlag] Uzbekistan's hegemony aggressive posture proposes an existential threat that we must toe a line and tread carefully."

 SER_economic_development: "경제 발전"
 SER_economic_development_desc: "우리 경제는 나토의 폭격으로 파괴되었습니다. 이제 우리는 국가의 옛 경제적 위대함을 처음부터 다시 복원해야 합니다"
 SER_Belgrade_School_of_Medicine: "베오그라드 의과대학"
 SER_Belgrade_School_of_Medicine_desc: "새로 제안된 의과대학은 훌륭한 구상으로, 새로운 의사와 의료 종사자에 관한 한 최고 중의 최고를 길러 낼 것이 분명합니다."
 SER_field_hospital_development: "야전 병원 개발"
 SER_field_hospital_development_desc: "의료 분야에서는 최고 수준의 장비를 갖추도록 합시다 - 그래야 대규모 인명 손실을 피할 수 있습니다."
 SER_Ministry_of_Education: "교육부"
 SER_Ministry_of_Education_desc: "교육부를 창설하여 다음 세대의 지성과 가능성을 끌어올립시다."
 SER_slow_down_the_brain_drain: "두뇌 유출 저지"
 SER_slow_down_the_brain_drain_desc: "우리는 영리하고 재능 있는 사람들이 더 이상 나라를 떠나지 않고 나라의 이익을 위해 일할 준비가 되도록 하는 여건을 점진적으로 만들고 있습니다."
 SER_lick_the_wounds: "상처를 핥다"
 SER_lick_the_wounds_desc: "우리는 마침내 나토 폭격의 여파를 해소했으며 경제 발전을 시작할 준비가 되었습니다."
 SER_our_exchange: "우리 증권거래소 부활"
 SER_our_exchange_desc: "지난 세기에 파괴된 베오그라드 증권거래소가 이제 부활할 것입니다. 대규모 민영화와 그 밖의 경제 개혁을 통해 증권 시장을 우리 국가의 생활 영역으로 되돌릴 수 있을 것입니다."
 SER_wind_farms: "풍력 발전 단지"
 SER_wind_farms_desc: "We will follow environmental trends and also start building our wind farms to generate clean and ecological energy.."
 SER_foreign_invest: "외국인 투자"
 SER_foreign_invest_desc: "우리 경제가 수년간의 붕괴와 침체 이후 성장세로 돌아서려면 추가 투자가 필요합니다."
 SER_china_energy: "중국의 에너지 투자"
 SER_china_energy_desc: "중국 투자자들은 우리가 그들에게 중부 유럽으로 가는 다리이기 때문에 우리 에너지 산업 개발에 관심이 있습니다."
 SER_rus_infra: "러시아와의 기반시설 협정"
 SER_rus_infra_desc: "기반시설 복구는 우리 경제 재건의 핵심 프로그램 중 하나입니다. 러시아 파트너들을 여기에 참여하도록 초청할 것입니다."
 SER_italian_business: "이탈리아 은행 투자"
 SER_italian_business_desc: "이탈리아 은행들은 우리 경제에서 성장과 발전의 전망을 보고 투자할 준비가 되어 있습니다."
 SER_german_baseies: "독일의 투자"
 SER_german_baseies_desc: "많은 대형 독일 기업들이 우리 경제에 투자할 준비가 되어 있습니다."
 SER_usa_baseies: "미국의 투자"
 SER_usa_baseies_desc: "많은 대형 미국 기업들이 우리 경제에 투자할 준비가 되어 있습니다."
 SER_metalls_china: "금속 산업 투자"
 SER_metalls_china_desc: "중국 투자자들은 우리 금속 산업에서 막대한 성장 잠재력을 보고 투자할 준비가 되어 있습니다."
 SER_china_infra: "중국과의 기반시설 협정"
 SER_china_infra_desc: "기반시설 복구는 우리 경제 재건의 핵심 프로그램 중 하나입니다. 중국 파트너들을 여기에 참여하도록 초청할 것입니다."
 SER_huawei: "화웨이와의 협력"
 SER_huawei_desc: "이 중국 기업과 긴밀한 협력 관계를 구축할 것입니다."
 SER_a1: "A1 텔레콤"
 SER_a1_desc: "A1 Telekom Austria is the leading fixed and mobile network operator in Austria, with 5.4 million mobile and 2.3 million fixed-line customers. A1 Telekom Austria traces its origins to Austria's first GSM mobile phone network which began testing in 1992 and commercial operations in 1994, under the name Mobilkom Austria, then part of the Austrian state-owned PTT agency Post- und Telegraphenverwaltunguntil it was split off into its own company in 1996."
 SER_microsoft: "마이크로소프트"
 SER_microsoft_desc: "마이크로소프트 코퍼레이션은 워싱턴주 레드먼드에 본사를 둔 미국의 다국적 기술 기업입니다. 법인 등록 또한 워싱턴주에 되어 있습니다. 마이크로소프트의 가장 잘 알려진 소프트웨어 제품은 윈도 운영체제 제품군입니다."
 SER_gazprom: "가스프롬"
 SER_gazprom_desc: "PJSC Gazpromis a Russian majority state-owned multinational energy corporation headquartered in the Lakhta Center in Saint Petersburg."
 SER_lukoil: "루크오일"
 SER_lukoil_desc: "The PJSC Lukoil Oil Company is a Russian multinational energy corporation headquartered in Moscow, specializing in the business of extraction, production, transport, and sale of petroleum, natural gas, petroleum products, and electricity.."
 SER_medical_centers: "의료 센터"
 SER_medical_centers_desc: "세르비아 의료의 접근성이 외딴 지역의 주민들에게까지 확대되었습니다."

 SER_new_four_year_plan2_idea: "4개년 발전 계획"
 SER_new_workplace1: "노동자의 권리"
 SER_idea_new_economic_policy: "신경제정책"
 Serbia.18.t: "우리에게 최후통첩을 보내는 [SER.GetNameWithFlag]"
 Serbia.18.d: "오늘 [SER.GetNameWithFlag]이(가) 우리 정부에 즉각적인 항복과 자국으로의 통합 개시를 요구하는 최후통첩을 전달했습니다. 유고슬라비아를 되찾을 계획인 것으로 보입니다. 우리는 항복해야 합니까?"
 Serbia.18.a: "절대 안 된다!"
 Serbia.18.b: "항복한다"
 Serbia.25.t: "우리의 최후통첩을 거절한 [FROM.GetNameWithFlag]"
 Serbia.25.d: "그들은 우리의 요구에 응하기를 거부하고 문제를 무력으로 해결하는 쪽을 택했습니다. 우리는 개의치 않습니다."
 Serbia.25.a: "매우 유감이다."
 Serbia.26.t: "우리의 최후통첩을 수락한 [FROM.GetNameWithFlag]"
 Serbia.26.d: "그들은 우리가 생각한 것보다 현명하여 우리의 제안을 받아들였습니다."
 Serbia.26.a: "좋아"
 SER_renewed_milosevic_serbia: "부활한 세르비아"
 SER_renewed_milosevic_serbia_desc: "우리 국민은 수많은 세월의 전쟁과 굴욕, 그리고 자신들의 위대함에 대한 부정을 지난 뒤 재탄생과 회복의 길에 들어섰습니다."
 SER_the_sick_woman_of_the_coalition: "연립의 병든 여인"
 SER_the_sick_woman_of_the_coalition_desc: "밀로셰비치의 아내 미랴나는 남편의 손에서 나라의 정치 생활에 대한 더 큰 권력을 넘겨받았으며, 이제 그 어느 때보다 세르비아에 큰 영향력을 행사합니다."
 SER_ratify_greater_serbia: "대세르비아 비준"
 SER_ratify_greater_serbia_desc: "It is time we ratify Greater Serbia and lay our claim to the lands of Croatia, Bosnia and some of the regions of Western Bulgaria where our people currently reside. Our people need us and it is time we bring them back to the fold. We can focus on securing these territories later, but now is to show all Serbians we wish for their best intersts at heart. It is time to bring our people home."
 SER_full_milosevic_dictatorship: "밀로셰비치의 독재"
 SER_full_milosevic_dictatorship_desc: "밀로셰비치는 마침내 자신이 세운 체제가 독재임을 인정했습니다. 하지만 독재가 나쁜 것입니까?"
 SER_shut_it_down_forcibly: "야당 입막음"
 SER_shut_it_down_forcibly_desc: "우리는 우리나라의 반대 정치 의견에 맞서 적극적으로 싸울 것입니다."
 SER_a_selective_merger: "작은 민주주의"
 SER_a_selective_merger_desc: "The opposition will be given freedom of speech in certain media and other sources to reassure people and other observers.."
 SER_union_state: "연방 국가 구상으로의 복귀"
 SER_union_state_desc: "연방 국가는 러시아와 벨라루스가 두 독립 국가로 이루어진 일종의 연합체를 만들기 위한 프로젝트로, 우리는 이전에 가입하려 했으나 실패했습니다. 우리는 다시 이 구상으로 돌아옵니다"
 SER_union_state_propaganda: "연방 국가 선전"
 SER_union_state_propaganda_desc: "연방 국가에 가입하는 것이 우리에게 이익이 될 뿐이라고 우리나라 국민을 설득해야 합니다"
 SER_union_state_documents: "모든 문서 준비"
 SER_union_state_documents_desc: "연방 국가 가입에 필요한 문서에 서명하고 준비하는 긴 과정을 시작할 것입니다"
 SER_union_state_referendum: "국민투표"
 SER_union_state_referendum_desc: "이제 우리는 연방 국가 가입에 관한 국민투표를 실시할 채비를 갖추었습니다"
 SER_rise_nation: "국가의 부상"
 SER_rise_nation_desc: "세르비아 국가는 지난 10년간 닥친 공포와 수치에서 일어설 것입니다. 세르비아인이 다시 위대한 민족이 될 때입니다"
 SER_mobilise_people: "국민 동원"
 SER_mobilise_people_desc: "우리 국민에게는 위대하다고 불릴 권리를 위해 싸워야 하는 험난한 길이 놓여 있습니다. 우리는 전쟁에도 대비해야 합니다"
 SER_military_invest: "군수 산업 투자"
 SER_military_invest_desc: "군수 산업을 되살릴 때입니다. 강한 군대에는 강한 산업이 필요합니다"
 SER_defend_borders: "국경 수비"
 SER_defend_borders_desc: "우리는 국경 수비를 강화할 것이며, 누구도 눈에 띄지 않고 대세르비아의 영토로 넘어오지 못할 것입니다!"
 SER_military_nation: "군사화된 국가"
 SER_military_nation_desc: "우리 국민은 예전의 위대함을 되찾기 위해 전쟁에 나설 채비가 되어 있습니다. 노동자부터 병사까지, 우리는 무엇이든 할 준비가 되어 있습니다"
 SER_panteri: "가르다 판테리 재창설"
 SER_panteri_desc: "The Garda Panteri, also known as Specijalna Brigada Garda Panteri , was an elite unit in the Army of Republika Srpska during the Bosnian War. It was founded on 2 May 1992 under the initial name of the Serbian National Guard of SAO Semberija and Majevica , adopting the name \"Garda Panteri\" in honour of previous fallen commander Branko \"Panter\" Pantelić by Ljubiša \"Mauzer\" Savić and members of the Serbian Solidarity Fund. It fought in Bosnia from 1992 1996 during the Yugoslav Wars"
 SER_ssd: "국가보안국 재창설"
 SER_ssd_desc: "국가보안국, 또는 간단히 국가보안은 세르비아 내무부 산하의 보안 기관으로, 국내 위협으로부터 나라를 보호하는 임무를 맡았습니다."
 SER_nationalise: "국유화"
 SER_nationalise_desc: "민영화는 실수였으며, 이제 이를 바로잡을 때입니다. 국가에서 빼앗긴 모든 것을 되돌릴 것입니다."
 SER_infra: "기반시설 투자"
 SER_infra_desc: "우리나라의 더 나은 물류를 위해 기반시설 개발에 더 많이 투자할 것입니다."
 SER_demand_serbian_autonomy: "세르비아 자치 요구"
 SER_demand_serbian_autonomy_desc: "세르비아인의 독립 국가를 관철하고 - 강력한 외세의 영향을 모두 제거합시다."
 SER_orchestrate_referendum: "국민투표 연출"
 SER_orchestrate_referendum_desc: "국민투표를 실시해야 합니다! 우리는 국민이 무엇을 원하는지 알고 있으며, 그것을 그들의 입으로 말하게 해야 합니다! 이것이 우리의 요구를 정당화하는 최선의 방책입니다."
 SER_reunite_macedonia: "마케도니아 재통합"
 SER_reunite_macedonia_desc: "마케도니아는 언제나 세르비아의 일부였고 앞으로도 그럴 것입니다. 지도에도 그렇게 표시되도록 만들기만 하면 됩니다."
 SER_srpska_intervention: "스르프스카 개입"
 SER_srpska_intervention_desc: "보스니아는 우리에게 돌아올 것입니다. 이는 우리가 보장합니다. 그들이 기어서 돌아오기만을 기다리며 시간을 허비하지 않도록 신속히 행동해야 합니다."
 SER_integrate_bosnia: "보스니아 통합"
 SER_integrate_bosnia_desc: "한때 보스니아였던 땅이 이제 우리 것이 되었으니, 이를 안정시켜야 합니다. 영토와 주민을 완전히 통합하기 위해 새로운 정책과 조치를 도입할 것입니다."
 SER_russian_peacekeapers: "러시아 평화 유지군"
 SER_russian_peacekeapers_desc: "러시아에 우리 영토에 의용 파견대를 배치해 달라고 요청할 것입니다"
 SER_integrate_bosnia_category: "[BOS.GetFlag]보스니아 통합"
 SER_integrate_bosnia_category_desc: "\n\n\n\n\n\n£SER_desctext_bosnia \n\n\n\n\n\n\n\n\n§Y대[SER.GetFlag]세르비아§!를 건설하려면 §Y[BOS.GetFlag]보스니아의 모든 영토§!를 §G통합§!해야 합니다."

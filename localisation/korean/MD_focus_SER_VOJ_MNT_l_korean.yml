 KOS_Yugoslav_war_state_desc: "유고슬라비아와의 전쟁 이후 어느 정도의 자치를 얻을 수 있었지만, 우리 국민은 전쟁으로 인해 지치고 피폐해졌습니다. 우리는 이 상처를 스스로 치유할 수 없으며, 타국의 지원과 협력이 필요합니다.\n§W--------------§!\n§H상처에 붕대를§! 중점을 완료하면 이 국가 정신은 §R제거§!됩니다."

 kosovo_rec.6.t: "세르비아가 거부함!"
 kosovo_rec.6.d: "세르비아가 합의에서 발을 뺐습니다."
 kosovo_rec.6.a: "알겠다"
 kosovo_un.1.t: "UN 지원 협상"
 kosovo_un.1.d: "UN이 우리의 지원 제안을 수락했습니다. 이제 그들에게 무엇을 요청할지 정해야 합니다."
 kosovo_un.1.a: "교육 지원"
 kosovo_un.1.b: "경제 지원"
 kosovo_un.1.c: "사회 지원"
 ser_kos.1.t: "코소보 국민투표"
 ser_kos.1.d: "코소보에서 독립 국민투표가 실시되었고, 과반수가 우리나라로부터의 분리를 결정했습니다. 모든 것을 그대로 둘 것입니까, 아니면 무력으로 제거할 것입니까?"
 ser_kos.1.a: "국민투표는 불법이다!"
 ser_kos.1.b: "그들을 보내 주자"

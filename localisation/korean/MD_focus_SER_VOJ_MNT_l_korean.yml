 kosovo.3.d: "비록 지금은 독립 국가로 승인받지 못하고 있지만, 우리는 승인을 얻기 위한 싸움을 계속할 것이며 투쟁을 멈출 생각이 없습니다."
 kosovo.3.a: "목표를 향해 전진"
 kosovo.4.t: "코소보가 불가침 보장을 요청함"
 kosovo.4.d: "코소보는 우리에 대한 비공격적 태도의 표시로 불가침 조약을 체결하여 우리를 공격할 의도가 없음을 확인해 달라고 요청하고 있습니다."
 kosovo.4.a: "그들 따위는 알 바 아니다!"
 kosovo.4.b: "좋아"
 SER_export_idea: "유고임포트 SDPR"
 SER_export_idea_desc: "유고임포트 SDPR은 세르비아 국영 무기 제조업체이자 방위 관련 장비의 수출입을 중개하는 기업입니다."
 KOS_drop_unity: "§H코소보-알바니아 단결§!을 §G-2%§! 감소시킵니다"
 TT_SER_montenegro_independence_violent: "몬테네그로의 시위가 폭력적으로 번지지 않았음"
 KOS_international_aid: "국제 원조"
 KOS_international_aid_desc: "코소보 전쟁 이후 UNMIK, USAID 및 유럽 각국의 개발 기관 같은 국제기구들이 파괴된 우리의 경제와 제도를 재건할 수 있도록 상당한 재정 및 개발 지원을 제공했습니다.\n§W--------------§!\n이 국가 정신은 국제 기부자들로부터 주간 수입을 제공합니다."
 SER_nationalized_industries_idea: "국가 통제 산업"
 SER_nationalized_industries_idea_desc: "철강, 석유, 제조업을 포함한 핵심 산업이 국가의 직접 통제 아래 들어왔으며, 기업 투자 감소를 대가로 인구 과세와 자원 수출을 통해 수입을 올립니다."
 SER_state_infrastructure_program: "국가 기반시설 프로그램"
 SER_state_infrastructure_program_desc: "세르비아 전역의 도로, 철도, 공공 설비를 현대화하는 국가 주도의 프로그램으로, 건설 역량과 세수를 끌어올립니다."
 SER_smederevo_steel_idea: "스메데레보 제철소"
 SER_smederevo_steel_idea_desc: "발칸 최대 규모의 산업 단지 중 하나인 스메데레보 제철소가 국가의 완전한 통제 아래 들어왔습니다. 그 생산량은 국내 철강 생산을 강화하고 국가 산업 기반을 뒷받침합니다."
 SER_nis_petroleum_idea: "NIS 국영 석유"
 SER_nis_petroleum_idea_desc: "세르비아 석유 산업(NIS)이 국가 소유로 통합되어 국내 연료 공급과 국가 예산을 위한 석유 채굴 수입을 확보했습니다."
 SER_nationalized_industries_idea_2: "통합 국가 산업"
 SER_nationalized_industries_idea_2_desc: "철강, 석유, 제조업에 대한 국가 통제가 단일한 산업 정책으로 통합되어, 민간 부문 투자를 대가로 생산량과 수출 수입을 극대화합니다."
 SER_war_economy_idea: "전시 경제 준비"
 SER_war_economy_idea_desc: "국가는 민간 생산 역량을 군수 산업으로 돌려, 소비재 공급을 대가로 무기 생산량을 늘렸습니다."
 SER_non_aligned_trade_idea: "비동맹 무역망"
 SER_non_aligned_trade_idea_desc: "세르비아는 비동맹 및 우호 국가들과 무역 제휴를 맺어, 서방의 금수 조치를 넘어 수출 시장을 다변화했습니다."
 SER_smederevo_steelworks: "스메데레보 제철소 국유화"
 SER_smederevo_steelworks_desc: "스메데레보 제철소는 남동유럽 최대의 산업 시설 중 하나입니다. 국가 통제 아래에서 우리 중공업의 중추가 되어 국가 건설에 필요한 강철을 공급할 것입니다."
 SER_nis_petroleum: "NIS 석유 국유화"
 SER_nis_petroleum_desc: "세르비아 석유 산업(NIS)은 전국의 석유 채굴, 정제, 유통을 장악하고 있습니다. 완전한 국유화는 에너지 독립과 연료 수입을 확보해 줄 것입니다."
 SER_state_industrial_consolidation: "국가 산업 통합"
 SER_state_industrial_consolidation_desc: "철강, 석유, 제조업이 국가 통제 아래 놓였으므로, 이제 산업 정책을 통일하여 모든 부문에서 생산량과 효율을 극대화할 수 있습니다."
 SER_war_economy_preparation: "전시 경제 준비"
 SER_war_economy_preparation_desc: "국가는 생산 역량을 군사적 필요로 돌려야 합니다. 민간 소비는 줄어들겠지만, 우리의 군수 산업은 앞으로의 도전에 걸맞게 성장할 것입니다."
 SER_non_aligned_partners: "비동맹 파트너 모색"
 SER_non_aligned_partners_desc: "서방의 제재가 우리를 고립시켰지만 세상은 유럽과 미국보다 넓습니다. 서방권 바깥에서 기꺼이 거래하려는 국가들과 무역망을 구축해야 합니다."
 SER_indian_arms_trade: "인도와의 무기 거래"
 SER_indian_arms_trade_desc: "인도는 역사적으로 유고슬라비아와 세르비아 무기 체계의 주요 고객이었습니다. 이 무기 거래 관계를 되살리면 수입과 전략적 파트너십을 모두 얻을 수 있습니다."
 SER_belarusian_partnership: "벨라루스와의 제휴"
 SER_belarusian_partnership_desc: "루카셴코 치하의 벨라루스는 우리와 정치적 관점을 공유하며 비슷한 서방의 압박에 직면해 있습니다. 양자 무역 및 협력 협정은 양국을 모두 강화할 것입니다."
 SER_middle_east_exports: "중동 수출 계약"
 SER_middle_east_exports_desc: "이라크와 리비아는 오랫동안 세르비아산 무기와 산업재의 고객이었습니다. 이 수출 계약을 갱신하면 국가에 상당한 수입이 생길 것입니다."
 MNT_yug_exp: "유고슬라비아의 경험"
 VOJ_integrate_buff: "보이보디나 통합"
 KOS_Infrastructure_Rebuild: "기반시설 재건"
 KOS_dark_tourism_Industry: "관광 산업"
 KOS_Water_Management: "수자원 관리"
 KOS_Agricultural_Modernization: "농업 현대화"
 KOS_textile_industry: "섬유 산업"
 KOS_Rural_Industry: "농촌 산업"
 KOS_fight_corruption: "부패와의 전쟁"
 KOS_transportation: "교통 체계"
 KOS_pristina_international_airport: "프리슈티나 국제공항"
 KOS_foreign_workers: "외국인 노동자"
 KOS_recall_refugees: "난민 귀환"
 kosovo.5.t: "세르비아가 불가침 조약에 동의함"
 kosovo.5.d: "베오그라드가 우리의 요청을 받아들이고 불가침 보장에 서명했습니다. 북쪽 이웃이 우리에 대한 적대 행위를 공식적으로 포기했으므로, 우리의 젊은 국가는 한시름 놓을 수 있게 되었습니다."
 kosovo.5.a: "외교적 승리"
 kosovo.6.t: "세르비아가 불가침 조약을 거부함"
 kosovo.6.d: "베오그라드가 불가침 보장을 요구한 우리의 요청을 거절했습니다. 그들의 우리에 대한 의도는 여전히 노골적으로 적대적이며, 우리는 최악의 사태에 대비해야 합니다."
 kosovo.6.a: "우려스럽군"
 SER_reconstruction_modifier: "세르비아 재건"
 SER_reconstruction_modifier_desc: "10년간의 전쟁과 제재, 그리고 1999년 나토의 폭격으로 세르비아의 산업과 기반시설, 대학은 속이 텅 비게 되었습니다. 베오그라드의 스카이라인에 솟은 모든 크레인은 이 나라에 미래가 있다는 증거입니다."
 SER_military_heritage_modifier: "유고슬라비아 군수 산업"
 SER_military_heritage_modifier_desc: "세르비아는 SFRJ의 군수 복합체인 자스타바, 유고임포르트-SDPR, 우트바를 물려받았습니다. 제재 기간 동안 음성적 수출로 명맥을 유지해 온 이 복합체는 여전히 지역 최대의 군수 산업 기반입니다."
 SER_milheritage_arms_factory_speed_tt: "$modifier_production_speed_arms_factory_factor$: $RIGHT|+=%1$"
 SER_debt_reconstructuring_tt: "파리 클럽과 §Y60억§!의 국가 부채를 재협상합니다"
 SER_klepto_dividend_tt: "§R정권의 측근들이 약탈품의 일부를 국고에 상납합니다.§!"
 SER_reopened_markets: "시장 재개방"
 SER_reopened_markets_desc: "제재는 사라졌고 서방 자본의 문이 활짝 열렸습니다. 10년에 걸친 국제적 따돌림은 시작되었던 곳, 곧 협상 테이블에서 막을 내립니다."
 SER_wind_farms_modifier: "풍력 발전 단지"
 SER_wind_farms_modifier_desc: "이제 보이보디나의 산등성이와 모라바 계곡에는 터빈이 늘어서서 저렴한 재생 에너지를 전력망에 공급하고 있습니다. 다만 그 터빈이 차지한 땅은 더 이상 새 공장을 지을 수 없는 땅이기도 합니다."
 SER_negotiated_transition_TT: "세르비아가 협상을 통한 체제 전환을 따랐음 - §Y성은 굳건히 버틴다§! 완료됨"
 SER_seized_assets_tt: "부패한 관리들에게서 압수한 자산이 국고로 환수됩니다."
 SER_kosovo_uprising_reject_tt: "우리는 코소보를 무력으로 굴복시킬 명분을 얻습니다."
 SER_rsk_outcome_tt: "스르프스카 공화국이 보스니아로부터 분리되어 우리의 자치 종속국이 됩니다."
 SER_rsk_war_tt: "보스니아가 스르프스카를 놓아주기를 거부하며 우리에게 선전포고할 수도 있습니다."
 SER_isolation_accept_tt: "그들은 우리와 우호 관계 및 개선된 무역 협정을 맺고, 세르비아에서 영향력의 발판을 얻습니다."
 SER_isolation_reject_tt: "그들이 우리를 거절하여 관계가 악화됩니다."
 SER_invest_internet_tt: "그들은 영향력을 얻는 대가로 세르비아에 2개의 네트워크 기반시설 거점을 건설할 자금을 지원합니다."
 SER_bosnia_ties_accept_tt: "보스니아가 우리의 투자를 수락합니다. 우리는 비용의 일부를 부담하고, 보스니아에서 영향력을 얻으며, 스르프스카 공화국의 위상이 향상됩니다."
 SER_bosnia_ties_reject_tt: "보스니아가 우리를 거절하여 관계가 악화됩니다."
 SER_open_balkan_accept_tt: "그들이 구상에 참여하여 그들에 대한 우리의 영향력이 확대되고 그들의 수출이 증가합니다."
 SER_invest_infra_tt: "러시아 기업들이 우리의 한 주에서 기반시설 프로젝트의 자금을 지원합니다."
 SER_invest_factory_tt: "세르비아에 민간 공장 1개와 화력 발전소 1개가 건설됩니다."
 SER_invest_office_tt: "세르비아에 사무 단지 1개와 화력 발전소 1개가 건설됩니다."
 SER_invest_steel_tt: "중국 자본이 중부 세르비아의 강철 채굴을 확대합니다: 강철 +5."
 SER_invest_station_tt: "세르비아에 네트워크 기반시설 거점 1개가 건설됩니다."
 SER_invest_options_tt: "그들은 세르비아에서 민간 공장, 기반시설, 또는 네트워크 기반시설 중 하나의 프로젝트에 자금을 지원합니다."
 SER_mediation_accept_tt: "벨기에가 우리와 코소보 사이를 중재합니다."
 ser_kos.2.t: "베오그라드가 복종을 요구함"
 ser_kos.2.d: "베오그라드가 국경에 병력을 집결시키는 동안 세르비아 요원들은 북부의 세르비아계 소수민족을 선동했습니다. 최후통첩은 단도직입적입니다. 세르비아의 종주권을 받아들이거나 침공을 감수하라는 것입니다."
 ser_kos.2.a: "우리는 결코 굴복하지 않는다!"
 ser_kos.2.b: "굴복하는 것 외에 방법이 없다"
 ser_kos.3.t: "코소보가 우리에게 맞섬"
 ser_kos.3.d: "프리슈티나는 우리의 최후통첩을 거부하고 국민을 결집시켜 우리에게 맞서고 있습니다. 코소보가 자발적으로 무릎을 꿇지 않는다면 무력으로 굴복시킬 것입니다."
 ser_kos.3.a: "그렇다면 우리가 차지하겠다"
 ser_kos.4.t: "코소보가 복종함"
 ser_kos.4.d: "압도적인 압박에 직면한 프리슈티나가 우리의 조건을 받아들였습니다. 코소보는 종속국으로서 베오그라드의 품으로 돌아옵니다."
 ser_kos.4.a: "세르비아가 다시 온전해졌다"
 MNT_western_path_tt: "§YMontenegro commits to the Euro-Atlantic course.§!"
 MNT_eastern_path_tt: "§R몬테네그로가 모스크바와 보조를 맞춥니다.§!"
 MNT_serbian_path_tt: "§R몬테네그로가 세르비아와의 통합을 추구합니다.§!"
 MNT_neutral_path_tt: "§Y몬테네그로가 자유항 중립을 택합니다.§!"
 MNT_investment_accept_tt: "그들은 몬테네그로에 민간 공장 건설 자금을 지원하고 우리에 대한 영향력을 얻습니다."
 MNT_infra_accept_tt: "그들은 몬테네그로의 기반시설 개발 자금을 지원하고 우리에 대한 영향력을 얻습니다."
 MNT_purchase_costs_tt: "구매 대금은 우리 국고에서 지불되며 판매자에게 몬테네그로에 대한 영향력을 부여합니다."
 MNT_nap_accept_tt: "수락하는 각 국가는 몬테네그로와 불가침 조약을 체결합니다."
 MNT_csto_invite_tt: "러시아가 몬테네그로를 CSTO에 가입하도록 초청합니다."
 MNT_yug_demand_accept_tt: "복종하는 국가는 우리의 새로운 유고슬라비아의 종속국이 됩니다."
 MNT_yug_demand_reject_tt: "우리는 거부하는 모든 국가를 굴복시킬 명분을 얻습니다."
 KOS_Infrastructure_Rebuild_desc: "우리의 기반시설은 말 그대로 파괴되었으며, 이를 다시 되살리려면 막대한 재정 투입이 필요합니다."
 KOS_dark_tourism_Industry_desc: "우리도 다른 나라처럼 관광지가 될 수 있습니다. 우리의 풍경과 경관은 이웃 나라들에 뒤지지 않습니다."
 KOS_Water_Management_desc: "우리 시민들의 물 문제가 마침내 해결될 것입니다."
 KOS_Agricultural_Modernization_desc: "우리 농업은 낡고 황폐한 상태입니다. 이를 되살려야 합니다."
 KOS_textile_industry_desc: "우리는 섬유 산업에서 우리 공화국의 성장 잠재력을 보기 때문에 이 산업에 투자합니다."
 KOS_Rural_Industry_desc: "농촌 산업은 우리 경제의 원동력 중 하나가 되어야 합니다. 이를 위한 투자를 아끼지 말아야 합니다."
 KOS_fight_corruption_desc: "제대로 기능하는 사회가 되려면 우리나라에서 부패한 세력을 일소해야 합니다."
 KOS_transportation_desc: "나라 안을 이동하는 것이 더 효율적이 되도록 새로운 교통망을 구축할 것입니다."
 KOS_pristina_international_airport_desc: "프리슈티나 국제공항은 우리 경제를 위해 관광객을 들이고 내보내는 데 매우 유용할 것입니다."
 KOS_foreign_workers_desc: "인구가 적기 때문에, 다른 나라의 이주민이 우리나라에 와서 일부 일자리를 맡도록 장려해야 합니다."
 KOS_recall_refugees_desc: "우리 국민 중 다수가 현재 다른 나라에서 난민으로 지내고 있습니다. 이들을 불러들이는 것은 인구 증가에 도움이 될 것입니다."
 SER_brotherhood_and_unity: "형제애와 통일"
 SER_brotherhood_and_unity_desc: "옛 구호는 여전히 자그레브, 사라예보, 포드고리차에서 문을 엽니다. 공동 기념행사, 공동 방송, 문화 교류는 남슬라브인들이 한때 함께 이룬 것을 이웃들에게 상기시킵니다."
 SER_restore_yugoslavia: "유고슬라비아 복원"
 SER_restore_yugoslavia_desc: "구 공화국 모두가 연방을 갈망한다면 베오그라드가 이를 소집할 것입니다. 계승 국가들은 단일한 깃발 아래 재통합하도록 초청받습니다.\n유고슬라비아 복원에 대한 지지:\n$yugo_nost_overview$"
 MNT_echoes_of_yugoslavia: "유고슬라비아의 메아리"
 MNT_echoes_of_yugoslavia_desc: "몬테네그로는 베오그라드에서 멀리 벗어난 적이 없으며, 연방은 오늘날까지 이 나라가 의존하고 있는 항구, 철도, 휴양지를 건설했습니다. 당은 이러한 공동의 기억을 국내외에서 자신의 메시지의 중심에 둡니다."
 MNT_restore_yugoslavia: "유고슬라비아 복원"
 MNT_restore_yugoslavia_desc: "가장 작은 공화국에서 다른 공화국들이 기다려 온 부름이 울려 퍼집니다. 포드고리차는 승계 국가들이 하나의 깃발 아래 재통일할 것을 제안합니다.\n유고슬라비아 복원에 대한 지지:\n$yugo_nost_overview$"
 KOS_rekindle_yugoslavism: "유고슬라비아주의의 부활"
 KOS_rekindle_yugoslavism_desc: "1974년 헌법 아래에서 코소보는 사회주의 연방 내의 자치주로서 스스로를 통치했습니다. 당은 1990년대의 베오그라드가 아니라 바로 그 시대를 되찾아야 할 유산으로 내세웁니다."
 KOS_restore_yugoslavia: "유고슬라비아 복원"
 KOS_restore_yugoslavia_desc: "평등한 사회주의 공화국들의 연방은 베오그라드도 UN도 주지 않았던 협상 테이블의 자리를 코소보에 보장해 줄 것입니다. 프리슈티나는 후계 국가들에 재통합을 촉구합니다.\n복원된 유고슬라비아에 대한 지지:\n$yugo_nost_overview$"
 Serbia.3.tt.b: "§R음모는 계속 진행될 것입니다.§!"
 Serbia.28.t: "밀로셰비치, 헤이그로 인도됨"
 Serbia.28.d: "정부가 슬로보단 밀로셰비치를 헤이그의 전범 재판소로 이송하는 것을 승인했습니다. 서방 기부국들은 재건 원조를 재판소와의 협력에 연계시켰지만, 거리에서는 성 비투스 축일에 전직 대통령을 넘겨준 것을 배신이라고 부르고 있습니다."
 Serbia.28.a: "법은 전직 대통령에게도 적용된다"
 Serbia.28.b: "우리는 우리 사람을 인도하지 않는다"
 Serbia.29.t: "밀로셰비치, 구금 중 사망"
 Serbia.29.d: "슬로보단 밀로셰비치가 재판 판결이 예상되던 시기를 몇 달 앞두고 스헤베닝언의 감방에서 숨진 채 발견되었습니다. 그의 지지자들은 이미 정의를 거부당한 순교자를 이야기하고 있으며, 베오그라드에서 열릴 영결식에는 수만 명이 모일 것으로 예상됩니다. 그와 함께 한 시대 전체가 애도되고 있습니다."
 Serbia.29.a: "그와 함께 한 시대가 묻힌다"
 Serbia.30.t: "세르비아 몬테네그로 국가 연합"
 Serbia.30.d: "브뤼셀의 압력 아래 연방 의회가 헌법 헌장을 채택했습니다. 유고슬라비아 연방공화국은 사라지고, 그 자리에는 UN에서의 공동 의석 외에는 공통점이 거의 없는 느슨한 세르비아-몬테네그로 연합이 들어섭니다. 유고슬라비아라는 이름은 역사 속으로 사라집니다."
 Serbia.30.a: "이름뿐인 연합"
 Serbia.31.t: "카라지치, 베오그라드에서 체포됨"
 Serbia.31.d: "경찰이 노비 베오그라드에서 시내버스에 타고 있던 라도반 카라지치를 연행했습니다. 그는 가명을 쓰고 공개적으로 살면서 긴 흰 수염 뒤에서 대체 의학을 시술하고 있었습니다. 재판소는 즉각적인 이송을 기대하고 있으며, 브뤼셀은 유럽으로 가는 길이 헤이그를 거친다는 점을 분명히 했습니다."
 Serbia.31.a: "그를 헤이그로 이송하라"
 Serbia.31.b: "이송을 지연하라"
 Serbia.32.t: "믈라디치, 라자레보에서 발견됨"
 Serbia.32.d: "16년간의 도피 끝에 라트코 믈라디치가 라자레보의 사촌 농가에서 체포되었습니다. 그는 재판소의 주요 피기소자 중 세르비아 땅에 남은 마지막 인물이며, 그의 사건은 세르비아가 브뤼셀에서 후보국 지위를 얻는 데 남은 마지막 장애물입니다."
 Serbia.32.a: "재판소에 전면 협력한다"
 Serbia.32.b: "재판 절차를 질질 끈다"
 Serbia.33.t: "후보국 지위 부여"
 Serbia.33.d: "유럽 이사회가 세르비아에 유럽 연합 가입 후보국 지위를 공식적으로 부여했습니다. 이 결정은 재판소와의 수년에 걸친 협력과 프리슈티나와의 새로운 대화에 대한 보상입니다. 길고 긴 협상 분야들이 앞에 놓여 있지만, 방향은 정해졌습니다."
 Serbia.33.a: "우리의 유럽으로 가는 길이 열렸다"
 Serbia.34.t: "대사관들이 불타고 있음"
 Serbia.34.d: "코소보의 독립 선언에 반대하는 국가가 후원한 집회가 폭도들이 미국 대사관을 습격하여 불을 지르는 것으로 끝났습니다. 영국 공관도 공격을 받았으며, 건물에서 불에 탄 시신 한 구가 수습되었습니다. 각국 수도에서는 해명을 요구하고 있습니다."
 Serbia.34.a: "수도의 질서를 회복하라"
 Serbia.35.t: "스르프스카 공화국이 분리됨"
 Serbia.35.d: "스르프스카 공화국이 사라예보로부터의 독립을 선언했습니다. 바냐루카의 군중은 세르비아 국기를 흔들고 있으며, 새 당국은 베오그라드에 승인과 지원을 기대하고 있습니다."
 Serbia.35.a: "동포와 함께 서겠다"
 Serbia.35.b: "이것은 세르비아의 싸움이 아니다"
 SER_nat_populism_gain_tt: "§R민족주의 우파가 지지를 얻습니다.§!"
 SER_icty_cooperation_karadzic_tt: "§Y세르비아가 헤이그 재판소에 협력하고 있습니다.§!"
 SER_icty_cooperation_complete_tt: "§G세르비아가 헤이그 재판소에 전면 협력했습니다.§!"
 SER_recognized_eu_candidate_tt: "§G세르비아가 EU 가입 후보국으로 인정받았습니다.§!"
 SER_KOS_normalization_tt: "§G세르비아와 코소보가 관계 정상화 협정에 서명합니다.§!"
 kosovo.10.t: "코소보 전역의 소요"
 kosovo.10.d: "알바니아계 아이들이 세르비아계 폭도를 피해 달아나다가 이바르 강에서 익사했다는 보도가 나오면서 이틀간 지방 전역에서 폭동이 벌어졌습니다. 세르비아계 주택과 정교회 교회가 불타고 있으며, 국제 행정부는 거리의 통제력을 상실했습니다. 해외에서의 우리 위상에 입은 타격을 회복하는 데는 수년이 걸릴 것입니다."
 kosovo.10.a: "진정을 호소하라"
 kosovo.11.t: "ICJ가 권고적 의견을 내놓음"
 kosovo.11.d: "국제사법재판소는 독립 선언이 국제법을 위반하지 않았다고 결론지었습니다. 이 의견은 권고적 성격이며 현지 상황을 바꾸지는 않지만, 우리와의 대화를 거부하는 모든 수도에서 법적 논거를 앗아갑니다."
 kosovo.11.a: "법은 우리 편이다"
 KOS_icj_opinion_tt: "§G승인 요청 결정의 비용이 일부 환급됩니다.§!"
 KOS_icj_ser_reaction_tt: "세르비아는 유럽 노선을 희생하면서까지 판결에 이의를 제기하거나, 아니면 조용히 받아들여야 합니다."
 KOS_icj_recognition_rebate_tt: "§GICJ의 권고적 의견이 우리의 입지를 강화합니다.§!"
 KOS_SER_opinion_decrease_5: "§H세르비아인§!의 §H5%§!가 우리를 §R덜 호의적으로§! 보게 됩니다"
 kosovo.12.t: "반스카의 매복 공격"
 kosovo.12.d: "장갑차를 탄 무장 인원 약 30명이 북부의 반스카 마을을 습격하여 경찰 부사관 한 명을 살해하고 수도원에 바리케이드를 치고 농성하고 있습니다. 프리슈티나는 압수된 무기 은닉처를 지목하며 베오그라드가 지휘한 작전이라고 주장하고, 베오그라드는 어떠한 관여도 부인합니다. 이는 시위가 아니라 준군사 작전이었습니다."
 kosovo.12.a: "평화유지군과 협력하여 질서를 회복한다"
 kosovo.12.b: "이름만 아닐 뿐 전쟁 행위나 다름없다"
 Montenegro.28.t: "선거일의 쿠데타"
 Montenegro.28.d: "특별 검사가 선거일 밤에 의회를 습격하고, 일부 설명에 따르면 총리를 암살하려 한 약 20명의 음모자를 체포했다고 발표했습니다. 수사는 세르비아 민족주의 서클을 거쳐 러시아 군 정보기관 장교 두 명으로 이어집니다. 모스크바는 이 사건이 날조라고 주장합니다."
 Montenegro.28.a: "모스크바와 베오그라드를 지목한다"
 Montenegro.28.b: "상황을 악화시키지 않는다"
 Montenegro.29.t: "29번째 동맹국"
 Montenegro.29.d: "워싱턴에서 열린 기념식에서 몬테네그로가 가입 문서를 기탁하여 북대서양 동맹의 29번째 회원국이 되었습니다. 인구 60만의 나라가 18년 전 자국을 폭격했던 강대국들과 같은 테이블에 앉게 되었습니다. 10년간 정치를 규정해 온 안보 문제는 이로써 해결되었습니다."
 Montenegro.29.a: "단단한 닻을 내린 작은 나라"

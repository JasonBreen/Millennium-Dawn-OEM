 kosovo_rec.16.t: "몬테네그로의 봉기"
 kosovo_rec.16.d: "우리는 몬테네그로 반군에 자금을 지원하는 데 성공했고, 이제 그들은 자국에서 무장 반란을 일으킬 준비가 되었습니다."
 kosovo_rec.16.a: "몬테네그로의 자유를 위하여!"
 kosovo_rec.17.t: "몬테네그로의 봉기"
 kosovo_rec.17.d: "우리는 민병대를 신속하고 효율적으로 준비시킬 수 있었으며, 세르비아군은 패배할 것입니다!"
 kosovo_rec.17.a: "몬테네그로의 자유를 위하여!"
 kosovo.7.t: "코소보가 연방 창설을 원함"
 kosovo.7.d: "코소보 정부가 매우 이상한 요청을 보내왔습니다. 그들은 우리에게 새로운 발칸 국가인 서발칸 연방을 함께 창설하자고 요구하고 있습니다."
 kosovo.7.a: "그렇다, 참여하겠다"
 kosovo.7.b: "안된다"
 kosovo.8.t: "알바니아가 수락함"
 kosovo.8.d: "알바니아가 단일 국가를 형성하자는 우리의 요청을 수락했습니다. 오늘은 우리 역사에서 중대한 날이 될 것입니다."
 kosovo.8.a: "우리는 하나의 민족이다"
 kosovo.9.t: "알바니아가 거부함"
 kosovo.9.d: "알바니아가 통일 국가를 형성하자는 우리의 요청을 거부했습니다. 대의에 대한 그들의 배신을 우리는 잊지 않을 것입니다!"
 kosovo.9.a: "유감이군"
 kosovo.9.b: "외교가 통하지 않는다면 전쟁이 통할 것이다!"
 kosovo_rec.4.t: "코소보가 승인을 요청함"

 SER_brcko_returns: "브르치코 §Y통합§!"
 SER_westserbska_returns: "서스르프스카 §Y통합§!"
 SER_unsko_returns: "운스코사나 §Y통합§!"
 SER_shut_down_opposition: "반대 신념을 가진 정당 추방"
 SER_socialist_merger: "통합된 이념"
 SER_rise_serbian_idea: "부활한 세르비아 국민"
 SER_serbian_glory_idea: "위대한 세르비아에 영광을"
 SER_border_build_idea: "국경 수비"
 SER_ssd_command: "국가보안국"
 SER_rus_peacekeepers: "러시아 평화 유지군"
 SER_milosevic_dictatorship_tt: "§Y슬로보단 밀로셰비치§!를 종신 지도자로 삼습니다!"
 SerbiaFocus.7.t: "스르프스카 공화국의 운명"
 SerbiaFocus.7.d: "우리는 독자적인 국민투표를 실시할 것이며, 그것을 명분으로 스르프스카 공화국을 보스니아에서 분리하여 그 정부를 예속시킬 것입니다."
 SerbiaFocus.7.a: "좋아"
 SerbiaFocus.8.t: "스르프스카 공화국의 반란"
 SerbiaFocus.8.d: "예상은 했으나 이렇게 빨리 벌어질 줄은 상상하지 못했습니다. 우리가 스르프스카 공화국에 자치를 부여하자마자, 베오그라드가 그곳에서 우리에 대한 반란을 부추겼습니다."
 SerbiaFocus.8.a: "Damn it,we will fight"
 SerbiaFocus.8.b: "항복한다"
 SerbiaFocus.24.t: "평화 유지군을 요청하는 [FROM.GetNameWithFlag]"
 SerbiaFocus.24.d: "The Serbian government wants us to post peacekeeping content on our territory, because they fear for the re-outbreak of hostilities, will we agree?"
 SerbiaFocus.24.a: "찬성"
 SerbiaFocus.24.b: "그곳에 평화 유지군을 보내지 않겠다"
 SerbiaFocus.25.t: "우리에게 평화 유지군을 보내는 [FROM.GetNameWithFlag]"
 SerbiaFocus.25.d: "러시아 정부가 우리에게 평화 유지 파견대를 보내고 있으니, 이제 우리는 안전합니다"
 SerbiaFocus.25.a: "좋아"
 SerbiaFocus.26.t: "평화 유지군 파견을 거부한 [FROM.GetNameWithFlag]"
 SerbiaFocus.26.d: "러시아 정부는 우리 영토에 평화 유지군을 보내기를 거부했습니다"
 SerbiaFocus.26.a: "슬프군"
 SerbiaFocus.113.t: ""
 SerbiaFocus.113.d: ""
 SerbiaFocus.113.a: "좋아"
 SER_serbian_perestroika: "세르비아 정체성의 재구성"
 SER_serbian_perestroika_desc: "우리는 세르비아 민족의 본질 자체를 바꾸고 발칸에서의 전면적 지배를 포기할 채비가 되어 있으며, 그 대신 발칸 민족들에게 오래도록 잊혀 있던 구상, 즉 발칸 연방을 제안할 준비가 되어 있습니다"
 SER_renewed_image_of_serbia: "새로워진 세르비아"
 SER_renewed_image_of_serbia_desc: "우리 국민은 앞으로 우리가 스스로를 어떤 모습으로 볼 것인가에 대한 국가적 재고라는 어려운 단계를 거쳐야 합니다. 거대 세르비아를 만들어 발칸을 지배하려는 공격적 팽창과 욕망은 과거의 일이 되어야 합니다"
 SER_confederation_project: "연방 프로젝트"
 SER_confederation_project_desc: "We will begin preparations for the creation of the Federation. This important step will bring us closer to our vision of United Beams as the center of power in the world."
 SER_hijacking_yugo_nostalgia: "유고슬라비아의 꿈 활용"
 SER_hijacking_yugo_nostalgia_desc: "유고슬라비아는 사라졌지만 그에 대한 그리움은 사라지지 않았습니다. 정부는 그 향수를 자신의 강령에 녹여 내어, 다가올 연방을 새로운 경영 아래의 옛 꿈으로 내세웁니다."
 SER_language_agreements: "언어 문제 해결"
 SER_language_agreements_desc: "언어는 언제나 한 민족이 다른 민족을 지배하는 수단이었지만, 우리 연방에서는 모든 민족의 모든 언어가 중요하고 필요한 것이 될 것입니다."
 SER_propose_yugocefta: "무역 관계 증진"
 SER_propose_yugocefta_desc: "우리는 이웃 국가들과 여러 무역 협정을 체결할 것이며, 이는 연방 창설을 위한 첫 협상에 우리를 한 걸음 더 가깝게 해 줄 것입니다."
 SER_confederation_realisation: "연방의 첫 단계"
 SER_confederation_realisation_desc: "우리나라의 연방화를 시작하여, 앞으로 모든 이웃이 우리의 제국주의적 야망은 과거의 일이며 우리가 모든 발칸 민족과 협력할 준비가 되어 있음을 알 수 있게 할 것입니다."
 SER_apologize_to_bosnia: "보스니아와의 모든 분쟁 해결"
 SER_apologize_to_bosnia_desc: "보스니아와의 대립은 마무리되어야 하며, 우리는 이 형제 국가와 가능한 한 많은 유대를 맺고자 하는 열망을 적극 장려할 것입니다."
 SER_undermine_croatian_nationalism: "크로아티아 민족주의 무마"
 SER_undermine_croatian_nationalism_desc: "우리는 크로아티아와의 협력을 증진할 것입니다. 끔찍한 과거에도 불구하고, 우리 앞에는 멋진 미래가 놓여 있습니다."
 SER_honey_and_milk_approach: "꿀과 우유의 외교"
 SER_honey_and_milk_approach_desc: "코소보와 마케도니아는 언제나 남쪽에서의 우리의 주된 문제였지만, 이제 우리는 이 문제를 잠재적인 친구이자 파트너로 바꿀 채비가 되어 있습니다. 이들의 연방 가입이 우리에게 남쪽으로의 길을 열어 줄 것이므로 이들과 관계를 맺는 것이 중요합니다."
 SER_confederation_bos: "보스니아와의 협상"
 SER_confederation_bos_desc: "마침내 연방 가입에 관한 협상을 시작할 준비가 되었습니다. 즉각 합의하고 연방 가입을 설득할 수 있을지는 확실하지 않지만, 우리는 긴 과정을 감당할 준비가 되어 있습니다."
 SER_confederation_slv_cro: "슬로베니아 및 크로아티아와의 협상"
 SER_confederation_slv_cro_desc: "마침내 연방 가입에 관한 협상을 시작할 준비가 되었습니다. 즉각 합의하고 연방 가입을 설득할 수 있을지는 확실하지 않지만, 우리는 긴 과정을 감당할 준비가 되어 있습니다."
 SER_confederation_mac_kos: "코소보 및 마케도니아와의 협상"
 SER_confederation_mac_kos_desc: "마침내 연방 가입에 관한 협상을 시작할 준비가 되었습니다. 즉각 합의하고 연방 가입을 설득할 수 있을지는 확실하지 않지만, 우리는 긴 과정을 감당할 준비가 되어 있습니다."
 SER_confederation_created: "연방의 두 번째 단계"
 SER_confederation_created_desc: "발칸 연방 국가라는 우리 구상의 두 번째 단계를 완료했습니다. 이제 유고슬라비아의 일부였던 적이 없는 국가들을 향해 나아갈 준비가 되었습니다."
 SER_multicultural_guarantees: "다문화주의 보장"
 SER_multicultural_guarantees_desc: "우리 연방 안에 거주하는 민족들의 다문화주의를 보호하기 위한 사상과 법률을 장려할 것입니다."
 SER_a_newer_identity: "새로운 민족 정체성"
 SER_a_newer_identity_desc: "The Balkan people must become a new national identity for all the peoples inhabiting our Federation, the only way we can find unity.."
 SER_confederation_alb: "알바니아와의 협상"
 SER_confederation_alb_desc: "마침내 연방 가입에 관한 협상을 시작할 준비가 되었습니다. 즉각 합의하고 연방 가입을 설득할 수 있을지는 확실하지 않지만, 우리는 긴 과정을 감당할 준비가 되어 있습니다."
 SER_confederation_gre: "그리스와의 협상"
 SER_confederation_gre_desc: "마침내 연방 가입에 관한 협상을 시작할 준비가 되었습니다. 즉각 합의하고 연방 가입을 설득할 수 있을지는 확실하지 않지만, 우리는 긴 과정을 감당할 준비가 되어 있습니다."
 SER_confederation_bul: "불가리아와의 협상"
 SER_confederation_bul_desc: "마침내 연방 가입에 관한 협상을 시작할 준비가 되었습니다. 즉각 합의하고 연방 가입을 설득할 수 있을지는 확실하지 않지만, 우리는 긴 과정을 감당할 준비가 되어 있습니다."
 SER_confederation_romania: "루마니아와의 협상"
 SER_confederation_romania_desc: "마침내 연방 가입에 관한 협상을 시작할 준비가 되었습니다. 즉각 합의하고 연방 가입을 설득할 수 있을지는 확실하지 않지만, 우리는 긴 과정을 감당할 준비가 되어 있습니다."
 SER_south_european_balkan_confederation: "발칸, 새로운 권력의 중심"
 SER_south_european_balkan_confederation_desc: "우리 연방은 이제 광대한 영토에 걸쳐 있으므로, 우리가 새로운 권력의 중심이며 강대국들이 더 이상 우리에게 개별적으로 영향을 미칠 수 없다고 선언할 채비가 되었습니다."

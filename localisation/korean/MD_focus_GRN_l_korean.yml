l_korean:
 greenland_focus: "그린란드 중점 계통도"
 GRN_intro_to_greenland_shortcut: "그린란드 소개"
 GRN_greenland_foreign_policy_tree: "그린란드 외교 정책"
 GRN_focus_The_Great_Ice_Island: "거대한 얼음 섬"
 GRN_focus_The_Great_Ice_Island_desc: "Greenland is one of the largest known islands in the world after the technically continent of Australia. The island hosts roughly 58 thousand citizen who primarily come from the Inuit culture group. Greenland is seen as the last major frontier of developing earth second only to actively doing something with either north or south pole of the planet itself. Now in the 21st century Greenland and its people see themselves as the last real colony and actively seek for true independence. But will they find themselves free at last or will they fall flat from proving the island can truly stand on its own."
 GRN_focus_The_People: "국민"
 GRN_focus_The_People_desc: "우리나라가 겪는 핵심 문제 중 하나는 사람이 부족하다는 것입니다. 사람에게는 식량, 거처, 그리고 어려울 때 돌보고 도와줄 공공 서비스가 필요합니다. 따라서 사람들이 찾아와 머물고 싶어 할 미래를 확보하려면 이러한 점들을 해결해야 합니다. 미래가 없어 보일 수도 있는 이곳에서 그들만의 미래를 만들 수 있도록 말입니다."
 GRN_focus_Food_Security: "식량 안보"
 GRN_focus_Food_Security_desc: "Our main source of food on the island is that of our fisheries. But the fisheries are also our main economic chokepoint, so how can we feed ourselves if we also import the same stuff. Well this is one of the key pillars we must establish if we are to have any sort of stable future."
 GRN_focus_Breaking_Ground_For_Farmlands: "\\"농지\\" 기공"
 GRN_focus_Breaking_Ground_For_Farmlands_desc: "온실과 수직 농업 프로젝트입니다. 이러한 주요 작물은 우리나라의 새로운 식량 공급의 토대가 될 것이므로, 이 식량을 재배하고 가꿀 설비를 만들어야 합니다. 이 과정에는 에너지가 많이 들지만, 기반시설을 갖추고 우리의 자원을 다시 살펴본다면 일을 시작할 기초 정도는 마련할 수 있을 것입니다."
 GRN_focus_East_Farmland_Projects: "동부 \\"농지\\" 프로젝트"
 GRN_focus_East_Farmland_Projects_desc: "초기에 서부에서 기초 작업을 했던 것처럼 동부에서도 같은 일을 해야 합니다. 전국에, 그리고 꽤 드문드문한 정착지에 물류와 분배를 돕는 소규모 식량 거점을 두는 것입니다."
 GRN_focus_Growing_Staple_Foods: "주식 작물 재배"
 GRN_focus_Growing_Staple_Foods_desc: "혹독한 환경의 농업 프로젝트에서 초기 성과로는 당분간 주식 작물만 재배될 것입니다. 감자, 밀, 그리고 열량 섭취에 도움이 되고 식사량을 늘리기 쉬운 소수의 핵심 작물이 그것입니다."
 GRN_focus_Strategic_Cash_Crops: "전략적 환금 작물"
 GRN_focus_Strategic_Cash_Crops_desc: "The SCC program is a limited corner of our new HFPs as we attempt to bolster the nations domestic food supply we can also look into limited cash crops like cotton and such as a way to foster domestic industrial growth as well."
 GRN_focus_National_Seed_Vault: "국가 종자 저장고"
 GRN_focus_National_Seed_Vault_desc: "As we expand our HFPs both on a national scale and in local operations, we must be able to diversify and expand the types of crops we can grow. As such we'll create a national seed vault to preserve and properly distribute rotating crops so our nation can enjoy as much of bounties of the world as possible."
 GRN_focus_Stable_Population_Growth: "안정적인 인구 성장"
 GRN_focus_Stable_Population_Growth_desc: "Our nation over its entire existence has been hampered by the inability to stabilize the population. Many flee due to the harsh conditions or to see the wider world. Which lets be real, we can't blame them for wanting more in their lives, but we can blame ourselves for not working to give folks the reasons to stay. We can't do anything about the weather, but we can develop towns and settlements to be more convincing for folks to want to stay and help improve their homes."
 GRN_focus_Planning_New_Settlements: "신규 정착지 계획"
 GRN_focus_Planning_New_Settlements_desc: "The ability to grow our population is hindered by proper housing and planning of new towns as a whole. Everything is mostly formed around the capital of Nuuk so in these early stages of planning and development we'll have to use the capital as a base from which to ferry logistics from for the time being."
 GRN_focus_Spread_Settlement_Planning_East: "동부로 정착지 계획 확대"
 GRN_focus_Spread_Settlement_Planning_East_desc: "수도 누크가 섬 서부의 물류 기지이긴 하지만, 말하자면 \\"동부의 수도\\"와 같은 것을 세워야 합니다. 그래야 동부에도 정착지 개발을 계획하고 분배할 물류 거점이 생겨, 우리나라의 두 주요 지역이 함께 성장할 수 있습니다."
 GRN_focus_New_Hope_Settlement: "새 희망 정착지"
 GRN_focus_New_Hope_Settlement_desc: "To strive for a better tomorrow, a better future and just a better life for our citizens, we set forth to establish a brand new centrally northwestern settlement called Neriunneq nutaaq or in english, roughly translates to New Hope. We wish to make this a beacon of our progress in developing the nation and the western half of the island."
 GRN_focus_Great_Star_Settlement: "거대한 별 정착지"
 GRN_focus_Great_Star_Settlement_desc: "To attempt to evenly disperse our development and ensure even logistical needs through our continual development efforts, we will be creating an eastern settlement around the same lateral area as the western settlement. Named Annertuumik Stjerne which roughly translates in english as Great Star or \"Big Star\", we hope to use this as a core eastern base as a way to begin spreading development efforts as we handle both coastal growth and look inwards towards the Great Ice Shelf."
 GRN_focus_Development_Living_Grants: "개발 정착 보조금"
 GRN_focus_Development_Living_Grants_desc: "The DLG program is a government issued grant to encourage immigration to the nation. The core principle is the grant will cover travel costs and settlement costs. Once the individual or individuals are settled and are helped placed at a place of work where they have a stable income then the grant will stop. Essentially its an investment through human resources to encourage population growth through the active development of the nation."
 GRN_focus_Developing_Public_Services: "공공 서비스 개발"
 GRN_focus_Developing_Public_Services_desc: "공공 체계와 기반시설을 개선하고 확대하면 국민의 삶의 질이 크게 향상될 것입니다. 교육, 의료, 복지에 대한 소소한 개선을 다수 추진하는 한편, 국가의 미래를 위해 더욱 안전한 인터넷 서비스도 구축할 것입니다."
 GRN_focus_Recruiting_More_Teachers: "교사 추가 채용"
 GRN_focus_Recruiting_More_Teachers_desc: "우리 교육 체계의 큰 문제는 교직원 부족입니다. 교사 한 명이 맡는 학급이 커지면서 많은 학생이 단지 제대로 배울 방법이 없다는 이유로 학업을 포기하고 있습니다. 따라서 국내외 교사를 더 채용하여 아이들을 가르치고 길러 줄 사람들을 불러와야 합니다. 이것이 교육을 받으며 배우고 성장하기를 바라는 모든 이에게 더 밝은 미래를 열어 주는 열쇠가 되기를 바랍니다."
 GRN_focus_Improving_Medical_Stockpiles: "의료 비축량 개선"
 GRN_focus_Improving_Medical_Stockpiles_desc: "의약품, 인력, 장비. 국민의 건강 수요를 제대로 돌보기 위해 필요한 주요 요소입니다. 따라서 어떤 수요가 발생하더라도 충족할 수 있도록 저장 용량과 취급 능력을 개선해야 합니다."
 GRN_focus_Creating_Concentrated_Internet_Services: "집중형 인터넷 서비스 구축"
 GRN_focus_Creating_Concentrated_Internet_Services_desc: "인터넷 접속은 전반적으로 현대 사회와 선진 경제의 필수 요소나 다름없습니다. 우리나라가 더 넓은 세계와 더 잘 연결될 수 있도록 제한적인 형태나마 인터넷 체계를 구축해야 합니다. 일부 분야에서는 인터넷 서비스가 제공하는 효율성에서 국민과 공공 서비스도 수동적으로 혜택을 볼 수 있을 것입니다."
 GRN_focus_Recruiting_More_Social_Workers: "사회복지사 추가 채용"
 GRN_focus_Recruiting_More_Social_Workers_desc: "인력의 양과 질을 개선하면, 개발 노력으로 인구가 늘어날 가능성이 있는 상황에서도 사회 서비스가 국가의 수요를 충분히 감당할 수 있습니다. 비용이 걱정거리이긴 하지만, 정말 도움이 필요할 때 보살핌을 받지 못한다는 것을 알고 사람들이 떠나게 된다면 아무 의미가 없습니다."
 GRN_focus_Basic_Eastern_Roadworks: "동부 기초 도로 공사"
 GRN_focus_Basic_Eastern_Roadworks_desc: "동부는 우리나라에서 개발이 더 뒤처진 지역이므로, 도로를 개선하여 물류 지원을 늘림으로써 힘을 실어 주어야 합니다. 우선순위로서 가장 중요한 일은 아니지만, 이 지역을 계속 개발하고 성장시킴에 따라 더 나은 표현이 없어 아쉽지만 그들이 따라갈 수 있는 기본 틀을 미리 깔아 두는 것이 유익할 것입니다."
 GRN_focus_Greenlandic_Economy: "그린란드 경제"
 GRN_focus_Greenlandic_Economy_desc: "사람들에게는 물자가 필요하고, 살아갈 방법이 필요하며, 일하고 생계를 꾸릴 능력이 필요합니다. 따라서 경제를 발전시키고, 자원을 채굴할 능력과 이를 뒷받침할 기반시설을 개발하는 일을 계획하고 투자해야 합니다."
 GRN_focus_Economic_Diversification: "경제 다변화"
 GRN_focus_Economic_Diversification_desc: "우리나라는 여러 면에서 제약이 많기 때문에, 경제 수단을 확대할 수 있도록 기반을 마련하고 확실히 다져야 합니다. 어업이나 거의 봉건적인 방식의 경제 유지만으로는 나라도 국민도 어디에도 이르지 못합니다. 이를 바로잡아야 합니다."
 GRN_focus_Western_Zoning: "서부 구역 설정"
 GRN_focus_Western_Zoning_desc: "수도가 서쪽에 있으므로, 그 일대에서 구역 설정과 개발의 초기 단계를 시작할 것입니다. 지반의 안정성과 수요를 조사하고 전담 산업을 가동할 수단을 마련하는 데는 평소보다 훨씬 많은 비용이 들 것입니다. 그러나 가장 가혹한 자연환경과 맞서 싸우려 한다면 그 비용을 감수하고 이해해야 합니다."
 GRN_focus_Eastern_Groundworks: "동부 기초 공사"
 GRN_focus_Eastern_Groundworks_desc: "경제적으로, 그리고 인구 성장이나 최소한 안정 측면에서 어딘가에 도달하려면 우리가 가진 모든 가용 토지를 활용해야 합니다. 따라서 이러한 초기 계획 단계에서는 동부 프로젝트를 위한 기초 공사를 일찍 시작하는 것이 필수적입니다."
 GRN_focus_Basic_Industrialization: "기초 산업화"
 GRN_focus_Basic_Industrialization_desc: "기초 작업과 구역 설정이 끝났으니, 우리나라가 앞으로 필요로 할 작지만 근본적인 제조업을 세울 수 있습니다. 물론 채굴 상황을 파악하기 전까지는 자재를 수입에 의존해야 합니다. 덴마크를 통한 EU와의 연결을 이 문제에 활용할 수 있다는 것이 다행입니다."
 GRN_focus_Basic_Coastal_Manufacturing: "기초 해안 제조업"
 GRN_focus_Basic_Coastal_Manufacturing_desc: "기존 어업 활동을 보완하면서, 덴마크와의 거래는 물론 우리가 국가로서 발전하고 성장하도록 돕고자 하는 이들과의 거래에도 쓸 우리 자체의 무역선을 건조할 기반을 마련할 수 있습니다."
 GRN_focus_Babys_First_Economy: "아기의 첫 경제"
 GRN_focus_Babys_First_Economy_desc: "이제 사람들이 와서 일할 무대를 마련할 핵심 토대가 생겼습니다. 이제 사람들을 뒷받침할 기반시설과, 나라를 정체시키는 약 일곱 가지의 다른 중대한 문제를 개발하기만 하면 됩니다. 그래도 아장아장, 한 걸음씩 나아가면 언젠가는 해낼 것입니다."
 GRN_focus_Infrastructure_Development: "기반시설 개발"
 GRN_focus_Infrastructure_Development_desc: "우리나라를 연결하고 성장시키는 가장 좋은 방법은 표준화되고 유연한 기반시설 체계를 구축하는 것입니다. 이를 위해 지질학, 공학 등의 전문가를 고용하여 우리에게 필요한 기반시설의 종류를 계획해야 합니다. 또한 대대적인 개편이 필요해지기 전까지 최대한 오래 갈 수 있도록 개발하고 계획하는 최선의 방법도 알아야 합니다."
 GRN_focus_The_Network_Debate: "도로망 논쟁"
 GRN_focus_The_Network_Debate_desc: "제대로 된 도로망을 구축하는 일은 우리가 시도하려는 거의 모든 일만큼이나 어려울 것입니다. 따라서 도로가 어떤 모습이 될지 그 시작을 위해 측량하고 기초를 닦아야 합니다. 수도 누크에서 시작하면 표준을 세우는 데 도움이 될 뿐 아니라, 적어도 서부 해안 지역에 자원과 사람을 전국으로 퍼 나르는 고동치는 심장을 만들 수 있습니다."
 GRN_focus_Narrow_Gauge_Standard: "협궤 표준"
 GRN_focus_Narrow_Gauge_Standard_desc: "철도 장비와 운행에 대한 국가 표준을 만들면 앞으로 철도를 어떻게 발전시킬지에 대한 속도와 기준선이 정해집니다. 협궤를 사용하면 지형에 더 유연하게 대응할 수 있고, 건설과 유지 비용이 저렴하며, 선로 기반의 구조와 토대를 제대로 확보하는 데도 비용 효율이 더 높습니다."
 GRN_focus_Capital_Course: "수도 노선"
 GRN_focus_Capital_Course_desc: "Starting out from the capital and branching into smaller settlements will allow for a more ease of travel and better connectivity over mid ranged distances. Of course this is merely a single step but you gotta put one foot in front of the other just to walk across the floor, now don't you."
 GRN_focus_Nuuk_Western_Railway: "누크 서부 철도"
 GRN_focus_Nuuk_Western_Railway_desc: "With the establishment of the NWR in Greenland we can now better connect the dispered settlements in the near capital region as well as use this as a foundation for future endeavors in both economic and personnel transportation needs of the nation."
 GRN_focus_Infrastructure_Infancy: "기반시설의 유아기"
 GRN_focus_Infrastructure_Infancy_desc: "국가 기반시설을 시작하기 위한 이 중요하지만 단순한 첫걸음을 내디딘 지금, 우리가 통제하는 이 땅을 성장시키고 개발하는 데 있어 새롭고 진화하는 선례를 세울 수 있습니다."
 GRN_focus_Ministry_For_Mineral_Affairs: "광물부"
 GRN_focus_Ministry_For_Mineral_Affairs_desc: "광물부, 일부가 농담 삼아 MMA라고 부르는 이 기관은 지질학, 구조 안전, 일반 채굴 실무 전문가를 고용하여 국가 자원 채굴에 대한 초기 핵심 투자가 처음부터 안전하고 효과적으로 이루어지도록 하는 정부 전담 기구입니다. 이를 통해 모든 확장이 초창기에 세워진 선례에 부합하도록 보장할 것입니다."
 GRN_focus_Domesticating_Energy_Needs: "에너지 수요의 국산화"
 GRN_focus_Domesticating_Energy_Needs_desc: "우리나라는 원칙적으로 에너지가 필요합니다. 난방, 전력, 그리고 경제와 공급망의 기본 수요를 위해서입니다. 따라서 일부 석탄 매장지를 조사하고 전략적 채굴 작업을 시작하여 수입을 줄이고 국내 여건을 개선할 것입니다."
 GRN_focus_Limited_Strategic_Resource_Extraction: "제한적 전략 자원 채굴"
 GRN_focus_Limited_Strategic_Resource_Extraction_desc: "제한적 전략 자원 채굴 사업은 국내에서 소규모 중금속 또는 보다 전략적인 광물 채굴 작업을 개발하려는 계획입니다. 수도에서 멀지 않은 곳에서 발견되는 티타늄 같은 것들이며, 더 확대하고자 한다면 동부에도 상당한 매장량이 있습니다."
 GRN_focus_Cornerstone_Creation: "초석의 창조"
 GRN_focus_Cornerstone_Creation_desc: "콘크리트 외에도, 현대 경제의 주요 기둥 중 하나는 강철을 생산하는 능력입니다. 석탄과 철광석 매장지가 있으니, 아기의 첫 제철소를 시작하지 못할 이유가 없습니다. 작을지 몰라도, 이 재료들을 우리나라 발전에 분명히 활용할 수 있을 것입니다."
 GRN_focus_Extracting_Natural_Capital: "자연 자본 채굴"
 GRN_focus_Extracting_Natural_Capital_desc: "저 언덕에는 금이 있다고들 합니다. 그 말이 맞았고, 금은 몸에 걸치는 것 말고도 훨씬 많은 용도로 쓰일 수 있습니다. 이 거의 \\"공짜 자본\\"이나 다름없는 금으로 향후 사업을 일으키고, 평소보다 많은 투자가 필요한 예산을 안정시키는 데 쓸 수 있습니다."
 GRN_focus_Securing_Mining_Futures: "채굴의 미래 확보"
 GRN_focus_Securing_Mining_Futures_desc: "관료적 형식주의를 처리하고, 규정을 조정하며, 에너지 중심의 채굴 작업에 더 무게를 두면 에너지 밀도가 높은 돌 하나로 여러 마리 새를 잡을 수 있습니다."
 GRN_focus_The_Future: "미래"
 GRN_focus_The_Future_desc: "현재를 바로잡는 것이 최우선이지만, 미래를 준비하지 않고 현재만 바로잡을 수는 없습니다. 따라서 우리나라의 궁극적인 목표는 해안 지역 주민뿐 아니라 빙붕 위에서 살고 싶어 하는 이들의 미래까지 확보하고 건설하는 것입니다. 결국 얼음은 얼어붙은 물일 뿐이고, 우리는 이제 담수를 증류할 수 있지 않습니까."
 GRN_focus_Coastal_Economic_Zones: "해안 경제 구역"
 GRN_focus_Coastal_Economic_Zones_desc: "그린란드의 성장하는 미래를 위한 궁극적인 목표는 내륙을 길들이는 능력입니다. 사람들은 얼음 위에서 살 수는 없다고 하고, 우리는 물론이라고 답합니다. 그러나 얼음이 담수가 아니면 무엇이며, 얼음에서 물을 얻으려면 녹이면 됩니다. 따라서 해안선에 목표 지향적 경제 구역을 개발하여 무대를 마련하고, 빙붕 증류 공정을 시작할 재정 능력을 확보해야 합니다. 길고 고된 일이 되겠지만, 의지를 지켜 나간다면 오지를 가로지르는 북쪽으로의 느린 행군이 우리 앞에 있습니다."
 GRN_focus_Foreign_Logistics_Hub_One: "해외 물류 거점 1호"
 GRN_focus_Foreign_Logistics_Hub_One_desc: "The most central location towards setting up an economic zone on the coast is actually the furthest southern point on the island. Not far from Tasiusaq we'll use some of the more gentle slopping fjords to mold and create an extensive harbor and port \"city\" like apparatus. This staging ground will help with western advancements on the great trek north."
 GRN_focus_Foreign_Logistics_Hub_Two: "해외 물류 거점 2호"
 GRN_focus_Foreign_Logistics_Hub_Two_desc: "해안에 경제 구역을 세우기에 가장 중심이 되는 위치를 보완하기 위해, 일리레크 마을 인근에 비슷한 시설을 세울 것입니다. 이 집결지는 북쪽으로의 대장정에서 동부 쪽 전진을 돕고, 두 남부 구역을 하나의 연결 해안 경제 구역으로 결합하게 됩니다."
 GRN_focus_West_Hub_Distillation_Facility: "서부 거점 증류 시설"
 GRN_focus_West_Hub_Distillation_Facility_desc: "Establishing a comprehensive distillation facility to begin extraction operations of Ice Shelf ice will allow us to increase domestic water supply and allow us to passive create a pathway north through the ice shelf. This process will be costly and require us to import staff for an extended period until we can train and hire locals. But the long term goal of development and usability of the lands locked beneath the frozen wastes will be worth it."
 GRN_focus_East_Hub_Distillation_Facility: "동부 거점 증류 시설"
 GRN_focus_East_Hub_Distillation_Facility_desc: "Expanding upon the general use of the CCEZ we've created, the second main distillation facility to supplement western advances is now under works. As East Hub Distillation will do the same thing but work towards eastern progress through a united push northwards."
 GRN_focus_Southern_Fjords_Railway: "남부 피오르드 철도"
 GRN_focus_Southern_Fjords_Railway_desc: "이 지역에 철도를 놓으면 연결 해안 경제 구역 전체를 더 잘 연결할 수 있을 뿐 아니라, 가능한 곳에서 주거 및 상업 용도로 남부 여러 지역에 물 공급을 운반하는 데도 도움이 됩니다."
 GRN_focus_Staging_Zones_For_The_Shelf: "빙붕을 위한 집결 구역"
 GRN_focus_Staging_Zones_For_The_Shelf_desc: "거대 빙붕을 길들이겠다는 우리의 원대한 야망을 추진하려면, 얼어붙은 물을 그저 바다에 내버리는 대신 실제로 활용할 수 있도록 먼저 전략적 집결 구역을 설치해야 합니다."
 GRN_focus_The_Great_Eastern_Staging_Grounds: "거대한 동부 집결지"
 GRN_focus_The_Great_Eastern_Staging_Grounds_desc: "동부는 섬에서 인구가 가장 적은 지역이며, 이는 거대 빙붕 오지로의 최종적 진군을 위한 기초 작업을 하기 위해 전문가를 고용하고 계약하여 사실상 거주시켜야 함을 의미합니다. 이를 위해 팅미아르미트 섬을 핵심 집결지로 활용하고, 본섬 바로 해안선의 지형을 채굴하고 고르는 작업부터 시작할 것입니다."
 GRN_focus_Capital_Staging_Works: "수도 집결 공사"
 GRN_focus_Capital_Staging_Works_desc: "수도 누크 주변 지역은 섬에서 가장 발전한 지역 중 하나입니다. 따라서 서부의 주 집결지를 수도 지역에 세우는 것이 합리적입니다. 증류 공장, 연구 개발 센터로 이루어진 전용 종합 단지와, 전문가와 교사를 수입해 궁극적으로 이 터전을 그린란드인에게 넘겨줄 수 있도록 하는 상당한 정부 지원금이 마련됩니다. 상당한 시간과 자원이 들겠지만, 그 모든 얼어붙은 물을 녹여 내륙의 진짜 기반암을 발견하는 일은 결코 작은 과업이 아닙니다."
 GRN_focus_Meeting_Needs: "수요 충족"
 GRN_focus_Meeting_Needs_desc: "우리가 의도하는 만큼 정교한 설비를 만들려면 현지 공급망, 적어도 가능한 한 현지에 가까운 공급망을 구축해야 합니다. 산업 및 상업 수요를 충족하는 소규모 업체들은 집결지 개발을 뒷받침할 것이며, 나아가 향후 내륙 진출의 기준을 세울 것입니다."
 GRN_focus_Supplying_Outposts: "전초기지 보급"
 GRN_focus_Supplying_Outposts_desc: "공식적으로 그린란드에는 군대가 없지만, 거대 빙붕으로 이어지는 보급선을 구축하는 데 합리적인 진전을 이루려면 모든 종류의 보급 수요가 충족되도록 해야 합니다. 따라서 사냥과 잠재적 약탈자로부터의 자위에 유용한 무기와 탄약을 전초기지에 공급하는 데 맞춘 극히 소규모의 무기 산업을 세울 것입니다. 어쨌든 아무것도 없는 곳 한가운데서는 비명을 질러도 아무도 듣지 못하니까요."
 GRN_focus_General_National_Investments: "일반 국가 투자"
 GRN_focus_General_National_Investments_desc: "우리나라의 재정과 내부 안정을 위해 채굴, 수송, 일반적 개선이 이루어져야 합니다. 무대가 마련되고 기초 작업이 본격적으로 시작되었으니, 앞으로 몇 년간 거대 빙붕을 길들이는 우리 국민의 연극을 펼칠 극장이 이제 생겼습니다. 이와 함께 누크 서부 철도와 남부 피오르드 철도 회사도 연결되어 대서부 피오르드 철도를 이루게 됩니다."
 GRN_focus_Greater_Greenland_Act: "대그린란드법"
 GRN_focus_Greater_Greenland_Act_desc: "Dedicated funding to better the families of the nation as well as looking for those of similar cultural and ethnic backgrounds who may want to live in a more united realm then they currently do. This section of the act is dedicated to populating the Western Region."
 GRN_focus_Eastern_Population_Act: "동부 인구법"
 GRN_focus_Eastern_Population_Act_desc: "Dedicated funding to better the families of the nation as well as looking for those of similar cultural and ethnic backgrounds who may want to live in a more united realm then they currently do. This section of the act is dedicated to populating the Eastern Region from the Greater Greenland Act."
 GRN_focus_Battle_For_Independence: "독립을 위한 투쟁"
 GRN_focus_Battle_For_Independence_desc: "우리는 기로에 섰습니다. 덴마크 의회가 우리의 국가적 지위와 관련된 움직임을 시작했습니다. 그것이 긍정적이든 부정적이든 우리는 스스로를 지켜야 하며, 따라서 국가들 사이에서 우리의 인지도를 높이기 위한 압박 활동에 대대적으로 투자하고, 평화적인 독립 해결을 어느 정도 강제할 수 있기를 바랄 것입니다."
 GRN_focus_Rushed_Mobilization_Efforts: "서두른 동원 노력"
 GRN_focus_Rushed_Mobilization_Efforts_desc: "우리는 더 이상 덴마크의 억압적 책동에 굴복하지 않기로 결정했습니다. 따라서 덴마크의 본격적인 침공으로부터 섬을 방어하는 데 필요하다고 판단되는 최소한의 병력을 서둘러 동원할 것입니다."
 GRN_focus_Organizing_Fundamentals_In_Training: "기초 훈련 조직"
 GRN_focus_Organizing_Fundamentals_In_Training_desc: "기초 훈련 시설을 서둘러 설립하는 것은, 다가오는 침공군으로부터 섬을 방어해야 한다면 가장 신속한 속성 과정을 제공하기 위해 필요합니다."
 GRN_focus_If_It_Floats_Its_A_Boat: "뜨면 배다"
 GRN_focus_If_It_Floats_Its_A_Boat_desc: "덴마크 해군이 섬 점령에 앞장설 가능성이 높습니다. 비용이 들겠지만, 우리가 세계 무대에서 진지한 국가로 여겨지려면 시간을 끌 무언가를 긁어모아야 합니다."
 GRN_focus_Removing_The_Last_Loose_Ends: "마지막 미해결 사안 정리"
 GRN_focus_Removing_The_Last_Loose_Ends_desc: "덴마크 왕실과의 관계를 끊음으로써 우리는 이제 독립된 국가이며, 따라서 한때 식민지 지위가 누리던 본래의 특권이 없습니다. 그러므로 특정 측면을 재편하고 마주칠 수 있는 잠재적 부족분을 메우는 방안을 모색해야 합니다."
 GRN_focus_Stabilizing_Domestic_Short_Comings: "Stabilizing Domestic Short Comings"
 GRN_focus_Stabilizing_Domestic_Short_Comings_desc: "행정 노력을 재정비하고 모든 정부 서비스를 우리 정부 아래로 간소화하면 현재 상황의 실상을 파악할 수 있을 것입니다."
 GRN_focus_Greenland_Armed_Services: "그린란드 군"
 GRN_focus_Greenland_Armed_Services_desc: "새로 얻은 독립으로 방위는 이제 온전히 우리의 통제 아래 있습니다. 가진 것은 많지 않지만 어디선가는 시작해야 합니다. 그렇지 않습니까?"
 GRN_focus_A_New_Chapter: "새로운 장"
 GRN_focus_A_New_Chapter_desc: "From this day forward we turn a new leaf. We strive to build, prosper and improve both the nation and our citizen's lives so that way we may set course for a brighter future for all who wish to see and live in Greenland."
 GRN_focus_Northern_Political_Lights: "북방의 정치적 오로라"
 GRN_focus_Northern_Political_Lights_desc: "새로 찾은 자유로 이제 공직에 출마하려는 이들에게 문호를 열 수 있습니다. 물론 이는 제도를 악용하려는 이들도 상대해야 함을 의미합니다. 그러나 우리는 민주주의 가치를 지닌 나라이며, 따라서 제도와 국민을 신뢰할 것입니다."
 GRN_focus_Atassut_Claims_Victory: "아타숫의 승리 선언"
 GRN_focus_Atassut_Claims_Victory_desc: "독립 이전 시절 우리의 정치는 정체되어 있었습니다. 모두가 덴마크의 멍에에서 벗어나는 데에만 집중했습니다. 이제 그렇게 되었으니 새로운 길을 개척할 수 있습니다. 안정적인 사회적 가치 구축과 재정적 보수주의적 사고가 혼합된 길로, 미래를 위해 나라의 균형을 잡을 것입니다."
 GRN_focus_Making_New_Greenlandic_Standards: "새로운 그린란드 기준 마련"
 GRN_focus_Making_New_Greenlandic_Standards_desc: "고유 언어를 둘러싼 교육을 개혁하고, 교사 수를 늘리고, 학생들이 할 수 있는 일의 기준을 전반적으로 높이면 우리나라의 잠재력이 크게 높아질 것입니다."
 GRN_focus_Improving_Medical_Facilities: "의료 시설 개선"
 GRN_focus_Improving_Medical_Facilities_desc: "전반적인 조달 개선과 의료 시설 평면 구조 개선을 통해, 이동의 편의성과 필요한 자원에 대한 접근성을 높여 진료와 치료의 새로운 속도를 정립할 수 있습니다."
 GRN_focus_Casting_Better_Social_Nets: "더 나은 사회 안전망 구축"
 GRN_focus_Casting_Better_Social_Nets_desc: "자원을 더 잘 배분할 수 있도록 사회 프로그램을 개혁하면 운이 따르지 않았거나 인생의 여정이 끝나가는 국민을 보호할 수 있을 것입니다."
 GRN_focus_Domestic_Agriculture_Projects: "국내 농업 프로젝트"
 GRN_focus_Domestic_Agriculture_Projects_desc: "국내 농업을 확보한다는 것은 더 안정적인 식량원을 갖는다는 뜻입니다. 이는 우리의 고강도 농업 프로젝트 \\"혹독한 환경 농업 프로젝트\\"와 결합하여 우리나라의 경제와 인구에 계속 이익을 주고 성장시킬 것입니다."
 GRN_focus_Increasing_Industrial_Development: "산업 개발 확대"
 GRN_focus_Increasing_Industrial_Development_desc: "경제를 꾸준히 성장시키고 다변화하면 국내 및 잠재적 대외 문제에 대해 더 안정적이고 탄탄하게 접근할 수 있습니다."
 GRN_focus_General_Armaments: "일반 군수품"
 GRN_focus_General_Armaments_desc: "군수품의 품질과 일반 조달을 개선하는 소규모 투자로 우리의 최소 규모 군이 국가와 국민을 방어하는 데 더 나은 처지에 놓이게 됩니다."
 GRN_focus_Growing_Power_Production: "전력 생산 확대"
 GRN_focus_Growing_Power_Production_desc: "국내 전력 생산 능력을 개선하면 경제를 성장시킬 수 있을 뿐 아니라, 저렴한 전기를 통해 국민의 삶의 질도 높일 수 있습니다."
 GRN_focus_National_Alumina_Research_Institute: "국립 알루미나 연구소"
 GRN_focus_National_Alumina_Research_Institute_desc: "The NARI complex is a dedicated Alumina and other hard to extract mineral research and development center. The goal is to find ways to improve and make more efficient the ways in which can come by these minerals. Alumina is mainly found in Bauxite ore in high concentration, however we don't have bauxite. But we do have many Feldspar deposits which feldspar minerals tend to have nearly up to 20% of its weight in Alumina and thus through a more costly measure we are able to secure a domestic supply. But its not much and Aluminium is used in a lot of things, so we must expand in this field as much as possible."
 GRN_focus_Military_Investment_Package: "군사 투자 패키지"
 GRN_focus_Military_Investment_Package_desc: "이 일반 투자 패키지는 장비 품질을 개선하고 병사 급여를 인상하는 데 사용됩니다. 일부 자금은 필요한 곳의 훈련 시설을 더 잘 표준화하는 데에도 책정됩니다."
 GRN_focus_Demokraatit_Secures_Victory: "데모크라아티트의 승리 확보"
 GRN_focus_Demokraatit_Secures_Victory_desc: "데모크라아티트당은 그린란드 정치에서 오랫동안 거의 약자와 같은 접근 방식을 취해 왔습니다. 두 주요 정당과 상당히 노선이 비슷하지만 미묘한 차이가 있어 보통 당이 \\"만년 3위\\"로 밀려나곤 했습니다. 그러나 독립 시대의 승리와 함께 오늘부로 그것이 바뀌며, 이제 우리는 최선을 다해 국가와 국민을 확실히 더 낫게 만들 수 있습니다."
 GRN_focus_Economic_Assimilation_Visas: "경제적 동화 비자"
 GRN_focus_Economic_Assimilation_Visas_desc: "비자 제도를 활용하여 국가 발전을 돕고 인구를 꾸준히 늘리면 국가의 미래 계획에 큰 도움이 될 것입니다."
 GRN_focus_Improved_Community_Programs: "개선된 지역사회 프로그램"
 GRN_focus_Improved_Community_Programs_desc: "Common understanding between police and the citizens they protect is a prime driver of cohesion vs discourse. We must ensure consistent measures are taken to keep most on the same page so if and when something does happen, then we don't end up like those in America for example."
 GRN_focus_Rewriting_Mining_Regulations: "채굴 규정 개정"
 GRN_focus_Rewriting_Mining_Regulations_desc: "채굴 관행에 관한 규정은 지나치게 과하고 나라의 현재 상태와도 맞지 않습니다. 따라서 업계를 더 잘 표준화할 수 있도록 접근 방식을 다시 잡아야 합니다."
 GRN_focus_Hospice_Care_Funding: "호스피스 돌봄 재정 지원"
 GRN_focus_Hospice_Care_Funding_desc: "호스피스 돌봄에 더 많고 전담적인 재정을 지원하면 가족들이 해야 할 일에 더 집중할 수 있고, 일상을 살아가느라 노인들이 방치될까 걱정하지 않아도 됩니다."
 GRN_focus_Creating_A_Basic_Office_Sector: "기초 사무 부문 창출"
 GRN_focus_Creating_A_Basic_Office_Sector_desc: "경제 다변화를 계속하려면 작지만 의미 있는 사무 및 기술 계열 산업에 투자하여 국가와 국민의 삶의 방식을 계속 개선해야 합니다."
 GRN_focus_Expanding_Existing_HFPs: "기존 고강도 농업 프로젝트 확대"
 GRN_focus_Expanding_Existing_HFPs_desc: "수직 농업 시설과 빙붕에서 물을 공급하는 데 필요한 증류 기반시설을 통해 현재의 고강도 농업 프로젝트를 확대하면 늘어나는 국내 식량 공급이 만들어지는 동시에 내륙으로 진출한다는 목표에도 기여합니다."
 GRN_focus_Growing_REM_Industries: "희토류 산업 육성"
 GRN_focus_Growing_REM_Industries_desc: "To improve our geo-strategic value we'll need to grow our REM industries or Rare Eath Metals sector. Targeted mining and processing facilities will allow us to use these as negotiations for future trade deals."
 GRN_focus_Growing_Domestic_Arms_Production: "국내 무기 생산 확대"
 GRN_focus_Growing_Domestic_Arms_Production_desc: "복무 중인 군인들에게 무기를 갖춰 줄 수 있도록 하면, 우리 군이 어떤 침해 세력으로부터도 우리 땅을 방어할 수 있고 방어할 것이라는 점에서 안심할 수 있습니다."
 GRN_focus_Expanding_Citizen_Development_Grants: "시민 개발 보조금 확대"
 GRN_focus_Expanding_Citizen_Development_Grants_desc: "시민권으로 가는 길은 오로지 국가 발전에 대한 기여로 표시되며, 따라서 한 번에 이 길을 거쳐 새로운 그린란드 시민이 될 수 있는 인원을 늘리기 위해 지원금 프로그램을 확대할 것입니다."
 GRN_focus_Siumut_Wins_Once_More: "시우무트, 다시 승리하다"
 GRN_focus_Siumut_Wins_Once_More_desc: "가장 오랫동안 집권한 정당 중 하나는 시우무트당입니다. 이 당은 독립 이전 시대 대부분의 선거에서 승리했으며, 독립 이후 시대에도 노선을 꾸준히 유지하는 것으로 보입니다. 이제는 독립만이 아니라 시민과 노동자의 삶을 개선하는 데 집중해야 할 때입니다."
 GRN_focus_Encouraging_State_Sanctioned_Immigration: "국가 승인 이민 장려"
 GRN_focus_Encouraging_State_Sanctioned_Immigration_desc: "우리의 국내 성장은 그다지 좋지 않습니다. 일자리 시장을 채우고 경제를 성장시키려면 가능한 한 어디서든 일관된 형태의 이민을 고려해야 합니다."
 GRN_focus_Immigration_Quotas: "이민 쿼터"
 GRN_focus_Immigration_Quotas_desc: "나라가 꾸준히 발전함에 따라 가장 큰 걱정거리는 이제 실제로 고용할 사람이 됩니다. 일자리를 채울 사람이 없는 상황이라면 경제를 성장시켜도 한계가 있습니다. 따라서 인구가 경제 규모에 맞춰질 수 있도록 전담 이민 쿼터 달성을 시도하기 시작할 것입니다."
 GRN_focus_Expanding_Schooling_Subjects: "교과목 확대"
 GRN_focus_Expanding_Schooling_Subjects_desc: "학교가 제공하는 선택 과목을 확대하면 학생들이 원하는 직업과 미래를 찾을 수 있습니다. 동시에 학생들이 성장하여 성인이 될 준비를 하는 데 도움이 되는 핵심적인 일반 역량 향상도 유지합니다."
 GRN_focus_Social_Reserve_Funds: "사회 준비금"
 GRN_focus_Social_Reserve_Funds_desc: "우리나라가 인구와 경제 모두에서 계속 성장함에 따라 도움이 필요한 모두에게 예산을 적절히 배정하고 재원을 마련하는 데서 어려운 균형을 마주합니다. 따라서 이러한 부족분을 통제하기 위해 사회 프로그램을 위한 사실상의 국가 저축인 사회 준비금을 만들 것입니다. 이러한 안전망이 필요한 시민들에게 더 큰 안도감을 주어야 합니다."
 GRN_focus_Tungsten_Industries: "텅스텐 산업"
 GRN_focus_Tungsten_Industries_desc: "중동부 지역에는 캐기 좋게 무르익은 텅스텐 매장지가 산더미처럼 있습니다. 따라서 광석을 채굴하고 가공하여 원료 막대 또는 이 자원이 필요한 2차 제품으로 정제할 전용 산업 단지를 만들 것입니다."
 GRN_focus_Core_Industries_Complex: "핵심 산업 단지"
 GRN_focus_Core_Industries_Complex_desc: "아직 채굴할 자원이 남아 있는 오래된 철광산을 다시 열고 새로운 광산도 열면 산업 역량을 확장할 수 있습니다. 이를 염두에 두고, 채굴된 광석을 나라가 필요로 하는 것으로 처리할 비슷한 산업 단지를 만들 것입니다."
 GRN_focus_Growing_More_Crops: "더 많은 작물 재배"
 GRN_focus_Growing_More_Crops_desc: "Ensuring the ever growing and diverse food supply we hope to create through our Vertical Farming initiatives as well as the pre-planned distillation infrastructure to support these facilities, we now can continue a steady pace of expansion and hope the demands will chip into the Ice Shelf with greater speed that anticipated."
 GRN_focus_Naval_Investments: "해군 투자"
 GRN_focus_Naval_Investments_desc: "국내 조선 능력을 키우면 해군을 운용할 수 있습니다. 해군을 운용할 수 있다면 연안 해역을 지킬 수 있고, 처음에는 아무리 작더라도 어떤 형태의 국제적 존재감을 가질 수 있습니다."
 GRN_focus_Strategic_Stockpiles: "전략 비축"
 GRN_focus_Strategic_Stockpiles_desc: "Establishing strategic stockpiles allows for a reserve of accessible firearms to equip our military and if need be the people themselves. Of course we hope it'll never come to such a things but who know what sick and twisted minds are out there."
 GRN_focus_Polar_Party_Wins: "극지당의 승리?"
 GRN_focus_Polar_Party_Wins_desc: "한때 사라진 정당으로 여겨졌던 극지당은 그린란드에서 얻을 수 있는 가장 전통적인 보수 정당에 가장 가까울 것입니다. 따라서 그들의 승리는 의아하기는 해도, 일부 국가들이 힘겨워하는 바깥의 온갖 소란에서 벗어나 차분한 손길과 사회적 평온을 가져다줄 것이라는 희망을 불러일으킵니다."
 GRN_focus_Family_Subsidies: "가족 보조금"
 GRN_focus_Family_Subsidies_desc: "To improve domestic population growth and not relying too much on immigration efforts we'll set up a dedicated subsidy to help families through the early years of childhood. This way the main concern which tends to be fiscal capabilities is no longer a real concern. To prevent abuse we'll limit to how the subsidies are applied to purchase wise and have it place on a national standard form of banking card."
 GRN_focus_Childcare_Act: "보육법"
 GRN_focus_Childcare_Act_desc: "부모가 청구서 등을 처리하려 애쓰면서 동시에 자녀를 돌볼 수 있는 능력은 섬세하고 종종 번거로운 균형입니다. 따라서 보육법은 아이들을 돌보고 살필 어린이집과 유아 교육 센터를 개선하고 설치하기 위한 지출 패키지입니다."
 GRN_focus_Foreign_Leasing_Act: "외국인 임대법"
 GRN_focus_Foreign_Leasing_Act_desc: "외국인 임대법은 두 갈래의 법안입니다. 첫째는 광물 채굴과 우리 땅 아래의 자원을 가장 잘 채굴하는 방법에 대한 이해를 높이기 위해 교육 및 연구 노력을 개선하는 것입니다. 둘째는 외국 기업이 우리를 대신해 그 일을 하도록 부추기거나, 최소한 필요하다면 언제든 우리가 인수할 수 있는 기반을 마련하는 것입니다."
 GRN_focus_Steeling_Resolve_Act: "결의 강화법"
 GRN_focus_Steeling_Resolve_Act_desc: "결의 강화법은 철과 석탄의 국내 공급 확대와 관련된 표적 투자 패키지입니다. 이러한 핵심 자원은 우리 경제의 토대와, 산업은 물론 주택과 공공 기관 같은 인구 수요 모두를 생산하는 국내 능력을 확장하는 데 도움이 될 것입니다."
 GRN_focus_Expand_Petrochemical_Industries: "석유화학 산업 확대"
 GRN_focus_Expand_Petrochemical_Industries_desc: "석유화학 산업 부문을 어떤 형태로든 구축하고 확대할 수 있다면 과도한 무역 적자로부터 국내 안보가 크게 강화될 것입니다."
 GRN_focus_Greenlandic_Forestries: "그린란드 산림업"
 GRN_focus_Greenlandic_Forestries_desc: "나라가 이미 시행 중인 온실 및 수직 농업 구상을 통해 새로운 수목 농장을 만들면 성장하는 다양한 목재 부문을 갖출 수 있습니다."
 GRN_focus_Industrial_Projects: "산업 프로젝트"
 GRN_focus_Industrial_Projects_desc: "동부 개발을 서부와 비슷한 수준으로 끌어올리면 두 지역 사이의 격차가 크게 줄어들 것이며, 따라서 그곳의 산업 부문을 개선하는 것은 매우 유익할 것입니다."
 GRN_focus_Eastern_Armaments: "동부 군수 산업"
 GRN_focus_Eastern_Armaments_desc: "우리의 \\"동부 개발\\" 프로젝트는 제 입으로 말하기 뭣하지만 꽤 잘 진행되고 있습니다. 온갖 종류의 새로운 산업을 세우고 국내 일자리 충원을 돕고 보충할 이민 노력을 확보하는 것은 튼튼한 경제와 국민을 위한 밝은 미래를 만드는 데 도움이 될 것입니다."
 GRN_focus_Defensive_Improvements: "방어 개선"
 GRN_focus_Defensive_Improvements_desc: "성급한 적의 침입으로부터 방어하는 능력을 높이는 것은 국가 안보의 보루가 될 것입니다. 어쨌든 섬에 상륙하는 일은 간단하지 않습니다."
 GRN_focus_Qulleq_Party_Secures_Victory: "쿨레크당의 승리 확보"
 GRN_focus_Qulleq_Party_Secures_Victory_desc: "In an interesting turn of events the Qulleq Party has won the election. Being known as a pro-industrialist type of party they were once known as the \"independence now\" main stay party outside of the core original power holders of the past. While some worry about if this means lower quality of living for the sake of development, many in the party rest assure that because of the more interesting situation that the nation is in, the quality of live will only improve. Whatever the case may be the party will just have to put its money where its mouth is in the coming weeks."
 GRN_focus_On_Site_Family_Support: "현장 가족 지원"
 GRN_focus_On_Site_Family_Support_desc: "매일이 아이와 함께 출근하는 날입니다. 기업들이 보육의 핵심 요소를 점차 도입하여, 가족 구성원이 아이를 내팽개친다는 느낌 없이도 출근할 수 있게 될 것입니다."
 GRN_focus_Contractual_Labor_Act: "계약 노동법"
 GRN_focus_Contractual_Labor_Act_desc: "The CLA is a legislation that gives power to the administration to help border and immigration services in finding proper candidates for Labor Visas. These visas will allow entry into the country for an extended time if they wish to work here, it is not a visiting visas but merely an expansion of the Development Grants Program that we already have."
 GRN_focus_Rewriting_The_Tax_Codes: "세법 개정"
 GRN_focus_Rewriting_The_Tax_Codes_desc: "근본적으로 세법은 매우 반기업적이므로 처음부터 다시 시작하여 현재의 경제 구성에 맞게 개혁할 것입니다."
 GRN_focus_Building_Up_Domestic_Capital: "국내 자본 축적"
 GRN_focus_Building_Up_Domestic_Capital_desc: "우리의 금광에서는 소량의 다이아몬드도 함께 채굴할 수 있습니다. 이 원자재 자본을 해외에 팔아 국내 개발 노력에 쓸 자금으로 활용할 수 있습니다."
 GRN_focus_Securing_Energy_Needs: "에너지 수요 확보"
 GRN_focus_Securing_Energy_Needs_desc: "끊임없이 발전하는 나라의 막대한 수요는 발전 그 자체의 초석입니다. 우리에게는 자원이 있으니 그것을 원하는 대로 쓸 수 있어야 합니다."
 GRN_focus_Military_Production_Means: "군 생산 수단"
 GRN_focus_Military_Production_Means_desc: "국민뿐 아니라 천연 자원과 끊임없이 확대되는 국민의 삶의 질을 방어하고 보호하는 우리의 능력은 무엇보다 중요합니다. 어느 나라가 언제든 그것을 악의적인 목적으로 탕진하려 할지 모른다는 것을 안다면, 안락함에 안주할 수 없습니다."
 GRN_focus_Continued_Crop_Diversification_Efforts: "작물 다변화 노력 지속"
 GRN_focus_Continued_Crop_Diversification_Efforts_desc: "독립 이전 시기에 마련된 고강도 농업 프로젝트를 계속 활용하며, 국가 종자 저장고 자체도 계속 성장하여 보유하는 작물이 더 다양해지고 있습니다. 많은 이들이 식물이 결코 자라지 못할 것이라 생각한 곳에서 국내 농업 시설을 뒷받침하는 증류 센터의 지속적인 개발을 통해 우리나라는 번성할 것입니다."
 GRN_focus_Expanded_Eastern_Industries: "동부 산업 확대"
 GRN_focus_Expanded_Eastern_Industries_desc: "노동자, 기업 등입니다. 이것이 우리가 계속 이어 가고 싶은 개발 순환이며, 최소한 원시 인구 수만 놓고 보면 두 지역의 격차가 꽤 큰 것으로 보이므로 서부보다 동부에서 더 활용하고자 합니다. 동부에 더 집중함으로써 전국 차원의 전반적 격차를 줄이고 더 결속력 있게 분산된 경제를 만들고자 합니다."
 GRN_focus_Economic_Automation_Act: "경제 자동화법"
 GRN_focus_Economic_Automation_Act_desc: "경제 자동화법은 어떤 경제 부문을 사실상 완전한 자동화로 추진할지 숙고하여 최종적으로 선택하기 위한 법안입니다. 이렇게 하면 노동자들이 다른 부문에서 일자리를 구할 수 있게 되고, 일자리 대비 노동력이 이처럼 부족한 상황 덕분에 전반적인 경제 상황이 더 안정되기를 기대합니다."
 GRN_focus_Inuit_Ataqatigiit_Election_Victory: "이누이트 아타카티기트의 선거 승리"
 GRN_focus_Inuit_Ataqatigiit_Election_Victory_desc: "The sort of underdog in Greenlandic politics the IA is seen as a more in-between from the more common democratic socialist thinking and a more traditional market socialism. The party does believe in certain Marxist principles but seems to follow more of the Titoist balance between economic bargaining between blocks of nations and the social cohesion to avoid directly picking a side. Though of course Greenland has been in NATO there is no obligation to conform economically."
 GRN_focus_Greencare_Act: "그린케어법"
 GRN_focus_Greencare_Act_desc: "그린케어법, 또는 그린란드케어법은 의료진 임금, 장비 품질, 훈련을 개선하고 필요한 곳에서 시설을 확충하거나 새로 열기 위한 일반 예산 법안입니다."
 GRN_focus_Steeled_Veins_Act: "강철 혈관법"
 GRN_focus_Steeled_Veins_Act_desc: "석탄과 철은 모든 현대 경제의 생명줄입니다. 석탄 자체는 이용 가능한 에너지 대안 때문에 예전만큼 유용하지 않지만, 우리 석탄과 철 매장지의 양과 일부 지역에서의 원자재 품질은 간단히 무시할 수 없습니다. 따라서 국내 및 잠재적 해외 수출용으로 현재 공급을 강화하기 위해 양쪽 모두에서 소규모 작업에 투자하기 시작할 것입니다."
 GRN_focus_Pro_Mining_And_Miners_Act: "채굴 및 광부 지원법"
 GRN_focus_Pro_Mining_And_Miners_Act_desc: "채굴 및 광부 지원법안은 채굴의 질과 양을 개선하는 동시에, 광산에 언제든 필요한 노동자의 빈도와 수를 제한하는 전략적 자동화 노력을 통해 광산 노동자라는 지위 전반을 개선하도록 설계되었습니다."
 GRN_focus_Feldspar_Extractions_Act: "장석 채굴법"
 GRN_focus_Feldspar_Extractions_Act_desc: "현재의 지질 조사 자료에 따르면 알루미나 산화물의 유일한 본격적 공급원은 서부의 장석 광물 매장지입니다. 이 광물은 무게의 20% 이상이 알루미나 산화물인 경우가 많지만 상업적으로 가장 실용적인 공급원은 아닙니다. 따라서 어떤 과학적 돌파구가 현실을 바꿀 때까지 채굴 작업은 전적으로 정부의 통제 아래 있어야 합니다. 어쨌든 우리 경제에는 알루미늄이 필요하므로 장석을 채굴하고 광물에서 필요한 재료를 가공하는 작업을 서서히 늘려 가는 데 투자할 것입니다."
 GRN_focus_Feeding_The_People_Act: "국민 식량법"
 GRN_focus_Feeding_The_People_Act_desc: "Growing our domestic food situation outside of the prominant fisheries is a great way to grow our economy and our population. With the creation of the national seed vault we have been well underway to making Greenland a model for developments in the greenhouse and vertical farming metrics of agricultural science."
 GRN_focus_The_Continual_Industry_Act: "지속 산업법"
 GRN_focus_The_Continual_Industry_Act_desc: "경제를 성장시킨다는 것은 제조업과 일반 산업 기반을 개선한다는 뜻입니다. 1차 및 2차 산업에 대한 소규모 투자를 통해 전례 없는 성장과 발전을 계속 볼 수 있습니다."
 GRN_focus_Greenland_Technology_Center: "그린란드 기술 센터"
 GRN_focus_Greenland_Technology_Center_desc: "우리의 생태 환경 안에서 개발하고 유지하는 데 있어 전반적 진보를 위한 연구 개발에 투자하는 것은 앞으로의 개발 노력에서 무엇보다 중요할 것입니다."
 GRN_focus_Arming_The_Nation: "국가 무장"
 GRN_focus_Arming_The_Nation_desc: "방위는 우리의 지속적인 독립의 열쇠입니다. 자유로운 상태를 유지하고 싶다면 그럴 수단을 개발해야 합니다."
 GRN_focus_Silver_And_Gold_Act: "은과 금 법"
 GRN_focus_Silver_And_Gold_Act_desc: "국제 협상에서 가치 있는 협상 카드를 만들어 국내 안보를 개선하면 침략을 노리는 이들을 그렇지 않을 때보다 조금이나마 더 오래 막아낼 수 있습니다. 따라서 우리가 접근할 수 있는 팔라듐과 일부 귀중한 희토류 금속 주변에서 제한적인 채굴 작업을 시작할 것입니다."
 GRN_focus_Naleraq_Elective_Victory: "날레라크의 선거 승리"
 GRN_focus_Naleraq_Elective_Victory_desc: "With the nation in the grips of fresh independence its no wonder the more nationalistic oriented party of Naleraq ended up wining. With their policies looking to directly strengthen and prove Greenlandic virtue towards its self made sovereignty. Though some wonder if this may be too much of a quick step towards something a bit more hostile in nature."
 GRN_focus_Efficiency_Education_Courses: "효율성 교육 과정"
 GRN_focus_Efficiency_Education_Courses_desc: "효율성 교육 과정은 추운 기후에서 전력 사용을 전달, 저장, 처리하는 새로운 방법을 가르치고 실험하려는 교육 투자 프로젝트입니다. 이 분야의 효율을 높이면 고용 문제를 걱정하지 않고도 경제가 더 비용 효율적으로 운영될 수 있습니다."
 GRN_focus_Family_Planning_And_Assistance_Board: "가족 계획 및 지원 위원회"
 GRN_focus_Family_Planning_And_Assistance_Board_desc: "The FPAB is a governmental institution devoted towards creating, maintaining and growing the families of the nation. Our population is small and we don't want to flood the nation with random and immigrates if we can just take care of ourselves properly."
 GRN_focus_Family_Homes_Act: "가족 주택법"
 GRN_focus_Family_Homes_Act_desc: "가족 주택법은 가족용으로 분류된 주택이 도움이 필요한 가족에게 돌아가도록 하기 위한 프로그램입니다. 나라의 한정된 주택 재고를 아무도 악용하지 못하도록 보장할 것입니다."
 GRN_focus_Urban_Planning_Commission: "도시 계획 위원회"
 GRN_focus_Urban_Planning_Commission_desc: "The UPC is a government agency designed to pre-plan and begin foundational works for future housing projects and potential city planning styles to work with as these new houses get filled with people who then need jobs and local suppply chains at that rate."
 GRN_focus_Rapid_Agriculture_Expansions: "급속 농업 확장"
 GRN_focus_Rapid_Agriculture_Expansions_desc: "The RAE bill is dedicated to expanding our agricultural base and production methods so we can continue to feed our citizens and better grow our population. Of course we'll need to screen and import specialist to train and eventually give the facilities over to native born citizens, but for now we can give them temporary development visas."
 GRN_focus_Industry_Development_Act: "산업 개발법"
 GRN_focus_Industry_Development_Act_desc: "신뢰할 수 있으면서도 다양한 경제를 만들기 위해 제조업과 일반 산업 부문에 투자할 것입니다. 인구와 우리가 심사하는 잠재 이민자 집단이 함께 늘어나면서 작은 개선과 프로젝트들이 서서히 눈덩이처럼 불어날 것입니다."
 GRN_focus_Military_Forces_Investment_Act: "군 전력 투자법"
 GRN_focus_Military_Forces_Investment_Act_desc: "이 지출 패키지와 무기 개발 프로젝트는 특정 복잡한 장비에 대해 우리 자체 설계를 구상하려는 가운데, 지상 및 공중 능력을 개발하는 데 함께 작용할 것입니다."
 GRN_focus_Western_Strategic_Autarky_Act: "서부 전략적 자급자족법"
 GRN_focus_Western_Strategic_Autarky_Act_desc: "The National Autarky Act is a two phase plan to create strategic mining and general resource extraction operations to ensure a limited but stable domestic supply should any nation come to do us harm via naval or political blockades of sort. Phase one of the plan is known as the WSAA or west strategic autarky act. This creates limited operations on iron ore, feldspar for aluminum as well as oil and coal for for both energy and rubber synthetic operations."
 GRN_focus_Eastern_Strategic_Autarky_Zone: "동부 전략적 자급자족 구역"
 GRN_focus_Eastern_Strategic_Autarky_Zone_desc: "국가 자급자족법의 2단계는 일반 에너지 및 산업용 석유와 석탄 작업을 개발하는 것입니다. 또한 희토류 채굴 노력과 리튬 및 유사한 기술 지향 광물에 대한 제한적인 채굴도 시작할 것입니다. 국내 안보와 대외 협상 카드가 우리에게 유리하게 쌓이기 시작하는 듯합니다."
 GRN_focus_Militarize_Greenland_Party_Wins: "그린란드 군사화당의 승리?"
 GRN_focus_Militarize_Greenland_Party_Wins_desc: "While most parties in Greenland are pretty carbon copy, no one expected the military interdiction as apparently the complete underdog and recently formed MGP has somehow taken the victory. The party being essentially a political extension of the newly formed Armed Services of Greenland or ASG, is focused on national defense and the ability to obtain the means to defend our nation. A sort of circular logic to be sure but many can't wonder if this was a subconscious need that most wanted after independence from Denmark."
 GRN_focus_Military_Organized_Education_Act: "군 조직형 교육법"
 GRN_focus_Military_Organized_Education_Act_desc: "수업, 과목, 그리고 교육의 전반적 구조를 군대와 같은 구조로 개편하고 재편해야 하며 또 재편될 것입니다. 규율, 조직, 그리고 명령과 정보를 듣고 전달하는 방법을 일찍 가르치는 것은 기억 유지에 중요할 뿐 아니라 교육 이후와 잠재적 복무 생활 모두에 중요합니다."
 GRN_focus_Production_Critical_Resources_Act: "생산 핵심 자원법"
 GRN_focus_Production_Critical_Resources_Act_desc: "Steel and energy, these two fundamental pillars of any industrialized society are what we need the most. Be it for civilian or military needs and as such we will invest and expand operations to ensure our domestic needs and defense need are met."
 GRN_focus_Advanced_Materials_And_Minerals_Act: "첨단 소재 및 광물법"
 GRN_focus_Advanced_Materials_And_Minerals_Act_desc: "The AMMA bill focuses expanding operations around the mineral extraction of what are deemed advanced production needed resources. Things related to tech development and rare earth elements are some prime examples."
 GRN_focus_Army_Armaments_Improvement_Act: "육군 군수 개선법"
 GRN_focus_Army_Armaments_Improvement_Act_desc: "육군의 전반적 개선은 우리가 가질 수 있는 모든 지상 방어에 무엇보다 중요합니다. 따라서 생산 능력 확대에 투자하고, 가능한 한 새로운 설계를 시험할 수 있도록 이러한 시설에 대한 간접 연구 개발 자금도 지원할 것입니다."
 GRN_focus_Air_Force_Advancements_Act: "공군 발전법"
 GRN_focus_Air_Force_Advancements_Act_desc: "어떤 형태로든 공군을 창설할 생산 시설에 자금을 지원하는 것이 아무것도 하지 않는 것보다는 나을 것입니다. 덤으로 해당 군을 위한 새 항공기 설계에 시동을 걸 수 있도록 약간의 연구 개발 자금도 투입할 것입니다."
 GRN_focus_Military_Garden_Act: "군 텃밭법"
 GRN_focus_Military_Garden_Act_desc: "Dedicating a portion of the slowly but ever expanding agricultural apparatus that is the HFPs to the military rations program is indeed a beneficial thing to do. Not only does it separate the civilian demands from the military but it also help the quality and quantity control for feeding our service members."
 GRN_focus_Bolstering_Naval_Assets: "해군 자산 강화"
 GRN_focus_Bolstering_Naval_Assets_desc: "우리의 해안선은 거대하며, 따라서 그 거리를 적당히 감당할 수 있는 함선을 늘리거나 최소한 만들어야 합니다. 육군 다음으로 해군은 우리의 첫 진정한 방어선입니다."
 GRN_focus_Civilian_Improvements_Act: "민간 개선법"
 GRN_focus_Civilian_Improvements_Act_desc: "To bolster and sustain a large military force we must also have a decent civilian based economy to prop everything up. As such we'll do targeted development projects to make sure our military demands don't race ahead to far from what our real economy can handle."
 GRN_focus_Militarized_Economy_Act: "군사화 경제법"
 GRN_focus_Militarized_Economy_Act_desc: "이 법안은 우리가 국가 경제를 조직하고 대하는 방식에 대한 포괄적인 재접근입니다. 막대한 군 인력 수요가 있을 수 있음을 염두에 두고 경제를 선제적으로 조직함으로써, 기술과 생산 방식을 더 잘 통합하는 데 집중하여 군수품 생산에 인력을 배정할 필요를 크게 줄일 수 있습니다. 이는 결국 민간 경제와 군에 노동자와 잠재적 인력을 풀어 줄 것입니다."
 GRN_focus_Greenland_Monarchist_Party_Victory: "그린란드 군주당의 승리"
 GRN_focus_Greenland_Monarchist_Party_Victory_desc: "그린란드 군주당, 또는 그린란드 왕가당으로도 알려진 이 정당은 그린란드가 덴마크 군주제 아래 있었던 매우, 매우 긴 역사를 존중하고 본받으려는 정당입니다. 따라서 이 당은 기존 의회 제도를 상당히 자유주의적인 입헌 군주제로 통합하는 것을 목표로 합니다. 물론 상당수의 사람들은 혼란스러워하지만, 선거에서 승리를 거두기에 충분한 꽤 많은 이들은 덴마크의 정치적 안정이 이곳 국내에서 우리가 나라를 진정으로 발전시키고 성장시킬 수 있는 열쇠라고 믿습니다."
 GRN_focus_Education_Investments_Act: "교육 투자법"
 GRN_focus_Education_Investments_Act_desc: "교육 투자법은 특정 기관의 교육 품질과 혁신 부서에 장비를 더 잘 갖추고 전반적으로 투자하기 위한 전담 지출 증액입니다. 국가의 효율을 개선하고, 우리 환경의 더 지속적인 혹독함에 우리의 역량을 계속 키우고 적응시키기를 바랍니다."
 GRN_focus_Medical_Research_Initiatives: "의학 연구 구상"
 GRN_focus_Medical_Research_Initiatives_desc: "의학 연구 구상은 주요 의료 기관 내에 새로운 전담 부서를 위한 별도의 자금을 마련하는 계획입니다. 이 새로운 부서는 의학 개발부라 불릴 것입니다. 의학 개발부는 의학에 대한 지식과 이해를 증진할 새로운 방법을 시험하고 찾기 위해 할 수 있는 일을 하는 한편, 전적으로 자원자 프로그램을 통해 새로운 장비와 시술의 시험을 보장할 책임을 집니다."
 GRN_focus_Public_Security_And_Safety_Act: "공공 보안 및 안전법"
 GRN_focus_Public_Security_And_Safety_Act_desc: "국민은 두려움 없이 삶을 살 수 있어야 합니다. 이 새로운 법안이 통과되면 지역사회 연계 프로그램뿐 아니라 잠재적 채용 후보를 평가하는 더 나은 기준과 경찰관이 되기 위한 훈련 프로그램에도 자금이 승인됩니다. 조용한 하루가 좋은 하루이며, 당신에게 좋은 하루는 대중에게도 좋은 하루라는 점을 기억하십시오."
 GRN_focus_Agriculture_Advancements_Act: "농업 발전법"
 GRN_focus_Agriculture_Advancements_Act_desc: "Building upon our ever growing HRP program we'll continue to invest in Greenhouse and Vertical Farming facilities where possible. The security and stability of our nation rest on acquiring a diverse and stable food supply after all."
 GRN_focus_Economic_Strengthening_Act: "경제 강화법"
 GRN_focus_Economic_Strengthening_Act_desc: "수익을 개발한다는 것은 냉소적인 영향이나 삶에 대한 일반적 성향에 따라 국가 전체의 수준이 간접적으로 혹은 부산물로 높아진다는 뜻입니다. 어쨌든 국민의 삶을 개선하고 싶다면 기업과 산업에 투자하여 국민이 평생 접하고 다룰 수 있는 제품과 수단을 다변화하고 확대해야 합니다."
 GRN_focus_Petrochemical_Development_Efforts: "석유화학 개발 노력"
 GRN_focus_Petrochemical_Development_Efforts_desc: "The petrochemicals industry is one of the most influential and diverse economic sectors in the modern age, not to mention its impacts are felt in practically daily lives. As such we must assume the mantle and develop our own sector if we are to truly have a robust and diverse economy. The ability to synthesis things like rubber and other valuable chemicals or materials is almost akin to a national security matter."
 GRN_focus_Lithium_Expansion_Act: "리튬 확대법"
 GRN_focus_Lithium_Expansion_Act_desc: "나라가 계속 성장함에 따라 기술과 기타 현대적 혁신의 영향력이 커지는 만큼, 핵심 자원 채굴 작업에 대한 투자는 무엇보다 중요합니다. 우리는 희토류 원소, 리튬 및 기타 기술 생산 광물 같은 국내 매장지를 보유하고 있습니다. 따라서 국내 수요를 충족하고 잠재적으로 향후 무역 협정에 활용하기 위해 채굴 노력을 확대하고 개발하기 시작할 것입니다."
 GRN_focus_Royal_Military_Development_Efforts: "왕립 군사 개발 노력"
 GRN_focus_Royal_Military_Development_Efforts_desc: "왕립 군사 개발 프로그램은 육군과 해군을 위한 장비 개발의 질을 개선하고, 끊임없이 진화하는 장비를 둘러싼 새로운 훈련 기준을 보장하는 일반 투자 패키지입니다."
 GRN_focus_Establishing_The_Kingdom: "왕국 수립"
 GRN_focus_Establishing_The_Kingdom_desc: "모든 준비를 마친 지금, 우리는 국호를 공식적으로 그린란드 왕국으로 바꿀 준비가 되었습니다. 모든 국민을 위한 번영하고 자랑스러운 미래를 만들기 위해 나아가는 가운데 국민은 기뻐하며 하나가 되었습니다."
 GRN_focus_Armed_Services_Of_Greenland: "그린란드군"
 GRN_focus_Armed_Services_Of_Greenland_desc: "독립이 확실해진 지금 우리는 자체 국방을 맡아야 합니다. 사실상 처음부터 시작하여 우리가 통제하는 광대한 바다, 땅, 영공을 방어할 수 있는 무언가를 만들어야 합니다."
 GRN_focus_The_Frozen_Army: "얼어붙은 육군"
 GRN_focus_The_Frozen_Army_desc: "우리 땅은 춥고, 얼어 있으며, 거의 일 년 내내 횡단하기 어렵습니다. 우리는 육군 병과를 이러한 조건을 도전이 아닌 놀이터로 볼 수 있도록 빚어낼 것이며 또 그래야 합니다."
 GRN_focus_Training_Facilities_And_Standards: "훈련 시설 및 기준"
 GRN_focus_Training_Facilities_And_Standards_desc: "제대로 된 육군을 만들려면 훈련 시설을 설립하고 만들어야 하며, 제대로 된 병사를 구성하는 기준에 대한 수용 가능한 표준도 만들어야 합니다. 진정으로 국민을 방어하려면 이 기준은 우리 조국의 환경에 맞춰 구축되어야 합니다."
 GRN_focus_Setting_Equipment_Standards: "장비 표준 설정"
 GRN_focus_Setting_Equipment_Standards_desc: "장비의 표준을 만들면 훈련에서의 통일성을 확보하는 동시에 병사들을 둘러싼 군수 지원도 개선할 수 있습니다."
 GRN_focus_Securing_Domestic_Smallarms: "국산 소형 화기 확보"
 GRN_focus_Securing_Domestic_Smallarms_desc: "소화기와 일반 보병 관련 장비를 자체 생산할 능력을 갖추면 육군의 전투 능력과 준비 태세를 높일 수 있습니다."
 GRN_focus_Crude_Combat_Designs: "조잡한 전투 설계"
 GRN_focus_Crude_Combat_Designs_desc: "조잡한 전투 설계는 본질적으로 \\"덜컹거리는 뼈다귀\\" 같은 차량 장비 설계입니다. 어이없을 만큼 기본만 갖췄지만 모두 국산 모델입니다. 이를 활용하고 다른 나라의 장비를 몇 가지 구매하여 시험과 제대로 된 설계 작업을 수행함으로써, 육군을 키워 나갈 때 현대전을 위해 만들어진 장비를 진정으로 배치할 수 있도록 할 수 있습니다."
 GRN_focus_Vehicle_Manufacturing_Plants: "차량 제조 공장"
 GRN_focus_Vehicle_Manufacturing_Plants_desc: "기본적인 차량 설계의 기초를 확보했으니, 이 훈련용 더미들을 제조하고 집단적 경험을 활용하여 우리 군을 위한 잠재적 기갑 핵심 전력을 실제로 설계하고 구축할 수 있을 것입니다."
 GRN_focus_Institute_For_Army_Developments: "육군 발전 연구소"
 GRN_focus_Institute_For_Army_Developments_desc: "With our army being practically smaller than an infant, we must invest heavily into the means of developing and improving all aspect of our army service branch. For the sake of the nation, the people and the personnel who serve in the branch."
 GRN_focus_Frozen_Battlefield_Doctrine: "얼어붙은 전장 교리"
 GRN_focus_Frozen_Battlefield_Doctrine_desc: "우리 군은 유럽 대륙의 군대 규모에 이르기는 아마 영영 어려울 것입니다. 그러나 우리가 할 수 있는 것은 방어하고 지키는 일입니다. 기후와 조국을 궁극의 전장으로 삼아 공격적이든 아니든 어떤 적군도 우리를 공격하러 오도록 유인할 수 있습니다. 그들은 우리가 만만하다고 생각하겠지만, 이곳에 와서 우리 면전에서 그 말을 해 보라고 하면 어떻게 될지 두고 보겠습니다."
 GRN_focus_FBD_Leadership_Promotions: "얼어붙은 전장 교리 지휘부 진급"
 GRN_focus_FBD_Leadership_Promotions_desc: "육군을 이 새로운 교리를 중심으로 공고히 하고 재편하기 시작하려면, 이를 실제로 시행하기를 원하고 그것이 제시하는 개념과 사상을 이해하는 지도자가 필요합니다. 따라서 이러한 개혁을 더 잘 이끌고 시행할 수 있도록 전담 육군 참모부를 진급시킬 것입니다."
 GRN_focus_From_Field_To_Staff_Command: "야전에서 참모 지휘로"
 GRN_focus_From_Field_To_Staff_Command_desc: "야전 지휘관들이 진급하면서, 이 불운한 이들이 더 넓은 행정도 이해해야 한다는 점을 깨닫습니다. 따라서 다른 자격 있는 장교들을 훈련하고 이 새로운 길로 진급시킬 수 있을 때까지 이들의 야전 지휘를 참모 직책으로 보완할 것입니다."
 GRN_focus_Frozen_Warfare_Training_Program: "빙설전 훈련 프로그램"
 GRN_focus_Frozen_Warfare_Training_Program_desc: "Our focus is in defending our homeland, said homeland is cold and frozen, thus we must training and ensure our troops can fight in these conditions for as long as possible."
 GRN_focus_Polar_Logistics: "극지 군수"
 GRN_focus_Polar_Logistics_desc: "우리의 전투가 항상 우리 섬에서 벌어질 것이라 가정하는 것은 최선의 방법은 아니지만, 국가 방위를 위한 확실한 사고방식임은 분명합니다. 따라서 극한의 날씨 속에서 싸우는 것을 더 쉽게 처리할 수 있도록 군수 체계를 다듬고 개선하기 시작할 것입니다."
 GRN_focus_General_Improvement_Programs: "종합 개선 프로그램"
 GRN_focus_General_Improvement_Programs_desc: "The defense of our island is obviously our main priority, however, how can we defend our island if we no little to nothing about the combat worlds around us. We must ensure a balanced and general improvement of our army to ensure it is willing and able to handle as many different situations as possible."
 GRN_focus_GIP_Leadership_Promotions: "종합 개선 프로그램 지휘부 진급"
 GRN_focus_GIP_Leadership_Promotions_desc: "육군을 어떻게 키우고 발전시킬지에 대한 새로운 방향을 확고히 하려면 야전 장교와 장성급 지휘 역할이 필요합니다. 따라서 이러한 사고방식이 새로운 우수성의 기준으로 나아가도록 도울 수 있는 최선의 후보를 찾아 선발할 것입니다."
 GRN_focus_General_Staff_Roles: "참모부 직책"
 GRN_focus_General_Staff_Roles_desc: "우리 육군은 규모가 작으므로, 방금 야전 지휘를 맡긴 이들이 당분간 행정 직책도 함께 맡아 주어야 합니다."
 GRN_focus_Artillery_Corps_Specialist: "포병대 전문가"
 GRN_focus_Artillery_Corps_Specialist_desc: "Developing and specializing in artillery operations both in defensive and offensive measures means we will be able to do more damage to both personnel and morale to the enemy then they could to us. But artillery are hard to move and the easy to move pieces are expensive. We'll need to find ways to improve on loss prevention if we are to get any real meaning behind this way of tactical planning."
 GRN_focus_Clear_Skys_Project: "맑은 하늘 프로젝트"
 GRN_focus_Clear_Skys_Project_desc: "맑은 하늘 프로젝트는 병사들이 싸울 수 있는 수단이 적이 공군력을 쓰기로 하느냐 마느냐에만 달려 있지 않도록 하기 위한 전담 대공 장비 개발 프로그램입니다. 항공기는 비쌉니다. 평범한 보병에게는 재미있는 새 장난감이 아닙니다."
 GRN_focus_Army_Officer_Training_Corps: "육군 장교 훈련단"
 GRN_focus_Army_Officer_Training_Corps_desc: "육군 장교 훈련단은 전술적, 전략적 의미 모두에서 지도자가 될 인원들의 결정체이자 헌신입니다. 우리나라는 작은 나라이므로 자연스러운 정착이 자리 잡을 정도로 커지기 전에 나쁜 습관을 키우거나 억제해야 합니다."
 GRN_focus_Navy_Of_Greenland: "그린란드 해군"
 GRN_focus_Navy_Of_Greenland_desc: "우리 해군은 어선과 순찰선에 불과합니다. 연안 해역을 방어할 생각이라도 하려면, 우선 해군이 있어야 하고 때로는 그토록 변덕스러운 조건도 감당할 수 있는 해군이어야 합니다."
 GRN_focus_Naval_Research_Institute: "해군 연구소"
 GRN_focus_Naval_Research_Institute_desc: "일리레크 해군 연구소를 설립하면 해군에 대한 지식과 실용적 응용을 개발하고 키울 수 있습니다. 이 개발의 초석은 우리가 원하는 해군을 만들고 외세의 침략으로부터 우리 해역을 제대로 방어할 수 있게 해 줄 것입니다."
 GRN_focus_Nuuk_Naval_Shipyards: "누크 해군 조선소"
 GRN_focus_Nuuk_Naval_Shipyards_desc: "수도 지역 조선소를 개발하면 군사용은 물론 잠재적 민간용 선박도 새로 건조할 수 있습니다."
 GRN_focus_Expanding_The_Design_Department: "설계부 확대"
 GRN_focus_Expanding_The_Design_Department_desc: "국가 남부의 해군 연구소 인근에 전략적 해군 조선소를 두면 가능한 한 함선을 개선, 설계, 시험하여 해군에 최선의 결과를 안겨 줄 수 있습니다. 이는 현재 배치된 함급을 더 잘 갱신하고 가능한 한 새로운 설계로 개수하는 데에도 도움이 될 것입니다."
 GRN_focus_Tasiilaq_Shipyards_Complex: "타실라크 조선소 단지"
 GRN_focus_Tasiilaq_Shipyards_Complex_desc: "전략적 종점 사이의 전반적인 해군 발전의 균형을 맞추면 섬의 모든 곳에서 필요한 대로 함대를 군수 지원하고 배치할 수 있습니다."
 GRN_focus_Rough_Raft_Designs: "엉성한 뗏목 설계"
 GRN_focus_Rough_Raft_Designs_desc: "어떤 형태로든 해군 전력을 설계하고 배치하려면 최소한의 것이 필요하며, 이는 미래에 실제 설계를 입수하고 건조를 시도하기 위해 연구 개발 노력에 더욱 힘써야 함을 의미합니다."
 GRN_focus_Small_Surface_Fleet_Doctrine: "소형 수상 함대 교리"
 GRN_focus_Small_Surface_Fleet_Doctrine_desc: "Our nation doesn't have the manpower to field many ships in general. As such we'll begin to tool and work our naval doctrine around surface vessels but of the smaller caliber. Make them more modular and adaptable essentially, though nothing larger than say a destroyer due to trainign and manpower concerns."
 GRN_focus_Corvette_Design_Department: "초계함 설계부"
 GRN_focus_Corvette_Design_Department_desc: "소형 수상 함대 교리의 초기 프로그램은 초계함 설계부입니다. 이 부서는 표준 선체 유형을 둘러싼 혁신을 설계, 시험, 개선하는 일을 맡습니다."
 GRN_focus_Small_Vessel_Fleet_Organization: "소형 함선 함대 편성"
 GRN_focus_Small_Vessel_Fleet_Organization_desc: "소형 함선 함대, 즉 소함대는 3대 함종을 중심으로 편성됩니다. 초계함, 호위함, 구축함입니다. 이 세 가지 함급은 승조원을 갖추고, 적응하며, 우리 함대가 적군에게 강력한 타격을 줄 수 있도록 새롭고 역동적인 설계를 만드는 데 가장 적합합니다."
 GRN_focus_Submersival_Fleet_Doctrine: "잠수함 함대 교리"
 GRN_focus_Submersival_Fleet_Doctrine_desc: "잠수함은 은밀하고 인력 수요도 그리 크지 않습니다. 하지만 잠수함은 제대로 편성하면 매우 큰 타격을 줍니다. 대함 미사일부터 전통적인 어뢰까지, 더 적은 것으로 훨씬 많은 일을 할 수 있습니다."
 GRN_focus_Attack_Submarine_Pillar: "공격 잠수함 기둥"
 GRN_focus_Attack_Submarine_Pillar_desc: "The first main pillar to securing the foundation of our navy is that of the attack class of submarine. Designed mostly around direct assualt tactics like torpedoes and mine warfare, the attack class will be the spears of our nation's navy."
 GRN_focus_Missile_Submarine_Pillar: "미사일 잠수함 기둥"
 GRN_focus_Missile_Submarine_Pillar_desc: "해군 안보를 위한 두 번째 기둥은 미사일 잠수함입니다. 미사일은 강력한 타격을 주지만 꽤 비싸기도 합니다. 해상에서 외적에 제대로 맞서려면 해군력의 이 기둥의 실질적인 전투 능력을 개선하고 향상해야 합니다."
 GRN_focus_Naval_Command_Corps: "해군 지휘단"
 GRN_focus_Naval_Command_Corps_desc: "우리 해군에는 지휘 체계가 필요하며, 오늘 바로 그것을 세웁니다. 시작일 뿐이고 여기서부터는 올라갈 일만 남았습니다. 그러길 바랍니다."
 GRN_focus_Greenlandic_Air_Force: "그린란드 공군"
 GRN_focus_Greenlandic_Air_Force_desc: "우리 섬 위의 하늘은 흐리고, 춥고, 황량합니다. 우리 하늘을 방어하기에 충분한 공군을 어떻게 개발하고 창설할지 궁리해야 합니다."
 GRN_focus_West_Craft_Manufacturing: "서부 항공기 제조"
 GRN_focus_West_Craft_Manufacturing_desc: "서부 항공기 제조 시설은 가능한 때와 장소에서 공군을 위한 설계를 생산하고 시험할 준비가 되었습니다. 이 새로운 산업 단지를 활용해 우리 하늘을 방어할 공군을 무장시키고 준비시키기를 희망합니다."
 GRN_focus_Preparing_Air_Institute_Manufacturing: "항공 연구소 제조 준비"
 GRN_focus_Preparing_Air_Institute_Manufacturing_desc: "항공기를 생산하고 시험하는 능력은 배우고 혁신하는 데 무엇보다 중요합니다. 새로운 설계의 개발과 기술 시험을 둘러싼 군수와 계획이 수월해지도록 계획된 항공 연구소 인근에 제조 능력을 갖출 것입니다."
 GRN_focus_Tingmiarmit_Air_Research_Institute: "팅미아르미트 항공 연구소"
 GRN_focus_Tingmiarmit_Air_Research_Institute_desc: "팅미아르미트 항공 연구소는 항공기와 공중전 능력을 둘러싼 개발과 혁신에 전념하는 기관입니다. 우리나라는 어느 정도 크지만 동시에 작기도 하므로, 이 초창기를 진정한 형태의 항공 교리와 적군으로부터의 항공 안보를 전문화하는 데 바쳐야 합니다."
 GRN_focus_Infrequent_Flyer_Designs: "비정기 비행 설계"
 GRN_focus_Infrequent_Flyer_Designs_desc: "부여된 지정 임무를 수행하기 위한 저렴한 설계입니다. 최선은 아니지만 공군의 본격적인 개발을 시작하기 위한 출발점인 것은 분명합니다."
 GRN_focus_Air_Supremacy_Prioritization: "제공권 우선화"
 GRN_focus_Air_Supremacy_Prioritization_desc: "The enemy may overwhelm our navy, but they should never be allowed to dominate our skies. We should wholely focus on producing and innovating in direct air to air combat capabilities. Securing this allows us to do whatever we want on both air, sea and land by proxy."
 GRN_focus_General_Aviation_Innovations: "일반 항공 혁신"
 GRN_focus_General_Aviation_Innovations_desc: "팅미아르미트 항공 연구소는 열심히 일해 왔습니다. 돈을 많이 투자했으니 다행이지만, 아무튼 그렇습니다. 레이더 탐지, 연료 효율, 일반 소비 절감 노력 같은 부분의 전반적 개선과 소수의 다른 혁신이 곧 야전 시험에 들어갈 것입니다."
 GRN_focus_Air_Dominance_Research_Programs: "제공권 연구 프로그램"
 GRN_focus_Air_Dominance_Research_Programs_desc: "Through sole dedication on fighter R&D efforts we shall rid the skies from any foes who seek to blacken our skies with their hateful intentions."
 GRN_focus_Naval_Bombing_Superiority_Force: "해상 폭격 우세 전력"
 GRN_focus_Naval_Bombing_Superiority_Force_desc: "공중 수단으로 바다를 장악하면 필요한 경우 선제적 방어 조치와 확실한 공격 능력의 길이 열릴 수 있습니다."
 GRN_focus_Bombing_Research_Priorities: "폭격 연구 우선순위"
 GRN_focus_Bombing_Research_Priorities_desc: "Investing our research funding to prioritize innovations around bombing and more air to ground and air to ship combat will prove fruitful to prempt any invasion force we may possibly face."
 GRN_focus_Bomber_Air_Fleets: "폭격기 항공 함대"
 GRN_focus_Bomber_Air_Fleets_desc: "우리 공군은 온갖 폭격 노력을 위한 전담 항공 함대를 갖추게 됩니다. 전략 폭격부터 근접 항공 지원까지, 어떤 적군도 우리 땅을 오래 해치지 못하도록 하겠다는 무대를 마련할 것입니다."
 GRN_focus_Air_Officer_Training_Corps: "공군 장교 훈련단"
 GRN_focus_Air_Officer_Training_Corps_desc: "공군 장교단을 개발하면 우리가 공군이라는 병과가 실제로 무엇인지 계속 키우고 다듬어 나가는 동안 확보하려는 개발 노력이 계속 개선될 것입니다."
 GRN_focus_Greenlandic_General_Staff_Corps: "그린란드 참모단"
 GRN_focus_Greenlandic_General_Staff_Corps_desc: "군이 끊임없이 확대되면서 더욱 통합된 참모 지휘부가 필요한 시점에 이르렀습니다. 따라서 이 국가 지휘 참모부를 창설하고, 나라를 개선하며 국방 수단을 항상 향상시키기 위해 노력할 것입니다."
 GRN_focus_Thawing_The_Economy: "경제 해빙"
 GRN_focus_Thawing_The_Economy_desc: "우리나라의 경제는 원래 어업, 그리고, 음, 어업뿐입니다. 물론 상업 및 기타 경제 부문의 비중은 극히 작지만 경제의 진짜 대부분은 어업에서 나옵니다. 이를 바꿔야 합니다. 물론 독립을 위한 투쟁에 맞서 다변화를 시도해 왔지만, 우리가 무엇을 할 수 있고 어떻게 할지 계속 찾아야 합니다. 우리 경제에는 성장 잠재력이 있지만 무언가를 해야 합니다."
 GRN_focus_Energizing_Greenland: "그린란드에 활력을"
 GRN_focus_Energizing_Greenland_desc: "As we grow our nation our energy demand continue to rise and rise. We need to establish a stable energy sector that will continue to handle the demands we seek."
 GRN_focus_Fossil_Fuelin: "화석 연료 동력"
 GRN_focus_Fossil_Fuelin_desc: "우리나라에는 아직 손대지 않은 석탄과 석유의 대규모 매장지가 있습니다. 이를 신속하고 저렴한 에너지로 사용하여 에너지 수요의 속도를 적절히 따라갈 수 있습니다."
 GRN_focus_Oil_Charter_Dominance: "석유 채굴권 우위"
 GRN_focus_Oil_Charter_Dominance_desc: "채굴을 위한 새로운 허가를 만드는 것을 우선시하면 전반적인 채굴 노력을 확대하여 에너지 수요를 계속 충족할 수 있습니다."
 GRN_focus_Renewable_Revivals: "재생 에너지 부흥"
 GRN_focus_Renewable_Revivals_desc: "Our lands are a plenty with winds, sunshine and moving waters. We have the arguably best environment to invest in stable renewable energies and as such we'll begin a general and comprehensive investment in both building renewable facilities and the development of better methods to create energy."
 GRN_focus_Harnessing_The_Winds_Of_Fortune: "행운의 바람 활용"
 GRN_focus_Harnessing_The_Winds_Of_Fortune_desc: "We'll continue to prioritize our general developments and assure that we can harness the very nature of our nation to benefit our citizens to be able to live better lives then before."
 GRN_focus_Greenlands_Green_Energy: "그린란드의 녹색 에너지"
 GRN_focus_Greenlands_Green_Energy_desc: "Our island is the perfect place to develop and use nuclear energy. Fairly stable weather patterns, cool and cold temperatures nearly all year round and plenty of water both salt and fresh..frozen water to be used in the steam generation process."
 GRN_focus_Unlimited_Power: "무한한 힘"
 GRN_focus_Unlimited_Power_desc: "국내 핵물질 매장지로 우리 시설에 자체 공급할 수 있습니다. 또한 건설을 시작하여 가동을 개시할 무대를 마련할 수도 있습니다. 이 막대한 투자로 우리는 더 이상 에너지를 걱정할 필요가 없는 나라라는 선례를 세웁니다."
 GRN_focus_Secured_Electrical_Grid: "안전한 전력망"
 GRN_focus_Secured_Electrical_Grid_desc: "에너지 방향이 정해지면서 전력 수요는 이제 더 안정되었거나, 적어도 반응적이기보다 선제적인 성격에 가까워지고 있습니다. 우리가 옳은 선택을 했기를 바라며 더 밝은 미래를 향해 계속 나아갑시다."
 GRN_focus_Agricultural_Futurism_Plan: "농업 미래주의 계획"
 GRN_focus_Agricultural_Futurism_Plan_desc: "우리의 원래 고강도 농업 프로젝트는 경제적, 과학적 혁신의 기반을 다져 놓았습니다. 에너지 집약적인 조치로 이어지긴 하지만, 이를 활용해 자급자족과 잠재적 해외 무역 및 투자 모두에서 농업 부문의 우위를 선도할 수 있습니다."
 GRN_focus_Western_Farming_Complexes: "서부 농업 단지"
 GRN_focus_Western_Farming_Complexes_desc: "이러한 방식을 뒷받침할 토대, 기반시설, 전반적 구조물을 만드는 데는 시간이 걸리지만 미래에 성과를 낼 것입니다. 수직 농업 단지는 거의 일 년 내내 온갖 종류의 식량을 재배하기에 좋습니다. 이는 또한 증류 시설 체계를 확대하여 거대 빙붕을 계속 깎아 나갈 수 있게 해 줍니다."
 GRN_focus_Eastern_Farming_Complexes: "동부 농업 단지"
 GRN_focus_Eastern_Farming_Complexes_desc: "수직 농업 부문의 지속적인 개발은 우리나라의 식량 비용을 사상 최저로 끌어내려 식량을 매우 저렴하게 만들고, 지역적으로는 제철이 아니라고 여겨질 것들을 거의 일 년 내내 다른 나라와 교역할 수 있게 해 줄 것입니다."
 GRN_focus_Supplemental_Industries: "보완 산업"
 GRN_focus_Supplemental_Industries_desc: "산업 부문을 개발하면 막대한 투자가 이루어진 농업 부문 속에서 제한적이나마 다양성을 얻을 수 있습니다."
 GRN_focus_First_International_Farm: "최초의 국제 농장"
 GRN_focus_First_International_Farm_desc: "더 넓은 농업 부문의 연구와 경제 발전에 대한 모든 투자를 통해, 우리가 충족할 수 있는 수요를 감안하면 우리가 최초의 국제 농업 국가가 될 수 있음을 깨달았습니다. 물론 전 세계에 곡창 지대가 있지만, 생각해 보십시오. 우리는 바로 그 세계 식량 은행이 될 수 있습니다."
 GRN_focus_Infrastructure_Projects: "기반시설 프로젝트"
 GRN_focus_Infrastructure_Projects_desc: "경제를 성장시키는 것은 모두 좋은 일이지만, 이를 유지하려면 경제가 실제로 돌아가도록 사람과 서비스를 연결할 도로, 철도, 그리고 모든 종류의 기반시설이 필요합니다. 따라서 인구가 드문드문한 나라를 더 잘 통합하기 위한 일반 프로젝트 목록을 마련할 것입니다."
 GRN_focus_Greater_West_Highway_Project: "대서부 고속도로 프로젝트"
 GRN_focus_Greater_West_Highway_Project_desc: "서부 마을들을 연결하는 직통 \\"고속도로\\"를 만들면 시민들의 이동 여건이 개선되고 한 곳에서 다른 곳으로 가는 데 드는 이동 부담과 시간이 줄어듭니다."
 GRN_focus_Improving_Western_Internet_Towers: "서부 인터넷 기지국 개선"
 GRN_focus_Improving_Western_Internet_Towers_desc: "기존 기지국을 개선하고 새로운 인터넷 기지국을 건설하면 국민과 기관이 일상 업무를 더욱 효율적이고 긴밀하게 수행할 수 있게 될 것입니다."
 GRN_focus_Sisimuit_Northern_Railway: "Sisimuit Northern Railway"
 GRN_focus_Sisimuit_Northern_Railway_desc: "기존 철도망을 서부 지역 가능한 한 넓게 확장하는 것은 물류와 경제 공급망의 결속에 무엇보다 중요합니다. 철도는 대량 수송에 가장 적합하므로 이 투자로 큰 이익을 얻을 것입니다."
 GRN_focus_Great_Eastern_Highway_Project: "대동부 고속도로 사업"
 GRN_focus_Great_Eastern_Highway_Project_desc: "서부 사업과 마찬가지로, 가능하다면 가장 기초적인 수단으로라도 동부의 마을들을 연결하여 국가의 연결성을 크게 높이기 위해 최선을 다할 것입니다."
 GRN_focus_East_Region_Internet_Expansions: "동부 지역 인터넷 확충"
 GRN_focus_East_Region_Internet_Expansions_desc: "동부 지역은 대체로 서부에 비해 발전이 더딘 편이므로, 이러한 격차를 해소하고 성장시키기 위해 가능한 모든 일을 해야 합니다. 이에 따라 해당 지역의 기존 인터넷 기반시설을 확충하여 표준 수준으로 끌어올릴 것입니다."
 GRN_focus_Great_Greenlandic_Eastern_Railroad: "대그린란드 동부 철도"
 GRN_focus_Great_Greenlandic_Eastern_Railroad_desc: "GGERR은 해안 지대 대부분을 하나의 통합 철도망으로 연결하기 위해 추진하는 가장 큰 기반시설 투자 중 하나입니다. 이동 시간을 단축하는 데 유일한 장벽은 거대한 빙붕이지만, 언젠가는 이를 바꿀 수 있을지도 모릅니다."
 GRN_focus_Connecting_Greenland: "그린란드 연결"
 GRN_focus_Connecting_Greenland_desc: "국가가 성장함에 따라 인프라에 대한 수요도 늘어납니다. 이를 위해 인프라 자체뿐만 아니라 이를 유지하는 방식과, 우리가 인프라를 건설하는 환경에 더 이로운 방향으로 개선하는 방법에도 계속 투자해야 합니다."
 GRN_focus_Economic_Modernism_Plan: "경제 현대화 계획"
 GRN_focus_Economic_Modernism_Plan_desc: "경제의 안정과 건전성을 위해서는 경제 다각화를 지속하는 것이 무엇보다 중요합니다. 폭넓은 민간 부문과 사무·기술 부문의 부족한 점을 개선해야 합니다."
 GRN_focus_Office_District_West: "서부 사무 지구"
 GRN_focus_Office_District_West_desc: "서부 지역 일대의 일반 사무 부문을 발전시키면 국민이 누릴 수 있는 제품과 서비스를 확대할 수 있을 것입니다."
 GRN_focus_Tech_Sector_Growth: "기술 부문 성장"
 GRN_focus_Tech_Sector_Growth_desc: "Growing the office and service sectors is usually complimented by the general development of the technology sector as well. We should secure this to ensure the most diversity is achieved by our economy as possible."
 GRN_focus_Civilian_Sector_Investments: "민간 부문 투자"
 GRN_focus_Civilian_Sector_Investments_desc: "사무 부문의 발전과 다각화를 위한 노력을 보완하려면, 이들 기업이 제품을 만들고 활용할 수 있도록 산업적 뒷받침이 필요합니다."
 GRN_focus_National_Economic_Modernity: "국가 경제 현대화"
 GRN_focus_National_Economic_Modernity_desc: "우리의 투자는 다방면에 걸쳐 풍성한 결실을 맺었다고 해도 과언이 아니지만, 이는 시작에 불과합니다. 국민과 국가의 미래를 위해 가능한 최선의 결과를 이끌어내도록 노력해야 합니다."
 GRN_focus_Resource_Extraction_Projects: "자원 채굴 사업"
 GRN_focus_Resource_Extraction_Projects_desc: "이 섬에는 아직 개발되지 않은 자원이 넘쳐납니다. 국내 안보와 외국인 투자 및 무역에서 앞서 나가려면, 국가에 최선이라고 판단되는 수요에 맞추어 자원 채굴 부문을 발전시켜야 합니다."
 GRN_focus_Iron_Mining_Operations: "철광 채굴 작전"
 GRN_focus_Iron_Mining_Operations_desc: "철은 경제 전반에서 채굴하고 활용하는 기본적인 광석입니다. 우리의 필요에 가장 부합하도록 채굴 작업을 시작하고 확대하기 위해 국가 차원의 투자를 개시할 것입니다."
 GRN_focus_Project_Alumina_Oxide: "알루미나 산화물 프로젝트"
 GRN_focus_Project_Alumina_Oxide_desc: "아직까지 보크사이트 광상을 직접 발견하지는 못했지만, 다른 광물에서 알루미늄 제조에 필요한 산화알루미늄을 추출하는 방법이 있다는 것을 알아냈습니다. 따라서 얼마 안 되는 자원을 최대한 활용하기 위해 채굴 작업과 분리 연구에 대규모 투자가 필요합니다."
 GRN_focus_Lithium_Mining_Operations: "리튬 채굴 작전"
 GRN_focus_Lithium_Mining_Operations_desc: "리튬을 비롯한 기초 소재 광물의 매장량은 기술 산업과 서비스 부문의 혁신 및 성장 역량을 확대하는 데 핵심이 될 것입니다. 리튬, 코발트 등의 채굴 작업에 투자하면 경제의 유연성이 크게 높아질 것입니다."
 GRN_focus_Project_Rare_Minerals: "희귀 광물 프로젝트"
 GRN_focus_Project_Rare_Minerals_desc: "네오디뮴과 같은 희토류 원소 및 그 밖의 가용 광물 매장지에 대규모로 투자하면 무역 협상에서 우리의 국제적 위상이 크게 높아질 것입니다. 이러한 투자를 통해 우리나라가 새로운 경지에 도달하고 더 많은 자본 투자를 유치할 수 있기를 기대합니다."
 GRN_focus_Black_Gold_Extraction_Efforts: "검은 황금 채굴 노력"
 GRN_focus_Black_Gold_Extraction_Efforts_desc: "석유 매장지에 투자하면 값싼 에너지를 풍부하게 얻을 수 있을 뿐만 아니라 향후 무역 협정에서 훌륭한 협상 카드가 될 것입니다. 또한 채굴한 석유와 석탄을 합성 연료 및 석유화학 산업을 강화하는 데에도 활용할 수 있습니다."
 GRN_focus_Project_Glacial_Rubber: "빙하 고무 프로젝트"
 GRN_focus_Project_Glacial_Rubber_desc: "고무나무 재배에 특화된 전용 수직 농장(VFF)에 대한 대규모 실험과 투자, 그리고 석탄과 석유를 합성 고무 및 석유화학 제품으로 전환하는 방안까지, 국내 고무 공급을 확보하기 위해 가능한 모든 길을 모색할 수 있습니다."
 GRN_focus_Polar_Bear_Policies: "북극곰 정책"
 GRN_focus_Polar_Bear_Policies_desc: "With our nation stable, developed and equipped for national defense and potential offense we can now begin to look beyond the island. Our foreign policy will dictate our true future and the desires for with we wish to reach with our own hands."
 GRN_focus_The_Atlantic_Stepping_Stone: "대서양의 디딤돌"
 GRN_focus_The_Atlantic_Stepping_Stone_desc: "Lets be real with ourselves, any real foreign policy direction is always going to involve Iceland at some point. So lets get this out of the way and figure out just what exactly we'll be doing. This will not only set the pacing for our future foreign policy endeavors but it will be a suitable test to our abilities to navigate the modern landscape."
 GRN_focus_Investing_In_Brotherhood: "형제애에 대한 투자"
 GRN_focus_Investing_In_Brotherhood_desc: "더 긴밀한 유대와 관계는 물론 양국 간 연합이라는 장래 구상까지 이루려면 신뢰를 쌓아야 합니다. 우리보다 그들에게 더 큰 이익이 돌아가는 일련의 투자로 이를 이룰 수 있습니다. 이 일을 긴 안목으로 추진한다면 결국 양측 모두에게 이익이 될 것입니다. 천천히 꾸준히 가는 쪽이 이긴다는 점을 잊지 마십시오."
 GRN_focus_Reykjavik_Investment_Firm: "레이캬비크 투자회사"
 GRN_focus_Reykjavik_Investment_Firm_desc: "Iceland is in NATO, this is a problem. We must find a way to cull the reliance and supposed need that Iceland has for the foreigners, namely the Americans help if we are to secure the island for ourselves. As such lets make them an offer they can't refuse. Nevermind that fine print, just sign right here."
 GRN_focus_Operation_Real_Green: "작전: 리얼 그린"
 GRN_focus_Operation_Real_Green_desc: "We've exhausted all our options, we must secure the island for our sub-regional defense of the high north atlantic ocean area. Fishing, trade secured for our interest and economy. As well as pre-emptive patrolling against aggressive proabing measures will bring better stability to the area."
 GRN_focus_Passive_Administration_Act: "소극적 통치법"
 GRN_focus_Passive_Administration_Act_desc: "이제 아이슬란드가 우리의 보다 직접적인 통제 아래 들어왔으므로, 유사한 민족들의 더욱 긴밀한 연합을 이루도록 통합을 도와야 합니다. 따라서 더 소극적인 접근을 취하여, 조직은 연방제에 가깝더라도 사실상 느슨한 연합 형태를 이루겠습니다."
 GRN_focus_The_North_Sea_Gambit: "북해의 승부수"
 GRN_focus_The_North_Sea_Gambit_desc: "페로 제도는 북해의 중간 지점입니다. 덴마크의 대응을 유도할 무대를 마련하기 위해 어떤 수단을 쓰더라도 이 제도를 확보할 것입니다. 덴마크가 우리에게 선전포고하도록 만들어 NATO 5조 원칙을 우회하는 것이 목표입니다. 그렇게 하면 대륙에 발판도 마련하여 북쪽이든 남쪽이든 더 가까운 작전 기지를 얻을 수 있습니다."
 GRN_focus_Friends_On_The_Other_Side: "건너편의 친구들"
 GRN_focus_Friends_On_The_Other_Side_desc: "페로 제도 주민들의 마음을 얻으려면 우리가 호의적인 모습을 보여야 합니다. 따라서 그들의 이익에 봉사하기 위해 최선을 다할 것입니다. 섬 곳곳에서 현지 주민과 사업 노동자들에게 덴마크가 이렇게까지 잘해준 적이 없다는 이야기를 은근히 자연스럽게 퍼뜨리기만 하면, 분위기와 흐름을 만들어 정부가 우리에게 굴복하게 할 수 있습니다."
 GRN_focus_Operation_Fair_Oh: "작전: 페어 오"
 GRN_focus_Operation_Fair_Oh_desc: "페로 제도는 덴마크의 통제 아래 있지만, 덴마크는 현상 유지 이상으로 크게 신경 쓰지 않는 듯합니다. 그냥 섬을 슬쩍 가져가면 어떻게 될지 지켜보면 어떻겠습니까. 접수 과정에서 피 한 방울 흘리지 않는다면 그것이 과연 공격이겠으며, 덴마크가 호소하기 전에 주민들이 우리 편에 서도록 설득할 수 있다면, 덴마크 혼자서도 충분히 상대할 수 있다고 다들 생각할 나라와 맞서 싸우는 덴마크를 누가 진심으로 도우려 하겠습니까. 공격적이면서도 공격적이지 않은 완벽한 계획입니다."
 GRN_focus_Continental_Shenanigans: "대륙에서의 책동"
 GRN_focus_Continental_Shenanigans_desc: "북해의 디딤돌을 확보했으므로 이제 대륙으로 눈을 돌립니다. 다시 말해, 다음 목적지를 정하기 전에 대륙에 상륙하기 위해 옛 종주국을 되돌아보는 것입니다."
 GRN_focus_Family_Investments: "가족 투자"
 GRN_focus_Family_Investments_desc: "덴마크가 우리의 책동을 눈치채고 있으므로, 더 소극적인 접근으로 그들의 경계를 따돌려야 합니다. 최근 우리의 역사를 고려할 때, 그들이 긴장을 풀고 경계를 늦추게 해야 가능하다면 더 평화로운 방식으로 일을 처리할 수 있습니다."
 GRN_focus_Jylland_Investment_Firm: "윌란 투자회사"
 GRN_focus_Jylland_Investment_Firm_desc: "We'll practice just like in Iceland. A bulk series of investments which will allow us to sew in some minor public issues to politically isolate Denmark from its alliance commitments."
 GRN_focus_Operation_Middleman: "작전: 중개인"
 GRN_focus_Operation_Middleman_desc: "덴마크는 북유럽 가족 구성원과 대륙의 자유경쟁 사이를 잇는 중개인입니다. 최종 목표를 향해 나아가는 과정이 원활하도록 이를 확보해야 합니다."
 GRN_focus_Civil_Service_Integration: "공공 서비스 통합"
 GRN_focus_Civil_Service_Integration_desc: "덴마크의 공공 서비스를 기존 공공 서비스 체계에 표준화하여 통합하면 각 프로그램과 이를 필요로 하는 국민 모두에게 더 일관되고 혼란이 적은 일상 운영이 가능해질 것입니다."
 GRN_focus_Nordic_Regional_Operations: "북유럽 지역 작전"
 GRN_focus_Nordic_Regional_Operations_desc: "With the central command center achieved through the acquisition of Denmark we now can better generalize our strategic objectives and abilities. We still have the same format but it'll follow now more broader scopes and or at least more indirect approaches for better cohesion."
 GRN_focus_West_Nordic_Interests: "서북유럽 이익"
 GRN_focus_West_Nordic_Interests_desc: "시간이 흐름에 따라 노르웨이의 자원과 더 큰 북유럽 연합에 대한 민간의 지지를 확보하기 위해 내부 영향력을 점차 얻어 나갈 것입니다."
 GRN_focus_North_Fjords_Investment_Firm: "북부 피오르드 투자회사"
 GRN_focus_North_Fjords_Investment_Firm_desc: "Similar to how we handled Iceland and Greenland, we'll develop our own interests through developing Norwegian interests."
 GRN_focus_Operation_Fjordsland: "작전: 피오르드란트"
 GRN_focus_Operation_Fjordsland_desc: "노르웨이를 확보하면 북해 무역로와 자원에 제약 없이 접근할 수 있습니다. 러시아에 맞선 방어를 위해 NATO와 협상할 카드도 생기며, 전반적으로 더 넓은 북유럽 지역에 발판을 마련하게 됩니다."
 GRN_focus_North_Sea_Negotiations: "북해 협상"
 GRN_focus_North_Sea_Negotiations_desc: "주민들과 협력하며 새로운 현상 유지 상태에서 그들이 무엇을 원하는지 파악하면 전반적인 통합 과정을 더 낫고 원활하게 만드는 데 도움이 될 것입니다."
 GRN_focus_Central_Nordic_Interests: "중부 북유럽 이익"
 GRN_focus_Central_Nordic_Interests_desc: "스웨덴, 나아가 북유럽 국가들의 중부 지역에서 우리의 이익을 확보하기 위해 최선을 다하는 것은 향후 우리의 노력에 큰 도움이 될 것입니다."
 GRN_focus_Karlstad_Central_Investments_Agency: "칼스타드 중앙 투자청"
 GRN_focus_Karlstad_Central_Investments_Agency_desc: "칼스타드와 다른 도시들 일대를 투자하고 개발하면 우리에 대한 호의적인 여론이 형성될 뿐만 아니라, 스웨덴의 미래는 물론 우리의 미래에도 투자할 수 있게 될 것입니다."
 GRN_focus_Operation_Great_Northern_War: "작전: 대북방 전쟁"
 GRN_focus_Operation_Great_Northern_War_desc: "스웨덴이 이 지역에서 대체로 우호적인 성향을 보였음에도 불구하고 우호적인 정치 노선은 우리에게 실패했습니다. 그 결과 우리는 최종 목표를 달성하기 위해 보다 강압적인 수단에 의존할 수밖에 없게 되었습니다."
 GRN_focus_Stockholm_Community_Programs: "스톡홀름 지역사회 프로그램"
 GRN_focus_Stockholm_Community_Programs_desc: "지역사회에 다가가 안정적이고 전반적으로 더 긍정적인 인상을 심어주기 위해 더 노력하면 주민과 지방 행정 당국 모두와의 통합 노력을 더 잘 정착시킬 수 있을 것입니다."
 GRN_focus_Eastern_Nordic_Interests: "동부 북유럽 이익"
 GRN_focus_Eastern_Nordic_Interests_desc: "핀란드를 확보하면 서로 맞부딪히는 강대국인 미국과 러시아 사이에서 훌륭한 협상 카드가 될 것입니다. 핀란드는 위대한 동쪽의 곰과 상당히 긴 국경을 접하고 있으므로, 우리의 향후 목표에 이익이 될 방법을 모색해 볼 만합니다."
 GRN_focus_Suomen_Investment_Agency: "수오멘 투자청"
 GRN_focus_Suomen_Investment_Agency_desc: "핀란드 국민이 원하는 듯한 발전과 미래를 보장하는 동시에, 우리가 바라는 미래를 더 쉽게 만들기 위해 할 수 있는 일을 하는 것은, 핀란드를 우리 목적에 맞게 확보할 수 있을지 가늠하는 훌륭한 방법입니다."
 GRN_focus_Operation_Mannerheim: "작전: 만네르헤임"
 GRN_focus_Operation_Mannerheim_desc: "얼어붙은 땅 핀란드를 확보하는 것은 고향 같은 곳을 하나 더 얻는 것이나 마찬가지일 것입니다. 지형은 대체로 훨씬 평탄하지만 환경의 혹독함은 비슷합니다. 따라서 전반적으로 큰 어려움 없이 이 땅을 확보할 수 있을 것입니다."
 GRN_focus_Continued_Peaceable_Autonomy: "Continued Peacable Autonomy"
 GRN_focus_Continued_Peaceable_Autonomy_desc: "The Finnish people are a cherished peoples who enjoy solitude as much as solidarity among their cultural similars. As such with a mutual understanding and more standings of equal type of agreement we will be able to control the territory with ample help as long there was fair treatment and no strong arming of the civilians or government into a will against their own. While this sounds bad for us its actually a lot easier then many seem to realize."
 GRN_focus_Solidifying_Nordic_Unity: "북유럽 단결의 공고화"
 GRN_focus_Solidifying_Nordic_Unity_desc: "우리의 야망이 겸허한 결실을 맺었으므로, 이제는 그저 긴장을 풀고 노력의 열매를 누리면서 세계의 다른 연합들과 어깨를 나란히 할 새로운 북유럽 연합을 건설해 나가야 합니다."
 GRN_focus_Continental_Ambitions: "대륙적 야망"
 GRN_focus_Continental_Ambitions_desc: "With the nordic nations now consolidated we can now turn our attention to the south. While these goals are ever larger then we could earnestly fathom in practicality. If we use our diplomatic template as we have so far we should be able to achieve the next step in our foreign ambitions. The Inuit Continental Union."
 GRN_focus_Eastern_Continental_Interests: "동부 대륙 이익"
 GRN_focus_Eastern_Continental_Interests_desc: "북방의 통합이 이루어졌으므로 이제 남쪽을 바라볼 수 있습니다. 발트 지역에 발판을 마련하여 거대한 동부 국경을 구축할 것입니다."
 GRN_focus_Operation_Nordic_Adjacent: "작전: 북유럽 인접"
 GRN_focus_Operation_Nordic_Adjacent_desc: "에스토니아는 우리의 핀란드 영토에서 가장 가까운 상륙 지점입니다. 헬싱키에서 공수 강하하거나 대규모 해상 침공을 감행하여, 다른 강대국들이 항의를 생각하기 전에 신속히 이 나라를 확보할 수 있습니다."
 GRN_focus_Operation_Riga_River: "작전: 리가 강"
 GRN_focus_Operation_Riga_River_desc: "라트비아를 확보하면 나머지 발트 지역으로 뻗어 나가 장악할 수 있는 중앙 고원을 얻게 됩니다."
 GRN_focus_Operation_Vilnius: "작전: 빌뉴스"
 GRN_focus_Operation_Vilnius_desc: "리투아니아는 발트 지역에서 가장 발전한 강국이라 할 수 있으므로, 이들을 쓰러뜨리면 나머지 두 나라는 마을 산책하듯 손쉬울 것입니다."
 GRN_focus_Baltic_Behestment: "발트의 명령"
 GRN_focus_Baltic_Behestment_desc: "지방 당국과 민간인들이 새로운 현상 유지에 긴장을 풀고 받아들이기 시작하면서, 이제 옛 발트 국가들을 통합하기 시작할 수 있습니다. 다만 이들은 민족으로서 의지가 강하므로, 핀란드 지방 당국과 합의한 것과 비슷한 지위를 부여하는 방안을 모색할 수도 있습니다."
 GRN_focus_North_Sea_Security: "북해 안보"
 GRN_focus_North_Sea_Security_desc: "Securing the entirety of the North Sea and northern Atlantic will prove immensely useful in terms of global influence. We should work to aligning the Celtic Isles and their respective occupiers so we can pave the way for our more gracious rule."
 GRN_focus_Operation_Albion: "작전: 앨비언"
 GRN_focus_Operation_Albion_desc: "\\"연합\\" 왕국이었거나 현재도 그러한 나라의 핵심부를 확보하는 것은 켈트 제도에서의 후속 작전에 결정적입니다. 서부 대륙에서의 어떠한 책동에도 중요한 발판을 마련한다는 점은 말할 것도 없습니다."
 GRN_focus_Operation_Highlander: "작전: 하일랜더"
 GRN_focus_Operation_Highlander_desc: "스코틀랜드 지역을 확보하면 북해 전략 구역을 거의 완전히 장악할 수 있습니다. 이는 본섬으로의 전반적인 남진을 위한 토대가 될 것입니다."
 GRN_focus_Operation_Great_Western_Nation: "작전: 대서부 국가"
 GRN_focus_Operation_Great_Western_Nation_desc: "Strategic occupation of the Wales and what was once the Great Western Railway will allow us to utilize infrastructure to coordinate towards interests in both the west for Ireland and the southeast with England."
 GRN_focus_Operation_Be_My_Mann: "작전: 비 마이 맨"
 GRN_focus_Operation_Be_My_Mann_desc: "Securing the strategic Isle of Mann will give us a critical footnote when handling any naval issues in regards to the whole of the Celtic Isles."
 GRN_focus_Operation_Ulster: "작전: 얼스터"
 GRN_focus_Operation_Ulster_desc: "섬이 오늘날까지 여전히 분단되어 있으므로 우리의 최선책은 더 약한 북아일랜드 국가인 얼스터를 무너뜨리는 것입니다. 이를 확보하면 남쪽으로 진군하여 에메랄드 섬의 나머지를 확보할 수 있습니다."
 GRN_focus_Operation_Emerald_Isle: "작전: 에메랄드 섬"
 GRN_focus_Operation_Emerald_Isle_desc: "아일랜드 전역을 확보하면 대륙 최서단 지역으로의 진격을 더 잘 준비할 수 있습니다. \\"연합\\" 왕국이 있는 다른 섬을 위한 집결지로 쓸 수 있다는 점도 말할 것도 없습니다."
 GRN_focus_Celtic_Consolidations: "켈트 지역 공고화"
 GRN_focus_Celtic_Consolidations_desc: "통합 노력을 시작하고 이 땅과 사람들에 대한 우리의 통치와 권위를 정상화하는 데에는 시간이 걸릴 것입니다. 하지만 원조와 서비스를 제공하고 새로운 깃발 아래에서도 잘 지낼 수 있다는 것을 보여준다면 모두가 일상을 되찾을 수 있을 것입니다."
 GRN_focus_Western_European_Advances: "서유럽 진격"
 GRN_focus_Western_European_Advances_desc: "대륙을 가로지르는 우리의 꾸준한 행군은 서중부 국가들을 바라보며 내딛는 하나의 거대한 도약이 될 것입니다."
 GRN_focus_Operation_Bonaparte: "작전: 보나파르트"
 GRN_focus_Operation_Bonaparte_desc: "프랑스는 서유럽 작전 지역의 초석입니다. 뿐만 아니라 우리가 이베리아로 내려가기로 결정할 때 그곳으로 가는 관문 역할도 합니다. 대륙 중앙 축에서 가장 서쪽에 있는 이 나라를 공고히 할 때입니다."
 GRN_focus_Operation_Windmill: "작전: 풍차"
 GRN_focus_Operation_Windmill_desc: "네덜란드는 대륙에 서쪽 발판으로 삼기 좋은 곳이 될 것입니다. 국토 대부분이 해안선이므로 순식간에 확보할 수 있을 것입니다."
 GRN_focus_Operation_Rhine_Rumble: "작전: 라인 럼블"
 GRN_focus_Operation_Rhine_Rumble_desc: "독일은 유럽 대륙 전체의 가장 중심 지점을 이룹니다. 이를 확보하면 때가 되었을 때 대륙 전체를 확보하게 됩니다."
 GRN_focus_Operation_Chocolate_Waffle: "작전: 초콜릿 와플"
 GRN_focus_Operation_Chocolate_Waffle_desc: "벨기에는 이치상 존재해서는 안 될 나라입니다. 수백 년 전 영국이 만들어낸 이 나라는 진정한 유럽 통합의 눈엣가시입니다. 우리는 이 가시를 최대한 신속히 제거할 것입니다."
 GRN_focus_Operation_Speed_Bump: "작전: 과속 방지턱"
 GRN_focus_Operation_Speed_Bump_desc: "It's Luxembourg, its not a threat except when it joins a coalition of other nations. We're gonna take it now, okay byeeee."
 GRN_focus_French_Values_Greenlandic_Leadership: "프랑스의 가치, 그린란드의 지도력"
 GRN_focus_French_Values_Greenlandic_Leadership_desc: "Ensuring the highly agitation population of france is compliant with the new status quo will take significant amounts of time and effort. But if we can show we don't want to change their values, merely change the leadership in charge then we can hopefully work with the people a lot more."
 GRN_focus_German_Traditions_Greenlandic_Initiative: "독일의 전통, 그린란드의 주도권"
 GRN_focus_German_Traditions_Greenlandic_Initiative_desc: "독일은 풍부한 군사 전통의 역사를 지니고 있습니다. 이를 활용할 수 있다면 대륙 패권은 따놓은 당상입니다. 독일의 무력과 그린란드의 자존적 야망이 결합되는 것입니다."
 GRN_focus_Low_Countries_Low_Maintainance: "저지대 국가, 낮은 유지 비용"
 GRN_focus_Low_Countries_Low_Maintainance_desc: "저지대 국가들에게 기대되는 것은 단지 공정하게 대우받고 자유로운 기질을 유지하도록 허용받는 것입니다. 우리가 대등한 이들의 연합을 만들려고 한다는 점을 고려하면, 이는 예상보다 훨씬 쉬운 일로 드러나고 있습니다."
 GRN_focus_Iberian_Atlantic_Interests: "이베리아 대서양 이익"
 GRN_focus_Iberian_Atlantic_Interests_desc: "이베리아 지역은 대서양 중부 지역 사이의 전략적 요충지이자 지중해로 들어가는 주요 관문입니다. 대륙 전체를 확보하려면 이 중요한 무역 및 물류 거점을 확보해야 합니다."
 GRN_focus_Operation_Castile: "작전: 카스티야"
 GRN_focus_Operation_Castile_desc: "스페인은 이베리아의 맹주이므로, 이를 확보하면 사실상 이 지역을 확보한 것이나 다름없습니다."
 GRN_focus_Operation_Fontainebleau: "작전: 퐁텐블로"
 GRN_focus_Operation_Fontainebleau_desc: "나폴레옹은 한때 당시 스페인과의 조약을 통해 포르투갈을 정복하려 했습니다. 오늘날은 전혀 그렇지 않습니다. 우리는 이베리아 통합과 유럽 연방주의를 위해 포르투갈을 정복할 것이기 때문입니다. 새로운 여명이 우리를 기다리고 있으며, 포르투갈은 이베리아 공고화로 가는 관문입니다."
 GRN_focus_Operation_The_Other_Galicia: "작전: 또 다른 갈리시아"
 GRN_focus_Operation_The_Other_Galicia_desc: "유럽 밖의 대부분의 사람들은 갈리시아라고 하면 서부 우크라이나 일대를 떠올립니다. 하지만 우리가 말하는 것은 이베리아 북서부의 갈리시아 민족입니다."
 GRN_focus_Operation_Basquing_In_the_Sun: "작전: 햇볕 아래 바스킹"
 GRN_focus_Operation_Basquing_In_the_Sun_desc: "바스크 민족을 다루는 일은 아직 하지 않았다면 간단한 일일 것입니다. 이미 했던가요? 기억나지 않습니다."
 GRN_focus_Operation_Barcelona: "작전: 바르셀로나"
 GRN_focus_Operation_Barcelona_desc: "이베리아 북동부를 확보하면 프랑스와 스페인의 국경을 이루는 산맥 반대편에 발판을 마련할 수 있습니다."
 GRN_focus_Operation_Casablanca: "작전: 카사블랑카"
 GRN_focus_Operation_Casablanca_desc: "이베리아 내 안달루시아로 알려진 남부 지역은 지브롤터 해협의 우리 쪽 절반을 아무런 이의 없이 통제할 수 있게 해줄 것입니다."
 GRN_focus_Iberian_Idealism: "이베리아 이상주의"
 GRN_focus_Iberian_Idealism_desc: "With the region under our total control we can now begin to foster a sense of region unity. Using the cultures and peoples, their history and their spirit to propel forth a sense of new pride. Unity through strength and prosperity, comraderie through good and bad."
 GRN_focus_Alpine_Block_Nations: "알프스 블록 국가"
 GRN_focus_Alpine_Block_Nations_desc: "남중부 지역은 산악 지형이 지배적입니다. 이탈리아 국경 최북단의 알프스 산맥부터 이탈리아 본토를 따라 내려가는 여러 산맥까지 이어집니다. 더 동쪽으로 진출하려면 자연 방어에 유리한 이 지역을 확보해야 합니다."
 GRN_focus_Operation_Neutral_No_More: "작전: 더 이상 중립은 없다"
 GRN_focus_Operation_Neutral_No_More_desc: "스위스는 산의 나라입니다. 이를 정복하면 거의 무엇이든 정복할 수 있습니다."
 GRN_focus_Operation_Vienna_Calling: "작전: 빈이 부른다"
 GRN_focus_Operation_Vienna_Calling_desc: "알프스에서 헝가리 평원까지, 오스트리아를 확보하여 동쪽과 남쪽으로 가는 길을 열 것입니다."
 GRN_focus_Operation_Slovene_And_Slide: "작전: 슬로베니아 앤 슬라이드"
 GRN_focus_Operation_Slovene_And_Slide_desc: "발칸 북부에 발판을 마련하면 이후 이 지역으로 시선을 돌릴 때 확보하는 데 도움이 될 것입니다."
 GRN_focus_Operation_Gelato: "작전: 젤라토"
 GRN_focus_Operation_Gelato_desc: "이탈리아는 유럽 남중부와 지중해에 전략적으로 자리 잡고 있습니다. 이를 확보하면 후속 작전을 위한 중요한 해군 거점을 확보하게 됩니다."
 GRN_focus_Securing_Local_Interests: "지역 이익 확보"
 GRN_focus_Securing_Local_Interests_desc: "지역 주민들의 이익과 필요를 살피면 상황에 새롭고 더 긍정적인 빛을 비추는 데 도움이 될 것입니다. 국민에게 더 잘 다가가 권력 이양이 더 원활하게 이루어지기를 기대합니다."
 GRN_focus_Great_Eastern_Interests: "대동부 이익"
 GRN_focus_Great_Eastern_Interests_desc: "동부의 발판을 확보했으므로 이제 나머지 동유럽으로 뻗어 나갈 수 있습니다. 폴란드와 체코의 접경지대부터 벨라루스와 우크라이나 전선까지입니다. 동쪽으로 진군을 시작할 것입니다."
 GRN_focus_Operation_Heartbeat: "작전: 심장 박동"
 GRN_focus_Operation_Heartbeat_desc: "폴란드는 동유럽의 뛰는 심장입니다. 군사적 대비에 막대한 투자를 하여 유럽의 텍사스라고 불려 왔습니다. 이제 그것을 최종 시험대에 올릴 것입니다."
 GRN_focus_Operation_Carpathia: "작전: 카르파티아"
 GRN_focus_Operation_Carpathia_desc: "슬로바키아 국민 대부분은 거대한 카르파티아 산맥의 북쪽 굽이에 자리 잡고 있습니다. 발칸으로 남진하기 위한 전반적인 기지를 확보하려면 이 산맥을 넘어야 합니다."
 GRN_focus_Operation_Final_Rhapsody: "작전: 최후의 랩소디"
 GRN_focus_Operation_Final_Rhapsody_desc: "체코를 확보하면 발칸으로 들어가는 북쪽 접근로를 사실상 완전히 굳힐 수 있습니다. 유럽 통합까지는 한 걸음만 남았을 뿐입니다."
 GRN_focus_Operation_White_Russian: "작전: 화이트 러시안"
 GRN_focus_Operation_White_Russian_desc: "벨라루스는 물론 옛 역사적 야망은 제외하더라도, 러시아의 유럽 이익을 붙들고 있는 핵심 고리입니다. 대륙에 대한 우리의 통제를 진정으로 굳히려면 그들의 기세를 꺾어야 합니다."
 GRN_focus_Operation_Bread_Basket: "작전: 빵 바구니"
 GRN_focus_Operation_Bread_Basket_desc: "대륙의 곡창을 확보하면 여러 방면에서 우리에게 이익이 될 것이며, 이는 반드시 손에 넣어야 할 확실한 목표입니다."
 GRN_focus_Operation_Soviet_Storm: "작전: 소련의 폭풍"
 GRN_focus_Operation_Soviet_Storm_desc: "트란스니스트리아는 그 자체로 타임캡슐과도 같은 나라입니다. 소련의 마지막 보루 중 하나로서, 작지만 이 나라는 어떻게든 국가로 연명하게 하는 거의 그림자 같은 책략을 통해 극도로 자부심이 강하고 불복적입니다."
 GRN_focus_Operation_Your_Right_No_Your_Other_Right: "작전: 오른쪽, 아니 다른 오른쪽"
 GRN_focus_Operation_Your_Right_No_Your_Other_Right_desc: "We must attack Moldova..no not the Romanian region the nation. Yes I know its confusing but don't ask me, ask them when we get there."
 GRN_focus_Eastern_Territorial_Authority_Bureau: "동부 영토 관리국"
 GRN_focus_Eastern_Territorial_Authority_Bureau_desc: "ETAB는 보다 자유분방한 동부 국가들을 상대하기 위한 전담 기관입니다. 이들은 중앙집권 측면에서 아직 다소 길들여지지 않은 광대한 농촌 지역을 가지고 있습니다. 기반시설 사업과 지역사회 지원 프로그램을 통해 우리가 마주칠 수 있는 장기적인 문제를 진정시키고 억누를 수 있기를 기대합니다."
 GRN_focus_Balkan_Bounties: "발칸의 현상금"
 GRN_focus_Balkan_Bounties_desc: "The final nails in this extensive project of ours, the Bakan nations. A land of wars and history we will work extensively to tame this volatile zoo of a region."
 GRN_focus_Operation_Nosferatu: "작전: 노스페라투"
 GRN_focus_Operation_Nosferatu_desc: "The Transylvanian bowl within the Carpathian Mountains is a strategic defensive position. Romainia itself is also host to a fair amount of energy production and as such we can better use those resources for the benefit of all."
 GRN_focus_Operation_Bulgar: "작전: 불가르"
 GRN_focus_Operation_Bulgar_desc: "흑해를 따라 이어지는 동부 구역을 굳히면 발칸 내륙을 향한 노력을 공고히 하는 데 도움이 될 것입니다."
 GRN_focus_Operation_Alexander_Not_So_Great: "작전: 그리 위대하지 않은 알렉산더"
 GRN_focus_Operation_Alexander_Not_So_Great_desc: "마케도니아는 자랑스러운 역사적 인물인 알렉산드로스 대왕을 자국의 인물이라 주장합니다. 글쎄요, 지금은 보이지 않으니 여기서부터는 우리가 넘겨받겠습니다."
 GRN_focus_Operation_Trianon: "작전: 트리아농"
 GRN_focus_Operation_Trianon_desc: "헝가리는 발칸 북중부 고원에 걸쳐 있습니다. 이를 확보하면 지중해로 향하는 남쪽 길이 활짝 열립니다."
 GRN_focus_Operation_Princip: "작전: 프린치프"
 GRN_focus_Operation_Princip_desc: "세계 대전을 일으킨 검은 손에 이어, 이제는 이 지역에서 가장 큰 불씨 중 하나를 정리하기 위해 세르비아에 손바닥을 날릴 차례입니다."
 GRN_focus_Operation_Koso_Woah: "작전: 코소 워"
 GRN_focus_Operation_Koso_Woah_desc: "The speed bump that is Kosovo is more of a thorn in the side of Serbia then it will be to us. As such this should be a quick endeavor."
 GRN_focus_Operation_Scissors: "작전: 가위"
 GRN_focus_Operation_Scissors_desc: "크로아티아를 확보하면 상당한 해안 거점을 장악하고, 더 남쪽의 야망을 추구하는 동안 측면 공격 위치도 확보할 수 있습니다."
 GRN_focus_Operation_Minefield: "작전: 지뢰밭"
 GRN_focus_Operation_Minefield_desc: "극도로 분열된 보스니아를 제압하는 데 있어 가장 큰 걱정은 국토 전체가 사실상 미리 깔아놓은 지뢰밭이라는 점입니다. 따라서 조만간 실제로 어디까지 진출하려면 이를 처리할 장비를 충분히 가져와야 합니다."
 GRN_focus_Operation_Mountain_Man: "작전: 산사나이"
 GRN_focus_Operation_Mountain_Man_desc: "몬테네그로의 산악 지형은 쉽게 뚫리지 않는 난관이지만, 머지않아 돌파할 것입니다."
 GRN_focus_Operation_Adriatic_Gateway: "작전: 아드리아 관문"
 GRN_focus_Operation_Adriatic_Gateway_desc: "Securing Albania allows us to close off the Adriatic Sea. By doing this we secure a huge naval building potential and essentially secure a huge port network we could utilize for operations in teh Mediterranean Sea."
 GRN_focus_Operation_This_Is_Sparta: "작전: 디스 이즈 스파르타"
 GRN_focus_Operation_This_Is_Sparta_desc: "그리스는 중요한 문화적, 역사적 보물을 간직한 반도이자 섬나라입니다. 우리는 역사 그 자체의 중심지를 확보할 것이지만, 역사적 유적을 파괴하지 않도록 최선을 다해야 합니다."
 GRN_focus_Southern_Territorial_Authority_Commission: "남부 영토 당국 위원회"
 GRN_focus_Southern_Territorial_Authority_Commission_desc: "전담 위원회를 만들면 특정 지역이 제멋대로 구는 문제로 인해 국가적 문제가 발생하지 않도록 통합과 단결 조치에 집중할 수 있습니다."
 GRN_focus_Establishing_The_Frozen_Federation: "얼어붙은 연방의 수립"
 GRN_focus_Establishing_The_Frozen_Federation_desc: "마침내 해냈습니다. 얼어붙은 북방 국가들을 나머지 유럽 대륙 연합 국가들과 하나로 묶는 통합 연방 국가를 건설했습니다. 물론 완벽하지는 않으며 지리적으로 대륙 유럽 전체를 아우르는 것도 아닙니다. 그러나 그럼에도 이것은 역사에 남을 우리의 몫이며, 우리가 품게 된 가치와 국민에게 충실하기 위해 전력을 다할 것입니다. 연방을 위하여!"
 GRN_focus_The_Great_Ice_Shelf: "거대한 빙붕"
 GRN_focus_The_Great_Ice_Shelf_desc: "우리나라의 광대한 내륙은 거대한 얼음판에 불과합니다. 국가 발전이 진행됨에 따라 얼어붙은 물을 통제된 방식으로 활용하며 빙붕을 조금씩 깎아낼 수 있게 되었습니다. 이제 의욕을 다해 내륙으로 시선을 돌려 이를 정착시키고 제대로 개발할 준비를 할 수 있습니다. 미래는 푸르며, 우리는 얼음 아래의 땅을 발견할 것입니다."
 GRN_focus_Southern_Interior_Development_Projects: "남부 내륙 개발 사업"
 GRN_focus_Southern_Interior_Development_Projects_desc: "개발과 물류 기반 구축 대상으로 지정한 남부 내륙 지역에 착수하기 시작할 것입니다."
 GRN_focus_Southern_Settlement_Projects: "남부 정착 사업"
 GRN_focus_Southern_Settlement_Projects_desc: "물류에 도움이 되도록, 전략적 위치에 소규모 정착촌들을 차례로 세워 지역 인구를 늘릴 뿐만 아니라 지역 내에 일종의 공급망을 형성할 것입니다. 이는 마침내 거대 빙붕의 상당 부분을 길들이기 위해 추진할 향후 사업을 수월하게 만들 것입니다."
 GRN_focus_Southern_Infrastructure_Projects: "남부 인프라 사업"
 GRN_focus_Southern_Infrastructure_Projects_desc: "정착촌을 연결하고 어떤 형태로든 경제 활동을 시작하려면 일종의 인프라가 있어야 하며, 이를 통해 자연을 진정으로 길들이는 방법의 표준을 세울 것입니다."
 GRN_focus_Southern_Economic_Projects: "남부 경제 사업"
 GRN_focus_Southern_Economic_Projects_desc: "남부 내륙 지역에 사람과 인프라가 갖추어졌으므로, 이제 내부적 또는 지역적 경제 기반을 천천히 쌓아 올릴 수 있습니다. 이 토대는 시간이 흐르면서 상당한 성장의 무대를 마련할 것입니다."
 GRN_focus_Southern_Mining_Projects: "남부 채굴 사업"
 GRN_focus_Southern_Mining_Projects_desc: "With the region slowly stabilizing in economic and social affairs its now time to commence deep bore mining projects. We'll utilize the ice to be able to mine continually down so we can get real geological data as well as avoid equipment overheat due to the temperature differential."
 GRN_focus_Taming_The_Southern_Interior: "남부 내륙 길들이기"
 GRN_focus_Taming_The_Southern_Interior_desc: "With the people, infrastructure and resources available we now can say that we have truly tamed part of the Great ice Shelf. Of course our work is not done, far from it. Be we can now confidently look upon the great northern horizon and say that we're on a grand and fruitful journey."
 GRN_focus_Central_Plateau_Development_Projects: "중부 고원 개발 사업"
 GRN_focus_Central_Plateau_Development_Projects_desc: "남부 지역을 기초적으로 길들였으므로, 이제 거대한 얼음 십자군을 중부 지역으로 진출시킬 수 있습니다. 얼음과 잠재적 토지 면적이 늘어나는 만큼 더 근본적인 지표에 투자할 수 있게 될 것입니다."
 GRN_focus_Central_Settlement_Projects: "중부 정착 사업"
 GRN_focus_Central_Settlement_Projects_desc: "남부 지역에서와 마찬가지로 고원 전역에 전략적 정착촌을 세우기 시작할 것입니다."
 GRN_focus_Central_Infrastructure_Projects: "중부 인프라 사업"
 GRN_focus_Central_Infrastructure_Projects_desc: "정착촌이 세워졌으므로, 모든 것을 제대로 연결하기에 충분한 인프라망을 구축하기 시작할 수 있습니다."
 GRN_focus_Central_Economic_Projects: "중부 경제 사업"
 GRN_focus_Central_Economic_Projects_desc: "인구, 확인. 인프라, 확인. 이제 지역 경제 기반을 세우는 단계로 나아갑니다."
 GRN_focus_Central_Mining_Projects: "중부 채굴 사업"
 GRN_focus_Central_Mining_Projects_desc: "Just like with the southern region we now have finally created the networking both economically and socially to prepare resource extraction operations. The area is a lot large than the south so here's to a fruitful venture."
 GRN_focus_Taming_The_Central_Plateau: "중부 고원 길들이기"
 GRN_focus_Taming_The_Central_Plateau_desc: "사람, 정착촌, 식량, 경제, 자원이 모두 갖추어졌으므로 이제 거대 빙붕을 길들였다고 공식적으로, 그리고 자신 있게 말할 수 있습니다. 시간이 흐르면 많은 어려움이 따르겠지만, 지금과 가까운 미래에는 위대하고 번영하는 우리나라의 웅대한 극지의 영광을 만끽할 수 있을 것입니다."
 GRN_eu_adjacent_nation: "EU 인접국"
 GRN_eu_adjacent_nation_desc: "Greenland is in an interesting situation. Being the most removed from the European continent it is and will likely never be a EU member nation. However due to its status as a Danish Crown Colony it is given the same migration and travel status as any other EU member state. As such many Greenlanders use this as a way to seek better education opportunities due to the island's lack of general development."
 GRN_economic_pains: "경제적 고통"
 GRN_economic_pains_desc: "The population of Greenland has hovered around 50 thousand for decades and has been smaller still as the nation's harsh climate and logistics become the linchpin in development. In the new millennia the problem continues and the nation's leaders must look to do something to adapt and adjust the needs of the economy if it and the nation itself are to become more than just stagnate."
 GRN_idea_colonial_subsidy: "식민지 보조금"
 GRN_idea_colonial_subsidy_desc: "우리나라는 일상 운영을 덴마크의 보조금에 크게 의존할 정도로 극도로 저개발 상태입니다. 덴마크 왕실로부터의 독립을 생각하려면, 단순히 생존하기 위한 수단으로서 이 보조금이 더 이상 필요하지 않도록 하는 방법을 찾아야 합니다."
 GRN_idea_narrow_gauge_nation: "협궤 국가"
 GRN_idea_narrow_gauge_nation_desc: "협궤 선로와 장비의 유연성과 비용 효율성은 우리가 국가 전반의 발전과 연결성을 선도하는 데 도움이 될 것입니다. 게다가 기존의 표준궤 선로 및 장비에 비해 더 저렴하게 더 안전하게 제작할 수 있다는 안전상의 이점도 있습니다."
 GRN_idea_battle_for_independence: "독립을 위한 투쟁"
 GRN_idea_battle_for_independence_desc: "우리는 독립이 보장되는 지점에 도달했습니다. 우리 세대 안에 독립을 확보하기 위한 대대적인 압박 캠페인을 시작할 것입니다."
 GRN_ideas_political_freedoms: "정치적 자유"
 GRN_ideas_political_freedoms_desc: "국가가 국민이 원하는 바를 자유롭게 선택할 수 있으므로, 특정 이념 하나에 얽매이지 않습니다."
 GRN_ideas_emerging_political_influences: "부상하는 정치적 영향력"
 GRN_ideas_emerging_political_influences_desc: "이제 독립한 국가로서, 이 멋진 신세계에 발을 들이며 현대적인 정치 접근법을 보여주는 데 집중할 수 있습니다."
 GRN_ideas_non_aligned_political_influences: "비동맹 정치적 영향력"
 GRN_ideas_non_aligned_political_influences_desc: "국가가 원하는 길을 자유롭게 정할 수 있는 만큼 어떤 지정학적 진영도 진정으로 우리에게 이익이 될 것 같지 않으며, 따라서 우리는 다소 중립에 가까운 방식으로 스스로에게 집중할 것입니다."
 GRN_ideas_nationalist_political_influences: "민족주의적 정치적 영향력"
 GRN_ideas_nationalist_political_influences_desc: "우리 국가는 자유롭고 국민은 단결해 있으며, 미래를 향한 우리의 집중에서 국가가 최우선입니다. 그린란드 민족주의는 우리에게 마음의 평화를 줍니다."
 GRN_idea_alumina_research_institute: "알루미나 연구소"
 GRN_idea_alumina_research_institute_desc: "ARI의 설립은 자원 채굴, 정제 및 효율적 활용을 이해하는 데 필수적입니다. 이 전담 연구개발 단지는 외국과의 무역 협상은 물론 자급자족 정책의 보다 실질적인 수단 면에서 우리나라를 새로운 높이로 끌어올릴 것입니다."
 GRN_idea_economic_development_visas: "경제 개발 비자"
 GRN_idea_economic_development_visas_desc: "Those looking to move and settle in the nation can apply for a class 1 visas which is known as an Economic Development Visa. The EDV is essentially an onboarding process to help new citizens settle in and find employment wherein they can contribute to the development and overall growth of the nation."
 GRN_idea_sanctioned_immigration_efforts: "공인된 이민 노력"
 GRN_idea_sanctioned_immigration_efforts_desc: "전담 노력을 통해 이민으로 안정적인 인구 증가를 확보하려 시도할 것입니다."
 GRN_idea_strategic_mineral_leasing: "전략 광물 임대"
 GRN_idea_strategic_mineral_leasing_desc: "외국 기업에 대한 광물 임대 선언은 다루기에 매우 날카로운 칼입니다. 그들이 무엇을 채굴할 수 있는지, 어디서 채굴할 수 있는지, 그 광물이 어디로 가는지를 구체적으로 규제해야 합니다. 이를 통해 가능한 한 우리 정치 구조에 대한 외국의 지나친 간섭을 억제하는 동시에, 그들을 활용해 우리의 협상 카드를 키울 수 있기를 기대합니다."
 GRN_idea_contracting_a_workforce: "노동력 계약"
 GRN_idea_contracting_a_workforce_desc: "Using the customs and border security apparatus to help secure a contracted labor force allows us to expand businesses and industries at a steady and more reliable pace. Afterall they did read the contract and sign it."
 GRN_idea_agriculture_automations: "농업 자동화"
 GRN_idea_agriculture_automations_desc: "우리나라가 직면한 가장 큰 문제는 실제로 고용할 안정적인 노동력을 유지하는 것입니다. 따라서 농업 부문에 대규모로 투자하여 해당 부문의 추가 인력 수요를 크게 줄이기로 결정했습니다."
 GRN_idea_war_production_automations: "전시 생산 자동화"
 GRN_idea_war_production_automations_desc: "우리나라가 직면한 가장 큰 문제는 실제로 고용할 안정적인 노동력을 유지하는 것입니다. 따라서 전시 생산 부문에 대규모로 투자하여 해당 부문의 추가 인력 수요를 크게 줄이기로 결정했습니다. 필요하다면 노동자와 군에 투입할 잠재 인력을 모두 확보할 수 있습니다."
 GRN_idea_industrial_automations: "산업 자동화"
 GRN_idea_industrial_automations_desc: "우리나라가 직면한 가장 큰 문제는 실제로 고용할 안정적인 노동력을 유지하는 것입니다. 따라서 제조업 부문에 대규모로 투자하여 해당 부문의 추가 인력 수요를 크게 줄이기로 결정했습니다. 끊임없이 확대되는 이 부문은 규모 확장 때문에 보통 가장 많은 노동자를 필요로 하므로, 실제로 우리에게 가장 큰 이익이 될 것입니다."
 GRN_idea_corporate_automations: "기업 자동화"
 GRN_idea_corporate_automations_desc: "우리나라가 직면한 가장 큰 문제는 실제로 고용할 안정적인 노동력을 유지하는 것입니다. 따라서 사무 서비스 및 기술 부문에 대규모로 투자하여 해당 부문의 추가 인력 수요를 크게 줄이기로 결정했습니다. 인적 자원 의존도가 매우 높은 이 부문은 부문 자체의 막대한 수요로 인해 보통 가장 많은 노동자를 필요로 하므로, 실제로 우리에게 가장 큰 이익이 될 수 있습니다."
 GRN_idea_strategic_mining_automations: "전략 채굴 자동화"
 GRN_idea_strategic_mining_automations_desc: "By reworking how we mine for resources and focusing on the ability to send less folks into the mines where possible we can maximize mining efforts without the looming risk of potential loss of life. Of course its not going to be perfect, but these autonomous vehicles and certain equipment pieces should allow for way better opportunities to present themselves."
 GRN_idea_pro_military_economic_organization: "친군사 경제 조직"
 GRN_idea_pro_military_economic_organization_desc: "민간 및 징집 수요를 더 중시하는 방향으로 경제를 재편함으로써, 무기 생산 공장의 제조 역량을 개선하여 시설 운영에 필요한 전체 인력을 줄일 것입니다. 물론 이런 급진적인 개편은 기본 생산 능력을 약화시키겠지만, 운영이 안정되어 가동되면 이 시설들은 훨씬 적은 투입으로 더 많이 생산할 수 있을 것입니다."
 GRN_idea_frozen_warfare_training: "동계 전투 훈련"
 GRN_idea_frozen_warfare_training_desc: "Our training programs will focus majorily on winter and cold climate combat. Of course we'll try to do different trainings when and where possible but our home is cold and thus we must train properly to defend it."
 GRN_idea_polar_logistics_doctrine: "극지 물류 교리"
 GRN_idea_polar_logistics_doctrine_desc: "극한의 추위에서 더 잘 사용할 수 있도록 장비를 근본적으로 제작하면, 적군이 우리 섬에 상륙하기로 했을 때 우리가 원하는 방식으로 더 잘 싸울 수 있습니다."
 GRN_idea_artillery_specialist_corps: "포병 전문 군단"
 GRN_idea_artillery_specialist_corps_desc: "포병은 좋은 위치에 있을 때 받는 피해보다 더 많은 피해를 주기 위한 기본 중의 기본입니다. 이 이점을 유지하려면, 우리의 사상자를 최대한 제한하는 수준으로 포병 군단을 발전시키고 성장시켜야 합니다."
 GRN_idea_heavy_anti_air_investments: "대규모 대공 투자"
 GRN_idea_heavy_anti_air_investments_desc: "현대 전투에서 전장의 새로운 여왕은 항공기입니다. 전투기, 폭격기 등 필요한 일은 무엇이든 해냅니다. 우리 군은 규모가 매우 작으므로, 적이 원하는 대로 하지 못하게 만들 방법을 찾아야 합니다. 따라서 지상의 우리 병사들이 제대로 싸울 기회를 얻도록 대공 장비 설계와 개발에 대규모 투자를 시작할 것입니다."
 GRN_idea_army_officer_corps: "육군 장교단"
 GRN_idea_army_officer_corps_desc: "육군 장교 훈련단을 설립하고 표준화하면 우리의 전술 및 전략 지휘관들을 다듬고 향상시켜 그들 자신의 이해는 물론 그들이 이끄는 병력의 수준도 높일 수 있습니다."
 GRN_idea_small_ship_developments: "소형 함선 개발"
 GRN_idea_small_ship_developments_desc: "초기 개발이 결실을 맺고 있습니다. 초기 초계함 설계를 통해 우리가 개선하고 다듬을 수는 있지만, 이 전략적 성과는 함선을 제대로 운용할 승조원을 확보할 수 있어야만 의미가 있다는 점을 알게 되었습니다."
 GRN_idea_expanding_small_vessel_designs: "소형 선박 설계 확장"
 GRN_idea_expanding_small_vessel_designs_desc: "Ensuring our corvette department is complimented by similar innovations, we'll focus on frigate and destroyer types to fully flush out our small vessel fleets."
 GRN_idea_attack_submarine_programs: "공격 잠수함 프로그램"
 GRN_idea_attack_submarine_programs_desc: "ASP는 한계를 입증하고 신기술의 가장 효과적인 사용 방법을 찾기 위해 고안된 일련의 개발 및 시험 프로그램입니다."
 GRN_idea_missile_submarine_programs: "미사일 잠수함 프로그램"
 GRN_idea_missile_submarine_programs_desc: "MSP는 해전에서 미사일 기술을 사용하는 가장 효과적인 방법을 입증하기 위해 고안된 일련의 개발 및 시험 프로그램입니다."
 GRN_idea_navy_officer_corps: "해군 장교단"
 GRN_idea_navy_officer_corps_desc: "해군 장교 훈련단을 설립하면 우리 해군 부문의 전투와 지휘에서의 우수성 기준을 높일 수 있습니다."
 GRN_idea_aviation_innovations: "항공 혁신"
 GRN_idea_aviation_innovations_desc: "TARI 시설이 혁신 성과를 일반 설계 및 생산 모델에 적용해 시험과 개선을 시작하면서 초기 성과가 결실을 맺기 시작하고 있습니다. 이는 우리가 제공권 행동 계획을 계속 개혁하고 완성하는 데 유용할 수 있습니다."
 GRN_idea_air_dominance_program: "공중 우세 프로그램"
 GRN_idea_air_dominance_program_desc: "ADP는 전투기 계열 항공기에 특화되어, 적의 괴롭힘으로부터 우리 하늘을 지킬 수 있도록 전반적인 전투 능력을 향상시키는 방법을 연구합니다."
 GRN_idea_bombing_innovations: "폭격 혁신"
 GRN_idea_bombing_innovations_desc: "Innovations in air to ground as well as air to ship combat abilities has allowed us to specialize our general bombing efforts to be more effective then ever before. We must continue to capitalize these efforts if we are to prevent any real landfall of enemy forces onto our island."
 GRN_idea_bomber_design_department: "폭격기 설계 부서"
 GRN_idea_bomber_design_department_desc: "폭격 항공 함대의 효과를 개선하고 키우는 데 전념하는 BDD는 우리나라 항공 혁신의 정점입니다."
 GRN_idea_air_officer_corps: "공군 장교단"
 GRN_idea_air_officer_corps_desc: "공군 장교단을 육성하면 전반적인 효율을 높이고 공중전 작전을 위한 지휘와 응용 전술을 혁신할 수 있습니다."
 GRN_idea_general_staff_corps: "총참모단"
 GRN_idea_general_staff_corps_desc: "With our military finally developed to a point where a unified command staff is need between the branches, our nation has made and will continue to make great strides in our national defense."
 GRN_idea_agricultural_futurist_policies: "농업 미래주의 정책"
 GRN_idea_agricultural_futurist_policies_desc: "더 넓은 농업 부문 내에서 연구 노력과 경제적 투자를 우선시하면 혁신의 선두를 유지하고, 국내 수요 이상에 집중할 때 필요한 수요 규모에 제대로 대응할 수 있습니다."
 GRN_idea_polar_infrastructure_developments: "극지 인프라 개발"
 GRN_idea_polar_infrastructure_developments_desc: "Our continual investments into building our infrastructure as well as investing in ways to making said investments more longer lasting has allowed us to innovate in areas many would not even think about."
 GRN_idea_economic_modernity_policies: "경제 현대화 정책"
 GRN_idea_economic_modernity_policies_desc: "우리나라는 발전의 선두에 서 있습니다. 국가와 국민을 위한 번영을 향한 이 위대한 행진을 틀림없이 계속해 나갈 것입니다."
 GRN_ideas_mining_needs: "채굴 필요"
 GRN_ideas_mining_needs_desc: "채굴 부문을 그 이상의 무엇이 아닌 국가적 필요에 맞추어 운영하기로 결정했습니다. 이를 통해 수출 가격을 전략적으로 협상하는 동시에 해당 부문이 인력 면에서 요구하는 수요를 줄일 수 있었습니다."
 GRN_ideas_mining_greeds: "채굴 탐욕"
 GRN_ideas_mining_greeds_desc: "We've decided on focusing the mining sector around national and internation needs rather than simply what's needed in the moment. As a result we have been able to greatly flaunt our resources and negotiate some real deals in terms of our export efforts. Though a small problem of increased worker demands seems to have permeated the economic sector, the overall benefit seems to justify the means to an end."
 GRN_ideas_intense_foreign_affairs_budgeting: "집중적 외교 예산 편성"
 GRN_ideas_intense_foreign_affairs_budgeting_desc: "해외에서 외교 협상에 진정한 추진력을 얻으려면 이러한 노력에 진지하게 집중해야 합니다. 현재의 힘으로는 경제에 비해 인구 문제로 인한 내부 안정도가 부족합니다. 따라서 패를 잘못 다루면 우리는 사실상 속이 텅 빈 단단한 껍데기에 불과합니다."
 GRN_ideas_political_shenanigans: "정치적 책동"
 GRN_ideas_political_shenanigans_desc: "Some recent light has been shown on disgruntled efforts within our nation. They don't seem to be more than an annoyance given the healthy state we are in, but we'll need to figure out who's doing this crap if we want to return to a more calmer state."
 GRN_ideas_domesticating_foreign_policy: "외교 정책의 국내화"
 GRN_ideas_domesticating_foreign_policy_desc: "대외적 야망을 확보하려면 우리의 대외 영향력을 활용할 수단을 확보하는 것은 물론 국내 전선도 확보해야 합니다."
 GRN_ideas_the_frozen_federation: "얼어붙은 연방"
 GRN_ideas_the_frozen_federation_desc: "자, 우리는 최선을 다해 대륙을 통합했습니다. 문제는 모든 문제까지 하나의 깃발 아래 통합했다는 것입니다. 세상의 끝은 아니지만, 가까운 미래에는 분명 험난한 길이 될 것입니다."
 GRN_domestic_and_civil_affairs_administration: "국내·민사 행정국"
 GRN_domestic_and_civil_affairs_administration_desc: "그린란드는 여러 문제를 안고 있으며 그 핵심은 적은 인구 수에서 비롯됩니다. 국내·민사 행정국은 그린란드 국민을 보살피고, 섬 주민에게 가능한 최선이자 가장 공정한 결과를 보장하기 위해 시간이 지남에 따라 정책을 개혁하거나 추가하거나 폐지하는 임무를 맡고 있습니다."
 GRN_federal_budgets: "국가 지출"
 GRN_federal_budgets_desc: "이 섬은 인구가 많지 않지만 유지하고 제대로 개발하려면 여전히 상당한 지출이 필요합니다. 안정적인 재정적 미래를 갖추려면 더 나은 개발 방법이나 전반적인 예산 편성을 살펴보아야 합니다."
 GRN_revenue_collection_administration: "세수 징수 행정국"
 GRN_revenue_collection_administration_desc: "RCA는 중앙정부의 세금 징수 및 집행 기관으로 지정되었습니다. 정부 정책 입안자들과 협력하여 세금이 공정하고 효율적으로 부과되고 올바르게 집행되도록 하여 균형 잡힌 국가 예산을 보장해야 합니다."
 GRN_economic_development_board: "경제 개발 위원회"
 GRN_economic_development_board_desc: "The EDB is the backbone of economic policy making and general national growth and development. This part of the government sets out to take policies and programs and try to build up the nation's economy as well as uplift the citizens quality of life where all possible. While the logistics is the biggest hurdle in this regard, the other is simply manpower and capital as well as shear willpower to just do it."
 GRN_national_armed_services_of_greenland: "그린란드 국가 군대"
 GRN_national_armed_services_of_greenland_desc: "The Armed Services of Greenland is an interesting institution as the island's population is so small that there isn't a whole lot it can do. However despite this the island does have some kind of military force and does theoretically have the ability to expand it. Now its just up to the future of events to tell just how this expansion may transpire."
 GRN_idea_the_great_ice_shelf: "거대한 빙붕"
 GRN_idea_the_great_ice_shelf_desc: "The Greenland Ice Shelf is one of the worlds largest pieces of ice to cover a significant amount of landmass. The ice shelf can be up to two miles deep and is the biggest obstruction to any earnest development outside of the coastal areas."

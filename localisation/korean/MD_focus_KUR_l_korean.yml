l_korean:
 Kurdistan.2.t: "이라크와의 통합을 원하는 쿠르디스탄"
 Kurdistan.2.d: "Since the threat of ISIS is now gone, the Kurdistan Regional Government has expressed willingness to federal government of Iraq"
 Kurdistan.2.a: "다시 돌아온 것을 환영한다!"
 Kurdistan.3.t: "국민투표 결과"
 Kurdistan.3.d: "쿠르드 자치 지역과 ISIS와 싸우며 우리가 장악한 지역에서 독립 국민투표가 실시되었습니다. 국민투표는 투표율 72%에 찬성 93%로 대성공을 거두었습니다. 이 투표로 우리 정부가 더 많은 자치, 나아가 완전한 독립을 협상할 정당성이 크게 높아졌습니다."
 Kurdistan.3.a: "완전한 독립을 추진한다."
 Kurdistan.3.b: "이를 자치 확대를 위한 협상 카드로 활용한다."
 Kurdistan.4.t: "쿠르디스탄의 독립 요구"
 Kurdistan.4.d: "Due to the success of the Kurdish Independence Referendum, the Kurdish government is trying to use the referendum as leverage to declare full independence. It seems that they aren't happy with just limited autonomy, and they still hold Kirku, which is rightfully part of Iraq."
 Kurdistan.4.a: "절대 안 된다!"
 Kurdistan.4.b: "좋다, 키르쿠크를 돌려준다면."
 Kurdistan.4.c: "그들의 요구를 받아들인다."
 Kurdistan.5.t: "쿠르디스탄의 자치 확대 요구"
 Kurdistan.5.d: "쿠르드 독립 국민투표가 성공을 거둔 덕분에, 쿠르드 정부는 이 국민투표를 지렛대 삼아 연방정부의 통제로부터 더 많은 자치를 요구하려 하고 있습니다. 그들은 제한적인 자치에 만족하지 못하는 듯하며, 정당하게 이라크의 일부인 키르쿠크도 여전히 점유하고 있습니다."
 Kurdistan.5.a: "절대 안 된다!"
 Kurdistan.5.b: "좋다, 키르쿠크를 돌려준다면."
 Kurdistan.5.c: "그들의 요구를 받아들인다."
 Kurdistan.6.t: "요구를 수락한 이라크"
 Kurdistan.6.d: "이라크 연방정부가 우리의 요구를 수락했습니다!"
 Kurdistan.6.a: "만세!"
 Kurdistan.7.t: "이라크의 키르쿠크 요구"
 Kurdistan.7.d: "In a response to our demands, the Iraqi Government has stated that they will agree to our demands, but in exchange they want us to give them back control the city of Kirkuk, which they see as rightfully theirs."
 Kurdistan.7.a: "합당한 대가다."
 Kurdistan.7.b: "키르쿠크는 쿠르드의 땅이다!"
 Kurdistan.8.t: "쿠르디스탄의 거부"
 Kurdistan.8.d: "쿠르디스탄이 키르쿠크를 돌려주기를 거부했습니다. 그들이 주권에 대한 이상을 재고하기를 바랄 뿐입니다."
 Kurdistan.8.a: "젠장"
 Kurdistan.9.t: "쿠르디스탄의 미래"
 Kurdistan.9.d: "Now that the negotiations with Iraq have broken down, we need to determine a path for our nation. We could start pursuing full independence, which will most likely upset Iraq. On the other hand, we bury our ideas of independence and return to be governed by the Iraqi Federal Government."
 Kurdistan.9.a: "쿠르디스탄은 자유로운 국가다!"
 Kurdistan.9.b: "용서를 구한다."
 Kurdistan.10.t: "쿠르디스탄의 독립 선언"
 Kurdistan.10.d: "The Kurdish government announced today that Kurdistan is an independent country, and not part of Iraq. This is a serious blowback to the Iraqi nation, and the Kurdish forces still control the vital city of Kirkuk. Some politicans and generals are arguing that a show of force is necessary. We need to order our troops to occupy Kirkuk, and show the Kurds our willingness to defend Iraqi lands"
 Kurdistan.10.a: "키르쿠크 공격을 준비한다!"
 Kurdistan.10.b: "전쟁을 시작하고 싶지는 않다."
 Kurdistan.11.t: "이라크의 키르쿠크 진격!"
 Kurdistan.11.d: "독립을 선언한 이후, 이라크군이 키르쿠크 공격을 준비하고 있다는 보고를 받았습니다. 장비가 잘 갖춰지고 전투 경험이 풍부한 이라크군에 맞서 방어하기는 어려울 것이며, 전투에서 패하면 우리의 체면이 손상될 것입니다. 반면 승리한다면 이라크가 물러설 수도 있습니다. 유혈 사태를 피하기 위해 도시에서 철수할 수도 있습니다."
 Kurdistan.11.a: "맞서 싸운다!"
 Kurdistan.11.b: "후퇴한다!"
 Kurdistan.13.t: "쿠르디스탄의 운명"
 Kurdistan.13.d: "키르쿠크를 장악한 지금, 쿠르드에게는 우리에게 복종하거나 더 가혹한 결과를 맞이하는 길밖에 없습니다."
 Kurdistan.13.a: "복종을 요구한다."
 Kurdistan.14.t: "이라크의 복종 요구"
 Kurdistan.14.d: "키르쿠크에서의 패배와 상실 이후, 이라크 정부는 더욱 기세가 올랐습니다. 이제 그들은 우리에게 장래 계획을 포기하고 다시 그들의 통치 아래로 복종할 것을 요구하고 있습니다."
 Kurdistan.14.a: "복종한다."
 Kurdistan.14.b: "저항한다."
 Kurdistan.15.t: "쿠르디스탄의 복종"
 Kurdistan.15.d: "쿠르디스탄이 우리에게 복귀하기로 동의했습니다!"
 Kurdistan.15.a: "훌륭하다"
 Kurdistan.16.t: "쿠르디스탄의 저항"
 Kurdistan.16.d: "쿠르디스탄이 우리의 복종 요구를 거부했습니다."
 Kurdistan.16.a: "그렇다면 힘든 방식으로 해결하겠다."
 Kurdistan.17.t: "키르쿠크에서의 실패"
 Kurdistan.17.d: "키르쿠크 전투에서의 패배는 치욕이었습니다. 쿠르드는 여전히 도시를 장악하고 있고 우리는 굴욕을 당했습니다. 그래도 통합을 계속 추진해야 합니까?"
 Kurdistan.17.a: "다시 시도할 것이다. 이번에는 더 큰 규모로."
 Kurdistan.17.b: "쿠르드를 내버려 둔다."
 Kurdistan.18.t: "KDP의 재통합 회담 요구"
 Kurdistan.18.d: "[KUR.GetLeader]이(가) 이끄는 KDP 정부가 우리에게 협상 테이블에 나와 쿠르드 통합 정부에 참여하라고 요구했습니다. 그들은 양측 정부 간의 적대 행위가 끝난 뒤 몇 년 전에 이미 했어야 할 일이라고 주장하지만, 이제는 우리를 새 정부에 참여시키려는 의지가 그 어느 때보다 끈질겨 보입니다. 참여할지 말지는 우리에게 달려 있습니다. 그러나 참여하지 않는다면 KDP와의 갈등이 재개될 위험이 있습니다."
 Kurdistan.18.a: "쿠르디스탄을 위해 통합하겠다"
 Kurdistan.18.b: "결코 안 된다"
 Kurdistan.19.t: "PUK의 재통합 회담 거부"
 Kurdistan.19.d: "It appears that the PUK government has refused to join our United Government, and as a result, they leave us no choice but to unify the Kurdish people under one banner."
 Kurdistan.19.a: "이런 지경에 이르렀다니 안타깝다"
 Kurdistan.20.t: "PUK의 재통합 회담 동의"
 Kurdistan.20.d: "PUK가 우리의 통합 정부에 참여하기로 동의했으며, 그들의 영토와 병력을 새 정부에 통합하기 위한 협상이 진행 중입니다."
 Kurdistan.20.a: "훌륭하다"
 KurdistanNews.1.t: "쿠르디스탄의 이라크 복귀"
 KurdistanNews.1.d: "ISIS의 전성기에 쿠르디스탄은 서서히 이라크에서 멀어지며 더욱 독립적으로 변해 갔습니다. 이제 ISIS가 패배하자 쿠르디스탄 지역 정부는 완전히 방향을 틀어 이라크 연방정부와 다시 협력하겠다는 뜻을 밝혔습니다. 많은 이들은 쿠르드가 독립을 노릴 것이라고 추측했으나, 이웃 나라들의 보복을 우려한 듯 다른 결정을 내린 것으로 보입니다."
 KurdistanNews.1.a: "흥미롭군"
 KurdistanNews.2.t: "쿠르드 독립 국민투표"
 KurdistanNews.2.d: "쿠르드 지역 정부는 현재 자신들이 통제하는 지역에서 독립 국민투표를 실시하겠다고 발표했습니다. 이 국민투표가 대도시 키르쿠크를 비롯해 공식적으로는 쿠르드 자치 지역이 아니라 이라크 연방 국가에 속한 지역에서 치러진다는 점에서 이번 조치는 논란이 되고 있습니다.\n\n많은 이들은 이를 쿠르드의 영토 강탈에 불과하다고 보는 반면, 다른 이들은 쿠르드가 사실상 ISIS로부터 이라크를 구했으므로 독립할 권리를 얻었다고 주장합니다. 쿠르드 지역 정부는 결과에 구속력이 없다고 밝혔지만, 많은 이들은 이것이 완전한 독립과 이라크의 새로운 분쟁으로 이어질 것을 우려하고 있습니다."
 KurdistanNews.2.a: "그들에게는 이럴 권리가 없다!"
 KurdistanNews.2.b: "Let's see how this play out."
 KurdistanNews.3.t: "쿠르드 독립 국민투표 가결"
 KurdistanNews.3.d: "쿠르드 독립 국민투표는 쿠르드 정부의 압도적인 성공으로 끝났습니다. 투표율 72%에 찬성 93%를 기록하며 각지의 쿠르드인들이 환호하고 있습니다. 국민투표의 성공에 힘입어 쿠르드 정부는 이라크 연방정부로부터의 완전한 독립을 선언하기로 결정했습니다. 놀랍게도 이라크 정부는 이 요구를 받아들였습니다."
 KurdistanNews.3.a: "쿠르드를 저지해야 한다."
 KurdistanNews.3.b: "흥미롭군"
 KurdistanNews.4.t: "쿠르드 독립 국민투표 가결"
 KurdistanNews.4.d: "쿠르드 독립 국민투표는 쿠르드 정부의 압도적인 성공으로 끝났습니다. 투표율 72%에 찬성 93%를 기록하며 각지의 쿠르드인들이 환호하고 있습니다. 국민투표의 성공에 힘입어 쿠르드 정부는 이라크 연방정부에 더 많은 자치를 요구하기로 결정했습니다. 놀랍게도 이라크 정부는 이 요구를 받아들였습니다."
 KurdistanNews.4.a: "쿠르드를 저지해야 한다."
 KurdistanNews.4.b: "흥미롭군"
 KurdistanNews.5.t: "이라크의 키르쿠크 점령"
 KurdistanNews.5.d: "이라크와 쿠르디스탄 간의 협상이 결렬되자, 이라크군은 앞서 쿠르드가 ISIS로부터 탈환한 도시 키르쿠크를 점령하기 위해 움직였습니다. 이라크군이 키르쿠크에 접근하자 페슈메르가의 대부분은 싸우지 않고 도시에서 후퇴했습니다. 일부 독립적인 쿠르드 병력은 남아 도시 방어를 시도했으나 이라크군에 순식간에 제압되었습니다. 단 이틀 만에 이라크군은 도시의 완전한 통제권을 되찾았으며, 대부분은 교전 없이 이루어졌습니다."
 KurdistanNews.5.a: "흥미롭군"
 KurdistanNews.6.t: "이라크의 키르쿠크 점령"
 KurdistanNews.6.d: "As the negotiations between Iraq and Kurdistan broke down, Iraqi forces moved to capture the city of Kirkuk, which the Kurds had captured from ISIS earlier. As the Iraqi forces approached the city, Kurdish forces took up defensive positions, with main defenses being at the K1 military base and the Kirkuk-Takrit Road.\n\nDespite strong defence, the Iraqi 9th Armoured Division managed capture the military base and advance towards the Northern oil field of Baba Gurgur, while the Popular Mobilisation Forces tied down Kurdish troops in the city itself. Fearing encirclement, the Kurdish forces started retreating from the city, some under orders and some on their own. After a few days of fighting, Iraq was fully in control of the city."
 KurdistanNews.6.a: "흥미롭군"
 KurdistanNews.7.t: "쿠르디스탄의 키르쿠크 방어"
 KurdistanNews.7.d: "As the negotiations between Iraq and Kurdistan broke down, Iraqi forces moved to capture the city of Kirkuk, which the Kurds had captured from ISIS earlier. As the Iraqi forces approached the city, Kurdish forces took up defensive positions, with main defenses being at the K1 military base and the Kirkuk-Takrit Road.\n\nIraqi 9th Armoured Division split their forces in two, as they attacked both the military base and the city itself through its Southern suburbs. At the same time, the Popular Mobilisation Forces attacked in the centre towards Kirkuk Airfield. As the 9th Armoured Division got bogged down in the suburbs, the Kurdish forces managed to conduct a flanking attack against the PMF forces, forcing them to retreat. With the centre destroyed, the separated elements of the 9th Armoured Division were soon forced to retreat as well. The Battle of Kirkuk proved to be disastrous for the Iraqi forces, while the morale of the Kurds was greatly boosted."
 KurdistanNews.7.a: "흥미롭군"
 KurdistanNews.8.t: "쿠르디스탄의 이라크 복종"
 KurdistanNews.8.d: "After their victory in Kirkuk, Iraq has increased pressure towards Kurdistan. In a recent move, Iraq demanded that Kurdistan abandon all ideas of independence or increased autonomy. Having left without a choice, the Kurdish government agreed to the demands to prevent any more bloodshed."
 KurdistanNews.8.a: "흥미롭군"
 KurdistanNews.9.t: "쿠르디스탄의 이라크 저항"
 KurdistanNews.9.d: "After their victory in Kirkuk, Iraq has increased pressure towards Kurdistan. In a recent move, Iraq demanded that Kurdistan abandon all ideas of independence or increased autonomy. The Kurdish government responded that Iraq has already shown its hostility against the Kurdish people, and at such they have no reason to agree to the demands of bullies. This might spark a new civil war in Iraq"
 KurdistanNews.9.a: "흥미롭군"
 KurdistanNews.10.t: "이라크의 쿠르디스탄 공격"
 KurdistanNews.10.d: "The defeat at Kirkuk was a massive humiliation to Iraq. As a response to this, it seems they are preparing for a full-scale invasion of Kurdistan in order to bring back the breakaway state back under Iraqi control."
 KurdistanNews.10.a: "흥미롭군"
 KurdistanNews.11.t: "고립 속으로 물러나는 이라크"
 KurdistanNews.11.d: "키르쿠크에서의 패배는 이라크에게 엄청난 굴욕이었습니다. 이 패배로 이라크는 쿠르드에 대한 모든 적대 의지를 완전히 잃은 것으로 보입니다. 쿠르드는 피를 흘려 자신들의 요구를 쟁취했습니다."
 KurdistanNews.11.a: "흥미롭군"
 KUR_the_great_divide: "쿠르드의 대분열"
 KUR_the_great_divide_desc: "쿠르드 땅 안에 균열이 있습니다. 부족, 정당, 조직들이 영토를 갈라 차지하며 쿠르드 민족을 더욱 분열시키고, 쿠르드 통합이라는 궁극적 목표를 해치고 있습니다."
 KUR_propose_reunification: "[PUK.GetFlag] PUK에 재통합을 제안한다"
 KUR_propose_reunification_desc: "With the creation of the Unity Government in 1993, the PUK should have had already joined their Kurdish brothers. Now that the independence of all of Kurdistan is threatened, it is imperative that we push them to the negotiating table to preserve the freedom of our peoples."
 PUK_stomp_out_the_iek: "[IEK.GetFlag] [IEK.GetName]을(를) 짓밟는다"
 PUK_stomp_out_the_iek_desc: "The IEK have long been a thorn on the side of our government. Their terroristic activities have hampered our legitimacy, and have hurt our ability to efficiently govern the territories to the East. The time has come for us to demand their submission once and for all."
 KUR_declare_kurdistan: "페슈메르가 통합을 선언한다"
 KUR_declare_kurdistan_desc: "모든 쿠르드 땅이 우리의 확고한 통제 아래 놓이면, 우리는 마침내 페슈메르가 지역의 진정한 쿠르드 국가임을 정당하게 주장할 수 있을 것입니다."
 KUR_cores_on_all_TT: "[IRQ.GetFlag] 이라크 쿠르디스탄 지역의 모든 주에 핵심을 부여합니다"
 KUR_barzani_tribe: "바르자니 지도부"
 KUR_barzani_tribe_desc: "Coming from a Sufi, Yezidi background, and originating from Barzan in Northern Kurdistan, the Barzani tribe has for the longest time, held a firm grip over the Kurdish region north of Iraq. This influence has allowed them to play a major role in Iraqi and Kurdish politics over time, often times swaying it one way or another.\n§W--------------§!\nThis national spirit will be §RRemoved§! if the £KUR_conservatism_small KDP is not in power."
 PUK_battle_hardened: "백전노장"
 PUK_battle_hardened_desc: "PUK는 이란-이라크 전쟁에서 결정적인 역할을 하여 사담의 군대에 막대한 피해를 입혔습니다. 이 경험은 우리 지휘부와 병사들이 전장에서 귀중한 경험을 얻게 해 주었습니다.\n§W--------------§!\n£KUR_Autocracy_small PUK가 집권하지 못하면 이 국가 정신은 §R제거§!됩니다."
 KurdistanNews.12.t: "페슈메르가 통합: 단일 지휘 아래 통합되는 쿠르드군"
 KurdistanNews.12.d: "바르자니 계열의 KDP와 탈라바니가 이끄는 PUK 사이의 수십 년에 걸친 분열 끝에, 이라크 북부의 쿠르드 정치 지형은 대변혁을 맞았습니다. 쿠르드 지도부는 획기적인 조치로 모든 페슈메르가 부대를 단일 지휘 체계 아래 완전히 통합한다고 선언하여, 1994년 쿠르드 내전 이래 쿠르드 군사 협력을 괴롭혀 온 내부 경쟁에 종지부를 찍었습니다.\n\nKDP와 PUK 소속 부대는 물론, 야지디와 기독교 소수민족 보호군 출신 페슈메르가까지 이제 하나의 통합 부처 아래에서 활동하게 됩니다. 이 통합으로 에르빌과 술라이마니야의 보안군이 사실상 하나로 합쳐졌으며, 근현대사상 처음으로 도후크, 키르쿠크, 할라브자 지역이 단일한 쿠르드 군사 위계 아래 통합되었습니다.\n\n이번 통합은 쿠르드군이 ISIS와의 전투에서 결정적인 역할을 한 뒤에 이루어졌으며, 당시 응집력 있는 지휘 체계의 부재가 치명적인 약점으로 거듭 지적되었습니다. 이 조치는 인접국 수도, 특히 앙카라와 테헤란의 우려를 불러일으켰으며, 이들은 통합된 쿠르드 군사 능력을 지역 내 자국 안보 이익에 대한 직접적인 도전으로 간주합니다."
 KurdistanNews.12.a: "국경에 통합된 쿠르드군이 있다는 것은 우리 국가 안보에 대한 용납할 수 없는 위협이다."
 KurdistanNews.12.b: "쿠르드 민족 자결을 향한 역사적인 진전이지만, 지역 내 긴장이 뒤따를 것은 분명하다."
 KUR_independence_category: "독립"
 KUR_hold_independence_referendum: "독립 국민투표를 실시한다"
 KUR_hold_independence_referendum_desc: "페슈메르가가 단일 지휘 아래 통합된 지금, 쿠르드 민족의 의지를 시험할 때가 되었습니다. 우리는 자치 지역과 키르쿠크를 비롯한 우리가 통제하는 분쟁 지역 전역에서 구속력 없는 독립 국민투표를 실시할 것입니다."

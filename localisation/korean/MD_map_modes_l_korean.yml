l_korean:
 MAPMODE_EU_MAP_MODE_NAME: "유럽 연합 (EU)"
 MAPMODE_EU_MAP_MODE: "유럽 연합 (EU)"
 MAPMODE_EU_MAP_MODE_DESCRIPTION: "유럽연합(EU)의 회원국, 잠재적 회원국 및 현재 관직 보유자를 표시합니다."
 EU_map_mode_tooltip: "European Union"
 EU_map_mode_tooltip_delayed: "Shows the current membership and leadership of the European Union.\n\n§HColor Legend:§!\n§nBlue§! = EU Member State\n§YGold§! = Potential Member State\n\n§HOffice Holders:§!\n§RRed§! = President of the European Commission, European Council, or European Parliament\n§9Brown§! = Secretary General of EuroNavy\n§GGreen§! = Secretary General of EuroArmy\n§CCyan§! = High Representative for Foreign Affairs and Security Policy\n§0Purple§! = European Minister of Economy and Finance\n§YYellow§! = President of the European Central Bank\n§PDeep Pink§! = Frontex Director\n§OOrange§! = EU Ambassador to the United Nations\n§pPink§! = President of the European Federation\n\nUpdated weekly."
 MAPMODE_INFLUENCE_MAP_MODE_NAME: "영향력"
 MAPMODE_INFLUENCE_MAP_MODE: "영향력"
 MAPMODE_INFLUENCE_MAP_MODE_DESCRIPTION: "다른 국가에 대한 우리의 영향력 순위를 표시합니다. 영향력은 외교적 지렛대를 결정하며 시간이 지남에 따라 정치적 성향에 영향을 줍니다."
 influence_map_mode_tooltip: "영향"
 influence_map_mode_tooltip_delayed: "Shows countries where you hold influence, your ranking among influencers, and nations set for auto-influence.\n\nInfluence determines your diplomatic leverage over a nation. Higher ranking means greater sway over their political alignment and foreign policy.\n\n§HColor Legend:§!\n§GGreen§! = Your nation\n§CCyan§! = 1st Influencer (dominant)\n§lLight Blue§! = 2nd or 3rd Influencer\n§nNavy Blue§! = 4th to 7th Influencer\n§9Orange§! = Auto-Influenced Nation (monthly)\n§RRed§! = Spread Influence Cooldown (recently targeted)\n§HDark Gray§! = No influence\n\nUpdated weekly."
 MAPMODE_GCC_MAP_MODE_NAME: "걸프협력회의 (GCC)"
 MAPMODE_GCC_MAP_MODE: "걸프협력회의 (GCC)"
 MAPMODE_GCC_MAP_MODE_DESCRIPTION: "걸프 협력 회의(GCC)의 회원국과 잠재적 회원국을 표시합니다."
 GCC_map_mode_tooltip: "Gulf Cooperation Council"
 GCC_map_mode_tooltip_delayed: "Shows the current membership of the Gulf Cooperation Council (GCC).\n\n§HColor Legend:§!\n§CTeal§! = GCC Member State\n§GYellow-Green§! = Potential Member State\n\nUpdated weekly."
 MAPMODE_SCO_MAP_MODE_NAME: "상하이협력기구 (SCO)"
 MAPMODE_SCO_MAP_MODE: "상하이협력기구 (SCO)"
 MAPMODE_SCO_MAP_MODE_DESCRIPTION: "상하이 협력 기구(SCO)의 회원국, 참관국 그리고 잠재적 회원국을 표시합니다."
 SCO_map_mode_tooltip: "Shanghai Cooperation Organisation"
 SCO_map_mode_tooltip_delayed: "Shows the current membership of the Shanghai Cooperation Organisation (SCO).\n\n§HColor Legend:§!\n§9Orange§! = SCO Member State\n§0Purple§! = Observer State\n§CCyan§! = Dialogue Partner\n§YYellow§! = Potential Member State\n\nUpdated weekly."
 MAPMODE_GDP_C_MAP_MODE_NAME: "1인당 국민총생산(GDP/C)"
 MAPMODE_GDP_C_MAP_MODE: "1인당 국민총생산(GDP/C)"
 MAPMODE_GDP_C_MAP_MODE_DESCRIPTION: "이 지도 모드는 국가의 1인당 국민총생산(GDP/C)을 표시하며, 1인당 평균 경제 생산량을 나타냅니다."
 gdp_c_map_mode_tooltip: "[FROM.CONTROLLER.GetNameWithFlag]의 1인당 국민총생산(GDP/C)"
 gdp_c_map_mode_tooltip_delayed: "GDP per capita of §Y[FROM.CONTROLLER.GetNameWithFlag]§! is: §Y$[?FROM.CONTROLLER:gdp_per_capita|Y]K§!.\n\nGDP per capita represents the economic output per person. Higher values indicate a wealthier, more productive economy.\n\n§HColor Legend:§!\n§9Bright Gold§! = Below 8K (Low income)\n§YYellow§! = 8K - 18K (Lower-middle income)\n§7Light Green§! = 18K - 32K (Middle income)\n§GGreen§! = 32K - 60K (Upper-middle income)\n§CCyan§! = 60K - 110K (High income)\n§nDeep Blue§! = Above 110K (Extremely wealthy)\n\nUpdated with the weekly economic tick."
 MAPMODE_ENERGY_CONSUMPTION_MAP_MODE_NAME: "Energy Unfulfillment"
 MAPMODE_ENERGY_CONSUMPTION_MAP_MODE: "Energy Unfulfillment"
 MAPMODE_ENERGY_CONSUMPTION_MAP_MODE_DESCRIPTION: "이 지도 모드는 국가별 현재 충족되지 않은 에너지 요구의 비욜을 나타냅니다."
 energy_consumption_map_mode_tooltip: "Energy Consumption Unfulfillment in [FROM.CONTROLLER.GetNameWithFlag]"
 energy_consumption_map_mode_tooltip_delayed: "Energy Consumption Unfulfillment in §Y[FROM.CONTROLLER.GetNameWithFlag]§! is: §Y[?FROM.CONTROLLER:unfulfilled_energy_demand_var|%+]§!\n\nThis shows the percentage of energy demand that is not being met. A negative value means demand exceeds supply (energy deficit).\n\n§HColor Legend:§!\n§nDeep Blue§! = Below -30% (Severe deficit)\n§lBright Blue§! = -30% to -18% (Moderate deficit)\n§CCyan§! = -18% to -12% (Mild deficit)\n§GGreen§! = -12% to -4% (Nearly met)\n§YYellow§! = -4% to -1% (Almost met)\n§9Bright Gold§! = Above -1% (Fully met)\n\n§nDarker is worse.§! Invest in energy production to improve.\nUpdated with the weekly economic tick."
 MAPMODE_PRODUCTIVITY_MAP_MODE_NAME: "생산성"
 MAPMODE_PRODUCTIVITY_MAP_MODE: "생산성"
 MAPMODE_PRODUCTIVITY_MAP_MODE_DESCRIPTION: "이 지도 모드는 각 주의 현재 생산성을 표시하며, 이는 노동자 1인당 경제 생산 효율을 나타냅니다."
 productivity_map_mode_tooltip: "[FROM.GetName]의 생산성"
 productivity_map_mode_tooltip_delayed: "Productivity in §Y[FROM.GetName]§! is: §Y[?FROM.productivity_state_var|Y]§!\n\nProductivity measures the economic output efficiency of a state. Higher values mean more economic output per worker.\n\n§HColor Legend:§!\n§nDeep Purple§! = Below 200 (Very low)\n§nDeep Blue§! = 200 - 500 (Low)\n§lBright Blue§! = 500 - 800 (Below average)\n§CCyan§! = 800 - 1200 (Average)\n§GGreen§! = 1200 - 1900 (Above average)\n§YYellow§! = 1900 - 3800 (High)\n§9Bright Gold§! = 3800 - 5000 (Very high)\n§9Deep Orange§! = Above 5000 (Outstanding)\n\nUpdated with the weekly economic tick."
 MAPMODE_RENEWABLE_ENERGY_HOTSPOT_MAP_MODE_NAME: "재생 에너지 유망지"
 MAPMODE_RENEWABLE_ENERGY_HOTSPOT_MAP_MODE: "재생 에너지 유망지"
 MAPMODE_RENEWABLE_ENERGY_HOTSPOT_MAP_MODE_DESCRIPTION: "이 지도 모드는 바람, 태양광 및 기타 지리적 요인에 따른 각 주의 천연 재생 에너지 잠재력을 표시합니다."
 renewable_energy_hotspot_map_mode_tooltip: "[FROM.GetName]의 재생 에너지 설비 보너스"
 renewable_energy_hotspot_map_mode_tooltip_delayed: "Renewable Energy Capacity Bonus in §Y[FROM.GetName]§! is: §Y[?FROM.state_renewable_capacity_factor_modifier_var|Y]§!\n\nThis is a multiplier on the state's renewable output: §Y1.0§! is the world average, so a state at 1.5 produces 1.5x the average and one at 0.5 half of it.\n\n§HColor Legend (1.0 = world average):§!\n§RRed§! = Above 1.6 (exceptional)\n§9Gold§! = 1.45 - 1.6 (outstanding)\n§YYellow§! = 1.2 - 1.45 (well above average)\n§GGreen§! = 1.0 - 1.2 (above average)\n§CTeal§! = 0.8 - 1.0 (slightly below average)\n§nBlue§! = 0.6 - 0.8 (poor)\n§HDark Blue§! = Below 0.6 (very poor)\n\nThis value is fixed and does not change over time."
 MAPMODE_UNEMPLOYMENT_RATE_MAP_MODE_NAME: "실업률"
 unemployment_rate_map_mode_tooltip: "[FROM.CONTROLLER.GetNameWithFlag]의 실업률"
 unemployment_rate_map_mode_tooltip_delayed: "Unemployment Rate in §Y[FROM.CONTROLLER.GetNameWithFlag]§! is: §Y[?FROM.CONTROLLER:total_unemployed_percentage_display|%Y]§!\n\nThis shows the percentage of the working-age population that is unemployed.\n\n§HColor Legend:§!\n§nDeep Blue§! = Above 35% (Crisis)\n§lBright Blue§! = 22% - 35% (Very high)\n§CCyan§! = 10% - 22% (High)\n§GGreen§! = 5% - 10% (Moderate)\n§YYellow§! = 2% - 5% (Low)\n§9Bright Gold§! = Below 2% (Full employment)\n\n§nDarker is worse.§! Reduce unemployment through economic growth and policy.\nUpdated with the weekly economic tick."
 MAPMODE_UNEMPLOYMENT_RATE_MAP_MODE: "실업률"
 MAPMODE_UNEMPLOYMENT_RATE_MAP_MODE_DESCRIPTION: "이 지도 모드는 국가별 현재 실업률을 생산가능인구 대비 비율로 표시합니다."
 MAPMODE_SUBIDEOLOGY_MAP_MODE_NAME: "집권당"
 MAPMODE_SUBIDEOLOGY_MAP_MODE: "집권당"
 MAPMODE_SUBIDEOLOGY_MAP_MODE_DESCRIPTION: "각국을 집권 중인 정당의 세부 이념을 표시하며, 마우스를 올리면 집권 정당들의 득표율이 나타납니다."
 subideology_map_mode_tooltip: "[FROM.CONTROLLER.GetNameWithFlag]의 집권당"
 subideology_map_mode_tooltip_delayed: "§H[FROM.CONTROLLER.GetNameWithFlag]§!\n\n§HRuling Party:§![FROM.CONTROLLER.map_mode_ruling_party]\n\n§HGovernment Coalition:§![FROM.CONTROLLER.map_mode_coalition_none][FROM.CONTROLLER.L_coal_elect_percent_0][FROM.CONTROLLER.L_coal_elect_percent_1][FROM.CONTROLLER.L_coal_elect_percent_2][FROM.CONTROLLER.L_coal_elect_percent_3][FROM.CONTROLLER.L_coal_elect_percent_4][FROM.CONTROLLER.L_coal_elect_percent_5][FROM.CONTROLLER.L_coal_elect_percent_6][FROM.CONTROLLER.L_coal_elect_percent_7][FROM.CONTROLLER.L_coal_elect_percent_8][FROM.CONTROLLER.L_coal_elect_percent_9][FROM.CONTROLLER.L_coal_elect_percent_10][FROM.CONTROLLER.L_coal_elect_percent_11][FROM.CONTROLLER.L_coal_elect_percent_12][FROM.CONTROLLER.L_coal_elect_percent_13][FROM.CONTROLLER.L_coal_elect_percent_14][FROM.CONTROLLER.L_coal_elect_percent_15][FROM.CONTROLLER.L_coal_elect_percent_16][FROM.CONTROLLER.L_coal_elect_percent_17][FROM.CONTROLLER.L_coal_elect_percent_18][FROM.CONTROLLER.L_coal_elect_percent_19][FROM.CONTROLLER.L_coal_elect_percent_20][FROM.CONTROLLER.L_coal_elect_percent_21][FROM.CONTROLLER.L_coal_elect_percent_22][FROM.CONTROLLER.L_coal_elect_percent_23]\n\n§HTotal Government Support:§! §Y[?FROM.CONTROLLER:government_coalition_strength_elect|%1]§!\n\nPercentages are the vote share each party won at the last election, so nations that have never held one show 0.0%.\n\n§HColour Legend:§!\nEvery party keeps the colour it has in the politics view pie chart.\n§nBlues§! = Western parties\n§RReds§! = Emerging parties\n§GGreens§! = Salafist and Islamist parties\n§YYellows and greys§! = Neutral parties\n§9Orange, olive and purple§! = Nationalist parties\n\nUpdated whenever a government changes."
 map_mode_ruling_party_text: "\n[show_ruling_party] ([?party_pop_elect_array^ruling_party|%1])"
 map_mode_coalition_none_text: "\nNone (single-party government)"
 map_mode_member_state: "회원국"
 map_mode_potential_member_state: "잠재 회원국"
 map_mode_not_a_member: "비회원국"
 MAPMODE_RESERVE_CURRENCY_MAP_MODE_NAME: "기축통화"
 MAPMODE_RESERVE_CURRENCY_MAP_MODE: "기축통화"
 MAPMODE_RESERVE_CURRENCY_MAP_MODE_DESCRIPTION: "각국이 기축통화 정책에 따라 보유한 기축통화를 표시합니다."
 reserve_currency_map_mode_tooltip: "[FROM.CONTROLLER.GetNameWithFlag]의 기축통화"
 reserve_currency_map_mode_tooltip_delayed: "§Y[FROM.CONTROLLER.GetNameWithFlag]§!\n\n기축통화 정책: §Y[FROM.CONTROLLER.map_mode_reserve_currency]§!\n\n§Y색상 범례:§!\n§l파랑§! = 달러\n§n진한 파랑§! = 유로\n§R빨강§! = 위안\n§G진한 초록§! = 루블\n§W흰색§! = 엔\n§Y노랑§! = 파운드\n§p분홍§! = 프랑\n§O주황§! = 휠던\n§7연한 초록§! = 헤알\n§0보라§! = 비트코인\n§g짙은 회색§! = 자국 통화 준비\n\n색상은 자동화 설정의 §Y지도 모드 색상§! 선택을 따릅니다.\n주간 경제 틱마다 갱신됩니다."

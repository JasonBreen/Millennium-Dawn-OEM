 USA_monarchist_event.32.d: "새로운 통합된 미래를 만들어 가는 동안 마지막 퍼즐 조각들이 이제 제자리를 찾아가기 시작할 것입니다. 칠레는 우리와 동맹국들에 맞서는 마지막 저항국입니다."
 USA_monarchist_event.32.o1: "승리를 향해 전진"
 USA_monarchist_event.33.t: "신세계 경제 거래소"
 USA_monarchist_event.33.d: "NWEE의 창설은 우리의 경제적 번영과 상호 단결을 공고히 하여 더 나은 내일을 위해 나아가게 할 것입니다. 한 민족으로서 함께 전진합시다."

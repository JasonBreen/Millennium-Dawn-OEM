 USA_crisis_event.1125.t: "결집하는 광산 노조"
 USA_crisis_event.1125.d: "상황이 이해할 수 없을 정도로 계속 악화되면서 광산 노조 노동자들이 웨스트버지니아주를 중심으로 결집하기 시작했습니다. 이 주를 핵심 방어 거점으로 보는 이 노동자 대부분은 상황에 압력을 가하여 친노조 의제가 채택되도록 강제하거나, 한때 블랙 펄 주로 알려졌던 이곳의 독립을 확보하기를 희망합니다."
 USA_crisis_event.1125.o1: "맙소사, 하필 지금이라니"
 USA_crisis_event.1126.t: "방어를 동원하라"
 USA_crisis_event.1126.d: "연방정부는 자신이 우스갯거리임을 알아본 모든 이를 억누르고 탄압하려 합니다. 우리는 폭정에 맞서, 그리고 노동자를 위해 굳건히 서겠습니다."
 USA_crisis_event.1126.o1: "노동자들을 결집하라!"
 USA_crisis_event.1127.t: "제3차 적색 공포"
 USA_crisis_event.1127.d: "때가 무르익었습니다. 이 어려운 시기에 우리 국가의 민주적 미래를 확보하려면 이 공산주의 폭도를 진압해야 합니다."
 USA_crisis_event.1127.o1: "붉게 사느니 죽는 편이 낫다"
 USA_crisis_event.1128.t: "The Sun Shines To Bright"
 USA_crisis_event.1128.d: "In a disturbing upset in regional unity, the state of Florida has declared independence. While we are greatly sadden by this turn of events, the mutual goal of the destruction of the federal government is what matters and as such is what we will unite towards for the time being."
 USA_crisis_event.1128.o1: "남부 가족이라더니 다 헛소리였군"
 USA_crisis_event.1129.t: "주 방위대의 창설"
 USA_crisis_event.1129.d: "The recent national turmoil has resulted in us recreating the state guard and using it as a means of a self defense force. We hope to secure our independence from federal oppression and wish god's speed to all who share our cause."
 USA_crisis_event.1129.o1: "무기를 들어라!"
 USA_crisis_event.1130.t: "대반란"
 USA_crisis_event.1130.d: "Now we have rebellion inside of a rebellion, will this chaos ever end."
 USA_crisis_event.1130.o1: "마이애미로 진군한다!"
 USA_crisis_event.1131.t: "미친 산사람"
 USA_crisis_event.1131.d: "As things continue to spiral out of control, the state of Idaho seeing the Lakotan buffer state as a means to secure its seclusion from everything has declared independence. With the statement from the rebellion leader stating, quote, \"Our state is but that of the Rocky Mountains, we have no need for you fancy cities and divisive ideologies.\". Federal officials are looking to respond as quickly as possible to yet another challenge to its authority in the on-going crisis."
 USA_crisis_event.1131.o1: "도대체 얼마나 더 있는 거야?"
 USA_crisis_event.1132.t: "산악 병력 배치"
 USA_crisis_event.1132.d: "연방정부가 과두제의 덫에 저항하는 모든 이에게 독성 있는 통제를 확산시키려는 가운데, 우리는 우리 자신과 단지 방해받지 않기를 원하는 무장 형제자매들을 방어해야 합니다."
 USA_crisis_event.1132.o1: "굳건히 서고 강하게 서라"
 USA_crisis_event.1133.t: "또 다른 산악 문제"
 USA_crisis_event.1133.d: "언젠가 그들을 처리하겠지만, 우리의 명백한 의도를 여전히 선언해야 합니다."
 USA_crisis_event.1133.o1: "제발 하느님. 더 이상 산은 안 됩니다"
 USA_crisis_event.1134.t: "캘리포니아 드리밍"
 USA_crisis_event.1134.d: "Seems like the whole nation is dreaming while we're actively living a nightmare. The governor of California has formally declared a state of succession up until either the federal government of the so called \"United States\" is dealt with or a cease fire is reached. Wherein California will negotiate to consider either reintegration or outright independence."
 USA_crisis_event.1134.o1: "오, 얼마나 인자한 일인가..."
 USA_crisis_event.1135.t: "방위군을 소집하라"
 USA_crisis_event.1135.d: "We expect like those before us to be swiftly and unjustly strung up against a wall. With this clear and violent out come assured we must mobilize defenses and ensure our people are secure from the tyranny of the east."
 USA_crisis_event.1135.o1: "곰 공화국에 신의 가호를"
 USA_crisis_event.1136.t: "서부의 진격"
 USA_crisis_event.1136.d: "바다에서 빛나는 바다까지, 우리는 다시 하나의 온전한 국가가 될 것입니다."
 USA_crisis_event.1136.o1: "전진!"
 USA_crisis_event.1137.t: "오대호, 거대한 문제"
 USA_crisis_event.1137.d: "이미 19개 주가 공개적 반란에 가담한 것으로 확인된 것만으로도 모자라, 연방정부가 저지른 최근의 혼란에 거의 절반의 국가가 무장 봉기하고 있는 것으로 보입니다. 이 사태가 더 이상 번지지 않도록 해야 합니다."
 USA_crisis_event.1137.o1: "The Death Pentalty, Maybe We Do Need It"
 USA_crisis_event.1138.t: "북부의 관문"
 USA_crisis_event.1138.d: "The nation is in ruins, we can only do what any respectible state should do and that's protect its people. Mobilize the masses and stand strong with our sister states."
 USA_crisis_event.1138.o1: "민주주의 그 자체를 수호하라!"
 USA_crisis_event.1139.t: "우리만의 눈물의 길"
 USA_crisis_event.1139.d: "전 국가를 확보하려면, 이 재앙의 발원지와 동일하고 평등한 처우로 모든 문제 주를 다루어야 합니다."
 USA_crisis_event.1139.o1: "제발 하느님, 이제 그만 끝나게 해주세요"
 USA_crisis_event.1140.t: "비상 징집법"
 USA_crisis_event.1140.d: "With the absolute state of things, mass conscription similar to the draft has been enforced. loyal national guard elements as well as civilian movment and volunteers have been morphed into new Nat Guard Regiments."
 USA_crisis_event.1140.o1: "하느님이 우리 모두를 구원하시길"
 USA_venezuela_decision_TT: "Strategic Importance Of This Action:\n - §H[VEN.GetFlag] Venezuela§! has long been a thorn in the side of South American diplomacy. Their aggresive and anti-western nature makes it so that we have to tip-toe around their bursts of rage to talk with our partners in the region.\n - By toppling the §H[VEN.GetFlag] Venezuelan§! regime, we could achieve a friendly force in the region and bring about a new era in South America."
 USA_focus_2004_economic_deregulation_desc: "확장을 이어 가려면 경제를 더 규제 완화해야 합니다. 기업 성장과 신규 창업을 가로막는 장벽으로 가득한 \\"핵심\\" 법규를 공략함으로써 이를 달성할 수 있습니다."
 USA_focus_2004_investments_desc: "핵심 기업에 대한 제한적인 정부 투자는 국가의 GDP를 끌어올리고, 목표 경제 부문에 대한 \\"자극\\"의 결과로 더 많은 일자리를 창출할 것입니다."
 USA_focus_2008_healthcare_desc: "영국의 사례를 보고 전 국민 의료보험이 모두를 위한 것이 될 수 있음을 알아야 하며, 따라서 이러한 \\"위험한\\" 정책을 통과시키려면 야당과 계속 타협해야 합니다."
 USA_focus_2008_environment_deregulation_desc: "미래의 기업가가 새 사업을 시작하고 싶어 하도록 더 잘 유도하기 위해 이러한 번거로운 \\"녹색\\" 규제를 완화해야 합니다."
 USA_focus_were_not_them_desc: "야당이 선전에서 공격적으로 나오고 있으며, 그들의 \\"주장\\" 대부분은 명백히 거짓입니다. 우리는 이러한 거짓말에 대처하기 위해 최선을 다해야 합니다."
 USA_focus_we_arent_like_them_desc: "야당이 선전에서 공격적으로 나오고 있으며, 그들의 \\"주장\\" 대부분은 명백히 거짓입니다. 우리는 이러한 거짓말에 대처하기 위해 최선을 다해야 합니다."
 USA_focus_strengthing_naval_training_efforts_desc: "기준과 요구 조건을 높이고 해군 인원에게 훈련시키는 방식과 내용 전반을 개선합니다. 이를 통해 평균적인 수병이 전장 상황과 위기 관리 상황에 대응하는 방식에 새로운 선례를 세워 더 강하고 더 박식한 전력을 만들 것입니다."
 USA_focus_sierra_leone_peacekeepers: "시에라리온 \\"평화유지군\\""
 USA_focus_sierra_leone_peacekeepers_desc: "이 나라는 장비는 어느 정도 갖추었지만 실질적인 진전이 없습니다. 마치 UN 소속인 것처럼 \\"평화유지군\\"을 파견하여 전쟁을 더 긍정적인 방향으로 이끌 수 있습니다."
 USA_focus_joint_police_action: "합동 \\"경찰 행동\\""
 USA_focus_joint_police_action_desc: "시에라리온 내전이라는 경찰 행동은 새로운 유형의 외교 정책으로서 유망해 보입니다. 많은 이들이 베트남 전쟁 시기의 정서를 되풀이하지 않도록 \\"경찰 행동\\"이라는 용어를 다듬고 재정의해야 합니다."
 USA_focus_foreign_aid_desc: "The international community is weary of our more or less candid silence towards the mideast crisis. Let's try and calm this view by giving some \"foreign aid\" to those fighting for the \"right\" cause."
 USA_focus_everyone_has_their_price_desc: "전쟁은 한동안 질질 끌어왔고 빈손으로 떠나는 것만은 피해야 합니다. 하나 또는 여러 집단에 압박을 가해 타협하거나, 자신들의 세력이 전쟁에서 이길 경우 우리에게 \\"상호\\" 이익을 주도록 할 수 있습니다."
 USA_taxing_smarter_desc: "누진 과세 체계를 옹호하여 소득 격차를 허물고 경제적 공정성을 추진합니다."
 USA_american_anarchist_society_collectivizes_victory_desc: "놀랍고 거의 당혹스러운 일련의 사건 속에서 아나키스트 협회가 지도부를 파고들었습니다. 사상을 알리는 투쟁과 지도부 선거에서의 표 확보를 통해 아나키스트 협회의 충분한 회원들이 저울을 자기들 쪽으로 기울여 당에 대한 과반 지도권을 확보했습니다. 이제 모두가 거의 경외하는 마음으로 \\"아나키스트 정부\\"가 실제로 무엇을 할지 지켜보고 있습니다."
 USA_cosmetic_tag_fascist_completed_desc: "§Y[USA.GetAdjective] 연합§!을 선포하고 그에 맞게 국명을 변경합니다."
 USA_cosmetic_tag_military_junta_completed_desc: "§Y군사 정권§!을 수립하고 그에 맞게 국명을 변경합니다."
 USA_cosmetic_tag_monarchist_desc: "§Y[USA.GetAdjective] 제국§!을 선포하고 그에 맞게 국명을 변경합니다."
 USA_cosmetic_tag_red_junta_desc: "§Y혁명 인민위원회§!를 구성하고 그에 맞게 국명을 변경합니다."

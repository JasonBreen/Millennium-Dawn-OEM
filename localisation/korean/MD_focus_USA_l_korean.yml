 USA_treason_event.8.t: "개혁 공화국 우파 \\"2004\\""
 USA_treason_event.8.d: "Congrats you've beaten the system, but now who do you choose. We have the no government Libertarians, the level headed Reform Partiers and finally with have the Constitutionalist paper lovers."
 USA_treason_event.8.o1: "작은 권력, 작은 정부!"
 USA_treason_event.8.o2: "이유가 있는 개혁 공화국"
 USA_treason_event.8.o3: "문서가 곧 법이다!"
 USA_treason_event.8.o4: "Lets Look Left Why Don't We"
 USA_treason_event.9.t: "개혁 공화국 좌파 \\"2004\\""
 USA_treason_event.9.d: "Congrats you've beaten the system, but now who do you choose. We have the tree hugging Greens, the pink ribboned Progressives and finally we have the lets bring European politics to America, Democratic Socialists."
 USA_treason_event.9.o1: "나는 자연을 사랑한다"
 USA_treason_event.9.o2: "나는 사회 진보를 사랑한다"
 USA_treason_event.9.o3: "나는 유럽의 사상을 사랑한다"
 USA_treason_event.9.o4: "나는 양념을 사랑한다, 이 맛들은 뭐죠"
 USA_treason_event.10.t: "개혁 공화국 연립 \\"2004\\""
 USA_treason_event.10.d: "Looks like you beat the system so bad its kinda broken. Care to break it some more? You have the National Front Party and the Shepard's Party. Which coalition will you break the window with."
 USA_treason_event.10.o1: "나는 레드 벨벳이 좋다"
 USA_treason_event.10.o2: "나는 밀크 초콜릿이 좋다"
 USA_treason_event.10.o3: "잠깐, 길을 잃은 것 같은데, 입구가 어디죠?"
 USA_treason_event.11.t: "개혁 공화국 우파 \\"2008\\""
 USA_treason_event.11.d: "축하합니다, 당신은 체제를 이겼습니다. 그렇다면 이제 누구를 선택하시겠습니까. 정부 없는 자유지상당, 침착한 개혁당, 그리고 마지막으로 헌법을 문서로 사랑하는 헌정당이 있습니다."
 USA_treason_event.11.o1: "작은 권력, 작은 정부!"
 USA_treason_event.11.o2: "이유가 있는 개혁 공화국"
 USA_treason_event.11.o3: "문서가 곧 법이다!"
 USA_treason_event.11.o4: "왼쪽도 한번 살펴볼까요"
 USA_treason_event.12.t: "개혁 공화국 좌파 \\"2008\\""
 USA_treason_event.12.d: "축하합니다, 당신은 체제를 이겼습니다. 그렇다면 이제 누구를 선택하시겠습니까. 나무를 껴안는 녹색당, 분홍 리본을 맨 진보당, 그리고 마지막으로 유럽 정치를 미국에 들여오자는 민주사회주의자들이 있습니다."
 USA_treason_event.12.o1: "나는 자연을 사랑한다"

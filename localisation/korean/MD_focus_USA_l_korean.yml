 USA_cuba_policy_locked: "쿠바 정책이 이미 확정됨"
 USA_left_WHO: "세계보건기구 탈퇴"
 usa_economic_events.300.a: "합병을 지지한다"
 usa_economic_events.300.b: "HP의 독립을 유지한다"
 usa_economic_events.300.d: "연방거래위원회는 휼렛 패커드와 컴팩의 합병 제안에 대한 조사를 집행 조치 없이 종결했습니다. 월터 휴렛의 위임장 대결로 인해 다가오는 주주 투표는 HP의 미래를 둔 경쟁이 되었습니다."
 usa_economic_events.300.t: "컴팩 위임장 대결"
 usa_economic_events.301.a: "서비스 사업 확장을 완료한다"
 usa_economic_events.301.b: "거래를 포기하고 하드웨어를 우선한다"
 usa_economic_events.301.d: "HP는 일렉트로닉 데이터 시스템즈를 $ 13.9십억에 인수하여 연간 매출 $ 380억이 넘는 서비스 사업을 결합하고, 하드웨어를 넘어 경쟁할 글로벌 기반을 얻을 수 있습니다. 아니면 자금을 아끼고 하드웨어 기업으로 남을 수도 있습니다."
 usa_economic_events.301.t: "EDS 서비스 도박"
 usa_economic_events.302.a: "기업용 소프트웨어로 전환한다"
 usa_economic_events.302.b: "기기와 PC에 재투자한다"
 usa_economic_events.302.d: "HP는 webOS 기기 사업을 중단하고, 개인용 컴퓨터 사업의 대안을 검토하며, 기업용 소프트웨어 회사 오토노미를 인수할 계획입니다. 이 개편안은 회사를 더 높은 마진의 소프트웨어, 클라우드, 서비스 중심으로 이동시킬 것입니다."
 usa_economic_events.302.t: "HP의 전략적 단절"
 usa_economic_events.303.a: "분사를 완료한다"
 usa_economic_events.303.b: "휼렛 패커드를 하나로 유지한다"
 usa_economic_events.303.d: "휼렛 패커드는 두 개의 상장 회사로 분리할 계획입니다. HP Inc.는 개인용 시스템과 인쇄 사업을, 휼렛 패커드 엔터프라이즈는 인프라, 소프트웨어, 서비스 사업을 맡게 됩니다."
 usa_economic_events.303.t: "휼렛 패커드의 분할"
 usa_economic_events.304.a: "HP의 독자 계획에 총력을 기울인다"
 usa_economic_events.304.b: "통합 가능성의 문을 열어 둔다"
 usa_economic_events.304.d: "제록스는 코로나19 팬데믹으로 인한 혼란을 이유로 HP Inc.에 대한 공개 매수 제안을 철회하고 위임장 대결을 끝냈습니다. 적대적 인수 시도의 붕괴로 HP의 전략 결정권은 이사회에 돌아갑니다."
 usa_economic_events.304.t: "제록스의 인수 시도 무산"
 usa_economic_events.310.a: "마이클 델이 지휘권을 되찾는다"
 usa_economic_events.310.b: "전문 경영진을 앉힌다"
 usa_economic_events.310.d: "케빈 롤린스는 성장이 정체되고 직접 판매 모델이 흔들리자 사임했고, 마이클 델이 최고경영자로 복귀하게 되었습니다. 그는 직접 회생을 진두지휘하거나 전문 경영진을 앉혀 회사를 안정시킬 수 있습니다."
 usa_economic_events.310.t: "창업자의 귀환"
 usa_economic_events.311.a: "기업용 서비스 부문을 구축한다"
 usa_economic_events.311.b: "하드웨어 기업으로 남는다"
 usa_economic_events.311.d: "델은 정보기술 서비스 업체인 페로 시스템즈를 인수하기로 합의했습니다. 이 거래는 델에 서비스 부문과 기업 솔루션 시장의 발판을 안겨 하드웨어 판매 사업을 넘어서게 할 것입니다."
 usa_economic_events.311.t: "페로 시스템즈 인수"
 usa_economic_events.312.a: "실버 레이크와 함께 델을 비상장 회사로 전환한다"
 usa_economic_events.312.b: "상장을 유지하고 책임을 진다"
 usa_economic_events.312.d: "마이클 델과 투자 회사 실버 레이크가 회사를 매수하여 비상장화하는 안을 제안했습니다. 공개 시장을 떠나면 델은 분기 실적 압박에서 벗어나 창업자가 회사를 개조할 여지를 얻게 되지만, 재무제표에 막대한 부채가 쌓이는 대가를 치러야 합니다."
 usa_economic_events.312.t: "비상장화 결정"
 usa_economic_events.313.a: "EMC를 인수하고 사업 포트폴리오를 통합한다"
 usa_economic_events.313.b: "EMC를 인수하되 연합 체제를 보존한다"
 usa_economic_events.313.d: "2015년 10월 12일, 델과 EMC는 지금까지 시도된 가장 큰 기술 기업 거래인 670억 달러 규모의 인수를 발표했습니다. 이를 완료하면 델은 전 영역을 아우르는 인프라 기업이 되고 VM웨어 지분 과반을 포함한 EMC의 연합 체제가 한 지붕 아래 들어오지만, 산더미 같은 부채도 함께 떠안게 됩니다."
 usa_economic_events.313.t: "EMC 인수 제안"
 usa_economic_events.314.a: "VM웨어를 분사하고 부채를 줄인다"
 usa_economic_events.314.b: "VM웨어를 통합 상태로 유지한다"
 usa_economic_events.314.d: "2021년 4월 14일, 델은 보유한 VM웨어 지분 과반을 분사하고 그에 따른 특별 배당금으로 부채를 투자 등급 수준까지 줄이는 방안을 제안했습니다. 독립은 양사를 모두 날카롭게 만들겠지만, 델은 EMC가 안겨준 소프트웨어 보석을 잃게 됩니다."
 usa_economic_events.314.t: "VM웨어 분사 제안"
 usa_economic_events.315.a: "대규모로 AI 서버를 구축한다"
 usa_economic_events.315.b: "마진을 위해 AI에 선별적으로 접근한다"
 usa_economic_events.315.d: "AI에 최적화된 서버에 대한 수요가 급증하고 있으며, 델의 인프라 사업은 GPU 고밀도 시스템 주문으로 채워지고 있습니다. 델은 대규모 구축에 전념하거나, 마진을 지키기 위해 이 기회를 선별적으로 추구할 수 있습니다."
 usa_economic_events.315.t: "AI 서버 구축"
 usa_economic_events.320.a: "반독점 심사가 진행되도록 둔다"
 usa_economic_events.320.b: "인수 시도를 저지하기 위해 움직인다"
 usa_economic_events.320.d: "오라클은 피플소프트가 J.D. 에드워즈 인수에 합의한 지 며칠 만에 피플소프트에 대해 51억 달러 규모의 일방적 공개 매수를 시작했습니다. 피플소프트는 포이즌 필과 인수될 경우 고객에게 환불해 주겠다는 보증으로 맞서고 있으며, 법무부는 반독점 소송을 저울질하고 있습니다. 워싱턴은 심사가 진행되도록 두거나 인수 시도를 저지하기 위해 움직일 수 있습니다."
 usa_economic_events.320.t: "피플소프트 포위전"
 usa_economic_events.321.a: "인수를 승인한다"
 usa_economic_events.321.b: "데이터베이스 경쟁을 이유로 저지한다"
 usa_economic_events.321.d: "선 인수는 자바, MySQL, 솔라리스, SPARC를 오라클의 통제 아래 두어, 한 기업이 핵심 소프트웨어 인프라에 대한 영향력과 한 번도 운영해 본 적 없는 하드웨어 사업을 갖게 합니다. 심사의 쟁점은 선도적인 상용 데이터베이스와 이에 맞서는 오픈소스 데이터베이스를 같은 기업이 보유해도 되는가입니다. 승인하면 소프트웨어 스택이 통합되고, 저지하면 선의 자산은 다른 인수자에게 넘어갑니다."
 usa_economic_events.321.t: "선 마이크로시스템즈, 스택의 관리권"
 usa_economic_events.322.a: "저작권 주장을 지지한다"
 usa_economic_events.322.b: "인터페이스는 개방되어야 한다고 주장한다"
 usa_economic_events.322.d: "구글을 상대로 한 자바 API 소송은 소프트웨어 인터페이스를 둘러싼 결정적인 싸움이 되었습니다. 오라클이 승소하면 API는 사실상 저작권의 대상이 되고 라이선스 압력이 확산될 것이며, 반대로 해석되면 상호 운용성 규범이 보존될 것입니다. 워싱턴은 저작권 주장을 지지하는 입장을 내거나 인터페이스는 개방되어야 한다고 주장할 수 있습니다."
 usa_economic_events.322.t: "오라클 대 구글"
 usa_economic_events.323.a: "연방 클라우드 조달을 두 번째 공급업체에도 개방한다"
 usa_economic_events.323.b: "계약을 기존 업체에 맡겨 둔다"
 usa_economic_events.323.d: "오라클은 탄탄한 유통망, 개발자 생태계, 자본 규모를 갖춘 초대형 기존 업체들을 상대로 연방 클라우드 계약 수주를 다투고 있습니다. 연방 인프라를 두 번째 공급업체로 유도하면 오라클의 입지는 높아지겠지만 큰 비용이 따르며, 현재 수주 상태를 그대로 두면 오라클이 이미 얻고 있는 온프레미스 마진이 유지됩니다. 어느 쪽으로 갈지는 조달이 결정합니다."
 usa_economic_events.323.t: "클라우드 인프라 전환"
 usa_economic_events.324.a: "인수를 승인한다"
 usa_economic_events.324.b: "환자 정보 문제를 이유로 저지한다"
 usa_economic_events.324.d: "서너 인수는 오라클에게 전자 건강 기록과 병원 정보 시스템 분야에서 지배적인 위치를 부여하여, 데이터에 가장 민감하고 규제가 가장 심한 부문 중 하나로 기업 영향력을 확장하게 합니다. 심사의 쟁점은 환자 정보의 집중과, 더 깊은 종속이 병원에 득이 될지 해가 될지 여부입니다. 승인하면 의료 IT가 통합되고, 저지하면 오라클은 핵심 데이터베이스 사업에 머뭅니다."
 usa_economic_events.324.t: "서너 인수: 의료 IT 장악"
 usa_economic_events.330.t: "CUDA에 대한 헌신"
 usa_economic_events.330.d: "엔비디아는 그래픽이 아닌 작업에도 쓸 수 있도록 그래픽 프로세서를 프로그래밍 가능하게 만드는 데 수년의 시간과 막대한 자금을 쓰자고 제안합니다. 이를 요청한 고객은 아무도 없습니다. 대안은 같은 엔지니어들을 이미 팔리는 제품에 투입하는 것입니다."
 usa_economic_events.330.a: "범용 컴퓨팅 플랫폼에 자금을 댄다"
 usa_economic_events.330.b: "엔지니어들을 그래픽에 계속 투입한다"
 usa_economic_events.331.t: "딥러닝의 신호"
 usa_economic_events.331.d: "연구자들이 전용 하드웨어가 아닌 엔비디아의 게임용 카드를 사용해 이미지 인식 대회에서 압도적인 차이로 우승했습니다. 이는 한 학술 대회의 한 가지 결과일 뿐이지만, 아직 존재하지 않는 시장이 있음을 시사합니다."
 usa_economic_events.331.a: "기계 학습 시장을 위해 개발한다"
 usa_economic_events.331.b: "고객이 있는 시장을 기다린다"
 usa_economic_events.332.t: "데이터 센터로의 전환"
 usa_economic_events.332.d: "데이터 센터를 상대하려면 새로운 반도체, 새로운 인터커넥트, 새로운 시스템, 그리고 게이머가 아닌 운영 사업자에게 판매하는 영업 조직이 필요합니다. 이는 엔비디아를 전혀 다른 회사로 만들 것입니다. 지포스를 고수하는 편이 비용이 적게 들고 수요도 이미 검증되어 있습니다."
 usa_economic_events.332.a: "데이터 센터를 중심으로 회사를 재편한다"
 usa_economic_events.332.b: "소비자 시장에 머문다"
 usa_economic_events.333.t: "수출 통제의 시작"
 usa_economic_events.333.d: "워싱턴이 엔비디아의 가장 고성능 가속기의 해외 판매를 제한합니다. 따르면 가장 큰 시장 중 하나를 잃지만 규칙을 만드는 정부와의 입지를 얻습니다. 기준선을 우회하여 설계하면 매출은 지킬 수 있으나 다음 규제를 부르게 됩니다."
 usa_economic_events.333.a: "통제에 따르고 보조를 맞춘다"
 usa_economic_events.333.b: "기준선을 우회하여 설계한다"
 usa_economic_events.334.t: "가속기 증설"
 usa_economic_events.334.d: "엔비디아 학습용 가속기에 대한 수요는 공급망이 감당하도록 만들어진 수준을 넘어섰습니다. 물량을 약속하면 주문보다 수년 앞서 생산 능력 비용을 지불해야 합니다. 물러서면 재무제표는 지킬 수 있으나 부족분을 경쟁사에 넘겨주게 됩니다."
 usa_economic_events.334.a: "물량을 약속하고 생산 능력을 확보한다"
 usa_economic_events.334.b: "공급 규율을 유지하고 마진을 지킨다"
 usa_economic_events.335.t: "가속기 질서"
 usa_economic_events.335.d: "프로그래밍 가능한 반도체에 대한 엔비디아의 20년에 걸친 도박은 세계의 컴퓨팅 능력을 누가, 어떤 조건으로 공급하는지를 정리했습니다. 미국 산업이 무엇을 학습시킬 수 있고 누구에게 판매할 수 있는지는 이제 거기서 결정됩니다."
 usa_economic_events.335.a: "어떤 경쟁자도 흔들 수 없는 플랫폼"
 usa_economic_events.335.b: "주권적 컴퓨팅 스택"
 usa_economic_events.335.c: "개방형 가속기 연방"
 usa_economic_events.335.e: "쇠퇴하는 범용품 공급업체"
 USA_nvidia_cuda_fortress: "가속기 요새"
 USA_nvidia_cuda_fortress_desc: "하드웨어는 대체할 수 있지만 그에 맞춰 작성된 소프트웨어는 그렇지 않습니다. 20년간 쌓인 도구, 라이브러리, 숙련된 엔지니어들이 이 플랫폼을 표준으로 만들었으며, 모든 경쟁자는 모든 것을 다시 작성할 가치가 있을 만큼 큰 격차로 앞서야 합니다."
 USA_nvidia_sovereign_compute_stack: "주권적 컴퓨팅 스택"
 USA_nvidia_sovereign_compute_stack_desc: "가속기는 대규모로 생산되었으나 이를 난공불락으로 만들어 주던 소프트웨어 해자는 없었습니다. 생산 능력은 미국 것이며 풍부하고, 이용 조건은 가장 빠른 커널을 작성한 누군가가 아닌 워싱턴이 정합니다."
 USA_nvidia_open_accelerator_commonwealth: "개방형 가속기 연방"
 USA_nvidia_open_accelerator_commonwealth_desc: "가속 컴퓨팅은 한 기업의 재산이 아닌 공유 인프라로 발전했습니다. 마진은 독점이 얻었을 것보다 얇지만 이를 기반으로 개발하는 사람의 수는 훨씬 많습니다."
 USA_nvidia_commodity_decline: "범용 반도체"
 USA_nvidia_commodity_decline_desc: "프로그래밍 가능한 반도체에 대한 도박은 끝내 완전히 이루어지지 않았고, 가속 컴퓨팅은 다른 곳에서 정의되었습니다. 미국산 그래픽 하드웨어는 여전히 팔리지만 범용품이 받는 가격에 팔릴 뿐입니다."
 usa_economic_events.340.t: "IM 플래시"
 usa_economic_events.340.d: "합작 투자를 하면 마이크론은 훨씬 큰 파트너와 함께 낸드 플래시 메모리에 진출하여, 한 번도 만들어 본 적 없는 제품에 대해 팹과 위험을 나누게 됩니다. 디램에 머문다는 것은 한 가지 사업만 가진 이를 벌하는 업계에서 하나의 범용품을 아주 잘 만드는 일입니다."
 usa_economic_events.340.a: "합작 투자를 통해 플래시에 진출한다"
 usa_economic_events.340.b: "디램에 머문다"
 usa_economic_events.341.t: "메모리 혹한기"
 usa_economic_events.341.d: "메모리 가격이 생산 비용 아래로 떨어졌고 경쟁사들은 팹을 닫고 있습니다. 지금 생산 능력을 사려면 마이크론이 이미 손실을 보고 있는 돈이 들지만 이보다 더 싸지는 일은 없을 것입니다. 지출을 줄이면 재무제표는 지키나 더 큰 생산 능력을 가지고 살아남은 쪽에 회복을 양보하게 됩니다."
 usa_economic_events.341.a: "저렴할 때 생산 능력을 사들인다"
 usa_economic_events.341.b: "지출을 줄이고 혹한기를 버틴다"
 usa_economic_events.342.t: "엘피다 네트워크"
 usa_economic_events.342.d: "파산한 엘피다를 마이크론이 관리 절차에서 인수하면 히로시마와 대만의 팹, 그리고 최대 휴대전화 제조사들을 포함한 고객 명단을 얻을 수 있습니다. 하지만 인력, 채권자 합의, 그리고 10년에 걸친 통합 작업도 함께 따라옵니다."
 usa_economic_events.342.a: "파산한 경쟁사를 인수한다"
 usa_economic_events.342.b: "생산 능력을 직접 구축한다"
 usa_economic_events.343.t: "리하이 결정"
 usa_economic_events.343.d: "유타주에 있는 마이크론의 리하이 팹은 시장이 원하지 않았던 메모리 기술인 3D XPoint를 위해 지어졌으며, 팔릴 만한 제품으로 전환하는 데는 가치보다 많은 비용이 듭니다. 텍사스 인스트루먼트가 인수하려 합니다. 이를 유지한다면 죽은 제품에 맞춰 설계된 공장의 용도를 찾아야 합니다."
 usa_economic_events.343.a: "유타 팹을 매각한다"
 usa_economic_events.343.b: "유지하고 용도를 찾는다"
 usa_economic_events.344.t: "중국의 제한 조치"
 usa_economic_events.344.d: "베이징은 마이크론 제품의 중국 내 인프라 사용을 금지했고, 상당한 매출 비중도 함께 사라졌습니다. 다른 곳에서 생산하고 다른 곳에서 판매하려면 수년의 시간과 마진이 듭니다. 결정에 이의를 제기하면 시장은 유지되나, 이미 판단을 내린 정부에 회사의 운명이 묶이게 됩니다."
 usa_economic_events.344.a: "중국 시장에서 벗어나 다변화한다"
 usa_economic_events.344.b: "결정에 이의를 제기하고 시장을 지킨다"
 usa_economic_events.345.t: "메모리 무기고"
 usa_economic_events.345.d: "붕괴를 거치며 20년간 이어진 건설은 마이크론이 무엇인지, 미국의 메모리 제조가 무엇인지, 그리고 누가 그로부터 단절될 수 있는지를 정리했습니다."
 usa_economic_events.345.a: "미국 메모리 무기고"
 usa_economic_events.345.b: "글로벌 메모리 연합"
 usa_economic_events.345.c: "비휘발성 미래"
 usa_economic_events.345.e: "규모보다 규율"
 USA_micron_american_memory_arsenal: "미국 메모리 무기고"
 USA_micron_american_memory_arsenal_desc: "메모리는 외국 정부가 손댈 수 없는 고객을 위해 미국 팹에서 생산되며, 생산 능력은 다른 모두가 공장을 닫던 시기에 확보되었습니다. 칩은 더 비싸지만 누구에게 공급할지는 다른 누구도 결정하지 못합니다."
 USA_micron_global_memory_federation: "글로벌 메모리 연합"
 USA_micron_global_memory_federation_desc: "세 나라의 팹이 한 소유주 아래 있으며, 자신의 불황을 버티지 못한 경쟁사들로 이루어졌습니다. 규모가 곧 모든 강점이며 그 강점은 상당합니다."
 USA_micron_nonvolatile_future: "비휘발성 미래"
 USA_micron_nonvolatile_future_desc: "회사는 전원이 꺼져도 내용을 유지하는 메모리에 베팅했고, 시장은 그것이 기다리던 곳에 도착했습니다. 연구는 제조에 뒤처지지 않고 앞서 나갑니다."
 USA_micron_memory_scale_discipline: "규모 규율"
 USA_micron_memory_scale_discipline_desc: "생산 능력은 호황의 정점에 구매된 적도 불황의 바닥에 매각된 적도 없습니다. 마이크론은 가능했을 규모보다 작지만 구제받아야 했던 적은 한 번도 없습니다."
 usa_economic_events.350.t: "OMAP와 모바일의 미래"
 usa_economic_events.350.d: "휴대전화용 애플리케이션 프로세서는 반도체에서 가장 빠르게 성장하는 시장이며, 텍사스 인스트루먼트에게는 경쟁력 있는 제품이 있습니다. 그곳에서 이기려면 모두와 경쟁해야 합니다. 대안은 아무도 기사로 쓰지 않지만 부품이 30년간 생산되는 아날로그 사업입니다."
 usa_economic_events.350.a: "모바일 프로세서 시장을 두고 경쟁한다"
 usa_economic_events.350.b: "자금을 아날로그에 투자한다"
 usa_economic_events.351.t: "킬비 연구소"
 usa_economic_events.351.d: "텍사스 인스트루먼트는 잭 킬비의 이름을 딴 연구소를 세우고, 제품 로드맵도 분기별 성과 요구도 주지 않은 채 엔지니어들이 10년 뒤에 결실을 맺을 수도, 아닐 수도 있는 문제에 매달리게 할 수 있습니다. 여기에 들어가는 모든 돈은 고객이 이미 주문한 부품에 쓰이지 못하는 돈입니다."
 usa_economic_events.351.a: "연구소에 자금을 댄다"
 usa_economic_events.351.b: "엔지니어들을 출하 제품에 계속 투입한다"
 usa_economic_events.352.t: "내셔널 세미컨덕터 포트폴리오"
 usa_economic_events.352.d: "내셔널 세미컨덕터를 통째로 인수하면 텍사스 인스트루먼트의 아날로그 제품군과 이를 판매하는 영업 인력이 대략 두 배로 늘어납니다. 이는 개별 부품이 1달러도 안 되는 가격에 팔리는 사업을 위해 회사가 지금까지 발행한 가장 큰 수표입니다."
 usa_economic_events.352.a: "아날로그 제품군을 인수한다"
 usa_economic_events.352.b: "제품군을 직접 키운다"
 usa_economic_events.353.t: "휴대전화 전쟁에서 물러난 OMAP"
 usa_economic_events.353.d: "OMAP는 자사 휴대전화를 위해 자체 칩을 설계하는 기업들보다 더 많은 돈을 써야만 이길 수 있고, 텍사스 인스트루먼트는 그럴 생각이 없습니다. 철수하면 엔지니어와 팹을 임베디드 및 자동차 분야 작업에 투입할 수 있습니다. 남으면 가장 크게 할인하는 쪽에 돌아가는 설계 수주 경쟁을 한 주기 더 치르게 됩니다."
 usa_economic_events.353.a: "휴대전화 시장에서 철수한다"
 usa_economic_events.353.b: "한 제품 주기를 더 싸운다"
 usa_economic_events.354.t: "리하이 전환"
 usa_economic_events.354.d_available: "유타주에 있는 마이크론의 리하이 팹이 매물로 나왔으며, 소유주는 이를 쓸 곳이 없습니다. 이를 텍사스 인스트루먼트의 아날로그 생산으로 전환하면 이미 설비와 인력이 갖춰진 공장에서 신축보다 수년 빠르게 생산 능력을 늘릴 수 있습니다. 전환은 간단하지 않지만 대안보다는 훨씬 저렴합니다."
 usa_economic_events.354.d_greenfield: "받아들일 만한 조건으로 나온 기존 팹이 없으므로, 텍사스 인스트루먼트의 새 아날로그 생산 능력은 새로 착공하는 것을 의미합니다. 맨땅에서 짓는 데는 수년의 시간과 막대한 자금이 들며, 공장은 설계된 그대로의 모습이 됩니다."
 usa_economic_events.354.a: "유타 팹을 인수하여 전환한다"
 usa_economic_events.354.b: "처음부터 새로운 생산 능력을 구축한다"
 usa_economic_events.355.t: "조용히 연결된 모든 것"
 usa_economic_events.355.d: "화려하지 않은 사업을 선택해 온 4반세기가 텍사스 인스트루먼트가 무엇이고, 그와 함께 미국의 아날로그 제조가 무엇인지를 정리했습니다. 부품은 모든 곳에 들어가 있지만 업계 밖에서는 그것을 만드는 회사의 이름을 아는 사람이 거의 없습니다."
 usa_economic_events.355.a: "아날로그 패권"
 usa_economic_events.355.b: "실리콘 무기고"
 usa_economic_events.355.c: "토대 파운드리"
 usa_economic_events.355.e: "모든 것이 조용히 연결되다"
 USA_ti_analog_hegemony: "아날로그 패권"
 USA_ti_analog_hegemony_desc: "세계 최대의 아날로그 제품군으로, 다른 모두가 다투던 사업에서 손을 떼어 쌓아 올린 것입니다. 부품은 수십 년간 생산되며, 이를 설계에 채택한 고객은 쉽게 빠져나갈 수 없습니다."
 USA_ti_silicon_arsenal: "실리콘 무기고"
 USA_ti_silicon_arsenal_desc: "다른 모든 것에 필요한 화려하지 않은 부품을 해외 위탁이 아닌 직접 소유한 미국 팹에서 생산합니다. 웨이퍼는 첨단이 아니며 그 공급이 부족하지도 않습니다."
 USA_ti_foundational_foundry: "토대 파운드리"
 USA_ti_foundational_foundry_desc: "생산 능력을 짓지 않고 사들여 전환함으로써, 신규 건설 계획보다 수년 앞서 공장을 가동했습니다. 생산물은 성숙 공정의 반도체이며 세계는 그것으로 돌아갑니다."
 USA_ti_everything_connected: "모든 것이 연결되다"
 USA_ti_everything_connected_desc: "무언가를 측정하는 모든 기계 속의 센서, 변환기, 컨트롤러를 수만 곳의 고객에게 판매하며, 그 가운데 개별적으로 중요한 고객은 없습니다. 잃으면 타격을 느낄 단일 계약도 없습니다."
 usa_economic_events.360.t: "컨설팅 부문 인수"
 usa_economic_events.360.d: "대형 회계법인이 컨설팅 부문을 매각하려 하며, 이를 인수하면 하룻밤 사이에 컨설턴트 3만 명이 IBM에 들어오게 됩니다. 회사는 제품을 만드는 것보다 고객에게 무엇을 만들지 조언하는 것으로 더 많이 벌게 될 것입니다. 거절하면 IBM은 서비스도 파는 제조업체로 남습니다."
 usa_economic_events.360.a: "컨설팅 업체를 인수하고 서비스를 앞세운다"
 usa_economic_events.360.b: "서비스도 파는 제조업체로 남는다"
 usa_economic_events.361.t: "클라이언트 자산"
 usa_economic_events.361.d: "IBM이 발명한 개인용 컴퓨터 사업은 이제 거의 수익이 없고, 연구에 투자할 필요도 없는 기업들과 가격으로 경쟁하고 있습니다. 구매자가 브랜드와 공장까지 함께 인수할 의사를 보이고 있습니다. 유지하면 범용품에 특화된 기업들에 맞서 범용품을 지켜야 합니다."
 usa_economic_events.361.a: "개인용 컴퓨터 사업을 매각한다"
 usa_economic_events.361.b: "개인용 컴퓨터 생산을 계속한다"
 usa_economic_events.362.t: "무대에 선 왓슨"
 usa_economic_events.362.d: "IBM의 왓슨이 전국 방송에서 제퍼디!의 최고 인간 참가자들을 꺾었으며, IBM 연구소는 이를 사업으로 만들기를 원합니다. 고객이 무엇을 사려 할지, 구축하는 데 얼마가 들지는 아무도 모릅니다. 대안은 이 작업을 이미 팔리는 분석 제품에 녹여 넣는 것입니다."
 usa_economic_events.362.a: "이 시스템을 중심으로 사업을 구축한다"
 usa_economic_events.362.b: "기존 분석 제품에 작업을 녹여 넣는다"
 usa_economic_events.363.t: "개방형 하이브리드 클라우드"
 usa_economic_events.363.d: "IBM은 초대형 클라우드 사업자들보다 많이 지을 수는 없지만, 그 모두를 가로지르는 계층은 장악할 수 있습니다. 가장 큰 오픈소스 기업용 업체를 인수하는 데는 회사 역사상 어떤 인수보다 큰 비용이 듭니다. 같은 위치를 내부에서 구축하는 편이 더 싸지만 더 느리며, 그때쯤이면 고객이 떠났을 수도 있습니다."
 usa_economic_events.363.a: "오픈소스 업체를 인수한다"
 usa_economic_events.363.b: "클라우드 플랫폼을 직접 구축한다"
 usa_economic_events.364.t: "서비스 제국의 분할"
 usa_economic_events.364.d: "IBM의 관리형 인프라 사업은 인력의 대부분을 차지하지만 성장은 전혀 없으며, 회사가 더 지원하고 싶은 모든 분야와 자본을 두고 경쟁합니다. 분사하면 양쪽 모두 각자의 기준으로 평가받을 수 있습니다. 유지하면 매출과 그에 딸린 고객 관계를 지킬 수 있습니다."
 usa_economic_events.364.a: "관리형 서비스 사업을 분사한다"
 usa_economic_events.364.b: "회사를 온전히 유지한다"
 usa_economic_events.365.t: "양자 도박"
 usa_economic_events.365.d: "사업을 팔고, 다른 사업을 사고, 아무도 요청하지 않은 기계에 베팅해 온 4반세기가 IBM이 무엇이고, 미국의 기업용 컴퓨팅이 무엇 위에서 돌아가는지를 정리했습니다."
 usa_economic_events.365.a: "개방형 하이브리드 선순환"
 usa_economic_events.365.b: "미국 시스템 부처"
 usa_economic_events.365.c: "요새 메인프레임"
 usa_economic_events.365.e: "온전한 빅 블루"
 USA_ibm_open_hybrid_flywheel: "개방형 하이브리드 선순환"
 USA_ibm_open_hybrid_flywheel_desc: "IBM은 클라우드가 되려는 시도를 멈추고, 모든 클라우드를 가로질러 돌아가는 계층이 되었습니다. 소프트웨어는 개방되어 있고, 컨설팅이 이를 판매하며, 이에 표준화한 고객은 옮겨 가기 어렵습니다."
 USA_ibm_american_systems_ministry: "미국 시스템 부처"
 USA_ibm_american_systems_ministry_desc: "은행, 보험사, 연방 기관은 IBM이 수십 년간 맡아 온 기계와 계약 위에서 돌아가며, IBM은 이를 유지 보수하는 서비스 부문을 지켰습니다. 성장은 느리고 다른 무엇도 실패해서는 안 됩니다."
 USA_ibm_fortress_z: "요새 메인프레임"
 USA_ibm_fortress_z_desc: "범용품 사업은 떠났지만 메인프레임은 남아, 누구도 이전을 감행하지 않을 업무 부하를 맡고 있습니다. 유실되어서는 안 되는 모든 거래는 이제 한 회사만이 만드는 기계를 거쳐 갑니다."
 USA_ibm_big_blue_intact: "온전한 빅 블루"
 USA_ibm_big_blue_intact_desc: "회사는 아무것도 팔지 않았고 아무것도 쪼개지 않았으며, 여전히 하드웨어, 소프트웨어, 그리고 그것을 설치하는 인력을 만들어 냅니다. 특화된 어떤 경쟁사보다 느리지만 그 누구에게도 의존한 적이 없습니다."
 usa_economic_events.370.t: "선순환"
 usa_economic_events.370.d: "애플은 1985년 창업자를 내쫓았다가 파산 몇 달 전인 1997년에 다시 데려왔고, 그는 이후 제품군을 시장 점유율 약 4퍼센트의 소수 기종으로 줄여 거의 전적으로 다른 기업의 진열대를 통해 판매해 왔습니다. 그의 다음 수는 소매업입니다. 매장 두 곳이 문을 열었고 수십 곳의 임대 계약이 체결되었습니다. 업계 언론은 거의 만장일치로 실패를 예상하는데, 게이트웨이가 올봄 자사 매장을 닫는 중이고 틈새 제조사에게 주어지는 표준 조언은 임대료가 정점인 시기에 쇼핑몰 임대 계약을 맺기보다 소매 비용을 줄이라는 것이기 때문입니다. 회사 내부의 논쟁은 매킨토시를 더 많이 판매하는 데 있지 않으며, 매장을 소유하는 것이 나중에 무엇을 진열대에 올릴 수 있을지를 결정한다는 점에 있습니다."
 usa_economic_events.370.a: "매장과 기기의 선순환을 구축한다"
 usa_economic_events.370.b: "매킨토시를 최우선으로 한다"
 usa_economic_events.371.t: "아이폰의 등장"
 usa_economic_events.371.d: "애플은 사실상 컴퓨터인 전화기를 만들었으나, 어떤 이동통신사도 제조사가 그 위에서 무엇이 돌아갈지 통제하도록 허용한 적이 없습니다. 단 하나의 독점 파트너가 독점권을 대가로 그 조건을 받아들일 것입니다. 거부하면 모든 통신망에서 동시에 출시하되 통신사가 소프트웨어를 쥐게 됩니다."
 usa_economic_events.371.a: "우리 조건으로 한 통신사를 통해 출시한다"
 usa_economic_events.371.b: "개방형 모바일 플랫폼을 구축한다"
 usa_economic_events.372.t: "앱 스토어의 개장"
 usa_economic_events.372.d: "서드파티 소프트웨어는 어떤 식으로든 휴대전화에 들어오게 됩니다. 애플은 모든 애플리케이션을 심사하고 모든 판매의 일부를 가져가는 유일한 관문이 될 수도 있고, 개발자가 사용자에게 직접 다가가도록 하되 플랫폼의 평판을 자기 손에서 놓을 수도 있습니다."
 usa_economic_events.372.a: "유일한 관문이 된다"
 usa_economic_events.372.b: "개발자 공유지를 세운다"
 usa_economic_events.373.t: "전략이 된 서비스"
 usa_economic_events.373.d: "앱 스토어, 음악, 클라우드, 결제는 이제 합쳐서 대부분의 기업이 버는 것보다 많이 벌고 있으며, 이 중 어느 것도 새 기기를 출하할 필요가 없습니다. 이쪽으로 기울면 애플은 구독 사업으로 평가받기 시작합니다. 거부하면 하드웨어가 곧 제품이라는 원칙이 유지됩니다."
 usa_economic_events.373.a: "서비스 선순환을 구축한다"
 usa_economic_events.373.b: "하드웨어 원칙을 복원한다"
 usa_economic_events.374.t: "애플 실리콘"
 usa_economic_events.374.d: "애플은 이미 휴대전화에 들어가는 프로세서를 설계하지만, 컴퓨터는 여전히 다른 회사의 것으로 돌아갑니다. 이를 옮겨 오면 개발자에게는 또 한 번 10년의 전환기가 생기고 공급업체의 로드맵에 대한 의존은 끝납니다. 현상을 유지하면 호환성은 지켜지나 기반은 남의 손에 남습니다."
 usa_economic_events.374.a: "맥을 자체 실리콘으로 옮긴다"
 usa_economic_events.374.b: "통제보다 호환성을 앞세운다"
 usa_economic_events.375.t: "쿠퍼티노가 정리한 것"
 usa_economic_events.375.d: "애플이 스택의 얼마만큼을 소유할지 결정해 온 4반세기가 미국의 소비자 컴퓨팅이 무엇이고, 누가 그 위에서 만들 수 있으며, 누구의 칩으로 돌아가는지를 정리했습니다."
 usa_economic_events.375.a: "사적 컴퓨팅 국가"
 usa_economic_events.375.b: "통합 기기 공화국"
 usa_economic_events.375.c: "회복력 있는 실리콘 네트워크"
 usa_economic_events.375.e: "플랫폼들 가운데 하나의 플랫폼"
 USA_apple_private_computing_state: "사적 컴퓨팅 국가"
 USA_apple_private_computing_state_desc: "칩, 운영체제, 앱 스토어, 그리고 이를 책임지는 서버가 모두 한 회사에 속해 있습니다. 허락 없이는 아무것도 들어올 수 없고 눈에 띄지 않고 나갈 수 있는 것도 없습니다. 세계에서 가장 사적인 소비자 플랫폼이자 책임성이 가장 낮은 플랫폼입니다."
 USA_apple_integrated_device_republic: "통합 기기 공화국"
 USA_apple_integrated_device_republic_desc: "애플은 경험이 무엇인지 결정하고 이를 구현하는 반도체를 사 옵니다. 통합은 그 밑의 계층만 제외하고 모든 곳에서 실현되며, 그 계층에서는 다른 누군가가 로드맵을 정합니다."
 USA_apple_resilient_silicon_network: "회복력 있는 실리콘 네트워크"
 USA_apple_resilient_silicon_network_desc: "프로세서는 캘리포니아에서 설계되며 그 위의 플랫폼은 개발하려는 누구에게나 개방되었습니다. 애플은 통행료 징수소를 포기하고 토대를 지켰습니다."
 USA_apple_platform_among_platforms: "플랫폼들 가운데 하나의 플랫폼"
 USA_apple_platform_among_platforms_desc: "소프트웨어는 개방되어 있고, 칩은 구매하며, 애플은 대안이 있는지 여부가 아니라 제품이 더 나은지 여부로 경쟁합니다. 대안은 보통 존재합니다."
 usa_economic_events.380.t: "통제 없는 자본"
 usa_economic_events.380.d: "구글이 상장을 앞두고 있으며, 래리 페이지와 세르게이 브린은 한 종류가 다른 종류의 열 배 의결권을 갖는 두 종류의 주식을 원합니다. 소수 지분만 갖고도 회사가 무엇을 할지 결정할 수 있도록 하기 위해서입니다. 지배구조 자문가들은 이것이 바로 이사회가 책임성을 잃는 방식이라고 입을 모으지만, 창업자들의 주주 서한은 분기별로는 아무도 승인하지 않았을 사업에 자금을 대기 위해 같은 구조를 사용한 신문사 가문들을 예로 들어 반박합니다. 은행을 통하지 않고 더치 경매로 매각하는 것은 이러한 반발을 더욱 키웁니다. 그만큼 가격은 낮아지겠지만 그 이후의 10년은 그들이 마음대로 쓸 수 있게 될 것입니다."
 usa_economic_events.380.a: "자금을 받고 통제권을 지킨다"
 usa_economic_events.380.b: "관례적인 지배구조를 받아들인다"
 usa_economic_events.381.t: "소방 호스 매입"
 usa_economic_events.381.d: "유튜브는 설립 2년도 안 되었는데도 지금까지 누구도 호스팅한 적 없는 양의 영상을 제공하고 있으며, 수익은 없고 사방에서 소송을 당하고 있습니다. 요구 가격은 구글 주식으로 16억 5천만 달러이며, 업계를 담당하는 분석가들은 아무도 값을 낼 것이라 입증하지 못한 시청자층에 대한 거품 가격이라 부르고, 저작권 문제만으로도 인수가를 넘어설 수 있다고 지적합니다. 구글 비디오는 이미 존재하지만 지고 있습니다. 대체 서비스를 자체 개발하는 것은 더 싸지만 더 느리며, 그만큼의 시간 동안 시청자층을 내주게 됩니다."
 usa_economic_events.381.a: "소방 호스를 산다"
 usa_economic_events.381.b: "시간이 걸리더라도 자체 개발한다"
 usa_economic_events.382.t: "딥마인드와 최전선"
 usa_economic_events.382.d: "데미스 허사비스가 이끄는 런던의 연구 기업 딥마인드는 아무도 이해하도록 프로그래밍하지 않은 게임을 기계가 배우게 했습니다. 제품도 수익도 없고, 구글이 논의 중인 가격은 연구원 한 명당 수백만 달러에 달하며, 냉정하게 보면 이는 인수의 탈을 쓴 인재 채용입니다. 매각 측은 윤리위원회를 두고 군사 및 감시 업무는 하지 않는다는 조건을 겁니다. 최전선을 향해 달리려면 그 조건을 감수하고 팔 것도 없이 역량 확보에 수년을 더 써야 합니다. 딥마인드가 요구하는 거버넌스 뒤에서 단계적으로 도입하는 편이 더 싸지만, 그것을 받아들이지 않을 쪽에 선두를 넘기게 됩니다."
 usa_economic_events.382.a: "최전선을 향해 질주한다"
 usa_economic_events.382.b: "거버넌스를 전제로 단계적으로 도입한다"
 usa_economic_events.383.t: "국방 계약"
 usa_economic_events.383.d: "국방부는 메이븐 프로젝트에 따라 드론 영상에 대한 머신 비전을 원하고 있으며, 수천 명의 구글 엔지니어가 이를 만들지 않겠다는 서한에 서명했습니다. 이러한 거부를 일회성 양보가 아닌 상설 방침으로 만들기 위한 AI 원칙이 마련되고 있습니다. 메이븐 계약 자체는 작습니다. 그 뒤에 있는 것은 국방부 전체 규모의 100억 달러 클라우드 사업인 JEDI이며, 이 입찰을 담당하는 모든 국방 분석가는 비전 작업을 하지 않으려는 기업은 기밀 인프라에서도 신뢰받지 못할 것이라고 말합니다. 거부하면 둘 다 아직 입찰 중인 경쟁사에 넘겨주게 됩니다."
 usa_economic_events.383.a: "계약을 수주한다"
 usa_economic_events.383.b: "직원들이 그은 선을 지킨다"
 usa_economic_events.384.t: "주권적 컴퓨팅 스택"
 usa_economic_events.384.d: "엔비디아의 가속기는 업계의 모든 학습 작업에 대한 제약 조건이며 물량은 관계에 따라 배급되고, 이에 힘입어 회사의 기업 가치는 5월에 1조 달러를 넘어섰습니다. 표준적인 조언은 그래도 구글이 구매하라는 것입니다. 업계 전체가 기반으로 삼아 작성된 소프트웨어인 CUDA는 엔비디아의 것이며, 맞춤형 반도체는 스택을 이식하고 컴파일러를 영구히 유지해야 함을 뜻하기 때문입니다. 최전선이 지금 요구하는 규모로 자체 가속기를 설계하려면 쓸 만한 부품이 나오기 전까지 수년의 시간과 수십억 달러가 듭니다. 구매하면 돈은 지키되 의존도 함께 유지됩니다."
 usa_economic_events.384.a: "자체 가속기를 설계한다"
 usa_economic_events.384.b: "외부 공급업체에서 구매한다"
 usa_economic_events.385.t: "최전선은 누구의 것인가"
 usa_economic_events.385.d: "구글이 무엇을 쫓고 무엇을 소유할지 결정해 온 사반세기가 이 문제를 매듭지었습니다. 최첨단 연구를 자체적으로 수행했는지 인수로 들여왔는지, 그리고 그것이 구동되는 기계가 구글 자체 실리콘인지 엔비디아에서 빌린 것인지가 이제 미국의 인공지능이 어디에서 만들어지며 누가 거부권을 행사할 수 있는지에 대한 답의 전부가 되었습니다."
 usa_economic_events.385.a: "최첨단 컴퓨팅 강자"
 usa_economic_events.385.b: "최첨단 세입자"
 usa_economic_events.385.c: "통제되는 스택"
 usa_economic_events.385.e: "신중한 플랫폼"
 USA_google_frontier_compute_power: "최첨단 컴퓨팅 강자"
 USA_google_frontier_compute_power_desc: "모델은 누구도 도달하지 못한 한계에서, 같은 건물 안에서 설계된 가속기 위에서 훈련됩니다. 컴퓨팅의 가격을 정하는 것도, 언제 이용할 수 있는지를 결정하는 것도 오직 구글뿐입니다."
 USA_google_frontier_tenant: "최첨단 세입자"
 USA_google_frontier_tenant_desc: "연구는 세계적 수준이지만 그것이 구동되는 기계는 남의 것입니다. 모든 성능 향상은 실재하지만 그 모두가 빌린 것입니다."
 USA_google_governed_stack: "통제되는 스택"
 USA_google_governed_stack_desc: "실리콘은 자체 소유이며 배치는 느리고, 검토를 거치며, 방어 가능합니다. 어떤 성능에서도 최초가 될 수는 없겠지만 한 번도 성능을 철회해야 했던 적도 없습니다."
 USA_google_cautious_platform: "신중한 플랫폼"
 USA_google_cautious_platform_desc: "최첨단도 파운드리도 아닙니다. 제품은 신중하고 컴퓨팅은 구매하며, 기업은 남들이 만들 수 없는 것을 만드는 능력이 아니라 유통망으로 경쟁합니다."
 usa_economic_events.390.t: "모토로라는 누구를 위한 기업인가"
 usa_economic_events.390.d: "모토로라의 위성전화 사업인 이리듐이 파산으로 무너지면서 회사의 평판도 상당 부분 함께 무너졌습니다. 남은 것은 경찰, 소방, 군대가 끊임없이 구매하는 무전기 사업과 매년 모든 고객을 처음부터 다시 얻어야 하는 소비자용 단말기 사업입니다. 모토로라의 최우선 과제가 될 수 있는 것은 둘 중 하나뿐입니다."
 usa_economic_events.390.a: "공공 안전 무전기를 중심으로 재편한다"
 usa_economic_events.390.b: "소비자 시장을 추구한다"
 usa_economic_events.391.t: "실리콘 사업 분사"
 usa_economic_events.391.d: "모토로라는 대부분의 경쟁사가 생겨나기도 전부터 자체 칩을 만들어 왔으며, 이제 반도체 제조 사업은 단말기 부문이 원하는 자본을 소모하고 있습니다. 분사하면 자금이 확보되고 양쪽 모두 자유로워집니다. 유지한다면 감당하지 못할 수도 있는 소비자 사업의 수익으로 공장 비용을 치러야 합니다."
 usa_economic_events.391.a: "반도체 부문을 분사한다"
 usa_economic_events.391.b: "공장을 가족 안에 둔다"
 usa_economic_events.392.t: "유리 화면"
 usa_economic_events.392.d: "한 컴퓨터 회사가 키패드 없는 전화기를 내놓았고 시장은 그쪽을 선호하기로 결정했습니다. 모토로라는 검색 회사가 무료로 배포하는 운영체제를 채택할 수 있습니다. 빠르고 공짜이지만 남의 것입니다. 아니면 수년의 시간과 막대한 자금을 들여 자사가 통제하는 플랫폼을 만들 수도 있습니다."
 usa_economic_events.392.a: "무료 플랫폼을 채택한다"
 usa_economic_events.392.b: "우리가 통제하는 플랫폼에 투자한다"
 usa_economic_events.393.t: "이름의 분리"
 usa_economic_events.393.d: "모토로라의 무전기 사업과 단말기 사업은 브랜드와 대차대조표를 공유할 뿐 그 밖에는 거의 아무것도 공유하지 않습니다. 이를 모토로라 솔루션즈와 모토로라 모빌리티로 분리하면 각자 자기 기준으로 평가받을 수 있고, 약한 쪽이 무너지더라도 다른 쪽이 함께 쓰러지지 않습니다. 함께 유지하면 두 부문이 여전히 의지하는 규모와 이름이 보존됩니다."
 usa_economic_events.393.a: "솔루션즈와 모빌리티를 분리한다"
 usa_economic_events.393.b: "모토로라를 온전히 유지한다"
 usa_economic_events.394.t: "특허 회사"
 usa_economic_events.394.d: "구글은 모토로라 모빌리티를 원하며, 실제로 사들이려는 것은 서류 캐비닛입니다. 안드로이드를 상대로 소송을 제기하는 모든 이들에 맞서 이를 방어할 수 있게 해 줄 약 1만 7천 건의 특허입니다. 수년간 승리하지 못한 단말기 제조사에 125억 달러는 후한 가격입니다. 이를 거부하면 그 사업을 우리 손으로 유지할 자금을 찾아야 합니다."
 usa_economic_events.394.a: "매각을 허용한다"
 usa_economic_events.394.b: "모빌리티를 미국 소유로 유지한다"
 usa_economic_events.395.t: "샴버그에 남은 것"
 usa_economic_events.395.d: "모토로라의 어느 절반이 중요한지를 결정해 온 사반세기가 미국이 통신 분야에서 여전히 무엇을 제조하는지, 그리고 무전기가 반드시 작동해야 할 때 누가 책임지는지를 매듭지었습니다."
 usa_economic_events.395.a: "통합 통신 거대 기업"
 usa_economic_events.395.b: "실리콘과 안전"
 usa_economic_events.395.c: "버려진 단말기 브랜드"
 usa_economic_events.395.e: "공공 안전 인프라 기업"
 USA_motorola_integrated_communications_giant: "통합 통신 거대 기업"
 USA_motorola_integrated_communications_giant_desc: "반도체 공장, 무전기, 단말기가 한 지붕 아래 남았으며, 이는 현실에서 어떤 미국 통신 기업도 해내지 못한 일입니다. 특화된 경쟁사들 어느 곳보다 느리지만 그중 어느 하나에도 의존하지 않습니다."
 USA_motorola_silicon_and_safety: "실리콘과 안전"
 USA_motorola_silicon_and_safety_desc: "소비자 사업은 떠났고 까다로운 부분이 남았습니다. 국내에서 생산되는 칩과 응급 서비스가 없이는 운영할 수 없는 암호화 네트워크입니다. 누구도 자발적으로 이를 사지는 않지만 모두가 사고 있습니다."
 USA_motorola_orphaned_handset_brand: "버려진 단말기 브랜드"
 USA_motorola_orphaned_handset_brand_desc: "반도체 공장은 팔렸고 휴대전화는 남았으며, 그 결과 소비자용 하드웨어 설계사가 다른 모두와 같은 공급업체에서 실리콘을 사 오게 되었습니다. 그 이름은 기억하는 사람들에게는 여전히 의미가 있습니다."
 USA_motorola_public_safety_utility: "공공 안전 인프라 기업"
 USA_motorola_public_safety_utility_desc: "가격으로 경쟁하던 모든 것은 사라졌고, 남은 것은 소방관의 어깨에 걸린 무전기와 그 뒤의 네트워크입니다. 느리게 성장하고 거의 언급되지 않지만, 어떤 미국 기관도 이것 없이는 기능할 수 없습니다."
 usa_economic_events.400.t: "시정 조치 단계"
 usa_economic_events.400.d: "연방 법원은 마이크로소프트가 반독점법을 위반했다고 판단하고 운영체제 사업과 응용프로그램 사업을 분리하도록 명령했습니다. 워싱턴은 항소를 거쳐 구조적 시정 조치를 밀어붙이거나, 행위 규제에 합의하고 회사를 온전히 놓아둘 수 있습니다. 한쪽은 문제를 끝내고, 다른 쪽은 미국 소프트웨어 산업을 재편합니다."
 usa_economic_events.400.a: "행위 시정 조치로 합의한다"
 usa_economic_events.400.b: "항소를 통해 기업 분할을 밀어붙인다"
 usa_economic_events.401.t: "검색에 440억 달러"
 usa_economic_events.401.d: "마이크로소프트는 검색 회사에 440억 달러를 제시했습니다. 광고 수익이 몰린 곳이 검색이며 자사에는 그 수익이 전혀 없기 때문입니다. 쇠퇴하는 사업에 대한 가격으로는 터무니없습니다. 입찰이 무산되도록 두면 시장을 내주고 다음 시장을 다른 곳에서 찾아야 합니다."
 usa_economic_events.401.a: "입찰이 무산되도록 둔다"
 usa_economic_events.401.b: "도전자를 인수한다"
 usa_economic_events.402.t: "애저, 정식 출시"
 usa_economic_events.402.d: "애저는 이제 실재하는 제품이며, 마이크로소프트가 이를 성공시키기 위해 쓰는 모든 달러는 회사를 일으킨 윈도우와 오피스 라이선스를 더 이상 사지 말라고 고객을 설득하는 달러입니다. 헌신한다는 것은 주력 사업을 일부러 잠식한다는 뜻입니다. 데스크톱을 지키면 이윤은 유지되지만 이 10년은 다른 누군가의 것이 됩니다."
 usa_economic_events.402.a: "클라우드에 전념한다"
 usa_economic_events.402.b: "데스크톱 주력 사업을 방어한다"
 usa_economic_events.403.t: "스택 열기"
 usa_economic_events.403.d: "신임 최고경영자는 마이크로소프트가 20년 동안 파괴하려 애써 온 운영체제용 소프트웨어를 내놓고, 비판자들이 코드를 보관하는 곳까지 사들이기를 원합니다. 이는 회사가 처음부터 펼쳐 온 논리를 포기하는 일이 됩니다. 거부하면 교리와 이미 떠난 고객들이 그대로 남습니다."
 usa_economic_events.403.a: "스택을 연다"
 usa_economic_events.403.b: "독점 노선을 고수한다"
 usa_economic_events.404.t: "오픈AI에 거는 도박"
 usa_economic_events.404.d: "수익이 없는 연구소가 수십억 달러와 마이크로소프트 데이터센터의 독점 사용을 원하며, 그 대가로 마이크로소프트는 그들이 만드는 모든 것에 최우선으로 접근하게 됩니다. 회사가 남의 인력에 건 가장 큰 도박입니다. 같은 역량을 내부에서 구축하는 편이 더 느리고 저렴하며 전적으로 우리 것입니다."
 usa_economic_events.404.a: "연구소에 건다"
 usa_economic_events.404.b: "모델을 자체 개발한다"
 usa_economic_events.405.t: "레드먼드가 매듭지은 것"
 usa_economic_events.405.d: "마이크로소프트가 무엇을 소유하고 무엇을 빌릴지 결정해 온 사반세기가 미국 기업 컴퓨팅이 어디에서 구동되는지, 누가 그 위의 모델을 훈련했는지, 그리고 누구의 데이터센터에 의존하는지를 매듭지었습니다."
 usa_economic_events.405.a: "제휴 하이퍼스케일러"
 usa_economic_events.405.b: "통합 모델 스택"
 usa_economic_events.405.c: "라이선스 지능"
 usa_economic_events.405.e: "주권적 데스크톱"
 USA_microsoft_partnered_hyperscaler: "제휴 하이퍼스케일러"
 USA_microsoft_partnered_hyperscaler_desc: "데이터센터는 마이크로소프트의 것이지만 그 안을 채우는 연구소는 그렇지 않습니다. 최첨단에 대한 최우선 접근권은 있으나 최종 결정권은 없으며, 이는 막대한 이점인 동시에 누구도 가격을 매기지 못한 의존성입니다."
 USA_microsoft_integrated_model_stack: "통합 모델 스택"
 USA_microsoft_integrated_model_stack_desc: "컴퓨팅과 모델을 모두 자체 구축했으며, 시간이 더 걸렸지만 누구에게도 책임지지 않습니다. 실리콘 임대부터 위로 모든 계층이 하나의 지붕과 하나의 이사회 아래에 있습니다."
 USA_microsoft_licensed_intelligence: "라이선스 지능"
 USA_microsoft_licensed_intelligence_desc: "모델은 파트너에게서, 그것이 구동되는 기계는 경쟁자에게서 왔습니다. 마이크로소프트는 지능을 이루는 어느 절반도 소유하지 않은 채 이를 판매하며, 이는 계약 조건이 유지되는 동안에만 작동합니다."
 USA_microsoft_sovereign_desktop: "주권적 데스크톱"
 USA_microsoft_sovereign_desktop_desc: "주력 사업은 방어되었고 최첨단은 다른 이들에게 넘어갔습니다. 수억 대의 기계에서 구동되는 것은 여전히 마이크로소프트의 것이고 여전히 라이선스 제품이지만, 더 이상 흥미로운 일이 벌어지는 곳은 아닙니다."
 usa_economic_events.410.t: "메가헤르츠 논쟁"
 usa_economic_events.410.d: "인텔의 펜티엄 4는 단 하나의 숫자를 끌어올리기 위해 만들어졌습니다. 넷버스트 파이프라인은 사이클당 작업량을 줄여 클록 여유를 얻기 때문에, 같은 주파수에서는 대체한 펜티엄 III에도 밀릴 수 있으며 AMD의 애슬론은 이겨야 할 벤치마크를 가져가고 있습니다. 그러나 메가헤르츠 수치가 판매 논리의 전부인 매대에서는 그 어느 것도 중요하지 않으며, 업계의 중론은 공정이 허락하는 한 인텔이 그 숫자를 계속 올려야 한다는 것입니다. 반론은 하이파에 있는 인텔 자체 설계팀에서 나옵니다. 그들은 마케팅 전쟁을 아예 포기하는 대신 사람들이 실제로 들고 다니는 기기를 석권할 저전력 코어를 개발하고 있습니다."
 usa_economic_events.410.a: "주파수 곡선을 따라간다"
 usa_economic_events.410.b: "와트당 성능을 위해 설계한다"
 usa_economic_events.411.t: "플랫폼이 된 센트리노"
 usa_economic_events.411.d: "모바일 프로세서는 단독으로 팔 때보다 인텔 자체 칩셋 및 무선 실리콘과 묶어 팔 때 더 잘 팔립니다. 묶음을 하나의 플랫폼으로 판매하면 노트북 제조사를 묶어 두고 부품 경쟁사를 몰아낼 수 있습니다. 부품을 따로 판매하면 시장은 열려 있지만 이윤은 얇아집니다."
 usa_economic_events.411.a: "통합 플랫폼을 판매한다"
 usa_economic_events.411.b: "부품 시장을 열어 둔다"
 usa_economic_events.412.t: "위원회의 조건"
 usa_economic_events.412.d: "연방 규제 당국은 수년간 인텔이 프로세서를 구매하는 제조사들, 그리고 소켓을 놓고 경쟁하는 경쟁사들과 맺은 거래를 조사해 왔습니다. 합의는 합의된 행위 규칙으로 조사를 끝냅니다. 대신 기술 인터페이스를 공개하면 규제 당국이 요구한 것보다 더 많이 양보하게 되지만 다음 고발의 여지를 없앨 수 있습니다."
 usa_economic_events.412.a: "행위 규칙으로 합의한다"
 usa_economic_events.412.b: "기술 인터페이스를 공개한다"
 usa_economic_events.413.t: "또다시 지연되는 공정"
 usa_economic_events.413.d: "인텔의 차세대 제조 노드는 분기 단위가 아니라 해 단위로 늦어지고 있으며, AMD는 대만 TSMC에서 인텔이 따라잡을 수 없는 공정으로 만든 부품을 출하하고 있습니다. 공정을 내부에서 구제하려면 성공이 보장되지 않는 막대한 비용이 듭니다. 우리를 앞선 파운드리에서 생산 능력을 사 오는 것은 제조 우위가 사라졌음을 인정하되 제품 경쟁력은 유지하는 길입니다."
 usa_economic_events.413.a: "공정 구제에 자금을 투입한다"
 usa_economic_events.413.b: "최첨단 공정을 외부에서 구매한다"
 usa_economic_events.414.t: "타인을 위한 제조"
 usa_economic_events.414.d: "신임 최고경영자는 인텔이 경쟁 상대를 위해서도 칩을 만들기를 원하며, 이는 공장을 외부 고객에게 책임지는 사업으로 운영한다는 뜻입니다. 회사 역사상 가장 큰 자본 투입이며 제품 로드맵을 공장에 종속시킵니다. 제품을 우선하면 공장은 전속으로 남고 전략도 익숙하게 유지됩니다."
 usa_economic_events.414.a: "공장을 외부 고객에게 개방한다"
 usa_economic_events.414.b: "공장을 제품에 전속시킨다"
 usa_economic_events.415.t: "공적 주주"
 usa_economic_events.415.d: "워싱턴은 반도체 지원금을 지분으로 전환할 의사가 있으며, 이는 연방정부를 인텔의 최대 주주 중 하나로 만들 것입니다. 수락하면 회사는 국가 산업 자산이 되고 이사회는 시장 이상의 대상에게 책임을 지게 됩니다. 거부하면 소유권은 민간에 남고 보조금은 조건부로 유지됩니다."
 usa_economic_events.415.a: "연방 정부의 지분을 수락한다"
 usa_economic_events.415.b: "공공 소유를 거부한다"
 usa_economic_events.416.t: "인텔이 된 것"
 usa_economic_events.416.d: "클록 속도, 플랫폼, 놓친 노드, 공공 자금으로 점철된 사반세기가 인텔이 여전히 미국에서 최첨단 실리콘을 제조하는지, 그리고 그렇게 하는 회사를 누가 소유하는지를 매듭지었습니다."
 usa_economic_events.416.a: "공장 없는 아키텍처 하우스"
 usa_economic_events.416.b: "국가 실리콘 무기고"
 usa_economic_events.416.c: "통합 컴퓨팅 파운드리"
 usa_economic_events.416.e: "개방형 시스템 파운드리"
 USA_intel_domestic_silicon_arsenal: "국내 실리콘 무기고"
 USA_intel_domestic_silicon_arsenal_desc: "최첨단 제품은 미국 땅에서 제조되며 대중이 이를 수행하는 회사의 지분을 보유합니다. 생산 능력은 상업적 자산이기 이전에 전략 자산이며, 그에 맞게 가격이 매겨집니다."
 USA_intel_integrated_compute_foundry: "통합 컴퓨팅 파운드리"
 USA_intel_integrated_compute_foundry_desc: "공장은 인텔뿐 아니라 외부 고객을 위해서도 생산하므로, 하나의 로드맵을 기다리지 않고 스스로 밥값을 합니다. 설계와 제조를 한 지붕 아래 두는 이점은 그 지붕이 열릴 때 다시 한번 결실을 맺습니다."
 USA_intel_open_systems_foundry: "개방형 시스템 파운드리"
 USA_intel_open_systems_foundry_desc: "공개된 인터페이스와 개방된 노드는 플랫폼을 다른 이들이 라이선스를 받아야만 쓰는 것이 아니라 그 위에 구축할 수 있는 것으로 만들었습니다. 이윤은 얇아졌지만 생태계는 훨씬 커졌습니다."
 USA_intel_fabless_architecture_house: "팹리스 아키텍처 하우스"
 USA_intel_fabless_architecture_house_desc: "설계는 여전히 인텔의 것이고 웨이퍼는 남의 것입니다. 자본 부담에서 벗어난 회사는 아키텍처만으로 경쟁하며, 자신이 통제하지 못하는 파운드리에 의존합니다."
 usa_economic_events.440.a: "책임 있는 데이터 활용을 중심으로 파운드리를 구축한다"
 usa_economic_events.440.b: "공공 임무에 맞게 파운드리를 조정한다"
 usa_economic_events.440.c: "파운드리를 상업 산업 전반으로 확대한다"
 usa_economic_events.440.d: "크레디트 스위스는 2013년부터 규정 준수와 시장 위험을 분석하기 위해 파운드리를 사용하기 시작했고, 퍼스트 데이터는 기술 전환 과정에서 팔란티어 소프트웨어를 사용했습니다. 상업 기관들은 팔란티어의 데이터 운영 모델에 있어 하나의 독자적인 시장이 되고 있습니다."
 usa_economic_events.440.d_option: "고객의 조달 독립성을 보존한다"
 usa_economic_events.440.t: "산업에 진출한 파운드리"
 usa_economic_events.441.a: "책임 있는 소프트웨어 획득을 요구한다"
 usa_economic_events.441.b: "판결 이후 정부와의 통합을 심화한다"
 usa_economic_events.441.c: "승리를 상업적 확장으로 전환한다"
 usa_economic_events.441.d: "연방순회항소법원은 육군이 DCGS-A2 맞춤 개발을 추진하기 전에 상용 대안에 대한 충분한 시장 조사를 수행하지 않았다는 판단을 유지했습니다. 팔란티어의 승리는 경쟁과 공급업체 의존성을 염두에 두면서도 검증된 소프트웨어를 구매해야 한다는 주장에 힘을 실어 줍니다."
 usa_economic_events.441.d_option: "상용 소프트웨어의 경쟁을 수호한다"
 usa_economic_events.441.t: "상용 소프트웨어의 승리"
 usa_economic_events.442.a: "상장과 함께 배치 감독을 병행한다"
 usa_economic_events.442.b: "상장을 정부 사업 확대에 활용한다"
 usa_economic_events.442.c: "상업 확장을 위해 팔란티어를 상장한다"
 usa_economic_events.442.d: "팔란티어의 A종 주식이 직접 상장을 통해 뉴욕 증권거래소에서 거래되기 시작했습니다. 회사가 정부 임무 사업과 상업적 성장 사이에서 균형을 잡는 가운데, 공개 시장의 유동성과 감시가 함께 찾아옵니다."
 usa_economic_events.442.d_option: "조달 관계의 독립성을 유지한다"
 usa_economic_events.442.t: "직접 상장"
 usa_economic_events.443.a: "티베리우스를 공적 책임 아래 개방한다"
 usa_economic_events.443.b: "티베리우스를 연방 배포 체계에 내장한다"
 usa_economic_events.443.c: "물류 플랫폼을 상업화한다"
 usa_economic_events.443.d: "팔란티어의 티베리우스는 연방 및 주 계획 담당자를 위해 공공과 민간의 백신 데이터를 통합하여 배정부터 인도와 접종까지 가시성을 제공합니다. 공통 작전 상황도는 전국 규모의 배포를 조율할 수 있으며, 접근 통제와 공적 감독을 운영 설계의 일부로 만듭니다."
 usa_economic_events.443.d_option: "관할 지역별 조달 독립성을 보존한다"
 usa_economic_events.443.t: "배포를 조율하는 티베리우스"
 usa_economic_events.444.a: "데이터 패브릭을 투명하게 운영한다"
 usa_economic_events.444.b: "고섬을 육군 데이터 패브릭으로 배치한다"
 usa_economic_events.444.c: "패브릭을 상업 고객에 맞게 조정한다"
 usa_economic_events.444.d: "육군은 여러 보안 등급에 걸친 전 세계 연합형 정보 데이터 패브릭과 분석 기반을 구축할 업체로 팔란티어를 선정했습니다. 고섬은 역량 드롭 2가 실전 투입으로 나아가는 동안 시험과 배치를 지원할 것입니다."
 usa_economic_events.444.d_option: "아키텍처가 조달에 중립을 유지하게 한다"
 usa_economic_events.444.t: "육군 데이터 패브릭"
 usa_economic_events.445.a: "시제품을 책임 있는 시험에 부친다"
 usa_economic_events.445.b: "TITAN을 육군 표적 지정 체계와 통합한다"
 usa_economic_events.445.c: "센서 융합 플랫폼을 상업화한다"
 usa_economic_events.445.d: "육군은 팔란티어와 레이시온에 각각 3천 6백만 달러 규모의 정액 계약 과업을 발주하여 TITAN 첨단형 시제품을 제작하게 했습니다. 경쟁하는 두 체계는 센서 데이터를 통합하고 병사들의 피드백을 받아 시험을 거친 뒤 한 업체가 선정될 것입니다."
 usa_economic_events.445.d_option: "시제품 제작을 통해 경쟁을 유지한다"
 usa_economic_events.445.t: "TITAN 시제품 수주"
 usa_economic_events.446.a: "AIP 배치에 책임성을 부여한다"
 usa_economic_events.446.b: "AIP를 정부 작전에 통합한다"
 usa_economic_events.446.c: "AIP를 기업 고객 전반으로 확대한다"
 usa_economic_events.446.d: "팔란티어는 파운드리 안에 AIP를 도입하여 대규모 언어 모델을 운영 데이터, 접근 통제, 기업 업무 흐름과 결합하고 있습니다. 조기 접근은 AI를 고객의 의사 결정에 끌어들이며, 보안과 거버넌스는 배치의 일부가 됩니다."
 usa_economic_events.446.d_option: "배치 전반에서 고객의 선택권을 보호한다"
 usa_economic_events.446.t: "기업에 진출한 AIP"
 usa_economic_events.447.a: "NHS 플랫폼을 공적 안전장치에 결속시킨다"
 usa_economic_events.447.b: "플랫폼을 NHS 운영 전반에 통합한다"
 usa_economic_events.447.c: "이번 수주를 통해 상업용 의료 소프트웨어를 확대한다"
 usa_economic_events.447.d: "잉글랜드 NHS는 공개 경쟁 입찰을 거쳐 팔란티어가 이끄는 컨소시엄에 연합 데이터 플랫폼 제공을 위한 7년 계약을 수여했습니다. 이 플랫폼은 기존 데이터를 연결하여 진료 조정, 대기자 명단 관리, 자원 계획에 활용되며, 개인정보 보호와 책임성에 대한 기대가 한층 높아진 상황입니다."
 usa_economic_events.447.d_option: "NHS의 조달 독립성을 보존한다"
 usa_economic_events.447.t: "NHS 연합 데이터 플랫폼"
 usa_economic_events.448.a: "TITAN에 책임성 안전장치를 부과한다"
 usa_economic_events.448.b: "육군 주계약자로서 TITAN을 주도한다"
 usa_economic_events.448.c: "TITAN의 플랫폼 모델을 상업적으로 응용한다"
 usa_economic_events.448.d: "육군은 경쟁적 시제품 제작을 거쳐 팔란티어를 선정하고 TITAN 시제품 10대에 대한 1억 7천 840만 달러 규모의 3단계 협약을 수여했습니다. 우선 공급업체이자 주계약자로서 회사는 다영역 센서 데이터를 처리하기 위한 고급형과 기본형을 통합할 것입니다."
 usa_economic_events.448.d_option: "시제품 생태계의 경쟁을 유지한다"
 usa_economic_events.448.t: "TITAN 주계약"
 usa_economic_events.449.a: "메이븐 배치를 투명하게 운영한다"
 usa_economic_events.449.b: "메이븐을 국방 작전 전반으로 확대한다"
 usa_economic_events.449.c: "메이븐 통합을 상업적 규모로 전환한다"
 usa_economic_events.449.d: "육군은 팔란티어에 메이븐 스마트 시스템 시제품에 대한 4억 8천만 달러 규모의 정액 계약을 수여하여, 임무 소프트웨어를 AI 기반 정보 및 작전 전반으로 확장했습니다. 이 규모는 팔란티어의 국방 분야 역할과 통합 플랫폼에 대한 정부의 의존을 심화시킵니다."
 usa_economic_events.449.d_option: "임무 소프트웨어를 둘러싼 경쟁을 유지한다"
 usa_economic_events.449.t: "메이븐 프로젝트 확대"
 usa_economic_events.450.a: "국방 운영체제가 된다"
 usa_economic_events.450.b: "이중 용도 운영 플랫폼을 구축한다"
 usa_economic_events.450.c: "책임 있는 공공 데이터 인프라를 구축한다"
 usa_economic_events.450.d: "육군의 전사 계약은 팔란티어의 상용 제품에 대한 75건의 계약을 하나의 틀로 통합하며, 이행 기간은 최대 10년, 상한은 100억 달러입니다. 이 구조는 물량 할인과 신속한 접근을 약속하는 한편, 국방, 민간, 상업 시장 전반에 걸친 팔란티어의 입지를 결정적인 것으로 만듭니다."
 usa_economic_events.450.d_option: "상업용 AI 플랫폼에 집중한다"
 usa_economic_events.450.t: "육군 전사 협약"
 usa_economic_events.460.t: "벼랑 끝의 AIG"
 usa_economic_events.460.d: "오늘 아침 신용평가사 세 곳이 모두 AIG의 등급을 강등했고, 뒤이은 담보 추가 요구로 이 보험사는 파산까지 몇 시간밖에 남지 않았습니다. 은행도 아니고 정리 절차를 적용할 수도 없으며, 금융 시스템의 절반이 보유한 파생상품 계약의 반대편에 서 있습니다."
 usa_economic_events.460.a: "긴급 지원을 승인한다"
 usa_economic_events.460.b: "민간 컨소시엄을 모색한다"
 usa_economic_events.460.c: "AIG를 쓰러지게 둔다"
 usa_economic_events.462.t: "연방의 구제"
 usa_economic_events.462.d: "뉴욕 연방준비은행은 징벌적 조건으로 AIG의 자산을 담보로 대출해 줄 것입니다. 워싱턴이 그 대가로 무엇을 요구하느냐에 따라 이것이 민간 기업에 대한 대출인지, 아무도 그렇게 부르지 않을 국유화인지가 결정됩니다."
 usa_economic_events.462.a: "지분을 확보한다"
 usa_economic_events.462.b: "징벌적 조건으로만 대출한다"
 usa_economic_events.463.t: "무질서한 파산"
 usa_economic_events.463.d: "AIG가 파산을 신청했습니다. 산하 보험 자회사들은 주 규제 당국에 의해 압류되고 있고, 증권 대여 거래 상대방들은 모든 것을 한꺼번에 회수하고 있으며, AIG의 어음을 보유한 머니마켓펀드는 원금 보장이 깨지고 있습니다."
 usa_economic_events.463.a: "전이를 차단한다"
 usa_economic_events.463.b: "시장이 정리하도록 둔다"
 usa_economic_events.464.t: "계속 말라붙는 유동성"
 usa_economic_events.464.d: "구제는 시간을 벌어 주었을 뿐 그 이상은 아니었습니다. 진짜 구멍은 증권 대여 장부입니다. 현금 담보가 아무도 가격을 매기려 하지 않는 모기지 증권에 재투자되었고, 거래 상대방들은 지금 당장 현금을 돌려받기를 원합니다."
 usa_economic_events.464.a: "증권 대여 장부를 추적한다"
 usa_economic_events.465.t: "증권 차입 창구"
 usa_economic_events.465.d: "뉴욕 연방준비은행은 AIG의 보험 자회사들로부터 투자 등급 증권을 빌리고 현금 담보를 돌려줄 수 있습니다. 당장의 인출 사태는 멈추지만 인출 사태가 시작된 이유는 해결하지 못합니다."
 usa_economic_events.465.a: "증권 창구를 연다"
 usa_economic_events.465.b: "추가 대출을 거부한다"
 usa_economic_events.466.t: "지원 패키지 재편"
 usa_economic_events.466.d: "원래의 조건은 이제 정부가 소유한 회사를 짓누르고 있으며, 이자가 사업의 상환 속도보다 빠르게 대출 한도를 잠식하고 있습니다. 재무부가 자본을 주입하고 연준이 스프레드를 낮추어 만기를 연장하게 할 수 있습니다."
 usa_economic_events.466.a: "패키지를 재편한다"
 usa_economic_events.466.b: "원래의 조건을 유지한다"
 usa_economic_events.467.t: "메이든 레인 III"
 usa_economic_events.467.d: "특수목적법인이 AIG의 신용부도스와프 기초가 되는 부채담보부증권을 매입하고 계약을 파기하여 담보 악순환을 영구히 끝낼 수 있습니다. 이 증권에 얼마를 지불하느냐가 핵심 쟁점입니다."
 usa_economic_events.467.a: "시장가로 지불하고 스와프를 종료한다"
 usa_economic_events.467.b: "양보를 요구한다"
 usa_economic_events.468.t: "거래 상대방 협상"
 usa_economic_events.468.d: "거래 상대방들은 법적으로 전액을 받을 권리가 있는 계약에 대해 자발적으로 상각을 받아들이도록 요청받았습니다. 한 곳은 조건부로 응할 의사를 밝혔고, 나머지는 우리가 그들에게 강제할 수 없다고 지적했습니다."
 usa_economic_events.468.a: "액면가 수준으로의 후퇴를 수용한다"
 usa_economic_events.468.b: "부분적 양보를 장부에 반영한다"
 usa_economic_events.469.t: "메이든 레인 II"
 usa_economic_events.469.d: "두 번째 특수목적법인이 증권 대여 포트폴리오에서 주거용 모기지담보부증권을 매입하여 프로그램을 영구히 종료할 수 있습니다. 하지만 이는 10월의 창구를 수년간 관리해야 하는 다른 것으로 대체하기도 합니다."
 usa_economic_events.469.a: "RMBS 포트폴리오를 이전한다"
 usa_economic_events.469.b: "프로그램을 현 상태로 청산한다"
 usa_economic_events.470.t: "누가 돈을 받았나"
 usa_economic_events.470.d: "의회는 AIG 구제가 실제로 보호한 기관들의 명단을 요구하고 있으며, 그중 대략 절반은 외국 은행입니다. 뉴욕 연방준비은행의 입장은 공개가 거래 상대방과 우리가 여전히 보유한 특수목적법인에 손해를 끼친다는 것입니다."
 usa_economic_events.470.a: "거래 상대방을 공개한다"
 usa_economic_events.470.b: "공개를 연기한다"
 usa_economic_events.471.t: "유지 보너스"
 usa_economic_events.471.d: "스와프를 설계한 부서인 AIG 금융상품은 계약상 1억 6천 5백만 달러의 유지 보너스를 지급할 의무가 있습니다. 이 계약들은 구제 이전의 것이며, 지금 그에 구속되는 것은 우리가 소유한 회사입니다."
 usa_economic_events.471.a: "계약을 이행한다"
 usa_economic_events.471.b: "회수할 수 있는 만큼 환수한다"
 usa_economic_events.472.t: "구조조정과 자산 매각"
 usa_economic_events.472.d: "AIG는 아시아 생명보험 사업, 항공기 리스사, 소비자 금융 부문처럼 매각 가능한 조각들로 분할되고 있습니다. 얼마나 빨리 매각하느냐가 납세자가 되돌려받는 몫을 결정합니다."
 usa_economic_events.472.a: "체계적으로 자산을 매각한다"
 usa_economic_events.472.b: "가능한 한 빨리 철수한다"
 usa_economic_events.473.t: "AIG에서 손을 뗀 연준"
 usa_economic_events.473.d: "뉴욕 연방준비은행의 지원금은 전액 상환될 수 있고 회전 대출 한도는 종료되어, 재무부는 시장에 매각할 수 있는 보통주를 보유하게 됩니다. 메이든 레인 법인들은 장부가를 웃도는 실적을 내고 있습니다."
 usa_economic_events.473.a: "전액 상환을 수락한다"
 usa_economic_events.473.b: "대출 한도를 더 연장한다"
 usa_economic_events.474.t: "재무부 지분 매각 완료"
 usa_economic_events.474.d: "AIG 보통주의 마지막 물량이 매각되어 정부 지분은 사라졌습니다. 이 구제가 무엇으로 기억될지, 그리고 다음 시스템상 중요한 파산에 어떤 선례를 남길지는 이제 정해졌습니다."
 usa_economic_events.474.a: "채권자 베일인 선례"
 usa_economic_events.474.b: "납세자의 명예 회복"
 usa_economic_events.474.c: "질서 있는 정리 체제"
 usa_economic_events.474.d_option: "청산주의 선례"
 usa_economic_events.474.e: "도덕적 해이 합의"
 USA_aig_taxpayer_vindication: "납세자의 명예 회복"
 USA_aig_taxpayer_vindication_desc: "AIG에 투입한 자금은 전액 상환되었고 재무부에 이익까지 안겨 주었으며, 이는 2008년에 누구도 예상하지 못한 결과입니다. 국채 차입 비용은 더 낮아지고 법인세 수입은 더 탄탄해졌으며, 행정부는 쌓인 신뢰를 쓸 수 있습니다."
 USA_aig_orderly_resolution_regime: "질서 있는 정리 체제"
 USA_aig_orderly_resolution_regime_desc: "공개와 환수는 시스템상 중요한 기업을 정리할 수 있는 상설 권한으로 전환되었습니다. 차입과 투자 비용은 더 낮아지고 시스템은 눈에 띄게 안정되었으나, 수익률은 다소 얇아졌습니다."
 USA_aig_creditor_bail_in_precedent: "채권자 베일인 선례"
 USA_aig_creditor_bail_in_precedent_desc: "거래 상대방들은 액면가에 못 미치는 금액을 받아들여야 했고, 이제 미국 대형 기관의 모든 채권자는 같은 요구를 다시 받을 가능성을 가격에 반영합니다. 국내 투자를 유도하는 비용은 줄었지만 차입 비용과 해외의 호의는 모두 악화됩니다."
 USA_aig_moral_hazard_settlement: "도덕적 해이 합의"
 USA_aig_moral_hazard_settlement_desc: "시스템은 안정되었고, 거래 상대방들은 전액을 받았으며, 보너스도 지급되었고, 대중은 무슨 일이 벌어졌는지 정확히 알게 되었습니다. 자본 수익과 시장 소득은 강하지만 정치적 자본과 안정도는 그렇지 못합니다."
 USA_aig_liquidationist_precedent: "청산주의 선례"
 USA_aig_liquidationist_precedent_desc: "AIG는 파산하도록 놓아두었고 거래 상대방 네트워크도 함께 무너졌습니다. 차입과 투자 비용이 눈에 띄게 오르고 소비재 공급에 부담이 생겼지만, 어떤 행정부도 다시는 월스트리트를 구제했다는 비난을 받지 않을 것입니다."
 USA_openai_nonprofit_controlled_pbc: "비영리 통제 공익법인"
 USA_openai_nonprofit_controlled_pbc_desc: "오픈AI 그룹은 오픈AI 재단의 통제 아래 공익법인으로 운영됩니다. 이 구조는 상업적 성장을 사명 중심의 거버넌스와 연결하는 동시에 연구소가 일반적인 지분 자본에 접근할 수 있게 해 줍니다."
 USA_openai_scaled_commercial_platform: "대규모 상업 플랫폼"
 USA_openai_scaled_commercial_platform_desc: "오픈AI는 제품 유통, 기업 도입, 신속한 최첨단 투자를 우선시합니다. 폭넓은 도달 범위가 역량 개발에 자금을 대지만, 사명 통제와 안전 거버넌스는 상업적 압력과 경쟁해야 합니다."
 USA_openai_diversified_frontier_consortium: "다각화된 최첨단 컨소시엄"
 USA_openai_diversified_frontier_consortium_desc: "오픈AI는 단일 공급자에 의존하지 않고 자본 및 컴퓨팅 파트너 네트워크를 통해 최첨단 개발을 지원합니다. 다각화는 역량과 협상력을 넓혀 주지만 거버넌스는 더 복잡해집니다."
 USA_openai_safety_governed_laboratory: "안전 통제형 연구소"
 USA_openai_safety_governed_laboratory_desc: "공식적인 안전 거버넌스와 사명 감독이 모델과 통제 장치가 준비될 때까지 배치를 제약합니다. 연구소는 정당성과 독립성을 지키지만 더딘 상업적 확장을 감수합니다."
 USA_anthropic_safety_governed_frontier: "안전 통제형 최첨단"
 USA_anthropic_safety_governed_frontier_desc: "앤트로픽은 모델이 발전함에 따라 최첨단 연구를 공식 거버넌스, 역량 평가, 더 강력한 안전장치와 결합합니다. 이 구조는 연구소가 고성능 시스템을 개발할 능력을 유지하면서도 대중의 신뢰를 지탱합니다."
 USA_anthropic_cloud_aligned_scale: "클라우드 연계 확장"
 USA_anthropic_cloud_aligned_scale_desc: "앤트로픽은 주요 클라우드 공급자와의 깊은 기술 제휴를 통해 최첨단 모델을 개발하고 배포합니다. 긴밀하게 통합된 자본, 가속기, 유통망이 신속한 확장을 뒷받침하지만 그만큼 의존도도 커집니다."
 USA_anthropic_multi_cloud_independence: "멀티 클라우드 독립"
 USA_anthropic_multi_cloud_independence_desc: "앤트로픽은 훈련과 배포를 여러 인프라 파트너에 분산합니다. 이 방식은 협상력과 폭넓은 접근성을 지켜 주지만 최첨단 확장을 더 복잡하게 만듭니다."
 USA_anthropic_cautious_research_laboratory: "신중한 연구소"
 USA_anthropic_cautious_research_laboratory_desc: "앤트로픽은 더 폭넓은 배포에 앞서 연구, 해석 가능성, 안전 통제가 성숙할 수 있도록 상업적 확장을 제한합니다. 연구소는 더 강력한 거버넌스와 대중적 정당성을 얻는 대가로 더딘 최첨단 진전을 감수합니다."
 USA_openai_nonprofit_controlled_pbc_decision: "비영리 통제 구조를 지지한다"
 USA_openai_nonprofit_controlled_pbc_decision_desc: "연구소의 상업 부문이 설립 주체인 비영리 단체에 책임을 지도록 하는 재편을 지원합니다. 연방 정책이 민간 기업의 정관을 좌우할 수는 없지만, 세제, 조달, 반독점 기조는 모두 어떤 구조가 자본 시장과의 접촉에서 살아남는지를 좌우합니다.\n\n§Y결과로 생기는 국가 정신은 365일 동안 지속됩니다. AI 연구소 프로그램은 한 번에 하나만 활성화할 수 있습니다.§!"
 USA_openai_scaled_commercial_platform_decision: "신속한 상업적 확장을 지지한다"
 USA_openai_scaled_commercial_platform_decision_desc: "공격적인 제품 유통과 기업 배포의 길을 터 줍니다. 도달 범위는 어떤 연구 보조금보다 빠르게 역량 개발에 자금을 대며, 정부는 더 이상 유인을 통제하지 못하는 국가 대표 기업을 얻게 됩니다.\n\n§Y결과로 생기는 국가 정신은 365일 동안 지속됩니다. AI 연구소 프로그램은 한 번에 하나만 활성화할 수 있습니다.§!"
 USA_openai_diversified_frontier_consortium_decision: "다각화된 컴퓨팅 컨소시엄을 지지한다"
 USA_openai_diversified_frontier_consortium_decision_desc: "연구소가 훈련 역량을 한 곳이 아닌 여러 자본 및 인프라 파트너에 분산하도록 장려합니다. 다각화는 협상력과 회복력을 가져다주지만, 그 대가로 누구도 한 문장으로 요약할 수 없는 거버넌스 구조를 감수해야 합니다.\n\n§Y결과로 생기는 국가 정신은 365일 동안 지속됩니다. AI 연구소 프로그램은 한 번에 하나만 활성화할 수 있습니다.§!"
 USA_openai_safety_governed_laboratory_decision: "공식 안전 거버넌스를 지지한다"
 USA_openai_safety_governed_laboratory_decision_desc: "연방 정부와의 협력을 평가, 단계적 배포, 실질적 권한을 지닌 감독 위원회에 조건으로 걸어 둡니다. 연구소는 정당성과 독립성을 지키는 대신 가장 먼저 출시하려는 쪽에 상업적 선두를 내줍니다.\n\n§Y결과로 생기는 국가 정신은 365일 동안 지속됩니다. AI 연구소 프로그램은 한 번에 하나만 활성화할 수 있습니다.§!"
 USA_anthropic_safety_governed_frontier_decision: "안전 통제형 최첨단을 지지한다"
 USA_anthropic_safety_governed_frontier_decision_desc: "역량과 안전장치를 함께 확장하고, 평가 기준을 공개하며 이를 지키는 연구소를 지원합니다. 대안보다 느리지만 위원회 앞에서 변호하기는 훨씬 쉽습니다.\n\n§Y결과로 생기는 국가 정신은 365일 동안 지속됩니다. AI 연구소 프로그램은 한 번에 하나만 활성화할 수 있습니다.§!"
 USA_anthropic_cloud_aligned_scale_decision: "단일 클라우드 제휴를 지지한다"
 USA_anthropic_cloud_aligned_scale_decision_desc: "독립성을 내주고 최첨단에 머물 자본과 역량을 얻는, 한 하이퍼스케일 공급자와의 깊은 제휴를 승인합니다. 컴퓨팅은 즉시 확보되지만 협상의 주도권은 파트너에게 있습니다.\n\n§Y결과로 생기는 국가 정신은 365일 동안 지속됩니다. AI 연구소 프로그램은 한 번에 하나만 활성화할 수 있습니다.§!"
 USA_anthropic_multi_cloud_independence_decision: "멀티 클라우드 독립을 지지한다"
 USA_anthropic_multi_cloud_independence_decision_desc: "어느 한 파트너도 조건을 정할 수 없도록 연구소가 경쟁 공급자들에 걸쳐 훈련하고 서비스하도록 유도합니다. 독립에는 비용이 들고 엔지니어링 부담도 실제로 크지만, 회사는 스스로에게만 책임을 집니다.\n\n§Y결과로 생기는 국가 정신은 365일 동안 지속됩니다. AI 연구소 프로그램은 한 번에 하나만 활성화할 수 있습니다.§!"
 USA_anthropic_cautious_research_laboratory_decision: "절제된 연구 프로그램을 지지한다"
 USA_anthropic_cautious_research_laboratory_decision_desc: "연구소를 작고 신중하게 유지하며 제품 경쟁에서 대체로 멀리 두는 것을 지원합니다. 대중의 신뢰와 내부 규율은 온전히 유지되지만 시장 지위는 그렇지 못합니다.\n\n§Y결과로 생기는 국가 정신은 365일 동안 지속됩니다. AI 연구소 프로그램은 한 번에 하나만 활성화할 수 있습니다.§!"
 USA_ai_lab_treasury_15_tt: "국고에 §Y150억§! 이상 보유"
 USA_ai_lab_treasury_20_tt: "국고에 §Y200억§! 이상 보유"
 USA_ai_lab_treasury_25_tt: "국고에 §Y250억§! 이상 보유"
 usa_economic_events.475.a: "엄격한 동의 명령을 부과한다"
 usa_economic_events.475.b: "완화된 명령에 서명한다"
 usa_economic_events.475.d: "D.C. 순회항소법원이 기업 분할 명령을 뒤집었고 사건은 동의 명령으로 향하고 있습니다. 마이크로소프트를 엄격한 상호운용성 및 공개 조건에 묶어 둘 수도 있고, 조달의 유연성을 보존하는 완화된 명령을 협상할 수도 있습니다."
 usa_economic_events.475.t: "항소 번복과 동의 명령"
 usa_economic_events.476.a: "EC의 시정 조치에 보조를 맞춘다"
 usa_economic_events.476.b: "더 좁은 미국의 입장을 고수한다"
 usa_economic_events.476.d: "유럽 집행위원회가 마이크로소프트에 벌금을 부과하고 상호운용성 시정 조치를 명령했습니다. 워싱턴은 공개 문서화와 인터페이스 접근에 관해 브뤼셀과 보조를 맞출 수도 있고, 경쟁법에 대한 더 좁은 미국식 해석을 고수할 수도 있습니다."
 usa_economic_events.476.t: "유럽 집행위원회의 경쟁 판정"
 usa_economic_events.477.a: "확장에 앞서 신뢰성을 의무화한다"
 usa_economic_events.477.b: "시장 속도를 우선한다"
 usa_economic_events.477.d: "비스타의 부진한 출시는 마이크로소프트 생태계 전반의 품질 및 호환성 약점을 드러냈습니다. 연방 도입에 엄격한 신뢰성 기준을 강제할 수도 있고, 공급업체의 기세를 지키기 위해 불안정을 감수할 수도 있습니다."
 usa_economic_events.477.t: "발머 시대: 비스타와 플랫폼 전략"
 usa_economic_events.478.a: "오라클의 인수를 지지한다"
 usa_economic_events.478.b: "독립적 구조조정을 강제한다"
 usa_economic_events.478.c: "마이크로소프트의 입찰을 승인한다"
 usa_economic_events.478.d: "썬의 몰락은 연방 산업 정책의 결정 사안이 되었습니다. 워싱턴은 오라클의 인수 제안을 지지하거나, 독립적 구조조정 경로를 강제하거나, 마이크로소프트의 입찰을 승인하고 통합 조건은 후속 판정에서 정할 수 있습니다."
 usa_economic_events.478.t: "썬의 미래: 오라클, 구조조정, 혹은 마이크로소프트"
 usa_economic_events.479.a: "재단 관리를 의무화한다"
 usa_economic_events.479.b: "마이크로소프트의 완전한 통합을 허용한다"
 usa_economic_events.479.d: "마이크로소프트의 입찰이 승인되면서 연방 규제 당국은 썬의 플랫폼 자산에 대한 거버넌스를 결정해야 합니다. 상호운용성 보장과 함께 자바를 재단 방식의 관리로 이끌 수도 있고, 마이크로소프트의 깊은 통합을 허용하고 집중 위험을 감수할 수도 있습니다."
 usa_economic_events.479.t: "마이크로소프트 입찰 이후의 썬 거버넌스"
 usa_economic_events.480.a: "루미아 단말기 전략을 지지한다"
 usa_economic_events.480.b: "부문을 상각하고 휴대전화에서 철수한다"
 usa_economic_events.480.c: "단말기 사업을 분사한다"
 usa_economic_events.480.d: "마이크로소프트의 노키아 단말기 부문 인수는 실패했으며, 회사는 수십억 달러를 상각하고 휴대전화 부문을 축소하고 있습니다. 연방 정책은 마이크로소프트가 단말기 시장에서 계속 싸우도록 밀어붙일 수도, 시장을 포기하고 클라우드와 소프트웨어에 다시 집중하도록 할 수도 있습니다."
 usa_economic_events.480.t: "노키아 상각"
 usa_economic_events.481.a: "완전한 데이터 통합을 승인한다"
 usa_economic_events.481.b: "데이터 이동성 조건을 붙여 승인한다"
 usa_economic_events.481.c: "인수를 저지한다"
 usa_economic_events.481.d: "마이크로소프트는 링크드인 인수에 합의하여 전문직 네트워크와 그 데이터를 회사의 통제 아래 두게 되었습니다. 규제 당국은 거래를 그대로 통과시키거나, 데이터 이동성 조건을 붙이거나, 개인정보와 집중 우려를 이유로 저지할 수 있습니다."
 usa_economic_events.481.t: "마이크로소프트에 합류한 링크드인"
 usa_economic_events.482.a: "깃허브의 자율성을 보존한다"
 usa_economic_events.482.b: "깃허브를 애저와 통합한다"
 usa_economic_events.482.c: "인수를 저지한다"
 usa_economic_events.482.d: "깃허브 인수로 마이크로소프트는 핵심 오픈소스 인프라의 관리권을 얻게 됩니다. 연방 정책은 플랫폼의 자율성을 보존하거나, 깃허브를 애저에 긴밀히 통합하거나, 보안과 시장 지배력을 이유로 거래를 저지할 수 있습니다."
 usa_economic_events.482.t: "마이크로소프트 산하의 깃허브"
 usa_economic_events.483.a: "단일 주계약자 수주를 옹호한다"
 usa_economic_events.483.b: "공급자 중립적 주권 게이트웨이를 부과한다"
 usa_economic_events.483.c: "국방과 민간 클라우드 영역을 분리한다"
 usa_economic_events.483.d: "자바 거버넌스를 중립으로 유지한다"
 usa_economic_events.483.d_independent: "JEDI 소송은 조달의 취약성을 드러냈으며, 이제 모든 클라우드 판정이 전략적 결과를 낳습니다. 연방 클라우드, 보안, 공급자 거버넌스를 얼마나 긴밀히 결합해 둘지 선택해야 합니다."
 usa_economic_events.483.d_microsoft: "JEDI를 둘러싼 다툼이 격화되면서 각 기관은 JEDI 이후의 구조를 계획하고 있습니다. 이제 쟁점은 클라우드가 중요한지가 아니라, 워싱턴이 하나의 국가 시스템 주계약자를 관리할지 규제받는 다중 공급자 스택을 관리할지입니다."
 usa_economic_events.483.d_oracle: "국방부는 JEDI를 마이크로소프트에 수여했고, 이는 각 기관에 걸쳐 이의 제기, 입찰 분쟁, 주권 클라우드 논란을 촉발했습니다. 중앙집중식 수주를 고수하거나, 공급자 중립적 아키텍처를 강제하거나, 병렬 영역으로 선회할 수 있습니다."
 usa_economic_events.483.e: "썬을 애저 전략에 완전히 흡수한다"
 usa_economic_events.483.t: "JEDI와 국방 클라우드 전쟁"
 usa_economic_events.484.a: "헤드셋을 대규모로 배치한다"
 usa_economic_events.484.b: "제한적 배치로 재편한다"
 usa_economic_events.484.c: "방위 기술 도전자를 상대로 재입찰한다"
 usa_economic_events.484.d: "마이크로소프트의 홀로렌즈를 기반으로 한 육군의 통합 시각 증강 체계(IVAS)는 야전 시험에서 실패했고, 비용과 신뢰성을 둘러싸고 의회의 감시를 받고 있습니다. 220억 달러와 병사들의 신뢰가 걸려 있습니다."
 usa_economic_events.484.t: "IVAS: 병사의 헤드셋"
 usa_economic_events.485.a: "인수를 승인한다"
 usa_economic_events.485.b: "클라우드 스트리밍 시정 조치를 붙여 승인한다"
 usa_economic_events.485.c: "합병을 저지한다"
 usa_economic_events.485.d: "마이크로소프트는 게임 업계 역사상 최대 규모인 690억 달러에 액티비전 블리자드를 인수하기로 합의했습니다. 연방거래위원회와 해외 규제 당국은 게임과 클라우드 스트리밍의 통제권을 이유로 이에 맞서고 있습니다."
 usa_economic_events.485.t: "액티비전과 규제 당국"
 usa_economic_events.486.a: "보안 최우선"
 usa_economic_events.486.b: "보안과 제공의 균형"
 usa_economic_events.486.c: "통제를 낮추고 빠르게 출시"
 usa_economic_events.486.d: "남은 문제는 교리입니다. 연방 정책이 보안 통제를 최우선으로 할지, 안전장치와 함께 제공의 균형을 맞출지, 느슨한 보안 제약 아래 더 빠르게 출시할지의 문제입니다. 이 선택이 마이크로소프트 공공 부문 스택의 장기적인 거버넌스 성격을 정합니다."
 usa_economic_events.486.t: "마이크로소프트 스택의 보안 교리"
 usa_economic_events.487.t: "민간 발사 기업의 설립"
 usa_economic_events.487.d: "엘세군도에 있는 민간 자금 기반의 발사체 스타트업 스페이스X는 엔진, 기체, 항전 장비를 사 오지 않고 직접 만들겠다고 밝혔습니다. 워싱턴은 통합된 엔지니어링 기반을 장려할 수도, 처음부터 이 기업을 국방 계약 쪽으로 이끌 수도, 기성 부품으로 속도를 사도록 둘 수도 있습니다."
 usa_economic_events.487.a: "통합된 엔지니어링 기반을 장려한다"
 usa_economic_events.487.b: "기업을 국방 계약 쪽으로 이끈다"
 usa_economic_events.487.c: "기성 부품으로 속도를 사도록 둔다"
 usa_economic_events.488.t: "정거장으로의 상업 화물 수송"
 usa_economic_events.488.d: "NASA는 정거장 보급을 처음으로 상업 계약으로 전환하고 있으며, 스페이스X는 아직 비행한 적 없는 캡슐로 입찰하고 있습니다. 수주의 형태에 따라 두 공급자가 경쟁할지, 속도를 위해 한 대표 기업에 자금을 몰아줄지, 우주왕복선 체계를 몇 년 더 연장할지가 결정됩니다."
 usa_economic_events.488.a: "화물 계약을 이중 공급으로 한다"
 usa_economic_events.488.b: "속도를 위해 단일 대표 기업에 자금을 대 준다"
 usa_economic_events.488.c: "기존 우주왕복선 물류를 연장한다"
 usa_economic_events.489.t: "궤도에 도달한 팰컨 1"
 usa_economic_events.489.d: "세 번의 실패 끝에 네 번째 시도에서 팰컨 1이 궤도에 도달했습니다. 스페이스X는 배우기 위해 계속 비행하기를 원합니다. 규제 당국은 공개적으로 실패를 거듭해 온 발사 프로그램에 대한 더 엄격한 감독을 원하며, 기존 주계약자들은 신생 기업이 자신들의 공급망에 편입되기를 원합니다."
 usa_economic_events.489.a: "비행 시험을 통해 반복 개선하도록 둔다"
 usa_economic_events.489.b: "발사 위험에 대한 감독을 강화한다"
 usa_economic_events.489.c: "신생 기업을 주계약자들에 편입시킨다"
 usa_economic_events.490.t: "팰컨 9과 드래건"
 usa_economic_events.490.d: "스페이스X가 팰컨 9을 처음으로 비행시켰으며, 드래건은 올해가 가기 전에 궤도에서 귀환할 예정입니다. 이 시스템이 얼마나 폭넓게 인증되느냐에 따라 국가 임무를 수행할지, 보수적인 자격 심사 일정 뒤에서 기다릴지, 상업 고객만 상대할지가 정해집니다."
 usa_economic_events.490.a: "민간 임무용으로 시스템을 인증한다"
 usa_economic_events.490.b: "보수적인 인증 속도를 고수한다"
 usa_economic_events.490.c: "상업 고객으로 한정한다"
 usa_economic_events.491.t: "1단 로켓의 귀환"
 usa_economic_events.491.d: "스페이스X의 부스터가 케이프 커내버럴에 수직으로 착륙했습니다. 재사용은 더 이상 이론이 아니지만, 이를 확대한다는 것은 이미 비행한 하드웨어로 고객의 탑재체를 날린다는 뜻이며, 여전히 비용을 대는 것은 소모형 사업입니다."
 usa_economic_events.491.a: "재사용을 공격적으로 확대한다"
 usa_economic_events.491.b: "보수적인 비행 빈도를 우선한다"
 usa_economic_events.491.c: "소모형 발사 수익을 보호한다"
 usa_economic_events.492.t: "팰컨 헤비"
 usa_economic_events.492.d: "팰컨 헤비가 첫 시도에서 비행에 성공했고, 스페이스X는 이제 현역 중 가장 강력한 로켓을 운용합니다. 이를 국가 안보 및 심우주 탑재체용으로 인증하면 가장 큰 임무들이 상업 공급자에게 열리며, 이는 기존 대형 발사체 프로그램들이 지키려고 만들어진 바로 그 영역입니다."
 usa_economic_events.492.a: "대형 발사체를 국가 임무용으로 인증한다"
 usa_economic_events.492.b: "대형 발사체를 상업 탑재체에 한정한다"
 usa_economic_events.492.c: "경쟁 대형 발사체에 양보한다"
 usa_economic_events.493.t: "날아오르는 스타링크"
 usa_economic_events.493.d: "스타링크의 첫 운용 위성군이 궤도에 도달했으며, 스페이스X의 신청서는 수천 기를 더 요청하고 있습니다. 이를 동맹의 이중 용도 자산으로 구축할 수도, 제조되는 대로 최대한 빨리 판매할 수도, 보안 문제가 해결될 때까지 보류할 수도 있습니다."
 usa_economic_events.493.a: "동맹의 이중 용도 자산으로 구축한다"
 usa_economic_events.493.b: "상업 용량을 최대한 빨리 판매한다"
 usa_economic_events.493.c: "보안 검토가 끝날 때까지 보류한다"
 usa_economic_events.494.t: "상업 유인 수송"
 usa_economic_events.494.d: "우주왕복선 퇴역 이후 처음으로, 미국 우주비행사들이 스페이스X 드래건을 타고 미국 땅에서 발사됩니다. 상업 유인 수송을 인증하면 9년간 이어진 외국 좌석 구매가 끝나지만, 보잉을 두 번째 공급자로 계속 지원하는 데는 훨씬 많은 비용이 듭니다."
 usa_economic_events.494.a: "상업 유인 수송을 인증한다"
 usa_economic_events.494.b: "두 번째 공급자에게도 자금을 댄다"
 usa_economic_events.494.c: "외국 좌석을 주된 경로로 유지한다"
 usa_economic_events.495.t: "달을 위한 착륙선"
 usa_economic_events.495.d: "달 착륙선 수주는 아르테미스를 아직 존재하지 않는 기체인 스페이스X의 스타십에 묶습니다. 여기에 거는 것은 막대한 역량을 얻는 대신 불확실한 일정을 감수하는 일입니다. 수주를 나누거나 정부 착륙선을 기다리면 둘 다 얻지 못하지만 위험은 더 적습니다."
 usa_economic_events.495.a: "착륙선을 스타십에 수여한다"
 usa_economic_events.495.b: "공급업체들 사이에 수주를 나눈다"
 usa_economic_events.495.c: "정부가 만드는 착륙선을 기다린다"
 usa_economic_events.496.t: "국가 안보 발사 공급자 구성"
 usa_economic_events.496.d: "국가 안보 발사는 반드시 보장되어야 하며, 역사적으로 이는 사업을 유지하도록 두 공급자에게 비용을 지불한다는 뜻이었습니다. 스페이스X는 이제 유나이티드 론치 얼라이언스보다 훨씬 자주, 훨씬 저렴하게 비행하며, 조달 당국은 보장의 가치가 얼마인지 결정해야 합니다."
 usa_economic_events.496.a: "인증된 공급자 두 곳을 유지한다"
 usa_economic_events.496.b: "기존 주계약자를 우대한다"
 usa_economic_events.496.c: "더 저렴한 공급자에 집중한다"
 usa_economic_events.497.t: "스타십 인가"
 usa_economic_events.497.d: "스페이스X는 역사상 가장 큰 로켓인 스타십을 고장이 멈출 때까지 파괴될 때까지 비행시키기를 원합니다. 이 방식에는 반복 개선의 속도에 맞춰 발급되는 인가, 이를 염두에 두고 만들어지지 않은 환경 심사 절차, 그리고 다른 누구도 쓸 수 없는 발사 인프라가 필요합니다."
 usa_economic_events.497.a: "반복적으로 인가하고 비행하며 배운다"
 usa_economic_events.497.b: "더 느린 환경 심사 경로를 고수한다"
 usa_economic_events.497.c: "지원 인프라를 연방화한다"
 usa_economic_events.498.t: "미국 발사 산업의 모습"
 usa_economic_events.498.d: "스페이스X가 자체 엔진을 만들겠다고 선언한 지 20년이 지나, 궤도에 대한 미국의 접근 구조는 영속적인 형태로 자리 잡았습니다. 누가 국가 임무를 수행하고, 누가 승무원을 수송하며, 누가 머리 위의 위성군을 소유하는가의 문제입니다."
 usa_economic_events.498.a: "의미 있는 공급자가 하나뿐인 시장"
 usa_economic_events.498.b: "산업적 주기의 보장된 접근"
 usa_economic_events.498.c: "심우주 산업 스택"
 usa_economic_events.498.e: "동맹 궤도 연결망"
 usa_economic_events.498.f: "규율 있는 혼합 공급자 시장"
 USA_spacex_cadence_champion: "보장된 접근 주기"
 USA_spacex_cadence_champion_desc: "발사 운영은 예측 가능하고 빈번한 궤도 접근을 제공하며, 신뢰성은 이정표가 아니라 산업적 규율로 다뤄집니다."
 USA_spacex_allied_leo_connectivity: "동맹 궤도 연결망"
 USA_spacex_allied_leo_connectivity_desc: "동맹국과 공유하는 저궤도 통신망은 회복력과 상호운용성을 높이며, 위성군 자체를 정책의 도구로 만듭니다."
 USA_spacex_deep_space_stack: "심우주 산업 스택"
 USA_spacex_deep_space_stack_desc: "대형 발사체, 궤도상 운영, 탐사 물류가 함께 성장하여 하나로 연결된 산업 체계를 이루었습니다."
 USA_spacex_commercial_monopoly_risk: "집중된 발사 시장"
 USA_spacex_commercial_monopoly_risk_desc: "시장 지배력이 단일 공급자에게 집중되어 경쟁 압력이 약해지고 조달과 정책이 모두 복잡해졌습니다."
 USA_spacex_mixed_provider_ecosystem: "혼합 공급자 시장"
 USA_spacex_mixed_provider_ecosystem_desc: "회복력 있는 다중 공급자 시장이 비행 빈도, 경쟁, 국가 임무에 대한 보장 사이에서 균형을 이룹니다."

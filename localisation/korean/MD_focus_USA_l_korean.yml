 us_war_on_drugs_four_c: "마약과의 전쟁으로 인한 흉터"
 us_war_on_drugs_five_c: "마약과의 전쟁으로 인한 흉터"
 us_public_disorder_two: "커지는 대중의 분노"
 us_public_disorder_two_desc: "불안이 커지고 있으니, 제발 해결책을 찾으십시오."
 us_public_disorder_three: "시민의 격분"
 us_public_disorder_three_desc: "우리가 일을 망쳤으니, 일반 대중의 격분을 해소하지 못하면 그 결과를 제대로 마주하게 될 것입니다."
 us_public_disorder_four: "사회 붕괴"
 us_public_disorder_four_desc: "우리가 더 할 수 있었을까..."
 us_public_disorder_five: "사회 붕괴"
 us_public_disorder_five_desc: "우리가 더 할 수 있었을까..."
 us_public_disorder_six: "사회 붕괴"
 us_public_disorder_six_desc: "우리가 더 할 수 있었을까..."
 us_public_disorder_seven: "국가 붕괴"
 us_public_disorder_seven_desc: "우리가 더 할 수 있었을까..."
 usa_withdraw_troops_from_iraq: "이라크에서 병력 철수"
 USA_less_than_30_regulation_tt: "§Y규제 강도§!가 §Y30§!보다 낮음\n"
 petro_dollar: "페트로 달러"
 petro_dollar_desc: "A Petro Dollar is a US dollar that has been used to purchase crude oil. The United States Dollar (USD) has been the world's petrodollar since the mid-1970s when oil prices generated large trade and current account surpluses. The position has solidifed the dominance of the United States dollar on the global stage and it makes for easy and convenient."
 USA_high_cost_for_high_rewards: "제2차 대우주 경쟁"
 USA_high_cost_for_high_rewards_desc: "우주 경쟁이 다시 시작되었으며, 승리를 확보하는 것은 우리의 지상 과제입니다. 우리는 그 칭호를 지키기 위해 가진 모든 것을 투자할 것이며, \\"엄밀히 말하면 소련이 먼저 했다\\"는 식으로 누군가의 신경을 긁기 위해 떠드는 탱키와 불신자들의 헛소리를 일소할 것입니다. 비용은 높겠지만 그것이 우리를 막은 적은 없습니다. 무한한 공간 저 너머로."
 USA_people_powered_governance: "국민 주도 통치"
 USA_people_powered_governance_desc: "국민의 목소리를 진정으로 반영하는 정부를 위해 시민 참여로 민주주의 원칙을 한 단계 높입니다."
 USA_fair_play_for_all: "모두를 위한 공정"
 USA_fair_play_for_all_desc: "평등한 기회와 공정하고 정의로운 사회를 보장하는 정책으로 불평등에 정면으로 맞섭니다."
 USA_taxing_smarter: "더 현명한 과세, 더 공정한 성장"
 USA_healthcare_harmony_for_all: "모두를 위한 조화로운 의료"
 USA_healthcare_harmony_for_all_desc: "양질의 진료, 예방 조치, 정신 건강 지원을 강조하며 보편적 의료를 위한 노력을 이끕니다."
 USA_knowledge_is_key: "지식이 열쇠다"
 USA_knowledge_is_key_desc: "유아기부터 감당 가능한 고등 교육에 이르기까지 모든 이를 위한 접근 가능한 양질의 교육의 문을 엽니다."
 USA_green_dreams_sustainable: "녹색의 꿈, 지속 가능한 현실"
 USA_green_dreams_sustainable_desc: "녹색 미래를 위한 포괄적 계획을 추진하고, 일자리를 창출하며, 지속 가능한 재생 에너지로 전환합니다."
 USA_work_well_and_live_well: "잘 일하고 잘 살자"
 USA_work_well_and_live_well_desc: "단체 교섭을 최우선에 두고 노동자의 권리, 공정한 임금, 안전한 환경을 위해 싸웁니다."
 USA_home_it_is_our_sweet_home: "즐거운 나의 집"
 USA_home_it_is_our_sweet_home_desc: "적정 가격 주택, 지역 사회 중심의 도시 개발, 노숙 방지 구상을 위한 정책을 수립합니다."
 USA_left_wing_unity: "좌익 통합"
 USA_left_wing_unity_desc: "우리는 마침내 노동자의 대의를 증명했습니다. 승리를 거둔 것은 좌익 통합이기 때문입니다. 전우들과 함께 우리는 모두를 위한 더 공정하고 정의로운 미래를 추구합니다. 미국의 꿈이 아니라 모든 인류가 추구할 꿈을 만듭시다. 부유한 소수가 아닌 다수에게 이익이 되는 우리 종의 미래를 추구하고 만들어 나갑시다."
 USA_roots_of_revelry: "축제의 뿌리"
 USA_roots_of_revelry_desc: "소박한 모임에서 문화의 초석으로 진화해 온 과정을 추적하며, 미국의 활기찬 축제 뒤에 숨은 생생한 역사를 발굴합니다."
 USA_branching_identity: "뻗어 나가는 정체성"
 USA_branching_identity_desc: "축제 행사와 얽힌 문화적 상징을 밝혀내고, 미국적 정체성의 본질을 형성하는 데 이 행사가 차지하는 필수적인 역할을 보여 줍니다."
 USA_green_gala_guardian: "녹색 축제의 수호자"
 USA_green_gala_guardian_desc: "축제가 환경에 미치는 영향을 조사하고, 생태적 균형과 지속 가능성의 수호자로서의 역할을 탐구합니다."
 USA_artsy_arboreal_vibes: "예술적 수목의 정취"
 USA_artsy_arboreal_vibes_desc: "행사에서 영감을 받은 예술적 표현에 흠뻑 빠져 보십시오. 창의성이 미국의 시각 예술과 만나는 자리입니다."
 USA_fiesta_foliage: "축제의 잎새"
 USA_fiesta_foliage_desc: "반짝이는 조명과 명절의 정신이 공동체의 축제로 어우러지는 가운데, 축제 전통에서 이 행사가 맡은 주연의 역할을 탐구합니다."
 USA_community_canopy_connection: "공동체의 지붕 연결"
 USA_community_canopy_connection_desc: "사람들을 모아 함께하는 순간과 축하를 나누게 하는 공동체 거점으로서 축제의 역할을 들춰 봅니다."
 USA_chronicles_of_celebration: "축제 연대기"
 USA_chronicles_of_celebration_desc: "축제와 관련된 역사적 사건을 시간 여행하며, 수년에 걸쳐 그 이야기를 만들어 온 사연들을 밝힙니다."
 USA_civic_celebration_station: "시민 축제 정거장"
 USA_civic_celebration_station_desc: "축제가 어떻게 시민의 자긍심과 참여를 불러일으키고 평범한 모임을 특별한 공동체 행사로 바꾸는지 알아봅니다."
 USA_feast_treats: "잔치 음식"
 USA_feast_treats_desc: "요리법과 축제가 군침 도는 축하로 어우러지는, 축제와 얽힌 음식 전통의 풍미를 즐겨 보십시오."
 USA_edu_tainment_extravaganza: "에듀테인먼트 대향연"
 USA_edu_tainment_extravaganza_desc: "축제에 대해 배우는 일을 즐겁고 깨우침을 주는 경험으로 만드는 프로그램과 함께 교육의 스포트라이트 속으로 들어가 보십시오."
 USA_conservation_couture: "보전 패션"
 USA_conservation_couture_desc: "행사의 세련된 면모를 선보이며, 앞으로 여러 세대에 걸쳐 푸르고 번성하도록 지키려는 노력을 조명합니다."
 USA_family_fiesta_chronicles: "가족 축제 연대기"
 USA_family_fiesta_chronicles_desc: "축제 중에 엮인 훈훈한 가족 이야기를 들으러 모이십시오. 함께한 즐거운 순간처럼 추억이 꽃피는 이야기입니다."
 USA_literary_limelight: "문학의 조명"
 USA_literary_limelight_desc: "축제에 경의를 표하며 이를 시인과 이야기꾼의 뮤즈로 만든 문학 작품의 페이지를 넘겨 보십시오."
 USA_artistic_arbor_adventures: "예술적 수목 모험"
 USA_artistic_arbor_adventures_desc: "창의성에 한계가 없는, 축제에서 영감을 받은 공공 예술 설치물의 세계에 흠뻑 빠져 보십시오."
 USA_tech_touched_treetime: "기술이 깃든 트리 시간"
 USA_tech_touched_treetime_desc: "가상 모험에서 증강 현실의 마법에 이르기까지, 기술이 깃든 경이로움으로 그 어느 때와도 다른 축제를 경험하십시오."
 USA_global_grove_connection: "세계 숲의 연결"
 USA_global_grove_connection_desc: "축제의 매력이 어떻게 국경을 넘어 확장되어 미국 문화를 세계의 스포트라이트 속에 세우는지 밝혀냅니다."
 USA_cash_crop_canopy: "환금 작물의 지붕"
 USA_cash_crop_canopy_desc: "관광 명소이자 지역 상업의 촉진제가 되어 축제가 쏟아붓는 경제적 축복을 헤아려 봅니다."
 USA_future_festive_foliage: "미래의 축제 잎새"
 USA_future_festive_foliage_desc: "수정 구슬을 들여다보며 축제가 문화적, 환경적 지혜에 뿌리를 둔 지속 가능하고 화려한 미래를 어떻게 준비하고 있는지 엿봅니다."
 USA_hidden_heritage_havens: "숨겨진 유산의 안식처"
 USA_hidden_heritage_havens_desc: "미국 축제의 덜 알려진 면모를 밝히는 여정에 나서, 말해지지 않은 이야기와 문화적 보물을 간직한 숨겨진 유산의 안식처를 발견하십시오. 축제의 이야기에 깊이를 더하는 은밀한 매력을 탐구하고, 그 활기찬 품 안에 모인 이들의 공동 정체성을 풍요롭게 하십시오."
 USA_limited_government_and_constitutional_adherence: "제한 정부와 헌법 준수"
 USA_limited_government_and_constitutional_adherence_desc: "우리는 미국 헌법을 엄격히 수호하고, 국민의 일상생활에 대한 정부 개입을 최소화하도록 장려하는 것을 지지합니다."
 USA_fiscal_responsibilities_and_balanced_budgets: "재정 책임과 균형 예산"
 USA_fiscal_responsibilities_and_balanced_budgets_desc: "균형 예산을 달성하고 과도한 국가 부채를 피하기 위해, 우리는 정부 지출 감축을 비롯한 건전한 재정 정책을 최우선으로 삼습니다."
 USA_individuals_rights_and_liberties: "개인의 권리와 자유"
 USA_individuals_rights_and_liberties_desc: "defending the individual liberties and rights guaranteed by the Constitution, such as the freedom of expression, the practice of religion, and the right to keep and bear arms."
 USA_states_rights_and_federalism: "주권과 연방주의"
 USA_states_rights_and_federalism_desc: "각 주에 자체 경계 안에서 통치할 상당한 권한을 부여하는 수정 제10조의 연방주의 개념을 수호합니다."
 USA_free_market_economy: "자유 시장 경제"
 USA_free_market_economy_desc: "경제 성장과 번영을 촉진하기 위해 자유 기업, 경쟁, 최소한의 정부 규제를 지지하는 정책을 장려해야 합니다."
 USA_strong_national_defense_and_non_interventionism: "타국이 아닌 우리 조국의 수호"
 USA_strong_national_defense_and_non_interventionism_desc: "강력한 국방을 증진하되 공세적 군사 작전을 경계하고 불개입 접근에 집중하면, 본토와 우리를 둘러싼 세계 사이의 균형을 더 잘 잡을 수 있을 것입니다."
 USA_originalist_judiciary_and_appointments: "원전주의 사법부 임명"
 USA_originalist_judiciary_and_appointments_desc: "헌법의 원래 의미를 적용하는 판사를 선발하도록 장려하면 내부 결속과 정부 효율이 강화될 것입니다. 우리를 이토록 멀리 헤매게 한 현대적 해석과는 대조적입니다."
 USA_secure_borders_and_create_immigration_reforms: "헌법적 이민 제도"
 USA_secure_borders_and_create_immigration_reforms_desc: "우리는 국경 보안과 공정하고 정당한 이민법 시행을 모두 아우르는 균형 잡힌 이민 접근을 장려합니다. 헌법에 규정된 바와 같습니다."
 USA_right_wing_unity: "우익 단결"
 USA_right_wing_unity_desc: "단결과 민족적 자부심은 모든 형태의 전복에 맞서 승리합니다. 재빠른 판단과 강력한 지도력으로 우리 연합은 굳건히 버텼습니다. 우익 단결이 이 새로운 세계에서 승리하고 있으며, 따라서 우리는 아메리칸 드림을 아메리칸 퓨처로 만들 것입니다. 신이시여, 이 나라와 그 땅과 시민들을 축복하소서... 신이시여, 미국을 축복하소서."
 USA_national_sovereignty_and_autonomy: "국가 주권과 자치"
 USA_national_sovereignty_and_autonomy_desc: "우리는 국가 주권과 자결을 강조하며, 세계 문제에서 미합중국의 이익과 독립을 우선시하는 정책을 옹호합니다."
 USA_secure_the_borders_and_controll_immigrants: "국경 보안과 이민 통제"
 USA_secure_the_borders_and_controll_immigrants_desc: "우리는 국가 안보를 지키고 국가의 이익을 위해 이민을 규제하기 위한 엄격한 국경 통제 조치와 책임 있는 이민 정책을 지지합니다."
 USA_economic_patriotism_and_domestic_industry: "경제 애국주의와 국내 산업"
 USA_economic_patriotism_and_domestic_industry_desc: "우리는 무역 정책, 일자리 창출 구상, 국내 제조업 지원을 통해 미국의 산업, 노동자, 기업을 우선시하는 정책을 장려합니다."
 USA_cultural_unity_and_integration: "문화적 단결과 통합"
 USA_cultural_unity_and_integration_desc: "우리는 다양한 출신과 전통을 존중하면서 공유된 국가 정체성을 뒷받침하고 문화적 동화를 장려하는 데 중점을 둘 것입니다."
 USA_strong_defense_and_national_sec: "강력한 국방과 국가 안보"
 USA_strong_defense_and_national_sec_desc: "우리의 우선순위는 미합중국과 해외 이익의 안보와 방어를 보장하기 위한 충분한 재원을 갖춘 강력한 군대입니다."
 USA_energy_and_sustainable_resoruces: "에너지 독립, 지속 가능한 자원"
 USA_energy_and_sustainable_resoruces_desc: "책임 있는 자원 관리, 재생 에너지 구상, 외국 자원 의존도 축소를 통해 에너지 자급을 목표로 하는 정책을 수립합니다."
 USA_american_infrastructure: "미국 기반시설 르네상스"
 USA_american_infrastructure_desc: "가장 발전하고 앞선 나라로서 우리는 일자리를 창출하고 경제 성장을 뒷받침하기 위해 교통, 에너지, 기술 등 핵심 국가 기반시설에 대한 투자와 현대화를 우선시하고 있습니다."
 USA_education_for_american_excellence: "미국의 탁월함을 위한 교육"
 USA_education_for_american_excellence_desc: "우리의 목표는 교육 기준, 직업 훈련, 교육 혁신을 향상시켜 미국의 학생과 노동자가 성공에 필요한 기술을 갖추게 하는 것입니다."
 USA_championing_american_innovations: "미국의 혁신 옹호"
 USA_championing_american_innovations_desc: "우리의 돈을 우리의 연구 개발에 투자하여 기술, 혁신, 과학 발전에서 미국의 리더십을 유지합니다."
 USA_health_and_wellness_of_our_dear_citizens: "모든 미국인의 건강과 복지"
 USA_health_and_wellness_of_our_dear_citizens_desc: "우리의 의료 제도는 논란이 많습니다. 우리는 공중 보건 과제를 해결하고 양질의 의료에 대한 접근을 촉진하는 정책을 통해 모든 미국인의 건강과 복리를 보장하도록 이것이 바뀌어야 한다고 믿습니다."
 USA_environmental_stewardship_and_growth: "성장을 통한 환경주의"
 USA_environmental_stewardship_and_growth_desc: "우리는 책임 있는 자원 관리와 혁신을 통해 환경 보호를 보장하고 미국의 산업과 지역사회를 뒷받침할 것입니다."
 USA_support_for_our_war_veterans: "참전 용사와 군인 가족 지원"
 USA_support_for_our_war_veterans_desc: "우리는 참전 용사와 그 가족이 국가에 봉사한 대가로 마땅히 받아야 할 돌봄과 혜택, 지원을 받도록 보장할 책임이 있습니다."
 USA_presernation_of_american_natural_heritage: "미국 유산 보존"
 USA_presernation_of_american_natural_heritage_desc: "미국은 후세가 누릴 수 있도록 우리의 자연미와 야생 동물, 풍경을 기리고 보호할 것입니다."
 USA_community_empowerment_and_local_governance: "지역사회 역량 강화"
 USA_community_empowerment_and_local_governance_desc: "우리는 지역사회에 힘을 실어주고, 고유한 필요와 과제를 해결하기 위한 지역 차원의 의사 결정을 촉진하는 정책에 전념합니다."
 USA_america_tradition_and_heritage_protection: "미국의 전통"
 USA_america_tradition_and_heritage_protection_desc: "우리는 국가적 자부심과 정체성의 원천으로서 미국의 문화유산과 역사, 전통을 기리고 보호합니다."
 USA_public_safety_and_effective_justice: "공공 안전"
 USA_public_safety_and_effective_justice_desc: "우리는 공공 안전, 효과적인 법 집행, 공정한 형사 사법 관행을 보장하는 정책을 우선시할 것입니다."
 USA_international_engagement_on_american_terms: "국제 관여"
 USA_international_engagement_on_american_terms_desc: "우리 반구에서 미국의 이익을 우선시하고 외교, 경제, 안보 활동의 가치를 중시하는 외교 정책 결정을 지지합니다."
 USA_militarist_military_seizes_power: "군부의 권력 장악"
 USA_militarist_military_seizes_power_desc: "In a well coordinated effort along with both military and civilian leaders, the hardliners of the NFP were rounded up and jailed on a various amount of charges ranging from subversion of the party to treason by act of national security risk. In the end many knew this would come, they just didn't expect it to be so quick. Nevertheless Washington is no longer the true capital of the US and now most decisions come from the Pentagon itself. However will the military apparatus lead the nation compared to the civilian leaders, many outside of the US fear this screaming eagle may become aggressive while others seek to create coridal ties to stem the eyes of the general staff. In the end, the world has seen a new era of global politics and not even god himself may know what lies ahead."
 USA_fascist_american_naturalist_seize_power: "American Naturalist Seize Power"
 USA_fascist_american_naturalist_seize_power_desc: "온건파가 나라를 떠나고, 국민이 반미주의자 처리에 스스로 나서며, 나라가 혼돈에 빠지는 듯하자 미국 자연주의당이 NFP의 고삐를 장악합니다. 이제 나라는 안보가 필요하다는 국민의 외침에 귀 기울이는 이들의 강철 같은 의지로 통치됩니다. 그들은 전통을 통한 근대성의 새 시대, 국가 정신과 의지를 통한 번영의 새 시대, 그리고 강경한 조치를 통한 안보의 새 시대로 미국을 이끌 것입니다. 국민이 말했고, 포부를 가진 이들이 지도자의 책무를 맡아 이 새로운 미국의 시대를 이끌 것입니다. 지금 부름이 있기 때문입니다. \\"미국인을 위한 미국\\"."
 USA_monarchist_the_american_dynasty_rises: "미국 왕조의 부상"
 USA_monarchist_the_american_dynasty_rises_desc: "눈부신 약진으로 MMM은 더 폐쇄적이고 보호주의적인 NFP를 제치고 권력을 확보했습니다. 많은 이들의 눈에 이 연합은 실패할 운명이었으나, 현대 군주주의자들이 다른 어느 나라도 아닌 미국에서 이토록 인기를 얻으리라고는 아무도 예상하지 못했습니다."
 USA_red_junta_seizes_power: "붉은 군사 정권의 권력 장악"
 USA_red_junta_seizes_power_desc: "군의 정치위원단이 진정한 사회주의가 나라에 뿌리내리는 것을 막았던 \\"불화의 약한 고리\\"에 맞서 거의 무혈 쿠데타로 권력을 장악하면서 수도는 혼란에 빠졌습니다. 거의 모순어법처럼, 정치위원단 지도부는 이중 방향의 단결 계획으로 돌격을 이끌었습니다. 병역과, 보다 사회주의적 및/또는 사회민주주의적 경제 접근을 선호하는 혼합 경제 모델을 이용하여, 정치위원단 지도부는 이 두 기둥으로 이 합중국의 미래를 이끌 단결된 사회와 단결된 목표, 단결된 정체성을 창출할 것입니다."
 USA_american_trotskist_seize_power: "The SWP Trotskyist Seize Power"
 USA_american_trotskist_seize_power_desc: "냉혹한 쿠데타로 SWP가 셰퍼드당 연합으로부터 권력을 장악했습니다. 이 충격적인 사건 전개에 많은 이들은 SWP가 가진 트로츠키주의 관점과 트로츠키가 사회주의로 알려진 바를 이해하는 만큼 다음에 정확히 무슨 일이 벌어질지 우려하고 있습니다. 지금은 사람들이 숨을 죽이고 이토록 극적인 사태 변화에서 무엇이 나올지 지켜보고 있습니다."
 USA_american_anarchist_society_collectivizes_victory: "협회, 승리를 집단화하다"
 USA_american_aas_retooling_foreign_diplomacy: "대외 외교 재편"
 USA_american_aas_retooling_foreign_diplomacy_desc: "We need to cooperate with the wider world, but we know that we don't have to. As such to ensure simple and fair relations we will set our foreign policy as a cordial backstep. This means we'll engaging in talks and trade deals but all in all we'll be focusing more about our homeland and its people first."
 USA_american_aas_practical_education_act: "실용 교육 법"
 USA_american_aas_practical_education_act_desc: "The PEA is a collective legisilation understanding that education and the education system is there for one thing and one thing only. That is to teach and prepare our children to be a part of our society at large, in order to do that however we must overhaul the education system to focus and teach practical things and ensure their development. Basic language, reading and math skills will be the bedrock with students and parents having the choice of extending that education to more specialized fields of interest. This may create in the short term a partial brain drain, but with things like how to grow food and understanding the basics of being able to live and enjoy the simple things in life will result in at the very least an agricultural boom."
 USA_american_aas_life_is_hard: "삶은 고달프다"
 USA_american_aas_life_is_hard_desc: "Our fundamental existence has caused an up roar in foreign governments around the world. Despite our recent acts to distance and looks more towards ourselves rather than the wider world, many foreign governments see our very existence as a threat to the supposed, \"Natural Order\". As such we must gear our nation and its people to defend their families and homes from anyone who wishes to make that fateful decision."
 USA_american_aas_hybrid_economics: "혼합 경제"
 USA_american_aas_hybrid_economics_desc: "With the changing winds we seek to encourage our citizenry to be prepared for survival. As such civilian manufacturies and other businesses must have a small percentage dedicated to military production. This way we bolster local defenses as well as ensure the ease of readiness if a foreign power should try to seize our land and people."
 USA_american_aas_decentralizing_corporate_entities: "기업 체제 분권화"
 USA_american_aas_decentralizing_corporate_entities_desc: "The soft power influences of modern economics is the scariest thing to a stable society. With foreign governments looking to use the soft power to bypass the use of force. This underhanded approach has resulted in us forcing our hand in the fact that we have been forced to speed up our decentralization of corporate type entities. In an extreme form of anti-monopoly enforcement, the cases brought forth will break up and even our the excessive market shares held by these titans of modern industries."
 USA_american_aas_reactive_autarky: "대응적 자급자족"
 USA_american_aas_reactive_autarky_desc: "다른 나라 정부들이 우리를 위협으로 인식한다는 이유로 대외 무역은 거의 사라진 수준에 가까워지고 있습니다. 이를 염두에 두고 우리는 지역 채굴 사업을 장려하고, 시민이 자급자족의 필요성을 이해하도록 가능한 모든 노력을 기울여야 합니다."
 USA_american_aas_militarization_debate: "군사화 논쟁"
 USA_american_aas_militarization_debate_desc: "The question of militarization is the biggest upset in our society. Many principled anarchist already are abhorrent to our mere existence cause of the paradox we preserve in the form of a \"state\". Nevertheless a good majority of the population is wondering and rightly worried about our preservation in living in such a free society. Therefore we must make a genuine discussion and come to a real agreement on what to do about the military force our nation will have."
 USA_american_aas_the_survival_answer: "생존의 해답"
 USA_american_aas_the_survival_answer_desc: "나라의 보존은 필수이며, 우리는 방어를 최우선으로 삼아 모든 것에 앞서 보장할 것입니다. 따라서 연구 개발 노력, 훈련, 생산은 우리가 가장 깨기 어려운 상대가 되도록 맞춰질 것입니다. 우리가 만든다는 권력의 왕좌를 위한 이른바 \\"퇴위\\"를 외치는 이들이 있을 것입니다. 그러나 국민은 정치적으로 자의적인 점수보다 가정을 지키는 것이 따라야 할 가장 큰 원칙이라는 우리의 말에 동의할 것입니다."
 USA_american_aas_the_principle_answer: "원칙의 해답"
 USA_american_aas_the_principle_answer_desc: "우리의 행동이 우리의 의도를 외칠 것이며, 나라의 안전을 지키기 위해 권력에 굶주린 자들의 손아귀에 놓이는 군사화는 필요하지 않습니다. 따라서 우리는 혼합 경제를 이어가며 국민의 필요와 이론상 발생할 수 있는 위협에 더 균형 있게 대응할 것입니다."
 USA_american_aas_the_volunteers_program: "지원병 프로그램"
 USA_american_aas_the_volunteers_program_desc: "근본적으로 우리는 징집할 수 없습니다. 그런 힘을 행사하면 우리는 아나키스트라는 호칭을 잃을 것입니다. 하지만 장려 프로그램을 만들고 이를 조정하면 수동적으로 더 많은 지원병을 들일 수 있습니다. 예산상 비용이 들겠지만 나라를 지킬 가치가 있습니다."
 USA_american_aas_air_over_navy: "해군보다 공군"
 USA_american_aas_air_over_navy_desc: "우리는 이제 무의미한 전쟁이나 구질서가 무엇을 하고 있었는지 신만이 아는 일을 위해 지구 반대편까지 가려는 계획이 없습니다. 따라서 해군의 과잉 전력이 이토록 많으니 이를 해체하고, 폐기하고, 공군으로 용도 변경하는 등 여러 조치를 취할 수 있습니다. 이는 예산 증가를 막고 아이러니하게도 다른 면에서는 예산을 줄이기도 할 것입니다. 이로써 국민에게 더 많은 것을 돌려줄 수 있고, 이는 다시 우리에 대한 지지를 높일 것입니다."
 USA_american_aas_retooling_public_support: "대중 지지 재편"
 USA_american_aas_retooling_public_support_desc: "연설, 표지판, 그리고 현실이 우리가 할 수 있고 사용할 방법이며, 이를 통해 국민의 지지를 확보하여 생각을 더 군사 지향적으로 전환시킬 것입니다. 이 과정은 느리며 결속 면에서 우리에게 타격을 줄 가능성이 큽니다. 그러나 일부 외국 정부가 우리를 어떻게 위협으로 인식하고 있는지, 그리고 우리 공동체에 대한 외국의 공격 가능성이 높다는 것을 국민에게 알려야 합니다."
 USA_american_aas_every_soldier_a_pathfinder: "모든 병사는 길잡이"
 USA_american_aas_every_soldier_a_pathfinder_desc: "점점 더 많은 사람을 \\"모집\\"할수록 우리는 그 과정에서 수동적 경험을 풍부하게 얻습니다. 이 경험은 어떤 전쟁 대학도 가르칠 수 없는 것으로, 이들이 자기 지역을 항해하는 데서 얻는 자연스러운 노출입니다. 따라서 우리 공동체의 모든 병사는 이러한 기술을 갈고닦고, 능숙하지 못하거나 활동할 지역에 익숙하지 않은 이들을 가르치고 돕도록 요청받을 것입니다. 이는 우리의 결속은 물론, 적이 탐낼 수 있는 잃어버린 영토를 되찾기 위한 방어 및 필요하다면 공세 행동의 역량도 높일 것입니다."
 USA_american_aas_the_free_citizen_army: "자유 시민군"
 USA_american_aas_the_free_citizen_army_desc: "결속과 지지를 유지하려면 우리 군을 위한 집단 정체성을 모색해야 합니다. 대의와 검은 깃발 아래 결집하십시오. FCA는 우리의 자유를 짓밟기로 결심한 적들로부터 가정과 가족을 지킬 것입니다."
 USA_american_aas_american_culture_is_anarchism: "미국 문화는 아나키즘"
 USA_american_aas_american_culture_is_anarchism_desc: "일부는 미국식이란 최소국가주의의 정의를 취하고 모든 시민의 손에 무기를 쥐여 주면서 \\"당신의 것은 당신이 지켜라, 그래야 정부나 다른 권력이 당신에게서 빼앗지 못한다\\"라고 말하는 것이라고 합니다. 가족이나 마을 같은 지역 단위를 중심으로 한 이 최고의 개인주의는 아나키즘과 코뮌을 통한 그 집단주의와 매우 일치합니다. 우리는 몇몇 단어와 표현만 바꾸면 되고, 그러면 모든 시민이 침략자로부터 자기 집을 지키는 것을 영광으로 여길 것입니다."
 USA_american_aas_butter_bread_ammo_lead: "버터, 빵, 탄약 그리고 납"
 USA_american_aas_butter_bread_ammo_lead_desc: "Without food and army stops, without ammo and army stops functioning. Both sides of the economic spectrum are in fact literally the same coin. As such we will ensure the economy and the people are encouraged to defend as well as feed their own. Peace, Land and Bread will be ours."
 USA_american_aas_the_village_model: "마을 모델"
 USA_american_aas_the_village_model_desc: "경제적으로 아나키즘에 더 가까이 나아가면서, 우리는 빈 땅이 있는 곳이면 어디든 공동체와 마을이 만들어지도록 장려하고 허용할 것이며, 그 땅에 정착한 사람들은 자신의 집과 새로 얻은 땅을 지키기 위해 원하는 것과 할 수 있는 것을 만들고 제공할 수 있게 될 것입니다."
 USA_american_aas_militia_system: "민병 체제"
 USA_american_aas_militia_system_desc: "The militia system is one seen used more frequently to a whole spectrum of results. Some militias self harden and become practically their own armies. Other militias practically are cannon fodder or even just target practice for the opposition, we will have results and we will preserve our ability to defend. The American culture of gun ownership, the free will to defend one's home and family will be used as a keystone of training and organization of military units for our Free Army. Orders will be explained to ensure that questions about them are minimal and arguments about the justness of the order is to as small of a degree as possible. Officer's will be voted for but the voting will be done according to the military aptitude of the person wanting to be voted in. This will dissuade the popularity contest that voting can divulge into and hopefully allow for our military to function as intended."
 USA_american_aas_the_new_agrarianism: "신농본주의"
 USA_american_aas_the_new_agrarianism_desc: "식량 안보는 이러한 정부 어느 쪽이든 흥망을 가를 수 있는 현실입니다. 따라서 우리는 우리 자신의 식량뿐 아니라 잉여 식량이 우리를 내버려 두게 하는 유인책으로서 가질 수 있는 정치적 영향력도 확보하려 해야 합니다."
 USA_american_aas_de_corporatization: "탈기업화"
 USA_american_aas_de_corporatization_desc: "경제를 재편함에 있어 우리는 탈기업화를 통한 분권화에 크게 집중할 것입니다. 이를 통해 우리는 모든 권력을 개인과 소규모 공동체, 그리고 어느 경제에서든 근간인 영세 가게에 돌려줍니다. 우리는 함께 새로운 길을 만들 것이며, 탐욕과 \\"부\\"의 과잉으로 갈라지지 않고 삶 속에서 하나가 될 것입니다."
 USA_american_aas_mutual_agreements_diplomacy: "상호 합의 외교"
 USA_american_aas_mutual_agreements_diplomacy_desc: "With the massive shift in our economic power and our prioritization of decentralization, specialization and agrarianism, many in the world have understood that maybe, just maybe we can work with these \"Anarchists\". Therefore our diplomatic strategy moving forward is assuances related to mutual agreements. Trade deals and the like will be conducted in a manner which is seen as fair as possible for the mutual benefit for not only our society, but for the foreign societies which still are wary of our existence. It's not much, but its a continued step in the direction of self security."
 USA_american_aas_the_societal_betterment_fund: "사회 개선 기금"
 USA_american_aas_the_societal_betterment_fund_desc: "억압적인 세금 제도의 재편은 그 자체로 힘든 일입니다. 사회, 보건, 경제 또는 기반시설 프로그램을 통한 사회 복리를 위한 지출이 현대 사회의 결속된 성장과 유지를 가능하게 한다는 것은 누구나 압니다. 그러나 그와 같은 것을 구현하려면 우리 사회의 한계 안에서 이치에 맞는 기준으로 접근해야 합니다. 그렇지 않으면 우리가 국민의 노동과 부를 \\"훔치고\\" 있다는 이유로 시민 불안을 예상해야 하며 그것은 결코 안 될 일입니다. 따라서 우리는 \\"세금 징수\\"를 기부 운동처럼 조직할 것입니다. 우리가 지원할 수 있는 프로그램을 설명하고, 소수의 주머니가 아닌 사회에 구체적으로 어디에 그들의 돈이 쓰이는지 로드맵과 개요를 제공할 것입니다."
 USA_american_aas_defense_industry_council: "방위 산업 위원회"
 USA_american_aas_defense_industry_council_desc: "A military force is not needed until it sudden is. Acts of aggression never are intended to make sense since the aggression is against our own species. However history of our species shows some limited form of a military is needed, with this in mind our focus is purely and ethusiastically defensive oriented. A defense industry council will be elected by voted local representatives to help establish and standardize the production of any kind of war related to ensure our safety from unwarranted aggression is a certainty."
 USA_american_aas_the_societys_needs: "사회의 필요"
 USA_american_aas_the_societys_needs_desc: "중앙 권력에 대한 재정 중단이 최우선이며 시민의 부와 노동을 돌려주는 것이 아나키즘의 기둥입니다. 사회 자체가 무엇이 필요한지 알고 있으므로 우리는 사회에 진정으로 보답하기 위해 노력할 것입니다."
 USA_american_aas_the_minuteman_example: "미닛맨 모범"
 USA_american_aas_the_minuteman_example_desc: "과거의 민병대원들이야말로 우리 사회가 본받았어야 할 모습입니다. 그럼에도 가족과 고향을 지키기 위해 나선 이 개인주의와 용기의 굳건한 수호자들이야말로 우리가 사회에 불어넣고 장려하고자 하는 모범입니다. 우리는 우리의 것을 지키고, 자결권을 지키기 때문입니다."
 USA_american_aas_gutting_government: "정부 비대화 해소"
 USA_american_aas_gutting_government_desc: "안전한 사회를 보장하려면 정부의 비대함과 과잉을 도려내기 위해 할 수 있는 모든 일을 해야 합니다. 과거의 세계주의적 이상주의에 얽매이지 않는 사회에서는 \\"정상적\\"이고 필수적으로 보이던 것들이 더는 그렇지 않습니다. 이제 우리는 접근해 오는 이들과 제한적인 협상만 진행하며, 거의 전적으로 우리 사회와 그 필요에 집중합니다."
 USA_american_aas_local_teachings_for_local_needs: "지역의 필요에 맞는 지역 교육"
 USA_american_aas_local_teachings_for_local_needs_desc: "정부 비대화를 해소했으니, 다음 단계는 정부가 우리 아이들에게 무엇을 가르치고 가르치지 말아야 할지 지시하는 관행을 끝내는 것입니다. 이는 분명 중앙 집중식 연구 노력에 타격을 주겠지만, 모두의 복지와 생존을 보장하는 것이야말로 삶 그 자체의 으뜸가는 가르침이어야 합니다."
 USA_american_aas_the_new_society: "새로운 사회"
 USA_american_aas_the_new_society_desc: "We have created a truly blessed and better society. Where the people can act as according their needs rather than the ever growing wants that modern globalism and consumerism has drilled into our minds. Now we set forth to our biggest goal ever. To proclaim our new society."
 USA_american_aas_the_free_american_territories: "자유 영토 선포"
 USA_american_aas_the_free_american_territories_desc: "이 한때 통합된 국가들은 이제 시험과 오류를 거쳐, 국가를 넘어선 단합을 통해 새로운 길을 열었습니다. 우리는 이제 자랑스럽게 우리의 공동 운동을 \"자유로운 미국의 영토\"로 선언할 수 있습니다. 이제 이 땅에 사는 모든 사람들은 외부 정부와 부당한 세력의 간섭 없이 자신의 집, 가족, 삶을 마음껏 누릴 수 있습니다. 연대는 영원히 우리의 것이 될 것입니다."
 USA_more_than_20_support_for_reactonary_government_TT: "§Y[Conservative_L]§!의 지지율이 20% 초과"
 USA_decisions_domestic_policies: "국내 정책"
 USA_decisions_domestic_policies_desc: "미국에는 국내 문제를 \\"처리\\"해 온 파란만장한 역사가 있습니다. 많은 이들은 이를 의회의 흔한 소동으로 치부하지만, 선동가와 언론사들로 인해 사안들이 점점 더 감정적이고 착취적으로 변하면서 일종의 위기의 분기점으로 이어질 수 있다고 우려하는 이들도 있습니다. 그럼에도 논의하고 결정해야 할 사안들이 있습니다. 토론을 준비하십시오."
 USA_decision_post_nine_eleven_response: "9.11 이후의 대응"
 USA_decision_post_nine_eleven_response_desc: "우리나라를 초토화한 공격 이후 며칠 동안, 우리는 대응에 있어 올바른 행동 방침이 무엇인지 모색해야 합니다. 우리의 대응은 세상에서 이러한 테러 행위를 꾀하는 자들에게 어떤 반응을 각오해야 하는지 보여 주는 선례가 될 것이기 때문입니다."
 USA_decision_post_nine_eleven_security_concerns: "9.11 이후의 보안 우려"
 USA_decision_post_nine_eleven_security_concerns_desc: "소련이 붕괴한 이래 항공 여행과 국가 전반의 보안은 느슨했습니다. 그러나 이 가혹하고 냉엄한 각성은 국가 전체의 안보와 안전을 어떻게 더 잘 보장할 것인가에 대한 논의를 되살렸습니다."
 USA_decision_religious_freedoms_debate: "종교의 자유 논쟁"
 USA_decision_religious_freedoms_debate_desc: "With the terrorist attacks being perpetrated by a zealous religious sect, many agnostics and atheist are coming out and putting their two cents about what should and shouldn't be free to do religiously. This debate is very sensitive and some belive they are conflating individual actions to whole groups."
 USA_decision_school_choice_dilemma: "학교 선택의 딜레마"
 USA_decision_school_choice_dilemma_desc: "교육부와 연방 교육 제도가 공식화된 이래, 주 정부들은 일부가 정부의 감독이라 부르는 것에 늘 반발해 왔습니다. 그럼에도 부모가 자녀를 민간 학교와 공립 학교 중 어디로 보낼지 선택할 수 있는 학교 선택권을 둘러싼 끊임없는 논쟁은 적어도 민감한 주제였습니다. 우리는 국가 표준으로 인정되는 공식 교육 과정에서 무엇이 허용되고 무엇이 허용되지 않아야 하는지를 정리해야 합니다."
 USA_decision_the_power_grid_debate: "전력망 논쟁"
 USA_decision_the_power_grid_debate_desc: "우리나라는 매우 독특합니다. 동부와 서부를 위한 두 개의 주요 전력망이 있을 뿐만 아니라, 텍사스 주는 독자적인 전력망까지 갖고 있습니다. 이 모든 체제는 비평가들을 토론의 장으로 불러 모았는데, 이 전력망들을 이루는 조직과 기반시설이 좋게 말해도 형편없고 나쁘게 말하면 터지기를 기다리는 재앙이기 때문입니다. 따라서 시민과 국가 전체의 미래 수요를 생각한다면, 우리 전력망의 발전을 앞으로 어느 방향으로 이끌어 갈지 모색해야 합니다."
 USA_decision_food_stamps_fiasco: "식료품 구매권 소동"
 USA_decision_food_stamps_fiasco_desc: "우리나라의 사회 안전망은 사회 결속의 핵심 근간입니다. 그러나 바로 이 안전망이 그러한 혜택을 받을 자격이 있다고 생각하는 이들에 의해 악용되고 있습니다. 이제 문제는 이 상황이 진짜 문제로 번지기 전에 어떻게 다룰 것인가입니다."
 USA_decision_the_rent_crisis: "임대료 위기"
 USA_decision_the_rent_crisis_desc: "주택 구입이 점점 어려워지고 시장 논리상 임대를 강요받으면서 지난 수십 년간 전국의 임대료가 폭등했습니다. 이 추세가 계속되면 국가적 재앙을 맞게 될 것입니다."
 USA_decision_civil_rights_contentions: "민권 논란"
 USA_decision_civil_rights_contentions_desc: "Grudges and judgemental assumptions are a prime human defense mechanism against change. Regardless if the change was for good or ill humans have always been slow to change and we are seeing that even to this very day. The Civil Right Act was passed some 40+ years ago and yet we as Americans cannot seem to get along and talk out our differences with other Americans. So now we must look to deal with this stubbornness and inability to change. It'll be tough, but we must set a standard if we are to move forward, not backwards as a nation."
 USA_decision_the_marriage_question: "결혼 문제"
 USA_decision_the_marriage_question_desc: "To be or not to be, this question seems to be asked more and more as different people consider what the idea of marriage is. Those that are god fearing say it is only between a man and a woman, while those who remember the days of the sexual revolution believe it is the bond between to loving adults. Nevertheless of what we think we must assess the population and understand where the hearts and minds lie on the issue."
 USA_decision_continued_gun_control_problems: "계속되는 총기 규제 문제"
 USA_decision_continued_gun_control_problems_desc: "수정헌법 제2조는 국방 예산 다음으로 우리나라에서 가장 큰 정치적 골칫거리입니다. 그럼에도 사람들은 수정헌법 제2조의 요점이 무엇인지, 실제 범위가 어디까지인지를 갈수록 더 많이 논쟁하고 있습니다. 우리에게 영향을 미치는 진짜 문제에 집중하려면 이 문제를 싹부터 잘라야 합니다."
 USA_decision_rising_police_problems: "늘어나는 경찰 문제"
 USA_decision_rising_police_problems_desc: "Unchecked use of authority in local law enforcement agencies has seen a smattering of localized events which have gained national traction. This along with the growing militarization of polices forces all around the country have seen the need for the federal government to do something."
 USA_decision_healthcare_drug_transparency_debates: "의약품 투명성 논쟁"
 USA_decision_healthcare_drug_transparency_debates_desc: "최근 몇 달 동안 신약의 타당성과 그 실제 비용에 대한 우려가 커지면서 평범한 메디케어 및 메디케이드 이용자들의 관심이 쏠렸습니다. 이에 따라 전국의 유권자들은, 일부이긴 하지만 의료비 위기를 키우고 있는 이 심화되는 위기에 대해 의회가 조치를 취하도록 청원하고 애원하고 있습니다."
 USA_decision_healthcare_billing_troubles: "의료비 청구 문제"
 USA_decision_healthcare_billing_troubles_desc: "최근 몇 년간 의료 비용은 오르기만 했습니다. 이 급격한 상승은 정치적 수류탄이자 원칙적으로도 진정한 문제입니다. 앞으로 나아가 우리나라를 위한 더 나은 의료 기관을 만들려면 이 문제를 어떻게 해결할지 찾아내야 합니다."
 USA_decision_social_security_not_secure: "불안한 사회보장"
 USA_decision_social_security_not_secure_desc: "사회보장 프로그램은 솔직히 우리나라 최대의 정치적 시한폭탄입니다. 예산을 삭감하면 낙선하고, 아무것도 하지 않아도 낙선하며, 예산을 늘려도 나머지 연방 예산에 영향을 주기 때문에 낙선합니다."
 USA_decision_police_training_troubles: "경찰 훈련 문제"
 USA_decision_police_training_troubles_desc: "최근의 사건들은 지역 법 집행 기관에서 공격성 콤플렉스가 커지고 과도한 무력 사용 경향이 늘고 있음을 보여 주었습니다. 이는 시위의 형태로 반발을 불러왔고 이른바 \\"경찰 예산 삭감\\"이라는 새로운 운동을 낳았습니다. 심각한 사태가 터지기 전에 이를 해결해야 합니다."
 USA_decision_the_green_wave_debate: "녹색 물결 논쟁"
 USA_decision_the_green_wave_debate_desc: "In recent years the development as well as lobbying for renewable energy forms of energy production has gained considerable traction. This has culminated in renewed interest in the age old boogy man of politics since the dawn of modern industrialization itself. That of Climate Change, or as some may remember it as Global Warming. Regardless as technology advances so do people's understandings as well, we must figure out what stance the federal government will have on this new way forward."
 USA_decision_the_job_impact_scare: "일자리 충격 공포"
 USA_decision_the_job_impact_scare_desc: "\\"녹색 경제\\"에 대한 최근의 소문이 퍼지면서, 이런 변화가 수많은 일자리에 얼마나 극적인 영향을 미칠지에 대한 두려움에 휩싸인 사람들이 많습니다. 자동화와 인공지능에 대한 공포와 마찬가지로, 이러한 변화로 얼마나 많은 일자리와 기술이 무효화되거나 불필요해질지 의문을 품는 이들이 많습니다. 따라서 이 사태에 대한 군중 심리 때문에 낙선하는 일이 없도록, 이러한 변화를 어떻게 다룰지 신중히 생각해야 합니다."
 USA_decision_the_social_impact: "사회적 영향"
 USA_decision_the_social_impact_desc: "The \"Green Economy\" will have an interesting social impact as many advocate for standardizing and forced modernization of housing both new and old. Some argue this would break many home owners and be the biggest mistake of governmental regulation since the government inaction which resulted in the Penn Central Railroad Bankruptcy back in the 1970s. others say it will be something that can be rolled out with new houses though there are concerns of the culture shock this may have on our ever aging population demographics. Regardless a choice needs to be made and made sooner rather than later."
 USA_decision_the_nuclear_question: "원자력 문제"
 USA_decision_the_nuclear_question_desc: "녹색 경제를 만들기 위한 논쟁이 격화되면서, 많은 이들이 우리가 이처럼 급격한 변화를 어떻게 이룰 계획인지 궁금해하고 있습니다. 계속 맴도는 한 가지 아이디어는 국내 원자력 역량의 재활성화와 투자입니다. 우리에게는 군사 역량이 충분한데 그 잉여분을 민간용으로 쓰지 못할 이유가 없다는 것입니다. 그러나 이 생각이 또 다른 후쿠시마나 스리마일 섬 사고를 부를 것이라고 우려하는 이들도 있습니다. 어쨌든 우리는 \\"원자력 문제\\"에 대해 틀림없이 최선이라 할 만한 결과가 무엇인지 검토해야 합니다."
 USA_country_flag_arms_dealer: "모두를 위한 무기 거래"
 USA_country_flag_legal_interventionism: "자유를 바라는 이들을 지지한다"
 USA_country_flag_war_on_terror: "독수리가 전쟁을 외친다"
 USA_collapse_description: "모든 비미국 영토가 해방된다"
 USA_militarist_lead_coalition: "국방부가 승리한다"
 USA_fascist_lead_coalition: "자연주의자들이 민심을 얻었다"
 USA_modern_monarchist_lead_coalition: "현대 군주주의 운동이 카리스마로 지도력을 차지한다"
 USA_red_junta_commissariat_coup: "정치위원단이 통제권을 장악한다"
 USA_the_socialist_workers_party_seize_power: "The SWP Trotskyist Have Seized Power"
 USA_the_anarchist_society_collectivizes_victory: "아나키스트 사회가 과반수를 확보한다???"
 wall_street_force_dynamic_modifier: "월스트리트 경제 세력"
 USA_iraq_war_cost: "이라크 전쟁"
 USA_iraq_war_cost_desc: "The Iraq War has rocked with relative failure. Our efforts to continue the war will now cost us a considerable amount of money for some time, as we must scrap together money for the equipment and manpower required."
 USA_idea_aas_food_for_all_policy: "만인을 위한 식량 정책"
 USA_idea_aas_food_for_all_policy_desc: "농업 발전 측면의 현대적 혜택이 크게 활용되지 못하고 있습니다. 우리는 우리나라를 굶주림 없는 나라로 만들 것입니다. 모두를 위한 식량이 있도록 확실히 하겠습니다."
 USA_idea_aas_existence_is_pain: "존재는 고통이다"
 USA_idea_aas_existence_is_pain_desc: "우리의 존재 자체가 사회 전반의 이른바 \\"사회 질서\\"에 두려움을 부추기고 있습니다. 그들은 우리를 고립주의자에 가깝게 보기보다는, 자신들의 규범과 안정에 대한 위협으로 봅니다. 따라서 우리가 모든 분쟁을 막기 위해 할 수 있는 모든 것을 하더라도, 전쟁의 북소리가 울리고 있으며 생존이 진정한 다음 주요 목표가 될 것으로 보입니다."
 USA_idea_high_price_for_high_rewards: "높은 대가, 높은 보상"
 USA_idea_high_price_for_high_rewards_desc: "제2차 거대 우주 경쟁이 시작되었습니다. 이 경쟁의 승자가 달일지, 화성일지, 어쩌면 금성일지 우리는 결코 알 수 없을 것입니다. 누가 알겠으며, 지금 시점에서 누가 신경 쓰겠습니까. 잠재력은 끝이 없고, 우리는 더 이상 지구에 국한되지 않고 자원을 얻고 찾는 판도라의 상자를 열었습니다. 큰 대가를 치렀지만, 결국 그만한 가치가 있습니다."
 USA_idea_aas_the_village_model: "마을 모델"
 USA_idea_aas_the_village_model_desc: "By encouraging a new age of homesteading as well as breaking up corporate and office type entities. This in turn deurbanizes as well as decentralizes the economy and makes it a lot more manageable and understood by the average citizen. This model will also home to create volunteers and defenders for they are not just fighting for a collective large entity, they are truly fighting for their homes and families."
 USA_idea_aas_the_new_agrarian: "새로운 농본주의자"
 USA_idea_aas_the_new_agrarian_desc: "세계에서 가장 큰 문제 중 하나는 생존을 위한 식량 확보입니다. 자연적이든 인위적이든 이러한 부족 현실은 우리에게 유리하게 작용합니다. 우리 공동체가 보다 전통적인 삶의 방식으로 돌아가도록 장려하는 데 전적으로 집중할 수 있다면, 그때 생기는 잉여분을 흥정 카드로 삼아 외세로부터 독립을 지킬 수 있습니다. 경제적으로는 다소 험난하겠지만, 우리는 어머니 아나키의 이름으로 승리할 것입니다."
 USA_idea_aas_minuteman_program: "민병대원 계획"
 USA_idea_aas_minuteman_program_desc: "가정과 마음을 지키기 위해 우리 국민은 자신들의 것을 지키려고 최선을 다할 것입니다. 지역 안내인과 현대 열감지 기술의 현실에 대한 이해를 통해, 우리는 자신들의 것을 지키기 위해 우리 국민이 1분 안에 달려올 미래를 그려 나갈 것입니다."
 USA_iraq_war_cost_TT: "§Y이라크 전쟁§!에 매주 §R$2.000§! §Y십억§!을 투입함.\n"
 USA_events_domestic_policies.1.t: "국가의 방향"
 USA_events_domestic_policies.1.d: "이 나라를 충격에 빠뜨린 테러 공격 이후, 우리는 이미 어두워 보이는 이 세기에 대해 앞으로 우리의 국가 정책이 무엇이 될지 모색해야 합니다. 우리는 좀 더 간섭하지 않고 냉전 시대의 군사력을 이용해 무기를 판매하고 정의의 부드러운 권력을 행사할 수 있습니다. 또는 \"미국군단\"과 같은 형태로 균형을 맞추며, 자문과 장비 제공 등을 통해 개입할 수 있습니다. 아니면, 일부는 이를 '테러와의 전쟁'이라 부르며 악의 근원을 타격할 수도 있습니다. 어떤 선택을 하든, 그 선택은 앞으로 몇 년간 우리 나라를 정의할 가능성이 큽니다."
 USA_events_domestic_policies.1.o1: "Lets Avoid An Illegal War"
 USA_events_domestic_policies.1.o2: "스스로의 안보를 추구해야 한다"
 USA_events_domestic_policies.1.o3: "테러와의 전쟁을 준비하라"
 USA_events_domestic_policies.2.t: "안보 우려"
 USA_events_domestic_policies.2.d: "우리나라에 대한 공격 이후 많은 이들이 어떻게 그런 공격이 가능했는지 의문을 제기해 왔습니다. 이제 최악의 사태가 다시 닥치거나 다른 누군가가 우리의 아름다운 나라를 다시 노릴 경우에 대비하여, 안보 노력을 강화하고 시민의 안전을 보장할 방법을 두고 논쟁이 뜨겁게 이어지고 있습니다."
 USA_events_domestic_policies.2.o1: "국내 안보를 우선시한다"
 USA_events_domestic_policies.2.o2: "솔직한 균형을 찾아야 한다"
 USA_events_domestic_policies.2.o3: "더 공세적으로 생각해야 한다"
 USA_events_domestic_policies.3.t: "종교의 자유에 대한 우려"
 USA_events_domestic_policies.3.d: "The acts of terror which befell this nation were unfortunately perpetrated by an extremist faction of the Islamic religion. This has sparked among the obvious surge in descrimination among Arab minorities, a general concern about what religious freedoms genuinely mean when it comes to the public adornment of such. Now we must make a choice in regards to how we'll overcome these fears."
 USA_events_domestic_policies.3.o1: "우리는 이유가 있어서 자유롭다"
 USA_events_domestic_policies.3.o2: "아마도 더 세속적이어야 할 것이다"
 USA_events_domestic_policies.3.o3: "표적화된 제한을 이해한다"
 USA_events_domestic_policies.4.t: "학교 선택, 당신의 선택인가?"
 USA_events_domestic_policies.4.d: "지난 몇 주 동안 의원들은 교육 기관에 대한 학부모의 선택권을 둘러싼 형식적 절차를 두고 논쟁해 왔습니다. 완전한 공교육 또는 완전한 사교육 형태로 나아가는 것과 현행 기존 모델의 개혁에 관련된 제안들이 모두 논의 테이블에 올라 있습니다. 그러나 회기가 곧 끝나므로 곧 그들이 어떤 선택을 했는지 듣게 될 것입니다."
 USA_events_domestic_policies.4.o1: "연방 표준이야말로 진정한 표준이다"
 USA_events_domestic_policies.4.o2: "모두에게 선택권이 있어야 한다"
 USA_events_domestic_policies.4.o3: "사립 교육이 표준이다"
 USA_events_domestic_policies.5.t: "전력망 논쟁"
 USA_events_domestic_policies.5.d: "의원들은 최근 우리나라 전력망의 현황과 향후 발전 방향에 대해 토론하고 숙의했습니다. 한 주요 진영은 전력망과 책임을 에너지부에 완전히 집중시키기를 원합니다. 다른 진영은 전력망 자체는 현 상태를 유지하되 향후 개발은 모든 형태의 발전 방식에 걸쳐 균형을 이루어야 한다고 봅니다. 마지막으로 세 번째 주요 집단은 전력망을 완전히 분산시키고 민간 부문이 인수하도록 하기를 원합니다. 마지막 안의 규제 문제는 명백한 다음 단계가 되겠지만, 민영화를 통한 혁신의 전망은 흥미로운 가능성입니다."
 USA_events_domestic_policies.5.o1: "United States Mean United Power"
 USA_events_domestic_policies.5.o2: "미래는 균형을 보여줄 것이다"
 USA_events_domestic_policies.5.o3: "자유 시장이 뛰어날 것이다"
 USA_events_domestic_policies.6.t: "푸드 스탬프 파문"
 USA_events_domestic_policies.6.d: "국가의 사회 안전망은 양날의 검입니다. 예산 측면에서는 정치적 도깨비인 국방 예산마저 결국 앞지를 거대하고 끊임없이 커지는 부담입니다. 그러나 도덕적으로나 발전의 측면에서 보면 현대 국가를 하나로 유지하기 위해 필요합니다. 하지만 최근 악용과 남용 사례가 늘면서 푸드 스탬프 프로그램에 대한 관심이 점점 더 높아지고 있으며, 많은 이들이 실제보다 더 많은 자녀가 있다고 주장하고 받을 자격이 없는 더 많은 돈을 청구하고 있다고 합니다. 이 프로그램의 안정성을 유지하려면 이러한 허점과 악용을 해결해야 합니다."
 USA_events_domestic_policies.6.o1: "이러한 우려는 과장되었다"
 USA_events_domestic_policies.6.o2: "요건과 증빙 방식을 개혁한다"
 USA_events_domestic_policies.6.o3: "우려는 사실이다, 지금 표적 개혁을 시행하라"
 USA_events_domestic_policies.7.t: "임대료 위기"
 USA_events_domestic_policies.7.d: "As housing becomes more unattainable each year by the average citizen, more and more become reliant on renting in order to have a roof over their head. This lopsided demand has caused rental prices to rise at a scarily high rate for a couple of decades now. Some in congress are debating as we speak, about the viability of things like rental controls and or reforms to the way on how houses are built. As such many wonder if a hard handed approach will be utilized or if possibly the compromise is even any better than what is going on now."
 USA_events_domestic_policies.7.o1: "당분간은 임대료 통제"
 USA_events_domestic_policies.7.o2: "건축 방식을 개혁해야 한다"
 USA_events_domestic_policies.7.o3: "민간 부문이 제대로 적응하도록 맡긴다"
 USA_events_domestic_policies.8.t: "계속되는 민권 긴장"
 USA_events_domestic_policies.8.d: "One might have thought that when the Civil Rights Act of the 1960s was passed that America in the new millennia would've moved past its Jim Crow days. While a vast majority have, the vocal minority is apparently the only thing that both people and the news ever focus on. As such with scattered examples of secretion that is racial tensions and hate crimes still influencing the actions of some, we must seek out real answers to quash this age old question thought answered long ago."
 USA_events_domestic_policies.8.o1: "새로운 민권법을 통과시켜야 한다"
 USA_events_domestic_policies.8.o2: "제한적인 입법 개혁이 공정하면서도 단호하다"
 USA_events_domestic_policies.8.o3: "주마다 문제가 있다, 스스로 해결하게 하라"
 USA_events_domestic_policies.9.t: "결혼의 문제"
 USA_events_domestic_policies.9.d: "결혼은 사랑의 결속이며 성인 두 사람 사이의 결합의 증표입니다. 최근 일부 개인이나 사건이 일부 사람들에게 불쾌하게 느껴지는 행위로 번지면서 이 문제 자체가 논란을 일으켰습니다. 종교 사업체가 동성 커플에게 웨딩 케이크를 거절한 일이든, 더 이색적인 손님으로 알려진 지역 사교 장소 및 명소에 대한 노골적인 증오 범죄이든 마찬가지입니다. 어쨌든 또 다른 성 혁명의 도화선이 생기기 전에 이 문제에 어떻게 대처할지 알아내야 합니다."
 USA_events_domestic_policies.9.o1: "나는... 법적 수단을 입법해야 한다고 믿는다"
 USA_events_domestic_policies.9.o2: "법률 및 세제 개혁이 필요하다고 생각한다"
 USA_events_domestic_policies.9.o3: "주지사들에게 제 할 일을 하라고 전하라!"
 USA_events_domestic_policies.10.t: "총, 총, 그리고 더 많은 총"
 USA_events_domestic_policies.10.d: "The 2nd Amendment debate has been practically a national passtime for the citizens and political leaders. Some argue that making laws for already lawful citizens has no real impact on the actual problem. Others say that those who supposedly \"collect\" guns are domestic terrorist wating to happen. In the end, they both rip each other apart day in and day out causing much civil unrest in their flamboyant natures. In the end it is our decision which matters, whether we cater to the supposed \"left\" or \"right\" matters very little in a debate that has never asked the real questions. Lets just get this over with we've got other issues to debate."
 USA_events_domestic_policies.10.o1: "총기 환매와 규제가 필요하다"
 USA_events_domestic_policies.10.o2: "Lets Legislate Limited Regulations"
 USA_events_domestic_policies.10.o3: "왜 또 주 차원의 문제를 다루고 있는가!?"
 USA_events_domestic_policies.11.t: "시민 보호, 시민적이지 않은가?"
 USA_events_domestic_policies.11.d: "The post 9/11 reaction to security by both federal and state governments has seen a rising authoritative hand in terms of police presence and how to approach situations. This external influences has also seen a supposed need to almost militarize the police forces of the nation, which in turn has resulted in a string of unsavory events to transpire. As such we need to quell this rising problem if we are to ensure the public trust in law enforcement."
 USA_events_domestic_policies.11.o1: "연방 조사 위원회가 최우선이다"
 USA_events_domestic_policies.11.o2: "예산을 재편하고 규정을 개혁한다"
 USA_events_domestic_policies.11.o3: "주 차원의 문제가 하나만 더 오면 폭발할 것 같다"
 USA_events_domestic_policies.12.t: "마약 위기... 그 마약 말고 다른 마약"
 USA_events_domestic_policies.12.d: "The drug transparency crisis, a part of the growing monster that is the US Healthcare Crisis is one which has gained more and more traction over the months. Rising medical costs wherein a part are simply cause the doctor perscribe some medicine you could almost get over the counter has seen many question the validity of such prices. While obviously the process of creating new drugs for the use in medical treatments is a costly investment, it is however the easiest thing to exploit. The FDA only does so much within its given power and budget as well as there are other ways companies could exploit the matter at hand. So we must now delve into the situation and look to resolve it before we find ourselves dealing with a crisis...or voted out come next election."
 USA_events_domestic_policies.12.o1: "FDA의 예산과 권한을 확대한다"
 USA_events_domestic_policies.12.o2: "처방 개혁을 추진하고 FDA의 예산을 늘린다"
 USA_events_domestic_policies.12.o3: "내부 심의위원회를 설치한다"
 USA_events_domestic_policies.13.t: "의료비 청구 문제"
 USA_events_domestic_policies.13.d: "The rising medical cost is a crisis in its own right. Part of this crisis is the lack of billing transparency in terms of what things cost and the inability to consult and understand why things cost the way they do. To this effect we must seek out real answers to ensure this problem is solved or at least doesn't get any worse then what it already has."
 USA_events_domestic_policies.13.o1: "청구 위원회를 설치한다"
 USA_events_domestic_policies.13.o2: "투명성 집행에 관한 입법 개혁"
 USA_events_domestic_policies.13.o3: "각 주에 분권화된 심의위원회를 설치한다"
 USA_events_domestic_policies.14.t: "사회보장은 안전하지 않은가?"
 USA_events_domestic_policies.14.d: "The growing pains that is the Social Security Program is the fastest growing problem that everyone knows, but doesn't actually care about. Over the years we've thrown more and more money at the issue which has resulted it competing for the nation's biggest expenditure. Little known fact about the issue is that nearly 25% of the budget for the program goes towards administration of the program. Regardless we really need to observe and fix this issue before we genuinely need to worry about it."
 USA_events_domestic_policies.14.o1: "우리의 문제가 되지 않을 만큼 급여를 인상한다"
 USA_events_domestic_policies.14.o2: "운영 및 예산 배분에 관한 입법 개혁"
 USA_events_domestic_policies.14.o3: "예산을 삭감하고 행정 부문의 축소를 강제한다"
 USA_events_domestic_policies.15.t: "경찰 훈련 문제"
 USA_events_domestic_policies.15.d: "Rising public unrest as local law enforcement agencies seem to be using more and more aggressive forms of action to handle situations. This has resulted in a smattering of events which have tanked the public trust in their local law enforcement agencies. Protest have been on the rise and a new movement called \"Defund The Police\" has started to gain national attention. Congress has convened to handle the issue and hopefully put an end to this conflagration of an issue at hand."
 USA_events_domestic_policies.15.o1: "연방 표준 훈련 위원회를 설립한다"
 USA_events_domestic_policies.15.o2: "훈련 개혁과 예산 배분 요건을 입법한다"
 USA_events_domestic_policies.15.o3: "차라리 경찰에 더 많은 예산을 지원하는 것은 어떤가"
 USA_events_domestic_policies.16.t: "녹색 물결의 부상"
 USA_events_domestic_policies.16.d: "지난 몇 년간 에너지 생산 방식을 다각화해야 할 필요성이 커지고 환경주의자들의 선동도 거세지면서 변화를 원하는 사람들이 늘고 있습니다. 따라서 우리는 선택지를 고려하고 이른바 \\"녹색 경제\\"에서 우리가 진지하게 어떤 역할을 맡아야 하는지 파악해야 합니다. 국민이 대신 해 줄 일을 왜 굳이 강제로 바꾸려 하겠습니까."
 USA_events_domestic_policies.16.o1: "전에 없던 새로운 기준을 만들 것이다"
 USA_events_domestic_policies.16.o2: "필요한 곳에서 중재하고 지원하겠다"
 USA_events_domestic_policies.16.o3: "국민은 변화를 원한다, 변화를 만들 능력을 주어라"
 USA_events_domestic_policies.17.t: "일자리 영향에 대한 공포"
 USA_events_domestic_policies.17.d: "The development and rising push to create what some are calling the \"Green Economy\". Has begun to spook and frighten those who do not understand the metrics of change or those who put too much emphasis in the abilities of those crying for change. Nevertheless if we do want to change we must understand and prepare for the reprecussions that would occur in the overall job market. As certain jobs and skill sets would become redundant and or nullified in their use, new ones or what were seen as obscure jobs and skill sets may take their place in terms of demand. Therefore we must decide what is the best approach in addressing such changes."
 USA_events_domestic_policies.17.o1: "진정한 변화에는 진정한 노력이 필요하다"
 USA_events_domestic_policies.17.o2: "완만한 변화에는 균형 잡힌 노력이 필요하다"
 USA_events_domestic_policies.17.o3: "시장은 변화를 안다, 모든 노력을 시장에 맡겨라"
 USA_events_domestic_policies.18.t: "사회적 영향 위기"
 USA_events_domestic_policies.18.d: "With the full swing of debates over the implementation of the supposed Green economy, many wonder just how much social change this will have on the daily lives of your average citizen. Some are worried a heavy handed approach will strip us of cultural identity, while others think that only new housing should be affected instead of standing ones except whatever the current home owner request. Regardless we need to make a choice and regulations on how to proceed forward with such a possibility."
 USA_events_domestic_policies.18.o1: "변화를 강행하되 주택 소유주에게 보상한다"
 USA_events_domestic_policies.18.o2: "신축 건물에 대한 새로운 기준"
 USA_events_domestic_policies.18.o3: "국민이 스스로 결정하게 하고, 할 수 있는 모든 것으로 지원한다"
 USA_events_domestic_policies.19.t: "원자력의 문제"
 USA_events_domestic_policies.19.d: "With more cries for a Green Economy growing ever stronger, many wonder what role should nuclear energy have in this green economy. Some say its literally the only actual green energy, others cry Chernobyl and Three mile Island. Whatever the case may be, our decision will set the standard for the coming administrations as well as the expectation the voters will have in achieving said goals with."
 USA_events_domestic_policies.19.o1: "녹색으로 가든지 집에 가든지, 이게 내 소신이다."
 USA_events_domestic_policies.19.o2: "우리 에너지 바구니에 계란 하나를 더"
 USA_events_domestic_policies.19.o3: "풍력, 태양광, 수력으로 충분하다"
 USA_events_domestic_policies.20.title1: "마지막 거함들"
 USA_events_domestic_policies.20.title2: "마지막 거함"
 USA_events_domestic_policies.20.title3: "과거의 거함들"
 USA_events_domestic_policies.20.d: "아이오와급 전함은 오키나와와 한국 전쟁, 그리고 걸프 전쟁까지 거의 60년 동안 충실히 복무해왔습니다. 그러나 소련의 붕괴와 이 배들을 계속 운영하는 데 드는 비용 상승으로, 의회는 마지막 두 척의 아이오와 전함을 퇴역시키라는 압박을 강화하고 있습니다. 일부 참전 용사들은 이미 이 배들을 떠 있는 박물관으로 전환하자고 제안하고 있습니다. 우리는 의회를 무시하고 이 두 배를 계속 운영할 자금을 확보할 수 있지만, 그렇게 되면 의회와의 관계가 어색해질 것입니다. 또한 한 걸음 더 나아가 뉴저지호와 미주리호를 다시 현역에 복귀시킬 수도 있지만, 이런 결정은 의회와 상원의 분노를 일으킬 것이 분명합니다."
 USA_events_domestic_policies.20.d2: "The remaining Iowa-class battleship has served us faithfully for nearly 60 years, from Okinawa and the Korean War to the Gulf War. However, with the fall of the USSR and the rising costs of keeping this ship in service, Congress is becoming more insistent on retiring the final Iowa ship. Some veterans are already proposing to transform it into a floating museum. While we could overrule Congress and secure funding to keep the ships active, it would put us at odd with them. We could also go a step further by bringing the New Jersey and Missouri back into service. But such a decision would no doubt provoke the ire of both Congress and Senate."
 USA_events_domestic_policies.20.d3: "오키나와와 한국 전쟁에서 걸프 전쟁에 이르기까지 거의 60년 동안 충실히 복무한 아이오와급 전함들은 최근 퇴역하여 박물관 전시물이 되었습니다. 그러나 이 과거의 거인들은 더 많은 사람들이 박물관을 찾아 경외심을 품고 그 화려한 역사를 배우면서 최근 점점 더 많은 관람객을 끌어모으고 있습니다."
 USA_events_domestic_policies.20.a: "아이오와급을 퇴역시켜 박물관 함선으로 바꾼다"
 USA_events_domestic_policies.20.a1: "마지막 아이오와급을 퇴역시켜 박물관 함선으로 바꾼다"
 USA_events_domestic_policies.20.b: "남은 두 척의 아이오와급을 현역으로 유지할 자금을 확보한다"
 USA_events_domestic_policies.20.b1: "마지막 남은 아이오와급을 현역으로 유지할 자금을 확보한다"
 USA_events_domestic_policies.20.c: "Congress be damned! Secure the funding to bring back all Iowas battleship!"
 USA_events_domestic_policies.20.d1: "아이오와급 전함들의 새로운 보금자리"
 USA_recomission_ships_TT: "다음 §H전함§!을 §G재취역§!시킵니다:\n- §CUSS 뉴저지§!\n- §CUSS 미주리§!\n§B항구: 샌프란시스코§!"
 USA_delete_iowa_class_TT: "Will §RDecommission§! any §HIowa Class§!! Battleship"
 USA_keep_iowa_class_TT: "남아 있는 모든 §H아이오와급§! 전함을 계속 §H유지§!합니다"
 USA_truly_USA_reformed_republic: "진정으로 개혁된 공화국"
 USA_truly_USA_reformed_republic_desc: "바람이 지나가고 고요가 자리를 잡으면서, 이렇게 일어서고 무너지고 다시 일어선 나라의 지평선에 무엇이 있을지 궁금해집니다. 성취감은 느끼지만 일은 결코 끝나지 않으며, 그래서 우리는 미래를, 그리고 우리에게 도움과 길잡이를 구하는 이들을 바라보아야 합니다. 스스로를 도울 수 있었던 것처럼, 우리도 뒤를 돌아보고 가능한 모든 방법으로 그들을 도와야 합니다."
 USA_dynamic_modifier_department_of_the_interior: "미국 내무부"
 USA_dynamic_modifier_department_of_the_interior_desc: "The US DotI is responsible for land preservation and resource management as well as a small host of other things. However it is the sub-department of the DotI known as the Department of Natural Resources that tends to be on a lot of people's shit list to say the least. However the Department of the Interior has a job to do and for the most part they do actually do it, to the dislike of many. Now as a new millennia is upon us the department must find new ways to balance social developments and land preservation in this ever changing world."
 USA_dynamic_modifier_department_of_energy: "미국 에너지부"
 USA_dynamic_modifier_department_of_energy_desc: "The DoE or Department of Energy is a very fickled department. Responsible for maintaining and adapting to the nation's energy needs the Department of Energy suffers a lot of red tape back and forthing as projects it wants to invest in at either told are not helpful for the environment or are in need of being changed or updated. Regardless with modern technology and a new green wave of energy production abilities the department may just find a way to keep things afloat for the foreseeable future."
 USA_dynamic_modifier_us_general_staff: "미국 합동참모부"
 USA_dynamic_modifier_us_general_staff_desc: "Ever since the Cold War ended the American general staff apparatus has had to adapt to a more peace time oriented environment. As a result more and more red tape and cumbersome bureaucracy measures have begun to take over aspects of the procurement and R&D sectors. As a result and the continued peace a slow but growing problem of recruitment and logistical cohesion when conducting something as simple as maintaining barracks and other housing structures for the troops has begun to take hold. Regardless the US general staff is one of the most proficient in its field and that field is war itself, so despite it's short comings, it's still got some kick in it."
 USA_dynamic_modifier_us_army: "미 육군"
 USA_dynamic_modifier_us_army_desc: "The United States Army is the core service branch that makes up the general land forces. Being one of the most developed branches the army actually comes in roughly third place budgeting wise as pirority shifted more towards the navy and air force respectively. However despite this the US army is a hard and well equipped force to handle just about anything it may face."
 USA_dynamic_modifier_us_navy: "미 해군"
 USA_dynamic_modifier_us_navy_desc: "미 해군은 공군과 국방 예산의 가장 큰 몫을 두고 경쟁하는 간판 군종입니다. 미 해군은 톤수 기준으로 세계 최대의 해군일 뿐 아니라, 미국이 전 세계에 소프트 파워를 행사하는 데 있어 가장 큰 강점이기도 합니다. 따라서 공군과 육군이 회계연도마다 예산 규모를 두고 다투는 동안에도, 미국이 현재 세계에서 차지한 위치를 지키는 데 미 해군이 지니는 중요성에는 많은 이들이 이의를 제기할 수 없습니다."
 USA_dynamic_modifier_us_airforce: "미 공군"
 USA_dynamic_modifier_us_airforce_desc: "미 공군은 연구개발의 특별한 자식입니다. 때로는 연구개발이 방위의 진정한 필요라기보다 취미로 보일 만큼 앞서 있지만, 세계 대부분이 여전히 40년, 거의 50년도 더 전에 개발된 항공기와 맞서 고군분투하고 있는 만큼 미 공군이 가장 두려운 존재 중 하나인 것은 놀랍지 않습니다. 친구든 적이든... A-10, 너를 두고 하는 말이다."
 USA_migrant_crisis_one: "남부 이민자 위기"
 USA_migrant_crisis_one_desc: "2013년 무렵부터 미국으로의 불법 이민이 충격적으로 급증해 왔습니다. 국경 주에 살지 않는 이상 대부분은 이를 실감하지 못하지만, 현실은 그보다 훨씬 심각합니다. 통계는 이민과 관련된 아동 및 여성 사망자가 급격히 늘었음을 보여 주며, 인신매매와 이 난민과 이민자들에 대한 기타 심각한 불법 행위와 관련된 범죄도 늘었습니다. 우리는 이 상황에 실질적인 자원을 투입하기 시작해야 하지만, 이제 공식적인 위기가 된 이 문제를 진정으로 해결하려면 실질적인 해법을 찾아야 합니다."
 USA_migrant_crisis_two: "남부 이민자 위기의 정체"
 USA_migrant_crisis_two_desc: "DACA와 DAPA 확대를 둘러싼 텍사스 대 미합중국 소송에서 연방정부가 최근 패소하면서, 남부 국경의 현 이민자 위기에 대해 대체로 아무런 조치가 이루어지지 않았습니다. 위기를 어떻게 다룰지를 두고 주 정부와 연방정부의 견해가 갈리고, 이 뜨거운 쟁점을 둘러싼 의회의 교착이 거의 끊이지 않으면서 넘어오는 이민자는 늘어나는 추세입니다. 의회는 해법을 찾아낼 수 있을까요?"
 USA_migrant_crisis_two_a: "남부 이민자 위기 완화"
 USA_migrant_crisis_two_a_desc: "최근 텍사스 대 미합중국 소송에서 연방정부가 승소하면서, 연방 자금과 미 국경순찰대 요원 증원으로 전체 불법 국경 통과가 감소했습니다. 그러나 이것이 진정한 성공인지 실패인지는 시간만이 결정할 것입니다. 연방정부가 사실상 자신들의 주를 난민 수용소로 내주었다는 데 실망한 국경 주가 많아졌기 때문입니다. 국경에서 먼 지역의 많은 이들은 이를 심한 과장으로 보지만, 현재로서는 무엇이 사실이고 아닌지 아무도 확신하지 못합니다."
 USA_migrant_crisis_three: "남부 이민자 문제"
 USA_migrant_crisis_three_desc: "최근 대법원 판결로 미국에 직접 입국하지 않고 다른 나라를 거쳐 온 이들의 망명 사건이 신속히 기각되었습니다. 이 판결의 도덕성에 의문을 제기하는 이들이 많지만, 기각 절차의 간소화는 망명 법원의 적체를 해소하는 데 제한적인 성과만 거두었습니다."
 USA_migrant_crisis_three_a: "남부 이민자 문제의 우유부단"
 USA_migrant_crisis_three_a_desc: "망명 기각 판결과 관련해 최근 대법원 구성원들 사이에서 벌어진 다툼이 이민 논쟁에 다시 불을 붙였습니다. 그러나 어떤 조치를 취하려는 기세가 꺾이면서, 이민은 물론 이민이 미국 경제 전반에 미치는 파급 효과의 물결과 영향에 대해서도 또다시 아무것도 이루어지지 않았습니다."
 USA_migrant_crisis_four: "커지는 문제"
 USA_migrant_crisis_four_desc: "The Southern Border Problem is one which stretches back to in some cases 2013. Where a shocking rise in unattended minors were encountered at the border. Rising crime rates related to human trafficking and other severe crimes were also seen on the rise due to the slow out stretching of resources being allocated to handle both normal traffic flow as well as immigration patterns both legal and illegal. From 2021-2024 a series of economic, social and natural disasters would hit a handful of central American nations resulting in what some hyperbolize as a \"monsoon\" of immigrants. However to many the problem doesn't solely fall on just the immigration, but on a series of out dated as well as counter intuative economic and social policies which have grown to decay under the quagmire of federal politics and political theater. In the end of it all, a problem is only a problem if you choose not to solve it or if you decide to make it one in the first place. So in that case, where or what is the real problem then."
 USA_migrant_crisis_five: "대체 무엇이 문제인가?"
 USA_migrant_crisis_five_desc: "남부 국경에서 수년간 골치 아픈 소식이 이어지고, 중앙아메리카의 사건으로 인해 통행과 이주가 인위적으로 급증했으며, 마침내 남부 국경 \\"문제\\"를 둘러싼 행동과 반응이 있었습니다. 이제 아무것도... 구체적인 조치에 있어서도 아무것도, 사람들이 집중했던 문제가 실은 진짜 문제가 아니었다는 점에서도 아무것도, 그저... 아무것도 없습니다. 미국은 근대에 들어 진지한 이민 문제를 겪은 적이 없기 때문입니다. 미국은 국내에서 자연 증가하는 인구가 아니니까요. 하지만 미국의 인구는 해마다 늘고 있다고 말씀하시겠지요. 그렇습니다, 늘고 있지요. 그러나 같은 기간에 미국이 받아들인 이민자는 얼마였습니까? 자, 진짜 문제가 무엇인지 말해 보십시오. 이민입니까, 아니면 금전이든 물자든 인력이든 자원의 배분입니까."
 USA_migrant_crisis_five_a: "A Immigration Issue"
 USA_migrant_crisis_five_a_desc: "미국과 멕시코 사이의 통상적인 통행 흐름에 더해 유입되는 이민을 다루기 위한 논의가 마침내 시작되었습니다. 많지는 않지만, 실질적인 진전을 이루기 위한 시작입니다."
 USA_migrant_crisis_six: "기회의 땅"
 USA_migrant_crisis_six_desc: "With the talks bearing fruit and the aftermath looking to open the Overton Window of American politics beyond just Red vs Blue. There is now a renewed understanding of the principle of what it means to be American. A land of opportunity, a land to start a new and a land for which when enough work is put in, one can play just as much if they allow themselves to. For now though big changes are abound for this renewed America, one which can understand the vital role that immigration has had in this modern age of economic enhancements and diversity."
 USA_econ_event.1.t: "미국 대 마틴 피터슨"
 USA_econ_event.1.d: "November 23rd 2004, an antitrust case filed against a branch of the Bayer AG rubber chemical products company in California was brought up on charges of price fixing via horizontal monopolization practices, which suppressed competition to keep pace and or conduct normal business in the defendants area of control. The courts have looked over the evidence and heard the testimonies of both parties, the court's decision is?"
 USA_econ_event.1.o1: "법원은 피고에게 유죄를 선고했다"
 USA_econ_event.1.o2: "법원은 피고에게 무죄를 선고했다"
 USA_econ_event.2.t: "미국 대 유나이티드헬스 & 퍼시피케어"
 USA_econ_event.2.d: "2005년 12월 20일, 경쟁사의 건강보험 자산을 인수한 유나이티드헬스 그룹을 상대로 반독점 소송이 제기되었습니다. 원고는 \\"유나이티드\\"가 미국 최대의 의료보험사이므로, 이미 폐쇄적인 시장에서 선두 경쟁사의 자산을 빼앗아서는 안 된다고 주장합니다. 법원은 증거를 검토하고 양측의 증언을 청취한 끝에 다음과 같이 결정했습니다?"
 USA_econ_event.2.o1: "법원은 유나이티드에 유죄를 선고했다"
 USA_econ_event.2.o2: "법원은 유나이티드에 무죄를 선고했다"
 USA_econ_event.7.t: "중국발 신종 바이러스 소문 확산"
 USA_econ_event.7.d: "2019년 12월 초부터 우한이라는 도시에서 사스 계열 바이러스가 퍼지기 시작했다는 소문이 나오고 있습니다. 일부는 이를 MARS, 즉 중국 본토 아시아 호흡기 증후군이라 부르는데, 중국에서 나왔다고 하기엔 영리하지만 주의를 흐리는 이름입니다. 그러나 붉은 용의 나라에서 나오는 신뢰할 만한 정보가 드물다는 이유로 이 위협을 일축하는 사람도 많습니다."
 USA_econ_event.7.o1: "이것이 주식 시장에 어떤 영향을 미칠까"
 USA_econ_event.8.t: "닷컴 버블 붕괴"
 USA_econ_event.8.d: "The Bursting of the Dotcom bubble was a predicted measure, several scandals and events related to these rapid rises to wealth had shown signs of crumbling. It was only with the compounded scares related to Japan going into another recession and some key scandles that shook investors away. Though the impacts were quick and recoverable many once rich companies were now closed and bankrupt. We can only hope to learn from the mistakes and see what happens next in this new millennia."
 USA_econ_event.8.o1: "새로운 천년, 새로운 문제들..."
 USA_econ_event.9.t: "인터넷 불황"
 USA_econ_event.9.d: "As the Dotcom bubble and other unfavorable events compounded in the nation and wider world. Many investors have decided to sell and panic which in turn has caused a minor recession. While some have called this recent economic downturn the Internet Recession, many opt for the more easier 2001 Recession."
 USA_econ_event.9.o1: "신시대가 무너지는가?!?"
 USA_econ_event.10.t: "높아지는 대중의 긴장"
 USA_econ_event.10.d: "As the new millennia has gone under way so has a new movement been slowly gaining traction. More and more there are reports of anti-business movements which are using these new buzz words like, Big Tech, Big Pharma, and Big Sugar. These movements are showing increases and yet also decreases in their organization, we can only hope that people will just return to their daily lives and cease the disruption they are causing."
 USA_econ_event.10.o1: "침착하게 열심히 일하라"
 USA_econ_event.11.t: "글로벌 금융 위기"
 USA_econ_event.11.d: "The Global economies tremble as the US markets become a minor free fall. Mounting bad loans, crashing housing prices and many other issues both domestically and internationally have culminated in an out right global recession. Many fear the recession could worsen into a depression but only time will show if such is the case."
 USA_econ_event.11.o1: "팔아라! 팔아라! 팔아라!"
 USA_econ_event.12.t: "서브프라임 모기지 위기"
 USA_econ_event.12.d: "Since 1999 the Mortgage markets have grown and grown, not only in size but also in volatility. Slow increases in human greed and over eagerness has lead to more bad loans being made to creditors that are obviously not within the requirements. This has finally mounted into a full on crash which has caused several businesses to go bankrupt and families to lose their homes. Public unrest is mounting and the value of the USD has been shaken that foreign investors have become a little more wary. Nevertheless we will work through this and move forwards beyond the troubles and into the triumphs."
 USA_econ_event.12.o1: "이 히피들은 사업을 이해하지 못한다"
 USA_econ_event.14.t: "2008년 주택 시장 붕괴"
 USA_econ_event.14.d: "Feeding off the opportunistic mortgages have lead to several defaults, these defaults along with the slow squeezing of the US middle class has resulted in many houses returning to the market at faster and faster rates. Driving down prices many people who invested into the housing market have now seen major losses and this feedback loop has culminated into several other economic events of these last couple years."
 USA_econ_event.14.o1: "동네가 망해간다"
 USA_econ_event.15.t: "커지는 시위"
 USA_econ_event.15.d: "Increasing sizes in movements related to pro-union activist along with anti-big business ferver seems to have reached a new high as sparatic movements have affected companies like Amazon, Walmart and other major brand names. While most see this as another rough patch, some show concern as to where these movements may progress towards. For now its uncertain what the future may entail."
 USA_econ_event.15.o1: "또 다른 오합지졸일 뿐이다"
 USA_econ_event.16.t: "장기 불황"
 USA_econ_event.16.d: "A culmination of economic mismanagement and the slow recovery from the Global Financial Crisis has resulted in an almost plateauing of economic activity. Many fear what this will mean as prices for basic commodities continue to rise and more people are thrown bak into the 9 to 5 grind. Congress has states they are working on the issue and hope the crisis will end soon. The question is, what is considered soon...."
 USA_econ_event.16.o1: "우리는 더 나은 재건을 이룰 것이다"
 USA_econ_event.17.t: "변화의 소문?"
 USA_econ_event.17.d: "Recently more and more rumors about the status of the United States has become more of a hot topic, with many believing that its simply just the faults of the opposition. But there is a small growing consensus that the United States has changed, that the supposed \"liberal democracy\" that is shows itself to be is actually a mask for a growing internal plutocratic faction. Though many are quick to dismiss it, many more do ponder just how improbably the notion really is."
 USA_econ_event.17.o1: "They'll Believe Anything Now A Days"
 USA_econ_event.18.t: "미국 대 제너럴 다이내믹스 & 뉴포트 뉴스"
 USA_econ_event.18.d: "2001년 10월 법무장관은 제너럴 다이내믹스 사와 뉴포트 뉴스 조선소 사를 상대로 반독점 소송을 제기했습니다. 사안은 제너럴 다이내믹스의 뉴포트 뉴스 인수가 핵잠수함의 설계, 개발, 건조 분야에서 독점을 만들어내고 국방에 핵심적인 무기 체계에 대한 모든 경쟁을 없앨 것이라는 점이었습니다. 반독점법상 수평 합병 위반으로 분류된 이 소송은 사건의 쟁점을 두고 양측에서 꾸준한 반향을 일으켰습니다. 그러나 결국 법원의 판결은?"
 USA_econ_event.18.o1: "법원이 합병을 막았다"
 USA_econ_event.18.o2: "법원이 합병을 승인했다"
 USA_econ_event.19.t: "미국 대 니컬러스 A. 페나키오 & 닉 페나키오 사"
 USA_econ_event.19.d: "닉 페나키오 사(\\"페나키오 사\\")는 뉴욕주 브롱크스에 위치한 뉴욕주 법인이었습니다. 페나키오 사는 주로 농산물과 냉동식품을 취급하는 식품 납품업체였습니다. 1996년 5월경부터 1999년 4월경까지, 미국이 정확한 날짜를 알 수 없는 기간 동안, 피고들과 공모자들은 셔먼법(미국 법전 제15편 제1조) 제1조를 위반하여 주 간 통상 및 거래를 부당하게 제한하는 결합 및 공모에 가담했습니다. 이 결합 및 공모는 피고들과 공모자들 사이의 지속적인 합의, 양해 및 협동 행위로 이루어졌으며, 그 핵심 내용은 뉴욕시 교육위원회에 대한 냉동식품 공급 계약의 입찰을 담합하고 계약을 배분하는 것이었습니다."
 USA_econ_event.19.o1: "학생들의 복지보다 이윤을 우선시했다, 유죄!"
 USA_econ_event.19.o2: "A Level Of Ambiguity Suggest Third Parties, Not Guilty!"
 USA_econ_event.20.t: "미국 대 파우 카본 GmbH"
 USA_econ_event.20.d: "늦어도 1996년 2월부터 적어도 1997년 12월까지, 미국이 정확한 날짜를 알 수 없는 기간 동안, 피고와 공모자들은 미국 및 기타 지역에서 판매되는 탄소 음극 블록의 가격을 담합하여 경쟁을 억제하고 제거하기 위한 결합 및 공모에 가담하고 참여했습니다. 피고와 공모자들이 행한 이 결합 및 공모는 셔먼법 제1조를 위반하여 주 간 및 대외 통상과 거래를 부당하게 제한한 것이었습니다."
 USA_econ_event.20.o1: "증거가 과실을 입증한다, 유죄!"
 USA_econ_event.20.o2: "The Evidence Suggest Complicity, Not Guilty!"
 USA_econ_event.21.t: "미국 대 테일러 & 머피 건설"
 USA_econ_event.21.d: "2001년 2월경, 피고는 미국 교통부 산하 기관인 연방도로청의 관할 사안에서 고의로 중대한 허위·가공·사기성 진술과 진술서를 작성하거나 작성하게 했습니다. 피고는 노스캐롤라이나주 벙컴 카운티의 블루리지 파크웨이 도로 건설 사업에 입찰하여 시공하면서, 다른 어떤 경쟁자에게도 자신의 입찰가를 공개하지 않았다고 허위로 증명했으나 실제로는 공개한 사실이 있었습니다."
 USA_econ_event.21.o1: "테일러 & 머피 건설에 유죄가 선고되었다"
 USA_econ_event.21.o2: "테일러 & 머피 건설에 무죄가 선고되었다"
 USA_econ_event.22.t: "미국 대 블루스타 금속 재활용"
 USA_econ_event.22.d: "늦어도 1993년 12월부터 적어도 2001년 10월까지, 미국이 정확한 날짜를 알 수 없는 기간 동안, 피고와 공모자들은 오하이오주 북동부에서 철 및 비철 고철 구매 시 공급업자를 배분함으로써 경쟁을 억제하고 제거하기 위한 결합 및 공모에 가담했습니다. 기소된 결합 및 공모는 셔먼 반독점법 제1조(15 U.S.C. §§ 1)를 위반하여 주 간 통상 및 거래를 부당하게 제한했습니다."
 USA_econ_event.22.o1: "블루스타에 유죄가 선고되었다"
 USA_econ_event.22.o2: "블루스타에 무죄가 선고되었다"
 USA_econ_event.23.t: "미국 대 듀에인 메이너드"
 USA_econ_event.23.d: "1999년 2월 18일경부터 적어도 2002년 1월 17일까지, 미국이 정확한 날짜를 알 수 없는 기간 동안, 피고와 공모자들은 캘리포니아주 프레즈노의 웨스트 프레즈노 초등학교 학군에 통신, 인터넷 접속, 내부 연결과 관련된 물품 및 서비스 등을 제공하는 E-Rate 보조금 사업(\\"웨스트 프레즈노 초등학교 학군 E-Rate 사업\\")의 경쟁을 억제하고 제한하기 위한 결합 및 공모에 가담했으며, 이는 미국 법전 제15편 제1조 셔먼 반독점법을 위반하여 주 간 통상 및 거래를 부당하게 제한한 것입니다."
 USA_econ_event.23.o1: "메이너드 씨에게 유죄가 선고되었다"
 USA_econ_event.23.o2: "메이너드 씨에게 무죄가 선고되었다"
 USA_econ_event.24.t: "미국 대 워터블록 루핑 & 시트메탈"
 USA_econ_event.24.d: "Waterblock, a corporation located in Schenectady, New York, was engaged in the roofing business in the state. Walter J. Vivenzio a resident of East Berne, New York, was president and an owner of Waterblock. \"CC-1\" was a co-conspirator who was a maintenance manager at the Waterford, New York plant of the General Electric Company. CC-1 attempted to create the appearance that he was following a competitive bidding policy for roofing contracts, including contracts that were awarded to Waterblock. \"CC-2\" a co-conspirator who was a representative of a manufacturer of roofing products. CC-2 helped to select the companies that would be invited to bid or quote on roofing contracts for the Albany Medical Center and other purchasers of roofing products and services. CC-2 generally attempted to create the appearance that he was following a competitive bidding policy for roofing contracts, including contracts that were awarded to Waterblock. From sometime in 1995 until approximately May 2002, the exact dates being unknown to the United States, the defendant and co-conspirators engaged in a combination and conspiracy in unreasonable restraint of interstate trade and commerce in violation of Section 1 of the Sherman Act."
 USA_econ_event.24.o1: "워터블록에 유죄가 선고되었다"
 USA_econ_event.24.o2: "워터블록에 무죄가 선고되었다"
 USA_econ_event.25.t: "미국 대 신디알 S.p.A."
 USA_econ_event.25.d: "1999년 9월경부터 2002년 4월경까지, 피고와 공모자들은 미국 및 기타 지역에서 판매되는 폴리클로로프렌 고무의 가격을 담합하여 경쟁을 억제하고 제거하기 위한 결합 및 공모에 참여했습니다. 폴리클로로프렌 고무는 \\"클로로프렌 고무\\", \\"폴리클로로프렌\\", \\"PCP\\" 또는 \\"부타클로르\\"로도 알려져 있으며, 자동차, 접착제, 건설 산업에 최종 용도가 있는 특수한 종류의 합성 고무입니다. 이 공소장이 다루는 기간 동안 피고와 공모자들은 폴리클로로프렌 고무를 제조, 판매 및 유통하였으며, 이는 피고와 공모자들이 폴리클로로프렌 고무를 생산한 주 또는 국가가 아닌 다른 주나 국가에 소재한 고객들에 대한 지속적이고 중단 없는 주 간 및 대외 통상과 거래의 흐름 속에서 이루어졌습니다."
 USA_econ_event.25.o1: "신디알에 유죄가 선고되었다"
 USA_econ_event.25.o2: "신디알에 무죄가 선고되었다"
 USA_econ_event.26.t: "미국 대 라이언스 월드"
 USA_econ_event.26.d: "1994년 12월 14일, 1999년 3월 17일, 2000년 3월 3일경, 피고는 군 교통관리사령부에 일부 서비스 제공 서명서(TOSS) 양식을 제출했습니다. TOSS 양식은 피고에게 공통의 재정적 및/또는 행정적 통제 관계에 있는 화물 운송 대행업체의 명단을 첨부하도록 요구했습니다. 피고는 다른 어떤 운송업체나 대행업체와도 공통 통제 관계에 있지 않다는 항목에 표시했습니다. 해당 기간 동안 미국 정부 부처인 국방부의 관할 사안에서, 피고는 고의로 MTMC에 제출한 운송업체 책임 증명서와 TOSS 양식에 허위·사기성·가공의 중대한 진술과 진술서를 작성했으며, 그 진술과 진술서를 통해 MTMC에 중대한 사실, 즉 ITGBL 계획에 참여할 자격을 고의로 은폐했습니다."
 USA_econ_event.26.o1: "라이언스 월드에 유죄가 선고되었다"
 USA_econ_event.26.o2: "라이언스 월드에 무죄가 선고되었다"
 USA_econ_event.27.t: "미국 대 존 R. 올슨"
 USA_econ_event.27.d: "늦어도 2000년 7월부터 그 이후 적어도 2003년 10월 10일까지, 미국이 정확한 날짜를 알 수 없는 기간 동안, 조지아주 북부 지구 및 기타 지역에서 피고, 공모자 크로, 공모자 1은 미국 법전 제18편 제371조를 위반하여 불법적이고 고의적으로 결합, 공모, 동맹 및 합의하여 미합중국에 대한 범죄, 즉 미국 법전 제18편 제1341조 및 제1346조를 위반하기로 했습니다. 피고, 공모자 크로, 공모자 1은 케미컬 프로덕츠 테크놀로지스 유한회사를 속이고 그 직원들의 정직한 서비스에 대한 이 회사의 권리를 박탈하기 위한 계획과 책략을 고안하고 그럴 의도를 가지고 있었으며, 미국 우편을 이용하여 그러한 사기 계획과 책략을 실행했는데, 이것이 해당 공모의 일부이자 목적이었습니다."
 USA_econ_event.27.o1: "올슨 씨에게 유죄가 선고되었다"
 USA_econ_event.27.o2: "올슨 씨에게 무죄가 선고되었다"
 USA_econ_event.28.t: "미국 대 서티파이드 슬링스"
 USA_econ_event.28.d: "2002년 12월부터 2003년 10월까지, 미국이 정확한 날짜를 알 수 없는 기간 동안, 피고와 공모자들은 미 해군의 금속 슬링 호이스트 조립품 계약에 비경쟁적 입찰을 제출하기로 합의함으로써 경쟁을 억제하고 제거하기 위한 결합 및 공모에 가담했습니다. 피고와 공모자들이 행한 이 결합 및 공모는 셔먼법 제1조를 위반하여 주 간 통상 및 거래를 부당하게 제한한 것이었습니다"
 USA_econ_event.28.o2: "서티파이드 슬링스에 무죄가 선고되었다"
 USA_econ_event.28.o1: "서티파이드 슬링스에 유죄가 선고되었다"
 USA_econ_event.29.t: "미국 대 MA-RI-AL 사"
 USA_econ_event.29.d: "늦어도 2000년 7월부터 2004년 5월 25일까지, 대배심이 정확한 날짜를 알 수 없는 기간 동안, 피고들과 공모자인 어빙 머티리얼스, 빌더스 콘크리트 앤 서플라이 사 및 기타 법인과 개인들은 인디애나주 인디애나폴리스 대도시권에서 레디믹스트 콘크리트가 판매되는 가격을 담합함으로써 경쟁을 억제하고 제거하기 위한 결합 및 공모에 가담했습니다. 피고 존 J. 블랫자임은 2003년 4월경 이 공모에 합류했습니다. 피고들과 그 공모자들이 행한 이 결합 및 공모는 셔먼법 제1조를 위반하여 주 간 통상 및 거래를 부당하게 제한한 것이었습니다."
 USA_econ_event.29.o1: "관련 당사자들에게 유죄가 선고되었다"
 USA_econ_event.29.o2: "관련 당사자들에게 무죄가 선고되었다"
 USA_econ_event.50.t: "커지는 대중의 불안"
 USA_econ_event.50.d: "The events and issues of recent times have caused a mighty stir in the eyes of the people. As more and more turn to TV and other news outlets for there information a vocal minority movement has begun to gain traction. Fears about how the news is being told and shown has cause some to think that media outlets are straying from reality and from real news. Though many are still confused about these outcries its only a matter of time before we see what may come from such events."
 USA_econ_event.50.o1: "근거 없는 공포 조장"
 USA_econ_event.50.o2: "여기에는 뭔가 있다"
 USA_econ_event.100.t: "경제 소문"
 USA_econ_event.100.d: "In recent months there has been a slew of rumors about a smell of foul play within the mortgage markets. Most that entertain these rumors have found nothing, however this does hark back to a very bizzare event that's still fresh in memory of someone who decided to create a economic machine in relation to betting against the market. However there is no real justification to do so. Regardless its up to the FTC and the administration if they want to explore these rumors any more than what already has."
 USA_econ_event.100.o1: "딱히 하는 일도 없으니 한번 해보자"
 USA_econ_event.100.o2: "이미 틀렸음이 입증되었는데 무슨 의미가 있는가"
 USA_econ_event.101.t: "약간의 부스러기"
 USA_econ_event.101.d: "초기 조사에서 모기지와 은행 간 부채 스와프 증권과 관련된 일부 내부자 거래가 확인되었습니다. 그러나 이는 현재 시장 동향 전체로 볼 때 특별히 이례적인 일은 아닙니다. 하지만 일부는 무언가 진행되고 있다는 충분한 증거라며 이 수사를 계속해야 한다고 주장하고 있습니다."
 USA_econ_event.101.o1: "좋아, 좋아, 계속해도 되겠지"
 USA_econ_event.101.o2: "아니, 이 일에 자원을 충분히 낭비했다"
 USA_econ_event.102.t: "사라진 시장"
 USA_econ_event.102.d: "I can't believe it, there actually was something here. In a series of indepth investigations related to the crumbs of insider trading and the greater mortgage market has found a trail of rising unpayable mortgages and debts. These mortgages were being handed out to anyone who pretty much asked for them, not to mention all the fine print metrics we found like ballooning interest rates after a specific time frame or the actual size of the mortgages themselves in comparison to the holder's annual income. A comprehensive effort, albeit as quiet as possible effort to keep Wall Street from panicking is of the uptmost importance. A series of economic and political reforms will be put into effect to ensure that this sort of gross negligence is never allowed to grow into such proportions ever again."
 USA_econ_event.102.o1: "이번에는 대공황이 없을 거야, 잭"
 USA_unrest_event.1.t: "자유지상주의 운동의 부상"
 USA_unrest_event.1.d: "Recent weeks have seen a steady increase to what is known as the Libertarian party. Most see them as a crackpot overtly capitalist party, but with the rising rallies and registration numbers some fear that they may make a potential comback if left alone. With the media's help we could do something to quash their momentum, or we could just leave them alone as they're bound to be snuffed out again."
 USA_unrest_event.1.o1: "어리석은 짓일 뿐이다"
 USA_unrest_event.1.o2: "CNN과 폭스가 신나겠군"
 USA_unrest_event.2.t: "고립주의 집회의 부상"
 USA_unrest_event.2.d: "In recent times a disturbing rise in anti-foreign affairs movements and rallies have begun to gain traction. While many are just pushing them off as nationalistic dunderheads, it is still a cause for concern as these people could affect our foreign policy plans. Nevertheless we can choose to let the people eat themselves with division or \"encourage\" a cover story on this rise in \"nationalism\"."
 USA_unrest_event.2.o1: "괴짜들일 뿐이다"
 USA_unrest_event.2.o2: "뉴스쟁이들이 오늘 할 일이 생겼군"
 USA_unrest_event.3.t: "사회주의 사상가들의 부상"
 USA_unrest_event.3.d: "We thought that with the end of the Cold War that Socialism would have stopped here in America. Unfortunately it does not look like the case, recently an increase in Socialist oriented groups have been organizing protest and movements against our nation's ethos. These rabblerousers are causing a stir and in all honesty they are nothing more than just a pest of a bygone era. We can look to undermine their means or just ignore the vermin and let them destroy themselves in due time."
 USA_unrest_event.3.o1: "빵이 없으면 서로 잡아먹으면 되지"
 USA_unrest_event.3.o2: "이들의 고립을 부추기자"
 USA_unrest_event.4.t: "민족주의 운동의 부상"
 USA_unrest_event.4.d: "Pro America movements have been a thing since the dawn of the nation, however recent organized movements have started deviating from the normal \"Go America\" attitude. Some have decided to deal in some unconventional and or very outdated ideas for modern standards that is. We could look to boost their coverage to speed up their down fall, or we could just let them be and just watch as they politically commit suicide."
 USA_unrest_event.4.o1: "낡은 사상은 낡은 정신에게"
 USA_unrest_event.4.o2: "Lets Spin The Wheel Of Media Outlets"
 USA_unrest_event.5.t: "환경주의의 부상"
 USA_unrest_event.5.d: "Ever since Al-Gore's campaign the supposed green movement has been slowly gaining more and more traction. As such there have been small scale protest against everyday economic activities. This disruption has caused backlash in the public's eyes, though this disruptiveness is politically damning them some do fear we should still do something to solidify these tree huggers \"out of touch\" nature."
 USA_unrest_event.5.o1: "빌어먹을 히피들"
 USA_unrest_event.5.o2: "빌어먹을 환경 테러리스트"
 USA_unrest_event.6.t: "금권주의 자유주의자들이 대중을 불안하게 하는가?"
 USA_unrest_event.6.d: "Since the days of Barry Goldwater and Ronald Reagan many have wanted to emulate their supposed political and economic \"revolutions\" which they were bringing to America. However, there are some who worry that they may be taking things a step too far. Elements of the Constitutional Party and backdoor dealings with supposed plutocratic insiders have caused unease in the public. We could handle this by creating rumors and leaks to the press...or we could leave it and let the normal snoopers do their job."
 USA_unrest_event.6.o1: "유출은 항상 일어나는 법이다"
 USA_unrest_event.6.o2: "누가 뭘 유출했다고!? 정말 충격적이군"
 USA_reformed_republic.1.t: "선택지에 둘러싸인 국민"
 USA_reformed_republic.1.d: "Recent events in election and economic reform have shown many that there is more to their political beliefs then just the Donkey or the Elephant. There's a whole zoo of animals and people are beginning to see that both sides of the aisle have choices to provide."
 USA_reformed_republic.1.o1: "The Peoples Will"
 USA_reformed_republic.1.o2: "민중의 의지"
 USA_reformed_republic.2.t: "케이크를 갖는다는 것"
 USA_reformed_republic.2.d: "우리 시민들의 가치관에 부합하여 새로 생겨난 정당들로 점점 더 많은 사람이 몰려들면서 분열이 증가한 것으로 나타났습니다..."
 USA_reformed_republic.2.o1: "영원한 연대"
 USA_reformed_republic.2.o2: "그의 말이 옳지 않은가?"
 USA_reformed_republic.3.t: "먹을 수도 있을까?"
 USA_reformed_republic.3.d: "People swept up into the political flavors of the day have found richer flavors than they may fully agree with. Nevertheless some are further pulled into savory grasp of these new comers, but their choice seems to be..."
 USA_reformed_republic.3.o1: "레드 벨벳"
 USA_reformed_republic.3.o2: "밀크 초콜릿"
 USA_reformed_republic.4.t: "정치의 이상한 나라"
 USA_reformed_republic.4.d: "More and more seem to be pulled into the extremes, while the center and or more \"logical\" parties and movements have held firm but many do have concerns. Are we heading down a rabbit hole or are we really going to Neverland."
 USA_reformed_republic.4.o1: "하트의 여왕이 인도해 주리라"
 USA_reformed_republic.4.o2: "모자 쓴 고양이가 바로잡아 주리라"
 USA_reformed_republic.5.t: "커지는 내부 투쟁"
 USA_reformed_republic.5.d: "In the wake of Libertarian dominance in American Politics many have noticed a growing animosity within the leadership. So far there seems to be three main factions developing. The Liberty Guardsmen, which is an old guard like faction looking to keep the party status quo. The Free Business Association, which looks to further the economic deregulations. Finally there is the STEM Committee, a faction of engineers, chemist and general technical specialist who look to further the forms of liberty through science and rationalism. Many are unsure who may win, but whoever does will hopefully be able to keep the continued stability enjoyed currently."
 USA_reformed_republic.5.o1: "자유 수호대가 버텨낸다"
 USA_reformed_republic.5.o2: "기업협회가 힘을 과시한다"
 USA_reformed_republic.5.o3: "STEM 위원회가 승리를 발견한다"
 USA_reformed_republic.100.t: "군부의 성장"
 USA_reformed_republic.100.d: "지난 몇 주 동안 군 지도자들은 기쁨에 차 있습니다. 그 이유는 시민 단체들이 학교의 JROTC 프로그램의 확대와 추가를 요구하면서 국민들 사이에서 군국주의가 꾸준히 커지고 있기 때문입니다. 이른바 지역 공동체 민병대 부대도 생겨나기 시작했고, 재연 행사의 인기도 꾸준히 높아지고 있습니다. 많은 이들은 이것이 NFP에 좋은 일이라고 믿지만, 일부 강경파는 연립이 유지하기로 되어 있던 균형 때문에 조심스러워하고 있습니다."
 USA_reformed_republic.100.o1: "좋은 일을 왜 망치는가?"
 USA_reformed_republic.101.t: "당 기반의 이동"
 USA_reformed_republic.101.d: "Rising concerns by hardliners within the NFP have started voicing the fact that a notable shift in the party base has begun. The military has seen rising volunteer numbers as well as national and state guard units have seen more towards raising the praises of the Pentagon elite then they have of the national leaders. Most of the voting base however has been seen as dismissing these concerns as in the words of one member quote, We all want a strong military and so who cares, end quote. Nevertheless the hardliners have become nervous over the shifting tides of the party."
 USA_reformed_republic.101.o1: "Lets Address These Concerns."
 USA_reformed_republic.200.t: "대중 자연주의의 성장"
 USA_reformed_republic.200.d: "Fascist as well as their hardliner friends in the ANP and KKK have been in a state of glee as recent national trends show a growing demand of the US becoming more in line with its naturalistic history. A rise in attacks against ethnic minorities and essentially anyone who does not fit the supposed \"American\" identity. This essentially boils down to a Western European identity as the olive skinned peoples of the Southwestern parts of Europe were seen as products of their times. Many in the military are indifferent but a lot of moderates within the NFP are seeing concerns of a potential party shift as public trends seem to begin favoring one of the major factional groups within the NFP."
 USA_reformed_republic.200.o1: "미국인을 위한 미국 국가."
 USA_reformed_republic.201.t: "온건파의 망명"
 USA_reformed_republic.201.d: "National news breaks as cowardly fence sitters and seditionist flee the nation. The new party head of the NFP has seen fit to declare that quote, \"The enemies of the state as well as their feeble ideals flee our great nation. Today marks a real turning point in America's history as we the people now have the true rule.\" The speech went on for roughly a total of three hours as radios and television stations alike were lit up broadcasting this speech to all who would watch or listen. Global leaders are wary of the new American government and talks have already begun of what America's status should be with it no longer being the beacon of Democracy."
 USA_reformed_republic.201.o1: "팍스 아메리카나는 끝났는가?"
 USA_reformed_republic.300.t: "현대 군주주의?"
 USA_reformed_republic.300.d: "Monarchism, a term used to describe the old era of nearly a century ago. Yet through apparently strength of will a new movement has lead the forefront of the NFP. The \"Modern Monarchist Movement\", is a faction that wishes to breath a modern light onto an old ideal. Through countless of rallies, speeches, informational pamphlets and so on the MMM have made clear that the modern system will not change, but rather be cosmetically altered. Many are skeptical of this new group but with the slogan, \"Every Man A King, Every Woman A Queen\", some do like the idea of making that little childhood fantasyy into a modern reality."
 USA_reformed_republic.300.o1: "이번에는 어떤 판타지 쇼가 될까?"
 USA_reformed_republic.301.t: "환상이라기보다 현실에 가까움"
 USA_reformed_republic.301.d: "In a shocking turn of events the MMM has secured majority power within the NFP, with radicals in the naturalist camp leaving the party and finding isolation in the wilds and forests of the expanse of continental America. The military is easier to convince due to the historic implications that monarchies have always prided their military. As for the fence sitters, well they're still sitting, enjoying the peace and understanding that things are not getting worse so its only up from here. The MMM has begun making swift moves to inform the public as well as the greater world to ensure a peaceful rise and understanding of what many fear is the fall of the American Eagle."
 USA_reformed_republic.301.o1: "이제 독수리에게 머리가 하나 더 생기는가?"
 USA_reformed_republic.400.t: "정치위원단"
 USA_reformed_republic.400.d: "The Commissariat Corps is the military political wing of the Red Army. This group has seen more volunteers and interest in understanding the way to properly militarize the nation in line with the Socialist principles which will free our nation from the old order. Recently though the national committee has had some concerns over the growing ranks and popularity of the Commissariat Corps, though CC leadership assures the committee that there are know plans to do anything drastic. This has not stopped rumors from spreading in the lower ranks of the Corps."
 USA_reformed_republic.400.o1: "설마 농담이겠지?"
 USA_reformed_republic.401.t: "붉은 군사정권?"
 USA_reformed_republic.401.d: "In a shocking twist which looks like weeks of pre-meditated planning, a cabal of young officers in the Commissariat Corps have initiated a coup and established what they call the \"Red Junta\". This Socialist Military Junta seems to want to take the idea of national pride in service to the country and combine it with the ideas of Socialist economics. Given how both ideals can be used in an egalitarian and or unitarian sense many are surprisingly taken with the idea. But for now moderates and global spectators look on wondering what will this new faction will do."
 USA_reformed_republic.401.o1: "붉은 군사정권? 말도 안 되는 소리, 오래가지 못할 것이다!"
 USA_reformed_republic.500.t: "사회주의 노동자당"
 USA_reformed_republic.500.d: "In recent weeks the rise of the SWP has seen some heads turn in both intruige and disgust. Most see the pro-trotskyist party as a stain on real socialist principles, while others see them as mear idealist who want nothing but power. Nevertheless some concern has arose as more people seem to be joining the ranks of the SWP and it is threatening to tip the balances of power within the coalition. Party leadership is looking to cull any excesses to the SWP's influences but many are unsure if it will help."
 USA_reformed_republic.500.o1: "세계 혁명... 오히려 세계적 고통에 가깝군."
 USA_reformed_republic.501.t: "무자비한 쿠데타!"
 USA_reformed_republic.501.d: "In a shocking turn of events, organizers from the SWP have seized power and slaughtered key coalition leaders. The SWP leadership has proclaimed quote, \"We the members of the Socialist Workers Party have done the nation a favor. For it is time that we stop playing games and understand the true goals and ideals that Socialism and Socialist want. Unity, not compromise is the future and we will ensure that future is a reality. For The Socialist Dream!!!\". Many have begun to flee the nation and some nations around the world are already looking to impose sanction on the United States of America and wonder what the future truly entails. For now many are worried and buying time to defend from potential incursions."
 USA_reformed_republic.501.o1: "맙소사, 우리가 무슨 짓을 한 건가."
 USA_reformed_republic.600.t: "미국 아나키스트 협회"
 USA_reformed_republic.600.d: "The AAS or American Anarchist Society is a fringe and clearly out of date political entity. Supposedly under the assumption that Anarchism can suvive in such a civilized world, they tout their pamphlets and make speeches about the collective good and goals of the society. Well despite a slight trend in their membership and positions in the coalition, many discount them no more better than the quirks of the fringe."
 USA_reformed_republic.600.o1: "*코웃음* 우리가 원숭이란 말인가?"
 USA_reformed_republic.601.t: "분명 가능했던 불가능"
 USA_reformed_republic.601.d: "In a confusing and outlandish series of events, somehow the AAS has secured a majority within the coalition. Many onlookers both domestically and internationally stare in a mix of disbelief and confusion as the epitome of Oxymoronic actions have culminated in what is being proclaimed as the quote, \"First Elected Anarchist Government\". Nevertheless things appear to be moving on as normal but many still stare in an almost catatonic state at what is there to actually do now. But only time will tell if this is a ruse or something to be excited or dishearted by, only time can truly tell at this point."
 USA_reformed_republic.601.o1: "분명 농담이겠지... 그렇지... 그렇지?"
 USA_crisis_event.1.t: "공황을 일으키는 시위 운동"
 USA_crisis_event.1.d: "최근 며칠 동안, 일련의 표적화된 시위로 인해 국가 내에서 위기가 발생했습니다. 시위로 인해 911 및 지역 응급 대응 서비스와 같은 필수 서비스가 차단되면서 시민 불안이 커지고 있습니다. 응급 서비스의 지연으로 인해 발생한 몇 건의 사망 사건이 시위 탓으로 돌려지고 있습니다. 일부 주지사와 심지어 의원들까지 이 문제를 해결하기 위한 계획을 세우고 있으며, 몇몇은 문제를 지역 차원에서 해결하자고 제안하고, 다른 이들은 연방 기관을 동원하자고 주장하며, 또 다른 일부는 문제를 그냥 두고 시간이 해결하게 하자는 의견을 내고 있습니다. 대통령의 공식 대응은..."
 USA_crisis_event.1.o1: "사태의 전개를 지켜보겠습니다"
 USA_crisis_event.1.o2: "FBI 자산을 해당 지역에 동원하라"
 USA_crisis_event.1.o3: "주 공직자들이 맡은 바를 다하도록 압박하라"
 USA_crisis_event.2.t: "지역 상황 악화"
 USA_crisis_event.2.d: "연방 정부의 무대응은 지역 지도자들과 일부 전국 뉴스 매체에 의해 나약하며 국내 테러 상황으로 변해가는 사태와 간접적으로 협상하는 것으로 비쳐졌습니다. 이제 주 공직자들은 대통령에게 연방 자산을 동원해 개입해 달라고 청원하고 있으며, 일부는 여전히 이 문제가 지나갈 것이고 대응하면 우리가 독재자처럼 보일 것이라 믿고 있습니다. 오늘 늦게 백악관 대변인은 브리핑에서 대통령이 다음과 같이 결정했다고 발표했습니다..."
 USA_crisis_event.2.o1: "굳건히 버텨라"
 USA_crisis_event.2.o2: "신중한 질서를 위한 신중한 조치"
 USA_crisis_event.3.t: "흔들리는 불빛"
 USA_crisis_event.3.d: "The inaction of the federal government is starting to run thin on a lot of people's nerves. More now even locally are wanting the president to intervene to restore order as local officials appear to not be convicted enough to make decisive actions. Though it looks like there maybe a break in the intensity, it could backfire as public trust has already sunken to a new low. The Choice is now, take a chance of peaceful resolution, or secure the region and bring back order and stability...whatever is left that is."
 USA_crisis_event.3.o1: "한 줄기 빛이 보인다, §R국민이 승리하리라§!"
 USA_crisis_event.3.o2: "빛이 꺼져간다...§GFBI를 투입하라§!"
 USA_crisis_event.500.t: "견뎌낸 폭풍"
 USA_crisis_event.500.d: "평화가 회복되었지만 얼마나 갈지는 알 수 없습니다. 이번 위기로 타격을 입었지만 우리는 극복해냈습니다. 이와 같은 일이 결코 통제 불능으로 커지지 않도록 경계를 늦추지 말아야 합니다."
 USA_crisis_event.500.o1: "우리 시대의 평화"
 USA_crisis_event.4.t: "또 일을 저지르는 의회"
 USA_crisis_event.4.d: "Shocking news has come out of congress that the fiscal appropriations bill has not been resolved and is being deadlocked by members tacking on addendums and additives to the overall legislation. We've had these scares before, let alone the last real government shutdown was back in 95, so there shouldn't be to much to worry about."
 USA_crisis_event.4.o1: "우리 그냥 잘 지낼 수 없을까?!?"
 USA_crisis_event.5.t: "정부 폐쇄가 임박한 의회 교착"
 USA_crisis_event.5.d: "With talks growing ever more stubborn we've since seen that a government shutdown is upon us. Both sides seem overtly adament about what they expect in this fiscal years' appropriations bill and as such we could cost ourselves the coming election if things persist. The president is scrambling advisors and capitol hill is buzzing with congressional members trying to seek out as much political power they may have left."
 USA_crisis_event.5.o1: "도대체 무슨 일이 벌어지고 있는 거야!?!"
 USA_crisis_event.5.o2: "선거에 집중하라"
 USA_crisis_event.6.t: "공황을 일으키는 주식 시장"
 USA_crisis_event.6.d: "With the shutdown turning into the longest to date, 20 days as of this report. Many are beginning to fear the economic ramifications as federal programs have essentially grown into a redundant state. Wall Street has seen a slow drop in the DOW and S&P 500 respectively as even the supposed lobbyist are gobsmacked at these recent turn of events. All eyes are on the administration to see if things will recover or only get worse."
 USA_crisis_event.6.o1: "누구든 동의하게 만들 수 없나!!!"
 USA_crisis_event.6.o2: "지금 당장 기자회견을 소집하라!!"
 USA_crisis_event.7.t: "국가를 사로잡는 임박한 공황"
 USA_crisis_event.7.d: "The shutdown has lasted over two whole months. Panic on Wall Street has sent a shock to the investing arm of our economy. Rumors have it that several regional banks are nearing bankruptcy and that union agitation against the railroads has rapidly increased. If the situaion continues to decline who knows what will become of the very home we live in."
 USA_crisis_event.7.o1: "§R그들이 무슨 짓을 한 거야!!!§!"
 USA_crisis_event.7.o2: "§G상황을 청산하라, 선거는 알 바 아니다§!"
 USA_crisis_event.600.t: "정상으로의 복귀..."
 USA_crisis_event.600.d: "It would appear as things have begun to calm down. With the drastic shift in the president's priorities and with what many likely would see as strong arming. Congress has finally found a way to pass the legally required appropriations bill to continue normal government functions. Whether for better or worse it does look like things are back to a somewhat level state. For now the quote, Eternal Shutdown, has come to an end, lets just hope we don't repeat this...please."
 USA_crisis_event.600.o1: "왜 이렇게 공허하게 느껴질까"
 USA_collapse_event.1.t: "대규모 철도 파업?!"
 USA_collapse_event.1.d: "With the Class 1's neglecting their duties and the federal government seen as weak to the strikers. Talks of an impending railroad strike are buzzing about. Congress is scrambling to find details and work with both sides to finish negotiations out. Many hope...yet also believe this will only get worse."
 USA_collapse_event.1.o1: "이것을 해결할 수 있을까?!?"
 USA_collapse_event.2.t: "합의안을 제안하는 의회"
 USA_collapse_event.2.d: "The scramble for a fair deal to avoid the strike has come with a heavy heart. Strikers and the Class 1's which are being affected are at a stand still. A major problem being argued constantly is the points system used to regulate how employees take days off whether sick or not. This gross umbrella-ing of how to keep employees at work and efficient in their jobs has resulted in a strong animosity. This tension has now come to head and congress has hit a road block with the reality of the situation becoming a growing fear for DC as a whole."
 USA_collapse_event.2.o1: "분명 이성을 되찾겠지... 그렇지?"
 USA_collapse_event.3.t: "결렬된 협상"
 USA_collapse_event.3.d: "월가의 공황으로 주식 시장이 경기 침체 수준으로 폭락하면서 협상은 스스로 무너져 내렸습니다. 파업의 여파로 여러 주지사가 갈수록 커지는 사회 혼란을 진정시키기 위해 비상사태를 선포했습니다. 백악관은 뒷거래를 시도하고 이 파업이 전면적인 폭동으로 확대되는 것을 막기 위해 모든 연방 기관을 동원했습니다."
 USA_collapse_event.3.o1: "강 한복판에 떠밀렸는데 노는 대체 어디 갔어!"
 USA_collapse_event.4.t: "대응 인력을 집어삼키는 시민 불안"
 USA_collapse_event.4.d: "연방 개입은 처음에는 일부 지역이 어느 정도 진정되는 등 좋은 결과를 보였습니다. 그러나 피해가 큰 지역에서는 기회주의자들이 바로 그 정부 개입을 이용해 지나치게 사태를 휘저었습니다. 민간인 사상자가 보고되기 시작했고 수많은 난민이 나라를 떠나기 시작했습니다. 소문과 언론의 과장된 주문 같은 보도는 사태를 더욱 악화시켰고, 전국을 집어삼키는 대규모 폭동과 약탈 보고가 갈수록 늘어났습니다. 이 눈덩이 같은 추세는 재산 피해와 기반시설 파괴의 증가로 이어졌습니다. 주방위군 부대가 동원되기 시작했고, 국방부 지휘부는 상황을 완화하기 위한 계획을 마련하느라 분주합니다."
 USA_collapse_event.4.o1: "하느님, 우리 모두를 도우소서..."
 USA_collapse_event.5.t: "불가피한 사회 붕괴"
 USA_collapse_event.5.d: "In a near titanic sized decline in societal cohesion, National Guard units and federal military units have begun disserting in increasing numbers, with many siting they do not want to turn their guns on fellow Americans as well as general concerns of the well being of friends and loved ones. However loyalist military personnel have taken up defensive posturing in what is now being called the Federalist states. Governors and local officials around the country are scrambling to get ahold of their own backyards. Mass migration of US citizens have been recorded and Canada along with Mexico have had to step up asylum camps and general containment grounds to prevent this archaic spill over from destroying their countries as well."
 USA_collapse_event.5.o1: "Is This Where Pax Americana Ends.."
 USA_collapse_event.6.t: "깨지기 시작하는 유리"
 USA_collapse_event.6.d: "최근 텍사스가 마침내 연방에서 강제로 이탈하기로 결정했다는 보고가 들어왔습니다. 혼란이 만연하고 대부분의 국방부 기획자들이 중앙 정부와 핵심 기반시설에 집중하는 가운데, 우리 부대 일부가 어디로 갔는지 의아해하는 이들이 많습니다."
 USA_collapse_event.6.o1: "그들이 그럴 순 없어, 무슨 짓을 한 거야!!!"
 USA_collapse_event.6.o2: "텍사스의 노란 장미를 찾으러 가야겠다"
 USA_collapse_event.7.t: "연쇄 사태"
 USA_collapse_event.7.d: "Following on the heels of the recent Texas exit or Texit as some have called it. Local leaders and groups in the states of Washington, Idaho and Oregon have begun to organize together as a new band of mountain brothers. Using a recent call of identity known as Cascadia, said Cascadians have begun to organize their own military force using remnants of the national guard and federal facilities in their states as a sort of canvas. This shocking realization has only increased the dissertions and alarmingly growing cases of missing equipment from stockpiles."
 USA_collapse_event.7.o1: "그들은 어디로 가는 거지?"
 USA_collapse_event.7.o2: "될 대로 돼라, 나도 데려가!"
 USA_collapse_event.8.t: "카리브해 위기"
 USA_collapse_event.8.d: "With all the chaos on the continent there have been reports that Puerto Rico, our Caribbean island territory, has left the union. With reports of continued dissertions seeking to flee the continent, they have found the island's recent actions a respite from chaos. It is this looming collapse that has seen Puerto Rico looking towards preparing itself for its sudden independence. While we'll miss our vacation spot, many are not concened due to the state of the union at this time."
 USA_collapse_event.8.o1: "손실이지만 아쉽지는 않다"
 USA_collapse_event.8.o2: "놓치다니, 나는 아니야."
 USA_collapse_event.9.t: "The 2nd Seccession"
 USA_collapse_event.9.d: "History may not repeat itself but she, like fate herself can rhyme in many twisted ways. A collection of Southern governors have met in Mobile, Alabama to declare an official 2nd Seccession from the Union. While the language was intermingled with past loathing and fearful future telling one thing was certain...The South was finally independent."
 USA_collapse_event.9.o1: "남부는 정말로 다시 일어섰다...."
 USA_collapse_event.9.o2: "딕시랜드로 떠나자!"
 USA_collapse_event.10.t: "다시 곰 공화국이"
 USA_collapse_event.10.d: "미합중국 연방정부에 맞서 독립을 추구하는 여러 운동에 대한 최근 소식이 퍼지는 가운데, 캘리포니아 주지사는 복귀한 주방위군 부대를 소집하여 통행금지령을 조직하고 주의 독립을 선언하도록 했습니다. 곰이 풀려났으며, 얼마 지나지 않아 지방 카운티와 지자체 위원들이 새크라멘토에서 만나 앞으로 나아갈 방향을 논의했습니다. 전 세계가 사실상 주변에서 무너지는 가운데, 워싱턴 D.C. 주변의 연방주의 주들은 점점 더 공황에 사로잡히고 있습니다."
 USA_collapse_event.10.o1: "회복할 수 있다, 반드시 해야 한다!"
 USA_collapse_event.10.o2: "곰이 마침내 자유롭게 돌아다닌다."
 USA_collapse_event.11.t: "보스턴 폭탄 선언"
 USA_collapse_event.11.d: "The nation is tearing itself apart and to the complete shock of surprisingly a lot more people than expected, the Northeast territory has succeeded from the union and formed the country of New England. Many see this as the truest from of backstabbing as the core of New England has been roughly the most in line of all the regions of the country to the federal government. This is now as some are beginning to call the quote, second shot heard round the world."
 USA_collapse_event.11.o1: "내게 묻는다면 베네딕트 아널드 같은 놈들이다..."
 USA_collapse_event.11.o2: "우리는 가라앉는 배를 보면 알아본다."
 USA_collapse_event.12.t: "새로운 뉴욕?"
 USA_collapse_event.12.d: "New York, seeing the opportunity of the absolute chaos of the nation has declared independence from the federal government. The sinking fire boat of the United States as a nation has forced New York to seek independence as its own nation. Not wanting to join the estranged Northeasterners instead looking to be the mediator between the New England and what some in the federalist states are calling the quote, Free States of America."
 USA_collapse_event.12.o1: "우리는 하루가 다르게 고립되어 간다."
 USA_collapse_event.12.o2: "시나트라가 살아서 이걸 봤더라면."
 USA_collapse_event.13.t: "녹슨 지대"
 USA_collapse_event.13.d: "The Great Lakes Confederation has been declared, the core of our nation's industrial base has fled our union and created a confederation around each other. We should've expected this, the great lakes themselves and all the waterways makes this union a closely tied brotherhood of sorts. This with the culmination of the supposed \"Midwestern\" identity has only bolden such unity. With the industrial heart gone its only a matter of time before the rest of the nation falls apart."
 USA_collapse_event.13.o1: "우리는 민심을 잃었다..."
 USA_collapse_event.13.o2: "어머나, 나도 가야 할 데가 생긴 것 같네."
 USA_collapse_event.14.t: "커스터의 악몽"
 USA_collapse_event.14.d: "The breadbasket is gone... The Great Plains, a series of northern central states have banded together and with a compromise among its native populations have declared the Lakota Republic independent from the federal government.....where did we go wrong."
 USA_collapse_event.14.o1: "배급을 시작하라.. 도움은 오지 않는다...."
 USA_collapse_event.14.o2: "마침내 우리는 방해받지 않게 되었다."
 USA_collapse_event.15.t: "하느님, 모르몬교도만은 안 돼"
 USA_collapse_event.15.d: "The world has finally god mad to the point that the Union of Deseret has been declared in the Southern Rocky Mountain states. Though we're not sure if they are a Theocracy, the name reminds us all to much of the old struggles settling westward. In the future there may be a 2nd Utah War."
 USA_collapse_event.15.o1: "운명은 정말 사악한 여주인이다."
 USA_collapse_event.15.o2: "운명이 우리에게 새 출발을 선사했다."
 USA_collapse_event.16.t: "큰 계획을 품은 북두칠성"
 USA_collapse_event.16.d: "캐나다 소식통으로부터 알래스카주가 독립을 추구했다는 보고가 들어오고 있습니다. 풍부한 천연자원과 틈새 경제 구조에 자신감을 얻은 알래스카 주민들은 국가를 갈가리 찢어놓은 전면적인 독립 운동을 지지하고 나섰습니다."
 USA_collapse_event.16.o1: "그들은 오래가지 못할 거야... 그렇지?"
 USA_collapse_event.16.o2: "잠깐, 정확히 뭐가 바뀌는 거지?"
 USA_collapse_event.17.t: "태평양의 평화주의자"
 USA_collapse_event.17.d: "The Final Strike...the Union is truly dead. The pacific territories along with the state of Hawaii have created the Federation of Hawaiian States. This rump state is looking to appeal to its geostrategic locations along the Pacific Ocean to secure funding and mutual protections from foreign happenings. While certainly a pacifist route to take, many truly wondering if they are buying time or hoping to return home to the Union itself."
 USA_collapse_event.17.o1: "태평양은 진주로 가득한가, 위험으로 가득한가?"
 USA_collapse_event.17.o2: "어서 배들을 건드려라, 이제 우리 것이다!"
 USA_collapse_event.18.t: "연방주의자 연합"
 USA_collapse_event.18.d: "With the union shattered beyond repair many local leaders in what is now being called the \"Federalist States\" have begun to attempt to organize themselves around the old capital of DC. With some cohesion being formalized the new rump state has been dubbed the Free States of America. Its not much, but its certainly a step somewhere. Now we begin to figure out what can we even do."
 USA_collapse_event.18.o1: "이제 어디로 가야 할까?"
 USA_collapse_event.19.t: "가라앉는 먼지"
 USA_collapse_event.19.d: "We are united no more...the damage looks to be well beyond repair. For now we must hold onto what little we have and attempt to make new from the ashes of old..god help us."
 USA_collapse_event.19.o1: "팍스 아메리카나는 끝났다.. 이제 어떡하지?"
 USA_collapse_event.20.t: "종말의 날"
 USA_collapse_event.20.d: "If you have found this letter, than the Union has indeed fallen. No one is earnestly certain why it happened, but many believe it was overdue to happen. Regardless it is the end, we've been offered asylum by the Japanese government for it seems the Okinawa base was not really affected due to comms problems and the Japanese authorities assurances. God help those stuck on the continent."
 USA_collapse_event.20.o1: "대통령 각하.... 몸이 좋지 않습니다"
 USA_collapse_event.21.t: "산산조각 난 외곽 영역"
 USA_collapse_event.21.d: "With the rapidly declining state of our nation, it has come to our attention that rampant unrest as well as independence movements outside of our direct control have reached a boiling point. With separatist movements and calls for independence growing to a fever pitch its no wonder things feel like they have turned into the end of days itself."
 USA_collapse_event.21.o1: "Its Not The Homeland, But It Was Still Our Land"
 USA_collapse_event.22.t: "Why?."
 USA_collapse_event.22.d: "당신은 왜 아직도 여기에 있습니까... 남은 것이 아무것도 없습니다."
 USA_collapse_event.22.o1: "이제 떠날 때다"
 USA_collapse_event.23.t: "남부의 문제들"
 USA_collapse_event.23.d: "최악의 시기가 지나갔으니 이제 올라갈 일만 남았습니다. 따라서 이제 막 시작된 아주 젊은 우리 국가의 문제와 상황을 고려할 때, 우리를 괴롭히는 문제들을 제대로 해결하고 처리해야 합니다."
 USA_collapse_event.23.o1: "남부식 해법이 필요하다"
 USA_collapse_event.24.t: "더 많은 주의 이탈"
 USA_collapse_event.24.d: "최근의 혼란 속에서 더 많은 주지사가 미시시피와 앨라배마에서 생겨난 남부연합 흉내 반란 파벌에 협력하기로 결정했습니다."
 USA_collapse_event.24.o1: "맙소사, 얼마나 더 떠날까?"
 USA_collapse_event.25.t: "남부연합의 죄수들"
 USA_collapse_event.25.d: "Well more states leave our union and have chosen to declare their unity towards the convicts of the south. They surely wont get far since everyone knows they're just a bunch of fascists and slavers."
 USA_collapse_event.25.o1: "우리는 쓰러질 수 있어도, 그들 역시 오래가지 못한다"
 USA_collapse_event.26.t: "녹슨 주들의 추가 이탈"
 USA_collapse_event.26.d: "우리의 현재 사회 기능이라는 재앙으로 인해 더 많은 주지사가 우리를 떠나 오대호 연합이라는 녹슨 양동이 클럽에 합류했습니다."
 USA_collapse_event.26.o1: "잘 가라"
 USA_collapse_event.27.t: "중서부의 부적응자들"
 USA_collapse_event.27.d: "상황은 절박합니다. 더 많은 중서부 주들이 사실상 중서부의 옛 러스트 벨트 지역을 중심으로 한 주 연합의 품으로 달아났습니다. 우리는 이를 결코 회복하지 못할 것입니다..."
 USA_collapse_event.27.o1: "모두가 정신이 나갔나!?"
 USA_collapse_event.28.t: "제2차 보스턴 학살"
 USA_collapse_event.28.d: "Within the chaos and lawlessness, more states have fled to the supposed New England regional government as some are proclaiming a string of murders to be our fault. With some even somehow comparing it to the Boston Massacre which start the revolution."
 USA_collapse_event.28.o1: "너무나 고통스럽다, 제발, 전쟁은 안 돼.."
 USA_collapse_event.29.t: "대화재"
 USA_collapse_event.29.d: "우리가 처한 재난은 더욱 악화되기만 했으며, 대평원 주들 전역에서 대규모 화재가 보고되고 있습니다. 혼란을 더하듯 더 많은 주가 반란을 일으켜 라코타 공화국이라 불리는 곳에 합류했습니다."
 USA_collapse_event.29.o1: "이제는 신조차 우리를 구할 수 없다"
 USA_collapse_event.30.t: "연쇄 재앙"
 USA_collapse_event.30.d: "최악의 시기가 지나갔으니 이제 올라갈 일만 남았습니다. 따라서 이제 막 시작된 아주 젊은 우리 국가의 문제와 상황을 고려할 때, 우리를 괴롭히는 문제들을 제대로 해결하고 처리해야 합니다."
 USA_collapse_event.30.o1: "더 나빠질 수도 있었다..."
 USA_collapse_event.100.t: "미국 난민"
 USA_collapse_event.100.d: "남쪽 이웃 국가의 충격적인 붕괴로 인해 안전을 찾는 난민들이 우리에게 밀려들었습니다. 비용이 들겠지만 장기적으로는 이 문제를 해결할 것입니다."
 USA_collapse_event.100.o1: "한 시대의 종말이 닥쳤다"
 USA_collapse_event.101.t: "미국 난민"
 USA_collapse_event.101.d: "북쪽 이웃 국가의 충격적인 붕괴로 인해 안전을 찾는 난민들이 우리에게 밀려들었습니다. 비용이 들겠지만 장기적으로는 이 문제를 해결할 것입니다."
 USA_collapse_event.101.o1: "한 시대의 종말이 닥쳤다"
 USA_crisis_event.1000.t: "남부의 위기"
 USA_crisis_event.1000.d: "Recently the federal government has issued a crisis declaration for the southern border as rapid increases of illegal migrants and growing unsafe conditions for properly processing migrants as a whole have resulted in more women and even children to become indangered overall. Lawmakers and federal officials are looking into ways to relieve the issue, however with the timing being at the halfway point of a presidental term, local and some federal elections nearing voting hour, many genuinely wonder just how focused can the federal government can be with this issue."
 USA_crisis_event.1000.o1: "그렇게 심각할 리 없다. 그렇지?"
 USA_crisis_event.1001.t: "텍사스 대 미합중국"
 USA_crisis_event.1001.d: "Back in November the federal government announced plans to expand the eligibility of the DACA immigration legislation. However recently this has cause severe backlash in multiple republican states as their governments led by Texas have decided to take the federal government to court. The plantiffs in this case have sued the U.S. District Court for the Southern District of Texas, asking the court to halt implementation of both the DACA expansion and Deferred Action for Parents of Americans (DAPA). The case was considered by judge Andrew S. Hanen who issued a preliminary injunction blocking the expansion from going into effect while the case, Texas v. United States, proceeded."
 USA_crisis_event.1001.o1: "드리머들은 다른 곳을 꿈꿔야 한다"
 USA_crisis_event.1001.o2: "당신들의 웅크린 군중을 받아들여 더 나은 삶을 주겠다"
 USA_crisis_event.1002.t: "끝없는 두려움"
 USA_crisis_event.1002.d: "Since the aftermath of Texas v United States, things have begun to progress in a mostly counter intuitive manner when it comes to the \"immigration problem\". While many say we are flooding the country, others point out we have a moral obligation to properly process and at the very least care for those who made the long and extremely dangerous trip. As this \"debate\" rages on a lot more people who are not really active in terms of the news cycle realize the growing issue our federal government has become. With some saying its purely D.C.'s fault for this issue, while others say its the fault of older generations for not thinking ahead. Younger generations are starting to slowly become more politically active as the American Dream begins to turn into the American Make Believe, with many siting inconsistent and outright decaying reforms and regulations which have left younger generations in the dust in terms of economic mobility and opportunity. The question is whether this new youth movement will be able to gain enough traction to do something or not."
 USA_crisis_event.1002.o1: "농땡이도 열심히 치는 게 내 신조다."
 USA_crisis_event.1002.o2: "우리가 원하는 것을 위해 열심히 일할 것이다"
 USA_crisis_event.1003.t: "정치적 전환점"
 USA_crisis_event.1003.d: "The run up to the 2016 presidential race has seen a strange near three way political fork in the road. On one hand you have Hillary Clinton, a veteran politician with a wealth of experience at the federal level as well as foreign policy. A strong and committed Democrat. To her left is Senator Bernie Sanders another veteran politician that is very charismatic despite his age, Senator Sanders has been a very strong leader for the Progressive movement in America, despite what opposition leaders may have you believe he is a \"Socialist\", the reality is, he's more of a mix of center-left and the standard Demsoc you might find in Europe, at least when looking through the perspective of American social and econmic policies that is. Finally to the right hand side of both we have Donald Trump, businessman, novice and changing political interest as Trump has been a registered Democrat, Republican and even at one point joined Ross Perot's Reform Party back during his election bid for president. Trump is seen as a half breed between Evangelical and center-right, with inconsistent policy positions throughout the right spectrum as well as a supposed \"pro-America\" policy in relation to taxes and business incentivizing. In the end this cross roads will determine if and when America could see a major shift. For now lets just see who wins."
 USA_crisis_event.1003.o1: "최초의 여성, 혹은 냉전 이후의 진보주의자, 좋군"
 USA_crisis_event.1003.o2: "빌어먹을 민주당이 우리를 배신했다"
 USA_crisis_event.1004.t: "망명 신청자에 대해 판결한 대법원"
 USA_crisis_event.1004.d: "In september of 2019 the supreme court ruled that would demand that most asylum seekers who pass through another country first will be ineligible for asylum at the US's southern border. The ruling was stated to take effect in the first week of October, however protest against the ruling as inhumane has resulted in a renewal of the immigration debate. The administration has stated that this ruling does a strong blow to false asylum seekers which are inhibiting real asylum seekers from getting the care and attention they need. As such rising concerns of the capacity of USBP agents on the southern border is being called into uestion as the asylum courts have now an estimated backlog of around one million cases."
 USA_crisis_event.1004.o1: "판결이 그대로 시행된다"
 USA_crisis_event.1004.o2: "판결이 내부적으로 이의 제기된다"
 USA_crisis_event.1005.t: "42조"
 USA_crisis_event.1005.d: "To quell down rates of infection and risk of what some are calling, albeit hyperbolizing, \"super spreading\". The federal administration has drafted up legislation called Title 42. This legislation is a quick band-aid reaction to the on-going influx of migration around the southern border and is not deemed a permanent solution to the every gnawing issue at the border."
 USA_crisis_event.1005.o1: "분명 다른 방법이 있을 것이다"
 USA_crisis_event.1005.o2: "저를 셜리라고 부르지 마세요"
 USA_crisis_event.1006.t: "중앙아메리카의 탈출"
 USA_crisis_event.1006.d: "정치적, 경제적, 환경적 재난이 중앙아메리카의 여러 국가를 덮치자 그곳 국민들은 여정의 위험에도 불구하고 더 나은 삶을 찾아 스스로 나서고 있습니다. 앞으로 몇 년 동안 세계적 사건에도 불구하고 중앙아메리카 몇몇 국가의 시민 수백만 명이 과테말라와 멕시코를 거쳐 미국으로 이동할 것입니다. 지역 및 연방 파견 자원이 처리 능력을 넘어 한계에 이르렀음에도 연방정부가 상황을 심각하게 받아들이지 않고 있기에, 국경에 질서를 세우려면 무엇이 필요할지 의아해하는 이들이 많습니다."
 USA_crisis_event.1006.o1: "이 사람들에게는 도움이 필요하다, 현지인만이 아니라"
 USA_crisis_event.1007.t: "현대사의 긴장된 순간"
 USA_crisis_event.1007.d: "On January 11th Texas National Guardsmen took over Shelby park in the town of Eagle Pass. The park was originally being used by federal agents to house and detain migrants until they could be properly processed or deported. However as Texas continues Operation Lone Star with ever increasing encrouchment upon federal agents and assets many fear just where this could lead to as nothing of the sort has been seen in US history. Currently as of January 22nd Texas National Guard units and federal BP agents are at a stand off, with a continued tit for tat over the setting up and destroying of razer wire similar to what you would see on a military outpost defensive fence line. For now many both locally and nationally hold their breath and some even openly send support for Texas as events proceed to play out. The federal administration's direct response to the developing situation is what many wonder will see if things escalate or simmer down as time marches on."
 USA_crisis_event.1007.o1: "텍사스에 물러설 것을 요구한다"
 USA_crisis_event.1007.o2: "법원에 맡기자, 법적으로는 우리가 이긴다"
 USA_crisis_event.1007.o3: "의회를 긴급 회기로 소집하라"
 USA_crisis_event.1107.t: "굳건히 버티는 텍사스 주지사"
 USA_crisis_event.1107.d: "Back in January Texas forces had a stand off with federal forces at Eagle Pass at a place called Shelby Park. Federal forces withdrew and continued the tit for tat tactics related to the more aggressive defensive \"fortifications\" they were putting along the border. However a statement has come out directly from the federal government which had detailed that Texas forces should stand down and let the federal government do its contitutional and legal job of maintaining the national border in the south along its Mexican neighbor. This statement was left unanswered and things had seemed to quiet down, however ealier today an official statement was released by the governor of Texas stating that quote, \"The federal government has failed in its constitutional and legal duties to protect and maintain the security of the national border. As such I and as well as all of Texas and her local law and military forces will do whatever is needed to at the very least protect our own borders.\" Several states have already sent aid and manpower to the state of Texas in the force of volunteer law enforcement personnel and national guard soldiers with estimates of up to 500 national guard soldiers being sent by several other states who supported the actions of Texas in the on going crisis. This more or less hostile approach has many worried that America is on the brink of a constitutional crisis as both sides begin to take shape over whether or not Texas or the federal government is truly at fault."
 USA_crisis_event.1107.o1: "둘 다 잘못했다는 거 알잖아. 너는 입 다물어"
 USA_crisis_event.1108.t: "방어를 강화하는 텍사스"
 USA_crisis_event.1108.d: "Following the Texas governor's sort of \"stand fast\" affirmation against the federal government, Texas law enforcement and national guardsmen have been ramping up the creation of localized military installations as well as tasking local police forces to organize civilian attaches to look out for their towns. Many fear that Texas is on the cusp of doing something drastic and the federal government is looking to find ways to handle the situation without overt aggression. As one insider source states, \"People know Texas is technically in the wrong, but we've reach the national level of involvement and in general no one has been happy with the federal government on either side. So we need to do whatever possible to ensure that we can openly and quickly prove we are not the bad guys by how we treat the situation.\" Many hardliners see this as spineless, however moderates and even some opposition viewers have stated their open support and surprise at the handling of the federal government."
 USA_crisis_event.1108.o1: "이 게임을 이제 그만 끝낼 수 없을까"
 USA_crisis_event.1109.t: "의회를 떠나는 텍사스"
 USA_crisis_event.1109.d: "In the following days congress was put back into session and even into an emergency session as well. However it was during the emergency session which resulted in a shock to the nation. As it was reported no representatives both House and Senate had showed up from the state of Texas. Soon news reporters were swarming the Texas governors office about the situation in which he held a press conference over the situation. At the press conference all absent members had shown up and pledged their protest in union with one another of the federal government's over stepping boundaries and pure negligence. For not just Texas but to the states themselves as we are supposedly a union of. Soon after the declaration of protest the governor ended the press conference to a flurry of pleas and questions from the crowd of new reporters as now the protest and Texas's now open defiance against the federal government was broadcast to the nation. A response from the federal administration stated that quote, \"This is an outright challenge to the authority and duties of the federal government. More so it is a challenge to the union for which we have had since 1865 when we solidified and reintegrated the confederate states back into the union and came to the unified understanding of the meaning and principles of our very existence as a nation.\" Though many were inspired by these words, some were worried it may only cause other states to side with Texas if they felt disconnected or left behind by the federal government. Regardless things are looking like little's changed but it only takes one \"shot\""
 USA_crisis_event.1109.o1: "맙소사, 우리가 무슨 일에 휘말린 거지"
 USA_crisis_event.1110.t: "새로운 국경!?"
 USA_crisis_event.1110.d: "Following the Texas withdrawl from congress as well as the slow internal militarization of the Texas peoples, word has come in that Texas authorities have begun to put up roadblocks and fencing around the states' borders with its neighbors. Fears have struck a fever pitch as never before has a hard border been established within the United States before, even with the Civil War open rebellion was first followed by the \"established border of the south\". It is with this notion that the federal government has issued an ultimatum to the state of Texas and its government. It reads, \"Cease all establishment of a hard border within these United States or the state of Texas will be declared in open rebellion and placed under marshal law until the rebellion is under control.\" This declaration comes at a horrible time as its only been a year into the new presidency as well as things are nearing the holidays. Many are afraid of a war in their own backyard as rumors are abound of state governments weighing their options and wondering just what will the federal government do to the citizens of Texas and technically their own citizens by proxy. For now everyone waits with baited breath as Texas and the federal government look to be gearing up for a standoff."
 USA_crisis_event.1110.o1: "어디서부터 이렇게 잘못되었나"
 USA_crisis_event.1110.o2: "너희 다 엿 먹어라, 난 집에 간다"
 USA_crisis_event.1111.t: "최종 기한"
 USA_crisis_event.1111.d: "A month has passed and no word has been heard or said by the Texan government. As such by constitutional decree and congressional approval the state of Texas is declared under marshal law and in open rebellion. US forces will begin to move in and swiftly handle the situation as it has gone on longer than anyone anticipated."
 USA_crisis_event.1111.o1: "잠깐, 의원이 더 있지 않았나?"
 USA_crisis_event.1112.t: "남부의 형제들"
 USA_crisis_event.1112.d: "우리가 본보기를 세운 듯합니다. 남부의 소수 주가 우리와 합류하는 대신 연방을 떠나기로 결정했습니다. 이로써 우리의 대의는 더욱 커집니다. 잘못은 우리 주들이 아니라 사실 압제적인 연방 권력에 있기 때문입니다."
 USA_crisis_event.1112.o1: "우리의 남부 가족이 도착했다"
 USA_crisis_event.1112.o2: "하느님이 남부를 구원하시길"
 USA_crisis_event.1113.t: "사라진 의원들"
 USA_crisis_event.1113.d: "Turns out we were missing more congressional members, in the chaos and subsequent declaration it looks like a handful of southern states have decided to repeat history and declare their indepence from what they deem is, \"Northern Aggression\". However the most concerning thing is they might not be the only ones. Rumors and fears are rampant of more potentially leaving the union as well as desertions and mutinies within the army as many genuinely don't want to turn their guns on fellow Americans despite if they agree with them or not. This ungodly moralism has lead to a slight fit of lock up in military cohesion and actions as orders are getting lost and troops are not always cooperating with officers. The Department of Defense is looking to organize and training and refit station around Washington to filter out the poison and create a real fighting force against the rebellion."
 USA_crisis_event.1113.o1: "맙소사, 우리가 무슨 짓을 한 거지"
 USA_crisis_event.1114.t: "2라운드... 인가"
 USA_crisis_event.1114.d: "To now ones surprise the southern rebellion and seccession from the union was met with an instant declaration of war by the federal government. This lack luster \"round two\" as some are calling it has only made things worse off as even some states in the great plains and now even some though \"vote blue or don't vote\" states are even thinking of cutting their losses as the situation continues to grow out of proportion way more than ever anticipated."
 USA_crisis_event.1114.o1: "우리는 전에도 이랬고, 또 할 것이다"
 USA_crisis_event.1115.t: "평화를 추구하는 이들에게 신께 감사를"
 USA_crisis_event.1115.d: "몬태나, 노스다코타, 사우스다코타 주가 \\"연방을 떠났다\\"고 보고되었습니다. 그러나 이들의 공식 선언은 폭력의 거부에 더 가까웠습니다. 이 중립 선언과, 이들이 임시 명칭인 라코타 공화국을 자칭한 사실은 이 주들에 여러 미사일 격납고가 위치해 있어 연방정부를 분노하게 했습니다. 그래서 연방정부는 보유자들이 평화적이라 하더라도 이러한 전략 자산을 쉽게 놓아주지 않을 것입니다."
 USA_crisis_event.1115.o1: "이 모든 것에서 좀 쉬어야겠다"
 USA_crisis_event.1115.o2: "\\"연방\\"이 그다지 연합되어 있지 않은 모양이군"
 USA_crisis_event.1116.t: "오, 절대 안 돼"
 USA_crisis_event.1116.d: "몬태나와 다코타 주들은 \\"연방을 떠나기로\\" 했지만, 이들은 그저 미국인에 대한 폭력에 가담하지 않고 상황이 마무리되면 다시 합류하겠다는 것으로 알려졌습니다. 정신이 나갔나, 그들의 땅에는 가치가 높은 군사 및 전략 방어 자산이 여럿 있는데 그것을 가지고 \\"손을 떼겠다\\"는 것입니다."
 USA_crisis_event.1116.o1: "우리가 지켜보는 한 안 된다"
 USA_crisis_event.1117.t: "더 이상 없는 친구"
 USA_crisis_event.1117.d: "Looks like yet a domino falls for the supposed union. The heavily \"pro-federal\" states of the New England region have decided to peace out and form a regional government. In a statement made to national press, quote, \"In the beginning we saw the Texan and Southern rebellions as simple minded slaughter against America. However with the declared neutrality of the Lakota territories and the states around them being met with immediate hostility from the federal government. We have now seen the true colors of the Washington governmental body for what it really is, a power hungry and desperate defense against its status quo. We have therefore put it upon ourselves to declare similar neutrality from the on going conflict and expect to be declared on within hours or days of this declaration. God help us all.\" Things have certainly taken a free fall from here."
 USA_crisis_event.1117.o1: "그들이 학살당하게 내버려 둘 수는 없다"
 USA_crisis_event.1117.o2: "또 다른 보스턴 학살이 될 모양이다"
 USA_crisis_event.1118.t: "뉴잉글랜드의 미치광이들"
 USA_crisis_event.1118.d: "Well even more scum want to leave and try this moralistic bull crap excuse of justifying their seccession from the union. Well not on our watch, we can tackle them just as well as the instigators of this whole fiasco."
 USA_crisis_event.1118.o1: "잠깐, 이제 북쪽으로 가는 건가?"
 USA_crisis_event.1119.t: "푸에르토 누구?"
 USA_crisis_event.1119.d: "온갖 혼란과 무질서 속에서 푸에르토리코가 떠나 독립을 선언한 듯합니다. 이들은 영토였으므로 그들을 마구잡이로 되찾으러 갈 실질적인 명분은 없습니다. 게다가 생각해 보면 섬에서는 본토에 비해 할 수 있는 일이 한정되어 있어 평균적으로 비용이 더 듭니다."
 USA_crisis_event.1119.o1: "약간의 평화와 고요가 있으니 신께 감사한다"
 USA_crisis_event.1119.o2: "속이 시원하다, 그건 나중에 해결하자"
 USA_crisis_event.1120.t: "일어서는 주방위군"
 USA_crisis_event.1120.d: "With the impending deadline, national and state guard units have been mobilized to hold the line. Some citizens even accepted a call to arms to defend Texas soil. They won't be much, but they;ll help to plug the gaps."
 USA_crisis_event.1120.o1: "하느님이 텍사스를 구원하시길"
 USA_crisis_event.1121.t: "깃발 아래 결집하라"
 USA_crisis_event.1121.d: "최근의 독립과 함께 무장 소집이 선포되었으며 해당 남부 주들의 주방위군과 국가방위군이 동원되었습니다. 우리는 연방의 폭정에 맞서 굳건히 서고 원칙을 지키는 텍사스인들과 함께 서기 위해 최선을 다할 것입니다."
 USA_crisis_event.1121.o1: "하느님이 남부를 구원하시길!"
 USA_crisis_event.1122.t: "우리를 죽이러 온 그들"
 USA_crisis_event.1122.d: "Despite our clear intention of anti-conflict the federal government prizes their arms over their citizens. We may not last long but with whatever national guard we do have we can arm them andf send them to the mountains. We need to do whatever to send a message, a message of the failed federal entity over the principles of the old union."
 USA_crisis_event.1122.o1: "하느님이 우리 모두를 구원하시길"
 USA_crisis_event.1123.t: "민방위"
 USA_crisis_event.1123.d: "With the federal government poised to declare on us, many civilian militias and national guards units have self mobilized and are awaiting tasking. There's no way we'll stand up to the full might of the US military, but maybe we can hold on long enough to for some miracle to happen."
 USA_crisis_event.1123.o1: "독수리는 정말로 추락했다"
 USA_crisis_event.1124.t: "더 많은 배신자"
 USA_crisis_event.1124.d: "텍사스가 강경한 국경을 설치한 후 곧 다른 국경 주들도 이에 합류하기 시작했습니다. 이러한 연쇄적 확대는 우리에게 필요하지 않은 일이며, 최종 기한이 되면 그들이 물러서기를 바랄 뿐입니다... 도대체 어디서부터 이렇게 잘못된 걸까요?"
 USA_crisis_event.1124.o1: "우리는 왜 잘 지낼 수 없을까?"
 USA_crisis_event.1207.t: "주도권을 넘겨받은 법원"
 USA_crisis_event.1207.d: "In the aftermath of the Eagle Pass stand off, a steady back and forth through the legal system, department of homeland security as well as different levels of the courts began to toss around and attempt to solve the more or less on going stand off between Texas and federal forces. For the most part little has changed and the continued tit for tat over Texas's Operation Lone Star continues. As Texas forces continue to put down wire and \"fortification\" federal BP agents continue to work to take down said instruments of obstruction. Over all the situation seems to most be at a stand still but continued legal preceedings are still on going. Many hope that as time goes on and elections on the horizon that this change of leaderships will allow for a peaceful end to the current, \"meh\", state of affairs."
 USA_crisis_event.1207.o1: "여러분, 이들은 다 큰 성인이라는 점을 기억하세요"
 USA_crisis_event.1307.t: "모두에 대한 대중의 항의"
 USA_crisis_event.1307.d: "이글패스에서의 긴장된 대치 이후, 무소속과 기타 정당 옹호 단체들이 조직한 시위대는 텍사스와 연방 정부 및 병력 모두에게 현안을 제대로 해결하기 위한 회담에 나서라고 촉구해 왔습니다. 이 조직적 시위는 국경 근처로 가거나 시설을 출입하기로 한 양측의 정부 공직자와 군·법 집행 요원을 겨냥해 왔습니다. 그 결과 양측이 남부 국경 주들에 영향을 미치는 상황에 대해 실제로 회담을 열고 진정한 대화를 시작하는 방안을 검토하기로 했다는 소문이 돌고 있습니다."
 USA_crisis_event.1307.o1: "세상에, 이들도 어른처럼 행동할 수 있군"
 USA_crisis_event.1308.t: "렉싱턴 회의"
 USA_crisis_event.1308.d: "Representatives of both the southern border state governments lead by Texas and representatives of the federal administration have met up in Lexington, Kentucky to discuss and genuinely approach the supposed border problem. The meeting itself started off a little heated as some border representatives were just tired of the political pressure caused by the overt increase in traffic flow around their states as there is no increase in resources to account and tend to such increases. However neutral controlling parties tempered these outbursts before they could escalate. After a generally lengthy debate and back and forth a general aggreement was reached. Budgetary increases to improve processing facilities, recruit more personnel and set a plan for a genuine border line to help monitor and look out for migrants looking to enter the US regardless of legal or illegal intent to limit excesses in oversight will be implemented as soon as possible. Consequently plans will be drafted by the USBP agency and congress with local state governments to create new border crossing facilities to allow for better disemmination of traffic to and from the US and Mexico as well as better spread out immigration processing as well. Many see this as a win for the nation as a whole as political and independent activists were able to create enough pressure against not only state but federal officials to cause genuine change related to a political manner. In the following days more and more organized political movements would cause pressures for political and ecdonomic reforms which have many more debating on the validity of the current two party system."
 USA_crisis_event.1308.o1: "터널 끝에 빛이 보인다"
 USA_foreign_event.1.t: "무기 거래를 제안하는 미국"
 USA_foreign_event.1.d: "We are being offered military equipment for a lump some of money."
 USA_foreign_event.1.o1: "도움에 감사드립니다"
 USA_foreign_event.1.o2: "우리는 충분히 잘 버티고 있다"
 USA_foreign_event.111.t: "시에라리온의 수락"
 USA_foreign_event.111.d: ""
 USA_foreign_event.111.o1: "거래해 주셔서 감사합니다"
 USA_foreign_event.112.t: "거래를 거절한 시에라리온"
 USA_foreign_event.112.d: ""
 USA_foreign_event.112.o1: "이제 틀림없이 실패할 것이다"
 USA_foreign_event.2.t: "군사 고문단 파견을 제안하는 미국"
 USA_foreign_event.2.d: "우리 병사들이 현대 전장의 전술을 다듬을 수 있도록 군사 고문단을 보내겠다는 제안이 들어왔습니다."
 USA_foreign_event.2.o1: "지식을 전수해 주셔서 감사합니다"
 USA_foreign_event.2.o2: "우리가 싸우는 땅은 우리가 가장 잘 안다"
 USA_foreign_event.221.t: "고문단을 수락한 시에라리온"
 USA_foreign_event.221.d: ""
 USA_foreign_event.221.o1: "도울 수 있어 기쁘다"
 USA_foreign_event.222.t: "우리의 고문단을 거절한 시에라리온"
 USA_foreign_event.222.d: ""
 USA_foreign_event.222.o1: "후회하게 될 것이다"
 USA_foreign_event.3.t: "우리의 대의에 합류한 미국 무슬림들"
 USA_foreign_event.3.d: "미국 무슬림 지원병들이 몰려들고 있습니다. 이미 준비를 갖춘 이들은 자체 물자와 장비를 가져오므로 우리의 대의에 도움이 될 수 있습니다."
 USA_foreign_event.3.o1: "알라는 모두를 환영하신다"
 USA_foreign_event.3.o2: "그대들의 신앙은 더럽혀졌다. 이단자들은 물러가라."
 USA_foreign_event.331.t: "아프가니스탄의 수락"
 USA_foreign_event.331.d: "아프가니스탄 정부가 무슬림 군단 지원병을 받아들였습니다."
 USA_foreign_event.331.o1: "자유로운 미래를 위하여"
 USA_foreign_event.332.t: "아프가니스탄의 거절"
 USA_foreign_event.332.d: ""
 USA_foreign_event.332.o1: "어떻게 그럴 수가"
 USA_foreign_event.4.t: "무기 거래를 제안하는 미국"
 USA_foreign_event.4.d: "We have been approached by the United States with an offer to help supply our military. While we may need the equipment there is concern with taking help from the leader of the \"Western\" world leader."
 USA_foreign_event.4.o1: "우리에게는 보급품이 필요하다"
 USA_foreign_event.4.o2: "알라께서 우리 군을 인도하실 것이다"
 USA_foreign_event.441.t: "우리의 무기를 수락한 아프가니스탄"
 USA_foreign_event.441.d: ""
 USA_foreign_event.441.o1: "확실한 승리다"
 USA_foreign_event.442.t: "우리의 무기를 거절한 아프가니스탄"
 USA_foreign_event.442.d: ""
 USA_foreign_event.442.o1: "대체 왜 시도했을까"
 USA_foreign_event.5.t: "The United States Offer Free Supplies"
 USA_foreign_event.5.d: "We are being presented a gift of military supplies to fight for our freedom from the Fundementalist, as such we could take this in stride and potentially be influenced politically or we could stave it out and rally behind our righteous cause."
 USA_foreign_event.5.o1: "자유로운 미래를 위한 무상 선물"
 USA_foreign_event.5.o2: "우리에게 당신들의 자선은 필요 없다"
 USA_foreign_event.551.t: "기증을 수락한 아프가니스탄"
 USA_foreign_event.551.d: ""
 USA_foreign_event.551.o1: "훌륭한 세금 공제 혜택이다"
 USA_foreign_event.552.t: "우리의 기증을 거절한 아프가니스탄"
 USA_foreign_event.552.d: ""
 USA_foreign_event.552.o1: "놓친 기회"
 USA_foreign_event.6.t: "군사 고문단을 제안하는 미국"
 USA_foreign_event.6.d: "The United States has offered to send military advisors to train our troops with the offered equipment. We could accept this but look weaker to our neighbors than already percieved, or we take the help and potentially safeguard the future of our nation."
 USA_foreign_event.6.o1: "기꺼이 수락한다"
 USA_foreign_event.6.o2: "우리는 알라의 이름으로 승리할 것이다"
 USA_foreign_event.661.t: "우리의 고문단을 수락한 아프가니스탄"
 USA_foreign_event.661.d: ""
 USA_foreign_event.661.o1: "좋은 동반자 관계"
 USA_foreign_event.662.t: "우리의 고문단을 거절한 아프가니스탄"
 USA_foreign_event.662.d: ""
 USA_foreign_event.662.o1: "그들이 대체 무엇을 안다는 것인가?"
 USA_foreign_event.7.t: "제안을 하는 미국"
 USA_foreign_event.7.d: "The Americans have come to us with a most curious offer. In exchange for a lump some payment and development of our domestic oil industry for aid against Iraqi advances. The catch is we would be giving the product excluively to the US until a later determined date. "
 USA_foreign_event.7.o1: "우리의 독립이 더 중요하다"
 USA_foreign_event.7.o2: "우리는 결코 우리 자신을 팔 수 없다."
 USA_foreign_event.771.t: "우리의 사업을 수락한 쿠웨이트"
 USA_foreign_event.771.d: ""
 USA_foreign_event.771.o1: "모두에게 좋은 거래다"
 USA_foreign_event.772.t: "우리의 사업을 거절한 쿠웨이트"
 USA_foreign_event.772.d: ""
 USA_foreign_event.772.o1: "시간 낭비였다"
 USA_foreign_event.8.t: "무기를 제안하는 미국"
 USA_foreign_event.8.d: "The Americans comes with an offer of selling TOW missiles on the cheap as a way to defend against Iraqi Armor forces."
 USA_foreign_event.8.o1: "이 무기와 함께 우리의 독립을 지킨다"
 USA_foreign_event.8.o2: "가진 것만으로도 버틸 수 있다"
 USA_foreign_event.881.t: "우리의 무기를 수락한 쿠웨이트"
 USA_foreign_event.881.d: ""
 USA_foreign_event.881.o1: "상호 방위를 향한 한 걸음"
 USA_foreign_event.882.t: "우리의 무기를 거절한 쿠웨이트"
 USA_foreign_event.882.d: ""
 USA_foreign_event.882.o1: "하루도 못 버틸 것이다"
 USA_foreign_event.9.t: "무역 협정을 제안하는 미국"
 USA_foreign_event.9.d: "미국이 무역 협정을 제안해 왔습니다. 우리가 석유를 약간 더 싼 가격에 판매하면 미국 투자자들이 유전과 우리 경제를 키우는 것을 돕겠다는 내용입니다."
 USA_foreign_event.9.o1: "Free Trade Mean Progress"
 USA_foreign_event.9.o2: "우리는 매수당하지 않을 것이다"
 USA_foreign_event.991.t: "우리의 개발 계획을 수락한 쿠웨이트"
 USA_foreign_event.991.d: ""
 USA_foreign_event.991.o1: "그들을 위한 안정적인 미래"
 USA_foreign_event.992.t: "우리의 개발 계획을 거절한 쿠웨이트"
 USA_foreign_event.992.d: ""
 USA_foreign_event.992.o1: "그럼 계속 제3세계에 머물러라"
 USA_foreign_event.10.t: "무기를 보내는 미국"
 USA_foreign_event.10.d: "미국이 이라크의 위협으로부터 국토를 방어하려는 우리의 대의를 돕기 위해 장비를 가져왔습니다."
 USA_foreign_event.10.o1: "자유 세계가 보내는 무상 선물"
 USA_foreign_event.10.o2: "우리는 경계를 늦추지 않을 것이다"
 USA_foreign_event.10101.t: "우리의 기증을 수락한 쿠웨이트"
 USA_foreign_event.10101.d: ""
 USA_foreign_event.10101.o1: "더 자유로운 중동을 위하여"
 USA_foreign_event.10102.t: "우리의 기증을 거절한 쿠웨이트"
 USA_foreign_event.10102.d: ""
 USA_foreign_event.10102.o1: "정말로 아쉬운 제안이었다"
 USA_foreign_event.11.t: "군사 고문단을 보내는 미국"
 USA_foreign_event.11.d: "미국이 이라크의 위협으로부터 국토를 방어하려는 우리의 대의를 돕기 위해 군사 고문단을 보내 왔습니다."
 USA_foreign_event.11.o1: "자유 세계가 보내는 무상 선물"
 USA_foreign_event.11.o2: "우리는 경계를 늦추지 않을 것이다"
 USA_foreign_event.11111.t: "우리의 고문단을 수락한 쿠웨이트"
 USA_foreign_event.11111.d: ""
 USA_foreign_event.11111.o1: "크기가 전부는 아니다"
 USA_foreign_event.11112.t: "우리의 고문단을 거절한 쿠웨이트"
 USA_foreign_event.11112.d: ""
 USA_foreign_event.11112.o1: "작은 나라가 말은 거창하군"
 USA_foreign_event.12.t: "우리의 대의에 몰려드는 아랍계 미국인들"
 USA_foreign_event.12.d: "최근 이라크의 위협에 맞서 우리가 스스로를 방어하는 것을 돕고자 하는 아랍계 미국인들이 대거 우리나라로 들어오고 있습니다."
 USA_foreign_event.12.o1: "자유의 투사들은 굳건히 선다"
 USA_foreign_event.12.o2: "더럽혀진 아랍인들은 알라를 섬기지 않는다"
 USA_foreign_event.12121.t: "군단을 수락한 쿠웨이트"
 USA_foreign_event.12121.d: ""
 USA_foreign_event.12121.o1: "하나 된 대의를 위하여"
 USA_foreign_event.12122.t: "군단을 거절한 쿠웨이트"
 USA_foreign_event.12122.d: ""
 USA_foreign_event.12122.o1: "분열된 미래를 위하여"
 USA_foreign_event.13.t: "자유 시리아 군대의 우월성"
 USA_foreign_event.13.d: "국내 공급과 다른 지역에 대한 투자로 충당되기 때문에 중동은 크게 우려할 대상은 아니지만, 그렇다고 가만히 앉아 있어야 하는 것은 아닙니다. 우리 방위 산업체들에게 일거리를 줍시다."
 USA_foreign_event.13.o1: "그렇다"
 USA_foreign_event.14.t: "시리아에 무기 판매"
 USA_foreign_event.14.d: "시리아 내전은 테러 대응을 지지하는 이들과 우리의 전략적 이익에 있어 큰 의미를 지닙니다. 그러나 뚜렷한 승자가 없으므로 특정 국가 또는 모든 국가에 무기를 판매하는 방안을 선택할 수 있습니다."
 USA_foreign_event.14.o1: "돈이 흐르게 하라"
 USA_foreign_event.14.o2: "FSA가 답이다"
 USA_foreign_event.14.o3: "로자바에 돈을"
 USA_foreign_event.14.o4: "ISIS가 모든 것을 얼려 버릴 것이다"
 USA_foreign_event.14.o5: "알누스라? 차라리 내가 돈을 대겠다"
 USA_foreign_event.14.o6: "농담거리도 떨어졌고 모두가 너와 싸우고 있으니 그냥 사라"
 USA_foreign_event.15.t: "시리아의 투사들 지원"
 USA_foreign_event.15.d: "국제 사회는 중동 위기에 대한 우리의 다소 솔직한 침묵에 피로감을 느끼고 있습니다. \\"옳은\\" 대의를 위해 싸우는 이들에게 \\"해외 원조\\"를 제공하여 이러한 시각을 누그러뜨려 봅시다."
 USA_foreign_event.15.o1: "홍보용 쇼만 한 것도 없다"
 USA_foreign_event.16.t: "자유 시리아 군대를 위한 군사 고문"
 USA_foreign_event.16.d: "고문단을 보내도 국제 사회는 아무것도 알지 못하겠지만, 이 고문단들이 훈련에 쓸 장비가 필요하므로 일부를 제공합시다."
 USA_foreign_event.16.o1: "그렇다"
 USA_foreign_event.17.t: "비공식 경로를 통한 지원"
 USA_foreign_event.17.d: "훈련은 더디고 장비 손실은 늘고 있습니다. 시리아군이 장비를 보존할 수 있도록 대중의 눈에 띄지 않는 곳에서 거래를 조직합시다."
 USA_foreign_event.17.o1: "이것이 필요하다"
 USA_foreign_event.17.o2: "우리 힘으로 감당할 수 있다"
 USA_foreign_event.18.t: "강력한 의지를 보여 주는 미국"
 USA_foreign_event.18.d: "The war continues, there seems to be little progress in terms of a victory. The United States has come to us with a strong offer, this being essentially a brigade. The problem being is they want a large amount of money for it. If we are not in a good fiscal position then this deal could break our chances in a victory... But if we can make it, then this boosts our chances in securing the nation for our cause with what would be known as the Bomba Brigade."
 USA_foreign_event.18.o1: "승리를 향해 전진!!!"
 USA_foreign_event.18.o2: "그럴 수 있다면 좋겠다"
 USA_foreign_event.19.t: "다마스쿠스 군단의 창설"
 USA_foreign_event.19.d: "Volunteers have flocked to our Free Army as a way to pledge their services to help make Syria a free nation, while some are sceptical other believe this is the boost we need to win the war."
 USA_foreign_event.19.o1: "시리아를 자유롭게"
 USA_foreign_event.19.o2: "우리는 서방의 영향에 굴복하지 않을 것이다"
 usa.999.t: ""
 usa.999.d: ""
 usa.999.o1: ""
 USA_events_domestic_policies.21.title1: "우주왕복선 프로그램을 보강할 것인가?"
 USA_events_domestic_policies.21.d: "Choosing whether to invest in the shuttle program's safety is a critical decision. Without additional funding, we risk catastrophic failures that could endanger both astronauts and the mission itself. However, some argue that the balooning costs may outweigh the benefits, especially when funds could be allocated to other pressing needs, and there's no guarantee that even additional measures will fully eliminate all risks."
 USA_events_domestic_policies.21.d1: "추가 자금을 확보한다"
 USA_events_domestic_policies.21.d2: "NASA는 없이 해결해야 할 것이다"
 USA_events_domestic_policies.22.title1: "컬럼비아호 참사 모면"
 USA_events_domestic_policies.22.d: "The Columbia shuttle safely returned to Earth on February 1, 2003, bringing relief to ground control, the crew, and the entire nation as it touched down. After liftoff, a debris strike had been detected on the shuttle's left wing, raising concerns about potential dangers during re-entry. Fortunately, the damage was minimal and did not compromise the shuttle's safety. NASA Director Sean O'Keefe credited in part the additional program's funding recently allocated for playing a crucial role in preventing a possible tragedy."
 USA_events_domestic_policies.22.d1: "집에 돌아온 것을 환영한다"
 USA_events_domestic_policies.23.title1: "컬럼비아호 참사"
 USA_events_domestic_policies.23.d: "우주왕복선 컬럼비아호가 2003년 2월 1일 지구 대기권에 재진입하는 과정에서 분해되어 탑승한 승무원 7명 전원이 비극적으로 사망했습니다. 발사 중 단열 폼 조각이 왕복선의 좌측 날개를 손상시켰고, 이는 재진입 시 열 차폐 시스템의 치명적인 파손으로 이어졌습니다. 이 참혹한 사고로 우주왕복선 프로그램은 앞으로 수년간 비행이 중단될 것이며, NASA는 안전 체계를 대대적으로 개편하게 될 것입니다."
 USA_events_domestic_policies.23.d1: "국가적 비극..."
 USA_shuttlelaunch.1.title1: "STS-99, 2000년 첫 우주왕복선 발사"
 USA_shuttlelaunch.1.d: "21세기 최초의 우주왕복선 발사인 STS-99는 2000년 2월 11일 케네디 우주센터에서 엔데버호에 탑승하여 이륙했습니다. 이번 임무는 첨단 레이더로 지구의 지형을 지도화하여 정밀한 3D 지표 모델을 만드는 것을 목표로 합니다. 앞으로 며칠 동안 승무원들은 지구 육지 면적의 80% 이상을 포괄하는 데이터를 수집할 것입니다.\n\n(이제 우주왕복선은 실제 역사적 날짜에 맞춰 케네디 우주센터에서 발사됩니다.)\n"
 USA_shuttlelaunch.1.d1: "아무도 가 보지 못한 새 천년을 향해 대담하게 나아간다"
 USA_f35_program: "국내 F-35 프로그램"
 USA_f35_program_desc: "우리는 향후 주력 다목적 전투기로 운용하기 위해 F-35 프로그램에 자금을 지원하기 시작했습니다."
 usa.80.t: "미래의 다목적 전투기, F-35"
 usa.80.d: "수년 간의 협력과 혁신, 그리고 설계 과정을 거쳐 록히드 마틴의 엔지니어들은 파트너사인 노스롭 그루먼, BAE 시스템즈와 함께 마침내 신형 5세대 다목적 전투기인 F-35 라이트닝 II를 공개했습니다. 이 기체는 현존하는 가장 진보된 5세대 다목적 전투기로 평가받으며, 우리 군이 그 어떤 경쟁자보다도 수십 년을 앞서 나가게 해줄 것입니다. 그러나 일각에서는 본격적인 생산이 시작될 무렵이면 이미 더 우수한 설계가 개발되어 있을 것이라 주장하며, 과연 이 프로그램이 그만한 가치가 있는지에 대해 격렬한 논쟁을 벌이고 있습니다."
 usa.80.o1: "계획에 자금을 지원한다"
 usa.80.o2: "우리는 더 나은 비행기를 만들 수 있다"
 USA_f35_supply_chain: "F-35 공급망"
 USA_f35_supply_chain_desc: "F-35 판매량을 늘릴수록 공급망에 가해지는 부담도 커집니다. 판매량을 적절히 조절하지 않는다면 군수 산업 부문 전체가 심각한 침체를 겪게 될 것입니다. 하지만 수주 물량이 완료될 때마다 생산 능력에는 다시 여유가 생길 것입니다."
 usa.81.t: "예산 배정"
 usa.81.d: "우리는 계획에 추가 자금을 지원하기 위한 합의를 이끌어 낼 수 있었으며, 이를 통해 얼마를 투입할지 선택할 수 있습니다. 더 많이 투입할수록 사업을 본궤도에 더 빨리 올릴 수 있습니다."
 usa.81.o1: "적은 금액을 배정한다"
 usa.81.o2: "적당한 금액을 배정한다"
 usa.81.o3: "많은 금액을 배정한다"
 usa.82.t: "F-35 프로그램 확대"
 usa.82.d: "우리는 세계 무대에서의 영향력을 확대하는 동시에 글로벌 안보를 강화하고자, 동맹국들을 F-35 프로그램에 초청하기로 결정했습니다. 동맹국의 참여를 유도함으로써 우리는 공동 전선을 구축할 뿐만 아니라, 그들이 공유할 자원과 자금, 그리고 기술 정보의 혜택을 누리게 될 것입니다. 이러한 파트너십은 프로그램의 진행을 가속화하여, F-35의 첨단 능력이 연합군 전반에 걸쳐 더욱 신속하고 효과적으로 전력화되도록 보장할 것입니다."
 usa.82.o1: "NATO 회원국으로 계획을 확대한다"
 usa.82.o2: "NATO 회원국과 주요 동맹국으로 계획을 확대한다"
 usa.82.o3: "모두에게 계획을 개방하되 초대장은 돌리지 않는다"
 usa.83.t: "[FROM.GetName]이(가) 우리에게 F-35 프로그램 참여를 제안했다."
 usa.83.d: "[FROM.GetName]은(는) 현존하는 세계 최고의 다목적 전투기라 자부하는 F-35 프로그램에 우리를 초청했습니다. 프로그램에 참여하여 기여금을 납부할 경우, 우리는 F-35를 인도받을 수 있게 됩니다. 또한 그들은 F-35 부품의 국내 생산을 위해 우리 군수 산업에 대한 추가적인 투자를 약속했습니다."
 usa.83.o1: "우리에게는 이득뿐이다"
 usa.83.o2: "우리는 더 나은 비행기를 만들 수 있다"
 usa.84.t: "F-35가 날아오르다"
 usa.84.d: "오랜 시간 끝에 마침내 F-35 개발 단계를 완료했습니다. 이제 이 프로그램을 앞으로 어떻게 운영할지 결정해야 할 때입니다. 주요 목표는 노후화된 F-16 전력을 F-35로 대체하는 것이었으며, F-35는 동시에 다양한 임무를 수행할 수 있습니다. 기본 설계 외에도, 상황별 요구에 맞춰 운용할 수 있도록 F-35B와 F-35C 파생형 또한 설계되었습니다."
 usa.84.o1: "마침내"
 usa.85.t: "결실을 맺는 우리의 투자"
 usa.85.d: "F-35 프로그램 참여를 통해 단행한 우리의 투자가 마침내 결실을 맺었습니다. 우리가 지원한 자금 규모에 따라, 미국은 우리가 마땅히 받아야 할 F-35를 인도할 것입니다. 하지만 결정해야 할 사항이 있습니다. 어떤 파생형의 F-35를 원하십니까?"
 usa.85.o1: "F-35A 라이트닝 II"
 usa.85.o2: "F-35B 라이트닝 II"
 usa.86.t: "[FROM.GetName]이(가) F-35 주문을 요청하다"
 usa.86.d: "[FROM.GetName]은(는) 안보 협력을 강화하는 차원에서 F-35 주문을 허가해 줄 것을 우리 정부에 요청했습니다. 비록 그들이 현재 F-35 프로그램에 참여하고는 있으나, 과연 이러한 첨단 장비를 유지 관리하고 보안을 지킬 수 있을지 신뢰할 수 있겠습니까? 비용은 그들의 GDP에 비례하여 산정될 것입니다. 새로 생산된 기체가 그들에게 인도되므로 우리가 보유한 F-35가 줄어드는 것은 아니지만, 우리는 여전히 생산 역량에 대한 부담을 일부 짊어지게 될 것입니다."
 usa.86.o1: "선택지를 제시한다"
 usa.86.o2: "아니요"
 usa.87.t: "미국의 요청 수락"
 usa.87.d: "미국이 우리의 F-35 도입 요청을 승인했으며, 구매 가능한 방대한 기체 목록을 제시했습니다."
 usa.87.o1: "F-35A 주문"
 usa.87.o2: "F-35B 주문"
 usa.87.o3: "F-35A 대량 주문"
 usa.87.o4: "F-35B 대량 주문"
 usa.88.t: "우리의 F-35 판매 제안을 거절한 미국"
 usa.88.d: "미국이 F-35 주문을 하겠다는 우리의 제안을 거절했습니다. 구체적인 이유는 밝히지 않았지만, 우리가 기술을 유지할 만큼 '신뢰할 수 없'으며 공급망도 현재 상당히 빠듯하다고 말했습니다."
 usa.88.o1: "유감이다"
 usa.89.t: "F-35 계획 가입을 신청하는 [FROM.GetName]"
 usa.89.d: "[FROM.GetName]이(가) F-35 계획에 가입을 신청했습니다. 이들은 우리와 가장 가까운 파트너 중 하나이며, 이러한 기술을 제공하는 것은 우리의 목표 달성에 도움이 될 수 있습니다."
 usa.89.o1: "계획에 오신 것을 환영합니다!"
 usa.89.o2: "아니요"
 usa.90.t: "이제 F-35 계획의 일원이 된 우리!"
 usa.90.d: "미국이 관대하게도 우리를 F-35 계획에 받아들여, 우리는 이 인기 높은 전투기를 손에 넣을 소수의 후보국 중 하나가 되었습니다."
 usa.90.o1: "훌륭해!"
 usa.91.t: "F-35 계획 신청 거부"
 usa.91.d: "The United States was no willing to allow us to join the F-35 program, citing that we cannot yet be trusted to possess such technology. However, we will be able to apply again if we improve our relations."
 usa.91.o1: "유감이다"
 usa.92.t: "우리를 F-35 계획에서 제외한 미국"
 usa.92.d: "미국이 우리를 F-35 계획에서 제외하기로 결정했습니다. 이 조치는 영구적이지 않을 가능성이 높습니다. 우리에게 충분한 이유가 제시되지는 않았으나, 미국은 우리가 계획의 온전성에 위협이 된다고 모호하게 밝혔습니다."
 usa.92.o1: "유감이다"
 usa.93.t: "F-35 계획을 발표한 미국"
 usa.93.d: "미국이 F-35 계획의 출범을 발표하며, 모든 요건을 충족한다면 미국의 동맹국과 우방국은 얼마든지 가입을 신청할 수 있다고 밝혔습니다."
 usa.93.o1: "흥미롭군"
 USA_unlock_f35_decision_TT: "£decision_icon_small §YUnlocks§! F-35 Program §YDecisions§!"
 USA_removed_from_F35_TT: "§R우리는 F-35 계획에서 제외되며, 모든 주문이 취소됩니다§!\n\n다음 사유 중 하나 이상으로 인해 제외되었을 수 있습니다:\n- 미국에 적대적인 외국이 우리에 대해 20% 이상의 영향력을 보유함\n- 우리가 더 이상 주요 비NATO 동맹국이 아니거나, (과거 NATO 회원이었다면) NATO 회원국이 아님\n- 우리가 미국에 적대적인 국가의 종속국임\n§C이러한 문제를 해결하면 다시 신청하여 승인받을 수 있습니다§!"
 USA_reasons_for_denial_TT: "다음 사유 중 하나 이상으로 인해 거부되었을 수 있습니다:\n- 미국에 적대적인 외국이 우리에 대해 20% 이상의 영향력을 보유함\n- 우리가 더 이상 주요 비NATO 동맹국이 아니거나, (과거 NATO 회원이었다면) NATO 회원국이 아님\n- 우리가 미국에 적대적인 국가의 종속국임\n§C이러한 문제를 해결하면 다시 신청하여 승인받을 수 있습니다§!"
 USA_increase_funding_by_3: "§HF-35 계획 진행도§!가 §G3%§! 증가합니다"
 USA_increase_funding_by_5: "§HF-35 계획 진행도§!가 §G5%§! 증가합니다"
 USA_increase_funding_by_8: "§HF-35 계획 진행도§!가 §G8%§! 증가합니다"
 USA_increase_funding_by_10: "§HF-35 계획 진행도§!가 §G10%§! 증가합니다"
 USA_increase_funding_by_1: "§HF-35 계획 진행도§!가 §G1%§! 증가합니다"
 USA_100_f35_progress_TT: "F-35 계획 진행도가 100%입니다"
 USA_f35_submitted_tech: "최소 1개의 기술을 제출해야 합니다"
 USA_f35_apply_TT: "처음에는 초청받는 국가가 없지만, 각국은 여전히 회원 가입을 신청할 수 있습니다. 이를 통해 F-35를 누가 받을지 더욱 구체적으로 선별할 수 있습니다."
 USA_f35_program_decisions: "F-35 프로그램"
 USA_f35_program_decisions_desc: "\n£desctext_nato_plane\n\n\n\n§HF-35 계획§!의 발표로 [USA.GetFlag] 미국은 신무기와 신기술 개발의 속도를 늦출 계획이 없음을 세계에 보여주었습니다. [USA.GetFlag] 미국은 적절하다고 판단되면 §HF-35 계획§!의 회원을 승인하거나 제명할 수 있으며, 이는 대개 회원이 눈 밖에 났을 때에만 이루어집니다. 계획의 각 회원은 자금을 투자할 수 있고, 더 많은 자금을 투자할수록 계획이 완료되었을 때 더 많은 §HF-35§!를 받게 됩니다. §HF-35§!에 사용되는 부품에 대한 연구 또한 누가 연구했는지와 관계없이 더 높은 진행도로 이어집니다.\n\n계획 완료율: §H[?USA.USA_f35_progress]%§!"
 USA_announce_completion_of_f35: "F-35 계획 완료 발표"
 USA_announce_completion_of_f35_desc: "록히드 마틴의 엔지니어들은 자신들의 급여가 도덕성보다 무겁다는 것을 확실히 증명했습니다."
 USA_invest_in_the_program: "계획 투자"
 USA_invest_in_the_program_desc: "우리 계약업체들은 계획을 계속 진행하기 위해 자금이 필요하며, 더 많은 자금을 배정하면 항공기를 더 빨리 손에 넣을 수 있을 것입니다."
 USA_kick_out_of_program: "[FROM.GetName]을(를) F-35 계획에서 제명"
 USA_kick_out_of_program_desc: "우리는 [FROM.GetName]이(가) 우리 계획의 보안을 제대로 지킬 것이라 신뢰할 수 없으며, 따라서 제명되어야 합니다."
 USA_open_removals: "F-35 계획 회원 목록 열기"
 USA_open_removals_desc: "특정 F-35 계획 회원을 제명하는 결정을 엽니다. 이 메뉴는 계획에 참여 중인 국가를 확인하는 용도로도 쓰입니다."
 USA_close_removals: "F-35 계획 회원 목록 닫기"
 USA_expansion_of_the_program: "계획 확대"
 USA_expansion_of_the_program_desc: "In order to secure additional funding for the program, we can promise our international partners with the ability to acquire the F-35 if they contribute."
 USA_put_forward_frame_tech: "기체 연구 제출"
 USA_put_forward_frame_tech_desc: "F-35에 사용될 수 있는 기체를 연구함으로써 계획의 속도를 높일 수 있습니다."
 USA_put_forward_counter_measure_tech: "대응 수단 체계 연구 제출"
 USA_put_forward_counter_measure_tech_desc: "F-35가 하늘을 지배하려면 첨단 대응 수단이 필요하며, 우리의 연구를 파트너들에게 제공하면 계획이 크게 가속될 것입니다."
 USA_put_forward_radar_tech: "레이더 연구 제출"
 USA_put_forward_radar_tech_desc: "제대로 된 레이더가 없다면 F-35는 하늘의 다른 항공기와 다를 바 없을 것입니다. 우리는 F-35를 돋보이고 독보적인 존재로 만들어야 합니다."
 NATO_ask_to_join_f35_program: "F-35 계획 가입 요청"
 NATO_ask_to_join_f35_program_desc: "We can ask the United States to invite us to their F-35 program, so that we may finally be able to acquire some of the worlds most advanced fighter jets."
 NATO_ask_to_join_f35_program2: "F-35 계획 가입 요청"
 NATO_ask_to_join_f35_program2_desc: "우리는 미국에 F-35 계획에 초청해 달라고 요청할 수 있으며, 그렇게 되면 마침내 세계에서 가장 진보한 전투기 중 일부를 도입할 수 있을 것입니다."
 USA_place_orders_for_f35_contributors: "우리의 F-35 수령"
 USA_place_orders_for_f35_contributors_desc: "계획의 초기 기여국이었으므로, 우리가 마땅히 받아야 할 F-35를 수령할 수 있습니다."
 USA_place_orders_for_f35: "F-35 주문"
 USA_place_orders_for_f35_desc: "By placing an order for the F-35, we will be able to take full advantage of the program and all of it's benefits."
 small_f35a_order: "Small F-35A Order in Production.."
 small_f35b_order: "Small F-35B Order in Production.."

 USA_rock_island_additive_manufacturing: "적층 제조 주조소"
 USA_us_arab_legion_desc: "아랍계 미국인 자원병들이 결집하여 이라크의 위협에 맞서 우리 군과 함께 싸우는 군단을 결성했습니다. 이 자원병 군단을 세우고 유지하는 데에는 우리의 모병 자원이 쓰이므로, 정규군에 투입될 인력이 약간 줄어듭니다."
 lunar_outpost_tt: "시간이 지남에 따라 우리의 달 전초기지는 이를 위태롭게 할 수 있는 난관이나 위기를 맞을 수 있습니다. 그러나 성공한다면 그 보상은 엄청날 것입니다."
 USA_wot_iraq_invasion_failed: "이라크 침공 실패"
 MNNA_nato_may_intervene_in_this_conflict_tt: "[FROM.GetNameWithFlag]이(가) §H주요 비나토 동맹국§!이므로 이 분쟁에 §H나토§!가 개입할 수 있습니다.\n"
 MNNA_rejected_recently: "Has recently apply for §YMajor Non-NATO Ally§!, and got rejected."
 USA_condemn_iranian_missile_launches: "이란 미사일 시험에 대한 규탄 결집"
 USA_condemn_iranian_missile_launches_desc: "이란의 탄도미사일 계획은 모든 제재 국면을 거치면서도 계속되었으며, 시험 발사는 능력의 과시보다는 반항의 신호를 보내기 위한 시점에 이루어졌습니다. 워싱턴은 파트너 정부를 압박해 공개 규탄에 동참하게 함으로써 일방적인 항의를 외교적 전선으로 전환할 수 있습니다. 이란산 에너지에 의존하거나 보복을 두려워하는 정부들은 거절할 수도 있습니다."
 USA_condemned_PER_launch_recently: "최근 이란 미사일 시험에 대한 규탄을 결집함"
 USA_shayrat_missile_strike: "샤이라트 공군기지 공습"
 USA_shayrat_missile_strike_desc: "홈스 외곽의 샤이라트 공군기지에는 반군 장악 지역에 출격하는 시리아 공군 비행대대가 주둔해 있습니다. 동지중해의 구축함은 몇 시간 안에 활주로, 강화 격납고, 연료 시설에 토마호크를 투하할 수 있습니다. 이는 작전이 아니라 징벌적 공습입니다. 다마스쿠스는 며칠 안에 기지를 복구할 것이며, 모스크바와 테헤란은 이를 미국의 직접적인 참전으로 간주할 것입니다."
 USA_arm_rojava: "시리아 민주군 무장"
 USA_arm_rojava_desc: "시리아 북부를 장악한 쿠르드계 민병대는 락까를 점령할 의지가 있는 유일한 지상군이며, 이들은 노획할 수 있는 것으로 싸우고 있습니다. 소화기, 경차량, 대전차 무기를 직접 이전하면 이슬람 국가의 수도에 대한 공격이 가능해질 것입니다. 앙카라는 이 부대들을 PKK의 연장선으로 간주하며, 이 지원을 자국 국경의 테러 조직을 무장시키는 것으로 받아들일 것입니다."
 asteroid_mining_rate_tt: "활성화된 소행성 채굴률이 필요함 (현재 [?asteroid_mining_rate|0])"

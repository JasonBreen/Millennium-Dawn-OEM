 USA_econ_event.30.t: "유나이티드 디펜스 인수를 제안하는 BAE 시스템즈"
 USA_econ_event.30.d: "BAE 시스템즈가 유나이티드 디펜스 인더스트리즈에 현금 42억 달러 규모의 인수를 제안했습니다. 이 영국 복합 기업은 UD의 브래들리, 팔라딘, AAV 생산을 새로운 지상·무장 사업부로 통합하여 미국 지상 전투 시장에 영구적인 발판을 마련하려 합니다. 국방부는 전략적 파급 효과를 검토하고 있으며 법무부는 반독점 심사를 준비 중입니다."
 USA_econ_event.30.a: "인수를 승인한다"
 USA_econ_event.30.b: "법무부 반독점 심사를 명령한다"
 department_of_state.9.a: "지역 안정을 위한 필요한 조치다"
 department_of_state.9.b: "주권 국가에 대한 또 한 번의 서방 침략이다"
 department_of_state.38001.t: "RUSFOR 아래 안정을 찾은 러시아"
 department_of_state.38001.d: "소련 붕괴가 공식화되고 RUSFOR의 권위가 확립되면서, 러시아는 전환기의 혼란을 딛고 서방과 보조를 맞추는 통일 국가로 거듭납니다. 옛 소련의 영유권 주장은 러시아 연방으로 이전되고, 모스크바는 NATO의 영향권에 받아들여집니다. 앞길은 멀지만 민주주의 러시아는 이제 손이 닿는 곳에 있습니다."
 department_of_state.38001.a: "새로운 장이 시작된다"
 USA_sale_of_additional_kee_lung_destroyers: "[TAI.GetFlag] 지룽급 구축함 판매 확대"
 USA_sale_of_additional_kee_lung_destroyers_desc: "[CHI.GetNameWithFlag]이(가) 해협 건너편에서 무력 시위를 벌이는 가운데, [TAI.GetNameWithFlag]이(가) 침공을 억제하려면 원래의 지룽급 선체 4척 이상이 필요합니다. 우리는 개장된 구축함 2차분을 제안하고 자국 조선소의 확장을 돕겠으며, 이를 통해 중화민국 해군을 그 자체로 진정한 지역 위협으로 키울 것입니다."
 USA_chi_aggression_or_tension_tt: "[CHI.GetFlag] §H[CHI.GetName]§!이(가) 공격적으로 행동하고 있음: §R20% 이상의 세계 긴장도§!를 발생시켰거나, [TAI.GetFlag] §H[TAI.GetName]§!과(와) 전쟁 중이거나, 세력을 이끌고 공공연한 전쟁을 벌이는 중"
 USA_demand_japanese_article_9_interpretation: "[JAP.GetFlag] 헌법 제9조 재해석 요구"
 USA_demand_japanese_article_9_interpretation_desc: "[JAP.GetFlag] 일본은 해외에서의 의미 있는 군사 행동을 금지하는 헌법으로 스스로 손발을 묶었습니다. 우리는 도쿄가 제9조를 재해석하고 [CHI.GetFlag] 중국이 제기하는 위협에 걸맞은 방위 태세를 갖추도록 압박할 것입니다. 유능한 일본은 바로 태평양이 필요로 하는 것입니다."
 USA_nato_ukraine_accept_TT: "NATO 동맹국들이 [UKR.GetFlag] §H[UKR.GetName]§!과(와)의 §H군사 협력§!을 심화하고 우크라이나 전쟁 수행에 §H무기와 차량§!을 지원합니다"
 USA_maximum_pressure_dprk: "[NKO.GetFlag] 최대 압박"
 USA_maximum_pressure_dprk_desc: "꼬마 로켓맨은 핵 도발로 너무 오랫동안 우리의 인내심을 시험해 왔습니다. 우리는 가진 모든 것으로 그들을 압박한 다음, 일생일대의 거래를 제안할 것입니다. 그들이 그것을 받아들일 만큼 영리하다면 역사상 가장 위대한 거래를 이룰 것입니다. 그렇지 않다면, 글쎄요, 그들은 그러지 않은 것을 후회하게 될 것입니다."
 USA_maximum_pressure_dprk_TT: "[NKO.GetFlag] §H[NKO.GetName]§!에 §R치명적인 제재§!와 직접적인 정상회담 제안을 결합한 §R최대 압박§! 최후통첩을 보냅니다\n\n이 행동의 전략적 중요성:\n - [NKO.GetFlag] §H[NKO.GetName]§!을(를) 경제적으로 압박하면 협상 테이블로 나오게 하고 그들의 §R핵 야망§!을 제한할 수 있습니다.\n - [NKO.GetLeader]이(가) 거래를 받아들이면 우리는 총 한 발 쏘지 않고 비핵화를 달성합니다."
 USA_withdraw_from_jcpoa: "[PER.GetFlag] 이란 핵 합의 파기"
 USA_withdraw_from_jcpoa_desc: "이란 핵 합의는 지금까지 협상된 것 중 최악의 거래였습니다. 이란인들은 이 수치스러운 합의 뒤에 숨어 테러를 계속 후원하고 탄도 미사일을 개발해 왔습니다. 우리는 탈퇴하며, 역사상 가장 강력한 제재가 그들에게 가해질 것입니다."
 USA_withdraw_jcpoa_TT: "We will withdraw from the [PER.GetFlag] §HIran nuclear deal§! and reimpose §Rmaximum sanctions§! on [PER.GetFlag] §HTehran§!\n\nStrategic Importance Of This Action:\n - Sanctions will cripple [PER.GetFlag] §HPersia's§! oil revenue and §Rslow§! their weapons programs.\n - Our [ENG.GetFlag] [FRA.GetFlag] [GER.GetFlag] §HEuropean allies§! will object, but the deal handed [PER.GetFlag] §HIran§! too much and demanded too little in return."
 USA_recognition_of_jerusalem: "[ISR.GetFlag] 영원한 수도"
 USA_recognition_of_jerusalem_desc: "1995년에 의회가 예루살렘 대사관법을 통과시켰음에도 수십 년 동안 모든 행정부가 이 문제를 미뤄 왔습니다. 이제 현실을 인정하고 우리 대사관을 있어야 할 곳으로 옮길 때입니다. 예루살렘은 유대 민족의 영원한 수도이며, 세계는 이를 알아야 합니다."
 USA_recognition_jerusalem_TT: "§H예루살렘§!을 [ISR.GetFlag] §H[ISR.GetName]§!의 수도로 공식 인정하고 우리 §H대사관§!을 이전합니다\n\n이 행동의 전략적 중요성:\n - [ISR.GetFlag] §H이스라엘§!은 상당한 §H외교적 힘§!을 얻고 미국으로부터 군사 지원이 늘어납니다.\n - 아랍 및 이슬람 국가들은 §R부정적으로§! 반응하겠지만, 이 문제에 대한 미국의 결의는 진작 필요했습니다."
 USA_golan_heights_recognition: "[ISR.GetFlag] 골란은 이스라엘 땅이다"
 USA_golan_heights_recognition_desc: "골란 고원은 반세기 넘게 이스라엘의 통제 아래 있었습니다. 이는 이스라엘의 안보에 전략적으로 필수적이며, 솔직히 [SYR.GetName]에 돌려주는 것은 자살 행위일 것입니다. 이제 모른 척하는 것을 그만두고 현실을 공식적으로 인정할 때입니다."
 USA_golan_recognition_TT: "[ISR.GetFlag] §H[ISR.GetName]§!을(를) §H골란 고원§!에 대한 §H주권§! 국가로 공식 인정합니다.\n\n이 조치의 전략적 중요성:\n - [ISR.GetFlag] §H이스라엘§!은 골란 고원에 대한 §H영구 핵심§!을 얻게 되어, 이 영토의 지위를 둘러싼 모든 모호함이 종식됩니다.\n - [SYR.GetFlag] §H[SYR.GetName]§!은(는) 불쾌해하겠지만, 골란 고원은 [ISR.GetFlag] §H이스라엘§!이 결코 포기할 수 없는 핵심적인 방어 완충지대입니다."
 USA_aukus_pact: "[AST.GetFlag] [ENG.GetFlag] AUKUS 협정"
 USA_aukus_pact_desc: "중국의 용이 인도·태평양 전역에서 힘을 과시하고 있으며, 우리 동맹국들은 불안해하고 있습니다. 이제 [AST.GetName] 및 [ENG.GetName]과(와) 새로운 안보 파트너십을 구축하여, 원자력 추진 잠수함 능력을 포함한 우리의 최고 방위 기술을 공유할 때입니다. 베이징이 도발을 원한다면, 우리 세 나라를 모두 상대해야 할 것입니다."
 USA_aukus_accept_TT: "[AST.GetFlag] §H[AST.GetName]§!와(과) [ENG.GetFlag] §H[ENG.GetName]§!이(가) §HAUKUS§! 안보 협정에 가입하여, 공동 §H잠수함 연구 그룹§!이 출범하고 캔버라에 §H해군 원자력 추진 기술§!이 제공됩니다."
 USA_indo_pacific_economic_framework: "인도·태평양 방패"
 USA_indo_pacific_economic_framework_desc: "중국의 경제적 촉수가 인도·태평양의 모든 국가를 휘감고 있습니다. 우리가 우방국들에게 대안을 제시하지 않으면, 그들은 베이징에 순응할 수밖에 없을 것입니다. 인도·태평양 경제 프레임워크가 그 해답이 될 것이며, 미국의 이익을 최우선에 두는 포괄적 파트너십이자 동맹국들이 중국 의존에서 벗어날 수 있는 길입니다."
 USA_ipef_TT: "§H인도·태평양 경제 프레임워크§!를 출범시키고, §H10개 역내 파트너§!에게 손을 내밀어 [CHI.GetFlag] §H[CHI.GetName]§!의 경제적 장악력을 약화시킵니다.\n - 참여하는 파트너 국가는 우리에 대한 관계를 §H+10§! 높이며, 그 시장에서 [CHI.GetFlag] §H중국§!의 영향력이 §R감소§!합니다.\n - §H2년§! 동안 §HIPEF 무역 혜택§! 국가 정신을 얻습니다.\n\n이 조치의 전략적 중요성:\n - [CHI.GetFlag] §H베이징§!의 인도·태평양 경제 지배는 우리의 가장 큰 전략적 과제입니다. 신뢰할 만한 대안을 제시하는 것이 이들 국가가 중국의 영향권에 들어가지 않도록 하는 유일한 방법입니다."
 USA_abraham_accords_expansion: "[ISR.GetFlag] [SAU.GetFlag] 아브라함 협정 확대"
 USA_abraham_accords_expansion_desc: "아브라함 협정은 모두가 불가능하다고 했던 이스라엘과 아랍 세계 사이의 평화를 실현해 냈습니다. 이제 더 많은 국가를 협상 테이블로 끌어들여 한 걸음 더 나아가야 합니다. 사우디가 동참하게 된다면 중동 전체의 판도가 우리에게 유리하게 바뀔 것입니다. 이란은 무슨 일이 일어났는지조차 알지 못할 것입니다."
 USA_abraham_accords_accept_TT: "참여하는 걸프 국가들이 [ISR.GetFlag] §H[ISR.GetName]§!와(과) 관계를 정상화하여, §H중동§!이 우리에게 유리하게 재편됩니다."
 USA_chips_act_diplomacy: "반도체 지원법"
 USA_chips_act_diplomacy_desc: "모든 첨단 기술은 마이크로칩으로 돌아가며, 현재 그 대부분은 [TAI.GetName]과(와) 동아시아에서 생산됩니다. 대만 해협에서 분쟁이 한 번 일어나면 우리 경제 전체가 멈춰 서게 됩니다. 수십억 달러를 투자하여 반도체 생산을 본국으로 되돌리고, 동맹국들도 자국 내에 공장을 짓도록 하겠습니다."
 USA_chips_act_TT: "본국에 §H반도체 공장§!을 건설하기 위해 투자하며, [TAI.GetFlag] §H[TAI.GetName]§!, [KOR.GetFlag] §H[KOR.GetName]§!, [JAP.GetFlag] §H[JAP.GetName]§!이(가) 자체 공장을 건설하도록 초청합니다.\n - §H5년§! 동안 §H반도체 지원법§! 국가 정신을 얻습니다.\n - [TAI.GetFlag] §H[TAI.GetName]§! 내 [CHI.GetFlag] §H중국§!의 영향력이 §H5%§! §R감소§!합니다.\n\n이 조치의 전략적 중요성:\n - [CHI.GetFlag] §H베이징§!을 반도체 공급망에서 배제하는 것은 우리의 장기적인 기술적·군사적 우위를 유지하기 위해 취할 수 있는 가장 중요한 단일 조치입니다."
 USA_return_to_paris_agreement: "파리로 복귀"
 USA_return_to_paris_agreement_desc: "미국이 파리 기후 협정에서 빠져 있었던 것은 수치스러운 일이었습니다. 약간의 자존심을 접더라도, 우리가 돌아왔으며 기후 문제에서 앞장설 준비가 되어 있음을 세계에 알려야 합니다. 유럽의 우방국들은 크게 반길 것이며, 그렇게 얻은 호의는 충분한 가치가 있습니다."
 USA_paris_agreement_TT: "§H파리 기후 협정§!에 재가입하여 모든 §HEU§! 회원국과의 §H관계 +10§!을 회복하고 §H안정도 +2%§!를 얻습니다.\n\n이 조치의 전략적 중요성:\n - 재가입은 [ENG.GetFlag] [FRA.GetFlag] [GER.GetFlag] §H유럽 동맹국§!들에게 미국이 국제 무대에 돌아왔음을 알리는 신호입니다.\n - 이를 통해 얻는 호의는 재서명에 따른 상징적 비용을 훨씬 능가합니다."
 USA_support_taiwan_defense: "[TAI.GetFlag] 섬에 무장을"
 USA_support_taiwan_defense_desc: "중국군은 나날이 대담해지고 있으며, 해협 너머로 전투기를 보내 우리의 의지를 시험하고 있습니다. [TAI.GetName]은(는) 스스로를 방어할 수단이 필요하며, 우리는 어떠한 침략도 용납할 수 없는 대가를 치르게 될 것임을 베이징이 분명히 깨닫도록 해야 합니다. 대규모 무기 패키지가 그 메시지를 뚜렷하게 전달할 것입니다."
 USA_taiwan_defense_TT: "[TAI.GetFlag] §H[TAI.GetName]§!에 대규모 무기 패키지로 §H보병 장비 3,000정§!과 §H다목적 차량 400대§!를 보냅니다.\n - [CHI.GetFlag] §H[CHI.GetName]§!에 통보되며 대응할 수 있습니다.\n - [TAI.GetFlag] §H[TAI.GetName]§!이(가) 수락하면 양국 관계가 §G+15§! 개선됩니다.\n\n이 조치의 전략적 중요성:\n - [TAI.GetFlag] §H대만§!에 보내는 무기 상자 하나하나가 [CHI.GetFlag] §H베이징§!이 해협 건너 군사 모험에 대해 치러야 할 대가를 높입니다."
 USA_freedom_of_navigation_scs: "[CHI.GetFlag] 그들의 앞마당을 항해하다"
 USA_freedom_of_navigation_scs_desc: "중국은 마치 남중국해 전체가 자기들 것인 양 섬을 만들고 그 위에 미사일을 배치해 왔습니다. 우리가 알기로 공해는 모두의 것입니다. 우리 해군은 국제법이 허용하는 모든 곳을 항해할 것이며, [CHI.GetName]이(가) 이를 마음에 들어 하지 않는다면 제7함대와 직접 따져 보면 될 것입니다."
 USA_fon_scs_TT: "남중국해에서 §H항행의 자유§! 작전을 수행하여 [CHI.GetFlag] §H[CHI.GetName]§!에 직접적인 메시지를 보냅니다.\n - [PHI.GetFlag] §H[PHI.GetName]§!, [VIE.GetFlag] §H[VIE.GetName]§!, [MAY.GetFlag] §H[MAY.GetName]§!은(는) 각각 우리에 대한 관계가 §G+5§! 상승합니다.\n - 우리의 §H전쟁 지지도§!가 §G3%§! 증가합니다.\n\n이 조치의 전략적 중요성:\n - [CHI.GetFlag] §H베이징§!이 공해를 자국의 것이라 주장하도록 내버려 둘 수는 없습니다. 항해하며 통과하는 것이 한 발의 총성도 없이 이를 분명히 하는 방법입니다."
 USA_thaad_deployment_korea: "[KOR.GetFlag] [NKO.GetFlag] 방패를 배치하라"
 USA_thaad_deployment_korea_desc: "[NKO.GetName]의 미사일 프로그램은 달이 갈수록 위험해지고 있으며, [KOR.GetName]에 있는 우리 동맹국은 바로 그 사정권 안에 놓여 있습니다. THAAD는 탄도 미사일 공격에 맞설 기회를 제공할 것이나, 중국은 레이더가 자국 영토까지 미친다며 격하게 반발할 것입니다. 우리가 신경 쓸 문제는 아닙니다."
 USA_thaad_accept_TT: "[KOR.GetFlag] §H[KOR.GetName]§!이(가) §HTHAAD§! 미사일 방어 체계를 수령하여, [NKO.GetFlag] §H[NKO.GetName]§!의 미사일에 맞설 실질적인 방패를 갖추게 됩니다."
 USA_quad_security_dialogue: "[JAP.GetFlag] [RAJ.GetFlag] [AST.GetFlag] 쿼드 동맹"
 USA_quad_security_dialogue_desc: "중국은 인도·태평양에서 위협으로 패권을 쥘 수 있다고 생각하지만, 미국, [JAP.GetName], [RAJ.GetName], [AST.GetName]이(가) 합쳐진 힘은 헤아리지 못했습니다. 쿼드를 공식화하면 베이징조차 무시할 수 없는 민주주의 세력의 장벽이 만들어질 것입니다."
 USA_quad_accept_TT: "[JAP.GetFlag] §H[JAP.GetName]§!, [RAJ.GetFlag] §H[RAJ.GetName]§!, [AST.GetFlag] §H[AST.GetName]§!이(가) §H쿼드§! 안보 파트너십의 공식화에 합의했습니다."
 USA_philippine_defense_cooperation: "[PHI.GetFlag] 필리핀 동맹 강화"
 USA_philippine_defense_cooperation_desc: "필리핀은 남중국해 대치의 최전선에 있으며, 그 군대는 대대적인 개선이 필요합니다. 강화된 방위협력협정을 확대하면 우리는 핵심적인 기지 접근권을 얻고, [PHI.GetFlag] 마닐라는 [CHI.GetFlag] 중국의 강압에 맞설 화력과 훈련을 얻게 됩니다. 필리핀에 있는 미군 기지 하나하나가 [CHI.GetFlag] 중국의 해양 지배에 박히는 못입니다."
 USA_phi_edca_accept_TT: "[PHI.GetFlag] §H[PHI.GetName]§!이(가) §H방위 협력§!을 확대하여, 우리에게 기지 접근권을 부여하고 그 대가로 §H군 장비§!를 받습니다."
 USA_phi_edca_reject_TT: "[PHI.GetFlag] §H[PHI.GetName]§!이(가) §H방위 협력§! 확대를 거절했습니다."
 USA_support_korean_reunification_talks: "[KOR.GetFlag] [NKO.GetFlag] 한반도를 잇는 다리"
 USA_support_korean_reunification_talks_desc: "한반도는 1953년 이래 언제 터질지 모르는 화약고였으며, 단 한 번의 오판이 [USA.GetFlag] 미국을 아무도 준비되지 않은 전쟁으로 끌어들일 수 있습니다. [KOR.GetFlag] 서울과 [NKO.GetFlag] 평양 사이에 제한적인 대화나마 중재할 수 있다면, 우리 동맹국을 겨냥한 미사일은 줄어들고 외교가 작동할 여지는 넓어질 것입니다. 승산이 낮은 시도이지만, 주도권은 우리에게 있습니다."
 USA_korea_talks_accept_TT: "[KOR.GetFlag] §H[KOR.GetName]§!과(와) [NKO.GetFlag] §H[NKO.GetName]§!이(가) §H미국이 중재하는 대화§!에 참여하여, 한반도의 긴장이 완화됩니다."
 USA_intervene_yemen_civil_war: "[YEM.GetFlag] 후티를 분쇄하라"
 USA_intervene_yemen_civil_war_desc: "이란의 지원을 받는 후티 반군이 [YEM.GetName]을(를) 갈가리 찢어놓고 있으며, 우리 경제가 의존하는 핵심 해상 교통로를 위협하고 있습니다. 테헤란의 대리 세력이 동맹국의 뒷마당에서 날뛰는 것을 가만히 지켜볼 수는 없습니다. 합법 정부를 무장시키고 후티에게 상대를 잘못 골랐음을 보여줄 때입니다."
 USA_yemen_intervention_TT: "§R후티§! 반군과 싸우도록 [YEM.GetFlag] §H[YEM.GetName]§!에 §H보병 장비 3,000정§!과 §H다목적 차량 400대§!를 보냅니다.\n - [YEM.GetFlag] §H[YEM.GetName]§!에 대한 우리의 §H영향력§!이 §G5%§! 증가합니다.\n - [SAU.GetFlag] §H사우디아라비아§!가 [HOU.GetFlag] §H후티§! 세력과 교전 중이라면 마찬가지로 군사 지원을 받습니다.\n\n이 조치의 전략적 중요성:\n - [PER.GetFlag] §H이란§!의 대리 세력이 [YEM.GetFlag] §H예멘§!의 해안선을 장악하고 우리 경제가 의존하는 해상 교통로를 차단하도록 내버려 둘 수 없습니다."
 USA_intervene_mali_insurgency: "[MAL.GetFlag] 사헬의 불길을 잡아라"
 USA_intervene_mali_insurgency_desc: "[MAL.GetName]의 지하디스트 전투원들이 사헬 전역으로 들불처럼 번지고 있으며, 지금 개입하지 않으면 지역 전체가 불길에 휩싸일 것입니다. 프랑스는 너무 오랫동안 이 부담을 짊어져 왔습니다. 러시아와 중국이 그 공백을 메우려 들어오기 전에 미국이 직접 발을 담글 때입니다."
 USA_mali_intervention_TT: "§R지하디스트 반군§!에 대응하도록 [MAL.GetFlag] §H[MAL.GetName]§!에 §H보병 장비 2,000정§!과 §H다목적 차량 200대§!를 보냅니다.\n - [MAL.GetFlag] §H[MAL.GetName]§!에 대한 우리의 §H영향력§!이 §G5%§! 증가합니다.\n\n이 조치의 전략적 중요성:\n - 사헬이 지하디스트의 손에 넘어가면 [SOV.GetFlag] §H러시아§! 용병과 [CHI.GetFlag] §H중국§! 계약업체가 그 공백을 메울 것입니다. 그 기회의 창이 닫히기 전에 미국의 무기가 우리의 입지를 유지해 줍니다."
 USA_intervene_nigeria_boko_haram: "[NIG.GetFlag] 보코 하람 사냥"
 USA_intervene_nigeria_boko_haram_desc: "보코 하람은 [NIG.GetName] 북동부를 전쟁터로 만들었으며, 민간인을 학살하고 아프리카에서 가장 인구가 많은 국가를 불안정하게 만들고 있습니다. 대륙 최대 규모의 경제가 혼란에 빠지도록 내버려 둘 수는 없습니다. 미국의 군사 지원과 정보가 나이지리아군이 이 테러리스트들을 완전히 소탕하는 데 도움이 될 것입니다."
 USA_nigeria_intervention_TT: "§H보코 하람§!을 소탕하도록 [NIG.GetFlag] §H[NIG.GetName]§!에 §H보병 장비 2,000정§!, §H다목적 차량 200대§!, §H정보 지원§!을 보냅니다.\n - [NIG.GetFlag] §H[NIG.GetName]§!에 대한 우리의 §H영향력§!이 §G5%§! 증가합니다.\n\n이 조치의 전략적 중요성:\n - [NIG.GetFlag] §H나이지리아§!는 아프리카 최대의 경제입니다. 나이지리아가 혼란에 빠지도록 내버려 두면 [CHI.GetFlag] §H중국§!과 [SOV.GetFlag] §H러시아§!에 대륙에서의 엄청난 전략적 기회를 넘겨주는 셈이 됩니다."
 USA_stabilize_haiti: "[HAI.GetFlag] 아이티를 스스로로부터 구하라"
 USA_stabilize_haiti_desc: "[HAI.GetName]은(는) 우리의 바로 앞마당에서 총체적 붕괴로 치닫고 있습니다. 갱단이 거리를 장악하고, 정부는 거의 작동하지 않으며, 수천 명이 배를 타고 탈출하고 있습니다. 우리는 전에도 이 일을 해 보았고 다시 할 것입니다. 이 나라를 다시 일으켜 세울 수 있는 것은 미국의 지상군뿐입니다."
 USA_haiti_stabilization_TT: "질서를 회복하기 위해 [HAI.GetFlag] §H[HAI.GetName]§!에 병력을 파견하며, §H보병 장비 1,500정§!과 §H다목적 차량 150대§!를 보냅니다.\n - [HAI.GetFlag] §H[HAI.GetName]§!에 대한 우리의 §H영향력§!이 §G10%§! 증가합니다.\n\n이 조치의 전략적 중요성:\n - [HAI.GetFlag] §H아이티§!는 우리 해안에서 90마일 떨어진 곳에서 붕괴하고 있습니다. 그곳의 불안정은 난민 유입, 갱단 네트워크, 그리고 바로 우리 앞마당에서의 [CHI.GetFlag] §H중국§!의 기회주의를 의미합니다."
 USA_counter_narcotics_central_america: "카르텔과의 전쟁"
 USA_counter_narcotics_central_america_desc: "카르텔은 중앙아메리카를 미국 도시로 마약을 퍼 나르는 자기들만의 고속도로로 만들어 버렸습니다. 우리 거리의 과다복용 사망은 모두 이 범죄 조직으로 거슬러 올라갈 수 있습니다. 중앙아메리카 파트너들과의 협조된 마약 단속 작전이 공급을 원천에서 차단할 것입니다."
 USA_counter_narcotics_TT: "중앙아메리카 전역에서 §H마약 단속 작전§!을 개시하여, §H6개국§!에 대한 우리의 §H영향력§!을 각각 §G3%§! 높입니다.\n\n이 조치의 전략적 중요성:\n - 원천에서 차단된 마약 1킬로그램마다 미국 도시의 사망자가 한 명씩 줄어듭니다. 이 작전은 카르텔의 가장 약한 고리인 공급망을 타격합니다."
 USA_caribbean_investment_initiative: "[CHI.GetFlag] 카리브해의 달러"
 USA_caribbean_investment_initiative_desc: "중국은 일대일로 자금을 앞세워 우리 동네에까지 기어들어 와 항구와 다리를 건설하며 섬 하나씩 영향력을 사들이고 있습니다. 카리브해는 언제나 우리의 세력권이었으며, 베이징이 활개 치며 들어와 이를 바꾸도록 내버려 둘 생각은 없습니다. 이제 미국의 달러가 남쪽으로 흐르기 시작해야 합니다."
 USA_caribbean_investment_TT: "§H카리브해 6개국§!에 투자하여 각국 수도에 §H인프라§!를 건설하고, 국가마다 [CHI.GetFlag] §H중국§!의 영향력을 §R3%§! 밀어냅니다.\n - 각국에 대한 우리의 §H영향력§!이 §G5%§! 증가합니다.\n\n이 조치의 전략적 중요성:\n - [CHI.GetFlag] §H베이징§!은 일대일로 자금으로 카리브해를 사들여 왔습니다. 이곳에 대한 미국의 투자는 분명한 메시지를 보냅니다. 이곳은 우리의 앞마당이라는 것입니다."
 USA_invest_in_canada: "[CAN.GetFlag] 북미 통합"
 USA_invest_in_canada_desc: "[CAN.GetName]은(는) 우리의 가장 가까운 동맹이자 최대 무역 상대이며, 지금 양국 모두 적대적인 공급망에 지나치게 의존하고 있습니다. 특히 반도체와 핵심 광물 분야에서 경제적 유대를 심화하면, 누구도 뚫을 수 없는 북미 경제의 요새를 구축할 수 있을 것입니다."
 USA_canada_invest_accept_TT: "[CAN.GetFlag] §H[CAN.GetName]§!이(가) 투자 패키지를 수락하여, §H반도체 공장§!이 건설되고 우리의 §H경제적 유대§!가 깊어집니다."
 USA_canada_invest_reject_TT: "[CAN.GetFlag] §H[CAN.GetName]§!이(가) 우리의 투자 패키지를 거절했습니다."
 USA_west_africa_development_initiative: "[CHI.GetFlag] 서아프리카를 얻어라"
 USA_west_africa_development_initiative_desc: "서아프리카는 우리, 중국, 러시아 사이의 삼자 줄다리기 무대가 되었습니다. 베이징은 부채의 덫이 된 대출을, 모스크바는 용병을 내놓으며, 어느 쪽이든 고통받는 것은 민중입니다. 우리는 더 나은 것을 제시해야 합니다. 독재자와의 부당한 조건이 딸려 오지 않는 진정한 투자, 진정한 인프라, 진정한 파트너십 말입니다."
 USA_west_africa_development_TT: "§H서아프리카 5개국§!에 투자하여 각국 수도에 §H인프라§!를 건설하고 외국 경쟁자들을 밀어냅니다.\n - 각국에 대한 우리의 §H영향력§!이 §G5%§! 증가합니다.\n - 각국에서 [CHI.GetFlag] §H중국§!의 영향력은 §R5%§!, [SOV.GetFlag] §H러시아§!의 영향력은 §R3%§! 감소합니다.\n\n이 조치의 전략적 중요성:\n - 서아프리카는 강대국 경쟁의 다음 전선입니다. [CHI.GetFlag] §H베이징§!은 부채의 덫을, [SOV.GetFlag] §H모스크바§!는 용병을 가져옵니다. 우리는 더 나은 것을 제시해야 합니다."
 USA_pacific_islands_compact: "[CHI.GetFlag] 태평양을 지켜라"
 USA_pacific_islands_compact_desc: "태평양 도서국들은 자유연합협정을 통해 수십 년간 우리의 파트너였지만, 중국이 두둑한 수표책과 거창한 약속을 들고 나타나고 있습니다. 우리의 약속을 갱신하지 않으면, 어느 날 아침 태평양 곳곳에 중국군 기지가 흩어져 있는 것을 보게 될 것입니다. 우리가 지켜보는 한 그런 일은 없을 것입니다."
 USA_pacific_islands_TT: "§H태평양 도서국 5개국§!과의 §H자유연합협정§!을 갱신하여, 오세아니아에서 [CHI.GetFlag] §H중국§!의 영향력을 차단합니다.\n - 각국에 대한 우리의 §H영향력§!이 §G5%§! 증가합니다.\n - 각국에서 [CHI.GetFlag] §H중국§!의 영향력이 §R3%§! 감소합니다.\n\n이 조치의 전략적 중요성:\n - 태평양은 우리의 전략적 호수입니다. [CHI.GetFlag] §H베이징§!이 그곳에 기지를 건설한다면, 인도·태평양 전역에 힘을 투사하는 우리의 능력은 끝장입니다."
 USA_african_growth_opportunity_act: "[CHI.GetFlag] 아프리카 시장을 열다"
 USA_african_growth_opportunity_act_desc: "아프리카 성장기회법은 아프리카 국가들에게 지구상에서 가장 부유한 시장, 바로 우리 시장에 대한 우선 접근권을 부여합니다. 이 프로그램을 확대하면 대서양 양안에서 일자리가 창출되고, 깨알 같은 조건이 달린 어떤 중국 대출보다도 오래갈 무역 관계가 구축됩니다. 현명한 외교는 현명한 경제에서 시작됩니다."
 USA_agoa_TT: "자격을 갖춘 아프리카 국가들에 §HAGOA§! 무역 특혜를 확대하여, 해당 국가마다 우리의 §H영향력§!을 §G3%§! 높이고 [CHI.GetFlag] §H중국§!의 영향력을 §R3%§! 줄입니다.\n\n이 조치의 전략적 중요성:\n - 아프리카 경제를 끌어올리는 무역 협정은 깨알 같은 조건이 달린 어떤 [CHI.GetFlag] §H중국§!의 대출보다도 훨씬 오래갑니다. 미국 시장에 접근할 수 있는 국가들은 대안을 찾을 이유가 없습니다."
 USA_IPEF_trade_benefits: "인도·태평양 경제 프레임워크"
 USA_IPEF_trade_benefits_desc: "인도·태평양 경제 프레임워크는 주요 역내 파트너와의 무역 관계와 공급망 협력을 강화하여 경제적 이익을 제공하고 중국과의 무역에 대한 의존도를 줄입니다."
 USA_chips_act: "반도체 및 과학법"
 USA_chips_act_desc: "반도체 및 과학법은 국내 반도체 제조에 수십억 달러를 투자하여 생산 효율을 높이고 첨단 제조 시설의 건설을 가속화했습니다."
 USA_thaad_defense: "THAAD 미사일 방어"
 USA_thaad_defense_desc: "종말 고고도 지역방어 체계는 고도화된 탄도 미사일 방어 능력을 제공하여 대공 방어와 전반적인 군사 대비 태세를 크게 향상시킵니다."
 USA_caribbean_development: "카리브해 개발 원조"
 USA_caribbean_development_desc: "카리브해에 대한 미국의 지속적인 투자 프로그램으로, 인프라를 건설하고 역내 파트너와의 유대를 강화하여 [CHI.GetFlag] 중국의 영향력이 우리 앞마당에 들어오지 못하게 합니다."
 USA_west_africa_development: "서아프리카 개발 원조"
 USA_west_africa_development_desc: "서아프리카 전역에 대한 미국의 지속적인 투자 프로그램으로, 인프라에 자금을 지원하고 무역 파트너십을 구축하여 [CHI.GetFlag] 중국의 부채의 덫과 [SOV.GetFlag] 러시아 용병에 대한 믿을 만한 대안이 됩니다."
 department_of_state.100.t: "AUKUS 제안"
 department_of_state.100.d: "미국이 AUKUS라는 3자 안보 파트너십에 대한 획기적인 제안을 해 왔습니다. 이 협정은 인도·태평양 지역의 커져가는 위협에 대응하기 위해 원자력 추진 잠수함 능력을 포함한 첨단 방위 기술을 공유하는 내용을 담고 있습니다."
 department_of_state.100.a: "이 역사적인 파트너십을 수락합니다."
 department_of_state.100.b: "현시점에서는 정중히 거절해야 합니다."
 department_of_state.101.t: "AUKUS 동맹 결성"
 department_of_state.101.d: "미국, 오스트레일리아, 영국이 AUKUS로 알려진 새로운 3자 안보 파트너십을 발표했습니다. 이 협정에 따라 인도·태평양의 안보를 유지하기 위해 첨단 방위 기술과 원자력 추진 잠수함 능력이 공유됩니다."
 department_of_state.101.a: "협력의 새로운 시대입니다."
 department_of_state.102.t: "인도·태평양 경제 프레임워크"
 department_of_state.102.d: "미국이 우리를 인도·태평양 경제 프레임워크에 초청했습니다. 이는 공급망을 강화하고, 청정 에너지를 촉진하며, 역내 중국의 경제적 영향력에 대응하기 위해 고안된 새로운 다자 구상입니다."
 department_of_state.102.a: "프레임워크에 참여하겠습니다."
 department_of_state.102.b: "현재의 체제를 유지하겠습니다."
 department_of_state.103.t: "IPEF 파트너십 결과"
 department_of_state.103.d: "인도·태평양 전역의 국가들이 인도·태평양 경제 프레임워크 참여 초청에 응답했습니다."
 department_of_state.103.a: "확인했습니다."
 department_of_state.104.t: "아브라함 협정 확대"
 department_of_state.104.d: "미국이 아브라함 협정을 확대하기 위해 노력하고 있으며, 우리나라가 이스라엘과 관계를 정상화할 것을 제안했습니다. 이는 지역 역학 관계의 역사적인 전환을 의미하며 새로운 경제적, 외교적 기회를 열어줄 것입니다."
 department_of_state.104.a: "이스라엘과 관계를 정상화하겠습니다."
 department_of_state.104.b: "정상화에 나서기에는 시기상조입니다."
 department_of_state.105.t: "아브라함 협정 진전"
 department_of_state.105.d: "미국이 확대된 아브라함 협정의 틀 안에서 추가적인 관계 정상화 합의를 성공적으로 중재했습니다."
 department_of_state.105.a: "훌륭한 소식입니다."
 department_of_state.106.t: "아브라함 협정 확대됨"
 department_of_state.106.d: "역사적인 아브라함 협정의 틀이 확대되어 더 많은 아랍 국가가 이스라엘과 관계를 정상화하게 되었으며, 이는 중동의 지정학적 지형을 재편하고 있습니다."
 department_of_state.106.a: "지역 외교의 새로운 장입니다."
 department_of_state.107.t: "반도체 지원법 파트너십"
 department_of_state.107.d: "미국이 우리를 반도체 및 과학법 구상에 참여하도록 초청하여, 세계 반도체 공급망을 다변화하려는 더 넓은 노력의 일환으로 우리 영토에 반도체 제조 시설을 건설하도록 인센티브를 제안했습니다."
 department_of_state.107.a: "이 투자를 환영합니다."
 department_of_state.107.b: "이 제안은 거절해야 합니다."
 department_of_state.108.t: "반도체 지원법 투자"
 department_of_state.108.d: "미국이 반도체 및 과학법에 따라 대규모 반도체 투자 구상을 개시하여, 국내에 새로운 반도체 제조 시설을 건설하고 동맹국과 협력하여 세계 반도체 공급망을 다변화하고 있습니다."
 department_of_state.108.a: "반도체 경쟁이 시작되었습니다."
 department_of_state.109.t: "미국, 파리 협정에 재가입"
 department_of_state.109.d: "미국이 파리 기후 협정에 공식적으로 재가입하여, 국제 기후 협력과 다자 외교에 대한 새로운 의지를 보여주었습니다."
 department_of_state.109.a: "다시 협상 테이블로 돌아온 것을 환영합니다."
 department_of_state.110.t: "미국의 무기 패키지"
 department_of_state.110.d: "미국이 잠재적 침략에 맞서 우리의 방어 능력을 강화할 수 있도록 상당한 규모의 무기 패키지를 제안했습니다. 이 거래에는 첨단 무기 체계와 군 장비가 포함되어 있습니다."
 department_of_state.110.a: "감사히 수락합니다."
 department_of_state.111.t: "미국의 대만 무기 판매"
 department_of_state.111.d: "미국이 대만에 대한 대규모 무기 판매를 발표했으며, 이는 우리 주권에 대한 노골적인 침해이자 내정 간섭입니다. 이러한 도발에는 강력한 대응이 필요합니다."
 department_of_state.111.a: "공식 외교 항의를 제기한다."
 department_of_state.111.b: "이는 확전이 필요한 침략 행위이다."
 department_of_state.112.t: "미국, 대만에 무기 제공"
 department_of_state.112.d: "미국이 대만 해협의 긴장이 고조되는 가운데 섬의 방어를 강화하기 위해 첨단 군 장비를 제공하는 대규모 무기 패키지를 승인했습니다."
 department_of_state.112.a: "힘의 균형이 변화합니다."
 department_of_state.115.t: "미국의 정상회담 제안"
 department_of_state.115.d: "미국 대통령이 우리 최고지도자와의 전례 없는 직접 정상회담을 제안했습니다. 최대 압박 정책이 우리 경제에 타격을 입혔지만, 이는 국제적 정당성을 얻고 제재 완화를 확보할 기회가 될 수 있습니다."
 department_of_state.115.a: "정상회담에 응하겠습니다."
 department_of_state.115.b: "미국의 침략에 정당성을 부여하지 않겠습니다."
 department_of_state.116.t: "역사적인 미국-북한 정상회담"
 department_of_state.116.d: "역사상 처음으로 미국과 북한의 지도자가 얼굴을 마주하고 외교 회담을 가져, 수십 년간 이어진 한반도 대치 상황에서 전례 없는 순간을 맞았습니다."
 department_of_state.116.a: "주목할 만한 진전입니다."
 department_of_state.117.t: "JCPOA 탈퇴"
 department_of_state.117.d: "미국이 포괄적 공동행동계획에서 일방적으로 탈퇴하고 우리나라에 대한 최대 수준의 경제 제재를 재개할 것입니다. 이는 국제 합의에 대한 배신입니다."
 department_of_state.117.a: "이 침략에 대한 응답은 반드시 있을 것이다."
 department_of_state.118.t: "미국의 JCPOA 탈퇴"
 department_of_state.118.d: "미국이 이란 핵 합의에서 탈퇴했으며, 이는 수년간의 신중한 다자 외교를 훼손하는 결정입니다. 우리의 외교 채널은 이제 방향을 재조정해야 합니다."
 department_of_state.118.a: "유감스러운 결정입니다."
 department_of_state.119.t: "미국, 이란 핵 합의 탈퇴"
 department_of_state.119.d: "미국이 포괄적 공동행동계획 탈퇴를 발표하고 이란에 대한 최대 수준의 경제 제재를 재개했으며, 합의를 계속 지지하는 유럽 동맹국들과의 관계가 긴장되고 있습니다."
 department_of_state.119.a: "외교가 타격을 입었습니다."
 department_of_state.120.t: "예루살렘, 수도로 인정"
 department_of_state.120.d: "미국이 예루살렘을 이스라엘의 수도로 공식 인정하고 대사관 이전 계획을 발표했습니다. 이 역사적인 결정은 양국 간 유대에 대한 엄청난 확인입니다."
 department_of_state.120.a: "이스라엘에게 뜻깊은 날입니다."
 department_of_state.121.t: "미국, 예루살렘 인정"
 department_of_state.121.d: "미국이 예루살렘을 이스라엘의 수도로 공식 인정하여 수십 년간의 외교적 관례를 깨뜨렸으며, 아랍 및 이슬람 세계 전역에서 격렬한 비난을 불러일으켰습니다."
 department_of_state.121.a: "논란의 여지가 있는 결정입니다."
 department_of_state.124.t: "미국, 골란 고원 인정"
 department_of_state.124.d: "미국이 1967년 전쟁에서 시리아로부터 점령한 영토인 골란 고원에 대한 이스라엘의 주권을 공식 인정했습니다. 이 결정은 미국의 중동 정책에서 또 하나의 전환을 의미합니다."
 department_of_state.124.a: "확인했습니다."
 department_of_state.125.t: "미국의 해상 도발"
 department_of_state.125.d: "미 해군이 남중국해에서 우리가 중국의 주권 영토라고 주장하는 해역을 통과하는 이른바 \\"항행의 자유\\" 작전을 수행했습니다. 이 노골적인 도발은 우리의 정당한 해양 영유권 주장에 도전하는 것이며 대응이 필요합니다."
 department_of_state.125.a: "외교 항의를 제기한다."
 department_of_state.125.b: "해군 병력을 긴급 출동시켜 차단한다."
 department_of_state.126.t: "남중국해의 항행의 자유"
 department_of_state.126.d: "미 해군이 남중국해에서 항행의 자유 작전을 수행하여, 중국의 영유권 주장에 도전하고 역내 동맹국들에게 열린 항로에 대한 미국의 의지를 재확인시켰습니다."
 department_of_state.126.a: "공해는 자유로워야 합니다."
 department_of_state.127.t: "THAAD 배치 제안"
 department_of_state.127.d: "미국이 커져가는 북한의 탄도 미사일 위협에 대응하기 위해 종말 고고도 지역방어 미사일 체계를 우리 영토에 배치하자고 제안했습니다. 이는 우리의 방어 능력을 크게 향상시키겠지만, 중국은 우리가 수락할 경우 심각한 결과가 따를 것이라고 경고했습니다."
 department_of_state.127.a: "우리의 안보를 위해 수락해야 합니다."
 department_of_state.127.b: "외교적 대가가 너무 큽니다."
 department_of_state.129.t: "THAAD, 한국에 배치"
 department_of_state.129.d: "미국이 THAAD 미사일 방어 체계를 한국에 성공적으로 배치하여 한반도의 동맹 미사일 방어 능력을 크게 향상시켰으며, 중국으로부터 격렬한 비난을 받고 있습니다."
 department_of_state.129.a: "방패가 제자리를 잡았습니다."
 department_of_state.130.t: "미국, 예멘 개입"
 department_of_state.130.d: "미국이 국제적으로 승인된 예멘 정부의 후티 반군에 맞선 싸움에 군사 지원을 하겠다고 발표했으며, 이란의 지원을 받는 세력에 대응하기 위해 장비와 병참 지원을 제공합니다."
 department_of_state.130.a: "안정을 회복해야 합니다."
 department_of_state.131.t: "미국의 군사 지원"
 department_of_state.131.d: "미국이 후티 반군에 맞선 우리의 싸움을 지원하기 위해 상당한 군사 자원을 투입하기로 했습니다. 미국의 무기, 차량, 정보 지원은 전장에서 우리의 입지를 강화할 것입니다."
 department_of_state.131.a: "미국의 지원을 환영합니다."
 department_of_state.132.t: "미국, 반군에 맞선 말리 지원"
 department_of_state.132.d: "미국이 사헬 지역을 위협하는 지하디스트 반군에 대응하는 것을 돕기 위해 말리에 대한 군사 원조 패키지를 발표했습니다."
 department_of_state.132.a: "사헬의 안정은 매우 중요합니다."
 department_of_state.133.t: "미국의 군사 원조"
 department_of_state.133.d: "미국이 우리 군이 지하디스트 반군에 대응하는 것을 돕기 위해 군 장비와 정보 지원을 제공하기로 했습니다. 이 원조는 우리의 능력을 크게 강화할 것입니다."
 department_of_state.133.a: "미국의 지원을 크게 환영합니다."
 department_of_state.134.t: "미국, 보코 하람에 맞선 나이지리아 지원"
 department_of_state.134.d: "미국이 나이지리아 북동부의 테러 조직 보코 하람에 대응하기 위한 포괄적인 군사 원조 패키지를 나이지리아에 제공하겠다고 발표했습니다."
 department_of_state.134.a: "테러와의 싸움은 계속됩니다."
 department_of_state.135.t: "미국의 대테러 지원"
 department_of_state.135.d: "미국이 보코 하람에 맞선 우리의 작전을 강화하기 위해 상당한 군 장비와 정보 지원을 제공했습니다. 이 파트너십은 북동부의 치안을 회복하는 데 도움이 될 것입니다."
 department_of_state.135.a: "함께 이 위협을 물리치겠습니다."
 department_of_state.136.t: "미국, 아이티에 병력 파견"
 department_of_state.136.d: "미국이 정치적 불안정과 폭력으로 붕괴 직전에 이른 아이티에 군 병력과 인도적 지원을 파견하는 것을 승인했습니다."
 department_of_state.136.a: "질서를 회복해야 합니다."
 department_of_state.137.t: "미국의 안정화 병력"
 department_of_state.137.d: "미국이 질서 회복을 돕기 위해 군 병력을 파견하고 인도적 지원을 제공했습니다. 미국의 장비와 지원은 우리 보안군이 상황의 통제권을 되찾는 데 도움이 될 것입니다."
 department_of_state.137.a: "지원을 환영합니다."
 department_of_state.138.t: "미국의 마약 단속 프로그램"
 department_of_state.138.d: "미국이 우리 지역에서 중앙아메리카 전역에 걸쳐 활동하는 마약 밀매 조직망을 와해시키기 위해 훈련, 장비, 정보 지원을 제공하는 협조된 마약 단속 프로그램을 개시했습니다."
 department_of_state.138.a: "환영할 만한 파트너십입니다."
 department_of_state.140.t: "미국의 투자 프로그램"
 department_of_state.140.d: "미국이 카리브해에서 역내 유대를 강화하기 위해 인프라 개발, 경제 원조, 무역 파트너십을 제공하는 대규모 투자 구상을 개시했습니다."
 department_of_state.140.a: "미국의 투자를 환영합니다."
 department_of_state.141.t: "미국의 카리브해 투자 구상"
 department_of_state.141.d: "미국이 카리브해 전역에 걸친 포괄적인 투자 구상을 발표했으며, 역내 파트너십을 강화하고 중국의 영향력에 대응하기 위해 인프라 개발과 경제 프로그램에 자금을 지원합니다."
 department_of_state.141.a: "카리브해에 대한 미국의 관여입니다."
 department_of_state.142.t: "미국의 투자 제안"
 department_of_state.142.d: "미국이 반도체 제조와 핵심 공급망 개발에 대한 자금 지원을 포함하여 우리의 경제 통합을 심화하기 위한 전략적 투자 패키지를 제안했습니다."
 department_of_state.142.a: "이 파트너십을 수락합니다."
 department_of_state.142.b: "독자적인 발전을 추구하겠습니다."
 department_of_state.143.t: "캐나다의 투자 결과"
 department_of_state.143.d: "캐나다가 우리의 투자 제안에 응답했습니다."
 department_of_state.143.a: "확인했습니다."
 department_of_state.144.t: "미국의 개발 프로그램"
 department_of_state.144.d: "미국이 서아프리카에서 성장을 촉진하고 역내 경쟁 세력의 영향력에 대응하기 위해 인프라 투자, 경제 원조, 무역 파트너십을 제공하는 개발 구상을 개시했습니다."
 department_of_state.144.a: "미국의 개발 원조를 환영합니다."
 department_of_state.145.t: "미국의 서아프리카 개발 구상"
 department_of_state.145.d: "미국이 서아프리카 전역에 걸친 대규모 개발 구상을 발표했으며, 파트너십을 강화하고 중국과 러시아의 영향력에 대한 대안을 제시하기 위해 인프라와 경제 프로그램에 투자합니다."
 department_of_state.145.a: "아프리카 개발의 새로운 장입니다."
 department_of_state.146.t: "태평양 도서국 파트너십"
 department_of_state.146.d: "미국이 자유연합협정에 따른 우리의 파트너십을 갱신하고 확대할 것을 제안했으며, 경제 원조와 안보 협력의 증대를 제시했습니다."
 department_of_state.146.a: "미국과의 파트너십을 소중히 여깁니다."
 department_of_state.147.t: "미국, 태평양 도서국 협정 갱신"
 department_of_state.147.d: "미국이 태평양 도서국들과의 자유연합협정을 갱신하고 확대하여, 오세아니아에서 중국의 외교적·경제적 침투에 대응하고 있습니다."
 department_of_state.147.a: "태평양에 대한 미국의 의지입니다."
 department_of_state.148.t: "AGOA 무역 특혜"
 department_of_state.148.d: "미국이 아프리카 성장기회법에 따라 우리나라에 우선 무역 접근권을 제안했으며, 광범위한 품목에 대해 미국 시장에 무관세로 접근할 수 있게 됩니다."
 department_of_state.148.a: "무역 접근권 확대를 환영합니다."
 department_of_state.149.t: "미국, 아프리카 무역 프로그램 확대"
 department_of_state.149.d: "미국이 아프리카 성장기회법을 확대하여 더 많은 아프리카 국가에 우선 무역 접근권을 부여하고 대륙 전역의 경제 발전을 촉진하고 있습니다."
 department_of_state.149.a: "무역은 발전을 촉진합니다."
 department_of_state.150.t: "쿼드 안보 대화 초청"
 department_of_state.150.d: "미국이 우리나라, 미국, 그리고 주요 인도·태평양 파트너 사이의 쿼드(4자 안보 대화)를 공식화할 것을 제안했습니다. 이 파트너십은 공통의 안보 과제에 대한 대응을 조율하고 자유롭고 개방된 인도·태평양을 증진할 것입니다."
 department_of_state.150.a: "쿼드에 참여하겠습니다."
 department_of_state.150.b: "전략적 자율성을 유지하겠습니다."
 department_of_state.151.t: "쿼드 파트너십 수립"
 department_of_state.151.d: "미국, 일본, 인도, 오스트레일리아 간의 쿼드(4자 안보 대화)가 인도·태평양 지역의 핵심 안보 체제로 공식화되었습니다."
 department_of_state.151.a: "새로운 안보 구조가 등장합니다."
 department_of_state.152.t: "강화된 방위 협력 제안"
 department_of_state.152.d: "미국이 커져가는 역내 긴장 속에서 우리의 능력을 강화하기 위해, 군사 원조 증대, 기지 접근 협정, 방위 장비를 제공하는 강화된 방위협력협정의 확대를 제안했습니다."
 department_of_state.152.a: "방위 협력을 확대하겠습니다."
 department_of_state.152.b: "우리의 다른 관계도 고려해야 합니다."
 department_of_state.153.t: "미국-필리핀 방위 협력 확대"
 department_of_state.153.d: "미국과 필리핀이 남중국해의 긴장이 고조되는 가운데 강화된 방위협력협정을 확대하여 군사적 유대를 깊게 하고 동맹을 강화했습니다."
 department_of_state.153.a: "동맹이 깊어집니다."
 department_of_state.154.t: "한반도 통일 대화"
 department_of_state.154.d: "미국이 남북 대화와 통일 회담을 중재할 것을 제안했으며, 한반도 분단의 평화적 해결을 위한 외교적 지원을 제공하겠다고 했습니다."
 department_of_state.154.a: "대화에 열려 있습니다."
 department_of_state.154.b: "회담을 할 여건이 갖추어지지 않았습니다."
 department_of_state.155.t: "미국, 남북 대화 중재"
 department_of_state.155.d: "미국이 남북 대화를 중재하여 서울과 평양 양측 대표를 협상 테이블로 불러, 긴장 완화와 궁극적인 통일로 가는 길을 모색하는 논의를 진행했습니다."
 department_of_state.155.a: "평화를 향한 한 걸음입니다."
 department_of_state.160.t: "[FROM.GetName]이(가) AUKUS 협정을 수락"
 department_of_state.160.d: "[FROM.GetName]이(가) AUKUS 안보 파트너십에 참여하기로 합의하여, 인도·태평양에서의 우리 3자 방위 협력이 강화됩니다."
 department_of_state.160.a: "훌륭합니다."
 department_of_state.161.t: "[FROM.GetName]이(가) IPEF에 참여"
 department_of_state.161.d: "[FROM.GetName]이(가) 인도·태평양 경제 프레임워크에 참여하기로 합의하여, 역내 전역으로 우리의 경제 파트너십이 확대됩니다."
 department_of_state.161.a: "큰 진전입니다"
 department_of_state.162.t: "[FROM.GetName]이(가) 아브라함 협정에 참여"
 department_of_state.162.d: "[FROM.GetName]이(가) 아브라함 협정의 틀에 따라 이스라엘과 관계를 정상화하기로 합의했습니다. 이는 지역 평화를 위한 역사적인 돌파구입니다."
 department_of_state.162.a: "역사적인 성과입니다"
 department_of_state.163.t: "[FROM.GetName]이(가) 반도체 지원법 파트너십을 수락"
 department_of_state.163.d: "[FROM.GetName]이(가) 반도체 지원법에 따른 우리의 반도체 파트너십에 참여하기로 합의하여, 우리의 공급망 회복력이 강화됩니다."
 department_of_state.163.a: "좋은 소식입니다"
 department_of_state.164.t: "[FROM.GetName]이(가) 정상회담에 동의"
 department_of_state.164.d: "[FROM.GetName]이(가) 비핵화 회담에 참여하기로 동의했습니다. 한반도 외교에 전례 없는 기회입니다."
 department_of_state.164.a: "희망적인 진전입니다"
 department_of_state.165.t: "[FROM.GetName]이(가) THAAD 배치를 수락"
 department_of_state.165.d: "[FROM.GetName]이(가) 자국 영토에 THAAD 미사일 방어 체계를 배치하는 것을 승인하여, 역내 우리의 방어 태세가 강화됩니다."
 department_of_state.165.a: "우리 동맹국이 더 안전해졌습니다"
 department_of_state.166.t: "[FROM.GetName]이(가) 투자 파트너십을 수락"
 department_of_state.166.d: "[FROM.GetName]이(가) 우리의 투자 및 반도체 파트너십 제안에 합의하여, 경제적 유대가 깊어집니다."
 department_of_state.166.a: "강력한 파트너십입니다"
 department_of_state.167.t: "[FROM.GetName]이(가) 쿼드에 참여"
 department_of_state.167.d: "[FROM.GetName]이(가) 쿼드 안보 대화를 공식화하기로 합의하여, 자유롭고 개방된 인도·태평양을 향한 우리의 공동 의지가 강화됩니다."
 department_of_state.167.a: "환영합니다"
 department_of_state.168.t: "[FROM.GetName]이(가) EDCA 협력을 확대"
 department_of_state.168.d: "[FROM.GetName]이(가) 강화된 방위협력협정을 확대하기로 합의하여, 우리의 군사 파트너십과 기지 접근 협정이 심화됩니다."
 department_of_state.168.a: "동맹이 더욱 굳건해집니다"
 department_of_state.169.t: "[FROM.GetName]이(가) 통일 회담에 열린 자세를 보임"
 department_of_state.169.d: "[FROM.GetName]이(가) 미국이 중재하는 통일 대화에 참여하기로 합의했습니다. 한반도의 평화적 해결이 아직 가능할지도 모릅니다."
 department_of_state.169.a: "외교가 승리합니다"
 department_of_state.180.t: "[FROM.GetName]이(가) AUKUS 협정을 거절"
 department_of_state.180.d: "[FROM.GetName]이(가) AUKUS 안보 파트너십에 참여하기를 거절했습니다. 역내 협력을 위한 다른 길을 모색해야 할 것입니다."
 department_of_state.180.a: "실망스럽습니다"
 department_of_state.181.t: "[FROM.GetName]이(가) IPEF를 거절"
 department_of_state.181.d: "[FROM.GetName]이(가) 인도·태평양 경제 프레임워크 참여를 거절했습니다. 그들의 불참은 이 구상을 약화시킵니다."
 department_of_state.181.a: "그들의 손실입니다"
 department_of_state.182.t: "[FROM.GetName]이(가) 아브라함 협정을 거부"
 department_of_state.182.d: "[FROM.GetName]이(가) 아브라함 협정에 따른 이스라엘과의 관계 정상화를 거절했습니다. 지역 평화는 기다려야 할 것입니다."
 department_of_state.182.a: "놓친 기회입니다"
 department_of_state.183.t: "[FROM.GetName]이(가) 반도체 지원법 파트너십을 거절"
 department_of_state.183.d: "[FROM.GetName]이(가) 우리의 반도체 파트너십 제안을 거절했습니다. 공급망을 확보하기 위해 다른 파트너를 찾아야 할 것입니다."
 department_of_state.183.a: "다른 곳을 찾아보겠습니다"
 department_of_state.184.t: "[FROM.GetName]이(가) 정상회담을 거부"
 department_of_state.184.d: "[FROM.GetName]이(가) 비핵화 회담 참여를 거부했습니다. 한반도의 긴장은 해소되지 않은 채 남아 있습니다."
 department_of_state.184.a: "차질입니다"
 department_of_state.185.t: "[FROM.GetName]이(가) THAAD 배치를 거부"
 department_of_state.185.d: "[FROM.GetName]이(가) THAAD 미사일 방어 체계의 배치를 거부했습니다. 우리의 역내 방어 태세를 재검토해야 할 것입니다."
 department_of_state.185.a: "안타깝습니다"
 department_of_state.186.t: "[FROM.GetName]이(가) 투자 파트너십을 거절"
 department_of_state.186.d: "[FROM.GetName]이(가) 우리의 투자 및 반도체 파트너십 제안을 거절했습니다. 경제 협력은 다른 형태를 취해야 할 것입니다."
 department_of_state.186.a: "유감스럽습니다"
 department_of_state.187.t: "[FROM.GetName]이(가) 쿼드를 거절"
 department_of_state.187.d: "[FROM.GetName]이(가) 전략적 자율성을 유지하기를 선호하여 쿼드 안보 대화의 공식화를 거절했습니다."
 department_of_state.187.a: "그들의 결정을 존중합니다"
 department_of_state.188.t: "[FROM.GetName]이(가) EDCA 확대를 거절"
 department_of_state.188.d: "[FROM.GetName]이(가) 강화된 방위협력협정의 확대를 거절했습니다. 우리의 방위 파트너십은 현재 수준에 머무릅니다."
 department_of_state.188.a: "후퇴입니다"
 department_of_state.189.t: "[FROM.GetName]이(가) 통일 회담을 거절"
 department_of_state.189.d: "[FROM.GetName]이(가) 통일 대화 참여를 거절했습니다. 한반도 평화로 가는 길이 더 멀어집니다."
 department_of_state.189.a: "문은 열려 있습니다"
 USA_blr_fail_TT: "작전 실패로 [BLR.GetFlag] [BLR.GetLeader]이(가) 권좌에 남음"
 USA_kidd_destroyer_accept_TT: "[TAI.GetFlag] §H[TAI.GetName]§!이(가) §G$2.5B§!를 대가로 §H기륭급 구축함 4척§!을 받아 §H대만 해협§!을 강화합니다."
 USA_additional_kee_lung_accept_TT: "[TAI.GetFlag] §H[TAI.GetName]§!이(가) §G$2B§!를 대가로 §H기륭급 구축함 3척 추가§!와 §H확장된 조선소§!를 받으며, [CHI.GetFlag] §H베이징§!에 맞서 §G+2% 전쟁 지지도§!를 얻습니다."
 USA_article_nine_accept_TT: "[JAP.GetFlag] §H[JAP.GetName]§!이(가) §H헌법 9조§!를 재해석하여 보다 적극적인 §H자위§! 태세를 갖추고 양국 간 §H관계§!가 깊어집니다."
 department_of_state.220.t: "기륭급 추가 주문 확대"
 department_of_state.220.d: "[CHI.GetName]의 공격성이 높아지는 가운데, [USA.GetName]이(가) 기륭급 2차 물량을 제안했습니다. 이 패키지에는 미국 예비 전력에서 가져와 현재 기준으로 현대화한 §H추가 개조 함체 3척§!과 우리의 자체 생산을 가속화하기 위한 §H조선소 확장§! 지원이 포함됩니다. 워싱턴은 본토의 야망을 견제하기 위해 더 강력한 §H중화민국 해군§!에 분명히 승부를 걸고 있습니다. 이 제안은 싸지 않지만, 해협이 우리에게 유리하게 조용해지는 것을 지켜보는 것 또한 마찬가지입니다."
 department_of_state.220.a: "수표에 서명한다"
 department_of_state.220.b: "그 가격은 감당할 수 없다"
 department_of_state.230.t: "MNNA 지위 요청"
 department_of_state.230.d: "[FROM.GetNameWithFlag]이(가) §H주요 비나토 동맹국§!(MNNA)으로 지정해 줄 것을 공식 요청했습니다. 이들은 서방 또는 중립 노선, 정보와 군사 기술을 공유할 의지, 그리고 무엇보다 [CHI.GetFlag] §H베이징§!, [SOV.GetFlag] §H모스크바§!, [PER.GetFlag] §H테헤란§!의 영향권에 들어가지 않겠다는 약속을 근거로 제시했습니다. MNNA 지위를 부여하면 한 세대 동안 그들의 지향이 우리 쪽으로 고정되지만, 동시에 그들에 대한 공격이 우리 이익에 대한 공격이라는 신호를 세계에 보내는 것이기도 합니다."
 department_of_state.230.a: "주요 비나토 동맹국 지위를 부여한다"
 department_of_state.230.b: "신청을 거부한다"
 department_of_state.231.t: "[FROM.GetName]의 답변"
 department_of_state.231.d: "[FROM.GetNameWithFlag]이(가) 주요 비나토 동맹국 지위 요청에 대한 공식 답변을 보내왔습니다. 결정이 나왔습니다."
 department_of_state.231.a: "우리는 이제 §H주요 비나토 동맹국§!이다"
 department_of_state.231.b: "우리의 신청이 §R거부§!되었다"
 department_of_state.232.t: "공격받은 [FROM.GetNameWithFlag]"
 department_of_state.232.d: "[FROM.GetNameWithFlag]이(가) 다른 국가의 공격을 받았으며, 이들은 우리의 §H주요 비나토 동맹국§!입니다. 우리가 파트너를 방어하겠다며 맺은 모든 조약과 해온 모든 연설은 바로 이런 순간을 위한 것입니다. 세계는 우리의 약속이 여전히 의미가 있는지 지켜보고 있습니다. 군 지휘부는 우리의 결정을 기다리고 있습니다. 그들의 무장 요청에 응할 것입니까?"
 department_of_state.232.a: "약속을 지킨다. 신속 대응군을 동원하라."
 department_of_state.232.b: "무기를 보내고 제재를 가하되, 전투에는 개입하지 않는다"
 department_of_state.232.c: "침공을 규탄하되 아무 조치도 취하지 않는다"
 request_MNNA_status: "주요 비나토 동맹국 지위 요청"
 request_MNNA_status_desc: "§H주요 비나토 동맹국§! 제도는 §H나토§! 밖에 있는 긴밀한 파트너를 위한 지정입니다. MNNA 지위를 얻으면 무기 이전, 정보 공유, 합동 훈련의 협상 테이블에 앉을 자리를 얻고, 운이 따른다면 늑대가 몰려올 때 우리를 방어하겠다는 §H나토§! 주도국의 약속도 받을 수 있습니다."
 MNNA_accept_TT: "§H나토§! 주도국이 승인하면 우리는 §H주요 비나토 동맹국§! 국가 정신을 얻고 그들과의 관계가 §H깊어집니다§!"
 MNNA_reject_TT: "거부될 경우 §H180일§! 동안 재신청할 수 없습니다"
 nato_leader_not_at_war_with_us_tt: "§H나토§! 주도국이 우리와 전쟁 중이 아님"
 Major_Non_NATO_Ally_TT: "비민주주의 국가이면서 MNNA가 아닌 침략자에게 §R공격받을§! 경우, §H나토§! 주도국이 우리를 방어하기 위해 개입할 수 있습니다"
 department_of_state.233.t: "나토 동맹국의 노선 전환"
 department_of_state.233.d: "[event_target:nato_coup_victim.GetNameWithFlag]에서 정권이 교체되었으며, 새 지도부는 §R더 이상 민주주의가 아닙니다§!. [event_target:nato_coup_aggressor.GetFlag] §H[event_target:nato_coup_aggressor.GetName]§!의 흔적이 이번 정권 이양 곳곳에 남아 있습니다. 그들은 [event_target:nato_coup_victim.GetName]의 정치에 대한 §H영향력 침투§!를 활용하여 나토 동맹국을 내부에서 돌려놓았습니다. 동맹은 우리가 어떻게 대응하는지 지켜보고 있습니다."
 department_of_state.233.a: "나토에서 퇴출하고 새 정권을 제재한다"
 department_of_state.233.b: "민주 야권을 비밀리에 지원한다"
 department_of_state.233.c: "새 정권을 받아들이고 동맹의 결속을 유지한다"
 department_of_state.234.t: "워싱턴, 정권 이양에 대응"
 department_of_state.234.d: "[USA.GetName]이(가) 우리의 새 정부에 대한 입장을 공식화했습니다. 워싱턴의 대응은 앞으로 수년간 세계에서 우리의 위치를 좌우할 것입니다."
 department_of_state.234.a: "이제 그 결과는 우리 손에 달려 있다"
 USA_trump_buy_greenland: "[DEN.GetFlag] 그린란드 매입"
 USA_trump_buy_greenland_desc: "대통령은 워싱턴의 대부분이 장난으로 치부했던 구상을 내놓았지만 그는 전적으로 진지했습니다. 바로 덴마크로부터 그린란드를 사들이는 것입니다. 전략적 가치는 의심의 여지가 없습니다. 북극 항로, 희토류 광물, 러시아 잠수함에 맞선 전진 기지가 그것입니다. 문제는 코펜하겐이 이 제안을 진지하게 받아들이기나 할지, 그리고 그 가격표를 의회가 받아들일 수 있을지입니다."
 USA_greenland_accept_TT: "[DEN.GetFlag] §H[DEN.GetName]§!이(가) §G$500B§!를 받는 대가로 §H그린란드§!를 우리에게 양도합니다."
 USA_greenland_reject_TT: "[DEN.GetFlag] §H[DEN.GetName]§!이(가) 제안을 거절하며 우리에 대한 관계가 §R악화됩니다§!."
 department_of_state.240.t: "미국의 그린란드 제안"
 department_of_state.240.d: "[FROM.GetNameWithFlag]이(가) §H그린란드§!를 §G5,000억 달러§!에 매입하겠다고 공식 제안했습니다. 이 제안은 현대사에서 전례가 없습니다. 서방 동맹국 사이에서 영토가 매매된 일은 기억에 없습니다. 매각은 그린란드의 정치 여론과 유럽 대부분을 격분시키겠지만, 거부하면 우리에게 모든 크로네가 필요한 시점에 [DEN.GetName]이(가) 엄청난 금액을 놓치게 됩니다. 폴케팅은 마비 상태이며, 결정은 내각에 달려 있습니다."
 department_of_state.240.a: "그린란드를 판다"
 department_of_state.240.b: "그린란드는 매물이 아니다"
 department_of_state.241.t: "그린란드, 미국에 매각"
 department_of_state.241.d: "유럽을 경악시키고 미국 우파를 환호하게 한 조치로, 덴마크 왕국이 §H그린란드§!를 수천억 달러에 이를 것으로 추정되는 비공개 금액을 받고 [USA.GetName]에 공식 양도했습니다. 이 거래는 이미 루이지애나 매입을 능가하는 '역사상 최대의 토지 매매'로 불리고 있습니다. 누크에서는 시위가 일어났습니다. 브뤼셀은 간결하고 날 선 성명을 발표했습니다."
 department_of_state.241.a: "미국 주권의 새로운 장"
 USA_trump_nato_dilemma: "[USA.GetFlag] 나토에서의 우리 역할 재평가"
 USA_trump_nato_dilemma_desc: "대통령은 §H나토§!가 시대에 뒤떨어졌으며 유럽 동맹국들이 미국의 국방 예산에 무임승차하고 있다는 주장을 내세워 선거운동을 했습니다. 그의 국가안보팀은 덜 확신하고 있습니다. 우리의 공약에 대한 공식 검토가 곧 이루어질 것이며, 탈퇴, 지렛대로서 탈퇴 위협, 재확약이라는 세 가지 큰 선택지가 테이블에 올라와 있습니다."
 department_of_state.242.t: "나토: 대통령의 선택"
 department_of_state.242.d: "대통령은 합동참모본부, 국무장관, 국방장관을 소집하여 §H나토§!에 관한 비공개 회의를 열었습니다. 그들 앞에 놓인 질문은 존립에 관한 것입니다. 앞으로 동맹 내에서 미국의 역할은 무엇인가? 일부 참모들은 중국이 대등한 경쟁자인 세계에서 동맹이 더 이상 미국의 이익에 기여하지 않는다고 주장하며 완전한 탈퇴를 공개적으로 옹호하고 있습니다. 다른 이들은 이 동맹을 80년에 걸쳐 쌓아 올려 하루아침에 잃을 수도 있는 서방 안보의 초석으로 보고 있습니다."
 department_of_state.242.a: "나토에서 탈퇴한다"
 department_of_state.242.b: "동맹국들이 2% 목표를 충족하지 않으면 탈퇴하겠다고 위협한다"
 department_of_state.242.c: "나토에 대한 우리의 의지를 재확인한다"
 USA_india_civil_nuclear_agreement: "[RAJ.GetFlag] [USA.GetFlag] 인도 핵 협정"
 USA_india_civil_nuclear_agreement_desc: "[RAJ.GetNameWithFlag]은(는) 세계 최대의 민주주의 국가이며 부상하는 [CHI.GetNameWithFlag]에 대한 자연스러운 견제 세력입니다. 수십 년간의 핵 정통주의에서 벗어나 [RAJ.GetNameWithFlag]을(를) 책임 있는 핵 보유국으로 인정함으로써, 우리는 다음 세기를 규정할 전략적 동반자 관계의 문을 열게 됩니다. 파키스탄인들은 울부짖고 핵 비확산 강경파들은 비명을 지르겠지만, 그만한 가치가 있는 성과입니다."
 USA_india_nuclear_TT: "§H[RAJ.GetNameWithFlag]§!에 §H민간 핵 협력 협정§!을 제안하여 수십 년간의 기술 고립을 끝냅니다\n - 수락될 경우 §H[RAJ.GetNameWithFlag]§!와(과)의 §H협력 변동치§!를 얻습니다\n - 결과와 관계없이 §H[PAK.GetNameWithFlag]§!의 우리에 대한 §R관계가 30 하락§!합니다\n\n이 행동의 전략적 중요성:\n - §H[RAJ.GetNameWithFlag]§!은(는) 세계 최대의 민주주의 국가이며 §H[CHI.GetNameWithFlag]§!에 대한 가장 자연스러운 견제 세력입니다. 지금 이 관계를 구축하는 것이 다음 세기 인도·태평양 권력 구도를 좌우합니다."
 USA_vietnam_comprehensive_partnership: "[VIE.GetFlag] [USA.GetFlag] 태평양의 동반자"
 USA_vietnam_comprehensive_partnership_desc: "50년 전 우리는 정글에서 서로에게 총을 겨누었습니다. 오늘날 [VIE.GetName]은(는) 동남아시아에서 가장 반중 성향이 강한 나라 중 하나이며 자연스러운 전략적 파트너입니다. 포괄적 동반자 관계는 무역과 안보 협력의 틀을 마련하고, 베이징이 공통의 문제라는 암묵적 공감대를 형성할 것입니다."
 USA_vietnam_partnership_TT: "§H[VIE.GetNameWithFlag]§!에 §H포괄적 동반자 관계§!를 제안하여 §H[CHI.GetNameWithFlag]§!이(가) 공통의 문제라는 암묵적 공감대와 전략적 유대를 구축합니다\n - 수락될 경우 §H[VIE.GetNameWithFlag]§!와(과)의 §H협력 변동치§!를 얻습니다\n\n이 행동의 전략적 중요성:\n - §H[VIE.GetNameWithFlag]§!은(는) 동남아시아에서 가장 반중 성향이 강한 나라 중 하나입니다. 이곳과의 공식 동반자 관계는 [CHI.GetFlag] §H베이징§!과 그 인접 지역 사이에 돈만으로는 살 수 없는 쐐기를 박습니다."
 USA_caatsa_turkey_sanctions: "[TUR.GetFlag] [USA.GetFlag] S-400에 대한 제재"
 USA_caatsa_turkey_sanctions_desc: "[TUR.GetNameWithFlag]은(는) NATO 동맹국이면서도 러시아제 방공 시스템을 구매했습니다. 동맹은 그렇게 작동하지 않습니다. CAATSA에 따라 우리는 튀르키예 국방 당국을 제재하고, 그들이 정신을 차릴 때까지 F-35 계획에서 제외할 것입니다. 양다리를 걸치려 한다면 그 대가를 치러야 합니다."
 USA_caatsa_turkey_TT: "[SOV.GetFlag] §HS-400§! 방공 시스템 구매와 관련하여 §H[TUR.GetNameWithFlag]§!에 §RCAATSA 제재§! 최후통첩을 보냅니다\n\n이 행동의 전략적 중요성:\n - 동맹국은 러시아 무기를 구매하면서 F-35 계획에 남을 수 없습니다. §H[TUR.GetNameWithFlag]§!이(가) 물러서면 우리에 대한 관계가 §G+15§! 상승합니다.\n - 거부할 경우 §R공식 제재§!를 받게 되며 §H[TUR.GetNameWithFlag]§!의 안정도가 하락합니다."
 USA_recognize_guaido: "[VEN.GetFlag] [USA.GetFlag] 후안 과이도 승인"
 USA_recognize_guaido_desc: "마두로 정권은 [VEN.GetName]을(를) 파괴했습니다. 수백만 명이 떠났고 경제는 폐허가 되었으며 민주주의는 기억 속에만 남았습니다. 야당이 이끄는 국회가 임시 대통령을 지명했고, 우리는 그를 [VEN.GetName]의 합법적 지도자로 승인할 것입니다. 이어지는 제재는 정권에 남은 석유 수입마저 틀어막을 것입니다."
 USA_recognize_guaido_TT: "§H후안 과이도§!를 [VEN.GetFlag] §H[VEN.GetName]§!의 합법적 대통령으로 승인하고 마두로 정권에 §R석유 제재§!를 가합니다\n\n이 행동의 전략적 중요성:\n - 수락될 경우 [VEN.GetFlag] §H[VEN.GetName]§!은(는) §H안정도 10%§!와 §H정치력 100§!을 잃습니다. 결과는 불확실합니다. §H30%§! 확률로 §R민주주의 내전§!, §H40%§! 확률로 §R대규모 소요§!, §H30%§! 확률로 §G평화적 이행§!이 일어납니다.\n - 거부되더라도 [VEN.GetFlag] §H[VEN.GetName]§!은(는) §H안정도 5%§!를 잃으며 우리의 제재로 인해 §R경제 쇠퇴§!를 겪습니다."
 USA_cuba_thaw: "[CUB.GetFlag] [USA.GetFlag] 쿠바와의 냉전 종식"
 USA_cuba_thaw_desc: "[CUB.GetName]에 대한 금수 조치는 50년간 효과가 없었고, 앞으로 50년이 지나도 효과가 없을 것입니다. 이제 외교 관계를 복원하고, 대사관을 다시 열고, 여행과 송금 제한을 완화할 때입니다. 고립보다는 관여가 쿠바를 변화시키는 데 더 큰 역할을 할 것입니다."
 USA_cuba_thaw_TT: "[CUB.GetFlag] §H[CUB.GetName]§!와(과) §H외교 관계§!를 복원하고 §H금수 조치§!를 완화하여 정상화의 문을 엽니다\n - [CUB.GetFlag] §H[CUB.GetName]§!이(가) 수락하면 §H협력 변동치§!를 얻고 그들의 §H안정도§!가 §G5%§! 향상됩니다\n - 이 행동은 §R영구적§!입니다. 이번 시대가 끝날 때까지 §R쿠바 동결§! 선택지가 봉쇄됩니다\n\n이 행동의 전략적 중요성:\n - 50년간의 금수 조치는 [CUB.GetFlag] §H쿠바§! 정부를 무너뜨리지 못했습니다. 고립이 실패한 곳에서 관여가 성공할 수도 있습니다."
 USA_cuba_freeze: "[CUB.GetFlag] [USA.GetFlag] 쿠바는 친구가 아니다"
 USA_cuba_freeze_desc: "아바나와의 해빙은 정권에 원하는 모든 것을 안겨주었으나 돌아온 것은 아무것도 없었습니다. 우리는 여행 제한을 다시 도입하고, 금수 조치를 강화하며, 쿠바 군부로 흘러가는 달러 자금을 단속할 것입니다. [CUB.GetName]은(는) 우리 해안에서 90마일 떨어진 공산 독재 국가이며, 우리는 그렇게 대할 것입니다."
 USA_cuba_freeze_TT: "[CUB.GetFlag] §H[CUB.GetName]§!에 엄격한 §R제재§!를 다시 부과하고 정상화의 성과를 되돌립니다\n - 수락될 경우 [CUB.GetFlag] §H[CUB.GetName]§!은(는) §H안정도 2%§!와 §H정치력 25§!를 잃습니다\n - 거부될 경우 [CUB.GetFlag] §H[CUB.GetName]§!은(는) §H안정도 5%§!를 잃고 §R경제 쇠퇴§!를 겪습니다\n - 이 행동은 §R영구적§!입니다. 이번 시대가 끝날 때까지 §R쿠바 해빙§! 선택지가 봉쇄됩니다\n\n이 행동의 전략적 중요성:\n - [CUB.GetFlag] §H[CUB.GetName]§!은(는) 우리 해안에서 90마일 떨어진 공산 독재 국가입니다. 제재는 우리 반구에서 미국의 이익을 거스르면 대가를 치른다는 메시지를 보냅니다."
 USA_huawei_export_blacklist: "[CHI.GetFlag] [USA.GetFlag] 화웨이 블랙리스트 등재"
 USA_huawei_export_blacklist_desc: "화웨이는 단순한 통신 기업이 아니라 중국 국가의 일부이며, 그들이 해외에 판매하는 모든 라우터는 동맹국 네트워크로 통하는 잠재적 백도어입니다. 이들을 거래 제한 명단에 올리면 미국산 칩과 소프트웨어에서 차단됩니다. 동맹국들이 5G 네트워크를 안전하게 유지하고 싶다면 우리를 따를 것입니다."
 USA_huawei_blacklist_TT: "§H화웨이§!와 관련된 [CHI.GetFlag] §H중국§! 기술 기업들을 §H거래 제한 명단§!에 올려 미국산 칩과 소프트웨어에서 차단합니다\n\n이 행동의 전략적 중요성:\n - [CHI.GetFlag] §H[CHI.GetName]§!이(가) 물러서면 미국의 압박 속에서 §R정치력 50§!을 잃습니다.\n - 거부할 경우 공급망이 이탈하면서 [CHI.GetFlag] §H중국§! 기술 산업이 §R경제 쇠퇴§!를 겪습니다."
 USA_semiconductor_export_controls: "[CHI.GetFlag] [USA.GetFlag] 칩 공급 차단"
 USA_semiconductor_export_controls_desc: "첨단 칩은 21세기의 석유이며, [CHI.GetName]은(는) 수년 뒤처져 있습니다. 이번 신규 수출 통제는 그 격차를 유지시킬 것입니다. 첨단 리소그래피 장비도, AI 가속기도, 가장 정교한 팹에 대한 지원도 없습니다. 이는 냉전 이후 가장 공격적인 기술 봉쇄 정책이며, 큰 타격을 줄 것입니다."
 USA_semiconductor_controls_TT: "[CHI.GetFlag] §H[CHI.GetName]§!로 향하는 첨단 §H반도체§!와 칩 제조 장비에 §H포괄적 수출 통제§!를 부과합니다\n\n이 행동의 전략적 중요성:\n - [CHI.GetFlag] §H[CHI.GetName]§!이(가) 굴복하면 이로 인한 국내 압박으로 §R정치력 75§!를 잃습니다.\n - 거부할 경우 첨단 칩 산업이 §R경제 쇠퇴§!를 겪으며 수년 뒤처지게 되어 우리의 기술 우위가 확보됩니다."
 USA_hong_kong_autonomy_sanctions: "[CHI.GetFlag] [USA.GetFlag] 홍콩 자치법"
 USA_hong_kong_autonomy_sanctions_desc: "베이징의 국가보안법은 '일국양제' 아래 홍콩에 약속된 자유를 질식시켰습니다. 홍콩 자치법은 책임 있는 중국 공산당 관리들과 은행들을 제재할 수 있게 해줍니다. 홍콩을 되살리지는 못하겠지만, 홍콩을 죽인 자들에게 개인적인 대가를 치르게 할 것입니다."
 USA_hk_sanctions_TT: "홍콩 자치법에 따라 §H홍콩§! 탄압에 책임이 있는 §H중국 공산당 관리들§!과 은행들을 제재합니다\n\n이 행동의 전략적 중요성:\n - [CHI.GetFlag] §H[CHI.GetName]§!이(가) 물러서면 국내 파장으로 §R정치력 100§!과 §R안정도 3%§!를 잃습니다.\n - 거부할 경우 [CHI.GetFlag] §H중국§!의 성장이 타격을 입고, 우리가 확고한 입장을 지킨 데 대해 [ENG.GetFlag] §H[ENG.GetName]§!의 우리에 대한 관계가 §G+15§! 상승합니다."
 USA_withdraw_from_who: "[USA.GetFlag] 세계보건기구 지원 중단"
 USA_withdraw_from_who_desc: "세계보건기구는 바이러스가 전 세계로 퍼지는 동안 [CHI.GetName]을(를) 감싸주었습니다. 그들은 중국의 꼭두각시이며, 우리는 그 비용을 더 이상 부담하지 않을 것입니다. 우리는 재정 지원과 회원 자격을 철회합니다. 가장 큰 후원국이 왜 떠났는지는 WHO가 다른 후원국들에게 설명하게 합시다."
 USA_return_to_who: "[USA.GetFlag] 세계보건기구 재가입"
 USA_return_to_who_desc: "팬데믹 한가운데에서 WHO를 탈퇴한 것은 스스로 입힌 상처였습니다. 우리는 첫날부터 재가입하고, 재정 지원을 재개하며, 이 기구에서 미국의 지도력을 재확립할 것입니다. 개혁은 변방이 아니라 내부에서 이루어질 것입니다."
 USA_fentanyl_cartel_fto: "[MEX.GetFlag] [USA.GetFlag] 카르텔 지정"
 USA_fentanyl_cartel_fto_desc: "펜타닐은 매년 베트남 전쟁 전체보다 더 많은 미국인의 목숨을 앗아가고 있습니다. 이를 국경 너머로 들여오는 카르텔은 이름만 아닐 뿐 사실상 테러 조직이며, 오늘 우리는 이를 공식화합니다. 외국 테러 조직 지정은 우리가 가진 모든 법적·군사적 수단을 열어줍니다. [MEX.GetName]은(는) 협력하거나 비켜서야 합니다."
 USA_fentanyl_fto_TT: "[MEX.GetFlag] §H멕시코 마약 카르텔§!을 §H외국 테러 조직§!으로 공식 지정하여, 우리가 가진 모든 대테러 수단을 사용할 수 있게 합니다\n\n이 행동의 전략적 중요성:\n - [MEX.GetFlag] §H[MEX.GetName]§!이(가) 협력하면 §H협력 변동치§!를 얻고 공급망 해체를 함께할 실질적인 파트너를 얻습니다.\n - [MEX.GetFlag] §H[MEX.GetName]§!이(가) 거부하면 마약 단속 압박이 거세지면서 경제가 §R타격§!을 입고 안정도가 §R3%§! 하락합니다."
 department_of_state.210.t: "미국과의 핵 협력"
 department_of_state.210.d: "미국이 역사적인 제안을 해왔습니다. 1974년 우리의 핵실험 이후 부과된 수십 년간의 제재를 끝낼 전면적인 민간 핵 협력 협정입니다. 민간 프로그램과 군사 프로그램을 분리하고 민간 원자로에 IAEA 안전조치를 받아들이는 대가로, 우리는 미국의 원자로 기술과 연료에 접근할 수 있게 됩니다. 이슬라마바드는 울부짖겠지만, 워싱턴의 전략적 포옹은 두 번 오는 제안이 아닙니다."
 department_of_state.210.a: "두 위대한 민주주의 국가의 동반자 관계다."
 department_of_state.210.b: "우리는 핵 프로그램에 대해 타협하지 않을 것이다."
 department_of_state.211.t: "포괄적 동반자 관계"
 department_of_state.211.d: "워싱턴이 정치, 경제, 안보, 문화 협력을 아우르는 포괄적 동반자 관계를 제안했습니다. 전쟁 이후 반세기가 지나, 미국은 과거를 뒤로하고 남중국해에서 커져가는 중국 문제에 맞서 함께 서고자 합니다. 당은 이 포옹을 얼마나 깊이 허용할지 결정해야 합니다."
 department_of_state.211.a: "동반자 관계를 수락한다."
 department_of_state.211.b: "때가 아니다."
 department_of_state.212.t: "CAATSA 최후통첩"
 department_of_state.212.d: "미국이 최후통첩을 전달했습니다. 러시아제 S-400을 포기하고 F-35 계획으로 복귀하든지, 아니면 광범위한 CAATSA 제재와 전투기 컨소시엄에서의 제외를 감수하라는 것입니다. 워싱턴은 NATO 동맹국이 러시아 방공 시스템을 대가 없이 구매하는 것을 용납하지 않겠다는 입장입니다. 선택은 우리의 전략적 자율성과 서방과의 동조 사이에 놓여 있습니다."
 department_of_state.212.a: "S-400 거래를 취소한다."
 department_of_state.212.b: "튀르키예는 누구에게도 복종하지 않는다."
 department_of_state.213.t: "미국의 최후통첩"
 department_of_state.213.d: "미국은 야당의 대통령직 주장을 승인했으며 정권이 물러날 것을 요구하고 있습니다. 우리가 양보하지 않으면 치명적인 석유 제재가 뒤따를 것입니다. 거리는 시위대로 가득하고 야당은 기세가 올랐으며, 백악관은 볼리바르주의의 날이 얼마 남지 않았다고 판단한다는 점을 분명히 하고 있습니다."
 department_of_state.213.a: "나라를 구하기 위해 물러나겠다."
 department_of_state.213.b: "혁명은 제국주의에 굴복하지 않는다."
 department_of_state.214.t: "워싱턴과의 관계 정상화"
 department_of_state.214.d: "반세기에 걸친 대립 끝에 미국은 외교 관계 복원, 대사관 재개설, 금수 조치 완화를 제안했습니다. 워싱턴은 고립이 하지 못한 일을 관여가 해낼 것이라고 내기를 걸고 있습니다. 예상치 못한 기회이며, 우리 경제를 바꿔놓을 수도, 혁명을 훼손할 수도 있습니다."
 department_of_state.214.a: "혁명은 금수 조치보다 오래갈 것이다. 어디 와 보라지."
 department_of_state.214.b: "관광 달러와 우리의 원칙을 맞바꾸지 않겠다."
 department_of_state.215.t: "금수 조치의 부활"
 department_of_state.215.d: "미국이 노선을 뒤집었습니다. 여행 제한이 다시 도입되고, 대사관 접촉이 동결되며, 금수 조치가 다시 강화되고 있습니다. 워싱턴은 해빙이 우리에게 모든 것을 주었지만 돌아온 것은 아무것도 없었다고 판단했습니다. 짧았던 개방은 끝났습니다."
 department_of_state.215.a: "협상할 방법을 찾아야 한다."
 department_of_state.215.b: "언제나 그랬듯이 견뎌낼 것이다."
 department_of_state.216.t: "거래 제한 명단 제재"
 department_of_state.216.d: "미국이 화웨이와 점점 늘어나는 우리 기술 기업들을 거래 제한 명단에 올려 미국산 칩, 소프트웨어, 부품에서 차단했습니다. 워싱턴은 우리의 대표 기업들을 국가의 일부로 취급하며, 동맹국 수도들에도 5G 조달에서 같은 조치를 따르도록 압박하고 있습니다. 이는 우리의 기술 부상에 대한 경제 전쟁 행위이며 대응이 필요합니다."
 department_of_state.216.a: "협상을 통한 타협을 모색한다."
 department_of_state.216.b: "자립이 우리의 대답이 될 것이다."
 department_of_state.217.t: "칩 전쟁의 확대"
 department_of_state.217.d: "미국이 첨단 반도체와 그 제조에 필요한 장비에 대한 광범위한 신규 수출 통제를 부과했으며, 특히 첨단 AI 및 군사용 칩으로 향하는 우리의 길을 겨냥하고 있습니다. 이는 냉전 이후 워싱턴이 시도한 가장 공격적인 기술 봉쇄이며, 우리 산업 미래의 핵심을 곧바로 겨냥합니다."
 department_of_state.217.a: "외교적 해결책을 찾아야 한다."
 department_of_state.217.b: "그들이 팔지 않는 것은 우리가 만든다."
 department_of_state.218.t: "홍콩 자치법"
 department_of_state.218.d: "미국이 홍콩 국가보안법과 관련해 우리 관리들과 은행들을 겨냥한 제재를 제정했습니다. 워싱턴은 우리가 '일국양제'를 위반했다고 선언했으나, 우리는 이 문제가 주권 국가의 내정이라고 주장합니다. 제재는 탄압을 승인한 동지들에게 개인적 대가를 치르게 하도록 조정되어 있습니다."
 department_of_state.218.a: "홍콩에서의 단속을 완화한다."
 department_of_state.218.b: "홍콩은 내정 문제다."
 department_of_state.219.t: "테러 조직으로 선언된 카르텔"
 department_of_state.219.d: "미국이 우리 카르텔들을 외국 테러 조직으로 공식 지정했으며 합동 작전에 협력하라고 압박하고 있습니다. 워싱턴은 펜타닐 위기를 정책의 핵심으로 삼았으며, 우리 영토에서의 일방적 군사 행동까지 공공연히 논의하고 있습니다. 선택은 굴욕적인 동반자 관계와 우리 하늘에 미국 드론이 뜨는 사태 사이에 있습니다."
 department_of_state.219.a: "최악을 피하기 위해 협력한다."
 department_of_state.219.b: "우리의 주권은 팔지 않는다."
 USA_fifth_generation_fighter_woes_1: "5세대의 우울: 생산"
 USA_fifth_generation_fighter_woes_1_desc: "1997년 초기 시험 비행 이래의 낙관적인 전망에도 불구하고, F-22는 제조와 조립 문제로 얼룩져 있습니다. 폐기, 재작업, 늦어지는 설계 도면이 생산을 더디고 값비싸게 만들고 있습니다. 록히드는 올해 후반에 첫 F-22가 소량 생산에 들어갈 것으로 예상합니다."
 USA_fifth_generation_fighter_woes_2: "5세대의 우울: 기체"
 USA_fifth_generation_fighter_woes_2_desc: "비행 시험에서 생산 라인에 영향을 주는 기체 문제들이 드러났습니다. 수직 꼬리날개 버페팅, 엔진 배기구 사이의 과열, 수평 꼬리날개의 약화입니다. 수정 작업이 반영되는 동안 생산 라인에서 나오는 랩터마다 비용이 더 듭니다."
 USA_fifth_generation_fighter_woes_3: "5세대의 우울: 항공전자"
 USA_fifth_generation_fighter_woes_3_desc: "랩터의 공용 컴퓨터 항전 체계가 불안정합니다. 코드는 170만 줄이 넘고, 조종사들은 비행 중에 항공기 컴퓨터를 재부팅하고 있습니다. 항전 이상 간 평균 시간이 작전 시험 기준을 충족할 때까지 생산은 더디고 비용이 많이 듭니다."
 USA_f22_rushed_production: "서두른 랩터 배치"
 USA_f22_rushed_production_desc: "우리는 결함이 해결되기 전에 F-22를 실전에 투입했습니다. 비행대는 알려진 결함을 안고 비행하고 있어 사고가 늘고, 수정이 따라잡을 때까지 승무원의 숙련도를 갉아먹고 있습니다."
 USA_f22_raptor_operational: "F-22 랩터 운용 개시"
 USA_f22_raptor_operational_desc: "랩터가 실전 배치되었습니다. 험난했던 개발을 뒤로하고 생산 라인은 활기차게 돌아가며, 공군은 마침내 5세대 전투기를 갖게 되었습니다."
 usa.200.t: "F-22A 소량 생산 돌입"
 usa.200.d: "수년간의 지연 끝에 랩터가 소량 초도 생산 승인을 받았습니다. 시험기는 일정이 뒤처지고 있고, 소프트웨어 생산성은 낮으며, 공장은 여전히 폐기와 재작업과 씨름하고 있습니다. 생산 라인을 얼마나 몰아붙여야 합니까?"
 usa.200.a: "속도를 높여라, 기체가 필요하다"
 usa.200.b: "신중한 생산 속도를 유지한다"
 usa.201.t: "F-22 구조 문제"
 usa.201.d: "비행 시험에서 수직 꼬리날개의 격렬한 버페팅, 엔진 배기구 사이의 과열, 수평 꼬리날개의 약화가 드러났습니다. 수정 사항을 생산 중인 항공기에 다시 반영해야 합니다. 임시로 보강하고 계속 비행하겠습니까, 아니면 제대로 된 재설계를 위해 중단하겠습니까?"
 usa.201.a: "수정 사항을 덧붙이고 계속 비행한다"
 usa.201.b: "제대로 된 재설계를 위해 생산을 중단한다"
 usa.202.t: "F-22 항공전자 소프트웨어 불안정"
 usa.202.d: "조종사들이 비행 중에 항공전자를 재부팅하고 있습니다. 국방 획득 위원회는 작전 시험에 앞서 안정적인 가동 시간 확보를 요구합니다. 블록 3.1.2를 현재 상태 그대로 배치하거나, 랩터가 실전 투입되기 전에 소프트웨어에 모든 역량을 쏟을 수 있습니다."
 usa.202.a: "블록 3.1.2를 그대로 배치한다"
 usa.202.b: "소프트웨어 긴급 최우선 개발"
 usa.203.t: "실전 배치된 랩터"
 usa.203.d: "초도 작전 시험 평가에서 F-22는 압도적으로 효과적이라는 평가를 받았으며, 모든 공대공 임무 영역에서 F-15C를 능가했습니다. 본격 생산이 승인되었고 첫 전투 가능 랩터들이 비행대에 도착하고 있습니다."
 usa.203.a: "제공권을 인도했다"
 MNNA_partnership: "주요 비나토 동맹국 프로그램"
 MNNA_partnership_desc: "§H주요 비나토 동맹국§! 지정은 §H나토§! 지도부가 동맹 밖의 긴밀한 파트너에게 부여합니다. 무기 이전, 합동 군사 훈련, 정보 공유 협정에 대한 우선적 접근권이 부여됩니다."

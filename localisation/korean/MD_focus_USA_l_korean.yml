 IRQ_kill_3_baathists_TT: "바트당 지도자가 최소 4명 체포되어 처형됨"
 raid_type_raid_baath: "바트당 표적 추적"
 USA_foreign_policy: "국무부"
 USA_foreign_policy_desc: "The [USA.GetFlag] United States Department Of State was founded in 1789 as an administrative arm of the Executive Branch. Being considered one of the strongest agencies within the government, the Department Of State is headed by the Secretary Of State. Reporting back directly to only the President of the [USA.GetFlag] United States, the Department Of State is in charge of foreign affairs.\n\nWith every election, a series of new decisions will be unlocked for that candidate. Previous decisions will disappear with new elections, and certain changes in the world my prompt new decisions to appear."
 USA_doing_decision: " 다른 결정을 수행 중"
 USA_KUW_baathists: "[KUW.GetFlag] 쿠웨이트의 이라크 바트당원 추적"
 department_of_state.94.t: "탈레반, 공세 재개"
 department_of_state.94.d: "The Taliban have announced today that they will be renewing their offensive against the government [AFG.GetLeader]. This move comes as no surprise following a hasty U.S. withdrawal due to domestic pressure mounting on the current administration. What remains is a fractured, battered, and weakened Afghanistan left alone to defend itself against a much more ferocious foe. Several states have vowed to help defend Afghanistan once more if needed, but their word is as good as their willingness to commit to such a promise. It is still to be seen if the Afghan state is able to hold the Taliban back on its own, but it is likely that the army will not be able to put up much resistance."
 department_of_state.94.a: "아프가니스탄 정부는 다시 한번 무너질 것인가?"
 department_of_state.200.t: "아프가니스탄 사상자 보고"
 department_of_state.200.d: "우리는 아프가니스탄 전투에서 용감한 남녀 장병들을 잃었으며, 그들의 관이 정중한 장례를 위해 미국으로 돌아오고 있습니다."
 department_of_state.200.a: "셈퍼 파이"
 department_of_state.31.c: "어차피 무엇이든 해서 무슨 소용이 있는가"
 department_of_state.95.t: "키드급 구축함 판매"
 department_of_state.95.d: "최근 [USA.GetName]이(가) 몇 년 전 퇴역한 키드급 구축함을 우리에게 판매하겠다고 제안했습니다. 이 함정들은 원래 이란 제국 해군이 주문했으나 1979년 이란 혁명으로 취소된 강력한 유도미사일 구축함 시리즈입니다. 이후 이 함정들은 판매를 위해 미 해군의 퇴역 비축분에서 현대화되고 재가동되었습니다. 본토가 우리나라를 침공할 경우에 대비해 입지를 강화하기 위해 이 함정들을 구매해야 할까요?"
 department_of_state.95.a: "수표에 서명한다"
 department_of_state.95.b: "넘기겠다"
 USA_sale_of_the_kidd_destroyer: "[TAI.GetFlag] [TAI.GetName]에 키드급 구축함 판매"
 USA_sale_of_the_kidd_destroyer_desc: "우리는 키드급 구축함을 팔기 위해 애써 왔는데, [TAI.GetNameWithFlag]이(가) [CHI.GetNameWithFlag]에 맞선 방어 전략에 도움이 되도록 이 함선들을 구매하는 데 관심을 보였습니다."
 department_of_state.96.t: "확고한 결의 작전: 성공"
 department_of_state.96.d: "As the president watched from the situation room, special forces units stormed the compound of Venezuela's dictator, Nicolas Maduro. Swiftly catching him as he made an attempt to escape into a safe room, U.S. troops transported him onboard a plane and sent him on a flight to U.S. soil. It is expected that he will be tried in U.S. courts and given a sentence based on drug charges. it is said that the entire raid lasted just a matter of hours."
 department_of_state.96.a: "3시간짜리 작전은 이렇게 하는 것이다"
 department_of_state.97.t: "미국, 급습 감행"
 department_of_state.97.d: "미국이 노골적인 전쟁 행위를 저질렀습니다. 그들은 우리나라에 폭격을 가했고 우리 대통령을 납치했습니다. 이러한 행위는 응징 없이 넘어가서는 안 되며, 우리 군은 어떠한 점령 시도에도 저항할 준비를 점점 갖추고 있습니다. 그러나 미국은 우리가 협력한다면 추가 행동을 자제하겠다고 제안했습니다. 다만 협력한다면 그들이 일시적으로 국가를 통제하도록 허용하는 것을 의미합니다."
 department_of_state.97.a: "우리는 무릎 꿇지 않겠다!"
 department_of_state.97.b: "선택의 여지가 없다, 어쩔 수 없다"
 department_of_state.98.t: "미국, 베네수엘라 지도자를 체포"
 department_of_state.98.d: "The United States has carried out an overnight raid on Venezuela, an oil rich country in South America. This move comes after weeks of accusations by the U.S. president, claiming that the Venezuelan leader has been a destabilizing factor in the region by facilating the spread of narcotics. The raid code-named 'Operation Absolute Resolve' was successful, and it resulted in the capture of Nicolas Maduro, the long standing dictator of Venezuela. Though the United States hasn't really outlined how they intend to facilitate the transition of power, they've made it very clear that they are the ones in charge now and are calling on what remains of the Venezuelan government to collaborate until a replacement is found."
 department_of_state.98.a: "우려스러운 사태이다"
 raid_type_USA_raid_venezuela: "확고한 결의 작전"
 raid_type_USA_raid_venezuela_desc: "이 작전의 목표는 베네수엘라 지도자를 붙잡아 재판을 받게 하기 위해 안전하게 미국으로 데려오는 것입니다. 정보기관은 상황이 악화될 경우 권력 공백으로 인해 반란이 시작될 수 있다고 경고했습니다."
 USA_invasion_in_iraq_mission: "이라크 침공"
 USA_invasion_in_iraq_mission_desc: "기다릴수록 이라크를 침공할 명분은 점점 약해집니다. 침공을 강행하고자 한다면 내년 안에 침공해야 하며, 그렇지 않으면 전쟁 명분이 더는 유효하지 않게 됩니다."
 USA_failed_to_invade_iraq_idea: "국가적 굴욕"
 USA_failed_to_invade_iraq_idea_desc: "근본적인 이유가 무엇이든 이라크에 대한 군사 작전을 개시하지 못한 우리의 실패는 테러 공격에 대한 응징 없이 남아 있음을 의미합니다. 이러한 무대응은 우리의 신뢰를 심각하게 훼손하고 앞으로 수년간 적들을 대담하게 만들 것입니다."
 USA_early_2000s_energy_crisis: "에너지 위기"
 USA_early_2000s_energy_crisis_desc: "Disruptions in the global oil market and the instability in the Middle East has caused an uptick in consumption as people are looking for the best possible price and gas which has inversely lead to a increase in consumption of oil and oil-based products causing additional shortages and issues."
 usa_economic_events.36.t: "대불황의 여파"
 usa_economic_events.36.d: "The American media and economy is reporting more and more startling numbers by the minute. The collapse continues to shake the very core and foundations of the world economy causing rippling effects from everywhere from Argentina to Greece to New Zealand. No one around the globe has been left unaffected by this Lesser Depression. Time will tell truly how far this will harm..."
 usa_economic_events.36.a: "유동성을 투입하라!"
 usa_economic_events.36.b: "자유 시장은 자유로워야 한다..."
 usa_economic_events.37.t: "미국 자동차 산업 위기"
 usa_economic_events.37.d: "이미 판매 감소와 누적되는 부채로 어려움을 겪고 있던 자동차 산업은 신용 위기가 심화되면서 이제 파국적인 붕괴에 직면했습니다. 빅3 자동차 제조사(제너럴 모터스, 포드, 크라이슬러)는 수십억 달러를 쏟아내며 출혈을 겪고 있으며, 정부의 즉각적인 개입이 없다면 몇 달 안에 파산에 몰릴 수 있다고 경고하고 있습니다. 디트로이트뿐만 아니라 전국에 걸친 공급망 전체에서 수천 개의 일자리가 위태로운 상황입니다. 이제 문제는 워싱턴이 많은 이들이 미국 제조업 역량의 상징으로 여기는 산업을 구제할 것인지, 아니면 시장의 힘이 그 운명을 결정하게 놔둘 것인지입니다..."
 usa_economic_events.37.a: "이보다 더 나빠질 수 있을까?"
 usa_economic_events.38.t: "2000년대 에너지 위기"
 usa_economic_events.38.d: "세계적 수요 증가, 중동의 지정학적 불안정, 상품 시장의 투기에 힘입어 유가가 전례 없는 수준으로 치솟았습니다. 휘발유 가격이 끊임없이 오르면서 미국 소비자들은 주유소에서 고통을 느끼고 있으며, 이미 경기 침체로 타격을 입은 가계 예산은 더욱 압박받고 있습니다. 에너지 위기는 경제 전반에 파문을 일으키고 있습니다. 운송비는 치솟고, 항공사들은 고전하며, 연료에 의존하는 기업들은 이윤 폭이 증발하는 것을 지켜보고 있습니다. 한편 미국인들이 변동성 큰 석유 시장에 대한 취약성을 깨달으면서 에너지 독립과 대체 연료원에 대한 요구가 커지고 있습니다. 문제는 이것이 일시적인 급등인지, 아니면 값비싼 에너지의 새로운 시대의 시작인지입니다..."
 usa_economic_events.38.a: "Well, the price of gas will certain be over $2.00!"
 usa_economic_events_news.7.t: "2000년대 에너지 위기"
 usa_economic_events_news.7.d: "Oil prices have reached record highs across global markets. Energy analysts predict that fuel costs will remain elevated for the foreseeable future as demand continues to outpace supply. It will truly be interesting to see whether or not the world will just have to pay more for this high oil prices or will the world look for alternatives in this ever changing world."
 usa_economic_events_news.7.a: "또 하루... 또 다른 경제 위기..."
 usa_economic_events.37.b: "돈을 퍼부어 해결되는지 보자..."

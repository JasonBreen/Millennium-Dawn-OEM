 USA_ban_election_fraud: "선거 부정 사건 중지"
 USA_ban_election_fraud_desc: "의회가 선거 조작을 금지합니다. 대통령 선거에서 부정 선택지가 더 이상 나타나지 않습니다. 이 효과가 유지되는 동안 선거 부정 사건이 발생하지 않습니다."
 USA_allow_election_fraud: "선거 부정 사건 허용"
 USA_allow_election_fraud_desc: "의회가 선거 부정 금지를 철회합니다. 대통령 선거가 다시 조작될 수 있으며, 선거 부정 사건이 발생하기 시작합니다."
 department_of_state.201.t: "아프가니스탄, 복귀를 요청"
 department_of_state.201.d: "탈레반이 우리가 떠난 땅을 되찾고 있습니다. [AFG.GetLeader]은(는) 카불이 함락되기 전에 우리 병력을 다시 보내 임무를 재개해 달라고 요청했습니다."
 department_of_state.201.a: "그들을 버리지 않겠다"
 department_of_state.201.b: "아프가니스탄은 스스로 일어서야 한다"
 department_of_state.202.t: "미국, 복귀를 거부"
 department_of_state.202.d: "워싱턴이 우리의 요청을 거절했습니다. 미군은 돌아오지 않을 것이며, 우리는 탈레반에 맞서 스스로 전선을 지켜야 합니다."
 department_of_state.202.a: "그렇다면 홀로 싸우겠다"
 usa.204.t: "비행기가 뱅크 오브 아메리카 플라자에 추락"
 usa.204.d: "테러 공격 몇 달 뒤, 15세 소년이 플로리다 주 탬파에서 경비행기를 훔쳐 뱅크 오브 아메리카 플라자에 고의로 충돌시켰습니다. 이 사건은 그 공격에 영향을 받은 것으로 알려졌습니다. 건물 안에 있던 사람은 아무도 죽거나 다치지 않았으며, 어린 조종사만이 유일한 사망자였습니다."
 usa.204.a: "공격의 불안한 메아리"
 raid_type_raid_baath_desc: "특수부대가 이라크에서 여전히 도피 중인 바트당 고위 지도자들을 추적하여 체포하고, 구 정권의 잔당을 와해시킵니다."

 USA_treason_event.12.o4: "나는 양념을 사랑한다, 이 맛들은 뭐죠"
 USA_treason_event.13.t: "개혁 공화국 연립 \\"2008\\""
 USA_treason_event.13.d: "당신이 체제를 너무 심하게 이긴 나머지 어딘가 망가진 모양입니다. 더 부숴 보시겠습니까? 국민전선당과 양치기당이 있습니다. 어느 연립으로 유리창을 깨시겠습니까."

 romania_misc.19.d: "독일 방산 기업 라인메탈이 메디아슈에 본사를 둔 루마니아의 유서 깊은 차량 시스템 제조업체 오토메카니카 SA의 인수를 마무리했습니다. 이번 조치는 동유럽 전역의 산업 역량을 확대하려는 독일의 광범위한 전략의 일환으로 평가되며, 현지 생산 라인을 현대화하고 부쿠레슈티와 베를린 간의 군사·산업 유대를 심화할 것으로 예상됩니다."

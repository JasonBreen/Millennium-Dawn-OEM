 usa_rom_trade: "미국 루마니아 무역 관계"
 ROM_political_scene: "루마니아 정치 지형"
 ROM_political_scene_desc: "If there was a word to describe the political scene, volatile would be the one. The PSDR seeks to establish control over the country while the remains of the CDR struggle to reorganize, right as the PNL and PRM look for ways to make easy political gains. Now we have to ask, where will our country go from now?"
 ROM_political_parties: "루마니아 정당"
 ROM_political_parties_desc: "좌파? 있습니다! 우파? 있습니다! 포괄 정당? 그것도 있습니다. 어떤 성향, 어떤 규모, 어떤 종류든 우리에겐 모두 있습니다."
 ROM_national_liberal_party: "국민자유당"
 ROM_national_liberal_party_desc: "1875년에 창당되어 공산 정부에 의해 금지되었다가 1990년 혁명 직후 재창당된 PNL은 루마니아에서 가장 큰 자유주의 운동을 대표합니다. 처음에는 CDR의 일원이었으나, 집권 과정에서의 결속력 부족으로 탈퇴했습니다."
 ROM_freedom_of_the_individual: "개인의 자유"
 ROM_freedom_of_the_individual_desc: "한 나라에서 가장 중요한 것은 개인의 자유에 대한 권리이며, 우리는 이를 지켜야 합니다."
 ROM_improve_press_freedom: "언론 자유 개선"
 ROM_improve_press_freedom_desc: "우리 언론은 공산주의 시대에 크게 고통받았습니다. 그러니까 당이 소유한 신문이 단 하나뿐이었으니, 고통받았다는 말이 농담이 아니라 사실상 존재하지 않았다는 뜻입니다. 어쨌든 우리는 전망을 정말로 개선해야 합니다."
 ROM_defend_civil_society: "시민사회 수호"
 ROM_defend_civil_society_desc: "Past Governments have almost consistently tried to opress the civil society, from the Golaniada to the Mineriads. We must make sure we protect our society from future harm"
 ROM_minority_rights_bill: "소수민족 권리 법안"
 ROM_minority_rights_bill_desc: "Be it a hungarian, tatar, turk or bulgarian, from now on every one of them will enjoy equal rights with a Romanian. From bilingual signs, to the right to give out the BAC in their mother language, we hope this will ease off ethnic tensions."
 ROM_focus_on_our_identity: "우리 정체성에 집중"
 ROM_focus_on_our_identity_desc: "Our identity is unique: a latin island in a slavic sea. We must cherish our background and origins, while also working on better understanding it."
 ROM_preserve_our_cultural_identity: "문화적 정체성 보존"
 ROM_preserve_our_cultural_identity_desc: "미래 세대가 우리의 문화와 정체성을 이해하고 존중하도록 가르쳐야 합니다."
 ROM_revive_bratianu_legacy: "브러티아누 가문의 유산 부활"
 ROM_revive_bratianu_legacy_desc: "브러티아누 가문은 PNL의 창시자이자 오늘날 루마니아가 존재하는 이유입니다. 이들은 영리한 책략으로 루마니아 왕국을 세우고 독립 전쟁과 제1차 세계 대전 모두에서 승리로 이끌었습니다. 그들의 유산은 잊혀서는 안 됩니다."
 ROM_improve_bor_relations: "BOR과의 관계 개선"
 ROM_improve_bor_relations_desc: "루마니아 정교회는 매우 중요한 기관이며, 우리의 안정을 보장하려면 그들과 긴밀하고 긍정적인 관계를 유지해야 합니다."
 ROM_european_identity: "루마니아의 유럽 정체성 함양"
 ROM_european_identity_desc: "루마니아는 동양과 서양이 만나는 교차로, 유럽의 한복판에 있습니다. 우리는 우리가 어디에 속하는지, 무엇을 해야 하는지 알고 있지만, 국경 너머의 형제들과 공유하는 정체성, 즉 유럽 정체성을 우리 국민이 자각하도록 해야 합니다."
 ROM_european_security: "유럽 안보에 기여"
 ROM_european_security_desc: "It is essential we contribute to the defense of european ideals by participating in training exercises and providing our resource pool to our allies."
 ROM_eu_work_contracts: "EU와 노동 계약 체결"
 ROM_eu_work_contracts_desc: "루마니아에서의 유럽 학력이 인정되고 그 반대도 인정되는 협정을 체결하면 전문 서비스라는 새로운 수출 분야를 창출할 수 있습니다. 이렇게 하면 루마니아 시민의 일상도 개선될 것입니다."
 ROM_through_oursleves: "우리 스스로의 힘으로"
 ROM_through_oursleves_desc: "By lower our dependence on foreign countries while increasing our independence we can guarantee the prosperity of Romania. Only through our ourselves will we triumph!"
 ROM_pnl_economic_reforms: "루마니아 경제 개혁"
 ROM_pnl_economic_reforms_desc: "경제는 지난 30년 가까이 엉망이었으며, 임시방편의 개혁은 우리의 상황을 악화시켰을 뿐입니다. 나라를 구하려면 진정한 종합적 조치가 필요합니다."
 ROM_continue_privatization: "국영 기업 민영화 지속"
 ROM_continue_privatization_desc: "많은 국영 기업은 부담이 되고 있으며, 이들을 민영화하면 수입이 늘 뿐 아니라 파산에서 구할 수도 있습니다."
 ROM_decentralization_of_the_state: "국가 분권화"
 ROM_decentralization_of_the_state_desc: "루마니아는 전체적으로 부쿠레슈티에 의존하고 있습니다. 권력을 분산하면 모든 군에서 균등하게 경제 발전을 촉진할 수 있습니다."
 ROM_special_economic_zones: "경제특구 조성"
 ROM_special_economic_zones_desc: "루마니아에는 특별한 관심이 필요하고 더 중요한 지역이 있습니다. 경제특구를 설립하면 우리 경제의 핵심 지역에 직접 투자를 유치할 수 있습니다."
 ROM_enact_tax_cuts: "감세 시행"
 ROM_enact_tax_cuts_desc: "세금이 줄면 국민이 투자하고 소비할 돈이 늘어나고, 이는 우리에게도 더 많은 돈이 된다는 뜻입니다. 간단합니다!"
 ROM_liberalize_prices: "가격 자유화"
 ROM_liberalize_prices_desc: "무역 관세와 장벽을 없애면 소비자 가격을 낮추고 자유 시장 경제로의 보다 일관된 전환을 보장할 수 있습니다."
 ROM_maintain_the_role_of_the_state: "국가의 역할 유지"
 ROM_maintain_the_role_of_the_state_desc: "All these liberal reforms and fine and dandy, but it's imperative that we maintain the role of the State in every day affairs."
 ROM_pnl_education_reform: "루마니아 교육 개혁"
 ROM_pnl_education_reform_desc: "과거의 개혁은 교육 체계가 가라앉는 것을 막지 못했지만, 어쩌면 우리는 성공할지도 모릅니다."
 ROM_consumer_protection_measures: "소비자 보호 조치"
 ROM_consumer_protection_measures_desc: "품질과 수량에 관해서는 소비자가 기업의 처분에 맡겨져 있습니다. 소비자를 돕는 새로운 조치를 마련하면 부당한 행위로부터 소비자를 보호할 수 있습니다."
 ROM_opening_the_romanian_market: "루마니아 시장 개방"
 ROM_opening_the_romanian_market_desc: "루마니아는 외국 기업들에게 아직 개척되지 않은 시장이며, 1,800만 명이 넘는 소비자가 이들의 제품을 구매하기를 기다리고 있습니다. 이 모든 개혁이 외국 기업의 우리에 대한 신뢰를 높였고, 이제 마침내 우리의 내수 시장을 그들의 투자와 제품에 개방할 수 있습니다."
 ROM_lessen_trade_regulations: "무역 규제 완화"
 ROM_lessen_trade_regulations_desc: "시장을 개방하면 장기적인 번영과 수입을 늘릴 수 있습니다."
 ROM_flat_tax_system: "루마니아 정률세 제도"
 ROM_flat_tax_system_desc: "The tax system is flawed, but not because it's bad, but because past legislatures were unable to commit to the needed reforms to increase our tax absorbtion. The flat tax system works as intended, but we need some small reforms and more creativity to make it work perfectly."
 ROM_free_economy: "자유 경제"
 ROM_free_economy_desc: "관료주의를 줄이고 개혁을 도입함으로써 우리는 신분과 재산에 관계없이 모든 루마니아인이 참여하고 투자할 수 있는 자유 경제를 만들어 냈습니다. 이제 거리 모퉁이마다 가족이 운영하는 작은 가게나 제품을 팔 새로운 시장을 찾는 대기업이 있습니다. 이제 루마니아는 마침내 번영하고 있습니다."
 ROM_peasants_party: "The National Peasant's Party"
 ROM_peasants_party_desc: "The PNTCD is the legal successor of the PNT of old, a major political party back in the 30s. Currently, they and the PNL-T form the governing alliance of the CDR but repeated failures and crisis have significantly weakened their ability to govern and eroded the trust of the Romanian society in them."
 ROM_opportunities_for_all_romanians: "모든 루마니아인을 위한 기회"
 ROM_opportunities_for_all_romanians_desc: "Be it you are from a major city or from small village, all Romanians deserve equal opportunities for their future."
 ROM_path_of_growth: "성장의 길"
 ROM_path_of_growth_desc: "성장은 잘 계획되고, 지속 가능하며, 장기적이어야 합니다. 그렇지 않으면 우리는 스스로 재앙을 자초하는 것입니다."
 ROM_bolster_small_enterprise: "소기업 육성"
 ROM_bolster_small_enterprise_desc: "By removing certain taxes and streamlining the paperwork we can increase the output of small enterprises and promoting the creation of new autochton businesses."
 ROM_young_businesses_fund: "청년 기업 기금"
 ROM_young_businesses_fund_desc: "청년들이 회사를 세울 수 있도록 금전적 지원을 제공하는 스타트업 지원 프로그램을 마련하면 다가올 도전에 더 잘 대비하게 하고, 청년 주도 기업의 성장을 촉진하며, 새로운 일자리를 창출할 수 있습니다."
 ROM_increase_the_minimum_wage: "최저임금 인상"
 ROM_increase_the_minimum_wage_desc: "최저임금의 소폭 인상은 누구에게도 해가 되지 않으며 어려운 이들의 삶을 조금 더 수월하게 해 줄 것입니다."
 ROM_invest_in_urban_centres: "도시 중심지 투자"
 ROM_invest_in_urban_centres_desc: "Better infrastructure is key to the efficency and happiness of our population. Adding some parks, modernizing some avenues and creating new pedestrian only areas will surely improve the every day life of our citizens."
 ROM_backbone_of_romania: "루마니아의 근간"
 ROM_backbone_of_romania_desc: "Most of our country still lives in the rural countryside, and even if their access to basic necesities like education, healthcare, water and gas, they are still forced to pay taxes like the urban population all the while living less and making less. It's in our best interests to help them."
 ROM_uplift_countryside_infrastructure: "농촌 기반시설 개선"
 ROM_uplift_countryside_infrastructure_desc: "Countryside infrastructure in ruin. Very few villages have access to electrcity or running water, and thus they live in poverty. By establishing a Poverty Reduction Fund we can slowly uplift all these settlements from the mud and modernize the rural infrastructure."
 ROM_linking_secluded_villages: "외딴 마을 연결"
 ROM_linking_secluded_villages_desc: "도로 하나하나, 철도 하나하나로 우리는 루마니아를 연결할 것입니다."
 ROM_sustainable_agriculture_initiative: "지속 가능한 농업 구상"
 ROM_sustainable_agriculture_initiative_desc: "루마니아 농업은 지속 가능하지 않습니다. 농부들은 허용량의 두 배에 달하는 살충제를 사용하고 이익을 극대화하기 위해 농산물에 온갖 약물을 주입합니다. 이러한 관행을 금지하고 농업 중심 교육에 투자하면 차츰 지속 가능하게 만들 수 있습니다."
 ROM_drought_recovery_fund: "가뭄 복구 기금"
 ROM_drought_recovery_fund_desc: "더 큰 문제를 해결하지는 못하겠지만, 가뭄 구호 기금을 조성하면 농민들이 짊어진 부담을 덜어 주는 데 도움이 될 것입니다."
 ROM_poverty_reduction_programs: "빈곤 감소 프로그램"
 ROM_poverty_reduction_programs_desc: ""
 ROM_improve_education_access: "교육 접근성 개선"
 ROM_improve_education_access_desc: "더 나은 미래의 열쇠는 교육받은 국민입니다. 농촌 학교 기반시설을 개선하고 교사를 더 채용하는 데 필요한 조치를 하고, 더 많은 사람이 이 직업을 택하도록 정기적인 급여 인상도 시행할 것입니다."
 ROM_subsidies_for_the_unemployed: "실업자 보조금"
 ROM_subsidies_for_the_unemployed_desc: "어떤 이들에게 그들은 비생산적인 해충이지만, 우리에게는 그저 불운한 사람들입니다. 구직하는 동안 생계를 유지하도록 돕는 기금을 조성하면 이들이 빈털터리가 되어 노숙하는 최악의 결과를 막을 수 있습니다."
 ROM_just_economy: "정의로운 경제"
 ROM_just_economy_desc: "다양한 구상을 통해 우리는 농촌과 도시의 격차를 좁히고, 배경에 관계없이 모든 루마니아인이 참여하도록 초대받는 경쟁력 있는 경제를 만들어 냈습니다."
 ROM_protect_cultural_rights: "루마니아 문화적 권리 보호"
 ROM_protect_cultural_rights_desc: "우리의 문화는 독특하고 고립되어 있으며, 그렇기에 이를 보호하는 것이 매우 중요합니다."
 ROM_social_reconciliation_initiatives: "사회 화합 구상"
 ROM_social_reconciliation_initiatives_desc: "우리 사회는 공산주의로 인해 심하게 훼손되었습니다. 사회적 결속을 회복하고 우리의 역량에 투자함으로써, 오랫동안 우리를 붙잡아 온 이 상처를 마침내 딛고 나아갈 수 있습니다."
 ROM_pardon_former_regime_figures: "전 정권 인사 사면"
 ROM_pardon_former_regime_figures_desc: "As hypocrtical as it may sound, some people who participated within the regime and helped it should be pardoned. Why? Because these people did not agree in principle with the ideas, and worked with it in the hopes of reforming it from inside and creating a better Romania. In this case, if they are truly free of sin, they shall be forgiven."
 ROM_focus_on_social_unity: "사회 통합에 집중"
 ROM_focus_on_social_unity_desc: "We must cast our social differences and work together to build a better society and future for our country."
 ROM_human_rights_act: "인권법"
 ROM_human_rights_act_desc: "'...all men are created equal, that they are endowed by their by their Creator with certain unalienable Rights...' or something like that."
 ROM_desovietization_of_romania: "루마니아의 탈소비에트화"
 ROM_desovietization_of_romania_desc: "Even after the Revolution of '89, the long shadow of communism looms over Romania. We must make people aware of the crimes. humiliation and suffering the illegal communist regime imposed on us, all the while banning communist political propaganda and any parties advocating for this criminal ideology."
 ROM_adopt_lustration_laws: "정화법 채택"
 ROM_adopt_lustration_laws_desc: "People and politicians who helped the regime should not be able to escape punishment. By adopting lustration laws, we can scrutanize politicians with past communist ties or those individuals who collaborate with the regime or the SECURITATE regardless of when, how or why."
 ROM_redeem_anti_communists: "반공 반체제 인사 복권"
 ROM_redeem_anti_communists_desc: "공산 정권에 맞서 싸운 이들의 명예를 회복시키는 것이 중요합니다. 물론 철위단과 관련된 이들을 중심으로 몇몇 예외는 있겠지만, 그 밖에는 논란이나 문제가 생기지 않을 것입니다."
 ROM_investigate_former_regime_pawns: "구 정권의 앞잡이 조사"
 ROM_investigate_former_regime_pawns_desc: "공산 정권의 협력자들은 정당한 사유가 없는 한, 세쿠리타테를 적극적으로 도우며 달리 얻지 못했을 정보를 제공함으로써 저지른 범죄에 대해 조사를 받아야 합니다."
 ROM_reinforce_christian_morality: "기독교 도덕 강화"
 ROM_reinforce_christian_morality_desc: "At the end of the day, we are a christian population, even if we belong to different denominations. We should not let the perversions of the BOR hinder the Christian teachings of love, compassion and unity."
 ROM_crackdown_on_crime: "범죄 단속"
 ROM_crackdown_on_crime_desc: "조직범죄는 우리 영토에 발붙일 곳이 없습니다."
 ROM_moral_romania: "도덕적인 루마니아"
 ROM_moral_romania_desc: "루마니아는 계속해서 미래를 향해 나아가고 있으며, 이제는 길잡이가 되어 또 다른 악몽을 막아줄 일정한 원칙을 갖추었습니다."
 ROM_pd: "민주당"
 ROM_pd_desc: "1992년 탈공산주의 전환기에 창당된 민주당(PD)은 국내 정치에서 강력한 세력으로 자리 잡았습니다. 민주주의 제도의 공고화와 사회민주주의 육성, 복지국가 강화를 주창하는 민주당은 사회민주당(PDSR)의 표를 상당수 빼앗아 올 것이 분명하며, 어쩌면 차기 대통령까지 배출할 수도 있습니다."
 ROM_social_democratic_roots: "우리의 사회민주주의 뿌리"
 ROM_social_democratic_roots_desc: "사회 정의와 평등, 민주적 가치에 대한 헌신을 재확인함으로써 우리의 사회민주주의 유산을 기리고, 이러한 원칙이 앞으로도 정책의 지침이 되도록 하겠습니다."
 ROM_strengthen_democratic_institutions: "민주 제도 강화"
 ROM_strengthen_democratic_institutions_desc: "민주주의를 지키기 위해 민주 제도를 강화하는 데 주력하여, 모든 시민의 이익을 위해 투명하고 효과적으로 운영되도록 하겠습니다."
 ROM_european_social_democracy: "유럽 사회민주주의"
 ROM_european_social_democracy_desc: "유럽 사회민주주의의 기준에 발맞추고 대륙 전역의 모범 사례를 도입하여 사회 정책과 경제 전략을 향상시키는 것을 목표로 합니다."
 ROM_reinforce_social_services: "사회 서비스 강화"
 ROM_reinforce_social_services_desc: "취약 계층을 더 잘 지원하고 모든 루마니아인이 필수적인 서비스와 지원을 받을 수 있도록 사회 서비스에 투자하고 이를 강화하겠습니다."
 ROM_gender_equality_initiatives: "성평등 추진"
 ROM_gender_equality_initiatives_desc: "우리 행정부는 공적·사적 삶의 모든 영역에서 평등한 기회를 증진하기 위해 성평등 정책을 시행하고, 진정한 양성 평등을 위해 노력하겠습니다."
 ROM_power_to_local_administrations: "지방 행정에 권한 이양"
 ROM_power_to_local_administrations_desc: "지방 행정에 더 많은 권한을 이양하여 지역 정부가 현지의 수요에 보다 효과적으로 대응할 수 있게 하고, 통치에 대한 풀뿌리 참여를 확대하겠습니다."
 ROM_promote_sensible_privatization: "합리적인 민영화 추진"
 ROM_promote_sensible_privatization_desc: "민영화에 대해 균형 잡힌 접근을 취하여 공공의 이익을 지키고 공정한 결과를 보장하면서, 국유 자산의 합리적이고 전략적인 민영화를 추진하겠습니다."
 ROM_fund_scientific_innovation: "과학 혁신 지원"
 ROM_fund_scientific_innovation_desc: "과학 혁신에 대한 투자는 우리의 발전에 필수적입니다. 연구 개발 자금을 늘려 기술 진보와 경제 성장을 이끌겠습니다."
 ROM_lower_taxes_for_small_businesses: "소기업 세금 인하"
 ROM_lower_taxes_for_small_businesses_desc: "경제 성장과 기업가 정신을 뒷받침하기 위해 소기업의 세금을 낮추어, 이들이 번창하고 일자리를 창출하는 데 필요한 자원을 제공하겠습니다."
 ROM_social_market_model: "루마니아식 사회적 시장 모델"
 ROM_social_market_model_desc: "자유시장 자본주의와 강력한 사회 정책의 균형을 맞추어, 모든 루마니아인에게 이바지하는 공정하고 역동적인 경제를 만들어야 합니다."
 ROM_wall_against_authoritarianism: "권위주의에 맞선 장벽"
 ROM_wall_against_authoritarianism_desc: "민주주의를 지키려면 권위주의적 경향에 맞서 견고한 방어선을 구축하여 우리의 정치 제도가 자유롭고 공정하게 유지되도록 해야 합니다. 굳이 말하자면 장벽입니다만, 불가리아 국경에 세우는 것은 아닙니다. 아직은 말이죠."
 ROM_conservative_branding: "보수 노선 표방"
 ROM_conservative_branding_desc: "국민이 우경화하고 있는 것이 분명하니, 우리도 적응해야 합니다."
 ROM_romanian_neoliberalism: "루마니아식 신자유주의"
 ROM_romanian_neoliberalism_desc: "신자유주의, 어감이 꽤 괜찮지 않습니까? 규제 완화와 시장 주도 성장에 집중하여 경제 발전과 혁신을 촉진해야 합니다."
 ROM_limit_social_spending: "사회 지출 제한"
 ROM_limit_social_spending_desc: "장애인 따위 알 게 뭡니까! 돈이나 축내는 불한당들!! 경제를 안정시키고 그 자원을 핵심 경제 부문에 재투자하기 위해 사회 지출을 제한하고 삭감하겠습니다."
 ROM_promote_romanian_traditionalism: "루마니아 전통주의 장려"
 ROM_promote_romanian_traditionalism_desc: "우리의 문화유산과 가치를 강화하고 이를 국가 정책과 공적 생활에 녹여냄으로써 루마니아식 삶의 방식을 장려할 수 있습니다."
 ROM_oppose_socialist_dictatorship: "사회주의 독재 반대"
 ROM_oppose_socialist_dictatorship_desc: "우리는 어떠한 형태의 사회주의 독재에도 단호히 맞서 민주적 자유를 수호하고, 통치가 책임 있고 투명하게 유지되도록 해야 합니다."
 ROM_slash_corporate_taxation: "법인세 대폭 인하"
 ROM_slash_corporate_taxation_desc: "빌 게이츠! 부쿠레슈티에 마이크로소프트 사무실을 세워 주신다면 제 목숨은 당신 것입니다! 어쨌든 경제 활동을 촉진하고 투자를 유치하기 위해 법인세를 대폭 인하하여, 기업 성장에 더욱 유리한 환경을 조성하겠습니다."
 ROM_speed_up_privatization: "민영화 가속"
 ROM_speed_up_privatization_desc: "민영화 절차를 가속화하여 국영 기업을 민간 부문으로 이전하고, 효율성과 경쟁력을 높이겠습니다."
 ROM_fight_bloated_bureaucracy: "비대한 관료제와의 싸움"
 ROM_fight_bloated_bureaucracy_desc: "정부 운영을 간소화하고 불필요한 행정 절차를 줄여 효율성과 행정 서비스 제공을 개선함으로써, 비대한 관료제와 싸우는 것이 중요합니다."
 ROM_hardline_against_immigration: "이민에 대한 강경 노선"
 ROM_hardline_against_immigration_desc: "아니, 내 루마니아 땅에 이민자는 안 됩니다. 아, 정확히는 불법 체류자, 아랍인, 아프리카인, 무슬림, 유... 어, 제 말은 그러니까... 국경을 안전하게 지키고 이민 정책을 엄격히 집행하기 위해 이민에 대해 강경한 입장을 취하겠습니다."
 ROM_condemn_ceausescu: "차우셰스쿠 정권 공식 규탄"
 ROM_condemn_ceausescu_desc: "차우셰스쿠는 악인이었으나, 지금까지 어느 정부도 그의 범죄를 실제로 규탄하려는 노력을 기울이지 않았습니다. 우리가 그 일을 할 것이며, 그와 동시에 민주주의 원칙과 인권에 대한 우리의 헌신을 재확인하겠습니다."
 ROM_free_market: "자유시장"
 ROM_free_market_desc: "국가 개입을 줄이고 시장의 힘이 성장과 혁신을 이끌도록 하는 자유시장 경제를 옹호하겠습니다."
 ROM_the_true_european_party: "진정한 유럽 정당"
 ROM_the_true_european_party_desc: "우리가 바로 유럽 정당입니다. EU 가입을 추구하는 것은 바로 우리이며, 그것을 이루어낼 이들도 바로 우리입니다."
 ROM_promote_european_investment: "유럽 투자 장려"
 ROM_promote_european_investment_desc: "루마니아에 대한 유럽의 투자를 적극적으로 장려하여 투자자에게 매력적인 환경을 조성하고 경제 성장을 도모하겠습니다."
 ROM_defend_liberal_democracy: "자유민주주의 수호"
 ROM_defend_liberal_democracy_desc: "우리는 자유민주주의를 수호하는 데 전념하여, 민주 제도가 굳건하게 유지되고 우리의 자유가 어떠한 위협으로부터도 지켜지도록 하겠습니다."
 ROM_expand_atlantic_ties: "대서양 관계 확대"
 ROM_expand_atlantic_ties_desc: "워싱턴에 더욱 가까이 다가가 미국 친구들과의 관계를 개선하는 것이 우리의 국익에 부합합니다."
 ROM_military_cooperation_initiative: "군사 협력 구상"
 ROM_military_cooperation_initiative_desc: "방위 역량을 강화하기 위해 동맹국과 군사 협력을 시작하여 합동 작전과 전략적 조율을 강화하겠습니다."
 ROM_european_education_standards: "유럽 교육 기준"
 ROM_european_education_standards_desc: "교육 제도를 유럽 기준에 맞추어 질과 접근성을 개선하고, 우리의 노동력이 세계 경제에서 경쟁력을 갖추도록 하겠습니다."
 ROM_european_romania: "유럽의 루마니아"
 ROM_european_romania_desc: "우리가 있을 곳은 유럽이며, 다른 어느 곳도 아닙니다."
 ROM_monarchy_debate: "군주제 논쟁"
 ROM_monarchy_debate_desc: "We have won the election and we can finally open up the debate on the Monarchy. After some internal discussion with our partners, we decided its best to hold a referendum so that the return of the Monarchy is legitimate and legal."
 ROM_unite_monarchists_in_the_coalition: "연립 내 군주제 지지자 결집"
 ROM_unite_monarchists_in_the_coalition_desc: "Every major political party has at least a monarchist member- be it in the PDSR, or PRM or PNL. If we manage to unite these idealists, we can create a powerful coalition to help managing the referendum and, most importantly, it's results."
 ROM_organize_monarchist_rallies: "군주제 지지 집회 조직"
 ROM_organize_monarchist_rallies_desc: "전국의 모든 군주제 지지자에게 집결을 호소하여 우리의 대의를 더욱 눈에 띄게 만들겠습니다."
 ROM_return_royal_estates: "왕실 재산 반환"
 ROM_return_royal_estates_desc: "The royal estates were forcefully nationalized by the communist government in 1948. We shall take measures to make sure they are returned to the Royal Family and, mosty importantly, remain available for the larger public to visit."
 ROM_gain_diaspora_support: "해외 동포의 지지 확보"
 ROM_gain_diaspora_support_desc: "우리가 이처럼 거대한 해외 동포 사회를 갖게 된 유일한 이유는 과거 정부들의 무능과 실정 때문입니다. 영국, 베네룩스, 스칸디나비아의 루마니아인들은 군주제 아래 사는 이점을 알고 있기에, 우리의 대의를 알리는 데 기꺼이 힘을 보탤 것입니다."
 ROM_utilize_the_media: "언론 활용"
 ROM_utilize_the_media_desc: "전략적인 투자와 보조금은 누구에게도 해가 되지 않으며, 엄밀히 말해 뇌물이 아니기에 우리가 책임을 질 일도 없습니다."
 ROM_referendum_concludes: "국민투표 종료"
 ROM_referendum_concludes_desc: "진실의 순간입니다. 우리는 군주제 지지 운동을 위해 할 수 있는 모든 것을 다했으며, 그것이 충분했기를 바랄 뿐입니다."
 ROM_monarchist_victory: "군주제의 승리"
 ROM_monarchist_victory_desc: "At long last, we have undone of the mistakes of history! Monarchism has triumphed and Romania can once again embrace it's natural state as a Kingdom!"
 ROM_michael_returns: "미하이 국왕의 귀환"
 ROM_michael_returns_desc: "오늘, 정부의 초청에 따라 왕좌에 복귀하기 위해 미하이 국왕이 오토페니 공항에 도착하여, 환호하는 수많은 지지자와 귀빈의 환영을 받았습니다. 온 국민이 그의 귀환을 간절히 기다린 가운데, 사랑하는 군주의 치세 아래 새로운 장을 열 준비를 하며 기대감이 공기를 가득 채우고 있습니다. 화려한 의식 속에서 낙관적인 분위기가 널리 퍼지고 있으며, 미하이 국왕의 존재는 우리 조국에 더 밝은 미래가 밝아오고 있음을 알리는 신호입니다."
 ROM_matters_of_the_economy: "경제 문제"
 ROM_matters_of_the_economy_desc: "루마니아 경제는... 좋게 말해도 실망스럽습니다. 무엇이 모든 문제를 일으키고 있는지 살펴보고 어떻게 해결할 수 있을지 알아봐야 합니다."
 ROM_modern_economics: "현대 경제학"
 ROM_modern_economics_desc: "모든 것이 엉망이고 제대로 돌아가는 것이 없습니다. 실제 경제학자는 단 한 명도 없고, 전문 인력과 전문가의 부족은 언급하기조차 입이 아픕니다. 게다가 인플레이션과 무역을 다루는 데 여전히 낡은 방식을 쓰고 있습니다. 적어도 방식을 갱신하고 경제 교육에 투자하여, 앞으로 함께 일할 사람을 확보할 수는 있습니다."
 ROM_fight_barons: "토호와의 싸움"
 ROM_fight_barons_desc: "우리 사회의 병폐인 토호들은 수많은 주의 지역 경제를 장악하고, 사실상 경쟁이 전무한 지역 단위의 독점을 만들어 냈습니다. 우리는 이들을 무너뜨리고 민간 기업 간의 경쟁을 만들어 발전을 촉진하기 위해 할 수 있는 모든 것을 하겠습니다."
 ROM_strengthen_syndicates: "노동조합 강화"
 ROM_strengthen_syndicates_desc: "Factory workers are dirt poor, and their working conditions are equally terrible. While from an ideological point of view it doesn't make sense, by streghtening and de-politicizing worker unions we can promote economic equality and indirectly punish those companies that exploit Romania for it's cheap labour."
 ROM_safeguard_the_private_sector: "민간 부문 보호"
 ROM_safeguard_the_private_sector_desc: "Past Governments have been changing the Fiscal Code constantly, sometimes overnight, resulting in economic chaos. The private sector had to suffer the most with new taxes and restrictions seemingly out of the blue and it's time to put an end to this practice, and finally let the private sector develop without the risk of it being ran into the ground by economic mismanagement."
 ROM_modernize_ploiesti: "플로이에슈티 현대화"
 ROM_modernize_ploiesti_desc: "플로이에슈티에는 우리의 가장 큰 석유 매장량이 있지만, 안타깝게도 낡은 기계와 전반적인 투자 부족으로 생산이 뒤처졌습니다. 플로이에슈티 정유소를 현대화하는 것은 루마니아를 중요한 경제 강국으로 다시 지도 위에 올려놓기 위한 첫걸음이 될 것입니다."
 ROM_mechanized_farming: "기계화 농업 장려"
 ROM_mechanized_farming_desc: "Iliescu's land reform from the 90s had the good effect of returning state owned land back to the farmers which initially owned them, but the reform wasn't comprehensive, it didn't provide any equipment nor incentive to work the land, thus our agriculture became heavily inefficient. We can help ease the situation by investing in mechanized equipment and subsidizing it to make it accesible to the average farmer, at the same time promoting the use of irrigation networks and private cooperatives among others."
 ROM_seek_new_markets: "신규 시장 개척"
 ROM_seek_new_markets_desc: "Our products must be sold somewhere, but sadly they lack the appeal. The commmunist method of mass producing stuff resulted in our products being cheap and of low quality, permanently damaging its reputation. By creating a new image we can seek out larger markets and increase our trade income."
 ROM_cooperate_with_the_penisula: "반도와의 협력"
 ROM_cooperate_with_the_penisula_desc: "발칸보다 나은 시장이 어디 있겠습니까? 가깝고, 우리는 이미 이 국가들 대부분과 우호적인 관계를 맺고 있습니다. 그들은 질 좋은 제품을 얻고 우리는 몇 푼 더 벌 수 있으니, 서로에게 이득입니다!"
 ROM_balkan_economic_union: "발칸 경제 연합 창설"
 ROM_balkan_economic_union_desc: "유럽 통합도 중요하지만 발칸 통합 또한 중요합니다. 경제 연합을 만들면 자유무역과 이웃 국가 간 물자 유통을 더욱 촉진할 수 있습니다. 이를 통해 더욱 우호적인 관계를 조성하고, 언젠가는 우리의 소박한 블록에 속한 회원국들에게 EU로 가는 문을 열어 줄 수도 있습니다. 그때가 오면 연합은 해체되겠지만, 지금은 그 결실을 거두어야 합니다."
 ROM_quality_products: "고품질 제품에 집중"
 ROM_quality_products_desc: "대부분의 경우 양보다 질이 우선합니다. 품질 중심의 생산에 집중하면 이윤을 극대화할 수 있고, 그에 따라 더 큰 경제 성장과 발전을 이룰 수 있습니다."
 ROM_export_economy: "수출 경제"
 ROM_export_economy_desc: "We import too darn much! How exactly is an economy supposed to develop when we have a trade deficit of over 3 billion dollars?! How is that posible, can we really not make porkchops?? Do we have to import everything from Germany?! We HAVE to balance our trade and increase our export quantities lest we start importing bread from Afghanistan, too. Or are we doing that already? I forgot."
 ROM_balkan_tiger: "발칸의 호랑이"
 ROM_balkan_tiger_desc: "Through clever economic reforms and actual competent management, we were able to develop the romanian economy out of the pit it found itself in. We now represent the strongest market in the Balkans, and our population lives better than ever."
 ROM_restore_the_1923_constitution: "1923년 헌법 복원"
 ROM_restore_the_1923_constitution_desc: "현행 헌법은 루마니아 국민의 열망과 가치를 제대로 반영하지 못하며, 우리의 권리를 지키는 데 중대한 공백을 남겨 우리 나라를 불확실성 속에 표류하게 만들고 있습니다. 민주주의, 법치, 개인의 권리라는 원칙을 구현한 1923년 헌법보다 더 나은 대체물이 어디 있겠습니까. 그 조항들을 복원함으로써 우리는 모든 시민을 위한 자유와 정의, 평등의 가치를 지키겠다는 약속을 재확인합니다."
 ROM_transparency_in_royal_affairs: "왕실 업무의 투명성"
 ROM_transparency_in_royal_affairs_desc: "We live in a new age where information is widely accessible and technology is ever-changing. It's more important than ever for the Royal Family to be transparent and create trust between it and civil society. Afterall, there's no use in hiding where money goes when all it takes is a team of journalists to track the trail down and create a giant scandal that will spread out of control."
 ROM_crown_council: "왕실 평의회 복원"
 ROM_crown_council_desc: "미하이 국왕이 아무리 현명하다 해도 나라를 이끄는 것은 어쨌든 힘든 일입니다. 국왕에게는 국가적으로 중요한 사안을 조언해 줄 사람이 필요하며, 그래서 우리는 옛 왕실 평의회를 복원하기로 결정했습니다. 이 기구는 순수한 자문 역할만을 맡아 국가가 어떤 위기를 겪더라도 국왕을 이끌 것이며, 현직·차기·전직 총리는 물론 왕조 구성원, 정부 인사와 주요 정치인을 모두 포함할 것입니다."
 ROM_rule_of_law: "법치 수호"
 ROM_rule_of_law_desc: "Everyone knows that the rule of law is seemingly a joke nowadays, with politicians and civilians alike laughing in its face while taking bribes or God knows what else. It is our job to uphold the law and make sure its not only respected, but also coherent."
 ROM_fight_corruption: "부패와의 싸움"
 ROM_fight_corruption_desc: "부패는 루마니아의 근간을 위협하는 위험이며, 과거 정부들은 이에 맞서 아무것도 하지 않았습니다. 오히려 부패를 조장했다고 할 수 있습니다. 반부패청을 설립하면 부패가 더는 문제가 되지 않을 때까지 마침내 대책을 시행할 수 있습니다."
 ROM_symbol_of_romanian_unity: "루마니아 통합의 상징"
 ROM_symbol_of_romanian_unity_desc: "Michael represents, above everything else, the unity of the Romanians living both abroad and in the country. His family founded this very nation and brought it to the rank of an european power. Michael now must carry the torch of Ferdinand and Carol, but he shouldn't worry because he has the backing of every Romanian."
 ROM_crown_domains: "왕실 직할령"
 ROM_crown_domains_desc: "Royal dynasties are hard to mantain, and sometimes they live quite the black holes in the budget. But this wasn't always the case, nor does it need to be. Back in the days of the Old Kingdom, we had the Crown Domains: companies and institutions which used their profits to cover any and all expenses of the Royal Family, thus sparing our budget, and whatever surplus remained was reinvested. We can re-establish these domains to help our economic situation and promote development."
 ROM_decommunization: "탈공산화"
 ROM_decommunization_desc: "공산주의는 루마니아가 오늘날 이 모양인 이유입니다. 우리나라가 고통받고 국민이 무기력하게 서 있는 이유이며, 무엇보다 우리 사회가 이토록 타락한 이유입니다. 시간이 지나면 우리는 국민을 현혹했던 거짓을 흩어버리고 마침내 사회를 앞으로 나아가게 할 것입니다."
 ROM_guide_the_parties: "정당 지도"
 ROM_guide_the_parties_desc: "Time has shown again and again that, for the most part, the parties are really lackluster. It is the job of the monarch to guide these parties so they don't get out of line and 'accidentaly' get bought by Lukom-A and become the trumpet of foreign or personal interests. On the subject of Lukom-A, how are they even in Romania..?"
 ROM_peoples_royal_family: "국민의 왕실"
 ROM_peoples_royal_family_desc: "과거와 현재의 많은 왕실이 평민과 교류하지 않는 실수를 저질러 사회를 괴롭히는 문제에 둔감해졌습니다. 하지만 우리는 같은 실수를 하지 않을 것입니다. 우리는 국민의 왕조이며, 국민이 우리에게 속한 만큼 우리도 국민에게 속해 있습니다. 우리의 메시지를 분명히 전하기 위해 최대한 사회에 참여할 것입니다."
 ROM_ban_extremism: "극단주의 금지"
 ROM_ban_extremism_desc: "우익 극단주의도 좌익 극단주의도 모두 나쁩니다. 바딤을 보십시오. 정상적인 사람처럼 보입니까? 아닙니다. 그는 발칸식 인종주의가 놀이터처럼 느껴질 만큼 발언 수위를 높이고 있습니다. 경쟁적인 인종주의를 만들려는 것처럼 보이는데, 무엇보다도 그것이 우려스럽습니다. 어쨌든 우리는 민족주의 정당과 공산주의 정당을 모두 금지하고 온건주의를 적극 장려할 것입니다."
 ROM_resolve_succession: "왕위 계승 문제 해결"
 ROM_resolve_succession_desc: "현재 왕실에는 뚜렷한 후계자가 없습니다. 물론 미하이 국왕의 딸 마르가레타가 있으며 당연한 선택처럼 보이겠지만, 그녀는 아버지만큼 인기가 있지 않습니다. 계승 서열 두 번째 후보인 젊은 니콜라이도 문제를 더합니다. 그는 인기가 있고, 우리의 남자 우선 상속제에 따르면 남성이 우선권을 가집니다. 그러나 이러한 법은 시대에 뒤떨어졌으며 바뀌어야 합니다. 어쨌든 우리는 미하이 국왕이 결정을 내리도록 왕실 평의회를 소집할 것입니다."
 ROM_1947_avenged: "1947년의 복수"
 ROM_1947_avenged_desc: "5 decades. It took 5 decades for our greatest mistake to be undone. Romania, after all this time, has managed to return to its natural form of government: a Monarchy. No longer led by Presidents with shady interests and even shadier pasts, our country is now led by someone who is truly political neutral and only has our best interests at heart: King Michael I. Our country is proud again, and the future seems more bright than ever, but there is still work to be done, and as long as the House of Hohenzollern-Sigmaringen remains on the throne, the work will never stop."
 ROM_outward_perspective: "대외 지향적 관점"
 ROM_outward_perspective_desc: "국경 너머에서 파트너와 미래의 동맹을 찾아야 합니다."
 ROM_monarchism_in_the_balkans: "발칸 군주제 지원"
 ROM_monarchism_in_the_balkans_desc: "소련 전차가 발칸을 휩쓸었을 때, 도나우강 건너의 형제들은 러시아의 총구 앞에서 군주제 제도를 규탄했습니다. 그들은 소련이 붕괴한 뒤에도 이 병든 공화주의 이상을 계속 따르고 있으며, 유럽 이쪽 편에 공화주의가 존재한다는 것 자체가 잘못임을 인정하지 않으려 합니다. 우리는 그들이 올바른 길로 돌아오도록 도울 것입니다."
 ROM_monarch_of_all_romanians: "모든 루마니아인의 군주"
 ROM_monarch_of_all_romanians_desc: "루마니아 국왕은 무엇보다도 모든 루마니아인의 국왕입니다. 이 칭호를 복원함으로써 이웃 국가들의 반발을 살 수도 있지만, 대루마니아의 옛 영토에 대한 영유권 주장을 다시 제기할 수 있습니다."
 ROM_purple_revolution_in_moldova: "몰도바의 보라색 혁명"
 ROM_purple_revolution_in_moldova_desc: "역사적으로 몰도바는 러시아인이 우리에게서 빼앗아 가기 전까지 수백 년 동안 루마니아의 일부였습니다. 그곳 주민들은 수십 년간 이어진 반루마니아 선전에 세뇌되었습니다. 그들은 자신들이 고유한 언어를 쓰고, 우리와는 다른 독자적인 문화와 역사를 가졌다고 생각합니다. 터무니없는 소리입니다! 우리는 통합 지지 운동을 지원하기 시작할 것이며, 머지않아 몰도바가 다시 우리와 함께하기를 바랍니다."
 ROM_house_of_the_hohenzollerns: "호엔촐레른 왕가"
 ROM_house_of_the_hohenzollerns_desc: "우리에게 독립을 안겨 주고 대루마니아를 창조한 것은 호엔촐레른 왕가였으며, 이제 루마니아를 21세기로 이끄는 것도 그들입니다!"
 ROM_negotiations_with_gagauzia: "가가우지야와의 협상"
 ROM_negotiations_with_gagauzia_desc: "가가우지야는 재통합 직전에 몰도바로부터 독립을 선언했습니다. 놀라지 않았다고는 할 수 없지만, 여전히 우리가 처리해야 할 미해결 과제입니다. 전쟁은 누구에게도 도움이 되지 않으며, 이렇게 작은 땅을 두고서라면 더욱 그렇습니다. 가가우즈인과 협상을 시작하여 합의에 이를 수 있는지 살펴볼 것입니다."
 ROM_republican_victory: "공화국의 승리"
 ROM_republican_victory_desc: "도박은 실패했습니다! 그리고 그와 함께 PNTCD는 붕괴할 것이 분명합니다. 우리가 고삐를 쥐고 이 상황에서 건질 수 있는 것을 건져야 합니다."
 ROM_dealing_with_monarchist_backlash: "군주제 지지자들의 반발 대응"
 ROM_dealing_with_monarchist_backlash_desc: "정말 심각합니다. 처음에는 공화주의자들이 국민투표를 실시한다는 것 자체에 분노했고, 이제는 군주제 지지자들이 어쩌다 패배했다는 사실에 격분하고 있습니다! 이 빌어먹을 곳에서는 누구도 만족시킬 수가 없습니다! 상황이 악화되기 전에 군주제 지지자들의 반발에 대처해야 합니다..."
 ROM_reinforce_republicanism: "공화주의 강화"
 ROM_reinforce_republicanism_desc: "남은 국민투표 예산으로 언론에서 공화주의 이상을 홍보하여 압박을 어느 정도 누그러뜨릴 수 있습니다."
 ROM_investigate_royal_corruption: "왕실 부패 조사"
 ROM_investigate_royal_corruption_desc: "This is a move we must make. By pinning the blame on the Dynasty, we can save some face by saying that the PNTCD was bribed into holding the referendum. By doing this, we satisfy the republicans and do a critical blow to the monarchists. Forgive us, your majesty..."
 ROM_1989_redeemed_once_more: "다시 한번 구원받은 1989년"
 ROM_death_of_the_king: "국왕의 서거"
 ROM_death_of_the_king_desc: "우리가 사랑하던 국왕께서 서거하셨고 우리는 다시 한번 군주를 잃었습니다. 지금은 애도하고, 그다음에 어디로 나아갈지 결정할 것입니다."
 ROM_queen_margareta: "마르가레타 여왕"
 ROM_queen_margareta_desc: "미하이 국왕의 맏이가 여왕이 되었습니다. 그녀는 아직 국민의 신뢰를 얻지 못했고 조카만큼 인기도 없기에 치세는 순탄치 않을 것입니다."
 ROM_improve_public_image: "대중 이미지 개선"
 ROM_improve_public_image_desc: "이곳에서는 병원을 방문하고, 저곳에서는 은퇴자 클럽과 토론을 합니다. 이러한 방문은 대중적 이미지를 높이고 사회가 우리에게 갖는 신뢰를 높이는 데 도움이 될 뿐입니다."
 ROM_meeting_with_duda: "두다와의 면담"
 ROM_meeting_with_duda_desc: "사람들이 새 군주를 크게 불신하는 큰 이유가 왕배우자 라두 두다 때문이라는 것은 공공연한 비밀입니다. 으음... 재능이 좀 있는 배우였던 그가 왕배우자가 되었고, 많은 이들이 그와 세쿠리타테의 연관 가능성에 대해 수군거립니다. 왕조의 미래를 위해 여왕 폐하께서 두다와 그의 연루 여부 및 국가의 미래에 대해 긴 대화를 나누시는 것이 필수적입니다."
 ROM_invest_into_education: "교육 투자"
 ROM_invest_into_education_desc: "교육을 개선하고 절실히 필요한 지식인층을 제대로 배출하려면 임시방편 이상의 훨씬 많은 것이 필요합니다."
 ROM_royal_societies: "왕립 학회 설립"
 ROM_royal_societies_desc: "학문 분야와 전문 직종의 발전을 장려하고 지원하기 위해 왕립 지부를 둔 학회를 설립하겠습니다."
 ROM_queen_of_spades: "스페이드 퀸"
 ROM_queen_of_spades_desc: "The Queen, while respected, still lacks the trust and popularity needed to rule effectively. People are still apprehesive about her, and, to some extent, it is justified. Regardless, they still respect her and from every street and doorsill, people can hear the words: Long Live the Queen!"
 ROM_feminism: "페미니즘 이상 강화"
 ROM_feminism_desc: "Equality between the sexes is of upmost priority for us, now even more since we have a woman on the throne...We will take the legislative measures needed to ensure that women and men alike are equal in every aspect of civil life."
 ROM_royal_tours: "왕실 순방"
 ROM_royal_tours_desc: "새로운 군주가 신민을 알아가는 것이 중요합니다."
 ROM_king_nicholas: "니콜라이 국왕"
 ROM_king_nicholas_desc: "미하이 국왕의 조카가 국왕이 되었습니다. 왕조의 맏아들만이 왕국을 통치할 권리를 가진다고 규정한 살리카 법에 따른 것이니 놀랄 일은 아닙니다. 고모인 마르가레타가 사사건건 그에게 도전하려 들어 여전히 가문 내 사정이 어렵기는 하나, 니콜라이는 국민의 지지를 받고 있으며 젊은 국왕은 이미 대중에게 인기가 있음을 입증했습니다."
 ROM_hands_off_approach: "불간섭 방침"
 ROM_hands_off_approach_desc: "It's imperative that the monarch takes a step back from running the country and allow the Government do what it is supposed to do. Of course, he will maintain his rights given to him by the Constitution, but he will only intervene when the situation truly calls for it."
 ROM_protect_the_environment: "환경 보호"
 ROM_protect_the_environment_desc: "루마니아의 자연은 참으로 아름답지만, 안타깝게도 오염과 사익이 이를 서서히 훼손해 왔습니다. 이러한 피해가 영구적이 되지 않도록 막고, 우리 아이들을 위해 환경을 보호해야 합니다."
 ROM_towards_a_common_goal: "공동의 목표를 향하여"
 ROM_towards_a_common_goal_desc: "Farmers, workers, doctors and monarchy alike will need to work towards a common- towards the Romania of Tomorrow."
 ROM_royal_philanthropy: "왕실의 자선 활동"
 ROM_royal_philanthropy_desc: "왕실은 충분한 돈을 가지고 있으며, 그 일부를 정의로운 일에 기부하는 것은 우리 모두에게 이로울 뿐입니다."
 ROM_romania_of_tomorrow: "내일의 루마니아"
 ROM_romania_of_tomorrow_desc: "내일의 루마니아는 오늘의 청년들이 이끌게 될 것입니다. 그들 스스로 우리를 위한 더 밝은 미래를 건설할 수 있도록 그들의 비전과 에너지, 결단력을 키워 주는 것이 중요합니다."
 ROM_king_of_hearts: "하트의 킹"
 ROM_king_of_hearts_desc: "니콜라이는 행동으로 신민들의 존경과 경외를 얻었습니다. 모든 부류의 루마니아인이 젊은 국왕을 자랑스러워하며 지금까지의 통치에 만족하고 있습니다. 거리 모퉁이와 문턱마다 이런 외침이 들립니다. 국왕 폐하 만세!"
 ROM_king_paul: "파울 국왕"
 ROM_king_paul_desc: "Through pure chance or careful maneuvering, the bastard nephew of Carol II has somehow managed to usurp the Romanian throne and see his dream come true."
 ROM_manage_the_parliament: "의회 관리"
 ROM_manage_the_parliament_desc: "아직도 내 통치에 반대할 만큼 어리석은 자들이 있고, 그중 상당수는 의회에서 찾아볼 수 있습니다! 어처구니가 없군요! 일이 손쓸 수 없이 커지기 전에 그 반역적인 기관을 내가 장악하는 것이 필수적입니다."
 ROM_cult_of_the_father: "부친 숭배"
 ROM_cult_of_the_father_desc: "카롤 2세는 루마니아를 위해 해야 할 일을 한 영웅이었습니다. 그가 아니었다면 루마니아는 훨씬 일찍 공산주의라는 재앙에 무너졌을 것이며, 그럼에도 그는 원수와 심지어 자신의 아들에게까지 배신당했습니다. 카롤은 인정과 존경을 받을 자격이 있는 영웅이며, 그의 이미지를 즉시 복원해야 합니다."
 ROM_undo_michaels_reign: "Undo Michaels' Reign"
 ROM_undo_michaels_reign_desc: "미하이는 순진한 이상주의자였고 조국과 국민에 대한 배신자였습니다. 그가 루마니아에 남긴 오점은 즉시 지워져야 합니다."
 ROM_national_conservatism: "민족 보수주의"
 ROM_national_conservatism_desc: "가족, 전통, 종교. 이것들이 새로운 루마니아가 세워질 토대가 될 것입니다."
 ROM_remove_the_foreigners: "외국인 추방"
 ROM_remove_the_foreigners_desc: "찬탈자들을 추방하고 그들에게 충성하는 자들을 처벌할 것이다. 왕실에 대한 배신자들은 루마니아에 발붙일 곳이 없다!"
 ROM_corporate_alliance: "기업 동맹"
 ROM_corporate_alliance_desc: "기업 집단과 협력하면 우리나라의 발전을 더 확실히 보장할 수 있습니다."
 ROM_restore_the_the_frn: "FRN 복원"
 ROM_restore_the_the_frn_desc: "우리나라가 정치적 다툼의 먹잇감이 되도록 내버려 둘 수 없습니다. 그래서 나는 모든 정당을 금지하고 국민부흥전선(FRN)을 의회 내 유일한 정치 조직으로 세우기로 결정했습니다. 현재 모든 의원은 가입하도록 초청받았으나, 거부하는 자는 정계를 은퇴해야 하며 우리는 그저 그들을 교체할 것입니다."
 ROM_new_camarilla: "새로운 측근 세력"
 ROM_new_camarilla_desc: "There are few members of the corporate groups who, through their merits and actions (and donations) have became trustworthy. Their continued support and trust will be rewarded."
 ROM_drafting_a_new_constitution: "새 헌법 초안 작성"
 ROM_drafting_a_new_constitution_desc: "It's high time that Romania returns to it's natural form of government- absolutism. The new Constitution will grant me unlimited power over every single aspect of this country, and with it I will finally be able to serve my country to the fullest."
 ROM_economy: "루마니아 경제"
 ROM_economy_desc: "현재 우리 경제는 엉망진창이며, 죽은 다람쥐가 더 많은 순자산을 가지고 있을 것이라고 확신합니다. 이 문제에 대해 무언가 해야 할지도 모릅니다."
 ROM_reverse_industrial_decline: "산업 쇠퇴 반전"
 ROM_reverse_industrial_decline_desc: "낡은 공장을 되살리고 신기술에 투자하여 생산성과 경제 성장을 끌어올림으로써, 계속되는 산업 쇠퇴를 반전시키려는 노력이 필요합니다."
 ROM_expand_the_construction_industry: "건설업 확대"
 ROM_expand_the_construction_industry_desc: "By expanding the construction industry will provide new jobs and stimulate economic activity, laying the foundation for future growth and infrastructure development."
 ROM_modernize_bucharest_factories: "부쿠레슈티 공장 현대화"
 ROM_modernize_bucharest_factories_desc: "부쿠레슈티의 공장을 현대화하는 것은 우리의 제조 역량을 높이고 수도가 계속 경제의 중심지로 남도록 하는 데 필수적입니다."
 ROM_housing_construction_initiative: "주택 건설 구상"
 ROM_housing_construction_initiative_desc: "주택 건설 구상을 시작하면 저렴한 주택에 대한 늘어나는 수요에 대응하고 많은 시민의 생활 여건을 개선할 수 있습니다."
 ROM_import_construction_engineering_tech: "건설 공학 기술 도입"
 ROM_import_construction_engineering_tech_desc: "우리의 기술은 상당히 낡았기 때문에 필요한 공학 도구를 수입할 수밖에 없습니다."
 ROM_renew_electricity_production: "전력 생산 쇄신"
 ROM_renew_electricity_production_desc: "지속 가능하고 안정적인 전원에 중점을 두고 전력 생산을 쇄신하는 것은 우리나라의 늘어나는 에너지 수요를 충족하는 데 필수적입니다."
 ROM_expand_heavy_industry: "중공업 확대"
 ROM_expand_heavy_industry_desc: "중공업을 확대하면 경제 기반이 강화되고 고용이 늘어나며, 산출 증가를 통해 관련 부문의 발전을 뒷받침할 수 있습니다."
 ROM_industrial_behemoth: "산업 거인"
 ROM_industrial_behemoth_desc: "루마니아 산업은 다시 한번 경쟁력과 생산성을 갖추었습니다. 어쩌면 수십 년 만에 보는 일이겠지만... 그럼에도 노력은 여기서 멈추지 않습니다."
 ROM_push_for_the_automobile_industry: "자동차 산업 육성"
 ROM_push_for_the_automobile_industry_desc: "탄탄한 자동차 산업은 경제 성장의 핵심입니다. 자동차 부문을 확대하고 국내 브랜드를 지원하며, 자동차 제조 기술의 진보를 장려하는 데 집중하겠습니다."
 ROM_manufacturing_investments: "제조업 투자"
 ROM_manufacturing_investments_desc: "경제 부흥은 제조업에 대한 전략적 투자에서 시작됩니다. 시설을 현대화하고 혁신을 지원함으로써 생산성을 높이고 전국에 새로운 일자리를 만들 수 있습니다."
 ROM_invite_foreign_car_manufacturers: "외국 자동차 제조사 유치"
 ROM_invite_foreign_car_manufacturers_desc: "자동차 부문을 강화하기 위해 외국 자동차 제조사에 공개 초청장을 보내고, 현지에 공장을 설립하고 전문 지식을 우리 시장에 들여오는 데 대한 인센티브를 제공하겠습니다."
 ROM_invest_in_dacia: "다치아 투자"
 ROM_invest_in_dacia_desc: "다치아는 도로 위에서 숱한 농담의 대상이 되어 왔지만, 이제 브랜드의 방향을 새롭게 틀 때가 되었습니다. 품질 개선과 혁신에 투자하면 '녹슨' 평판을 백미러 너머로 떠나보내고 더 밝은 미래를 향해 가속할 수 있습니다. 아니요, 사과하지 않겠습니다."
 ROM_facilitate_automobile_exports: "자동차 수출 촉진"
 ROM_facilitate_automobile_exports_desc: "세계 무대에 우리의 이름을 알리기 위해 규제를 간소화하고 인센티브를 제공하여 루마니아산 자동차의 수출을 촉진하고, 자동차 부문의 성장을 이끌겠습니다."
 ROM_revitalize_romanian_agriculture: "루마니아 농업 활성화"
 ROM_revitalize_romanian_agriculture_desc: "우리의 농업 부문은 국가의 근간입니다. 현대적인 기술과 늘어난 지원으로 농업을 활성화하여 경쟁력과 생산성을 유지할 때입니다."
 ROM_increase_subsidies_for_farmers: "농민 보조금 확대"
 ROM_increase_subsidies_for_farmers_desc: "농민을 지원하고 안정적인 식량 공급을 보장하기 위해 보조금을 늘려, 시장 변동에 대처하고 지속 가능한 영농을 장려하겠습니다."
 ROM_ensure_farmers_income: "농민 소득 보장"
 ROM_ensure_farmers_income_desc: "농민의 공정하고 안정적인 소득을 보장하는 것은 필수적입니다. 농업 수익을 보호하고 농촌의 생계를 지원하는 정책을 시행하겠습니다."
 ROM_solve_property_disputes: "재산 분쟁 해결"
 ROM_solve_property_disputes_desc: "끊이지 않는 재산 분쟁은 농업 성장을 가로막습니다. 이러한 분쟁을 해결하면 광대한 토지의 잠재력을 끌어내고 소유권을 명확히 하여 발전을 가능하게 할 수 있습니다."
 ROM_promote_incentives_for_farming: "영농 인센티브 장려"
 ROM_promote_incentives_for_farming_desc: "농업은 여전히 실행 가능하고 매력적인 생업으로 남아야 합니다. 농업에 대한 투자를 장려하고 농민이 번창하도록 하는 새로운 인센티브를 도입하겠습니다."
 ROM_focus_on_technological_improvements: "기술 개선에 집중"
 ROM_focus_on_technological_improvements_desc: "모든 부문에 걸친 기술 개선에 대한 투자는 효율을 높이고 비용을 줄이며, 루마니아를 더욱 혁신적이고 번영하는 미래로 이끌 것입니다."
 ROM_import_high_tech_agricultural_tools: "첨단 농기구 수입"
 ROM_import_high_tech_agricultural_tools_desc: "농업 부문을 현대화하기 위해 최첨단 농기계를 수입하여 효율을 높이고 루마니아 농장을 세계 기준에 맞추겠습니다."
 ROM_improve_harvest_efficiency: "수확 효율 개선"
 ROM_improve_harvest_efficiency_desc: "수확 효율을 개선하는 것은 생산량을 극대화하는 데 매우 중요합니다. 현대적인 기술과 기법을 도입하여 낭비를 줄이고 더 생산적인 수확기를 보장할 수 있습니다."
 ROM_promote_farming_education: "농업 교육 장려"
 ROM_promote_farming_education_desc: "지식은 번창하는 농업 부문의 열쇠입니다. 농업 교육을 장려하면 미래 세대가 혁신하고 생산성을 개선하는 데 필요한 기술을 갖추게 될 것입니다."
 ROM_increase_maize_exports: "옥수수 수출 확대"
 ROM_increase_maize_exports_desc: "옥수수는 루마니아의 가장 강력한 작물 중 하나입니다. 이 귀중한 상품의 수출을 늘리면 농업 경제가 강화되고 우리가 선도적인 옥수수 수출국으로 자리매김할 것입니다."
 ROM_anti_soil_erosion_projects: "토양 침식 방지 사업"
 ROM_anti_soil_erosion_projects_desc: "토양 침식은 우리 농지에 대한 조용한 위협입니다. 침식 방지 사업을 시작하여 토양을 보호하고 루마니아 농업의 장기적 지속 가능성을 보장하겠습니다."
 ROM_resilient_agriculture: "회복력 있는 농업"
 ROM_resilient_agriculture_desc: "루마니아는 신중한 투자와 발전을 통해 다시 한번 §Y유럽의 곡창§!이라는 칭호를 얻었습니다!"
 ROM_problem_of_aging_infrastructure: "기반시설 노후화 문제"
 ROM_problem_of_aging_infrastructure_desc: "노후화된 기반시설은 성장과 안전을 저해합니다. 이 문제를 해결하는 것은 경제 발전을 뒷받침하고 모든 시민의 삶의 질을 개선하는 데 매우 중요합니다."
 ROM_expand_infrastructure_networks: "기반시설망 확충"
 ROM_expand_infrastructure_networks_desc: "전국에 걸쳐 기반시설망을 확충하면 새로운 개발 지역이 열리고 지역들이 연결되며, 물자와 사람이 효율적으로 이동할 수 있게 됩니다."
 ROM_a1_motorway: "A1 고속도로"
 ROM_a1_motorway_desc: "아라드와 부쿠레슈티를 잇는 A1 고속도로를 완공하는 것은 주요 도시 간 도로 연결을 강화하고, 무역을 촉진하며, 전국의 교통 병목을 해소하는 데 필수적입니다."
 ROM_expand_railway_connections: "철도 연결 확대"
 ROM_expand_railway_connections_desc: "철도 확충에 투자하면 농촌과 도시 간 연결성이 개선되어 승객과 화물 모두에게 비용 효율적이고 지속 가능한 대안이 제공될 것입니다."
 ROM_modernize_existing_infrastructure: "기존 기반시설 현대화"
 ROM_modernize_existing_infrastructure_desc: "새로운 도로와 철도를 건설하는 데 그치지 말고, 현재의 수요에 맞게 기존 기반시설을 현대화하여 믿을 수 있고 효율적인 체계를 보장해야 합니다."
 ROM_revitalize_the_port_of_constanta: "콘스탄차 항만 활성화"
 ROM_revitalize_the_port_of_constanta_desc: "콘스탄차 항은 세계 시장으로 통하는 핵심 관문입니다. 항만을 활성화하면 무역 역량이 높아지고 국제 상거래에서 루마니아의 입지가 강화될 것입니다."
 ROM_high_speed_railway_project: "고속철도 사업"
 ROM_high_speed_railway_project_desc: "고속철도망은 여행에 혁명을 일으켜 주요 도시 간 이동 시간을 크게 단축하고, 더 빠른 연결성으로 지역 발전을 촉진할 것입니다."
 ROM_enforce_safety_regulations: "안전 규정 집행"
 ROM_enforce_safety_regulations_desc: "200km/h로 쌩쌩 달리는 바보들이 너무 많습니다, 쓰레기 같은 BMW E34나 뭐 다른 차들이랑. 우리는 더 엄격한 안전 규제를 시행해야 합니다, 우리 인프라를 매일 사용하는 사람들의 생명을 보호하기 위해."
 ROM_modern_road_system: "현대적인 도로 체계"
 ROM_modern_road_system_desc: "글쎄요, 우리의 기반시설은 독일이나 일본, 심지어 폴란드에도 한참 못 미치지만 조금씩 나아가고 있습니다. 천천히 말이죠."
 ROM_natural_resources: "루마니아의 천연자원"
 ROM_natural_resources_desc: "우리나라는 천연자원이 매우 풍부하며, 이를 그냥 외면하는 것은 안타까운 일일 것입니다."
 ROM_greener_approach: "더 친환경적인 접근"
 ROM_greener_approach_desc: "녹색은 미래이며 우리는 이에 적응해야 합니다."
 ROM_focus_on_renewables: "재생 에너지에 집중"
 ROM_focus_on_renewables_desc: "재생 에너지는 미래입니다. 태양광, 풍력, 수력 발전으로 초점을 옮기면 화석 연료 의존도를 줄이고 루마니아를 위한 지속 가능한 에너지망을 만들 수 있습니다."
 ROM_expand_wind_power_networks: "풍력 발전망 확충"
 ROM_expand_wind_power_networks_desc: "풍력 에너지는 아직 개발되지 않은 잠재력을 지니고 있습니다. 풍력 발전망을 확충하면 에너지원이 다변화되고 가정과 산업에 청정 재생 전력이 공급될 것입니다."
 ROM_hydroelectricity_initiatives: "수력 발전 구상"
 ROM_hydroelectricity_initiatives_desc: "루마니아의 강을 수력 발전에 활용하면 재생 에너지 생산량이 크게 늘어나고 안정적이며 친환경적인 에너지 해법을 얻을 수 있습니다."
 ROM_sustainable_romania: "지속 가능한 루마니아"
 ROM_sustainable_romania_desc: "지속 가능한 미래를 건설하려면 에너지 수요와 환경적 책임 사이의 균형이 필요합니다. 친환경 기술에 투자함으로써 천연자원을 보호하면서 장기적인 번영을 보장하겠습니다."
 ROM_focus_on_nuclear_energy: "원자력 에너지에 집중"
 ROM_focus_on_nuclear_energy_desc: "원자력은 여전히 가장 효율적이고 믿을 수 있는 전력원 중 하나입니다. 원자력 개발을 에너지 정책의 초석으로 우선시하겠습니다."
 ROM_build_new_power_plants: "신규 발전소 건설"
 ROM_build_new_power_plants_desc: "증가하는 에너지 수요를 충족하기 위해 새로운 발전소를 건설하여 산업과 소비자에게 안정적이고 지속 가능한 전력 공급을 보장하겠습니다."
 ROM_modernize_the_cernavoda_nuclear_power_plant: "체르나보더 원자력 발전소 현대화"
 ROM_modernize_the_cernavoda_nuclear_power_plant_desc: "체르나보더 원자력 발전소는 핵심 자산입니다. 이를 현대화하면 출력과 효율이 높아지고 현대적인 안전 및 환경 기준을 충족하게 됩니다."
 ROM_leader_in_nuclear_power: "원자력 발전의 선도국"
 ROM_leader_in_nuclear_power_desc: "원자력 기술을 발전시킴으로써 루마니아는 유럽 내 원자력 에너지의 선도국이 되어, 미래 세대에게 믿을 수 있는 저배출 전력원을 제공할 수 있습니다."
 ROM_exploit_our_land: "국토 개발"
 ROM_exploit_our_land_desc: "루마니아의 땅에는 아직 개발되지 않은 막대한 잠재력이 있습니다. 천연자원을 개발하기 시작하여 경제 성장의 원동력으로 삼고 해외 수입 의존도를 줄이겠습니다."
 ROM_oil_extraction_initiatives: "석유 채굴 구상"
 ROM_oil_extraction_initiatives_desc: "석유는 여전히 세계 에너지의 초석입니다. 국내 석유 채굴을 확대하고 에너지 자립을 강화하기 위한 새로운 구상을 시작하겠습니다."
 ROM_black_sea_oil_extraction: "흑해 석유 채굴"
 ROM_black_sea_oil_extraction_desc: "흑해에는 상당한 석유 매장량이 있습니다. 이 귀중한 자원을 채굴하면 에너지 부문이 강화되고 루마니아가 지역 에너지 강국으로 자리매김할 것입니다."
 ROM_tap_into_transylavanian_oil_reserves: "트란실바니아 석유 매장량 개발"
 ROM_tap_into_transylavanian_oil_reserves_desc: "트란실바니아의 석유 매장량은 오랫동안 제대로 활용되지 못했습니다. 이 자원을 개발하면 생산량을 늘리고 에너지 안보를 공고히 할 수 있습니다."
 ROM_trade_with_opec_countries: "OPEC 국가와의 무역"
 ROM_trade_with_opec_countries_desc: "OPEC 국가들과 유리한 무역 관계를 맺으면 안정적인 석유 공급을 보장하고 루마니아가 경쟁력 있는 에너지 가격을 유지하는 데 도움이 될 것입니다."
 ROM_commence_mining_projects: "광업 사업 착수"
 ROM_commence_mining_projects_desc: "루마니아의 풍부한 광물 자원은 개발될 때가 무르익었습니다. 새로운 광업 사업을 시작하면 이 자산이 활용되어 산업 성장에 기여할 것입니다."
 ROM_rosia_montana_project: "로시아 몬타나 사업"
 ROM_rosia_montana_project_desc: "유네스코는 신경 쓰지 마십시오, 로시아 몬타나에는 상당한 금 매장량이 있습니다. 이 사업은 환경 문제를 헤쳐 나가면서 해당 지역의 광업을 되살리고 일자리와 경제적 이익을 가져다줄 것입니다."
 ROM_rovina_mine_project: "로비나 광산 사업"
 ROM_rovina_mine_project_desc: "로비나 광산은 귀중한 광물을 채굴할 중요한 기회를 제공합니다. 이 사업을 개발하면 광업 부문이 강화되고 수출이 증가할 것입니다."
 ROM_invite_mining_conglomerates: "광업 대기업 유치"
 ROM_invite_mining_conglomerates_desc: "주요 국제 광업 대기업을 유치하면 그들의 전문성과 자본을 활용하여 루마니아 광업의 발전을 가속할 수 있습니다."
 ROM_foundation_of_the_romanian_it_sector: "루마니아 IT 부문의 토대"
 ROM_foundation_of_the_romanian_it_sector_desc: "번창하는 IT 부문의 기반을 다지면 루마니아가 기술과 혁신 분야의 미래 선도국으로 자리 잡고, 경제 성장과 디지털 전환을 이끌 것입니다."
 ROM_invest_in_tech_innovations: "기술 혁신 투자"
 ROM_invest_in_tech_innovations_desc: "기술 혁신에 대한 전략적 투자는 다양한 분야에서 연구, 개발, 최첨단 진보의 문화를 조성하여 우리 경제를 부흥시킬 것입니다."
 ROM_invest_in_electronics_production: "전자제품 생산 투자"
 ROM_invest_in_electronics_production_desc: "전자제품 생산에 투자함으로써 제조 역량을 강화하고 수출을 늘리며, 첨단 전자제품에 대한 세계적 수요 증가에 대응하는 것을 목표로 합니다."
 ROM_modernize_romanian_internet_services: "루마니아 인터넷 서비스 현대화"
 ROM_modernize_romanian_internet_services_desc: "전국적으로 인터넷 서비스를 업그레이드하는 것은 현대 디지털 경제를 지원하고, 연결성을 개선하며, 모든 시민들이 신뢰할 수 있고 빠른 인터넷에 접근할 수 있도록 보장하는 데 중요합니다. 게다가, 이제 미국인들이 유튜브 쇼츠에서 어느 나라가 가장 빠른 인터넷을 가지고 있는지에 대해 클릭베이트 영상을 만들 수 있게 되었습니다."
 ROM_deals_with_intel: "인텔과의 계약"
 ROM_deals_with_intel_desc: "인텔과 계약을 체결하면 첨단 마이크로프로세서 기술에 접근할 수 있어 국내 기술 산업이 활성화되고 혁신이 촉진될 것입니다."
 ROM_deals_with_microsoft: "마이크로소프트와의 계약"
 ROM_deals_with_microsoft_desc: "마이크로소프트와 전략적 제휴를 맺으면 소프트웨어 개발 역량이 향상되고 디지털 교육과 비즈니스 솔루션이 뒷받침될 것입니다."
 ROM_promote_it_specialist_training: "IT 전문가 양성 장려"
 ROM_promote_it_specialist_training_desc: "IT 전문가를 위한 특화 훈련 프로그램에 투자하면 성장하는 기술 부문의 수요에 부응할 숙련된 인력이 만들어질 것입니다."
 ROM_silicon_valley_of_europe: "유럽의 실리콘 밸리"
 ROM_silicon_valley_of_europe_desc: "집중적인 노력과 전략적 투자로 루마니아는 '유럽의 실리콘 밸리'가 되어 전 세계의 인재와 자본을 끌어들이며 혁신과 성장을 이끌고 있습니다."
 ROM_social_democratic_party: "사회민주당"
 ROM_social_democratic_party_desc: "1992년에 창당된 PDSR은 루마니아에서 좌익 이념을 대표하는 주요 정치 세력입니다. 중앙집권적 사회주의 체제에서 시장 경제로 전환하는 수년을 거친 루마니아 경제를 강화하고 복지국가를 수립하겠다는 경제 회복 공약을 내걸고 선거 운동을 벌이고 있으며, 2000년 선거의 확실한 우승 후보로 여겨지고 있습니다."
 ROM_psd_economic_policy: "우리의 경제 정책"
 ROM_psd_economic_policy_desc: "허, 여기까지 올 줄은 몰랐는데요. 이제 어떻게 할까요?"
 ROM_drive_liberalization_policies: "자유화 정책 추진"
 ROM_drive_liberalization_policies_desc: "경제를 자유화하고 국가 통제를 줄이며 민간 기업과 경쟁을 장려하는 정책을 시행해야 합니다."
 ROM_heavy_industry_tax_breaks: "중공업 세금 감면"
 ROM_heavy_industry_tax_breaks_desc: "중공업에 세금 감면을 제공하면 생산을 촉진하고 일자리를 지키며 핵심 부문의 경제 성장을 이끌 수 있습니다."
 ROM_promote_workforce_education: "노동력 교육 장려"
 ROM_promote_workforce_education_desc: "노동력의 교육과 훈련에 투자하는 것은 생산성을 높이고 현대 경제의 요구에 대비하는 데 필수적입니다."
 ROM_strengthen_the_leu: "루마니아 레우 강화"
 ROM_strengthen_the_leu_desc: "통화에 대한 신뢰를 회복하고 외국인 투자를 유치하기 위해 루마니아 레우를 안정시키고 강화하는 즉각적인 조치를 취해야 합니다."
 ROM_privatize_failing_industries: "부실 산업 민영화"
 ROM_privatize_failing_industries_desc: "손실을 줄이고 민간 부문의 효율성을 장려하기 위해 부실한 국영 산업의 민영화를 신속히 추진해야 합니다."
 ROM_strong_economy: "강력한 경제"
 ROM_strong_economy_desc: "우리의 일은 아직 끝나지 않았지만, 루마니아 경제는 그 어느 때보다 강력합니다."
 ROM_joint_private_sector_contracts: "민간 부문과의 공동 계약"
 ROM_joint_private_sector_contracts_desc: "공동 계약을 통해 민간 기업과 협력하면 혁신이 촉진되고 경제 성장이 이끌어질 것입니다."
 ROM_support_small_businesses: "소기업 지원"
 ROM_support_small_businesses_desc: "경제의 근간인 소기업을 지원해야 하며, 보조금과 대출, 유리한 여건을 제공해야 합니다."
 ROM_nordic_approach: "노르딕 접근법"
 ROM_nordic_approach_desc: "강력한 복지국가와 역동적인 시장 경제를 결합한 북유럽 모델을 채택하여 번영과 평등을 모두 보장하겠습니다."
 ROM_universal_healthcare: "보편적 의료 시행"
 ROM_universal_healthcare_desc: "Healthcare is free all but in name. By implementing a Public Health Insurance System we can guarantee that every citizen has access to quality medical services, regardless of their income."
 ROM_modernize_romanian_education: "루마니아 교육 현대화"
 ROM_modernize_romanian_education_desc: "교육 제도를 현대화하고 새로운 교육과정과 기반시설에 투자하여 청년들이 미래에 대비하도록 할 때입니다."
 ROM_fair_economy: "공정한 경제"
 ROM_fair_economy_desc: "우리의 노력으로 부가 국민 사이에 더욱 고르게 분배되었으며, 국민은 그 어느 때보다 행복합니다."
 ROM_progressive_taxation: "누진세 시행"
 ROM_progressive_taxation_desc: "더 많은 부를 가진 이들이 국가의 복지에 더 많이 기여하도록 누진세 제도를 도입하겠습니다."
 ROM_expand_public_administration: "공공 행정 확대"
 ROM_expand_public_administration_desc: "서비스 제공을 개선하고 통치를 강화하는 동시에 일자리와 당에 충성하는 사람을 더 늘리기 위해 공공 행정을 확대하고 강화해야 합니다."
 ROM_economic_patriotism: "경제 애국주의에 집중"
 ROM_economic_patriotism_desc: "내수 시장을 부흥시키기 위해 경제 애국주의를 조성하여 루마니아 기업과 제품을 우선시해야 합니다."
 ROM_nationalize_privatized_industries: "민영화된 산업 국유화"
 ROM_nationalize_privatized_industries_desc: "민영화된 핵심 산업을 되찾아 국가의 통제 아래 두어 국익을 지킬 때입니다."
 ROM_welfare_statism: "복지 국가주의"
 ROM_welfare_statism_desc: "국가가 다양한 수단을 통해 시민의 경제적·사회적 복리를 보호하고 증진하는 데 중요한 역할을 한다는 사상인 복지 국가주의를 수용하여, 요람에서 무덤까지 모든 시민을 지원하는 견고한 사회 안전망을 보장하겠습니다."
 ROM_focus_on_neglected_regions: "소외 지역에 집중"
 ROM_focus_on_neglected_regions_desc: "몰다비아, 올테니아, 부코비나 같은 지역은 수십 년간 소외되어 트란실바니아와 부쿠레슈티에 크게 뒤처졌습니다. 격차가 더 벌어지기 전에 신속히 좁히는 것이 중요합니다."
 ROM_protect_romanian_products: "루마니아 제품 보호"
 ROM_protect_romanian_products_desc: "관세 같은 정책을 시행하여 국내 산업을 돕고 해외 수입 의존도를 줄이겠습니다."
 ROM_patriotic_economy: "애국 경제"
 ROM_patriotic_economy_desc: "우리 경제는 이제 진정한 루마니아 애국자들이 루마니아에서 만든 애국적인 상품을 우선합니다! 신이여 루마니아를 축복하소서!!"
 ROM_psd_social_approach: "우리의 사회적 접근"
 ROM_psd_social_approach_desc: "민감한 주제라는 건 압니다. 하지만 앞으로 나아갈 길을 여기서 논의해야 합니다."
 ROM_progressive_voices: "진보적 목소리 장려"
 ROM_progressive_voices_desc: "더 공정한 사회를 위해 개혁과 혁신을 촉진하며, 정부 내 진보적 목소리를 키울 때입니다."
 ROM_rehabilitate_purged_reformers: "숙청된 개혁가 복권"
 ROM_rehabilitate_purged_reformers_desc: "개혁과 정의를 추구했던 이들의 명예를 회복시키고, 국가 발전에 대한 그들의 공헌을 인정해야 합니다."
 ROM_apologize_for_the_mineriads: "미네리아드에 대한 사과"
 ROM_apologize_for_the_mineriads_desc: "미네리아드는 우리 역사의 어두운 장이었으며, 그날 일어난 일에 대해 사과할 때입니다. 아마도 우리 국민은 그 유혈 사태를 딛고 앞으로 나아갈 수 있을 것입니다."
 ROM_reenact_beneficial_policies: "유익한 정책 재시행"
 ROM_reenact_beneficial_policies_desc: "과거에 우리나라의 발전과 복지에 유익했던 것으로 입증된 정책을 다시 검토하고 재시행하겠습니다."
 ROM_denounce_totalitarian_communism: "전체주의적 공산주의 규탄"
 ROM_denounce_totalitarian_communism_desc: "전체주의적 공산주의 시대를 공개적으로 규탄하고 민주주의와 자유에 대한 우리의 헌신을 천명해야 합니다."
 ROM_condemn_ceausescus_crimes: "차우셰스쿠의 범죄 규탄"
 ROM_condemn_ceausescus_crimes_desc: "니콜라에 차우셰스쿠 정권을 규탄하고 그러한 권력 남용이 다시는 일어나지 않도록 하는 것은 우리의 도덕적 의무입니다."
 ROM_claim_the_legacy_of_89: "1989년의 유산 계승"
 ROM_claim_the_legacy_of_89_desc: "1989년 혁명은 루마니아 국민이 억압에 맞서 일어나 자유와 민주주의를 위해 싸운 우리 역사의 전환점이었습니다. 우리는 FSN의 법적 계승자로서 그 봉기의 가치인 정의, 자유, 국민의 의지에 대한 헌신을 재확인함으로써 이 유산을 기려야 합니다. 1989년의 정신을 계승함으로써 우리는 치른 희생이 헛되지 않았음을, 그리고 우리나라의 미래가 그 역사적인 해의 정신에 충실하며 혁명의 불꽃이 영원히 꺼지지 않을 것임을 보장합니다."
 ROM_expel_communist_supporters: "공산주의 지지자 추방"
 ROM_expel_communist_supporters_desc: "민주적 미래를 온전히 받아들이려면 구 공산 정권의 잔존 지지자들을 권력과 영향력이 있는 자리에서 몰아내야 합니다."
 ROM_compensate_regime_victims: "정권 피해자 보상"
 ROM_compensate_regime_victims_desc: "구 정권 아래서 박해받은 이들의 고통을 인정하고, 그들의 아픔과 손실에 대해 적절한 보상을 제공해야 합니다."
 ROM_support_the_european_dream: "유럽의 꿈 지지"
 ROM_support_the_european_dream_desc: "EU의 이상과 정책에 보조를 맞춤으로써 통합, 평화, 번영이라는 유럽의 꿈을 지지하겠습니다."
 ROM_lgbt_rights_initiative: "LGBT 권리 구상"
 ROM_lgbt_rights_initiative_desc: "디스코드의 루마니아인들이 여러분이 믿게 하고 싶어 하는 것과 달리, LGBT 사람들도 인간입니다. LGBT 권리를 지지하는 구상을 시작하여 성적 지향에 관계없이 모든 시민의 권리를 보호할 때입니다."
 ROM_support_workplace_equality: "직장 내 평등 지원"
 ROM_support_workplace_equality_desc: "성별이나 배경에 관계없이 모두에게 평등한 기회를 보장하는 정책을 시행함으로써 직장 내 공정성을 증진하겠습니다."
 ROM_secularize_education: "교육 세속화"
 ROM_secularize_education_desc: "우리의 교육 제도는 종교의 영향에서 벗어난 현대적이고 세속적인 국가를 반영하여, 모든 학생에게 균형 잡히고 포용적인 교육을 제공해야 합니다. 더는 루마니아 정교회(BOR)가 교육에 간섭하지 못할 것입니다."
 ROM_progressive_society: "진보적 사회"
 ROM_progressive_society_desc: "루마니아 국민은 이제 보수적 과거의 사슬에 얽매이지 않고 앞을 내다보고 있습니다."
 ROM_strengthen_conservatism: "사회 보수주의 강화"
 ROM_strengthen_conservatism_desc: "전통적 가치와 사회 안정을 지키기 위해 사회 보수주의를 강화하고 규범과 문화유산을 공고히 하겠습니다."
 ROM_support_our_communist_past: "공산주의 과거 지지"
 ROM_support_our_communist_past_desc: "우리의 역사를 인정하여 공산주의 과거의 성과와 이상을 옹호하는 이들을 지원하고, 그들의 관점을 현재의 정책에 반영하겠습니다."
 ROM_orthodox_values: "정교회 가치 장려"
 ROM_orthodox_values_desc: "공적 생활과 제도에서 정교회의 가치를 적극 장려하고, 국가 정책을 루마니아 정교회(BOR)의 도덕적·윤리적 가르침에 부합하게 하겠습니다."
 ROM_question_eu_policies: "EU 정책에 의문 제기"
 ROM_question_eu_policies_desc: "The EU is trying to impose it's views onto it's member states, control every aspect of their society and economy. Do we really wish to stick around with them?"
 ROM_strengthen_our_hegemony: "우리의 패권 강화"
 ROM_strengthen_our_hegemony_desc: "o assert our influence on the regional stage, we will take measures to strengthen our hegemony, projecting power and reinforcing our leadership role in the Balkans."
 ROM_gain_bor_support: "루마니아 정교회(BOR)의 지지 확보"
 ROM_gain_bor_support_desc: "루마니아 정교회(BOR)의 지지를 확보하면 우리의 도덕적 권위가 높아지고 정치적 입지가 강화될 것입니다."
 ROM_condemn_radicals: "급진 초민족주의자 규탄"
 ROM_condemn_radicals_desc: "우리는 애국자일지는 몰라도 미치광이는 아닙니다. 급진주의자와 초민족주의자는 정치에 설 자리가 없습니다."
 ROM_ally_right_forces: "우익 세력과의 동맹"
 ROM_ally_right_forces_desc: "While we do not see eye to eye with the rightwing, we have many things in common. So, it won't be anything crazy to ally with them and create a new Political Union to further streghten Romania and our interests."
 ROM_honor_national_heroes: "국가 영웅 기리기"
 ROM_honor_national_heroes_desc: "과거 전쟁과 분쟁의 영웅들을 기림으로써 국민에게 애국심을 불어넣을 수 있습니다."
 ROM_ostracize_the_hungarian_minority: "헝가리 소수 민족 배척"
 ROM_ostracize_the_hungarian_minority_desc: "이 어리석은 자들은 자치를 원합니다. 왜일까요? 우리나라를 파괴하고 싶어서입니다! 왜일까요? 그들이 헝가리인이니까요! 그럼 헝가리인에게 우리가 무엇을 하죠? 우리는 추방... 아니 그러니까 어... 보세요, 우리는 UDMR의 본색을 드러내도록 그저 적대시할 뿐입니다..."
 ROM_denounce_lgbt: "LGBT 규탄"
 ROM_denounce_lgbt_desc: "그들은 병들었습니다. 달리 표현할 방법이 없습니다. 그들은 우리 사회에, 우리 아이들과 신앙 곁에 설 자리가 없으며 당연히 이 나라를 통치할 자리도 없습니다. 우리는 그러한 행위를 억제하고 그들이 방식을 바꾸게 해야 합니다."
 ROM_anti_abortion_law: "낙태 금지법"
 ROM_anti_abortion_law_desc: "낙태는 인류에 대한 범죄입니다. 제정신인 사람이 어찌 작은 영혼을 죽이려 하겠습니까? 낙태할 권리를 제한하면 그러한 비도덕적 관행을 막을 수 있으며, 어쩌면 우리의 인구 구조도 바로잡을 수 있을지 모릅니다..."
 ROM_moral_society: "도덕적 사회"
 ROM_moral_society_desc: "루마니아에 필요한 것은 강력한 도덕률이며, 우리는 이를 제공했습니다."
 ROM_issue_of_corruption: "부패 문제"
 ROM_issue_of_corruption_desc: "Corruption is the one word on everyones mouth. Corruption this, corruption that. Ironically speaking, it has also become a massive issue, so how should we handle it?"
 ROM_hand_against_corruption: "부패에 맞서는 손길"
 ROM_hand_against_corruption_desc: "이 기생충이 모든 것을 파괴하기 전에 강하게 압박해야 합니다."
 ROM_judicial_transparency: "사법 투명성"
 ROM_judicial_transparency_desc: "국민은 자신의 재판과 문서가 어떻게 되고 있는지 알 자격이 있으며, 마찬가지로 향후의 모든 개혁이 포괄적이고 투명한 것이 중요합니다. 사법 투명성을 증진하면 두 가지를 모두 이룰 수 있습니다."
 ROM_form_the_dna: "DNA 설립"
 ROM_form_the_dna_desc: "놀랍게도 DNA는 사실 한 루마니아인이 발명했습니다. 그의 이름은? 마타(Ma-ta)입니다. 농담은 이쯤 하고, DNA(Directia Nationala Anticoruptie, 영어권 독자를 위해 풀이하면 국가반부패국)는 부패 관련 범죄를 예방하고 수사하며 기소하는 임무를 맡은 주요 기관이 될 것입니다."
 ROM_root_the_mafia: "마피아 뿌리 뽑기"
 ROM_root_the_mafia_desc: "마피아는 수확물 속의 잡초와 같아서 반드시 없애야 합니다."
 ROM_investigate_public_contracts: "공공 계약 조사"
 ROM_investigate_public_contracts_desc: "대부분의 공공 계약이 하원의원, 장관, 상원의원 등의 친구와 가족에게 돌아간다는 소문이 돌고 있습니다. 이러한 주장을 조사하여 얼마나 사실인지 확인하겠습니다."
 ROM_tackle_land_barons: "토지 토호 대처"
 ROM_tackle_land_barons_desc: "These pests are have been nothing short of arseholes. We gotta teach 'em a lesson."
 ROM_public_sector_transparency: "공공 부문 투명성"
 ROM_public_sector_transparency_desc: "정부의 투명성을 높이고 부패를 억제하며 국민과의 신뢰를 쌓기 위해 새로운 법률을 시행하겠습니다."
 ROM_transparent_state: "투명한 국가"
 ROM_transparent_state_desc: "완벽하지는 않지만, 우리는 국가 기관에 가해지던 부패의 압력을 덜어 내는 데 성공했습니다. 시간이 지나면 우리는 진정으로 완전히 투명한 국가가 될지도 모릅니다."
 ROM_utilize_the_deep_state: "딥 스테이트 활용"
 ROM_utilize_the_deep_state_desc: "통제력을 유지하고 내부의 반대를 신속히 처리하기 위해 관료제 내의 딥 스테이트 네트워크를 활용해야 합니다."
 ROM_contracts_to_loyalists: "충성파에게 계약 수여"
 ROM_contracts_to_loyalists_desc: "가장 충실한 지지자들에게 정부 계약을 수여하여 그들의 변함없는 충성을 보장하고 우리의 권력 기반과 수익을 강화해야 합니다."
 ROM_control_the_constitutional_court: "헌법재판소 장악"
 ROM_control_the_constitutional_court_desc: "우리의 권위에 대한 어떠한 법적 위협도 힘을 얻지 못하도록 헌법재판소에 대한 영향력을 확보하겠습니다."
 ROM_enforce_police_loyalty: "경찰의 충성 강요"
 ROM_enforce_police_loyalty_desc: "경찰이 우리에게 충성하도록 보장해야 하며, 반대하는 자들을 조직에서 몰아내고 우리의 뜻을 의문 없이 집행할 경찰관들을 앉혀야 합니다."
 ROM_patronage_system: "후원 체제"
 ROM_patronage_system_desc: "우리를 지지하는 이들에게 직위와 특권으로 보상하여 지속적인 충성을 보장하는 후원 체제를 확립하겠습니다."
 ROM_concord_with_organized_crime: "조직범죄와의 협약"
 ROM_concord_with_organized_crime_desc: "조직범죄와 양해를 이루면 새로운 수입원을 얻고 법 밖에서 활동하는 추가 동맹을 확보할 수 있습니다."
 ROM_appease_land_barons: "토지 토호 회유"
 ROM_appease_land_barons_desc: "안정을 유지하려면 지지와 표를 대가로 특혜와 보호를 베풀어 유력한 지역 토호들을 회유해야 합니다."
 ROM_kleptocratic_state: "도둑 정치 국가"
 ROM_kleptocratic_state_desc: "엘리트들이 국가의 희생으로 사익을 챙기도록 허용하고, 그 대가로 우리 통치에 대한 변치 않는 충성을 얻는 도둑 정치 모델을 받아들이겠습니다."
 ROM_armed_forces: "루마니아군"
 ROM_armed_forces_desc: "군대는 우리와 적의 점령 사이를 가로막는 유일한 방벽입니다. 국방 부문에 대한 투자는 다른 모든 것만큼, 어쩌면 그보다 더 중요합니다."
 ROM_army: "육군"
 ROM_army_desc: "육군은 가장 큰 예산을 누리고 있으며 단연 가장 많은 병력을 보유하고 있습니다. 그래도 이것으로는 충분하지 않습니다."
 ROM_western_modernization: "서방식 현대화"
 ROM_western_modernization_desc: "서방의 형제들을 바라보며 그들이 내일의 분쟁에 대비해 군대를 어떻게 현대화했는지 살펴봐야 합니다."
 ROM_spirit_of_the_mountain_hunters: "산악 사냥꾼의 정신"
 ROM_spirit_of_the_mountain_hunters_desc: "The Mountain Hunters represented the first true elite force that Romania had, and their legend still lives on. From their exploits in both World Wars, pushing the Germans and Soviets to their limits and humiliating them, the Mountain Hunters represent the strenght, both in body and spirit, of the Romanian soldier."
 ROM_unified_command: "통합 지휘 체계"
 ROM_unified_command_desc: "현대 기술을 활용하여 지휘 체계를 한층 통합하면 일관된 계획과 전략을 촉진할 수 있습니다."
 ROM_reform_conscription: "징병제 개혁"
 ROM_reform_conscription_desc: "우리의 징병법은 시대에 뒤떨어졌습니다. 사상자는 전혀 개의치 않고 오직 압도적인 수로 적을 제압하는 것이 전부입니다. 징병제를 폐지하고 지원병 기반의 군대만 편성하여 진정으로 질 높은 군대를 갖추겠습니다."
 ROM_adapt_to_nato_standards: "NATO 기준에 적응"
 ROM_adapt_to_nato_standards_desc: "언젠가 NATO에 가입하고 싶다면 그들의 품질 기준에 적응해야 합니다. 그렇지 않으면 우리는 총알받이나 다름없을 것입니다."
 ROM_foreign_attaches: "외국 무관"
 ROM_foreign_attaches_desc: "우리에게 현대적인 기술과 전략이 부족하다는 것은 비밀이 아닙니다. 하지만 외국 장교와 장군을 초빙하여 우리 장군과 장교를 훈련하고 가르치게 하면, 더 현대적인 다른 군대와의 격차를 서서히 좁힐 수 있습니다."
 ROM_burebista_military_school: "부레비스타 군사학교"
 ROM_burebista_military_school_desc: "The Romanian Army is big, but lacks quality. By establishing a military school specialized in recruiting and training elite forces, we can create a powerful contigent of soldiers who will be able to defend Romania until the rest of the armed forces are mobilized and ready."
 ROM_quality_over_quantity: "양보다 질"
 ROM_quality_over_quantity_desc: "Recent wars in Transnistria, Iraq and Afghanistan just showed us how important quality is. What use is to outnumber the enemy 2-1 when he can make you bleed for every inch of land without suffering major casualties themselves?"
 ROM_a_new_modern_army: "새롭고 현대적인 군대"
 ROM_a_new_modern_army_desc: "존경받는 모든 국가의 뒤에는 상대가 누구든 억압자로부터 나라를 지킬 준비가 된 강하고 현대적인 군대가 있습니다. 이제 루마니아 육군도 다르지 않으며, 돈으로 살 수 있는 최고의 기술과 총기로 무장했습니다."
 ROM_continue_with_the_old: "기존 체제 유지"
 ROM_continue_with_the_old_desc: "우리는 파산해서 새 AK-47을 살 여력이 없습니다. 농담이었으면 좋겠습니다."
 ROM_expand_conscription: "징병제 확대"
 ROM_expand_conscription_desc: "병역이 의무인데도 육군은 늘 인력이 부족합니다. 징집 연령을 낮추면 신병을 수천 명 더 짜낼 수 있을 것입니다."
 ROM_guerilla_warfare: "게릴라전"
 ROM_guerilla_warfare_desc: "Past military doctrines focused on guerrila warfare, the idea being to bleed out an overwhelming enemy force before they can make meaningful gains, all the while harassing their supply lines. And you know what? That is a very good doctrine."
 ROM_unit_autonomy: "부대 자율성"
 ROM_unit_autonomy_desc: "Past conflicts showed the importance of unit autonopmy, to be able to take decisions on their own without waiting for orders from higher ups. While we won't allow units to invade countries by themselves persay,, we will allow a degree of autonomy to take decisions which might make the difference between life and death."
 ROM_legacy_of_the_patriotic_guards: "애국 근위대의 유산"
 ROM_legacy_of_the_patriotic_guards_desc: "애국 근위대는 70년대 루마니아 방어의 주축이었습니다. 민간인으로 구성된 준군사 조직으로, 지금은 정치적 탄압의 도구로 여겨지고 있습니다. 하지만 우리의 처지를 고려하면 이러한 조직을 재건하는 것도 나쁜 생각이 아닐지 모릅니다."
 ROM_scorched_earth: "초토화 작전"
 ROM_scorched_earth_desc: "후퇴하게 되면 적에게 쓸모 있을 모든 것을 반드시 파괴해야 합니다. 도로, 곡물, 정유소 모두 말입니다. 적의 보급선이 최대한 불안정해지도록 해야 합니다."
 ROM_military_training_for_the_youth: "청소년 군사 훈련"
 ROM_military_training_for_the_youth_desc: "고등학생의 교육과정에 기초 응급 처치 훈련과 함께 사격 훈련을 도입하겠습니다."
 ROM_mass_production: "대량 생산"
 ROM_mass_production_desc: "신뢰성이 거의 없는 값싼 무기를 대량 생산하는 것이 나쁘다고 누가 말합니까? 나는 아닙니다. 총이 더 필요합니다!!"
 ROM_peoples_war: "인민 전쟁"
 ROM_peoples_war_desc: "우리 혈관의 마지막 한 방울까지 조국을 지킬 것입니다. 모든 문턱이 요새가 될 것입니다. 우리는 루마니아 민족, 루마니아 국민이기 때문입니다! 신이여 우리를 도우소서!"
 ROM_war_games: "워게임"
 ROM_war_games_desc: "지휘관들이 전략적 사고를 하고 현장에서 중요한 결정을 내릴 수 있도록 훈련시키는 것이 중요합니다. 격월로 워게임을 실시하면 그들의 혁신에 대한 열의와 사고력을 서서히 길러 낼 수 있습니다."
 ROM_root_out_military_corruption: "군 부패 척결"
 ROM_root_out_military_corruption_desc: "우리 군이 매우, 매우 부패했다는 것은 이미 분명해졌습니다. 거의 매일 수천 달러 상당의 자금과 장비가 사라지고 있으며, 장군도 너무 많습니다. 이런 요소들이 더 큰 골칫거리가 되기 전에 숙청해야 합니다."
 ROM_increase_the_military_budget: "국방 예산 증액"
 ROM_increase_the_military_budget_desc: "We lack the necessary budget to further invest into our military capabilities, but a couple more million dollars might prove just enough.."
 ROM_found_romarm: "ROMARM 설립"
 ROM_found_romarm_desc: "기존의 군수 기업들을 하나의 대형 자율 기업으로 통합하면 우리 군수 산업에 더 효과적으로 투자하고 조직할 수 있습니다."
 ROM_weapons_exports: "루마니아 무기 수출"
 ROM_weapons_exports_desc: "우리 무기는 견고한 제작과 저렴한 가격 덕분에 수요가 있으며, 수출을 장려하면 예산에 보탤 수천 달러를 더 벌 수 있습니다."
 ROM_company_bailouts: "기업 구제"
 ROM_company_bailouts_desc: "90년대는 많은 기업에 혼란기였고 상당수가 무너졌습니다. 군수 기업도 마찬가지였지만, 이들을 구제하면 한동안 경제적 타격은 있더라도 국내 산업을 지킬 수 있을 것입니다."
 ROM_resita_gunpowder_plant: "레시차 화약 공장"
 ROM_resita_gunpowder_plant_desc: "어째서인지 우리는 화약을 전혀 생산하지 않아서, 탄약을 전부 수입해야 하는 분쟁 상황에서는 사실상 무용지물입니다. 완전한 재앙을 막으려면 이 상황을 바꿔야 합니다."
 ROM_constanta_warship_production: "콘스탄차 군함 생산"
 ROM_constanta_warship_production_desc: "흑해 조선소는 10년이 훨씬 넘도록 잠들어 있었습니다. 우리가 그들을 깨울 것입니다."
 ROM_military_titan: "군사 거인"
 ROM_military_titan_desc: "최근의 개혁과 투자 패키지는 루마니아 군을 중요한 지역 강국으로 탈바꿈시켰습니다. 러시아를 비롯해 더 강한 나라들이 남아 있지만, 우리가 싸우지도 않고 물러서지는 않으리라는 것은 확실히 보장할 수 있습니다."
 ROM_air_force: "공군"
 ROM_air_force_desc: "루마니아 공군은 전성기가 지났습니다. 현재는 주로 조종사에게 매우 현실적인 위험이 되는 구식 MiG로 이루어져 있어, 많은 투자와 시간이 필요할 것입니다."
 ROM_develop_the_doctrine: "교리 발전"
 ROM_develop_the_doctrine_desc: "Warfare is everchaning, and adapting is a must. By developing our doctrine around modern threats and dangers, we can prevent any surprises."
 ROM_focus_on_training: "훈련에 집중"
 ROM_focus_on_training_desc: "총도 제대로 들지 못하는 병사를 전장에 보내서 무슨 소용이 있겠습니까? 훈련을 더 한다고 해서 나쁠 것은 없습니다."
 ROM_death_from_above: "하늘에서 내리는 죽음"
 ROM_death_from_above_desc: "First, we make the enemy afraid of what is before him and then we make him afraid of what is above him. By controlling the skies we can inflict maximum casualties, and then become able to use our airborn units to cause even more havoc."
 ROM_aircraft_acquisition: "항공기 도입"
 ROM_aircraft_acquisition_desc: "새로운 항공기를 개발하려면 오랜 시간이 걸릴 것이므로, 당분간은 외국 기종을 구매하는 편이 낫습니다."
 ROM_aa_warfare: "대공전"
 ROM_aa_warfare_desc: "대공 방어는 언제나 군의 중요한 부분이었지만, 드론 사용이 늘어나면서 대공 무기의 활용이 필수가 되었습니다. 우리 병사들에게 이러한 무기를 지급하면 더 많은 사상자를 막을 수 있습니다."
 ROM_asr_brasov: "IAR 브라쇼브"
 ROM_asr_brasov_desc: "IAR 브라쇼브는 한때 루마니아 항공의 자랑이었습니다. 수년간 전투기, 근접 항공 지원기, 훈련기에 이르기까지 무엇이든 생산했지만, 주문과 제품 부족으로 지금은 가동이 중단되었습니다. 연구 개발 부서에 투자하고 생산 시설을 확장하면 항공 산업을 서서히 재건할 수 있습니다."
 ROM_defenders_of_the_sky: "하늘의 수호자"
 ROM_defenders_of_the_sky_desc: "From the Apuseni to the Black Sea, the Romanian Airfoce is the strongest!"
 ROM_navy: "해군"
 ROM_navy_desc: "루마니아 해군은 늘 잊힌 채 예산이 부족했지만, 긴장이 고조되고 흑해의 중요성이 전반적으로 커지고 있으니 투자를 시작하는 것도 나쁘지 않을 것입니다."
 ROM_danube: "도나우강"
 ROM_danube_desc: "While less important than the Black Sea, the Danube represents an important asset and it's value cannot be underestimated."
 ROM_galati_dockyards: "갈라치 조선소"
 ROM_galati_dockyards_desc: "1897년에 설립된 갈라치 조선소는 역사를 통틀어 루마니아 해군에 고품질의 함선과 무장을 꾸준히 공급해 왔습니다. 지난 수십 년은 힘겨웠지만, 조선소에 투자하고 현대화하면 옛 영광을 되찾을 수 있습니다."
 ROM_control_the_delta: "삼각주 장악"
 ROM_control_the_delta_desc: "더 큰 동쪽 이웃 국가로부터 적대 행위가 닥칠 경우에 대비해 강에 대한 통제권을 보장하려면 도나우 함대를 현대화하는 것이 필수적입니다."
 ROM_black_sea: "흑해"
 ROM_black_sea_desc: "The Black Sea is of our upmost importance for our safety, as that is through where our trade goes and a large chunk of our income comes from."
 ROM_new_dolphin: "새로운 돌핀"
 ROM_new_dolphin_desc: "The Doplhin was our sole nucll intoimdisne, but due to a lack of funds it fell into disrepair and now is nothing more than a glorified museum. We shall seek a replacement to further streghten our hold in the Black Sea."
 ROM_modernize_the_fleet: "함대 현대화"
 ROM_modernize_the_fleet_desc: "함대 전체가 사실상 낡아빠진 폐허입니다. 동맹국에 연락하여 퇴역한 함선을 사 올 수 있는지 알아봐야 합니다. 어차피 지금 우리가 가진 것보다는 훨씬 나을 것입니다."
 ROM_invest_in_the_naval_academy: "해군사관학교 투자"
 ROM_invest_in_the_naval_academy_desc: "현대적인 장비의 부족은 유능한 장교의 부족으로 더욱 악화됩니다. 이 문제에 대응하는 주된 방법은 콘스탄차 해군사관학교를 통하는 것입니다. 이를 현대화하면 더 많은 학생을 끌어들여 인원을 늘릴 수 있습니다."
 ROM_master_of_the_pontus_euxinus: "폰투스 에욱시누스의 지배자"
 ROM_master_of_the_pontus_euxinus_desc: "투자와 개혁, 현대화 계획을 통해 우리는 적어도 당분간은 흑해에 대한 통제권을 확보할 수 있었습니다."
 ROM_greater_romania_party: "대루마니아당"
 ROM_greater_romania_party_desc: "Founded in 1991, the Greater Romania Party, under the leadership of Vadim, emerged as a formidable force in the political landscape. With its fervent nationalism and unwavering commitment to reclaiming lost territories, the party swiftly garnered support among those disillusioned with the status quo. Having won a clear victory in the elections, and powered by a potent blend of populism and xenophobia, the promises to restore Romania to its former glory. Yet, beneath the veneer of patriotism lay a darker agenda...much darker than many of its voters realized."
 ROM_control_the_sri: "SRI 장악"
 ROM_control_the_sri_desc: "정보기관은 루마니아 국가에 막대한 영향력을 행사하고 있으며, 많은 이들이 그 통제가 어디까지 미치는지조차 깨닫지 못하고 있습니다. 이들을 장악하면 사실상 무한한 권력의 원천을 얻게 되며, 이는 루마니아를 구하는 데 꼭 필요한 것입니다."
 ROM_militieni: "밀리치에니"
 ROM_militieni_desc: "1989년의 많은 실수 중 하나는 밀리치에니의 해체였습니다. 그들이 자유의지를 억압하는 데 쓰인 나쁜 존재였다는 주장도 있지만, 나는 감히 그렇지 않다고 말하겠습니다. 이 조직을 재건하면 우리를 더욱 파괴하려는 선동가들로부터 국민의 안전을 보장할 수 있습니다."
 ROM_buy_the_media: "언론 매수"
 ROM_buy_the_media_desc: "언론이 손쉽게 매수될 수 있다는 것은 공공연한 진실이며, 전략적인 선물을 통해 우리의 가치와 목표를 반영하도록 여론의 흐름을 만들 수 있습니다. 언론을 손에 넣으면 우리의 메시지를 나라 구석구석까지 전달하고, 여론을 형성하며 반대 의견을 잠재울 안전한 방법이 됩니다."
 ROM_harness_the_anger: "분노를 활용하라"
 ROM_harness_the_anger_desc: "수년간 쌓인 분노와 아직 쓰이지 않은 에너지가 있습니다. 국민을 정적들에 맞서 동원하여 그 분노로 그들의 경력을 무너뜨리고, 내가 시키는 대로 할 수밖에 없는 작은 구석으로 몰아넣을 수 있습니다."
 ROM_union_of_patriots: "애국자 연합 결성"
 ROM_union_of_patriots_desc: "국민을 더욱 동원하기 위해, 조국에 대한 공통된 사랑으로 모두가 하나로 묶이는 시민 단체를 설립하기로 결정했습니다. 민족적 자긍심의 불꽃과, FSN 흉내나 내는 자들이 강요하는 현 상태에 대한 증오가 이를 달굴 것입니다."
 ROM_eyes_on_the_opposition: "야당 감시"
 ROM_eyes_on_the_opposition_desc: "These cockroaches have been left to their own bidding for too long, they have become a danger to the very fiber of our nation. We will turn the entire attention of the state apparatus to these traitors to make sure they wont take a step further in destabilizing us."
 ROM_strongarm_the_parliament: "의회 압박"
 ROM_strongarm_the_parliament_desc: "The Parliament is the peoples greatest enemy. A corrupt institution filled to the brim with members of the political elite, while the average Romanian suffers. These parasites will no longer feast on the blood of our nation. A few threats, some blackmail and wire tapping will go a long way to pressure the Parliament into listening to reason."
 ROM_society_built_on_hatred: "증오 위에 세워진 사회"
 ROM_society_built_on_hatred_desc: "국민이 자신의 최선의 이익을 분별할 수 있다고 믿을 수는 없습니다. 그들은 거짓과 조작에 쉽게 흔들리고, 선동가와 사기꾼의 변덕에 취약합니다. 이 신성한 국가의 지도자로서 그들을 이끌고, 그들 자신으로부터 보호하는 것이 나의 의무입니다. 이 사회는 밑바닥부터 다시 세워질 것입니다. 나는 국민이 서로를 의심하게 만들고, 친근한 가면을 쓴 적을 늘 경계하게 할 것입니다. 그래야만 루마니아가 자유로워질 것입니다."
 ROM_terror_in_bucharest: "부쿠레슈티의 공포"
 ROM_terror_in_bucharest_desc: "§RIn the shadows lurks treachery, a cancer that threatens the very fabric of our nation. I will liberate Romania of it and purge the rot from our midst. They will all be eliminated, one by one, until none remain to challenge me, to challenge the pure future I alone will build for the romanian kind§!"
 ROM_foundation_of_the_national_state: "루마니아 민족 국가의 토대"
 ROM_foundation_of_the_national_state_desc: "민족주의를 길잡이 별로 삼아 루마니아의 구조 자체를 바꾸는 일에 착수할 것입니다. 외세의 이익에 굴종하고 내부적으로 분열하던 시대는 끝났으며, 이제 우리 민족을 위한 우리만의 운명을 세울 때입니다. 우리나라는 §R대가§!에 상관없이 자랑스럽고 순수하게 우뚝 설 것입니다."
 ROM_self_sufficiency: "자급자족 달성"
 ROM_self_sufficiency_desc: "과거 정부들은 우리가 자립할 능력과 자원을 갖추고 있었는데도 외국 수입품과 상품에 의존하게 만들었습니다! 우리는 이 의존의 고리를 끊고 경제 영역에서 주권을 되찾을 것입니다. 국내 산업에 대한 전략적 투자, 지역 생산의 활성화, 자급자족의 우선시를 통해 우리나라 자원의 잠재력을 남김없이 끌어낼 것입니다. 더는 기본적인 필요를 채우기 위해 외세에 얽매이지 않을 것입니다. 대신 우리 자신의 역량을 활용하여 무엇보다 우리 국민의 이익에 이바지하는 번영하는 경제를 만들 것입니다."
 ROM_nationalize_capitalist_industries: "자본주의 산업 국유화"
 ROM_nationalize_capitalist_industries_desc: "외국 자본가들은 너무나 오랫동안 우리 영토에서 활동하며 아무런 대가 없이 우리를 착취하도록 허용되었습니다. 이들 산업을 국유화함으로써 우리는 경제의 핵심 부문에 대한 통제권을 되찾고, 우리 자원에서 창출된 부가 루마니아 국민의 손에 남도록 보장할 것입니다. 이것이 루마니아는 더 이상 외세 이익의 놀이터가 아니라, 번영과 자결을 향한 자신만의 길을 개척하는 주권 국가임을 세계에 알리는 분명한 신호가 되게 하십시오."
 ROM_militarization_programs: "군사화 계획"
 ROM_militarization_programs_desc: "진화하는 위협과 세계적 불확실성 앞에서 아무리 안전을 기해도 지나치지 않습니다. 루마니아 사회 전체가 군사화되어야 하며, 거리를 배회하는 청년부터 직장의 숙련된 전문가에 이르기까지 모든 사람이 언제든 조국을 지킬 준비가 되어 있어야 합니다. 포괄적인 군사화 구상을 통해 모든 시민에게 의무감과 규율, 준비 태세를 심어 주고, 조국을 보호하는 데 필요한 기술과 마음가짐을 갖추게 할 것입니다. 기본 훈련부터 비상 대응 훈련에 이르기까지, 우리 사회의 모든 구성원이 루마니아의 안전과 안보를 보장하는 데 필수적인 역할을 맡게 될 것입니다."
 ROM_forward_legionaries: "전진하라, 군단원들이여!"
 ROM_forward_legionaries_desc: " Inspired by the spirit of sacrifice and camaraderie that defined the Iron Guard, we stand ready to confront any obstacle and overcome any adversity that may threaten our beautiful country. With unwavering determination and steadfast resolve, we march forward into the future under the guide of our new Captain- Vadim. Togheter we will make a Romania as beautiful as the Holy Sun!"
 ROM_reshaping_romania: "루마니아 재편"
 ROM_reshaping_romania_desc: "새로운 민족 국가의 토대가 마련되었음에도 루마니아의 구조 자체는 여전히 외세 영향의 잔재와 낡은 제도로 얼룩져 있습니다. 이러한 과거의 잔재를 해체하고 우리나라를 독립과 강인함의 요새로 재편하는 것이 필수적입니다."
 ROM_look_to_legionarism: "군단주의를 되돌아보다"
 ROM_look_to_legionarism_desc: "군단원들은 루마니아를 위한 최선을 원했던 애국자들이었으나, 저 외국인 왕 카롤 2세에게 탄압당했습니다. 철위단이 사라진 지 오래지만 그들의 사상은 여전히 강력하며, 이를 활용해 민족주의 운동을 되살릴 수 있습니다. 그들의 원칙을 장려하고 순교자들을 우리 투쟁의 상징으로 격상시킴으로써, 새로운 세대가 일어나 역사에 기록될 우리의 정당한 자리를 되찾도록 고취할 수 있습니다."
 ROM_cult_of_personality: "개인숭배"
 ROM_cult_of_personality_desc: "루마니아인들에게는 하나로 모일 인물, 더 나은 조국을 향한 우리의 여정에서 그들을 이끌 사람이 필요합니다. 내가 그 사람이 될 것입니다. 끊임없는 선전과 언론의 전략적 조작을 통해 나 자신을 숭앙받는 지위로 끌어올리고, 루마니아의 강인함과 회복력, 번영의 화신으로 내세울 것입니다. 모든 연설과 포고령 하나하나로 나는 국민의 마음과 정신 속에 내 자리를 굳히고, 변함없는 충성과 숭배를 키워 갈 것입니다. 나의 모습이 어디에나 있게 하고, 나의 말이 복음이 되게 하십시오."
 ROM_rehabilitate_ceausescu: "차우셰스쿠 복권"
 ROM_rehabilitate_ceausescu_desc: "차우셰스쿠는 그저 많은 이들에게 오해받았을 뿐입니다. 그는 더 나은 루마니아를 건설하려는 열망에 눈이 먼 선견자였고, 바로 동료들에게 배신당했으며, 우리는 이 역사의 과오를 바로잡을 것입니다. 우리는 그를 복권시키고, 이 규탄의 족쇄를 벗어던지며, 현대 공화국의 창건자로서 그의 유산을 받아들일 것입니다."
 ROM_ceausescu_is_young_again: "차우셰스쿠가 다시 젊어졌다!"
 ROM_ceausescu_is_young_again_desc: "모든 상점 앞, 모든 학교와 병원, 심지어 거리에서도 한 사람, 코르넬리우 바딤 투도르의 초상화를 볼 수 있습니다. 그의 비전은 우리를 이끌고, 그의 지도력은 우리를 고무시키며, 루마니아 국민에 대한 그의 변함없는 헌신은 우리를 하나로 묶습니다. 권력의 전당에서 우리나라의 가장 낮은 구석에 이르기까지 그의 존재가 느껴지며, 이는 우리의 공동 운명과 더 밝은 미래에 대한 약속을 상기시킵니다. 번영과 자긍심이 가득한 새 시대의 여명을 향해 함께 전진하는 동안, 그의 모습이 우리 모두에게 희망과 영감의 등불이 되게 하십시오."
 ROM_empower_the_farmers: "농민 역량 강화"
 ROM_empower_the_farmers_desc: "공산당의 '위대한 지성들'은 농민에게서 토지와 재산을 강제로 빼앗고 국영 거대 복합 기업에서 일하도록 강요하는 것이 훌륭한 생각이라 여겼고, 이는 농촌을 파멸시키고 농촌 사회를 영원히 파괴했습니다. 하지만 우리는 전임자들과 다릅니다. 우리는 농민이 우리나라의 번영에서 맡는 핵심적인 역할을 인정합니다. 우리는 그들이 번창하는 데 필요한 도구와 자원으로 그들의 역량을 강화할 것을 약속하며, 루마니아 농업의 잠재력을 남김없이 끌어내어 농민들이 국민을 먹여 살리고 경제 성장에 기여할 수 있게 할 것입니다."
 ROM_continue_rural_systematization: "농촌 계획화 계속"
 ROM_continue_rural_systematization_desc: "1980년대에 차우셰스쿠는 루마니아 농촌을 저개발된 농경 지대에서 사회주의적 진보와 효율의 모범으로 탈바꿈시키려는 대규모 현대화 계획을 시작했습니다. 이 사업은 그가 자본주의자들에게 전복되었을 때 막 시작된 참이었지만, 우리가 이어갈 수 있습니다. 농촌 계획화를 통해 작고 흩어진 정착지의 주민들을 더 큰 농공 복합단지로 이주시켜 새로 지은 아파트 단지에서 살게 하고, 버려진 마을은 철거하여 경작하기 알맞은 농지로 만들 것입니다. 주민들이 원하는 만큼 저항해도 좋지만, 진보의 행군을 막을 수 있는 것은 없습니다!"
 ROM_reconcile_with_barons: "남작들과 화해"
 ROM_reconcile_with_barons_desc: "그들은 기생충입니다. 그건 사실이지만, 서로를 파괴하는 대신 그들과 동맹을 맺을 수도 있습니다. 그렇게 하면 전략적 기업과 자금에 접근할 수 있고, 이는 배신적인 세력의 반대를 억누르고 각 주에 대한 우리의 통제를 강화하는 데 도움이 될 것입니다."
 ROM_new_political_elite: "새로운 정치 엘리트"
 ROM_new_political_elite_desc: "Now that our enemies are gone we unwillingly created a power vacuum. Theres a clear lack of bureaucrats and so we must establish a new political elite to help rule over the people. It will be a long and exhausting effort, but one that will help us in the long run."
 ROM_purge_the_land_barons: "토지 토호 숙청"
 ROM_purge_the_land_barons_desc: "우리는 너무 오랫동안 이 해충들을 용인해 왔습니다. 돈을 과시하며 그것이 감옥에서 풀려나는 공짜 카드라고 생각합니다. 그들은 뇌물로 모든 장애물을 통과할 수 있다고 믿지만, 더는 아닙니다. 그들은 더 이상 정의를 피하지 못할 것이며, 국민에게 한 짓에 대한 대가를 모두 치를 것입니다."
 ROM_enforce_political_loyalty: "정치적 충성 강요"
 ROM_enforce_political_loyalty_desc: "당면한 상황은 정치적 다툼이 계속되는 것을 허락하지 않습니다. 루마니아에 필요한 것은 더 큰 분열이 아니라 단결입니다. 엄격한 이념 교육 프로그램과 감시 강화를 통해 우리의 대의에 대한 변함없는 충성을 보장할 수 있습니다."
 ROM_realizing_greater_romania: "대루마니아 실현"
 ROM_realizing_greater_romania_desc: "얼마 전까지만 해도 루마니아는 하나였고 행복했지만, 사방이 적으로 둘러싸인 1940년에 우리는 멸망을 맞거나 넓은 영토를 포기해야 하는 처지에 놓여 모든 것이 무너져 내렸습니다. 그 이후 우리는 먼 길을 왔으며, 더는 외세의 처분에 맡겨져 있지 않습니다. 이제 다시 한번 지역 강국으로서 세계 무대에 설 때가 왔습니다."
 ROM_retake_southern_dobruja: "남부 도브루자 탈환"
 ROM_retake_southern_dobruja_desc: "대루마니아의 첫 영토였던 남부 도브루자는 그 비열한 불가리아인들이 독일의 개들을 등에 업고 우리가 약해진 순간을 노려 빼앗아 갔습니다! 더는 안 됩니다! 도브루자는 루마니아 삼색기 아래 다시 하나가 될 것입니다!"
 ROM_destroy_the_magyars: "마자르인 격파"
 ROM_destroy_the_magyars_desc: "헝가리인들은 수백 년 동안 트란실바니아를 약탈하고 파괴해 온 우리 존재의 골칫거리였습니다. 그들은 계속해서 우리에게 맞서고 대평원의 사람들을 여전히 억압하고 있지만, 이제는 복수할 때입니다. §Y우리의 땅을 해방하고 티서강을 다시 루마니아의 것으로 만듭시다§!"
 ROM_end_the_fake_state: "가짜 국가의 종말"
 ROM_end_the_fake_state_desc: "Transnistria stands as a mockery of our sovereignity. A fake state created by the Russian puppeteers, meant to be a festering abscess on our proud history, a viper's nest of deception and deceit. Their very existence is an insult to our national pride. They were once a romanian land before those barbarians colonized them, but it's time to §Yrestore Transnistria to it's former glory§!."
 ROM_our_stolen_lands: "빼앗긴 우리의 땅"
 ROM_our_stolen_lands_desc: "우크라이나가 베사라비아 침공과 합병을 정당화하기 위해 스탈린이 만든 인위적인 국가라는 것은 비밀이 아닙니다! 이제 부자크와 부코비나는 무자비한 우크라이나의 군홧발 아래 신음하며 조국으로 돌아가기를 간청하고 있습니다. 하지만 기다림은 끝났습니다. 그들의 §R해방§!의 때가 왔습니다!"
 ROM_unite_banat: "바나트 통합"
 ROM_unite_banat_desc: "베르사유 조약은 바나트를 두 쪽으로 갈라놓아 심각한 불의를 저질렀습니다. 세르비아인은 수십 년간 우리의 동맹이자 가까운 친구였지만, 그들이 국경 안에 사는 루마니아인에게 가하는 부당한 대우를 부정할 수 없으며, 따라서 서바나트를 계속 통제하도록 믿고 맡길 수 없습니다. 그들에게는 죄를 뉘우칠 기회가 한 번 주어질 것이며, 거부하거나 저항하면 우리의 정의로운 힘으로 짓밟힐 것입니다!"
 ROM_the_reunification_of_all_romanians: "모든 루마니아인의 재통일"
 ROM_the_reunification_of_all_romanians_desc: "After years, our national spirit has finally been achieved. No longer will the Romanians be forced to bow to a foreign oppressor, no longer have to learn a language that isn't their, no longer will they have to suffer under the arbitrary whip of a careless pillager. They will finally be able to say in unison, from the Tisza to the Dnister and the Black Sea:'§YLong Live Greater Romania§!'"
 ROM_launch_propaganda_campaigns: "선전 캠페인 개시"
 ROM_launch_propaganda_campaigns_desc: "세심하게 구성한 메시지와 이미지, 서사를 통해 루마니아 국민의 마음과 정신을 사로잡고, 그들에게 깊은 자긍심과 충성심, 단결심을 심어줄 것입니다. 지도부의 업적을 홍보하든, 적을 악마화하든, 애국심과 희생을 고취하든, 우리의 선전 캠페인은 끈질기고 광범위하게 이루어져 우리의 메시지가 닿지 않는 구석이 없게 할 것입니다."
 ROM_united_in_orthodoxy: "정교회 아래 하나로"
 ROM_united_in_orthodoxy_desc: "루마니아 공산당은 헛되이 정교회 신앙을 억압하려 했고 이는 광범위한 저항으로 이어졌습니다. 그들이 실수를 깨닫고 정교회를 공산 사회에 통합하려 했을 때는 이미 너무 늦었으며, 국민은 봉기했습니다. 우리는 같은 실수를 반복하지 않을 것입니다. 정교회를 우리 정체성의 등불로 삼아, 세속의 분열을 초월하고 깨질 수 없는 유대를 이루는 신성한 결속으로 우리를 하나로 묶을 것입니다."
 ROM_a_crusade_against_traitors: "배신자에 대한 성전"
 ROM_a_crusade_against_traitors_desc: "모든 숙청 이후에도 배신자들은 여전히 남아 있습니다. 우리는 국가의 적들에 맞서 정의로운 성전을 시작하고, 흔들림 없는 결의와 강철 같은 의지로 그들을 분쇄할 것입니다!"
 ROM_the_new_pioneers: "새로운 개척단"
 ROM_the_new_pioneers_desc: "역사 속에는 수많은 청소년 조직이 있었지만, 오늘날 우리에게 남은 것은 신통치 않고 조직화되지 않은 스카우트 단체뿐입니다. 우리는 이 모든 조직을 하나로 통합하여, 청소년들에게 민족 유산의 이상과 우리 이념의 원칙을 가르치는 역할을 맡는 새로운 개척단 청소년 조직을 만들 것입니다. 체계적인 교육 프로그램, 애국 활동, 이념 훈련을 통해 이 조직은 미래 세대에게 루마니아 국가에 대한 깊은 충성심과 민족주의 가치에 대한 열렬한 헌신을 심어 줄 것입니다."
 ROM_our_national_hero: "우리의 민족 영웅"
 ROM_our_national_hero_desc: "바딤은 루마니아에 새로운 황금기를 선사했습니다. 우리나라는 더 이상 약하고 병들지 않았으며, 외국 약탈자들이 우리에게 강요한 국경으로 갈라지지도 않았습니다! 루마니아는 바딤의 선견지명 있는 지도력 아래 다시 하나가 되어 위대해졌으며, 민족의 위대함에 대한 그의 변함없는 헌신은 우리를 번영과 강성의 새로운 정점으로 이끌었습니다. 바딤이 키를 잡은 가운데 우리는 희망과 회복력의 등불로 서서, 영광스러운 미래로 향하는 길에서 어떤 도전에도 맞서고 모든 기회를 붙잡을 준비가 되어 있습니다. 지도자 뒤에 결집하여 자신감을 가지고 앞으로 나아갑시다. 함께라면 헤아릴 수 없는 위대함을 이룰 것임을 알기 때문입니다."
 ROM_reform_the_patriotic_guards: "애국 근위대 개편"
 ROM_reform_the_patriotic_guards_desc: "We can never be too safe. The enemy is always lurking, always watching for a sign of weakness. They seek to destroy us and wipe our very kind from the face of the planet. To stop this from ever happening, I took the decision to re-establish the Patriot Guards, a paramilitary organization that will act as our first line of defense against our foes."
 romania_elections.1.t: "루마니아 [GetYear]년 대통령 선거"
 romania_elections.1.d1: "The [socialism_L] has managed to win a landslide against it's opponents running on a left-wing platform and a pragmatic stance on several social issues, and having taken taken advantage of dissarray within the Romanian right-wing."
 romania_elections.1.d2: "The [Nat_Populism_L] has stunned everyone by managing to elect Corneliu Vadim Tudor, a stunch ultrantionalist as president against Ion Iliescu leader of the Social Democrats. However due to Vadim's Extreme Views and his lack of a parliamentary majority it is unclear how the political scene will react."
 romania_elections.1.d3: "The [conservatism_L] has managed to win the presidency in an upset, after managing to regain the trust lost by president Emil Constantinescu from the PNTCD, through it's christian democratic and agrarian platform."
 romania_elections.1.d4: "The [liberalism_L] has managed to win the presidency in an upset, after managing to regain the trust lost by the PNL's Participation in the PNTCD led coalition of President Emil Contantinescu, running on a liberal economic and social platform."
 romania_elections.1.d5: "[neutral_Social_L] 소속의 전 총리 페트레 로만이 90년대 중반 지지율 하락 이후 인기를 회복하는 데 성공하며 이변 속에 대통령직을 차지했고, 이제 [socialism_L]을(를) 대신하여 루마니아의 주요 사회민주주의 세력이 되었습니다."
 romania_elections.1.d6: "The [Neutral_conservatism_L] centered around it's charismatic leader Traian Basescu has managed to win the presidency promising a new start in Romania's economic and European direction."
 romania_elections.1.d7: "새로운 정치 세력이 현상을 타파하는 데 성공했으며, 이것이 앞으로 몇 년간 루마니아에 어떤 영향을 미칠지는 두고 볼 일입니다."
 romania_elections.1.a: "국민이 승리했다!"
 romania_elections.1.b: "루마니아를 다시 위대하게 만들겠다!"
 romania_elections.1.c: "개혁주의가 승리했다!"
 romania_elections.1.f: "민주주의가 승리했다!"
 romania_elections.1.e: "안정이 승리했다!"
 romania_elections.1.u: "바세스쿠가 우리를 이끈다!"
 romania_elections.1.s: "새로운 것을 할 때다!"
 romania_misc.1.t: "바이아 마레 시안화물 유출"
 romania_misc.1.d: "In the night of the 30th of January 2000, a dam holding contaminated water near Baia Mare collapsed and a leak occurred where the water spilled into the Somes river eventually reaching the Tisza river and the Danube. The spill of cyanide caused the death of large numbers of fish in Romania, Serbia and Hungary with it also contaminating the drinking supplies of over 2.5 million Hungarians. Aurul, the mine operator, which a joint venture company formed by the Australian company Esmeralda Exploration and the Romanian government has claimed that the collapse of the dam and the subsequent spill occurred due to excessive snowfall. The disaster has been called the worst environmental disaster in Europe since the Chernobyl nuclear plant disaster in 1986."
 romania_misc.1.a: "좋지 않은 일이군."
 romania_misc.2.t: "이온 게오르게 마우러 사망"
 romania_misc.2.d: "전 총리 이온 게오르게 마우러가 97세의 나이로 세상을 떠났습니다. 1961년부터 1974년까지 루마니아 정부 수반을 지낸 마우러는 공산 시대의 저명한 인물이자 니콜라에 차우셰스쿠의 핵심 정치적 동맹이었습니다. 루마니아 공산당(PCR)에 입당하기 전에는 변호사였고 선전선동부에서 활동가로 일했던 그의 재임 기간은, 냉전 시기 소련 및 서방과의 복잡한 관계를 헤쳐 나가려는 노력으로 특징지어졌습니다. 어떤 이들에게는 애도의 시간이지만, 다른 이들에게는 공산 시대의 생존한 상징 중 하나가 마침내 시들어 사라진 축하의 날입니다."
 romania_misc.2.a: "논란이 많은 인물임은 분명하다"
 romania_misc.3.t: "뎀 러둘레스쿠 사망"
 romania_misc.3.d: "Former actor and comedian, Dem Radulescu, has passed today at the age of 68. Known for his versatile talent and distinctive sense of humor, Radulescu became a household name in Romania during his career, which spanned theater, film, and television. His contributions to Romanian comedy are widely recognized, particularly through his roles in popular films and stage productions, where he showcased his ability to connect with audiences across generations. With his death, the World just get's slightly more boring."
 romania_misc.3.a: "하느님이 그를 편히 쉬게 하시기를!"
 romania_misc.4.t: "헌법재판소장 사임"
 romania_misc.4.d: "헌법재판소장 루치안 미하이가 갑작스럽게 사임을 결정했습니다. 1998년 에밀 콘스탄티네스쿠에 의해 임명되어 2007년까지 헌법재판소장(CCR)을 지낼 예정이었기에 그의 결정은 더욱 기이합니다. 최근 발언에 따르면 루치안은 오래전에 이 결정을 내렸으나, 차기 헌법재판소장 지명 과정에 영향을 미치지 않으려고 지금까지 공개하지 않았다고 합니다. 이유가 무엇이든 정당한 것이기를 바랍니다."
 romania_misc.4.a: "안녕히"
 romania_misc.5.t: "불칸 광산 참사"
 romania_misc.5.d: "어젯밤 페트로샤니의 불칸 광산에서 강력한 폭발이 일어나 광부 14명이 사망하고 1명이 부상을 입었습니다. 폭발 원인은 아직 알려지지 않았고 조사가 진행 중이지만, 이는 지난 몇 년간 이어진 일련의 사고 중 하나일 뿐입니다."
 romania_misc.5.a: "그곳은 저주받은 게 틀림없어."
 romania_misc.6.t: "코르넬리우 바딤 투도르, 면책 특권 박탈"
 romania_misc.6.d: "Parliament has decided, in an overwhelming 'aye' vote, to strip C.V Tudor of his political immunity after being accused of sprreading misinformation. Vadim's declarations were less than stellar, mainly his accusations that Romania was training Palestinian terrorists. Itself, the vote went without any incidents but it's assumed the reason for that was because the PRM MPs boycotted the meeting."
 romania_misc.6.a: "이 무슨 난장판인가!"
 romania_misc.7.t: "필란트로피카 개봉"
 romania_misc.7.d: "나에 카란필 감독의 '필란트로피카'가 공식 개봉하여 평단과 관객 모두에게서 폭넓은 관심을 받고 있습니다. 탈공산주의 루마니아의 기만과 빈곤, 사회적 조작이라는 주제를 탐구하는 이 블랙 코미디는 날카로운 풍자와 현대 사회에 대한 가슴 저미는 묘사로 지금까지 주목받았습니다. 영화는 전문 거지 무리가 꾸민 정교한 계략에 얽히게 되는 고등학교 교사 오비디우 고레아의 이야기를 따라가며, 부쿠레슈티 삶의 경제적 고난과 도덕적 모호함을 조명합니다."
 romania_misc.7.a: "루마니아 영화의 빛나는 본보기다!"
 romania_misc.8.t: "카롤 2세 유해 송환"
 romania_misc.8.d: "The remains of Carol II, pour former King, have been repatriated and returned to Romanian soil. Carol II, who ruled over Romania from 1930 to 1940, was and remains a divisive figure, with some considering him the right person at the wrong time and others seeing him as the man who buried Greater Romania due to his own ego. Regardless of public opinion, he is now to return to Romania and rest in the country he once reigned over. King Michael has refused to participate at the funeral service which isn't a surprise for anyone."
 romania_misc.8.a: "Rightful buried in Romanian soil"
 romania_misc.9.t: "엘리자베타 리제아 사망"
 romania_misc.9.d: "루마니아 반공 저항의 상징인 엘리자베타 리제아가 91세를 일기로 세상을 떠났습니다. 정권 초기 파가라슈 산맥에서 반공 빨치산을 지원한 용감한 역할로 알려진 리제아는 억압에 대한 회복력과 저항의 영원한 상징이 되었습니다. 반공 저항 운동에 연루된 혐의로 두 차례 체포되어 고문을 당한 그녀는 변함없는 용기와 도덕적 신념의 유산을 남겼습니다. 많은 이들이 포기했을 때조차 그릇되다고 생각한 것에 저항하려는 그녀의 결의는 존경받아 마땅합니다."
 romania_misc.9.a: "편히 잠드소서"
 romania_misc.10.t: "미르체아 스트네스쿠 자살"
 romania_misc.10.d: "MP Mircea Stanescu, from the PSD, has apparently killed himself today. He he committed a car accident which resulted in the death of a pedestrian who was lawfully crossing a street in Bucharest, and it seems the guilt of the accident was simply overwhelming."
 romania_misc.10.a: "비극적인 일이군"
 romania_misc.11.t: "아브델라 사업 시작"
 romania_misc.11.d: "The Avdhela Project, a new cultural initiative aimed at preserving and promoting Aromanian heritage, has officially been launched. The project seeks to document, preserve and celebrate the language, traditions and and history of the Aromanian people, a minority group closely related to us."
 romania_misc.11.a: "중요한 구상이다"
 romania_misc.12.t: "게오르게 디니커 사망"
 romania_misc.12.d: "우리 역사에서 가장 중요한 루마니아 배우 중 한 명인 게오르게 디니커가 심장마비 후 회복하지 못하고 다발성 장기 부전으로 세상을 떠났습니다. 40년이 넘는 경력과 70편의 영화, 루마니아 영화계의 다른 전설적인 감독 및 배우들과의 수많은 협업을 쌓아 온 그의 별세는 크게 애도될 것이며 그의 유산은 결코 잊히지 않을 것입니다."
 romania_misc.12.a: "하느님이 그를 용서하시기를!"
 romania_misc.13.t: "시게트 폭발 사고"
 romania_misc.13.d: "어젯밤 늦게 시게트 마르마치에이의 한 나이트클럽에서 폭발이 일어났으며, 가스가 쌓여 발생한 것으로 추정됩니다. 폭발은 10대 청소년 무리가 클럽 화장실에서 담배를 피우면서 촉발되었습니다. 현재 알려진 사상자는 이 청소년들뿐이며, 화상 치료를 위해 바이아 마레로 이송되고 있습니다. 당국이 사건을 조사하고 있으며, 부상자들의 상태를 면밀히 관찰하고 있습니다."
 romania_misc.13.a: "젠장"
 romania_misc.14.t: "시게트에서 또 폭발"
 romania_misc.14.d: "불과 몇 시간 뒤 같은 나이트클럽에서 두 번째 폭발이 일어나 10명이 더 부상을 입었습니다. 이번 폭발의 원인은 여전히 불분명하지만, 건물의 가스 공급이 제대로 차단되지 않았다는 소문이 돌고 있습니다. 가스 감지기의 전기 방전이 남아 있던 가스를 폭발시켰을 것으로 추측됩니다. 조사는 계속되고 있으며, 부상자들은 인근 병원으로 이송되어 치료를 받고 있습니다."
 romania_misc.14.a: "농담이겠지"
 romania_misc.15.t: "파괴적인 산불"
 romania_misc.15.d: "지난 이틀간 산불이 아르제슈와 메헤딘치 주 일부를 휩쓸어 상당한 피해와 인명 손실을 초래했습니다. 아르제슈에서는 주민들이 마른 초목에 불을 붙인 후 화재가 발생했습니다. 불길은 빠르게 번져 주택 5채를 집어삼키고 파괴의 흔적을 남겼습니다. 이 지역의 소방관들은 지칠 줄 모르고 일하여 48시간 만에 50건의 개별 화재를 진압했습니다. 지금까지 화재로 최소 5헥타르의 산림이 소실되었고 기세가 수그러들 기미가 보이지 않아, 소방관들은 도로를 정리하고 불길이 번지는 것을 막기 위해 방화 도랑을 파며 초과 근무를 하고 있습니다."
 romania_misc.15.a: "젠장"
 romania_misc.16.t: "루제룰루이 지하차도 사고"
 romania_misc.16.d: "이른 아침 110번 트램이 루제룰루이 지하차도에서 고장 나 수리가 필요해지면서, 기이한 사고가 부쿠레슈티를 충격에 빠뜨렸습니다. 비상 요원들이 트램을 수리하는 동안 300번 트램이 조심스럽게 지하차도에 접근했고, 앞에 선 고장 차량을 발견하고 정차했습니다. 두 트램의 승객들은 차량이 공식적으로 운행 중지로 선언된 후에야 하차할 수 있다는 RATB 방침에 따라 차 안에 머물렀습니다.\n\n인근 대로는 교통량이 많지 않았지만, 지하차도 너머에 있는 가장 가까운 정류장까지 걸어가려면 차도와 콘크리트 기초 위에 놓인 트램 선로를 가로질러야 했기에 하차는 쉽지 않았을 것입니다. 잠시 후 296번 트램이 시속 50km로 지하차도에 진입했습니다. 운전사는 앞에 정차한 트램들을 발견했지만 브레이크가 고장 나 296번 트램이 300번 트램의 후미를 들이받았고, 이 충격으로 300번 트램이 110번 트램을 밀어붙였습니다. 충격이 너무 심해 두 트램 모두 탈선했고, 내부의 승객들은 충돌의 힘에 튕겨 나가 부상을 입었습니다. 현재 공식 보고서에 따르면 96명이 부상을 입었으며 그중 다수는 긴급 수술이 필요한 상태입니다."
 romania_misc.16.a: "예상치 못한 일이었다"
 romania_misc.17.t: "아드리안 너스타세 자살 시도"
 romania_misc.17.d: "전 총리 아드리안 너스타세가 트로페울 칼리타치 사건으로 징역 2년을 선고받은 후 자살을 시도했습니다. 너스타세가 스스로 목에 총을 쏜 뒤 구급대원들이 그의 자택에 도착했습니다. 응급 신고는 너스타세가 체포를 피하기 위해 극단적인 조치를 취할 준비가 되어 있음이 분명해지자 우려한 내무부 장관 이오안 루스가 했습니다. 현재 전 총리는 안정적인 상태이며 면밀한 의료 감시를 받고 있습니다. 당국이 상황을 면밀히 주시하고 있습니다."
 romania_misc.17.a: "그의 시도는 확실히 부질없었다"
 romania_misc.18.t: "교황의 루마니아 방문"
 romania_misc.18.d: "교황이 역사적인 방문을 위해 루마니아에 도착했으며, 이는 우리나라의 종교 및 문화 일정에서 중요한 순간입니다! 교황은 부쿠레슈티와 이아시 같은 주요 도시를 방문할 뿐 아니라, 루마니아 안팎에 사는 가톨릭 세클레르인과 헝가리인의 중요한 순례지인 슘률레우 치우크에도 중요한 일정으로 들를 예정입니다."
 romania_misc.18.a: "성하를 환영하라!"
 romania_politics.1.t: "CDR 재협상?"
 romania_politics.1.d: "The Romanian Democratic Convention (CDR) coalition founded in 1992 as an anti-government coalition of centre-right parties was elected to power in 1996 with Emil Constantinescu as the first non-socialist president since the fall of communism. However the coalition fell apart after infighting and multiple cabinet changes coupled with a stagnant economic situtation. However with the rise of the ultranationalist [Nat_Populism_L] it could be a chance for us to reform the alliance in order to ensure a pro-democratic force exists in our country. The [conservatism_L] is pushing for a referendum on the return of the Romanian monarchy, which was ousted in 1947 by the communist regime. Many in the [liberalism_L] are opposed to the idea but some say it is a necessary compromise in order to defend Romanian Democracy Nevertheless the decision made between the parties will surely have an impact on the upcoming election."
 romania_politics.1.a: "루마니아를 위해 타협하겠다"
 romania_politics.1.b: "이건 너무 지나치다"
 romania_politics.2.t: "단일 후보 지명"
 romania_politics.2.d: "With the Renewal of the CDR coalition, The common question now is who will be the new joint presidential canditate of the CDR after Emil Constantinescu's announcement that he will not be seeking a second term. The two favoured canditates are former prime minister Theodor Stolojan favoured by the PNL and prime mimister Mugur Isarescu favoured by the PNTCD, Theodor Stolojan served as prime minister between 1991 and 1992 overseing a rough period of economic instability as well as special economic measures in order to combat inflation while prime minister Mugur Isarescu was governor of the national bank of Romania and is credited with helping the economic stabilization of Romania."
 romania_politics.2.a: "테오도르 스톨로얀이 지명되었다"
 romania_politics.2.b: "무구르 이저레스쿠가 지명되었다"
 romania.13.d: "100 years ago on the 1st of December 1918 the National Assembly of Romanians of Transylvania and Hungary convened in the city of Alba Iulia and voted the unification of Transylvania with the Kingdom of Romania. The unification with Bessarabia (present day Moldova) is also celebrated as it occurred in the same year of 1918. Greater Romania lasted until 1940 when the Soviet Union annexed Bessarabia and Northern Bukovina and when Hungary annexed Northern Transylvania and Bulgaria got Southern Dobruga. The territories of Bessarabia and Northern Bukovina were taken back by Romania after it sided with the Axis powers in the the Second World War until 1944 where it was lost to the Soviet Union. In 1948 the new Communist regime in Romania signed a treaty with the Soviet Union where it lost Bessarabia to the Soviet Union and Southern Dobruga to Bulgaria but retook Northern Transylvania thus creating the borders of modern day Romania."
 romania.13.a: "대루마니아 만세"
 romania_politics.3.t: "파나이트 문제 대처"
 romania_politics.3.d: "In the spring of 2002, 29-year-old persecutor Cristian Panait was pressured by his superiors to investigate a colleague, Alexandru Lele, who had prosecuted the son of a former prefect in Bihor County for petrol smuggling. He was sent to penalize the prosecutor, Alexandru Lele, for his courage to order the arrest of the son of Bihor County prefect, Adrian Tarau, one of our colleagues in the Social Democratic Party (PSD). Letting Panait continue his investigation could lead to exposing our prime minister, Adrian Nastase, for corruption; however, this would show that our party does not attack the judiciary system and respects the rule of law, or we could attempt to silence the persecutor in order to save the image of our government."
 romania_politics.3.a: "입을 막으려 시도한다"
 romania_politics.3.b: "그는 우리에게 위협이 되지 않는다"
 romania_politics.4.t: "크리스티안 파나이트 자살"
 romania_politics.4.d: "After we decided to silence persecutor Cristian Panait by utilizing the persecutor's office to handle all his cases and attempting to demonstrate that Cristian Panait was schizophrenic and on the brink of a nervous breakdown, Panait eventually committed suicide by jumping off the fourth floor of his apartment on April 10. Investigators attributed the suicide to his psychological issues, but the public remains skeptical, suggesting that Panait might have been murdered by a colleague with ties to the Social Democratic Party."
 romania_politics.4.a: "오, 이런 비극이!"
 romania_politics.5.t: "크리스티안 파나이트, 수사 결과 공개"
 romania_politics.5.d: "Persecutor Cristian Panait has concluded his investigation into the Adrian Tarau case, which he later published the results of. The investigation exposed many members of our government, mainly prime minister Adrian Nastase, for huge corruption scandals such as bribery and blackmail. Adrian Nastase and President Ion Iliescu have denied these allegations as politically motivated, although many people have voiced their backlash against the government for alleged corruption."
 romania_politics.5.a: "정치적 의도가 있다! 입을 막았어야 했는데!"
 romania_politics.6.t: "군주제 국민투표 발표"
 romania_politics.6.d: "Following a promise made by the CDR coalition pre-election, the government has announced a referendum regarding the question of the restoration of the Romanian Monarchy, which was ousted in a Soviet-backed coup in 1947. However this will prove to be a touch race for the monarchist supporters, as the bulk of the opposition PSD, as well as certain elements within the coalition prefer the continue our current republican system of government, calling the referendum 'a great distraction' from the problems Romania is currently facing. Therefore all options regarding the outcome are hanging from a thread."
 romania_politics.6.a: "미하이 국왕이 돌아올 것이다..."
 romania_politics.7.t: "공화주의 세력의 신뢰 실추"
 romania_politics.7.d: "최근 군주제 지지자들이 공화주의 지지자들에게 가한 공격이 군주제의 대의가 과거의 것이라는 그들의 주장을 설득력 없게 만드는 데 성공했으며, 많은 사람들이 미하이 국왕의 왕좌 복귀를 두고 군주제 지지자들에게 공감하고 있습니다."
 romania_politics.7.a: "공화주의자들은 패배자다!"
 romania_politics.8.t: "공화주의자 공격이 역풍으로"
 romania_politics.8.d: "Recent attacks by monarchists on republican supporters have managed to backfire with their claims dismissed are pure slander, driven by their ruthless desires to destroy the changes brought by the Romania revolution in 1989, and as a result people have started to sympathize with anti-monarchist elements"
 romania_politics.8.a: "1989년은 결코 죽지 않는다"
 romania_politics.9.t: "국민투표 종료"
 romania_politics.9.d: "선거 운동 기간이 끝나고 투표소가 문을 닫으면서, 현상이 계속되느냐 아니면 우리 역사 속 옛 요소가 돌아오느냐를 두고 루마니아인들이 루마니아의 미래를 선택할 때가 되었습니다. 그리하여 국민이 선택한 것은..."
 romania_politics.9.a: "국왕의 귀환!"
 romania_politics.9.b: "공화국의 승리!"
 romania_politics.10.t: "루마니아의 발칸 경제 연합 초청"
 romania_politics.10.d: "부쿠레슈티로부터 발칸 경제 연합에 가입하라는 제안을 받았습니다. 이 경제 동맹은 회원국 간 더 긴밀한 경제 관계를 구축하고 자유무역과 이동의 자유 등을 촉진하는 것을 목표로 합니다. 흥미로운 제안으로 보이지만, 그럼에도 결정을 내려야 합니다. 어떻게 하시겠습니까?"
 romania_politics.10.a: "승인한다!"
 romania_politics.10.b: "이런 헛소리는 거절한다"
 romania_politics.11.t: "우리의 초청을 거절한 [FROM.GetName]"
 romania_politics.11.d: "[FROM.GetName]이(가) 발칸 경제 연합 가입 초청을 거절했습니다."
 romania_politics.11.a: "그들의 손해입니다."
 romania_politics.12.t: "우리의 초청을 수락한 [FROM.GetName]"
 romania_politics.12.d: "[FROM.GetName]이(가) 우리의 초청을 수락하여 발칸 경제 연합의 회원국이 되었습니다."
 romania_politics.12.a: "훌륭합니다"
 romania_politics.13.t: "왕위 계승 문제의 해결"
 romania_politics.13.d: "Succession in Romania has always been tricky. From Carol I's only child, a girl by the name of Maria, dying of scarlet fever to Carol II renouncing his rights to the throne and leaving the country to be led by his 5 year old son, Michael, this time it is no different. Riht now, Romania has two eligible succesors with both having very different ideals: Margaret and Nicholas. Margareta is the daughter of Michael I, but our salic law does not allow women to inheret the throne. The salic law isn't so much of an issue since we can always change it, the issue come's from her and her spuse, Duda, which are unpopular in the Romanian society. As for Nicholas, he would be the natural successor via the salic law but he is young and inexperienced, not having a royal education since we did not actuallly expect the monarchy to be restored. Now, the choice is up to us."
 romania_politics.13.a: "마르가레타"
 romania_politics.13.b: "니콜라스 왕자"
 romania_politics.14.t: "루마니아의 통합 제안"
 romania_politics.14.d: "루마니아 대표단이 코므라트에 도착하여 가가우지아를 루마니아에 통합하자는 제안을 제시했습니다. 물론 그들은 투자와 자치를 약속했지만, 그 약속이 얼마나 진실한지는 알 수 없습니다. 어떻게 하시겠습니까?"
 romania_politics.14.a: "새로운 시대를 위하여!"
 romania_politics.14.b: "가가우지아를 위하여!"
 romania_politics.15.t: "가가우지아의 통합 거부"
 romania_politics.15.d: "가가우즈 정부에 꽤 괜찮은 조건을 제시했음에도 그들은 두 나라의 통합을 거부했습니다. 이제 어떻게 하시겠습니까?"
 romania_politics.15.a: "그들의 독립을 승인한다"
 romania_politics.15.b: "이를 허용하지 않겠다"
 romania_politics.16.t: "루마니아의 부자크·부코비나 반환 요구"
 romania_politics.16.d: "키이우 주재 루마니아 대사가 우리 정부에 최후통첩을 전달하여, 북부 부코비나와 부자크가 몰로토프-리벤트로프 조약을 통해 루마니아에서 부당하게 빼앗긴 땅이며 이 '역사적 불의'를 바로잡는 것이 우리의 '도덕적 의무'라고 주장하며 두 지역의 반환을 요구했습니다. 루마니아와 정면으로 맞설 수는 있겠지만, 그들과의 전쟁은 동쪽으로부터의 위협에 우리를 노출시킬 것입니다. 어떻게 대응해야 합니까?"
 romania_politics.16.a: "전쟁은 원하지 않는다"
 romania_politics.16.b: "우크라이나에 영광을!"
 romania_politics.17.t: "우크라이나의 우리 요구 거부"
 romania_politics.17.d: "우크라이나인들은 우리의 요구에 귀를 기울이기를 거부하고, 소련이 우리에게 강요한 국경을 인정하기로 결정했습니다. 이제 전쟁은 불가피해졌습니다!"
 romania_politics.17.a: "전쟁으로 가자!"
 romania_politics.18.t: "PRM 검은 셔츠단의 부쿠레슈티 진군"
 romania_politics.18.d.a: "악명 높은 로마 진군을 연상시키는 행동으로, 수백 명, 어쩌면 수천 명의 PRM 지지자들이 권력 장악을 한층 공고히 하기 위한 힘의 과시로 부쿠레슈티로 진군했습니다. 검은 셔츠단은 이미 알려진 반체제 인사, 야권 인사, 소수 민족의 사업체와 사무실, 가정을 표적으로 삼기 시작했으며, 이들을 '반애국적 분자'로 낙인찍고 있습니다. 야간 급습이 도시 곳곳에서 갈수록 흔해지는 가운데, 이들 가정의 거주자와 사업체를 지키려 한 이들은 부쿠레슈티 경찰에 체포되었습니다. 이 조직적인 움직임으로 정치적 야권은 마비되었고, 법 집행 기관의 후원을 등에 업은 남은 야권 세력은 승산 없는 싸움에 직면했습니다. 이제 우리의 노력에 맞설 자는 아무도 남지 않았습니다."
 romania_politics.18.d.b: "로마 진군을 재현하려는 시도로 PRM 검은 셔츠단이 부쿠레슈티에 진입했으나, 초기에는 성공을 거두었음에도 신속히 동원되어 운동을 진압한 부쿠레슈티 헌병대 부대에 곧바로 저지당했습니다. 야권 인사와 '반애국적 분자'로 간주된 이들을 표적으로 삼으려던 시도도 실패했으며, 일부 표적이 된 인물들은 성공적으로 탈출하여 진군하는 검은 셔츠단에 맞서는 지지를 규합했습니다. 처음에는 손쉬운 권력 장악이 될 것으로 여겨졌던 일이 순식간에 무너졌으며, 이제 언론은 이 진군을 명령한 것이 바딤이었다고 보도하고 있습니다."
 romania_politics.18.a: "국가가 정화되었다!"
 romania_politics.18.b: "이것은 재앙이다!"
 romania_politics.19.t: "The National Liberal Party and the Democratic Party Party Form The Justice And Truth Alliance"
 romania_politics.19.d: "In a significant political development, the PNL and PD have announced the formation of a new political platform, named the Justice and Truth Alliance. Established as a vehicle to coordonate efforts against the Social Democrats, it also has a secondary role to consolidate their own political influence and collaboration. We will have to see if they are able to shake the PSD's hold over the country."
 romania_politics.19.a: "PSD에 분명한 위협이다"
 romania_politics.20.t: "미하이 국왕의 서거"
 romania_politics.20.d.a: "His Majesty, King Michael I, by the Grace of God, King of the Romanians, has passed away peacefully at his residence in Sinaia. The news of the Kings death brings about profound sadness to the nation and the international community alike, as a chapter in our history comes to a close.\n\nKing Michael, who first ascended to the throne in 1927 and then again in 1940, was a symbol of resilience and dignity. His reign saw Romania through tumultuous times, including World War II and the subsequent soviet occupation.Having been restored to the throne once more at the start of the century, King Michael I has served as an unifying figure, working tirelessly to promote democratic values and to rebuild the Romanian identity, history and culture following decades of communist pervesions.\n\nThe Royal Palace has announced a period of mourning, and a state funeral will be held to honor the late monarch."
 romania_politics.20.d.b: "His Majesty, King Michael I, has passed away peacefully at his residence in Switzerland. The news of his death have sent shockaves through our society as one of it's pillars forming the Romanian identity has died.\n\nKing Michael, who first ascended to the throne in 1927 and then again in 1940, was a symbol of resilience and dignity. His reign saw Romania through tumultuous times, including World War II and the subsequent soviet occupation. After his abdication in 1947, King Michael lived in exile for many years before returning to Romania in 1997, where he continued to be a cherished figurehead and advocate for democratic values.\n\nThe Government has announced a period of mourning, and a state funeral will be held to honor the late monarch."
 romania_politics.20.a: "니콜라스 국왕 만세!"
 romania_politics.20.b: "마르가레타 여왕 만세!"
 romania_politics.20.c: "파울 국왕 만세!"
 romania_politics.20.d: "우리나라의 역사적 인물이었다."
 romania_politics.21.t: "시위대의 바딤 사임 요구"
 romania_politics.21.d: "Massive protests have erupted across Romania following the failuer of the March on Bucharest, with crowds demanding Vadim's resignation over the widespread abuses he has committed during his time in power. The situation has grown increasingly volatile, and the risk of a full-blown revolution looms large if decisive action is not taken soon. While stepping down would be the most direct response to public pressure, there is also the option of calling on the military to restore order, though this could escalate tensions even further. The choice must be made carefully, as the future of the nation hangs in the balance."
 romania_politics.21.a: "젠장, 나는 떠나겠다."
 romania_politics.21.b: "나는 쉽게 물러나지 않을 것이다!"
 romania_politics.22.t: "루마니아에서 분리 독립한 트란실바니아"
 romania_politics.22.d: "군을 개입시킨 것은 중대한 실수였던 것으로 보입니다. 몰다비아와 문테니아에서는 진압 작전이 초기에 성공을 거두었으나, 트란실바니아에 주둔한 부대는 명령에 따르기를 거부하고 오히려 이탈했습니다. 이전의 숙청을 피했던 많은 정적들이 카르파티아 고개를 넘어 탈출하는 데 성공했으며, 그곳 클루지에 '대립 정부'가 수립되었고 푸나르는 체포된 것으로 알려졌습니다. 트란실바니아의 질서를 회복하려는 노력은 실패했습니다. 왈라키아에서 파견된 군 부대는 카르파티아 고개에서 저지당해 교전이 벌어졌습니다. 우리 군은 발판을 확보하지 못한 채 퇴각을 강요당했습니다. 트란실바니아가 저항을 굳혀 가면서 상황은 계속 통제 불능으로 치닫고 있습니다."
 romania_politics.22.a: "아..."
 romania_politics.22.b: "자유로운 삶이 아니면 죽음을! (트란실바니아로 플레이)"
 romania_politics.23.t: "군부의 바딤 축출"
 romania_politics.23.d: "루마니아가 더욱 혼란에 빠져들자, 잔존 군 세력은 국가의 영토 보전에 실패한 책임을 물어 바딤을 체포하라는 명령을 받았습니다. 동틀 무렵 군 부대가 코트로체니 궁전을 급습했으나 곧바로 물러선 궁정 경비대의 저항은 미미했습니다. 바딤의 운명은 불분명하며, 추가 조사를 위해 구금되었다는 보도가 나오고 있습니다. 이러한 권력 이동의 여파로 합참의장 미르체아 켈라루가 정부를 장악했습니다. 켈라루는 비상사태를 선포하고 카르파티아의 반란을 분쇄하겠다고 맹세했으며, 분열된 나라 전역의 질서와 안정을 되찾기 위해 신속한 군사 행동을 약속했습니다."
 romania_politics.23.a: "우리가 할 수 있는 일은 없다."
 romania_politics.24.t: "코르넬리우 바딤 투도르의 서거"
 romania_politics.24.d.a: "Our beloved leader, Corneliu Vadim Tudor, has died unexpectedly of a heart attack earlier today at the Cardiovascular Diseases Center of the Army, leaving the nation in shock and mourning. Thousands of people have already began to gather in front of the Cotroceni Palace, laying flowers and candles for the father of our nation.\n\nHis rise to prominence has been nothing short of remarkable, from a measly MP to rising to President and then Conducator. Many enemies have tried along the way to destroy him, to destroy OUR goal, but they all failed. He had and will never have any equals. He was feared, respected, adored, he was larger-than-life, he was what Romania needed. Funeral arragements will be finalized in the following days, and millions are expected to turn out and pay their final respects.\n\nAnd now, as we brace for a future without him, one must ask: who wiull step up to fill the shoes of a man whose presence has once dominated every facet of political life?"
 romania_politics.24.d.b: "Former MP and founder of the PRM, Corneliu Vadim Tudor, has passed away unexpectedly of a heart attack earlier today at the Cardiovascular Diseases Center of the Army. Often described as a 'showman', his toxic and intolerant views had a real brainwashing effect upon the masses, leading him to a close victory in the 2000 elections and almost becoming President.\n\nWhat it would've been, we do not know. All we can do now is mourn an important figure in our post-communist history."
 romania_politics.24.a: "그의 딸이 그의 유산을 이어받을 것이다"
 romania_politics.24.b: "군단원들이 그의 유산을 이어받을 것이다"
 romania_politics.24.c: "분명 영향력 있는 정치인이었다."
 romania_politics.50.t: "새로운 연합"
 romania_politics.50.d: "Centuries ago, Wallachia and Bulgaria were united under the empire forged by the brothers Asen and Peter, a powerful state that bridged the Carpathians and the Balkans. However, the fall of the Asenid Dynasty marked the disintegration of their empire, and the paths of the two nations diverged sharply. Wallachia grew under Hungarian and later Ottoman influence, while Bulgaria fell directly into Ottoman rule. Despite their shared history, the two nations drifted apart.\n\nIn the 19th century, following our hard-won independence and Bulgaria's newfound autonomy, there was a fleeting chance to reunite these two lands. However, foreign interventions and the political landscape of the time snuffed out any real possibility of union. But now, in the 21st century, we are at long last reunited and finally share a common cause.\n\nWhile the Bulgarians still might resent us for forcing this union upon them, overtime our people will become one. Let us hope that this time, the ties we forge will last."
 romania_politics.50.a: "연합 만세!"
 romania_politics.51.t: "아름다운 베사라비아"
 romania_politics.51.d: "약 100년 전 베사라비아와 루마니아는 대루마니아로 재통일되었으나, 제2차 세계 대전의 여파로 이 지역은 다시 한번 상실되었습니다. 1940년 몰로토프-리벤트로프 조약에 따른 소련의 합병 이후 베사라비아는 소련에 흡수되어 수십 년간 루마니아와 분리되었습니다. 이제 이 영토가 다시 우리의 통제 아래 들어왔으니, 그 저주받은 협정이 저지른 불의는 되돌려졌습니다. 우리는 베사라비아를 우리 국가 안의 정당한 자리로 복원하고 수년간의 외세 지배가 남긴 상처를 치유할 새로운 기회를 얻었습니다. 수십 년이 걸릴 수도 있겠지만, 이 지역은 재건될 것이며 우리는 루마니아 삼색기 아래에서 다시 한번 번영하도록 할 것입니다!"
 romania_politics.51.a: "다시 고향에 오신 것을 환영합니다!"
 romania_politics.52.t: "연설"
 romania_politics.52.d: "It's a warm evening, and Constantinescu prepares to give a speech to the nation, a speech that was not anounced nor debated  with his allies from the PNTCD and there is a clear reason why. As he sits down in the chair, as the cameras start rolling, he put's on a mask of solemnity and begins his address: 'Dear compatriots, I address you today, citizens of Romania, to inform you of my decision not to run for a new term as President of Romania.'\n\nAfter a brief pause, he continues, explaining the reasons for his drastic decision and the justification behind it. The eyes of the nation are fixed on their screens, the poor and the affluent alike, all eager to understand what prompted such an unexpected announcement. Constantinescu continues on, acknowledging all the challenges he faced during his presidency, reflecting on the economic and political instability the country had to endure under his tenure. From unfulfilled promises, failure to implement much needed reforms, all the while his tone is slowly becoming one of regret. As the camera captures the gravity of all his words, with the people watching intently, he stops.\n\nHe lets out a sigh, and continues:"
 romania_politics.52.a: "'용서를 구합니다...'"
 romania_politics.53.t: "하트의 왕"
 romania_politics.53.d: "With the death of King Michael I, the Romanian throne has passed down to his grandson, Prince Nicholas Medforth-Mills, now crowned as King Nicholas I. In the wake of his ascension, the young King has so far embraced a distinctive style which captivated the hearts of the Romanian people. With a warm, personable demeanor and commitment to environmental causes, he has quickly earned the affection of the massses.\n\nEschewing traditional formality, he is often seen mingling with crowds, listening to their concerns, and speaking with sincerity about his vision for a modern monarchy. No longer is he that little child holding a monarchist flag on the balcony of Hotel Continental, he is now the sovereign of 20 million beating hearts. Still, even if this thought brings him joy, his relations with the rest of the Royal Family are strained, most importantly with his aunt- Margareta.\n\nRegardless of family affairs, he has become a symbol of hope and renewal for the people. And, if you listen hard enough when passing by a school, you can hear kids sing in chorus:"
 romania_politics.53.a: "'국왕 폐하 만세!'"
 romania_politics.54.t: "두다와의 만남"
 romania_politics.54.d: "Radu Duda - actor, prince and, allegedly, a Securitatea collaborator. Yeah, it is no secret that Duda isn't very popular among the common people. There is just something that he lacks: be it the charisma, looks or the never-ending discourse around him, the people just do not see him as being fit for the title of 'King-Consort'.\n\nDue to this, as much as she wants to deny it, it has become increasingly apparent to Margareta that her rule will be contested as long as Duda is a public figure. She seen the headlines, read the newspapers, heard the rumors. Thus, she invited him to a private meeting at the Elisabeta Palace, far from the public eye. And as they sat together at the dinner table, they both started to talk for an hour, maybe two.\n\nAnd as Duda left the room, the conclusion was that..."
 romania_politics.54.a: "그는 떠나야 한다."
 romania_politics.54.b: "그는 남아도 좋다."
 romania_politics.55.t: "스페이드의 여왕"
 romania_politics.55.d.a: "미하이 1세의 사망으로 루마니아 왕위는 그의 장녀인 마르가레타에게 물려주어, 이제 마르가레타 1세 여왕으로 즉위했습니다. 왕위에 오른 이후, 마르가레타 여왕은 자신의 역할을 매우 진지하게 받아들였으며, 예상과는 전혀 다른 스타일로 이를 수행하고 있습니다.\n\n직설적이고 단호한 그녀는 결단력으로 존경을 받으며, 그녀의 통치 기간 동안 빠르고 단호한 행동으로 관료적 마비를 뚫고, 왕국의 비전이 뿌리내릴 수 있도록 했습니다. 여러 학문적 단체를 후원하고, 루마니아 여성운동을 부흥시키며 유리천장을 깨는 등, 감정에 휘둘리지 않는 그녀의 통치는 루마니아 정치의 복잡한 지형을 뚫고 나가게 했습니다. 더 이상 그녀는 고상하고 먼 곳에 있는 존재로 여겨지지 않으며, 이제는 경험이 풍부한 정치인들과 시민들 모두에게 존경받고 있습니다.\n\n그럼에도 불구하고, 문제는 여전히 진행 중입니다. 니콜라스와의 관계는 그 어느 때보다 더 긴장되어 있으며, 양측은 서로의 모든 연락을 끊은 듯 보입니다. 또한 두다의 공적 활동이 왕실에 대한 국민의 신뢰에 부정적인 영향을 미치고 있으며, 많은 사람들이 진정으로 \"벨벳 장갑 속의 철권\"이 누구인지 궁금해하고 있습니다.\n\n가족의 문제와 드라마와 관계없이, 학교 근처를 지나갈 때 귀를 기울이면, 아이들이 합창으로 부르는 노래를 들을 수 있을 것입니다:"
 romania_politics.55.d.b: "미하이 1세의 사망으로 루마니아 왕위는 그의 장녀인 마르가레타에게 물려주어, 이제 마르가레타 1세 여왕으로 즉위했습니다. 왕위에 오른 이후, 마르가레타 여왕은 자신의 역할을 매우 진지하게 받아들였으며, 예상과는 전혀 다른 스타일로 이를 수행하고 있습니다.\n\n직설적이고 단호한 그녀는 결단력으로 존경을 받으며, 그녀의 통치 기간 동안 빠르고 단호한 행동으로 관료적 마비를 뚫고, 왕국의 비전이 뿌리내릴 수 있도록 했습니다. 여러 학문적 단체를 후원하고, 루마니아 여성운동을 부흥시키며 유리천장을 깨는 등, 감정에 휘둘리지 않는 그녀의 통치는 루마니아 정치의 복잡한 지형을 뚫고 나가게 했습니다. 더 이상 그녀는 고상하고 먼 곳에 있는 존재로 여겨지지 않으며, 이제는 경험이 풍부한 정치인들과 시민들 모두에게 존경받고 있습니다.\n\n비록 두다는 이제 공적 생활에서 물러났지만, 그녀와 니콜라스의 관계는 여전히 긴장 상태에 있지만, 이제 두 사람은 왕실과 국민을 위한 타협을 준비하는 모습입니다.\n\n다음에 무엇이 일어나든, 만약 학교 근처를 지나갈 때 귀를 기울이면, 아이들이 합창으로 부르는 노래를 들을 수 있을 것입니다:"
 romania_politics.55.a: "'여왕 폐하 만세!'"
 romania_politics.56.t: "파울 국왕의 헌법 - 서문"
 romania_politics.56.d: "Article 1. The Kingdom of Romania is a sovereign, independent, unitary and indivisible National State;\n\nArticle 2. The Kingdom is ruled by the Grace of God under the absolutely authority of His Majesty the King;\n\nArticle 3. The prevailing religion in the Kingdom of Romania is that of the Eastern Orthodox Church of Christ;\n\nArticle 4. Recognizing that the Eastern Orthodox Church of Christ is the one, holy, catholic and apostolic church established by Jesus Christ in his Great Commission, the Kingdom of Romania acknowledges the Orthodox Faith as the official State relgion;\n\nArticle 5. The Eastern Orthodox Church of Christ, as practiced in Romania, is inseparably linked to the Romanian state and its spiritual life;\n\nArticle 6. The Romanian Orthodox Church shall be regarded as a key institution in maintaining the moral compass of the Kingdom;\n\nArticle 7. The Romanian Orthodox Church shall be autonomous in its internal affairs, yet its leadership, including the Patriarch and other high-ranking clergy, shall be approved by His Majesty, the King, as the Supreme Protector of the Faith;\n\nArticle 8. The Romanian Orthodox Church shall have the exclusive right to govern all matters of spiritual teaching, religious ceremonies, and ecclesiastical jurisdiction within the Kingdom, in accordance with holy tradition and canon law, as recognized by the state;\n\nArticle 9. All laws, regulations, and state policies shall be consistent with the teachings of the Orthodox faith, and the Church shall have a consultative role in major legislative decisions that concern the moral and spiritual well-being of the nation;\n\nArticle 10. No doctrine or religious group that contradicts or undermines the Orthodox faith shall be permitted to exert influence over the public sphere, and any actions or movements deemed heretical, schismatic, or subversive to the Orthodox Church shall be prohibited;"
 romania_politics.56.a: "지금까지는 좋다."
 romania_politics.57.t: "파울 국왕의 헌법 - 국왕의 권한"
 romania_politics.57.d: "Article 31. The King is above all earthly law and shall not be held accountable by any institution, court, or authority. His Ministers are answearable;\n\nArticle 32. The State and its institutions are under the direct authority of His Majesty, King Paul I, who holds supreme executive, legislative, and judicial powers. The King is the highest and final authority in all matters of governance, administration, and law;\n\nArticle 33. All powers of the state are derived from the person of the King. His Majesty has the right to issue laws, decrees, and royal edicts, which are binding upon all subjects of the Kingdom;\n\nArticle 34. The King shall appoint and dismiss ministers, judges, officers, and any other officials of the state at His sole discretion. Their authority is exercised in His name and with His blessing;\n\nArticle 35. No law, decree, or action of governance shall be valid without the direct approval of the King. His Majesty may modify or repeal any existing law or decision at His will;\n\nArticle 36. The defense of the Kingdom is the sacred duty of all its citizens. The armed forces of Romania, including the Army, Navy, and Air Force, are under the supreme command of His Majesty the King. His Majesty shall determine all matters of national defense, including declarations of war, military strategy, and the command structure of the armed forces;\n\nArticle 37. Upon joining the Armed Forces, every individual shall take an Oath of Loyalty to His Majesty the King, in the presence of a representative of the King or a designated military commander. No member of the Armed Forces shall server in any capacity without first taking the oath;"
 romania_politics.57.a: "아름답다."
 romania_politics.58.t: "파울 국왕의 헌법 - 의회"
 romania_politics.58.d: "Article 44. The Parliament of the Kingdom of Romania shall bicameral, consisting of the Senate and the Chamber of Deputies;\n\nArticle 45. The Senate is an appointed body, with its members directly selected by the Monarch. The Senate serves as a consultative chamber, providing advice and recommendations to the Crown. Senators shall hold office at the pleasure of the King and are appointed based on merit, loyalty, and service to the Crown;\n\nArticle 46. The Senate may be consulted on appointments to high offices, including judges, ambassadors, and military commanders, but such consultations are not binding;\n\nArticle 47. The Senate may review and offer amendments to legislation proposed by the Chamber of Deputies before it is submitted to the King for final approval;\n\nArticle 48. The Chamber of Deputies is composed of representatives elected by the people. However, all candidates for Deputy must be official members of the Front of National Renaissance (FRN). No individual or party outside the FRN may participate in elections or hold office in the Chamber of Deputies. The number of Deputies shall be determined by the King, based on electoral guidelines set forth by the Crown.\n\nArticle 49. Legislation may be proposed by the Chamber of Deputies and is responsible for debating and passing said legislation. It also has the authority to propose and debate the national budget. All proposed laws must be presented to the Senate for review and then submitted to the King for final approval.\n\nArticle 50. Deputies shall serve for a term of four years. Re-election is permitted, but all candidates must continue to meet the requirements of FRN membership. In case of vacancies, the FRN shall appoint replacements in accordance with its internal rules and the King's directives.\n\nArticle 51. As per Article 32, the Monarch may propose legislation to the Chamber of Deputies.\n\nArticle 52. After passing through both chambers, legislation is presented to the King for final approval. The King may approve, veto, or request further amendments to the proposed legislation as He sees fit. Once approved, the legislation will become law."
 romania_politics.58.a: "완벽하다! 이제 국민투표로 넘어가자."
 romania_politics.59.t: "통과된 새 헌법!"
 romania_politics.59.d: "예상대로 파울 1세 국왕이 제안한 새 헌법은 99.97%의 찬성과 98.33%의 투표율로 국민의 승인을 받았습니다. 이것은 우리나라와 우리 국민의 승리이며, 무엇보다도 우리 민주주의의 승리입니다!"
 romania_politics.59.a: "마침내!"
 romania_politics.60.t: "찬탈자"
 romania_politics.60.d: "With the death of King Michael I, the Romanian throne, instead of passing down to Nicholas or Margareta, has instead went to Paul. Since Michael had failed to name a clear and undisputed successor, the Crown Council, growing weary of the constant infighting within the royal family, took decisive action.\n\nDetermined to restore stability to the monarchy and the nation, the Council sought an alternative to the ongoing disputes between the factions supporting Nicholas and Margareta. Thus, they turned to Paul, an authoritative figure who had gained a following among the more traditionalist members of the Council, who saw him as the best way to preserve the integrity of the monarchy. Since ascending the throne, King Paul immediately went about consolidating his power, exiling both Nicholas and Margareta.With the danger presented by the other two contenders to the throne eliminated, Paul passed a new Constitution via a 'democratic' referendum, increasing his powers tenfold and virtually eliminating all opposition, which was anyway left in dissaray by his quick political maneuvering.\n\nRegardless of what has been or what will be, if you listen hard enough when passing by a school, you can hear kids sing in chorus:"
 romania_politics.60.a: "'국왕 폐하 만세!'"
 romania_politics.61.t: "바딤의 재판"
 romania_politics.61.d: "'Defendant Corneliu Vadim Tudor is accused of treason, incitement of insurrection and incitement of terrorism (etc.)' says the judge in the court room, packed full of journalists and public media before turning to Vadim, 'Mr. Tudor, how do you plead?'\n\n'Not guilty.'\n\n'May your lawyer explain the reasoning to us?'\n\nToday, former President Corneliu Vadim Tudor stands before the nation's higher court, accused of multiple things from terrorism to treason following the failure of his 'March on Bucharest'. What was initially supposed to be a show of power, maybe even a soft self-coup, had quickly devolved into chaos as units of the Gendarmerie cracked down on the disorganized PMR supporters with tens of dozens being wounded and arrested. Quickly, the media had learnt that this March was planned and ordered by Vadim and it wasn't soon for protests to break out all across the country.\n\nVadim was forced to step down and, without political immunity, was promptly arrested and now is on trial. As the days pass on, as more and more witnesses are called to the stands, the picture of Vadim's failed insurrection becomes increasingly clear. From members of the PMR stating how everything was planned in advance, to police officers being ordered to stand down and let the march go uninterrupted, the evidence against Vadim continues to mount.\n\nAnd as the trial reaches it's last day, it became clear the Judge reached a conclusion and everyone was just waiting on the sentence to be officially delivered: 'Corneliu Vadim Tudor, this court finds you guilty of treason, incitement of inssurection, incetement of terrorism, incetement of violence, abuse of power, conscpiracy, violations of civil rights, illegal detainment and sentences you to"
 romania_politics.61.a: "'종신형.''"
 romania_politics.62.t: "재회"
 romania_politics.62.d: "1916년 루마니아가 협상국 편에서 대전에 참전했을 때, 자신의 사촌 페르디난트가 가문을 배신하고 자국의 편에 섰다는 데 분노한 빌헬름 2세는 공식 가계도에서 그와 호엔촐레른 가문의 루마니아 계통에 대한 모든 언급을 삭제했습니다. 두 계통 사이의 증오가 어찌나 깊었던지, 수십 년 동안 화해는 불가능해 보였습니다.\n\n그 이후로 많은 것이 변했습니다. 과거의 적대감은 점차 사라졌고 유럽의 정치 지형도 재편되었습니다. 두 계통이 각자의 왕좌로 복귀하면서 마침내 화해의 기회가 찾아왔습니다. [ROM.GetLeader]은(는) 소원해진 가문의 두 계통을 다시 하나로 모으기를 바라며, 독일 카이저 [GER.GetLeader]에게 루마니아를 방문해 달라는 공식 초청장을 보냈고, 이는 1917년 이후 첫 방문입니다.\n\n방문이 시작되자 부쿠레슈티의 거리는 깃발로 장식되었고, 눈앞에서 쓰이는 역사를 보고자 하는 호기심 어린 군중이 몰려들었습니다. 한 세기 넘게 기다려 온 재회였습니다. 그리고 두 군주가 만나고 엘리자베타 궁전의 문이 대중의 시선으로부터 닫히자, 희미하게 들려오는 소리가 있었습니다."
 romania_politics.62.a: "웃음소리."
 ROM_moldovan_revolution_tt: "§B[MLV.GetFlag]몰도바 내의 통합주의 세력이 현 정부를 전복하고 루마니아와의 통합을 선언합니다.§! §R그러나 [GGZ.GetFlag]가가우지아는 몰도바로부터의 독립을 선언합니다§!"

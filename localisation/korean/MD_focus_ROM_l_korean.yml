 ROM_1989_redeemed_once_more_desc: "우리 혁명의 꿈은 아직 이루어지지 않았으며, 더 나은 공화국이라는 이상은 계속 살아 있습니다. 왕국의 복원이 더 나은 일이었을지, 그것이 어떤 길을 열었을지는 아무도 알 수 없지만 운명은 달리 정했으니, 우리가 어찌 이를 거스르겠습니까?"
 ROM_anti_unemployment_fund: "실업 방지 기금"
 ROM_anti_unemployment_fund_desc: "Unemployment is both a burden and a plague. A burden to those who genuinely cannot get a job, and a plague to us. by establishing an anti-unemployement fund, we can eliminate the burden bit by making sure that the unemployed have a source of income for a couple of months with which they can afford to pay their taxes, buy food and medicine and keep them afloat until they find a job, thus also putting a dent in the growth of homelessness."

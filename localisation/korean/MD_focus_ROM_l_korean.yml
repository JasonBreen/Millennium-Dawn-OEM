 ROM_romanianization_category: "루마니아화"
 ROM_romanianization_category_desc: "우리가 차지한 땅은 아직 이름뿐인 우리 땅입니다. 한 지역이 부쿠레슈티를 받아들이게 된 후에야 비로소 루마니아의 땅으로 만들 수 있습니다."
 ROM_998_return: "서부 바나트의 루마니아화"
 ROM_998_return_desc: "바나트는 한 세기 동안 분할되어 있었습니다. 주민들이 우리의 통치와 화해한 지금, 우리는 이 일을 마무리할 수 있습니다."
 ROM_996_return: "남부 도브루자의 루마니아화"
 ROM_996_return_desc: "남부 도브루자는 크라이오바에서 조약으로 넘겨졌습니다. 순응하는 주민들 덕분에 우리는 그 서명을 되돌릴 수 있습니다."
 ROM_122_return: "파르티움의 루마니아화"
 ROM_122_return_desc: "헝가리 평원은 포섭하는 데 가장 오랜 시간이 걸리며, 그 노력은 국내에서 우리에게 대가를 치르게 할 것입니다. 그래도 해낼 수 있습니다."
 romania_politics.25.t: "부패에 맞서는 손길"
 romania_politics.25.d: "국가 계약 비리를 조사하기 위해 구성된 전담반이 움직일 준비를 마쳤습니다. 검사들은 첫 영장이 발부되기 전에 결정을 내려 주기를 원합니다. 지금 즉시 급습할 것인가, 아니면 항소심을 견딜 수 있는 사건을 먼저 구축할 것인가."
 romania_politics.25.a: "예고 없이 급습한다"
 romania_politics.25.b: "먼저 사건을 구축한다"
 romania_politics.63.t: "키시너우 통합주의자들의 행진"
 romania_politics.63.d: "통합주의자 군중이 부쿠레슈티의 독려와 수년간의 루마니아 지원에 고무되어 키시너우의 거리를 가득 메우고 있습니다. 정부는 루마니아와의 통합을 받아들일지, 아니면 몰도바의 국가 체제를 수호할지 결정해야 합니다. 가가우지아는 키시너우를 따라 부쿠레슈티의 품으로 가지 않겠다는 입장을 이미 분명히 했습니다."
 romania_politics.63.a: "루마니아와 통합하자!"
 romania_politics.63.b: "몰도바는 홀로 선다"
 romania_politics.64.t: "몰도바의 통합 거부"
 romania_politics.64.d: "키시너우는 통합주의의 물결을 되돌렸습니다. 우리 지지자들은 거리에서 쫓겨났으며, 몰도바 정부는 이제 우리의 개입을 노골적인 적대감으로 간주하고 있습니다."
 romania_politics.64.a: "쓰라린 좌절이다"
 ROM_moldovan_revolution_fail_tt: "§R키시너우에서의 우리 영향력이 손상되며 몰도바 정부는 우리의 개입에 분개합니다§!"
 ROM_beu_accept_tt: "§Y수락하는 각 국가는 발칸 경제 연합에 가입합니다§!"
 ROM_ggz_accept_tt: "§Y가가우지아가 루마니아에 통합됩니다§!"
 ROM_ggz_reject_tt: "§R우리는 가가우즈 독립을 승인할지, 무력으로 이 지역을 차지할지 선택해야 합니다§!"
 ROM_ukr_cede_tt: "§Y우크라이나는 자국이 보유한 모든 루마니아 핵심 주를 넘겨줍니다§!"
 ROM_ukr_refuse_tt: "§R빼앗긴 땅을 무력으로 되찾기 위한 전쟁 명분을 얻습니다§!"
 ROM_core_compliance_tt: "§Y루마니아화§! 결정을 잠금 해제합니다. 서부 바나트, 남부 도브루자, 파르티움은 해당 주의 순응도가 §Y80%§!에 도달하면 각각 루마니아 핵심으로 만들 수 있습니다."
 ROM_monarchy_debate_tt: "§Y군주제에 대한 국민투표가 발표됩니다§!"
 ROM_resolve_succession_tt: "§Y마르가레타와 니콜라스 왕자 중 한 명을 선택하여 왕위 계승 문제를 매듭짓습니다§!"
 ROM_meeting_with_duda_tt: "§Y두다가 왕실에서 어떤 역할을 맡을지 결정합니다§!"
 ROM_queen_of_spades_tt: "§Y마르가레타가 국민에게 연설하고 자신의 치세를 굳힙니다§!"
 ROM_king_of_hearts_tt: "§Y니콜라스 국왕이 국민 속으로 나아갑니다§!"
 ROM_drafting_constitution_tt: "§Y파울이 새 헌법을 기초하여 국민투표에 부칩니다§!"

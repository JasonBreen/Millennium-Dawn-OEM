 SYR_ALAWITE_MILITARY_STAFF_IDEA_MODIFIER: "§RThese officers will cut and break off the alawite dominated regions from the state should the country become an islamist non-secular republic and we have to get rid of them before we turn the country democratic if we want to partake on an islamist course§!"
 SYR_ALAWITE_MILITARY_STAFF_STRENGTHENED_IDEA_MODIFIER: "§R세력이 강화된 이 장교들은 국가가 비포퓰리즘 민주주의 노선을 택할 경우 쿠데타를 시도할 것입니다.§!"
 SYR_GOVERNMENT_EXPANSION_FOCUS_EFFECT: "§Y한 정당을 연립에 초대합니다. 이 정당은 국가 건설 권력 균형 과정에서 중앙집권화든 분권화든 자신의 대의에 참여함으로써 우리에게 큰 도움이 될 것입니다.§!"
 SYR_GOVERNMENT_EXPANSION_EVENT_REP_EFFECT: "§C이 정당을 연립에 두면 국가 건설 권력 균형 과정에서 중앙집권화에 큰 도움이 될 것입니다.§!"
 SYR_GOVERNMENT_EXPANSION_EVENT_FED_EFFECT: "§G이 정당을 연립에 두면 국가 건설 권력 균형 과정에서 분권화에 큰 도움이 될 것입니다.§!"
 SYR_FINDING_PROMISING_BUREAUCRACY_EFFECTS: "성공하면 정치력 §G75§!을 얻고, §Y유망한 관료들§! 국가 정신을 얻어 §Y일일 정치력 획득량§! §G+0.5§! 및 §Y건설 속도§! §G+0.2§!를 §Y100§!일간 부여받습니다"

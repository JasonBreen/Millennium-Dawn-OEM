 TT_SYR_ASSASSINATE_HARIRI: "§R가지 가나안(Ghazi Kanaan)을 대체하면 암살의 성공 가능성이 높아집니다. 만약 우리 요원들을 레바논에서 복귀시킬 경우, 그 확률은 더욱 낮아질 것입니다.§!\n"

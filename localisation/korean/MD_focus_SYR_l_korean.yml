 TT_SYR_KURDS_WITHOUT_CITIZENSHIPS: "쿠르드인 정치적 포용도: §R-40%§!"
 TT_SYR_FEDERAL_PARTY_EXISTS: "연방주의자들이 자신들의 정당을 결성했습니다"
 TT_SYR_FEDERALIST_COALITION: "연방주의자들이 정부 연립에 참여하고 있습니다"
 TT_SYR_NATIONALIST_COALITION: "민족주의자들이 정부 연립에 참여하고 있습니다"
 TT_SYR_US_PROTECTION_REQ: "[Western_Autocracy_L](이)가 집권당이어야 합니다"
 TT_SYR_DIRECT_DEM_REQ: "쿠르드인들이 이 지역에 직접 민주주의 이상을 전파하도록 하려면 그들에게 시민권을 부여했어야 합니다"
 TT_SYR_KICKING_ASSADS_EFFECT: "알라위파 정치적 포용도: §R-40%§!"
 TT_SYR_REPUBLICANISM_FOCUS_EFFECT: "For every significant ethnic and religious community in syria we'll choose between reserving seats in parliament for politicians representing the communities which increases minority inclusiveness in exchange for increased corruption costs, or not doing so which will cause rioting and property damage in their regions whenever their political inclusiveness gets below §Y50%§!"
 TT_SYR_FEDERALISM_FOCUS_EFFECT: "For every significant ethnic and religious community in syria we'll choose between granting them semi autonomy increasing their political inclusiveness in exchange for reduced resource extraction, construction speed and building slots as well as increasing cost to change governmental law inversely proportional to the political inclusiveness of the community, or releasing the region altogether as an autonomous state"
 TT_SYR_ALLY_FARMERS: "농민들이 우리의 투쟁에 내부 파벌로 합류합니다"
 TT_SYR_ALLY_INDUSTRIALISTS: "산업 재벌들이 우리의 투쟁에 내부 파벌로 합류합니다"
 TT_SYR_ALLY_ULEMA: "울라마가 우리의 투쟁에 내부 파벌로 합류합니다"
 TT_SYR_ALLY_INTL_BANKERS: "국제 은행가들이 우리의 투쟁에 내부 파벌로 합류합니다"
 TT_SYR_AGRICULTURAL_INVESTMENT_EFFECT: "농업에 여러 차례 투자하면 농산물을 판매할 새로운 시장과 기업이 생겨납니다. 다만 새로운 기업이 자리 잡는 데 필요한 투자 횟수는 부패 수준의 영향을 받습니다"
 TT_SYR_DIGITAL_COSTS1: "추가 지출: GDP의 §R0.08%§!"
 TT_SYR_DIGITAL_COSTS2: "추가 지출: GDP의 §R0.12%§!"
 TT_SYR_DIGITAL_COSTS3: "추가 지출: GDP의 §R0.16%§!"
 TT_SYR_DIGITAL_COSTS4: "추가 지출: GDP의 §R0.20%§!"
 TT_SYR_DIGITAL_COSTS5: "추가 지출: GDP의 §R0.24%§!"
 TT_SYR_ECONOMIC_DECISIONS_UNLOCKED: "산업화와 관련된 경제 결정이 잠금 해제됩니다"
 TT_SYR_EXCAVATION_DECISIONS_UNLOCKED: "석유 채굴과 관련된 경제 결정이 잠금 해제됩니다"
 TT_SYR_AGRICULTURAL_DECISIONS_UNLOCKED: "농업과 관련된 경제 결정이 잠금 해제됩니다"
 TT_SYR_HASAKAN_DECISIONS_UNLOCKED: "Will unlock economic decisions related to hasaka's cotton farming"
 TT_SYR_PRIVATE_BANKING_FOCUS_EFFECT: "경제 결정으로 얻는 성장 잠재력이 증가합니다"
 TT_SYR_NATIONAL_BANKING_FOCUS_EFFECT: "경제 결정으로 얻는 국내 자립도가 증가합니다"
 TT_SYR_CORRUPTION_COSTS: "제도가 부패할수록 투자 비용이 더 많이 듭니다"
 TT_SYR_JAPANESE_ANIME: "If we have big digital investments for long enough our animation business partnered with japan's will produce commercially successful works"
 TT_SYR_CHINESE_ANIME: "If we have big digital investments for long enough our animation business partnered with china's will produce commercially successful works"
 TT_SYR_DOMESTIC_ANIME: "막대한 디지털 투자를 충분히 오래 유지하면 우리의 애니메이션 사업이 상업적으로 성공한 작품을 내놓게 됩니다"
 TT_SYR_DIGITAL_INVESTMENTS_FOCUS_EFFECT: "디지털 투자 결정이 잠금 해제됩니다"
 TT_SYR_COTTON_INVESTMENTS: "If we have allowed private banks and we have 50% kurdish inclusivity or more our investment will be more economically successful and we'll obtain an industrial complex"
 SYR_give_rise_to_merchants: "상인 계층의 부상"
 SYR_give_rise_to_merchants_desc: "사회에서 농본주의가 성장함에 따라 우리가 전통으로 돌아가야 할 때가 온 듯합니다. 보수적일 수도 있는 새로운 세대의 투자자들이 우리나라에서 부상할 것이며, 이들이 우리의 전통 경제를 최선을 다해 운영해 주기를 바랍니다."
 SYR_secular_opposition_victory: "세속 야권 정부"
 SYR_secular_opposition_victory_desc: "The secular opposition coalition has won the elections and will be tasked in leading syria into becoming a liberal democratic state"
 SYR_islamist_opposition_victory: "이슬람주의 야권 정부"
 SYR_islamist_opposition_victory_desc: "The islamist opposition coalition has won the elections and will be tasked in leading syria into becoming a conservative islamic republic"
 SYR_turkish_inspired_islamism: "튀르키예에서 영감을 얻은 이슬람주의"
 SYR_turkish_inspired_islamism_desc: "우리는 튀르키예 공화국 수립 이후 튀르키예에서 일어난 이슬람주의 운동에서 영감을 얻을 것입니다. 이는 당분간 우리 운동을 더욱 호의적인 시각으로 비추게 할 것이며, 튀르키예의 보수 성향 사업가들이 우리나라에 투자하도록 끌어들일 수도 있습니다."
 SYR_deregulate_economy: "경제 규제 완화"
 SYR_deregulate_economy_desc: "우리 지지 기반의 상당수를 이루는 중산층과 상인들에게 힘을 실어주기 위해, 이들에 대한 규제를 줄이고 성장에 필요한 여건을 마련할 것입니다."
 SYR_syrian_gulen_movement: "시리아 귈렌 운동"
 SYR_syrian_gulen_movement_desc: "The gülen movement in short was an islamist movement in turkey that was very popular between students advocating for a pacifist and modern view of islam. We will draw inspiration from their teachings and reform our school curriculums to advocate for islamic values and teach them to students as well as improve education overall."
 SYR_moderate_conservatism: "온건 보수주의"
 SYR_moderate_conservatism_desc: "우리는 내부의 극단주의 분자를 뿌리 뽑고, 종교적 광신과는 무관한 보수주의 세력으로서 우리의 이미지를 새롭게 만들 것입니다."
 SYR_religious_economic_charity: "종교 기부금"
 SYR_religious_economic_charity_desc: "우리 운동은 언제나 공동체에 도움이 되는 자선 단체 및 재단과 연결되어 있었습니다. 이제 더 두드러진 위치에 올랐으니 경제적 부담을 덜기 위해 이들을 더욱 제도화할 것입니다."
 SYR_qatari_support: "카타르의 지원"
 SYR_qatari_support_desc: "우리는 여러 카타르 투자자들의 관심을 끌었습니다."
 SYR_flourishment_of_central_economy: "도심 지역 개발"
 SYR_flourishment_of_central_economy_desc: "우리의 지지 기반은 주로 여러 도시 지역에서 나오므로, 그 주민들의 지지를 공고히 하기 위해 이들 지역을 개발하기 시작해야 합니다."
 SYR_turkish_investments: "튀르키예 투자"
 SYR_turkish_investments_desc: "We have attracted lots of turkish investors thanks to our deregulation policies as well as our ideological similarities to them"
 SYR_reverse_secularization: "세속화 되돌리기"
 SYR_reverse_secularization_desc: "이전 정권은 우리 국가를 철저히 세속화했습니다. 우리 이상에 대한 이러한 명백한 모욕은 계속되어서는 안 되며, 샤리아 법을 위해 이러한 정책들을 되돌려야 합니다."
 SYR_NPF_victory: "민족진보전선 정부"
 SYR_NPF_victory_desc: "위대한 연합이 선거에서 승리했으며, 이제 새로운 시리아의 미래를 재구성할 때입니다."
 SYR_statist_rise: "국가주의의 부상"
 SYR_statist_rise_desc: "Liberal Economics allow exploitation of our people and compromises our national independence and control. It is best for Syria to connect every aspect of economy to the state."
 SYR_maintain_military_role: "군부의 영향력 유지"
 SYR_maintain_military_role_desc: "세계는 어둡고 불편한 시기로 접어들고 있으므로, 대가가 얼마가 되든 우리나라를 지켜야 합니다."
 SYR_nationalize_oligarchic_holdings: "자산 국유화"
 SYR_nationalize_oligarchic_holdings_desc: "경제에 대한 우리의 장악력을 강화하기 위해 여러 불량 과두 계층의 자산과 재산을 국유화할 것입니다."
 SYR_maintain_socialistic_policies: "사회주의 법률 유지"
 SYR_maintain_socialistic_policies_desc: "이전 정부가 올바르게 한 한 가지, 그리고 그들이 상대적으로 더 인기를 얻은 궁극적인 이유는 하층 계급을 지원한 사회주의 정책입니다. 우리는 전 대통령 하피즈 알아사드가 시행한 정책을 계속 이어 나가며 우리 자신을 억압받는 이들의 진정한 지지자로 내세울 것입니다."
 SYR_government_planned_economic_projects: "정부 사업"
 SYR_government_planned_economic_projects_desc: "책임감 있는 정부라는 이미지를 높이고 일반 대중의 지지를 모으기 위해 공공 사업을 시작해야 합니다."
 SYR_patriotic_propaganda: "애국주의 선전"
 SYR_patriotic_propaganda_desc: "국가적 자긍심과 국가에 대한 충성의 중요성을 강조함으로써 우리의 이념적 입지를 강화할 것입니다."
 SYR_gather_support_from_peasantry: "농민층의 지지"
 SYR_gather_support_from_peasantry_desc: "농민은 우리나라의 근간이며, 그들이 우리를 지지하도록 해야 합니다."
 SYR_strong_government: "강력한 정부"
 SYR_strong_government_desc: "We will have to show our people to our government is stable and capable enough to rule. This will allow us to gain their trust"
 SYR_expand_youth_organizations: "청년 조직 확대"
 SYR_expand_youth_organizations_desc: "우리 정당들은 청년 조직에 크게 의존해 왔으며, 이제 권력을 쥔 만큼 청년들의 마음과 생각을 얻어 우리의 이념적 대의를 지지하도록 장려할 때입니다."
 SYR_illiberal_democracy: "비자유주의적 민주주의"
 SYR_illiberal_democracy_desc: "자유주의는 가난한 나라를 감염시키고 착취하는 바이러스입니다. 국민에게 필요한 것은 국민을 진정으로 대표하는 동시에 하나의 깃발 아래 단결시키는 참된 민주주의입니다. 우리는 무슨 일이 있어도 민주주의 국가입니다."
 SYR_reestablish_intelligence_committee: "정보 기관 재건"
 SYR_reestablish_intelligence_committee_desc: "미래의 전쟁은 총과 전차가 아니라 정보로 치러집니다. 완전하게 기능하는 정보 기관을 만드는 것은 우리의 책임입니다."
 SYR_national_security_act: "국가 안보법"
 SYR_national_security_act_desc: "극단주의 집단은 우리나라를 서서히 죽이고 있으며 우리 국민에게 위협이 됩니다. 이들의 공격은 우리나라에 대한 명백한 위협이며, 대가가 얼마가 되든, 무슨 일이 일어나든 즉시 이들을 막아야 합니다. 테러는 멈춰야 합니다."
 SYR_pan_syrian_nationalism: "범시리아주의"
 SYR_pan_syrian_nationalism_desc: "Syria is the country that should brighten all over Middle East with it's unique identity. Our rich history and culture makes it clear that it's our duty to show our true potential and identity to the world."
 SYR_cultural_rebirth: "문화적 부활"
 SYR_cultural_rebirth_desc: "Our nation is slowly but surely recognizing it's identity. Petty divides should not stop in the way of realizing the beauty of our people. Our people should acknowledge that no matter what, we're still syrians after all."
 SYR_deal_with_the_trade_unions: "노동조합과의 거래"
 SYR_deal_with_the_trade_unions_desc: "The key of a strong country is it's production and economy so we have to make sure that all workers of Syria are supporting us."
 SYR_reassert_russian_ties: "러시아와의 유대"
 SYR_reassert_russian_ties_desc: "러시아는 우리가 현대적이고 안전하며 번영하는 나라가 되도록 돕는 유일하고 진정한 동맹입니다."
 SYR_russian_oil_excavation: "러시아와의 석유 협약"
 SYR_russian_oil_excavation_desc: "우리나라에는 거대한 보물이 있으며, 동맹인 러시아가 이 자원에 접근하도록 도와줄 것입니다."
 SYR_russian_tartus_base_expansion: "러시아 해군 주둔 확대"
 SYR_russian_tartus_base_expansion_desc: "We can't create a strong navy immediately but our Russian friends will help us keep our costs safe by aiding in the expansion of the port's capabilities."
 SYR_nasserist_rise: "나세르주의의 부상"
 SYR_nasserist_rise_desc: "나세르주의가 다시 부상하고 있으며, 시리아를 다시 위대하게 만들 준비가 되어 있습니다."
 SYR_the_coalition: "연합"
 SYR_the_coalition_desc: "After reestablishing political parties two notable forces have risen. One advocates for federalizing the state and giving more power to provinces while the other advocates for entrenching the centralized authority and maintaining a united centralized republic. We'll have to choose carefully who we should align with"
 SYR_dismantle_the_military: "군사 예산 해체"
 SYR_dismantle_the_military_desc: "국방 GDP의 상당 부분이 군 조직 내에 만연한 부패로 인해 횡령되어 쓸모없는 사업에 쓰였습니다. 우리는 손에 넣을 수 있는 많은 것을 용도 변경하거나 매각할 것이며, 이는 군을 약화시키고 위협에 취약하게 만들 수 있으나 경제 회복과 부패 척결을 위해 필요한 조치입니다."
 SYR_empower_institutions: "제도 강화"
 SYR_empower_institutions_desc: "우리의 제도는 매우 취약하고 소외되어 있습니다. 이는 권력이 대통령에게 집중되고 의회에는 거의 권한이 주어지지 않았으며, 국가가 통제하는 언론이 개인의 자유를 옥죄는 분위기를 조성하고 있기 때문입니다. 권력 분배와 자유화를 보장하는 새 헌법을 기초하는 것은 미래를 향한 결정적인 단계입니다."
 SYR_western_supported_economic_relief: "서방의 구제"
 SYR_western_supported_economic_relief_desc: "우리의 이상은 서방의 이상과 부합하며, 서방 국가에서 우리 정당을 결성하는 것까지 허용받았습니다. 우리는 서방과 관계를 맺고 경제적 영향력을 대가로 구제를 요청할 것입니다."
 SYR_liberalize_society: "사회 자유화"
 SYR_liberalize_society_desc: "국민은 자유와 평등의 가치에 낯설습니다. 국민이 자신의 자유를 소중히 여기도록 장려하는 데 힘써야 합니다."
 SYR_scientific_ventures: "과학 사업"
 SYR_scientific_ventures_desc: "장학금을 지원하고 낡은 학교 교육과정을 개선함으로써 우리나라의 과학 부문을 발전시킬 수 있을 것입니다."
 SYR_banish_authoritarian_influence: "권위주의 영향력 추방"
 SYR_banish_authoritarian_influence_desc: "이란과 러시아 같은 많은 권위주의 국가가 이곳에 큰 영향력을 행사해 왔습니다. 이제 자유 국가가 된 만큼, 우리 제도와 경제에 미치는 그들의 영향력을 끝낼 때입니다."
 SYR_democratic_socialism: "민주사회주의"
 SYR_democratic_socialism_desc: "우리나라의 처참한 경제 상황은 국민을 상당히 가난하고 저개발 상태로 만들었습니다. 경제적 불평등이 여전히 만연한 상황에서 기업에 대한 규제를 줄이면 착취와 불공정 경쟁이 나타날 것입니다. 우리에게 필요한 것은 국내 신규 기업의 설립을 장려하고 보조금을 제공하여 모든 계층의 시민이 누릴 수 있는 폭넓은 경제 발전을 이루는 데 집중하는 것입니다."
 SYR_unleash_economic_potential: "경제 잠재력 해방"
 SYR_unleash_economic_potential_desc: "우리는 경제 강국이 될 큰 잠재력을 지니고 있습니다. 외국인 투자자와 기업이 이곳에 회사를 세우도록 장려할 수 있으며, 이로 인해 국민이 저임금 노동자가 되겠지만 경제 발전을 향한 위대한 도약이 될 것입니다."
 SYR_domestic_investments: "국내 투자"
 SYR_domestic_investments_desc: "젊은 국내 기업이 많이 설립되고 있습니다. 이들이 경제적 번영을 향해 나아가도록 투자로 지원할 것입니다."
 SYR_subsidize_local_firms: "지역 기업"
 SYR_subsidize_local_firms_desc: "Thanks to our policies local firms are being recognized for their success. Time to invest in them"
 SYR_economic_democracy: "경제적 평등"
 SYR_economic_democracy_desc: "Our economic development has reached all people of all economic backgrounds by tackling economic inequality and even gave rise to successful domestic companies. This is something we should be proud of"
 SYR_syrian_diaspora_investments: "디아스포라 투자"
 SYR_syrian_diaspora_investments_desc: "Thanks to our economically friendly policies we have attracted investments from the syrian diaspora living abroad"
 SYR_invite_US_business_giants: "거대 기업 유치"
 SYR_invite_US_business_giants_desc: "우리가 경제를 번영하도록 두었지만 이것만으로는 충분하지 않습니다. 소비주의를 촉진하기 위해 미국의 거대 기업들을 초청하여 국내에 가맹점을 세우도록 할 것입니다."
 SYR_address_ethnic_divides: "민족 분열 해결"
 SYR_address_ethnic_divides_desc: "우리나라는 언제나 분열되어 있었고 종파주의에 시달려 왔습니다. 이러한 문제를 어떻게 해결할지 결정해야 합니다."
 SYR_EU_investments: "EU 투자"
 SYR_EU_investments_desc: "여러 유럽 국가들이 우리나라에 투자하려 하고 있습니다."
 SYR_student_exchanges: "학생 교류"
 SYR_student_exchanges_desc: "교육을 개선하고 세계 표준 수준으로 유지하기 위해 해외 유학 장학금을 장려할 것입니다."
 SYR_invest_in_tourism: "관광 호황"
 SYR_invest_in_tourism_desc: "우리가 경제에 이룬 개선과 투자 덕분에 관광 산업이 전례 없는 수준으로 성장하고 있습니다. 머지않아 시리아는 지중해에서 가장 인기 있는 휴양지 중 하나가 될 것입니다."
 SYR_technological_investments: "기술 투자"
 SYR_technological_investments_desc: "우리의 기술은 극도로 낙후되어 있어 단순히 무시할 수 없습니다. 무언가 조치를 취해야 합니다."
 SYR_digitalisation_campaign: "디지털화 캠페인"
 SYR_digitalisation_campaign_desc: "우리의 기술 기반시설은 오늘날의 기준으로 극도로 낙후되고 비효율적입니다. 이 발목을 잡는 문제를 해결하기 위해 새로운 기술의 연구와 구축에 자금을 돌려야 합니다."
 SYR_chinese_anime: "중국 애니메이션"
 SYR_chinese_anime_desc: "Venus Centre, a company based in Damascus, is currently the only dubbing company that dubs Japanese anime (and other cartoons) to Arabic. We have to expand their capabilities and encourage cooperation with Chinese anime studios. Even though they aren't as popular as their competitors, the chinese animation industry is very successful nonetheless and it's a great idea for us to learn and cooperate with them to be the leading animation producers in the middle east and arab world"
 SYR_domestic_anime: "자국산 애니메이션"
 SYR_domestic_anime_desc: "다마스쿠스에 본사를 둔 비너스 센터는 현재 일본 애니메이션(및 기타 만화)을 아랍어로 더빙하는 유일한 더빙 회사입니다. 우리 고유의 문화와 미학이 외부 주제의 영향을 받아서는 안 되며, 외국의 전문 지식도 필요하지 않습니다. 우리는 전적으로 우리 자신에게 의존할 것이며 외국 애니메이션 거물들의 도움을 구하려 하지 않을 것입니다."
 SYR_japanese_anime: "일본 애니메이션"
 SYR_japanese_anime_desc: "Venus Centre, a company based in Damascus, is currently the only dubbing company that dubs Japanese anime (and other cartoons) to Arabic. We have to expand their capabilities and encourage cooperation with Japanese anime studios. The unopposed animation giant will surely be of immense help when it comes to setting up our animation industry and producing the most popular works in the middle east"
 SYR_economic_revitalization: "경제 활성화"
 SYR_economic_revitalization_desc: "우리 경제는 엉망일 뿐 아니라 매우 비효율적이고 지속 불가능하며 낙후되어 있습니다. 경제적 번영을 추구한다면, 이미 기능을 잃고 절박한 상태에 놓인 경제를 현대화하고 투자하는 고된 과정을 시작해야 합니다."
 SYR_tartus_service_sector: "타르투스의 서비스업"
 SYR_tartus_service_sector_desc: "서비스업은 타르투스 시에서 고용 면에서 가장 매력적인 부문 중 하나입니다. 우수한 과학 학력을 갖춘 주민의 높은 비율이 서비스업에 종사하고 있으며, 이들은 공공 부문과 민간 부문에 분포해 있습니다."
 SYR_expand_the_sector: "민간 부문 확대"
 SYR_expand_the_sector_desc: "지중해의 다른 해안 도시들에 비해 민간 부문의 참여는 여전히 필요한 수준에 못 미칩니다. 민간 부문에 투자하고 이를 확대하여 매력적인 경제 거점으로 만들어야 합니다."
 SYR_service_sector_in_lacking_regions: "서비스업이 부족한 지역에 대한 투자"
 SYR_service_sector_in_lacking_regions_desc: "타르투스의 서비스업은 잘 번성하고 있지만, 그에 못지않게 혹은 그 이상으로 중요한 다른 도시들은 그렇지 못합니다. 숙련 노동자가 타르투스 밖에서 일하도록 경제적으로 장려하고 유망한 기업에 투자함으로써 이 상황을 바로잡을 것입니다."
 SYR_expand_powerstations_in_homs: "홈스 발전소 확충"
 SYR_expand_powerstations_in_homs_desc: "A low number of powerstations exist in our country and this has been a persisting and annoying issue. We will build a number of powerstations in homs due to it's central location being the junction of syria and the presence of a big oil refinary in the city"
 SYR_tap_into_the_oil_reserves: "석유 매장량 개발"
 SYR_tap_into_the_oil_reserves_desc: "The oil reserves in the eastern part of the country look promising and await our drills to extract them"
 SYR_road_to_palmyra: "팔미라로 가는 길"
 SYR_road_to_palmyra_desc: "팔미라는 상당수의 관광객을 끌어들인 중요한 고고학 유적지입니다. 관광객이 이 경관을 더 쉽게 방문할 수 있도록 기반시설과 도로를 개선할 것입니다."
 SYR_expand_latakian_airport: "라타키아 공항 확장"
 SYR_expand_latakian_airport_desc: "The latakian airfield is used for military purposes. However, there is alot of potential for it to be used for civilian airlines due to the city being a tourist hotspot thus we will start investing in it"
 SYR_agricultural_investments: "농업 투자"
 SYR_agricultural_investments_desc: "농업은 석유에 이어 우리 경제에서 두 번째로 큰 부문입니다. 대규모 농업 강국이 될 잠재력을 활용해야 합니다."
 SYR_idlib_aleppan_investments: "이들리브-알레포 농업 연계"
 SYR_idlib_aleppan_investments_desc: "알레포는 이들리브의 농업에서 막대한 경제적 영향력을 지니고 있습니다. 두 지역에 모두 이익이 되고 두 도시의 농공업 잠재력을 키우도록 추가 투자를 장려할 것입니다."
 SYR_idlib_contest_aleppan_investments: "알레포의 영향력에 맞서기"
 SYR_idlib_contest_aleppan_investments_desc: "While Aleppo's economic presence in Idlib is beneficial to both cities, this state of affairs might make the economic forces outside of our control gain unwanted power. We should contest their presence by investing in Idlib and reducing aleppo's economic ambitions in the region"
 SYR_provisions_to_daraa: "다라에 대한 물자 지원"
 SYR_provisions_to_daraa_desc: "다라는 이 지역의 물 공급 감소로 고통받았으며, 정부의 대책 부족으로 악화된 가뭄 때문에 북동부 땅을 떠나야 했던 국내 난민의 유입으로 한계에 처해 있었습니다. 이 지역에 투자하고 이러한 문제를 즉시 해결하기 위해 노력할 것입니다."
 SYR_invest_in_hasakan_cotton: "하사카 목화에 투자"
 SYR_invest_in_hasakan_cotton_desc: "카미슐리와 알하사카 시의 경제 호황은 1960년대에 시작된 관개 사업의 결과로, 이 사업이 시리아 북동부를 목화 재배 지역으로 바꾸어 놓았습니다. 이는 우리 경제에 큰 도움이 될 것이며, 수익성 있는 섬유 산업을 유치할 이 도시의 잠재력을 활용해야 합니다."
 SYR_renewables_focus: "재생 에너지에 집중"
 SYR_renewables_focus_desc: "We have suffered from alot of problems regarding electricity and energy output due to low amounts of oil drilling as well as the increasing population. It's wiser to focus on renewable alternatives because if we think about it our oil-dependant energy sector will become more of a liability in the future."
 SYR_invest_in_wdrvm: "WDRVM에 투자"
 SYR_invest_in_wdrvm_desc: "WDRVM is a promising company specializing in the manufacture and installation of wind turbines and powerstations. They have ambitious plans to install wind turbines accross the region and tackle the energy problems by exploiting the few regions where stable winds are present. While these regions are scattered with infrequent stable winds there is no denying the positive effects on our energy sector"
 SYR_set_up_puppet_ren_company: "괴뢰 재생 에너지 회사"
 SYR_set_up_puppet_ren_company_desc: "경제에 대한 우리의 장악력을 더욱 강화하기 위해 괴뢰 재생 에너지 회사를 내세워야 합니다."
 SYR_encourage_domestic_solar_companies: "국내 태양광 기업"
 SYR_encourage_domestic_solar_companies_desc: "야심 찬 태양광 발전 기업 몇 곳이 국내에서 설립되고 있으며, 국내 태양광 패널 생산을 장려하기 위해 이들에 투자해야 합니다."
 SYR_monopolize_solar_power: "태양광 산업 독점"
 SYR_monopolize_solar_power_desc: "사막의 태양광 잠재력에는 큰 수익 기회가 있습니다. 우리의 태양광 발전 회사를 설립하여 이 유망한 부문을 독점할 것입니다."
 SYR_initiate_industrialization: "산업화 착수"
 SYR_initiate_industrialization_desc: "Our industrial capabilities is outdated and non-existent. Yet we have the potential to kickstart an industrial growth that'll greatly empower and invigorate our economy"
 SYR_damascus_automotive_potential: "다마스쿠스의 자동차 산업 잠재력"
 SYR_damascus_automotive_potential_desc: "다마스쿠스에는 자동차 조립 전용 산업 지구가 많이 있지만 마땅한 만큼의 관심을 받지 못했습니다. 이들에 대한 투자를 시작할 것입니다."
 SYR_invite_automotive_giants: "자동차 거대 기업 유치"
 SYR_invite_automotive_giants_desc: "Popular car brands like mitsubishi, toyota and volkswagen will be of great benefit to our economy if we convince them to invest in us. This will allow quality vehicles be acquired by our populace"
 SYR_SIAMCO_monopoly: "SIAMCO 독점"
 SYR_SIAMCO_monopoly_desc: "우리는 이란과 중국의 자동차 브랜드와 거래해 온 역사가 있으며, 저렴한 자동차를 생산하고 원치 않는 영향력이 경제에 들어오지 못하도록 이 관계는 항상 유지되어야 합니다."
 SYR_homs_heavy_industry: "홈스 중공업"
 SYR_homs_heavy_industry_desc: "Homs is home to several large public heavy industries.Obviously there is a promising future as an industrial giant and we should invest in them to allow the city to prosper. However we'll have to choose between investing on their production capabilities or resource extraction and processing capabilities"
 SYR_homs_production_focus: "생산에 집중"
 SYR_homs_production_focus_desc: "지난 10년간 성장하는 민간 산업 부문이 번성했으며, 많은 중소기업이 도시 북서부와 남부의 산업 지구에 자리 잡고 있습니다. 이를 활용하여 이들 산업을 더욱 발전시킬 것입니다."
 SYR_phosphate_extraction: "인광석 채굴"
 SYR_phosphate_extraction_desc: "국내에 풍부하게 매장된 이 유용한 자원을 채굴하기 위해 새로운 인산염 공장을 확장하고 건설할 것입니다."
 SYR_expand_industrial_capabilities: "산업 역량 확대"
 SYR_expand_industrial_capabilities_desc: "도시의 경제 성장을 위한 더 지속 가능한 길이므로, 도시의 생산 역량을 발전시키는 편이 현명합니다."
 SYR_tartus_pharmaceutical_giant: "제약 업계의 거인"
 SYR_tartus_pharmaceutical_giant_desc: "타르투스에는 우리 경제의 든든한 기둥을 이루는 수많은 제약 공장이 있습니다. 이 부문의 미래를 결정할 때입니다."
 SYR_pharmaceutical_export_focus: "수출 장려"
 SYR_pharmaceutical_export_focus_desc: "제약 회사들에 투자하고 이들이 지역 최강으로 확장하도록 장려하며 우리 의약품의 수출을 장려할 것입니다. 이는 우리의 경제 성장에 큰 도움이 될 것입니다."
 SYR_pharmaceutical_healthcare_focus: "의약품 가격 인하"
 SYR_pharmaceutical_healthcare_focus_desc: "국민은 이 역량을 자신들의 복지를 위해 활용할 수 있습니다. 국민을 위해 의약품과 제약 제품을 더 저렴하게 만드는 데 예산의 일정 비율을 배정할 것입니다."
 syrian_phosphate_exports: "시리아 인광석 수출"
 syrian_new_high_command: "새로운 최고 사령부"
 syrian_agricultural_capability_fully_unleached: "농경 사회"
 syrian_agricultural_capability_fully_unleached_desc: "시리아 새 정부의 정책으로 볼 때, 이 나라는 적어도 경제 측면에서는 진보적인 길보다는 더... 보수적인 길을 택한 듯합니다."
 syrian_industrial_capability_fully_unleached: "급속한 산업 확장"
 syrian_industrial_capability_fully_unleached_desc: "산업가들의 전폭적인 지지와 국내 신규 투자자들의 등장으로, 시리아는 국가의 미래를 위한 새로운 발걸음인 대규모 산업화를 내딛고 있습니다."
 alawite_political_inclusiveness_dynamic_modifier: "알라위파 공동체의 정치적 포용도"
 TT_alawite_political_inclusiveness_dynamic_modifier: "알라위파는 주로 레반트에 거주하며 시아파 이슬람에서 갈라져 나온 이슬람 종파인 알라위파를 신봉하는 민족종교 집단입니다. 이들의 국내 정치적 포용도 [?alawite_status|%%Y]는 국가 정치 내의 신뢰와 정치 활동 수준을 결정하며, 국내 다른 지역과 비교했을 때 부패, 지역 기반시설 부족, 열악한 종교 자유 실태, 지역 산업 부족의 부정적 영향을 받습니다."
 druze_political_inclusiveness_dynamic_modifier: "드루즈파 공동체의 정치적 포용도"
 TT_druze_political_inclusiveness_dynamic_modifier: "드루즈파는 민족적으로 아랍인이며 아랍어를 사용합니다. 이들의 일신교는 이슬람교, 유대교, 기독교의 많은 신앙을 받아들였으며 그리스 철학과 힌두교의 영향도 받았습니다. 이들의 국내 정치적 포용도 [?druze_status|%%Y]는 국가 정치 내의 신뢰와 정치 활동 수준을 결정하며, 국내 다른 지역과 비교했을 때 부패, 지역 기반시설 부족, 열악한 종교 자유 실태, 지역 산업 부족의 부정적 영향을 받습니다."
 kurdish_political_inclusiveness_dynamic_modifier: "쿠르드인 공동체의 정치적 포용도"
 TT_kurdish_political_inclusiveness_dynamic_modifier: "쿠르드인은 서아시아의 산악 지대인 쿠르디스탄에 본거지를 둔 이란계 민족 집단으로, 쿠르디스탄은 튀르키예 남동부, 이란 북서부, 이라크 북부, 시리아 북부에 걸쳐 있습니다. 이들의 국내 정치적 포용도 [?kurdish_status|%%Y]는 국가 정치 내의 신뢰와 정치 활동 수준을 결정하며, 국내 다른 지역과 비교했을 때 부패, 지역 기반시설 부족, 지역 산업 부족의 부정적 영향을 받습니다."
 subsidized_counter_terror_operations: "보조금 지원 대테러 기구"

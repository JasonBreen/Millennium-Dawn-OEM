 syria_endemic_corruption: "만연한 부패"
 syria_endemic_corruption_desc: "The history of Syria is filled with political instability, coups and totalitarianism. This has led to institutions reeking of corruption, nepotism and inefficiency made worse by the decades of assad rule. A huge effort shall be undertook to revolutionize the foundations of our country and pave a better and more sustainable future for the country"
 syria_power_vacuum: "권력 공백"
 syria_power_vacuum_desc: "The Damascus spring has achieved the first step towards institutional reform by kicking out the al assad family from their positions and roles. This has led to slight corruption uprooting but has resulted in a power vacuum yet to be filled, and will take a long while for the country to experience true change"
 syria_return_of_npf_parliamentarians: "민족진보전선 의원"
 syria_return_of_npf_parliamentarians_desc: "In a bid to treat the institutional inefficiency the government has brought back parliamentarians who served the country. Now free from assad's totalitarian constrants they feel more able to implement changes and carry on their duties. However it's important to note that no true change has been made and on the long while the problems of inefficiency are still present, but the country is stable and able for now"
 syria_entrenched_theocracy: "고착된 신정"
 syria_entrenched_theocracy_desc: "Syria has implemented theocratic solutions to the institutional problems it has always suffered. On one hand, this has lead to religious moral values inducing slight improvements in tackling corruption but the core problems haven't been solved, nepotism and sectarianism still persist since not all Syrians feel that the government is representative of them, and more problems are awaiting to inevitably reveal their ugly heads. But for now, the people are quiet and things seem stable"
 Syria_centralization_balance_of_power_category: "국가 건설과 중앙집권화"
 SYR_federal_state_formation_bop_left_side: "시리아 연방 수립"
 SYR_new_republic_formation_bop_right_side: "시리아 공화국의 부상"
 SYR_centralization_bop_mid_range: "현상 유지"
 SYR_direct_democracy_initiatives_bop_left_side: "직접민주주의 구상"
 SYR_rising_bureaucracy_bop_right_side: "관료의 부상"
 SYR_federalist_bop_left_side: "연방화"
 SYR_republican_bop_right_side: "단일 공화주의"
 SYR_al_abbas_brigades: "알아바스 여단 동원"
 SYR_al_abbas_brigades_desc: "국가의 적들에 맞서 싸우기 위해 알아바스 여단을 동원할 때가 왔습니다."
 syria_decision_increase_local_accountability_officials: "관료의 지방 책임성 강화"
 syria_decision_increase_local_accountability_officials_desc: "The administrative culture of our country is reeking with corruption, nepotism and inefficiency. We'll start investigative campaign to uncover and root out corruption to encourage transparent and accountable institutions. The success of the campaign depends on our corruption, police spending, minority inclusivity, and whether populists are in our government as their skills and experience may help"
 syria_decision_find_promising_bureaucracy: "유망한 관료 발굴 및 장려"
 syria_decision_find_promising_bureaucracy_desc: "Years of totalitarian rule has led to inefficient and unpopular people being in charge of institutions and governmental posts. And the sudden change towards democracy has revealed the lack of an efficient bureaucracy that can handle it's responsibilities in a manner that the people can deem trustworthy and transparant. We will initiate efforts to incentivize and recruit people with capable skills to the posts they deserve to fill and allow for streamlined administrative work to be done. This will depend on our bureaucracy budget, minority inclusivity to combat sectarian nepotism, corruption and the whether populists are in our government since they have some experience in handling governmental affairs"
 syria_decision_build_bureaucratic_infrastructure1: "관료 기반시설 확충"
 syria_decision_build_bureaucratic_infrastructure1_desc: "The infrastructure of our country is one of the poorest and most backwards in the region. This has lead to poor perception towards the state institutions and lack of trust in them as a capable force that can provide goods and services. We'll have to enhance our infrastructure in order to expand our government's reach and implement proper centralization of state and society"
 syria_decision_build_bureaucratic_infrastructure2: "관료 기반시설 확충"
 syria_decision_build_bureaucratic_infrastructure2_desc: "Our efforts in expanding the infrastructure has slightly improved our people's perception of our central authority. However we still need to improve our infrastructure further to achieve proper centralization and expand our administrative reach even more"
 syria_decision_build_bureaucratic_infrastructure3: "관료 기반시설 확충"
 syria_decision_build_bureaucratic_infrastructure3_desc: "우리 노력의 결실을 거두고 있습니다. 올바른 중앙집권화로 나아가는 길이 현실이 될 수 있으며, 우리나라는 진정으로 완전히 통합될 수 있습니다."
 syria_decision_build_bureaucratic_infrastructure4: "관료 기반시설 확충"
 syria_decision_build_bureaucratic_infrastructure4_desc: "The last stages of our infrastructure improvement has been reached. The government's authority is realized and respected throughout the country and the rule of law is prevalent everywhere"
 syria_decision_fund_voluntary_organizations: "자원봉사 단체 지원"
 syria_decision_fund_voluntary_organizations_desc: "Ethnic divisions are prevalent throughout the country and the most important remedy for that is encourging voluntary organizations that transcend ethnic divides and aim for the betterment of lives and cooperation between people of the different backgrounds and sects. The success of our efforts will depend on minority inclusiveness and federalists in government who will be quite helpful in giving assurements and incentivizing political activity and cooperation"
 syria_decision_encourage_economic_self_reliance: "경제적 자립 장려"
 syria_decision_encourage_economic_self_reliance_desc: "우리나라의 경제는 수십 년간 잘못된 운영과 비효율로 고통받아 왔습니다. 국민이 기업을 세우고 그 안에서 일하도록 유인하기 위해 자유 무역과 경제 자유화를 장려할 것입니다. 성공한다면 많은 주가 경제적으로 번영하고 국가 경제가 도약할 것입니다. 그러나 이를 위해서는 부패가 낮아야 하고, 종파를 넘나드는 발전을 위해 소수 집단 포용성이 보장되어야 하며, 정부를 경제에서 멀리 두기 위해 관료 예산이 최저 수준이어야 하고, 직접적이고 분권적인 경제 발전을 보장할 연방주의자들이 정부에 있어야 합니다."
 syria_decision_encourage_state_decision_making: "주 단위 의사결정 장려"
 syria_decision_encourage_state_decision_making_desc: "The greatest obstacle infront of our country's betterment is the fact people don't feel motivated enough to think about their political issues and interests. This is largely due to the state being present only to keep people at check and has become a source of fear and distrust rather than an opportunity and tool for the betterment of their lives, and noone feels belonged to the country. It's time to change that and encourage political competition and discourse to make the people feel motivated to be part of decision-making related to the neighborhood and state they reside in. The success of our efforts depend on corruption, minority inclusiveness and federalists being in government"
 sectarian_groups_start_to_seek_independence: "종파 집단들의 독립 추구 시작"
 FSA_rebel_fighting_spirit_idea: "반군의 투지"
 FSA_rebel_fighting_spirit_idea_desc: "자유시리아군은 투지를 불태우며 출발하였으며, 알아사드 정권에 맞서 싸울 준비가 되어 있습니다. 이들은 조국의 자유와 국민의 권리를 위해 싸울 각오가 되어 있습니다."
 SyriaFocus.108.d1: "우리는 강력한 애니메이션 산업을 구축하였습니다. 우리 스튜디오가 일본과 협력하고 디지털 분야를 적극 장려한 덕분에, 국내외의 많은 관객에게 주목할 만한 작품들이 전해졌습니다."
 SyriaFocus.108.d2: "우리는 강력한 애니메이션 산업을 구축하였습니다. 우리 스튜디오가 중국과 협력하고 디지털 분야를 적극 장려한 덕분에, 국내외의 많은 관객에게 주목할 만한 작품들이 전해졌습니다."
 SyriaFocus.108.d3: "디지털화에 대규모로 투자함으로써 우리는 국내외에서 인기를 얻은 주목할 만한 작품들을 만들어 내는 자체적인 훌륭한 애니메이션 산업을 이루었습니다. 우리는 세계에 우리 국민의 창의성과 우리만의 독특한 미감을 보여 주었습니다."
 SyriaFocus.108.b: "중국에 애니메이션이라는 게 있기는 한가?"

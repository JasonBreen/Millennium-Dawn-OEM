l_english:
 FBC_shared_findings: "Shared Anomaly Findings"
 FBC_shared_findings_desc: "Verified notes from the European Anomaly Desk's customs case. The desk is an original coordinating body attached to the EU, not a copy of any one agency."
 FBC_request_eu_assistance: "Request the European Anomaly Desk"
 FBC_request_eu_assistance_desc: "Ask the desk to take the consignment case back from national handling. The site stays where it is. Only the commitment moves."
 FBC_request_eu_assistance_tt: "Commits the desk's one shared team. A joint result follows."
 FBC_pool_eu_findings: "Pool the Customs Findings"
 FBC_pool_eu_findings_desc: "Once the consignment has a protocol, a member state can take the verified notes. Custody of the case does not move."
 FBC_pool_eu_findings_tt: "This country gains the shared findings for §Y180§! days."
 FBC.10.t: "The Customs Discrepancy"
 FBC.10.d: "Belgium and Germany each say the other is holding the same consignment. The papers do not match, and the people who inspected the crates will not say that nothing was there. The European Anomaly Desk has one shared team."
 FBC.10.a: "Fund a joint inquiry."
 FBC.10.a_tt: "Commits the desk's shared team. The inquiry reports back to us."
 FBC.10.b: "Leave it with Belgium."
 FBC.10.b_tt: "Belgium keeps the case and the cost. The desk's team stays free."
 FBC.10.c: "Leave it with Germany."
 FBC.10.c_tt: "Germany keeps the case and the cost. The desk's team stays free."
 FBC.10.d: "Restrict the route while this is sorted out."
 FBC.10.d_tt: "Costs §R25§! political power. Exposure falls by up to §G5§!. Brussels and the Ruhr are restricted for §Y90§! days, and a shorter inquiry follows."
 FBC.10.e: "This is no longer our office."
 FBC.10.e_tt: "The case is sent to the current coordinator. Nothing about the consignment is decided here."
 FBC.11.t: "The Inquiry's Result"
 FBC.11.d: "The desk has enough paper to name a custodian, or it has two inventories and no crate. Knowledge of the case is §Y[?global.FBC_eu_knowledge|0]§!."
 FBC.11.a: "Write the handling protocol."
 FBC.11.a_tt: "Archives the case and releases the shared team. Knowledge rises by §G7§! and exposure falls by up to §G5§!. Belgium and Germany receive the findings if they are still members."
 FBC.11.b: "Record an unresolved burden."
 FBC.11.b_tt: "Releases the shared team. Exposure rises by §R12§! and the case stays open as a burden."
 FBC.12.t: "Belgium Has the Consignment"
 FBC.12.d: "The European Anomaly Desk left the mismatched consignment with us. We can pay to keep it, ask the desk to take the inquiry, or let the papers sit."
 FBC.12.a: "Keep national handling."
 FBC.12.a_tt: "Costs §R25§! political power. The case is archived in our custody. Exposure rises by §R2§!, knowledge rises by §G8§!, and we receive the findings."
 FBC.12.b: "Ask the desk for a joint inquiry."
 FBC.12.b_tt: "Commits the desk's shared team. The result comes back to us."
 FBC.12.c: "Leave the discrepancy in the file."
 FBC.12.c_tt: "The case becomes an unresolved burden and exposure rises by §R8§!."
 FBC.13.t: "Germany Has the Consignment"
 FBC.13.d: "The European Anomaly Desk left the mismatched consignment with us. We can pay to keep it, ask the desk to take the inquiry, or let the papers sit."
 FBC.13.a: "Keep national handling."
 FBC.13.a_tt: "Costs §R25§! political power. The case is archived in our custody. Exposure rises by §R2§!, knowledge rises by §G8§!, and we receive the findings."
 FBC.13.b: "Ask the desk for a joint inquiry."
 FBC.13.b_tt: "Commits the desk's shared team. The result comes back to us."
 FBC.13.c: "Leave the discrepancy in the file."
 FBC.13.c_tt: "The case becomes an unresolved burden and exposure rises by §R8§!."

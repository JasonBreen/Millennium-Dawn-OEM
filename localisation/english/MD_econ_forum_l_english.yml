 econ_forum_pivot_east: "Pivot to the East"
 econ_forum_pivot_east_desc: "Western governments will not come while the sanctions stand. Our organizers can fill the halls with delegations from our BRICS partners and from Asia instead."
 econ_forum_pivot_east_tt: "For a year, every §YBRICS§! member and Asian nation receives a standing invitation to our next summits and is likelier to attend."
 econ_forum_pivot_east_active_tt: "Our forum is already courting the East."
 econ_forum_news.7.t: "The West Stays Away From the [econ_forum_name_founded]"
 econ_forum_news.7.d: "No government from NATO or the European Union has sent a delegation to this year's [econ_forum_name_founded]. With Western sanctions on [FROM.GetNameDef] still in force, officials and executives from those countries have been told to stay home, and the organizers have turned to partners who are still willing to come."
 econ_forum_news.7.a: "The empty seats are noticed"
 econ_forum.5.t: "Our Agenda at the [econ_forum_name_invited]"
 econ_forum.5.d: "Our delegation is going to the [econ_forum_name_invited]. Every government there wants something from the week. We should decide what ours is."
 econ_forum.5.a: "Court the investors"
 econ_forum.5.a_tt: "If our delegation attends, investment in our country costs less for a year, on top of the usual delegation bonus. The saving grows with the forum's prestige and doubles for a head of government."
 econ_forum.5.b: "Strike deals on the sidelines"
 econ_forum.5.b_tt: "If our delegation attends, we and the host, and we and every other government there, gain §G15§! opinion of each other."
 econ_forum.5.c: "Showcase our industry"
 econ_forum.5.c_tt: "If our delegation attends, we gain influence in the host, scaled by the forum's prestige and doubled for a head of government. Every program track that matters to us gains §G2§! prestige at this forum."
 econ_forum.5.e: "No set agenda"
 econ_forum_investor_pitch_modifier: "Forum Investor Pitch"
 econ_forum_summit_deal: "Struck deals at an economic forum"
 econ_forum_row_sponsor: "Sponsor"
 econ_forum_row_sponsor_tt: "§YSponsor a session§! at this forum's next summit: §R$1.5§! billion and §R10§! Political Power.\nThe forum gains §G3§! sponsor points, up to 25 a summit, and the host gains §G10§! opinion of us.\nOnce a summit, while the forum is preparing, and not while we boycott it or are at war with the host."
 econ_forum_row_speak: "Speak"
 econ_forum_row_speak_tt: "§YBid for a headline slot§! at this summit: §R25§! Political Power.\nOur delegation must be going, and the summit must have a free slot (3 a summit). The bid wins 40% of the time, plus 20% if our head of government attends and 10% as a great or super power.\nA win books a headline speaker for the summit. When the summit is held and our delegation attends, the keynote raises our foreign influence for a year, more at prestigious forums. Once a summit."
 econ_forum_row_boycott: "Boycott"
 econ_forum_row_unboycott: "Rejoin"
 econ_forum_row_boycott_tt: "§YBoycott this forum§!: §R25§! Political Power. Any delegation we planned stays home.\nThe forum loses §R2§! prestige, or §R5§! if we are a great or super power, and the host loses §R30§! opinion of us. We receive no invitations until we rejoin, which is free. A great or super power's boycott makes the news. Boycotting again in the same summit cycle repeats neither the prestige loss nor the news.\nA great or super power's boycott can lead AI governments in its faction out with it. If we host a forum of our own, it gains a point of prestige for each and invites them while they stay out."
 econ_forum.6.t: "Our Keynote at the [econ_forum_name_bid]"
 econ_forum.6.d_won: "The organizers of the [econ_forum_name_bid] have given our head of delegation a headline slot. The speech will draw the cameras, and our standing abroad with them."
 econ_forum.6.d_lost: "The organizers of the [econ_forum_name_bid] have declined to give our delegation a headline slot. Our delegation will still attend from the audience."
 econ_forum.6.a: "Noted"
 econ_forum_row_request: "Request"
 econ_forum_row_request_tt: "§YAsk for an invitation§! to this summit: §R15§! Political Power.\nThe organizers say yes 30% of the time, plus up to 30% the less prestigious the forum, 20% as a great or super power and 15% if the host likes us (opinion above 25). A host that dislikes us (opinion below -25) is 20% less likely to agree.\nOnly while the forum prepares and its invitations are open, until a month before the summit, and only if we hold no invitation, have not declined one and do not boycott it. Once a summit. Forums run by other players invite through their own decisions."
 econ_forum.7.t: "No Invitation to the [econ_forum_name_request]"
 econ_forum.7.d: "The organizers of the [econ_forum_name_request] have answered our request politely and firmly: there is no seat for our delegation this year. Our diplomats can try again when the next summit opens its preparations."
 econ_forum.7.a: "Their loss"
 econ_forum.8.t: "A Signing Ceremony at the [econ_forum_name_ceremony]"
 econ_forum.8.d: "The organizers of the [econ_forum_name_ceremony] want an agreement with us signed on their stage at the coming summit. If our delegation attends, both governments will trade warmer words and investors on each side will take note."
 econ_forum.8.a: "We will sign"
 econ_forum.8.a_tt: "If our delegation attends the summit, we sign: §G20§! opinion both ways with the host, and its investors favour us for a year."
 econ_forum.8.b: "Decline the ceremony"
 econ_forum_news.8.t: "[?FROM.econ_forum_news_boycotter.GetName] Boycotts the [econ_forum_name_founded]"
 econ_forum_news.8.d: "[?FROM.econ_forum_news_boycotter.GetName] has announced that it will send no delegation to the [econ_forum_name_founded] in [FROM.GetName] while the dispute lasts. The organizers insist the summit will go ahead, but the empty seats will be hard to miss."
 econ_forum_news.8.a: "A pointed absence"
 econ_forum_news.9.t: "[?FROM.econ_forum_news_boycotter.GetName] Leads a Walkout from the [econ_forum_name_founded]"
 econ_forum_news.9.d: "[?FROM.econ_forum_news_boycotter.GetName] has announced that it will send no delegation to the [econ_forum_name_founded] in [FROM.GetName]. Allied delegations that walked out with it: §Y[?FROM.econ_forum_news_walkouts|0]§!. The summit will still meet, but it no longer speaks for the whole room."
 econ_forum_news.9.d_rival: "[?FROM.econ_forum_news_boycotter.GetName] has announced that it will send no delegation to the [econ_forum_name_founded] in [FROM.GetName]. Allied delegations that walked out with it: §Y[?FROM.econ_forum_news_walkouts|0]§!. Their delegations are expected at the [econ_forum_name_news_rival] instead, where the organizers are already rewriting the guest list."
 econ_forum_news.9.a: "The room splits"
 econ_forum_news.10.t: "[FROM.GetName] Founds the [econ_forum_name_founded]"
 econ_forum_news.10.d_rival: "[FROM.GetName] has founded the [econ_forum_name_founded], a rival to the [econ_forum_name_news_rival] it has been boycotting. Its allies are expected to fill the first summit, and the old forum's organizers are counting the empty chairs."
 econ_forum_news.10.d: "[FROM.GetName] has founded the [econ_forum_name_founded], a summit for the governments that no longer trust the old forums to speak for them."
 econ_forum_news.10.a: "A second table"
 econ_forum_council_name_0: "AI and Technology Council"
 econ_forum_council_name_1: "Energy Council"
 econ_forum_council_name_2: "Finance Council"
 econ_forum_council_name_3: "Defense Industry Council"
 econ_forum_council_name_4: "Infrastructure and Trade Council"
 econ_forum_council_name_5: "Development Council"
 econ_forum_news.11.t: "The [econ_forum_name_founded] Launches a [econ_forum_council_name]"
 econ_forum_news.11.d: "The [econ_forum_name_founded] has set up a standing [econ_forum_council_name] for the governments that keep coming back. Its members will meet between summits, and the organizers hope the habit will keep them coming."
 econ_forum_news.11.a: "Another committee"
 econ_forum_message_open: "Summit Message: Open for Business"
 econ_forum_message_open_desc: "Tell the world our summit is for everyone with money to invest and deals to sign, whatever flag they fly."
 econ_forum_message_open_tt: "For this summit: every invited AI government is §G10%§! more likely to attend, and the summit score gains §G3§!. One message a summit."
 econ_forum_message_autonomy: "Summit Message: Strategic Autonomy"
 econ_forum_message_autonomy_desc: "Tell the world our summit is for partners who build their own future, not for those who would dictate it."
 econ_forum_message_autonomy_tt: "For this summit: invited AI governments that are our core members or in our faction are §G15%§! more likely to attend, and every other invited AI government §R10%§! less likely. One message a summit."
 econ_forum_message_media: "Summit Message: Media Blitz"
 econ_forum_message_media_desc: "Buy every screen from the airport to the conference hall. If the summit goes well, the world will hear of it. If it goes badly, the world will hear of that too."
 econ_forum_message_media_tt: "Costs §R$2§! billion. For this summit: the score gains §G5§!, and the forum's prestige moves §Y50%§! of the way to the score instead of 30%, up or down. One message a summit."
 econ_forum_launch_council: "Launch a Forum Council"
 econ_forum_launch_council_desc: "Governments that come back year after year want more than a seat in the hall. A standing council on our strongest sector would give them a reason to keep returning."
 econ_forum_launch_council_tt: "Our forum gets a standing council on its strongest sector, once and for good. Every government that attends two summits in a row is a member: after each summit it attends, it gains a sector bonus for a year, it is §G10%§! more likely to attend, and each member present adds §G1§! to the summit score, up to §G10§!.\nAI and technology: §G+2%§! research speed. Energy: §G+3%§! energy output. Finance: §G5%§! cheaper investment. Defense industry: §G+3%§! factory efficiency growth. Infrastructure and trade: §G+5%§! infrastructure construction speed. Development: §G+2%§! stability."

 econ_forum_category: "Economic Forums"
 econ_forum_category_desc: "Economic forums compete every year for governments, companies and headline speakers. Each summit's score pulls its forum's prestige toward it, and prestige draws the next year's guests. A forum with 60 or more prestige invites every regional power automatically.\n[econ_forum_standing_line_0][econ_forum_standing_line_2][econ_forum_standing_line_1][econ_forum_standing_line_3][econ_forum_standing_line_4][econ_forum_standing_line_5][econ_forum_standing_line_6][econ_forum_standing_line_7][econ_forum_standing_line_8]\n\n[econ_forum_preparation_status]\n[econ_forum_program_status]"

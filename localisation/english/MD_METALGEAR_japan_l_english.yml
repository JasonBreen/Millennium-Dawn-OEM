 METALGEAR_japan_category: "Dual-Use Export Review"
 METALGEAR_japan_category_desc: "This original 2000 opening follows control equipment exported under conflicting licenses. Our records may establish where civilian components entered a concealed weapons program."
 METALGEAR_japan_review: "Review the Control Equipment Exports"
 METALGEAR_japan_review_desc: "Compare the export licenses with the manufacturer's shipment records. A missing end user can matter as much as a missing crate."
 METALGEAR_japan_request: "Request Russian Contract Records"
 METALGEAR_japan_request_desc: "Ask Russia to compare archived military contracts with our export findings. A cooperative policy opens one request."
 METALGEAR.20.t: "Two Licenses for One Shipment"
 METALGEAR.20.d: "A manufacturer has reported control equipment shipped under two licenses naming different end users. The freight records agree on where the crates went, but the authority that changed the paperwork has left no explanation. We can begin with the documents still in our custody."
 METALGEAR.20.a: "Open the export review."
 METALGEAR.21.t: "The End User Left Unnamed"
 METALGEAR.21.d: "Our review confirms that the second license redirected the equipment through an intermediary with military contracts abroad. The manufacturer supplied working components, not an explanation of the final project. We must decide whether to seek a foreign comparison or keep the file classified."
 METALGEAR.21.a: "Prepare a cooperative review."
 METALGEAR.21.b: "Classify the findings."
 METALGEAR.24.t: "An American Request"
 METALGEAR.24.d: "The United States has asked for the export records behind the control equipment in our review. Its procurement file contains a delivery reference that matches ours. The records could help establish which office authorized the transfer."
 METALGEAR.24.a: "Share the verified records."
 METALGEAR.24.b: "Decline the exchange."
 METALGEAR.24.c: "Close the interrupted exchange."
 METALGEAR.23.t: "Russia's Reply"
 METALGEAR.23.d_accepted: "Russia has supplied the requested archived contracts. Our reviewers can compare them with the export licenses, and the completed exchange has improved relations between both governments."
 METALGEAR.23.d_declined: "Russia has declined to release the requested contracts. We retain our national findings, but this exchange will take us no further."
 METALGEAR.23.d_interrupted: "The proposed exchange with Russia has ended without a valid transfer. The missing records establish nothing about the equipment's final use."
 METALGEAR.23.a: "File the reply."
 METALGEAR.22.t: "The Shadow Moses Request"
 METALGEAR.22.d: "The United States is responding to FOXHOUND's seizure of Shadow Moses and has asked for our export records. The request concerns the weapons program behind the facility, not a deployment of our forces. We must decide whether to release what we hold."
 METALGEAR.22.a: "Supply the verified records."
 METALGEAR.22.b: "Withhold the records."
 METALGEAR.22.c: "Close the interrupted response."
 METALGEAR.25.t: "The Shadow Moses File Closes"
 METALGEAR.25.d_shared: "The United States has supplied the final report it promised after we released our records. We now have an account of how those records were used, and both governments have a reason to preserve the channel."
 METALGEAR.25.d_suppressed: "The United States has withheld the final report it promised after we released our records. The request was useful to Washington; the promised return was not honored. Trust in the exchange has suffered."
 METALGEAR.25.d_interrupted: "The American response has ended without a valid resolution under its original authority. We have received no completed report and can claim no credit for a successful response."
 METALGEAR.25.d: "The American response to Shadow Moses has closed. We have no promised report to add to our national file, and no further decision is required."
 METALGEAR.25.a: "Archive the crisis file."

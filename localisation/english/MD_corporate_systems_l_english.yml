l_english:
 USA_corporate_systems_dashboard_category: "U.S. Corporate Systems"
 USA_corporate_systems_dashboard_category_desc: "Corporate-history choices shape the structure, resilience, openness, and security of the American compute ecosystem. This dashboard reports the live state of the shared American compute stack and IBM's institutional strategy without changing either system."
 USA_corporate_systems_read_only_tt: "§YRead-only status panel§!\nThis entry reports live corporate-history state and cannot be completed."

 USA_corporate_systems_compute_stack: "American Compute Stack"
 USA_corporate_systems_compute_stack_desc: "These five axes describe the structure of the American compute ecosystem. Values are read directly from the corporate-history system and remain bounded from 0 to 10.\n\n§YOpen Standards:§! [?USA_oem_open_standards|0] / 10 ([USA_corporate_systems_open_standards_band])\nMeasures interoperability, open technical standards, and cross-vendor participation.\n\n§YVertical Integration:§! [?USA_oem_vertical_integration|0] / 10 ([USA_corporate_systems_vertical_integration_band])\nMeasures how much design, hardware, software, and delivery remain under unified control.\n\n§YSupply Resilience:§! [?USA_oem_supply_resilience|0] / 10 ([USA_corporate_systems_supply_resilience_band])\nMeasures the ability of domestic supply and production networks to withstand disruption.\n\n§YSecurity Control:§! [?USA_oem_security_control|0] / 10 ([USA_corporate_systems_security_control_band])\nMeasures control over trusted infrastructure, firmware, data, and classified systems.\n\n§YNational Compute Stack:§! [?USA_oem_national_compute_stack|0] / 10 ([USA_corporate_systems_national_compute_stack_band])\nMeasures whether the country retains a coherent domestic base across the computing stack."

 USA_corporate_systems_institutional_balance: "IBM Institutional Balance"
 USA_corporate_systems_institutional_balance_desc: "IBM's internal factions influence its strategic direction. These scores describe institutional weight, not separate player-controlled mechanics.\n\n§YCurrent leadership:§! [USA_corporate_systems_ibm_leadership]\n\n§YSystems:§! [?USA_ibm_faction_systems|0] / 10\nHardware, mainframes, servers, proprietary platforms, and vertically integrated product interests.\n\n§YServices:§! [?USA_ibm_faction_services|0] / 10\nConsulting, integration, managed services, client relationships, and hybrid-cloud delivery.\n\n§YOpen Platform:§! [?USA_ibm_faction_open_platform|0] / 10\nLinux, Red Hat autonomy, interoperability, OpenShift, and vendor-neutral platform strategy.\n\n§YFinancial:§! [?USA_ibm_faction_financial|0] / 10\nMargin defense, portfolio management, divestitures, spin-offs, and asset-light restructuring. This is an institutional influence score, not a direct capstone threshold.\n\n§YResearch:§! [?USA_ibm_faction_research|0] / 10\nWatson, advanced computing, quantum development, long-horizon research, and technical prestige."

 USA_corporate_systems_strategic_milestones: "IBM Strategic Milestones"
 USA_corporate_systems_strategic_milestones_desc: "The following milestones translate IBM's major strategic choices into their current player-facing state. Unresolved entries have not yet reached a decision in this campaign.\n\n§YPC business disposition:§! [USA_corporate_systems_ibm_pc_disposition]\n§YWatson's initial posture:§! [USA_corporate_systems_ibm_watson_posture]\n§Yx86 and server-hardware disposition:§! [USA_corporate_systems_ibm_x86_disposition]\n§YRed Hat relationship:§! [USA_corporate_systems_ibm_redhat_relationship]\n§YOpenShift platform posture:§! [USA_corporate_systems_ibm_openshift_posture]\n§YServices and Kyndryl structure:§! [USA_corporate_systems_ibm_services_structure]\n§Ywatsonx and governed-AI posture:§! [USA_corporate_systems_ibm_watsonx_posture]\n§YQuantum posture:§! [USA_corporate_systems_ibm_quantum_posture]"

 USA_corporate_systems_strategic_outlook: "IBM Strategic Outlook"
 USA_corporate_systems_strategic_outlook_desc: "IBM's resolved capstone is reported exactly from its existing outcome state. Before resolution, the dashboard identifies only a broad strategic tendency from major route choices and live scores.\n\n[USA_corporate_systems_ibm_outlook]"

 USA_corporate_systems_risks_and_burdens: "IBM Risks and Restructuring Burdens"
 USA_corporate_systems_risks_and_burdens_desc: "Crises are active disruptions produced by IBM's existing crisis engine. Restructuring burdens are the recovery costs already imposed by the corresponding resolution path.\n\n§YCrises§!\nWatson governance crisis: [USA_corporate_systems_watson_crisis_status]\nFoundry crisis: [USA_corporate_systems_foundry_crisis_status]\nMaintainers' revolt: [USA_corporate_systems_maintainers_crisis_status]\nProcurement crisis: [USA_corporate_systems_procurement_crisis_status]\n\n§YRestructuring and recovery burdens§!\nRetreat to certainty: [USA_corporate_systems_retreat_cost_status]\nHardware re-entry: [USA_corporate_systems_hardware_reentry_cost_status]\nMinistry breakup: [USA_corporate_systems_ministry_breakup_cost_status]\n\n[USA_corporate_systems_risk_summary]"


 DEUSEX.10.t: "The Controller Shipment"
 DEUSEX.10.d: "An inspection of imported research equipment has found prosthetic controllers billed to two different laboratories. Neither laboratory signed the shipping authorization, and the supplier refers every question to a contracting office abroad. We can follow the shipment without assuming what the equipment will become."
 DEUSEX.10.a: "Trace the shipment records."
 DEUSEX.11.t: "Who Authorized the Shipment"
 DEUSEX.11.d: "Our reviewers have matched the controllers to a legitimate trial, but the authorization passed through a sponsor absent from the research agreement. Several payments cross national borders before returning to the supplier. The finding is concrete; the sponsor's purpose remains uncertain."
 DEUSEX.11.a: "Publish the contracting trail."
 DEUSEX.11.b: "Keep the review within our agencies."
 DEUSEX.12.t: "A Request From Germany"
 DEUSEX.12.d: "German officials have asked for the authorization records behind our imported research controllers. An intermediary in their safety dossier also appears in our shipment file. A comparison could establish which signatures and payments the two programs share."
 DEUSEX.12.a: "Share the verified records."
 DEUSEX.12.b: "Decline the exchange."
 DEUSEX.13.t: "The American Reply"
 DEUSEX.13.accepted.d: "The United States has supplied its trial and sponsor records. Our reviewers can compare them with the shipment file, and both governments have gained a reason to continue the exchange."
 DEUSEX.13.declined.d: "The United States has declined to release the requested records. We retain our shipment findings, but this exchange will take us no further."
 DEUSEX.13.interrupted.d: "The proposed exchange with the United States has ended without a valid transfer. The missing reply establishes nothing about the controllers or their sponsor."
 DEUSEX.13.a: "File the reply."
 DEUSEX.13.accepted_unavailable.d: "The United States accepted our request before the channel closed. The acceptance remains on file, but it offers no assurance of cooperation under the present circumstances."

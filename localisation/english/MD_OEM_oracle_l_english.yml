l_english:

 # Oracle Corporate History Events
 USA_oracle_events.1.t: "The PeopleSoft Siege"
 USA_oracle_events.1.d: "Oracle launches a hostile bid for PeopleSoft and commits to an eighteen-month legal and shareholder campaign. Antitrust regulators challenge the deal, framing it as a test of consolidation in enterprise software. Boardrooms, courts, and procurement officers all become part of the battlefield at once. The choice now is whether to force scale immediately, negotiate terms, or walk away before the balance sheet gets stretched."
 USA_oracle_events.1.a: "Push the hostile takeover through"
 USA_oracle_events.1.a_tt: "Gain platform scale and policy leverage, but take an immediate treasury hit and begin building integration debt."
 USA_oracle_events.1.b: "Settle and close on negotiated terms"
 USA_oracle_events.1.b_tt: "Secure a smaller expansion with lighter integration risk and modest openness gains."
 USA_oracle_events.1.c: "Walk away and preserve capital"
 USA_oracle_events.1.c_tt: "Avoid the takeover strain, improve discipline, and preserve political room at the cost of scale."

 USA_oracle_events.2.t: "Siebel and BEA: Keep Buying or Consolidate?"
 USA_oracle_events.2.d: "After PeopleSoft, Oracle can keep rolling up adjacent enterprise firms or pause and digest what it already owns. Siebel offers CRM reach, while BEA adds middleware control over key corporate workflows. The strategic logic is clear, but integration complexity compounds across product lines, salesforces, and support contracts. This decision defines whether growth is bought, curated, or deferred."
 USA_oracle_events.2.a: "Continue the acquisition spree"
 USA_oracle_events.2.a_tt: "Add major platform scale and procurement access, but raise debt from integration and upfront cost."
 USA_oracle_events.2.b: "Take only the cleanest strategic fits"
 USA_oracle_events.2.b_tt: "Expand carefully with moderate debt and stronger execution control."
 USA_oracle_events.2.c: "Pause M&A and integrate first"
 USA_oracle_events.2.c_tt: "Reduce integration pressure and improve discipline, but surrender some market share momentum."

 USA_oracle_events.3.t: "Sun Microsystems: Custody of the Stack"
 USA_oracle_events.3.d: "The Sun deal puts Java, MySQL, Solaris, and SPARC under Oracle's control, giving one company leverage over critical software infrastructure. Inside Oracle, leaders argue over whether these assets should be stewarded as shared foundations or monetized as proprietary leverage. Both paths are defensible: one protects ecosystem trust, the other protects pricing power and contract lock-in. The decision will shape developers, governments, and competitors for years."
 USA_oracle_events.3.a: "Steward Java and MySQL as shared infrastructure"
 USA_oracle_events.3.a_tt: "Gain openness and long-run ecosystem legitimacy while paying a larger upfront integration cost."
 USA_oracle_events.3.b: "Monetize the stack as a strategic moat"
 USA_oracle_events.3.b_tt: "Maximize control and near-term leverage, but reduce openness and increase long-term coordination strain."
 USA_oracle_events.3.c: "Prioritize contract power over ecosystem balance"
 USA_oracle_events.3.c_tt: "Use Sun to strengthen institutional deals, with higher integration debt and narrower openness."

 USA_oracle_events.4.t: "What to Do with the Hardware Business"
 USA_oracle_events.4.d: "Owning Sun also means owning a hardware operation that does not scale like software margins. Oracle can reinvest in engineered systems, allow the business to wither while harvesting enterprise relationships, or aggressively strip it for cash. Each route changes the cadence of product integration and the political narrative around domestic tech infrastructure. The short-term P&L signal may conflict with long-term platform coherence."
 USA_oracle_events.4.a: "Reinvest and keep hardware strategic"
 USA_oracle_events.4.a_tt: "Preserve systems depth and procurement relevance, but absorb added cost and complexity."
 USA_oracle_events.4.b: "Let hardware wither and refocus"
 USA_oracle_events.4.b_tt: "Recover cash and sharpen software focus, at the cost of ecosystem breadth and goodwill."
 USA_oracle_events.4.c: "Harvest aggressively for near-term returns"
 USA_oracle_events.4.c_tt: "Improve immediate treasury position, but deepen future integration and compatibility risks."

 USA_oracle_events.5.t: "Oracle v. Google"
 USA_oracle_events.5.d_commons: "Because we framed Java and MySQL as shared infrastructure, the API suit now risks undermining our own legitimacy. A hard legal win could still produce licensing revenue, but it would tell every software firm that interfaces are private property. A fair-use outcome protects interoperability norms, yet limits our ability to extract value from custody of Java. The board wants a line that balances doctrine, profit, and policy fallout."
 USA_oracle_events.5.d: "The Java API lawsuit against Google has become a defining legal battle over software interfaces. If Oracle wins outright, APIs become effectively copyrightable, and licensing pressure spreads across the industry. If the fair-use standard prevails, the immediate case is lost, but interoperability norms remain intact. The choice now is to pursue precedent, preserve the commons, or broker a controlled licensing compact."
 USA_oracle_events.5.a: "Accept the fair-use boundary"
 USA_oracle_events.5.a_tt: "Improve ecosystem openness and reduce political pressure, while giving up maximal legal leverage."
 USA_oracle_events.5.b: "Force the maximal precedent and win"
 USA_oracle_events.5.b_tt: "Establish API copyright leverage and stronger policy access, but trigger ecosystem friction and added debt risk."
 USA_oracle_events.5.c: "Broker a licensing compact"
 USA_oracle_events.5.c_tt: "Secure limited legal leverage while containing the broadest interoperability backlash."

 USA_oracle_events.6.t: "Cloud Infrastructure Pivot"
 USA_oracle_events.6.d: "Oracle now faces hyperscale incumbents with entrenched distribution, developer gravity, and capex scale. A full IaaS assault could buy relevance but requires years of expensive execution against stronger positions. A narrower play tied to government and regulated buyers better matches Oracle's institutional strengths, while partnership models preserve margin with less prestige. This decision determines whether cloud is a proving ground or a balance-sheet trap."
 USA_oracle_events.6.a: "Go all-in on hyperscale infrastructure"
 USA_oracle_events.6.a_tt: "Attempt maximum cloud scale, but take a heavy treasury burn and significant integration debt."
 USA_oracle_events.6.b: "Build for sovereign and institutional workloads"
 USA_oracle_events.6.b_tt: "Align cloud expansion to procurement strengths with steadier execution and lower financial exposure."
 USA_oracle_events.6.c: "Partner for infrastructure, own the data layer"
 USA_oracle_events.6.c_tt: "Preserve flexibility and lower debt while accepting less direct control of cloud rails."

 USA_oracle_events.7.t: "The TikTok Divestiture Bid"
 USA_oracle_events.7.d: "Washington asks for a structure to separate TikTok's U.S. operations, and Oracle is suddenly in the center of a geopolitical procurement fight. The opportunity offers visibility and policy capital, but execution risk is high and terms can shift with politics. A lead bid could elevate Oracle's state-facing profile, while a minority role limits downside and a refusal keeps focus on core contracts. The choice is less about media and more about institutional strategy."
 USA_oracle_events.7.a: "Lead the consortium bid"
 USA_oracle_events.7.a_tt: "Gain policy influence and strategic visibility, with extra fiscal and integration exposure."
 USA_oracle_events.7.b: "Take a minority infrastructure role"
 USA_oracle_events.7.b_tt: "Capture partial upside with bounded risk and improved execution discipline."
 USA_oracle_events.7.c: "Decline and stay focused"
 USA_oracle_events.7.c_tt: "Protect core execution and avoid diversion, but lose political momentum in Washington."

 USA_oracle_events.8.t: "AI Infrastructure Commitments"
 USA_oracle_events.8.d: "Enterprise AI demand now rewards whoever can guarantee long-duration compute, compliant data control, and procurement-safe deployment. Oracle can announce massive commitments, phase capacity through contracted institutional demand, or halt expansion to repair integration debt. The acquisition-heavy path can still produce a brittle stack that cannot absorb one more wave of promises. This final decision reveals whether Oracle built durable infrastructure or overextended into a debt spiral."
 USA_oracle_events.8.a: "Announce full-scale compute commitments"
 USA_oracle_events.8.a_tt: "If integration debt is high, this triggers a severe execution crisis; otherwise it secures a high-scale AI position."
 USA_oracle_events.8.b: "Stage commitments behind signed demand"
 USA_oracle_events.8.b_tt: "Deliver controlled AI growth with better fiscal resilience and stronger procurement alignment."
 USA_oracle_events.8.c: "Freeze expansion and work out integration debt"
 USA_oracle_events.8.c_tt: "Stabilize treasury and governance at the cost of headline scale and momentum."

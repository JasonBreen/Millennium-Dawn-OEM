 # Oracle Corporate History Events
 USA_oracle_events.1.t: "The PeopleSoft Siege"
 USA_oracle_events.1.d: "Oracle launches a hostile bid for PeopleSoft and commits to an eighteen-month legal and shareholder campaign. Antitrust regulators challenge the deal, framing it as a test of consolidation in enterprise software. Boardrooms, courts, and procurement officers all become part of the battlefield at once. The choice now is whether to force scale immediately, negotiate terms, or walk away before the balance sheet gets stretched."
 USA_oracle_events.1.a: "Push the hostile takeover through"
 USA_oracle_events.1.a_tt: "§YPlatform Scale§!: §G+2§!\n§YPolicy Access§!: §G+1§!\n§YIntegration Debt§!: §R+2§!\n§YTreasury§!: §R-3.00§!\nPolitical Power: §R-20§!"
 USA_oracle_events.1.b: "Settle and close on negotiated terms"
 USA_oracle_events.1.b_tt: "§YPlatform Scale§!: §G+1§!\n§YEcosystem Openness§!: §G+1§!\n§YIntegration Debt§!: §R+1§!\n§YTreasury§!: §R-1.50§!\nPolitical Power: §R-10§!"
 USA_oracle_events.1.c: "Walk away and preserve capital"
 USA_oracle_events.1.c_tt: "§YExecution Discipline§!: §G+1§!\n§YEcosystem Openness§!: §G+1§!\nStability: §G+1%§!\nPolitical Power: §G+10§!"

 USA_oracle_events.2.t: "Siebel and BEA: Keep Buying or Consolidate?"
 USA_oracle_events.2.d: "After PeopleSoft, Oracle can keep rolling up adjacent enterprise firms or pause and digest what it already owns. Siebel offers CRM reach, while BEA adds middleware control over key corporate workflows. The strategic logic is clear, but integration complexity compounds across product lines, salesforces, and support contracts. This decision defines whether growth is bought, curated, or deferred."
 USA_oracle_events.2.a: "Continue the acquisition spree"
 USA_oracle_events.2.a_tt: "§YPlatform Scale§!: §G+2§!\n§YPolicy Access§!: §G+1§!\n§YIntegration Debt§!: §R+2§!\n§YTreasury§!: §R-4.00§!"
 USA_oracle_events.2.b: "Take only the cleanest strategic fits"
 USA_oracle_events.2.b_tt: "§YPlatform Scale§!: §G+1§!\n§YExecution Discipline§!: §G+1§!\n§YIntegration Debt§!: §R+1§!\n§YTreasury§!: §R-2.00§!"
 USA_oracle_events.2.c: "Pause M&A and integrate first"
 USA_oracle_events.2.c_tt: "§YExecution Discipline§!: §G+2§!\n§YPlatform Scale§!: §R-1§!\n§YIntegration Debt§!: §G-1§!\nPolitical Power: §G+15§!"

 USA_oracle_events.3.t: "Sun Microsystems: Custody of the Stack"
 USA_oracle_events.3.d: "The Sun deal puts Java, MySQL, Solaris, and SPARC under Oracle's control, giving one company leverage over critical software infrastructure. Inside Oracle, leaders argue over whether these assets should be stewarded as shared foundations or monetized as proprietary leverage. Both paths are defensible: one protects ecosystem trust, the other protects pricing power and contract lock-in. The decision will shape developers, governments, and competitors for years."
 USA_oracle_events.3.a: "Steward Java and MySQL as shared infrastructure"
 USA_oracle_events.3.a_tt: "§YPlatform Scale§!: §G+2§!\n§YEcosystem Openness§!: §G+3§!\n§YExecution Discipline§!: §G+1§!\n§YTreasury§!: §R-5.00§!\nKeeps the developer ecosystem loyal and disarms the coming interface suit."
 USA_oracle_events.3.b: "Monetize the stack as a strategic moat"
 USA_oracle_events.3.b_tt: "§YPlatform Scale§!: §G+3§!\n§YPolicy Access§!: §G+1§!\n§YEcosystem Openness§!: §R-2§!\n§YIntegration Debt§!: §R+1§!\n§YTreasury§!: §R-3.00§!\nArms the coming interface suit and pushes toward a licensing empire."
 USA_oracle_events.3.c: "Prioritize contract power over ecosystem balance"
 USA_oracle_events.3.c_tt: "§YPlatform Scale§!: §G+2§!\n§YPolicy Access§!: §G+2§!\n§YEcosystem Openness§!: §R-1§!\n§YIntegration Debt§!: §R+2§!\n§YTreasury§!: §R-2.50§!"

 USA_oracle_events.4.t: "What to Do with the Hardware Business"
 USA_oracle_events.4.d: "Owning Sun also means owning a hardware operation that does not scale like software margins. Oracle can reinvest in engineered systems, allow the business to wither while harvesting enterprise relationships, or aggressively strip it for cash. Each route changes the cadence of product integration and the political narrative around domestic tech infrastructure. The short-term P&L signal may conflict with long-term platform coherence."
 USA_oracle_events.4.a: "Reinvest and keep hardware strategic"
 USA_oracle_events.4.a_tt: "§YExecution Discipline§!: §G+1§!\n§YPolicy Access§!: §G+1§!\n§YIntegration Debt§!: §R+1§!\n§YTreasury§!: §R-2.00§!"
 USA_oracle_events.4.b: "Let hardware wither and refocus"
 USA_oracle_events.4.b_tt: "§YExecution Discipline§!: §G+1§!\n§YPlatform Scale§!: §G+1§!\n§YEcosystem Openness§!: §R-1§!\n§YTreasury§!: §G+1.50§!"
 USA_oracle_events.4.c: "Harvest aggressively for near-term returns"
 USA_oracle_events.4.c_tt: "§YPlatform Scale§!: §G+1§!\n§YEcosystem Openness§!: §R-2§!\n§YIntegration Debt§!: §R+2§!\n§YTreasury§!: §G+2.00§!"

 USA_oracle_events.5.t: "Oracle v. Google"
 USA_oracle_events.5.d_commons: "Because we framed Java and MySQL as shared infrastructure, the API suit now risks undermining our own legitimacy. A hard legal win could still produce licensing revenue, but it would tell every software firm that interfaces are private property. A fair-use outcome protects interoperability norms, yet limits our ability to extract value from custody of Java. The board wants a line that balances doctrine, profit, and policy fallout."
 USA_oracle_events.5.d: "The Java API lawsuit against Google has become a defining legal battle over software interfaces. If Oracle wins outright, APIs become effectively copyrightable, and licensing pressure spreads across the industry. If the fair-use standard prevails, the immediate case is lost, but interoperability norms remain intact. The choice now is to pursue precedent, preserve the commons, or broker a controlled licensing compact."
 USA_oracle_events.5.a: "Accept the fair-use boundary"
 USA_oracle_events.5.a_tt: "§YEcosystem Openness§!: §G+2§!\n§YExecution Discipline§!: §G+1§!\n§YPolicy Access§!: §R-1§!\nPolitical Power: §R-10§!\nInterfaces stay free to reimplement and the ecosystem keeps its trust."
 USA_oracle_events.5.b: "Force the maximal precedent and win"
 USA_oracle_events.5.b_tt: "§YPolicy Access§!: §G+2§!\n§YPlatform Scale§!: §G+1§!\n§YEcosystem Openness§!: §R-3§!\n§YExecution Discipline§!: §R-1§!\n§YIntegration Debt§!: §R+1§!\nStability: §R-1%§!\nPolitical Power: §G+20§!\nInterfaces become copyrightable industry-wide. Every platform reimplements behind license walls and the whole sector turns litigious."
 USA_oracle_events.5.c: "Broker a licensing compact"
 USA_oracle_events.5.c_tt: "§YPolicy Access§!: §G+1§!\n§YExecution Discipline§!: §G+1§!\n§YEcosystem Openness§!: §R-1§!\nPolitical Power: §G+5§!"

 USA_oracle_events.6.t: "Cloud Infrastructure Pivot"
 USA_oracle_events.6.d: "Oracle now faces hyperscale incumbents with entrenched distribution, developer gravity, and capex scale. A full IaaS assault could buy relevance but requires years of expensive execution against stronger positions. A narrower play tied to government and regulated buyers better matches Oracle's institutional strengths, while partnership models preserve margin with less prestige. This decision determines whether cloud is a proving ground or a balance-sheet trap."
 USA_oracle_events.6.a: "Go all-in on hyperscale infrastructure"
 USA_oracle_events.6.a_tt: "§YPlatform Scale§!: §G+2§!\n§YIntegration Debt§!: §R+3§!\n§YExecution Discipline§!: §R-1§!\n§YTreasury§!: §R-6.00§!\nChasing entrenched hyperscalers at scale runs the ledger hot."
 USA_oracle_events.6.b: "Build for sovereign and institutional workloads"
 USA_oracle_events.6.b_tt: "§YPlatform Scale§!: §G+1§!\n§YPolicy Access§!: §G+2§!\n§YExecution Discipline§!: §G+1§!\n§YIntegration Debt§!: §R+1§!\n§YTreasury§!: §R-2.50§!\nMatches Oracle's procurement strengths."
 USA_oracle_events.6.c: "Partner for infrastructure, own the data layer"
 USA_oracle_events.6.c_tt: "§YEcosystem Openness§!: §G+2§!\n§YExecution Discipline§!: §G+2§!\n§YIntegration Debt§!: §G-1§!\n§YTreasury§!: §R-1.00§!"

 USA_oracle_events.7.t: "The TikTok Divestiture Bid"
 USA_oracle_events.7.d: "Washington asks for a structure to separate TikTok's U.S. operations, and Oracle is suddenly in the center of a geopolitical procurement fight. The opportunity offers visibility and policy capital, but execution risk is high and terms can shift with politics. A lead bid could elevate Oracle's state-facing profile, while a minority role limits downside and a refusal keeps focus on core contracts. The choice is less about media and more about institutional strategy."
 USA_oracle_events.7.a: "Lead the consortium bid"
 USA_oracle_events.7.a_tt: "§YPolicy Access§!: §G+2§!\n§YIntegration Debt§!: §R+1§!\n§YTreasury§!: §R-2.00§!\nPolitical Power: §R-10§!\nBinds Oracle to federal procurement."
 USA_oracle_events.7.b: "Take a minority infrastructure role"
 USA_oracle_events.7.b_tt: "§YPolicy Access§!: §G+1§!\n§YExecution Discipline§!: §G+1§!\n§YTreasury§!: §R-1.00§!"
 USA_oracle_events.7.c: "Decline and stay focused"
 USA_oracle_events.7.c_tt: "§YExecution Discipline§!: §G+2§!\n§YPolicy Access§!: §R-1§!\nPolitical Power: §G+10§!"

 USA_oracle_events.8.t: "AI Infrastructure Commitments"
 USA_oracle_events.8.d: "Enterprise AI demand now rewards whoever can guarantee long-duration compute, compliant data control, and procurement-safe deployment. Oracle can announce massive commitments, phase capacity through contracted institutional demand, or halt expansion to repair integration debt. The acquisition-heavy path can still produce a brittle stack that cannot absorb one more wave of promises. This decision reveals whether Oracle built durable infrastructure or overextended into a debt spiral."
 USA_oracle_events.8.a: "Announce full-scale compute commitments"
 USA_oracle_events.8.a_tt: "§YTreasury§!: §R-8.00§!\nIf §YIntegration Debt§! is 6 or higher: Stability §R-4%§! and Political Power §R-35§!. Otherwise: Stability §G+1%§! and Political Power §G+20§!."
 USA_oracle_events.8.b: "Stage commitments behind signed demand"
 USA_oracle_events.8.b_tt: "§YTreasury§!: §R-3.00§!\nIf §YPolicy Access§! is 4 or higher: Stability §G+1%§! and Political Power §G+20§!. Otherwise: Political Power §G+5§!."
 USA_oracle_events.8.c: "Freeze expansion and work out integration debt"
 USA_oracle_events.8.c_tt: "§YIntegration Debt§!: §G-2§!\n§YTreasury§!: §G+1.50§!\nStability: §G+2%§!\nPolitical Power: §G+10§!\nStabilises the balance sheet at the cost of headline scale."

 USA_oracle_events.9.t: "Cerner Acquisition: Healthcare IT Dominance"
 USA_oracle_events.9.d: "The Cerner deal would give Oracle commanding position in electronic health records and hospital information systems, extending enterprise reach into one of the most data-sensitive and regulation-heavy sectors. Full integration promises cross-selling opportunities and deeper customer lock-in, but healthcare IT has its own compliance rhythms, clinical workflows, and legacy system realities. A partial integration preserves focus, while walking away avoids the sector's unique governance burdens entirely."
 USA_oracle_events.9.a: "Execute full healthcare IT integration"
 USA_oracle_events.9.a_tt: "§YPlatform Scale§!: §G+2§!\n§YPolicy Access§!: §G+2§!\n§YIntegration Debt§!: §R+2§!\n§YTreasury§!: §R-5.00§!\nPolitical Power: §R-15§!"
 USA_oracle_events.9.b: "Integrate selectively with focused priorities"
 USA_oracle_events.9.b_tt: "§YPlatform Scale§!: §G+1§!\n§YExecution Discipline§!: §G+1§!\n§YIntegration Debt§!: §R+1§!\n§YTreasury§!: §R-2.50§!\nPolitical Power: §R-5§!"
 USA_oracle_events.9.c: "Decline and maintain enterprise focus"
 USA_oracle_events.9.c_tt: "§YExecution Discipline§!: §G+2§!\n§YEcosystem Openness§!: §G+1§!\nPolitical Power: §G+10§!"

 USA_oracle_events.10.t: "The Austin Headquarters Decision"
 USA_oracle_events.10.d: "Oracle is considering moving its principal executive offices from Redwood City to Austin, formalizing Texas as the center of its corporate leadership. The proposed relocation offers access to regional talent and a business-friendly environment, but it also tests whether the company can preserve its established California workforce and institutional ties. Oracle can commit fully to Austin, retain a dual-center structure, or leave Austin as a satellite operation."
 USA_oracle_events.10.a: "Move the headquarters to Austin"
 USA_oracle_events.10.a_tt: "§YPolicy Access§!: §G+2§!\n§YInfrastructure Depth§!: §G+2§!\n§YTreasury§!: §R-3.00§!\nPolitical Power: §G+15§!\nCosts §R$3.00 billion§! from the Treasury. Policy access and infrastructure depth grow substantially with major capital investment."
 USA_oracle_events.10.b: "Retain Redwood City while expanding Austin"
 USA_oracle_events.10.b_tt: "§YPolicy Access§!: §G+1§!\n§YInfrastructure Depth§!: §G+1§!\n§YExecution Discipline§!: §G+1§!\n§YTreasury§!: §R-1.50§!\nPolitical Power: §G+10§!\nCosts §R$1.50 billion§! from the Treasury. Balanced growth strengthens execution discipline while limiting upfront exposure."
 USA_oracle_events.10.c: "Keep Austin as a satellite campus"
 USA_oracle_events.10.c_tt: "§YExecution Discipline§!: §G+2§!\nPolitical Power: §G+5§!"

 USA_oracle_events.11.t: "Arm Partnership: Cloud on Custom Silicon"
 USA_oracle_events.11.d: "Arm-based chips offer power efficiency advantages for certain cloud workloads, and a partnership could differentiate Oracle's infrastructure offering. Building custom Arm instances promises performance tailoring and margin advantages, but requires deep silicon collaboration. Standard Arm deployments offer faster time-to-market with less differentiation. Avoiding Arm entirely preserves x86 focus but may cede efficiency advantages to competitors."
 USA_oracle_events.11.a: "Develop custom Arm-based cloud instances"
 USA_oracle_events.11.a_tt: "§YPlatform Scale§!: §G+2§!\n§YInfrastructure Depth§!: §G+2§!\n§YPolicy Access§!: §G+1§!\n§YTreasury§!: §R-4.00§!\nPolitical Power: §G+10§!"
 USA_oracle_events.11.b: "Deploy standard Arm reference designs"
 USA_oracle_events.11.b_tt: "§YPlatform Scale§!: §G+1§!\n§YInfrastructure Depth§!: §G+1§!\n§YExecution Discipline§!: §G+1§!\n§YTreasury§!: §R-2.00§!\nPolitical Power: §G+5§!"
 USA_oracle_events.11.c: "Maintain x86-only cloud strategy"
 USA_oracle_events.11.c_tt: "§YExecution Discipline§!: §G+2§!\n§YEcosystem Openness§!: §G+1§!\nPolitical Power: §G+10§!"

 USA_oracle_events.12.t: "OCI Joins OpenAI's Compute Stack"
 USA_oracle_events.12.d: "OpenAI selects Oracle Cloud Infrastructure to add capacity for Microsoft Azure AI workloads, placing OCI inside a major frontier-model training program. Oracle can build dedicated AI superclusters, reserve managed training capacity, or prioritize workload portability through partnerships."
 USA_oracle_events.12.a: "Build dedicated AI superclusters"
 USA_oracle_events.12.a_tt: "§YInfrastructure Depth§!: §G+3§!\n§YPolicy Access§!: §G+2§!\n§YPlatform Scale§!: §G+2§!\n§YTreasury§!: §R-6.00§!\nIf §YIntegration Debt§! is 8 or higher: Stability §R-5%§! and Political Power §R-20§! net. Otherwise: Stability §G+1%§! and Political Power §G+30§! net."
 USA_oracle_events.12.b: "Offer managed training services with reserved capacity"
 USA_oracle_events.12.b_tt: "§YInfrastructure Depth§!: §G+2§!\n§YPolicy Access§!: §G+1§!\n§YExecution Discipline§!: §G+2§!\n§YTreasury§!: §R-3.00§!\nPolitical Power: §G+10§!"
 USA_oracle_events.12.c: "Partner for AI workload portability"
 USA_oracle_events.12.c_tt: "§YExecution Discipline§!: §G+3§!\n§YEcosystem Openness§!: §G+2§!\n§YIntegration Debt§!: §G-2§!\nStability: §G+2%§!\nPolitical Power: §G+15§!"

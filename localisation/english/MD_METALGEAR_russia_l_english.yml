 METALGEAR_russia_category: "Archived Military Contract Review"
 METALGEAR_russia_category_desc: "This original 2000 opening follows an archived weapons contract whose surviving authorizations do not agree. Our review can establish what was transferred and which records were withheld."
 METALGEAR_russia_review: "Review the Archived Weapons Contract"
 METALGEAR_russia_review_desc: "Compare the surviving contract with payment references and equipment manifests. We need a complete record before drawing conclusions about its foreign connections."
 METALGEAR_russia_request: "Request American Procurement Records"
 METALGEAR_russia_request_desc: "Ask the United States to compare its procurement files with our archived contract. A cooperative policy opens one request."
 METALGEAR.30.t: "The Authorization That Survived"
 METALGEAR.30.d: "An archived weapons contract has surfaced with a transfer authorization missing from its official manifest. The payment reference survived in a second office, where it points to a foreign intermediary. We can reconstruct the transfer from what remains."
 METALGEAR.30.a: "Open the contract review."
 METALGEAR.31.t: "The Transfer Behind the Contract"
 METALGEAR.31.d: "Our reviewers have matched the surviving authorization to equipment transferred through a foreign contractor. The paperwork identifies the transaction, but not the authority that kept it outside the official manifest. We can request a comparison abroad or classify what we have found."
 METALGEAR.31.a: "Prepare a cooperative review."
 METALGEAR.31.b: "Classify the findings."
 METALGEAR.34.t: "A Request From Japan"
 METALGEAR.34.d: "Japan has asked to compare its export licenses with our archived weapons contract. A contracting intermediary appears in both files. Sharing the surviving authorizations may clarify where its civilian equipment entered the transfer."
 METALGEAR.34.a: "Share the verified records."
 METALGEAR.34.b: "Decline the exchange."
 METALGEAR.34.c: "Close the interrupted exchange."
 METALGEAR.33.t: "The American Reply"
 METALGEAR.33.d_accepted: "The United States has supplied the requested procurement records. Our reviewers can compare them with the archived contract, and the completed exchange has improved relations between both governments."
 METALGEAR.33.d_declined: "The United States has declined to release the requested records. We retain our national findings, but this exchange will take us no further."
 METALGEAR.33.d_interrupted: "The proposed exchange with the United States has ended without a valid transfer. The missing records establish nothing about who authorized the original contract."
 METALGEAR.33.a: "File the reply."
 METALGEAR.32.t: "The Shadow Moses Request"
 METALGEAR.32.d: "The United States is responding to FOXHOUND's seizure of Shadow Moses and has asked for our archived contract records. The request concerns the weapons program behind the facility, not a deployment of our forces. We must decide whether to release what we hold."
 METALGEAR.32.a: "Supply the verified records."
 METALGEAR.32.b: "Withhold the records."
 METALGEAR.32.c: "Close the interrupted response."
 METALGEAR.35.t: "The Shadow Moses File Closes"
 METALGEAR.35.d_shared: "The United States has supplied the final report it promised after we released our records. We now have an account of how those records were used, and both governments have a reason to preserve the channel."
 METALGEAR.35.d_suppressed: "The United States has withheld the final report it promised after we released our records. The request was useful to Washington; the promised return was not honored. Trust in the exchange has suffered."
 METALGEAR.35.d_interrupted: "The American response has ended without a valid resolution under its original authority. We have received no completed report and can claim no credit for a successful response."
 METALGEAR.35.d: "The American response to Shadow Moses has closed. We have no promised report to add to our national file, and no further decision is required."
 METALGEAR.35.a: "Archive the crisis file."

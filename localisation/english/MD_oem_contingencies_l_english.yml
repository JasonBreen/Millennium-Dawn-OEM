l_english:
 rule_oem_nuclear_collapse: "Strategic Nuclear Collapse (Experimental)"
 rule_oem_dead_man_switch: "Faction Dead Man's Switch (Experimental)"
 oem_contingency_rule_off: "Off"
 oem_contingency_rule_balanced: "Balanced"
 oem_contingency_rule_chaos: "Chaos"
 oem_nuclear_collapse_off_desc: "Use the existing nuclear raids and retaliation rules. No additional national collapse or contingency processing."
 oem_nuclear_collapse_balanced_desc: "Strategic raids offer a response before their devastation and national collapse. A nuclear power with a reserve missile can retaliate against its attacker; unanswered offers expire after seven days with no retaliation. The reserve is abstract: missile range and the nuclear triad are not simulated. Collapse severely reduces production, construction, research and tax income until a year of peaceful reconstruction. Attackers face three years of penalties and worldwide condemnation. Global trade suffers a bounded one-year shock. Requires Götterdämmerung."
 oem_nuclear_collapse_chaos_rule_desc: "As Balanced, with harsher collapse penalties and two years of peaceful reconstruction. A reserve missile represents an abstract strategic response; delivery range and the nuclear triad are not simulated in this experimental version. No territory changes or automatic declarations of war. Requires Götterdämmerung."
 oem_dead_man_switch_off_desc: "No contingency preparation, activation or successor offers. Independent of the nuclear-collapse rule."
 oem_dead_man_switch_balanced_desc: "Eligible faction leaders can pay 200 political power and prepare for 180 days, then pay 100 to arm one contingency. Collapse offers up to three recorded partners a choice to accept political radicalization and a limited research archive. Eight contingencies and 24 recipients maximum; each country receives at most one archive. Research requires prerequisites, industry, payment and 90 days of absorption. Each accepted network gets three crisis capacity, with one crisis per country, four worldwide and at least 90 days between offers. Escalation requires a separate choice and payment; further capacity requires paid support. Peaceful containment removes radicalization and ends recurrence. No forced ideology changes or declarations of war."
 oem_dead_man_switch_chaos_desc: "As Balanced, with stronger successor political pressure, six initial crisis capacity and a 50% research bonus instead of 25%. Preparation, global caps, 90-day crisis cadence, consent choices and peaceful containment still apply. Continued support can sustain recurrence for the campaign, but capacity never replenishes for free."
 oem_contingencies: "Strategic Contingencies"
 oem_contingencies_desc: "Prepare a faction's legacy before defeat, or rebuild after strategic devastation. These experimental systems follow the host's pregame rules."
 oem_dms_prepare: "Prepare a Faction Contingency"
 oem_dms_prepare_desc: "Establish dispersed political networks and protected research archives. Preparation requires continuous leadership and global reach, and ties up civilian resources and research for 180 days. Losing eligibility cancels the work without refunding its political cost."
 oem_dms_eligibility_tt: "Independent faction leader, not capitulated or awaiting a nuclear response; at least 50 factories, five faction members including ourselves, and a surviving member whose capital is on another continent."
 oem_dms_capacity_tt: "Fewer than eight contingencies have been registered worldwide. Each source country can register once, including after restoration."
 oem_dms_prepare_tt: "Prepare for 180 days with +5% consumer goods and -10% research speed. The national spirit is visible to other countries. Arming afterward costs another 100 political power."
 oem_dms_arm_contingency: "Arm the Dead Man's Switch"
 oem_dms_arm_contingency_desc: "Commit the prepared network to act if our country capitulates, is annexed or suffers strategic nuclear collapse. Normal leadership transfers and faction diplomacy do not activate it. The first three unreserved surviving partners in faction order receive our recorded archive; this choice and its worldwide capacity cannot be recycled."
 oem_dms_arm_tt: "Register one permanent contingency and reserve up to three current partners. Record our Construction IV, V or VI knowledge. While armed: +2% consumer goods and -5% research speed. Collapse consumes the contingency before dispatching any offers."
 oem_dms_stand_down: "Stand Down the Contingency"
 oem_dms_stand_down_desc: "Close the network and end its support costs. Its registered capacity and reserved partners remain consumed to prevent repeated preparation from refreshing an archive."
 oem_dms_stand_down_tt: "Permanently disable this contingency. We cannot arm a replacement."
 oem_dms_absorb_archive: "Absorb the Successor Archive"
 oem_dms_absorb_archive_desc: "Assign researchers to the recorded construction archive. After 90 days, receive one bonus for the next unresearched Construction IV, V or VI technology that the fallen leader had already researched when arming. Requires at least ten factories and the previous construction technology. The archive can be used once."
 oem_dms_research_available_tt: "We have the prerequisite for an unresearched construction technology recorded in this archive."
 oem_dms_absorb_archive_tt: "Spend 90 days at -10% research speed to absorb one archive. Balanced grants one 25% research bonus; Chaos grants 50%. No instant technology, ahead-of-time reduction, equipment or production capacity is granted. Containment, capitulation or lost prerequisites can prevent a grant."
 oem_dms_contain_successors: "Reintegrate the Successor Networks"
 oem_dms_contain_successors_desc: "Maintain peace for 180 days to remove successor radicalization and close the remaining archive. Starting a war cancels the work without refunding its cost. Research already completed remains ours."
 oem_dms_support_networks: "Support the Successor Networks"
 oem_dms_support_networks_desc: "Commit civilian resources for 90 days to restore one crisis capacity. This costs 100 political power, uses +5% consumer goods while active, and has a 180-day repeat cooldown. Contained or annexed networks cannot regain capacity. Current capacity: [?global.oem_dms_recipient_capacity^oem_dms_offer_slot|0]."
 oem_dms_support_capacity_tt: "Below the network capacity limit: three in Balanced or six in Chaos. One support project restores one capacity, never an entire pool."
 oem_nuclear_reconstruct: "Rebuild National Institutions"
 oem_nuclear_reconstruct_desc: "Maintain peace for 365 days to remove the national collapse penalty. State fallout and physical damage still require their ordinary recovery. Starting a war cancels reconstruction without a refund."
 oem_nuclear_reconstruct_chaos: "Rebuild the Shattered State"
 oem_nuclear_reconstruct_chaos_desc: "Maintain peace for 730 days to remove the severe national collapse penalty. State fallout and physical damage still require their ordinary recovery. Starting a war cancels reconstruction without a refund."
 oem_dms_preparing: "Dispersed Contingency Preparations"
 oem_dms_preparing_desc: "Research offices and civilian resources are being diverted into a dispersed political contingency. This national spirit ends when preparation finishes or is canceled."
 oem_dms_armed: "Armed Faction Contingency"
 oem_dms_armed_desc: "Protected archives and political networks stand ready to survive national defeat. The Armed Faction Contingency ends when it activates or we use the Stand Down the Contingency decision."
 oem_dms_radicalized: "Radicalized Successor Networks"
 oem_dms_radicalized_desc: "Survivors of a fallen ally's political network press for confrontation and compete with established institutions. The Reintegrate the Successor Networks decision removes this national spirit."
 oem_dms_radicalized_chaos: "Militant Successor Networks"
 oem_dms_radicalized_chaos_desc: "Well-supported successor networks challenge political moderation and encourage renewed confrontation. The Reintegrate the Successor Networks decision removes this national spirit."
 oem_nuclear_collapse: "Strategic Institutional Collapse"
 oem_nuclear_collapse_desc: "Strategic devastation has disrupted the state, its finances and its industrial institutions. The Rebuild National Institutions decision removes this national spirit after a year of peaceful reconstruction."
 oem_nuclear_collapse_chaos: "Catastrophic Institutional Collapse"
 oem_nuclear_collapse_chaos_desc: "The state struggles to coordinate industry, research and public finances after strategic devastation. The Rebuild the Shattered State decision removes this national spirit after two years of peaceful reconstruction."
 oem_nuclear_pariah: "Strategic Nuclear Pariah"
 oem_nuclear_pariah_desc: "Our strategic use of nuclear weapons has brought international isolation and a lasting domestic political burden. This national spirit expires after three years."
 oem_nuclear_trade_shock: "Nuclear Trade Shock"
 oem_nuclear_trade_shock_desc: "Strategic devastation abroad has disrupted production networks and investment. This national spirit expires after one year. Worldwide shocks cannot stack or refresh within the shared one-year cooldown."
 oem_nuclear_condemnation: "Used Strategic Nuclear Weapons"
 oem_dms_archive_bonus: "Recorded Successor Construction Archive"
 oem_contingency.1.t: "Strategic Strike: Final Response"
 oem_contingency.1.d: "A strategic attack by [?oem_nuclear_attacker.GetName] has placed our national institutions in immediate danger. Dispersed command centers are awaiting our final orders."
 oem_contingency.1.a: "Commit the emergency second strike"
 oem_contingency.1.b: "Withhold retaliation and begin recovery"
 oem_nuclear_retaliate_tt: "Commit the reserved missile against the recorded attacker, if it still exists and remains at war with us. Its government gets the same response window. Then resolve our devastation and collapse once. This abstract response does not check missile range."
 oem_nuclear_hold_fire_tt: "Resolve our devastation and collapse without a second strike. Any reserved missile is decommissioned. If we make no choice within seven days, or our country falls earlier, this is the default. A stale event cannot trigger another response."
 oem_contingency.10.t: "A Fallen Faction's Legacy"
 oem_contingency.10.d: "Networks supported by [?oem_dms_fallen_source.GetName] have brought political organizers and protected research records to our government. Their supporters want a continuing role in our national affairs."
 oem_contingency.10.a: "Support the successor networks"
 oem_contingency.10.b: "Reject the legacy and close the archive"
 oem_dms_accept_tt: "Spend 50 political power and accept lasting successor radicalization. This unlocks paid archive absorption and peaceful containment. Our ideology and declarations of war remain our choices."
 oem_dms_decline_tt: "Close this one-time offer and its research archive. Unanswered offers close after fourteen days."
 oem_contingency.21.t: "Successor Networks Demand Confrontation"
 oem_contingency.21.d: "Organizers from the fallen faction have renewed their campaign against [?oem_dms_crisis_enemy.GetName]. They are pressing our government to turn their demands into official policy."
 oem_contingency.21.a: "Review the contingency decisions"
 oem_dms_escalate_crisis: "Authorize a Successor War Goal"
 oem_dms_escalate_crisis_desc: "Authorize a puppet war goal against [?oem_dms_crisis_enemy.GetName]. This is a live crisis decision; old notifications cannot authorize a later confrontation. Declaring war remains a separate choice."
 oem_dms_defuse_crisis: "Defuse the Successor Crisis"
 oem_dms_defuse_crisis_desc: "Close the current confrontation without a war goal. This does not refund the capacity already spent opening it."
 oem_dms_crisis_target_valid_tt: "The recorded aggressor survives and remains outside our wars, war goals, faction, subject relationships and non-aggression pacts. We must be independent and neither country can be capitulated."
 oem_dms_crisis_escalate_tt: "Spend 50 political power to gain a puppet war goal against the recorded aggressor, if it remains a valid target. Declaring war remains a separate choice. Opening this crisis already spent one capacity. Another offer needs remaining capacity and at least 90 days."
 oem_dms_crisis_defuse_tt: "Close this crisis without a war goal. The capacity spent opening it is not refunded. Unanswered crises close after fourteen days. Peaceful reintegration can end the network permanently."

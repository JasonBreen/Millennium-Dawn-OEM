 METALGEAR_pf_sov_trail: "The Missing Technical Record"
 METALGEAR_pf_sov_trail_desc: "An archived weapons transfer has a signed authorization but no matching technical inventory. A broker claims the missing pages were destroyed before the sale. Spend 25 Political Power on a 60-day investigation. The American case reserves one Patriots network commitment; Japan and Russia use their own national investigators. Decide whether to cooperate, retain the evidence nationally, or conceal involvement when the report arrives. Unfinished work closes as unprepared in 2005."

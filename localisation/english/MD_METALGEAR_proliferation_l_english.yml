 METALGEAR.53.a: "Trace the leaks with our partners."
 METALGEAR.53.a_tt: "Immediate: spend 25 Political Power and reserve one network commitment for 60 days. Japan and Russia may accept or refuse records requests. Later: findings affect the Tanker and Big Shell authorizations."
 METALGEAR.53.b: "Keep an independent national inquiry."
 METALGEAR.53.b_tt: "Immediate: spend 25 Political Power and reserve one network commitment for 60 days. Retain the investigation nationally. Later: findings affect the Tanker and Big Shell authorizations."
 METALGEAR.53.c: "Conceal the proliferation file."
 METALGEAR.53.c_tt: "Immediate: close the investigation without usable findings; no capacity is needed. Later: findings affect the Tanker and Big Shell authorizations."
 METALGEAR.53.t: "The Proliferation File"
 METALGEAR.53.d: "[METALGEAR_pf_shadow_record] Technical weapons information has entered private channels. Our opening contractor cases are now relevant to actual proliferation. A national inquiry can establish what escaped; a cooperative inquiry can ask Japan and Russia to compare their own records. Neither government is required to share. [METALGEAR_pf_disclosure_record]"
 METALGEAR.54.a: "Authorize a controlled records transfer."
 METALGEAR.54.a_tt: "Immediate: spend 25 Political Power, supply our national record, and improve mutual relations. Later: this evidence supports the American investigation and both crisis authorizations."
 METALGEAR.54.b: "Refuse the request and close our part of the inquiry."
 METALGEAR.54.b_tt: "Immediate: close this request without a penalty. The USA must proceed without our evidence."
 METALGEAR.54.t: "A Request for Proliferation Records"
 METALGEAR.54.d: "The United States asks for technical records relevant to leaked weapons information after Shadow Moses. Our procurement trail and earlier disclosure history remain ours to assess. This request requires our consent; refusing it closes the exchange. [METALGEAR_pf_disclosure_record]"
 METALGEAR.57.a: "Retain the final report."
 METALGEAR.57.a_tt: "Notification only. This report does not replay records-transfer rewards."
 METALGEAR.57.t: "The Proliferation Inquiry: National Return"
 METALGEAR.57.d: "[METALGEAR_pf_exchange_record] The American file has closed. Our national records and consent decision remain on file. Later incident reports will state what assistance was actually available."

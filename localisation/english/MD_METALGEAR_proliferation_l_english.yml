 METALGEAR.56.a: "Close the inquiry and return its commitment."
 METALGEAR.56.a_tt: "Immediate: finish the inquiry once and release its commitment. A completed inquiry adds 5 exposure and 5 reach per accepted partner. Concealment reduces exposure by 10 and leaves no usable findings. Later: a completed file lowers crisis authorization costs."
 METALGEAR.56.t: "What Escaped the Record"
 METALGEAR.56.d: "[METALGEAR_pf_inquiry_record] The surviving file distinguishes known transfers from gaps that cannot be repaired. Each partner's accepted, refused or interrupted exchange remains recorded separately. No missing record will prevent the next incident from occurring."
 METALGEAR.59.a: "Authorize an independent emergency command."
 METALGEAR.59.a_tt: "Immediate: authorize 50 Political Power and one network commitment for 60 days. Completed procurement evidence or proliferation findings refund 25 Political Power. Each existing cooperating partner at peace refunds another 5 Political Power. Later: independent verification limits network damage."
 METALGEAR.59.b: "Use the existing information channels."
 METALGEAR.59.b_tt: "Immediate: spend 25 Political Power and one network commitment for 60 days; exposure rises by 5. Later: compromised channels damage coherence and reach."
 METALGEAR.59.c: "Use local emergency authority without the network."
 METALGEAR.59.c_tt: "Immediate: begin a 60-day emergency response without Political Power or network capacity. Later: limited information costs public credibility and network coherence."
 METALGEAR.59.t: "The Tanker Incident"
 METALGEAR.59.d: "A tanker in New York waters carries a new Metal Gear prototype under cover of inspection. Solid Snake's attempt to expose it collides with a hijacking and a deliberately misleading public account. The government must decide whose authorization and records it can trust. The sinking and proliferation of weapons information remain part of the incident. [METALGEAR_pf_inquiry_record] [METALGEAR_pf_shadow_record] Normal authorizations require New York and free network capacity; local emergency authority remains available."

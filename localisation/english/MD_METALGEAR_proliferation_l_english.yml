 METALGEAR_pf_usa_trail: "The Contractor Behind the Contract"
 METALGEAR_pf_usa_trail_desc: "A defense subcontractor has billed two agencies for incompatible technical records. Its security annex names a firm absent from the procurement register. Spend 25 Political Power on a 60-day investigation. The American case reserves one Patriots network commitment; Japan and Russia use their own national investigators. Decide whether to cooperate, retain the evidence nationally, or conceal involvement when the report arrives. Unfinished work closes as unprepared in 2005."
 METALGEAR.50.a: "Cooperate on the procurement trail."
 METALGEAR.50.a_tt: "Immediate: Preserve evidence for later cooperation; public exposure rises by 5. Any American commitment returns. This closes the national procurement case."
 METALGEAR.50.b: "Retain the evidence nationally."
 METALGEAR.50.b_tt: "Immediate: Preserve a national dossier and gain 1% stability. Later authorization recognizes the completed investigation. Any American commitment returns. This closes the national procurement case."
 METALGEAR.50.c: "Conceal our involvement."
 METALGEAR.50.c_tt: "Immediate: Reduce network exposure by 5. No usable procurement evidence survives for later cases. Any American commitment returns. This closes the national procurement case."
 METALGEAR.50.t: "The Contractor Behind the Contract"
 METALGEAR.50.d: "A defense subcontractor has billed two agencies for incompatible technical records. Its security annex names a firm absent from the procurement register. Investigators have established the surviving record. The government now determines who may use it. Cooperation opens the record to later inquiries; national retention protects an independent account; concealment trades preparedness for secrecy."
 METALGEAR_pf_jap_trail: "The Unlisted Export"
 METALGEAR_pf_jap_trail_desc: "An exported controller has a civilian license, a military maintenance schedule, and no surviving end-user certificate. The contractor refuses to identify the intermediary. Spend 25 Political Power on a 60-day investigation. The American case reserves one Patriots network commitment; Japan and Russia use their own national investigators. Decide whether to cooperate, retain the evidence nationally, or conceal involvement when the report arrives. Unfinished work closes as unprepared in 2005."

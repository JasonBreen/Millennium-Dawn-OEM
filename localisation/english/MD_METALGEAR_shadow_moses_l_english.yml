 METALGEAR.10.t: "Shadow Moses"
 METALGEAR.10.d: "FOXHOUND has seized the Shadow Moses nuclear weapons disposal facility in Alaska and is threatening a nuclear strike. Solid Snake is being dispatched to infiltrate the site, while our administration must decide how much additional support to authorize and whether to promise participating foreign partners an account of the operation. We can keep that authorization compartmentalized, commit to limited disclosure, or refuse further discretionary support."
 METALGEAR.10.a: "Authorize a compartmentalized response."
 METALGEAR.10.a_tt: "Authorizes the response for §R25§! Political Power if our national review has finished, or §R50§! otherwise. The aftermath follows in §Y30 days§!; no final report is promised to foreign partners."
 METALGEAR.10.b: "Authorize the response and promise disclosure."
 METALGEAR.10.b_tt: "Authorizes the response for §R25§! Political Power if our national review has finished, or §R50§! otherwise. The aftermath follows in §Y30 days§!, when we must decide whether to honor the report promised to participating foreign partners."
 METALGEAR.10.c: "Refuse a new authorization."
 METALGEAR.10.c_tt: "Adds no Political Power cost. The crisis still reaches its aftermath in §Y30 days§!, with the greater Stability loss of an unsupported response."
 METALGEAR.10.d_option: "Close a response outside our authority."
 METALGEAR_shadow_moses_disclosure: "Shadow Moses Disclosure Honored"
 METALGEAR.12.t: "Shadow Moses: After Action"
 METALGEAR.12.d_prepared: "Solid Snake's mission has ended the FOXHOUND seizure and destroyed Metal Gear REX. Our earlier review gave the authorized response a usable chain of records, though the incident has still shaken confidence in government. The remaining question is what we will tell the governments that supplied their files."
 METALGEAR.12.d_unsupported: "Solid Snake's mission has ended the FOXHOUND seizure and destroyed Metal Gear REX. Our response lacked completed preparation or a new authorization, leaving more of the incident for the government to explain afterward. We must close the file and settle any disclosure commitment."
 METALGEAR.12.d_interrupted: "We no longer hold the authority under which this response began. The original crisis file cannot certify a completed American operation or promise a report on its outcome. It closes as interrupted."
 METALGEAR.12.a: "Close the file and honor our commitments."
 METALGEAR.12.a_tt: "The aftermath has already cost §R1%§! Stability with completed preparation and an authorized response, or §R2%§! otherwise. If we promised disclosure, each participating partner still at peace with us gains §G20§! opinion of us, and we gain §G20§! opinion of it."
 METALGEAR.12.b: "Withhold the promised report."
 METALGEAR.12.b_tt: "Closes the file without honoring disclosure. Each participating partner still at peace with us loses §R10§! opinion of us, and we lose §R10§! opinion of it. The aftermath's Stability loss remains."
 METALGEAR.12.c: "Archive the interrupted response."
 METALGEAR.13.t: "Incident at an Alaska Weapons Facility"
 METALGEAR.13.d: "The United States reports that the armed seizure of a nuclear weapons disposal facility in Alaska has ended. Accounts of the facility's work remain incomplete, and foreign governments are asking what their own contracts and export records can establish. Washington's next explanations may matter as much as its first statement."
 METALGEAR.13.a: "Watch the American account."
 METALGEAR.13.b: "Prepare our public account."

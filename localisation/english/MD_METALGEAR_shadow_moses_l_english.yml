l_english:
 METALGEAR.10.t: "Shadow Moses"
 METALGEAR.10.d: "FOXHOUND, a special forces unit under our oversight, has seized the nuclear weapons disposal facility on Shadow Moses Island in Alaska, and with it Metal Gear REX, the prototype tested there. They demand the remains of a soldier long dead and threaten a nuclear launch, and Washington is sending a lone operative in. All three of our nodes are exposed, and we can protect one of them first."
 METALGEAR.10.a: "Shield the weapons program"
 METALGEAR.10.a_tt: "Our first priority is the §Yweapons program§!. Holds §Yone§! commitment until the incident closes, or costs §R10§! coherence if none is free."
 METALGEAR.10.b: "Contain what leaks"
 METALGEAR.10.b_tt: "Our first priority is the §Ystory§!. Holds §Yone§! commitment until the incident closes, or costs §R10§! coherence if none is free."
 METALGEAR.10.c: "Back the official response"
 METALGEAR.10.c_tt: "Our first priority is the §Yresponse§!. Costs §R$2B§!, and holds §Yone§! commitment until the incident closes, or costs §R10§! coherence if none is free."
 METALGEAR.11.t: "Shadow Moses: A Complication"
 METALGEAR.11.d: "One of the intermediaries inside the facility is reporting less than he knows, and what he does report does not match what the response is finding. Our priority may already be slipping out of reach. We can commit more, cut the objective loose, or hold the course and trust it."
 METALGEAR.11.a: "Commit a second line"
 METALGEAR.11.a_tt: "Also covers the §Ynext objective§!. Holds another commitment until the incident closes, or costs §R10§! coherence if none is free."
 METALGEAR.11.b: "Cut the objective loose"
 METALGEAR.11.b_tt: "Abandons our first priority and returns every commitment §Gnow§!. The wider network gains §G5§! coherence and §G5§! less exposure."
 METALGEAR.11.c: "Hold the course"
 METALGEAR.11.c_tt: "Nothing more is committed. There is a §Y50%§! chance the complication costs us our first priority."
 METALGEAR.12.t: "Shadow Moses: After Action"
 METALGEAR.12.d_held: "The facility has been retaken and the prototype destroyed. The rebellion's leader is dead. Most of what we needed to keep, we kept.\n\n[METALGEAR_sm_record_program][METALGEAR_sm_record_story][METALGEAR_sm_record_response][METALGEAR_sm_record_complication]"
 METALGEAR.12.d_mixed: "The facility has been retaken and the prototype destroyed. The rebellion's leader is dead. We held one line of three.\n\n[METALGEAR_sm_record_program][METALGEAR_sm_record_story][METALGEAR_sm_record_response][METALGEAR_sm_record_complication]"
 METALGEAR.12.d_lost: "The facility has been retaken and the prototype destroyed. The rebellion's leader is dead. Nothing we tried to protect came through intact.\n\n[METALGEAR_sm_record_program][METALGEAR_sm_record_story][METALGEAR_sm_record_response][METALGEAR_sm_record_complication]"
 METALGEAR.12.a: "Read the record"
 METALGEAR.12.a_tt: "§YWeapons program§!: kept, reach §G+5§!; or lost, reach §R-5§! and procurement worsens.\n§YStory§!: held, exposure §R+10§!; or broken, exposure §R+25§! and §R-2%§! stability.\n§YResponse§!: held, coherence §G+5§! and oversight improves; or failed, coherence §R-10§! and oversight worsens. Secure oversight before the incident holds the response on its own.\nEvery commitment returns, and one follow-on decision opens in §YThe Patriots§!."
 METALGEAR.13.t: "Incident at an Alaska Weapons Facility"
 METALGEAR.13.d_held: "The United States says a training exercise at a nuclear weapons disposal facility in Alaska ended in an accident, now under control. Officials have declined to say more, and nobody has asked twice."
 METALGEAR.13.d_broke: "Reports from Alaska describe a special forces unit seizing a nuclear weapons disposal facility and a secret weapon nobody admits building. Washington's account changes by the day, and the questions are no longer only about Alaska."
 METALGEAR.13.a: "Strange news from Alaska"
 METALGEAR.13.b: "Let them wonder"
 METALGEAR_sm_record_program_kept: "§YWeapons program§!: §Gkept§!. The design data stays inside the network."
 METALGEAR_sm_record_program_lost: "§YWeapons program§!: §Rlost§!. The design data is out of our hands."
 METALGEAR_sm_record_story_held: "\n§YStory§!: §Gheld§!. The world was told about an exercise that went wrong."
 METALGEAR_sm_record_story_broke: "\n§YStory§!: §Rbroken§!. The press has a rogue unit and a secret weapon."
 METALGEAR_sm_record_response_held: "\n§YResponse§!: §Gheld§!. Oversight of special operations comes out stronger."
 METALGEAR_sm_record_response_failed: "\n§YResponse§!: §Rfailed§!. Oversight of special operations comes out weaker."
 METALGEAR_sm_record_complication_bit: "\nThe intermediary's own game cost us our first priority."

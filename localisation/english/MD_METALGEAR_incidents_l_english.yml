 METALGEAR.62.b: "Restrict the final report."
 METALGEAR.62.b_tt: "Immediate: release the commitment. Independent verification loses 5 coherence; compromised channels lose 10 coherence and reach; emergency-only response loses 10 coherence and 2% stability. Restriction adds 5 exposure and preserves no public credibility benefit."
 METALGEAR.62.t: "Big Shell: Emergency Powers and the Record"
 METALGEAR.62.d: "The tactical incident has ended. [METALGEAR_pf_shell_outcome] The surviving record contains evidence of manipulated information and competing chains of authority. Our government can publish a controlled account or restrict it. [METALGEAR_pf_inquiry_record] These choices settle political and network consequences; they do not change who carried out the tactical operation."
 METALGEAR.63.a: "Compare the report with our national records."
 METALGEAR.63.a_tt: "Notification only. National case results and the separate Tanker and Big Shell records remain available in the category description."
 METALGEAR.63.t: "Incident Aftermath: The National Record"
 METALGEAR.63.d: "[METALGEAR_pf_tanker_outcome] [METALGEAR_pf_shell_outcome] [METALGEAR_pf_exchange_record] The American response and disclosure decisions are on record. Our consent was assessed separately; a refused or interrupted transfer has not been treated as cooperation. [METALGEAR_pf_disclosure_record]"
 METALGEAR.64.a: "Compare the report with our national records."
 METALGEAR.64.a_tt: "Notification only. National case results and the separate Tanker and Big Shell records remain available in the category description."

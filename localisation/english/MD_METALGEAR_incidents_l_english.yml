 METALGEAR.60.a: "Disclose the surviving record."
 METALGEAR.60.a_tt: "Immediate: release the commitment. Independent verification loses 5 coherence; compromised channels lose 10 coherence and reach; emergency-only response loses 10 coherence and 2% stability. Disclosure adds 10 exposure, loses 10 reach, improves cooperating partners' relations and restores 1% stability with a completed proliferation file."
 METALGEAR.60.b: "Restrict the final report."
 METALGEAR.60.b_tt: "Immediate: release the commitment. Independent verification loses 5 coherence; compromised channels lose 10 coherence and reach; emergency-only response loses 10 coherence and 2% stability. Restriction adds 5 exposure and preserves no public credibility benefit."
 METALGEAR.60.t: "Tanker: The Public Account"
 METALGEAR.60.d: "The tactical incident has ended. [METALGEAR_pf_tanker_outcome] The surviving record contains evidence of manipulated information and competing chains of authority. Our government can publish a controlled account or restrict it. [METALGEAR_pf_inquiry_record] These choices settle political and network consequences; they do not change who carried out the tactical operation."
 METALGEAR.61.a: "Authorize an independent emergency command."
 METALGEAR.61.a_tt: "Immediate: authorize 50 Political Power and one network commitment for 60 days. Completed procurement evidence or proliferation findings refund 25 Political Power. Each existing cooperating partner at peace refunds another 5 Political Power. Later: independent verification limits network damage."
 METALGEAR.61.b: "Use the existing information channels."
 METALGEAR.61.b_tt: "Immediate: spend 25 Political Power and one network commitment for 60 days; exposure rises by 5. Later: compromised channels damage coherence and reach."
 METALGEAR.61.c: "Use local emergency authority without the network."
 METALGEAR.61.c_tt: "Immediate: begin a 60-day emergency response without Political Power or network capacity. Later: limited information costs public credibility and network coherence."
 METALGEAR.61.t: "The Big Shell Crisis"
 METALGEAR.61.d: "Big Shell is seized under a cleanup cover story. Hostages, the President, and a compromised information system turn emergency authorization into a political crisis. Raiden's mission, Snake's intervention, Solidus and the failure of the controlling AI remain the tactical story. The government must choose how to operate and what the public will eventually learn. [METALGEAR_pf_inquiry_record] [METALGEAR_pf_shadow_record] Normal authorizations require New York and free network capacity; local emergency authority remains available."

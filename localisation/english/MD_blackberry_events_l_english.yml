 # BlackBerry Corporate History Events
 blackberry_events.1.t: "BlackBerry Goes Mobile"
 blackberry_events.1.d: "Research In Motion has introduced the BlackBerry 5810, its first handheld to fold voice calling into the secure wireless email that already makes the company's devices indispensable to corporate and government users. Co-CEOs Mike Lazaridis and Jim Balsillie are steering the Waterloo firm through the dot-com slump on subscriber growth and the BlackBerry Enterprise Server rather than consumer hype. Ontario's technology cluster is thickening around the company, with Lazaridis endowing the Perimeter Institute and funding new quantum-computing research at the University of Waterloo. The question is whether that momentum should be left to private capital and RIM's own balance sheet, or reinforced by public backing for the region's wireless research base."
 blackberry_events.1.a: "Let RIM scale privately"
 blackberry_events.1.b: "Back Waterloo's wireless cluster"
 blackberry_events.3.t: "The Touchscreen Challenge"
 blackberry_events.3.d: "Apple's iPhone has arrived, placing a full touchscreen and an application-driven interface at the center of the smartphone market and pulling consumer attention away from physical keyboards. Research In Motion, riding record subscriber numbers from the Pearl and the new Curve, sees the device as an unproven consumer toy ill-suited to corporate email or battery life. The company can defend the secure, keyboard-focused enterprise niche that made it dominant, or open BlackBerry to a broader third-party software ecosystem before Apple and Google define the category. RIM's engineers remain confident that their encrypted network and hardware keyboards are still the standard business buyers demand."
 blackberry_events.3.a: "Protect secure enterprise hardware"
 blackberry_events.3.b: "Encourage an application ecosystem"
 blackberry_events.5.t: "RIM Acquires QNX"
 blackberry_events.5.d: "Research In Motion has agreed to acquire QNX Software Systems from Harman International for roughly $200 million, gaining a battle-tested real-time operating system already trusted in cars, medical equipment, and industrial control. The purchase hands RIM a modern software foundation to replace its aging handset platform as iPhone and Android erode its lead. QNX can be pushed toward a next-generation mobile system, the road that will lead to the PlayBook tablet and BlackBerry 10, or broadened into the embedded and automotive markets where its reliability is unmatched. Waterloo now controls one of the most trusted kernels in the industry and must decide where to aim it."
 blackberry_events.5.a: "Build the next handset platform"
 blackberry_events.5.b: "Broaden QNX beyond phones"
 blackberry_events.6.t: "BlackBerry 10's Last Bet"
 blackberry_events.6.d: "Research In Motion has renamed itself BlackBerry and launched BlackBerry 10 alongside the all-touch Z10 and keyboard-equipped Q10, staking its future on the QNX-based platform it has spent three years building. The company is betting that a fast, gesture-driven operating system and its unified BlackBerry Hub can win back users lost to Apple and Samsung. Yet the ecosystem arrives years behind its rivals, developer support is thin, and its most loyal customers remain the enterprise and government buyers who prize security over apps. BlackBerry can commit fully to the BB10 consumer relaunch, or steer resources toward the enterprise-mobility and device-management services that still pay the bills."
 blackberry_events.6.a: "Back the BlackBerry 10 launch"
 blackberry_events.6.b: "Prioritize enterprise services"
 blackberry_events.7.t: "Beyond the Handset"
 blackberry_events.7.d: "BlackBerry has announced it will stop designing smartphones in-house, licensing its brand and secure software to partners such as TCL while its own engineers turn to software and services. Years of losses against the iPhone and Android have ended the era that began with the 5810, and CEO John Chen is rebuilding the company around QNX, enterprise security, and the Good Technology and secure-messaging assets it has acquired. The move keeps the BlackBerry name on hardware without the cost of building it, freeing capital for the software business that now drives revenue. Ottawa must decide whether to back this transition or spend heavily to keep domestic handset engineering alive in Waterloo."
 blackberry_events.7.a: "Support the software transition"
 blackberry_events.7.b: "Keep Canadian handset development"
 blackberry_events.2.t: "BlackBerry Avoids a Shutdown"
 blackberry_events.2.d: "Research In Motion has spent three years fighting NTP, Inc. over patents covering wireless email delivery, and a U.S. federal court now threatens an injunction that could switch off BlackBerry service across the country. Millions of American users depend on the devices, and the Department of Justice has warned that a shutdown would strand government and emergency personnel who carry them. In March, RIM agreed to pay NTP $612.5 million to settle the dispute and lift the threat. Washington's overriding concern is continuity of service for federal users, a measure of how deeply the Canadian device has embedded itself in American institutions."
 blackberry_events.2.a: "Protect continuity for federal users"
 blackberry_events.2.b: "Let the settlement close the case"
 blackberry_events.4.t: "A BlackBerry in the White House"
 blackberry_events.4.d: "President Barack Obama has entered the White House refusing to surrender the BlackBerry that keeps him connected to friends and advisers, forcing the Secret Service and NSA into an unprecedented compromise. The result is a security-hardened handset with strong encryption and a tightly restricted contact list, the first time a sitting president has been allowed a mobile device of his own. The arrangement is a marketing triumph for Research In Motion, cementing BlackBerry as the trusted standard for secure government communication. Federal agencies must now weigh how far to extend mobile access against the record-keeping and counter-intelligence risks it invites."
 blackberry_events.4.a: "Issue the hardened device"
 blackberry_events.4.b: "Separate personal and official communications"


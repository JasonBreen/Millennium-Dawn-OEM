 # BlackBerry Option Effect Tooltips
 blackberry_events.1.a_tt: "Let Research In Motion grow on subscriber revenue and private capital, gaining political power as Waterloo expands on its own. This is the path RIM actually took, its founders personally endowing the region's research institutes."
 blackberry_events.1.b_tt: "Commit public money to Waterloo's wireless research base, spending treasury for a computing research bonus and tying the cluster's growth to state support beyond the private investment that historically drove RIM's rise."
 blackberry_events.2.a_tt: "Make uninterrupted BlackBerry service a federal priority, spending political power for command power and guaranteeing continuity for government users, as Washington did when it pressed the court to spare official devices."
 blackberry_events.2.b_tt: "Leave the dispute to the courts and RIM's $612.5 million settlement, gaining political power by staying out of the case rather than intervening on behalf of federal users."
 blackberry_events.3.a_tt: "Defend the secure, keyboard-driven enterprise devices that made BlackBerry dominant, spending treasury for a computing research bonus. This is the bet RIM actually made, dismissing the iPhone as no threat to its security or battery life."
 blackberry_events.3.b_tt: "Open BlackBerry to outside developers and a broader app ecosystem, spending treasury for an internet-technology research bonus, the consumer-software pivot RIM was historically too slow to make."
 blackberry_events.4.a_tt: "Approve a security-hardened BlackBerry for the President's own use, spending political power for command power, with an added dividend if federal continuity was already secured. This is what actually happened in 2009."
 blackberry_events.4.b_tt: "Keep official and personal communication strictly separated instead of issuing a presidential device, gaining political power and avoiding the counter-intelligence exposure of a networked handset in the Oval Office."
 blackberry_events.5.a_tt: "Aim QNX at a next-generation smartphone and tablet platform, spending treasury for a computing research bonus, the choice RIM made on the road to the PlayBook and BlackBerry 10."
 blackberry_events.5.b_tt: "Grow QNX in automotive, medical, and industrial embedded systems, spending treasury for an industry research bonus. RIM under-prioritized this market, yet it became QNX's most enduring success."
 blackberry_events.6.a_tt: "Go all-in on the BB10 consumer relaunch, spending treasury for an internet-technology research bonus and committing to the new platform, as BlackBerry did in 2013."
 blackberry_events.6.b_tt: "Steer resources toward enterprise mobility and device management instead of the consumer launch, spending less treasury and gaining political power, the software-services focus BlackBerry embraced only after BB10 disappointed."
 blackberry_events.7.a_tt: "Back BlackBerry's pivot to software, security, and licensed hardware, gaining political power and an internet-technology research bonus, with a bonus if enterprise services were already prioritized. This is the transition the company actually chose in 2016."
 blackberry_events.7.b_tt: "Fund continued in-house handset engineering in Waterloo, spending treasury for a computing research bonus to keep domestic phone development alive, the costly counterfactual to abandoning hardware."

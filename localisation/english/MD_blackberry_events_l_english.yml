 # BlackBerry Corporate History Events
 blackberry_events.1.t: "BlackBerry Goes Mobile"
 blackberry_events.1.d: "Research In Motion has introduced the BlackBerry 5810, combining voice calling with the secure wireless email valued by corporate and government users. Subscriber growth and the BlackBerry Enterprise Server are carrying the Waterloo firm through the dot-com slump. Ottawa must decide whether its research cluster needs public backing or should continue relying on private capital."
 blackberry_events.1.a: "Let RIM scale privately"
 blackberry_events.1.b: "Back Waterloo's wireless cluster"
 blackberry_events.3.t: "The Touchscreen Challenge"
 blackberry_events.3.d: "Apple's iPhone has put touchscreens and third-party applications at the center of the smartphone market. Research In Motion can defend the secure, keyboard-focused enterprise devices behind its success or open BlackBerry to a broader software market before Apple and Google set the standard."
 blackberry_events.3.a: "Protect secure enterprise hardware"
 blackberry_events.3.b: "Encourage an application ecosystem"
 blackberry_events.5.t: "RIM Acquires QNX"
 blackberry_events.5.d: "Research In Motion has agreed to acquire QNX Software Systems for roughly $200 million, gaining a real-time operating system used in cars, medical equipment, and industrial control. QNX can replace BlackBerry's aging handset software or expand further into embedded and automotive markets."
 blackberry_events.5.a: "Build the next handset platform"
 blackberry_events.5.b: "Broaden QNX beyond phones"
 blackberry_events.6.t: "BlackBerry 10's Last Bet"
 blackberry_events.6.d: "Research In Motion has renamed itself BlackBerry and launched BlackBerry 10 with the Z10 and Q10. The QNX-based system arrives years behind its rivals, forcing a choice between a consumer relaunch and the enterprise mobility and device-management services still valued by government and business customers."
 blackberry_events.6.a: "Back the BlackBerry 10 launch"
 blackberry_events.6.b: "Prioritize enterprise services"
 blackberry_events.7.t: "Beyond the Handset"
 blackberry_events.7.d: "BlackBerry will stop designing smartphones in-house and license its brand and secure software to hardware partners. The company is rebuilding around QNX, enterprise security, and software services, leaving Ottawa to decide whether to support that transition or fund continued handset engineering in Waterloo."
 blackberry_events.7.a: "Support the software transition"
 blackberry_events.7.b: "Keep Canadian handset development"
 blackberry_events.2.t: "BlackBerry Avoids a Shutdown"
 blackberry_events.2.d: "A patent dispute with NTP threatens an injunction against BlackBerry service in the United States. The Department of Justice has warned that a shutdown would affect government and emergency personnel, while RIM can end the threat through a $612.5 million settlement."
 blackberry_events.2.a: "Protect continuity for federal users"
 blackberry_events.2.b: "Let the settlement close the case"
 blackberry_events.4.t: "A BlackBerry in the White House"
 blackberry_events.4.d: "President Barack Obama's wish to retain a BlackBerry has forced the Secret Service and NSA to prepare a security-hardened handset with a restricted contact list. Federal agencies must balance wider mobile access against record-keeping and counter-intelligence risks."
 blackberry_events.4.a: "Issue the hardened device"
 blackberry_events.4.b: "Separate personal and official communications"


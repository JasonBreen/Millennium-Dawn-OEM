l_english:
 FBC.50.a: "Monitor the lake and preserve the records."
 FBC.50.a_tt: "Immediate: spend 25 Political Power. After 60 days: review the evidence. Completed preparation improves the 2010 response."
 FBC.50.b: "Send a Bureau field team."
 FBC.50.b_tt: "Immediate: spend 50 Political Power and reserve one response team. After 60 days: review the evidence. Completed preparation improves the 2010 response."
 FBC.50.c: "Suppress the file."
 FBC.50.c_tt: "Immediate: exposure falls by 5. No evidence is preserved; the later crisis begins without this preparation."
 FBC.50.t: "The Bright Falls File"
 FBC.50.d: "The Bureau has found incompatible copies of Cauldron Lake records: a missing-person entry signed before its subject arrived, witnesses who remember different search parties, and photographs with irreconcilable dates. These are new government findings, not a solved account of what lies beneath the lake. Local reporting could preserve the discrepancies. A field team could recover the original material, but the Bureau has only two teams for all its American and Polar Desk cases."
 FBC.51.a: "Archive the findings and release the team."
 FBC.51.a_tt: "Immediate: containment integrity and exposure each rise by 5; any team returns. Later: preserved evidence improves civilian protection and evidence recovery in 2010."
 FBC.51.t: "Cauldron Lake: Conflicting Originals"
 FBC.51.d: "The review confirms that the discrepancies survive comparison with the original records. Witness statements cannot be reduced to a single account. [FBC_bf_protocol_text] The Bureau can now retain the evidence and establish a protocol for protecting civilians and separating unverified narrative material from operational instructions."
 FBC.52.a: "Authorize a field response."
 FBC.52.a_tt: "Immediate: authorize 50 Political Power and one team for 60 days; preserved evidence refunds 25 Political Power. Later: prepared recovery can secure the perimeter."
 FBC.52.b: "Establish a perimeter operation."
 FBC.52.b_tt: "Immediate: spend 50 Political Power on a 60-day perimeter operation without a response team. Later: continuing surveillance remains necessary."
 FBC.52.c: "Disavow Bureau involvement."
 FBC.52.c_tt: "Immediate: no authorization cost. Later: failed containment costs 10 integrity, adds 10 exposure, and disrupts Washington for 180 days."
 FBC.52.t: "Bright Falls, 2010"
 FBC.52.d: "Writer Alan Wake has disappeared near Cauldron Lake. Reports describe a Dark Presence, missing residents, and written material that appears to anticipate events. [FBC_bf_evidence_text] The Bureau must protect civilians and recover evidence without accepting the compromised record as an operational plan. Wake's fate is outside the government's control. A perimeter operation remains available when both response teams are occupied."
 FBC.53.a: "Record the aftermath and release the response team."
 FBC.53.a_tt: "Immediate: settle the recorded response and return any team exactly once. Prepared field response: +10 integrity, +5 exposure (0 with the earlier field handling protocol) and one 25% electronics research bonus. Surveillance: +5 integrity and +10 exposure (+5 after an unprepared field response). Disavowal: -10 integrity, +10 exposure, -2% stability and 180 days of local disruption."
 FBC.53.t: "The Lake Remains"
 FBC.53.d: "[FBC_bf_outcome_text] Alan Wake remains missing. The Dark Presence has been driven back beneath the lake, but the danger has not ended. The government's case concerns its response, surviving evidence, and responsibility for the perimeter. It cannot declare the lake harmless."
 FBC_bf_review_cooldown: "The next local records review is on cooldown"
 FBC_bf_team_assigned_tt: "A response team is assigned to Bright Falls"
 FBC_bf_records_review: "Review the local Bright Falls records"
 FBC_bf_records_review_desc: "Spend 25 Political Power on a 60-day review. Preserve evidence if none survives and gain 5 containment integrity on completion. This reserves no response team. The next review opens 180 days after completion; the 2010 crisis cancels unfinished work."
 FBC_bf_withdraw_team: "Withdraw the Bright Falls team"
 FBC_bf_withdraw_team_desc: "Return the assigned response team. Unfinished early work closes without evidence. A crisis field response becomes a continuing perimeter burden. Exposure rises by 5."
 FBC_bf_local_disruption: "Bright Falls Disruption"
 FBC_bf_recovered_records: "Cauldron Lake Evidence"
 FBC_bf_paused: "Site lost. Work pauses; teams return. Regain Washington to resume."
 FBC_bf_phase_1: "Intake: choose monitoring, a team, or suppression."
 FBC_bf_phase_2: "Early investigation running for 60 days."
 FBC_bf_phase_3: "Evidence review: answer the report to release any team."
 FBC_bf_phase_4: "Preparation closed. Local records reviews are available until 2010."
 FBC_bf_phase_5: "2010 crisis: choose field response, perimeter, or disavowal."
 FBC_bf_phase_6: "Crisis response running for 60 days."
 FBC_bf_phase_7: "Aftermath awaiting your conclusion."
 FBC_bf_phase_8: "Case closed. The lake remains dangerous. [FBC_bf_outcome_text]"
 FBC_bf_phase_9: "Government disappeared. Case closed."
 FBC_bf_dormant: "Awaiting the Bureau's records review."
 FBC_bf_team_reserved: "One of two response teams is committed."
 FBC_bf_team_free: "No response team committed."
 FBC_bf_evidence_field: "Prepared: original material and a field handling protocol survive."
 FBC_bf_evidence_local: "Prepared: local reporting preserves evidence and a witness protocol."
 FBC_bf_evidence_none: "Unprepared: no completed evidence review survives."
 FBC_bf_protocol_field: "The field team has recovered original material under a controlled handling protocol."
 FBC_bf_protocol_monitor: "Local reporting has preserved witness accounts without deploying a team."
 FBC_bf_outcome_failed: "Disavowal has left local authorities without a workable containment response."
 FBC_bf_outcome_secured: "Prepared field teams have protected civilians, recovered evidence, and established a secured perimeter."
 FBC_bf_outcome_watch: "The perimeter has limited civilian access, but incomplete recovery leaves a continuing surveillance burden."

l_english:
 METALGEAR_steer_procurement: "Steer Defense Procurement"
 METALGEAR_steer_procurement_desc: "Route the next round of defense contracts to companies the network trusts. The program offices will never learn who chose the winners."
 METALGEAR_manage_news_cycle: "Manage the News Cycle"
 METALGEAR_manage_news_cycle_desc: "Plant stories, time the leaks and give the networks something else to cover. For a few weeks the public mood is ours to shape."
 METALGEAR_influence_foreign_desk: "Influence [FROM.GetName]'s Foreign Desk"
 METALGEAR_influence_foreign_desk_desc: "Place friendly analysts and editors around [FROM.GetName]'s foreign ministry and press. In two months our reading of the world will be theirs."
 METALGEAR_operation_start_tt: "Holds §Yone§! commitment for §Ytwo months§!.\nExposure: §R+3§!, or §R+6§! if the node it runs through is really compromised."
 METALGEAR_operation_end_tt: "The commitment returns."
 METALGEAR_procurement_bonus: "Steered Procurement"
 METALGEAR_patriots: "The Patriots"
 METALGEAR_patriots_desc: "Coherence §Y[?global.METALGEAR_coherence|0]§!, reach §Y[?global.METALGEAR_reach|0]§!, exposure §Y[?global.METALGEAR_exposure|0]§!.\nPolitical power rises with coherence above 50 and falls below it. Stability rises with reach and falls with exposure, and reach sharpens civilian intelligence. Exposure above 60 forces a scandal."
 METALGEAR_bury_story_tt: "Coherence: §R-10§!\nExposure: §G-20§!"
 METALGEAR_let_story_break_tt: "Coherence: §R-25§!\nReach: §R-15§!\nExposure falls to §G10§!."
 METALGEAR.40.t: "The Paper Trail Surfaces"
 METALGEAR.40.d: "A congressional staffer has matched classified contracts to companies that exist only on paper, and a Washington reporter has the same documents. The story runs this week unless someone stops it. Either the network spends what it has to bury it, or it takes the hit."
 METALGEAR.40.a: "Bury the story."
 METALGEAR.40.b: "Let it break."

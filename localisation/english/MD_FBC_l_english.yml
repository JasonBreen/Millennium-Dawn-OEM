l_english:
 FBC_bureau_category: "Federal Bureau of Control"
 FBC_bureau_category_desc: "§YResponse teams free§! [?FBC_response_capacity|0] of 2   §YContainment integrity§! [?FBC_containment_integrity|0]   §YExposure§! [?FBC_exposure|0]\n\n§YThe Unscheduled Floor§!, New York: [FBC_floor_phase_name]. [FBC_floor_team]\n§YThe Sealed Wing§!, Washington: [FBC_wing_phase_name]. [FBC_wing_team]\n§YToluca County§!, Maine: [FBC_sh_case_status] [FBC_sh_fog_band]"
 FBC_phase_reported: "reported, awaiting a decision"
 FBC_phase_unassigned: "on file, no team assigned"
 FBC_phase_investigating: "§Yunder investigation§!"
 FBC_phase_contained: "§Yin active containment§!"
 FBC_phase_archived: "§Garchived§!"
 FBC_phase_burden: "§Ra continuing burden§!"
 FBC_phase_suspended: "§Rsuspended§!, the site is out of reach"
 FBC_phase_reopenable: "§Ysuspended§!, the site is back in our hands and the case can be reopened"
 FBC_team_committed: "A team is committed."
 FBC_team_none: "No team is committed."
 FBC_reopen_floor: "Reopen the Unscheduled Floor"
 FBC_reopen_floor_desc: "New York is ours again, and so is the floor nobody built."
 FBC_reopen_floor_tt: "The case returns to intake with everything we already learned. Its report arrives in §Y7 days§!."
 FBC_reopen_wing: "Reopen the Sealed Wing"
 FBC_reopen_wing_desc: "Washington is ours again, and the wing is still sealed."
 FBC_reopen_wing_tt: "The case returns to intake with everything we already learned. Its report arrives in §Y7 days§!."
 FBC_bureau: "Federal Bureau of Control"
 FBC_bureau_desc: "The Bureau investigates and contains paranormal incidents inside the United States. Research rises with what the open cases have taught it. Stability rises with containment and falls as exposure spreads."
 FBC_reinforce_containment: "Reinforce Bureau Containment"
 FBC_reinforce_containment_desc: "Put more of the Bureau's ordinary budget into locks, logs, and the people who watch them.\n\nContainment integrity: §Y[?FBC_containment_integrity|0]§!\nExposure: §Y[?FBC_exposure|0]§!"
 FBC_reinforce_containment_tt: "Containment integrity rises by §G10§! and exposure falls by up to §G3§!."
 FBC_reinforce_containment_available_tt: "Containment integrity is below §Y90§!."
 FBC_fund_floor_research_available_tt: "The Unscheduled Floor is an open investigation or containment case."
 FBC_fund_wing_research_available_tt: "The Sealed Wing is an open investigation or containment case."
 FBC_stand_down_floor_available_tt: "A team is committed to the Unscheduled Floor."
 FBC_stand_down_wing_available_tt: "A team is committed to the Sealed Wing."
 FBC_request_eu_assistance_available_tt: "The European desk still has a team to send."
 FBC_fund_floor_research: "Fund the Unscheduled Floor"
 FBC_fund_floor_research_desc: "Pay for another careful look at the floor that does not appear on the building plan. The notes help the Bureau. They also have to be stored somewhere."
 FBC_fund_floor_research_tt: "Knowledge of the floor rises by §G6§!. Exposure rises by §R3§!."
 FBC_fund_wing_research: "Fund the Sealed Wing"
 FBC_fund_wing_research_desc: "Pay the Washington team to keep writing down what the sealed wing does when the building is closed."
 FBC_fund_wing_research_tt: "Knowledge of the wing rises by §G6§!. Exposure rises by §R3§!."
 FBC_stand_down_floor: "Stand Down the New York Team"
 FBC_stand_down_floor_desc: "Send the New York team home. If the floor is still an open case, the Bureau accepts a worse file and gets the commitment back."
 FBC_stand_down_floor_tt: "Releases the New York commitment. An open case becomes a continuing burden: exposure rises by §R6§! and containment integrity falls by up to §R5§!."
 FBC_stand_down_wing: "Stand Down the Washington Team"
 FBC_stand_down_wing_desc: "Send the Washington team home. If the wing is still an open case, the Bureau accepts a worse file and gets the commitment back."
 FBC_stand_down_wing_tt: "Releases the Washington commitment. An open case becomes a continuing burden: exposure rises by §R6§! and containment integrity falls by up to §R5§!."
 FBC.1.t: "The Unscheduled Floor"
 FBC.1.d: "A municipal office in New York reports a floor that is not on the approved plan. The stair count changes depending on who is asked. The Bureau has two teams it can commit, and another case will want one of them."
 FBC.1.a: "Send an investigation team."
 FBC.1.a_tt: "Commits one response team for the New York case. Findings arrive later."
 FBC.1.b: "Lock the building and contain it in place."
 FBC.1.b_tt: "Commits one response team, costs §R1%§! stability, and lowers exposure by up to §G3§!. The building stays disrupted for §Y120§! days."
 FBC.1.c: "File the report and wait."
 FBC.1.c_tt: "No team is committed. Exposure rises by §R8§!. The file comes back thinner, and later."
 FBC.1.e: "New York is outside our jurisdiction."
 FBC.1.e_tt: "The case is recorded as out of reach. No team is committed."
 FBC.2.t: "What the Floor Showed"
 FBC.2.d: "The New York file is back. Some of the measurements repeat. Some of them do not. Knowledge of the floor is §Y[?FBC_floor_knowledge|0]§!. Response teams still free: §Y[?FBC_response_capacity|0]§!."
 FBC.2.a: "Lock the building."
 FBC.2.a_tt: "Commits a team if one is not already committed. The case moves into active containment."
 FBC.2.b: "Keep the team on the research."
 FBC.2.b_tt: "Most of the time, knowledge rises by §G10§! and exposure rises by §R3§!. About one time in five, the work slips: exposure rises by §R10§! and containment integrity falls by §R10§!."
 FBC.2.c: "Archive a stable procedure."
 FBC.2.c_tt: "Requires knowledge of at least §Y15§!. Releases the team. Containment integrity rises by §G5§! and exposure falls by up to §G4§!."
 FBC.2.f: "We no longer hold the building."
 FBC.2.f_tt: "The case is suspended and any committed team is released."
 FBC.2.e: "Close it with a thin file."
 FBC.2.e_tt: "Releases any committed team. The case becomes a continuing burden and exposure rises by §R4§!."
 FBC.3.t: "After-Action, New York"
 FBC.3.d: "The New York team has a procedure, or it has a stack of contradictions and a building it still does not control. Filing the report is what releases the commitment."
 FBC.3.a: "File the report."
 FBC.3.a_tt: "Releases the New York team. A contained site, or knowledge of at least §Y15§!, is archived: containment integrity rises by §G5§! and exposure falls by up to §G4§!. Otherwise the case stays a burden. Containment integrity falls by §R8§! and exposure rises by §R6§!."
 FBC.3.b: "New York is no longer ours."
 FBC.3.b_tt: "Releases the team and suspends the case. No containment credit."
 FBC.4.t: "The Sealed Wing"
 FBC.4.d: "A federal annex in Washington has a wing that staff can enter only when the rest of the building is empty. The New York case may already have a team. This one needs its own decision."
 FBC.4.a: "Investigate the wing."
 FBC.4.a_tt: "Commits one response team. The Washington result arrives later and does not change the New York case."
 FBC.4.b: "Leave it with the building security."
 FBC.4.b_tt: "No team is committed. Exposure rises by §R6§! and the case stays a burden."
 FBC.4.c: "Lock the wing down."
 FBC.4.c_tt: "Commits one response team and costs §R1%§! stability. A team stays on the wing until the Bureau archives it or stands the team down."
 FBC.4.e: "Washington is outside our jurisdiction."
 FBC.4.e_tt: "The case is recorded as out of reach. No team is committed."
 FBC.5.t: "The Wing, Written Down"
 FBC.5.d: "The Washington notes describe a room that is present on some nights and absent on the floor plan every morning. Knowledge of the wing is §Y[?FBC_wing_knowledge|0]§!."
 FBC.5.a: "Archive it and free the team."
 FBC.5.a_tt: "Releases the Washington team. Containment integrity rises by §G4§! and exposure falls by up to §G2§!."
 FBC.5.b: "Keep a team on the wing."
 FBC.5.b_tt: "The team stays committed. Containment integrity rises by §G8§! and exposure falls by up to §G3§!. Another report arrives in §Y35 days§!."
 FBC.5.c: "Washington is no longer ours."
 FBC.5.c_tt: "Releases the team and suspends the case. No containment credit."
 FBC.6.t: "Containment Breach"
 FBC.6.d: "A case the Bureau thought it was holding has stopped behaving like a file. Containment integrity is §Y[?FBC_containment_integrity|0]§!. Exposure is §Y[?FBC_exposure|0]§!."
 FBC.6.a: "Emergency lockdown."
 FBC.6.a_tt: "Costs §R50§! political power and §R2%§! stability. Containment integrity rises by §G15§! and exposure falls by up to §G5§!."
 FBC.6.b: "Let the breach stand in the record."
 FBC.6.b_tt: "Exposure rises by §R8§! and containment integrity falls by §R5§!."
 FBC.6.c: "Pull the Washington team onto the breach."
 FBC.6.c_tt: "Releases the Washington commitment and marks that case as a burden. Containment integrity rises by §G10§!."

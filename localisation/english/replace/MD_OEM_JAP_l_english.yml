l_english:
 JAP_semiconductor: "Semiconductors and Electronic Components"
 JAP_semiconductor_desc: "Semiconductors and electronic components are strategic fields that underpin every industry. By leveraging our strengths in areas such as materials, manufacturing equipment, and components, and by strengthening R&D and supply capacity, we will support Japan's industrial foundation and technological competitiveness."
 JAP_games_are_fun: "Games Are Fun!"
 JAP_games_are_fun_desc: "Games are one of Japan's entertainment cultures that the country can proudly present to the world. Nintendo has brought play to a wide range of generations through home consoles and character IP, while Sony (PlayStation) has built a global market centered on hardware and online services. By linking creativity with technology, we will further develop this field as a pillar that supports domestic industry and Japan's ability to communicate and compete globally."
 JAP_chinese_agression_five_tt: "§Y[CHI.GetFlag][CHI.GetAdjectiveCap] Aggression§! at least §R5§!"
 JAP_chinese_agression_ten_tt: "§Y[CHI.GetFlag][CHI.GetAdjectiveCap] Aggression§! at least §R10§!"
 JAP_chinese_agression_twelve_tt: "§Y[CHI.GetFlag][CHI.GetAdjectiveCap] Aggression§! at least §R12§!"
 JAP_chinese_agression_fourteen_tt: "§Y[CHI.GetFlag][CHI.GetAdjectiveCap] Aggression§! at least §R14§!"
 JAP_chinese_agression_sixteen_tt: "§Y[CHI.GetFlag][CHI.GetAdjectiveCap] Aggression§! at least §R16§!"
 JAP_chinese_agression_eighteen_tt: "§Y[CHI.GetFlag][CHI.GetAdjectiveCap] Aggression§! at least §R18§!"
 JAP_chinese_agression_twenty_tt: "§Y[CHI.GetFlag][CHI.GetAdjectiveCap] Aggression§! at least §R20§!"
 JAP_sony_events.1.t: "The PlayStation 2 Launch"
 JAP_sony_events.1.d: "PlayStation 2 has launched in Japan, pairing a new console generation with DVD playback and the prospect of networked entertainment. We must decide whether this becomes the center of Sony's strategy or remains one product within a broader electronics portfolio."
 JAP_sony_events.1.a: "Build the PlayStation platform"
 JAP_sony_events.1.b: "Keep electronics at the center"
 JAP_sony_events.1.platform_computing_bonus: "PlayStation Platform Engineering"
 JAP_sony_events.1.platform_internet_bonus: "PlayStation Network Services"
 JAP_sony_events.1.electronics_industry_bonus: "Sony Electronics Production"
 JAP_sony_events.1.electronics_computing_bonus: "Sony Device Engineering"
 JAP_sony_events.2.t: "The Cell Architecture Alliance"
 JAP_sony_events.2.d_foundry: "Sony, IBM, and Toshiba have begun joint design work on Cell, a processor architecture intended to unite advanced computing with consumer devices. Our foundry-first investments make an ambitious domestic program possible, but concentrating capital on a new architecture carries substantial risk."
 JAP_sony_events.2.d_systems: "Sony, IBM, and Toshiba have begun joint design work on Cell, a processor architecture intended to unite advanced computing with consumer devices. Our systems-first investments favor immediate products, while Cell promises a more ambitious foundation at greater cost."
 JAP_sony_events.2.d_fallback: "Sony, IBM, and Toshiba have begun joint design work on Cell, a processor architecture intended to unite advanced computing with consumer devices. We can fund the architecture as a strategic program or keep Sony's products tied to conventional designs."
 JAP_sony_events.2.a: "Fund the Cell alliance"
 JAP_sony_events.2.b: "Prefer conventional architectures"
 JAP_sony_events.2.cell_compute_bonus: "Cell Processor Architecture"
 JAP_sony_events.2.cell_microchip_bonus: "Cell Semiconductor Engineering"
 JAP_sony_events.2.conventional_compute_bonus: "Conventional Sony Architectures"
 JAP_sony_events.3.t: "Sony Ericsson Is Created"
 JAP_sony_events.3.d_joint: "Sony and Ericsson are ready to combine their handset businesses in an equally owned venture. Ericsson's willingness to join offers technical scale, while an independent line would preserve direct Japanese control."
 JAP_sony_events.3.d_independent: "Ericsson has chosen to retain its handset business, leaving Sony without the expected terms for an equal venture. We can still fund an independent mobile division or seek a narrower partnership."
 JAP_sony_events.3.d_unknown: "Ericsson's position cannot be established in the current international order. Sony must decide whether to fund an independent mobile division or seek a narrower technical partnership elsewhere."
 JAP_sony_events.3.a: "Form Sony Ericsson"
 JAP_sony_events.3.b: "Keep Sony mobile independent"
 JAP_sony_events.3.joint_venture_bonus: "Sony Ericsson Integration"
 JAP_sony_events.3.independent_mobile_bonus: "Independent Sony Mobile Engineering"
 JAP_sony_events.4.t: "The Digital Music Dilemma"
 JAP_sony_events.4.d: "Sony has launched Connect in the United States as a music-download service built around its devices. The catalogue can remain tightly controlled to protect music rights, or interoperability can become the product before foreign digital platforms set the standard."
 JAP_sony_events.4.a: "Protect the catalogue first"
 JAP_sony_events.4.b: "Make interoperability the product"
 JAP_sony_events.4.open_media_internet_bonus: "Open Sony Media Services"
 JAP_sony_events.4.open_media_computing_bonus: "Interoperable Sony Devices"
 JAP_sony_events.5.t: "Copy Protection Backfires"
 JAP_sony_events.5.d_closed: "The XCP copy-protection software distributed on some Sony BMG CDs has triggered a security and consumer-trust crisis. Sony BMG is still a joint venture owned equally by Sony and Bertelsmann, but the response will determine whether rights control outweighs public trust."
 JAP_sony_events.5.d_open: "The XCP copy-protection software distributed on some Sony BMG CDs has triggered a security and consumer-trust crisis. Our earlier support for interoperability makes the conflict especially damaging, but it also gives Sony a chance to turn reform into an open storefront."
 JAP_sony_events.5.a: "Withdraw, settle, and repair trust"
 JAP_sony_events.5.b: "Defend rights enforcement"
 JAP_sony_events.5.c: "Expand the open storefront"
 JAP_sony_events.5.trust_repair_bonus: "Sony BMG Trust and Security Reform"
 JAP_sony_events.5.open_storefront_internet_bonus: "Open Sony Storefront"
 JAP_sony_events.5.open_storefront_computing_bonus: "Digital Media Interoperability"
 JAP_sony_events.6.t: "The PlayStation 3 Gamble"
 JAP_sony_events.6.d_cell_platform: "PlayStation 3 is launching in Japan with Cell, RSX graphics, Blu-ray, and network services. Our Cell alliance and platform strategy have converged in an expensive system whose losses can buy long-term scale or be contained through stricter cost discipline."
 JAP_sony_events.6.d_cell_electronics: "PlayStation 3 is launching in Japan with Cell, RSX graphics, Blu-ray, and network services. Our Cell investment now ties a costly console to the wider electronics portfolio, offering either a bridge across Sony hardware or a reason to limit the exposure."
 JAP_sony_events.6.d_conventional_platform: "PlayStation 3 is launching in Japan with Cell, RSX graphics, Blu-ray, and network services. Our preference for conventional architectures sits uneasily beside the platform, forcing us to absorb its cost or impose stricter discipline."
 JAP_sony_events.6.d_conventional_electronics: "PlayStation 3 is launching in Japan with Cell, RSX graphics, Blu-ray, and network services. The system conflicts with both our conventional computing policy and electronics-first structure, leaving subsidy and strict cost control as competing answers."
 JAP_sony_events.6.a: "Subsidize Cell and Blu-ray"
 JAP_sony_events.6.b: "Impose cost and architecture discipline"
 JAP_sony_events.6.cell_console_bonus: "Cell and Blu-ray Integration"
 JAP_sony_events.6.console_microchip_bonus: "Cell Console Semiconductor Engineering"
 JAP_sony_events.6.cost_discipline_industry_bonus: "Efficient Console Production"
 JAP_sony_events.6.cost_discipline_compute_bonus: "Disciplined Console Architecture"
 JAP_sony_events.7.t: "The PlayStation Network Breach"
 JAP_sony_events.7.d: "An intrusion into PlayStation Network has forced Sony to shut down the service and notify roughly 77 million registered accounts. The response can rebuild security and identity systems as a durable capability or restore service first and defer deeper reform."
 JAP_sony_events.7.a: "Rebuild security and identity systems"
 JAP_sony_events.7.b: "Restore service before rebuilding the stack"
 JAP_sony_events.7.security_internet_bonus: "PlayStation Network Security"
 JAP_sony_events.7.security_ai_bonus: "Sony Identity Security Systems"
 JAP_sony_events.8.t: "Sony Takes Full Control of Mobile"
 JAP_sony_events.8.d_ericsson_exit: "Ericsson is ready to leave the handset venture, giving Sony the opportunity to acquire its stake and establish Sony Mobile Communications. We can integrate the business or recover capital by leaving handsets behind."
 JAP_sony_events.8.d_ericsson_control: "Ericsson has retained control of its handset operations, closing the expected path to a straightforward buyout. Sony must choose between an orderly retreat and rebuilding an independent mobile line."
 JAP_sony_events.8.d_independent: "Sony's independent handset line has reached a restructuring point without an Ericsson stake to acquire. We can scale the Japanese business at considerable cost or retreat into licensing and components."
 JAP_sony_events.8.d_fallback: "Sony Ericsson's ownership structure has reached a decisive point, but Ericsson's current position cannot be established. We can consolidate the mobile business if the venture can be unwound or withdraw from handsets."
 JAP_sony_events.8.a: "Acquire Ericsson's stake"
 JAP_sony_events.8.b: "Exit the handset business"
 JAP_sony_events.8.c: "Scale the independent Sony line"
 JAP_sony_events.8.mobile_control_bonus: "Sony Mobile Integration"
 JAP_sony_events.8.mobile_rebuild_bonus: "Independent Sony Mobile Platform"
 JAP_sony_events.8.mobile_industry_bonus: "Japanese Handset Production"
 JAP_sony_events.9.t: "One Sony"
 JAP_sony_events.9.d: "Kazuo Hirai has announced the One Sony strategy, naming digital imaging, games, and mobile as the group's core businesses. We can converge the company around shared platforms, preserve autonomous divisions, or bind strategic technologies to a national industrial compact."
 JAP_sony_events.9.a: "Converge the group"
 JAP_sony_events.9.b: "Preserve federated divisions"
 JAP_sony_events.9.c: "Negotiate a national technology compact"
 JAP_sony_events.9.group_computing_bonus: "One Sony Device Integration"
 JAP_sony_events.9.group_internet_bonus: "One Sony Network Services"
 JAP_sony_events.9.group_microchip_bonus: "One Sony Sensor Integration"
 JAP_sony_events.9.federated_industry_bonus: "Federated Sony Divisions"
 JAP_sony_events.9.compact_microchip_bonus: "National Technology Compact"
 JAP_sony_events.9.compact_industry_bonus: "Strategic Industrial Coordination"
 JAP_sony_events.10.t: "VAIO and the Television Business"
 JAP_sony_events.10.d_one_sony: "Sony has announced plans to sell VAIO and separate its television business after years of pressure on consumer electronics. The One Sony strategy now faces a test: release capital from weaker hardware or retain a leaner PC operation within the group."
 JAP_sony_events.10.d_federated: "Sony has announced plans to sell VAIO and separate its television business after years of pressure on consumer electronics. Our federated divisions can preserve an independent hardware base, but doing so will require a costly reorganization."
 JAP_sony_events.10.d_compact: "Sony has announced plans to sell VAIO and separate its television business after years of pressure on consumer electronics. The national technology compact makes hardware capacity strategically valuable, even as weak margins argue for divestment."
 JAP_sony_events.10.a: "Sell VAIO and separate television"
 JAP_sony_events.10.b: "Retain VAIO under a lean hardware group"
 JAP_sony_events.10.c: "Recapitalize the electronics federation"
 JAP_sony_events.10.divestment_efficiency_bonus: "Post-VAIO Industrial Efficiency"
 JAP_sony_events.10.vaio_computing_bonus: "Lean VAIO Engineering"
 JAP_sony_events.10.vaio_industry_bonus: "Retained PC Production"
 JAP_sony_events.10.recapitalization_industry_bonus: "Electronics Federation Recapitalization"
 JAP_sony_events.10.recapitalization_microchip_bonus: "Consumer Electronics Semiconductor Program"
 JAP_sony_events.11.t: "The Image-Sensor Pivot"
 JAP_sony_events.11.d: "Sony plans to separate its semiconductor operation as Sony Semiconductor Solutions, with image sensors at its core. We can expand sensor foundries, use that capability to rebuild consumer devices, or revive Cell as a sovereign compute program."
 JAP_sony_events.11.a: "Prioritize sensor foundries"
 JAP_sony_events.11.b: "Use sensors to rebuild consumer devices"
 JAP_sony_events.11.c: "Revive Cell as a broader compute program"
 JAP_sony_events.11.sensor_foundry_bonus: "Sony Image Sensor Foundries"
 JAP_sony_events.11.consumer_device_bonus: "Sensor-Enabled Consumer Devices"
 JAP_sony_events.11.cell_revival_bonus: "Revived Cell Compute Program"
 JAP_sony_events.12.t: "PlayStation 5"
 JAP_sony_events.12.d: "PlayStation 5 is launching in Japan as part of Sony's first regional wave, combining new console hardware with an expanding network-services business. We can scale the global platform or secure more of its silicon supply through domestic foundries."
 JAP_sony_events.12.a: "Scale the platform and services"
 JAP_sony_events.12.b: "Secure domestic silicon supply"
 JAP_sony_events.12.platform_scale_bonus: "PlayStation Platform Scale"
 JAP_sony_events.12.sovereign_supply_bonus: "Sovereign Console Silicon"
 JAP_sony_events.13.t: "Beyond the Console"
 JAP_sony_events.13.d: "Sony has completed its acquisition of Bungie, while Sony Honda Mobility has been legally formed as a joint venture owned equally with Honda. The group can deepen its creative and online capabilities, prioritize mobility and sensing, or finance both through an integrated strategy."
 JAP_sony_events.13.a: "Acquire creative and online capabilities"
 JAP_sony_events.13.b: "Build the mobility and sensing alliance"
 JAP_sony_events.13.c: "Pursue both as an integrated group"
 JAP_sony_events.13.ip_acquisition_bonus: "Creative and Online Service Integration"
 JAP_sony_events.13.mobility_sensor_bonus: "Mobility Sensor Alliance"
 JAP_sony_events.13.integrated_group_bonus: "Integrated Sony Group Technology"
 JAP_sony_events.14.t: "Creative Entertainment Vision"
 JAP_sony_events.14.d: "Sony's Creative Entertainment Vision proposes a Creation Shift built around content, engagement, and technologies that connect creators with audiences. We must decide whether the next industrial model is an integrated Sony ecosystem, an open digital commonwealth, sovereign Cell compute, or a federation of hardware businesses."
 JAP_sony_events.14.a: "Build the One Sony ecosystem"
 JAP_sony_events.14.b: "Create a Digital Walkman commonwealth"
 JAP_sony_events.14.c: "Pursue sovereign Cell compute"
 JAP_sony_events.14.d_option: "Consolidate the hardware federation"
 JAP_sony_events.14.one_sony_path_tt: "Requires all of:\n- §YOne Sony Strategy§!; and\n- §YIntegrated Sony Group§!, §Y2024 AI Design Priority§!, or both §YPS5 Platform Scale§! and §YPlatform Security Overhaul§!."
 JAP_sony_events.14.open_path_tt: "Requires all of:\n- §YOpen Media Ecosystem§!;\n- §YOpen Storefront§! or §YIP Acquisition Drive§!; and\n- §Y2024 AI Design Priority§! or §YPS5 Platform Scale§!."
 JAP_sony_events.14.cell_path_tt: "Requires all of:\n- §YCell Architecture§!;\n- §YSensor Foundry Priority§! or §YCell Compute Revival§!; and\n- §Y2001 Foundry Priority§!, §Y2020 Foundry Resilience§!, or §Y2024 Advanced Packaging§!."
 JAP_sony_events.14.hardware_path_tt: "Normally requires all of:\n- §YFederated Divisions§! or §YState Industrial Compact§!; and\n- §YVAIO Retained§!, §YHardware Recapitalized§!, or §YConsumer Device Priority§!.\nAlways available if no other capstone qualifies."
 JAP_sony_one_sony_ecosystem: "One Sony Ecosystem"
 JAP_sony_one_sony_ecosystem_desc: "Sony's entertainment properties, network services, sensor business, and hardware engineering now operate as a coordinated platform. The model accelerates Research and industrial learning while expanding technology exports, though deeper civilian integration raises chip demand."
 JAP_sony_open_digital_commonwealth: "Open Digital Commonwealth"
 JAP_sony_open_digital_commonwealth_desc: "Interoperable media services, devices, and domestic research networks form an open Japanese digital ecosystem. Shared standards accelerate Research, improve Political Power generation and factory learning, and strengthen microchip exports."
 JAP_sony_cell_sovereign_compute: "Cell Sovereign Compute"
 JAP_sony_cell_sovereign_compute_desc: "Japan has turned Cell and adjacent semiconductor investment into a sovereign compute program. It accelerates Research, microchip plant construction, and plant productivity, but the program demands more industrial chips."
 JAP_sony_hardware_federation: "Sony Hardware Federation"
 JAP_sony_hardware_federation_desc: "Sony's PC, mobile, television, and consumer electronics businesses remain under a reorganized industrial federation. The structure improves factory efficiency and microchip exports, but a larger civilian hardware base consumes more chips."
 JAP_nintendo_events.1.t: "Two Screens, Two Machines"
 JAP_nintendo_events.1.d: "Nintendo is defending its handheld lead with the Game Boy Advance while asking the GameCube to fight PlayStation 2 on the living room floor. Supporting both at once strains component suppliers and studios, and the ministry must decide where public instruments are worth spending."
 JAP_nintendo_events.1.a: "Extend industrial credit to both platforms"
 JAP_nintendo_events.1.a_tt: "Supplier credit and shared component research steady a dual hardware programme.\nPlatform Strength §G+1§!, Hardware Resilience §G+2§!."
 JAP_nintendo_events.1.b: "Fund the developer transition"
 JAP_nintendo_events.1.b_tt: "Tooling grants help studios move from cartridge to optical development.\nDeveloper Ecosystem §G+2§!, Platform Strength §G+1§!."
 JAP_nintendo_events.1.c: "Promote the launches abroad"
 JAP_nintendo_events.1.c_tt: "Export promotion buys reach at the cost of domestic supplier depth.\nIP Reach §G+1§!, Platform Strength §G+2§!, Hardware Resilience §R-1§!."
 JAP_nintendo_events.2.t: "The Nintendo DS"
 JAP_nintendo_events.2.d: "A touch screen, a microphone and local wireless are being sold as a new way to play rather than a faster machine. Whether that becomes an industry or a curiosity depends on how many studios can afford to build for it."
 JAP_nintendo_events.2.a: "Back an interface research consortium"
 JAP_nintendo_events.2.a_tt: "Public research on touch and wireless interaction is shared across the industry.\nDeveloper Ecosystem §G+2§!, IP Reach §G+1§!."
 JAP_nintendo_events.2.b: "Open an accessible developer programme"
 JAP_nintendo_events.2.b_tt: "Cheap kits and small-studio grants widen the catalogue faster than the supply base can follow.\nDeveloper Ecosystem §G+3§!, Hardware Resilience §R-1§!."
 JAP_nintendo_events.2.c: "Finance mass-market production"
 JAP_nintendo_events.2.c_tt: "Manufacturing finance buys volume, not variety.\nPlatform Strength §G+2§!, Hardware Resilience §G+2§!, Developer Ecosystem §R-1§!."
 JAP_nintendo_events.3.t: "The Wii and the Wider Audience"
 JAP_nintendo_events.3.d: "Motion control has pulled households into gaming that no specification race ever reached, and demand is outrunning the component supply. The state can widen access further, deepen the underlying research, or make sure the machines can actually be built."
 JAP_nintendo_events.3.a: "Widen access to accessible play"
 JAP_nintendo_events.3.a_tt: "Accessibility research and public deployment carry the interface beyond the household.\nIP Reach §G+2§!, Platform Strength §G+2§!."
 JAP_nintendo_events.3.b: "Deepen motion-interface research"
 JAP_nintendo_events.3.b_tt: "Shared sensor and interface research strengthens the domestic development base.\nDeveloper Ecosystem §G+2§!, Platform Strength §G+1§!."
 JAP_nintendo_events.3.c: "Secure component capacity"
 JAP_nintendo_events.3.c_tt: "Supplier capacity support meets demand at the cost of network investment.\nHardware Resilience §G+3§!, Platform Strength §G+1§!, Digital Services §R-1§!."
 JAP_nintendo_events.4.t: "The DSi and the First Storefronts"
 JAP_nintendo_events.4.d: "Downloadable software, cameras and internal storage turn a handheld into a shop, and the rules for payments, age ratings and refunds have not caught up. Japan can build the market, open it, or hold it back until the protections exist."
 JAP_nintendo_events.4.a: "Fund digital distribution"
 JAP_nintendo_events.4.a_tt: "Payment, ratings and delivery infrastructure make downloadable software a real market.\nDigital Services §G+3§!, Developer Ecosystem §G+1§!."
 JAP_nintendo_events.4.b: "Open the storefront to small studios"
 JAP_nintendo_events.4.b_tt: "Low-barrier publishing fills the shop but weakens the platform holder's curation.\nDigital Services §G+2§!, Developer Ecosystem §G+2§!, Platform Strength §R-1§!."
 JAP_nintendo_events.4.c: "Regulate the rollout cautiously"
 JAP_nintendo_events.4.c_tt: "Consumer protection first, reach second.\nHardware Resilience §G+1§!, Digital Services §G+1§!, IP Reach §R-1§!."
 JAP_nintendo_events.5.t: "The 3DS Price Collapse"
 JAP_nintendo_events.5.d: "Five months after launch the 3DS price is being cut by a third and early buyers are being compensated with twenty legacy games. The company is paying for the recovery itself; the question is whether the state does anything about the damage around it."
 JAP_nintendo_events.5.a: "Protect suppliers and employment"
 JAP_nintendo_events.5.a_tt: "Support for component makers and their workforce absorbs the shock down the chain.\nHardware Resilience §G+2§!, Platform Strength §G+1§!, Digital Services §R-1§!."
 JAP_nintendo_events.5.b: "Back the consumer remedy"
 JAP_nintendo_events.5.b_tt: "Endorsing compensation for early adopters restores confidence in the platform.\nPlatform Strength §G+2§!, Digital Services §G+1§!, Hardware Resilience §R-1§!."
 JAP_nintendo_events.5.c: "Require market discipline"
 JAP_nintendo_events.5.c_tt: "No public cushion: the mispricing is the company's to carry.\nDeveloper Ecosystem §G+1§!, Hardware Resilience §G+1§!, Platform Strength §R-2§!."
 JAP_nintendo_events.6.t: "The Wii U Cannot Be Explained"
 JAP_nintendo_events.6.d: "A second screen nobody asked for, a name that reads like an accessory, and a release calendar that empties out after launch. High-definition development has proved slower and dearer than planned, and the platform is stalling."
 JAP_nintendo_events.6.a: "Restructure the hardware base"
 JAP_nintendo_events.6.a_tt: "Component and manufacturing restructuring preserves the industrial base through a failing generation.\nHardware Resilience §G+2§!, Platform Strength §R-1§!."
 JAP_nintendo_events.6.b: "Subsidise developer conversion"
 JAP_nintendo_events.6.b_tt: "Conversion funding gets studios onto high-definition tooling that will outlive this machine.\nDeveloper Ecosystem §G+3§!, Platform Strength §G+1§!, Hardware Resilience §R-1§!."
 JAP_nintendo_events.6.c: "Decline a rescue"
 JAP_nintendo_events.6.c_tt: "The company consolidates on its own balance sheet and its own terms.\nHardware Resilience §G+1§!, Platform Strength §R-2§!, IP Reach §G+1§!."
 JAP_nintendo_events.7.t: "One Development Organisation"
 JAP_nintendo_events.7.d: "Handheld and home-console engineering are being merged so that architecture, tools and staff stop being rebuilt for every device. What the recovery is aimed at, and what public instruments support it, is still open."
 JAP_nintendo_events.7.a: "Support integrated hardware R&D"
 JAP_nintendo_events.7.a_tt: "Research credits favour a single architecture family and its toolchain.\nHardware Resilience §G+2§!, Developer Ecosystem §G+1§!."
 JAP_nintendo_events.7.b: "Build internal studio capacity"
 JAP_nintendo_events.7.b_tt: "Training and studio investment attack the release-calendar problem directly.\nDeveloper Ecosystem §G+3§!, IP Reach §G+1§!."
 JAP_nintendo_events.7.c: "Commercialise the established IP"
 JAP_nintendo_events.7.c_tt: "Licensing and commercialisation support buys time that the studios do not get.\nIP Reach §G+3§!, Platform Strength §G+1§!, Developer Ecosystem §R-1§!."
 JAP_nintendo_events.8.t: "Nintendo and DeNA"
 JAP_nintendo_events.8.d: "A reciprocal shareholding brings mobile and account-service expertise into a company that has never run a modern identity system. The intellectual property stays where it is; the customer relationship is what is being rebuilt."
 JAP_nintendo_events.8.a: "Build a shared service backbone"
 JAP_nintendo_events.8.a_tt: "Interoperability standards make the account layer usable across the industry.\nDigital Services §G+3§!, Developer Ecosystem §G+1§!."
 JAP_nintendo_events.8.b: "Keep the accounts sovereign"
 JAP_nintendo_events.8.b_tt: "Investment review and data-residency rules keep identity and payments under domestic control.\nHardware Resilience §G+1§!, Digital Services §G+2§!, Platform Strength §G+1§!."
 JAP_nintendo_events.8.c: "Treat mobile as an IP funnel"
 JAP_nintendo_events.8.c_tt: "Applications become advertising for the dedicated platform rather than a business of their own.\nIP Reach §G+3§!, Digital Services §G+1§!, Platform Strength §R-1§!."
 JAP_nintendo_events.9.t: "After Iwata"
 JAP_nintendo_events.9.d: "Satoru Iwata's death in July has left a company mid-execution on a new platform, a mobile alliance and an account system. Tatsumi Kimishima takes the presidency while the creative and technical leadership is formalised into fellowships."
 JAP_nintendo_events.9.a: "Prioritise operational continuity"
 JAP_nintendo_events.9.a_tt: "Deliver what is already in development and change nothing else.\nHardware Resilience §G+2§!, Platform Strength §G+1§!."
 JAP_nintendo_events.9.b: "Support governance renewal"
 JAP_nintendo_events.9.b_tt: "Outside directors and published succession standards trade speed for stability.\nDeveloper Ecosystem §G+2§!, Digital Services §G+1§!."
 JAP_nintendo_events.9.c: "Convene a creative-industry compact"
 JAP_nintendo_events.9.c_tt: "A sector-wide settlement on training and creator capacity reaches beyond one company.\nIP Reach §G+2§!, Developer Ecosystem §G+1§!, Hardware Resilience §R-1§!."
 JAP_nintendo_events.10.t: "Play in Public Space"
 JAP_nintendo_events.10.d: "Location-based play has put crowds in parks, stations and private property, and the public has decided Nintendo is responsible for all of it. In fact Niantic operates the game under licence from The Pokémon Company, in which Nintendo holds a minority stake."
 JAP_nintendo_events.10.a: "Coordinate deployment in public space"
 JAP_nintendo_events.10.a_tt: "Municipal coordination and permitting make location-based entertainment governable.\nIP Reach §G+2§!, Digital Services §G+1§!."
 JAP_nintendo_events.10.b: "Fund location-platform research"
 JAP_nintendo_events.10.b_tt: "Domestic research on positioning and augmented display builds capability rather than rules.\nDigital Services §G+2§!, Developer Ecosystem §G+1§!, IP Reach §G+1§!."
 JAP_nintendo_events.10.c: "Apply strict safety limits"
 JAP_nintendo_events.10.c_tt: "Geofencing, data limits and liability rules come before reach.\nHardware Resilience §G+1§!, IP Reach §G+1§!, Digital Services §R-1§!."
 JAP_nintendo_events.11.t: "The Switch"
 JAP_nintendo_events.11.d: "One machine, one software target, handheld and television at the same time, built on an external processor family rather than a bespoke design. The merged development organisation finally has a single thing to feed."
 JAP_nintendo_events.11.a: "Scale the integrated platform"
 JAP_nintendo_events.11.a_tt: "Manufacturing credit and export support behind one hybrid target.\nPlatform Strength §G+3§!, Digital Services §G+1§!, Hardware Resilience §G+1§!."
 JAP_nintendo_events.11.b: "Secure the hardware chain"
 JAP_nintendo_events.11.b_tt: "Supplier depth and contingency assembly at the cost of external development attention.\nHardware Resilience §G+3§!, Platform Strength §G+1§!, Developer Ecosystem §R-1§!."
 JAP_nintendo_events.11.c: "Open the hybrid ecosystem"
 JAP_nintendo_events.11.c_tt: "Development grants and accessible tooling make the platform worth porting to.\nDeveloper Ecosystem §G+3§!, Platform Strength §G+1§!, Digital Services §G+1§!."
 JAP_nintendo_events.12.t: "Nintendo Switch Online"
 JAP_nintendo_events.12.d: "Online play, cloud saves and a rotating legacy catalogue move behind a subscription. The price is low and the moderation is careful, but ownership, portability and preservation are now service questions rather than purchase questions."
 JAP_nintendo_events.12.a: "Build a durable subscription service"
 JAP_nintendo_events.12.a_tt: "Service-resilience standards underwrite a recurring network business.\nDigital Services §G+3§!, Platform Strength §G+1§!."
 JAP_nintendo_events.12.b: "Require portability and developer access"
 JAP_nintendo_events.12.b_tt: "Consumer portability rules cost the platform holder some lock-in.\nDeveloper Ecosystem §G+2§!, Digital Services §G+2§!, Platform Strength §R-1§!."
 JAP_nintendo_events.12.c: "Prioritise domestic service resilience"
 JAP_nintendo_events.12.c_tt: "Domestic hosting, identity and incident rules harden the network.\nHardware Resilience §G+2§!, Digital Services §G+2§!."
 JAP_nintendo_events.13.t: "Super Nintendo World"
 JAP_nintendo_events.13.d: "A licensed park district opens in Osaka with Universal carrying the construction and operations. Japan gains a tourism anchor without owning a resort, and has to decide what it wants from that."
 JAP_nintendo_events.13.a: "Back the tourism infrastructure"
 JAP_nintendo_events.13.a_tt: "Transport, permitting and regional investment around the attraction.\nIP Reach §G+3§!, Hardware Resilience §G+1§!."
 JAP_nintendo_events.13.b: "Standardise global licensing"
 JAP_nintendo_events.13.b_tt: "A supervised licensing framework travels better than a single site.\nIP Reach §G+2§!, Digital Services §G+1§!, Platform Strength §G+1§!."
 JAP_nintendo_events.13.c: "Reinvest in domestic creative clusters"
 JAP_nintendo_events.13.c_tt: "The proceeds go to studios and creators rather than to attractions.\nDeveloper Ecosystem §G+2§!, IP Reach §G+2§!."
 JAP_nintendo_events.14.t: "The Super Mario Bros. Movie"
 JAP_nintendo_events.14.d: "A co-financed, co-produced film has done what three decades of licensing deals could not, and every studio in the world now wants a Japanese game franchise. Supervision is the only thing separating this from the adaptations nobody remembers fondly."
 JAP_nintendo_events.14.a: "Support supervised co-production"
 JAP_nintendo_events.14.a_tt: "Co-production incentives conditional on creative control staying in Kyoto.\nIP Reach §G+3§!, Platform Strength §G+1§!."
 JAP_nintendo_events.14.b: "Expand global licensing"
 JAP_nintendo_events.14.b_tt: "Volume and reach now, quality variance later.\nIP Reach §G+3§!, Digital Services §G+1§!, Hardware Resilience §R-1§!."
 JAP_nintendo_events.14.c: "Recycle the proceeds into studios"
 JAP_nintendo_events.14.c_tt: "Film revenue funds game production instead of more adaptations.\nDeveloper Ecosystem §G+3§!, IP Reach §G+1§!."
 JAP_nintendo_events.15.t: "The Switch 2 Transition"
 JAP_nintendo_events.15.d: "Accounts, catalogue, subscriptions and architecture all carry forward, so the new generation is a migration rather than a reset. A quarter-century of platform, developer, network, supply and licensing decisions now settles into one national industrial strategy."
 JAP_nintendo_events.15.a: "An integrated entertainment ecosystem"
 JAP_nintendo_events.15.a_tt: "Requires Platform Strength §Y8§!, Digital Services §Y7§! and IP Reach §Y7§!.\nHardware, accounts, services and owned characters operate as one durable platform."
 JAP_nintendo_events.15.b: "Hardware platform sovereignty"
 JAP_nintendo_events.15.b_tt: "Requires Hardware Resilience §Y8§! and Platform Strength §Y7§!.\nResilient architecture and manufacturing continuity, at the cost of openness and licensing reach."
 JAP_nintendo_events.15.c: "An open developer commonwealth"
 JAP_nintendo_events.15.c_tt: "Requires Developer Ecosystem §Y8§! and Digital Services §Y6§!.\nTooling, portability and third-party access become the platform's strategic centre."
 JAP_nintendo_events.15.d_option: "A global intellectual-property licensor"
 JAP_nintendo_events.15.d_option_tt: "Requires IP Reach §Y9§!.\nFilm, mobile, attractions and merchandise become the network the games feed."
 JAP_nintendo_events.15.e: "A disciplined hybrid platform"
 JAP_nintendo_events.15.e_tt: "Always available.\nA balanced hybrid platform without committing the state to one maximal strategy."
 JAP_nintendo_integrated_entertainment_ecosystem: "Integrated Entertainment Ecosystem"
 JAP_nintendo_integrated_entertainment_ecosystem_desc: "Hardware, accounts, network services and owned characters are run as a single platform rather than as separate businesses. Research and factory learning improve, consumer goods cost less to supply and technology exports rise, while a deeper consumer platform draws more chips."
 JAP_nintendo_hardware_platform_sovereignty: "Hardware Platform Sovereignty"
 JAP_nintendo_hardware_platform_sovereignty_desc: "Japan has put resilient architecture, domestic packaging and manufacturing continuity ahead of openness. Microchip plants build faster and run better and local supply deepens, but a protected platform trades away goodwill with trading partners."
 JAP_nintendo_open_developer_commonwealth: "Open Developer Commonwealth"
 JAP_nintendo_open_developer_commonwealth_desc: "Tooling, portability and third-party access are the platform's organising principle. Research accelerates and shared programmes pay off across the industry, and political capital comes more easily, but the platform holder keeps less of the rent."
 JAP_nintendo_global_ip_licensor: "Global IP Licensor"
 JAP_nintendo_global_ip_licensor_desc: "Films, attractions, applications and merchandise form a licensing network anchored on a small set of characters. Trade standing, service-sector taxation and public confidence all improve, and consumer demand is cheaper to satisfy, but none of it strengthens the hardware."
 JAP_nintendo_disciplined_hybrid_platform: "Disciplined Hybrid Platform"
 JAP_nintendo_disciplined_hybrid_platform_desc: "The hybrid platform is preserved without committing the state to one maximal strategy. The gains are modest across research, factory learning, consumer supply and exports, and so is the upkeep."
 JAP_zombie_companies_resolved_tt: "Japan's §Yzombie companies§! have been fully wound down"

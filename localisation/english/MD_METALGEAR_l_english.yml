l_english:
 METALGEAR_network_category: "The Patriots"
 METALGEAR_network_category_desc: "[METALGEAR_arc_status]\n\n§YCoherence§! [?global.METALGEAR_coherence|0]   §YReach§! [?global.METALGEAR_reach|0]   §YExposure§! [?global.METALGEAR_exposure|0]\n§YFree commitments§! [?global.METALGEAR_capacity|0]. [METALGEAR_compartment_status]\n\n§YDefense procurement§!: [METALGEAR_node_0_state]\n§YSpecial operations oversight§!: [METALGEAR_node_1_state]\n§YInformation control§!: [METALGEAR_node_2_state]\n\nA node reads as an §Yestimate§! until an audit confirms it; a confirmation lasts six months. A compromised node leaks evidence every month."
 METALGEAR_arc_setup: "§YSetup.§! The network has until 2004 to learn where it stands."
 METALGEAR_arc_shadow_moses_open: "§RShadow Moses.§! The incident in Alaska is under way."
 METALGEAR_arc_shadow_moses_closed: "§YShadow Moses is closed.§! Its consequences are on the record."
 METALGEAR_compartment_on: "Operations are §Ycompartmentalized§!: compromised nodes leak half as much, and coherence and reach slip each quarter."
 METALGEAR_compartment_off: "Operations are not compartmentalized."
 METALGEAR_state_audit: "§Yaudit under way§!"
 METALGEAR_state_repair: "§Yrepair under way§!"
 METALGEAR_state_secure_confirmed: "§Gsecure§! (confirmed)"
 METALGEAR_state_strained_confirmed: "§Ystrained§! (confirmed)"
 METALGEAR_state_compromised_confirmed: "§Rcompromised§! (confirmed)"
 METALGEAR_state_secure_estimate: "secure (estimate)"
 METALGEAR_state_strained_estimate: "strained (estimate)"
 METALGEAR_state_compromised_estimate: "compromised (estimate)"
 METALGEAR_audit_line_procurement: "\n§YDefense procurement§!: [METALGEAR_node_0_state]"
 METALGEAR_audit_line_oversight: "\n§YSpecial operations oversight§!: [METALGEAR_node_1_state]"
 METALGEAR_audit_line_information: "\n§YInformation control§!: [METALGEAR_node_2_state]"
 METALGEAR_empty: ""
 METALGEAR_has_capacity_tt: "The network has a free commitment"
 METALGEAR.1.t: "The Patriots"
 METALGEAR.1.d: "The government of the United States answers to voters, courts and Congress; the network behind it answers to no one, and it is ours to run. It works through three nodes, defense procurement, special operations oversight and information control, and what we believe about each is an estimate until an audit confirms it. In 2004 something will test all three at once."
 METALGEAR.1.a: "Begin with the audits"
 METALGEAR.1.a_tt: "The §YThe Patriots§! decision category is the network's dashboard. Audits confirm a node's real condition for six months; repairs improve a node one step; compartmentalizing slows leaks at a cost. Each audit or repair holds one of the network's §Ytwo§! commitments until it finishes."
 METALGEAR.2.t: "Quarterly Network Report"
 METALGEAR.2.d: "[METALGEAR_arc_status]\n\nCoherence stands at §Y[?global.METALGEAR_coherence|0]§!, reach at §Y[?global.METALGEAR_reach|0]§! and exposure at §Y[?global.METALGEAR_exposure|0]§!.\n§YDefense procurement§!: [METALGEAR_node_0_state]\n§YSpecial operations oversight§!: [METALGEAR_node_1_state]\n§YInformation control§!: [METALGEAR_node_2_state]"
 METALGEAR.2.a: "File it"
 METALGEAR.3.t: "Audit Findings"
 METALGEAR.3.d: "The auditors have finished and the record now matches what they found:[METALGEAR_audit_line_0][METALGEAR_audit_line_1][METALGEAR_audit_line_2]"
 METALGEAR.3.a: "Noted"
 METALGEAR_audit_procurement: "Audit Defense Procurement"
 METALGEAR_audit_procurement_desc: "Send auditors through the contractors and programs we steer, and find out what is really holding."
 METALGEAR_audit_oversight: "Audit Special Operations Oversight"
 METALGEAR_audit_oversight_desc: "Check whether the units we watch are still the units we think we are watching."
 METALGEAR_audit_information: "Audit Information Control"
 METALGEAR_audit_information_desc: "Trace what the newsrooms, archives and databases we rely on actually say about us."
 METALGEAR_audit_node_tt: "Holds §Yone§! commitment for §Ytwo months§!. When it ends, the node's real condition is confirmed for six months and the commitment returns."
 METALGEAR_repair_procurement: "Repair Defense Procurement"
 METALGEAR_repair_procurement_desc: "Replace the people and contracts that have stopped doing what we need."
 METALGEAR_repair_oversight: "Repair Special Operations Oversight"
 METALGEAR_repair_oversight_desc: "Rebuild the chain of reporting over the units that matter most."
 METALGEAR_repair_information: "Repair Information Control"
 METALGEAR_repair_information_desc: "Restore the channels that keep the official story the only story."
 METALGEAR_repair_node_tt: "Holds §Yone§! commitment for §Ythree months§!. When it ends, the node improves §Yone step§! and its condition is confirmed for six months."
 METALGEAR_compartmentalize: "Compartmentalize Operations"
 METALGEAR_compartmentalize_desc: "Make sure no single person can tell anyone very much."
 METALGEAR_compartmentalize_tt: "Compromised nodes leak §Ghalf§! as much evidence and degrade half as often, but each quarter coherence and reach fall by §R1§!."
 METALGEAR_end_compartmentalization: "End Compartmentalization"
 METALGEAR_end_compartmentalization_desc: "Let the network talk to itself again."
 METALGEAR_end_compartmentalization_tt: "Leaks and degradation return to their normal rates, and coherence and reach stop falling."
 METALGEAR_sm_exploit_program: "Move the Design Data Into the Network"
 METALGEAR_sm_exploit_program_desc: "The prototype is gone, but its design data is still ours. Put it where it can be used."
 METALGEAR_sm_exploit_program_tt: "Reach §G+10§!, exposure §R+5§!."
 METALGEAR_sm_bury_program: "Bury What Is Left of the Program"
 METALGEAR_sm_bury_program_desc: "The program is lost, but the story held. Close the files before anyone reopens them."
 METALGEAR_sm_bury_program_tt: "Exposure §G-10§!, reach §R-5§!."
 METALGEAR_sm_official_account: "Publish an Official Account"
 METALGEAR_sm_official_account_desc: "If the world has heard too much, give it something tidier to remember."
 METALGEAR_sm_official_account_tt: "Exposure §G-15§!, coherence §R-5§!."
 METALGEAR_debug_start_shadow_moses: "(Debug) Start Shadow Moses"
 METALGEAR_debug_start_shadow_moses_desc: "Starts the Shadow Moses incident now, for testing."

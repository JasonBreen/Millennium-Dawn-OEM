l_english:
 DEUSEX_illuminati_category: "The Illuminati"
 DEUSEX_illuminati_category_desc: "Somebody has always been pulling the strings. Our analysts put the Illuminati's influence inside our institutions at §Y[?DEUSEX_illum_influence|0]§! of 100. It drains political power and stability, and it grows every month, faster where augmentation spreads. Exposure stands at §Y[?global.DEUSEX_illum_exposure|0]§!; at 70 the Masquerade slips and every major power sheds 10 influence."
 DEUSEX_inner_circle_category: "The Inner Circle"
 DEUSEX_inner_circle_category_desc: "Capital §Y[?global.DEUSEX_illum_capital|0]§!, media §Y[?global.DEUSEX_illum_media|0]§!, security §Y[?global.DEUSEX_illum_security|0]§!. Exposure §Y[?global.DEUSEX_illum_exposure|0]§!.\nCapital speeds our research, media adds political power and security sharpens civilian intelligence, while exposure costs stability. Strengthening one wing weakens the other two.\n\nNext on the agenda: [DEUSEX_agenda_next]"
 DEUSEX_agenda_next_1: "§YShape the Narrative§!, once media reaches 40. Influence then grows faster in every major power."
 DEUSEX_agenda_next_2: "§YThe Control Biochip§!, once capital reaches 50, from 2025. Every augmentation host then gains a fifth of its adoption as influence."
 DEUSEX_agenda_next_3: "§YRestore Humanity§!, once security reaches 50, after the Aug Incident. A major power that adopts the Human Restoration Act then gives us 20 influence."
 DEUSEX_agenda_next_4: "§YA New Order§!, once every wing reaches 40. Our grip on every major power then doubles."
 DEUSEX_agenda_complete: "The agenda is complete."
 DEUSEX_seek_inner_circle: "Join the Inner Circle"
 DEUSEX_seek_inner_circle_desc: "Accept the invitation that has waited in a sealed envelope since our predecessors took office. Only one government sits at the table."
 DEUSEX_investigate_fronts: "Investigate the Fronts"
 DEUSEX_investigate_fronts_desc: "Audit the think tanks, media holdings and security contractors that keep turning up in each other's files."
 DEUSEX_leak_the_files: "Leak the Files"
 DEUSEX_leak_the_files_desc: "Hand what we know to hacktivists and the press. The truth will cost us some calm, and the Illuminati far more."
 DEUSEX_empower_capital: "Empower the Capital Wing"
 DEUSEX_empower_capital_desc: "Steer contracts and capital to Page Industries and its partners."
 DEUSEX_empower_media: "Empower the Media Wing"
 DEUSEX_empower_media_desc: "Give Picus Communications the stories, the access and the anchors it needs."
 DEUSEX_empower_security: "Empower the Security Wing"
 DEUSEX_empower_security_desc: "Put Belltower Associates and friendly agencies where the next crisis will be."
 DEUSEX_direct_the_illuminati: "Direct the Illuminati at [FROM.GetName]"
 DEUSEX_direct_the_illuminati_desc: "Turn the conspiracy's attention to [FROM.GetName]: its ministries, its newsrooms and its contractors."
 DEUSEX_advance_the_agenda: "Advance the Agenda"
 DEUSEX_advance_the_agenda_desc: "Move the plan one step closer to the world the inner circle was promised."
 DEUSEX_distribute_enhancements: "Distribute Enhancements"
 DEUSEX_distribute_enhancements_desc: "Fit augmentations at cost through friendly clinics. Every implant carries something extra."
 DEUSEX_influence_10_tt: "Illuminati influence here is at least §Y10§!."
 DEUSEX_influence_30_tt: "Illuminati influence here is at least §Y30§!."
 DEUSEX_seek_inner_circle_tt: "We join the §Yinner circle§!. We stop paying the Illuminati's grip and draw on its wings instead."
 DEUSEX_investigate_fronts_tt: "The investigation runs for §Ytwo months§!."
 DEUSEX_investigate_fronts_result_tt: "Illuminati influence here: §G-10§!\nExposure: §G+3§!"
 DEUSEX_leak_the_files_tt: "Illuminati influence here: §G-30§!\nExposure: §G+15§!"
 DEUSEX_empower_capital_tt: "Capital: §G+15§!\nMedia and security: §R-3§! each"
 DEUSEX_empower_media_tt: "Media: §G+15§!\nCapital and security: §R-3§! each"
 DEUSEX_empower_security_tt: "Security: §G+15§!\nCapital and media: §R-3§! each"
 DEUSEX_direct_the_illuminati_tt: "Exposure: §R+5§!\nThe operation runs for §Ytwo months§!."
 DEUSEX_direct_the_illuminati_result_tt: "Illuminati influence in [FROM.GetName]: §G+10§!"
 DEUSEX_agenda_ready_tt: "The agenda's next stage is within reach."
 DEUSEX_advance_the_agenda_tt: "The work runs for §Ytwo months§!.\nNext: [DEUSEX_agenda_next]"
 DEUSEX_advance_the_agenda_result_tt: "The agenda advances one stage."
 DEUSEX_distribute_enhancements_tt: "Augmentation adoption: §G+10§!\nAnti-augmentation unrest: §R+10§!\nExposure: §R+5§!"

 DEUSEX_influence_minus_5_tt: "Illuminati influence here: §G-5§!"
 DEUSEX_sacrifice_wing_tt: "Our strongest wing: §R-30§!\nExposure: §G-40§!"
 DEUSEX_deny_everything_tt: "Exposure: §G-20§!"
 DEUSEX_aug_restricted: "The Human Restoration Act is in force"
 DEUSEX_illuminati_grip: "Illuminati Influence"
 DEUSEX_illuminati_grip_desc: "The Illuminati's influence here: §Y[?DEUSEX_illum_influence|0]§! of 100. Political power and stability fall as it grows."
 DEUSEX_inner_circle: "The Inner Circle"
 DEUSEX_inner_circle_desc: "Capital §Y[?global.DEUSEX_illum_capital|0]§!, media §Y[?global.DEUSEX_illum_media|0]§!, security §Y[?global.DEUSEX_illum_security|0]§!, exposure §Y[?global.DEUSEX_illum_exposure|0]§!."
 DEUSEX.40.t: "An Offer From Friends"
 DEUSEX.40.d: "A delegation from Page Industries and its partners has offered to cover our budget shortfall, on conditions nobody will write down. Their advisers would like a few offices in our ministries in return."
 DEUSEX.40.a: "Accept their generosity."
 DEUSEX.40.b: "Decline, and say so publicly."
 DEUSEX.41.t: "The Masquerade Slips"
 DEUSEX.41.d: "Leaked files tie think tanks, a private security firm and a global news network to the same small circle of owners. Some analysts now claim that Picus's most famous anchor, Eliza Cassan, has never been a real person. Governments are denying everything."
 DEUSEX.41.a: "It is only a theory."
 DEUSEX.42.t: "Who Pays for the Leak"
 DEUSEX.42.d: "The leak traces back to our partners. The inner circle can cut loose the wing that is most exposed, or we can deny everything and absorb the anger ourselves."
 DEUSEX.42.a: "Cut loose the most exposed wing."
 DEUSEX.42.b: "Deny everything."

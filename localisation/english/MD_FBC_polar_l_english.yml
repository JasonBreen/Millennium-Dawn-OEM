l_english:
 FBC.20.t: "Something in the Deep Core"
 FBC.20.d: "The drilling crew at our Antarctic station has pulled up an ice core that will not stay cold. Instruments near the sample record a steady signal with no source, and two technicians report hearing it without them. The station director asks whether to seal the borehole or keep going."
 FBC.20.a: "Seal the borehole and log it as an equipment fault."
 FBC.20.a_tt: "The core stays sealed. No outside agency is told.\nNo new event in the ice for at least §Y3§! years."
 FBC.20.b: "Keep drilling and report it to the Americans."
 FBC.20.b_tt: "The Federal Bureau of Control learns of the core and decides whether to send a response team."
 FBC.21.t: "An Altered World Event in the Antarctic Ice"
 FBC.21.d: "[FROM.GetName]'s Antarctic station reports an ice core that keeps its own temperature and a signal that some of the crew hear unaided. The Bureau classifies it as an Altered World Event at a site we do not control. A team can reach the station in six weeks."
 FBC.21.a: "Send a response team to the station."
 FBC.21.a_tt: "Commits one response team for the polar case. The team reports back in §Y45§! days.\nContainment usually holds; sometimes it does not."
 FBC.21.b: "Leave it to the station's crew."
 FBC.21.b_tt: "Exposure: §R+5§!\nThe event breaks out of the core at [FROM.GetName]'s station."
 FBC.22.t: "The Polar Core Is Contained"
 FBC.22.d: "The team has the core in a sealed cold room and the signal has stopped. The station's own scientists keep the drilling data, which the Bureau has cleared of anything it needs to keep."
 FBC.22.a: "File it and bring the team home."
 FBC.22.a_tt: "Containment integrity: §G+5§!\nThe response team is free again.\n[?FBC_polar_country.GetName] gains a one-use §G+50%§! excavation research bonus from the drilling data."
 FBC.23.t: "Breakout at the Drilling Station"
 FBC.23.d: "Whatever was in the core is no longer only in the core. The drilling hall has been evacuated, the rig is down, and the crew will not go back in until the readings fall."
 FBC.23.a: "Shut the hall and wait it out."
 FBC.23.a_tt: "The Ice Core Deep Drilling Rig produces nothing for §Y30§! days."
 FBC.24.t: "The Polar Team Could Not Contain It"
 FBC.24.d: "The response team reached the station too late to seal the core cleanly. They pulled the crew out of the drilling hall and came home with less than we sent them for."
 FBC.24.a: "Bring the team home."
 FBC.24.a_tt: "Containment integrity: §R-10§!\nExposure: §R+10§!\nThe response team is free again.\nThe event breaks out at [?FBC_polar_country.GetName]'s station."
 FBC_polar_stale_breakout_tt: "Exposure: §R+5§!\nThe drilling rig is no longer operational, so there is no breakout at the station."
 FBC_polar_stale_containment_tt: "Containment integrity: §G+5§!\nThe response team is free again.\nThe drilling rig is no longer operational, so its former controller receives no research bonus."
 FBC_polar_stale_failure_tt: "Containment integrity: §R-10§!\nExposure: §R+10§!\nThe response team is free again.\nThe drilling rig is no longer operational, so there is no breakout at the station."
 FBC_polar_core_findings: "Polar Core Findings"

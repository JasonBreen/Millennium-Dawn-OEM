l_english:
 TOP_guide_label: "Guide"
 TOP_guide_tt: "Open the §YTargeted Operations§! guide: how to find a target, build intelligence, win approval, launch an operation, and handle the aftermath."
 TOP_guide_basics_label: "Basics"
 TOP_guide_intelligence_label: "Intelligence"
 TOP_guide_authority_label: "Authority"
 TOP_guide_operations_label: "Operations"
 TOP_guide_aftermath_label: "Aftermath"
 TOP_guide_defense_label: "Defense"
 TOP_guide_basics_body: "§YTargeted Operations§!\nFind registered militants, security commanders, and political figures, learn enough to act, then capture or kill them or sabotage the organizations behind them. Every case follows the same path: find, collect, approve, execute, and deal with the aftermath.\n\n§YGame rule:§! [TOP_rule_mode_name]\n§YLimited Sandbox§!: militants are open targets. State-security subjects need a war or an authored mandate, and political figures need an authored mandate.\n§YFull Sandbox§!: every registered foreign person and organization can be targeted, including serving heads of state.\nOnly human players launch operations. AI countries still protect their people, answer host requests, and react to attacks.\n\n§YThe screen§!\nThe list on the left holds every dossier we have. §YStatus§! shows Active dossiers (an open package or case), Cold ones (known but untouched), or All. §YType§! narrows the list to People or Organizations.\nThe tabs on the right cover the selected subject: §YDossier§! (what we know), §YPackage§! (collection), §YAuthority§! (methods, review, and launch), §YCustody§! (prisoners), §YArchive§! (past operations), and §YSecurity§! (our own defenses).\n\n§YThe short version§!\n1. Pick a Cold dossier and press §YDesignate Case§!.\n2. §YCollect Intelligence§! until every bar reaches 60.\n3. On §YAuthority§!, choose a method and pass review.\n4. Press §YBegin Preparation / Operation§!.\n5. §YConfirm Assessment§! and handle what follows.\n\nSelect any dossier on the left to leave this guide."
 TOP_guide_intelligence_body: "§YThree bars§!\nEvery dossier tracks three bars from 0 to 100:\n§YIdentity§!: are we sure who this is? It never decays.\n§YLocation§!: which state they are in. It loses 5 every 28 days.\n§YPattern of life§!: routine, guards, and openings. It loses 3 every 28 days.\nOrganizations use §YVerification§!, §YFacility location§!, and §YActivity window§! the same way.\nPublic figures start with full identity and nothing else. Knowing a face is not knowing where it sleeps.\n\n§YBuilding a package§!\n§YDesignate Case§! costs §R25 Political Power§! once and turns the dossier into a package. §YCollect Intelligence§! then adds intelligence each collection cycle, about once a month. The focus button picks which bar the work goes to: that bar gets the full gain and the other two get a quarter of it. Up to three packages can collect at once.\nGains rise with an intelligence agency, §YDecryption I§! and §YDecryption II§!, a war or faction tie with the host, Counter-Terror infiltration, and a disrupted command network.\n\n§YWhen is it ready?§!\nA package needs all three bars at 60 or more and a fresh lead. Serving political leaders need 80 in every bar.\nA lead goes §Rstale§! after 56 days. Only Location-focused collection refreshes it, so finish on Location before moving to Authority.\n\n§YOther controls§!\n§YPause Collection§! frees the slot and keeps everything we learned. Resuming is free.\n§YAbandon Package§! closes the package but keeps the dossier and its bars.\n§YRequest Liaison File§! asks the selected partner for their file on this subject. A shared file can only raise our bars, and less reliable sources count for less.\nOn the Dossier tab, hover §YSources§! to see where each bar came from, and open §YHistory§! for every step of the case."
 TOP_guide_authority_body: "§YChoosing a method§!\n§YRemote Strike§!: a lethal stand-off strike, run as a raid.\n§YCapture Raid§!: special forces seize the target alive, run as a raid.\n§YCovert Action§!: a clandestine killing that runs for 28 days.\n§YCapture / Rendition§!: a clandestine capture. Needs special forces and a foreign host.\n§YPartner Operation§!: the host captures the target for us. Only a cooperative host agrees, and it holds the prisoner first.\n§YSabotage§!: organizations only. Use the facility button to pick the objective first.\n§YNovichok Operation§!: Russia only.\nA method stays unavailable until we have a plausible way in. The blocker line under the dossier says what is missing.\n\n§YReview§!\nSubmitting freezes the case. Intelligence, location, and risks are recorded at that moment, and later collection will not change them, so collect first and submit second. A proposal expires after 42 days.\n1. §YIntelligence Review§!: submit the case, send it back for more collection, or withdraw it.\n2. §YHost-State Consultation§!: ask the host for consent or act unilaterally. A target on our own soil goes straight to senior approval.\n3. §YSenior Authorization§!: approve or withhold. A serving political leader gets a final §RAssassination§! page.\nA host may cooperate, tolerate the operation, offer intelligence only, or refuse. Intelligence-only help ends the proposal but adds 20 to location and 5 to the other bars. A refusal puts the target on guard and may reveal who asked.\n\n§YDoctrine§!\nThe four doctrine buttons set how strict review is. §YRestrictive§! and §YStandard§! are always available. §YExpanded§! needs an eligible government or a war. §YDelegated§! needs a war or civil war and skips staff and host review for everyone except political leaders. Changing doctrine costs §R100 Political Power§! and locks it for 365 days."
 TOP_guide_operations_body: "§YLaunching§!\nApproval creates a §Ywaiting mandate§!. Any number can wait, but only one operation can prepare or run at a time.\n§YBegin Preparation / Operation§! rechecks the case and takes that slot.\n§YRemote Strike§! and §YCapture Raid§! become raids on the raid map, which checks equipment, bases, range, and DLC when we launch.\nEvery other method runs on its own for 28 days.\nTo cancel, press §YStand Down§! here instead of cancelling on the map. It closes the case cleanly and frees the slot.\n\n§YHow it resolves§!\nOne intelligence roll is compared with each frozen bar.\nToo little identity: we cannot confirm the target.\nToo little location: nobody is there, or the target has moved.\nToo little pattern of life: a blown window, an escape, a partial result, or civilian harm.\nIf all three hold, the raid or mission itself decides the outcome. Higher bars mean better odds, which is why 80 beats 60.\n\n§YFacility sabotage§!\n§YCommand / Communications§!: damages infrastructure and adds 5 to collection against the group and its members.\n§YTraining / Logistics§!: damages a military factory and adds 10% to success against the group and its members.\n§YFunding / Industrial§!: damages a civilian factory or disrupts resources, and weakens the group's protection.\nAn organization carries one disruption at a time for 90 days, and a new one replaces the old. Sabotage never kills or captures anyone."
 TOP_guide_aftermath_body: "§YResults§!\nCaptures are confirmed at once. Lethal results enter a 14-day damage assessment, which settles how sure we are but never whether the target lived. Press §YConfirm Assessment§! to close the case. The §YArchive§! keeps the last 128 operations.\n\n§YAttribution§!\nEach operation may be traced back to us: unattributed, suspected, credible, or §Rconfirmed§!. A 14-day investigation can raise it one step and never lowers it. Civilian harm (none, limited, severe, or durable) makes the fallout worse once the blame lands on us.\n\n§YLeaders and crises§!\nWhen a serving leader is killed or captured, a successor takes office immediately. Doing this to a head of state or government with credible attribution opens a §Rstrategic crisis§! for the victim, the host, and their partners. War is never automatic. The harshest responses need confirmed attribution, and war options appear only for major powers, nuclear states, alliance members, or authored tripwires.\nPolitical operations traced to us, severe civilian harm, leader captures, and blown operations also open §Yoversight§! at home. Democracies choose to disclose, contain, or suppress. Security states choose an internal review, a scapegoat, or a purge. Suppression can make the investigation worse.\n\n§YCustody§!\nA captured person appears on the §YCustody§! tab. Each prisoner can be exploited once:\n§YExploit: Linked Targets§!: adds 20 intelligence on up to two of their associates we know least about.\n§YExploit: Organization§!: adds 25 to all three of their organization's bars and refreshes its location.\n§YExploit: Disruption§!: a 90-day command disruption with no map damage.\nThen decide their fate. §YProsecute§! removes them for good, §YNegotiate Exchange§! trades them where a deal exists, §YTransfer Custody§! hands them to another country, and §YRelease Prisoner§! frees them, wiping our location data and putting their network on alert."
 TOP_guide_defense_body: "§YDefense§!\nOnly human players launch these operations, so in multiplayer the threat to our people comes from other players. AI countries never attack, but they use these same defenses to protect their own people.\n\n§YPressure§!\nEvery subject reacts when it notices it is being hunted. Each detected step raises pressure: collection 5, review or a host approach 10, preparation 20, and a completed attempt 35. Pressure falls by 5 every 28 days. At 25, 50, and 75 the subject moves more, travels less, hardens its protection, and plants false locations.\n\n§YNational Security§!\nOn the §YSecurity§! tab, buy protective security and counterintelligence separately in three tiers, each for 182 days. Both can run together. Renewing replaces the tier and resets the timer.\nCounterintelligence warnings escalate from unknown interest to a likely foreign service to a likely actor. They never reveal the exact subject, method, or date.\n\n§YVIP details§!\nGuard one serving leader, security official, or public figure for 91 days at §R25 Political Power§! and §R0.25 billion§!. We can run two details at once, plus one each for §YEncryption I§! and §YEncryption II§!.\n\n§YDeception§!\n§YFund Deception§! for 91 days at §R25 Political Power§! and §R0.25 billion§!. While it runs, foreign services tracking our people's locations are more likely to chase a false state."

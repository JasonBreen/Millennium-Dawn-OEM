l_english:
 USA_focus_ai_resilience_mandate:0 "AI Recovery and Resilience Act"
 USA_focus_ai_resilience_mandate_desc:0 "Following the collapse of speculative AI investment, Washington will establish a recovery framework designed to prevent another systemic shock. Private research remains independent, but federal aid must purchase measurable public benefits."
 USA_focus_ai_systemic_risk_board:0 "Monitor Systemic AI Risk"
 USA_focus_ai_systemic_risk_board_desc:0 "The Treasury and Commerce departments will coordinate surveillance of AI financing, procurement bottlenecks, and dangerous concentrations of computing capacity. Public capital cannot underwrite an opaque speculative cycle."
 USA_focus_ai_taxpayer_recovery_rules:0 "No Blank Checks for AI Firms"
 USA_focus_ai_taxpayer_recovery_rules_desc:0 "Any public support for private infrastructure will come with enforceable milestones, recovery clauses, and transparent obligations. Shareholders rather than taxpayers remain responsible for failed speculative bets."
 USA_focus_ai_conditional_financing:0 "Conditional Reconstruction Finance"
 USA_focus_ai_conditional_financing_desc:0 "Federal credit and matching funds will accelerate viable AI infrastructure, but disbursements depend on delivered capacity and independent auditing. The purpose is productive investment rather than indiscriminate rescue."
 USA_focus_ai_protect_global_silicon:0 "Protect the Global Silicon Supply"
 USA_focus_ai_protect_global_silicon_desc:0 "AI demand must not hollow out the supply of semiconductors needed by cars, computers, factories, and consumer electronics. Establish supply monitoring and diversify critical sourcing rather than treating all wafer capacity as expendable."
 USA_focus_ai_foundry_capacity_program:0 "A Second Semiconductor Buildout"
 USA_focus_ai_foundry_capacity_program_desc:0 "Expand fabrication plants, packaging capacity, and memory production so the next expansion in AI compute does not simply bid away the components used by the rest of the technology economy."
 USA_focus_ai_memory_market_safeguards:0 "Memory and Packaging Safeguards"
 USA_focus_ai_memory_market_safeguards_desc:0 "Protect general-purpose memory supplies and advanced packaging capacity through coordinated procurement, domestic reserves, and a more diverse industrial base. A larger AI industry must not require a smaller consumer technology industry."
 USA_focus_ai_public_research_service:0 "National Public AI Research Service"
 USA_focus_ai_public_research_service_desc:0 "Build university and national-laboratory computing capacity open to researchers, smaller developers, and independent institutions. Public research must have its own infrastructure rather than depending on a single private provider."
 USA_focus_ai_grid_for_intelligence:0 "A Grid for Intelligence"
 USA_focus_ai_grid_for_intelligence_desc:0 "Construct power-generation and transmission capacity alongside new public compute centers. Inference infrastructure must grow without requiring permanent shortages or unchecked strain on local electricity markets."
 USA_focus_ai_open_weight_research:0 "Open-Weight Research Grants"
 USA_focus_ai_open_weight_research_desc:0 "Fund open-weight systems, public benchmarks, and portable tooling so AI progress can reach researchers and smaller laboratories outside the largest commercial platforms."
 USA_focus_ai_intelligence_utility_act:0 "The Intelligence Utility Act"
 USA_focus_ai_intelligence_utility_act_desc:0 "Combine capital-market oversight, resilient semiconductor capacity, and publicly financed computing into an enforceable national service framework. Public investment will be measured by availability, affordability, and continuity of access."
 USA_focus_ai_unmetered_public_service:0 "Unmetered Public AI Access"
 USA_focus_ai_unmetered_public_service_desc:0 "Make advanced inference a routinely available public computing service with meaningful access protections and transparent capacity targets. The service is unmetered at ordinary use levels, while infrastructure costs and physical constraints remain real."
 USA_ai_resilience_framework:0 "AI Resilience Framework"
 USA_ai_resilience_framework_desc:0 "A federal coordination framework designed to reduce systemic AI investment risk, with a modest administrative burden."
 USA_ai_systemic_risk_oversight:0 "Systemic AI Risk Oversight"
 USA_ai_systemic_risk_oversight_desc:0 "Procurement transparency and financial oversight improve resilience but increase regulatory overhead."
 USA_ai_conditional_financing_idea:0 "Conditional Reconstruction Finance"
 USA_ai_conditional_financing_idea_desc:0 "Milestone-based public support expands productive compute capacity while requiring sustained public expenditure."
 USA_ai_critical_technology_supply:0 "Critical Technology Supply Protection"
 USA_ai_critical_technology_supply_desc:0 "Sourcing safeguards and targeted coordination preserve component availability outside the AI sector."
 USA_ai_foundry_capacity_partnerships:0 "Foundry Capacity Partnerships"
 USA_ai_foundry_capacity_partnerships_desc:0 "Public and private programs increase fabrication capacity at significant near-term cost."
 USA_ai_consumer_memory_protection:0 "Consumer Memory and Packaging Safeguards"
 USA_ai_consumer_memory_protection_desc:0 "Supply diversification helps other technology producers withstand AI infrastructure demand."
 USA_ai_public_research_network:0 "National Public AI Research Network"
 USA_ai_public_research_network_desc:0 "A publicly financed network of laboratories and academic compute allocations."
 USA_ai_grid_modernization_idea:0 "Intelligence Grid Modernization"
 USA_ai_grid_modernization_idea_desc:0 "Expanded power and transmission capacity increases construction capability as AI electricity demand grows."
 USA_ai_open_weight_research_access:0 "Open-Weight Research Access"
 USA_ai_open_weight_research_access_desc:0 "Publicly funded open research and tools expand the range of institutions able to develop AI systems."
 USA_ai_public_utility_standard:0 "Intelligence Utility Standard"
 USA_ai_public_utility_standard_desc:0 "A public-service framework ties compute investment to continued availability and reliability."
 USA_ai_unmetered_public_service_idea:0 "Unmetered Advanced AI Service"
 USA_ai_unmetered_public_service_idea_desc:0 "Broad public inference access improves research and productivity but increases chip demand, electricity consumption, and ongoing program costs."

 TOP_legacy_person_16_dead_t: "Death of Abu Fatima al-Jaheishi Confirmed"
 TOP_legacy_person_16_dead_d: "The death of Islamic State figure Abu Fatima al-Jaheishi has been confirmed following a targeted operation. The organization must replace the lost experience and contacts while adapting to the disruption."

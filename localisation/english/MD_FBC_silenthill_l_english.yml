l_english:
 FBC_silent_hill_fog: "The Fog"
 FBC_silent_hill_fog_desc: "A fog off Toluca Lake has settled over part of Maine. It slows supply, construction and output, and units there suffer attrition. The thicker it gets, the worse it is."
 FBC_sh_quiet: "Quiet."
 FBC_sh_reported: "Reports on file, awaiting a decision."
 FBC_sh_out_of_reach: "Out of our reach; the case is paused."
 FBC_sh_team_in_town: "A response team is in town."
 FBC_sh_waiting_for_team: "Waiting for a free response team; the case is paused."
 FBC_sh_quarantined: "Under quarantine."
 FBC_sh_covered: "Covered up."
 FBC_sh_answered: "The town has answered."
 FBC_sh_fog_thin: "The fog is thin."
 FBC_sh_fog_heavy: "The fog is §Yheavy§!."
 FBC_sh_fog_thick: "The fog is §Rthick§!."
 FBC_sh_fog_total: "The fog §Rcovers the town§!."
 FBC.30.t: "Three Reports From Toluca County"
 FBC.30.d: "State police have filed three reports on the same lakeside town, and none of them agree. One describes a festival, one an evacuation, and the third a town that no current map shows. All three officers swear they were there on the same afternoon."
 FBC.30.a: "Send a response team."
 FBC.30.a_tt: "A response team goes in for §Y6§! months. While it is there, the fog thins each month.\nThe fog: §G-10§!"
 FBC.30.b: "Quarantine Toluca County."
 FBC.30.b_tt: "The quarantine holds for §Y8§! months, and the fog keeps its pace."
 FBC.30.c: "Lose the reports."
 FBC.30.c_tt: "Exposure: §G-5§!\nFor §Y10§! months, until the town answers, the fog thickens twice as fast."
 FBC.31.t: "The Team Comes Back"
 FBC.31.d: "The response team walked out of the fog after six months with sound equipment, dry boots and no memory of the last three weeks. Their notes are detailed and careful, and written in a hand none of them recognise."
 FBC.31.a: "Debrief them carefully."
 FBC.31.a_tt: "The team is free again.\nContainment integrity: §G+5§!\nThe fog: §G-15§!"
 FBC.32.t: "The Team Does Not Come Back"
 FBC.32.d: "The response team's last transmission came from a hotel room overlooking Toluca Lake. When state troopers reached the room, it was made up for a single guest and the bed had not been slept in."
 FBC.32.a: "List them as missing."
 FBC.32.a_tt: "We raise a new team.\nContainment integrity: §R-10§!\nExposure: §R+5§!\nThe fog: §R+5§!"
 FBC.32.b: "Seal the file."
 FBC.32.b_tt: "We raise a new team.\nContainment integrity: §R-10§!\nExposure: §G-5§!\nThe fog: §R+5§!"
 FBC.33.t: "Someone Walked Through the Line"
 FBC.33.d: "A man walked through our quarantine line in the fog and came out again an hour later. He was carrying a letter from his wife, who died three years ago, asking him to meet her in their special place."
 FBC.33.a: "Reinforce the line."
 FBC.33.a_tt: "The fog: §G-5§!"
 FBC.33.b: "Lift the quarantine."
 FBC.33.b_tt: "Exposure: §R+5§!\nThe fog: §R+10§!"
 FBC.34.t: "The List in the Portland Paper"
 FBC.34.d: "A Portland newspaper has printed the names of people who drove toward Toluca Lake this year and never came home. The reporter has the state police reports we buried, all three of them."
 FBC.34.a: "Discredit the story."
 FBC.34.a_tt: "Exposure: §R+5§!"
 FBC.34.b: "Let it run."
 FBC.34.b_tt: "Exposure: §R+15§!"
 FBC_silent_hill_otherworld: "The Otherworld"
 FBC_silent_hill_otherworld_desc: "The town has turned. Rust where there was paint, and streets that end in nothing. Supply barely reaches it, nothing gets built, and units there suffer badly until it turns back."
 FBC_sh_visitors_few: "Few visitors."
 FBC_sh_visitors_steady: "A §Ysteady stream§! of visitors."
 FBC_sh_visitors_many: "§RMany§! visitors are drawn in."
 FBC_sh_order_unknown: ""
 FBC_sh_order_quiet: "The Order is quiet."
 FBC_sh_order_rising: "The Order is §Ygathering§!."
 FBC_sh_order_ready: "The Order is §Rready§!."
 FBC.35.t: "A Siren Over Toluca County"
 FBC.35.d: "An air raid siren sounded across the county at dusk, though nothing there is wired to one. When it stopped, the fog went dark, and our people inside report rust on every wall and streets that end in drops into nothing. They say it will pass, as it always does."
 FBC.35.a: "Hold position and record everything."
 FBC.35.a_tt: "Seven times in ten the team holds and documents it.\nContainment integrity: §G+5§!\nOtherwise the team is lost and we raise a new one.\nContainment integrity: §R-10§!\nExposure: §R+5§!"
 FBC.35.b: "Pull everyone back to the county line."
 FBC.35.b_tt: "The town answers our intervention §Y2§! months later.\nThe fog: §R+5§!"
 FBC.35.c: "Call it a severe weather alert."
 FBC.35.c_tt: "Exposure: §R+5§!\nVisitors: §R+10§!"
 FBC.36.t: "Letters to Toluca County"
 FBC.36.d: "The post office in Portland has stopped forwarding mail addressed to a town in Toluca County that has no working post office. People keep getting letters from it anyway, in handwriting they know, from people they lost. More of them drive north every month."
 FBC.36.a: "Turn them back at the county line."
 FBC.36.a_tt: "Three quarters of the visitors are sent home.\nExposure: §R+2§!"
 FBC.36.b: "Quietly track who goes in."
 FBC.36.b_tt: "Containment integrity: §G+3§!\nThe Order: §R+5§!"
 FBC.36.c: "Let them come."
 FBC.36.c_tt: "Exposure: §R+5§!\nThe fog: §R+5§!"
 FBC.37.t: "A Congregation in the Fog"
 FBC.37.d: "There is a church in the town that our maps do not show, and it is full on Sundays. The people inside call themselves the Order. They welcome every visitor, they say the town is a gift, and they speak of a rite that will finish what was started at the lake."
 FBC.37.a: "Raid the chapel."
 FBC.37.a_tt: "One response team goes in. The better our containment, the likelier it works.\nOn success, the Order: §G-40§!, the fog: §G-10§!, containment integrity: §G+5§!\nOn failure, containment integrity: §R-10§!, exposure: §R+10§!, the Order: §R+10§!"
 FBC.37.b: "Put someone inside."
 FBC.37.b_tt: "The Order: §G-15§!\nFrom now on the Order grows at half the rate."
 FBC.37.c: "Leave the chapel alone."
 FBC.37.c_tt: "The Order keeps growing while the fog is thick."
 FBC.38.t: "The Rite at Toluca Lake"
 FBC.38.d: "The Order has gone down to the lake. Our informants say the rite needs every visitor the letters brought, and that it is meant to bring something back. The fog is already thicker than our instruments can measure."
 FBC.38.a: "Stop the rite."
 FBC.38.a_tt: "One response team goes in, with even odds.\nOn success, the Order: §G-50§!, the fog: §G-20§!, containment integrity: §G+5§!\nOn failure, the rite is finished: containment integrity: §R-15§!, exposure: §R+5§!, the Order: §G-20§!, the fog: §R+20§! and the Otherworld for §Y60§! days."
 FBC.38.b: "Evacuate Toluca County."
 FBC.38.b_tt: "Every visitor is sent home.\nThe Order: §G-30§!\nThe fog: §R+10§!"
 FBC.38.c: "Let it happen."
 FBC.38.c_tt: "The rite is finished.\nContainment integrity: §R-10§!\nExposure: §R+10§!\nThe Order: §G-40§!\nThe fog: §R+25§! and the Otherworld for §Y60§! days."
 FBC_sh_ended_leave: "Closed. The fog has lifted."
 FBC_sh_ended_water: "Closed. The lake has our investigator, and the town keeps its fog."
 FBC_sh_ended_rebirth: "Closed. Something came back."
 FBC_sh_ended_lights: "Closed. Lights over the lake."
 FBC_sh_ended_dog: "Closed. A dog was behind it all along."
 FBC.39.t: "The Fog Lifts Over Toluca County"
 FBC.39.d: "This morning the state police drove into a lakeside town with a diner, a hospital and an amusement park that has been closed for years. Everything is where the maps say it is. Nobody in town remembers any fog."
 FBC.39.a: "Close the case."
 FBC.39.a_tt: "The case is closed and the fog is gone for good.\nContainment integrity: §G+10§!"
 FBC.39.b: "Keep a quiet watch on the lake."
 FBC.39.b_tt: "The case is closed and the fog is gone for good.\nContainment integrity: §G+5§!\nExposure: §G-10§!"
 FBC.40.t: "In Water"
 FBC.40.d: "Our lead investigator on the Toluca County case drove to the lake at night with the case file on the passenger seat. The car was found at the water's edge with the doors open, and the last page of the file is a letter addressed to us, in the investigator's own hand."
 FBC.40.a: "Close the file."
 FBC.40.a_tt: "The case is closed. The town keeps its fog for good.\nContainment integrity: §R-10§!\nExposure: §G-10§!"
 FBC.40.b: "Drag the lake."
 FBC.40.b_tt: "The case is closed. The town keeps its fog for good.\nContainment integrity: §R-5§!\nThe fog: §G-20§!"
 FBC.41.t: "Rebirth"
 FBC.41.d: "The rite worked. Whatever the Order called up from the lake is walking in Toluca County now, and the town has turned for good around it. Our instruments read nothing at all, which is the most frightening thing they have ever read."
 FBC.41.a: "Seal Toluca County for good."
 FBC.41.a_tt: "The case is closed. The Otherworld covers the town for good.\nExposure: §R+10§!"
 FBC.41.b: "Raze the town."
 FBC.41.b_tt: "The case is closed. The town's roads are torn up and the Otherworld ends.\nThe fog falls to §Y40§!.\nContainment integrity: §R-20§!\nExposure: §R+25§!"
 FBC.42.t: "Lights Over the Lake"
 FBC.42.d: "At two in the morning a ring of lights rose out of the fog over Toluca Lake and left at a speed our radar operators declined to write down. The fog left with it. So did a dog-eared copy of our case file."
 FBC.42.a: "Classify it above anything we have."
 FBC.42.a_tt: "The case is closed and the fog is gone for good.\nExposure: §R+10§!"
 FBC.43.t: "Behind the Curtain"
 FBC.43.d: "Our response team followed a sound through the fog to a room under the town, full of monitors and levers. A Shiba Inu sat at the controls. It looked at them, pressed one last button, and the fog was gone."
 FBC.43.a: "Give him a treat."
 FBC.43.a_tt: "The case is closed and the fog is gone for good.\nContainment integrity: §G+5§!"

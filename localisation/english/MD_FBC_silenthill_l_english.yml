l_english:
 FBC_silent_hill_fog: "The Fog"
 FBC_silent_hill_fog_desc: "A fog off Toluca Lake has settled over part of Maine. It slows supply, construction and output, and units there suffer attrition. The thicker it gets, the worse it is."
 FBC_sh_quiet: "Quiet."
 FBC_sh_reported: "Reports on file, awaiting a decision."
 FBC_sh_out_of_reach: "Out of our reach; the case is paused."
 FBC_sh_team_in_town: "A response team is in town."
 FBC_sh_waiting_for_team: "Waiting for a free response team; the case is paused."
 FBC_sh_quarantined: "Under quarantine."
 FBC_sh_covered: "Covered up."
 FBC_sh_answered: "The town has answered."
 FBC_sh_fog_thin: "The fog is thin."
 FBC_sh_fog_heavy: "The fog is §Yheavy§!."
 FBC_sh_fog_thick: "The fog is §Rthick§!."
 FBC_sh_fog_total: "The fog §Rcovers the town§!."
 FBC.30.t: "Three Reports From Toluca County"
 FBC.30.d: "State police have filed three reports on the same lakeside town, and none of them agree. One describes a festival, one an evacuation, and the third a town that no current map shows. All three officers swear they were there on the same afternoon."
 FBC.30.a: "Send a response team."
 FBC.30.a_tt: "A response team goes in for §Y6§! months. While it is there, the fog thins each month.\nThe fog: §G-10§!"
 FBC.30.b: "Quarantine Toluca County."
 FBC.30.b_tt: "The quarantine holds for §Y8§! months, and the fog keeps its pace."
 FBC.30.c: "Lose the reports."
 FBC.30.c_tt: "Exposure: §G-5§!\nFor §Y10§! months, until the town answers, the fog thickens twice as fast."
 FBC.31.t: "The Team Comes Back"
 FBC.31.d: "The response team walked out of the fog after six months with sound equipment, dry boots and no memory of the last three weeks. Their notes are detailed and careful, and written in a hand none of them recognise."
 FBC.31.a: "Debrief them carefully."
 FBC.31.a_tt: "The team is free again.\nContainment integrity: §G+5§!\nThe fog: §G-15§!"
 FBC.32.t: "The Team Does Not Come Back"
 FBC.32.d: "The response team's last transmission came from a hotel room overlooking Toluca Lake. When state troopers reached the room, it was made up for a single guest and the bed had not been slept in."
 FBC.32.a: "List them as missing."
 FBC.32.a_tt: "We raise a new team.\nContainment integrity: §R-10§!\nExposure: §R+5§!\nThe fog: §R+5§!"
 FBC.32.b: "Seal the file."
 FBC.32.b_tt: "We raise a new team.\nContainment integrity: §R-10§!\nExposure: §G-5§!\nThe fog: §R+5§!"
 FBC.33.t: "Someone Walked Through the Line"
 FBC.33.d: "A man walked through our quarantine line in the fog and came out again an hour later. He was carrying a letter from his wife, who died three years ago, asking him to meet her in their special place."
 FBC.33.a: "Reinforce the line."
 FBC.33.a_tt: "The fog: §G-5§!"
 FBC.33.b: "Lift the quarantine."
 FBC.33.b_tt: "Exposure: §R+5§!\nThe fog: §R+10§!"
 FBC.34.t: "The List in the Portland Paper"
 FBC.34.d: "A Portland newspaper has printed the names of people who drove toward Toluca Lake this year and never came home. The reporter has the state police reports we buried, all three of them."
 FBC.34.a: "Discredit the story."
 FBC.34.a_tt: "Exposure: §R+5§!"
 FBC.34.b: "Let it run."
 FBC.34.b_tt: "Exposure: §R+15§!"

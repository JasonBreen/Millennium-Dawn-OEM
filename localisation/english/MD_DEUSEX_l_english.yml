l_english:
 DEUSEX_preparation_category: "Early Augmentation Research"
 DEUSEX_preparation_category_desc: "These original opening cases begin in 2000, before advanced human augmentation. We are examining prosthetic control trials, their sponsors, and the institutions that decide which records become public."
 DEUSEX_audit_program: "Audit the Research Program"
 DEUSEX_audit_program_desc: "Compare the trial files with contracts and payment records. The work may establish who paid for the research and who can restrict access to its findings."
 DEUSEX_request_exchange: "Request Foreign Trial Records"
 DEUSEX_request_exchange_desc: "After publishing our findings, ask our designated foreign counterpart to compare its records with ours. A reply may clarify whether the same undisclosed interests appear in both programs."
 DEUSEX.1.t: "The Sponsor Missing From the File"
 DEUSEX.1.d: "A federal grant review has turned up two copies of the same prosthetic control trial, each naming a different sponsor. The researchers can account for their equipment, but the office that authorized the second payment has supplied no address. We have a paper trail, not an explanation."
 DEUSEX.1.a: "Open the research file."
 DEUSEX.2.t: "What the Grant Records Show"
 DEUSEX.2.d: "Our audit links the duplicate payment to an intermediary whose other contracts end outside the country. The trial itself is ordinary experimental work; the authority over its records is harder to explain. We must decide how much of that finding to release."
 DEUSEX.2.a: "Publish the funding trail."
 DEUSEX.2.b: "Keep the review within our agencies."
 DEUSEX.3.t: "A Request From China"
 DEUSEX.3.d: "Chinese officials have asked for the sponsor and procurement records behind our prosthetic control trials. Their own shipment files contain a contracting intermediary we have already encountered. Sharing the documents could establish whether the connection goes beyond a name."
 DEUSEX.3.a: "Share the verified records."
 DEUSEX.3.b: "Decline the exchange."
 DEUSEX.4.t: "Germany's Reply"
 DEUSEX.4.accepted.d: "Germany has supplied the requested trial and sponsor records. The two sets of documents are now available to our reviewers, and the exchange has given both governments a reason to keep talking."
 DEUSEX.4.declined.d: "Germany has declined to release the requested records. Our domestic file remains open, but this exchange will take us no further."
 DEUSEX.4.interrupted.d: "The proposed exchange with Germany has ended without a valid transfer. No conclusion about the research can be drawn from the missing reply."
 DEUSEX.4.a: "File the reply."
 DEUSEX_audit_program_available_tt: "Our research file is open and its audit has not begun."
 DEUSEX_audit_program_tt: "Begins a §Y60-day§! audit. Its findings will require a public or domestic review policy."
 DEUSEX_request_exchange_available_tt: "Our designated counterpart exists, has opened its research file, and is at peace with us."
 DEUSEX_request_exchange_tt: "Sends one request for foreign records, arriving in §Y1 day§!. The recipient decides whether to accept."
 DEUSEX_public_review_tt: "Publishes our findings. Stability falls by §R1%§!, and one request for foreign records becomes available."
 DEUSEX_domestic_review_tt: "Keeps our findings within the state. Stability rises by §G1%§!. This policy does not permit a request for foreign records."
 DEUSEX_accept_exchange_tt: "Costs §R10§! Political Power. Both governments gain §G20§! opinion of each other if the exchange can still proceed."
 DEUSEX_decline_exchange_tt: "Declines the request without an additional cost or opinion penalty. A request that can no longer proceed is closed as interrupted."
 DEUSEX.4.accepted_unavailable.d: "Germany accepted our request before the channel closed. The acceptance remains on file, but it offers no assurance of cooperation under the present circumstances."

l_english:
 IMP_council_category: "Intermarium Council"
 IMP_council_category_desc: "The §YIntermarium Council§! brings NATO's eastern flank together to plan its own defense projects. It is a forum inside NATO, not a separate alliance: NATO alone decides membership, wars and collective defense. Full members must be in NATO. Neighbors outside NATO can join as associates, without any NATO guarantee.\n\n[IMP_council_status]"
 IMP_council_status_active: "Chair: §Y[?global.IMP_chair.GetNameWithFlag]§!\nCouncil fund: £treasury §Y[?global.IMP_fund|1]§! billion\n\nBaltic Military Mobility: stage §Y[?global.IMP_mobility_stage|0]§!/3\nIntegrated Air Defense: stage §Y[?global.IMP_air_stage|0]§!/3\nJoint Procurement: stage §Y[?global.IMP_procurement_stage|0]§!/3\nCybersecurity Task Force: stage §Y[?global.IMP_cyber_stage|0]§!/3"
 IMP_council_status_unfounded: "The council has not been founded."
 IMP_found_council: "Found the Intermarium Council"
 IMP_found_council_desc: "Call the eastern flank's NATO members into a standing council of their own, with a chair and a shared fund for regional defense projects."
 IMP_found_council_partner_tt: "Another regional NATO member could join as a full member"
 IMP_found_council_tt: "We take the §Ychair§! of the new §YIntermarium Council§! and can invite regional NATO members as full members and other neighbors as associates. Our NATO membership is unchanged."
 IMP_invite_full_member: "Invite [FROM.GetNameWithFlag] as a Full Member"
 IMP_invite_full_member_desc: "Offer [FROM.GetName] a full seat on the council. Only NATO members can hold one. An associate that has joined NATO since can be upgraded this way."
 IMP_invite_associate: "Invite [FROM.GetNameWithFlag] as an Associate"
 IMP_invite_associate_desc: "Offer [FROM.GetName] a place at the council's meetings and projects. Associates are not covered by NATO's guarantees and gain no NATO membership."
 IMP_contribute_to_fund: "Contribute to the Council Fund"
 IMP_contribute_to_fund_desc: "Pay into the shared fund that will finance the council's regional defense projects."
 IMP_contribute_to_fund_tt: "Adds the same amount to the §YCouncil Fund§!, which holds £treasury §Y[?global.IMP_fund|1]§! billion."
 IMP_transfer_chair: "Hand the Chair to [FROM.GetNameWithFlag]"
 IMP_transfer_chair_desc: "Pass the council's chair to [FROM.GetName], who will issue its invitations from now on."
 IMP_transfer_chair_tt: "[FROM.GetNameWithFlag] becomes the §Ychair§! of the §YIntermarium Council§!."
 IMP_leave_council: "Leave the Intermarium Council"
 IMP_leave_council_desc: "Give up our place on the council. Our NATO membership is unaffected."
 IMP_leave_council_chair_tt: "The full member with the largest economy takes the §Ychair§!. If no full member remains, the council §Rdissolves§! and its fund is lost."
 IMP_full_member: "Intermarium Council Member"
 IMP_full_member_desc: "We hold a full seat on the Intermarium Council, the eastern flank's forum inside NATO."
 IMP_full_member_tt: "Full members fund the council, vote on its programs and share all four program bonuses. The seat §Rlapses§! if we leave NATO or become a subject."
 IMP_associate: "Intermarium Council Associate"
 IMP_associate_desc: "We take part in the Intermarium Council's meetings and projects without belonging to NATO."
 IMP_associate_tt: "Associates gain §Rno§! NATO membership, guarantee or technology sharing. We share only the Baltic Military Mobility and Cybersecurity Task Force bonuses and cannot vote. If we join NATO, the chair can invite us to a full seat."
 IMP.10.t: "Invitation to the Intermarium Council"
 IMP.10.d: "[FROM.GetNameWithFlag] invites us to a full seat on the Intermarium Council. Its members coordinate the eastern flank's defense inside NATO and pool money for joint projects."
 IMP.10.a: "Take the seat."
 IMP.10.b: "Decline the invitation."
 IMP.11.t: "Associate Status in the Intermarium Council"
 IMP.11.d: "[FROM.GetNameWithFlag] invites us to join the Intermarium Council as an associate. We would sit in on its meetings and projects, but NATO would owe us nothing."
 IMP.11.a: "Join as an associate."
 IMP.11.b: "Decline the invitation."
 IMP.12.t: "[FROM.GetName] Joins the Council"
 IMP.12.d_full: "[FROM.GetNameWithFlag] has accepted our invitation and holds a full seat on the Intermarium Council."
 IMP.12.d_associate: "[FROM.GetNameWithFlag] has accepted our invitation and takes part in the Intermarium Council as an associate."
 IMP.12.a: "Welcome aboard."
 IMP.13.t: "[FROM.GetName] Declines"
 IMP.13.d: "[FROM.GetNameWithFlag] has declined our invitation to the Intermarium Council. We may ask again later."
 IMP.13.a: "Perhaps another time."
 IMP.14.t: "[FROM.GetName] Could Not Join"
 IMP.14.d: "[FROM.GetNameWithFlag] accepted our invitation, but no longer met the council's terms by the time it answered, or the council had dissolved. Its standing with the council is unchanged."
 IMP.14.a: "Unfortunate."
 IMP.30.t: "We Chair the Intermarium Council"
 IMP.30.d: "The chair of the Intermarium Council has passed to us. We now issue its invitations and set its course."
 IMP.30.a: "We accept the responsibility."
 IMP.32.t: "The Intermarium Council Dissolves"
 IMP.32.d: "No full members remain on the Intermarium Council, and it has dissolved. Our associate status ends with it."
 IMP.32.a: "So it ends."
 IMP.40.t: "Our Council Seat Lapses"
 IMP.40.d: "A full seat on the Intermarium Council requires NATO membership and independence. We no longer meet those terms, and our seat has lapsed."
 IMP.40.a: "Understood."
 IMP_council_programs: "Intermarium Council Programs"
 IMP_associate_programs: "Intermarium Council Partnership"
 IMP_track_mobility: "Baltic Military Mobility"
 IMP_track_air: "Integrated Air Defense"
 IMP_track_procurement: "Joint Procurement"
 IMP_track_cyber: "Cybersecurity Task Force"
 IMP_no_vote_open_tt: "No council vote is under way"
 IMP_mobility_ready_tt: "§Y[?global.IMP_mobility_ready|0]§! full members have capital infrastructure above §Y2§!, counted monthly. Two are needed for the first stage, three for the second and four for the third."
 IMP_air_ready_tt: "§Y[?global.IMP_air_ready|0]§! full members own a radar station, counted monthly. Two are needed for the first stage, three for the second and four for the third."
 IMP_procurement_ready_tt: "§Y[?global.IMP_procurement_ready|0]§! full members have more than §Y2§! military factories, counted monthly. Two are needed for the first stage, three for the second and four for the third."
 IMP_cyber_ready_tt: "§Y[?global.IMP_cyber_ready|0]§! full members have a cyber capability, counted monthly. Two are needed for the first stage, three for the second and four for the third."
 IMP_track_fund_tt: "The council fund covers the stage: £treasury §Y0.5§!, §Y1.25§! or §Y2§! billion for the first, second and third"
 IMP_propose_mobility: "Propose: Baltic Military Mobility"
 IMP_propose_mobility_desc: "Ask the council to fund the next stage of the eastern flank's road and rail corridors, so reinforcements can reach the front in days rather than weeks."
 IMP_propose_mobility_tt: "Full members vote over §Y30§! days. If the proposal passes, the fund pays for the stage, and full members and associates build §Ginfrastructure and railways 5%§! faster per stage."
 IMP_propose_air: "Propose: Integrated Air Defense"
 IMP_propose_air_desc: "Ask the council to fund the next stage of a shared air picture: linked radars, common training and coordinated air defense."
 IMP_propose_air_tt: "Full members vote over §Y30§! days. If the proposal passes, the fund pays for the stage, and full members gain §G5%§! static anti-air hit chance and radar construction speed per stage."
 IMP_propose_procurement: "Propose: Joint Procurement"
 IMP_propose_procurement_desc: "Ask the council to fund the next stage of common standards and joint tenders for the members' defense industries."
 IMP_propose_procurement_tt: "Full members vote over §Y30§! days. If the proposal passes, the fund pays for the stage, and full members gain §G3%§! factory efficiency growth per stage. From the second stage, full members also share research in the §YIntermarium Research Group§!."
 IMP_tech_share_name: "Intermarium Research Group"
 IMP_tech_share_desc: "Full members of the Intermarium Council pool defense research under the Joint Procurement program."
 IMP_propose_cyber: "Propose: Cybersecurity Task Force"
 IMP_propose_cyber_desc: "Ask the council to fund the next stage of a joint cyber task force for incident response and counterintelligence."
 IMP_propose_cyber_tt: "Full members vote over §Y30§! days. If the proposal passes, the fund pays for the stage. Full members and associates gain §G2§! cyber defense rating per stage, and full members gain §G5%§! enemy operative detection chance per stage."
 IMP.20.t: "Council Vote: [IMP_vote_track_name]"
 IMP.20.d: "[event_target:IMP_vote_proposer.GetNameWithFlag] asks the Intermarium Council to fund the next stage of §Y[IMP_vote_track_name]§! from the council fund. Every full member has one vote, and a tie passes."
 IMP.20.a: "Vote in favor."
 IMP.20.b: "Vote against."
 IMP.22.t: "Council Approves [IMP_result_track_name]"
 IMP.22.d: "The Intermarium Council has approved and funded the next stage of §Y[IMP_result_track_name]§!. Its members share the gains through the council's programs."
 IMP.22.a: "Good."
 IMP.23.t: "Council Rejects [IMP_result_track_name]"
 IMP.23.d: "The Intermarium Council has voted down the next stage of §Y[IMP_result_track_name]§!. The fund keeps its money for another proposal."
 IMP.23.a: "Understood."

 imp_view_council: "Open the Intermarium Council"
 imp_view_council_desc: "Open the council dashboard beside our decisions. Review membership, funds, voting and program requirements. Founding, invitations, contributions and proposals remain in the Intermarium Council category."
 imp_nato_view_council: "Regional Pacts: Intermarium Council"
 imp_nato_view_council_desc: "Open the Intermarium Council dashboard. This regional council leaves NATO membership, accession ratification and collective defense unchanged. Use the Intermarium Council decision category for council actions."

l_english:
 RULE_OEM_NEURAL_AVIATION: "Experimental Neural Aviation"
 RULE_OEM_NEURAL_AVIATION_DISABLED: "Disabled"
 RULE_OEM_NEURAL_AVIATION_DISABLED_DESC: "Neural Flight Control and the national neural aviation programs remain inactive."
 RULE_OEM_NEURAL_AVIATION_ENABLED: "Enabled"
 RULE_OEM_NEURAL_AVIATION_ENABLED_DESC: "With By Blood Alone, countries can research Neural Flight Control and produce manned fighters with neural-assisted avionics. The United States, China, Russia, United Kingdom, France, Germany, Japan, and India also gain national research programs and AI support."
 oem_sp_neural_flight_control: "Neural Flight Control"
 oem_sp_neural_flight_control_desc: "Develop a pilot-operated neural flight interface that improves fighter response and coordination. The finished project unlocks an avionics module; aircraft still require a new design and normal production."
 oem_avionics_neural_assisted_1: "Neural-Assisted Avionics"
 oem_avionics_neural_assisted_1_desc: "A neural link helps a pilot interpret sensor data and control the aircraft. It improves agility, attack, and air superiority at the cost of more microchips, weight, production effort, and lower reliability."
 OEM_NEURAL_AUTONOMY_EXCLUSIVE: "Neural-assisted avionics cannot be combined with fully autonomous flight control."
 OEM_NEURAL_MANNED_FIGHTERS_ONLY: "Neural-assisted avionics require a manned fighter or interceptor airframe."

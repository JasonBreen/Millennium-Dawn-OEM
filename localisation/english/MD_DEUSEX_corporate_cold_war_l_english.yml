 DEUSEX_cc_USA_investigation: "The Undeclared Sponsor"
 DEUSEX_cc_USA_investigation_desc: "A biomedical research contract conceals its beneficial owner behind a security annex. Investigators must compare the funding chain with the laboratory's declared sponsors. Spend 25 Political Power on a 60-day investigation. The report offers independent scrutiny, controlled international disclosure, or an exclusive corporate arrangement. Unfinished preparation closes unprepared in 2027."
 DEUSEX.60.a: "Require independent scrutiny."
 DEUSEX.60.a_tt: "Immediate: establish a safety protocol and reduce Illuminati influence by 10. Later: while Neuropozyne funding is active, a participating augmentation host halves its existing shortage roll from 4% to 2%. Verified 2027 preparation can reduce the Aug Incident stability loss by 2 percentage points."
 DEUSEX.60.b: "Authorize controlled international disclosure."
 DEUSEX.60.b_tt: "Immediate: preserve corporate evidence and add 10 conspiracy exposure. Later: one additional consenting records exchange with GER becomes available, and this evidence assists the 2027 case."
 DEUSEX.60.c: "Accept an exclusive corporate arrangement."
 DEUSEX.60.c_tt: "Immediate: Illuminati influence rises by 10. Later: USA or China receives 10 adoption when its existing augmentation industry opens; Germany receives no industry or adoption."
 DEUSEX.60.t: "The Undeclared Sponsor"
 DEUSEX.60.d: "A biomedical research contract conceals its beneficial owner behind a security annex. Investigators must compare the funding chain with the laboratory's declared sponsors. The complete file now establishes who controlled the work and which safeguards were omitted. Our government must choose an independent safety review, a controlled release of the record, or an exclusive corporate relationship. These are original governmental cases preceding the later augmentation crises."
 DEUSEX_cc_USA_exchange: "Request an additional corporate records exchange"
 DEUSEX_cc_USA_exchange_desc: "Spend 25 Political Power to request a controlled records exchange with GER. The recipient may accept for 25 Political Power or refuse freely. Acceptance preserves evidence for both governments and improves relations. Refusal, war, disappearance, or 60 days without consent closes the request without evidence or replay."
 DEUSEX.63.a: "Consent to the controlled exchange."
 DEUSEX.63.a_tt: "Immediate: spend 25 Political Power, preserve evidence for both governments, and improve mutual relations. Later: each government may use the record in its 2027 case."
 DEUSEX.63.b: "Refuse and close the request."
 DEUSEX.63.b_tt: "Immediate: close the request without penalty. No records or benefits are delivered."
 DEUSEX.63.t: "Corporate Records: A Consent Request"
 DEUSEX.63.d: "USA requests a controlled comparison of biomedical contract and safety records. The request grants no automatic access. We can supply a national record under a protected disclosure protocol or refuse and end the exchange. This does not replace our own investigation."
 DEUSEX.66.a: "Verify the safety record independently."
 DEUSEX.66.a_tt: "Available through August 2, 2027. Immediate: spend 25 Political Power on a 60-day safety verification. Later: a completed independent protocol or preserved corporate evidence verifies safety preparation; a USA/China augmentation host reduces the existing incident stability loss by 2 percentage points. Germany preserves regulatory evidence."
 DEUSEX.66.b: "Protect patients and disclose the corporate evidence."
 DEUSEX.66.b_tt: "Available through August 2, 2027. Immediate: authorize 50 Political Power for 60 days of patient protection and controlled disclosure; preserved evidence refunds 25 Political Power. Later: reduce Illuminati influence by 10 and preserve patient evidence."
 DEUSEX.66.c: "Defer to the corporate account."
 DEUSEX.66.c_tt: "Immediate: close the crisis file on the corporate account and add 10 Illuminati influence. No safety verification or evidence is gained."
 DEUSEX.66.t: "The Corporate Cold War, 2027"
 DEUSEX.66.d: "The attack on Sarif Industries has exposed gaps between biomedical security assurances and the surviving laboratory record. Federal investigators must establish who sponsored the work and protect surviving personnel. [DEUSEX_cc_evidence_status] Start either 60-day intervention by August 2 to finish before the October crisis. The safety review may limit civilian harm; it cannot prevent the Aug Incident or replace the later Human Restoration Act."

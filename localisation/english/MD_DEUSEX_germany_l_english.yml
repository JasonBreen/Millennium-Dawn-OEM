 DEUSEX.20.t: "The Second Safety Dossier"
 DEUSEX.20.d: "A prosthetic control trial has reached our regulators with two safety dossiers carrying the same measurements and different sponsors. The laboratory stands by its results, but neither sponsor will identify the office that requested the duplicate submission. The discrepancy belongs in a review before it becomes a precedent."
 DEUSEX.20.a: "Compare the safety dossiers."
 DEUSEX.21.t: "The Undeclared Sponsor"
 DEUSEX.21.d: "Our audit confirms that the duplicate submission was commissioned outside the laboratory's declared agreement. Its payment records lead through a foreign intermediary rather than a second experiment. We must decide whether to publish that trail or retain it within the state."
 DEUSEX.21.a: "Publish the sponsor records."
 DEUSEX.21.b: "Keep the review within our agencies."
 DEUSEX.22.t: "A Request From the United States"
 DEUSEX.22.d: "American officials have asked for the sponsor records behind our duplicate safety dossier. They have encountered the same intermediary in a grant review. Sharing the verified documents could clarify who had authority over both files."
 DEUSEX.22.a: "Share the verified records."
 DEUSEX.22.b: "Decline the exchange."
 DEUSEX.23.t: "China's Reply"
 DEUSEX.23.accepted.d: "China has supplied its shipment and authorization records. Our reviewers can compare them with the safety dossier, and the completed exchange has improved relations between both governments."
 DEUSEX.23.declined.d: "China has declined to release the requested records. We retain our domestic findings, but this exchange will take us no further."
 DEUSEX.23.interrupted.d: "The proposed exchange with China has ended without a valid transfer. The missing reply offers no evidence about the sponsor's purpose."
 DEUSEX.23.a: "File the reply."
 DEUSEX.23.accepted_unavailable.d: "China accepted our request before the channel closed. The acceptance remains on file, but it offers no assurance of cooperation under the present circumstances."

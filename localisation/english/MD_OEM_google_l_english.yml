l_english:
 USA_google_events.1.t: "AdWords and the Auction Machine"
 USA_google_events.1.d: "Google's search business is growing, but infrastructure and talent costs are rising faster than investor patience. The company can sell ads like a portal, or it can make intent the central unit and let price discovery happen at scale. An auction model would tie revenue directly to query volume and relevance, turning every product into a subsidized growth vector. The decision will define whether Google behaves like a media company, an enterprise software firm, or a new kind of market operator."
 USA_google_events.1.a: "Commit to keyword auctions and quality scoring"
 USA_google_events.1.a_tt: "AdWords becomes the company's financial engine and strengthens long-run strategic autonomy."
 USA_google_events.1.b: "Run a curated portal-style ad inventory"
 USA_google_events.1.b_tt: "Revenue becomes easier to explain to advertisers, but platform leverage grows more slowly."
 USA_google_events.1.c: "Prioritize enterprise ad tooling over open auctions"
 USA_google_events.1.c_tt: "Google tilts toward negotiated enterprise contracts instead of a universal auction market."

 USA_google_events.2.t: "2004 IPO: Capital Without Control"
 USA_google_events.2.d: "The IPO can fund data centers, acquisitions, and global expansion, but it also opens the door to investor discipline. Founders propose a dual-class structure designed to keep voting control inside the company even after public listing. Critics argue this weakens accountability, while supporters call it a constitutional design for mission continuity. The board must decide whether outside capital is a partner, a constraint, or a threat to long-horizon strategy."
 USA_google_events.2.a: "Lock in the dual-class charter"
 USA_google_events.2.a_tt: "Google raises public capital while preserving internal command authority."
 USA_google_events.2.b: "Offer stronger shareholder concessions"
 USA_google_events.2.b_tt: "Institutional investors gain more leverage over corporate decisions."
 USA_google_events.2.c: "Commit to a future single-class transition"
 USA_google_events.2.c_tt: "Control diffuses over time, trading autonomy for market legitimacy."

 USA_google_events.3.t: "Android for Almost Nothing"
 USA_google_events.3.d: "Android can be held as a premium stack, licensed aggressively, or released broadly to shape the whole handset ecosystem. Giving it away will not maximize near-term licensing income, but it can anchor search and services on billions of devices. A closed approach offers tighter integration and cleaner monetization, while open distribution creates reach and bargaining power. This choice determines whether Google treats mobile as a product line or as geopolitical infrastructure."
 USA_google_events.3.a: "Give Android away and build scale"
 USA_google_events.3.a_tt: "Open distribution maximizes ecosystem reach and long-term platform depth."
 USA_google_events.3.b: "Keep Android premium and tightly integrated"
 USA_google_events.3.b_tt: "Control rises, but partner alignment and internal support become harder to maintain."
 USA_google_events.3.c: "Monetize Android through strict licensing"
 USA_google_events.3.c_tt: "Licensing cash improves, but broad ecosystem influence shrinks."

 USA_google_events.4.t: "YouTube: Purchase the Firehose or Build Slowly"
 USA_google_events.4.d: "YouTube has already captured user behavior that no internal incubator can quickly reproduce. Acquiring it means inheriting legal exposure, moderation headaches, and infrastructure costs at global scale. Building in-house is cleaner in governance terms but risks conceding video to competitors. The board must decide whether distribution gravity is worth paying for before policy institutions can keep up."
 USA_google_events.4.a: "Acquire YouTube and scale first"
 USA_google_events.4.a_tt: "Google secures global video distribution and expands its infrastructure footprint."
 USA_google_events.4.b: "Acquire, but front-load rights and trust systems"
 USA_google_events.4.b_tt: "Governance capacity improves at the cost of near-term political capital."
 USA_google_events.4.c: "Decline the deal and build internally"
 USA_google_events.4.c_tt: "Operational risk falls, but network effects and growth momentum are lost."

 USA_google_events.5.t: "China 2006: Enter on Censorship Terms"
 USA_google_events.5.d: "Beijing offers market access under rules that require filtered search results and local legal compliance. Entering means influence, users, and data exposure in a critical market, but also visible concessions on speech. Refusing preserves reputational coherence, yet it cedes ground to domestic competitors and weakens policy leverage. Google is now making a foreign-policy choice with corporate instruments."
 USA_google_events.5.a: "Enter fully under local censorship rules"
 USA_google_events.5.a_tt: "Market access expands, but internal legitimacy and workforce confidence decline."
 USA_google_events.5.b: "Enter with limited compliance and formal review clauses"
 USA_google_events.5.b_tt: "Google stays in market while reserving room for later policy confrontation."
 USA_google_events.5.c: "Refuse entry on censorship grounds"
 USA_google_events.5.c_tt: "Normative consistency rises, but market influence in China is surrendered."

 USA_google_events.6.t: "2010 Intrusion: Stay, Exit, or Escalate"
 USA_google_events.6.d: "A state-linked intrusion campaign targets corporate systems and dissident accounts, forcing a direct security confrontation. Leaving China signals limits on what the company will trade for access, but it also forfeits operational presence. Staying under hardened controls preserves a seat in market but deepens internal conflict over values. Google must choose whether its red lines are rhetorical or binding."
 USA_google_events.6.a: "Withdraw search operations from mainland China"
 USA_google_events.6.a_tt: "Google exits under protest, restoring internal trust while reducing market reach."
 USA_google_events.6.b: "Stay in-market with hardened security and compliance"
 USA_google_events.6.b_tt: "Presence is preserved, but workforce resistance intensifies and veto risk rises."
 USA_google_events.6.c: "Remain while proposing joint technical probes"
 USA_google_events.6.c_tt: "Google keeps optionality, accepting friction with both governments and staff."

 USA_google_events.7.t: "Motorola: Patents, Hardware, or No Deal"
 USA_google_events.7.d: "Motorola offers a large patent portfolio that can defend Android from litigation pressure, but the price is high and hardware integration is uncertain. Buying for patents and later divesting devices is financially defensible but politically awkward. Keeping the hardware business could reshape Google's role in manufacturing and carrier politics. The acquisition is less about phones than about legal sovereignty over the mobile stack."
 USA_google_events.7.a: "Buy for patents, then plan an orderly exit"
 USA_google_events.7.a_tt: "Defensive IP depth improves while preserving a platform-first strategy."
 USA_google_events.7.b: "Buy and commit to a lasting hardware push"
 USA_google_events.7.b_tt: "Vertical integration increases, but internal consensus and execution risk worsen."
 USA_google_events.7.c: "Walk away from Motorola entirely"
 USA_google_events.7.c_tt: "Capital is preserved, but Android remains more exposed to external pressure."

 USA_google_events.8.t: "Snowden Disclosures and Traffic Access"
 USA_google_events.8.d: "The Snowden disclosures reveal the depth of state collection programs touching major platform traffic. Quiet cooperation may preserve government ties, but it damages employee trust and public legitimacy. Legal resistance and transparency reports can rebuild credibility, yet invite retaliation and regulatory strain. The company must define whether it is an infrastructure adjunct to state power or an independent communications custodian."
 USA_google_events.8.a: "Cooperate quietly and manage fallout"
 USA_google_events.8.a_tt: "Government alignment improves, but workforce consent drops sharply."
 USA_google_events.8.b: "Contest requests through courts and procedure"
 USA_google_events.8.b_tt: "Institutional conflict rises, but internal legitimacy improves."
 USA_google_events.8.c: "Push public transparency and harden user protections"
 USA_google_events.8.c_tt: "Trust rebuilding accelerates while political and operational costs increase."

 USA_google_events.9.t: "Alphabet: Reorganize the State Within the Firm"
 USA_google_events.9.d: "As Google expands into life sciences, autonomous systems, and moonshots, a single operating chart no longer reflects actual power. A holding structure can isolate risk and clarify capital allocation, but it also formalizes an internal federation of semi-sovereign units. Keeping everything under one command promises speed, while spinouts can satisfy market pressure at the cost of strategic coherence. The reorganization determines how governable the empire remains."
 USA_google_events.9.a: "Create Alphabet and ring-fence subsidiaries"
 USA_google_events.9.a_tt: "Strategic control is preserved through structured internal federalism."
 USA_google_events.9.b: "Keep one integrated Google command"
 USA_google_events.9.b_tt: "Execution centralizes, but complexity pressure migrates into operations."
 USA_google_events.9.c: "Spin out non-core bets for market discipline"
 USA_google_events.9.c_tt: "Balance-sheet pressure eases while long-term optionality narrows."

 USA_google_events.10.t: "Project Maven: State Contract or Workforce Red Line"
 USA_google_events.10.d: "Defense agencies request imagery-analysis support, framing it as national security and technical necessity. Accepting can deepen state ties and open strategic procurement channels, but many employees see lethal-use adjacency as unacceptable. A limited scope might preserve both legitimacy and access, yet may satisfy neither side. The workforce has become a constituency with veto power, and this contract tests where authority actually sits."
 USA_google_events.10.a: "Accept full defense AI participation"
 USA_google_events.10.a_tt: "State alignment and military relevance rise, but workforce consent drops and veto risk may lock out future government work."
 USA_google_events.10.b: "Accept only tightly bounded non-lethal scopes"
 USA_google_events.10.b_tt: "Google keeps a government lane while reducing, not removing, internal backlash."
 USA_google_events.10.c: "Decline the contract and codify limits"
 USA_google_events.10.c_tt: "Workforce cohesion improves, but defense influence and policy leverage decline."

 USA_google_events.11.t: "China Re-entry Prototype: Dragonfly"
 USA_google_events.11.d: "A censored search prototype could reopen China access years after withdrawal, but the internal legitimacy costs are immediate and severe. Proponents argue that partial presence still serves users and preserves diplomatic channels. Opponents argue that engineered censorship normalizes state coercion and breaks prior commitments. This is again corporate foreign policy, and the workforce can still overrule the board."
 USA_google_events.11.a: "Greenlight full re-entry prototype work"
 USA_google_events.11.a_tt: "China access prospects improve, but workforce consent can collapse into a hard veto."
 USA_google_events.11.b: "Pursue a guardrailed pilot with explicit escalation clauses"
 USA_google_events.11.b_tt: "Google keeps diplomatic optionality while accepting persistent internal contestation."
 USA_google_events.11.c: "Cancel Dragonfly and reaffirm withdrawal"
 USA_google_events.11.c_tt: "Internal trust recovers, but strategic influence in China contracts again."

 USA_google_events.12.t: "DeepMind and the AI Race"
 USA_google_events.12.d: "DeepMind gives Google frontier research capacity that competitors struggle to replicate. A frontier-first strategy can secure technical leadership, but it also raises governance burdens and geopolitical scrutiny. A safety-heavy path slows deployment while strengthening institutional legitimacy. A product-first pivot can monetize quickly, though it risks ceding the high ground in core model capability."
 USA_google_events.12.a: "Prioritize a full frontier capability push"
 USA_google_events.12.a_tt: "Leadership potential rises with greater compute and strategic concentration."
 USA_google_events.12.b: "Prioritize safety governance and staged deployment"
 USA_google_events.12.b_tt: "Internal legitimacy and caution improve at the expense of speed."
 USA_google_events.12.c: "Shift DeepMind toward near-term products"
 USA_google_events.12.c_tt: "Commercial returns accelerate while frontier ambition narrows."

 USA_google_events.13.t: "European Competition Rulings"
 USA_google_events.13.d: "European regulators move against search tying, Android bundling, and ad-market conduct with escalating penalties. Fast compliance can stabilize operations but may formalize external constraints on platform design. Litigation can defend precedent and delay costs, while unbundling preempts harsher remedies at the price of internal disruption. The decision is whether to absorb, resist, or redesign the model under pressure."
 USA_google_events.13.a: "Comply quickly and normalize the fines"
 USA_google_events.13.a_tt: "Regulatory heat cools, but political leverage and margin flexibility decline."
 USA_google_events.13.b: "Litigate aggressively across jurisdictions"
 USA_google_events.13.b_tt: "Autonomy is defended, with prolonged legal and diplomatic friction."
 USA_google_events.13.c: "Preemptively unbundle key platform surfaces"
 USA_google_events.13.c_tt: "Intervention risk falls, but integration advantages and scale efficiencies weaken."

 USA_google_events.14.t: "US Antitrust: The Search Trial"
 USA_google_events.14.d: "The Justice Department's search case has reached trial, challenging the default agreements that place Google on browsers and mobile devices. A negotiated settlement could preserve much of the distribution model under new constraints, while defending the agreements in court may protect Google's control but deepen institutional conflict; an early structural offer could relieve political pressure at the cost of an integrated platform. Liability has not yet been decided."
 USA_google_events.14.a: "Negotiate limits on distribution agreements"
 USA_google_events.14.a_tt: "Conflict de-escalates, but strategic freedom in search placement narrows."
 USA_google_events.14.b: "Defend the agreements at trial"
 USA_google_events.14.b_tt: "Control claims are preserved at the cost of prolonged institutional conflict."
 USA_google_events.14.c: "Offer a structural separation package"
 USA_google_events.14.c_tt: "Political pressure eases, but integrated platform power is reduced."

 USA_google_events.15.t: "TPUs and the Sovereign Compute Stack"
 USA_google_events.15.d: "General-purpose supplier dependence is now a strategic vulnerability, and TPUs offer an internal compute path tied to Google's own priorities. Scaling custom silicon can lock in performance and bargaining leverage, but requires durable capex and political scrutiny. A partnered model shares burden and diffuses risk, while asset-light dependence preserves flexibility but weakens chokepoint positioning. The choice determines whether Google owns a critical layer of national compute infrastructure."
 USA_google_events.15.a: "Scale a sovereign TPU-first programme"
 USA_google_events.15.a_tt: "Custom silicon depth and sovereign control over compute infrastructure increase."
 USA_google_events.15.b: "Build TPUs with broader partner co-development"
 USA_google_events.15.b_tt: "Compute capacity grows with shared governance and stronger internal consent."
 USA_google_events.15.c: "Stay asset-light and rent leading accelerators"
 USA_google_events.15.c_tt: "Capex pressure falls, but strategic compute autonomy erodes."

 USA_google_events.16.t: "Submarine Cables as State-Relevant Infrastructure"
 USA_google_events.16.d: "Owning or co-owning transoceanic cable routes shifts Google from software platform to physical network actor. An allied consortium mesh improves resilience and diplomatic alignment, while state-backed corridors can prioritize security at the cost of internal backlash. Leasing capacity avoids geopolitical exposure but leaves strategic throughput in other hands. This is no longer a product decision; it is infrastructure policy by corporate means."
 USA_google_events.16.a: "Expand an allied consortium cable mesh"
 USA_google_events.16.a_tt: "Physical network control and sovereign infrastructure leverage increase."
 USA_google_events.16.b: "Build state-backed protected corridors"
 USA_google_events.16.b_tt: "Security alignment deepens, but workforce consent falls and government-work veto risk increases."
 USA_google_events.16.c: "Lease capacity and avoid ownership exposure"
 USA_google_events.16.c_tt: "Political burden drops, but strategic route control remains limited."

 USA_google_events.17.t: "Waymo: The Autonomous Vehicle Bet"
 USA_google_events.17.d: "Waymo represents Google's largest bet on physical-world AI, with the potential to redefine urban mobility and logistics. Full investment could establish dominance in a trillion-dollar market, but requires sustained capital, regulatory navigation, and safety validation at scale. Partnered development shares burden and risk, while minimal investment preserves focus on core competencies. The decision determines whether Google owns the stack or merely enables it."
 USA_google_events.17.a: "Commit to full autonomous vehicle development"
 USA_google_events.17.a_tt: "Infrastructure depth and sovereign posture expand, but workforce consent declines and political capital is spent."
 USA_google_events.17.b: "Pursue partnered development with automakers"
 USA_google_events.17.b_tt: "Moderate infrastructure gains with improved workforce consent and shared execution risk."
 USA_google_events.17.c: "Maintain minimal investment in autonomous systems"
 USA_google_events.17.c_tt: "Preserve workforce consent and political flexibility while limiting infrastructure exposure."

 USA_google_events.18.t: "Vertex AI: The Enterprise Platform Play"
 USA_google_events.18.d: "Vertex AI unifies Google's machine learning services into a coherent enterprise offering, competing directly with AWS SageMaker and Azure ML. A full platform push could make Google Cloud the default choice for enterprise AI, but requires heavy investment in sales, support, and compliance tooling. A partnered approach leverages existing cloud relationships, while an open ecosystem strategy prioritizes developer adoption over proprietary lock-in."
 USA_google_events.18.a: "Build a full Vertex AI platform with proprietary advantages"
 USA_google_events.18.a_tt: "Infrastructure depth and sovereign posture expand significantly, but workforce consent declines."
 USA_google_events.18.b: "Develop Vertex with cloud partner integrations"
 USA_google_events.18.b_tt: "Balanced infrastructure growth with improved workforce consent and partner alignment."
 USA_google_events.18.c: "Promote open ecosystem over proprietary platform"
 USA_google_events.18.c_tt: "Maximize workforce consent and openness while reducing direct infrastructure control."

 USA_google_events.19.t: "Bard Enters the Consumer AI Race"
 USA_google_events.19.d: "Microsoft's Copilot integration and OpenAI's consumer momentum have forced Google to accelerate its own LLM deployment. Full Bard integration across all products could preserve search dominance and create new interaction paradigms, but risks quality issues, workforce backlash over safety concerns, and regulatory scrutiny. A partnered ecosystem approach shares the burden, while open competition preserves optionality but may cede ground to first-movers."
 USA_google_events.19.a: "Fully integrate Bard across all Google products"
 USA_google_events.19.a_tt: "Infrastructure depth expands dramatically, but workforce consent may collapse and trigger government work veto."
 USA_google_events.19.b: "Build Bard as a partnered ecosystem with selective integration"
 USA_google_events.19.b_tt: "Moderate infrastructure gains with improved workforce consent and controlled execution risk."
 USA_google_events.19.c: "Promote open competition and avoid proprietary lock-in"
 USA_google_events.19.c_tt: "Preserve workforce consent and openness while accepting limited platform control."

 USA_google_events.20.t: "The Search Remedies Trial"
 USA_google_events.20.d: "After the 2024 liability ruling, the 2025 remedies trial will determine how Google's default search agreements and distribution practices must change. Settlement could preserve core economics under negotiated constraints, continued litigation could limit the remedy or invite tougher terms, and voluntary separation could reset the political contest at the cost of integration."
 USA_google_events.20.a: "Settle with behavioral remedies and ongoing oversight"
 USA_google_events.20.a_tt: "Sovereign posture and workforce consent improve with political resolution."
 USA_google_events.20.b: "Fight the case through prolonged litigation"
 USA_google_events.20.b_tt: "Sovereign posture declines with prolonged conflict, but platform integrity is preserved."
 USA_google_events.20.c: "Offer structural separation to preempt harsher remedies"
 USA_google_events.20.c_tt: "Platform scale declines significantly, but political pressure eases and workforce consent improves."

l_english:
 USA_google_events.1.t: "AdWords and the Auction Machine"
 USA_google_events.1.d: "Google's search business is growing while infrastructure and staffing costs rise. The company must choose between keyword auctions, curated advertising, and enterprise sales as the basis of its revenue."
 USA_google_events.1.a: "Commit to keyword auctions and quality scoring"
 USA_google_events.1.a_tt: "Sovereign Posture: §G+1§!."
 USA_google_events.1.b: "Run a curated portal-style ad inventory"
 USA_google_events.1.b_tt: "Sovereign Posture: §R-1§!\nWorkforce Consent: §G+1§!."
 USA_google_events.1.c: "Prioritize enterprise ad tooling over open auctions"
 USA_google_events.1.c_tt: "Sovereign Posture: §R-1§!."

 USA_google_events.2.t: "2004 IPO: Capital Without Control"
 USA_google_events.2.d: "The IPO can fund data centers, acquisitions, and global expansion, but public investors will demand greater accountability. A dual-class share structure would raise capital while preserving the founders' voting control."
 USA_google_events.2.a: "Lock in the dual-class charter"
 USA_google_events.2.a_tt: "Political Power: §G+10§!\nSovereign Posture: §G+1§!."
 USA_google_events.2.b: "Offer stronger shareholder concessions"
 USA_google_events.2.b_tt: "Stability: §G+0.5%§!\nWorkforce Consent: §R-1§!."
 USA_google_events.2.c: "Commit to a future single-class transition"
 USA_google_events.2.c_tt: "Political Power: §R-15§!\nSovereign Posture: §R-2§!\nWorkforce Consent: §G+1§!."

 USA_google_events.3.t: "Android for Almost Nothing"
 USA_google_events.3.d: "Google can distribute Android freely, reserve it for tightly integrated devices, or charge manufacturers for strict licenses. Broad distribution sacrifices licensing revenue but can place Google Search and services on far more phones."
 USA_google_events.3.a: "Give Android away and build scale"
 USA_google_events.3.a_tt: "Infrastructure Depth: §G+1§!\nWorkforce Consent: §G+1§!."
 USA_google_events.3.b: "Keep Android premium and tightly integrated"
 USA_google_events.3.b_tt: "Sovereign Posture: §G+1§!\nWorkforce Consent: §R-1§!."
 USA_google_events.3.c: "Monetize Android through strict licensing"
 USA_google_events.3.c_tt: "Political Power: §G+15§!\nSovereign Posture: §R-1§!."

 USA_google_events.4.t: "YouTube: Purchase the Firehose or Build Slowly"
 USA_google_events.4.d: "YouTube already has an audience that an internal video service may struggle to reproduce. Acquisition brings copyright, moderation, and infrastructure costs, while building internally risks conceding online video to competitors."
 USA_google_events.4.a: "Acquire YouTube and scale first"
 USA_google_events.4.a_tt: "Infrastructure Depth: §G+1§!\nSovereign Posture: §G+1§!."
 USA_google_events.4.b: "Acquire, but front-load rights and trust systems"
 USA_google_events.4.b_tt: "Political Power: §R-10§!\nWorkforce Consent: §G+1§!."
 USA_google_events.4.c: "Decline the deal and build internally"
 USA_google_events.4.c_tt: "Stability: §R-0.5%§!\nInfrastructure Depth: §R-1§!."

 USA_google_events.5.t: "China 2006: Enter on Censorship Terms"
 USA_google_events.5.d: "Operating a search service in China requires filtered results and compliance with local law. Entry offers access to users but requires concessions on speech, while refusal leaves the market to domestic competitors."
 USA_google_events.5.a: "Enter fully under local censorship rules"
 USA_google_events.5.a_tt: "Workforce Consent: §R-2§!\nSovereign Posture: §G+1§!."
 USA_google_events.5.b: "Enter with limited compliance and formal review clauses"
 USA_google_events.5.b_tt: "Political Power: §R-10§!\nWorkforce Consent: §R-1§!\nSovereign Posture: §G+1§!."
 USA_google_events.5.c: "Refuse entry on censorship grounds"
 USA_google_events.5.c_tt: "Political Power: §G+15§!\nWorkforce Consent: §G+1§!\nSovereign Posture: §R-1§!."

 USA_google_events.6.t: "2010 Intrusion: Stay, Exit, or Escalate"
 USA_google_events.6.d: "A state-linked intrusion campaign has targeted Google's systems and accounts belonging to dissidents. Google can withdraw search operations, remain under tighter security controls, or seek a joint technical investigation."
 USA_google_events.6.a: "Withdraw search operations from mainland China"
 USA_google_events.6.a_tt: "Workforce Consent: §G+2§!\nSovereign Posture: §R-1§!."
 USA_google_events.6.b: "Stay in-market with hardened security and compliance"
 USA_google_events.6.b_tt: "Workforce Consent: §R-2§!\nSovereign Posture: §G+2§!\nIf Workforce Consent falls to §Y1§! or lower, bar future government work."
 USA_google_events.6.c: "Remain while proposing joint technical probes"
 USA_google_events.6.c_tt: "Political Power: §R-10§!\nWorkforce Consent: §R-1§!\nSovereign Posture: §G+1§!."

 USA_google_events.7.t: "Motorola: Patents, Hardware, or No Deal"
 USA_google_events.7.d: "Motorola's patent portfolio could defend Android from litigation, but the acquisition price is high and hardware integration is uncertain. Google can buy for patents and later sell the device business, retain a lasting hardware division, or abandon the deal."
 USA_google_events.7.a: "Buy for patents, then plan an orderly exit"
 USA_google_events.7.a_tt: "Political Power: §G+10§!\nSovereign Posture: §G+1§!."
 USA_google_events.7.b: "Buy and commit to a lasting hardware push"
 USA_google_events.7.b_tt: "Infrastructure Depth: §G+1§!\nWorkforce Consent: §R-1§!."
 USA_google_events.7.c: "Walk away from Motorola entirely"
 USA_google_events.7.c_tt: "Stability: §R-0.5%§!\nSovereign Posture: §R-1§!."

 USA_google_events.8.t: "Snowden Disclosures and Traffic Access"
 USA_google_events.8.d: "The Snowden disclosures have exposed government collection programs affecting traffic handled by major technology companies. Google can cooperate quietly, contest requests in court, or publish more information while strengthening user protections."
 USA_google_events.8.a: "Cooperate quietly and manage fallout"
 USA_google_events.8.a_tt: "War Support: §G+0.5%§!\nWorkforce Consent: §R-2§!."
 USA_google_events.8.b: "Contest requests through courts and procedure"
 USA_google_events.8.b_tt: "Political Power: §R-10§!\nWorkforce Consent: §G+1§!\nSovereign Posture: §R-1§!."
 USA_google_events.8.c: "Push public transparency and harden user protections"
 USA_google_events.8.c_tt: "Stability: §R-0.5%§!\nWorkforce Consent: §G+2§!\nSovereign Posture: §R-1§!."

 USA_google_events.9.t: "Alphabet: Reorganize the State Within the Firm"
 USA_google_events.9.d: "Google now manages search alongside life sciences, autonomous systems, and other experimental businesses. An Alphabet holding company can separate their budgets and risks, while an integrated company or independent spinouts offer different levels of central control."
 USA_google_events.9.a: "Create Alphabet and ring-fence subsidiaries"
 USA_google_events.9.a_tt: "Sovereign Posture: §G+1§!\nWorkforce Consent: §G+1§!."
 USA_google_events.9.b: "Keep one integrated Google command"
 USA_google_events.9.b_tt: "Political Power: §G+10§!\nInfrastructure Depth: §G+1§!."
 USA_google_events.9.c: "Spin out non-core bets for market discipline"
 USA_google_events.9.c_tt: "Political Power: §R-15§!\nSovereign Posture: §R-1§!."

 USA_google_events.10.t: "Project Maven: State Contract or Workforce Red Line"
 USA_google_events.10.d: "The Department of Defense has requested imagery-analysis support through Project Maven. Google can accept full participation, restrict the work to defined non-lethal uses, or decline the contract in response to employee objections."
 USA_google_events.10.a: "Accept full defense AI participation"
 USA_google_events.10.a_tt: "War Support: §G+1%§!\nWorkforce Consent: §R-3§!\nSovereign Posture: §G+2§!\nIf Workforce Consent falls to §Y1§! or lower, bar future government work."
 USA_google_events.10.b: "Accept only tightly bounded non-lethal scopes"
 USA_google_events.10.b_tt: "War Support: §G+0.5%§!\nWorkforce Consent: §R-1§!\nSovereign Posture: §G+1§!\nIf Workforce Consent falls to §Y1§! or lower, bar future government work."
 USA_google_events.10.c: "Decline the contract and codify limits"
 USA_google_events.10.c_tt: "Political Power: §R-10§!\nWorkforce Consent: §G+2§!\nSovereign Posture: §R-1§!."

 USA_google_events.11.t: "China Re-entry Prototype: Dragonfly"
 USA_google_events.11.d: "A censored search prototype could restore access to China years after Google's withdrawal. Supporters favor a limited return, while employees and critics argue that the project would break the company's earlier commitments on censorship."
 USA_google_events.11.a: "Greenlight full re-entry prototype work"
 USA_google_events.11.a_tt: "Workforce Consent: §R-3§!\nSovereign Posture: §G+2§!\nIf Workforce Consent falls to §Y1§! or lower, bar future government work."
 USA_google_events.11.b: "Pursue a guardrailed pilot with explicit escalation clauses"
 USA_google_events.11.b_tt: "Political Power: §R-10§!\nWorkforce Consent: §R-1§!\nSovereign Posture: §G+1§!."
 USA_google_events.11.c: "Cancel Dragonfly and reaffirm withdrawal"
 USA_google_events.11.c_tt: "Political Power: §G+10§!\nWorkforce Consent: §G+2§!\nSovereign Posture: §R-1§!."

 USA_google_events.12.t: "DeepMind and the AI Race"
 USA_google_events.12.d: "DeepMind gives Google a major artificial-intelligence research organization. Google can prioritize new model capabilities, emphasize safety and staged deployment, or direct more of the laboratory's work toward near-term products."
 USA_google_events.12.a: "Prioritize a full frontier capability push"
 USA_google_events.12.a_tt: "Infrastructure Depth: §G+1§!\nSovereign Posture: §G+1§!."
 USA_google_events.12.b: "Prioritize safety governance and staged deployment"
 USA_google_events.12.b_tt: "Workforce Consent: §G+1§!\nSovereign Posture: §R-1§!."
 USA_google_events.12.c: "Shift DeepMind toward near-term products"
 USA_google_events.12.c_tt: "Political Power: §G+10§!\nWorkforce Consent: §R-1§!."

 USA_google_events.13.t: "European Competition Rulings"
 USA_google_events.13.d: "European regulators are challenging Google's search placement, Android bundling, and advertising practices. Google can comply, continue litigation, or unbundle services before regulators impose stronger remedies."
 USA_google_events.13.a: "Comply quickly and normalize the fines"
 USA_google_events.13.a_tt: "Political Power: §R-10§!\nWorkforce Consent: §G+1§!."
 USA_google_events.13.b: "Litigate aggressively across jurisdictions"
 USA_google_events.13.b_tt: "Political Power: §G+15§!\nSovereign Posture: §G+1§!."
 USA_google_events.13.c: "Preemptively unbundle key platform surfaces"
 USA_google_events.13.c_tt: "Stability: §R-0.5%§!\nInfrastructure Depth: §R-1§!\nWorkforce Consent: §G+1§!."

 USA_google_events.14.t: "US Antitrust: The Search Ruling"
 USA_google_events.14.d: "A federal court has found that Google unlawfully maintained its search monopoly through default-distribution agreements. Liability has been decided, but Google can still negotiate remedies, litigate and appeal, or offer a structural separation."
 USA_google_events.14.a: "Negotiate distribution remedies"
 USA_google_events.14.a_tt: "Political Power: §R-10§!\nSovereign Posture: §R-1§!."
 USA_google_events.14.b: "Contest remedies and appeal the ruling"
 USA_google_events.14.b_tt: "Political Power: §G+10§!\nSovereign Posture: §G+1§!."
 USA_google_events.14.c: "Offer a structural separation package"
 USA_google_events.14.c_tt: "Stability: §R-1%§!\nWorkforce Consent: §G+2§!\nInfrastructure Depth: §R-2§!."

 USA_google_events.15.t: "TPUs and the Sovereign Compute Stack"
 USA_google_events.15.d: "Tensor Processing Units give Google an internal alternative to general-purpose accelerator suppliers. The company can expand its own silicon, share development with partners, or continue renting leading external hardware."
 USA_google_events.15.a: "Scale a sovereign TPU-first programme"
 USA_google_events.15.a_tt: "Infrastructure Depth: §G+2§!\nSovereign Posture: §G+2§!."
 USA_google_events.15.b: "Build TPUs with broader partner co-development"
 USA_google_events.15.b_tt: "Infrastructure Depth: §G+1§!\nSovereign Posture: §G+1§!\nWorkforce Consent: §G+1§!."
 USA_google_events.15.c: "Stay asset-light and rent leading accelerators"
 USA_google_events.15.c_tt: "Political Power: §G+10§!\nInfrastructure Depth: §R-1§!\nSovereign Posture: §R-1§!."

 USA_google_events.16.t: "Submarine Cables as State-Relevant Infrastructure"
 USA_google_events.16.d: "Owning transoceanic cables gives Google greater control over physical network capacity. Allied consortia, government-backed protected routes, and leased capacity offer different balances of cost, security, and operational control."
 USA_google_events.16.a: "Expand an allied consortium cable mesh"
 USA_google_events.16.a_tt: "Infrastructure Depth: §G+2§!\nSovereign Posture: §G+1§!."
 USA_google_events.16.b: "Build state-backed protected corridors"
 USA_google_events.16.b_tt: "Infrastructure Depth: §G+2§!\nSovereign Posture: §G+2§!\nWorkforce Consent: §R-1§!\nIf Workforce Consent falls to §Y1§! or lower, bar future government work."
 USA_google_events.16.c: "Lease capacity and avoid ownership exposure"
 USA_google_events.16.c_tt: "Political Power: §G+10§!\nInfrastructure Depth: §R-1§!\nSovereign Posture: §R-1§!."

 USA_google_events.17.t: "Waymo: The Autonomous Vehicle Bet"
 USA_google_events.17.d: "Waymo requires sustained investment, regulatory approval, and extensive safety testing before autonomous vehicles can operate at scale. Google can develop the technology directly, share the work with automakers, or reduce investment."
 USA_google_events.17.a: "Commit to full autonomous vehicle development"
 USA_google_events.17.a_tt: "Political Power: §R-15§!\nStability: §R-0.5%§!\nInfrastructure Depth: §G+2§!\nSovereign Posture: §G+1§!\nWorkforce Consent: §R-1§!."
 USA_google_events.17.b: "Pursue partnered development with automakers"
 USA_google_events.17.b_tt: "Political Power: §R-5§!\nInfrastructure Depth: §G+1§!\nSovereign Posture: §G+1§!\nWorkforce Consent: §G+1§!."
 USA_google_events.17.c: "Maintain minimal investment in autonomous systems"
 USA_google_events.17.c_tt: "Political Power: §G+10§!\nStability: §G+0.5%§!\nSovereign Posture: §R-1§!\nWorkforce Consent: §G+2§!."

 USA_google_events.18.t: "Vertex AI: The Enterprise Platform Play"
 USA_google_events.18.d: "Vertex AI combines Google's machine-learning services for enterprise customers in competition with AWS and Microsoft. Google can build a proprietary service, emphasize partner integrations, or prioritize open tools for wider developer adoption."
 USA_google_events.18.a: "Build a full Vertex AI platform with proprietary advantages"
 USA_google_events.18.a_tt: "Political Power: §R-20§!\nStability: §R-1%§!\nInfrastructure Depth: §G+2§!\nSovereign Posture: §G+2§!\nWorkforce Consent: §R-2§!."
 USA_google_events.18.b: "Develop Vertex with cloud partner integrations"
 USA_google_events.18.b_tt: "Political Power: §R-10§!\nInfrastructure Depth: §G+1§!\nSovereign Posture: §G+1§!\nWorkforce Consent: §G+1§!."
 USA_google_events.18.c: "Promote open ecosystem over proprietary platform"
 USA_google_events.18.c_tt: "Political Power: §G+5§!\nStability: §G+1%§!\nSovereign Posture: §R-1§!\nWorkforce Consent: §G+2§!\nEcosystem Openness: §G+2§!."

 USA_google_events.19.t: "Bard Enters the Consumer AI Race"
 USA_google_events.19.d: "Microsoft and OpenAI have increased pressure on Google to release its own consumer language model. Bard can be integrated across Google products, developed with outside partners, or kept within a more open and competitive market."
 USA_google_events.19.a: "Fully integrate Bard across all Google products"
 USA_google_events.19.a_tt: "Political Power: §R-25§!\nStability: §R-1.5%§!\nInfrastructure Depth: §G+3§!\nSovereign Posture: §G+2§!\nWorkforce Consent: §R-3§!\nIf Workforce Consent falls to §Y2§! or lower, bar future government work."
 USA_google_events.19.b: "Build Bard as a partnered ecosystem with selective integration"
 USA_google_events.19.b_tt: "Political Power: §R-10§!\nStability: §R-0.5%§!\nInfrastructure Depth: §G+1§!\nSovereign Posture: §G+1§!\nWorkforce Consent: §G+1§!\nEcosystem Openness: §G+1§!."
 USA_google_events.19.c: "Promote open competition and avoid proprietary lock-in"
 USA_google_events.19.c_tt: "Political Power: §G+10§!\nStability: §G+1%§!\nSovereign Posture: §R-1§!\nWorkforce Consent: §G+2§!\nEcosystem Openness: §G+2§!."

 USA_google_events.20.t: "The Search Remedies Trial"
 USA_google_events.20.d: "After the 2024 liability ruling, the 2025 remedies trial will determine how Google's default-search agreements and distribution practices must change. Google can settle under continuing oversight, litigate the remedy, or offer a structural separation."
 USA_google_events.20.a: "Settle with behavioral remedies and ongoing oversight"
 USA_google_events.20.a_tt: "Political Power: §G+15§!\nStability: §G+2%§!\nSovereign Posture: §G+1§!\nWorkforce Consent: §G+2§!\nPolicy Access: §G+2§!."
 USA_google_events.20.b: "Fight the case through prolonged litigation"
 USA_google_events.20.b_tt: "Political Power: §R-10§!\nStability: §R-1%§!\nSovereign Posture: §R-1§!\nWorkforce Consent: §R-1§!\nPolicy Access: §R-2§!."
 USA_google_events.20.c: "Offer structural separation to preempt harsher remedies"
 USA_google_events.20.c_tt: "Political Power: §R-5§!\nSovereign Posture: §R-2§!\nWorkforce Consent: §G+1§!\nPolicy Access: §R-1§!\nPlatform Scale: §R-2§!."

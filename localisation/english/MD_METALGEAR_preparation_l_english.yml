l_english:
 METALGEAR_usa_category: "Defense Procurement Review"
 METALGEAR_usa_category_desc: "This original 2000 opening follows gaps in our weapons procurement records. A national review can prepare the government for the Shadow Moses crisis in 2005; the Patriots network remains a separate responsibility."
 METALGEAR_usa_review: "Review the Weapons Contracts"
 METALGEAR_usa_review_desc: "Compare the procurement files with the authorizations held by military oversight. We need to know where a project can proceed without a complete government record."
 METALGEAR_usa_request: "Request Japanese Export Records"
 METALGEAR_usa_request_desc: "Ask Japan to compare its export licenses with our weapons contracts. We can request the records once we choose a cooperative review policy."
 METALGEAR_review_unlocked_tt: "Opens our national procurement review."
 METALGEAR_review_available_tt: "Our national procurement review is open and has not begun."
 METALGEAR_review_start_tt: "Begins a §Y60-day§! review. Its findings will require a policy decision."
 METALGEAR_review_cooperative_tt: "Completes our preparation and permits one request for foreign records. This does not guarantee that the other government will agree."
 METALGEAR_review_classified_tt: "Completes our preparation and keeps the findings classified. Stability rises by §G1%§!. We cannot request foreign records through this review."
 METALGEAR_request_exchange_tt: "Sends one request for foreign records. The recipient decides whether to accept; a reply follows."
 METALGEAR_accept_exchange_tt: "Costs §R10§! Political Power. Both governments gain §G20§! opinion of each other."
 METALGEAR_decline_exchange_tt: "Declines the request without an additional cost or opinion penalty."
 METALGEAR_exchange_interrupted_tt: "Closes an exchange that can no longer proceed. No records or diplomatic benefit are granted."
 METALGEAR.4.t: "The Unaccounted Weapons Contract"
 METALGEAR.4.d: "A procurement clerk has found a weapons contract with a delivery authorization but no corresponding oversight file. The supplier recognizes the payment reference and refuses to identify the office that approved it. We have a missing chain of authority to investigate."
 METALGEAR.4.a: "Open the procurement review."
 METALGEAR.5.t: "The Gap in Oversight"
 METALGEAR.5.d: "Our reviewers have reconstructed the contract, but its approval passed through an office absent from the military reporting chain. Foreign components provide a second trail. We can pursue that trail with another government or keep the findings classified."
 METALGEAR.5.a: "Prepare a cooperative review."
 METALGEAR.5.b: "Classify the findings."
 METALGEAR.6.t: "A Request From Russia"
 METALGEAR.6.d: "Russian officials have asked to compare an archived military contract with our procurement findings. Their file names a contracting intermediary that also appears in our records. Sharing the documents may establish which approvals the two files have in common."
 METALGEAR.6.a: "Share the verified records."
 METALGEAR.6.b: "Decline the exchange."
 METALGEAR.6.c: "Close the interrupted exchange."
 METALGEAR.7.t: "Japan's Reply"
 METALGEAR.7.d_accepted: "Japan has supplied the requested export records. We can compare the delivery licenses with our contract, and the completed exchange has improved relations between both governments."
 METALGEAR.7.d_declined: "Japan has declined to release the requested export records. Our review remains complete, but this exchange will take us no further."
 METALGEAR.7.d_interrupted: "The proposed exchange with Japan has ended without a valid transfer. We retain our national findings, but have no foreign records to add."
 METALGEAR.7.a: "File the reply."
 METALGEAR_supply_records_tt: "Costs §R10§! Political Power and supplies our records to the American response. If the United States promised disclosure, its final report can improve relations or damage them if withheld."
 METALGEAR_withhold_records_tt: "Withholds our records without a Political Power cost. We receive no diplomatic reward for supplying them."
 METALGEAR_crisis_interrupted_tt: "Closes our part in a response that can no longer proceed. No successful outcome or diplomatic reward is granted."
 METALGEAR.8.t: "Shadow Moses Response Interrupted"
 METALGEAR.8.d: "Our response lost the authority required to proceed before its final report was completed. The original crisis file cannot certify a completed American operation or promise an account of its outcome. It closes as interrupted."
 METALGEAR.8.a: "Archive the interrupted response."

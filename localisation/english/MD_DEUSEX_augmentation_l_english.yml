l_english:
 DEUSEX_augmentation_category: "Augmentation Industry"
 DEUSEX_augmentation_category_desc: "Mechanical augmentation has left the laboratory. Our adoption stands at §Y[?DEUSEX_aug_adoption|0]§! and anti-augmentation unrest at §Y[?DEUSEX_aug_unrest|0]§!, both out of 100. Adoption raises research speed and factory output, and with a military programme, army attack and defence. Unrest lowers stability, and it grows every month with adoption."
 DEUSEX_fund_augmentation_research: "Fund Augmentation Research"
 DEUSEX_fund_augmentation_research_desc: "Underwrite clinical trials, neural interface work and the clinics that fit the results. Every grant puts more augmented workers into our factories and laboratories."
 DEUSEX_military_augmentation_programme: "Military Augmentation Programme"
 DEUSEX_military_augmentation_programme_desc: "Offer combat augmentation to volunteers in the armed forces. Augmented soldiers see further, move faster and survive wounds that would kill anyone else."
 DEUSEX_fund_neuropozyne: "Fund Neuropozyne for the Augmented"
 DEUSEX_fund_neuropozyne_desc: "Every augmented citizen needs Neuropozyne to keep the body from rejecting the implant, and VersaLife sets the price. A public programme would take that fear off the street, at the treasury's expense."
 DEUSEX_end_neuropozyne_funding: "End Public Neuropozyne Funding"
 DEUSEX_end_neuropozyne_funding_desc: "Return the cost of Neuropozyne to patients and their insurers."
 DEUSEX_suppress_anti_augmentation_groups: "Suppress Anti-Augmentation Groups"
 DEUSEX_suppress_anti_augmentation_groups_desc: "Arrest the organizers behind the attacks on clinics and augmented workers, and shut down the networks that fund them."
 DEUSEX_adoption_below_full_tt: "Augmentation adoption is below §Y100§!."
 DEUSEX_adoption_40_tt: "Augmentation adoption is at least §Y40§!."
 DEUSEX_unrest_20_tt: "Anti-augmentation unrest is at least §Y20§!."
 DEUSEX_adoption_plus_10_tt: "Augmentation adoption: §G+10§!"
 DEUSEX_military_augmentation_programme_tt: "The §YAugmentation Industry§! adds up to §G+8%§! army attack and defence, growing with adoption."
 DEUSEX_fund_neuropozyne_tt: "Each month the treasury pays §R0.015 billion§! per point of adoption, and anti-augmentation unrest grows at §Ghalf§! the rate."
 DEUSEX_end_neuropozyne_funding_tt: "The treasury stops paying for Neuropozyne, and anti-augmentation unrest grows at the full rate again."
 DEUSEX_unrest_minus_20_tt: "Anti-augmentation unrest: §G-20§!"
 DEUSEX_unrest_minus_30_tt: "Anti-augmentation unrest: §G-30§!"
 DEUSEX_unrest_plus_15_tt: "Anti-augmentation unrest: §R+15§!"
 DEUSEX_unrest_plus_20_tt: "Anti-augmentation unrest: §R+20§!"
 DEUSEX_unrest_plus_40_tt: "Anti-augmentation unrest: §R+40§!"
 DEUSEX_open_20_tt: "Augmentation adoption starts at §G20§!.\nWe gain the §YAugmentation Industry§!: up to §G+10%§! research speed and §G+5%§! factory output as adoption grows, and up to §R-15%§! stability from anti-augmentation unrest."
 DEUSEX_open_10_tt: "Augmentation adoption starts at §Y10§!.\nWe gain the §YAugmentation Industry§!: up to §G+10%§! research speed and §G+5%§! factory output as adoption grows, and up to §R-15%§! stability from anti-augmentation unrest."
 DEUSEX_concede_regulation_tt: "Augmentation adoption: §R-10§!\nAnti-augmentation unrest: §G-40§!"
 DEUSEX_biochip_recall_tt: "Augmentation adoption: §R-30§!\nAnti-augmentation unrest: §G-20§!"
 DEUSEX_state_of_emergency_tt: "Augmentation adoption: §R-10§!\nAnti-augmentation unrest: §R+10§!"
 DEUSEX_restoration_act_tt: "Augmentation adoption: §R-50§!\nAnti-augmentation unrest: §G-50§!\nPublic Neuropozyne funding ends, and we can no longer fund augmentation research or start a military programme."
 DEUSEX_augmentation_industry: "Augmentation Industry"
 DEUSEX_augmentation_industry_desc: "Augmentation adoption: §Y[?DEUSEX_aug_adoption|0]§! of 100. Anti-augmentation unrest: §Y[?DEUSEX_aug_unrest|0]§! of 100.\nResearch speed and factory output grow with adoption, and so does army attack and defence once a military programme starts. Stability falls as unrest rises."
 DEUSEX.30.t: "Sarif Industries Comes to Detroit"
 DEUSEX.30.d: "David Sarif has opened Sarif Industries in Detroit, promising to rebuild the city on mechanical augmentation. His mentor is Hugh Darrow, the man whose work made modern prosthetics possible. Sarif wants a federal research contract to go with his new plant."
 DEUSEX.30.a: "Sign the federal contract."
 DEUSEX.30.b: "Let the market decide."
 DEUSEX.31.t: "Tai Yong Medical in Hengsha"
 DEUSEX.31.d: "Tai Yong Medical has made Hengsha the center of its augmentation business, and its chief executive, Zhao Yun Ru, wants the state behind it. A partnership would give our planners a seat at the table and the company a guaranteed market."
 DEUSEX.31.a: "Make Tai Yong a state partner."
 DEUSEX.31.b: "Keep the company at arm's length."
 DEUSEX.32.t: "Neuropozyne Runs Short"
 DEUSEX.32.d: "VersaLife has cut its Neuropozyne shipments, and pharmacies are turning away augmented patients. Without the drug their bodies begin to reject the implants. VersaLife will restore supply at a premium."
 DEUSEX.32.a: "Pay VersaLife's price."
 DEUSEX.32.b: "Ration what we have."
 DEUSEX.33.t: "Riots Against the Augmented"
 DEUSEX.33.d_usa: "Purity First has turned a march through Detroit into a riot. Zeke Sanders' followers smashed a LIMB clinic and beat augmented workers outside the Sarif plant. Humanity Front's William Taggart condemns the violence and calls for strict regulation of augmentation."
 DEUSEX.33.d_chi: "Crowds in Lower Hengsha have attacked augmentation clinics and the workers who use them. The protesters blame the augmented for lost jobs and the clinics for ruined lives. Belltower patrols are holding the upper city, but the anger is spreading."
 DEUSEX.33.a: "Restore order."
 DEUSEX.33.b: "Promise new regulations."
 DEUSEX.34.t: "The Aug Incident"
 DEUSEX.34.d: "A signal broadcast from Hugh Darrow's Panchaea facility in the Arctic Ocean has driven augmented people into violent delusion. In our cities they attacked strangers, their families and themselves. Hospitals are overwhelmed, and the public is turning on everyone with an implant."
 DEUSEX.34.a: "Recall the biochips."
 DEUSEX.34.b: "Declare a state of emergency."
 DEUSEX.35.t: "The Aug Incident"
 DEUSEX.35.d: "Augmented people around the world turned violent at the same moment, driven by a signal from the Panchaea facility. Millions are dead or maimed, and every government is asking who sent it."
 DEUSEX.35.a: "Somebody was pulling the strings."
 DEUSEX.36.t: "The Human Restoration Act"
 DEUSEX.36.d: "Two years after the Aug Incident, the United Nations is pressing members to adopt the Human Restoration Act. It would require every augmented person to accept a control chip or move to a designated facility, and it would end public support for augmentation. Its supporters call it public safety; its opponents call it mechanical apartheid."
 DEUSEX.36.a: "Adopt the Human Restoration Act."
 DEUSEX.36.b: "Protect our augmented citizens."
 DEUSEX_influence_plus_20_tt: "The Illuminati wrote this Act. Illuminati influence here: §R+20§!"

 DEUSEX_accuse_duclare: "Accuse Elizabeth DuClare"
 DEUSEX_accuse_duclare_desc: "Name Elizabeth DuClare as the traitor before the circle."
 DEUSEX_accuse_darrow: "Accuse Hugh Darrow"
 DEUSEX_accuse_darrow_desc: "Name Hugh Darrow as the traitor before the circle."
 DEUSEX_trace_the_money_tt: "After §Ytwo months§!, reveals the traitor's §Ywing§!."
 DEUSEX_read_the_leaks_tt: "Exposure: §R+5§!\nAfter §Ytwo months§!, reveals the traitor's §Ystance on augmentation§!."
 DEUSEX_watch_the_table_tt: "The traitor's clock: §R-1§! month\nAfter §Ytwo months§!, reveals the traitor's §Ypublic face§!."
 DEUSEX_clue_revealed_tt: "The clue is added to the dossiers."
 DEUSEX_accuse_tt: "If they are the traitor: their wing §R-10§!, exposure §G-20§!, §G+50§! political power and §G+3%§! stability.\nIf not: their wing §R-10§!, exposure §R+10§! and the traitor's clock §R-3§! months."
 DEUSEX_betrayed_tt: "We lose our seat in the inner circle and fall back under its grip at §R50§! influence.\nEvery wing: §R-10§!\nExposure: §R+30§!"
 DEUSEX.50.t: "A Traitor at the Table"
 DEUSEX.50.d: "Files only the inner circle has seen are turning up in hacker drops and newsrooms. One of the circle's own is feeding them out, and the rest of the table has begun to look at us."
 DEUSEX.50.a: "Find them."
 DEUSEX.51.t: "The Traitor Goes Public"
 DEUSEX.51.d: "[DEUSEX_traitor_name] has handed the inner circle's files to the press. The circle has decided that our seat is the price of the leak."
 DEUSEX.51.a: "We were too slow."
 DEUSEX.52.t: "The Inner Circle's Files"
 DEUSEX.52.d: "Documents released by [DEUSEX_traitor_name] describe a private circle that steers governments, corporations and newsrooms. Officials everywhere call them forgeries. The governments named in them are not so sure."
 DEUSEX.52.a: "Forgeries, surely."
 DEUSEX.53.t: "The Traitor Unmasked"
 DEUSEX.53.d: "We named [DEUSEX_traitor_name], and the evidence held. The circle has cut them loose and closed the leak, and the other members are grateful for our diligence."
 DEUSEX.53.a: "Order is restored."
 DEUSEX.54.t: "The Wrong Name"
 DEUSEX.54.d: "The member we accused was loyal, and the circle knows it. Their wing resents us, and somewhere the real traitor has stopped being careful."
 DEUSEX.54.a: "We will find them."

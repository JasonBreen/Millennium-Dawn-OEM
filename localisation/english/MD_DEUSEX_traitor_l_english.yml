 DEUSEX_suspect_3: "William Taggart"
 DEUSEX_suspect_4: "Elizabeth DuClare"
 DEUSEX_suspect_5: "Hugh Darrow"
 DEUSEX_trace_the_money: "Trace the Money"
 DEUSEX_trace_the_money_desc: "Follow the payments behind the leaks back through the wings' accounts."
 DEUSEX_read_the_leaks: "Read the Leaks"
 DEUSEX_read_the_leaks_desc: "Study what the traitor has chosen to release. What they leak says what they want."
 DEUSEX_watch_the_table: "Watch the Table"
 DEUSEX_watch_the_table_desc: "Put every member of the circle under quiet watch. They may notice."
 DEUSEX_accuse_page: "Accuse Bob Page"
 DEUSEX_accuse_page_desc: "Name Bob Page as the traitor before the circle."
 DEUSEX_accuse_zhao: "Accuse Zhao Yun Ru"
 DEUSEX_accuse_zhao_desc: "Name Zhao Yun Ru as the traitor before the circle."

 DEUSEX_traitor_category: "A Traitor at the Table"
 DEUSEX_traitor_category_desc: "Someone at our table is feeding the inner circle's files to the press. Unless we name them, they go public in §Y[?global.DEUSEX_traitor_clock|0]§! months.\n\n§YThe money§!: [DEUSEX_clue_wing_text]\n§YThe leaks§!: [DEUSEX_clue_stance_text]\n§YThe habits§!: [DEUSEX_clue_face_text]\n\n§YBob Page§!: capital wing, for augmentation, corporate.\n§YZhao Yun Ru§!: security wing, for augmentation, corporate.\n§YWilliam Taggart§!: media wing, against augmentation, public figure.\n§YElizabeth DuClare§!: media wing, for augmentation, public figure.\n§YHugh Darrow§!: capital wing, privately against augmentation, corporate.[DEUSEX_darrow_status]"
 DEUSEX_darrow_missing: " Missing since Panchaea."
 DEUSEX_darrow_present: ""
 DEUSEX_clue_untraced: "not yet traced"
 DEUSEX_clue_wing_1: "paid through §Ycapital§! accounts"
 DEUSEX_clue_wing_2: "paid through §Ymedia§! accounts"
 DEUSEX_clue_wing_3: "paid through §Ysecurity§! accounts"
 DEUSEX_clue_stance_1: "the files argue §Yfor§! augmentation"
 DEUSEX_clue_stance_2: "the files argue §Yagainst§! augmentation"
 DEUSEX_clue_face_1: "meetings held in boardrooms, a §Ycorporate§! figure"
 DEUSEX_clue_face_2: "meetings held around public office, a §Ypublic figure§!"
 DEUSEX_suspect_1: "Bob Page"

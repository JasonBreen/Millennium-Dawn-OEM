l_english:
 # ── Xbox corporate-history event chain ─────────────────────────────────────────

 # Event 1 — 2001-11-15: The Original Xbox Launches
 USA_xbox_events.1.t:0 "The Original Xbox Launches"
 USA_xbox_events.1.d:0 "On 15 November 2001 Microsoft enters the console market with the original Xbox, a powerful machine built around Intel and NVIDIA components. It ships alongside Halo: Combat Evolved and is an immediate system seller, and the billion-dollar hardware bet is the company's most ambitious move into consumer electronics. Washington can underwrite the domestic component chain, press for open PC licensing, or look first at the publishing agreements behind the launch."
 USA_xbox_events.1.a:0 "Underwrite the domestic component chain"
 USA_xbox_events.1.a_tt:0 "Procurement guarantees behind an American console keep Intel and NVIDIA volume onshore.\nPlatform Strength §G+1§!, Hardware Resilience §G+1§!."
 USA_xbox_events.1.b:0 "Push for open PC licensing"
 USA_xbox_events.1.b_tt:0 "Pressure for portable, PC-compatible tooling widens the studio base at a lower public cost.\nDeveloper Ecosystem §G+2§!, Platform Strength §G+1§!."
 USA_xbox_events.1.c:0 "Hold the launch for publishing terms"
 USA_xbox_events.1.c_tt:0 "Review of the exclusive publishing agreements delays the launch but secures better distribution terms.\nDigital Services §G+1§!, Platform Strength §R-1§!, Hardware Resilience §G+1§!."

 # Event 2 — 2002-11-15: Xbox Live Goes Online
 USA_xbox_events.2.t:0 "Xbox Live Goes Online"
 USA_xbox_events.2.d:0 "In November 2002 Microsoft launches Xbox Live, the first unified online service on a home console, with persistent gamertags, friends lists and online multiplayer behind a fifty-dollar annual subscription. The paid tier is controversial and sets a precedent every competitor will follow. Federal policy can legitimise the subscription model, press for open access to online play, or stay out of it."
 USA_xbox_events.2.a:0 "Back the subscription model"
 USA_xbox_events.2.a_tt:0 "Broadband subsidy and clear billing rules legitimise paid online play as a market.\nDigital Services §G+2§!, Platform Strength §G+1§!."
 USA_xbox_events.2.b:0 "Press for open network access"
 USA_xbox_events.2.b_tt:0 "Access rules keep online play unmetered, favouring reach and small studios over platform revenue.\nDigital Services §G+1§!, Developer Ecosystem §G+1§!."
 USA_xbox_events.2.c:0 "Defer online rulemaking"
 USA_xbox_events.2.c_tt:0 "No federal position on console networks; resources stay with hardware standards.\nHardware Resilience §G+1§!, Digital Services §R-1§!."

 # Event 3 — 2005-11-22: The Xbox 360 Launch
 USA_xbox_events.3.t:0 "The Xbox 360 Launch"
 USA_xbox_events.3.d:0 "Microsoft launches the Xbox 360 on 22 November 2005, a full year ahead of Sony's PlayStation 3. The head start wins broad third-party support in the Western market and introduces the unified Xbox Live Marketplace, but the compressed schedule has forced manufacturing compromises. Washington can speed the launch, insist on certification first, or steer the programme toward affordability."
 USA_xbox_events.3.a:0 "Support the early launch window"
 USA_xbox_events.3.a_tt:0 "Export credit and expedited certification get an American console to market ahead of Sony.\nPlatform Strength §G+2§!, Developer Ecosystem §G+1§!."
 USA_xbox_events.3.b:0 "Require certification before shipment"
 USA_xbox_events.3.b_tt:0 "Thermal and reliability testing before sale slows the launch but hardens the hardware.\nHardware Resilience §G+2§!, Platform Strength §G+1§!."
 USA_xbox_events.3.c:0 "Target affordability"
 USA_xbox_events.3.c_tt:0 "Price-focused incentives widen consumer access and indie reach at the cost of build quality.\nPlatform Strength §G+1§!, Hardware Resilience §R-1§!, Developer Ecosystem §G+1§!."

 # Event 4 — 2007-07-05: The Red Ring Crisis
 USA_xbox_events.4.t:0 "The Red Ring Crisis"
 USA_xbox_events.4.d:0 "By mid-2007 millions of Xbox 360 consoles are failing with the Red Ring of Death, three red lights indicating a general hardware fault traced to overheating and poor solder joints. It is a consumer-protection question as much as a corporate one, and the response will define trust in the platform for years. Federal authority runs from doing nothing to ordering a full recall."
 USA_xbox_events.4.a:0 "Leave it to the manufacturer"
 USA_xbox_events.4.a_tt:0 "No federal action on the failure rate; consumers carry the defect and confidence falls.\nHardware Resilience §R-2§!, Platform Strength §R-1§!."
 USA_xbox_events.4.b:0 "Mandate an extended warranty"
 USA_xbox_events.4.b_tt:0 "A three-year warranty requirement forces repair at the manufacturer's expense and restores confidence.\nHardware Resilience §G+2§!."
 USA_xbox_events.4.c:0 "Order a full recall"
 USA_xbox_events.4.c_tt:0 "A recall replaces every affected unit, the costliest route but the strongest signal to consumers.\nHardware Resilience §G+1§!, Platform Strength §G+1§!."

 # Event 5 — 2010-11-04: Kinect: Motion Gaming
 USA_xbox_events.5.t:0 "Kinect: Motion Gaming"
 USA_xbox_events.5.d:0 "On 4 November 2010 Microsoft launches Kinect, a depth-sensing camera that enables full-body motion control with no controller at all. It sells rapidly and opens the console to living-room and casual audiences, while dividing developers over how to build for a controller-free machine. Research policy can chase the new interface, fund its accessibility uses, or stay with core hardware."
 USA_xbox_events.5.a:0 "Fund depth-sensing research"
 USA_xbox_events.5.a_tt:0 "Public research money behind motion sensing pulls in new studios but stretches the hardware programme.\nPlatform Strength §G+1§!, Developer Ecosystem §G+1§!, Hardware Resilience §R-1§!."
 USA_xbox_events.5.b:0 "Support accessibility applications"
 USA_xbox_events.5.b_tt:0 "Grants for accessible and non-gaming uses build the developer base without a platform-wide bet.\nDeveloper Ecosystem §G+1§!, Digital Services §G+1§!."
 USA_xbox_events.5.c:0 "Hold the line on core hardware"
 USA_xbox_events.5.c_tt:0 "No special support for the peripheral; standards work stays on mainstream console performance.\nHardware Resilience §G+1§!, Platform Strength §G+1§!."

 # Event 6 — 2013-05-21: Xbox One: An Awkward Reveal
 USA_xbox_events.6.t:0 "Xbox One: An Awkward Reveal"
 USA_xbox_events.6.d:0 "Microsoft unveils the Xbox One on 21 May 2013 to widespread backlash. The reveal leads with television, sports and living-room entertainment rather than games, and confirms mandatory internet check-ins, restrictions on used games, and an always-connected Kinect. Sony has yet to show the PlayStation 4 in full and the launch window is closing; Washington can move on the licensing terms now, press for a different launch, or seek a delay."
 USA_xbox_events.6.a:0 "Challenge the used-game restrictions"
 USA_xbox_events.6.a_tt:0 "First-sale and consumer-rights pressure forces the licensing terms open, unsettling studios that had planned around them.\nPlatform Strength §G+1§!, Developer Ecosystem §R-1§!, Digital Services §G+1§!."
 USA_xbox_events.6.b:0 "Press for a games-first relaunch"
 USA_xbox_events.6.b_tt:0 "Public pressure to lead with games rather than entertainment lock-in rebuilds standing and developer confidence.\nPlatform Strength §G+2§!, Developer Ecosystem §G+1§!."
 USA_xbox_events.6.c:0 "Seek a delay to settle the terms"
 USA_xbox_events.6.c_tt:0 "Holding the launch until licensing and messaging are settled costs the window but steadies hardware and studios.\nHardware Resilience §G+1§!, Developer Ecosystem §G+1§!."

 # Event 7 — 2014-03-31: Phil Spencer and the Platform Reset
 USA_xbox_events.7.t:0 "Phil Spencer and the Platform Reset"
 USA_xbox_events.7.d:0 "On 31 March 2014 Phil Spencer is named Head of Xbox, taking over a division that has been without dedicated leadership since Don Mattrick left for Zynga the previous July. Spencer, until now head of Microsoft Studios, moves quickly to reposition Xbox around its gaming community, cancelling entertainment-pivot projects and rebuilding credibility with developers and the press. The federal levers are studio and research support, media and broadband policy, or plain fiscal discipline."
 USA_xbox_events.7.a:0 "Back first-party studios and developer relations"
 USA_xbox_events.7.a_tt:0 "Support for studios and developer programmes rebuilds the ecosystem behind a games-first platform.\nDeveloper Ecosystem §G+2§!, Platform Strength §G+1§!."
 USA_xbox_events.7.b:0 "Favour the living-room media strategy"
 USA_xbox_events.7.b_tt:0 "Media and broadband policy pushes the console toward entertainment distribution, at the studios' expense.\nDigital Services §G+1§!, Platform Strength §G+1§!, Developer Ecosystem §R-1§!."
 USA_xbox_events.7.c:0 "Press for cost discipline"
 USA_xbox_events.7.c_tt:0 "Margin and efficiency pressure hardens manufacturing but starves the developer programme.\nHardware Resilience §G+1§!, Developer Ecosystem §R-1§!."

 # Event 8 — 2017-06-01: Xbox Game Pass
 USA_xbox_events.8.t:0 "Xbox Game Pass"
 USA_xbox_events.8.d:0 "On 1 June 2017 Microsoft launches Xbox Game Pass, a subscription giving access to a rotating library of games for a flat monthly fee. The initial offering is modest but the model threatens to redefine what owning a console is worth. Public financing can back the full library, defend the retail model, or aim at independent studios."
 USA_xbox_events.8.a:0 "Underwrite the subscription library"
 USA_xbox_events.8.a_tt:0 "Content financing and clear subscription rules make a flat-fee library viable at scale.\nDigital Services §G+3§!, Developer Ecosystem §G+1§!."
 USA_xbox_events.8.b:0 "Protect the retail sales model"
 USA_xbox_events.8.b_tt:0 "Keeping retail and ownership rules intact steadies hardware and platform revenue, forgoing the subscription inflection.\nHardware Resilience §G+1§!, Platform Strength §G+1§!."
 USA_xbox_events.8.c:0 "Fund an independent-studio tier"
 USA_xbox_events.8.c_tt:0 "Targeted grants for small and episodic studios grow the developer base at modest public cost.\nDeveloper Ecosystem §G+2§!, Digital Services §G+1§!."

 # Event 9 — 2020-11-10: Xbox Series X and S
 USA_xbox_events.9.t:0 "Xbox Series X and S"
 USA_xbox_events.9.d:0 "On 10 November 2020 Microsoft launches the Xbox Series X and the lower-priced Series S together. The dual-model strategy serves premium and value buyers at once, and both consoles ship as full members of the Game Pass and cloud ecosystem, in the middle of a global semiconductor shortage. Chip allocation policy can cover both tiers, concentrate on the flagship, or favour the PC and cloud path."
 USA_xbox_events.9.a:0 "Support both price tiers"
 USA_xbox_events.9.a_tt:0 "Semiconductor allocation for two models covers premium and value buyers through the shortage.\nPlatform Strength §G+2§!, Hardware Resilience §G+1§!, Digital Services §G+1§!."
 USA_xbox_events.9.b:0 "Concentrate on the premium console"
 USA_xbox_events.9.b_tt:0 "Scarce advanced nodes go to a single flagship, maximising build quality and prestige.\nHardware Resilience §G+2§!, Platform Strength §G+2§!."
 USA_xbox_events.9.c:0 "Prioritise the PC and cloud bridge"
 USA_xbox_events.9.c_tt:0 "Cross-platform and cloud policy favours software reach over dedicated console hardware.\nDigital Services §G+2§!, Developer Ecosystem §G+1§!."

 # Event 10 — 2022-06-09: Xbox Cloud Gaming Goes Global
 USA_xbox_events.10.t:0 "Xbox Cloud Gaming Goes Global"
 USA_xbox_events.10.d:0 "By June 2022 Xbox Cloud Gaming reaches more than twenty-five countries, adding Argentina and New Zealand and arriving on Samsung smart televisions through a dedicated app. Still formally a beta, it already streams Xbox and PC titles to phones, tablets, browsers and now television sets with no local hardware required. Competition and broadband policy can bundle the cloud tier, force it to stand alone, or hold the expansion back."
 USA_xbox_events.10.a:0 "Treat cloud play as part of the subscription"
 USA_xbox_events.10.a_tt:0 "Bundling rules and broadband policy put streaming inside the existing subscription, maximising reach.\nDigital Services §G+3§!, Developer Ecosystem §G+1§!."
 USA_xbox_events.10.b:0 "Require cloud gaming to stand alone"
 USA_xbox_events.10.b_tt:0 "Unbundling the streaming tier opens it beyond subscribers and keeps platform pricing separable.\nDigital Services §G+2§!, Platform Strength §G+1§!."
 USA_xbox_events.10.c:0 "Hold back the rollout"
 USA_xbox_events.10.c_tt:0 "Deferring the expansion until infrastructure costs fall keeps investment in hardware and the traditional platform.\nHardware Resilience §G+1§!, Platform Strength §G+1§!."

 # ── Capstone idea names and descriptions ─────────────────────────────────────────

 USA_xbox_platform_consolidator:0 "Xbox: Platform Consolidator"
 USA_xbox_platform_consolidator_desc:0 "Sustained federal support for content financing, distribution and computing infrastructure has left the American console platform vertically integrated across studios, storefronts and subscription services, compounding advantages in every one of them."

 USA_xbox_hardware_innovator:0 "Xbox: Hardware Innovator"
 USA_xbox_hardware_innovator_desc:0 "Certification standards and semiconductor policy pushed the console programme toward genuine engineering leadership, from custom silicon in the 360 to the Velocity Architecture of the Series X, and the expertise has spread well beyond gaming."

 USA_xbox_developer_platform:0 "Xbox: Developer Platform"
 USA_xbox_developer_platform_desc:0 "Studio grants, open tooling requirements and independent-developer programmes turned the platform into one of the most developer-friendly in the industry, with a dense ecosystem of tools, APIs and cross-platform pipelines."

 USA_xbox_cloud_native_platform:0 "Xbox: Cloud-Native Platform"
 USA_xbox_cloud_native_platform_desc:0 "Broadband policy and a decade of datacentre investment made the platform cloud-native, streaming high-fidelity interactive software to any screen and placing American industry at the frontier of consumer cloud computing."

 USA_xbox_resilient_games_publisher:0 "Xbox: Resilient Games Publisher"
 USA_xbox_resilient_games_publisher_desc:0 "Despite early missteps and fierce competition the division has proved durable as a global games publisher, holding a profitable catalogue and a loyal player base across hardware generations."

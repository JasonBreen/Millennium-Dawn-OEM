l_english:
 # ── Xbox corporate-history event chain ─────────────────────────────────────────

 # Event 1 — 2001-11-15: The Original Xbox Launches
 USA_xbox_events.1.t:0 "The Original Xbox Launches"
 USA_xbox_events.1.d:0 "On 15 November 2001, Microsoft enters the console market with the original Xbox — a powerful machine built around Intel and NVIDIA components. The console ships alongside Halo: Combat Evolved, which becomes an immediate system-selling phenomenon and establishes the platform as a serious competitor to Sony's PlayStation 2. The billion-dollar hardware bet marks Microsoft's most ambitious foray into consumer electronics."
 USA_xbox_events.1.a:0 "Bet on Halo as the Platform Anchor"
 USA_xbox_events.1.a_tt:0 "Invest heavily in first-party exclusives and tight hardware–software integration, growing platform strength and hardware resilience at the cost of significant capital."
 USA_xbox_events.1.b:0 "Open the Platform to PC Licensing"
 USA_xbox_events.1.b_tt:0 "License Xbox software liberally across PC to attract third-party developers, boosting the developer ecosystem while keeping initial hardware expenditure low."
 USA_xbox_events.1.c:0 "Delay and Negotiate Partnership Deals"
 USA_xbox_events.1.c_tt:0 "Hold back the launch to secure publishing partnerships, building digital services potential but sacrificing early platform momentum."

 # Event 2 — 2002-11-15: Xbox Live Goes Online
 USA_xbox_events.2.t:0 "Xbox Live Goes Online"
 USA_xbox_events.2.d:0 "In November 2002, Microsoft launches Xbox Live, the first unified online gaming service on a home console. The service introduces persistent gamertags, cross-game friends lists, and online multiplayer — all behind a $50 annual subscription. The paid-tier model proves controversial but generates reliable recurring revenue and sets an industry-wide precedent for console online services."
 USA_xbox_events.2.a:0 "Launch as a Paid Subscription Tier"
 USA_xbox_events.2.a_tt:0 "Commit to a premium subscription model, generating strong recurring revenue and establishing digital services leadership."
 USA_xbox_events.2.b:0 "Offer Xbox Live as a Free Service"
 USA_xbox_events.2.b_tt:0 "Remove the subscription fee to drive adoption, growing the developer ecosystem but limiting direct revenue from online play."
 USA_xbox_events.2.c:0 "Defer Online Infrastructure Investment"
 USA_xbox_events.2.c_tt:0 "Skip dedicated online services for now and focus resources on hardware reliability, accepting weaker digital growth."

 # Event 3 — 2005-11-22: The Xbox 360 Launch
 USA_xbox_events.3.t:0 "The Xbox 360 Launch"
 USA_xbox_events.3.d:0 "Microsoft launches the Xbox 360 on 22 November 2005, a full year ahead of Sony's PlayStation 3. The head-start strategy proves effective: the 360 captures broad third-party support, especially in the Western market, and introduces the unified Xbox Live Marketplace. The rush to beat Sony, however, comes with manufacturing compromises that will soon prove costly."
 USA_xbox_events.3.a:0 "Race to Beat the PS3 to Market"
 USA_xbox_events.3.a_tt:0 "Prioritise the launch window over hardware maturity, gaining strong platform strength and developer momentum while accepting latent hardware risk."
 USA_xbox_events.3.b:0 "Delay for Higher Build Quality"
 USA_xbox_events.3.b_tt:0 "Push the launch back to resolve engineering concerns, trading the head-start for significantly improved hardware resilience."
 USA_xbox_events.3.c:0 "Launch a Budget-Focused Console"
 USA_xbox_events.3.c_tt:0 "Target a lower price point to compete on value, drawing in indie developers but accepting reduced hardware durability."

 # Event 4 — 2007-07-05: The Red Ring Crisis
 USA_xbox_events.4.t:0 "The Red Ring Crisis"
 USA_xbox_events.4.d:0 "By mid-2007, millions of Xbox 360 consoles are failing with the notorious 'Red Ring of Death' — three red LEDs indicating a general hardware fault traced to overheating and poor solder joints. Microsoft faces an existential brand moment: ignore the defects, issue a limited repair scheme, or initiate an unprecedented consumer-facing warranty extension. The decision will define consumer trust in the platform for years."
 USA_xbox_events.4.a:0 "Minimise the Problem Publicly"
 USA_xbox_events.4.a_tt:0 "Downplay the failure rate and offer only case-by-case repairs, preserving short-term capital but severely damaging hardware reputation and platform standing."
 USA_xbox_events.4.b:0 "Extend Warranty and Fund Repairs"
 USA_xbox_events.4.b_tt:0 "Commit over $1 billion to a three-year warranty extension covering all affected units, absorbing the treasury hit in exchange for restored hardware resilience and consumer trust."
 USA_xbox_events.4.c:0 "Issue a Full Hardware Recall"
 USA_xbox_events.4.c_tt:0 "Recall and replace every affected console, a vastly more expensive undertaking that nonetheless wins back both hardware resilience and platform standing."

 # Event 5 — 2010-11-04: Kinect: Motion Gaming
 USA_xbox_events.5.t:0 "Kinect: Motion Gaming"
 USA_xbox_events.5.d:0 "On 4 November 2010, Microsoft launches Kinect — a depth-sensing camera accessory that enables full-body motion controls with no physical controller required. Kinect sells 10 million units in its first 60 days, entering the Guinness World Records as the fastest-selling consumer device. The technology opens Xbox to living-room and casual audiences but divides hardcore developers over how to build for a controller-free experience."
 USA_xbox_events.5.a:0 "All-In on Motion as a Platform Bet"
 USA_xbox_events.5.a_tt:0 "Position Kinect as a platform-defining pillar, drawing in new audiences and developers but stretching engineering resources and reducing hardware resilience."
 USA_xbox_events.5.b:0 "Keep Kinect as an Optional Peripheral"
 USA_xbox_events.5.b_tt:0 "Market Kinect as an add-on rather than a platform requirement, building modest developer adoption and digital services without destabilising the core hardware roadmap."
 USA_xbox_events.5.c:0 "Redirect Focus to Core Gaming Hardware"
 USA_xbox_events.5.c_tt:0 "Scale back motion-control ambitions and reinvest in traditional gaming performance, strengthening hardware resilience and platform appeal for core audiences."

 # Event 6 — 2013-05-21: Xbox One: An Awkward Reveal
 USA_xbox_events.6.t:0 "Xbox One: An Awkward Reveal"
 USA_xbox_events.6.d:0 "Microsoft unveils the Xbox One on 21 May 2013 to widespread backlash over mandatory internet check-ins, used-game restrictions, and an always-on Kinect requirement. Within weeks, Sony's PS4 reveal — pointedly showing a physical disc being shared between two people — goes viral. Microsoft is forced into a public reversal of its DRM policies before launch. The episode leaves the platform behind Sony in consumer perception heading into the new generation."
 USA_xbox_events.6.a:0 "Reverse DRM Policies Immediately"
 USA_xbox_events.6.a_tt:0 "Abandon the always-online and used-game restrictions before launch, recovering some consumer goodwill but leaving the developer ecosystem confused and the platform narrative damaged."
 USA_xbox_events.6.b:0 "Launch With a Clean, Games-First Message"
 USA_xbox_events.6.b_tt:0 "Redesign the reveal to lead with games and community features, avoiding the DRM controversy and building strong platform strength and developer confidence."
 USA_xbox_events.6.c:0 "Delay Launch for a Coherent Strategy"
 USA_xbox_events.6.c_tt:0 "Push the release back to resolve the messaging and policy confusion, building hardware resilience and developer goodwill at the cost of the generation-launch window."

 # Event 7 — 2014-02-04: Phil Spencer and the Platform Reset
 USA_xbox_events.7.t:0 "Phil Spencer and the Platform Reset"
 USA_xbox_events.7.d:0 "In February 2014, Phil Spencer is appointed Head of Xbox, replacing Don Mattrick who departed after the disastrous Xbox One reveal. Spencer immediately repositions Xbox around its gaming community, cancelling several entertainment pivot projects and restoring the brand's credibility with developers and press. His stewardship will prove transformative: shifting from a console-first to a platform-first strategy and laying the groundwork for Game Pass and cloud gaming."
 USA_xbox_events.7.a:0 "Games First — Reset the Strategy"
 USA_xbox_events.7.a_tt:0 "Embrace Spencer's games-first mandate, investing in first-party studios and developer relations to rebuild the ecosystem and grow platform strength."
 USA_xbox_events.7.b:0 "Double Down on Entertainment Box Vision"
 USA_xbox_events.7.b_tt:0 "Retain the broader living-room entertainment strategy, growing digital services reach but alienating core game developers and weakening the developer ecosystem."
 USA_xbox_events.7.c:0 "Prioritise Cost Discipline"
 USA_xbox_events.7.c_tt:0 "Focus on operational efficiency and margin improvement, improving hardware resilience while reducing investment in the developer ecosystem."

 # Event 8 — 2017-06-01: Xbox Game Pass
 USA_xbox_events.8.t:0 "Xbox Game Pass"
 USA_xbox_events.8.d:0 "On 1 June 2017, Microsoft launches Xbox Game Pass — a subscription service offering access to a rotating library of games for a flat monthly fee. The offering is initially modest, but grows rapidly as Microsoft begins adding its own first-party titles on day one of release. Game Pass redefines the value proposition of Xbox ownership and becomes the central pillar of Microsoft's platform strategy heading into the next hardware generation."
 USA_xbox_events.8.a:0 "Launch Game Pass and Bet on Subscriptions"
 USA_xbox_events.8.a_tt:0 "Commit to Game Pass as the platform's core value driver, significantly boosting digital services and developer adoption at the cost of substantial up-front content investment."
 USA_xbox_events.8.b:0 "Maintain Traditional Game Sales"
 USA_xbox_events.8.b_tt:0 "Keep the standard purchase model, protecting hardware resilience and platform stability but foregoing the subscription revenue inflection."
 USA_xbox_events.8.c:0 "Build a Curated Indie and Episodic Tier"
 USA_xbox_events.8.c_tt:0 "Launch a lower-cost indie-focused subscription that nurtures the developer ecosystem and grows digital services with more modest capital exposure."

 # Event 9 — 2020-11-10: Xbox Series X and S
 USA_xbox_events.9.t:0 "Xbox Series X and S"
 USA_xbox_events.9.d:0 "On 10 November 2020, Microsoft launches the Xbox Series X and the lower-priced Series S simultaneously. The dual-SKU strategy is a deliberate attempt to serve both premium and value audiences, while the Xbox Velocity Architecture and near-instant load times set a new performance benchmark. Both consoles launch as full members of the Game Pass and xCloud ecosystem, signalling that the hardware is now a delivery vehicle for Microsoft's broader platform."
 USA_xbox_events.9.a:0 "Dual SKU: Premium and Value Together"
 USA_xbox_events.9.a_tt:0 "Launch Series X and Series S simultaneously to cover multiple market segments, growing platform strength, hardware resilience, and digital services."
 USA_xbox_events.9.b:0 "Single Premium Console Focus"
 USA_xbox_events.9.b_tt:0 "Concentrate engineering on a single top-tier console, maximising hardware resilience and platform prestige without splitting attention across SKUs."
 USA_xbox_events.9.c:0 "Position Xbox as a PC Gaming Bridge"
 USA_xbox_events.9.c_tt:0 "Lean into the PC–console continuum, prioritising cloud and cross-platform digital services and developer tools over standalone console hardware investment."

 # Event 10 — 2022-06-09: Xbox Cloud Gaming Goes Global
 USA_xbox_events.10.t:0 "Xbox Cloud Gaming Goes Global"
 USA_xbox_events.10.d:0 "In June 2022, Microsoft's xCloud streaming service — now branded Xbox Cloud Gaming — exits beta and launches broadly as part of Game Pass Ultimate across more than 25 countries. The service lets players stream Xbox and PC titles to phones, tablets, and browsers with no local hardware required. It marks Microsoft's most direct challenge to the traditional console cycle and establishes the cloud as a first-class delivery tier for Xbox games."
 USA_xbox_events.10.a:0 "Integrate Cloud as a Game Pass Hybrid"
 USA_xbox_events.10.a_tt:0 "Bundle cloud gaming tightly into Game Pass Ultimate, dramatically boosting digital services reach and developer platform adoption."
 USA_xbox_events.10.b:0 "Launch Cloud Gaming as a Standalone Service"
 USA_xbox_events.10.b_tt:0 "Offer xCloud independently from Game Pass to capture a broader audience, growing digital services and platform strength outside the subscription bundle."
 USA_xbox_events.10.c:0 "Defer Broad Cloud Rollout"
 USA_xbox_events.10.c_tt:0 "Hold back the global xCloud expansion until infrastructure costs fall, focusing instead on hardware resilience and traditional platform strength."

 # ── Capstone idea names and descriptions ─────────────────────────────────────────

 USA_xbox_platform_consolidator:0 "Xbox: Platform Consolidator"
 USA_xbox_platform_consolidator_desc:0 "Microsoft's systematic acquisition of studios, subscription services, and digital storefronts has consolidated Xbox into one of the most vertically integrated gaming platforms on Earth, generating compounding advantages in content, distribution, and computing infrastructure."

 USA_xbox_hardware_innovator:0 "Xbox: Hardware Innovator"
 USA_xbox_hardware_innovator_desc:0 "Xbox's engineering culture — from custom silicon in the 360 to the Velocity Architecture of Series X — has established Microsoft as a genuine pioneer in consumer hardware design, translating console know-how into broader microchip and systems expertise."

 USA_xbox_developer_platform:0 "Xbox: Developer Platform"
 USA_xbox_developer_platform_desc:0 "Phil Spencer's games-first era and the ID@Xbox indie programme transformed Xbox into one of the most developer-friendly platforms in the industry, producing a dense ecosystem of tools, APIs, and cross-platform pipelines that extend well beyond gaming."

 USA_xbox_cloud_native_platform:0 "Xbox: Cloud-Native Platform"
 USA_xbox_cloud_native_platform_desc:0 "Microsoft's decade-long investment in Azure and xCloud has made Xbox the leading cloud-native gaming platform, streaming high-fidelity interactive experiences to any screen and positioning Microsoft at the frontier of cloud computing in the consumer sector."

 USA_xbox_resilient_games_publisher:0 "Xbox: Resilient Games Publisher"
 USA_xbox_resilient_games_publisher_desc:0 "Despite early missteps and fierce competition, the Xbox division has proven its durability as a global games publisher, maintaining a profitable catalogue and loyal player base that sustains Microsoft's consumer technology presence across hardware generations."
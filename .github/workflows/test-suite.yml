name: Test Suite
run-name: Validate live PR #${{ github.event.pull_request.number || 'current' }}

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  WORKSPACE_PATHS: |
    common
    events
    history
    localisation
    interface
    gfx/flags
    descriptions/**/*.txt
    portraits/**/*.txt
    scenario_tests/**/*.txt
    sound/**/*.txt
    tutorial/**/*.txt
    gfx/interface/decisions
    gfx/interface/equipmentdesigner/graphic_db
    map/adjacency_rules.txt
    music
    tools
    resources/documentation
    .claude
    .github/actions/setup-md-python/action.yml
    CLAUDE.md
    pyproject.toml
    validation_config.json
    *.mod
    .workspace-manifest
    .validation_cache

jobs:
  detect-changes:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      common: ${{ steps.groups.outputs.common }}
      events: ${{ steps.groups.outputs.events }}
      history: ${{ steps.groups.outputs.history }}
      localisation: ${{ steps.groups.outputs.localisation }}
      ai-strategy: ${{ steps.groups.outputs.ai-strategy }}
      ai-navy: ${{ steps.groups.outputs.ai-navy }}
      ai-equipment: ${{ steps.groups.outputs.ai-equipment }}
      factions: ${{ steps.groups.outputs.factions }}
      characters: ${{ steps.groups.outputs.characters }}
      scientist-traits: ${{ steps.groups.outputs.scientist-traits }}
      oob: ${{ steps.groups.outputs.oob }}
      decisions: ${{ steps.groups.outputs.decisions }}
      scripted-loc: ${{ steps.groups.outputs.scripted-loc }}
      scripted-guis: ${{ steps.groups.outputs.scripted-guis }}
      interface: ${{ steps.groups.outputs.interface }}
      graphic-db: ${{ steps.groups.outputs.graphic-db }}
      music: ${{ steps.groups.outputs.music }}
      national-focus: ${{ steps.groups.outputs.national-focus }}
      on-actions: ${{ steps.groups.outputs.on-actions }}
      scripted-effects: ${{ steps.groups.outputs.scripted-effects }}
      mios: ${{ steps.groups.outputs.mios }}
      map-adjacency: ${{ steps.groups.outputs.map-adjacency }}
      mod: ${{ steps.groups.outputs.mod }}
      content: ${{ steps.groups.outputs.content }}
      docs: ${{ steps.groups.outputs.docs }}
      style: ${{ steps.groups.outputs.style }}
      style_files: ${{ steps.groups.outputs.style_files }}
      style_config: ${{ steps.groups.outputs.style_config }}
      tools: ${{ steps.groups.outputs.tools }}
      file-paths: ${{ steps.groups.outputs.file-paths }}
      full_suite: ${{ steps.groups.outputs.full_suite }}
      pr-number: ${{ steps.resolve-ref.outputs.pr-number }}
      head-sha: ${{ steps.resolve-ref.outputs.head-sha }}
      base-sha: ${{ steps.resolve-ref.outputs.base-sha }}
      trusted-ref: >-
        ${{ steps.resolve-ref.outputs.protected-sha }}
      checkout-repository: ${{ steps.resolve-ref.outputs.repository }}
      checkout-ref: ${{ steps.resolve-ref.outputs.ref }}
    steps:
      - name: Resolve validation ref
        id: resolve-ref
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          pr_number="$EVENT_PR_NUMBER"
          if [ -n "$pr_number" ] &&
              [[ ! "$pr_number" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::The PR number must be a positive integer"
            exit 1
          fi
          pr=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$pr_number")
          head_repository=$(printf '%s' "$pr" | jq -r '.head.repo.full_name')
          head_sha=$(printf '%s' "$pr" | jq -r '.head.sha')
          base_repository=$(printf '%s' "$pr" | jq -r '.base.repo.full_name')
          base_sha=$(printf '%s' "$pr" | jq -r '.base.sha')
          if [[ ! "$head_repository" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]] ||
              [[ ! "$head_sha" =~ ^[0-9a-f]{40}$ ]] ||
              [[ ! "$base_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Unable to resolve the PR head repository and SHA"
            exit 1
          fi
          if [ "$base_repository" != "$GITHUB_REPOSITORY" ]; then
            echo "::error::The pull request must target this repository"
            exit 1
          fi
          default_branch=$(gh api "repos/$GITHUB_REPOSITORY" --jq .default_branch)
          protected_sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/$default_branch" --jq .sha)
          if [[ ! "$protected_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Unable to resolve the default branch SHA"
            exit 1
          fi
          {
            echo "pr-number=$pr_number"
            echo "repository=$head_repository"
            echo "ref=$head_sha"
            echo "head-sha=$head_sha"
            echo "base-sha=$base_sha"
            echo "protected-sha=$protected_sha"
          } >> "$GITHUB_OUTPUT"

      # The job is pull_request-only with read permissions. Use the PR's own
      # helper version so newly introduced grouping rules can validate themselves.
      - name: Checkout PR index
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ steps.resolve-ref.outputs.repository }}
          ref: ${{ steps.resolve-ref.outputs.ref }}
          path: pr-head
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
          allow-unsafe-pr-checkout: true
          sparse-checkout: descriptor.mod
          sparse-checkout-cone-mode: false

      - name: Checkout change tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ steps.resolve-ref.outputs.repository }}
          ref: ${{ steps.resolve-ref.outputs.ref }}
          path: tooling
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            tools/validation/collect_changed_files.py
            tools/validation/change_groups.py
            tools/validation/ci_workspace_profile.txt
            tools/validation/staged_sparse_profile.txt
            tools/tests/content/tool_data_drift_test.py
            /pyproject.toml
            /validation_config.json
          sparse-checkout-cone-mode: false

      - name: Check CI tooling contract
        working-directory: tooling
        run: |
          missing=()
          for path in tools/validation/ci_workspace_profile.txt \
              tools/validation/staged_sparse_profile.txt \
              tools/tests/content/tool_data_drift_test.py \
              validation_config.json; do
            test -f "$path" || missing+=("$path")
          done
          for package in pytest-xdist pytest-cov; do
            grep -Fq "\"$package" pyproject.toml || missing+=("$package")
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::This branch predates the CI tooling contract" \
              "(missing ${missing[*]}). Merge main into it."
            exit 1
          fi

      - name: Fetch PR base revision
        working-directory: pr-head
        env:
          BASE_SHA: ${{ steps.resolve-ref.outputs.base-sha }}
        run: |
          git fetch --no-tags \
            "https://github.com/${{ github.repository }}.git" "$BASE_SHA"

      - name: Derive changed files
        working-directory: pr-head
        env:
          BASE_SHA: ${{ steps.resolve-ref.outputs.base-sha }}
          HEAD_SHA: ${{ steps.resolve-ref.outputs.head-sha }}
        run: |
          merge_base=$(git merge-base "$BASE_SHA" "$HEAD_SHA")
          hook_path=common/scripted_localisation/00_MD_politicsview_
          hook_path+=scripted_localisation.txt
          git diff --unified=0 "$merge_base" "$HEAD_SHA" -- \
            localisation/english/MD_politics_view_parties_l_english.yml \
            "$hook_path" > ../party-loc-scope.diff
          git diff --name-status -z "$merge_base" "$HEAD_SHA" \
            | python3 ../tooling/tools/validation/collect_changed_files.py \
            > ../changed-files.txt
          wc -l ../changed-files.txt

      - name: Compute changed groups
        id: groups
        run: |
          python3 tooling/tools/validation/change_groups.py < changed-files.txt

      - name: Upload changed files
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: changed-files
          path: |
            changed-files.txt
            party-loc-scope.diff
          if-no-files-found: warn
          retention-days: 7

  validate-paths:
    name: File path validation
    needs: [detect-changes]
    if: >-
      needs.detect-changes.outputs.file-paths == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout PR index
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ needs.detect-changes.outputs.checkout-repository }}
          ref: ${{ needs.detect-changes.outputs.checkout-ref }}
          path: pr-tree
          fetch-depth: 1
          filter: blob:none
          persist-credentials: false
          allow-unsafe-pr-checkout: true
          sparse-checkout: descriptor.mod
          sparse-checkout-cone-mode: false

      - name: Reject links in PR index
        working-directory: pr-tree
        run: |
          if git ls-files --stage | grep -Eq '^(120000|160000) '; then
            echo "::error::PR index contains a symbolic link or submodule"
            exit 1
          fi

      - name: Checkout trusted file-path validator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository }}
          ref: ${{ needs.detect-changes.outputs.trusted-ref }}
          path: trusted
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: tools
          sparse-checkout-cone-mode: false

      - name: Set up Python
        id: setup-python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6
        with:
          python-version: "3.x"

      - name: Run file-path validation
        if: always() && !cancelled() && steps.setup-python.outcome == 'success'
        working-directory: pr-tree
        run: >-
          python3 ../trusted/tools/validation/validate_file_paths.py --path .
          --strict --no-color --output validation-file-paths.log

      - name: Verify file-path results
        if: always() && !cancelled() && steps.setup-python.outcome == 'success'
        run: |
          test -f pr-tree/validation-file-paths.log
          test -f pr-tree/validation-file-paths.json

      - name: Upload file-path results
        if: always() && !cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: validation-file-paths-results
          path: |
            pr-tree/validation-file-paths.log
            pr-tree/validation-file-paths.json
          if-no-files-found: error
          retention-days: 7

  prepare-workspace:
    name: Prepare workspace
    needs: [detect-changes]
    if: >-
      needs.detect-changes.outputs.full_suite == 'true' ||
      needs.detect-changes.outputs.content == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    env:
      PR_NUMBER: ${{ needs.detect-changes.outputs.pr-number }}
      HEAD_SHA: ${{ needs.detect-changes.outputs.head-sha }}
      MD_NO_CACHE: >-
        ${{ needs.detect-changes.outputs.full_suite == 'true' && '1' || '' }}
    steps:
      # The PR checkout contains game data only. This read-only pull-request job
      # loads the matching validators and dependencies in a separate checkout.
      - name: Checkout PR content
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ needs.detect-changes.outputs.checkout-repository }}
          ref: ${{ needs.detect-changes.outputs.checkout-ref }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
          sparse-checkout: |
            common
            events
            history
            localisation
            interface
            gfx/flags
            descriptions/**/*.txt
            portraits/**/*.txt
            scenario_tests/**/*.txt
            sound/**/*.txt
            tutorial/**/*.txt
            gfx/interface/decisions
            gfx/interface/equipmentdesigner/graphic_db
            map/adjacency_rules.txt
            music
            *.mod
          sparse-checkout-cone-mode: false

      - name: Restore sparse workspace cache
        id: sparse-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            common
            events
            history
            localisation
            interface
            gfx/flags
            descriptions/**/*.txt
            portraits/**/*.txt
            scenario_tests/**/*.txt
            sound/**/*.txt
            tutorial/**/*.txt
            gfx/interface/decisions
            gfx/interface/equipmentdesigner/graphic_db
            map/adjacency_rules.txt
            music
            *.mod
          key: >-
            md-sparse-v3-${{ runner.os }}-${{
            needs.detect-changes.outputs.head-sha }}

      - name: Materialize sparse workspace on cache miss
        if: steps.sparse-cache.outputs.cache-hit != 'true'
        run: git sparse-checkout reapply

      - name: Reject links in PR workspace
        run: |
          if git ls-files --stage | grep -Eq '^(120000|160000) '; then
            echo "::error::PR workspace contains a symbolic link or submodule"
            exit 1
          fi

      - name: Checkout validation tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ needs.detect-changes.outputs.checkout-repository }}
          ref: ${{ needs.detect-changes.outputs.checkout-ref }}
          path: tooling
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            tools
            resources/documentation
            .claude
            .github/actions/setup-md-python/action.yml
            CLAUDE.md
            pyproject.toml
            validation_config.json
          sparse-checkout-cone-mode: false

      - name: Install validation tooling
        run: |
          cp -a tooling/tools .
          mkdir -p resources .github/actions
          cp -a tooling/resources/documentation resources/
          cp -a tooling/.claude .
          cp -a tooling/.github/actions/setup-md-python .github/actions/
          cp -a tooling/CLAUDE.md tooling/pyproject.toml tooling/validation_config.json .

      - name: Compute validator code hash
        id: toolshash
        run: >-
          echo "hash=${{ hashFiles('tools/validation/**',
          'tools/shared_utils.py',
          'validation_config.json') }}" >> "$GITHUB_OUTPUT"

      - name: Restore shared validator disk cache
        id: valcache
        if: >-
          needs.detect-changes.outputs.full_suite != 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .validation_cache
          key: >-
            md-valcache-v1-${{ runner.os }}-${{
            steps.toolshash.outputs.hash }}
          restore-keys: |
            md-valcache-v1-${{ runner.os }}-${{ steps.toolshash.outputs.hash }}-

      - name: Write workspace manifest
        env:
          CACHE_KEY: ${{ steps.valcache.outputs.cache-matched-key }}
          CHECKOUT_SHA: ${{ steps.checkout.outputs.commit }}
          RUN_ID: ${{ github.run_id }}
        run: |
          mkdir -p .validation_cache
          {
            echo "pr=$PR_NUMBER"
            echo "head_sha=$HEAD_SHA"
            echo "checkout_sha=$CHECKOUT_SHA"
            echo "run_id=$RUN_ID"
            echo "cache=$CACHE_KEY"
          } | tee .workspace-manifest

      - name: Pack prepared workspace
        run: |
          # Optional profile globs may have no matches in a sparse checkout.
          shopt -s globstar nullglob
          # shellcheck disable=SC2206
          workspace_paths=( $WORKSPACE_PATHS )
          tar --zstd --exclude='music/*.ogg' --exclude='music/*.mp3' \
            --exclude='music/*.wav' -cf "$RUNNER_TEMP/prepared-workspace.tar.zst" \
            "${workspace_paths[@]}"

      - name: Upload prepared workspace
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: prepared-workspace
          path: ${{ runner.temp }}/prepared-workspace.tar.zst
          compression-level: 0
          if-no-files-found: error
          retention-days: 1

  tools-tests:
    name: Tools tests (${{ matrix.os }})
    needs: [detect-changes]
    if: >-
      needs.detect-changes.outputs.full_suite == 'true' ||
      needs.detect-changes.outputs.tools == 'true'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: Linux
            runner: ubuntu-latest
            coverage: true
          - os: macOS
            runner: macos-latest
            coverage: false
          - os: Windows
            runner: windows-latest
            coverage: false
    steps:
      - name: Checkout tools test tree
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ needs.detect-changes.outputs.checkout-repository }}
          ref: ${{ needs.detect-changes.outputs.checkout-ref }}
          fetch-depth: 0
          persist-credentials: false
          sparse-checkout: |
            tools
            pyproject.toml
            validation_config.json
            .pre-commit-config.yaml
            .claude/docs/typo-watchlist.md
            .claude/docs/linux-system-reference.md
            .claude/docs/linux-national-adapters.md
            .github/actions/setup-md-python/action.yml
            common
            common/technology_tags
            common/scripted_guis/01_targeted_operations_gui.txt
            events
            history
            localisation
            gfx/leaders/generic_politicians/latin_female_001.dds
            interface/MD_decisions.gfx
            interface/MD_ai_race.gui
            interface/military_raids/MD_military_raids.gfx
            interface/MD_influence.gui
            interface/countrytechtreeview.gui
            interface/Iraq_civil_war.gui
            interface/targeted_operations.gui
            interface/MD_countrymissilesview.gui
            interface/targeted_operations_security.gui
            resources
            package.json
            bun.lock
            .jscpd.json
            .github/workflows/test-suite.yml
            .github/workflows/nightly-pr-validation.yml
            .github/workflows/pr-cache-cleanup.yml
            .github/workflows/validator-cache.yml
            .github/workflows/docs-quality.yml
            .github/workflows/tools-validation.yml
            .github/workflows/coding-pipeline.yml
            .github/workflows/pr-housekeeping.yml
            .github/workflows/issue-triage.yml
            .github/workflows/changelog-conflict-fixer.yml
            .github/workflows/changelog-lint.yml
            docs/src/content/resources/developer-setup.md
          sparse-checkout-cone-mode: false

      - name: Set up Python and dependencies
        id: dependencies
        uses: ./.github/actions/setup-md-python
        with:
          analysis: ${{ matrix.coverage }}
          group: test

      - name: Verify pytest collection configuration
        id: collection
        if: always() && !cancelled() && steps.dependencies.outcome == 'success'
        run: >-
          python -m pytest tools/tests/collection_layout_test.py
          -o addopts= -q

      - name: Run unit tests with coverage
        id: unit
        if: >-
          always() && !cancelled() && matrix.coverage == true &&
          steps.dependencies.outcome == 'success'
        run: >-
          python -m pytest tools/tests --ignore=tools/tests/content
          -o addopts= -o 'python_files=*_test.py' -q --durations=20 -n auto
          --cov --cov-branch --cov-report= --cov-fail-under=0

      - name: Report coverage
        id: coverage-report
        if: >-
          always() && !cancelled() && matrix.coverage == true &&
          steps.dependencies.outcome == 'success'
        run: python -m coverage report

      - name: Run cross-platform unit tests
        id: cross-platform
        if: >-
          always() && !cancelled() && matrix.coverage == false &&
          steps.dependencies.outcome == 'success'
        run: >-
          python -m pytest tools/tests --ignore=tools/tests/content
          -o addopts= -o 'python_files=*_test.py' -q --durations=20 -n auto

      - name: Write tools suite sidecar
        id: suite-sidecar
        if: always() && !cancelled()
        shell: bash
        run: |
          failed=0
          for outcome in \
            "${{ steps.dependencies.outcome }}" \
            "${{ steps.collection.outcome }}" \
            "${{ steps.unit.outcome }}" \
            "${{ steps.coverage-report.outcome }}" \
            "${{ steps.cross-platform.outcome }}" \
            "${{ steps.ruff.outcome }}" \
            "${{ steps.black.outcome }}" \
            "${{ steps.pylint.outcome }}" \
            "${{ steps.mypy.outcome }}" \
            "${{ steps.bun.outcome }}" \
            "${{ steps.bun-deps.outcome }}" \
            "${{ steps.jscpd.outcome }}" \
            "${{ steps.staged-fetch.outcome }}" \
            "${{ steps.staged-toolshash.outcome }}" \
            "${{ steps.staged-worktree.outcome }}" \
            "${{ steps.staged-valcache.outcome }}" \
            "${{ steps.staged.outcome }}" \
            "${{ steps.validate-tools.outcome }}"; do
            if [ "$outcome" = "failure" ]; then
              failed=$((failed + 1))
            fi
          done
          status=passed
          if [ "$failed" -gt 0 ]; then
            status=failed
          fi
          case "${{ matrix.os }}" in
            Linux) suite_name=tools-linux ;;
            macOS) suite_name=tools-macos ;;
            Windows) suite_name=tools-windows ;;
          esac
          {
            printf '{"suite":"tools","job":"Tools tests (%s)",' \
              "${{ matrix.os }}"
            printf '"name":"%s","title":"Tools tests (%s)",' \
              "$suite_name" "${{ matrix.os }}"
            printf '"status":"%s","errors":%d,"warnings":0,' \
              "$status" "$failed"
            printf '"issues":[]}\n'
          } > suite-run.json

      - name: Upload tools test results
        if: always() && !cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: tools-tests-${{ matrix.os }}-results
          path: suite-run.json
          if-no-files-found: error
          retention-days: 7

  # The tests that read live game files. They need the game tree, so they run
  # once here instead of on every tools-tests leg.
  content-tests:
    name: Content tests
    needs: [detect-changes]
    if: >-
      needs.detect-changes.outputs.full_suite == 'true' ||
      needs.detect-changes.outputs.content == 'true' ||
      needs.detect-changes.outputs.tools == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout content test tree
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ needs.detect-changes.outputs.checkout-repository }}
          ref: ${{ needs.detect-changes.outputs.checkout-ref }}
          fetch-depth: 1
          filter: blob:none
          persist-credentials: false
          sparse-checkout: |
            tools
            pyproject.toml
            validation_config.json
            .github/actions/setup-md-python/action.yml
            common
            events
            history
            localisation/english
            localisation/*/MD_frontend_l_*.yml
          sparse-checkout-cone-mode: false

      - name: Set up Python and dependencies
        id: dependencies
        uses: ./.github/actions/setup-md-python
        with:
          group: test

      - name: Run content tests
        id: content
        if: always() && !cancelled() && steps.dependencies.outcome == 'success'
        run: >-
          python -m pytest tools/tests/content -o addopts=
          -o 'python_files=*_test.py' -q

      - name: Write content tests sidecar
        if: always() && !cancelled()
        run: |
          status=passed
          failed=0
          for outcome in \
            "${{ steps.dependencies.outcome }}" \
            "${{ steps.content.outcome }}"; do
            if [ "$outcome" = "failure" ]; then
              failed=$((failed + 1))
            fi
          done
          if [ "$failed" -gt 0 ]; then
            status=failed
          fi
          {
            printf '{"suite":"tools","job":"Content tests",'
            printf '"name":"content-tests","title":"Content tests",'
            printf '"status":"%s","errors":%d,"warnings":0,' \
              "$status" "$failed"
            printf '"issues":[]}\n'
          } > suite-run.json

      - name: Upload content test results
        if: always() && !cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: content-tests-results
          path: suite-run.json
          if-no-files-found: error
          retention-days: 7

  # Its own job, so lint and staged integration do not queue behind the tests.
  tools-quality:
    name: Tools quality
    needs: [detect-changes]
    if: >-
      needs.detect-changes.outputs.full_suite == 'true' ||
      needs.detect-changes.outputs.tools == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tools quality tree
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ needs.detect-changes.outputs.checkout-repository }}
          ref: ${{ needs.detect-changes.outputs.checkout-ref }}
          fetch-depth: 1
          filter: blob:none
          persist-credentials: false
          sparse-checkout: |
            tools
            pyproject.toml
            validation_config.json
            package.json
            bun.lock
            .jscpd.json
            .github/actions/setup-md-python/action.yml
          sparse-checkout-cone-mode: false

      - name: Set up Python and dependencies
        id: dependencies
        uses: ./.github/actions/setup-md-python
        with:
          analysis: "true"

      - name: Run ruff
        id: ruff
        if: always() && !cancelled() && steps.dependencies.outcome == 'success'
        run: ruff check tools --output-format=github

      - name: Check formatting (black)
        id: black
        if: always() && !cancelled() && steps.dependencies.outcome == 'success'
        run: black --check tools

      - name: Run pylint
        id: pylint
        if: always() && !cancelled() && steps.dependencies.outcome == 'success'
        run: pylint tools -j 0 --output-format=github --reports=no --score=no

      - name: Run mypy
        id: mypy
        if: always() && !cancelled() && steps.dependencies.outcome == 'success'
        run: mypy

      - name: Setup Bun
        id: bun
        if: always() && !cancelled() && steps.dependencies.outcome == 'success'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.14"

      - name: Install duplication dependencies
        id: bun-deps
        if: always() && !cancelled() && steps.bun.outcome == 'success'
        run: bun install --frozen-lockfile

      - name: Run jscpd
        id: jscpd
        if: always() && !cancelled() && steps.bun-deps.outcome == 'success'
        run: bun run jscpd

      - name: Fetch PR head for staged integration
        id: staged-fetch
        if: always() && !cancelled() && steps.dependencies.outcome == 'success'
        run: >-
          git fetch --no-tags --depth=1 --filter=blob:none
          "https://github.com/${{
          needs.detect-changes.outputs.checkout-repository }}.git"
          "${{ needs.detect-changes.outputs.head-sha }}"

      - name: Compute staged validator code hash
        id: staged-toolshash
        if: always() && !cancelled() && steps.dependencies.outcome == 'success'
        run: >-
          echo "hash=${{ hashFiles('tools/validation/**/*.py',
          'tools/validation/**/*.txt', 'tools/shared_utils.py',
          'validation_config.json') }}" >> "$GITHUB_OUTPUT"

      - name: Create staged integration worktree
        id: staged-worktree
        if: always() && !cancelled() && steps.staged-fetch.outcome == 'success'
        run: |
          worktree="${{ runner.temp }}/md-staged-validator-test"
          head_sha="${{ needs.detect-changes.outputs.head-sha }}"
          git worktree add --detach --no-checkout "$worktree" "$head_sha"
          # Anchored patterns: a bare `interface` would also match the 1.8 GB
          # gfx/interface art tree, so every entry is root-anchored (see
          # tools/validation/staged_sparse_profile.txt).
          git -C "$worktree" sparse-checkout init --no-cone
          git -C "$worktree" sparse-checkout set --stdin \
            < tools/validation/staged_sparse_profile.txt
          git -C "$worktree" checkout "$head_sha"
          test -d "$worktree/gfx/flags" || \
            { echo "::error::sparse worktree missing gfx/flags"; exit 1; }
          test ! -e "$worktree/gfx/interface" || \
            { echo "::error::sparse worktree leaked gfx/interface"; exit 1; }

      - name: Restore staged validator disk cache
        id: staged-valcache
        if: >-
          always() && !cancelled() &&
          steps.staged-worktree.outcome == 'success'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ runner.temp }}/md-staged-validator-test/.validation_cache
          key: >-
            md-valcache-v1-${{ runner.os }}-${{
            steps.staged-toolshash.outputs.hash }}
          restore-keys: >-
            md-valcache-v1-${{ runner.os }}-${{
            steps.staged-toolshash.outputs.hash }}-

      - name: Run staged-validator integration
        id: staged
        if: >-
          always() && !cancelled() &&
          steps.staged-worktree.outcome == 'success'
        working-directory: ${{ runner.temp }}/md-staged-validator-test
        env:
          MD_RUN_STAGED_INTEGRATION: "1"
        run: >-
          python -m pytest tools/tests/staged_validators_test.py
          tools/tests/staged_validators_real_test.py
          tools/tests/staged_sparse_coverage_test.py -q

      - name: Run tools validation
        id: validate-tools
        if: always() && !cancelled() && steps.dependencies.outcome == 'success'
        run: >-
          python tools/validate_tools.py --strict --no-color --output
          tools_validation.log

      - name: Write tools quality sidecar
        id: suite-sidecar
        if: always() && !cancelled()
        run: |
          failed=0
          for outcome in \
            "${{ steps.dependencies.outcome }}" \
            "${{ steps.ruff.outcome }}" \
            "${{ steps.black.outcome }}" \
            "${{ steps.pylint.outcome }}" \
            "${{ steps.mypy.outcome }}" \
            "${{ steps.bun.outcome }}" \
            "${{ steps.bun-deps.outcome }}" \
            "${{ steps.jscpd.outcome }}" \
            "${{ steps.staged-fetch.outcome }}" \
            "${{ steps.staged-toolshash.outcome }}" \
            "${{ steps.staged-worktree.outcome }}" \
            "${{ steps.staged-valcache.outcome }}" \
            "${{ steps.staged.outcome }}" \
            "${{ steps.validate-tools.outcome }}"; do
            if [ "$outcome" = "failure" ]; then
              failed=$((failed + 1))
            fi
          done
          status=passed
          if [ "$failed" -gt 0 ]; then
            status=failed
          fi
          {
            printf '{"suite":"tools","job":"Tools quality",'
            printf '"name":"tools-quality","title":"Tools quality",'
            printf '"status":"%s","errors":%d,"warnings":0,' \
              "$status" "$failed"
            printf '"issues":[]}\n'
          } > suite-run.json

      - name: Upload tools quality results
        if: always() && !cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: tools-quality-results
          path: suite-run.json
          if-no-files-found: error
          retention-days: 7

  mod-tests:
    name: Mod tests (${{ matrix.batch }})
    needs: [detect-changes, prepare-workspace]
    if: >-
      needs.detect-changes.outputs.full_suite == 'true' ||
      needs.detect-changes.outputs.content == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        batch: [core, targeted-a, targeted-b]
    steps:
      - name: Download prepared workspace
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: prepared-workspace
          path: ${{ runner.temp }}

      - name: Extract prepared workspace
        run: |
          archive="$RUNNER_TEMP/prepared-workspace.tar.zst"
          if tar --zstd -tvf "$archive" | grep -q '^[^-d]'; then
            echo "::error::Prepared workspace holds a link or special file"
            exit 1
          fi
          tar --zstd -xf "$archive"

      - name: Set up Python
        id: setup-python
        uses: ./.github/actions/setup-md-python

      - name: Download party localisation scope
        if: matrix.batch == 'targeted-b'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: changed-files
          path: validation-scope

      - name: Compute changed validator groups
        id: groups
        env:
          G_FULL_SUITE: ${{ needs.detect-changes.outputs.full_suite }}
          G_COMMON: ${{ needs.detect-changes.outputs.common }}
          G_EVENTS: ${{ needs.detect-changes.outputs.events }}
          G_HISTORY: ${{ needs.detect-changes.outputs.history }}
          G_LOCALISATION: ${{ needs.detect-changes.outputs.localisation }}
          G_INTERFACE: ${{ needs.detect-changes.outputs.interface }}
          G_GRAPHIC_DB: ${{ needs.detect-changes.outputs.graphic-db }}
          G_MUSIC: ${{ needs.detect-changes.outputs.music }}
          G_MAP_ADJACENCY: ${{ needs.detect-changes.outputs.map-adjacency }}
          G_DECISIONS: ${{ needs.detect-changes.outputs.decisions }}
          G_OOB: ${{ needs.detect-changes.outputs.oob }}
          G_AI_STRATEGY: ${{ needs.detect-changes.outputs.ai-strategy }}
          G_AI_NAVY: ${{ needs.detect-changes.outputs.ai-navy }}
          G_AI_EQUIPMENT: ${{ needs.detect-changes.outputs.ai-equipment }}
          G_FACTIONS: ${{ needs.detect-changes.outputs.factions }}
          G_CHARACTERS: ${{ needs.detect-changes.outputs.characters }}
          G_SCIENTIST_TRAITS: >-
            ${{ needs.detect-changes.outputs.scientist-traits }}
          G_SCRIPTED_GUIS: ${{ needs.detect-changes.outputs.scripted-guis }}
          G_NATIONAL_FOCUS: ${{ needs.detect-changes.outputs.national-focus }}
          G_ON_ACTIONS: ${{ needs.detect-changes.outputs.on-actions }}
          G_SCRIPTED_EFFECTS: >-
            ${{ needs.detect-changes.outputs.scripted-effects }}
          G_MIOS: ${{ needs.detect-changes.outputs.mios }}
        run: |
          changed=()
          if [ "$G_FULL_SUITE" = "true" ]; then
            changed=(common events history localisation interface \
              graphic-db map-adjacency decisions oob ai-strategy ai-navy \
              ai-equipment factions characters scientist-traits scripted-guis \
              national-focus on-actions scripted-effects mios music)
          else
            for group in common events history localisation interface \
                graphic-db map-adjacency decisions oob ai-strategy ai-navy \
                ai-equipment factions characters scientist-traits \
                scripted-guis national-focus on-actions scripted-effects \
                mios music; do
              var="G_${group^^}"
              var="${var//-/_}"
              if [ "${!var}" = "true" ]; then
                changed+=("$group")
              fi
            done
          fi
          printf 'groups=%s\n' "${changed[*]}" >> "$GITHUB_OUTPUT"

      - name: Run validator batch
        id: validator-batch
        if: always() && !cancelled() && steps.setup-python.outcome == 'success'
        run: >-
          python3 tools/validation/run_validator_batch.py
          --batch ${{ matrix.batch }}
          --changed-groups "${{ steps.groups.outputs.groups || '__none__' }}"
          --no-color --output-dir batch-results
        env:
          MD_PARTY_LOC_DIFF: >-
            ${{ matrix.batch == 'targeted-b' &&
            'validation-scope/party-loc-scope.diff' || '' }}

      - name: Collect style-relevant files
        id: style-files
        if: >-
          always() && !cancelled() && matrix.batch == 'core' &&
          steps.setup-python.outcome == 'success'
        env:
          STYLE_FILES_JSON: ${{ needs.detect-changes.outputs.style_files }}
          STYLE_CONFIG: ${{ needs.detect-changes.outputs.style_config }}
        run: |
          printf '%s' "$STYLE_FILES_JSON" | jq -r '.[]' \
            | grep -vE \
              '(^|/)(Changelog|AUTHORS)\.txt$|/descriptions[^/]*\.txt$' \
            > style_files.txt || true
          if [ "$STYLE_CONFIG" = true ]; then
            find common/national_focus -type f -name '*.txt' >> style_files.txt
          fi
          sort -u -o style_files.txt style_files.txt
          if [ -s style_files.txt ]; then
            echo "has-files=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run style check
        if: >-
          always() && !cancelled() && matrix.batch == 'core' &&
          steps.style-files.outputs.has-files == 'true'
        run: |
          MD_STAGED_FILES="$(cat style_files.txt)" \
            python3 tools/validation/validate_style.py \
            --staged --strict --no-color --output validation-style-check.log

      - name: Verify style results
        if: >-
          always() && !cancelled() && matrix.batch == 'core' &&
          steps.style-files.outputs.has-files == 'true'
        run: |
          test -f validation-style-check.log
          test -f validation-style-check.json

      - name: Check localisation UTF-8 BOM
        if: >-
          always() && !cancelled() && matrix.batch == 'core' &&
          steps.setup-python.outcome == 'success'
        run: python3 tools/linting/validate_localization_encoding.py

      - name: Check .mod file encoding
        if: >-
          always() && !cancelled() && matrix.batch == 'core' &&
          steps.setup-python.outcome == 'success'
        run: |
          find . -name '*.mod' -not -path './resources/*' -print0 \
            | xargs -0 -r python3 tools/linting/validate_mod_encoding.py

      - name: Check .txt files have no BOM
        if: >-
          always() && !cancelled() && matrix.batch == 'core' &&
          steps.setup-python.outcome == 'success'
        run: |
          find common descriptions events gfx history localisation map music \
            portraits scenario_tests sound tutorial -name '*.txt' -print0 \
            | xargs -0 -r python3 tools/linting/validate_txt_encoding.py

      - name: Check mod descriptor replace_path sync
        if: >-
          always() && !cancelled() && matrix.batch == 'core' &&
          steps.setup-python.outcome == 'success'
        run: >-
          python3 tools/validation/validate_mod_descriptors.py --strict
          --no-color

      - name: Upload style results
        if: >-
          always() && !cancelled() && matrix.batch == 'core' &&
          steps.style-files.outputs.has-files == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: validation-style-check-results
          path: |
            validation-style-check.log
            validation-style-check.json
          if-no-files-found: error
          retention-days: 7

      - name: Upload batch results
        if: always() && !cancelled() && hashFiles('batch-results/**') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: validation-batch-${{ matrix.batch }}-results
          path: batch-results
          if-no-files-found: error
          retention-days: 7

  docs-quality:
    name: Docs quality
    needs: [detect-changes]
    if: >-
      needs.detect-changes.outputs.docs == 'true' ||
      needs.detect-changes.outputs.full_suite == 'true'
    uses: ./.github/workflows/docs-quality.yml
    permissions:
      contents: read

  report:
    name: Test suite report
    runs-on: ubuntu-latest
    needs:
      - detect-changes
      - validate-paths
      - prepare-workspace
      - tools-tests
      - content-tests
      - tools-quality
      - mod-tests
      - docs-quality
    if: >-
      ${{ always() && !cancelled() &&
      needs.detect-changes.result == 'success' &&
      needs.detect-changes.outputs.trusted-ref != '' }}
    permissions:
      contents: read
    env:
      PR_NUMBER: ${{ needs.detect-changes.outputs.pr-number }}
      HEAD_SHA: >-
        ${{ needs.detect-changes.outputs.head-sha ||
        github.event.pull_request.head.sha || github.sha }}
      VALIDATION_SCOPE: >-
        ${{ needs.detect-changes.outputs.full_suite == 'true' &&
        'full' || 'partial' }}
    steps:
      - name: Checkout report tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository }}
          ref: ${{ needs.detect-changes.outputs.trusted-ref }}
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            tools/generate_validation_report.py
            tools/report_lib
            tools/validation
            tools/shared_utils.py
            validation_config.json
          sparse-checkout-cone-mode: false

      - name: Compute validator code hash
        id: toolshash
        run: >-
          echo "hash=${{ hashFiles('tools/validation/**',
          'tools/shared_utils.py',
          'validation_config.json') }}" >> "$GITHUB_OUTPUT"

      - name: Restore validation baseline
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .validation_baseline
          key: >-
            md-baseline-v1-${{ runner.os }}-${{
            steps.toolshash.outputs.hash }}-${{
            needs.detect-changes.outputs.base-sha || github.sha }}
          restore-keys: |
            md-baseline-v1-${{ runner.os }}-${{ steps.toolshash.outputs.hash }}-

      - name: Set up Python
        id: setup-python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6
        with:
          python-version: "3.x"

      - name: Download all validation results
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        continue-on-error: true
        with:
          pattern: "*results"
          path: validation-results

      - name: Download changed files
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: changed-files
          path: changed-files

      - name: Generate validation report
        env:
          TOOLSHASH: ${{ steps.toolshash.outputs.hash }}
        run: |
          workflow_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          workflow_url="$workflow_url/actions/runs/$GITHUB_RUN_ID"
          args=(
            --results-dir validation-results
            --output report.md
            --pr-number "$PR_NUMBER"
            --commit-sha "$HEAD_SHA"
            --workflow-run-url "$workflow_url"
            --github-repository "${{ github.repository }}"
            --validation-scope "$VALIDATION_SCOPE"
            --print
          )
          args+=(
            --baseline-dir .validation_baseline
            --baseline-toolshash "$TOOLSHASH"
          )
          if [ -f changed-files/changed-files.txt ] &&
              python3 tools/generate_validation_report.py --help \
                | grep -q -- '--changed-files'; then
            args+=(--changed-files changed-files/changed-files.txt)
          fi
          python3 tools/generate_validation_report.py "${args[@]}"

      - name: Upload combined report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: validation-report
          path: report.md
          retention-days: 30

  gate:
    name: Test suite gate
    needs:
      - detect-changes
      - validate-paths
      - prepare-workspace
      - tools-tests
      - content-tests
      - tools-quality
      - mod-tests
      - docs-quality
      - report
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Fail when required validation jobs do not pass
        if: >-
          needs.detect-changes.result != 'success' ||
          (needs.validate-paths.result != 'success' &&
          needs.validate-paths.result != 'skipped') ||
          (needs.prepare-workspace.result != 'success' &&
          needs.prepare-workspace.result != 'skipped') ||
          (needs.tools-tests.result != 'success' &&
          needs.tools-tests.result != 'skipped') ||
          (needs.content-tests.result != 'success' &&
          needs.content-tests.result != 'skipped') ||
          (needs.tools-quality.result != 'success' &&
          needs.tools-quality.result != 'skipped') ||
          (needs.mod-tests.result != 'success' &&
          needs.mod-tests.result != 'skipped') ||
          (needs.docs-quality.result != 'success' &&
          needs.docs-quality.result != 'skipped') ||
          needs.report.result != 'success'
        run: exit 1

      - name: Confirm validation result
        run: echo "Every selected validation job passed."

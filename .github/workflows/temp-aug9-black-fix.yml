name: Temporary August 9 Black Formatting Fix

on:
  push:
    branches:
      - sync/upstream-main-2026-08-09

permissions:
  contents: write

jobs:
  black-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out sync branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: sync/upstream-main-2026-08-09
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.x"

      - name: Format failing files
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install black==26.5.1
          black \
            tools/tests/sov_computing_sovereignty_state_model_test.py \
            tools/validation/tests/validate_corporate_history_contract_test.py \
            tools/validation/validate_corporate_history_contract.py

      - name: Commit formatting and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/temp-aug9-black-fix.yml
          git add \
            tools/tests/sov_computing_sovereignty_state_model_test.py \
            tools/validation/tests/validate_corporate_history_contract_test.py \
            tools/validation/validate_corporate_history_contract.py
          git commit -m "Format OEM validator files with Black"
          git push origin HEAD:sync/upstream-main-2026-08-09

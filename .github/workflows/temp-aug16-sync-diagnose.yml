name: Temporary August 16 Upstream Sync Diagnosis

on:
  push:
    branches:
      - sync/upstream-2026-08-16

permissions:
  contents: write

jobs:
  diagnose:
    if: ${{ !contains(github.event.head_commit.message, '[sync-diagnosis]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out sync staging branch
        uses: actions/checkout@v7
        with:
          ref: sync/upstream-2026-08-16
          fetch-depth: 1000
          filter: blob:none
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Diagnose upstream merge conflicts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/MillenniumDawn/Millennium-Dawn.git || true
          git fetch --filter=blob:none upstream main

          mkdir -p .sync
          report=.sync/aug16-upstream-conflicts.txt
          tmp=$(mktemp)
          echo "OEM_HEAD=$(git rev-parse HEAD)" >> "$tmp"
          echo "UPSTREAM_HEAD=$(git rev-parse upstream/main)" >> "$tmp"
          echo "MERGE_BASE=$(git merge-base HEAD upstream/main)" >> "$tmp"
          echo >> "$tmp"

          set +e
          git merge --no-commit --no-ff upstream/main
          merge_rc=$?
          set -e

          if [ "$merge_rc" -eq 0 ]; then
            echo "STATUS=CLEAN" >> "$tmp"
            if git rev-parse -q --verify MERGE_HEAD >/dev/null; then
              git merge --abort
            fi
          else
            echo "STATUS=CONFLICTS" >> "$tmp"
            echo >> "$tmp"
            echo "CONFLICTED_PATHS:" >> "$tmp"
            git diff --name-only --diff-filter=U | sort >> "$tmp"
            echo >> "$tmp"
            echo "PORCELAIN_STATUS:" >> "$tmp"
            git status --porcelain=v1 >> "$tmp" || true
            git merge --abort
          fi

          mv "$tmp" "$report"
          git add "$report"
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "[sync-diagnosis] Record August 16 upstream conflict set"
          git push origin HEAD:sync/upstream-2026-08-16

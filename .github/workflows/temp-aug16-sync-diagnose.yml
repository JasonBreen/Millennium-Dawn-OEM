name: Temporary August 16 Upstream Sync Diagnosis

on:
  push:
    branches:
      - sync/upstream-2026-08-16

permissions:
  contents: write

jobs:
  diagnose:
    if: ${{ !contains(github.event.head_commit.message, '[sync-diagnosis]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out minimal sync metadata
        uses: actions/checkout@v7
        with:
          ref: sync/upstream-2026-08-16
          fetch-depth: 1000
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/
            /.sync/
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Compare semantic deltas on conflicted files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/MillenniumDawn/Millennium-Dawn.git || true
          git fetch --filter=blob:none upstream main

          mkdir -p .sync
          report=.sync/aug16-semantic-deltas.patch
          base=$(git merge-base HEAD upstream/main)
          tmp=$(mktemp)
          echo "OEM_HEAD=$(git rev-parse HEAD)" >> "$tmp"
          echo "UPSTREAM_HEAD=$(git rev-parse upstream/main)" >> "$tmp"
          echo "MERGE_BASE=$base" >> "$tmp"
          echo >> "$tmp"

          echo "===== OEM VS MERGE BASE (WHITESPACE IGNORED) =====" >> "$tmp"
          git diff -w --find-renames "$base"..HEAD -- \
            "Changelog.txt" \
            "common/decisions/War on Terror.txt" \
            "localisation/english/MD_focus_ISR_l_english.yml" >> "$tmp" || true
          echo >> "$tmp"

          echo "===== UPSTREAM VS MERGE BASE (WHITESPACE IGNORED) =====" >> "$tmp"
          git diff -w --find-renames "$base"..upstream/main -- \
            "Changelog.txt" \
            "common/decisions/War on Terror.txt" \
            "localisation/english/MD_focus_ISR_l_english.yml" >> "$tmp" || true

          mv "$tmp" "$report"
          git add "$report"
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "[sync-diagnosis] Record August 16 semantic deltas"
          git push origin HEAD:sync/upstream-2026-08-16

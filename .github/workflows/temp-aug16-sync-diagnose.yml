name: Temporary August 16 Upstream Sync Diagnosis

on:
  push:
    branches:
      - sync/upstream-2026-08-16

permissions:
  contents: write

jobs:
  diagnose:
    if: ${{ !contains(github.event.head_commit.message, '[sync-diagnosis]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out only conflicted paths
        uses: actions/checkout@v7
        with:
          ref: sync/upstream-2026-08-16
          fetch-depth: 1000
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/
            /.sync/
            /Changelog.txt
            /common/decisions/War on Terror.txt
            /localisation/english/MD_focus_ISR_l_english.yml
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Capture exact upstream conflict hunks
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/MillenniumDawn/Millennium-Dawn.git || true
          git fetch --filter=blob:none upstream main

          mkdir -p .sync
          report=.sync/aug16-conflict-details.patch
          tmp=$(mktemp)
          echo "OEM_HEAD=$(git rev-parse HEAD)" >> "$tmp"
          echo "UPSTREAM_HEAD=$(git rev-parse upstream/main)" >> "$tmp"
          echo "MERGE_BASE=$(git merge-base HEAD upstream/main)" >> "$tmp"
          echo >> "$tmp"

          set +e
          git merge --no-commit --no-ff upstream/main
          merge_rc=$?
          set -e

          echo "MERGE_RC=$merge_rc" >> "$tmp"
          echo >> "$tmp"
          echo "UNMERGED_PATHS:" >> "$tmp"
          git diff --name-only --diff-filter=U | sort >> "$tmp" || true
          echo >> "$tmp"
          echo "COMBINED_DIFF:" >> "$tmp"
          git diff --cc -- \
            "Changelog.txt" \
            "common/decisions/War on Terror.txt" \
            "localisation/english/MD_focus_ISR_l_english.yml" >> "$tmp" || true

          if git rev-parse -q --verify MERGE_HEAD >/dev/null; then
            git merge --abort
          fi

          mv "$tmp" "$report"
          git add "$report"
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "[sync-diagnosis] Record August 16 conflict hunks"
          git push origin HEAD:sync/upstream-2026-08-16

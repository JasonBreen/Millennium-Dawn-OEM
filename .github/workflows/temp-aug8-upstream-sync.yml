name: Temporary August 9 Upstream Sync Runner

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: read
  issues: read

jobs:
  diagnose:
    if: >-
      (github.event_name == 'pull_request_target' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.head.ref == 'sync/upstream-source-2026-08-09' &&
       github.event.pull_request.base.ref == 'sync/upstream-main-2026-08-09') ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.number == 171 &&
       github.event.issue.pull_request &&
       contains(github.event.comment.body, '/aug9-sync-diagnose'))
    runs-on: ubuntu-latest
    steps:
      - name: Check out trusted fork sync branch
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository }}
          ref: sync/upstream-main-2026-08-09
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Diagnose current upstream merge
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/MillenniumDawn/Millennium-Dawn.git || true
          git fetch upstream main

          mkdir -p .sync
          report=.sync/aug9-upstream-conflicts.txt
          tmp=$(mktemp)
          echo "OEM_HEAD=$(git rev-parse HEAD)" >> "$tmp"
          echo "UPSTREAM_HEAD=$(git rev-parse upstream/main)" >> "$tmp"
          echo "MERGE_BASE=$(git merge-base HEAD upstream/main)" >> "$tmp"
          echo >> "$tmp"

          set +e
          git merge --no-commit --no-ff upstream/main
          merge_rc=$?
          set -e

          if [ "$merge_rc" -eq 0 ]; then
            echo "STATUS=CLEAN" >> "$tmp"
            git merge --abort
          else
            echo "STATUS=CONFLICTS" >> "$tmp"
            echo >> "$tmp"
            echo "CONFLICTED_PATHS:" >> "$tmp"
            git diff --name-only --diff-filter=U | sort >> "$tmp"
            echo >> "$tmp"
            echo "PORCELAIN_STATUS:" >> "$tmp"
            git status --porcelain=v1 >> "$tmp" || true
            git merge --abort
          fi

          mv "$tmp" "$report"
          git add "$report"
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "[sync-diagnosis] Record August 9 upstream conflict set"
          git push origin HEAD:sync/upstream-main-2026-08-09

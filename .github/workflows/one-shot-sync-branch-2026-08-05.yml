name: One-shot August 5 synchronization branch

on:
  push:
    branches:
      - sync/upstream-main-2026-08-05

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout isolated synchronization branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          ref: sync/upstream-main-2026-08-05

      - name: Merge pinned upstream main with real ancestry
        shell: bash
        run: |
          set -euo pipefail

          sync_branch="sync/upstream-main-2026-08-05"
          target_upstream_sha="effafebe65ed9543e39d86f696352f36990c257a"
          report_path="runtime_evidence/upstream-sync-2026-08-05/conflicts-v2.md"
          workflow_path=".github/workflows/one-shot-sync-branch-2026-08-05.yml"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          fork_start="$(git rev-parse HEAD)"
          cp .mcp.json "$RUNNER_TEMP/mcp.json"

          git fetch --no-tags origin main
          git show origin/main:.github/scripts/resolve_upstream_sync.py > "$RUNNER_TEMP/resolve_upstream_sync.py"
          python -m py_compile "$RUNNER_TEMP/resolve_upstream_sync.py"

          git remote add upstream https://github.com/MillenniumDawn/Millennium-Dawn.git 2>/dev/null || \
            git remote set-url upstream https://github.com/MillenniumDawn/Millennium-Dawn.git
          git fetch --no-tags upstream main
          git cat-file -e "${target_upstream_sha}^{commit}"
          git merge-base --is-ancestor "$target_upstream_sha" upstream/main

          if git merge-base --is-ancestor "$target_upstream_sha" HEAD; then
            echo "Pinned upstream commit is already an ancestor of the synchronization branch."
            exit 0
          fi

          merge_base="$(git merge-base HEAD "$target_upstream_sha")"

          set +e
          git merge --no-ff --no-commit "$target_upstream_sha"
          merge_status=$?
          set -e

          conflicts="$(git diff --name-only --diff-filter=U | sort)"
          if [ -n "$conflicts" ]; then
            set +e
            python "$RUNNER_TEMP/resolve_upstream_sync.py" 2>&1 | tee "$RUNNER_TEMP/resolver.log"
            resolver_status=${PIPESTATUS[0]}
            set -e

            if [ "$resolver_status" -ne 0 ]; then
              report="$RUNNER_TEMP/upstream-sync-conflicts.md"
              printf '# Upstream synchronization conflict report\n\n' > "$report"
              printf -- '- Fork start: `%s`\n' "$fork_start" >> "$report"
              printf -- '- Pinned upstream: `%s`\n' "$target_upstream_sha" >> "$report"
              printf -- '- Merge base: `%s`\n' "$merge_base" >> "$report"
              printf -- '- Merge exit status: `%s`\n' "$merge_status" >> "$report"
              printf -- '- Resolver exit status: `%s`\n\n' "$resolver_status" >> "$report"
              printf '## Conflicted paths\n\n' >> "$report"
              printf '%s\n' "$conflicts" | sed 's/^/- `/' | sed 's/$/`/' >> "$report"
              printf '\n## Resolver output\n\n```text\n' >> "$report"
              cat "$RUNNER_TEMP/resolver.log" >> "$report"
              printf '\n```\n\n## Index stages\n\n```text\n' >> "$report"
              git ls-files -u >> "$report"
              printf '```\n' >> "$report"

              git merge --abort
              mkdir -p "$(dirname "$report_path")"
              cp "$report" "$report_path"
              git add "$report_path"
              if ! git diff --cached --quiet; then
                git commit -m "Record isolated August 5 synchronization conflicts"
                git push origin "HEAD:$sync_branch"
              fi
              exit 1
            fi
          elif [ "$merge_status" -ne 0 ]; then
            echo "Merge failed without a conflict list." >&2
            exit "$merge_status"
          fi

          test -z "$(git diff --name-only --diff-filter=U)"

          cp "$RUNNER_TEMP/mcp.json" .mcp.json
          git add .mcp.json

          rm -f "$report_path"
          rmdir runtime_evidence/upstream-sync-2026-08-05 2>/dev/null || true
          git rm "$workflow_path"
          git add -A

          git diff --check --cached
          if git grep -n -E '^(<<<<<<<|=======|>>>>>>>)' -- \
            common/scripted_effects/00_yearly_effects.txt \
            localisation/english/MD_focus_JAP_l_english.yml; then
            echo "Conflict marker remains in a resolved file." >&2
            exit 1
          fi

          git commit -m "Merge upstream Millennium Dawn main into isolated sync branch" \
            -m "Upstream: $target_upstream_sha" \
            -m "Preserve OEM corporate-history scheduling and English Sony/Nintendo localisation; accept exact upstream non-English translations and native Japan rewrites."

          git merge-base --is-ancestor "$fork_start" HEAD
          git merge-base --is-ancestor "$target_upstream_sha" HEAD
          test "$(git show --no-patch --format='%P' HEAD | wc -w)" -eq 2
          git push origin "HEAD:$sync_branch"

name: One-shot real upstream ancestry sync

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: real-upstream-ancestry-sync
  cancel-in-progress: true

jobs:
  sync:
    if: >-
      github.actor != 'github-actions[bot]' &&
      github.event.pull_request.head.ref == 'automation/real-upstream-ancestry-sync'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SYNC_BRANCH: automation/real-upstream-ancestry-sync
      WORKFLOW_PATH: .github/workflows/one-shot-real-upstream-sync.yml
    steps:
      - name: Checkout synchronization branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ env.SYNC_BRANCH }}
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: |
            .github/workflows/one-shot-real-upstream-sync.yml
            .mcp.json
            common/scripted_effects/00_yearly_effects.txt
            common/national_focus/05_china.txt
          sparse-checkout-cone-mode: false

      - name: Merge current upstream main with real ancestry
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git remote get-url upstream >/dev/null 2>&1 || \
            git remote add upstream https://github.com/MillenniumDawn/Millennium-Dawn.git
          git fetch --filter=blob:none --no-tags upstream main
          upstream_sha="$(git rev-parse upstream/main)"

          if git merge-base --is-ancestor "$upstream_sha" HEAD; then
            if [ -f "$WORKFLOW_PATH" ]; then
              git rm "$WORKFLOW_PATH"
              git commit -m "ci: remove completed upstream-sync workflow"
              git push origin "HEAD:refs/heads/$SYNC_BRANCH"
            fi
            exit 0
          fi

          cp .mcp.json "$RUNNER_TEMP/mcp.json"
          cp common/scripted_effects/00_yearly_effects.txt "$RUNNER_TEMP/00_yearly_effects.txt"

          set +e
          git merge --no-ff --no-commit upstream/main
          merge_status=$?
          set -e

          conflicts="$(git diff --name-only --diff-filter=U)"
          if [ -n "$conflicts" ]; then
            unexpected="$(printf '%s\n' "$conflicts" | grep -vFx 'common/scripted_effects/00_yearly_effects.txt' || true)"
            if [ -n "$unexpected" ]; then
              echo "Unexpected merge conflicts:" >&2
              printf '%s\n' "$unexpected" >&2
              exit 1
            fi
            git checkout --ours -- common/scripted_effects/00_yearly_effects.txt
            git add common/scripted_effects/00_yearly_effects.txt
          elif [ "$merge_status" -ne 0 ]; then
            echo "Merge failed without a resolvable conflict list." >&2
            exit "$merge_status"
          fi

          # Preserve fork-owned dispatcher composition and portable MCP setup.
          cp "$RUNNER_TEMP/00_yearly_effects.txt" common/scripted_effects/00_yearly_effects.txt
          cp "$RUNNER_TEMP/mcp.json" .mcp.json
          git add common/scripted_effects/00_yearly_effects.txt .mcp.json

          git rm "$WORKFLOW_PATH"
          git add -A

          git commit -m "Merge upstream Millennium Dawn main with real ancestry" \
            -m "Upstream: $upstream_sha" \
            -m "Preserve the OEM corporate/GPU yearly dispatcher and portable md-mcp configuration."

          git merge-base --is-ancestor "$upstream_sha" HEAD
          git push origin "HEAD:refs/heads/$SYNC_BRANCH"

name: Tools Validation

on:
  pull_request:
    paths:
      - "tools/**"
      - ".claude/docs/typo-watchlist.md"
      - ".pre-commit-config.yaml"
      - "pyproject.toml"
      - ".github/workflows/coding-pipeline.yml"
      - ".github/workflows/nightly-pr-validation.yml"
      - ".github/workflows/tools-validation.yml"
      - ".github/workflows/validator-cache.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-tools:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          sparse-checkout: |
            tools
            pyproject.toml
            common
            events
            history
            localisation
            interface
            gfx/flags
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.x"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --group runtime
      - name: Run tools validation
        run: |
          python tools/validate_tools.py --strict --no-color --output \
            tools_validation.log
      - name: Upload validation report
        # v7.0.1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: tools-validation-report
          path: tools_validation.log
          retention-days: 7

  report-lib-tests:
    name: report_lib + validator unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          # config_drift_test reads the pre-commit config and these workflows to
          # compare the validator set declared in each, and to check the
          # pipeline wiring around them. pyproject.toml supplies the pytest
          # testpaths so all six test dirs are collected. typo-watchlist.md is
          # read by loc_typo_watchlist_test's doc-sync guard.
          sparse-checkout: |
            tools
            pyproject.toml
            .pre-commit-config.yaml
            .claude/docs/typo-watchlist.md
            .github/workflows/coding-pipeline.yml
            .github/workflows/nightly-pr-validation.yml
            .github/workflows/tools-validation.yml
            .github/workflows/validator-cache.yml
            common
            events
            history
            localisation
            interface
            gfx/flags
          sparse-checkout-cone-mode: false
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.x"
      - name: Install test deps
        run: |
          python -m pip install --upgrade pip
          pip install --group dev
      - name: Run pytest with coverage
        # testpaths in pyproject.toml covers all six test dirs (tools/tests,
        # report_lib/tests, validation/tests, linting/tests,
        # standardization/tests, docs_checks/tests).
        run: |
          python -m coverage run --branch -m pytest -v
          python -m coverage report

  staged-validator-integration:
    name: staged validator integration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.x"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --group runtime
          pip install --group dev
      - name: Create isolated test worktree
        run: |
          git worktree add --detach \
            "${{ runner.temp }}/md-staged-validator-test" HEAD
      - name: Run staged-validator integration
        working-directory: ${{ runner.temp }}/md-staged-validator-test
        env:
          MD_RUN_STAGED_INTEGRATION: "1"
        run: |
          python -m pytest \
            tools/tests/staged_validators_test.py \
            tools/tests/staged_validators_real_test.py -q

  ruff-lint:
    name: ruff lint (tools)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          sparse-checkout: |
            tools
            pyproject.toml
          sparse-checkout-cone-mode: false
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.x"
      - name: Install ruff
        run: |
          python -m pip install --upgrade pip
          pip install --group dev
      - name: Run ruff
        run: ruff check tools --output-format=github
      - name: Check formatting (black)
        run: black --check tools
      - name: Run pylint
        run: pylint tools --output-format=github --reports=no --score=no
      - name: Run mypy
        run: mypy

  black-autofix:
    name: one-shot Black autofix
    if: github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 1
          sparse-checkout: |
            tools
          sparse-checkout-cone-mode: false
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.x"
      - name: Format and commit Python files
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install black==26.5.1
          black \
            tools/tests/sov_computing_sovereignty_state_model_test.py \
            tools/validation/tests/validate_corporate_history_contract_test.py \
            tools/validation/validate_corporate_history_contract.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            tools/tests/sov_computing_sovereignty_state_model_test.py \
            tools/validation/tests/validate_corporate_history_contract_test.py \
            tools/validation/validate_corporate_history_contract.py
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Format OEM validator files with Black"
          git push origin HEAD:${{ github.head_ref }}
